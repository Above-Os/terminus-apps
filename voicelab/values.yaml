image: docker.io/beclab/voice:0.4.27
imagePullPolicy: IfNotPresent

postgres:
  host: postgres
  port: 5432
  username: voicelab
  password: ""
  databases:
    voicelab: voicelab

userspace:
  appData: /tmp/voicelab

workloads:
  voicelab:
    replicaCount: 1

# Release charts stay false. A local upload package may set hotReload true;
# market upgrade keeps the values from the first install.
dev:
  hotReload: false
  sourceSubPath: devsrc
