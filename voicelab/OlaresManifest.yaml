apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: voicelab
  appid: voicelab
  title: Voice Lab
  description: Create voices and generate speech through Olares Router
  icon: https://cdn.olares.com/images/2026/09/82a709dec6a0298f470af4c9e33de228.png
  version: 0.4.32
  categories:
    - Utilities_v112
    - AI
    - models
spec:
  versionName: "0.4.32"
  upgradeDescription: |
    Starting a fresh speech is labeled New.
  runAsUser: true
  fullDescription: |
    ## Overview
    Voice Lab is a separate install of Voice. It turns text into speech
    through Olares Router. Write a document, generate each passage, then
    clone or design voices on a TTS model from the Voices page.

    Every inference request goes through Olares Router. Voice Lab does not
    download models or manage engines. Voices live on the selected TTS
    model (ElevenLabs-shaped voice_id).

    ## Requirements
    - Olares >= 1.12.6
    - Router installed and running
    - At least one TTS model configured in Router (local model application
      or a cloud vendor such as ElevenLabs)
    - Arch: amd64, arm64
  developer: beclab
  submitter: beclab
  locale:
    - en-US
  requiredCpu: 250m
  limitedCpu: "2"
  requiredMemory: 256Mi
  limitedMemory: 2Gi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
entrances:
  - name: voicelab
    host: voicelab-svc
    port: 8430
    title: Voice Lab
    icon: https://cdn.olares.com/images/2026/09/82a709dec6a0298f470af4c9e33de228.png
    authLevel: private
    openMethod: window
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
    - name: postgres
      version: '>=14.0.0-0'
      type: middleware
      mandatory: true
middleware:
  postgres:
    username: voicelab
    databases:
      - name: voicelab
        distributed: false
workloadReplicas:
  voicelab: 1
