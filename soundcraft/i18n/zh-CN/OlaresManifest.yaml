metadata:
  title: SoundCraft
  description: 在浏览器中运行的 Pro Tools 风格数字音频工作站
spec:
  fullDescription: |
    ## 概述
    SoundCraft 是一款用 Rust 编写的开源数字音频工作站，目标是对标 Pro Tools。
    本应用提供它的 WebAssembly 版本：编辑和混音都在你的浏览器里完成，
    播放通过 WebAudio 进行。web 版不支持录音。

    打开文件使用浏览器的文件选择框，保存、导出和并轨（Bounce）会下载文件。
    关闭或刷新页面前请先保存。浏览器要求先有一次点击才允许播放声音。

    ## Agent 接入（MCP）
    本应用还以 Streamable HTTP 方式运行 SoundCraft 的无界面引擎，作为 MCP 服务。
    Agent 可以新建工程、导入音频、编辑、混音和并轨。
    它的入口不显示在桌面上，可以在设置里找到，只能从局域网或 LarePass VPN 访问。
    Agent 只能读写 Home/SoundCraft 目录。想在浏览器里继续编辑 agent 生成的结果，
    请用浏览器的文件选择框从 Files 打开。

    ## 要求
    - 支持 WebGPU 或 WebGL2 的浏览器
    - 架构：amd64、arm64
