permission:
  userData:
    - Home/SoundCraft/
spec:
  versionName: "0.7.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    SoundCraft is an open-source, Pro Tools-comparable digital audio
    workstation written in Rust. This app serves its WebAssembly build:
    editing and mixing run entirely in your browser, and playback goes
    through WebAudio. The web build has no recording.

    Open uses the browser file picker; Save, Export and Bounce download
    files. Save your work before closing or reloading the page. Click
    once in the page before playback so the browser allows audio.

    ## Agent access (MCP)
    The app also runs SoundCraft's headless engine as an MCP server over
    Streamable HTTP. Agents can create sessions, import audio, edit, mix and
    bounce. Its entrance is hidden from the desktop and listed in Settings;
    it is reachable from your LAN or the LarePass VPN. Agents can read and
    write files only in Home/SoundCraft. To keep editing an agent's result
    in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/soundcraft
  sourceCode: https://github.com/beclab/soundcraft
  license:
