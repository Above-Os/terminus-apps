apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: soundcraft
  appid: soundcraft
  title: SoundCraft
  description: Pro Tools-style audio workstation that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/soundcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.soundcraft.png
  version: 0.1.0
