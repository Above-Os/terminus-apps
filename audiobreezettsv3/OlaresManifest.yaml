olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiobreezettsv3
  icon: https://app.cdn.olares.com/appstore/audioengines/soulx/icon.png
  description: "Breeze TTS 2: one model for built-in voices, cloning and design."
  appid: audiobreezettsv3
  title: Breeze TTS 2
  version: '1.0.4'
  categories:
    - AI
    - models
  tags:
  - text-to-speech
  - audio

# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audiobreezettsv3api
    host: sharedentrances-api
    port: 0
    title: Breeze TTS 2 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/audioengines/soulx/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audiobreezettsv3
    port: 8090
    host: download-svc
    title: Breeze TTS 2
    icon: https://app.cdn.olares.com/appstore/audioengines/soulx/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiobreezettsv3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'BreezeBlue/Breeze-TTS-2'
  fullDescription: |
    **Model Overview**
    Breeze TTS 2 is one 3B checkpoint that lists voices, clones from a reference plus its
    exact transcript, designs a voice from a description, and speaks. Chinese and English.
    CUDA only (amd64 + arm64).

    **Configuration**
    - Model: `BreezeBlue/Breeze-TTS-2`
    - Source: `hf://BreezeBlue/Breeze-TTS-2`
    - Capabilities: `tts`, `tts_clone`, `tts_design`
    - Required GPU memory: `12Gi`
    - Engine: official PyTorch in-process (`breeze_infer`)
    - License: code Apache-2.0; weights non-commercial

    **Voice ids live on this instance**
    ElevenLabs shape: `GET /v1/voices`, `POST /v1/voices/add`, `POST /v1/text-to-voice/design`
    then `POST /v1/text-to-voice`, `POST /v1/text-to-speech/{voice_id}`. Twenty-five built-in
    Chinese and English voices are listed on boot; each is frozen under appData the first
    time it is spoken. Clone needs the exact transcript of the reference.

    **How It Works**
    First, Model Console (llm-init) downloads the model and gets it ready, then the
    audio engine starts serving when the download sentinel appears. llm-init reverse-proxies
    `/v1/*` to the engine and serves its control plane / dashboard on `/`.

    **Endpoints**
    - `GET /v1/voices` — premade + cloned + designed voices on this instance
    - `POST /v1/voices/add` — multipart `name` + `files[]` + transcript
    - `POST /v1/text-to-voice/design` then `POST /v1/text-to-voice` — preview, then persist
    - `POST /v1/text-to-speech/{voice_id}` — ElevenLabs JSON (`text`); `/stream` streams the audio

    **Stack**
    - **audio engine**: Breeze TTS 2 in-process (port 8000); self-reports `/v1/models` + `/metrics`
    - **Model Console (llm-init)**: Downloads the model, shows progress, OpenAI API on 8090

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`.
    Frozen voices are stored at `appData/voices`.

  upgradeDescription: |
    v1.0.4: Engine v1.1.6 — language-aware pause between slices; last slice kept intact. llm-init v1.7.1.
    v1.0.3: Engine v1.1.5 — 25 built-in zh/en voices, clone/design gates, no OpenAI aliases.
    v1.0.2: Advertise `tts_design` on the model card (`MODEL_SUPPORTS`) and pin the engine to v1.1.4.
    v1.0.1: Declare MODEL_MODE=tts and require llm-init v1.7.0.
    v1.0.0: Initial release.

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/audio-engines
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: Apache-2.0
      url: https://github.com/breezeblue-ai/breeze-tts/blob/main/LICENSE
    - text: BreezeBlue Research / Non-Commercial (model weights)
      url: https://huggingface.co/BreezeBlue/Breeze-TTS-2/blob/main/LICENSE

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim). On nvidia-gb10 the
    # engine's memory request AND limit become the GPU quota (unified memory).
    - mode: nvidia
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "20Gi"
      requiredMemory: "4352Mi"
      requiredGPUMemory: "12Gi"
      limitedGPUMemory: "12Gi"
    - mode: nvidia-gb10
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "16Gi"
      requiredMemory: "12544Mi"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://BreezeBlue/Breeze-TTS-2"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "BreezeBlue/Breeze-TTS-2"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "tts"
    options:
    - title: TTS
      value: tts
    description: "Speech synthesis is its own mode: it answers the ElevenLabs-shaped voice routes recognition engines do not have, and Router routes by mode. Requires an Olares whose Router and Model Console know `tts`."
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "tts,tts_clone,tts_design"
    multiSelect: true
    splitter: ","
    options:
    - title: TTS (voices + speech)
      value: tts
    - title: TTS clone (save a reference as a voice_id)
      value: tts_clone
    - title: TTS design (build a voice from a written description)
      value: tts_design
    description: "One 3B checkpoint covers all three. `tts` mounts list/speak; `tts_design` is advertised on the model card for `/v1/text-to-voice/*`; `tts_clone` mounts POST /v1/voices/add."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "12Gi"
    description: "GPU memory required for this model. CUDA only; `0` is not supported."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "6"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "16Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "--cfg-scale 1 --design-cfg 4 --ref-min-seconds 3 --ref-max-seconds 30 --ref-max-mb 5 --design-min-chars 3 --design-max-chars 500 --max-new-tokens 1500 --max-seq-len 2048"
    description: "Engine-native flags (llm-init ENGINE_ARGS). Filling this replaces the whole
      string. --cfg-scale clone CFG (official 1). --design-cfg design/direction CFG (official 4).
      --ref-min-seconds / --ref-max-seconds / --ref-max-mb reject at /v1/voices/add (0 = off).
      --design-min-chars / --design-max-chars reject at design (0 = off). --max-new-tokens and
      --max-seq-len are official infer.py windows. Also: --seed, --voice-dir, --preview-text,
      --attn-implementation, --fast-all."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
