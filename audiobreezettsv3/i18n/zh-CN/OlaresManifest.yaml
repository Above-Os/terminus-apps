metadata:
  description: "Breeze TTS 2：一个模型同时覆盖内置音色、克隆和设计。"
  title: Breeze TTS 2

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Breeze TTS 2 一份 3B 权重就能列出音色、用参考音加精确转写克隆、用文字设计、再朗读。中英。仅 CUDA（amd64 + arm64）。

    **配置**
    - 模型：`BreezeBlue/Breeze-TTS-2`
    - 来源：`hf://BreezeBlue/Breeze-TTS-2`
    - 能力：`tts`、`tts_clone`
    - GPU 显存：`12Gi`
    - 引擎：官方 PyTorch 进程内（`breeze_infer`）
    - 许可：代码 Apache-2.0；权重不可商用

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。冻结音色在 `appData/voices`。
