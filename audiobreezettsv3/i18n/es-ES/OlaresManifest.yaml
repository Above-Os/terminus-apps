metadata:
  title: Breeze TTS 2
  description: Un modelo de síntesis de voz con voces integradas, clonadas y basadas en una descripción

spec:
  upgradeDescription: |
    v1.0.22: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    Breeze TTS 2 convierte texto chino o inglés en voz. Se puede usar una voz integrada, copiar una voz a partir de una grabación de referencia o crear una voz nueva describiendo cómo debe sonar.

    **Funciones principales**

    - Generar voz en chino e inglés.
    - Elegir entre las voces integradas disponibles en esta aplicación.
    - Clonar una voz a partir de un audio de referencia nítido y su transcripción.
    - Crear una voz a partir de una descripción en lenguaje natural, sin audio de referencia.
    - Guardar y reutilizar voces clonadas o creadas en la misma instalación de Olares.

    Se requiere una GPU NVIDIA compatible con al menos `12Gi` de memoria GPU.

    **Notas de uso**

    Los pesos del modelo Breeze TTS 2, los modelos derivados y las salidas de un alojamiento propio están licenciados solo para investigación y uso no comercial. Para las grabaciones de referencia, las voces clonadas y el audio generado deben existir los derechos y el consentimiento necesarios.

    Consulte la [ficha del modelo Breeze TTS 2](https://huggingface.co/BreezeBlue/Breeze-TTS-2) para los detalles de licencia y los requisitos de uso responsable.
