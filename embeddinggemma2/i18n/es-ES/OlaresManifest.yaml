metadata:
  title: EmbeddingGemma 2
  description: "Embeddings multimodales para texto, imágenes, audio y vídeo"
spec:
  upgradeDescription: |
    v1.0.2: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    EmbeddingGemma 2 convierte texto, imágenes, audio, vídeo y combinaciones ordenadas en vectores normalizados para búsqueda semántica, recuperación, agrupación y correspondencia multimodal.
