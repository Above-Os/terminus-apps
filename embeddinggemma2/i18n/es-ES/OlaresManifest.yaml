metadata:
  title: EmbeddingGemma 2
  description: "Embeddings multimodales para texto, imágenes, audio y vídeo"
spec:
  fullDescription: |
    EmbeddingGemma 2 convierte texto, imágenes, audio, vídeo y combinaciones ordenadas en vectores normalizados para búsqueda semántica, recuperación, agrupación y correspondencia multimodal.
