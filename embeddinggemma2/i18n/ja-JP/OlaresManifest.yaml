metadata:
  title: EmbeddingGemma 2
  description: "テキスト、画像、音声、動画のためのマルチモーダル埋め込みモデル"
spec:
  upgradeDescription: |
    v1.0.2: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    EmbeddingGemma 2 は、テキスト、画像、音声、動画、およびそれらの順序付き組み合わせを正規化ベクトルに変換し、意味検索、検索拡張、クラスタリング、クロスモーダル照合に利用できます。
