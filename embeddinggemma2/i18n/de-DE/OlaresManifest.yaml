metadata:
  title: EmbeddingGemma 2
  description: "Multimodale Einbettungen für Text, Bilder, Audio und Video"
spec:
  upgradeDescription: |
    v1.0.2: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    EmbeddingGemma 2 wandelt Text, Bilder, Audio, Video und geordnete Kombinationen daraus in normalisierte Vektoren für semantische Suche, Retrieval, Clustering und modalitätsübergreifende Zuordnung um.
