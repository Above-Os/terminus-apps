metadata:
  title: EmbeddingGemma 2
  description: "Plongements multimodaux pour le texte, les images, l'audio et la vidéo"
spec:
  upgradeDescription: |
    v1.0.2: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    EmbeddingGemma 2 convertit le texte, les images, l'audio, la vidéo et leurs combinaisons ordonnées en vecteurs normalisés pour la recherche sémantique, la récupération, le regroupement et la correspondance multimodale.
