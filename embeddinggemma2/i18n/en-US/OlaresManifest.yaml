metadata:
  title: EmbeddingGemma 2
  description: "Multimodal embeddings for text, images, audio, and video"
spec:
  upgradeDescription: |
    v1.0.2: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.
  fullDescription: |
    EmbeddingGemma 2 converts text, images, audio, video, and ordered text-media combinations into normalized vectors for semantic search, retrieval, clustering, and cross-modal matching.
