metadata:
  title: EmbeddingGemma 2
  description: "Embedding multimodali per testo, immagini, audio e video"
spec:
  upgradeDescription: |
    v1.0.2: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    EmbeddingGemma 2 converte testo, immagini, audio, video e combinazioni ordinate in vettori normalizzati per ricerca semantica, recupero, raggruppamento e corrispondenza multimodale.
