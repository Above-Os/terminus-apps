apiVersion: apps/v1
kind: Deployment
metadata:
  name: triliumnext
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: triliumnext
spec:
  replicas: {{ .Values.workloads.triliumnext.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: triliumnext
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: triliumnext
    spec:
      containers:
        - name: triliumnext
          image: "docker.io/triliumnext/trilium:v0.106.1"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              node /olares-mcp/bootstrap.cjs
              export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--require=/olares-mcp/internal.cjs"
              exec sh ./start-docker.sh
          env:
            - name: TRILIUM_DATA_DIR
              value: "/home/node/trilium-data"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 18081
              protocol: TCP
          volumeMounts:
            - name: mcp-runtime
              mountPath: /olares-mcp
              readOnly: true
            - name: triliumnext-data
              mountPath: /home/node/trilium-data
      restartPolicy: Always
      volumes:
        - name: mcp-runtime
          configMap:
            name: triliumnext-mcp-runtime
        - name: triliumnext-data
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}/triliumnext'
---
apiVersion: v1
kind: Service
metadata:
  name: triliumnext-service
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: triliumnext
spec:
  ports:
    - name: mcp
      port: 18081
      targetPort: 18081
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    io.kompose.service: triliumnext
