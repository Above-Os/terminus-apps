metadata:
  title: TriliumNext
  description: TriliumNext 是一个强大的个人知识库管理工具，支持层级笔记、富文本编辑、关系图谱及高度可定制的脚本。
spec:
  fullDescription: |
    TriliumNext 是一个个人知识库程序，能够帮助您构建高度结构化的层级笔记，兼具丰富的编辑、关联和自动化扩展能力。

    **主要功能**
    - **层级笔记**：支持无限深度的层级笔记树与克隆分支，便于整理复杂的知识体系。
    - **Markdown 与富文本**：内置 WYSIWYG 富文本编辑器，支持 Markdown 快捷输入、分栏与标签页布局、增强表格、Mermaid 图表与数学公式。
    - **笔记关系图谱**：自动分析笔记之间的链接与属性关系，生成可视化关联图谱。
    - **脚本扩展**：支持使用前端和后端 JavaScript 脚本扩展笔记能力。
    - **版本控制与加密**：内置笔记版本历史管理，并支持对敏感笔记进行高强度加密。

    **MCP 集成**
    在 TriliumNext **Options > AI/LLM** 中启用内置 MCP 服务后，前往 Olares **设置 > 应用 > TriliumNext > 入口** 复制 **TriliumNext MCP** 地址并在末尾补充 `/mcp`。默认（`ALLOW_INTERNAL_TOKENLESS_MCP=true`）允许 Olares 内部网络（含通过内部入口访问的局域网/VPN）以空请求头（`{}`）免 ETAPI Token 连接；若处于共享局域网环境，可在应用环境变量中将 `ALLOW_INTERNAL_TOKENLESS_MCP` 设为 `false`，强制内部入口同样校验 ETAPI Token。
  upgradeDescription: |
    - 升级 TriliumNext 至 0.107.0（包含 Node.js 24.22.2、CVE-2026-111497 修复与 ETAPI 安全加固）。
    - **不可逆数据库迁移（版本 240 升至 242）**：升级前请先备份数据卷，迁移完成后旧版本将无法打开该数据库。
    - **0.107.0 主要更新**：支持在笔记内嵌入/引用其他笔记并原位编辑，支持分栏与标签页布局；表格新增合并单元格、排序与批量增删行列；多级 `#sorted` 标签名现需带 `#`（如 `#sorted="#priority desc, #dueDate"`）；启用 TOTP 时与新设备同步需验证 TOTP。
    - **受保护的内部 MCP 入口**：新增内部 `TriliumNext MCP` 入口（端口 18081）供 Lares 等 AI 助手连接。在 Options > AI/LLM 启用内置 MCP 后默认可免 Token 连接 `/mcp`；亦可将环境变量 `ALLOW_INTERNAL_TOKENLESS_MCP` 设为 `false` 以在局域网/VPN 内部访问时同样强制要求 ETAPI Token。主网页入口（端口 8080）完整保留原有身份验证。

    发行说明：https://github.com/TriliumNext/Trilium/releases/tag/v0.107.0
