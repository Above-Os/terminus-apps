metadata:
  title: TriliumNext
  description: TriliumNext 是一个强大的个人知识库管理工具，支持层级笔记、富文本编辑、关系图谱及高度可定制的脚本。
spec:
  fullDescription: |
    TriliumNext 是一个个人知识库程序。它能够帮助您构建高度结构化的层级笔记，拥有强大的编辑、关联和扩展能力。

    **主要功能：**
    - **层级笔记**：支持无限深度的层级笔记分类，便于整理复杂的知识体系。
    - **Markdown与富文本**：内置功能丰富的 WYSIWYG 富文本编辑器，支持 Markdown 快捷输入、Mermaid 图表、数学公式等。
    - **笔记关系图谱**：自动分析笔记之间的链接，生成可视化的关联图谱。
    - **强大的脚本支持**：支持使用 JavaScript (前端和后端) 扩展笔记功能，实现自动化任务。
    - **版本控制与安全**：内置笔记版本历史管理，并支持对敏感笔记进行高强度加密。
  upgradeDescription: |
    为 TriliumNext 0.106.1 新增供 Lares 等 AI 助手使用的内部 MCP 入口。在 Options > AI/LLM 启用内置 MCP 后，通过内部入口连接，Headers 留空即可。主网页入口仍保留身份验证。内部入口会安全拒绝格式异常的请求，启动时会校验原生 MCP 启用开关。保留现有笔记、账户和数据存储。

    发行说明：https://github.com/TriliumNext/Trilium/releases/tag/v0.106.1
