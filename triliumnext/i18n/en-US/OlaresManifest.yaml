metadata:
  title: TriliumNext
  description: TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
spec:
  fullDescription: |
    TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.

  upgradeDescription: |
    Add an internal MCP entrance for AI assistants such as Lares to TriliumNext 0.106.1. Enable the built-in MCP server in Options > AI/LLM, then connect through the internal entrance with empty headers. The main web entrance retains authentication. Malformed internal requests are rejected safely, and startup checks preserve the native MCP enable switch. Existing notes, accounts and data storage are retained.

    Release notes: https://github.com/TriliumNext/Trilium/releases/tag/v0.106.1
