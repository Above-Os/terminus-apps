metadata:
  title: TriliumNext
  description: TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
spec:
  fullDescription: |
    TriliumNext is a personal knowledge base designed for building deeply structured note hierarchies with rich editing, linking, and automation.

    **Key features**
    - **Hierarchical notes**: Organize complex knowledge into infinitely nested note trees and clones.
    - **Rich text and Markdown**: Built-in WYSIWYG editor with Markdown shortcuts, multi-column/tabbed note layouts, tables, Mermaid diagrams, and math formulas.
    - **Note relationship graphs**: Visualize links and relations across your knowledge base.
    - **Scripting**: Extend frontend and backend behavior with JavaScript notes.
    - **Version history and encryption**: Track note revisions and protect sensitive notes with encryption.

    **MCP integration**
    Enable the built-in MCP server in **Options > AI/LLM**, copy the **TriliumNext MCP** URL from Olares **Settings > Applications > TriliumNext > Entrances**, and append `/mcp`. By default (`ALLOW_INTERNAL_TOKENLESS_MCP=true`), clients within your Olares network (including LAN/VPN via the internal entrance) can connect with empty headers (`{}`) without an ETAPI token. On shared LANs, set `ALLOW_INTERNAL_TOKENLESS_MCP` to `false` in Olares Settings to require an ETAPI token on the internal entrance as well.
  upgradeDescription: |
    - Upgrade TriliumNext to 0.107.0 (Node.js 24.22.2, CVE-2026-111497 and ETAPI hardening).
    - **Irreversible database migration (240 to 242)**: Back up the data volume before upgrading; older versions cannot open a migrated database.
    - **0.107.0 highlights**: Multi-block notes with embedded/quoted notes, columns and tabs, enhanced tables (merged cells, sorting, bulk row/column edits), `#sorted="#label"` syntax requirement, and TOTP enforcement when syncing a new device.
    - **Guarded internal MCP entrance**: Add internal `TriliumNext MCP` entrance (port 18081) for AI assistants such as Lares. Enable MCP in Options > AI/LLM and connect to `/mcp` with empty headers by default, or set `ALLOW_INTERNAL_TOKENLESS_MCP=false` to require an ETAPI token on LAN/VPN internal requests as well. Main web entrance (port 8080) retains full authentication.

    Release notes: https://github.com/TriliumNext/Trilium/releases/tag/v0.107.0
