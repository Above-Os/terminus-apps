metadata:
  title: TriliumNext
  description: TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
spec:
  fullDescription: |
    TriliumNext is a personal knowledge base with hierarchically structured notes, rich text editor, note linking, scripting, and more.
  upgradeDescription: |
    Upgrade triliumnext from 0.105.0 to 0.106.1. Updates the bundled Node.js runtime and dependencies with server security fixes. Adds an internal MCP entrance for AI assistants such as Lares; enable the built-in MCP server in TriliumNext, then connect without a token through this internal entrance.

    Release notes: https://github.com/TriliumNext/Trilium/releases/tag/v0.106.1
