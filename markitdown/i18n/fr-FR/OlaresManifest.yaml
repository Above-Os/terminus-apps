metadata:
  title: MarkItDown MCP
  description: Convertissez des documents en Markdown pour vos workflows IA
spec:
  fullDescription: |
    MarkItDown convertit les documents et le contenu web en Markdown pour les assistants IA et les workflows d’analyse de texte.

    **Fonctionnalités principales**

    - Convertissez les fichiers PDF, Word, Excel, PowerPoint, HTML et les formats textuels.
    - Connectez des clients IA compatibles via MCP, sans interface web distincte.
    - Extrayez le texte des images et des pages PDF numérisées à l’aide d’un modèle OCR configuré.
    - Lisez les documents d’un dossier dédié dans l’application Fichiers d’Olares.

    **Avant de commencer**

    Utilisez un client MCP tel que Lares. Placez les documents locaux dans `Documents/MarkItDown` dans l’application Fichiers d’Olares. La conversion d’images et de documents numérisés nécessite un modèle OCR opérationnel défini par défaut dans Olares Router ; ce modèle s’installe séparément.

    Les mises en page complexes, les tableaux et les contenus numérisés peuvent perdre des informations. Vérifiez les textes et les chiffres importants à partir de l’original. Les documents protégés par mot de passe doivent être déchiffrés avant la conversion.
