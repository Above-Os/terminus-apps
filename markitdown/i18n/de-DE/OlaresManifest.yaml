metadata:
  title: MarkItDown MCP
  description: Dokumente für KI-Workflows in Markdown umwandeln
spec:
  fullDescription: |
    MarkItDown wandelt Dokumente und Webinhalte in Markdown um, damit KI-Assistenten und Workflows zur Textanalyse sie nutzen können.

    **Hauptfunktionen**

    - PDF-, Word-, Excel-, PowerPoint-, HTML- und textbasierte Dateien konvertieren.
    - Kompatible KI-Clients über MCP verbinden, ohne separate Weboberfläche.
    - Mit einem konfigurierten OCR-Modell Text aus Bildern und gescannten PDF-Seiten extrahieren.
    - Dokumente aus einem eigenen Ordner in der Olares-App Dateien lesen.

    **Vor dem Start**

    Verwenden Sie einen MCP-Client wie Lares. Legen Sie lokale Dokumente in der Olares-App Dateien unter `Documents/MarkItDown` ab. Für die Konvertierung von Bildern und Scans muss in Olares Router ein einsatzbereites OCR-Modell als Standard festgelegt sein; das Modell wird separat installiert.

    Bei komplexen Layouts, Tabellen und gescannten Inhalten können Informationen verloren gehen. Prüfen Sie wichtige Texte und Zahlen anhand des Originals. Passwortgeschützte Dokumente müssen vor der Konvertierung entschlüsselt werden.
