metadata:
  title: MarkItDown MCP
  description: Convierte documentos a Markdown para flujos de trabajo con IA
spec:
  fullDescription: |
    MarkItDown convierte documentos y contenido web a Markdown para asistentes de IA y flujos de trabajo de análisis de texto.

    **Funciones principales**

    - Convierte archivos PDF, Word, Excel, PowerPoint, HTML y formatos basados en texto.
    - Conecta clientes de IA compatibles mediante MCP sin una interfaz web independiente.
    - Extrae texto de imágenes y páginas PDF escaneadas con un modelo OCR configurado.
    - Lee documentos de una carpeta dedicada en la aplicación Archivos de Olares.

    **Antes de empezar**

    Utiliza un cliente MCP como Lares. Guarda los documentos locales en `Documents/MarkItDown` en la aplicación Archivos de Olares. Para convertir imágenes y documentos escaneados, es necesario configurar como predeterminado en Olares Router un modelo OCR listo para usar; el modelo se instala por separado.

    Los diseños complejos, las tablas y el contenido escaneado pueden perder información. Comprueba los textos y números importantes con el original. Los documentos protegidos con contraseña deben descifrarse antes de convertirlos.
