metadata:
  title: MarkItDown MCP
  description: AIワークフロー向けに文書をMarkdownに変換
spec:
  fullDescription: |
    MarkItDownは、文書やウェブコンテンツをMarkdownに変換し、AIアシスタントやテキスト分析ワークフローで利用できるようにします。

    **主な機能**

    - PDF、Word、Excel、PowerPoint、HTML、テキスト形式のファイルを変換します。
    - 独立したウェブ画面を使わず、MCP経由で対応するAIクライアントに接続できます。
    - 設定済みのOCRモデルを使い、画像やスキャンしたPDFページから文字を抽出します。
    - Olaresのファイルアプリ内にある専用フォルダーから文書を読み込みます。

    **利用を始める前に**

    LaresなどのMCPクライアントを使用してください。ローカル文書はOlaresのファイルアプリ内の`Documents/MarkItDown`に配置します。画像やスキャン文書の変換には、利用可能なOCRモデルをOlares Routerのデフォルトに設定する必要があります。モデルは別途インストールしてください。

    複雑なレイアウト、表、スキャンした内容では情報が欠落する場合があります。重要な文字や数値は原本と照合してください。パスワードで保護された文書は、変換前に復号する必要があります。
