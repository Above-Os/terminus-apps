metadata:
  title: MarkItDown MCP
  description: 将文档转换为适用于 AI 工作流的 Markdown
spec:
  fullDescription: |
    MarkItDown 将文档和网页内容转换为 Markdown，供 AI 助手和文本分析工作流使用。

    **主要功能**

    - 转换 PDF、Word、Excel、PowerPoint、HTML 和文本格式文件。
    - 通过 MCP 连接兼容的 AI 客户端，无需独立网页界面。
    - 使用已配置的 OCR 模型，从图片和扫描 PDF 页面中提取文字。
    - 读取 Olares 文件应用中专用文件夹内的文档。

    **开始使用前**

    请使用 Lares 等 MCP 客户端。将本地文档放入 Olares 文件应用中的 `Documents/MarkItDown` 文件夹。转换图片和扫描件需要在 Olares Router 中将可用的 OCR 模型设为默认模型；该模型需单独安装。

    复杂排版、表格和扫描内容在转换时可能丢失信息。请对照原件核对重要文字和数字。受密码保护的文档必须先解密，再进行转换。
