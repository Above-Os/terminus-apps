metadata:
  title: MarkItDown MCP
  description: Convert documents to Markdown for AI workflows
spec:
  fullDescription: |
    MarkItDown converts documents and web content into Markdown for AI assistants and text analysis workflows.

    **Key features**

    - Convert PDF, Word, Excel, PowerPoint, HTML and text-based files.
    - Connect compatible AI clients through MCP without a separate web interface.
    - Extract text from images and scanned PDF pages with a configured OCR model.
    - Read documents from a dedicated folder in Olares Files.

    **Before you start**

    Use an MCP client such as Lares. Place local documents in `Documents/MarkItDown` in Olares Files. Image and scan conversion requires a ready OCR model configured as the default in Olares Router; the model is installed separately.

    Complex layouts, tables and scanned content may lose information. Check important text and numbers against the original. Password-protected documents must be decrypted before conversion.
