metadata:
  title: MarkItDown MCP
  description: Converti documenti in Markdown per i flussi di lavoro con IA
spec:
  fullDescription: |
    MarkItDown converte documenti e contenuti web in Markdown per assistenti IA e flussi di lavoro di analisi del testo.

    **Funzionalità principali**

    - Converte file PDF, Word, Excel, PowerPoint, HTML e formati basati su testo.
    - Collega client IA compatibili tramite MCP senza un’interfaccia web separata.
    - Estrae testo da immagini e pagine PDF scansionate con un modello OCR configurato.
    - Legge documenti da una cartella dedicata nell’app File di Olares.

    **Prima di iniziare**

    Usa un client MCP come Lares. Inserisci i documenti locali in `Documents/MarkItDown` nell’app File di Olares. La conversione di immagini e scansioni richiede un modello OCR pronto all’uso impostato come predefinito in Olares Router; il modello va installato separatamente.

    Layout complessi, tabelle e contenuti scansionati possono perdere informazioni. Verifica i testi e i numeri importanti confrontandoli con l’originale. I documenti protetti da password devono essere decifrati prima della conversione.
