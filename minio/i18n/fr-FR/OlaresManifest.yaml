metadata:
  title: MinIO
  description: Stockage d’objets haute performance compatible S3
spec:
  fullDescription: |
    MinIO est une solution de stockage d’objets haute performance compatible S3, publiée sous licence GNU AGPL v3.0. Conçue pour la vitesse et la scalabilité, elle alimente les charges AI/ML, d’analytique et intensives en données avec des performances de premier plan.
    - Compatible API S3 – Intégration transparente avec les outils S3 existants
    - Pensée pour l’AI et l’analytique – Optimisée pour les pipelines de données à grande échelle
    - Haute performance – Idéale pour les charges de stockage exigeantes.
