metadata:
  title: MinIO
  description: Almacén de objetos S3 compatible de alto rendimiento
spec:
  fullDescription: |
    MinIO es una solución de almacenamiento de objetos de alto rendimiento compatible con S3, publicada bajo la licencia GNU AGPL v3.0. Diseñada para velocidad y escalabilidad, impulsa cargas de AI/ML, analítica y trabajo intensivo en datos con un rendimiento líder.
    - Compatible con la API S3 – Integración fluida con herramientas S3 existentes
    - Pensada para AI y analítica – Optimizada para pipelines de datos a gran escala
    - Alto rendimiento – Ideal para cargas de almacenamiento exigentes.
