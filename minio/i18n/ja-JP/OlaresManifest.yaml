metadata:
  title: MinIO
  description: 高性能な S3 互換オブジェクトストア
spec:
  fullDescription: |
    MinIO は GNU AGPL v3.0 ライセンスで公開されている、高性能な S3 互換オブジェクトストレージです。速度とスケーラビリティを重視し、AI/ML・分析・データ集約型ワークロードを業界トップクラスの性能で支えます。
    - S3 API 互換 – 既存の S3 ツールとシームレスに連携
    - AI と分析向け – 大規模データパイプラインに最適化
    - 高性能 – 要求の厳しいストレージワークロードに最適。
