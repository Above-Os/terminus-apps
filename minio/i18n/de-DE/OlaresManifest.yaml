metadata:
  title: MinIO
  description: Hochperformanter, S3-kompatibler Object Store
spec:
  fullDescription: |
    MinIO ist eine hochperformante, S3-kompatible Objektspeicherlösung unter der GNU AGPL v3.0 Lizenz. Für Geschwindigkeit und Skalierbarkeit ausgelegt, betreibt sie AI/ML-, Analyse- und datenintensive Workloads mit branchenführender Leistung.
    - S3-API-kompatibel – Nahtlose Integration mit bestehenden S3-Tools
    - Für AI & Analytics gebaut – Optimiert für groß angelegte Datenpipelines
    - Hohe Leistung – Ideal für anspruchsvolle Speicher-Workloads.
