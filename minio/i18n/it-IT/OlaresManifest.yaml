metadata:
  title: MinIO
  description: Object store ad alte prestazioni compatibile con S3
spec:
  fullDescription: |
    MinIO è una soluzione di object storage ad alte prestazioni compatibile con S3, rilasciata sotto licenza GNU AGPL v3.0. Progettata per velocità e scalabilità, alimenta workload di AI/ML, analytics e ad alta intensità di dati con prestazioni di settore.
    - Compatibile con API S3 – Integrazione fluida con gli strumenti S3 esistenti
    - Pensata per AI e Analytics – Ottimizzata per pipeline di dati su larga scala
    - Alte prestazioni – Ideale per carichi di storage impegnativi.
