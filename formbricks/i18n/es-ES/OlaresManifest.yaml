metadata:
  title: Formbricks
  description: Alternativa de código abierto a Qualtrics
spec:
  fullDescription: |
    Formbricks ofrece una plataforma de encuestas gratuita y de código abierto. Recopila opiniones en cada punto del recorrido del usuario mediante atractivas encuestas en la aplicación, web, enlaces y correo electrónico. Desarrolla sobre Formbricks o aprovecha sus análisis de datos integrados.

    **Funciones**
    - Crea encuestas optimizadas para conversión con el editor sin código y varios tipos de preguntas.
    - Elige entre plantillas de prácticas recomendadas.
    - Publica y dirige encuestas a grupos concretos sin cambiar el código.
    - Crea encuestas mediante enlaces compartibles.
    - Invita a los miembros de tu organización a colaborar.
    - Integra Formbricks con Slack, Notion, Zapier, n8n y más.
    - Totalmente abierto, transparente y autoalojable.
  upgradeDescription: |
    Almacenamiento: el almacenamiento persistente pasó de `appCache` a `appData`. En el primer inicio tras actualizar, un initContainer copia el `appCache` antiguo a `appData` si el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos se conservan para poder revertir.

    Actualización de Formbricks 4.4.3 a 5.1.4. Es una actualización principal a v5.

    **Notas de la versión**
    - Las invitaciones masivas requieren el plan Scale y tienen límite de frecuencia
    - Registro completo: https://github.com/formbricks/formbricks/compare/5.1.3...5.1.4

    **Cambios de stack (base v5)**
    - Formbricks Hub y Cube son ahora sidecars obligatorios (análisis/registros de opiniones)
    - Imagen: `beclab/formbricks-formbricks:5.1.4` (Hub `beclab/formbricks-hub:0.8.1`, Cube `v1.7.3`)
    - El inicio ejecuta las migraciones de DB de Formbricks y después las de Hub

    **Ajustes para el usuario**
    - No hay nuevas preguntas de instalación. El chart configura automáticamente los Secrets y URL de Hub/Cube.
    - Los ajustes opcionales de correo no cambian (SMTP / `MAIL_FROM*`, principalmente de Olares SMTP).

    **Antes de actualizar**
    - Haz una copia de seguridad de PostgreSQL
    - Prevé más uso de memoria (Hub + Cube; solo Cube necesita unos 500MB libres)

    Guía de migración: https://formbricks.com/docs/self-hosting/advanced/migration
