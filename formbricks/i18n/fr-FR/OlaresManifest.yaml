metadata:
  title: Formbricks
  description: Alternative open source à Qualtrics
spec:
  fullDescription: |
    Formbricks offre une plateforme de sondage gratuite et open source. Recueillez des avis à chaque étape du parcours utilisateur grâce à de beaux sondages intégrés, Web, par lien et par e-mail. Développez sur Formbricks ou exploitez ses analyses de données intégrées.

    **Fonctionnalités**
    - Créez des sondages optimisés pour la conversion avec l'éditeur sans code et plusieurs types de questions.
    - Choisissez parmi des modèles de bonnes pratiques.
    - Lancez et ciblez vos sondages sans modifier le code.
    - Créez des sondages partageables par lien.
    - Invitez les membres de votre organisation à collaborer.
    - Intégrez Formbricks à Slack, Notion, Zapier, n8n et plus encore.
    - Entièrement open source, transparent et auto-hébergeable.
  upgradeDescription: |
    Stockage : le stockage persistant est passé de `appCache` à `appData`. Au premier démarrage après la mise à niveau, un initContainer copie l'ancien `appCache` vers `appData` si la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données restent intactes pour un retour arrière.

    Mise à niveau de Formbricks 4.4.3 vers 5.1.4. Il s'agit d'une mise à niveau majeure v5.

    **Notes de version**
    - Les invitations groupées nécessitent le forfait Scale et sont limitées en fréquence
    - Journal complet : https://github.com/formbricks/formbricks/compare/5.1.3...5.1.4

    **Évolution de la pile (base v5)**
    - Formbricks Hub et Cube sont désormais des sidecars obligatoires (analyses/avis)
    - Image : `beclab/formbricks-formbricks:5.1.4` (Hub `beclab/formbricks-hub:0.8.1`, Cube `v1.7.3`)
    - Le démarrage exécute les migrations DB de Formbricks, puis celles de Hub

    **Paramètres utilisateur**
    - Aucune nouvelle invite d'installation. Les Secrets et URL Hub/Cube sont configurés automatiquement par le chart.
    - Les paramètres de messagerie facultatifs sont inchangés (SMTP / `MAIL_FROM*`, principalement depuis Olares SMTP).

    **Avant la mise à niveau**
    - Sauvegardez votre base PostgreSQL
    - Prévoyez davantage de mémoire (Hub + Cube ; Cube seul nécessite environ 500MB de marge)

    Guide de migration : https://formbricks.com/docs/self-hosting/advanced/migration
