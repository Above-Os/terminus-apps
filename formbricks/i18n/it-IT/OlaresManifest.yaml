metadata:
  title: Formbricks
  description: Alternativa open source a Qualtrics
spec:
  fullDescription: |
    Formbricks offre una piattaforma per sondaggi gratuita e open source. Raccogli feedback in ogni punto del percorso utente con eleganti sondaggi in-app, sul sito, tramite link ed email. Sviluppa su Formbricks o utilizza le funzioni di analisi predefinite.

    **Funzionalità**
    - Crea sondaggi ottimizzati per la conversione con l'editor no-code e vari tipi di domande.
    - Scegli tra modelli basati sulle migliori pratiche.
    - Pubblica e indirizza i sondaggi a gruppi specifici senza modificare il codice.
    - Crea sondaggi condivisibili tramite link.
    - Invita i membri dell'organizzazione a collaborare.
    - Integra Formbricks con Slack, Notion, Zapier, n8n e altro.
    - Completamente open source, trasparente e self-hosted.
  upgradeDescription: |
    Archiviazione: lo storage persistente è passato da `appCache` ad `appData`. Al primo avvio dopo l'aggiornamento, un initContainer copia il vecchio `appCache` in `appData` se la destinazione è vuota (marcatore: `.migration_from_appcache_done`). I vecchi dati restano intatti per il rollback.

    Aggiornamento di Formbricks da 4.4.3 a 5.1.4. È un aggiornamento principale a v5.

    **Note di rilascio**
    - Gli inviti in massa richiedono il piano Scale e sono soggetti a limiti
    - Changelog completo: https://github.com/formbricks/formbricks/compare/5.1.3...5.1.4

    **Modifiche allo stack (base v5)**
    - Formbricks Hub e Cube sono ora sidecar obbligatori (analisi/record dei feedback)
    - Immagine: `beclab/formbricks-formbricks:5.1.4` (Hub `beclab/formbricks-hub:0.8.1`, Cube `v1.7.3`)
    - All'avvio vengono eseguite le migrazioni DB di Formbricks, poi quelle di Hub

    **Impostazioni utente**
    - Nessuna nuova richiesta d'installazione. Secret e URL di Hub/Cube sono configurati automaticamente dal chart.
    - Le impostazioni email facoltative restano invariate (SMTP / `MAIL_FROM*`, soprattutto da Olares SMTP).

    **Prima dell'aggiornamento**
    - Esegui il backup del database PostgreSQL
    - Prevedi più memoria (Hub + Cube; Cube richiede da solo circa 500MB liberi)

    Guida alla migrazione: https://formbricks.com/docs/self-hosting/advanced/migration
