metadata:
  title: Formbricks
  description: Quelloffene Alternative zu Qualtrics
spec:
  fullDescription: |
    Formbricks bietet eine kostenlose, quelloffene Umfrageplattform. Sammeln Sie an jedem Punkt der Benutzerreise Feedback mit attraktiven In-App-, Website-, Link- und E-Mail-Umfragen. Bauen Sie auf Formbricks auf oder nutzen Sie die integrierte Datenanalyse.

    **Funktionen**
    - Erstellen Sie mit dem No-Code-Editor und verschiedenen Fragetypen konversionsoptimierte Umfragen.
    - Wählen Sie aus bewährten Vorlagen.
    - Starten Sie Umfragen gezielt für bestimmte Benutzergruppen, ohne den Anwendungscode zu ändern.
    - Erstellen Sie teilbare Link-Umfragen.
    - Laden Sie Organisationsmitglieder zur Zusammenarbeit ein.
    - Integrieren Sie Formbricks mit Slack, Notion, Zapier, n8n und mehr.
    - Vollständig quelloffen, transparent und selbst hostbar.
  upgradeDescription: |
    Speicher: Dauerhafter Speicher wurde von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopiert ein initContainer ältere `appCache`-Daten nach `appData`, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Die alten Daten bleiben für ein Rollback erhalten.

    Upgrade von Formbricks 4.4.3 auf 5.1.4. Dies ist ein großes v5-Upgrade.

    **Versionshinweise**
    - Masseneinladungen sind dem Scale-Tarif vorbehalten und werden ratenbegrenzt
    - Vollständiges Änderungsprotokoll: https://github.com/formbricks/formbricks/compare/5.1.3...5.1.4

    **Stack-Änderungen (v5-Basis)**
    - Formbricks Hub und Cube sind jetzt erforderliche Sidecars (Analysen/Feedback-Datensätze)
    - App-Image: `beclab/formbricks-formbricks:5.1.4` (Hub `beclab/formbricks-hub:0.8.1`, Cube `v1.7.3`)
    - Beim Start werden zuerst Formbricks-DB- und dann Hub-Migrationen ausgeführt

    **Benutzereinstellungen**
    - Keine neuen Installationsabfragen. Hub/Cube-Secrets und URLs werden automatisch vom Chart eingerichtet.
    - Optionale E-Mail-Einstellungen bleiben unverändert (SMTP / `MAIL_FROM*`, meist aus Olares SMTP).

    **Vor dem Upgrade**
    - Sichern Sie Ihre PostgreSQL-Datenbank
    - Rechnen Sie mit höherem Speicherbedarf (Hub + Cube; Cube benötigt allein etwa 500MB Reserve)

    Migrationsanleitung: https://formbricks.com/docs/self-hosting/advanced/migration
