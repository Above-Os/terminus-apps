metadata:
  title: RabbitMQ Dashboard
  description: Tableau de bord pour voir l’état de RabbitMQ
spec:
  fullDescription: |
    RabbitMQ Dashboard est un outil pour consulter l’état de RabbitMQ. RabbitMQ est un broker de messagerie et de streaming fiable et mature, facile à déployer dans le cloud, on-premises et sur votre machine locale. Il est utilisé par des millions de personnes dans le monde.

    Fonctionnalités clés
    **Interopérable**
    RabbitMQ prend en charge plusieurs protocoles ouverts, dont AMQP 1.0 et MQTT 5.0. De nombreuses bibliothèques clientes existent pour le langage de votre choix — choisissez-en une. Pas de verrouillage fournisseur !

    **Flexible**
    RabbitMQ offre de nombreuses options à combiner pour définir comment vos messages vont de l’éditeur à un ou plusieurs consommateurs. Routage, filtrage, streaming, fédération, etc.

    **Fiable**
    Avec l’accusé de réception de livraison et la réplication des messages dans un cluster, vous pouvez garantir que vos messages sont en sécurité avec RabbitMQ.

    **Protocoles pris en charge**
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1, 3.1.1 et 5.0
    - STOMP 1.0 à 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket (pris en charge dans VMware Tanzu RabbitMQ)
