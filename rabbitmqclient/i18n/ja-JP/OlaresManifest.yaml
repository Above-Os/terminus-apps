metadata:
  title: RabbitMQ Dashboard
  description: RabbitMQ の状態を表示するダッシュボード
spec:
  fullDescription: |
    RabbitMQ Dashboard は RabbitMQ の状態を表示するツールです。RabbitMQ は信頼性が高く成熟したメッセージング／ストリーミングブローカーで、クラウド、オンプレミス、ローカルマシンに容易にデプロイできます。現在、世界中で数百万人に利用されています。

    主な機能
    **相互運用性**
    RabbitMQ は AMQP 1.0 や MQTT 5.0 を含む複数のオープン標準プロトコルをサポートします。好みのプログラミング言語向けのクライアントライブラリが多数あり、好きなものを選べます。ベンダーロックインなし！

    **柔軟性**
    RabbitMQ は、パブリッシャーから 1 つまたは多数のコンシューマーへメッセージがどう流れるかを定義するための多くのオプションを組み合わせられます。ルーティング、フィルタリング、ストリーミング、フェデレーションなど。

    **信頼性**
    メッセージ配信の確認応答とクラスター間のレプリケーションにより、メッセージを RabbitMQ で安全に保てます。

    **対応プロトコル**
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1、3.1.1、および 5.0
    - STOMP 1.0 から 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket（VMware Tanzu RabbitMQ でサポート）
