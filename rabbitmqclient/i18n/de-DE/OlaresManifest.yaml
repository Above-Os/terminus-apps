metadata:
  title: RabbitMQ Dashboard
  description: RabbitMQ-Status anzeigen
spec:
  fullDescription: |
    RabbitMQ Dashboard ist ein Tool zur Anzeige des RabbitMQ-Status. RabbitMQ ist ein zuverlässiger und ausgereifter Messaging- und Streaming-Broker, der sich leicht in der Cloud, on-premises und lokal bereitstellen lässt. Er wird weltweit von Millionen genutzt.

    Wichtige Funktionen
    **Interoperabel**
    RabbitMQ unterstützt mehrere offene Standardprotokolle, darunter AMQP 1.0 und MQTT 5.0. Es gibt zahlreiche Client-Bibliotheken für die Programmiersprache Ihrer Wahl — wählen Sie einfach eine. Kein Vendor Lock-in!

    **Flexibel**
    RabbitMQ bietet viele Optionen, die Sie kombinieren können, um festzulegen, wie Nachrichten vom Publisher zu einem oder vielen Consumern gelangen. Routing, Filtering, Streaming, Federation und mehr.

    **Zuverlässig**
    Mit Bestätigung der Nachrichtenlieferung und Replikation über einen Cluster hinweg können Sie sicherstellen, dass Ihre Nachrichten bei RabbitMQ sicher sind.

    **Unterstützte Protokolle**
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1, 3.1.1 und 5.0
    - STOMP 1.0 bis 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket (unterstützt in VMware Tanzu RabbitMQ)
