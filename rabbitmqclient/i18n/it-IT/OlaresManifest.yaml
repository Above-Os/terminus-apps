metadata:
  title: RabbitMQ Dashboard
  description: Dashboard per visualizzare lo stato di RabbitMQ
spec:
  fullDescription: |
    RabbitMQ Dashboard è uno strumento per visualizzare lo stato di RabbitMQ. RabbitMQ è un broker di messaging e streaming affidabile e maturo, facile da distribuire in cloud, on-premises e sulla macchina locale. È usato da milioni di persone nel mondo.

    Funzionalità principali
    **Interoperabile**
    RabbitMQ supporta diversi protocolli aperti, tra cui AMQP 1.0 e MQTT 5.0. Sono disponibili molte librerie client per il linguaggio che preferisci — scegline una. Nessun vendor lock-in!

    **Flessibile**
    RabbitMQ offre molte opzioni da combinare per definire come i messaggi vanno dal publisher a uno o più consumer. Routing, filtering, streaming, federation e altro.

    **Affidabile**
    Con l’ack della consegna e la replica dei messaggi in un cluster, puoi assicurarti che i messaggi siano al sicuro con RabbitMQ.

    **Protocolli supportati**
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1, 3.1.1 e 5.0
    - STOMP 1.0 fino a 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket (supportato in VMware Tanzu RabbitMQ)
