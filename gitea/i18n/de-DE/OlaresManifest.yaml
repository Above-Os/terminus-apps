metadata:
  title: Gitea
  description: Git mit einer Tasse Tee
spec:
  fullDescription: |
    Gitea ist ein schmerzfreier, selbst gehosteter All-in-one-Softwareentwicklungsdienst. Er umfasst Git-Hosting, Code-Review, Team-Zusammenarbeit, Package-Registry und CI/CD. Er ähnelt GitHub, Bitbucket und GitLab.

    **Funktionen**
    Code-Hosting
    - Gitea unterstützt das Erstellen und Verwalten von Repositories, das Durchsuchen von Commit-Historie und Codedateien, das Reviewen und Mergen von Code-Einreichungen, die Verwaltung von Mitwirkenden, den Umgang mit Branches und mehr. Es unterstützt auch viele gängige Git-Funktionen wie Tags, Cherry-pick, Hooks, integrierte Kollaborationstools und mehr.

    Leichtgewichtig und schnell
    - Eines der Designziele von Gitea ist Leichtgewichtigkeit und schnelle Antwortzeiten. Im Gegensatz zu einigen großen Code-Hosting-Plattformen bleibt es schlank, performant und eignet sich für ressourcenbeschränkte Serverumgebungen. Durch das leichte Design hat Gitea einen relativ geringen Ressourcenverbrauch und läuft gut in ressourcenarmen Umgebungen.

    Einfache Bereitstellung und Wartung
    - Es lässt sich auf verschiedenen Servern einfach bereitstellen, ohne komplexe Konfigurationen oder Abhängigkeiten. Das macht es für Einzelentwickler oder kleine Teams bequem, eigene Git-Dienste einzurichten und zu verwalten.

    Sicherheit
    - Gitea legt großen Wert auf Sicherheit und bietet Funktionen wie Benutzerrechteverwaltung, Access Control Lists und mehr, um die Sicherheit von Code und Daten zu gewährleisten.

    Code-Review
    - Code-Review unterstützt sowohl den Pull-Request-Workflow als auch den AGit-Workflow. Reviewer können Code online durchsuchen und Review-Kommentare oder Feedback geben. Einreicher können Review-Kommentare erhalten und online antworten oder Code ändern. Code-Reviews helfen Einzelpersonen und Organisationen, die Codequalität zu verbessern.

    CI/CD
    - Gitea Actions unterstützt CI/CD-Funktionalität und ist mit GitHub Actions kompatibel. Benutzer können Workflows im vertrauten YAML-Format schreiben und eine Vielzahl bestehender Actions-Plugins wiederverwenden. Actions-Plugins können von jeder Git-Website heruntergeladen werden.

    Projektverwaltung
    - Gitea verfolgt Projektanforderungen, Features und Bugs über Spalten und Issues. Issues unterstützen Funktionen wie Branches, Tags, Meilensteine, Zuweisungen, Zeiterfassung, Fälligkeitsdaten, Abhängigkeiten und mehr.

    Artefakt-Repository
    - Gitea unterstützt über 20 verschiedene Typen öffentlicher oder privater Software-Paketverwaltung, darunter Cargo, Chef, Composer, Conan, Conda, Container, Helm, Maven, npm, NuGet, Pub, PyPI, RubyGems, Vagrant und mehr.

    Open-Source-Community-Unterstützung
    - Gitea ist ein Open-Source-Projekt unter der MIT-Lizenz. Es hat eine aktive Open-Source-Community, die die Plattform kontinuierlich weiterentwickelt und verbessert. Das Projekt begrüßt aktiv Community-Beiträge und stellt Updates und Innovation sicher.

    Mehrsprachige Unterstützung
    - Gitea bietet Oberflächen in mehreren Sprachen und richtet sich an Nutzer weltweit, um Internationalisierung und Lokalisierung zu fördern.

  upgradeDescription: |
    Gitea auf 1.27.2 (`gitea/gitea:1.27.2`) aktualisieren, den zweiten Patch für 1.27. Enthält Sicherheitsfixes für Collaborator-Zugriff und HTTP-Signaturen, externes/Markup-Rendering, pull_request_target wiederverwendbare Workflows, WebAuthn/OpenID-Zweitfaktorprüfungen und API-Token-Scope; mermaid wird auf v11.16.1 aktualisiert.

    Enthält außerdem Fixes für Actions, LFS, Packages und UI (workflow_dispatch-Inputs bleiben Strings, sicherere parallele LFS-Uploads, Archiv-Downloads unter einem Sub-Pfad und mehr). Details: https://blog.gitea.com/release-of-1.27.2/

    OpenResty-Reverse-Proxy-Upload-Limit auf 512MB anheben (`client_max_body_size 512m`), damit Web-Uploads, Git-HTTP-Push und typische LFS-Objekte nicht mit HTTP 413 nach dem offiziellen OpenResty-Default von 1MB abgelehnt werden.

    giteaproxy Deployment rollen, wenn sich die nginx ConfigMap ändert (`checksum/nginx-config`), da ein `subPath`-Mount In-Place-ConfigMap-Updates nicht übernimmt.
