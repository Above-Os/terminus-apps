metadata:
  title: EvalScope
  description: 用于运行模型评测、监控任务和查看结果的 Web 界面
spec:
  fullDescription: |
    EvalScope 提供浏览器界面，可通过已有的模型 API 评测语言模型和多模态模型，并查看评测结果。

    **主要功能**

    - 浏览 benchmark 目录，查看任务说明。
    - 配置兼容 OpenAI 的模型接口、选择 benchmark，并限制样本数量。
    - 提交评测任务、查看进度和日志，并停止正在运行的任务。
    - 评测完成后查看保存的报告、模型回答和逐题评分。

    **开始之前**

    请自行配置可访问的模型 API URL、模型名称和 API key。本应用不部署模型。首次启动需要联网安装依赖，任务会按需下载数据集。

    部分 benchmark 需要额外依赖、外部评分模型或专用执行环境，本应用未预配置全部环境。样本数量限制不等同于随机抽样。已完成的报告会在重启后保留，运行中的任务可能需要重新启动。
