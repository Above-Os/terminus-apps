metadata:
  title: EvalScope
  description: A web interface for running model evaluations and browsing results
spec:
  fullDescription: |
    EvalScope provides a browser interface for evaluating language and multimodal models through an existing model API and reviewing the results.

    **Key features**

    - Browse the benchmark catalog and read task descriptions.
    - Configure an OpenAI-compatible model endpoint, select benchmarks, and limit sample counts.
    - Submit evaluations, monitor progress and logs, and stop a running task.
    - Browse saved reports, predictions, and per-sample scores after the evaluation finishes.

    **Before you start**

    Configure your own reachable model API URL, model name, and API key. Model hosting is not included. The first start needs internet access to install dependencies, and datasets are downloaded when needed by a task.

    Some benchmarks require additional dependencies, external judges, or specialized execution environments. These are not all configured by this app. The sample limit is not a random-sampling control. Completed reports are preserved across restarts, but running tasks may need to be started again.
