olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: evalscope
  appid: evalscope
  title: EvalScope
  description: A web interface for running model evaluations and browsing results
  icon: https://cdn.olares.com/images/2026/10/c8dcc120510e986884cfbacb9fd4ece8.png
  version: 0.0.3
  categories:
  - Developer Tools
  - models
entrances:
- name: evalscope
  host: evalscope
  port: 9000
  title: EvalScope
  authLevel: private
  invisible: false
  icon: https://cdn.olares.com/images/2026/10/c8dcc120510e986884cfbacb9fd4ece8.png
spec:
  versionName: 1.12.0
  supportArch:
  - amd64
  runAsUser: true
  requiredCpu: 1
  limitedCpu: 4
  requiredMemory: 2Gi
  limitedMemory: 8Gi
  requiredDisk: 50Gi
  developer: ModelScope
  website: https://github.com/modelscope/evalscope
  sourceCode: https://github.com/modelscope/evalscope
  doc: https://evalscope.readthedocs.io/en/latest/user_guides/service.html
