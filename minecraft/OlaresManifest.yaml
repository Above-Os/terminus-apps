olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  minecraft: 1
  terminal: 1

metadata:
  name: minecraft
  appid: minecraft
  title: Minecraft
  description: Minecraft Java Edition dedicated server.
  icon: https://cdn.olares.com/images/2026/08/115f197fbf485c4afaf008ed273e83bd.png
  version: 0.1.3
  categories:
  - Fun

entrances:
- name: terminal
  host: terminal
  port: 80
  title: Minecraft Console
  icon: https://cdn.olares.com/images/2026/08/115f197fbf485c4afaf008ed273e83bd.png
  authLevel: private
  openMethod: window

ports:
- name: minecraft
  host: minecraft
  port: 25565
  protocol: tcp
  exposePort: 25565

overlayGateway:
  enable: true
  entrances:
  - title: Minecraft Java
    workload: minecraft
    port: 25565
    protocol: tcp
    description: Join with Minecraft Java Edition (TCP 25565)

tailscale:
  acls:
  - proto: tcp
    dst:
    - "*:25565"

permission:
  appData: true

spec:
  versionName: "26.2"
  developer: itzg
  website: https://www.minecraft.net/
  sourceCode: https://github.com/itzg/docker-minecraft-server
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://docker-minecraft-server.readthedocs.io/
  license:
  - text: Minecraft EULA
    url: https://www.minecraft.net/en-us/eula
  requiredMemory: 4Gi
  limitedMemory: 8Gi
  requiredDisk: 2Gi
  limitedDisk: 50Gi
  requiredCpu: 2
  limitedCpu: 6
  supportArch:
  - amd64
  - arm64
  runAsUser: true
  featuredImage: https://cdn.olares.com/images/2026/08/ed72a9cf16173eed0fe4119be0228e07.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/ed72a9cf16173eed0fe4119be0228e07.png
  - https://cdn.olares.com/images/2026/08/c279ca3bcd9dc4ae889ec1eb798e0454.png
  - https://cdn.olares.com/images/2026/08/442ea61d32e0f4292d3de13755b7d5aa.png
  fullDescription: |
    A vanilla Minecraft Java Edition dedicated server. There is no web UI — open the console terminal from the desktop, and join from the official Minecraft Java client.

    First start downloads the official server jar (a few minutes). World data is stored in this app's data directory.

    Connect with the official Minecraft: Java & Bedrock Edition client. Use the app third-level domain and port 25565 (for example minecraft.<olares-id>.olares.com:25565), or the Olares node IP on the same LAN. The Java client version must match the server. Online mode is on, so a genuine Microsoft account is required.

  upgradeDescription: |
    Replace Market listing images with English Java Edition UI and the live server console.

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
