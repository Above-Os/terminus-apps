metadata:
  title: Minecraft
  description: Serveur dédié Minecraft Java Edition
spec:
  fullDescription: |
    Minecraft Java Edition server with Vanilla, Forge, and Fabric installation options.

    Le premier démarrage télécharge le jar officiel du serveur (quelques minutes). Les données du monde sont stockées dans le répertoire de données de cette app.

    Sur le même LAN, ouvrez Paramètres → Réseau → Overlay gateway, activez la passerelle et activez Overlay pour cette app, puis rejoignez avec l'IP LAN et le port affichés (TCP 25565).

    Overlay et VPN peuvent être utilisés en même temps. Pour le VPN — y compris lorsque les joueurs sont sur un autre réseau — rejoignez `<olares-id>.olares.com:25565` (par exemple olarestest001.olares.com:25565).

    Choisissez Minecraft 1.20.1, 1.21.1, 26.2 ou LATEST à l’installation ; Java est adapté automatiquement. LATEST peut se mettre à jour au redémarrage. Le client doit correspondre au serveur. Choisissez Vanilla, Forge ou Fabric et des versions compatibles avec vos mods. La vérification des comptes est activée par défaut et désactivable dans les variables d’environnement ; la vérification des profils sécurisés est aussi désactivée et le serveur redémarre. Mode hors ligne réservé aux joueurs de confiance. Changer de mode modifie les UUID et peut affecter inventaires et permissions. Sauvegardez les mondes et ne les rétrogradez pas.

    Les commandes de triche sont désactivées par défaut. Activez « Autoriser les triches » dans les variables d’environnement pour que chaque joueur qui rejoint puisse utiliser /give et /gamemode, et pour activer les blocs de commande. /stop reste sur la console. Désactiver retire cet accès et redémarre le serveur. Réservé aux joueurs de confiance.

  upgradeDescription: |
    Réglage pour autoriser les commandes de triche. Elles restent désactivées par défaut.
