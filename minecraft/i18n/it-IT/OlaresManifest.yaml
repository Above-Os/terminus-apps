metadata:
  title: Minecraft
  description: Server dedicato Minecraft Java Edition
spec:
  fullDescription: |
    Un server dedicato vanilla di Minecraft Java Edition. Non c'è interfaccia web — apri il terminale della console dal desktop e unisciti con il client ufficiale Minecraft Java.

    Il primo avvio scarica il jar ufficiale del server (alcuni minuti). I dati del mondo sono salvati nella directory dati di questa app.

    Sulla stessa LAN, apri Impostazioni → Rete → Overlay gateway, attiva il gateway e abilita Overlay per questa app, poi unisciti con l'IP LAN e la porta mostrati lì (TCP 25565).

    Overlay e VPN possono essere usati contemporaneamente. Per la VPN — anche quando i giocatori sono su un'altra rete — unisciti a `<olares-id>.olares.com:25565` (ad esempio olarestest001.olares.com:25565).

    La versione del client Java deve corrispondere al server. La modalità online è attiva, quindi è richiesto un account Microsoft genuino.

  upgradeDescription: |
    Fissa il pod del game server al control-plane (master) tramite nodeAffinity per l'accesso LAN dell'overlay gateway.
