metadata:
  title: Minecraft
  description: Minecraft Java Edition dedicated server.
spec:
  fullDescription: |
    A vanilla Minecraft Java Edition dedicated server. There is no web UI — open the console terminal from the desktop, and join from the official Minecraft Java client.

    First start downloads the official server jar (a few minutes). World data is stored in this app's data directory.

    To connect, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app. Note the LAN IP address and port shown there (TCP 25565), then join from the official Minecraft: Java Edition client using `<ip>:25565`. The Java client version must match the server. Online mode is on, so a genuine Microsoft account is required.

  upgradeDescription: |
    Wire overlay gateway LAN access (macvlan-init, overlayGateway entrance for TCP 25565). Drop Tailscale ACL. Update join instructions for Settings → Network → Overlay gateway.
