metadata:
  title: Minecraft
  description: Minecraft Java Edition dedicated server.
spec:
  fullDescription: |
    A vanilla Minecraft Java Edition dedicated server. There is no web UI — open the console terminal from the desktop, and join from the official Minecraft Java client.

    First start downloads the official server jar (a few minutes). World data is stored in this app's data directory.

    Connect with the official Minecraft: Java & Bedrock Edition client. Use the app third-level domain and port 25565 (for example minecraft.<olares-id>.olares.com:25565), or the Olares node IP on the same LAN. The Java client version must match the server. Online mode is on, so a genuine Microsoft account is required.

  upgradeDescription: |
    Replace Market listing images with live English launcher, in-game, and server-join logs.
