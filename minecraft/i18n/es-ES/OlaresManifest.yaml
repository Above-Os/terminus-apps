metadata:
  title: Minecraft
  description: Servidor dedicado de Minecraft Java Edition
spec:
  fullDescription: |
    Un servidor dedicado vanilla de Minecraft Java Edition. No hay interfaz web — abre la terminal de consola desde el escritorio y únete con el cliente oficial de Minecraft Java.

    El primer arranque descarga el jar oficial del servidor (unos minutos). Los datos del mundo se guardan en el directorio de datos de esta app.

    En la misma LAN, abre Ajustes → Red → Overlay gateway, activa la pasarela y habilita Overlay para esta app, luego únete con la IP LAN y el puerto mostrados allí (TCP 25565).

    Overlay y VPN pueden usarse a la vez. Para VPN — incluso cuando los jugadores están en otra red — únete en `<olares-id>.olares.com:25565` (por ejemplo olarestest001.olares.com:25565).

    Elige Minecraft 1.20.1, 1.21.1, 26.2 o LATEST al instalar; Java se selecciona automáticamente. LATEST puede actualizarse al reiniciar. El cliente debe coincidir con el servidor. Elige Vanilla, Forge o Fabric al instalar; usa versiones del juego y del cargador compatibles con tus mods. La verificación de cuentas está activada por defecto y puede desactivarse en las variables de entorno; también se desactiva la comprobación de perfiles seguros y se reinicia el servidor. Modo offline solo para jugadores de confianza. Cambiar de modo modifica los UUID y puede afectar inventarios y permisos. Haz una copia de seguridad; no abras mundos con versiones anteriores.

  upgradeDescription: |
    Selección de versión al instalar, Java correspondiente y verificación de cuentas configurable.
