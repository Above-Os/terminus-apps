metadata:
  title: Minecraft
  description: Minecraft Java 版专用服务器。
spec:
  fullDescription: |
    原版 Minecraft Java 版专用服务器。没有网页界面——从桌面打开控制台终端，用官方 Java 客户端加入。

    首次启动会下载官方服务端 jar（可能需要几分钟）。存档保存在本应用的数据目录。

    连接方式：打开「设置 → 网络 → Overlay 网关」，开启网关并为本应用打开 Overlay，记下页面显示的局域网 IP 与端口（TCP 25565），在官方 Java 客户端填 `<ip>:25565` 进服。Java 客户端版本须与服务器一致。已开启 online mode，需要正版 Microsoft 账号。

  upgradeDescription: |
    接入 Overlay 网关局域网暴露（macvlan-init、TCP 25565 overlayGateway 入口），去掉 Tailscale ACL，更新为在「设置 → 网络 → Overlay 网关」查看 IP 与端口后进服。
