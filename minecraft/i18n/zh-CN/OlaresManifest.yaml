metadata:
  title: Minecraft
  description: Minecraft Java 版专用服务器。
spec:
  fullDescription: |
    原版 Minecraft Java 版专用服务器。没有网页界面——从桌面打开控制台终端，用官方 Java 客户端加入。

    首次启动会下载官方服务端 jar（可能需要几分钟）。存档保存在本应用的数据目录。

    使用官方 Minecraft: Java & Bedrock Edition 客户端连接。地址填应用三级域名加端口 25565（例如 minecraft.<olares-id>.olares.com:25565），同一局域网也可用 Olares 节点 IP。Java 客户端版本必须与服务器一致。已开启 online mode，需要正版 Microsoft 账号。

  upgradeDescription: |
    补充应用市场上架图，并说明通过应用域名和 TCP 25565 加入。
