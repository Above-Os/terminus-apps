metadata:
  title: Minecraft
  description: Minecraft Java Edition 専用サーバー
spec:
  fullDescription: |
    バニラの Minecraft Java Edition 専用サーバーです。Web UI はありません — デスクトップからコンソール端末を開き、公式 Minecraft Java クライアントから参加してください。

    初回起動時に公式サーバー jar をダウンロードします（数分）。ワールドデータはこのアプリのデータディレクトリに保存されます。

    同一 LAN では、設定 → ネットワーク → Overlay gateway を開き、ゲートウェイをオンにしてこのアプリの Overlay を有効にしたうえで、表示される LAN IP とポート（TCP 25565）で参加します。

    Overlay と VPN は同時に利用できます。VPN の場合 — プレイヤーが別ネットワークにいる場合も含め — `<olares-id>.olares.com:25565`（例: olarestest001.olares.com:25565）で参加します。

    インストール時に Minecraft 1.20.1、1.21.1、26.2、LATEST を選択でき、Java は自動選択されます。LATEST は再起動時に更新される場合があります。クライアントとサーバーのバージョンを一致させてください。インストール時に Vanilla、Forge、Fabric を選択できます。ゲームとローダーは MOD に対応するバージョンを指定してください。アカウント認証は初期状態で有効です。環境変数で無効にすると、セキュアプロファイル認証も無効になり再起動します。オフラインモードは信頼できるプレイヤー限定です。モード変更は UUID を変え、所持品や権限に影響する場合があります。変更前にバックアップし、既存ワールドを古いバージョンで開かないでください。

  upgradeDescription: |
    バージョン選択、Java の自動選択、アカウント認証の切り替えに対応。
