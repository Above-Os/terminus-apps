metadata:
  title: Minecraft
  description: Dedizierter Server für Minecraft Java Edition
spec:
  fullDescription: |
    Ein Vanilla-Minecraft-Java-Edition-Server. Es gibt keine Web-UI — öffne das Konsolen-Terminal vom Desktop und tritt über den offiziellen Minecraft-Java-Client bei.

    Beim ersten Start wird das offizielle Server-JAR heruntergeladen (einige Minuten). Weltdaten werden im Datenverzeichnis dieser App gespeichert.

    Im selben LAN: Einstellungen → Netzwerk → Overlay-Gateway öffnen, Gateway einschalten und Overlay für diese App aktivieren, dann mit der dort angezeigten LAN-IP und dem Port beitreten (TCP 25565).

    Overlay und VPN können gleichzeitig genutzt werden. Für VPN — auch wenn Spieler in einem anderen Netzwerk sind — unter `<olares-id>.olares.com:25565` beitreten (z. B. olarestest001.olares.com:25565).

    Bei der Installation Minecraft 1.20.1, 1.21.1, 26.2 oder LATEST wählen; Java wird automatisch angepasst. LATEST kann beim Neustart aktualisiert werden. Client und Server müssen übereinstimmen. Vanilla, Forge oder Fabric bei der Installation wählen; Spiel- und Loader-Versionen müssen zum Modpack passen. Die Kontoprüfung ist standardmäßig aktiv und in den App-Umgebungsvariablen abschaltbar; dabei wird auch die Prüfung sicherer Profile deaktiviert und der Server neu gestartet. Offline-Modus nur für vertrauenswürdige Spieler. Ein Moduswechsel ändert UUIDs und kann Inventare und Rechte beeinflussen. Welten vor Änderungen sichern und nicht downgraden.

  upgradeDescription: |
    Versionsauswahl bei der Installation, passendes Java und konfigurierbare Kontoprüfung.
