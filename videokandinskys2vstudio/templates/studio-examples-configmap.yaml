# The Studio examples' files (studio.yaml examples), mounted into ComfyUI at /etc/comfyapp/studio-examples.
apiVersion: v1
kind: ConfigMap
metadata:
  name: videokandinskys2vstudio-studio-examples
  namespace: {{ .Release.Namespace }}
binaryData:
  official-reference.jpg: {{ .Files.Get "files/studio-examples/official-reference.jpg" | b64enc }}
  official-result.mp4: {{ .Files.Get "files/studio-examples/official-result.mp4" | b64enc }}
  official-speech.m4a: {{ .Files.Get "files/studio-examples/official-speech.m4a" | b64enc }}
