metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V macht aus einem Porträt und einer Sprachaufnahme ein lippensynchrones Sprechvideo von bis zu zwei Minuten"
spec:
  fullDescription: |
    Laden Sie ein Porträt und eine Sprachaufnahme hoch, und Kandinsky S2V animiert Gesicht und Oberkörper passend dazu, mit Lippensynchronität, Kopf- und Schulterbewegungen und natürlicher Mimik. Das Video folgt der Länge der Aufnahme, bis zu zwei Minuten, mit 25 fps. Ergebnisse, Uploads und die Warteschlange bleiben auf Ihrem Olares und sind auf jedem Gerät verfügbar, auf dem Sie die App öffnen.

    Die App führt das Modell auf Ihrem Olares aus:
    - Ein Prompt-Feld mit Medienleiste: Fügen Sie das Bild und das Audio hinzu, die das Modell verwendet.
    - Die Videolänge folgt der Sprache, bis zu zwei Minuten, erzeugt in Abschnitten von fünf Sekunden mit 25 fps.
    - Probieren Sie direkt nach der Installation das mitgelieferte Beispiel aus: das offizielle Porträt und die Sprachaufnahme von Kandinsky Lab.
    - Eine Warteschlange und ein Ergebnis-Feed, geteilt auf allen Geräten, mit Wiederverwenden, Einzelbild entnehmen und Herunterladen bei jedem Ergebnis.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem jeweiligen Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.

    Animieren Sie nur Personen, die zugestimmt haben, und nutzen Sie die App nicht, um sich als jemand anderes auszugeben oder Zuschauer zu täuschen. Code und Gewichte von Kandinsky S2V stehen unter MIT, der Sprach-Encoder Qwen2.5-Omni-7B unter Apache 2.0.
  upgradeDescription: |
    Die KI überarbeitet die Beschreibung in der ausgewählten Sprache und behält die Struktur des Video-Prompts und die Verweise auf die Medien bei. Weicht die Ausgabesprache ab, versucht Studio, sie zu korrigieren. Gelingt das nicht, bleibt der ursprüngliche Prompt erhalten.
