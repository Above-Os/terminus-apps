metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V transforme un portrait et un enregistrement vocal en vidéo parlante synchronisée sur les lèvres, jusqu'à deux minutes"
spec:
  fullDescription: |
    Importez un portrait et un enregistrement vocal, et Kandinsky S2V anime le visage et le haut du corps en conséquence, avec synchronisation labiale, mouvements de la tête et des épaules et expressions naturelles. La vidéo suit la durée de l'audio, jusqu'à deux minutes, à 25 i/s. Les résultats, les imports et la file d'attente restent sur votre Olares et sont partagés sur tous les appareils où vous ouvrez l'app.

    L'app exécute le modèle sur votre Olares :
    - Une zone de prompt avec un plateau de médias : ajoutez l'image et l'audio que le modèle utilise.
    - La durée de la vidéo suit la parole, jusqu'à deux minutes, générée par segments de cinq secondes à 25 i/s.
    - Essayez l'exemple fourni dès l'installation : le portrait et l'enregistrement officiels de Kandinsky Lab.
    - Une file d'attente et un fil de résultats partagés sur tous les appareils, avec réutiliser, extraire une image et télécharger pour chaque résultat.
    - Les imports et les résultats restent dans une bibliothèque sur votre Olares, même après un redémarrage.
    - L'éditeur ComfyUI complet s'ouvre avec chaque workflow chargé, pour aller au-delà de l'app.
    - Un administrateur l'installe une seule fois pour tous sur votre Olares ; la file d'attente, les imports et les résultats de chacun lui restent propres, et les projets permettent de les partager avec certaines personnes ou avec tous.
    - Les fichiers sont conservés dans Common/Studio, dans un dossier par personne.
    - Les modèles sont téléchargés au premier démarrage et partagés avec les autres apps ComfyUI et FlowStudio.

    N'animez que des personnes qui y ont consenti, et n'utilisez pas l'app pour usurper l'identité de quelqu'un ou tromper le public. Le code et les poids de Kandinsky S2V sont sous licence MIT ; l'encodeur vocal Qwen2.5-Omni-7B est sous Apache 2.0.
  upgradeDescription: |
    Le paquet d’installation a été allégé pour corriger des erreurs d’installation et de mise à jour. La vidéo de prévisualisation de l’exemple fourni est plus légère.
