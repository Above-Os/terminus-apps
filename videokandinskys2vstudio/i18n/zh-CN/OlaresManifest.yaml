metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V 把一张肖像和一段语音变成口型同步的说话视频，最长两分钟"
spec:
  fullDescription: |
    上传一张肖像和一段语音，Kandinsky S2V 会让脸部和上半身随语音动起来，口型同步，头部和肩膀自然摆动，表情自然。视频长度跟随音频，最长两分钟，25 fps。结果、上传的素材和队列都保存在你的 Olares 上，在任何设备上打开应用都能看到。

    这个应用在你的 Olares 上运行该模型：
    - 一个输入框加素材栏：添加模型需要的图片和音频。
    - 视频长度跟随语音，最长两分钟，按每段五秒、25 fps 生成。
    - 安装后就能试用自带的示例：Kandinsky Lab 官方的肖像和语音。
    - 队列和结果流在所有设备上同步，每个结果都可以复用、截取画面和下载。
    - 上传的素材和生成结果保存在 Olares 的素材库中，重启后仍在。
    - 可以打开完整的 ComfyUI 编辑器，每个工作流都已载入，用于应用之外的修改。
    - 管理员安装一次，Olares 上的所有人都能用；每个人的队列、上传和结果各自独立，可以通过项目分享给指定的人或所有人。
    - 文件保存在 Common/Studio 下，每人一个文件夹。
    - 模型在首次启动时下载，并与其他 ComfyUI 应用和 FlowStudio 共享。

    只给同意过的人生成动画，不要用这个应用冒充他人或误导观众。Kandinsky S2V 的代码和权重采用 MIT 许可，Qwen2.5-Omni-7B 语音编码器采用 Apache 2.0 许可。
  upgradeDescription: |
    添加人像和语音时可以查看上传限制，并在素材库选用语音前试听。可以查看排队时间、生成进度，以及有估算数据时的预计剩余时间。已完成的视频会显示实际生成耗时。

    [查看此版本](https://github.com/beclab/flowstudio2/releases/tag/videokandinskys2vstudio/v0.1.5)
