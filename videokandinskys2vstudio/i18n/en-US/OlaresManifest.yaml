metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V turns a portrait and a speech recording into a talking video with synced lips, up to two minutes long"
spec:
  fullDescription: |
    Upload a portrait and a speech recording and Kandinsky S2V animates the face and upper body to match, with lip sync, head and shoulder motion and natural expressions. The video follows the length of the audio, up to two minutes, at 25 fps. Results, uploads and the queue are kept on your Olares and shared by every device you open the app on.

    The app runs the model on your Olares:
    - One prompt box with an asset tray: add the image and audio the model takes.
    - Video length follows the speech, up to two minutes, generated in five-second chunks at 25 fps.
    - Try the bundled example right after installing: the official portrait and speech from Kandinsky Lab.
    - A queue and a result feed shared by every device you open it on, with reuse, grab a frame and download on each result.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with each workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.

    Only animate people who have agreed to it, and do not use the app to impersonate anyone or mislead viewers. The Kandinsky S2V code and weights are MIT; the Qwen2.5-Omni-7B speech encoder is Apache 2.0.
  upgradeDescription: |
    Improved language handling for AI prompt rewriting. Descriptions follow the selected language while keeping the video prompt structure and asset references. Studio attempts to correct language mismatches and keeps your original prompt if it cannot correct the result.
