metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V trasforma un ritratto e una registrazione vocale in un video parlante con labiale sincronizzato, fino a due minuti"
spec:
  fullDescription: |
    Carica un ritratto e una registrazione vocale, e Kandinsky S2V anima il viso e la parte superiore del corpo a tempo, con labiale sincronizzato, movimenti di testa e spalle ed espressioni naturali. Il video segue la durata dell'audio, fino a due minuti, a 25 fps. Risultati, caricamenti e coda restano sul tuo Olares e sono condivisi su ogni dispositivo in cui apri l'app.

    L'app esegue il modello sul tuo Olares:
    - Un campo prompt con una barra dei contenuti: aggiungi l'immagine e l'audio che il modello usa.
    - La durata del video segue la voce, fino a due minuti, generato in segmenti di cinque secondi a 25 fps.
    - Prova subito dopo l'installazione l'esempio incluso: il ritratto e la voce ufficiali di Kandinsky Lab.
    - Una coda e un feed di risultati condivisi su tutti i dispositivi, con riuso, estrai un fotogramma e scarica su ogni risultato.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con ogni workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.

    Anima solo persone che hanno dato il consenso, e non usare l'app per impersonare qualcuno o ingannare chi guarda. Codice e pesi di Kandinsky S2V sono MIT; l'encoder vocale Qwen2.5-Omni-7B è Apache 2.0.
  upgradeDescription: |
    Il trascinamento di file locali nell’area di creazione video è stato disattivato per evitare che l’avviso rimanga visibile. Usa il selettore file per aggiungere contenuti locali.
