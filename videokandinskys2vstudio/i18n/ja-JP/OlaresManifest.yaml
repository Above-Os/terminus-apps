metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V は肖像写真と音声から、口の動きが合った最長 2 分の話す動画を作ります"
spec:
  fullDescription: |
    肖像写真と音声をアップロードすると、Kandinsky S2V が顔と上半身を音声に合わせて動かします。口の動きが同期し、頭や肩が動き、表情も自然です。動画の長さは音声に合わせて最長 2 分、25 fps です。結果、アップロードした素材、キューは Olares に保存され、アプリを開くすべてのデバイスで共有されます。

    このアプリは、Olares 上でこのモデルを動かします。
    - 素材トレイ付きのプロンプト欄：モデルが使う画像と音声を追加します。
    - 動画の長さは音声に合わせて最長 2 分。5 秒ずつ 25 fps で生成します。
    - インストール直後に付属のサンプルを試せます：Kandinsky Lab 公式の肖像写真と音声です。
    - キューと結果のフィードはすべてのデバイスで共有され、各結果から再利用、フレームの切り出し、ダウンロードができます。
    - アップロードと結果は Olares 上のライブラリに保存され、再起動後も残ります。
    - 各ワークフローを読み込んだ状態で ComfyUI エディターを開き、アプリ以外の変更もできます。
    - 管理者が一度インストールすれば Olares の全員が使えます。キュー、アップロード、結果は各自のもので、プロジェクトを使って選んだ人や全員と共有できます。
    - ファイルは Common/Studio の下に、ユーザーごとのフォルダーで保存されます。
    - モデルは初回起動時にダウンロードされ、他の ComfyUI アプリや FlowStudio と共有されます。

    本人の同意を得た人物だけを動かし、他人へのなりすましや視聴者を欺く目的で使わないでください。Kandinsky S2V のコードと重みは MIT、Qwen2.5-Omni-7B 音声エンコーダーは Apache 2.0 です。
  upgradeDescription: |
    人物画像と音声のアップロード上限を確認できます。音声はライブラリで試聴してから選択できます。キューでの待ち時間、生成の進み具合、推定値がある場合は残り時間の目安を確認できます。完了した動画には生成の所要時間が表示されます。

    [このリリースを見る](https://github.com/beclab/flowstudio2/releases/tag/videokandinskys2vstudio/v0.1.5)
