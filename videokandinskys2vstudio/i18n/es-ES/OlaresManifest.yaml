metadata:
  title: "Kandinsky S2V"
  description: "Kandinsky S2V convierte un retrato y una grabación de voz en un vídeo hablado con los labios sincronizados, de hasta dos minutos"
spec:
  fullDescription: |
    Sube un retrato y una grabación de voz, y Kandinsky S2V anima la cara y la parte superior del cuerpo al ritmo del audio, con sincronización labial, movimiento de cabeza y hombros y expresiones naturales. El vídeo sigue la duración del audio, hasta dos minutos, a 25 fps. Los resultados, las subidas y la cola se guardan en tu Olares y se comparten en todos los dispositivos donde abras la app.

    La app ejecuta el modelo en tu Olares:
    - Un cuadro de prompt con bandeja de recursos: añade la imagen y el audio que usa el modelo.
    - La duración del vídeo sigue a la voz, hasta dos minutos, generado en fragmentos de cinco segundos a 25 fps.
    - Prueba el ejemplo incluido nada más instalar: el retrato y la voz oficiales de Kandinsky Lab.
    - Una cola y un feed de resultados compartidos en todos los dispositivos, con reutilizar, capturar un fotograma y descargar en cada resultado.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con cada flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.

    Anima solo a personas que hayan dado su consentimiento, y no uses la app para suplantar a nadie ni engañar a quien la vea. El código y los pesos de Kandinsky S2V son MIT; el codificador de voz Qwen2.5-Omni-7B es Apache 2.0.
  upgradeDescription: |
    Se ha reducido el tamaño del paquete para corregir errores de instalación y actualización. El ejemplo incluido contiene un vídeo de vista previa de menor tamaño.
