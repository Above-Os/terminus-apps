{{/*
The daemon's local API token.

It is the whole of the protection in front of this app's API: the container binds 0.0.0.0, because
in a pod the boundary is the pod and a loopback bind cannot be reached by the gateway in front of
it. That is exactly why the token must not live in the image.

Preserved across upgrades where the renderer can see the cluster. Where it cannot, a new token is
generated and the pod restarts with it — the interface reads its token from the page the daemon
serves, so a person sees no difference; anything outside the pod that had stored the old one has to
be given the new one.
*/}}
{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := randAlphaNum 48 -}}
{{- if $existing -}}
{{- $stored := index $existing.data "AGENTD_TOKEN" | default "" -}}
{{- if $stored -}}
{{- $token = b64dec $stored -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AGENTD_TOKEN: {{ $token | quote }}
