metadata:
  title: Agent Daemon
  description: 在你自己的 Olares 上跑编码 agent，并接进你的机队
spec:
  fullDescription: |
    **这是什么**
    Agent Daemon 让编码 agent 在你的文件所在的地方运行，并把它做过什么记下来。它和跑在笔记本上的
    是同一个 daemon，只是换成了容器需要的形态：跑哪个 CLI、能在哪些目录里干活，都由这个应用的部署
    告诉它，而不是它自己去扫。

    **它给你什么**
    - 一条 run 是一份记录，不是一段聊天记录：每一轮、每一次工具调用、每一轮产生的 diff、token 用量，
      以及谁批准了什么。
    - 审批带到期时间。窗口耗尽时是**拒绝**而不是放行，界面会明说是哪一种。
    - 机器上的事，外面选不了。机队服务端只能点名这台机器上报过的目录，不能给它一个路径。
    - 在应用里就能接进机队：打开入口，发起一次配对，在机队界面上批准一次，这个容器就出现在你其他
      机器旁边了。

    **第一次使用**
    打开 `Agent Daemon` 入口。agent 是 codex，第一次启动时装进这个应用自己的数据目录里，在那里登录
    一次即可。默认在应用的 `workspace` 目录里干活；打开 `ALLOW_HOME_DIR_ACCESS` 可以把你的 Olares
    Home 也加进去。
  upgradeDescription: |
    0.1.0 是托管形态的第一个版本：声明式的 CLI、由部署挂进来的目录，以及可以从入口打开的 daemon 界面。
