# The daemon image. It carries agentd and nothing else that matters: the codex CLI is installed by
# the init container into the app's own data, exactly as the Codex app does it, so upgrading one
# does not force a rebuild of the other.
image: docker.io/beclab/agentd:0.1.0
imagePullPolicy: IfNotPresent

codex:
  # The codex release the init container installs. Kept separate from appVersion, which is
  # agentd's own version: the two move for different reasons.
  version: "0.149.1"

workloads:
  agentd:
    replicaCount: 1
