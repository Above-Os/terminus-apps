olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  agentd: 1
metadata:
  name: agentd
  icon: https://raw.githubusercontent.com/Above-Os/terminus-apps/main/agentd/assets/icon.png
  description: Run coding agents on your Olares, and reach them from your fleet
  appid: agentd
  title: Agent Daemon
  version: 0.1.0
  categories:
  - Developer Tools
  - agents
  tags:
  - coding
  - agents

entrances:
- name: agentd
  host: agentd-svc
  port: 4477
  title: Agent Daemon
  icon: https://raw.githubusercontent.com/Above-Os/terminus-apps/main/agentd/assets/icon.png
  openMethod: window
  authLevel: private
spec:
  versionName: '0.1.0'
  fullDescription: |
    **Overview**
    Agent Daemon runs coding agents where your files are and keeps a record of what they did. It
    is the same daemon that runs on a laptop, in the shape a container needs: the CLI it runs and
    the directories it may work in come from this app's deployment rather than from a scan.

    **What it gives you**
    - A run is a record, not a transcript: turns, tool calls, the diff each turn produced, token
      usage, and who approved what.
    - Approvals with a deadline. When a window runs out the request is refused rather than
      granted, and the interface says which of the two happened.
    - Nothing on the machine is chosen from outside. A fleet server can name a directory this
      daemon reported; it cannot hand it a path.
    - Connect it to your fleet from inside the app: open the entrance, start a pairing, approve it
      once in the fleet interface, and this container appears next to your other machines.

    **First-time setup**
    Open the `Agent Daemon` entrance. The agent is codex, installed into this app's own data on
    first start; sign it in there once. Work happens in the app's `workspace` directory, and you
    can add your Olares Home by turning on `ALLOW_HOME_DIR_ACCESS`.
  upgradeDescription: |
    0.1.0 is the first release of the hosted shape: declared CLI, deployment-mounted directories,
    and the daemon's own interface reachable through its entrance.
  developer: beclab
  website: https://github.com/beclab/agent-daemon
  sourceCode: https://github.com/beclab/agent-daemon
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  license:
  - text: Apache-2.0
    url: https://github.com/beclab/agent-daemon/blob/main/LICENSE
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 1Gi
  limitedDisk: 50Gi
  requiredCpu: 250m
  limitedCpu: "4"
  supportArch:
  - amd64
  - arm64
permission:
  appData: true
  appCache: true
  userData:
  - Home
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
- envName: ALLOW_HOME_DIR_ACCESS
  type: bool
  required: false
  applyOnChange: true
  editable: true
  default: "false"
  description: "Let agents read and write your Olares Home directory. Off by default: what an agent may touch is a decision, not a default."
- envName: AGENTD_MAX_CONCURRENT
  type: string
  required: false
  applyOnChange: true
  editable: true
  default: "3"
  description: "How many agents this container will run at once. Each one holds a working directory and its own share of the CPU."
