metadata:
  title: "SeedVR2"
  description: "SeedVR2 restauriert und skaliert niedrig aufgelöste oder beschädigte Videos hoch, mit einer kurzen Vorschau zum Vergleich, bevor das ganze Video läuft"
spec:
  fullDescription: |
    Skalieren und restaurieren Sie Videos mit SeedVR2, einem Ein-Schritt-Diffusionsmodell von ByteDance Seed, das Details von Bild zu Bild konsistent hält. Wählen Sie das 3B-Modell (schneller, kleinerer Download) oder das 7B-Modell (mehr Details) und einen Vergrößerungsfaktor, sehen Sie sich einige Sekunden neben dem Original an und skalieren Sie dann das ganze Video mit denselben Einstellungen. Geeignet für altes oder komprimiertes Material und niedrig aufgelöste Clips.

    Die App führt das Modell auf Ihrem Olares aus, um Videos hochzuskalieren:
    - Fügen Sie ein Video hinzu und sehen Sie Größe, Länge und die Größe des Ergebnisses, bevor etwas läuft.
    - Zwei Modellgrößen, 3B und 7B, bei der Installation oder später in den Einstellungen heruntergeladen; pro Auftrag umschaltbar.
    - Sehen Sie sich zuerst einige Sekunden an und vergleichen Sie sie nebeneinander mit dem Original, dann skalieren Sie das ganze Video mit denselben Einstellungen.
    - Eine Warteschlange und ein Ergebnis-Feed, geteilt auf allen Geräten; der Ton der Quelle bleibt erhalten.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.
  upgradeDescription: |
    Erste Veröffentlichung.
