metadata:
  title: "SeedVR2"
  description: "SeedVR2 restaura y amplía vídeos de baja resolución o degradados, con una vista previa corta para comparar antes de procesar todo el vídeo"
spec:
  fullDescription: |
    Amplía y restaura vídeo con SeedVR2, un modelo de difusión de un solo paso de ByteDance Seed que mantiene el detalle coherente de un fotograma a otro. Elige el modelo 3B (más rápido, descarga más pequeña) o el 7B (más detalle) y un factor de ampliación, previsualiza unos segundos junto al original y después amplía el vídeo entero con los mismos ajustes. Adecuado para material antiguo o comprimido y clips de baja resolución.

    La app ejecuta el modelo en tu Olares para ampliar vídeo:
    - Añade un vídeo y consulta su tamaño, su duración y el tamaño del resultado antes de procesar nada.
    - Dos tamaños de modelo, 3B y 7B, descargados al instalar o más tarde desde Ajustes; se elige en cada tarea.
    - Previsualiza primero unos segundos y compáralos con el original lado a lado, y después amplía el vídeo entero con los mismos ajustes.
    - Una cola y un feed de resultados compartidos en todos los dispositivos; se conserva el sonido del original.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con el flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.
  upgradeDescription: |
    Primera versión.
