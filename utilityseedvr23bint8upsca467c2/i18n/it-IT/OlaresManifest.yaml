metadata:
  title: "SeedVR2"
  description: "SeedVR2 restaura e ingrandisce video a bassa risoluzione o degradati, con una breve anteprima da confrontare prima di elaborare tutto il video"
spec:
  fullDescription: |
    Ingrandisci e restaura video con SeedVR2, un modello di diffusione a un passo di ByteDance Seed che mantiene i dettagli coerenti da un fotogramma all'altro. Scegli il modello 3B (più veloce, download più leggero) o il 7B (più dettagli) e un fattore di ingrandimento, guarda in anteprima qualche secondo accanto all'originale, poi ingrandisci tutto il video con le stesse impostazioni. Adatto a filmati vecchi o compressi e a clip a bassa risoluzione.

    L'app esegue il modello sul tuo Olares per ingrandire video:
    - Aggiungi un video e vedi dimensioni, durata e dimensioni del risultato prima di avviare qualsiasi elaborazione.
    - Due dimensioni del modello, 3B e 7B, scaricate all'installazione o più tardi dalle Impostazioni; si sceglie per ogni lavoro.
    - Guarda prima qualche secondo in anteprima e confrontalo con l'originale fianco a fianco, poi ingrandisci tutto il video con le stesse impostazioni.
    - Una coda e un feed di risultati condivisi su tutti i dispositivi; l'audio della sorgente viene mantenuto.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con il workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.
  upgradeDescription: |
    Prima versione.
