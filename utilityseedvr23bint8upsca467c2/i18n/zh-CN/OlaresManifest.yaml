metadata:
  title: "SeedVR2"
  description: "SeedVR2 修复并放大低分辨率或画质受损的视频，可先试渲染一小段对比，再处理整段视频"
spec:
  fullDescription: |
    用 SeedVR2 放大和修复视频。它是字节跳动 Seed 团队的一步扩散模型，帧与帧之间的细节保持一致。可以选 3B 模型（更快、下载更小）或 7B 模型（细节更多），选择放大倍数，先预览几秒并与原片并排对比，再用同样的设置放大整段视频。适合老旧或压缩过的素材和低分辨率片段。

    这个应用在你的 Olares 上运行该模型，用来放大视频：
    - 添加一段视频，处理前就能看到它的尺寸、时长和结果的尺寸。
    - 3B 和 7B 两种模型大小，安装时下载或稍后在设置中下载，每个任务都可以切换。
    - 先预览几秒并与原片并排对比，再用同样的设置放大整段视频。
    - 队列和结果流在所有设备上同步，保留原视频的声音。
    - 上传的素材和生成结果保存在 Olares 的素材库中，重启后仍在。
    - 可以打开完整的 ComfyUI 编辑器，工作流已载入，用于应用之外的修改。
    - 管理员安装一次，Olares 上的所有人都能用；每个人的队列、上传和结果各自独立，可以通过项目分享给指定的人或所有人。
    - 文件保存在 Common/Studio 下，每人一个文件夹。
    - 模型在首次启动时下载，并与其他 ComfyUI 应用和 FlowStudio 共享。
  upgradeDescription: |
    首次发布。
