metadata:
  title: "SeedVR2"
  description: "SeedVR2 は低解像度や劣化した動画を修復・高解像度化します。全体を処理する前に短いプレビューで比較できます"
spec:
  fullDescription: |
    SeedVR2 で動画を高解像度化・修復します。ByteDance Seed のワンステップ拡散モデルで、フレーム間のディテールが一貫します。3B モデル（高速でダウンロードが小さい）か 7B モデル（よりディテールが多い）を選び、拡大倍率を選んで、数秒を元の動画と並べてプレビューしてから、同じ設定で動画全体を高解像度化します。古い映像や圧縮された映像、低解像度のクリップに向いています。

    このアプリは、Olares 上でこのモデルを動かして動画を高解像度化します。
    - 動画を追加すると、処理の前にサイズ、長さ、結果のサイズがわかります。
    - 3B と 7B の 2 つのモデルサイズ。インストール時か後から設定でダウンロードし、ジョブごとに切り替えられます。
    - まず数秒をプレビューして元の動画と並べて比較し、同じ設定で動画全体を高解像度化します。
    - キューと結果のフィードはすべてのデバイスで共有され、元の動画の音声も残ります。
    - アップロードと結果は Olares 上のライブラリに保存され、再起動後も残ります。
    - ワークフローを読み込んだ状態で ComfyUI エディターを開き、アプリ以外の変更もできます。
    - 管理者が一度インストールすれば Olares の全員が使えます。キュー、アップロード、結果は各自のもので、プロジェクトを使って選んだ人や全員と共有できます。
    - ファイルは Common/Studio の下に、ユーザーごとのフォルダーで保存されます。
    - モデルは初回起動時にダウンロードされ、他の ComfyUI アプリや FlowStudio と共有されます。
  upgradeDescription: |
    初回リリース。
