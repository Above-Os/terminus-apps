metadata:
  title: "SeedVR2"
  description: "SeedVR2 restaure et agrandit les vidéos basse résolution ou dégradées, avec un court aperçu à comparer avant de traiter toute la vidéo"
spec:
  fullDescription: |
    Agrandissez et restaurez des vidéos avec SeedVR2, un modèle de diffusion en une étape de ByteDance Seed qui garde des détails cohérents d'une image à l'autre. Choisissez le modèle 3B (plus rapide, téléchargement plus léger) ou le modèle 7B (plus de détails) et un facteur d'agrandissement, prévisualisez quelques secondes côte à côte avec l'original, puis agrandissez toute la vidéo avec les mêmes réglages. Adapté aux séquences anciennes ou compressées et aux clips basse résolution.

    L'app exécute le modèle sur votre Olares pour agrandir des vidéos :
    - Ajoutez une vidéo et voyez sa taille, sa durée et la taille du résultat avant tout traitement.
    - Deux tailles de modèle, 3B et 7B, téléchargées à l'installation ou plus tard dans les réglages ; à choisir pour chaque tâche.
    - Prévisualisez d'abord quelques secondes et comparez-les côte à côte avec l'original, puis agrandissez toute la vidéo avec les mêmes réglages.
    - Une file d'attente et un fil de résultats partagés sur tous les appareils ; le son de la source est conservé.
    - Les imports et les résultats restent dans une bibliothèque sur votre Olares, même après un redémarrage.
    - L'éditeur ComfyUI complet s'ouvre avec le workflow chargé, pour aller au-delà de l'app.
    - Un administrateur l'installe une seule fois pour tous sur votre Olares ; la file d'attente, les imports et les résultats de chacun lui restent propres, et les projets permettent de les partager avec certaines personnes ou avec tous.
    - Les fichiers sont conservés dans Common/Studio, dans un dossier par personne.
    - Les modèles sont téléchargés au premier démarrage et partagés avec les autres apps ComfyUI et FlowStudio.
  upgradeDescription: |
    Première version.
