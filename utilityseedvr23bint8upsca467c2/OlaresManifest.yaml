spec:
  versionName: "0.2.7"
  onlyAdmin: true
  fullDescription: |
    Upscale and restore video with SeedVR2, a one-step diffusion model from ByteDance Seed that keeps detail consistent from frame to frame. Choose the 3B model (faster, smaller download) or the 7B model (more detail), pick an upscale factor, preview a few seconds side by side with the original, then upscale the whole video with the same settings. Suited to old or compressed footage and low-resolution clips.

    The app runs the model on your Olares for upscaling video:
    - Add a video and see its size, length and the size of the result before anything runs.
    - Two model sizes, 3B and 7B, downloaded at install or later from Settings; switch between them per job.
    - Preview a few seconds first and compare them with the original side by side, then upscale the whole video with the same settings.
    - A queue and a result feed shared by every device you open it on; the sound of the source is kept.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with the workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.
  upgradeDescription: |
    First release.
  developer: Olares
