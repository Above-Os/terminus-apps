metadata:
  title: Frigate NVR
  description: NVR mit lokaler Objekterkennung in Echtzeit für IP-Kameras
spec:
  upgradeDescription: |
    Speicher: dauerhafte Aufzeichnungen unter `/media/frigate` wurden von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopiert ein initContainer Legacy-`appCache/media` nach `appData/media`, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done_media`). Alte appCache-Daten bleiben für ein Rollback erhalten.
  fullDescription: |
    Frigate ist ein vollständiges und lokales NVR, entwickelt für Home Assistant mit KI-Objekterkennung. Nutzt OpenCV und Tensorflow, um lokal in Echtzeit Objekte für IP-Kameras zu erkennen.

    **Hauptfunktionen**
    - Enge Integration mit Home Assistant über eine Custom Component
    - Entwickelt, um Ressourcenverbrauch zu minimieren und Leistung zu maximieren, indem nur bei Bedarf und am richtigen Ort nach Objekten gesucht wird
    - Intensive Nutzung von Multiprocessing mit Schwerpunkt auf Echtzeit statt Verarbeitung jedes Frames
    - Sehr leichtgewichtige Bewegungserkennung, um zu bestimmen, wo Objekterkennung laufen soll
    - Objekterkennung mit TensorFlow in separaten Prozessen für maximale FPS
    - Kommunikation über MQTT zur einfachen Integration in andere Systeme
    - Videoaufnahme mit Aufbewahrungseinstellungen basierend auf erkannten Objekten
    - 24/7-Aufnahme
    - Re-Streaming über RTSP zur Reduzierung der Verbindungen zur Kamera
    - WebRTC- und MSE-Unterstützung für Live-Ansicht mit geringer Latenz
