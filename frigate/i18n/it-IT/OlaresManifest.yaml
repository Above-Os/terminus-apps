metadata:
  title: Frigate NVR
  description: NVR con rilevamento oggetti locale in tempo reale per telecamere IP
spec:
  upgradeDescription: |
    Archiviazione: le registrazioni durevoli di `/media/frigate` sono state spostate da `appCache` a `appData`. Al primo avvio dopo l'upgrade, un initContainer copia il legacy `appCache/media` in `appData/media` quando la destinazione è vuota (marker: `.migration_from_appcache_done_media`). I vecchi dati appCache restano intatti per il rollback.
  fullDescription: |
    Frigate è un NVR completo e locale progettato per Home Assistant con rilevamento oggetti basato su IA. Usa OpenCV e Tensorflow per eseguire il rilevamento oggetti in tempo reale localmente per le telecamere IP.

    **Funzionalità principali**
    - Integrazione stretta con Home Assistant tramite un componente personalizzato
    - Progettato per ridurre al minimo l'uso di risorse e massimizzare le prestazioni cercando oggetti solo quando e dove necessario
    - Sfrutta intensamente il multiprocessing con enfasi sul tempo reale piuttosto che sull'elaborazione di ogni fotogramma
    - Usa un rilevamento movimento a bassissimo overhead per determinare dove eseguire il rilevamento oggetti
    - Il rilevamento oggetti con TensorFlow gira in processi separati per massimizzare gli FPS
    - Comunica via MQTT per una facile integrazione in altri sistemi
    - Registra video con impostazioni di retention basate sugli oggetti rilevati
    - Registrazione 24/7
    - Re-streaming via RTSP per ridurre il numero di connessioni alla telecamera
    - Supporto WebRTC e MSE per la visualizzazione live a bassa latenza
