metadata:
  title: Frigate NVR
  description: NVR avec détection locale d'objets en temps réel pour caméras IP
spec:
  upgradeDescription: |
    Stockage : les enregistrements durables de `/media/frigate` ont été déplacés de `appCache` vers `appData`. Au premier démarrage après la mise à niveau, un initContainer copie le `appCache/media` hérité vers `appData/media` lorsque la destination est vide (marqueur : `.migration_from_appcache_done_media`). Les anciennes données appCache sont conservées pour un éventuel rollback.
  fullDescription: |
    Frigate est un NVR complet et local conçu pour Home Assistant avec détection d'objets par IA. Il utilise OpenCV et Tensorflow pour effectuer une détection d'objets en temps réel localement pour les caméras IP.

    **Fonctionnalités principales**
    - Intégration étroite avec Home Assistant via un composant personnalisé
    - Conçu pour minimiser l'utilisation des ressources et maximiser les performances en ne cherchant des objets que lorsque et où c'est nécessaire
    - Exploite intensivement le multiprocessing avec un accent sur le temps réel plutôt que sur le traitement de chaque image
    - Utilise une détection de mouvement à très faible overhead pour déterminer où exécuter la détection d'objets
    - La détection d'objets avec TensorFlow s'exécute dans des processus séparés pour un FPS maximal
    - Communique via MQTT pour une intégration facile dans d'autres systèmes
    - Enregistre la vidéo avec des paramètres de rétention basés sur les objets détectés
    - Enregistrement 24/7
    - Re-streaming via RTSP pour réduire le nombre de connexions à la caméra
    - Prise en charge WebRTC et MSE pour une vue en direct à faible latence
