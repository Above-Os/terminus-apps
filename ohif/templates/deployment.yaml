apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohif
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.ohif.replicaCount }}
  selector:
    matchLabels:
      app: ohif
  template:
    metadata:
      labels:
        app: ohif
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ohif
          image: ohif/app:v3.12.10@sha256:fa04237bc64ec3c6026c39627e7fcbaba1e74418365b7c3a80670cc3989ade08
          command: [nginx]
          args: [-c, /etc/ohif/nginx.conf, -g, 'daemon off;']
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/ohif
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ohif-nginx
