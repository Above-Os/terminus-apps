olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: ohif
  appid: ohif
  title: OHIF Viewer
  description: Browser-based DICOM medical imaging viewer
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.0.2
  categories:
    - Utilities_v112
    - workspace
entrances:
  - name: ohif
    host: ohif
    port: 8080
    title: OHIF Viewer
    authLevel: private
spec:
  developer: Open Health Imaging Foundation
  website: https://ohif.org/
  sourceCode: https://github.com/OHIF/Viewers
  submitter: TShentu
  fullDescription: |
    OHIF Viewer lets you view DICOM medical images in a web browser, with tools for navigating studies, measurements, and annotations.

    This test package uses the official sample data sources and supports opening local DICOM files. Connecting a private PACS requires additional DICOMweb configuration.

    OHIF Viewer is for investigational use only.
  versionName: '3.12.10'
  runAsUser: true
  supportArch:
    - amd64
  requiredCpu: 100m
  limitedCpu: '1'
  requiredMemory: 128Mi
  limitedMemory: 512Mi
  requiredDisk: 1Gi
options:
  apiTimeout: 120
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
workloadReplicas:
  ohif: 1
