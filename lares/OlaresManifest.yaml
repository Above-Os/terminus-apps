olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: "v3"

workloadReplicas:
  lares: 1
metadata:
  name: lares
  icon: https://app.cdn.olares.com/appstore/lares/icon.png
  description: The pi coding agent with a web UI, wired to the built-in LLM gateway
  appid: lares
  title: Lares
  version: "0.0.5"
  categories:
    - Productivity_v112
permission:
  appData: true
spec:
  versionName: "0.3.5"
  fullDescription: |
    Lares is the pi coding agent packaged as an Olares app: one container with a
    Node backend that embeds the pi SDK and a Quasar web UI, wired to Olares'
    built-in LLM gateway so there is nothing to configure after install.

    - Chat with streaming output, rendered tool calls, Markdown with Mermaid and
      KaTeX, image attachments, steering and follow-up queues, abort, and manual
      or automatic compaction.
    - Sessions grouped by working directory, with a branch tree you can rewind
      into, forking at or just before a message, renaming, deletion, and HTML or
      JSONL export.
    - Files as a lazy tree with git status, previews for source, Markdown,
      images, audio, video, PDF and DOCX, unified diffs, and @-mention
      autocomplete backed by a git-aware index.
    - Configuration for models, provider API keys and OAuth logins, thinking
      level, skills, plugins, and per-session tool toggles.
    - Worktrees: create a checkout per branch, switch the file tree and new
      sessions onto it, and remove it when the work lands.

    Usage:
    - Open the app and start chatting right away; the built-in LLM gateway is
      already wired up.
    - Optionally set a default model, a custom gateway URL, or your own gateway
      API key in the app settings.
  developer: badlogic
  website: https://github.com/badlogic/pi-mono
  sourceCode: https://github.com/beclab/lares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/Olares/blob/main/LICENSE
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
  limitedDisk: 20Gi
  requiredCpu: 200m
  limitedCpu: 2000m
  supportArch:
    - amd64
    - arm64
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: ">=1.12.6-0"
entrances:
  - name: lares
    port: 30141
    host: lares
    title: Lares
    icon: https://app.cdn.olares.com/appstore/lares/icon.png
    openMethod: default
    authLevel: private
