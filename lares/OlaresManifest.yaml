apiVersion: v3
olaresManifest.version: '0.15.0'
olaresManifest.type: app
metadata:
  name: lares
  appid: lares
  title: Lares
  description: An AI assistant for managing Olares and researching the web
  icon: https://app.cdn.olares.com/appstore/lares/icon_new.png
  version: 0.26.18
  categories:
    - agents
  tags:
    - framework
    - personal-assistant
spec:
  versionName: "0.26.18"
  runAsUser: true
  fullDescription: |
    Lares is the official AI assistant for Olares. Describe a goal in plain language to manage apps, files, and your system. With Router and a connected AI model, Lares plans the steps and uses tools to carry out tasks on your device through conversation.

    **Key features**

    - Handle everyday requests and tasks that need several steps in one conversation.
    - Use the AI models and tools configured in Router.
    - Control what Lares can do with Read Only, Write, or Full Access permissions.
    - Research public web content with configured search and page-reading tools, then combine the findings into summaries with source links.

    **Before you start**

    Lares requires Olares 1.12.7 or later, Router, and a connected AI model. Select a model and confirm the permission level before starting a task.

    For web research, configure and enable the tools in Router. To use web search, also select a default search service in Lares settings. Tools that only read web pages are called when you ask Lares to read a specific URL.

  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 400m
  limitedCpu: "6"
  requiredMemory: 768Mi
  limitedMemory: 12Gi
  requiredDisk: 2Gi
  limitedDisk: 50Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  loginOlaresCLI: true
entrances:
  - name: lares
    host: lares-svc
    port: 8080
    title: Lares
    icon: https://app.cdn.olares.com/appstore/lares/icon_new.png
    authLevel: private
    openMethod: window
options:
  apiTimeout: 0
  # Brand mark + PWA manifest public so the browser-tab favicon loads before the
  # private-entrance auth redirect (same pattern Ashia uses for its icon assets).
  policies:
    - entranceName: lares
      description: Brand mark and PWA manifest
      uriRegex: ^/lares/(mark\.svg|manifest\.webmanifest)$
      level: public
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
      mandatory: true
workloadReplicas:
  lares: 1
envs:
  - envName: TIMEZONE
    required: true
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_TIMEZONE
    description: "Time zone used by Lares, its agents, and commands (IANA name such as Asia/Shanghai)"
  - envName: ENABLE_DIND
    type: bool
    required: false
    applyOnChange: true
    editable: true
    default: "true"
    description: "Run a privileged Docker-in-Docker sidecar in the pod. Exposes the docker CLI via DOCKER_HOST=tcp://localhost:2375 (uses extra CPU/RAM/disk under app data). Disable if your environment forbids privileged containers"
