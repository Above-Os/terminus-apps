apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.workloads.lares.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        config.linkerd.io/skip-outbound-ports: "4222"
    spec:
      {{- $enableDind := ne (toString (index (.Values.olaresEnv | default dict) "ENABLE_DIND")) "false" }}
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-data-perms
          image: beclab/aboveos-busybox:1.37.0
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /appdata/data /appdata/data/cli /appdata/data/lares /appdata/data/workspace
              chown -R 1000:1000 /appdata/data
          volumeMounts:
            - name: app-data
              mountPath: /appdata
        {{- if .Values.dev.hotReload }}
        - name: fix-dev-perms
          image: beclab/aboveos-busybox:1.37.0
          securityContext:
            runAsUser: 0
          env:
            - name: DEV_SUBPATH
              value: {{ .Values.dev.sourceSubPath | default "devsrc" | quote }}
          command:
            - sh
            - -c
            - mkdir -p "/appdata/$DEV_SUBPATH" && chown -R 1000:1000 "/appdata/$DEV_SUBPATH"
          volumeMounts:
            - name: app-data
              mountPath: /appdata
        - name: seed-dev-src
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: DEV_SUBPATH
              value: {{ .Values.dev.sourceSubPath | default "devsrc" | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              target="/appdata/$DEV_SUBPATH"
              mkdir -p "$target"
              # Reseed the whole overlay (code + prod node_modules) only when the
              # image changes. Same image across restarts keeps dev-synced code.
              # Clear contents (not the dir itself: parent /appdata is root-owned).
              if [ ! -f "$target/.lares-image-id" ] || ! cmp -s /app/.lares-image-id "$target/.lares-image-id"; then
                find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                cp -a /app/. "$target/"
              fi
          volumeMounts:
            - name: app-data
              mountPath: /appdata
        {{- end }}
        {{- if $enableDind }}
        - name: init-docker-cli
          image: docker.io/beclab/docker:29.3.0-dind
          imagePullPolicy: IfNotPresent
          command:
            - cp
            - /usr/local/bin/docker
            - /docker-cli/docker
          volumeMounts:
            - name: docker-cli-bin
              mountPath: /docker-cli
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if .Values.dev.hotReload }}
          command:
            - npm
            - run
            - start:watch
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: TZ
              value: {{ .Values.olaresEnv.TIMEZONE | quote }}
            - name: LARES_WORKSPACE
              value: /data/workspace
            - name: LARES_DATA_DIR
              value: /data/lares
            # mesh-in injects the platform caller JWT only for hosts in this
            # namespace's generated shared-host allowlist. Router publishes its
            # per-user entrance there; router.shared.olares.com is not allowed.
            - name: LLM_GATEWAY_URL
              value: {{ printf "https://router.%s/v1" .Values.user.zone | quote }}
            - name: OLARES_APP_ID
              value: "lares"
            - name: LARES_CATALOG_EVENTS_NATS_URL
              value: {{ printf "nats://nats.user-system-%s:4222" .Values.bfl.username | quote }}
            - name: LARES_CATALOG_EVENTS_NATS_USER
              value: {{ printf "%s-lares-catalog" .Release.Namespace | quote }}
            - name: LARES_CATALOG_EVENTS_NATS_PASS
              valueFrom:
                secretKeyRef:
                  name: lares-nats
                  key: password
            - name: LARES_CATALOG_EVENTS_SUBJECT
              value: "router.catalog"
            - name: LARES_CLI_ROOT
              value: /data/cli
            # dsh /api fence trusts only loopback Hosts; the entrance host is
            # randomized per install, so it must come from the render context.
            # Olares serves the same entrance on the public zone and on the LAN
            # zone <prefix>.<user>.olares.local; both must be trusted.
            - name: DSH_TRUSTED_HOSTS
              value: {{ printf "%s,%s.%s.olares.local" .Values.domain.lares (splitList "." .Values.domain.lares | first) .Values.bfl.username | quote }}
            - name: HOT_RELOAD
              value: {{ .Values.dev.hotReload | quote }}
            - name: NODE_ENV
              value: "production"
            {{- if $enableDind }}
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: app-data
              mountPath: /data
              subPath: data
            {{- if .Values.dev.hotReload }}
            - name: app-data
              mountPath: /app
              subPath: {{ .Values.dev.sourceSubPath | default "devsrc" }}
            {{- end }}
            {{- if $enableDind }}
            - name: docker-cli-bin
              mountPath: /usr/local/bin/docker
              subPath: docker
              readOnly: true
            {{- end }}
        {{- if $enableDind }}
        - name: docker-dind
          image: docker.io/beclab/docker:29.3.0-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: TZ
              value: {{ .Values.olaresEnv.TIMEZONE | quote }}
          command:
            - dockerd
            - --host
            - tcp://0.0.0.0:2375
            - --host
            - unix:///var/run/docker.sock
            - --mtu=1450
          ports:
            - containerPort: 2375
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: app-data
              mountPath: /data
              subPath: data
        {{- end }}
      volumes:
        - name: app-data
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate
        {{- if $enableDind }}
        - name: docker-cli-bin
          emptyDir: {}
        - name: dind-storage
          hostPath:
            path: "{{ .Values.userspace.appData }}/docker"
            type: DirectoryOrCreate
        {{- end }}
