apiVersion: apps/v1
kind: Deployment
metadata:
  name: lares
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: lares
spec:
  replicas: {{ .Values.workloads.lares.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: lares
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: lares
    spec:
      enableServiceLinks: false
      initContainers:
      # DirectoryOrCreate makes the appData subdirectory root-owned, which the
      # uid-1000 app cannot write. The ownership test keeps upgrades working:
      # re-chowning a directory the app already owns fails with EPERM here.
      - name: fix-permissions
        image: beclab/aboveos-busybox:1.37.0
        command:
        - sh
        - -c
        - '[ "$(stat -c %u /data)" = 1000 ] || chown 1000:1000 /data'
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: lares-data
          mountPath: /data
      containers:
      - name: lares
        image: docker.io/beclab/lares:v0.0.3
        imagePullPolicy: IfNotPresent
        env:
        - name: LLM_GATEWAY_URL
          value: "{{ .Values.olaresEnv.LLM_GATEWAY_URL }}"
        - name: LARES_GATEWAY_API_KEY
          value: "{{ .Values.olaresEnv.LARES_GATEWAY_API_KEY }}"
        - name: OLARES_APP_ID
          value: olares
        - name: PI_DEFAULT_MODEL
          value: "{{ .Values.olaresEnv.PI_DEFAULT_MODEL }}"
        ports:
        - containerPort: 30141
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/health
            port: 30141
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 30141
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: lares-data
          mountPath: /data
      restartPolicy: Always
      volumes:
      - name: lares-data
        hostPath:
          path: {{ .Values.userspace.appData }}/lares
          type: DirectoryOrCreate
