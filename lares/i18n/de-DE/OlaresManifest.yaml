metadata:
  title: Lares
  description: Ein KI-Assistent zur Verwaltung von Olares und für Recherchen im Web

spec:
  fullDescription: |
    Lares ist der offizielle KI-Assistent für Olares. Beschreiben Sie ein Ziel in natürlicher Sprache, um Apps, Dateien und Ihr System zu verwalten. Mit Router und einem verbundenen KI-Modell plant Lares die Schritte und nutzt Werkzeuge, um im Dialog Aufgaben auf Ihrem Gerät auszuführen.

    **Hauptfunktionen**

    - Bearbeiten Sie alltägliche Anfragen und Aufgaben mit mehreren Schritten in einem Gespräch.
    - Nutzen Sie die in Router konfigurierten KI-Modelle und Werkzeuge.
    - Legen Sie mit den Berechtigungen Nur lesen, Schreiben oder Vollzugriff fest, welche Aktionen Lares ausführen darf.
    - Recherchieren Sie öffentliche Webinhalte mit konfigurierten Suchwerkzeugen und Werkzeugen zum Lesen von Webseiten und erhalten Sie Zusammenfassungen mit Quellenlinks.

    **Vor dem Start**

    Lares erfordert Olares 1.12.7 oder neuer, Router und ein verbundenes KI-Modell. Wählen Sie ein Modell aus und bestätigen Sie die Berechtigungsstufe, bevor Sie eine Aufgabe starten.

    Konfigurieren und aktivieren Sie für Webrecherchen die Werkzeuge in Router. Wählen Sie für die Websuche zusätzlich einen Standardsuchdienst in den Einstellungen von Lares aus. Werkzeuge, die ausschließlich Webseiten lesen, werden aufgerufen, wenn Sie Lares bitten, eine bestimmte URL zu lesen.
  upgradeDescription: |
    Home-Assistant-Skills lassen sich in den Einstellungen herunterladen und aktivieren. Der Download installiert das Kommandozeilenwerkzeug, exportiert die Skills und schaltet das Paket ein. Serveradresse und langlebiges Token werden auf derselben Seite gespeichert.

    - Ein Werkzeugaufruf, der nur in der Überlegung erschien, wird in derselben Runde ausgeführt.
    - Die Spracheingabe startet nach einer Neuinstallation.
    - Automatisierte Aufgaben führen eine Anweisung nach Zeitplan aus, und Morgenberichte nach Thema werden im Arbeitsbereich abgelegt.
    - Geräte wie Reachy Mini können in Sprachgesprächen ihre eigenen Werkzeuge nutzen, wenn ihr Sprachschlüssel Geräte-Werkzeuge erlaubt.
    - Router erreicht Lares Voice über einen internen Zugang; die Adresse der Lares-Seite endet nun im ersten Teil auf 0.
    - Sprachgeräte ohne Wiedergabemeldung hören ihre eigenen Antworten nicht mehr als neue Runde, und Antworten warten nicht mehr auf Verlaufszusammenfassungen.
    - Die automatische Sprecherkennung beendet eine Runde auch in lauter Umgebung, statt bis zur Audiogrenze zu warten.
    - Sprachgeräte, die ihr Mikrofon dauerhaft senden, überspringen Runden, in denen die Spracherkennung von Router keine Sprache hört.
    - Sprachgeräte geben Hausgerätesteuerung, Abfragen und Termine an Lares weiter und antworten in der Sprache des Nutzers.
    - Ein Sprachgespräch läuft nach einer erledigten Aufgabe weiter, auch mit Chatmodellen, die den Systemprompt zuerst verlangen.
    - Sprachantworten laufen ohne Modell-Denkphase und beginnen in unter einer Sekunde; Geräte führen Gesten aus, statt sie zu beschreiben.
    - Sprachgeräte antworten in der gerade gesprochenen Sprache, bestätigen eine Bitte, bevor der Agent startet, übergehen Füllgeräusche und melden Ergebnisse, ohne auf Raumgeräusche zu warten.
    - Sprachgeräte lassen sich mitten in der Antwort unterbrechen und antworten in einem kurzen Satz; Lares' eigene Push-to-Talk-Clients bleiben unverändert.
    - Ist die Spracherkennung ausgelastet, warten Sprachsitzungen kurz statt abzubrechen, und Sprachgeräte lernen den Pegel eines lauten Raums, statt endlos aufzunehmen.
    - Sprachgeräte in einem Raum mit Lüfter oder Motor nehmen das Geräusch nicht mehr als endlose Aufnahme auf.
    - Sprachgeräte erkennen Sprache im Raum mit einem Sprachmodell statt über die Lautstärke, unterbrechen sich nicht mehr mit der eigenen Stimme und antworten nach einem Kamerablick in einem Satz.
    - Sprachgeräte hören auf zuzuhören, sobald die Worte des Sprechers enden, auch wenn in der Nähe andere reden, und bestätigen eine Aufgabe in wenigen Worten.
    - Ein Husten oder Klopfen in der Nähe eines Sprachgeräts lässt es nicht mehr zehn Sekunden lang zuhören.
    - Home-Assistant-Skills nutzen hass-cli 0.0.2, das ein Licht in wenigen Schritten einschaltet; bestehende Installationen werden beim Start aktualisiert. Auch beim freihändigen Headset hält ein Husten die Aufnahme nicht mehr offen.
    - Sprachgeräte verwerfen einen gesprochenen Befehl nicht mehr als Geräusch, wenn er leiser ist als seine erste Silbe.
    - Sprachgeräte beginnen schon mit dem ersten Audio der Sprachausgabe zu sprechen, bestätigen Aufgaben schneller, und der Agent schaltet ein Licht mit hass-cli 0.0.3 in weniger Schritten ein.
    - Sprachgeräte können eine Antwort schon sprechen, während sie noch geschrieben wird, wenn Mitlesen aktiviert ist und die GPU in Speicherabschnitte geteilt ist.
    - Sprachgeräte geben eine Anfrage für ein Licht oder ein anderes Hausgerät auch dann an Lares weiter, wenn eine frühere Antwort sie nur angekündigt hat oder der Nutzer sagt, dass noch nichts passiert ist.
    - Der Agent folgt dem Modell, mit dem default-chat im Router antwortet, und ein Sprachgerät gibt weiter Aufgaben an Lares, nachdem das zuletzt genutzte Modell gestoppt wurde.
    - Sprachgeräte machen ein neues Bild, wenn sie noch einmal hinsehen sollen, beantworten Begrüßungen selbst, geben angekündigte Lichtänderungen an Lares weiter und sagen kurze Ergebnisse so an, wie Lares sie gemeldet hat.
    - Sprachgeräte schneiden eine Anfrage nicht mehr mitten im Wort ab, verbinden eine nach einer Pause fortgesetzte Anfrage, halten gesprochene Antworten und Ansagen des Agent kurz und protokollieren, was sie während einer Antwort hören.
    - Sprachgeräte fangen sich, wenn das Modell ein Werkzeug aufruft, das das Gerät nicht hat, warten eine Pause nach „äh“ oder einem unvollständigen Wort ab und protokollieren, wie viel jeder Aufnahme nach Stimme klang.
    - Sprachgeräte protokollieren, welche Teile des Agent-Prompts sich zwischen Anfragen ändern, um langsame Starts zu klären.
    - Sprachgeräte protokollieren, welche frühere Nachricht einer Agent-Anfrage sich geändert hat, um langsame Starts nach einer Suche zu klären.
    - Sprachgeräte fügen dem Dialog-Prompt keine Sprachzeile pro Zug mehr hinzu, damit sein zwischengespeichertes Präfix bei jedem Aufruf wiederverwendet wird; die Antwortsprache wählt das Modell.
    - Der Agent eines Sprachgeräts liest lange Werkzeugergebnisse früherer Züge, etwa eine Websuche, nicht mehr erneut, sodass die Anfrage nach einer Suche schneller startet.
    - Der Agent eines Sprachgeräts nutzt nur die Werkzeuge, die ein Sprachgerät braucht (Befehle und Skills, Websuche, Erinnerungen), sodass jede Anfrage etwa 6k Token kürzer ist; die Lares-Apps, auch die Sprachsteuerung am Telefon, behalten alle Werkzeuge.
    - Home-Assistant-Skills nutzen hass-cli 0.0.4: Es akzeptiert mehrere Einstellungen in einem Argument, nennt das nächstliegende Gerät, wenn eines nicht gefunden wird, und beschreibt das Einstellen der Lichtfarbe, sodass der Agent ein Licht in weniger Schritten ändert.
    - Home-Assistant-Skills nutzen hass-cli 0.0.5: Das Zielgerät wird mit --entity angegeben, und bei einem Tippfehler nennt es den richtigen Befehl, sodass der Agent Lichter in weniger Schritten schaltet.
    - Ein Sprachgerät spricht keine Worte mehr aus, die vor dem Schalten von Lichtern oder der Kamera ersetzt wurden, und bittet bei Unverständlichem kurz um Wiederholung.
    - Home-Assistant-Skills nutzen hass-cli 0.0.6: Vor dem Aufruf nennt es ein falsches Feld und das richtige (color_temp wird color_temp_kelvin), sodass der Agent Lichtfarben in weniger Schritten setzt.

    [Versionshinweise](https://github.com/beclab/lares/releases/tag/v0.26.103)
