metadata:
  title: Lares
  description: Chat-Anwendung auf Olares, mit dem Router verbunden

spec:
  fullDescription: |
    ## Überblick
    Lares ist eine Chat-Anwendung für Olares. Sie nutzt den lokalen Olares Router für den LLM-Zugriff und authentifiziert sich über die clusterinterne App-Identität.

    ## Kernfunktionen
    - Drei-Spalten-Chat-Oberfläche mit dem Lares-Produktprofil
    - Router-Authentifizierung im Cluster über `x-caller-appid`
    - Eingebettete Client-Plugins (Spracheingabe, Websuche), wenn im Build aktiviert
    - Optionaler Docker-in-Docker-Sidecar (`ENABLE_DIND`, standardmäßig aktiv), damit der Agent `docker` gegen einen pod-lokalen Daemon ausführen kann

    ## Anforderungen
    - Olares >= 1.12.7
    - Router-App installiert und in Betrieb (als `router`-Abhängigkeit deklariert)
    - Unterstützte Architekturen: amd64, arm64

    ## Erste Schritte
    1. Installieren Sie Lares aus dem Market (Test-Quelle: `market.test`).
    2. Stellen Sie sicher, dass Router installiert ist.
    3. Öffnen Sie den Lares-Eingang und starten Sie einen Chat.
  upgradeDescription: |
    ## Lares 0.26.3

    - Das Stoppen oder Unterbrechen eines Chats bricht jetzt den laufenden Router-Stream ab, statt das Modell nach dem Anhalten der Oberfläche weiter erzeugen zu lassen.