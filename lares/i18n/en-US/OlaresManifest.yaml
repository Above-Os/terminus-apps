metadata:
  title: Lares
  description: Chat on Olares, wired to Router

spec:
  fullDescription: |
    **Overview**
    Lares is a chat application on Olares. It uses the local Olares Router for LLM access and authenticates through in-cluster app identity.

    **Key features**
    - Three-column chat UI with the Lares product profile
    - In-cluster Router authentication via `x-caller-appid`
    - Bundled client plugins (voice input, web search) when enabled in the build
    - Optional Docker-in-Docker sidecar (`ENABLE_DIND`, default on) so the agent can run `docker` against a pod-local daemon

    **Requirements**
    - Olares >= 1.12.7
    - Router app installed and running (`router` dependency)
    - Supported architectures: amd64, arm64

    **Getting started**
    1. Install Lares from Market (test source: `market.test`).
    2. Ensure Router is installed.
    3. Open the Lares entrance and start a chat.
  upgradeDescription: |
    ## Lares 0.26.3

    - Stopping or interrupting a chat now cancels the in-flight Router stream
      instead of leaving the model generating after the UI stops.