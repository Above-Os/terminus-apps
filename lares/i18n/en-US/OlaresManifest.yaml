metadata:
  title: Lares
  description: An AI assistant for managing Olares and researching the web

spec:
  fullDescription: |
    Lares is the official AI assistant for Olares. Describe a goal in plain language to manage apps, files, and your system. With Router and a connected AI model, Lares plans the steps and uses tools to carry out tasks on your device through conversation.

    **Key features**

    - Handle everyday requests and tasks that need several steps in one conversation.
    - Use the AI models and tools configured in Router.
    - Control what Lares can do with Read Only, Write, or Full Access permissions.
    - Research public web content with configured search and page-reading tools, then combine the findings into summaries with source links.

    **Before you start**

    Lares requires Olares 1.12.7 or later, Router, and a connected AI model. Select a model and confirm the permission level before starting a task.

    For web research, configure and enable the tools in Router. To use web search, also select a default search service in Lares settings. Tools that only read web pages are called when you ask Lares to read a specific URL.

  upgradeDescription: |
    Image and video previews fit and stay centered in the pane, so the whole frame is visible without scrolling unless you zoom.
    Media generation now runs directly through Router instead of starting a diagnostic task when the model catalog is empty or models are warming up.
