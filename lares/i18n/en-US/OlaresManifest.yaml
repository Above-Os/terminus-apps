metadata:
  title: Dina
  description: Chat shell on DeepSeek Harness, wired to Olares Router

spec:
  fullDescription: |
    ## Overview
    Dina is a chat app on Olares built on DeepSeek Harness (dsh web).
    It uses the official dsh UI shell and talks to Olares Router for LLM access.

    ## Highlights
    - Official dsh web UI (three-column layout) with Dina product profile
    - Zero-config Router auth via in-cluster app identity (`x-caller-appid`)
    - Optional API key and default model overrides at install time
    - Bundled client plugins (voice input, web search) when enabled in the build

    ## Requirements
    - Olares >= 1.12.7
    - Router app installed and running (`router` dependency)
    - Arch: amd64

    ## Getting started
    1. Install Dina from Market (test source: `market.test`).
    2. Ensure Router is installed; leave `LLM_GATEWAY_URL` at the default unless you use a custom gateway.
    3. Open the Dina entrance and start a chat.
  upgradeDescription: |
    ## Dina 0.19.0

    - Route model picker, web search, and voice settings through Olares Router.
