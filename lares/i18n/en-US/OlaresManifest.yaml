metadata:
  title: Lares
  description: Chat shell on DeepSeek Harness, wired to Olares Router

spec:
  fullDescription: |
    ## Overview
    Lares is a chat app on Olares built on DeepSeek Harness (dsh web).
    It uses the official dsh UI shell and talks to Olares Router for LLM access.

    ## Highlights
    - Official dsh web UI (three-column layout) with Lares product profile
    - Zero-config Router auth via in-cluster app identity (`x-caller-appid`)
    - Bundled client plugins (voice input, web search) when enabled in the build
    - Optional Docker-in-Docker sidecar (`ENABLE_DIND`, default on) so the agent can run `docker` against a pod-local daemon

    ## Requirements
    - Olares >= 1.12.7
    - Router app installed and running (`router` dependency)
    - Arch: amd64

    ## Getting started
    1. Install Lares from Market (test source: `market.test`).
    2. Ensure Router is installed.
    3. Open the Lares entrance and start a chat.
  upgradeDescription: |
    ## Lares 0.24.0

    - Preview workspace files in a session overlay, including media the agent
      just produced, and download them without leaving chat.
    - Import Drive files or a URL into the workspace; ffmpeg_encode uses the
      image's Debian ffmpeg (software H.264).
    - Pods inherit the user's timezone via TIMEZONE / TZ.
