metadata:
  title: Lares
  description: Olares 上で動作するチャットアプリ、Router と連携

spec:
  fullDescription: |
    ## 概要
    Lares は Olares 向けのチャットアプリです。ローカルの Olares Router 経由で LLM にアクセスし、クラスタ内アプリ ID で認証します。

    ## 主な機能
    - Lares 製品プロファイルを備えた 3 列構成のチャット UI
    - `x-caller-appid` によるクラスタ内 Router 認証
    - ビルド有効時に同梱されるクライアントプラグイン（音声入力、Web 検索）
    - 任意の Docker-in-Docker サイドカー（`ENABLE_DIND`、既定で有効）により、エージェントが Pod ローカルの daemon に対して `docker` を実行可能

    ## 動作要件
    - Olares >= 1.12.7
    - Router アプリがインストールされ稼働中（`router` 依存として宣言）
    - 対応アーキテクチャ: amd64、arm64

    ## はじめに
    1. Market から Lares をインストール（テストソース: `market.test`）。
    2. Router がインストール済みであることを確認。
    3. Lares の入口を開いてチャットを開始。
  upgradeDescription: |
    ## Lares 0.26.3

    - チャットの停止または中断時に、UI を止めた後もモデルが生成を続けることなく、進行中の Router ストリームを直ちにキャンセルするようになりました。