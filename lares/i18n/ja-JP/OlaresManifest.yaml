metadata:
  title: Lares
  description: Olaresの管理とウェブ調査を行うAIアシスタント

spec:
  fullDescription: |
    LaresはOlares公式のAIアシスタントです。自然言語で目標を伝えることで、アプリ、ファイル、システムを管理できます。Routerと接続済みのAIモデルを使い、Laresが手順を計画してツールを呼び出し、対話を通じてデバイス上のタスクを実行します。

    **主な機能**

    - 日常的な依頼から複数の手順が必要なタスクまで、ひとつの会話で処理できます。
    - Routerに設定されたAIモデルとツールを利用できます。
    - 読み取り専用、書き込み、フルアクセスの権限で、Laresが実行できる操作を制御できます。
    - 設定済みの検索ツールとページ読み取りツールで公開ウェブコンテンツを調査し、情報源へのリンク付きで結果を要約できます。

    **利用を始める前に**

    LaresにはOlares 1.12.7以降、Router、接続済みのAIモデルが必要です。タスクを開始する前に、モデルを選択して権限レベルを確認してください。

    ウェブ調査を行うには、Routerでツールを設定して有効にしてください。ウェブ検索には、Laresの設定でデフォルトの検索サービスを選ぶ必要もあります。ウェブページの読み取り専用ツールは、特定のURLを読むようLaresに依頼したときに呼び出されます。
  upgradeDescription: |
    設定から Home Assistant のスキルをダウンロードして有効にできます。ダウンロードはコマンドラインを入れ、スキルを書き出し、パックを有効にします。サーバーアドレスと長期トークンは同じページに保存します。

    - 思考の中だけに出たツール呼び出しは、同じターンで実行されます。
    - 新規インストール後も音声入力は起動します。
    - 自動化タスクが指示を予定どおりに実行し、テーマ別の朝のブリーフィングをワークスペースに書き出します。
    - 「デバイスツールを許可」した音声キーを使うと、Reachy Mini などのデバイスが音声会話で自分のツールを使えます。
    - Router は内部エントランスから Lares の音声に接続します。Lares ページのアドレスの先頭部分の末尾に 0 が付きます。
    - 再生の報告をしない音声デバイスが自分の返答を新しいターンとして聞かなくなり、返答が履歴の要約を待たなくなりました。
    - 自動のターン検出が、騒がしい部屋でも録音の上限まで待たずにターンを終えます。
    - マイクを常時送る音声デバイスは、Router の音声検出が発話を聞き取れなかったターンを飛ばします。
    - 音声デバイスは家電の操作、調べもの、予定を Lares に任せ、ユーザーの言語で答えます。
    - システムプロンプトを先頭に置く必要があるチャットモデルでも、委任したタスクの完了後に音声会話が続きます。
    - 音声の返答はモデルの思考を待たず 1 秒以内に始まり、デバイスは動きを言葉で説明せず実際に動きます。
    - 音声デバイスは直前に話された言語で答え、Agent が動く前に依頼を受け止め、つなぎ言葉の雑音を無視し、部屋の雑音を待たずに結果を知らせます。
    - 音声デバイスは返答の途中で割り込めるようになり、答えも短い一文になります。Lares の押して話すクライアントは変わりません。
    - 音声認識が混み合っているときは失敗せずに少し待ちます。音声デバイスは騒がしい部屋の音量を学習し、終わらない録音を続けなくなります。
    - ファンやモーターのある部屋でも、音声デバイスがその音を終わらない録音として拾わなくなりました。
    - 音声デバイスは音量ではなく音声モデルで発話を聞き分け、自分の声で自分を遮らなくなり、カメラで見たあとの返答も一文に収めます。
    - 音声デバイスは、近くで他の人が話していても話し手の言葉が終われば聞き取りを終え、タスクの受け付けも短い言葉で返します。
    - 音声デバイスの近くでの咳やノック音で、10 秒間聞き取りが続くことはなくなりました。
    - Home Assistant スキルは hass-cli 0.0.2 を使い、数ステップでライトを点けます。既存のインストールは起動時に更新されます。ハンズフリーのヘッドセットでも、咳で録音が開いたままになりません。
    - 音声デバイスは、最初の音節より小さく話された指示を雑音として捨てなくなりました。
    - 音声デバイスは音声エンジンの最初の音声から話し始め、タスクの受け付けも速くなりました。Agent は hass-cli 0.0.3 でより少ない手順でライトを点けます。
    - 書きながら読み上げがオンで GPU がメモリ分割のとき、音声デバイスは返答の生成中から話し始められます。
    - 以前の返答が口頭で操作中と言っただけの場合や、ユーザーがまだできていないと言った場合でも、音声デバイスはライトなど家電の依頼を Lares に渡します。
    - Agent は Router の default-chat が使うモデルに従います。音声デバイスは前回使ったモデルが停止しても、引き続き Lares にタスクを渡せます。
    - 音声デバイスは、もう一度見てと頼まれると撮り直し、あいさつには自分で応え、口頭で約束したライト操作を Lares に渡し、短い結果は Lares の報告どおりに伝えます。
    - 音声デバイスは話の途中で依頼を切らなくなり、間を置いて続けた依頼を一つにまとめ、Agent の音声回答とアナウンスを短く保ち、返答中に聞こえた音を記録します。
    - モデルがデバイスにないツールを呼んでも音声デバイスは立て直し、「えっと」や言いかけの語の後の間を待ち、各録音のどれだけが声らしかったかを記録します。
    - 音声デバイスは、一部の依頼の開始が遅い原因を調べるため、依頼間で Agent のプロンプトが変わった部分を記録します。
    - 検索後の最初の依頼の開始が遅い原因を調べるため、音声デバイスは Agent の依頼でどの過去メッセージが変わったかを記録します。
    - 音声デバイスは対話プロンプトに毎ターンの言語指定を加えなくなり、キャッシュされた接頭部を毎回再利用します。返答の言語はモデルに任せます。
    - 音声デバイスの Agent は、Web 検索など以前のターンの長いツール結果を読み直さなくなり、検索の次の依頼が早く始まります。
    - 音声デバイスの Agent は必要なツール（コマンドとスキル、Web 検索、リマインダー）だけを使い、各依頼が約 6k トークン短くなります。スマートフォンの音声を含む Lares 自身のアプリは全ツールのままです。
    - Home Assistant のスキルは hass-cli 0.0.4 を使います。1 つの引数で複数の設定を受け付け、デバイスが見つからないときは最も近いものを示し、ライトの色の設定方法も載せたため、Agent はより少ない手順でライトを変更します。
    - Home Assistant のスキルは hass-cli 0.0.5 を使います。操作するデバイスを --entity で指定でき、コマンドを間違えると正しい形を示すため、Agent はより少ない手順でライトを点けたり消したりします。
    - 音声デバイスは、ライトやカメラを使う前に置き換えられた言葉を話さなくなり、聞き取れないときは短く言い直しを頼みます。
    - Home Assistant のスキルは hass-cli 0.0.6 を使います。呼び出し前に誤ったフィールドと正しいフィールドを示すため（color_temp は color_temp_kelvin）、Agent はより少ない手順でライトの色を設定します。

    [リリースノート](https://github.com/beclab/lares/releases/tag/v0.26.114)
