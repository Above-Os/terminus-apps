metadata:
  title: Lares
  description: Application de chat sur Olares, reliée au Router

spec:
  fullDescription: |
    ## Vue d'ensemble
    Lares est une application de chat pour Olares. Elle utilise le Router Olares local pour accéder aux LLM et s'authentifie via l'identité applicative du cluster.

    ## Fonctionnalités clés
    - Interface de chat à trois colonnes avec le profil produit Lares
    - Authentification Router dans le cluster via `x-caller-appid`
    - Plugins client intégrés (saisie vocale, recherche web) lorsqu'ils sont activés dans la build
    - Sidecar Docker-in-Docker optionnel (`ENABLE_DIND`, activé par défaut) pour que l'agent puisse exécuter `docker` contre un daemon local du pod

    ## Prérequis
    - Olares >= 1.12.7
    - Application Router installée et en cours d'exécution (déclarée comme dépendance `router`)
    - Architectures prises en charge : amd64, arm64

    ## Démarrage
    1. Installez Lares depuis Market (source de test : `market.test`).
    2. Vérifiez que Router est installé.
    3. Ouvrez l'entrée Lares et démarrez une conversation.
  upgradeDescription: |
    ## Lares 0.26.3

    - L'arrêt ou l'interruption d'une conversation annule désormais le flux Router en cours, au lieu de laisser le modèle continuer à générer après l'arrêt de l'interface.