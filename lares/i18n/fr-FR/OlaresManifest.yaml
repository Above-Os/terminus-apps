metadata:
  title: Lares
  description: Un assistant IA pour gérer Olares et effectuer des recherches sur le web

spec:
  fullDescription: |
    Lares est l’assistant IA officiel d’Olares. Décrivez un objectif en langage naturel pour gérer vos applications, vos fichiers et votre système. Avec Router et un modèle d’IA connecté, Lares planifie les étapes et utilise des outils pour effectuer des tâches sur votre appareil au fil de la conversation.

    **Fonctionnalités principales**

    - Traitez les demandes quotidiennes et les tâches en plusieurs étapes dans une même conversation.
    - Utilisez les modèles d’IA et les outils configurés dans Router.
    - Contrôlez les actions de Lares avec les autorisations Lecture seule, Écriture ou Accès complet.
    - Explorez le contenu public du web avec les outils de recherche et de lecture de pages configurés, puis obtenez des synthèses avec des liens vers les sources.

    **Avant de commencer**

    Lares nécessite Olares 1.12.7 ou une version ultérieure, Router et un modèle d’IA connecté. Sélectionnez un modèle et confirmez le niveau d’autorisation avant de lancer une tâche.

    Pour effectuer des recherches sur le web, configurez et activez les outils dans Router. Pour utiliser la recherche web, sélectionnez également un service de recherche par défaut dans les paramètres de Lares. Les outils qui servent uniquement à lire des pages web sont appelés lorsque vous demandez à Lares de lire une URL précise.
  upgradeDescription: |
    Les skills Home Assistant se téléchargent et s’activent dans les réglages. Le téléchargement installe l’outil en ligne de commande, exporte les skills et active le paquet. L’adresse du serveur et le jeton de longue durée s’enregistrent sur la même page.

    - Un appel d’outil qui n’apparaissait que dans le raisonnement s’exécute dans le même tour.
    - La saisie vocale démarre après une installation neuve.
    - Les tâches automatisées exécutent une consigne selon un horaire, et les bulletins du matin par thème sont enregistrés dans l’espace de travail.
    - Des appareils comme Reachy Mini peuvent utiliser leurs propres outils en conversation vocale avec une clé vocale qui autorise les outils d'appareil.
    - Router atteint la voix de Lares par une entrée interne ; l'adresse de la page Lares se termine désormais par 0 dans sa première partie.
    - Les appareils vocaux qui ne signalent pas la lecture n'entendent plus leurs propres réponses comme un nouveau tour, et les réponses n'attendent plus les résumés d'historique.
    - La détection automatique des tours termine un tour dans une pièce bruyante au lieu d'attendre la limite audio.
    - Les appareils vocaux qui diffusent leur micro en continu ignorent les tours où la détection vocale de Router n'entend aucune parole.
    - Les appareils vocaux confient le contrôle de la maison, les recherches et l'agenda à Lares et répondent dans la langue de l'utilisateur.
    - Une conversation vocale continue après une tâche déléguée, même avec les modèles qui exigent le prompt système en premier.
    - Les réponses vocales se passent du raisonnement du modèle et commencent en moins d'une seconde ; les appareils font les gestes au lieu de les décrire.
    - Les appareils vocaux répondent dans la langue qui vient d'être parlée, confirment une demande avant que l'Agent ne commence, ignorent les bruits de remplissage et annoncent les résultats sans attendre le bruit ambiant.
    - Les appareils vocaux peuvent être interrompus en pleine réponse et répondent en une courte phrase ; les clients push-to-talk de Lares sont inchangés.
    - Les sessions vocales patientent un instant quand la reconnaissance vocale est occupée au lieu d'échouer, et les appareils vocaux apprennent le niveau d'une pièce bruyante pour ne plus enregistrer sans fin.
    - Les appareils vocaux dans une pièce avec un ventilateur ou un moteur ne l'enregistrent plus comme une prise sans fin.
    - Les appareils vocaux détectent la parole avec un modèle plutôt qu'au volume, ne s'interrompent plus avec leur propre voix et répondent en une phrase après un regard par la caméra.
    - Les appareils vocaux cessent d'écouter dès que les mots de l'interlocuteur s'arrêtent, même si d'autres parlent à côté, et confirment une tâche en quelques mots.
    - Une toux ou un coup près d'un appareil vocal ne le fait plus écouter pendant dix secondes.
    - Les compétences Home Assistant utilisent hass-cli 0.0.2, qui allume une lumière en quelques étapes ; les installations existantes sont mises à jour au démarrage. Une toux ne garde plus ouverte la prise du casque mains libres.
    - Les appareils vocaux n'écartent plus une commande parlée comme du bruit lorsqu'elle est plus faible que sa première syllabe.
    - Les appareils vocaux parlent dès le premier audio du moteur vocal, confirment une tâche plus vite, et l'Agent allume une lumière en moins d'étapes avec hass-cli 0.0.3.
    - Les appareils vocaux peuvent commencer à dire une réponse pendant qu'elle s'écrit, lorsque la lecture en direct est activée et que le GPU est partagé par mémoire.
    - Les appareils vocaux transmettent à Lares une demande concernant une lumière ou un autre appareil de la maison même si une réponse précédente l'annonçait seulement, et quand l'utilisateur dit que ce n'est toujours pas fait.
    - L'Agent suit le modèle avec lequel répond default-chat dans Router, et un appareil vocal continue de confier des tâches à Lares après l'arrêt du dernier modèle utilisé.
    - Les appareils vocaux prennent une nouvelle photo quand on leur demande de regarder à nouveau, répondent eux-mêmes aux salutations, confient à Lares les changements de lumière annoncés et annoncent les résultats courts tels que Lares les a donnés.
    - Les appareils vocaux ne coupent plus une demande au milieu d'un mot, réunissent une demande poursuivie après une pause, gardent courtes les réponses parlées et les annonces de l'Agent et consignent ce qu'ils entendent pendant une réponse.
    - Les appareils vocaux se rattrapent quand le modèle appelle un outil que l'appareil n'a pas, attendent la fin d'une pause après « euh » ou un mot inachevé et consignent quelle part de chaque prise ressemblait à une voix.
    - Les appareils vocaux consignent les parties du prompt de l'Agent qui changent d'une requête à l'autre, pour comprendre pourquoi certaines démarrent lentement.
    - Les appareils vocaux consignent quel message antérieur d'une requête de l'Agent a changé, pour comprendre pourquoi la première requête après une recherche démarre lentement.
    - Les appareils vocaux n'ajoutent plus de ligne de langue à chaque tour dans le prompt du dialogue, afin de réutiliser son préfixe en cache à chaque appel ; le modèle choisit la langue de réponse.
    - L'Agent d'un appareil vocal ne relit plus les longs résultats d'outils des tours précédents, comme une recherche web : la requête suivante démarre plus tôt.
    - L'Agent d'un appareil vocal n'utilise que les outils dont il a besoin (commandes et skills, recherche web, rappels) : chaque requête compte environ 6k tokens de moins ; les applications Lares, y compris la voix sur mobile, gardent tous les outils.
    - Les skills Home Assistant utilisent hass-cli 0.0.4, qui accepte plusieurs réglages dans un argument, indique l'appareil le plus proche quand il n'en trouve pas et décrit comment régler la couleur d'une lumière : l'Agent change une lumière en moins d'étapes.
    - Les skills Home Assistant utilisent hass-cli 0.0.5, qui prend l'appareil visé avec --entity et indique la bonne commande en cas d'erreur de saisie : l'Agent allume et éteint les lumières en moins d'étapes.
    - Un appareil vocal ne prononce plus les mots remplacés avant d'utiliser les lumières ou la caméra, et quand il ne comprend pas, il demande brièvement de répéter.
    - Les skills Home Assistant utilisent hass-cli 0.0.6, qui signale avant l'appel un champ erroné et le bon (color_temp devient color_temp_kelvin) : l'Agent règle la couleur des lumières en moins d'étapes.

    [Notes de version](https://github.com/beclab/lares/releases/tag/v0.26.112)
