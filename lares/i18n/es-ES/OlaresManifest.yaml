metadata:
  title: Lares
  description: Un asistente de IA para gestionar Olares e investigar en la web

spec:
  fullDescription: |
    Lares es el asistente de IA oficial de Olares. Describe un objetivo en lenguaje natural para gestionar aplicaciones, archivos y el sistema. Con Router y un modelo de IA conectado, Lares planifica los pasos y utiliza herramientas para realizar tareas en tu dispositivo mediante la conversación.

    **Funciones principales**

    - Gestiona solicitudes cotidianas y tareas que requieren varios pasos en una misma conversación.
    - Utiliza los modelos de IA y las herramientas configurados en Router.
    - Controla lo que Lares puede hacer con los permisos de Solo lectura, Escritura o Acceso completo.
    - Investiga contenido público de la web con las herramientas de búsqueda y lectura de páginas configuradas y obtén resúmenes con enlaces a las fuentes.

    **Antes de empezar**

    Lares requiere Olares 1.12.7 o posterior, Router y un modelo de IA conectado. Selecciona un modelo y confirma el nivel de permisos antes de iniciar una tarea.

    Para investigar en la web, configura y habilita las herramientas en Router. Para utilizar la búsqueda web, selecciona también un servicio de búsqueda predeterminado en los ajustes de Lares. Las herramientas que solo leen páginas web se utilizan cuando pides a Lares que lea una URL concreta.
  upgradeDescription: |
    Las skills de Home Assistant se descargan y se activan en los ajustes. La descarga instala la herramienta de línea de comandos, exporta las skills y activa el paquete. La dirección del servidor y el token de larga duración se guardan en la misma página.

    - Una llamada de herramienta que solo aparecía en el razonamiento se ejecuta en el mismo turno.
    - La entrada de voz arranca tras una instalación nueva.
    - Las tareas automáticas ejecutan una instrucción según un horario, y los resúmenes matutinos por tema se guardan en el espacio de trabajo.
    - Dispositivos como Reachy Mini pueden usar sus propias herramientas en conversaciones de voz con una clave de voz que permite herramientas del dispositivo.
    - Router llega a la voz de Lares por una entrada interna; la dirección de la página de Lares ahora termina en 0 en su primera parte.
    - Los dispositivos de voz que no informan de la reproducción ya no oyen sus propias respuestas como un turno nuevo, y las respuestas ya no esperan a los resúmenes del historial.
    - La detección automática de turnos cierra un turno en una sala ruidosa en lugar de esperar al límite de audio.
    - Los dispositivos de voz que envían su micrófono sin parar omiten los turnos en los que la detección de voz de Router no oye habla.
    - Los dispositivos de voz pasan a Lares el control del hogar, las consultas y la agenda, y responden en el idioma del usuario.
    - Una conversación de voz sigue tras terminar una tarea delegada, también con modelos que exigen el prompt de sistema al principio.
    - Las respuestas de voz no esperan el razonamiento del modelo y empiezan en menos de un segundo; los dispositivos hacen los gestos en lugar de describirlos.
    - Los dispositivos de voz responden en el idioma que se acaba de hablar, confirman la petición antes de que empiece el Agente, ignoran los ruidos de relleno y anuncian resultados sin esperar al ruido de la sala.
    - Los dispositivos de voz se pueden interrumpir a mitad de respuesta y contestan con una frase corta; los clientes de pulsar para hablar de Lares no cambian.
    - Las sesiones de voz esperan un momento cuando el reconocimiento de voz está ocupado en lugar de fallar, y los dispositivos de voz aprenden el nivel de una sala ruidosa para no grabar sin fin.
    - Los dispositivos de voz en una sala con un ventilador o un motor dejan de grabarlo como una toma sin fin.
    - Los dispositivos de voz detectan el habla con un modelo en lugar de por el volumen, ya no se interrumpen con su propia voz y responden en una frase tras mirar con la cámara.
    - Los dispositivos de voz dejan de escuchar cuando terminan las palabras de quien habla, aunque otras personas hablen cerca, y confirman una tarea en pocas palabras.
    - Una tos o un golpe cerca de un dispositivo de voz ya no lo mantiene escuchando diez segundos.
    - Las habilidades de Home Assistant usan hass-cli 0.0.2, que enciende una luz en un par de pasos; las instalaciones existentes se actualizan al arrancar. Una tos ya no mantiene abierta la toma del auricular manos libres.
    - Los dispositivos de voz ya no descartan una orden hablada como ruido cuando es más baja que su primera sílaba.
    - Los dispositivos de voz empiezan a hablar con el primer audio del motor de voz, confirman las tareas más rápido y el Agent enciende una luz en menos pasos con hass-cli 0.0.3.
    - Los dispositivos de voz pueden empezar a decir una respuesta mientras aún se escribe, si la lectura simultánea está activada y la GPU está dividida por memoria.
    - Los dispositivos de voz pasan a Lares una petición sobre una luz u otro dispositivo del hogar aunque una respuesta anterior solo dijera que se estaba haciendo, y cuando el usuario dice que aún no ha ocurrido.
    - El Agent sigue el modelo con el que responde default-chat en Router, y un dispositivo de voz sigue pasando tareas a Lares después de que se detenga el modelo que usó por última vez.
    - Los dispositivos de voz toman una foto nueva cuando se les pide mirar otra vez, responden ellos mismos a los saludos, pasan a Lares los cambios de luz que anuncian y comunican los resultados breves tal como Lares los dio.
    - Los dispositivos de voz ya no cortan una petición a mitad de palabra, unen una petición que sigue tras una pausa, mantienen breves las respuestas habladas y los avisos del Agent y registran lo que oyen durante una respuesta.
    - Los dispositivos de voz se recuperan cuando el modelo llama a una herramienta que el dispositivo no tiene, esperan una pausa tras «eh» o una palabra inacabada y registran cuánto de cada toma sonó a voz.
    - Los dispositivos de voz registran qué partes del prompt del Agent cambian entre peticiones, para averiguar por qué algunas tardan en empezar.
    - Los dispositivos de voz registran qué mensaje anterior de una petición del Agent cambió, para averiguar por qué la primera petición tras una búsqueda tarda en empezar.
    - Los dispositivos de voz ya no añaden una línea de idioma por turno al prompt del diálogo, para reutilizar su prefijo en caché en cada llamada; el idioma de la respuesta lo decide el modelo.
    - El Agent de un dispositivo de voz ya no vuelve a leer resultados largos de herramientas de turnos anteriores, como una búsqueda web, así que la petición siguiente empieza antes.
    - El Agent de un dispositivo de voz solo usa las herramientas que necesita (comandos y skills, búsqueda web, recordatorios), así que cada petición tiene unos 6k tokens menos; las apps de Lares, incluida la voz en el móvil, conservan todas las herramientas.
    - Las skills de Home Assistant usan hass-cli 0.0.4, que acepta varios ajustes en un argumento, indica el dispositivo más parecido cuando no encuentra uno y explica cómo cambiar el color de una luz, así que el Agent cambia una luz en menos pasos.
    - Las skills de Home Assistant usan hass-cli 0.0.5, que recibe el dispositivo con --entity e indica el comando correcto cuando uno está mal escrito, así que el Agent enciende y apaga luces en menos pasos.
    - Un dispositivo de voz ya no pronuncia palabras que se sustituyeron antes de usar las luces o la cámara, y cuando no entiende lo dicho pide brevemente que lo repitas.
    - Las skills de Home Assistant usan hass-cli 0.0.6, que antes de llamar indica un campo erróneo y el correcto (color_temp pasa a color_temp_kelvin), así que el Agent ajusta colores de luz en menos pasos.

    [Notas de la versión](https://github.com/beclab/lares/releases/tag/v0.26.115)
