metadata:
  title: Lares
  description: Aplicación de chat en Olares, conectada al Router

spec:
  fullDescription: |
    **Descripción general**
    Lares es una aplicación de chat para Olares. Utiliza el Router local de Olares para acceder a LLM y se autentica mediante la identidad de aplicación dentro del clúster.

    **Características principales**
    - Interfaz de chat de tres columnas con el perfil de producto Lares
    - Autenticación del Router dentro del clúster mediante `x-caller-appid`
    - Complementos de cliente integrados (entrada de voz, búsqueda web) cuando se activan en la compilación
    - Sidecar Docker-in-Docker opcional (`ENABLE_DIND`, activado por defecto) para que el agente pueda ejecutar `docker` contra un daemon local del pod

    **Requisitos**
    - Olares >= 1.12.7
    - App Router instalada y en ejecución (declarada como dependencia `router`)
    - Arquitecturas compatibles: amd64, arm64

    **Primeros pasos**
    1. Instala Lares desde Market (fuente de pruebas: `market.test`).
    2. Asegúrate de que Router esté instalado.
    3. Abre la entrada de Lares e inicia un chat.
  upgradeDescription: |
    ## Lares 0.26.3

    - Detener o interrumpir un chat ahora cancela el flujo del Router en curso, en lugar de dejar que el modelo siga generando después de que la interfaz se detenga.