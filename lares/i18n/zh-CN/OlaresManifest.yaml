metadata:
  title: Lares
  description: 运行在 Olares 上的聊天应用，对接 Router

spec:
  fullDescription: |
    **概述**
    Lares 是运行在 Olares 上的聊天应用。它通过本地 Olares Router 访问 LLM，使用集群内应用身份完成认证。

    **主要功能**
    - 三栏聊天界面 + Lares 产品品牌
    - 通过 `x-caller-appid` 在集群内完成 Router 认证
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    **运行要求**
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 支持架构：amd64、arm64

    **开始使用**
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    ## Lares 0.26.3

    - 打断或暂停对话时会取消 Router 上正在进行的生成，不再在前端停下后继续跑。