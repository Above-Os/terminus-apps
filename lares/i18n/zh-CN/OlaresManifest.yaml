metadata:
  title: Lares
  description: 运行在 Olares 上的聊天应用，对接 Router

spec:
  fullDescription: |
    ## 概述
    Lares 是运行在 Olares 上的聊天应用。
    通过 Olares Router 访问 LLM。

    ## 能力
    - 三栏聊天界面 + Lares 产品品牌
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    ## 运行要求
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64

    ## 开始使用
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    ## Lares 0.26.2

    - Router 的 provider、模型或本地模型应用状态变化后，模型列表会自动刷新。
    - 模型选择、语音输入和网络搜索共用一份缓存目录，并通过实时 revision
      流更新已打开的页面。
    - 已有 profile 引用旧版 Lares bundle 名称时会自动恢复。
