metadata:
  title: Dina
  description: 基于 DeepSeek Harness 的聊天应用，对接 Olares Router

spec:
  fullDescription: |
    ## 概述
    Dina 是运行在 Olares 上的聊天应用，基于 DeepSeek Harness（dsh web）。
    采用官方 dsh UI 主壳，通过 Olares Router 访问 LLM。

    ## 能力
    - 官方 dsh web UI（三栏布局）+ Dina 产品 profile
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）

    ## 运行要求
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64

    ## 开始使用
    1. 从 Market 安装 Dina（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Dina 入口开始对话。
  upgradeDescription: |
    ## Dina 0.20.0

    - 移除已废弃的 Router API Key、地址和默认模型安装项。
    - 通过 allowlist 中的 Router 入口访问，由 mesh-in 自动注入调用方 JWT。
