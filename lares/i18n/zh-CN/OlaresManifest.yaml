metadata:
  title: Lares
  description: 带 Web UI 的 pi 编程助手，已接入内置 LLM 网关
spec:
  fullDescription: |
    Lares 是将 pi 编程助手打包成的 Olares 应用：单个容器内运行一个 Node 后端，
    内嵌 pi SDK 与 Quasar Web UI，并已接入 Olares 内置的 LLM 网关，安装后无需任何配置。

    - 对话：流式输出、可视化工具调用、支持 Mermaid 与 KaTeX 的 Markdown、图片附件、
      引导与追问队列、随时中断，以及手动或自动的上下文压缩。
    - 会话：按工作目录分组，提供可回溯的分支树，可在某条消息处或其之前分叉，
      支持重命名、删除，以及导出为 HTML 或 JSONL。
    - 文件：惰性加载的文件树并带 git 状态，可预览源码、Markdown、图片、音频、视频、
      PDF 与 DOCX，查看统一 diff，并支持基于 git 索引的 @ 提及自动补全。
    - 配置：模型、服务商 API Key 与 OAuth 登录、思考等级、技能、插件，以及每个会话的
      工具开关。
    - 工作树（Worktree）：为每个分支创建独立检出，将文件树与新会话切换到其上，
      工作完成后再移除。

    使用方法：
    - 打开应用即可直接开始对话，内置 LLM 网关已自动接好。
    - 也可在应用设置中配置默认模型、自定义网关地址或你自己的网关 API Key。
