metadata:
  title: Lares
  description: 基于 DeepSeek Harness 的聊天应用，对接 Olares Router

spec:
  fullDescription: |
    ## 概述
    Lares 是运行在 Olares 上的聊天应用，基于 DeepSeek Harness（dsh web）。
    采用官方 dsh UI 主壳，通过 Olares Router 访问 LLM。

    ## 能力
    - 官方 dsh web UI（三栏布局）+ Lares 产品 profile
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    ## 运行要求
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64

    ## 开始使用
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    ## Lares 0.23.0

    - 会话内预览工作区文件（含 Agent 刚产出的媒体），并可直接下载。
    - 支持从 Drive 或 URL 导入工作区；ffmpeg_encode 使用镜像内 Debian ffmpeg
      （软解 H.264，不挂 GPU 设备）。
    - 容器通过 TIMEZONE / TZ 继承用户时区。
