metadata:
  title: Lares
  description: 通过自然语言管理 Olares 并开展网页研究的 AI 助手

spec:
  fullDescription: |
    Lares 是 Olares 官方 AI 助手。用自然语言描述目标，即可管理应用、文件和系统。通过 Router 和已连接的 AI 模型，Lares 会规划步骤、调用工具，在对话中完成设备上的任务。

    **主要功能**

    - 在同一段对话中处理日常请求和需要多个步骤的任务。
    - 使用 Router 中配置的 AI 模型和工具。
    - 通过只读、写入或完全访问权限，控制 Lares 可以执行的操作。
    - 使用已配置的搜索和网页读取工具研究公开网页内容，汇总信息并提供来源链接。

    **开始之前**

    Lares 需要 Olares 1.12.7 或更高版本、Router，以及一个已连接的 AI 模型。开始任务前，请选择模型并确认权限级别。

    如需开展网页研究，请先在 Router 中配置并启用相关工具。使用网页搜索时，还需在 Lares 设置中选择默认搜索服务。仅提供网页读取能力的工具，会在你要求 Lares 读取指定 URL 时调用。

  upgradeDescription: |
    图片和视频预览会在窗格内等比缩放并居中显示，未放大时无需滚动即可看到完整画面。
    媒体生成现在直接通过 Router 执行，不再因模型列表为空或模型正在预热而启动诊断任务。
