metadata:
  title: Lares
  description: Un assistente IA per gestire Olares e fare ricerche sul web

spec:
  fullDescription: |
    Lares è l’assistente IA ufficiale di Olares. Descrivi un obiettivo in linguaggio naturale per gestire app, file e sistema. Con Router e un modello di IA connesso, Lares pianifica i passaggi e usa gli strumenti per eseguire attività sul tuo dispositivo attraverso la conversazione.

    **Funzionalità principali**

    - Gestisci richieste quotidiane e attività che richiedono più passaggi in un’unica conversazione.
    - Usa i modelli di IA e gli strumenti configurati in Router.
    - Controlla le azioni consentite a Lares con i permessi Sola lettura, Scrittura o Accesso completo.
    - Esplora i contenuti pubblici del web con gli strumenti di ricerca e lettura delle pagine configurati e ottieni sintesi con link alle fonti.

    **Prima di iniziare**

    Lares richiede Olares 1.12.7 o successivo, Router e un modello di IA connesso. Seleziona un modello e conferma il livello di autorizzazione prima di avviare un’attività.

    Per fare ricerche sul web, configura e abilita gli strumenti in Router. Per usare la ricerca web, seleziona anche un servizio di ricerca predefinito nelle impostazioni di Lares. Gli strumenti dedicati esclusivamente alla lettura delle pagine web vengono richiamati quando chiedi a Lares di leggere un URL specifico.
  upgradeDescription: |
    Le skill di Home Assistant si scaricano e si attivano nelle impostazioni. Il download installa lo strumento a riga di comando, esporta le skill e abilita il pacchetto. Indirizzo del server e token di lunga durata si salvano nella stessa pagina.

    - Una chiamata di strumento comparsa solo nel ragionamento viene eseguita nello stesso turno.
    - L'input vocale si avvia dopo una nuova installazione.
    - Le attività automatiche eseguono un'istruzione in base a una pianificazione, e i notiziari del mattino per argomento vengono salvati nell'area di lavoro.
    - Dispositivi come Reachy Mini possono usare i propri strumenti nelle conversazioni vocali con una chiave vocale che consente gli strumenti del dispositivo.
    - Router raggiunge la voce di Lares tramite un ingresso interno; l'indirizzo della pagina Lares ora termina con 0 nella prima parte.
    - I dispositivi vocali senza segnalazione della riproduzione non sentono più le proprie risposte come un nuovo turno, e le risposte non aspettano più i riepiloghi della cronologia.
    - Il rilevamento automatico dei turni chiude un turno anche in una stanza rumorosa invece di attendere il limite audio.
    - I dispositivi vocali che trasmettono di continuo il microfono saltano i turni in cui il rilevamento vocale di Router non sente parlato.
    - I dispositivi vocali affidano a Lares il controllo della casa, le ricerche e l'agenda e rispondono nella lingua dell'utente.
    - Una conversazione vocale continua dopo un'attività delegata anche con i modelli che richiedono il prompt di sistema per primo.
    - Le risposte vocali non attendono il ragionamento del modello e iniziano in meno di un secondo; i dispositivi eseguono i gesti invece di descriverli.
    - I dispositivi vocali rispondono nella lingua appena parlata, confermano una richiesta prima che parta l'Agente, ignorano i rumori di riempimento e annunciano i risultati senza aspettare il rumore della stanza.
    - I dispositivi vocali si possono interrompere durante la risposta e rispondono con una frase breve; i client push-to-talk di Lares restano invariati.
    - Le sessioni vocali attendono un attimo quando il riconoscimento vocale è occupato invece di fallire, e i dispositivi vocali imparano il livello di una stanza rumorosa per non registrare all'infinito.
    - I dispositivi vocali in una stanza con una ventola o un motore non lo registrano più come una ripresa infinita.
    - I dispositivi vocali riconoscono il parlato con un modello invece che dal volume, non si interrompono più con la propria voce e rispondono in una frase dopo uno sguardo con la fotocamera.
    - I dispositivi vocali smettono di ascoltare quando finiscono le parole di chi parla, anche se altri parlano vicino, e confermano un'attività in poche parole.
    - Un colpo di tosse o un rumore vicino a un dispositivo vocale non lo tiene più in ascolto per dieci secondi.
    - Le competenze Home Assistant usano hass-cli 0.0.2, che accende una luce in un paio di passaggi; le installazioni esistenti si aggiornano all'avvio. Un colpo di tosse non tiene più aperta la ripresa delle cuffie a mani libere.
    - I dispositivi vocali non scartano più un comando parlato come rumore quando è più basso della sua prima sillaba.
    - I dispositivi vocali iniziano a parlare dal primo audio del motore vocale, confermano un'attività più in fretta e l'Agent accende una luce in meno passaggi con hass-cli 0.0.3.
    - I dispositivi vocali possono iniziare a pronunciare una risposta mentre viene ancora scritta, se la lettura in tempo reale è attiva e la GPU è suddivisa per memoria.
    - I dispositivi vocali passano a Lares una richiesta per una luce o un altro dispositivo di casa anche se una risposta precedente diceva solo che era in corso, e quando l'utente dice che non è ancora successo.
    - L'Agent segue il modello con cui risponde default-chat in Router, e un dispositivo vocale continua a passare attività a Lares dopo che il modello usato per ultimo si ferma.
    - I dispositivi vocali scattano una nuova foto quando si chiede di guardare di nuovo, rispondono da soli ai saluti, passano a Lares i cambi di luce annunciati e riferiscono i risultati brevi come li ha dati Lares.
    - I dispositivi vocali non tagliano più una richiesta a metà parola, uniscono una richiesta ripresa dopo una pausa, mantengono brevi le risposte parlate e gli annunci dell'Agent e registrano ciò che sentono durante una risposta.
    - I dispositivi vocali si riprendono quando il modello chiama uno strumento che il dispositivo non ha, aspettano la fine di una pausa dopo «ehm» o una parola incompleta e registrano quanta parte di ogni ripresa sembrava una voce.
    - I dispositivi vocali registrano quali parti del prompt dell'Agent cambiano tra le richieste, per capire perché alcune partono lente.
    - I dispositivi vocali registrano quale messaggio precedente di una richiesta dell'Agent è cambiato, per capire perché la prima richiesta dopo una ricerca parte lenta.
    - I dispositivi vocali non aggiungono più una riga sulla lingua a ogni turno nel prompt del dialogo, così il prefisso in cache viene riusato a ogni chiamata; la lingua della risposta la sceglie il modello.
    - L'Agent di un dispositivo vocale non rilegge più i lunghi risultati degli strumenti dei turni precedenti, come una ricerca web, quindi la richiesta successiva parte prima.
    - L'Agent di un dispositivo vocale usa solo gli strumenti che gli servono (comandi e skill, ricerca web, promemoria), quindi ogni richiesta ha circa 6k token in meno; le app di Lares, compresa la voce sul telefono, mantengono tutti gli strumenti.
    - Le skill di Home Assistant usano hass-cli 0.0.4, che accetta più impostazioni in un argomento, indica il dispositivo più vicino quando non ne trova uno e spiega come impostare il colore di una luce, così l'Agent cambia una luce in meno passaggi.
    - Le skill di Home Assistant usano hass-cli 0.0.5, che riceve il dispositivo con --entity e indica il comando giusto quando uno è scritto male, così l'Agent accende e spegne le luci in meno passaggi.
    - Un dispositivo vocale non pronuncia più parole sostituite prima di usare le luci o la fotocamera e, quando non capisce, chiede brevemente di ripetere.
    - Le skill di Home Assistant usano hass-cli 0.0.6, che prima della chiamata indica un campo errato e quello giusto (color_temp diventa color_temp_kelvin), così l'Agent imposta i colori delle luci in meno passaggi.

    [Note di rilascio](https://github.com/beclab/lares/releases/tag/v0.26.112)
