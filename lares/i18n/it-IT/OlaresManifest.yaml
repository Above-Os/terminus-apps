metadata:
  title: Lares
  description: Applicazione di chat su Olares, collegata al Router

spec:
  fullDescription: |
    **Panoramica**
    Lares è un'applicazione di chat per Olares. Utilizza il Router Olares locale per accedere agli LLM e si autentica tramite l'identità applicativa interna al cluster.

    **Funzionalità principali**
    - Interfaccia di chat a tre colonne con il profilo prodotto Lares
    - Autenticazione del Router nel cluster tramite `x-caller-appid`
    - Plugin client integrati (input vocale, ricerca web) se attivati nella build
    - Sidecar Docker-in-Docker opzionale (`ENABLE_DIND`, attivo per impostazione predefinita) che consente all'agente di eseguire `docker` su un daemon locale del pod

    **Requisiti**
    - Olares >= 1.12.7
    - App Router installata e in esecuzione (dichiarata come dipendenza `router`)
    - Architetture supportate: amd64, arm64

    **Per iniziare**
    1. Installa Lares dal Market (fonte di test: `market.test`).
    2. Verifica che Router sia installato.
    3. Apri l'ingresso Lares e avvia una chat.
  upgradeDescription: |
    ## Lares 0.26.3

    - L'arresto o l'interruzione di una chat ora annulla il flusso Router in corso, invece di lasciare il modello generare dopo l'arresto dell'interfaccia.