olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: damoradar
  appid: damoradar
  title: DAMO RADAR
  description: Local research inference for contrast-enhanced abdominal CT.
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.0.6
  categories:
    - AI
    - models
entrances:
  - name: damoradar
    host: damoradar
    port: 8080
    title: DAMO RADAR
    authLevel: private
spec:
  versionName: zenodo-v3
  runAsUser: true
  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: '0.025'
      limitedCpu: '12'
      requiredMemory: 8Gi
      limitedMemory: 48Gi
      requiredDisk: 4Gi
      limitedDisk: 30Gi
      requiredGPUMemory: 22Gi
      limitedGPUMemory: 23Gi
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
workloadReplicas:
  damoradar: 1
envs:
  - envName: HF_ENDPOINT
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
