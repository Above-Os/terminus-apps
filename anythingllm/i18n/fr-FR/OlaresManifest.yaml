metadata:
  title: AnythingLLM
  description: "L'application IA tout-en-un que vous recherchiez."
spec:
  fullDescription: |
    AnythingLLM : L'application IA tout-en-un que vous recherchiez.
    Discutez avec vos documents, utilisez des AI Agents, hyper-configurable, multi-utilisateur, sans configuration frustrante.
    
    AnythingLLM est une application full-stack qui vous permet de transformer tout document, ressource ou contenu en contexte qu'un LLM peut utiliser comme référence pendant le chat. Vous choisissez le LLM ou la Vector Database souhaités, avec gestion multi-utilisateur et permissions.
    
    Fonctionnalités intéressantes d'AnythingLLM :
    - Custom AI Agents
    - Constructeur d'AI Agents no-code
    - Prise en charge multimodale (LLM fermés et open source !)
    - Support multi-utilisateur et permissions (version Docker uniquement)
    - Agents dans votre workspace (navigation web, etc.)
    - Widget de chat intégrable personnalisé pour votre site (version Docker uniquement)
    - Prise en charge de plusieurs types de documents (PDF, TXT, DOCX, etc.)
    - UI de chat simple avec glisser-déposer et citations claires
    - Prêt pour un déploiement 100 % cloud
    - Compatible avec tous les fournisseurs LLM fermés et open source populaires
    - Mesures intégrées d'économie de coût et de temps pour de très gros documents par rapport aux autres UI de chat
    - API développeur complète pour des intégrations personnalisées !
  upgradeDescription: |
    Mise à niveau vers la version 1.14.1
    
    Performance et fiabilité
    - Correction d'une fuite mémoire de l'embedder qui provoquait des rechargements répétés du processus serveur.
    - Améliorations majeures des performances frontend pour les chats de longue durée.
    - Meilleurs messages d'erreur API et correctifs d'encodage de l'embedder Mistral.
    
    Nouvelles fonctionnalités
    - Exporter les chats en PDF, JSON, Markdown et plus depuis l'UI de chat.
    - Copier le lien du chat pour un deeplink vers les sessions desktop/self-hébergées.
    - Réactivation des téléversements audio et vidéo dans le chat via le moteur Tinyscribe.
    - Mise en évidence des variables de flux d'agent et demande d'approbation pour les skills d'agents personnalisés.
    
    Changements de fournisseurs
    - Suppression en amont des fournisseurs DPAIS et HuggingFace non maintenus.
    - Intégration Cohere migrée vers le SDK compatible OpenAI.
    
    Autres correctifs
    - Correction de la résolution du thème des toasts en mode clair.
    - Correction d'une fuite EventEmitter dans les flux de web-scraping et summarize.
    - Bedrock Claude Opus 4.8 n'envoie plus de paramètres temperature non pris en charge.
    
    Note : Les fournisseurs LLM et d'embedding ne sont plus préconfigurés sur Ollama. Configurez-les dans Settings après la mise à niveau.
    
    Notes complètes : https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.14.1
