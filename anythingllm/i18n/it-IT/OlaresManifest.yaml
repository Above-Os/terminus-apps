metadata:
  title: AnythingLLM
  description: "L'app IA all-in-one che stavi cercando."
spec:
  fullDescription: |
    AnythingLLM: L'app IA all-in-one che stavi cercando.
    Chatta con i tuoi documenti, usa AI Agents, iper-configurabile, multiutente e senza setup frustrante.
    
    AnythingLLM è un'applicazione full-stack che ti consente di trasformare qualsiasi documento, risorsa o contenuto in contesto che qualsiasi LLM può usare come riferimento durante la chat. Puoi scegliere quale LLM o Vector Database usare, con gestione multiutente e permessi.
    
    Funzioni interessanti di AnythingLLM:
    - Custom AI Agents
    - Builder di AI Agent no-code
    - Supporto multimodale (LLM chiusi e open-source!)
    - Supporto istanze multiutente e permessi (solo versione Docker)
    - Agents nel tuo workspace (navigare il web, ecc.)
    - Widget chat incorporabile personalizzato per il tuo sito (solo versione Docker)
    - Supporto di più tipi di documento (PDF, TXT, DOCX, ecc.)
    - UI chat semplice con drag-and-drop e citazioni chiare
    - Pronta per deployment 100% cloud
    - Funziona con tutti i provider LLM chiusi e open-source più popolari
    - Misure integrate di risparmio di costi e tempo per documenti molto grandi rispetto ad altre UI chat
    - Developer API completa per integrazioni personalizzate!
  upgradeDescription: |
    Aggiornamento alla versione 1.14.1
    
    Prestazioni e affidabilità
    - Risolto memory leak dell'embedder che causava reload ripetuti nel processo server.
    - Grandi miglioramenti delle prestazioni frontend per chat di lunga durata.
    - Messaggi di errore API migliori e fix encoding dell'embedder Mistral.
    
    Nuove funzioni
    - Esporta chat come PDF, JSON, Markdown e altro dalla UI chat.
    - Copia link chat per deeplinking alle sessioni desktop/self-hosted.
    - Riabilitati upload audio e video in chat tramite il motore Tinyscribe.
    - Evidenziazione variabili agent flow e richiesta di approvazione per skill agent personalizzate.
    
    Modifiche ai provider
    - Rimossi upstream i provider DPAIS e HuggingFace non mantenuti.
    - Integrazione Cohere migrata all'SDK compatibile OpenAI.
    
    Altri fix
    - Risolta la risoluzione del tema toast in light mode.
    - Risolto leak EventEmitter nei flussi di web-scraping e summarize.
    - Bedrock Claude Opus 4.8 non invia più parametri temperature non supportati.
    
    Nota: I provider LLM e embedding non sono più preconfigurati su Ollama. Configurali in Settings dopo l'upgrade.
    
    Note complete: https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.14.1
