metadata:
  title: AnythingLLM
  description: 探していたオールインワン AI アプリ。
spec:
  fullDescription: |
    AnythingLLM: 探していたオールインワン AI アプリ。
    ドキュメントとチャット、AI Agents の利用、高度な設定、マルチユーザー対応、面倒なセットアップ不要。
    
    AnythingLLM は、任意のドキュメント・リソース・コンテンツを、どの LLM でもチャット中の参照として使えるコンテキストに変換するフルスタックアプリケーションです。使用する LLM や Vector Database を選べ、マルチユーザー管理と権限にも対応します。
    
    AnythingLLM の便利な機能:
    - Custom AI Agents
    - ノーコード AI Agent ビルダー
    - マルチモーダル対応（クローズド／オープンソース LLM 両方）
    - マルチユーザーインスタンスと権限（Docker 版のみ）
    - ワークスペース内 Agents（Web 閲覧など）
    - Web サイト向け埋め込み可能カスタムチャットウィジェット（Docker 版のみ）
    - 複数ドキュメント形式対応（PDF、TXT、DOCX など）
    - ドラッグ＆ドロップと明確な引用付きのシンプルなチャット UI
    - 100% クラウドデプロイ対応
    - 主要なクローズド／オープンソース LLM プロバイダーすべてに対応
    - 他のチャット UI と比べ、非常に大きなドキュメント管理のコスト・時間節約機能を内蔵
    - カスタム連携向けフル Developer API！
  upgradeDescription: |
    バージョン 1.14.1 へアップグレード
    
    パフォーマンスと信頼性
    - サーバープロセスの繰り返しリロードを引き起こしていた embedder のメモリリークを修正。
    - 長時間チャット向けのフロントエンド性能を大幅改善。
    - API エラーメッセージの改善と Mistral embedder のエンコーディング修正。
    
    新機能
    - チャット UI から PDF、JSON、Markdown などでチャットをエクスポート。
    - デスクトップ／セルフホストセッションへ戻るディープリンク用チャットリンクのコピー。
    - Tinyscribe エンジン経由でチャットへの音声・動画アップロードを再有効化。
    - エージェントフロー変数のハイライトとカスタムエージェントスキルの承認リクエスト。
    
    プロバイダー変更
    - メンテされていない DPAIS と HuggingFace プロバイダーを upstream から削除。
    - Cohere 統合を OpenAI 互換 SDK へ移行。
    
    その他の修正
    - ライトモードでのトーストテーマ解決を修正。
    - Web スクレイピングと要約フローの EventEmitter リークを修正。
    - Bedrock Claude Opus 4.8 が非対応の temperature パラメータを送らなくなりました。
    
    注: LLM と埋め込みプロバイダーは Ollama に事前設定されなくなりました。アップグレード後に Settings で設定してください。
    
    完全なリリースノート: https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.14.1
