metadata:
  title: AnythingLLM
  description: La app de IA todo en uno que estabas buscando.
spec:
  fullDescription: |
    AnythingLLM: La app de IA todo en uno que estabas buscando.
    Chatea con tus documentos, usa AI Agents, hiperconfigurable, multiusuario y sin una configuración frustrante.
    
    AnythingLLM es una aplicación full-stack que te permite convertir cualquier documento, recurso o contenido en contexto que cualquier LLM puede usar como referencia al chatear. Puedes elegir qué LLM o Vector Database usar, además de gestionar usuarios y permisos.
    
    Funciones interesantes de AnythingLLM:
    - Custom AI Agents
    - Constructor de AI Agents sin código
    - Soporte multimodal (¡LLM cerrados y open-source!)
    - Soporte multiusuario y permisos (solo versión Docker)
    - Agents dentro de tu workspace (navegar la web, etc.)
    - Widget de chat incrustable personalizado para tu sitio (solo versión Docker)
    - Soporte de múltiples tipos de documento (PDF, TXT, DOCX, etc.)
    - UI de chat sencilla con arrastrar y soltar y citas claras
    - Lista para despliegue 100% en la nube
    - Compatible con todos los proveedores LLM cerrados y open-source populares
    - Medidas integradas de ahorro de coste y tiempo para documentos muy grandes frente a otras UI de chat
    - API completa para desarrolladores e integraciones personalizadas!
  upgradeDescription: |
    Actualización a la versión 1.14.1
    
    Rendimiento y fiabilidad
    - Corregida fuga de memoria del embedder que causaba recargas repetidas en el proceso del servidor.
    - Grandes mejoras de rendimiento del frontend para chats de larga duración.
    - Mejores mensajes de error de API y correcciones de encoding del embedder Mistral.
    
    Nuevas funciones
    - Exportar chats como PDF, JSON, Markdown y más desde la UI de chat.
    - Copiar enlace del chat para deeplinking a sesiones de escritorio/autoalojadas.
    - Reactivadas las subidas de audio y vídeo en el chat mediante el motor Tinyscribe.
    - Resaltado de variables de agent flow y solicitud de aprobación para skills de agentes personalizados.
    
    Cambios de proveedores
    - Eliminados upstream los proveedores DPAIS y HuggingFace sin mantenimiento.
    - Integración de Cohere migrada al SDK compatible con OpenAI.
    
    Otras correcciones
    - Corregida la resolución del tema de toasts en modo claro.
    - Corregida fuga de EventEmitter en flujos de web-scraping y summarize.
    - Bedrock Claude Opus 4.8 ya no envía parámetros de temperature no admitidos.
    
    Nota: Los proveedores de LLM y embedding ya no vienen preconfigurados a Ollama. Configúralos en Settings tras la actualización.
    
    Notas completas: https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.14.1
