metadata:
  title: AnythingLLM
  description: Die All-in-one-KI-App, nach der Sie gesucht haben
spec:
  fullDescription: |
    AnythingLLM: Die All-in-one-KI-App, nach der Sie gesucht haben.
    Chatten Sie mit Ihren Docs, nutzen Sie AI Agents, hochgradig konfigurierbar, Multi-User – ohne frustrierendes Setup.
    
    AnythingLLM ist eine Full-Stack-Anwendung, mit der Sie jedes Dokument, jede Ressource oder jeden Inhalt in Kontext verwandeln, den jedes LLM beim Chatten als Referenz nutzen kann. Sie wählen LLM oder Vector Database nach Wunsch und erhalten Multi-User-Verwaltung sowie Berechtigungen.
    
    Coole Funktionen von AnythingLLM:
    - Custom AI Agents
    - No-code AI Agent Builder
    - Multimodale Unterstützung (geschlossene und Open-Source-LLMs!)
    - Multi-User-Instanzen und Berechtigungen (nur Docker-Version)
    - Agents in Ihrem Workspace (Web browsen usw.)
    - Einbettbares Custom-Chat-Widget für Ihre Website (nur Docker-Version)
    - Unterstützung mehrerer Dokumenttypen (PDF, TXT, DOCX usw.)
    - Einfache Chat-UI mit Drag-and-Drop und klaren Zitaten
    - 100 % Cloud-Deployment-fähig
    - Funktioniert mit allen gängigen geschlossenen und Open-Source-LLM-Anbietern
    - Eingebaute Kosten- und Zeitsparmaßnahmen für sehr große Dokumente im Vergleich zu anderen Chat-UIs
    - Vollständige Developer API für individuelle Integrationen!
  upgradeDescription: |
    Upgrade auf Version 1.14.1
    
    Leistung & Zuverlässigkeit
    - Speicherleck im Embedder behoben, das wiederholte Reloads im Serverprozess verursachte.
    - Große Frontend-Leistungsverbesserungen für lange laufende Chats.
    - Bessere API-Fehlermeldungen und Encoding-Fixes für den Mistral-Embedder.
    
    Neue Funktionen
    - Chats als PDF, JSON, Markdown und mehr aus der Chat-UI exportieren.
    - Chat-Link kopieren für Deeplinking zurück in Desktop-/Self-Hosted-Sessions.
    - Audio- und Video-Uploads im Chat über die Tinyscribe-Engine wieder aktiviert.
    - Agent-Flow-Variablenhervorhebung und Freigabeanfragen für custom Agent Skills.
    
    Anbieter-Änderungen
    - Nicht mehr gepflegte DPAIS- und HuggingFace-Anbieter upstream entfernt.
    - Cohere-Integration auf das OpenAI-kompatible SDK migriert.
    
    Weitere Fixes
    - Toast-Theme-Auflösung im Light Mode behoben.
    - EventEmitter-Leck in Web-Scraping- und Summarize-Flows behoben.
    - Bedrock Claude Opus 4.8 sendet keine nicht unterstützten Temperature-Parameter mehr.
    
    Hinweis: LLM- und Embedding-Anbieter sind nicht mehr vorausgefüllt auf Ollama konfiguriert. Konfigurieren Sie sie nach dem Upgrade in den Einstellungen.
    
    Vollständige Release Notes: https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.14.1
