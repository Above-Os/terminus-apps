metadata:
  title: Jina CLIP v2
  description: Jina CLIP v2 嵌入服务（自动选择 OpenVINO iGPU / ONNX CPU）。

spec:
  fullDescription: |
    **重要说明**
    这是一个共享应用。一旦由 Olares 管理员安装，集群中所有用户都可以通过引用应用使用它。

    **引擎自动选择**
    - Intel iGPU：OpenVINO IR 后端
    - 其他：ONNX Runtime (CPU) 后端

    **模型仓库**
    - OpenVINO：wangzhong/jina-clip-v2-split-openvino
    - ONNX：wangzhong/jina-clip-v2-split-onnx

    **API**
    - POST /api/text/embed
    - POST /api/image/embed
  upgradeDescription: |
    **Jina CLIP v2 1.0.10**

    - 通过空的 `.suspend` 标记文件标记为已下架。该应用不再通过 Market 分发，但图表和清单内容会保留。
