metadata:
  title: Windows ARM64
  description: Olares 上で Windows ARM64 を実行
spec:
  upgradeDescription: |
    v1.0.10: 永続 VM データを `appCache` に維持（appData への移行なし）；コントロールプレーン（master）のみにスケジュール；`PASSWORD` を Kubernetes Secret（`secretKeyRef`）へ移動。

    ストレージ: 永続ボリュームを `appCache` から `appData` へ移動。アップグレード後の初回起動時、宛先が空の場合 initContainers が旧 appCache の内容を appData にコピーします（マーカー: `.migration_from_appcache_done`）。旧 appCache データはロールバック用に残します。

    レガシーな `sysVersion >= 1.12.3` の appCache パス分岐を削除；Olares の最低バージョンは現在 1.12.6。

    VM ディスクストレージを appCache ルートから appData/storage へ移動。
  fullDescription: |
    このアプリは Olares 上で Windows ARM64 を実行するのに役立ちます。
    Docker コンテナ内の dockur 製 Windows ARM64 に基づきます。

    **機能**
    - ISO ダウンローダー
    - KVM アクセラレーション
    - Web ベースのビューア

    **対応 Windows バージョン**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 LTSC
    - Windows 10 Enterprise
