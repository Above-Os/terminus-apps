metadata:
  title: Windows ARM64
  description: Windows ARM64 auf Olares ausführen
spec:
  upgradeDescription: |
    v1.0.10: Dauerhafte VM-Daten auf `appCache` belassen (keine Migration zu appData); nur auf Control-Plane (Master) planen; `PASSWORD` in ein Kubernetes Secret (`secretKeyRef`) verschieben.

    Speicher: dauerhafte Volumes von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopieren initContainers den Inhalt des alten appCache nach appData, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Alte appCache-Daten bleiben für ein Rollback erhalten.

    Veraltete Pfadverzweigung für `sysVersion >= 1.12.3` appCache entfernt; Olares-Minimum ist jetzt 1.12.6.

    VM-Festplattenspeicher vom appCache-Root nach appData/storage verschoben.
  fullDescription: |
    Diese App hilft Ihnen, Windows ARM64 auf Olares auszuführen.
    Basierend auf dockurs Windows ARM64 in einem Docker-Container.

    **Funktionen**
    - ISO-Downloader
    - KVM-Beschleunigung
    - Webbasiertes Viewer

    **Unterstützte Windows-Versionen**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 LTSC
    - Windows 10 Enterprise
