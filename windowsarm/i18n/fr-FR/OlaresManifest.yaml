metadata:
  title: Windows ARM64
  description: Exécuter Windows ARM64 sur Olares
spec:
  upgradeDescription: |
    v1.0.10 : Conserver les données durables de la VM sur `appCache` (pas de migration vers appData) ; planifier uniquement sur le control-plane (master) ; déplacer `PASSWORD` dans un Secret Kubernetes (`secretKeyRef`).

    Stockage : volumes durables déplacés de `appCache` vers `appData`. Au premier démarrage après la mise à niveau, les initContainers copient le contenu legacy d'appCache vers appData lorsque la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données appCache sont conservées pour un rollback.

    Suppression de la ramification legacy des chemins appCache pour `sysVersion >= 1.12.3` ; le minimum Olares est désormais 1.12.6.

    Stockage du disque de la VM déplacé de la racine appCache vers appData/storage.
  fullDescription: |
    Cette application vous aide à exécuter Windows ARM64 sur Olares.
    Basée sur Windows ARM64 de dockur dans un conteneur Docker.

    **Fonctionnalités**
    - Téléchargeur d'ISO
    - Accélération KVM
    - Visionneuse web

    **Versions Windows prises en charge**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 LTSC
    - Windows 10 Enterprise
