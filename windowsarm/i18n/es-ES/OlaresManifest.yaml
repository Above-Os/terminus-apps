metadata:
  title: Windows ARM64
  description: Ejecutar Windows ARM64 en Olares
spec:
  upgradeDescription: |
    v1.0.10: Mantener los datos duraderos de la VM en `appCache` (sin migración a appData); programar solo en el control-plane (master); mover `PASSWORD` a un Secret de Kubernetes (`secretKeyRef`).

    Almacenamiento: volúmenes duraderos movidos de `appCache` a `appData`. En el primer arranque tras la actualización, los initContainers copian el contenido legado de appCache a appData cuando el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos de appCache se conservan para rollback.

    Eliminar la ramificación legada de rutas appCache para `sysVersion >= 1.12.3`; el mínimo de Olares es ahora 1.12.6.

    Almacenamiento del disco de la VM movido de la raíz de appCache a appData/storage.
  fullDescription: |
    Esta app le ayuda a ejecutar Windows ARM64 en Olares.
    Basada en Windows ARM64 de dockur dentro de un contenedor Docker.

    **Características**
    - Descargador de ISO
    - Aceleración KVM
    - Visor basado en web

    **Versiones de Windows compatibles**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 LTSC
    - Windows 10 Enterprise
