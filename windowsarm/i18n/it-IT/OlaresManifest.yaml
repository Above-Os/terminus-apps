metadata:
  title: Windows ARM64
  description: Esegui Windows ARM64 su Olares
spec:
  upgradeDescription: |
    v1.0.10: Conserva i dati durevoli della VM su `appCache` (nessuna migrazione ad appData); pianifica solo sul control-plane (master); sposta `PASSWORD` in un Secret Kubernetes (`secretKeyRef`).

    Storage: volumi durevoli spostati da `appCache` ad `appData`. Al primo avvio dopo l'upgrade, gli initContainers copiano i contenuti legacy di appCache in appData quando la destinazione è vuota (marker: `.migration_from_appcache_done`). I vecchi dati appCache restano intatti per il rollback.

    Rimuovere la ramificazione legacy dei percorsi appCache per `sysVersion >= 1.12.3`; il minimo Olares è ora 1.12.6.

    Lo storage del disco della VM è stato spostato dalla root di appCache ad appData/storage.
  fullDescription: |
    Questa app ti aiuta a eseguire Windows ARM64 su Olares.
    Basata su Windows ARM64 di dockur all'interno di un container Docker.

    **Funzionalità**
    - Downloader ISO
    - Accelerazione KVM
    - Viewer basato sul web

    **Versioni Windows supportate**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 LTSC
    - Windows 10 Enterprise
