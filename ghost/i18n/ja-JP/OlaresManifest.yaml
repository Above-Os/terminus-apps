metadata:
  title: Ghost
  description: 現代的なパブリッシング、メンバーシップ、サブスクリプション、
    ニュースレターのための独立技術
spec:
  fullDescription: |
    Ghost はプロのパブリッシャーがコンテンツを中心にビジネスを作り、共有し、成長させるための強力なアプリです。ウェブサイト構築、コンテンツ公開、ニュースレター送信、メンバーへの有料サブスクリプション提供のための現代的なツールが揃っています。

    **EASY SITE DESIGN**
    ウェブサイトとブランディングを完全にコントロール。
    - カスタムサイトを立ち上げ、ブランドとスタイルに合わせてデザイン設定を調整。
    - マーケットプレイスの数百のカスタムテーマでさらに進めるか、ゼロから完全カスタムデザインを構築。
    - 独自ブランドが前面に立ち、Ghost は背後で動作します。

    **ADVANCED CREATOR TOOLS**
    Web とメールニュースレターで公開。
    - プロ向けにゼロから作られたエディタ。落ち着いたデザインで、高度なワークフローが標準。
    - 扱いにくいツールバーやドラッグ＆失敗に悩まされることはもうありません。
    - リッチメディアと動的カード。
    - ニュースレター内蔵。

    **GROW YOUR AUDIENCE**
    クリックをコンタクトへ。
    - 匿名ビューをログイン済みメンバーに変えるネイティブ登録フォームで簡単に。
    - 無料登録、または月次・年次のプレミアム階層での有料サブスクリプション購入を許可。

    **RUN YOUR BUSINESS**
    メンバーシップを管理。
    - 誰が登録し、誰が支払い、何を読んでいるかを見て、コアオーディエンスをよりよく理解。
    ネイティブ分析。
    - どのコンテンツが最も注目を集め、最大のファンは誰かを理解する詳細なエンゲージメント分析。
    オファーとプロモーション。
    - オファーとプロモーションで新規購読者を惹きつけ、ビジネスを成長。

    **INTEGRATIONS**
    お気に入りのアプリ、プラグイン、ツールをすべて Ghost と統合
  upgradeDescription: |
    - TikTok と Instagram のユーザー名の検証問題を修正（24708）- Troy Ciesco
    - Outlook のヘッダー画像の問題を修正（24665）- Troy Ciesco
    - 管理設定のスタッフ招待に欠けていたページネーションを追加 - Jonatan Svennberg
    - バスク語翻訳を追加（24642）- Xabi

    完全な Changelog: https://github.com/TryGhost/Ghost/releases/tag/v6.0.5
