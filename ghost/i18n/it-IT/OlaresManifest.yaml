metadata:
  title: Ghost
  description: Tecnologia indipendente per publishing moderno, membership, abbonamenti
    e newsletter
spec:
  fullDescription: |
    Ghost è una potente app per editori professionali per creare, condividere e far crescere un business intorno ai propri contenuti. Include strumenti moderni per costruire un sito web, pubblicare contenuti, inviare newsletter e offrire abbonamenti a pagamento ai membri.

    **EASY SITE DESIGN**
    Controllo completo su sito web e branding.
    - Lancia un sito personalizzato e regola le impostazioni di design per abbinarle perfettamente a marca e stile.
    - Vai oltre con centinaia di temi personalizzati nel marketplace, o costruisci il tuo design completamente custom da zero.
    - La tua marca unica resta in primo piano, mentre Ghost lavora in background.

    **ADVANCED CREATOR TOOLS**
    Pubblica via web e newsletter email.
    - Un editor costruito da zero per professionisti. Calmo nel design, con workflow avanzati di default.
    - Basta soffrire con toolbar goffe o drag & oops.
    - Rich media e card dinamiche.
    - Newsletter integrate.

    **GROW YOUR AUDIENCE**
    Trasforma quei click in contatti.
    - Ghost lo rende semplice, con form di iscrizione nativi che trasformano viste anonime in membri loggati.
    - Consenti di iscriversi gratis o acquistare un abbonamento a pagamento con livelli premium mensili e annuali.

    **RUN YOUR BUSINESS**
    Gestisci le membership.
    - Vedi chi si iscrive, chi paga e cosa legge, per capire meglio il tuo pubblico principale.
    Analytics native.
    - Analytics dettagliate di engagement per capire quali contenuti ottengono più attenzione e chi sono i tuoi fan più grandi.
    Offerte e promozioni.
    - Attira nuovi abbonati con offerte e promozioni per far crescere il business.

    **INTEGRATIONS**
    Tutte le tue app, plugin e tool preferiti, integrati con Ghost
