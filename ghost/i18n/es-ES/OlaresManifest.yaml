metadata:
  title: Ghost
  description: Tecnología independiente para publicación moderna, membresías, suscripciones
    y newsletters
spec:
  fullDescription: |
    Ghost es una potente app para editores profesionales que crea, comparte y hace crecer un negocio en torno a su contenido. Incluye herramientas modernas para construir un sitio web, publicar contenido, enviar newsletters y ofrecer suscripciones de pago a miembros.

    **EASY SITE DESIGN**
    Control total sobre tu sitio web y marca.
    - Lanza un sitio personalizado y ajusta la configuración de diseño para que coincida perfectamente con tu marca y estilo.
    - Ve más allá con cientos de temas personalizados en nuestro marketplace, o construye tu propio diseño completamente a medida desde cero.
    - Tu marca única queda en primer plano, mientras Ghost funciona en segundo plano.

    **ADVANCED CREATOR TOOLS**
    Publica por web y newsletter por email.
    - Un editor construido desde cero para profesionales. Calmado por diseño, con flujos avanzados por defecto.
    - Se acabó sufrir con barras de herramientas torpes o drag & oops.
    - Rich media y cards dinámicas.
    - Newsletters integrados.

    **GROW YOUR AUDIENCE**
    Transforma esos clics en contactos.
    - Ghost lo facilita, con formularios de registro nativos que convierten vistas anónimas en miembros conectados.
    - Permite registrarse gratis o comprar una suscripción de pago en niveles premium mensuales y anuales.

    **RUN YOUR BUSINESS**
    Gestiona tus membresías.
    - Ve quién se registra, quién paga y qué lee, para entender mejor a tu audiencia principal.
    Analíticas nativas.
    - Analíticas detalladas de engagement para entender qué contenido recibe más atención y quiénes son tus mayores fans.
    Ofertas y promociones.
    - Atrae nuevos suscriptores con ofertas y promociones para hacer crecer tu negocio.

    **INTEGRATIONS**
    Todas tus apps, plugins y herramientas favoritas, integradas con Ghost
  upgradeDescription: |
