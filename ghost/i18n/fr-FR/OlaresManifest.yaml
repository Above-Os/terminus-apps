metadata:
  title: Ghost
  description: Technologie indépendante pour l'édition moderne, les adhésions, les abonnements
    et les newsletters.
spec:
  fullDescription: |
    Ghost est une application puissante pour les éditeurs professionnels afin de créer, partager et faire croître une activité autour de leur contenu. Elle propose des outils modernes pour construire un site web, publier du contenu, envoyer des newsletters et offrir des abonnements payants aux membres.

    **EASY SITE DESIGN**
    Contrôle total sur votre site web et votre marque.
    - Lancez un site personnalisé et ajustez les paramètres de design pour correspondre parfaitement à votre marque et votre style.
    - Allez plus loin avec des centaines de thèmes personnalisés dans notre marketplace, ou construisez votre propre design entièrement sur mesure depuis zéro.
    - Votre marque unique reste au premier plan, tandis que Ghost fonctionne en arrière-plan.

    **ADVANCED CREATOR TOOLS**
    Publiez via le web et la newsletter e-mail.
    - Un éditeur conçu de A à Z pour les professionnels. Calme par design, avec des workflows avancés par défaut.
    - Fini de souffrir avec des barres d'outils maladroites ou du drag & oops.
    - Rich media et cards dynamiques.
    - Newsletters intégrées.

    **GROW YOUR AUDIENCE**
    Transformez ces clics en contacts.
    - Ghost le rend facile, avec des formulaires d'inscription natifs qui transforment les vues anonymes en membres connectés.
    - Permettez aux gens de s'inscrire gratuitement, ou d'acheter un abonnement payant avec des niveaux premium mensuels et annuels.

    **RUN YOUR BUSINESS**
    Gérez vos adhésions.
    - Voyez qui s'inscrit, qui paie et ce qu'ils lisent, pour mieux comprendre votre audience principale.
    Analytics natives.
    - Analytics d'engagement détaillées pour comprendre quel contenu attire le plus d'attention et qui sont vos plus grands fans.
    Offres et promotions.
    - Attirez de nouveaux abonnés avec des offres et promotions pour faire croître votre activité.

    **INTEGRATIONS**
    Toutes vos apps, plugins et outils préférés, intégrés avec Ghost
  upgradeDescription: |
    - Correction des problèmes de validation des noms d'utilisateur TikTok et Instagram (24708) - Troy Ciesco
    - Correction du problème des images d'en-tête dans Outlook (24665) - Troy Ciesco
    - Ajout de la pagination manquante pour les invitations staff dans les paramètres admin - Jonatan Svennberg
    - Ajout des traductions basques (24642) - Xabi

