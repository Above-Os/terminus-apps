metadata:
  title: Ghost
  description: Unabhängige Technologie für modernes Publizieren, Mitgliedschaften, Abonnements
    und Newsletter.
spec:
  fullDescription: |
    Ghost ist eine leistungsstarke App für professionelle Publisher, um ein Business rund um ihre Inhalte zu erstellen, zu teilen und wachsen zu lassen. Sie bietet moderne Werkzeuge zum Aufbau einer Website, zum Veröffentlichen von Inhalten, zum Versenden von Newslettern und zum Anbieten bezahlter Abonnements für Mitglieder.

    **EASY SITE DESIGN**
    Volle Kontrolle über Website und Branding.
    - Starten Sie eine individuelle Website und passen Sie Designeinstellungen an Marke und Stil an.
    - Gehen Sie weiter mit Hunderten von Custom Themes in unserem Marketplace oder bauen Sie Ihr komplett eigenes Design von Grund auf.
    - Ihre einzigartige Marke steht im Vordergrund, während Ghost im Hintergrund läuft.

    **ADVANCED CREATOR TOOLS**
    Veröffentlichen per Web & E-Mail-Newsletter.
    - Ein Editor von Grund auf für Profis. Ruhig im Design, mit fortgeschrittenen Workflows standardmäßig.
    - Kein Leiden mehr unter unhandlichen Toolbars oder Drag & Oops.
    - Rich Media & dynamische Cards.
    - Newsletter integriert.

    **GROW YOUR AUDIENCE**
    Verwandeln Sie Klicks in Kontakte.
    - Ghost macht es einfach, mit nativen Anmeldeformularen anonyme Views in eingeloggte Mitglieder zu verwandeln.
    - Lassen Sie Menschen kostenlos anmelden oder ein bezahltes Abonnement kaufen — monatliche und jährliche Premium-Stufen.

    **RUN YOUR BUSINESS**
    Verwalten Sie Ihre Mitgliedschaften.
    - Sehen Sie, wer sich anmeldet, wer zahlt und was gelesen wird, um Ihre Kernzielgruppe besser zu verstehen.
    Native Analytics.
    - Detaillierte Engagement-Analysen, damit Sie verstehen, welche Inhalte am meisten Aufmerksamkeit bekommen und wer Ihre größten Fans sind.
    Offers & promotions.
    - Gewinnen Sie neue Abonnenten mit Angeboten und Aktionen.

    **INTEGRATIONS**
    Alle Ihre Lieblings-Apps, Plugins und Tools, integriert mit Ghost
  upgradeDescription: |
