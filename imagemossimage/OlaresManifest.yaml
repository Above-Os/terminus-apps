    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: "2"
    limitedCpu: "16"
    requiredMemory: 16Gi
    limitedMemory: 32Gi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
    requiredGPUMemory: 19Gi
    limitedGPUMemory: 19Gi

permission:
  appData: true
  appCommon: true

options:
  # One instance in <name>-shared, installed by an admin and on every user's
  # desktop; the GPU and model downloads are shared.
  shared: true
  # Model downloads and long generations hold connections open.
  apiTimeout: 0
  dependencies:
  # 1.12.8's HAMi hands the GPU over in milliseconds in time slicing; 1.12.7
  # takes about 5 s per switch.
  - name: olares
    version: '>=1.12.8-0'
    type: system

workloadReplicas:
  imagemossimage: 1

envs:
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: PRECISION
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: "int8"
  options:
  - title: "INT8 (official, 13 GB download)"
    value: int8
  - title: "NVFP4 (third-party, 12 GB download)"
    value: nvfp4
  - title: All
    value: all
  description: "The weights to download first. More can be downloaded or deleted later in Settings."
- envName: STUDIO_LLM_BASE_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: "OpenAI-compatible base URL for AI prompt structuring. Leave empty to use Router at https://router.<your Olares domain>/v1."
- envName: STUDIO_LLM_MODEL
  type: string
  required: false
  editable: true
  applyOnChange: true
  default: default-chat
  description: "Chat model name. default-chat follows Router's default chat route."
- envName: STUDIO_LLM_API_KEY
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: "Optional API key for the chat endpoint. Router needs none."
