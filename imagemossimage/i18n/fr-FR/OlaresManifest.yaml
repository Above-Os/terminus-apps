metadata:
  title: "MOSS Image"
  description: "MOSS Image génère et modifie des images avec OpenMOSS MOSS-Image à partir de texte ou d'images de référence"
spec:
  fullDescription: |
    Générez des images à partir d'une description, avec des enseignes, affiches et étiquettes écrites exactement comme vous les tapez, en anglais ou en chinois. Ajoutez une image et dites ce qu'il faut changer pour la modifier, ou choisissez un format d'image pour composer une nouvelle image à partir de quatre références au maximum. Peignez sur la zone à changer, agrandissez la toile ou supprimez l'arrière-plan de n'importe quel résultat. Les résultats, les imports et la file d'attente restent sur votre Olares et sont partagés sur tous les appareils où vous ouvrez l'app.

    L'app exécute le modèle sur votre Olares pour générer et modifier des images :
    - Une seule zone de prompt : écrivez une description pour générer, ou ajoutez des images pour les modifier et mentionnez chacune dans le prompt.
    - Les enseignes, affiches, étiquettes et notes sont écrites comme vous les tapez, en anglais ou en chinois. Mettez le texte exact entre guillemets.
    - Ajoutez une image et dites ce qu'il faut changer pour la modifier, ou choisissez un format d'image pour composer une nouvelle image à partir de quatre références au maximum.
    - L'optimisation IA enrichit votre prompt avec les instructions de l'amplificateur de prompts de MOSS-Image, via un modèle de chat de Router qui voit aussi les images ajoutées. Choisissez le modèle dans les réglages.
    - Peignez sur la zone à changer, agrandissez la toile ou supprimez l'arrière-plan en un ou deux clics.
    - Une file d'attente et une grille de résultats partagées sur tous les appareils, avec une vue avant/après pour chaque modification.
    - Les imports et les résultats restent dans une bibliothèque sur votre Olares, même après un redémarrage.
    - L'éditeur ComfyUI complet s'ouvre avec chaque workflow chargé, pour aller au-delà de l'app.
    - Un administrateur l'installe une seule fois pour tous sur votre Olares ; la file d'attente, les imports et les résultats de chacun lui restent propres, et les projets permettent de les partager avec certaines personnes ou avec tous.
    - Les fichiers sont conservés dans Common/Studio, dans un dossier par personne.
    - Les modèles sont téléchargés au premier démarrage et partagés avec les autres apps ComfyUI et FlowStudio.

    L'optimisation IA nécessite une app de modèle de chat installée et disponible dans Router. Ses instructions sont adaptées de l'amplificateur de prompts du modèle de workflow MOSS-Image de ComfyUI, rédigé à partir du skill MOSS-Image Prompt Enhancer d'OpenMOSS. Les poids NVFP4 sont une conversion tierce (BennyDaBall/MOSS-Image-SFT-NVFP4), plus rapide sur les GPU RTX série 50 et RTX PRO Blackwell.
  upgradeDescription: |
    Lors de la reformulation des prompts par l’IA, Studio précise la langue de sortie. Les modes en anglais traduisent toute la description. Si la langue de sortie ne correspond pas au choix, Studio tente de la corriger et conserve le prompt d’origine si la correction échoue.
