metadata:
  title: "MOSS Image"
  description: "MOSS Image genera e modifica immagini con OpenMOSS MOSS-Image da testo o immagini di riferimento"
spec:
  fullDescription: |
    Genera immagini da una descrizione, con insegne, poster ed etichette scritti esattamente come li digiti, in inglese o in cinese. Aggiungi un'immagine e di' cosa cambiare per modificarla, oppure scegli un rapporto d'aspetto per comporre una nuova immagine da un massimo di quattro riferimenti. Dipingi sulla parte da cambiare, estendi la tela o rimuovi lo sfondo da qualsiasi risultato. Risultati, caricamenti e coda restano sul tuo Olares e sono condivisi su ogni dispositivo in cui apri l'app.

    L'app esegue il modello sul tuo Olares per generare e modificare immagini:
    - Un solo campo prompt: scrivi una descrizione per generare, oppure aggiungi immagini da modificare e cita ciascuna nel prompt.
    - Insegne, poster, etichette e note escono scritti come li digiti, in inglese o in cinese. Metti il testo esatto tra virgolette.
    - Aggiungi un'immagine e di' cosa cambiare per modificarla, oppure scegli un rapporto d'aspetto per comporre una nuova immagine da un massimo di quattro riferimenti.
    - L'ottimizzazione IA amplia il prompt con le istruzioni del potenziatore di prompt di MOSS-Image, tramite un modello di chat di Router che vede anche le immagini aggiunte. Il modello si sceglie nelle Impostazioni.
    - Dipingi sulla zona da cambiare, estendi la tela o rimuovi lo sfondo con uno o due clic.
    - Una coda e una griglia di risultati condivise su tutti i dispositivi, con vista prima e dopo per ogni modifica.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con ogni workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.

    L'ottimizzazione IA richiede un'app di modello di chat installata e disponibile in Router. Le sue istruzioni sono adattate dal potenziatore di prompt del modello di workflow MOSS-Image di ComfyUI, scritto a partire dallo skill MOSS-Image Prompt Enhancer di OpenMOSS. I pesi NVFP4 sono una conversione di terze parti (BennyDaBall/MOSS-Image-SFT-NVFP4), più veloce sulle GPU RTX serie 50 e RTX PRO Blackwell.
  upgradeDescription: |
    Quando l’IA riscrive i prompt, Studio indica la lingua da usare. Le modalità in inglese traducono l’intera descrizione. Se la lingua del risultato non corrisponde a quella selezionata, Studio prova a correggerla e, se non ci riesce, conserva il prompt originale.
