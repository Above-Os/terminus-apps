metadata:
  title: "MOSS Image"
  description: "MOSS Image genera y edita imágenes con OpenMOSS MOSS-Image a partir de texto o imágenes de referencia"
spec:
  fullDescription: |
    Genera imágenes a partir de una descripción, con letreros, carteles y etiquetas escritos tal como los tecleas, en inglés o en chino. Añade una imagen y di qué cambiar para editarla, o elige una relación de aspecto para crear una imagen nueva a partir de hasta cuatro referencias. Pinta sobre la parte que quieres cambiar, amplía el lienzo o quita el fondo de cualquier resultado. Los resultados, las subidas y la cola se guardan en tu Olares y se comparten en todos los dispositivos donde abras la app.

    La app ejecuta el modelo en tu Olares para generar y editar imágenes:
    - Un cuadro de prompt: escribe una descripción para generar, o añade imágenes para editarlas y menciona cada una en el prompt.
    - Los letreros, carteles, etiquetas y notas salen escritos tal como los tecleas, en inglés o en chino. Pon el texto exacto entre comillas.
    - Añade una imagen y di qué cambiar para editarla, o elige una relación de aspecto para crear una imagen nueva a partir de hasta cuatro referencias.
    - La optimización con IA amplía tu prompt con las instrucciones del potenciador de prompts de MOSS-Image, usando un modelo de chat de Router que también ve las imágenes que añades. El modelo se elige en Ajustes.
    - Pinta sobre la zona que quieres cambiar, amplía el lienzo o quita el fondo con uno o dos clics.
    - Una cola y una cuadrícula de resultados compartidas en todos los dispositivos, con vista de antes y después para cada edición.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con cada flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.

    La optimización con IA necesita una app de modelo de chat instalada y disponible en Router. Sus instrucciones están adaptadas del potenciador de prompts de la plantilla de flujo de trabajo MOSS-Image de ComfyUI, escrita a partir del skill MOSS-Image Prompt Enhancer de OpenMOSS. Los pesos NVFP4 son una conversión de terceros (BennyDaBall/MOSS-Image-SFT-NVFP4), más rápida en GPU RTX serie 50 y RTX PRO Blackwell.
  upgradeDescription: |
    Puedes reordenar las imágenes de referencia en el panel de creación. Añade imágenes locales con el botón de carga o pégalas desde el portapapeles.
