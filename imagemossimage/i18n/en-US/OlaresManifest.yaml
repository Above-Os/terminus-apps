metadata:
  title: "MOSS Image"
  description: "MOSS Image generates and edits images from text or reference images with OpenMOSS MOSS-Image"
spec:
  fullDescription: |
    Generate images from a description, with signs, posters and labels spelled the way you write them in English or Chinese. Add an image and say what to change to edit it, or pick an aspect ratio to compose a new image from up to four references. Paint over the part to change, extend the canvas or remove the background from any result. Results, uploads and the queue are kept on your Olares and shared by every device you open the app on.

    The app runs the model on your Olares for generating and editing images:
    - One prompt box: write a description to generate, or add images to edit them and mention each one in the prompt.
    - Signs, posters, labels and notes come out spelled the way you write them, in English or Chinese. Put the exact words in quotes.
    - Add an image and say what to change to edit it, or pick an aspect ratio to compose a new image from up to four references.
    - AI optimize expands your prompt with the instructions of MOSS-Image's prompt enhancer, using a chat model from Router that also sees the images you add. Pick the model in Settings.
    - Paint over the part of an image to change, extend the canvas, or remove the background, in one or two clicks.
    - A queue and a result grid shared by every device you open it on, with a before and after view for each edit.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with each workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.

    AI optimize needs a chat model application installed and listed in Router. Its instructions are adapted from the prompt upsampler in ComfyUI's MOSS-Image workflow template, written from OpenMOSS's MOSS-Image Prompt Enhancer skill. The NVFP4 weights are a third-party conversion (BennyDaBall/MOSS-Image-SFT-NVFP4), fastest on RTX 50-series and RTX PRO Blackwell GPUs.
  upgradeDescription: |
    Studio reconnects in the background and shows a warning only if the connection is still down after eight seconds. When it reconnects, the queue updates and you can browse images completed while you were offline, even across multiple pages. The queue shows sampling progress and timing when available. The asset picker shows placeholders while media loads.

    [View this release](https://github.com/beclab/flowstudio2/releases/tag/imagemossimage/v0.1.6)
