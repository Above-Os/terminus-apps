metadata:
  title: "MOSS Image"
  description: "MOSS Image は OpenMOSS MOSS-Image で、テキストまたは参照画像から画像を生成・編集します"
spec:
  fullDescription: |
    説明文から画像を生成します。看板、ポスター、ラベルの文字は、英語でも中国語でも書いたとおりの綴りで描かれます。画像を追加して変えたい点を書けば編集、アスペクト比を選べば最大 4 枚の参照画像から新しい画像を作ります。どの結果でも、変えたい部分の塗りつぶし、キャンバスの拡張、背景の削除ができます。結果、アップロードした素材、キューは Olares に保存され、アプリを開くすべてのデバイスで共有されます。

    このアプリは、Olares 上でこのモデルを動かして画像を生成・編集します。
    - プロンプト欄ひとつ：説明を書いて生成するか、画像を追加して編集し、プロンプトでそれぞれに触れます。
    - 看板、ポスター、ラベル、メモの文字は、英語でも中国語でも書いたとおりに描かれます。正確な文言は引用符で囲んでください。
    - 画像を追加して変えたい点を書けば編集、アスペクト比を選べば最大 4 枚の参照画像から新しい画像を作ります。
    - AI 最適化は MOSS-Image のプロンプト拡張の指示でプロンプトを書き広げます。Router のチャットモデルを使い、追加した画像もモデルに渡します。モデルは設定で選べます。
    - 変えたい部分の塗りつぶし、キャンバスの拡張、背景の削除が 1〜2 クリックでできます。
    - キューと結果グリッドはすべてのデバイスで共有され、編集ごとに前後を比較できます。
    - アップロードと結果は Olares 上のライブラリに保存され、再起動後も残ります。
    - 各ワークフローを読み込んだ状態で ComfyUI エディターを開き、アプリ以外の変更もできます。
    - 管理者が一度インストールすれば Olares の全員が使えます。キュー、アップロード、結果は各自のもので、プロジェクトを使って選んだ人や全員と共有できます。
    - ファイルは Common/Studio の下に、ユーザーごとのフォルダーで保存されます。
    - モデルは初回起動時にダウンロードされ、他の ComfyUI アプリや FlowStudio と共有されます。

    AI 最適化を使うには、チャットモデルのアプリをインストールし、Router で利用できる状態にする必要があります。指示文は ComfyUI の MOSS-Image ワークフローテンプレートにあるプロンプト拡張を改変したもので、その元は OpenMOSS の MOSS-Image Prompt Enhancer スキルです。NVFP4 の重みはサードパーティによる変換版（BennyDaBall/MOSS-Image-SFT-NVFP4）で、RTX 50 シリーズと RTX PRO Blackwell の GPU で最も速く動きます。
  upgradeDescription: |
    画像の下書きには、スペースごとにプロンプト、設定、参照画像が保存されます。キューで進捗を確認したり、タスクをキャンセルしたりできます。結果画面とライブラリで画像名を変更でき、失敗したタスクはその場で再試行できます。キャンバスを拡張するときは、ドラッグして元の画像を移動したり、サイズを調整したりできます。モデルの精度は詳細設定から選べます。
