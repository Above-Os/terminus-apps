metadata:
  title: "MOSS Image"
  description: "MOSS Image 用 OpenMOSS MOSS-Image 从文字或参考图片生成和编辑图片"
spec:
  fullDescription: |
    根据描述生成图片，招牌、海报和标签上的文字按你写的英文或中文拼出来。添加一张图并说明要改什么就是编辑；选一个画面比例，就用最多四张参考图生成一张新图。可以在任意结果上涂抹要修改的部分、扩展画布或去除背景。结果、上传的素材和队列都保存在你的 Olares 上，在任何设备上打开应用都能看到。

    这个应用在你的 Olares 上运行该模型，用来生成和编辑图片：
    - 一个输入框：写描述生成图片，或添加图片进行编辑，并在提示词中提到每张图片。
    - 招牌、海报、标签和便条上的文字按你写的拼出来，支持英文和中文。把要出现的原文放在引号里。
    - 添加一张图并说明要改什么就是编辑，选一个画面比例就用最多四张参考图生成新图。
    - AI 优化使用 MOSS-Image 提示词增强器的指令扩写提示词，调用 Router 中的对话模型，模型也能看到你添加的图片。可在设置中选择模型。
    - 一两下就能涂抹要修改的区域、扩展画布或去除背景。
    - 队列和结果网格在所有设备上同步，每次编辑都能对比前后效果。
    - 上传的素材和生成结果保存在 Olares 的素材库中，重启后仍在。
    - 可以打开完整的 ComfyUI 编辑器，每个工作流都已载入，用于应用之外的修改。
    - 管理员安装一次，Olares 上的所有人都能用；每个人的队列、上传和结果各自独立，可以通过项目分享给指定的人或所有人。
    - 文件保存在 Common/Studio 下，每人一个文件夹。
    - 模型在首次启动时下载，并与其他 ComfyUI 应用和 FlowStudio 共享。

    AI 优化需要安装一个对话模型应用，并在 Router 中可用。它的指令改编自 ComfyUI 的 MOSS-Image 工作流模板中的提示词扩写器，后者依据 OpenMOSS 的 MOSS-Image Prompt Enhancer skill 编写。NVFP4 权重是第三方转换的版本（BennyDaBall/MOSS-Image-SFT-NVFP4），在 RTX 50 系列和 RTX PRO Blackwell 显卡上最快。
  upgradeDescription: |
    Studio 会在后台重连。断线持续 8 秒才会显示提示。恢复连接后，队列会自动更新，断线期间生成的图片可以继续翻页查看。有数据时，队列会显示采样进度和任务用时。选择素材时，预览加载期间会显示占位提示。

    [查看此版本](https://github.com/beclab/flowstudio2/releases/tag/imagemossimage/v0.1.6)
