metadata:
  title: "MOSS Image"
  description: "MOSS Image erzeugt und bearbeitet mit OpenMOSS MOSS-Image Bilder aus Text oder Referenzbildern"
spec:
  fullDescription: |
    Erzeugen Sie Bilder aus einer Beschreibung, mit Schildern, Postern und Etiketten, die so geschrieben sind, wie Sie sie auf Englisch oder Chinesisch eingeben. Fügen Sie ein Bild hinzu und beschreiben Sie die Änderung, um es zu bearbeiten, oder wählen Sie ein Seitenverhältnis, um aus bis zu vier Referenzen ein neues Bild zu erstellen. Übermalen Sie den zu ändernden Bereich, erweitern Sie die Leinwand oder entfernen Sie den Hintergrund eines beliebigen Ergebnisses. Ergebnisse, Uploads und die Warteschlange bleiben auf Ihrem Olares und sind auf jedem Gerät verfügbar, auf dem Sie die App öffnen.

    Die App führt das Modell auf Ihrem Olares aus, um Bilder zu erzeugen und zu bearbeiten:
    - Ein Prompt-Feld: Schreiben Sie eine Beschreibung zum Erzeugen, oder fügen Sie Bilder zum Bearbeiten hinzu und erwähnen Sie jedes im Prompt.
    - Schilder, Poster, Etiketten und Notizen werden so geschrieben, wie Sie sie eingeben, auf Englisch oder Chinesisch. Setzen Sie den genauen Wortlaut in Anführungszeichen.
    - Fügen Sie ein Bild hinzu und beschreiben Sie die Änderung, um es zu bearbeiten, oder wählen Sie ein Seitenverhältnis für ein neues Bild aus bis zu vier Referenzen.
    - KI-Optimierung erweitert Ihren Prompt mit den Anweisungen des Prompt-Enhancers von MOSS-Image, über ein Chat-Modell aus dem Router, das auch Ihre Bilder sieht. Das Modell wählen Sie in den Einstellungen.
    - Übermalen Sie den zu ändernden Bereich, erweitern Sie die Leinwand oder entfernen Sie den Hintergrund mit ein oder zwei Klicks.
    - Eine Warteschlange und ein Ergebnisraster, geteilt auf allen Geräten, mit Vorher-Nachher-Ansicht für jede Bearbeitung.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem jeweiligen Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.

    Für die KI-Optimierung muss eine Chat-Modell-App installiert und im Router verfügbar sein. Ihre Anweisungen sind aus dem Prompt-Upsampler der MOSS-Image-Workflow-Vorlage von ComfyUI übernommen, die auf dem Skill „MOSS-Image Prompt Enhancer“ von OpenMOSS beruht. Die NVFP4-Gewichte sind eine Konvertierung eines Drittanbieters (BennyDaBall/MOSS-Image-SFT-NVFP4) und laufen auf GPUs der RTX-50-Serie und RTX PRO Blackwell am schnellsten.
  upgradeDescription: |
    Studio stellt die Verbindung im Hintergrund wieder her. Eine Warnung erscheint erst, wenn die Verbindung acht Sekunden lang unterbrochen ist. Nach der Wiederherstellung wird die Warteschlange aktualisiert. Während der Unterbrechung erstellte Bilder lassen sich auch über mehrere Seiten hinweg ansehen. Die Warteschlange zeigt den Sampling-Fortschritt und die Verarbeitungszeit an, sofern verfügbar. Bei der Medienauswahl erscheinen Platzhalter, während die Vorschauen geladen werden.

    [Diese Version ansehen](https://github.com/beclab/flowstudio2/releases/tag/imagemossimage/v0.1.6)
