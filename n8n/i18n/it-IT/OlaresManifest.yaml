metadata:
  title: n8n
  description: n8n è uno strumento estendibile di automazione dei workflow

spec:
  fullDescription: |
    n8n è uno strumento estendibile di automazione dei workflow. Con un modello di distribuzione fair-code, n8n avrà sempre il codice sorgente visibile, sarà disponibile per self-hosting e ti permetterà di aggiungere funzioni, logica e app personalizzate. L'approccio basato su nodi lo rende altamente versatile, collegando qualsiasi cosa a tutto.

    **Integrazioni disponibili**
    n8n ha oltre 200 nodi diversi per automatizzare i workflow. L'elenco è su: https://n8n.io/integrations

    **Workflow potenti, davvero veloci**
    - Gestire processi davvero complessi  
    - Debug semplice  
    - Usare template per partire in fretta  
    - Codice quando serve, UI quando no  
    - Riutilizzare il proprio lavoro

    **Tranquillità**
    - Collegarsi a qualsiasi sistema  
    - Personalizzare la gestione errori  
    - Scaling orizzontale  
    - Hosting sulla propria infrastruttura

    **Funzionalità**
    - Editor visuale dei workflow
    - Eseguire JavaScript
    - Import di pacchetti npm
    - I workflow possono attendere
    - Logica condizionale e ramificazione
    - Trigger webhook
    - Riprovare esecuzioni fallite
    - Workflow multi-trigger
    - Codice sorgente disponibile
    - Gestione utenti
    - Creare nodi personalizzati
    - Store credenziali crittografato
    - Copia e incolla dei workflow
    - Esportare workflow in JSON
    - Workflow di errore personalizzati

  upgradeDescription: |
    Aggiorna n8n a 2.46.6. Include correzioni di workflow, risoluzione delle credenziali ed editor della serie 2.46.

    Aggiunge un esecutore separato per i nodi Code JavaScript e Python nativo. I pacchetti Python personalizzati non sono inclusi; le importazioni mantengono le restrizioni predefinite del progetto originale.

    Note di rilascio: https://github.com/n8n-io/n8n/releases/tag/n8n%402.46.6
