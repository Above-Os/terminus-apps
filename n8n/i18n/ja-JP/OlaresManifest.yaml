metadata:
  title: n8n
  description: n8n は拡張可能なワークフロー自動化ツールです

spec:
  fullDescription: |
    n8n は拡張可能なワークフロー自動化ツールです。フェアコード配布モデルにより、ソースコードは常に可視で、セルフホスト可能、独自の関数・ロジック・アプリを追加できます。ノードベースのアプローチにより非常に汎用的で、あらゆるものをすべてに接続できます。

    **利用可能な連携**
    n8n にはワークフロー自動化用の 200 以上の異なるノードがあります。一覧はこちら: https://n8n.io/integrations

    **強力なワークフローを、本当に速く**
    - 本当に複雑なプロセスを処理  
    - シンプルなデバッグ  
    - テンプレートで素早く開始  
    - 必要なときはコード、不要なときは UI  
    - 作業を再利用

    **安心感**
    - あらゆるシステムに接続  
    - エラー処理をカスタマイズ  
    - 水平スケーリング  
    - 自前インフラでホスト

    **機能**
    - ビジュアルワークフローエディタ
    - JavaScript の実行
    - npm パッケージのインポート
    - ワークフローの待機
    - 条件分岐ロジック
    - Webhook トリガー
    - 失敗した実行の再試行
    - マルチトリガーワークフロー
    - ソースコード利用可能
    - ユーザー管理
    - カスタムノードの作成
    - 暗号化された認証情報ストア
    - ワークフローのコピー＆ペースト
    - ワークフローの JSON エクスポート
    - カスタムエラーワークフロー

  upgradeDescription: |
    n8n を 2.33.0 にアップグレード（chart 1.1.3）。レガシー Olares 1.12.3 appData パス分岐を削除。

    **デプロイ変更**
    - イメージ: `n8nio/n8n:2.33.0`
    - HostPath は常に `userspace.appData/`（最低 Olares 1.12.6; `sysVersion >= 1.12.3` 分岐を削除）
    - `N8N_WEBHOOK_URL` のみ使用（非推奨の `WEBHOOK_URL` を削除）
    - 現行の 5 分 Code/runner タスクタイムアウトを維持するため `N8N_RUNNERS_TASK_TIMEOUT=300` をピン留め
    - 他のリバースプロキシ env は変更なし: `N8N_PROTOCOL`、`N8N_EDITOR_BASE_URL`、`N8N_PROXY_HOPS`、`N8N_SECURE_COOKIE`

    **Env / 起動メモ（2.27.5 → 2.33.0）**
    - 必須の起動コマンド変更なし（デフォルトイメージエントリポイント）
    - 任意の新規変数（本チャートでは未設定）: `N8N_SCHEDULER_MAX_ATTEMPTS`、`N8N_MCP_BASE_URL`、agents-tracing 関連 env

    **重要な注意**
    - データベースマイグレーションは起動時に自動実行
    - 設定 > 移行レポートでワークフロー互換性を確認

    参照: https://github.com/n8n-io/n8n/releases/tag/n8n%402.33.0
