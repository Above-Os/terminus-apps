{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-runtime" .Release.Name) -}}
{{- $runnerToken := randAlphaNum 64 -}}
{{- if and $existing $existing.data (index $existing.data "N8N_RUNNERS_AUTH_TOKEN") -}}
  {{- $runnerToken = index $existing.data "N8N_RUNNERS_AUTH_TOKEN" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-runtime
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  N8N_RUNNERS_AUTH_TOKEN: {{ $runnerToken | quote }}
  DB_POSTGRESDB_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: {{ .Release.Namespace }}
  labels:
    app: n8n
spec:
  replicas: {{ .Values.workloads.n8n.replicaCount }}
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate      
  template:
    metadata:
      annotations:
        checksum/runner-token: {{ $runnerToken | sha256sum | quote }}
      labels:
        app: n8n
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-chown-data
          image: beclab/aboveos-busybox:1.37.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /data
          volumeMounts:
            - mountPath: /data
              name: n8n-config
      volumes:
        - name: runner-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: n8n-config
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}/'
      containers:
        - name: n8n
          image: "docker.io/n8nio/n8n:2.46.6"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 3000m
              memory: 6Gi
          ports:
            - containerPort: 5678
          envFrom:
            - configMapRef:
                name: n8n-config
          env:
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-runtime
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-runtime
                  key: DB_POSTGRESDB_PASSWORD
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-config
        - name: task-runners
          image: "docker.io/n8nio/runners:2.46.6"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://127.0.0.1:5679"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-runtime
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "300"
            - name: N8N_RUNNERS_MAX_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: runner-tmp
              mountPath: /tmp
