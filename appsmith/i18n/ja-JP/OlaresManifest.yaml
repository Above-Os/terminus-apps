metadata:
  title: Appsmith
  description: 管理パネル、内部ツール、ダッシュボードを構築するプラットフォーム
spec:
  fullDescription: |
    Appsmith は、社内アプリの迅速な開発を可能にするオープンソースツールです。事前構築ウィジェットをドラッグ＆ドロップして UI を構築できます。データソース経由でデータベースや API に安全に接続します。クエリと JavaScript でビジネスロジックを書き、データを読み書きします。

    数千のチームが Appsmith ローコードアプリケーションプラットフォームを使い、エンタープライズ級のセキュリティとガバナンスを備えた効果的なソフトウェアを迅速に構築・デプロイ・管理しています。

    **Appsmith を選ぶ理由**
    Appsmith なら、あらゆるデータソースと対話する UI を簡単に構築できます。シンプルな CRUD アプリから複雑な多段階ワークフローまで、わずかな手順で作成できます：

    データソースを接続
    データベースまたは API と統合。Appsmith は主要なデータベースと REST API をサポートします。

    UI を構築
    組み込みウィジェットでアプリのレイアウトを組み立てます。

    ロジックを記述
    エディタ内のどこでもクエリと JavaScript でビジネスロジックを表現します。

    共同作業、デプロイ、共有
    Appsmith は Git によるバージョン管理をサポートし、ブランチで変更を追跡・ロールバックしながら共同でアプリを構築できます。アプリをデプロイして他のユーザーと共有します。

  upgradeDescription: |
    Appsmith EE を 2.2.1（`appsmith/appsmith-ee:v2.2.1`）へアップグレード。

    `APPSMITH_ENCRYPTION_PASSWORD` と `APPSMITH_ENCRYPTION_SALT` を Kubernetes Secret に移し、`secretKeyRef` で注入。

    公式イメージで未使用の `PUID` / `PGID` / `DISPLAY` 環境変数を削除。

    レガシーな `sysVersion >= 1.12.3` の appData パス分岐を削除し、常に `appData/stacks` を使用（Olares 最低 1.12.6）。

    Appsmith コンテナとアプリエンベロープの CPU/メモリ要求と制限をわずかに引き上げ。
