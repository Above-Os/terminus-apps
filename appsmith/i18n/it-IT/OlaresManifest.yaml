metadata:
  title: Appsmith
  description: Piattaforma per creare pannelli admin, strumenti interni e dashboard
spec:
  fullDescription: |
    Appsmith è uno strumento open-source che consente lo sviluppo rapido di app interne. Puoi trascinare e rilasciare widget predefiniti per costruire la UI. Connettiti in modo sicuro ai tuoi database e API tramite le sue datasources. Scrivi logica di business per leggere e scrivere dati usando query e JavaScript.

    Migliaia di team usano la piattaforma di applicazioni low-code Appsmith per costruire, distribuire e gestire rapidamente software efficace con sicurezza e governance di livello enterprise.

    **Perché Appsmith**
    Appsmith rende facile costruire una UI che parla con qualsiasi datasource. Puoi creare di tutto, da semplici app CRUD a workflow multi-step complessi, con pochi semplici passaggi:

    Connetti datasource
    Integra con un database o un'API. Appsmith supporta i database e le REST API più popolari.

    Costruisci UI
    Usa i widget integrati per costruire il layout della tua app.

    Scrivi logica
    Esprimi la tua logica di business usando query e JavaScript ovunque nell'editor.

    Collabora, distribuisci, condividi
    Appsmith supporta il controllo di versione con Git per costruire app in collaborazione usando branch per tracciare e annullare le modifiche. Distribuisci l'app e condividila con altri utenti.

  upgradeDescription: |
    Aggiornare Appsmith EE a 2.2.1 (`appsmith/appsmith-ee:v2.2.1`).

    Spostare `APPSMITH_ENCRYPTION_PASSWORD` e `APPSMITH_ENCRYPTION_SALT` in un Kubernetes Secret e iniettarli tramite `secretKeyRef`.

    Rimuovere le variabili d'ambiente `PUID` / `PGID` / `DISPLAY` non usate dall'immagine ufficiale.

    Rimuovere il branching legacy del percorso appData `sysVersion >= 1.12.3`; usare sempre `appData/stacks` (minimo Olares 1.12.6).

    Aumentare leggermente le richieste e i limiti di CPU/memoria del container Appsmith e dell'envelope dell'app.
