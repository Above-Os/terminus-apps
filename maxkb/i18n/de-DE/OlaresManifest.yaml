metadata:
  title: MaxKB
  description: Sofort einsatzbereiter, flexibler RAG-Chatbot
spec:
  fullDescription: |
    **Standard-Admin-Zugangsdaten:**
    username: admin
    password: MaxKB@123..
    
    **Übersicht**
    MaxKB = Max Knowledge Base, ein Chatbot basierend auf Large Language Models (LLM) und Retrieval-Augmented Generation (RAG). MaxKB wird häufig in Szenarien wie intelligentem Kundenservice, internen Unternehmenswissensbasen, akademischer Forschung und Bildung eingesetzt.
    
    **Sofort einsatzbereit**
    Unterstützt das direkte Hochladen von Dokumenten / das automatische Crawlen von Online-Dokumenten, mit automatischer Textaufteilung, Vektorisierung und RAG (Retrieval-Augmented Generation). Das reduziert Halluzinationen großer Modelle effektiv und bietet eine überlegene intelligente Q&A-Interaktion.
    
    **Flexible Orchestrierung**
    Ausgestattet mit einer leistungsstarken Workflow-Engine und Funktionsbibliothek zur Orchestrierung von KI-Prozessen für komplexe Geschäftsszenarien.
    
    **Nahtlose Integration**
    Ermöglicht schnelle Zero-Coding-Integration in Drittanbieter-Geschäftssysteme und stattet bestehende Systeme rasch mit intelligenten Q&A-Fähigkeiten aus.
    
    **Modellunabhängig**
    Unterstützt verschiedene große Modelle, einschließlich privater Modelle (wie DeepSeek, Llama, Qwen usw.) und öffentlicher Modelle (wie OpenAI, Claude, Gemini usw.).
  upgradeDescription: |
    Upgrade von 2.0.2 auf 2.6.1
    
