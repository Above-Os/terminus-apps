metadata:
  title: MaxKB
  description: "Chatbot RAG prêt à l'emploi et flexible"
spec:
  fullDescription: |
    **Identifiants admin par défaut :**
    username: admin
    password: MaxKB@123..
    
    **Aperçu**
    MaxKB = Max Knowledge Base, un chatbot basé sur les Large Language Models (LLM) et la Retrieval-Augmented Generation (RAG). MaxKB est largement utilisé dans des scénarios tels que le service client intelligent, les bases de connaissances internes, la recherche académique et l'éducation.
    
    **Prêt à l'emploi**
    Prend en charge le téléversement direct de documents / le crawl automatique de documents en ligne, avec découpage automatique du texte, vectorisation et RAG. Cela réduit efficacement les hallucinations des grands modèles et offre une expérience Q&A intelligente supérieure.
    
    **Orchestration flexible**
    Équipé d'un puissant moteur de workflows et d'une bibliothèque de fonctions, permettant d'orchestrer des processus IA pour des scénarios métier complexes.
    
    **Intégration transparente**
    Facilite l'intégration rapide sans code dans des systèmes tiers, dotant rapidement les systèmes existants de capacités Q&A intelligentes.
    
    **Indépendant du modèle**
    Prend en charge divers grands modèles, y compris des modèles privés (tels que DeepSeek, Llama, Qwen, etc.) et publics (comme OpenAI, Claude, Gemini, etc.).
  upgradeDescription: |
    Mise à niveau de 2.0.2 vers 2.6.1
    
    Corrections de bugs
    - Agent : Correction de l'échec d'exécution des outils dans certaines circonstances du workflow agent ; #4790
    - Agent : Correction de l'acquisition incorrecte de l'historique dans les nœuds AI Conversation avec des nœuds parallèles ; #4778
    - Agent : Correction de l'erreur frontend causée par des flux de données trop volumineux renvoyés par le backend lors des réponses IA
    - Knowledge Base : Correction des marqueurs de segmentation (lignes vides et retours chariot) qui n'étaient pas pris en compte après la segmentation intelligente ; #4791
    
    Détails complets : https://github.com/1Panel-dev/MaxKB/releases/tag/v2.6.1
