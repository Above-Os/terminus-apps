metadata:
  title: MaxKB
  description: Chatbot RAG listo para usar y flexible
spec:
  fullDescription: |
    **Credenciales de administrador predeterminadas:**
    username: admin
    password: MaxKB@123..
    
    **Resumen**
    MaxKB = Max Knowledge Base, un chatbot basado en Large Language Models (LLM) y Retrieval-Augmented Generation (RAG). MaxKB se aplica ampliamente en escenarios como atención al cliente inteligente, bases de conocimiento internas, investigación académica y educación.
    
    **Listo para usar**
    Admite la carga directa de documentos / el rastreo automático de documentos en línea, con división automática de texto, vectorización y RAG. Esto reduce eficazmente las alucinaciones de los grandes modelos y ofrece una experiencia superior de Q&A inteligente.
    
    **Orquestación flexible**
    Equipado con un potente motor de flujos de trabajo y biblioteca de funciones, permitiendo orquestar procesos de IA para escenarios empresariales complejos.
    
    **Integración fluida**
    Facilita la integración rápida sin código en sistemas de terceros, dotando rápidamente a los sistemas existentes de capacidades de Q&A inteligente.
    
    **Independiente del modelo**
    Admite diversos grandes modelos, incluidos modelos privados (como DeepSeek, Llama, Qwen, etc.) y públicos (como OpenAI, Claude, Gemini, etc.).
  upgradeDescription: |
    Actualización de 2.0.2 a 2.6.1
    
    Correcciones de errores
    - Agent: Se corrigió el fallo de ejecución de herramientas en ciertas circunstancias del flujo de trabajo del agente; #4790
    - Agent: Se corrigió la obtención incorrecta de registros históricos en nodos AI Conversation cuando había nodos paralelos; #4778
    - Agent: Se corrigió el error de frontend causado por flujos de datos excesivamente grandes del backend al responder la IA
    - Knowledge Base: Se corrigió que los marcadores de segmentación (líneas en blanco y retornos de carro) no surtían efecto tras elegir segmentación inteligente; #4791
    
    Detalles completos: https://github.com/1Panel-dev/MaxKB/releases/tag/v2.6.1
