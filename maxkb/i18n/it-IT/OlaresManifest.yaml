metadata:
  title: MaxKB
  description: "Chatbot RAG pronto all'uso e flessibile"
spec:
  fullDescription: |
    **Credenziali admin predefinite:**
    username: admin
    password: MaxKB@123..
    
    **Panoramica**
    MaxKB = Max Knowledge Base, un chatbot basato su Large Language Models (LLM) e Retrieval-Augmented Generation (RAG). MaxKB è ampiamente usato in scenari come customer service intelligente, knowledge base aziendali, ricerca accademica e istruzione.
    
    **Pronto all'uso**
    Supporta il caricamento diretto di documenti / il crawling automatico di documenti online, con suddivisione automatica del testo, vettorizzazione e RAG. Ciò riduce efficacemente le allucinazioni dei grandi modelli e offre un'esperienza Q&A intelligente superiore.
    
    **Orchestrazione flessibile**
    Dotato di un potente motore di workflow e libreria di funzioni, consente di orchestrare processi IA per scenari aziendali complessi.
    
    **Integrazione senza soluzione di continuità**
    Facilita l'integrazione rapida senza codice nei sistemi di terze parti, dotando rapidamente i sistemi esistenti di capacità Q&A intelligenti.
    
    **Indipendente dal modello**
    Supporta vari grandi modelli, inclusi modelli privati (come DeepSeek, Llama, Qwen, ecc.) e pubblici (come OpenAI, Claude, Gemini, ecc.).
  upgradeDescription: |
    Aggiornamento da 2.0.2 a 2.6.1
    
    Correzioni di bug
    - Agent: Risolto il fallimento dell'esecuzione degli strumenti in certe circostanze nel workflow agent; #4790
    - Agent: Risolta l'acquisizione errata dello storico nei nodi AI Conversation con nodi paralleli; #4778
    - Agent: Risolto l'errore frontend causato da flussi di dati eccessivamente grandi dal backend nelle risposte IA
    - Knowledge Base: Risolto il problema per cui i marker di segmentazione (righe vuote e ritorni a capo) non avevano effetto dopo la segmentazione intelligente; #4791
    
    Dettagli completi: https://github.com/1Panel-dev/MaxKB/releases/tag/v2.6.1
