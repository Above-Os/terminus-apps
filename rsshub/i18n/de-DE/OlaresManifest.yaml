metadata:
  title: Rsshub
  description: Ein erweiterbarer RSS-Feed-Generator
spec:
  fullDescription: |
    RSSHub ist ein quelloffener, benutzerfreundlicher und erweiterbarer RSS-Feed-Generator. Er kann RSS-Feeds aus nahezu allen Quellen erzeugen.

    RSSHub liefert Millionen von Inhalten, die aus unterschiedlichsten Quellen zusammengeführt werden. Unsere lebendige Open-Source-Community sorgt fortlaufend für neue RSSHub-Routen, neue Funktionen und Fehlerbehebungen.
