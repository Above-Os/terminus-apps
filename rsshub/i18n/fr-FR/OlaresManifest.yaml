metadata:
  title: Rsshub
  description: Un générateur de flux RSS extensible
spec:
  fullDescription: |
    RSSHub est un générateur de flux RSS open source, facile à utiliser et extensible. Il peut générer des flux RSS à partir de pratiquement n'importe quelle source.

    RSSHub fournit des millions de contenus agrégés depuis toutes sortes de sources. Notre communauté open source dynamique assure continuellement l'ajout de nouvelles routes, fonctionnalités et corrections à RSSHub.
