metadata:
  title: Rsshub
  description: Un generatore di feed RSS estensibile
spec:
  fullDescription: |
    RSSHub è un generatore di feed RSS open source, facile da usare ed estensibile. Può generare feed RSS praticamente da qualsiasi fonte.

    RSSHub offre milioni di contenuti aggregati da ogni tipo di fonte. La nostra vivace comunità open source garantisce continuamente nuove route, funzionalità e correzioni per RSSHub.
