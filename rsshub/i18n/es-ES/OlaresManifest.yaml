metadata:
  title: Rsshub
  description: Un generador de fuentes RSS ampliable
spec:
  fullDescription: |
    RSSHub es un generador de fuentes RSS de código abierto, fácil de usar y ampliable. Puede generar fuentes RSS a partir de prácticamente cualquier contenido.

    RSSHub ofrece millones de contenidos agregados desde todo tipo de fuentes. Nuestra activa comunidad de código abierto garantiza la incorporación continua de nuevas rutas, funciones y correcciones para RSSHub.
