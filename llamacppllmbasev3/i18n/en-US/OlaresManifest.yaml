metadata:
  description: "Generic llama.cpp engine base. Pick any GGUF model at install via env."
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.39 — bump llm-init to `v1.6.1`.

    **Images**
    - llm-init: `docker.io/beclab/llm-init:v1.6.0` → `v1.6.1`.
    - llama.cpp: unchanged at `server-cuda12-b10588`.

    **Editing `ENGINE_ARGS` after installation now takes effect**

    The two things 1.2.38 introduced — a gate that keeps a shared KV pool from
    being oversold, and a capacity reading taken from the engine rather than
    inferred from the flags — both settled their answer while llm-init was
    starting, which is the wrong moment: on this base `ENGINE_ARGS` is editable
    and starts out empty, so the flags a clone runs under are usually chosen
    after the first boot, and every later change relaunches the engine in
    place.

    - Whether the pool needs accounting for is now asked per request. A clone
      that first came up with `-np 1` and was later changed to a shared pool
      got no gate at all until the deployment was restarted; one that went the
      other way kept paying two tokenizer round trips for a pool the engine had
      already taken over policing.
    - The capacity reading is re-taken when the engine is seen back from a
      relaunch, or when `ENGINE_ARGS` no longer matches what the standing
      reading was measured under. Readiness alone could not see either: the
      engine is relaunched inside the process and the health loop holds its
      last verdict across it, so the card kept describing an engine that no
      longer existed — and that is the number Router admits requests against.

    A fresh install and a chart upgrade were never affected, because both
    restart the process.

    **Sizing `ENGINE_ARGS` on this base**
    - `-c` is the whole KV pool, not a per-request window. With a shared cache
      one request may occupy all of it.
    - Leaving `-np` out selects 4 slots, sharing that pool. Set `-np 1` for a
      single long conversation, or raise `-c` to match the width you want.
    - `--kv-unified-per-slot N` caps what one slot may take, which the engine
      enforces itself with a `400` naming the limit.
    - The gate 1.2.38 introduced applies to a shared pool with more than one
      slot and no per-slot ceiling. `-np 1`, or a per-slot ceiling, needs none
      and gets none.
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. The name of your model in `owner/repo:quant` format, for example `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. This is also used as the OpenAI alias.
    - `MODEL_MODE`: `chat` or `embedding`. If you pick embedding, the chart adds `--embedding` automatically.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports. This is required.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Extra llama.cpp options, like `-c 8192 -ngl all -fa on`. To fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level: choose from `debug`, `info`, `warn`, or `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. Accepts values like `8Gi`, `8192`, or `8192Mi`. On NVIDIA, this sets `nvidia.com/gpumem` in MiB; on Spark, sets pod memory.
    
    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then `llama.cpp` starts serving the model when it’s ready. These two parts run separately but share files and progress info.

    **Stack**
    - **llama.cpp**: Runs the model and serves API requests (port 8081)
    - **llm-init**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to `llamacpp`.

    **Accelerator modes**
    | Mode           | Device            | Details                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `LLAMACPP_REQUIRED_GPU_MEMORY`; use `-ngl all` for full GPU use |
    | `nvidia-gb10`  | GPU (Spark)       | Like above, but memory is managed by the pod                        |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - To use the GPU, set `-ngl all` in `ENGINE_ARGS`. Use `-ngl all` for full GPU offload.
