metadata:
  description: "汎用 llama.cpp エンジンベース。インストール時に env で任意の GGUF モデルを選択。"
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.39 — llm-init を `v1.6.1` に更新。

    **イメージ**
    - llm-init: `docker.io/beclab/llm-init:v1.6.0` → `v1.6.1`。
    - llama.cpp: `server-cuda12-b10588` のまま変更なし。

    **インストール後の `ENGINE_ARGS` 編集が効くようになった**

    1.2.38 で導入した 2 点 — 共有 KV プールの過売りを防ぐゲートと、フラグから推定せずエンジンから取る容量読み取り — は、どちらも llm-init 起動中に答えを確定しており、タイミングが誤りでした。このベースでは `ENGINE_ARGS` は編集可能で最初は空なので、クローンが実際に使うフラグは多くの場合初回起動後に決まり、その後の変更はエンジンをその場で再起動します。

    - プールの会計が必要かはリクエストごとに尋ねるようになりました。最初 `-np 1` で起動し後から共有プールへ変えたクローンは、デプロイ再起動までゲートが一切なく、逆に変えたクローンはエンジンがすでに監視しているプールに対してトークナイザ往復を 2 回払い続けていました。
    - 容量読み取りは、エンジンが再起動から戻ってきたとき、または `ENGINE_ARGS` が現在の読み取り時の条件と一致しなくなったときに取り直します。Readiness だけではどちらも見えませんでした。エンジンはプロセス内で再起動され、ヘルスループは判定を跨いで保持するため、カードはもはや存在しないエンジンを記述し、Router はその数値でリクエストを認めていました。

    新規インストールとチャートアップグレードは、どちらもプロセスを再起動するため影響を受けませんでした。

    **このベースでの `ENGINE_ARGS` サイジング**
    - `-c` はリクエストごとの窓ではなく、KV プール全体です。共有キャッシュでは 1 リクエストが全部を占有し得ます。
    - `-np` を省略すると 4 スロットになり、そのプールを共有します。長い単一会話なら `-np 1`、または希望の幅に合わせて `-c` を上げてください。
    - `--kv-unified-per-slot N` は 1 スロットが取れる上限で、エンジン自身が制限名付きの `400` で強制します。
    - 1.2.38 のゲートは、スロットが複数でスロット上限がない共有プールに適用されます。`-np 1` またはスロット上限があればゲートは不要で付きません。
  fullDescription: |
    **重要なお知らせ**  
    このアプリはテンプレートであり、単体では使えません。下の環境変数を設定して特定モデルを接続してください。

    **環境変数セットアップガイド**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`。モデルのダウンロード元。分割ファイルは先頭パートのみ; ビジョン言語モデルはカンマでプロジェクタを追加。例: `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`。
    - `MODEL_NAME`: `owner/repo:quant`。`owner/repo:quant` 形式のモデル名。例: `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`。OpenAI エイリアスとしても使用。
    - `MODEL_MODE`: `chat` または `embedding`。embedding を選ぶとチャートが自動で `--embedding` を追加。
    - `MODEL_SUPPORTS`: モデル能力（Vision / Tools / Thinking / None）。モデルが対応するものを選択。必須。
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`。追加の llama.cpp オプション。GPU をフルに使うには `-ngl all`。`LLAMA_ARG_*=val` 形式も可。
    - `LOG_LEVEL`: `debug`、`info`、`warn`、または `error`。ログレベル。
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`、`8192`、または `8192Mi`。必要なモデルメモリ。NVIDIA では MiB 単位の `nvidia.com/gpumem` を設定; Spark ではポッドメモリを設定。

    **動作の仕組み**
    まず `llm-init` がモデルをダウンロードして準備し、準備ができたら `llama.cpp` がサービングを開始します。両者は別々に動作しますが、ファイルと進捗情報を共有します。

    **スタック**
    - **llama.cpp**: モデルを実行し API リクエストを処理（ポート 8081）
    - **llm-init**: モデルをダウンロードし、進捗を表示し、ポート 8090 で OpenAI API を提供して `llamacpp` へプロキシ。

    **アクセラレータモード**
    | モード         | デバイス          | 詳細                                                               |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | `LLAMACPP_REQUIRED_GPU_MEMORY` を設定; フル GPU には `-ngl all`     |
    | `nvidia-gb10`  | GPU (Spark)       | 上記と同様だがメモリはポッドが管理                                    |

    **モデルストレージ**
    すべてのモデルファイルは共有フォルダ `appCommon/huggingface` に保存され、`/cache/hf/hub` にマウントされます。類似アプリもモデルにこの場所を使います。

    **リソースのヒント**
    - CPU、RAM、GPU はチャートに基づき自動設定; ディスク設定は固定。
    - GPU を使うには `ENGINE_ARGS` に `-ngl all` を設定。フル GPU オフロードには `-ngl all`。
