metadata:
  description: "Generische llama.cpp-Engine-Basis. Beliebiges GGUF-Modell bei der Installation per Env wählen"
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.39 — llm-init auf `v1.6.1` aktualisiert.

    **Images**
    - llm-init: `docker.io/beclab/llm-init:v1.6.0` → `v1.6.1`.
    - llama.cpp: unverändert bei `server-cuda12-b10588`.

    **Bearbeiten von `ENGINE_ARGS` nach der Installation wirkt jetzt**

    Die beiden Neuerungen von 1.2.38 — ein Gate, das einen gemeinsamen KV-Pool vor Überverkauf schützt, und eine Kapazitätsablesung von der Engine statt aus Flags — beantworteten ihre Frage, während llm-init startete, also zum falschen Zeitpunkt: Auf dieser Basis ist `ENGINE_ARGS` editierbar und startet leer, sodass die Flags eines Clones meist nach dem ersten Boot gewählt werden und jede spätere Änderung die Engine an Ort und Stelle neu startet.

    - Ob der Pool Accounting braucht, wird jetzt pro Anfrage gefragt. Ein Clone, der zuerst mit `-np 1` hochkam und später auf einen shared Pool umgestellt wurde, hatte bis zum Deployment-Neustart gar kein Gate; einer, der umgekehrt wechselte, zahlte weiter zwei Tokenizer-Roundtrips für einen Pool, den die Engine bereits selbst überwachte.
    - Die Kapazitätsablesung wird erneut genommen, wenn die Engine nach einem Relaunch wieder sichtbar ist, oder wenn `ENGINE_ARGS` nicht mehr zu dem passt, worunter die stehende Ablesung gemessen wurde. Readiness allein sah beides nicht: die Engine wird im Prozess neu gestartet und die Health-Schleife hält ihr letztes Urteil darüber hinweg — die Karte beschrieb also eine Engine, die nicht mehr existierte, und genau diese Zahl lässt der Router für Anfragen zu.

    Frische Installationen und Chart-Upgrades waren nie betroffen, weil beide den Prozess neu starten.

    **`ENGINE_ARGS` auf dieser Basis dimensionieren**
    - `-c` ist der gesamte KV-Pool, kein per-Request-Fenster. Mit shared Cache kann eine Anfrage alles belegen.
    - Ohne `-np` werden 4 Slots gewählt und teilen diesen Pool. Setzen Sie `-np 1` für ein einzelnes langes Gespräch, oder erhöhen Sie `-c` auf die gewünschte Breite.
    - `--kv-unified-per-slot N` begrenzt, was ein Slot nehmen darf; die Engine erzwingt das selbst mit einem `400`, der das Limit nennt.
    - Das Gate aus 1.2.38 gilt für einen shared Pool mit mehr als einem Slot und ohne per-Slot-Ceiling. `-np 1` oder eine per-Slot-Ceiling brauchen keines und bekommen keines.
  fullDescription: |
    **WICHTIGER HINWEIS**  
    Diese App ist eine Vorlage und kann nicht allein genutzt werden. Setzen Sie die unten stehenden Umgebungsvariablen, um ein konkretes Modell anzubinden.

    **Einrichtungsleitfaden für Umgebungsvariablen**
    - `MODEL_SOURCE`: `hf://<repo> --include <file>.gguf`. Quelle zum Herunterladen Ihres Modells. Bei Split-Dateien nur den ersten Teil angeben; bei Vision-Language-Modellen den Projektor per Komma hinzufügen, z. B. `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME`: `owner/repo:quant`. Name Ihres Modells im Format `owner/repo:quant`, z. B. `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. Wird auch als OpenAI-Alias verwendet.
    - `MODEL_MODE`: `chat` oder `embedding`. Bei embedding fügt das Chart automatisch `--embedding` hinzu.
    - `MODEL_SUPPORTS`: Modellfähigkeiten (Vision / Tools / Thinking / None). Wählen Sie, was Ihr Modell unterstützt. Erforderlich.
    - `ENGINE_ARGS`: `-c 8192 -ngl all -fa on`. Zusätzliche llama.cpp-Optionen wie `-c 8192 -ngl all -fa on`. Für volle GPU-Nutzung `-ngl all` hinzufügen. Auch Werte wie `LLAMA_ARG_*=val` möglich.
    - `LOG_LEVEL`: `debug`, `info`, `warn` oder `error`. Log-Level: Wählen Sie zwischen `debug`, `info`, `warn` oder `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY`: `8Gi`, `8192` oder `8192Mi`. Benötigter Modellspeicher. Akzeptiert Werte wie `8Gi`, `8192` oder `8192Mi`. Auf NVIDIA setzt dies `nvidia.com/gpumem` in MiB; auf Spark die Pod-Memory.

    **Funktionsweise**
    Zuerst lädt `llm-init` Ihr Modell herunter und bereitet es vor, dann startet `llama.cpp` den Serving, wenn es bereit ist. Beide Teile laufen getrennt, teilen aber Dateien und Fortschrittsinformationen.

    **Stack**
    - **llama.cpp**: Führt das Modell aus und bedient API-Anfragen (Port 8081)
    - **llm-init**: Lädt das Modell herunter, zeigt Fortschritt und stellt die OpenAI-API auf Port 8090 bereit, mit Proxy zu `llamacpp`.

    **Beschleuniger-Modi**
    | Modus          | Gerät             | Details                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | `LLAMACPP_REQUIRED_GPU_MEMORY` setzen; `-ngl all` für volle GPU-Nutzung |
    | `nvidia-gb10`  | GPU (Spark)       | Wie oben, aber Speicher wird vom Pod verwaltet                        |

    **Modellspeicher**
    Alle Modelldateien liegen im gemeinsamen Ordner `appCommon/huggingface`, gemountet als `/cache/hf/hub`. Ähnliche Apps nutzen denselben Ort für Modelle.

    **Ressourcentipps**
    - CPU, RAM und GPU konfigurieren sich automatisch anhand des Charts; Disk-Einstellungen sind fest.
    - Für die GPU `-ngl all` in `ENGINE_ARGS` setzen. `-ngl all` für volles GPU-Offload.
