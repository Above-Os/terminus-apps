metadata:
  description: "Base générique du moteur llama.cpp. Choisissez n'importe quel modèle GGUF à l'installation via env"
  title: llama.cpp Engine Base

spec:
  upgradeDescription: |
    Chart 1.2.39 — mettre à jour llm-init vers `v1.6.1`.

    **Images**
    - llm-init : `docker.io/beclab/llm-init:v1.6.0` → `v1.6.1`.
    - llama.cpp : inchangé à `server-cuda12-b10588`.

    **Modifier `ENGINE_ARGS` après l'installation prend désormais effet**

    Les deux nouveautés de 1.2.38 — une porte qui empêche de sur-vendre un pool KV partagé, et une lecture de capacité prise du moteur plutôt qu'inférée des flags — répondaient à leur question pendant le démarrage de llm-init, au mauvais moment : sur cette base `ENGINE_ARGS` est éditable et démarre vide, ainsi les flags sous lesquels tourne un clone sont souvent choisis après le premier boot, et chaque changement ultérieur relance le moteur sur place.

    - Si le pool a besoin de comptabilité, on le demande désormais par requête. Un clone démarré avec `-np 1` puis passé à un pool partagé n'avait aucune porte jusqu'au redémarrage du deployment ; un qui faisait l'inverse continuait de payer deux allers-retours tokenizer pour un pool que le moteur surveillait déjà.
    - La lecture de capacité est reprise lorsque le moteur réapparaît après un relancement, ou lorsque `ENGINE_ARGS` ne correspond plus à ce sous quoi la lecture en cours a été mesurée. La readiness seule ne voyait ni l'un ni l'autre : le moteur est relancé dans le processus et la boucle de santé conserve son dernier verdict — la carte décrivait un moteur qui n'existait plus, et c'est ce nombre contre lequel le Router admet les requêtes.

    Une installation neuve et une mise à niveau de chart n'étaient jamais concernées, car toutes deux redémarrent le processus.

    **Dimensionner `ENGINE_ARGS` sur cette base**
    - `-c` est tout le pool KV, pas une fenêtre par requête. Avec un cache partagé, une requête peut tout occuper.
    - Omettre `-np` sélectionne 4 slots qui partagent ce pool. Définissez `-np 1` pour une seule longue conversation, ou augmentez `-c` à la largeur voulue.
    - `--kv-unified-per-slot N` plafonne ce qu'un slot peut prendre ; le moteur l'impose avec un `400` qui nomme la limite.
    - La porte de 1.2.38 s'applique à un pool partagé avec plus d'un slot et sans plafond par slot. `-np 1`, ou un plafond par slot, n'en ont pas besoin et n'en reçoivent pas.
  fullDescription: |
    **NOTE IMPORTANTE**  
    Cette app est un modèle et ne peut pas être utilisée seule. Pour l'utiliser, définissez les variables d'environnement ci-dessous pour connecter un modèle spécifique.

    **Guide de configuration des variables d'environnement**
    - `MODEL_SOURCE` : `hf://<repo> --include <file>.gguf`. Source pour télécharger votre modèle. Pour les fichiers fractionnés, n'incluez que la première partie ; pour les modèles vision-langage, ajoutez le projecteur avec une virgule, ex. `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`.
    - `MODEL_NAME` : `owner/repo:quant`. Nom de votre modèle au format `owner/repo:quant`, ex. `unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL`. Aussi utilisé comme alias OpenAI.
    - `MODEL_MODE` : `chat` ou `embedding`. Si vous choisissez embedding, le chart ajoute automatiquement `--embedding`.
    - `MODEL_SUPPORTS` : Capacités du modèle (Vision / Tools / Thinking / None). Choisissez ce que votre modèle prend en charge. Obligatoire.
    - `ENGINE_ARGS` : `-c 8192 -ngl all -fa on`. Options llama.cpp supplémentaires, comme `-c 8192 -ngl all -fa on`. Pour utiliser pleinement le GPU, ajoutez `-ngl all`. Aussi des valeurs comme `LLAMA_ARG_*=val`.
    - `LOG_LEVEL` : `debug`, `info`, `warn` ou `error`. Niveau de log : choisissez parmi `debug`, `info`, `warn` ou `error`.
    - `LLAMACPP_REQUIRED_GPU_MEMORY` : `8Gi`, `8192` ou `8192Mi`. Mémoire modèle nécessaire. Accepte des valeurs comme `8Gi`, `8192` ou `8192Mi`. Sur NVIDIA, définit `nvidia.com/gpumem` en MiB ; sur Spark, la mémoire du pod.

    **Fonctionnement**
    D'abord, `llm-init` télécharge votre modèle et le prépare, puis `llama.cpp` commence à servir le modèle quand il est prêt. Les deux parties tournent séparément mais partagent fichiers et infos de progression.

    **Stack**
    - **llama.cpp** : Exécute le modèle et sert les requêtes API (port 8081)
    - **llm-init** : Télécharge le modèle, affiche la progression et fournit l'API OpenAI sur le port 8090, en proxy vers `llamacpp`.

    **Modes accélérateur**
    | Mode           | Périphérique      | Détails                                                            |
    |----------------|-------------------|---------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Définir `LLAMACPP_REQUIRED_GPU_MEMORY` ; utiliser `-ngl all` pour GPU complet |
    | `nvidia-gb10`  | GPU (Spark)       | Comme ci-dessus, mais la mémoire est gérée par le pod                 |

    **Stockage des modèles**
    Tous les fichiers modèle sont stockés dans le dossier partagé `appCommon/huggingface`, monté comme `/cache/hf/hub`. Des apps similaires utilisent cet emplacement pour les modèles.

    **Conseils ressources**
    - CPU, RAM et GPU s'autoconfigurent selon le chart ; les réglages disque sont fixes.
    - Pour utiliser le GPU, définissez `-ngl all` dans `ENGINE_ARGS`. Utilisez `-ngl all` pour un offload GPU complet.
