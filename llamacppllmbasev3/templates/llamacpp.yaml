{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- /* MODEL_MODE=embedding -> auto-add llama.cpp's --embedding so it works out
       of the box; skipped if the user already passed it in ENGINE_ARGS. */ -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- if and (eq $modelMode "embedding") (not (contains "--embedding" $engineArgs)) -}}
{{- $engineArgs = trim (printf "%s --embedding" $engineArgs) -}}
{{- end -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $cpuRequest := trim ($oe.LLAMACPP_CPU_REQUEST | default "200m") -}}
{{- $memRequest := trim ($oe.LLAMACPP_MEMORY_REQUEST | default "2Gi") -}}
{{- $cpuLimit := trim ($oe.LLAMACPP_CPU_LIMIT | default "6") -}}
{{- $memLimit := trim ($oe.LLAMACPP_MEMORY_LIMIT | default "35Gi") -}}
{{- $gpuType := include "llmbase.gpuType" . -}}
{{- $engineImage := include "llamacppllmbasev3.engineImage" . -}}
{{- $unifiedMem := eq $gpuType "nvidia-gb10" -}}
{{- $isAmdGpu := eq $gpuType "amd-gpu" -}}
{{- $isIntelGpu := eq $gpuType "intel-gpu" -}}
{{- $needDri := or $isAmdGpu $isIntelGpu -}}
{{- /* nvidia.com/gpumem is NVIDIA-HAMi only. amd-gpu / intel-gpu use
       gpu-inject + manifest requiredGPUMemory. */ -}}
{{- $needNvidiaGpumem := and (not $unifiedMem) (not $isAmdGpu) (not $isIntelGpu) -}}
{{- $shmLimit := "16Gi" -}}
{{- if $isIntelGpu -}}
{{- $shmLimit = "10Gi" -}}
{{- end -}}
{{- $engineArgs = include "llamacppllmbasev3.engineArgs" (dict "Args" $engineArgs) -}}
{{- /* nvidia.com/gpumem needs a BARE MiB int; Spark unified memory reuses the
       same value as pod memory ("<MiB>Mi"). */ -}}
{{- $gpuMiB := include "llmbase.gpuMiB" ($oe.LLAMACPP_REQUIRED_GPU_MEMORY | default "4096") -}}
{{- if $unifiedMem -}}
{{- $memRequest = printf "%sMi" $gpuMiB -}}
{{- $memLimit = printf "%sMi" $gpuMiB -}}
{{- end -}}
{{- $runStateHostPath := printf "%s/llm-init-run/%s" .Values.userspace.appCache .Release.Name -}}
---
# llama.cpp engine Deployment. wrappers/llamacpp.sh blocks on the sentinel
# (download ready), then execs llama-server -hf "$MODEL_NAME".
# llm-init reverse-proxies at http://llamacpp:8081 — Service name MUST be
# "llamacpp". GPU base: CUDA (nvidia / nvidia-gb10), ROCm (amd-gpu), or
# Intel SYCL (intel-gpu) + gpu-inject; put `-ngl all` in ENGINE_ARGS.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Primary workload: named after the release (== appid llamacppllmbasev3) for v3
  # allowMultipleInstall. Label/selector stays io.kompose.service: llamacpp.
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llamacpp
  annotations:
    applications.app.bytetrade.io/gpu-inject: "llamacpp"
    llamacppllmbasev3.io/engine-image: {{ $engineImage | quote }}
spec:
  replicas: {{ .Values.workloads.llamacppllmbasev3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacpp
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: llm-init-wrappers
            defaultMode: 0555
{{- if $isAmdGpu }}
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
{{- end }}
{{- if $needDri }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: drm
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $shmLimit }}
{{- end }}
{{- if $isAmdGpu }}
      securityContext:
        supplementalGroups:
          - 44
          - 992
{{- end }}
      containers:
        - name: llamacpp
          image: "{{ $engineImage }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/llm-init/wrappers/llamacpp.sh"]
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: WRAPPER_COMMON
              value: /run/llm-init/wrappers/common.sh
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
            - name: LLAMACPP_PORT
              value: "8081"
            - name: WAIT_TIMEOUT
              value: "3600"
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
            - name: OLARES_GPU_MODE
              value: {{ $gpuType | quote }}
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          ports:
            - name: llamacpp
              containerPort: 8081
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /llm-init/wrappers
              readOnly: true
{{- if $isAmdGpu }}
            - name: kfd
              mountPath: /dev/kfd
{{- end }}
{{- if $needDri }}
            - name: dri
              mountPath: /dev/dri
            - name: drm
              mountPath: /sys/class/drm
            - name: dshm
              mountPath: /dev/shm
{{- end }}
          resources:
            # nvidia.com/gpumem: nvidia only in chart; gb10 via pod memory +
            # gpu-inject; amd-gpu / intel-gpu via gpu-inject.
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if $needNvidiaGpumem }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if $needNvidiaGpumem }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llamacpp
spec:
  selector:
    io.kompose.service: llamacpp
  ports:
    - name: llamacpp
      port: 8081
      targetPort: 8081
  type: ClusterIP
