metadata:
  description: 整段转写会议录音并标注每位说话人的语音识别模型
  title: MOSS-Transcribe-Diarize

spec:
  upgradeDescription: |
    v1.0.5: Intel Arc 上模型进程退出时，引擎也会自动重启，不再收下录音却一直不转写。
    v1.0.4: 修复与其他应用共享显卡时引擎内存不足后转写卡住的问题，引擎现在会自动重启。
    v1.0.3: 修复 NVIDIA 显卡按时间片共享时引擎反复重启的问题。
    v1.0.2: 改用 SGLang-Omni 推理，NVIDIA 上借助 DFlash2 投机解码快约 7 倍，Intel Arc 上快约 4 倍。单段录音最长 30 分钟；NVIDIA 需要 16Gi 显存。
    v1.0.1: 支持 Intel Arc 显卡；更换图标。
    v1.0.0: 首个版本。
  fullDescription: |
    MOSS-Transcribe-Diarize 一次听完整段录音，同时写出谁在什么时间说了什么，包括多人同时说话的部分。

    **主要功能**
    - 转写中英文会议，每段话都带说话人和起止时间。
    - 整段录音一起处理，不切成零散片段。
    - 同一次处理同时向兼容的 Olares 应用提供语音转写和说话人区分两种能力。

    需要配备至少 `16Gi` 显存的兼容 NVIDIA GPU，或 Intel Arc 独立显卡。不支持 Intel 核显。
