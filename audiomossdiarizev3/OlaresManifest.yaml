olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiomossdiarizev3
  icon: https://cdn.olares.com/images/2026/11/bb13486a3d77a90b644538da11d5b473.png
  description: A speech recognition model that transcribes whole meetings and labels each speaker
  appid: audiomossdiarizev3
  title: MOSS-Transcribe-Diarize
  version: '1.0.4'
  categories:
    - AI
    - models
  tags:
  - speech-to-text
  - speaker-diarization
  - audio
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audiomossdiarizev3api
    host: sharedentrances-api
    port: 0
    title: MOSS-Transcribe-Diarize API
    invisible: true
    authLevel: internal
    icon: https://cdn.olares.com/images/2026/11/bb13486a3d77a90b644538da11d5b473.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audiomossdiarizev3
    port: 8090
    host: download-svc
    title: MOSS-Transcribe-Diarize
    icon: https://cdn.olares.com/images/2026/11/bb13486a3d77a90b644538da11d5b473.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiomossdiarizev3: 1
  llminit: 1
spec:
  upgradeDescription: |
    v1.0.4: Fix transcription hanging after the engine ran out of memory on a GPU shared with other apps; the engine now restarts on its own.
    v1.0.3: Fix the engine restarting over and over on NVIDIA GPUs shared by time slicing.
    v1.0.2: Run on SGLang-Omni, about 7x faster on NVIDIA with DFlash2 speculative decoding and about 4x faster on Intel Arc. Recordings up to 30 minutes; NVIDIA now needs 16Gi of GPU memory.
    v1.0.1: Run on Intel Arc GPUs; new icon.
    v1.0.0: First release.
  onlyAdmin: true
  versionName: 'OpenMOSS-Team/MOSS-Transcribe-Diarize'
  fullDescription: |
    MOSS-Transcribe-Diarize listens to a whole recording and writes who spoke, when, and what in one pass, including overlapping speech.

    **Key features**
    - Transcribe Chinese and English meetings with a speaker label and time range on every turn.
    - Hear a complete recording at once rather than in separate pieces.
    - Serve both speech-to-text and speaker diarization to compatible Olares applications from the same pass.

    Requires a compatible NVIDIA GPU with at least `16Gi` of GPU memory, or an Intel Arc discrete GPU. Intel integrated graphics are not supported.

  developer: OpenMOSS
  website: https://github.com/OpenMOSS
  sourceCode: https://huggingface.co/OpenMOSS-Team/MOSS-Transcribe-Diarize
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://huggingface.co/OpenMOSS-Team/MOSS-Transcribe-Diarize
  license:
    - text: Apache-2.0
      url: https://huggingface.co/OpenMOSS-Team/MOSS-Transcribe-Diarize

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "28Gi"
      requiredMemory: "5376Mi"
      requiredGPUMemory: "16Gi"
      limitedGPUMemory: "16Gi"
    # Intel Arc only (no iGPU mode): same envelope as nvidia. The GPU-memory field is for the installer; the pod only bind-mounts /dev/dri.
    - mode: intel-gpu
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "28Gi"
      requiredMemory: "5376Mi"
      requiredGPUMemory: "16Gi"
      limitedGPUMemory: "16Gi"

  supportArch:
    - amd64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://OpenMOSS-Team/MOSS-Transcribe-Diarize,hf://wilsonzheng0327/MOSS-Transcribe-Diarize-dflash2 --revision 201410d4b9c89e86d97af160658766206959ad40"
    description: "HuggingFace sources llm-init downloads into the shared cache: the model, then the
      DFlash2 draft NVIDIA uses for speculative decoding (Intel Arc ignores it)."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "OpenMOSS-Team/MOSS-Transcribe-Diarize"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "stt,diar"
    options:
    - title: STT and diarization (whole recording with speakers)
      value: stt,diar
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "16Gi"
    description: "GPU memory required for this model."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "5Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "6"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "24Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
    # No default: nvidia → audio-diarasr-sgl:v1.1.47; intel-gpu → audio-diarasr-sgl-xpu:v1.1.44.
    description: "Engine image override. Left empty, nvidia uses
      docker.io/beclab/audio-diarasr-sgl:v1.1.47 and intel-gpu uses
      docker.io/beclab/audio-diarasr-sgl-xpu:v1.1.44. Filling this REPLACES that choice for every mode."
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "--max-audio-seconds 1800"
    description: "Engine flags. --max-audio-seconds sizes the KV cache for the longest recording
      the engine accepts; longer uploads are refused, and a larger value needs more GPU memory
      than the 16Gi above. Flags the wrapper does not know go to sgl-omni serve."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
