olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiomossdiarizev3
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  description: A speech recognition model that transcribes whole meetings and labels each speaker
  appid: audiomossdiarizev3
  title: MOSS-Transcribe-Diarize
  version: '1.0.0'
  categories:
    - AI
    - models
  tags:
  - speech-to-text
  - speaker-diarization
  - audio
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audiomossdiarizev3api
    host: sharedentrances-api
    port: 0
    title: MOSS-Transcribe-Diarize API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audiomossdiarizev3
    port: 8090
    host: download-svc
    title: MOSS-Transcribe-Diarize
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiomossdiarizev3: 1
  llminit: 1
spec:
  upgradeDescription: |
    v1.0.0: First release.
  onlyAdmin: true
  versionName: 'OpenMOSS-Team/MOSS-Transcribe-Diarize'
  fullDescription: |
    MOSS-Transcribe-Diarize listens to a whole recording and writes who spoke, when, and what in one pass, including overlapping speech.

    **Key features**
    - Transcribe Chinese and English meetings with a speaker label and time range on every turn.
    - Hear a complete recording at once rather than in separate pieces.
    - Serve both speech-to-text and speaker diarization to compatible Olares applications from the same pass.

    A compatible NVIDIA GPU with at least `12Gi` of GPU memory is required.

  developer: OpenMOSS
  website: https://github.com/OpenMOSS
  sourceCode: https://huggingface.co/OpenMOSS-Team/MOSS-Transcribe-Diarize
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://huggingface.co/OpenMOSS-Team/MOSS-Transcribe-Diarize
  license:
    - text: Apache-2.0
      url: https://huggingface.co/OpenMOSS-Team/MOSS-Transcribe-Diarize

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "7"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 200Gi
      limitedMemory: "36Gi"
      requiredMemory: "4352Mi"
      requiredGPUMemory: "12Gi"
      limitedGPUMemory: "12Gi"

  supportArch:
    - amd64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://OpenMOSS-Team/MOSS-Transcribe-Diarize"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "OpenMOSS-Team/MOSS-Transcribe-Diarize"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "stt,diar"
    options:
    - title: STT and diarization (whole recording with speakers)
      value: stt,diar
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "12Gi"
    description: "GPU memory required for this model."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "6"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "32Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "docker.io/beclab/audio-diarasr:v1.1.42"
    description: "Engine image."
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "--max-new-tokens 65536"
    description: "Engine flags. 65536 new tokens per recording (--max-new-tokens) covers a
      busy meeting of an hour and a half; the engine's own 32768 truncates sessions of 45
      minutes and more. Weights load in bfloat16 unless --dtype says otherwise."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
