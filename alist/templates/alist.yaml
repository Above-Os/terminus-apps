apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: alist
  name: alist
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.alist.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: alist
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: alist
    spec:
      initContainers:
        - name: init-permissions
          image: beclab/aboveos-busybox:1.37.0
          command: ["sh", "-c", "chown 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - image: "docker.io/xhofe/alist:v3.64.0"
          name: alist
          command: ["/opt/alist/alist", "server", "--no-prefix"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 5244
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >
                    if [ ! -f /opt/alist/data/.password_set ];
                      then ./alist admin set olares && touch /opt/alist/data/.password_set
                    fi
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: DISPLAY
              value: ':0'
            - name: UMASK
              value: '022'
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - mountPath: /opt/alist/data
              name: data
            - mountPath: /home
              name: home
      volumes:
        - name: data
          hostPath:
            type: DirectoryOrCreate
            {{- if .Values.sysVersion }}
              {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appData }}'
              {{- else }}
            path: '{{ .Values.userspace.appData }}/alist'
              {{- end }}
            {{- else }}
            path: '{{ .Values.userspace.appData }}/alist'
            {{- end }}
        - name: home
          hostPath:
            path: '{{ .Values.userspace.userData }}'
            type: DirectoryOrCreate
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: alist
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: alist
spec:
  ports:
    - name: http
      port: 5244
      targetPort: 5244
  selector:
    io.kompose.service: alist