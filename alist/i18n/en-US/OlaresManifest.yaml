metadata:
  title: AList
  description: A file list program that supports multiple storages, powered by Gin and Solidjs.
spec:
  fullDescription: |
    **Default credentials**
    Username: admin
    Password: olares

    **Overview**
    AList is a file list program that supports multiple storages, powered by Gin and Solidjs.

    *Features*
    - Multiple storages
    - Easy to deploy and out-of-the-box
    - File preview (PDF, markdown, code, plain text, ...)
    - Image preview in gallery mode
    - Video and audio preview, support lyrics and subtitles
    - Office documents preview (docx, pptx, xlsx, ...)
    - README.md preview rendering
    - File permalink copy and direct file download
    - Dark mode
    - I18n
    - Protected routes (password protection and authentication)
    - WebDav (see https://alist.nn.ci/guide/webdav.html for details)
    - Docker Deploy
    - Cloudflare Workers proxy
    - File/Folder package download
    - Web upload(Can allow visitors to upload), delete, mkdir, rename, move and copy
    - Offline download
    - Copy files between two storage
    - Multi-thread downloading acceleration for single-thread download/stream
  upgradeDescription: |
    Upgraded AList to 3.64.0. See the [official release notes](https://github.com/AlistGo/alist/releases/tag/v3.64.0).

    **Fixes**

    - Fixed WebDAV digest authentication retries and duplicate base path resolution.
    - Fixed Azure Blob root directory listing and support for new Lanzou password download pages.
    - Removed the legacy polyfill.io script from custom page headers.

    **Storage migration**

    Back up application data before upgrading. Upgrades from 3.44.0 migrate the stored user role format; application data remains at `/opt/alist/data`.
    Review the TLS certificate verification setting after upgrading older installations; an existing disabled setting is retained.

    **Olares deployment changes**

    This package requires Olares 1.12.6 or later.
