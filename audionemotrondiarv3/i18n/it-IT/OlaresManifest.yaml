metadata:
  description: Un servizio locale che etichetta i parlanti e indica quando parlano, in registrazioni o audio dal vivo
  title: Nemotron 3 Diarization

spec:
  upgradeDescription: |
    v1.0.2: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    Nemotron 3 Diarization elabora l'audio in locale per indicare quando parla ciascun parlante. Raggruppa il parlato sotto etichette anonime nell'ordine di prima comparsa, senza identificare le persone per nome, e mantiene il parlato sovrapposto. Funziona su registrazioni complete e su flussi audio dal vivo. Le applicazioni Olares compatibili possono usare questi risultati per distinguere i parlanti.

    **Funzionalità principali**
    - Rilevare il parlato e i cambi di parlante, incluso il parlato sovrapposto.
    - Etichettare fino a 8 parlanti per registrazione.
    - Eseguire la diarizzazione di registrazioni complete o di audio dal vivo tramite una connessione in streaming.
    - Rendere disponibile la diarizzazione alle applicazioni Olares compatibili.

    È richiesta una GPU NVIDIA compatibile. Le iGPU Intel e le Arc usano l'immagine OpenVINO (solo amd64).
