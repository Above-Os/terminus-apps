olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  cloudreve: 1
  cloudreve-redis: 1
metadata:
  name: cloudreve
  description: Self-hosted file management system with multi-cloud support.
  icon: https://app.cdn.olares.com/appstore/cloudreve/icon.png
  appid: cloudreve
  version: "1.0.21"
  title: Cloudreve
  categories:
  - Productivity_v112
  - homelab
  - workspace
  tags:
  - file-management

permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: "4.19.1"
  featuredImage: https://app.cdn.olares.com/appstore/cloudreve/1.jpg
  promoteImage:
  - https://app.cdn.olares.com/appstore/cloudreve/1.jpg
  - https://app.cdn.olares.com/appstore/cloudreve/2.jpg
  - https://app.cdn.olares.com/appstore/cloudreve/3.jpg
  - https://app.cdn.olares.com/appstore/cloudreve/4.jpg
  - https://app.cdn.olares.com/appstore/cloudreve/5.jpg
  - https://app.cdn.olares.com/appstore/cloudreve/6.jpg
  fullDescription: |
    Cloudreve is a self-hosted file management and sharing system, which supports multiple storage providers.

    **Important Note**
    On a new installation, register an account in Cloudreve. The first registered account becomes the administrator. Existing installations keep their accounts.

    **Features**
    - Support storing files into Local storage, Remote storage, Qiniu, Aliyun OSS, Tencent COS, Upyun, OneDrive, S3 compatible API.
    - Upload/Download in directly transmission with speed limiting support.
    - Integrate with Aria2 to download files offline, use multiple download nodes to share the load.
    - Compress/Extract files, download files in batch.
    - WebDAV support covering all storage providers.
    - Drag&Drop to upload files or folders, with streaming upload processing.
    - Drag & Drop to manage your files.
    - Multi-users with multi-groups.
    - Create share links for files and folders with expiration date.
    - Preview videos, images, audios, ePub files online; edit texts, Office documents online.
    - Customize theme colors, dark mode, PWA application, SPA, i18n.
    - All-In-One packing, with all features out-of-the-box.

  upgradeDescription: |
    Upgrade Cloudreve to 4.19.1. Fixes email delivery and WOPI application handling. Existing legacy SQLite data remains in use; if both SQLite and PostgreSQL contain data, startup pauses for review.

    Release notes: https://github.com/cloudreve/cloudreve/releases/tag/4.19.1

  developer: Cloudreve
  website: https://cloudreve.org/
  sourceCode: https://github.com/cloudreve/Cloudreve
  submitter: Olares
  doc: https://docs.cloudreve.org/
  license:
  - text: GPL-3.0
    url: https://github.com/cloudreve/Cloudreve#GPL-3.0-1-ov-file
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 1500Mi
  limitedMemory: 4Gi
  requiredDisk: 128Mi
  limitedDisk: 10Gi
  requiredCpu: 0.6
  limitedCpu: 3
  supportArch:
  - amd64
options:
  apiTimeout: 0
  allowedOutboundPorts:
    - 465
    - 587
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: cloudreve
  port: 5212
  host: cloudreve
  title: Cloudreve
  icon: https://app.cdn.olares.com/appstore/cloudreve/icon.png
  openMethod: window
  authLevel: internal
middleware:
  postgres:
    username: cloudreve
    databases:
    - name: cloudreve
      distributed: false
