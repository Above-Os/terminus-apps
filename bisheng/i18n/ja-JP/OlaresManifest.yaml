metadata:
  title: BISHENG
  description: 次世代エンタープライズ AI アプリケーション向けオープン LLM DevOps プラットフォーム
spec:
  fullDescription: |
    BISHENG は、エンタープライズシナリオに焦点を当てたオープンな LLM アプリケーション DevOps プラットフォームです。多くの業界リーディング組織や Fortune 500 企業で利用されています。

    **機能**
    独自の BISHENG Workflow
    - 独立した包括的なアプリケーションオーケストレーションフレームワーク
    - Human in the loop
    - 強力: ループ、並列処理、バッチ処理、条件ロジック、およびすべてのロジックコンポーネントの自由な組み合わせをサポート
    - 使いやすく直感的

    エンタープライズアプリケーション向け設計
    - 文書レビュー、固定レイアウトのレポート生成、マルチエージェント協調、ポリシー更新比較、サポートチケット支援、カスタマーサービス支援、議事録生成、履歴書スクリーニング、通話記録分析、非構造化データガバナンス、ナレッジマイニング、データ分析など。

    エンタープライズ級機能はアプリケーション実装の基本的な保証です
    - セキュリティレビュー、RBAC、ユーザーグループ管理、グループ別トラフィック制御、SSO/LDAP、脆弱性スキャンとパッチ、高可用性デプロイメントソリューション、モニタリング、統計など。

    高精度ドキュメント解析
    - 当社の高精度ドキュメント解析モデルは、過去 5 年間に蓄積された大量の高品質データで学習されています。高精度の活字・手書き・稀少文字認識モデル、表認識モデル、レイアウト解析モデル、印章モデルを含みます。プライベートに無料でデプロイできます。

    さまざまなエンタープライズシナリオのベストプラクティスを共有するコミュニティ
    - アプリケーション事例とベストプラクティスのオープンリポジトリ。
