metadata:
  title: BISHENG
  description: Plataforma abierta de devops LLM para aplicaciones de IA empresarial de nueva generación
spec:
  fullDescription: |
    BISHENG es una plataforma abierta de devops para aplicaciones LLM, centrada en escenarios empresariales. Ha sido utilizada por un gran número de organizaciones líderes del sector y empresas Fortune 500.

    **Funciones**
    Flujo de trabajo único de BISHENG
    - Framework independiente y completo de orquestación de aplicaciones
    - Human in the loop
    - Potente: admite bucles, paralelismo, procesamiento por lotes, lógica condicional y combinación libre de todos los componentes lógicos.
    - Fácil de usar e intuitivo

    Diseñado para aplicaciones empresariales
    - Revisión de documentos, generación de informes de diseño fijo, colaboración multiagente, comparación de actualizaciones de políticas, asistencia con tickets de soporte, asistencia al servicio al cliente, generación de actas de reuniones, selección de currículos, análisis de registros de llamadas, gobernanza de datos no estructurados, minería de conocimiento, análisis de datos y más.

    Las funciones de nivel empresarial son la garantía fundamental para la implementación de aplicaciones
    - Revisión de seguridad, RBAC, gestión de grupos de usuarios, control de tráfico por grupo, SSO/LDAP, escaneo y parcheo de vulnerabilidades, soluciones de despliegue de alta disponibilidad, monitorización, estadísticas y más.

    Análisis de documentos de alta precisión
    - Nuestro modelo de análisis de documentos de alta precisión se entrena con una gran cantidad de datos de alta calidad acumulados durante los últimos 5 años. Incluye modelos de reconocimiento de texto impreso, manuscrito y caracteres raros de alta precisión, modelos de reconocimiento de tablas, modelos de análisis de diseño y modelos de sellos. Puede desplegarlo de forma privada de forma gratuita.

    Una comunidad para compartir las mejores prácticas en diversos escenarios empresariales
    - Un repositorio abierto de casos de aplicación y mejores prácticas.
