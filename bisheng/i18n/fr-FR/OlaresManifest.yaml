metadata:
  title: BISHENG
  description: Plateforme ouverte de devops LLM pour les applications d'IA d'entreprise de nouvelle génération
spec:
  fullDescription: |
    BISHENG est une plateforme ouverte de devops pour applications LLM, axée sur les scénarios d'entreprise. Elle est déjà utilisée par de nombreuses organisations leaders du secteur et des entreprises du Fortune 500.

    **Fonctionnalités**
    Workflow unique BISHENG
    - Framework d'orchestration d'applications indépendant et complet
    - Human in the loop
    - Puissant : prend en charge les boucles, le parallélisme, le traitement par lots, la logique conditionnelle et la combinaison libre de tous les composants logiques.
    - Convivial et intuitif

    Conçu pour les applications d'entreprise
    - Revue de documents, génération de rapports à mise en page fixe, collaboration multi-agents, comparaison des mises à jour de politiques, assistance aux tickets de support, assistance au service client, génération de comptes rendus de réunion, sélection de CV, analyse des enregistrements d'appels, gouvernance des données non structurées, knowledge mining, analyse de données, et plus encore.

    Les fonctionnalités de niveau entreprise sont la garantie fondamentale de la mise en œuvre des applications
    - Revue de sécurité, RBAC, gestion des groupes d'utilisateurs, contrôle du trafic par groupe, SSO/LDAP, scan et correctifs de vulnérabilités, solutions de déploiement haute disponibilité, monitoring, statistiques, et plus encore.

    Analyse de documents haute précision
    - Notre modèle d'analyse de documents haute précision est entraîné sur une grande quantité de données de haute qualité accumulées au cours des 5 dernières années. Il inclut des modèles haute précision de reconnaissance de texte imprimé, manuscrit et de caractères rares, des modèles de reconnaissance de tableaux, d'analyse de mise en page et de sceaux. Vous pouvez le déployer en privé gratuitement.

    Une communauté pour partager les meilleures pratiques dans divers scénarios d'entreprise
    - Un dépôt ouvert de cas d'application et de meilleures pratiques.
