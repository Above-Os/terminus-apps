metadata:
  title: BISHENG
  description: Piattaforma aperta di devops LLM per applicazioni AI aziendali di nuova generazione
spec:
  fullDescription: |
    BISHENG è una piattaforma aperta di devops per applicazioni LLM, incentrata sugli scenari aziendali. È già utilizzata da numerose organizzazioni leader del settore e aziende Fortune 500.

    **Funzionalità**
    Workflow unico di BISHENG
    - Framework indipendente e completo di orchestrazione delle applicazioni
    - Human in the loop
    - Potente: supporta cicli, parallelismo, elaborazione batch, logica condizionale e libera combinazione di tutti i componenti logici.
    - Facile da usare e intuitivo

    Progettato per applicazioni aziendali
    - Revisione documenti, generazione di report a layout fisso, collaborazione multi-agente, confronto degli aggiornamenti delle policy, assistenza ai ticket di supporto, assistenza al servizio clienti, generazione di verbali di riunione, screening dei curriculum, analisi dei registri delle chiamate, governance dei dati non strutturati, knowledge mining, analisi dei dati e altro.

    Le funzionalità di livello enterprise sono la garanzia fondamentale per l'implementazione delle applicazioni
    - Revisione della sicurezza, RBAC, gestione dei gruppi utenti, controllo del traffico per gruppo, SSO/LDAP, scansione e patch delle vulnerabilità, soluzioni di deploy ad alta disponibilità, monitoring, statistiche e altro.

    Parsing di documenti ad alta precisione
    - Il nostro modello di parsing documenti ad alta precisione è addestrato su una vasta quantità di dati di alta qualità accumulati negli ultimi 5 anni. Include modelli ad alta precisione per testo stampato, manoscritto e caratteri rari, modelli di riconoscimento tabelle, modelli di analisi del layout e modelli di sigilli. Puoi distribuirlo privatamente gratuitamente.

    Una community per condividere le best practice in vari scenari aziendali
    - Un repository aperto di casi applicativi e best practice.
