metadata:
  title: BISHENG
  description: Offene LLM-DevOps-Plattform für Unternehmens-KI-Anwendungen der nächsten Generation
spec:
  fullDescription: |
    BISHENG ist eine offene LLM-Anwendungs-DevOps-Plattform mit Fokus auf Unternehmensszenarien. Sie wird bereits von zahlreichen branchenführenden Organisationen und Fortune-500-Unternehmen eingesetzt.

    **Funktionen**
    Einzigartiger BISHENG-Workflow
    - Unabhängiges und umfassendes Framework zur Anwendungsorchestrierung
    - Human in the Loop
    - Leistungsstark: Unterstützt Schleifen, Parallelität, Batch-Verarbeitung, bedingte Logik und freie Kombination aller Logikkomponenten.
    - Benutzerfreundlich und intuitiv

    Für Unternehmensanwendungen konzipiert
    - Dokumentenprüfung, Berichte mit festem Layout, Multi-Agenten-Zusammenarbeit, Vergleich von Richtlinienupdates, Support-Ticket-Hilfe, Kundenservice-Hilfe, Erstellung von Besprechungsprotokollen, Lebenslauf-Screening, Analyse von Anrufprotokollen, Governance unstrukturierter Daten, Knowledge Mining, Datenanalyse und mehr.

    Unternehmensfunktionen sind die grundlegende Garantie für die Anwendungsimplementierung
    - Sicherheitsprüfung, RBAC, Benutzergruppenverwaltung, Verkehrskontrolle nach Gruppe, SSO/LDAP, Schwachstellenscans und Patches, Hochverfügbarkeits-Bereitstellungslösungen, Monitoring, Statistiken und mehr.

    Hochpräzises Dokumenten-Parsing
    - Unser hochpräzises Dokumenten-Parsing-Modell wurde auf einer großen Menge hochwertiger Daten trainiert, die über die letzten 5 Jahre gesammelt wurden. Es umfasst hochpräzise Modelle für gedruckten Text, Handschrift und seltene Zeichen sowie Tabellen-, Layoutanalyse- und Siegelmodelle. Sie können es privat und kostenlos bereitstellen.

    Eine Community zum Teilen bewährter Praktiken in verschiedenen Unternehmensszenarien
    - Ein offenes Repository von Anwendungsfällen und Best Practices.
