metadata:
  title: Grafana
  description: Grafana es una aplicación web de análisis y visualización interactiva de código abierto multiplataforma.
spec:
  fullDescription: |
    Grafana te permite consultar, visualizar, alertar y comprender tus métricas sin importar dónde estén almacenadas. Crea, explora y comparte paneles con tu equipo y fomenta una cultura basada en datos:
    
    Visualizaciones: Gráficos rápidos y flexibles del lado del cliente con multitud de opciones. Los plugins de panel ofrecen muchas formas de visualizar métricas y logs.
    Dashboards dinámicos: Crea dashboards dinámicos y reutilizables con variables de plantilla que aparecen como desplegables en la parte superior del dashboard.
    Explorar métricas: Explora tus datos mediante consultas ad hoc y drilldown dinámico. Vista dividida y comparación de distintos rangos temporales, consultas y fuentes de datos lado a lado.
    Explorar logs: Experimenta la magia de pasar de métricas a logs conservando los filtros de etiquetas. Busca rápidamente en todos tus logs o transmítelos en vivo.
    Alertas: Define visualmente reglas de alerta para tus métricas más importantes. Grafana las evaluará continuamente y enviará notificaciones a sistemas como Slack, PagerDuty, VictorOps, OpsGenie.
    Fuentes de datos mixtas: ¡Mezcla distintas fuentes de datos en el mismo gráfico! Puedes especificar una fuente de datos por consulta. Esto funciona incluso con fuentes personalizadas.
  upgradeDescription: |
    Corregir el error de proveedor faltante y añadir la dependencia prometheusclient
