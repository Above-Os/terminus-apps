metadata:
  title: Grafana
  description: Grafana は、マルチプラットフォームのオープンソース分析・インタラクティブ可視化 Web アプリケーションです。
spec:
  fullDescription: |
    Grafana を使うと、保存場所を問わずメトリクスをクエリし、可視化し、アラートを設定し、理解できます。チームとダッシュボードを作成・探索・共有し、データ駆動の文化を育てましょう：
    
    可視化：多数のオプションを備えた高速で柔軟なクライアントサイドグラフ。パネルプラグインはメトリクスとログをさまざまな方法で可視化します。
    動的ダッシュボード：ダッシュボード上部にドロップダウンとして表示されるテンプレート変数で、動的で再利用可能なダッシュボードを作成。
    メトリクスの探索：アドホッククエリと動的ドリルダウンでデータを探索。分割ビューで異なる時間範囲・クエリ・データソースを並べて比較。
    ログの探索：ラベルフィルターを保持したままメトリクスからログへ切り替え。すべてのログをすばやく検索、またはライブストリーミング。
    アラート：重要なメトリクスのアラートルールを視覚的に定義。Grafana は継続的に評価し、Slack、PagerDuty、VictorOps、OpsGenie などのシステムへ通知を送信。
    混合データソース：同じグラフで異なるデータソースを混合！クエリごとにデータソースを指定できます。カスタムデータソースでも動作します。
  upgradeDescription: |
    プロバイダー欠落エラーを修正し、prometheusclient 依存関係を追加
