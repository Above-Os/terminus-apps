metadata:
  title: Grafana
  description: "Grafana est une application web multiplateforme open source d'analyse et de visualisation interactive."
spec:
  fullDescription: |
    Grafana vous permet d'interroger, de visualiser, d'alerter et de comprendre vos métriques où qu'elles soient stockées. Créez, explorez et partagez des tableaux de bord avec votre équipe et favorisez une culture data-driven :
    
    Visualisations : Graphiques côté client rapides et flexibles avec une multitude d'options. Les plugins de panneaux offrent de nombreuses façons de visualiser métriques et logs.
    Tableaux de bord dynamiques : Créez des tableaux de bord dynamiques et réutilisables avec des variables de modèle qui apparaissent en menus déroulants en haut du tableau de bord.
    Explorer les métriques : Explorez vos données via des requêtes ad hoc et un drilldown dynamique. Vue scindée et comparaison de différentes plages temporelles, requêtes et sources de données côte à côte.
    Explorer les logs : Passez des métriques aux logs en conservant les filtres de labels. Recherchez rapidement dans tous vos logs ou streamez-les en direct.
    Alertes : Définissez visuellement des règles d'alerte pour vos métriques les plus importantes. Grafana les évalue en continu et envoie des notifications vers des systèmes comme Slack, PagerDuty, VictorOps, OpsGenie.
    Sources de données mixtes : Mélangez différentes sources dans le même graphique ! Vous pouvez spécifier une source par requête. Cela fonctionne même pour des sources personnalisées.
  upgradeDescription: |
    Corriger l'erreur de fournisseur manquant et ajouter la dépendance prometheusclient
