metadata:
  title: Grafana
  description: Grafana ist eine plattformübergreifende, quelloffene Webanwendung für Analysen und interaktive Visualisierung.
spec:
  fullDescription: |
    Grafana ermöglicht es Ihnen, Metriken abzufragen, zu visualisieren, Alarme darauf zu setzen und sie zu verstehen – unabhängig davon, wo sie gespeichert sind. Erstellen, erkunden und teilen Sie Dashboards mit Ihrem Team und fördern Sie eine datengesteuerte Kultur:
    
    Visualisierungen: Schnelle und flexible clientseitige Diagramme mit zahlreichen Optionen. Panel-Plugins bieten viele verschiedene Möglichkeiten, Metriken und Logs zu visualisieren.
    Dynamische Dashboards: Erstellen Sie dynamische und wiederverwendbare Dashboards mit Template-Variablen, die als Dropdowns oben im Dashboard erscheinen.
    Metriken erkunden: Erkunden Sie Ihre Daten durch Ad-hoc-Abfragen und dynamisches Drilldown. Geteilte Ansicht und Vergleich verschiedener Zeitbereiche, Abfragen und Datenquellen nebeneinander.
    Logs erkunden: Erleben Sie den Wechsel von Metriken zu Logs mit erhaltenen Label-Filtern. Durchsuchen Sie schnell alle Ihre Logs oder streamen Sie sie live.
    Alerting: Definieren Sie visuelle Alarmregeln für Ihre wichtigsten Metriken. Grafana bewertet sie kontinuierlich und sendet Benachrichtigungen an Systeme wie Slack, PagerDuty, VictorOps, OpsGenie.
    Gemischte Datenquellen: Mischen Sie verschiedene Datenquellen im selben Diagramm! Sie können eine Datenquelle pro Abfrage angeben. Das funktioniert sogar für benutzerdefinierte Datenquellen.
  upgradeDescription: |
    Fehler wegen fehlendem Provider behoben und Abhängigkeit prometheusclient hinzugefügt
