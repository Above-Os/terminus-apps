metadata:
  title: Grafana
  description: "Grafana è un'applicazione web multipiattaforma open source per analisi e visualizzazione interattiva"
spec:
  fullDescription: |
    Grafana ti permette di interrogare, visualizzare, impostare allarmi e comprendere le tue metriche ovunque siano memorizzate. Crea, esplora e condividi dashboard con il tuo team e favorisci una cultura data-driven:
    
    Visualizzazioni: Grafici client-side veloci e flessibili con moltissime opzioni. I plugin dei pannelli offrono molti modi diversi di visualizzare metriche e log.
    Dashboard dinamiche: Crea dashboard dinamiche e riutilizzabili con variabili template che appaiono come menu a tendina in cima alla dashboard.
    Esplora metriche: Esplora i tuoi dati con query ad hoc e drilldown dinamico. Vista divisa e confronto di intervalli temporali, query e sorgenti dati affiancati.
    Esplora log: Prova la magia del passaggio da metriche a log con i filtri delle etichette preservati. Cerca rapidamente tra tutti i tuoi log o trasmettili in diretta.
    Alerting: Definisci visivamente regole di allarme per le metriche più importanti. Grafana le valuterà continuamente e invierà notifiche a sistemi come Slack, PagerDuty, VictorOps, OpsGenie.
    Sorgenti dati miste: Mescola diverse sorgenti dati nello stesso grafico! Puoi specificare una sorgente dati per query. Funziona anche per sorgenti personalizzate.
  upgradeDescription: |
    Correggere l'errore del provider mancante e aggiungere la dipendenza prometheusclient
