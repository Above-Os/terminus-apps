# Design input for the Olares chart. Postgres/Redis are replaced by
# system middleware after conversion; this file is not deployed as-is.
#
# Official quay.io/yetoneful/cumora-server is private.
# Public multi-arch image: docker.io/beclab/harveyff-cumora-server:v0.1.64
name: cumora

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cumora
      POSTGRES_USER: cumora
      POSTGRES_PASSWORD: cumora

  redis:
    image: redis:7

  cumora:
    image: docker.io/beclab/harveyff-cumora-server:v0.1.64
    labels:
      olares.service.type: Entrance
    depends_on:
      - postgres
      - redis
    ports:
      - "5181:5181"
    environment:
      NODE_ENV: production
      PORT: "5181"
      DATABASE_URL: postgres://cumora:cumora@postgres:5432/cumora?sslmode=disable
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: replace-me
      AGENT_RUNTIME_SECRET: replace-me
      IDLE_INTERVAL_MS: "0"
    volumes:
      - uploads:/app/server/uploads

volumes:
  uploads:
