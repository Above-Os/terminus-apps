{{- $secretName := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $runtimeSecret := randAlphaNum 64 -}}
{{- if and $existing $existing.data (index $existing.data "AGENT_RUNTIME_SECRET") -}}
{{- $runtimeSecret = index $existing.data "AGENT_RUNTIME_SECRET" | b64dec -}}
{{- end -}}
{{- $pgPort := .Values.postgres.port | default "5432" | toString -}}
{{- $pgUser := .Values.postgres.username | toString | urlquery -}}
{{- $pgPass := .Values.postgres.password | toString | urlquery -}}
{{- $pgHost := .Values.postgres.host | toString -}}
{{- $pgDb := .Values.postgres.databases.cumora | toString -}}
{{- $pgUrl := printf "postgres://%s:%s@%s:%s/%s?sslmode=disable" $pgUser $pgPass $pgHost $pgPort $pgDb -}}
{{- $redisPort := .Values.redis.port | default "6379" | toString -}}
{{- $redisUrl := printf "redis://%s:%s" (.Values.redis.host | toString) $redisPort -}}
{{- if .Values.redis.password -}}
{{- $redisUrl = printf "redis://:%s@%s:%s" (.Values.redis.password | toString | urlquery) (.Values.redis.host | toString) $redisPort -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: cumora
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ $pgUrl | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  AGENT_RUNTIME_SECRET: {{ $runtimeSecret | quote }}
  OPENAI_API_KEY: {{ (.Values.olaresEnv.OPENAI_API_KEY | default "sk-olares-not-configured") | quote }}
  GOOGLE_CLIENT_ID: {{ (.Values.olaresEnv.GOOGLE_CLIENT_ID | default "") | quote }}
  GOOGLE_CLIENT_SECRET: {{ (.Values.olaresEnv.GOOGLE_CLIENT_SECRET | default "") | quote }}
  GITHUB_CLIENT_ID: {{ (.Values.olaresEnv.GITHUB_CLIENT_ID | default "") | quote }}
  GITHUB_CLIENT_SECRET: {{ (.Values.olaresEnv.GITHUB_CLIENT_SECRET | default "") | quote }}
  CUMORA_BOOTSTRAP_EMAIL: {{ (.Values.olaresEnv.CUMORA_BOOTSTRAP_EMAIL | default "") | quote }}
  CUMORA_BOOTSTRAP_PASSWORD: {{ (.Values.olaresEnv.CUMORA_BOOTSTRAP_PASSWORD | default "") | quote }}
  CUMORA_ALLOW_SIGNUP: {{ (.Values.olaresEnv.CUMORA_ALLOW_SIGNUP | default "true") | quote }}
