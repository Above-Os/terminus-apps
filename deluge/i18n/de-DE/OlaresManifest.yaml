metadata:
  title: Deluge
  description: Ein leichtgewichtiger und kostenloser BitTorrent-Client
spec:
  fullDescription: |
    Deluge ist ein voll ausgestatteter plattformübergreifender BitTorrent-Client. Er enthält die gängigen Funktionen von BitTorrent-Clients wie Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, Proxy-Unterstützung, Web Seeds sowie globale und per-Torrent-Geschwindigkeitslimits.

    **Standardzugangsdaten**
    Benutzername: admin
    Passwort: deluge
    Bitte ändern Sie Benutzername und Passwort so bald wie möglich.

    **Hervorgehobene Funktionen**
    Da Deluge die libtorrent-Bibliothek intensiv nutzt, verfügt es über eine umfassende Liste der bereitgestellten Funktionen.
    - Disk-Caching
    - Netzwerkpuffer
    - Piece Picker
    - Share Mode
    - Merkle-Hash-Tree-Torrents
    - Anpassbarer Dateispeicher
    - Einfach zu nutzende API

    Mehr erfahren: https://dev.deluge-torrent.org/
  upgradeDescription: |
    Upgrade von Deluge auf Version 2.2.0 (2025-04-28)
    Konfigurationsänderungen: vereinheitlichtes Download-Verzeichnis & Entrance-Auth-Level.
    - Standard-Mountpfad des Olares Home Directory auf /olares/userdata/home geändert
    - Mountpfad des Olares External Directory auf /olares/userdata/external hinzugefügt
    - Legacy-Mount /downloads für bestehende Konfigurationen beibehalten
    - Standard-Downloadpfad für Neuinstallationen: Home/Downloads/deluge
    - Entrance-Auth-Level auf internal geändert
    - Container-Image auf linuxserver/deluge umgestellt

    Breaking Changes:
    - Unterstützung für Python 3.6 entfernt (Python >= 3.7)

    Upgrade-Highlights:
    - [Core] Unsicheres HTTP für Versionsprüfung behoben (GHSL-2024-189); Alert-Handler-Segfault behoben; Unterstützung zum Erstellen von v2-Torrents hinzugefügt
    - [Web UI] Path-Traversal-Schwachstellen behoben (GHSL-2024-188, GHSL-2024-191); unsicheren Tracker-Icon-Endpunkt behoben (GHSL-2024-190); Reaktionsfähigkeit verbessert, um „Connection lost“ zu vermeiden; UI-Theme-Unterstützung und Bindung an Netzwerkschnittstellennamen hinzugefügt
    - [GTK UI] Absturz bei Fenstergrößenänderung mit Piecesbar/Stats-Plugin behoben; Schnellsuche behoben; Umschalten zwischen Dark/Light Theme hinzugefügt
    - [Console UI] Hängen von „rm“- und „move“-Befehlen behoben; Host-Hinzufügen im Connection Manager behoben

    Vollständiges Changelog: https://deluge.readthedocs.io/en/deluge-2.2.0/changelog.html
