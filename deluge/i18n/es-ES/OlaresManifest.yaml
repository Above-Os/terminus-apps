metadata:
  title: Deluge
  description: Un cliente BitTorrent ligero y gratuito.
spec:
  fullDescription: |
    Deluge es un cliente BitTorrent multiplataforma con todas las funciones. Incluye las funciones habituales de los clientes BitTorrent como Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, soporte de proxy, Web seeds y límites de velocidad globales y por torrent.

    **Credenciales por defecto**
    Usuario: admin
    Contraseña: deluge
    Por favor, cambia el usuario y la contraseña lo antes posible.

    **Funciones destacadas**
    Como Deluge utiliza intensamente la biblioteca libtorrent, tiene una lista completa de las funciones proporcionadas.
    - Caché de disco
    - Búferes de red
    - Piece picker
    - Share mode
    - Torrents con árbol hash Merkle
    - Almacenamiento de archivos personalizable
    - API fácil de usar

    Visita aquí para saber más: https://dev.deluge-torrent.org/
  upgradeDescription: |
    Actualizar Deluge a la versión 2.2.0 (2025-04-28)
    Cambios de configuración: directorio de descarga unificado y nivel de auth de la entrance.
    - Cambiar la ruta de montaje por defecto del Olares Home Directory a /olares/userdata/home
    - Añadir la ruta de montaje del Olares External Directory a /olares/userdata/external
    - Mantener el montaje legacy /downloads para configuraciones existentes
    - Ruta de descarga por defecto para instalaciones nuevas: Home/Downloads/deluge
    - Nivel de auth de la entrance cambiado a internal
    - Cambiar la imagen del contenedor a linuxserver/deluge

    Cambios incompatibles:
    - Eliminado el soporte de Python 3.6 (Python >= 3.7)

    Destacados de la actualización:
    - [Core] Corregido HTTP inseguro para la comprobación de nueva versión (GHSL-2024-189); corregido segfault del alert handler; añadido soporte para crear torrents v2
    - [Web UI] Corregidas vulnerabilidades de path traversal (GHSL-2024-188, GHSL-2024-191); corregido endpoint inseguro del icono del tracker (GHSL-2024-190); mejorada la capacidad de respuesta para evitar "Connection lost"; añadido soporte de tema UI y enlace por nombre de interfaz de red
    - [GTK UI] Corregido el crash al redimensionar la ventana con el plugin Piecesbar/Stats; corregida la búsqueda rápida; añadido cambio de tema oscuro/claro
    - [Console UI] Corregidos los comandos 'rm' y 'move' que se quedaban colgados; corregida la imposibilidad de añadir host en el connection manager

    Changelog completo: https://deluge.readthedocs.io/en/deluge-2.2.0/changelog.html
