metadata:
  title: Deluge
  description: 軽量で無料の BitTorrent クライアント
spec:
  fullDescription: |
    Deluge は機能充実のクロスプラットフォーム BitTorrent クライアントです。Protocol Encryption、DHT、Local Peer Discovery（LSD）、Peer Exchange（PEX）、UPnP、NAT-PMP、プロキシ対応、Web seeds、全体および torrent ごとの速度制限など、BitTorrent クライアント共通の機能を備えます。

    **デフォルト認証情報**
    ユーザー名：admin
    パスワード：deluge
    できるだけ早くユーザー名とパスワードを変更してください。

    **注目機能**
    Deluge は libtorrent ライブラリを多用するため、提供される機能の包括的な一覧があります。
    - ディスクキャッシュ
    - ネットワークバッファ
    - Piece picker
    - Share mode
    - Merkle ハッシュツリー torrent
    - カスタマイズ可能なファイルストレージ
    - 使いやすい API

    詳細はこちら：https://dev.deluge-torrent.org/
  upgradeDescription: |
    Deluge をバージョン 2.2.0（2025-04-28）へアップグレード
    設定変更：ダウンロードディレクトリの統一と entrance の認証レベル。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - Olares External Directory のマウントパス /olares/userdata/external を追加
    - 既存設定向けにレガシー /downloads マウントを維持
    - 新規インストールのデフォルトダウンロードパス：Home/Downloads/deluge
    - entrance の認証レベルを internal に変更
    - コンテナイメージを linuxserver/deluge へ切り替え

    破壊的変更：
    - Python 3.6 サポートを削除（Python >= 3.7）

    アップグレードのハイライト：
    - [Core] 新バージョン確認の不安全 HTTP を修正（GHSL-2024-189）；アラートハンドラのセグフォルトを修正；v2 torrent 作成サポートを追加
    - [Web UI] パストラバーサル脆弱性を修正（GHSL-2024-188、GHSL-2024-191）；不安全なトラッカーアイコンエンドポイントを修正（GHSL-2024-190）；「Connection lost」回避のため応答性を改善；UI テーマとネットワークインタフェース名バインドを追加
    - [GTK UI] Piecesbar/Stats プラグインでのウィンドウリサイズクラッシュを修正；クイック検索を修正；ダーク／ライトテーマ切替を追加
    - [Console UI] 'rm' と 'move' コマンドのハングを修正；connection manager でホストを追加できない問題を修正

    完全な変更履歴：https://deluge.readthedocs.io/en/deluge-2.2.0/changelog.html
