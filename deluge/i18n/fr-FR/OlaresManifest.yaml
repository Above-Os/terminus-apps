metadata:
  title: Deluge
  description: Un client BitTorrent léger et gratuit.
spec:
  fullDescription: |
    Deluge est un client BitTorrent multiplateforme complet. Il contient les fonctionnalités courantes des clients BitTorrent telles que Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, prise en charge des proxys, Web seeds, ainsi que des limites de vitesse globales et par torrent.

    **Identifiants par défaut**
    Nom d'utilisateur : admin
    Mot de passe : deluge
    Veuillez changer le nom d'utilisateur et le mot de passe dès que possible.

    **Fonctionnalités mises en avant**
    Comme Deluge utilise intensivement la bibliothèque libtorrent, il dispose d'une liste complète des fonctionnalités fournies.
    - Mise en cache disque
    - Tampons réseau
    - Piece picker
    - Share mode
    - Torrents à arbre de hachage Merkle
    - Stockage de fichiers personnalisable
    - API facile à utiliser

    En savoir plus : https://dev.deluge-torrent.org/
  upgradeDescription: |
    Mise à niveau de Deluge vers la version 2.2.0 (2025-04-28)
    Changements de configuration : répertoire de téléchargement unifié et niveau d'auth de l'entrance.
    - Changer le chemin de montage par défaut du Olares Home Directory vers /olares/userdata/home
    - Ajouter le chemin de montage du Olares External Directory vers /olares/userdata/external
    - Conserver le montage legacy /downloads pour les configurations existantes
    - Chemin de téléchargement par défaut pour les nouvelles installations : Home/Downloads/deluge
    - Niveau d'auth de l'entrance changé en internal
    - Passer l'image du conteneur à linuxserver/deluge

    Changements incompatibles :
    - Suppression du support de Python 3.6 (Python >= 3.7)

    Points forts de la mise à niveau :
    - [Core] Correction du HTTP non sécurisé pour la vérification de nouvelle version (GHSL-2024-189) ; correction d'un segfault du gestionnaire d'alertes ; ajout du support de création de torrents v2
    - [Web UI] Correction de vulnérabilités de path traversal (GHSL-2024-188, GHSL-2024-191) ; correction d'un endpoint d'icône de tracker non sécurisé (GHSL-2024-190) ; amélioration de la réactivité pour éviter « Connection lost » ; ajout du support des thèmes UI et de la liaison par nom d'interface réseau
    - [GTK UI] Correction d'un crash au redimensionnement de fenêtre avec le plugin Piecesbar/Stats ; correction de la recherche rapide ; ajout du basculement thème sombre/clair
    - [Console UI] Correction des commandes « rm » et « move » qui se bloquaient ; correction de l'impossibilité d'ajouter un hôte dans le connection manager

    Changelog complet : https://deluge.readthedocs.io/en/deluge-2.2.0/changelog.html
