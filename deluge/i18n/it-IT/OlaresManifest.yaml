metadata:
  title: Deluge
  description: Un client BitTorrent leggero e gratuito.
spec:
  fullDescription: |
    Deluge è un client BitTorrent multipiattaforma completo. Contiene le funzioni comuni dei client BitTorrent come Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, supporto proxy, Web seeds e limiti di velocità globali e per torrent.

    **Credenziali predefinite**
    Username: admin
    Password: deluge
    Modifica username e password il prima possibile.

    **Funzionalità in evidenza**
    Poiché Deluge utilizza intensamente la libreria libtorrent, ha un elenco completo delle funzionalità fornite.
    - Disk caching
    - Buffer di rete
    - Piece picker
    - Share mode
    - Torrent con albero hash Merkle
    - Archiviazione file personalizzabile
    - API facile da usare

    Visita qui per saperne di più: https://dev.deluge-torrent.org/
  upgradeDescription: |
    Aggiornare Deluge alla versione 2.2.0 (2025-04-28)
    Modifiche di configurazione: directory di download unificata e livello di auth dell'entrance.
    - Cambiare il percorso di mount predefinito di Olares Home Directory in /olares/userdata/home
    - Aggiungere il percorso di mount di Olares External Directory in /olares/userdata/external
    - Mantenere il mount legacy /downloads per le configurazioni esistenti
    - Percorso di download predefinito per le nuove installazioni: Home/Downloads/deluge
    - Livello di auth dell'entrance cambiato in internal
    - Passare l'immagine del container a linuxserver/deluge

    Breaking changes:
    - Rimosso il supporto a Python 3.6 (Python >= 3.7)

    Highlight dell'upgrade:
    - [Core] Corretto HTTP non sicuro per il controllo nuova versione (GHSL-2024-189); corretto segfault dell'alert handler; aggiunto supporto per creare torrent v2
    - [Web UI] Corrette vulnerabilità di path traversal (GHSL-2024-188, GHSL-2024-191); corretto endpoint non sicuro dell'icona tracker (GHSL-2024-190); migliorata la reattività per evitare "Connection lost"; aggiunto supporto temi UI e binding per nome interfaccia di rete
    - [GTK UI] Corretto crash al ridimensionamento finestra con plugin Piecesbar/Stats; corretta ricerca rapida; aggiunto passaggio tema scuro/chiaro
    - [Console UI] Corretti i comandi 'rm' e 'move' che restavano bloccati; corretta l'impossibilità di aggiungere host nel connection manager

    Changelog completo: https://deluge.readthedocs.io/en/deluge-2.2.0/changelog.html
