metadata:
  title: solidtime
  description: 现代开源时间跟踪应用程序。
spec:
  upgradeDescription: |
    升级至上游紧急安全版本 solidtime 0.22.1 和 PHP 8.3.36，修复 CVE-2026-109618、CVE-2026-109619。保留 PostgreSQL 数据、应用密钥和存储；迁移前校验数据库备份，更新数据库 TLS 参数，并停止在日志中输出密钥。升级前请备份数据库、存储及密钥。

  fullDescription: |
    solidtime是一款面向自由职业者与机构的现代开源时间跟踪应用程序。
  
    **核心功能**
    - 时间跟踪：通过现代化易用界面实时追踪时间
    - 项目管理：创建并管理项目，支持成员分配与协作
    - 任务体系：构建任务体系并关联至具体项目
    - 客户管理：维护客户数据库并绑定对应项目
    - 计费配置：支持为项目、成员、组织设置多层级计费费率
    - 多组织支持：单账户可创建及管理多个独立组织架构
    - 权限控制：基于角色的权限系统实现组织精细化管理
    - 数据迁移：支持从Toggl、Clockify及CSV格式导入历史时间数据
