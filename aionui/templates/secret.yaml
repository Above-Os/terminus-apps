apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  namespace: "{{ .Release.Namespace }}"
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ ((.Values.olaresEnv | default dict).ADMIN_PASSWORD | default "") | quote }}
  OPENAI_API_KEY: {{ ((.Values.olaresEnv | default dict).OPENAI_API_KEY | default "") | quote }}
  ANTHROPIC_API_KEY: {{ ((.Values.olaresEnv | default dict).ANTHROPIC_API_KEY | default "") | quote }}
