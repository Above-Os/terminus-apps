apiVersion: v1
kind: ConfigMap
metadata:
  name: aionui-scripts
  namespace: "{{ .Release.Namespace }}"
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    # Unset empty optional API keys so downstream SDKs do not see empty strings.
    [ -n "${OPENAI_API_KEY:-}" ] || unset OPENAI_API_KEY
    [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY

    rm -f /tmp/olares-bootstrap-ready
    /opt/aionui-web/aionui-web start --remote --no-open &
    APP_PID=$!
    (
      until node /olares/bootstrap.js; do
        sleep 10
      done
      touch /tmp/olares-bootstrap-ready
    ) &
    INIT_PID=$!
    trap 'kill -TERM "$INIT_PID" "$APP_PID" 2>/dev/null || true' INT TERM

    wait "$APP_PID"
  bootstrap.js: |
    const fs = require('fs');

    const pw = process.env.AIONUI_ADMIN_PASSWORD || '';
    const routerBaseUrl = (process.env.OLARES_ROUTER_BASE_URL || '').trim();
    const dataDir = process.env.AIONUI_DATA_DIR || '/data';
    const port = process.env.AIONUI_PORT || '25808';
    const base = `http://127.0.0.1:${port}`;

    const pwStampFile = `${dataDir}/.olares-admin-password.sha256`;
    const routerStampFile = `${dataDir}/.olares-router-seeded`;

    function request(path, options = {}) {
      return fetch(base + path, { ...options, signal: AbortSignal.timeout(5000) });
    }

    function login() {
      return request('/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: 'admin', password: pw }),
      });
    }

    (async () => {
      fs.rmSync(pwStampFile, { force: true });
      if (!pw) throw new Error('ADMIN_PASSWORD is required');
      const status = await request('/api/auth/status');
      if (!status.ok || (await status.json()).needs_setup !== false) {
        throw new Error('auth service is starting');
      }

      let lr = await login();
      if (lr.status === 401) {
        const res = await request('/api/webui/change-password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ new_password: pw }),
        });
        if (!res.ok) throw new Error('password sync returned HTTP ' + res.status);
        lr = await login();
      }
      if (!lr.ok) throw new Error('login returned HTTP ' + lr.status);
      const { token } = await lr.json();
      if (!token) throw new Error('login returned no token');

      if (routerBaseUrl && !fs.existsSync(routerStampFile)) {
        const headers = {
          authorization: `Bearer ${token}`,
          'content-type': 'application/json',
        };

        const listRes = await request('/api/providers', { headers });
        if (!listRes.ok) throw new Error('provider list returned HTTP ' + listRes.status);
        const { data } = await listRes.json();
        if (!Array.isArray(data)) throw new Error('invalid provider list');
        const existing = data.some((p) => p && (p.name === 'Olares Router' || p.base_url === routerBaseUrl));

        if (!existing) {
          const createRes = await request('/api/providers', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              platform: 'custom',
              name: 'Olares Router',
              base_url: routerBaseUrl,
              api_key: 'olares',
              models: ['default-chat'],
              enabled: true,
            }),
          });

          if (!createRes.ok) {
            const text = await createRes.text().catch(() => '');
            console.error(`[olares-init] failed to seed Olares Router provider: HTTP ${createRes.status} ${text}`);
            process.exit(1);
          }

          console.log(`[olares-init] seeded default Olares Router provider (${routerBaseUrl}, model=default-chat)`);
        } else {
          console.log('[olares-init] Olares Router provider already present; skipped seed');
        }

        fs.writeFileSync(routerStampFile, `${routerBaseUrl}\n`, { mode: 0o600 });
      }
    })().catch((err) => {
      console.error('[olares-init] bootstrap error:', err);
      process.exit(1);
    });
