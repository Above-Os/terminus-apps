metadata:
  title: Bazarr
  description: Un gestionnaire de sous-titres compagnon de Sonarr et Radarr.
spec:
  fullDescription: |
    Bazarr est une application compagnon de Sonarr et Radarr. Elle gère et télécharge les sous-titres selon vos besoins. Vous définissez vos préférences par série TV ou film, et Bazarr s’occupe du reste.

    Sachez que Bazarr ne scanne pas le disque pour détecter séries et films : il ne gère que ceux indexés dans Sonarr et Radarr.

    Fonctionnalités majeures :
    - Prise en charge des principales plateformes : Windows, Linux, macOS, Raspberry Pi, etc.
    - Ajout automatique des nouvelles séries et épisodes depuis Sonarr
    - Ajout automatique des nouveaux films depuis Radarr
    - Configuration des langues de sous-titres par série ou film
    - Analyse de votre bibliothèque existante pour les sous-titres internes et externes et téléchargement des manquants
    - Historique de ce qui a été téléchargé, d’où et quand
    - Recherche manuelle pour télécharger des sous-titres à la demande
    - Mise à niveau des sous-titres déjà téléchargés lorsqu’une meilleure version est trouvée
    - Possibilité de supprimer des sous-titres externes du disque
    - Prise en charge actuellement de 184 langues de sous-titres avec forced/foreign (selon les fournisseurs)
    - Et une belle UI basée sur Sonarr
  upgradeDescription: |
    Mise à niveau de Bazarr vers la version 1.5.6 (2026-02-26)
    Changements de configuration : chemin de montage du répertoire Olares et authlevel de l’entrée.
    - Chemin de montage par défaut du Home Directory Olares changé en /olares/userdata/home
    - Ajout d’Olares External Directory et montage vers /olares/userdata/external
    - Image du conteneur passée à linuxserver/bazarr
    - Niveau d’auth de l’entrée passé à internal

    Points forts de la mise à niveau :
    - [Security] Ajout du réglage hostname dans General settings pour prévenir le hostname poisoning
    - [Performance] File de jobs asynchrone et workflows d’upload/download de sous-titres ; suppression du suivi de progression bloquant pour éviter le gel du frontend
    - [New Features] Actualisation de la bibliothèque Plex après changements de sous-titres ; détection de délai audio WhisperAI ; proxy SubX pour Subdivx Latam Spanish ; prise en charge du flux d’événements de backup
    - [Providers] Améliorations subdl, opensubtitlescom, Gestdown, Assrt, subssabbz ; suppression du fournisseur subdivx non pris en charge ; intégration de clé API SubX
    - [Fixes] Post-traitement Windows non anglais ; refactor de la logique d’historique des sous-titres upgradables ; throttling Titulky 429

    Notes de version complètes : https://github.com/morpheus65535/bazarr/releases/tag/v1.5.6
