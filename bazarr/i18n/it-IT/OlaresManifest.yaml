metadata:
  title: Bazarr
  description: Un gestore di sottotitoli companion di Sonarr e Radarr
spec:
  fullDescription: |
    Bazarr è un’applicazione companion di Sonarr e Radarr. Gestisce e scarica i sottotitoli in base alle tue esigenze. Definisci le preferenze per serie TV o film e Bazarr si occupa di tutto.

    Tieni presente che Bazarr non scansiona il disco per rilevare serie e film: si occupa solo di quelli indicizzati in Sonarr e Radarr.

    Funzionalità principali:
    - Supporto per le principali piattaforme: Windows, Linux, macOS, Raspberry Pi, ecc.
    - Aggiunta automatica di nuove serie ed episodi da Sonarr
    - Aggiunta automatica di nuovi film da Radarr
    - Configurazione delle lingue dei sottotitoli per serie o film
    - Scansione della libreria esistente per sottotitoli interni ed esterni e download di quelli mancanti
    - Cronologia di cosa è stato scaricato, da dove e quando
    - Ricerca manuale per scaricare sottotitoli on demand
    - Upgrade dei sottotitoli già scaricati quando se ne trova uno migliore
    - Possibilità di eliminare i sottotitoli esterni dal disco
    - Attualmente supporta 184 lingue di sottotitoli con supporto forced/foreign (a seconda dei provider)
    - E una UI bella basata su Sonarr
  upgradeDescription: |
    Aggiornamento di Bazarr alla versione 1.5.6 (2026-02-26)
    Modifiche di configurazione: percorso di mount della directory Olares e authlevel dell’ingresso.
    - Percorso di mount predefinito della Home Directory Olares impostato su /olares/userdata/home
    - Aggiunta Olares External Directory e mount su /olares/userdata/external
    - Immagine del container passata a linuxserver/bazarr
    - Livello auth dell’ingresso impostato su internal

    Highlight dell’upgrade:
    - [Security] Aggiunta impostazione hostname in General settings per prevenire hostname poisoning
    - [Performance] Coda job asincrona e workflow upload/download sottotitoli; rimosso il monitoraggio progresso bloccante per evitare il freeze del frontend
    - [New Features] Refresh libreria Plex dopo modifiche ai sottotitoli; rilevamento ritardo audio WhisperAI; proxy SubX per Subdivx Latam Spanish; supporto stream eventi di backup
    - [Providers] Migliorati subdl, opensubtitlescom, Gestdown, Assrt, subssabbz; rimosso provider subdivx non supportato; integrazione chiave API SubX
    - [Fixes] Post-processing Windows non inglese; refactor logica cronologia sottotitoli aggiornabili; throttling Titulky 429

    Note di rilascio complete: https://github.com/morpheus65535/bazarr/releases/tag/v1.5.6
