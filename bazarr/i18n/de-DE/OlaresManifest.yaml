metadata:
  title: Bazarr
  description: Ein Begleit-Untertitelmanager für Sonarr und Radarr.
spec:
  fullDescription: |
    Bazarr ist eine Begleit-Anwendung zu Sonarr und Radarr. Sie verwaltet und lädt Untertitel basierend auf Ihren Anforderungen herunter. Sie legen Präferenzen pro TV-Serie oder Film fest, und Bazarr erledigt den Rest.

    Bitte beachten: Bazarr scannt die Festplatte nicht, um Serien und Filme zu erkennen — es kümmert sich nur um die in Sonarr und Radarr indexierten Serien und Filme.

    Wichtige Funktionen:
    - Unterstützung großer Plattformen: Windows, Linux, macOS, Raspberry Pi usw.
    - Neue Serien und Episoden aus Sonarr automatisch hinzufügen
    - Neue Filme aus Radarr automatisch hinzufügen
    - Serien- oder filmbasierte Konfiguration der Untertitelsprachen
    - Vorhandene Bibliothek auf interne und externe Untertitel prüfen und fehlende herunterladen
    - Verlauf behalten, was wann und woher heruntergeladen wurde
    - Manuelle Suche zum On-Demand-Download von Untertiteln
    - Zuvor heruntergeladene Untertitel upgraden, wenn bessere gefunden werden
    - Externe Untertitel von der Festplatte löschen können
    - Derzeit 184 Untertitelsprachen mit Unterstützung für Forced/Foreign-Untertitel (je nach Anbieter)
    - Und eine schöne UI basierend auf Sonarr
  upgradeDescription: |
    Upgrade von Bazarr auf Version 1.5.6 (2026-02-26)
    Konfigurationsänderungen: Olares-Verzeichnis-Mountpfad & Entrance-Authlevel ändern.
    - Standard-Mountpfad des Olares Home Directory auf /olares/userdata/home geändert
    - Olares External Directory & Mountpfad /olares/userdata/external hinzugefügt
    - Container-Image auf linuxserver/bazarr umgestellt
    - Entrance-Auth-Level auf internal geändert

    Upgrade-Highlights:
    - [Security] Hostname-Einstellung in den Allgemeinen Einstellungen hinzugefügt, um Hostname-Poisoning zu verhindern
    - [Performance] Asynchrone Job-Queue und Untertitel-Upload-/Download-Workflows; blockierendes Progress-Monitoring entfernt, um Frontend-Einfrieren zu verhindern
    - [New Features] Plex-Bibliotheksaktualisierung nach Untertiteländerungen; WhisperAI-Audioverzögerungserkennung; SubX-Proxy für Subdivx Latam Spanish; Backup-Event-Stream-Unterstützung
    - [Providers] Verbesserungen bei subdl, opensubtitlescom, Gestdown, Assrt, subssabbz; nicht unterstützten subdivx-Anbieter entfernt; SubX-API-Key-Integration hinzugefügt
    - [Fixes] Windows-Nachverarbeitung für Nicht-Englisch; Refactor der Upgrade-Untertitel-Verlaufslogik; Titulky-429-Throttling

    Vollständige Release Notes: https://github.com/morpheus65535/bazarr/releases/tag/v1.5.6
