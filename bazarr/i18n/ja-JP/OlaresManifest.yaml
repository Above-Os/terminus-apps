metadata:
  title: Bazarr
  description: Sonarr と Radarr 向けの字幕管理コンパニオン
spec:
  fullDescription: |
    Bazarr は Sonarr と Radarr のコンパニオンアプリです。要件に基づき字幕を管理・ダウンロードします。TV 番組や映画ごとに設定を定義すると、Bazarr がすべて処理します。

    Bazarr はディスクをスキャンしてシリーズや映画を検出しません。Sonarr と Radarr にインデックスされたシリーズと映画のみを扱います。

    主な機能:
    - 主要プラットフォーム対応: Windows、Linux、macOS、Raspberry Pi など
    - Sonarr から新しいシリーズとエピソードを自動追加
    - Radarr から新しい映画を自動追加
    - シリーズ／映画ごとの字幕言語設定
    - 既存ライブラリの内部／外部字幕をスキャンし、不足分をダウンロード
    - 何をどこからいつダウンロードしたかの履歴を保持
    - オンデマンドで字幕をダウンロードする手動検索
    - より良い字幕が見つかったときに以前ダウンロードした字幕をアップグレード
    - ディスク上の外部字幕を削除可能
    - 現在 184 の字幕言語に対応し、forced/foreign 字幕もサポート（プロバイダーによる）
    - Sonarr ベースの美しい UI
  upgradeDescription: |
    Bazarr をバージョン 1.5.6（2026-02-26）へアップグレード
    設定変更: Olares ディレクトリのマウントパスと入口の認証レベルを変更。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - Olares External Directory とマウントパス /olares/userdata/external を追加
    - コンテナイメージを linuxserver/bazarr に切り替え
    - 入口の認証レベルを internal に変更

    アップグレードのハイライト:
    - [Security] hostname poisoning を防ぐため General settings に hostname 設定を追加
    - [Performance] 非同期ジョブキューと字幕アップロード／ダウンロードワークフロー；フロントエンド凍結防止のためブロッキング進捗監視を削除
    - [New Features] 字幕変更後の Plex ライブラリ更新；WhisperAI 音声遅延検出；Subdivx Latam Spanish 向け SubX プロキシ；バックアップイベントストリーム対応
    - [Providers] subdl、opensubtitlescom、Gestdown、Assrt、subssabbz を改善；非対応の subdivx プロバイダーを削除；SubX API キー連携を追加
    - [Fixes] Windows 非英語の後処理；アップグレード可能な字幕履歴ロジックのリファクタ；Titulky 429 スロットリング

    完全なリリースノート: https://github.com/morpheus65535/bazarr/releases/tag/v1.5.6
