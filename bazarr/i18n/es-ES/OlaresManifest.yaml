metadata:
  title: Bazarr
  description: Un gestor de subtítulos compañero de Sonarr y Radarr.
spec:
  fullDescription: |
    Bazarr es una aplicación compañera de Sonarr y Radarr. Gestiona y descarga subtítulos según tus requisitos. Defines tus preferencias por serie de TV o película y Bazarr se encarga de todo.

    Ten en cuenta que Bazarr no escanea el disco para detectar series y películas: solo se ocupa de las series y películas indexadas en Sonarr y Radarr.

    Funciones principales:
    - Compatibilidad con plataformas principales: Windows, Linux, macOS, Raspberry Pi, etc.
    - Añadir automáticamente nuevas series y episodios desde Sonarr
    - Añadir automáticamente nuevas películas desde Radarr
    - Configuración de idiomas de subtítulos por serie o película
    - Escanear tu biblioteca existente en busca de subtítulos internos y externos y descargar los que falten
    - Mantener historial de qué se descargó, de dónde y cuándo
    - Búsqueda manual para descargar subtítulos bajo demanda
    - Actualizar subtítulos descargados previamente cuando se encuentra uno mejor
    - Posibilidad de eliminar subtítulos externos del disco
    - Actualmente admite 184 idiomas de subtítulos con soporte para subtítulos forced/foreign (según proveedores)
    - Y una UI atractiva basada en Sonarr
  upgradeDescription: |
    Actualización de Bazarr a la versión 1.5.6 (2026-02-26)
    Cambios de configuración: cambiar ruta de montaje del directorio Olares y authlevel de la entrada.
    - Cambiar la ruta de montaje predeterminada del Home Directory de Olares a /olares/userdata/home
    - Añadir Olares External Directory y montaje en /olares/userdata/external
    - Cambiar la imagen del contenedor a linuxserver/bazarr
    - Nivel de auth de la entrada cambiado a internal

    Aspectos destacados de la actualización:
    - [Security] Ajuste de hostname en General settings para prevenir vulnerabilidades de hostname poisoning
    - [Performance] Cola de trabajos asíncrona y flujos de subida/descarga de subtítulos; se eliminó el monitoreo de progreso bloqueante para evitar congelar el frontend
    - [New Features] Actualización de biblioteca Plex tras cambios de subtítulos; detección de retardo de audio WhisperAI; proxy SubX para Subdivx Latam Spanish; soporte de stream de eventos de backup
    - [Providers] Mejoras en subdl, opensubtitlescom, Gestdown, Assrt, subssabbz; eliminado el proveedor subdivx no admitido; integración de clave API SubX
    - [Fixes] Postprocesado en Windows no inglés; refactor de la lógica de historial de subtítulos actualizables; throttling Titulky 429

    Notas de versión completas: https://github.com/morpheus65535/bazarr/releases/tag/v1.5.6
