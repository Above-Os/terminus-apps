apiVersion: apps/v1
kind: Deployment
metadata:
  name: context7
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: context7
spec:
  replicas: {{ .Values.workloads.context7.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: context7
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: context7
        bytetrade.io/terminal: context7
    spec:
      containers:
        - name: context7
          image: "docker.io/beclab/harveyff-context7:4.1.1"
          securityContext:
            runAsUser: 1000
          env:
            - name: MCP_TRANSPORT
              value: "http"
            - name: PORT
              value: "8080"
            {{- if .Values.olaresEnv.CONTEXT7_API_KEY }}
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: CONTEXT7_API_KEY
            {{- end }}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: context7
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: context7
spec:
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: context7
status:
  loadBalancer: {}
