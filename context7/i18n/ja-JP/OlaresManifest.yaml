metadata:
  title: Context7
  description: LLM と AI コードエディター向けの最新コードドキュメント
spec:
  upgradeDescription: |
    Context7 MCP サーバーを 2.1.4 から 4.1.1 に更新します。

    HTTP 配信はステートレスになり、通常のツール応答は JSON です。リサーチモードは廃止されました。

    Context7 コンテナに ctx7 0.5.12 CLI を同梱したため、起動時に CLI をダウンロードしません。
  fullDescription: |
    Context7 は、最新のバージョン固有ドキュメントとコード例を AI コーディングアシスタントへ直接届けます。古いコードや幻覚 API はもう不要です。

    **2 つのモードで動作:**
    - CLI + Skills — エージェントが CLI コマンドでドキュメントを取得するよう導くスキルをインストール（MCP 不要）ctx7
    - MCP — Context7 MCP サーバーを登録し、エージェントがドキュメントツールをネイティブに呼べるようにする

    **機能**
    - リアルタイムドキュメントアクセス: 数千のライブラリ／フレームワークの現行ドキュメントへ AI モデルがアクセス
    - 自動ライブラリ解決: ユーザークエリに基づき関連ドキュメントを自動検索・取得
    - 最新コンテンツ: 公式ソースから常に最新ドキュメントを提供
    - 簡単な統合: 追加設定なしのシンプルなセットアップ
    - シームレスな VS Code 統合: VS Code 組み込みの AI 機能と直接連携
