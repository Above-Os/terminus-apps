metadata:
  title: Context7
  description: Documentazione del codice aggiornata per LLM ed editor di codice AI
spec:
  upgradeDescription: |
    Aggiorna il server MCP Context7 dalla versione 2.1.4 alla 4.1.1.

    Il servizio HTTP è senza stato e le risposte ordinarie degli strumenti sono JSON. La modalità research è stata rimossa.

    Il container Context7 include la CLI ctx7 0.5.12, quindi l'avvio non la scarica più.
  fullDescription: |
    Context7 porta documentazione aggiornata e specifica di versione ed esempi di codice direttamente nel tuo assistente di coding AI. Niente più codice obsoleto o API inventate.

    **Due modalità:**
    - CLI + Skills — installa uno skill che guida l’agente a recuperare docs con comandi CLI (MCP non richiesto)ctx7
    - MCP — registra un server MCP Context7 così l’agente può chiamare nativamente gli strumenti di documentazione

    **Funzionalità**
    - Accesso alla documentazione in tempo reale: Fornisce ai modelli AI accesso alla documentazione attuale di migliaia di librerie e framework
    - Risoluzione automatica delle librerie: Trova e recupera automaticamente la documentazione rilevante in base alle query dell’utente
    - Contenuti aggiornati: Fornisce sempre la documentazione più recente da fonti ufficiali
    - Integrazione semplice: Setup semplice senza configurazione aggiuntiva
    - Integrazione fluida con VS Code: Funziona direttamente con le funzioni AI integrate di VS Code
