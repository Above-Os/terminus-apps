metadata:
  title: LightCraft
  description: 在浏览器中运行的 Lightroom 风格照片库和 raw 冲印工具
spec:
  fullDescription: |
    ## 概述
    LightCraft 是一款用 Rust 编写的开源照片库和无损 raw 冲印工具，
    目标是对标 Lightroom。本应用提供它的 WebAssembly 版本：导入、冲印和导出
    都在你的浏览器里完成，照片不会离开你的设备。

    网页版的照片库（目录、导入的照片和缩略图）保存在浏览器为本站点分配的存储里，
    浏览器有可能清除它。请另外保留原始照片，并定期使用“文件 > 备份图库”。
    导出会下载文件。

    ## Agent 接入（MCP）
    本应用还以 Streamable HTTP 方式运行 LightCraft 的无界面引擎，作为 MCP 服务。
    它的入口不显示在桌面上，可以在设置里找到，只能从局域网或 LarePass VPN 访问。
    Agent 只能读写 Home/LightCraft 目录：把照片（JPEG、PNG、TIFF、DNG 和相机 raw）
    放进去，让 agent 导入，再冲印和导出。每个 agent 会话都从空的照片库开始，
    结果请导出成文件（或 XMP 附属文件）保存。想在浏览器里继续处理 agent 的结果，
    请从 Files 下载后导入。

    ## 要求
    - 支持 WebGL2 的浏览器
    - 架构：amd64、arm64
