metadata:
  title: Mastodon
  description: セルフホストで世界中とつながるマイクロブログコミュニティ
spec:
  fullDescription: |
    Mastodon は ActivityPub に基づく無料のオープンソースソーシャルネットワークサーバーで、ユーザーは友人をフォローしたり、新しい人を見つけたりできます。

    Mastodon では、リンク、画像、テキスト、動画など、好きなものを投稿できます。すべての Mastodon サーバーは連合ネットワークとして相互運用可能です（あるサーバーのユーザーは、ActivityPub を実装した Mastodon 以外のソフトウェアを含め、別のサーバーのユーザーとシームレスに通信できます）。

    **機能**
    ベンダーロックインなし：準拠するあらゆるプラットフォームと完全に相互運用可能
    - Mastodon である必要はありません。ActivityPub を実装するものはすべてソーシャルネットワークの一部です。

    リアルタイムで時系列のタイムライン更新
    - フォローしている人の更新が WebSockets を通じて UI にリアルタイムで表示されます。全体の流れを表示する firehose ビューもあります。

    画像や短い動画などのメディア添付
    - 更新に添付された画像や WebM/MP4 動画をアップロードして表示できます。音声トラックのない動画は GIF のように扱われ、通常の動画は連続してループ再生されます。

    安全性とモデレーションのためのツール
    - Mastodon には非公開投稿、ロックされたアカウント、フレーズフィルタリング、ミュート、ブロックなど多様な機能と、報告・モデレーションシステムが含まれています。

    OAuth2 と分かりやすい REST API
    - Mastodon は OAuth2 プロバイダーとして機能するため、サードパーティアプリは REST API と Streaming API を利用できます。これにより、豊富な選択肢を持つアプリエコシステムが生まれます。
  upgradeDescription: |
    ストレージ：永続ボリュームを `appCache` から `appData` に移動しました。アップグレード後の初回起動時に、移行先が空の場合、initContainers が従来の appCache の内容を appData にコピーします（マーカー：`.migration_from_appcache_done`）。ロールバックできるよう、古い appCache データはそのまま残されます。

    従来の `sysVersion >= 1.12.3` による appCache パス分岐を削除しました。Olares の最小バージョンは 1.12.6 になりました。

    Redis と Elasticsearch の永続データを appCache から appData に移行しました。
