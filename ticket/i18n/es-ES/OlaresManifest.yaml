metadata:
  title: Ticket
  description: La aplicación oficial de Olares para enviar y seguir solicitudes de asistencia
spec:
  fullDescription: |
    Ticket es la aplicación oficial de asistencia de Olares. Comunica un problema desde tu dispositivo Olares, comparte registros e información de diagnóstico y consulta las respuestas del equipo de asistencia y el progreso de la solicitud en un solo lugar.

    **Funciones principales**

    - Crear tickets de asistencia para describir problemas con tu dispositivo Olares.
    - Recopilar y subir registros del sistema e información de diagnóstico para ayudar a investigar un problema.
    - Intercambiar mensajes con el equipo de asistencia de Olares y seguir el estado de los tickets.
    - Consultar tickets y conversaciones anteriores.

    También puedes acceder a Ticket a través de [Olares Space](https://space.olares.com/).
