metadata:
  title: Ticket
  description: 用于提交和跟踪支持请求的 Olares 官方应用
spec:
  fullDescription: |
    Ticket 是 Olares 官方支持应用。你可以直接从 Olares 设备提交问题、分享日志和诊断信息，并集中查看支持团队的回复和处理进度。

    **主要功能**

    - 创建支持工单，描述 Olares 设备遇到的问题。
    - 收集并上传系统日志和诊断信息，协助排查问题。
    - 与 Olares 支持团队交流并跟踪工单状态。
    - 查看历史工单和沟通记录。

    你也可以通过 [Olares Space](https://space.olares.com/) 访问 Ticket。
