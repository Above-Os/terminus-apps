metadata:
  description: Olares 官方客户服务客户端
  title: Ticket
spec:
  fullDescription: |
    Ticket 是 Olares 官方客户服务客户端。它允许用户从 Olares 设备收集和上传日志，提交问题，接收支持回复，并跟踪进度 — 所有这些都直接从他们的 Olares 设备中进行。

    **主要功能**
    - **提交包含设备诊断信息的支持工单** - 自动附加系统日志和诊断数据，帮助支持团队更快地解决问题。
    - **实时跟踪工单状态** - 无需离开设备即可随时了解您的请求的进度。
    - **与支持人员沟通** - 通过集成消息传递界面与 Olares 支持团队直接对话。
    - **查看工单历史** - 访问所有过去提交和交互的完整记录，便于参考。

    您还可以从 Olares Space 网页访问 Ticket：https://space.olares.com/
