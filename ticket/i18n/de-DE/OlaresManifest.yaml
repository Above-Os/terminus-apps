metadata:
  title: Ticket
  description: Die offizielle Olares-App zum Einreichen und Verfolgen von Supportanfragen
spec:
  fullDescription: |
    Ticket ist die offizielle Support-App von Olares. Melden Sie ein Problem direkt von Ihrem Olares-Gerät, teilen Sie Protokolle und Diagnoseinformationen und verfolgen Sie die Antworten des Supportteams sowie den Bearbeitungsfortschritt an einem Ort.

    **Hauptfunktionen**

    - Supporttickets erstellen, um Probleme mit Ihrem Olares-Gerät zu beschreiben.
    - Systemprotokolle und Diagnoseinformationen sammeln und hochladen, um die Untersuchung eines Problems zu unterstützen.
    - Nachrichten mit dem Olares-Supportteam austauschen und den Ticketstatus verfolgen.
    - Frühere Tickets und Gespräche einsehen.

    Sie können Ticket auch über [Olares Space](https://space.olares.com/) aufrufen.
