metadata:
  title: Ticket
  description: L’app ufficiale di Olares per inviare e seguire le richieste di assistenza
spec:
  fullDescription: |
    Ticket è l’app ufficiale di assistenza di Olares. Segnala un problema dal tuo dispositivo Olares, condividi log e informazioni diagnostiche e segui le risposte del team di assistenza e l’avanzamento della richiesta in un unico posto.

    **Funzionalità principali**

    - Creare ticket di assistenza per descrivere i problemi del tuo dispositivo Olares.
    - Raccogliere e caricare log di sistema e informazioni diagnostiche per facilitare l’analisi di un problema.
    - Scambiare messaggi con il team di assistenza Olares e seguire lo stato dei ticket.
    - Consultare i ticket e le conversazioni precedenti.

    Puoi accedere a Ticket anche tramite [Olares Space](https://space.olares.com/).
