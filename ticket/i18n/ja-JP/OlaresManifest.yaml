metadata:
  title: Ticket
  description: サポートへの問い合わせの送信と状況確認ができるOlares公式アプリ
spec:
  fullDescription: |
    TicketはOlares公式のサポートアプリです。Olaresデバイスから問題を報告し、ログや診断情報を共有できます。サポートチームからの返信と対応状況をひとつの場所で確認できます。

    **主な機能**

    - サポートチケットを作成し、Olaresデバイスで発生した問題を説明できます。
    - 問題の調査に役立つシステムログや診断情報を収集してアップロードできます。
    - Olaresサポートチームとメッセージをやり取りし、チケットの状況を確認できます。
    - 過去のチケットや会話を確認できます。

    [Olares Space](https://space.olares.com/)からもTicketにアクセスできます。
