metadata:
  title: Ticket
  description: L’application officielle Olares pour soumettre et suivre les demandes d’assistance
spec:
  fullDescription: |
    Ticket est l’application officielle d’assistance d’Olares. Signalez un problème depuis votre appareil Olares, partagez des journaux et des informations de diagnostic, puis suivez les réponses de l’équipe d’assistance et l’avancement de votre demande au même endroit.

    **Fonctionnalités principales**

    - Créer des tickets d’assistance pour décrire les problèmes rencontrés avec votre appareil Olares.
    - Collecter et envoyer des journaux système et des informations de diagnostic pour faciliter l’analyse d’un problème.
    - Échanger des messages avec l’équipe d’assistance Olares et suivre l’état des tickets.
    - Consulter les anciens tickets et les conversations.

    Vous pouvez également accéder à Ticket via [Olares Space](https://space.olares.com/).
