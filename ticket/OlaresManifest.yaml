olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  ticket-bff: 1
  ticket: 1
metadata:
  name: ticket
  description: The official Olares app for submitting and tracking support requests
  icon: https://app.cdn.olares.com/appstore/ticket/icon.png
  appid: ticket
  version: '0.1.30'
  title: Ticket
  categories:
    - Utilities_v112
    - workspace

permission:
  appData: true
  appCache: true
  userData:
    - Home
spec:
  versionName: '0.0.30'
  fullDescription: |
    Ticket is the official Olares support app. Submit an issue from your Olares device, share logs and diagnostic information, and follow the support team's replies and progress in one place.

    **Key features**

    - Create support tickets to describe problems with your Olares device.
    - Collect and upload system logs and diagnostic information to help investigate an issue.
    - Exchange messages with the Olares support team and track ticket status.
    - Review previous tickets and conversations.

    You can also access Ticket through [Olares Space](https://space.olares.com/).

  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredMemory: 512Mi
  limitedMemory: 1Gi
  requiredDisk: 128Mi
  limitedDisk: 2Gi
  requiredCpu: 0.5
  limitedCpu: 2
  supportArch:
    - amd64
    - arm64
options:
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
entrances:
  - name: ticket
    port: 8080
    host: ticket-web-svc
    title: Ticket
    icon: https://app.cdn.olares.com/appstore/ticket/icon.png
    openMethod: window
