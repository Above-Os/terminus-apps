metadata:
  description: "Systran faster-whisper-large-v3 for offline STT (review submission)."
  title: Faster-Whisper Large V3

spec:
  fullDescription: |
    **Model Overview**
    Systran faster-whisper-large-v3 for offline STT (review submission).

    **Preset Configuration**
    - Model: `Systran/faster-whisper-large-v3`
    - Source: `hf://Systran/faster-whisper-large-v3`
    - Capabilities: `stt`
    - Required GPU memory: `6Gi`
    - Engine: Faster-Whisper (CTranslate2)

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
