metadata:
  description: 用于多语言音频转写的语音识别模型
  title: Faster-Whisper Large V3

spec:
  upgradeDescription: |
    v1.0.19: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    Faster-Whisper Large V3 可将音频录音中的语音转换为文本。它使用 Systran 基于 CTranslate2 转换的 OpenAI Whisper Large V3 模型，在本地完成转写。

    **主要功能**
    - 转写多种语言的录音。
    - 自动检测音频中的语言。
    - 为转写片段添加时间戳。
    - 向兼容的 Olares 应用提供转写能力。

    需要配备至少 `6Gi` 显存的兼容 NVIDIA GPU。
