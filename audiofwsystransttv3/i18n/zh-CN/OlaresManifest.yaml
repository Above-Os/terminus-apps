metadata:
  description: "Systran faster-whisper-large-v3 for offline STT."
  title: Faster-Whisper Large V3

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Systran faster-whisper-large-v3 for offline STT.

    **配置**
    - 模型：`Systran/faster-whisper-large-v3`
    - 来源：`hf://Systran/faster-whisper-large-v3`
    - 能力：`stt`
    - GPU 显存：`6Gi`
    - 引擎：Faster-Whisper (CTranslate2)

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
