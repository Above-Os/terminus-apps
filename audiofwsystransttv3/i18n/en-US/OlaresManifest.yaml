metadata:
  description: A speech recognition model for multilingual audio transcription
  title: Faster-Whisper Large V3

spec:
  upgradeDescription: |
    v1.0.19: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.
  fullDescription: |
    Faster-Whisper Large V3 converts speech in an audio recording into written text. It uses Systran's CTranslate2 conversion of OpenAI Whisper Large V3 for local transcription.

    **Key features**
    - Transcribe recorded speech in multiple languages.
    - Detect the spoken language automatically.
    - Add timestamps to transcription segments.
    - Make transcription available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `6Gi` of GPU memory is required.
