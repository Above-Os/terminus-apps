metadata:
  description: Un modèle de reconnaissance vocale pour transcrire des enregistrements multilingues
  title: Faster-Whisper Large V3

spec:
  upgradeDescription: |
    v1.0.19: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    Faster-Whisper Large V3 convertit la parole d'un enregistrement audio en texte. Il utilise la conversion CTranslate2 d'OpenAI Whisper Large V3 fournie par Systran pour effectuer la transcription en local.

    **Fonctionnalités principales**
    - Transcrire des enregistrements dans plusieurs langues.
    - Détecter automatiquement la langue parlée.
    - Ajouter des horodatages aux segments transcrits.
    - Mettre la transcription à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `6Gi` de mémoire vidéo est requis.
