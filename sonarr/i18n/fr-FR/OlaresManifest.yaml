metadata:
  title: Sonarr
  description: PVR intelligent pour utilisateurs de newsgroups et BitTorrent
spec:
  fullDescription: |
    Sonarr est un PVR pour utilisateurs Usenet et BitTorrent. Il peut surveiller plusieurs flux RSS pour les nouveaux épisodes de vos séries préférées et les récupère, trie et renomme. Il peut aussi être configuré pour mettre à niveau automatiquement la qualité des fichiers déjà téléchargés lorsqu'un format de meilleure qualité devient disponible.

    **Fonctionnalités :**
    - Calendrier : voyez tous vos prochains épisodes en un seul endroit.
    - Recherche manuelle : trouvez tous les releases, choisissez celui que vous voulez et envoyez-le à votre client de téléchargement.
    - Gestion automatique des téléchargements échoués : releases protégés par mot de passe, blocs de réparation manquants ou toute autre raison — Sonarr bloque automatiquement le release et en essaie un autre jusqu'à en trouver un qui fonctionne.
  upgradeDescription: |
    Mise à jour de Sonarr vers la version 4.0.18 (2026-06-24)
    Changements de configuration : chemin de montage du répertoire Olares et authLevel de l'entrée.
    - Chemin de montage par défaut du Olares Home Directory changé en /olares/userdata/home
    - Image du conteneur remplacée par linuxserver/sonarr
    - Niveau d'authentification de l'entrée changé en internal

    Points forts :
    - [qBittorrent] Backport des correctifs qBittorrent ; réutilisation des cookies d'authentification pour les appels API qBittorrent
    - [Fixes] Améliorations de la connexion et de l'intégration du client de téléchargement pour qBittorrent 5.x

    Notes complètes : https://github.com/Sonarr/Sonarr/releases/tag/v4.0.18.2971
