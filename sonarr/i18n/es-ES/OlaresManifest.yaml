metadata:
  title: Sonarr
  description: PVR inteligente para usuarios de newsgroups y BitTorrent
spec:
  fullDescription: |
    Sonarr es un PVR para usuarios de Usenet y BitTorrent. Puede supervisar varios feeds RSS en busca de nuevos episodios de tus series favoritas y los descarga, ordena y renombra. También puede configurarse para actualizar automáticamente la calidad de archivos ya descargados cuando haya un formato de mejor calidad disponible.

    **Funciones:**
    - Calendario: ve todos tus próximos episodios en un solo lugar.
    - Búsqueda manual: encuentra todos los releases, elige el que quieras y envíalo a tu cliente de descarga.
    - Gestión automática de descargas fallidas: releases con contraseña, bloques de reparación faltantes u otras causas — Sonarr bloquea el release automáticamente e intenta otro hasta encontrar uno que funcione.
  upgradeDescription: |
    Actualización de Sonarr a la versión 4.0.18 (2026-06-24)
    Cambios de configuración: ruta de montaje del directorio Olares y authLevel de la entrada.
    - Ruta de montaje predeterminada del Olares Home Directory cambiada a /olares/userdata/home
    - Imagen del contenedor cambiada a linuxserver/sonarr
    - Nivel de autenticación de la entrada cambiado a internal

    Destacados de la actualización:
    - [qBittorrent] Backport de correcciones de qBittorrent; reutilización de cookies de autenticación para llamadas a la API de qBittorrent
    - [Fixes] Mejoras de inicio de sesión e integración del cliente de descarga para qBittorrent 5.x

    Notas completas: https://github.com/Sonarr/Sonarr/releases/tag/v4.0.18.2971
