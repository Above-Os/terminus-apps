metadata:
  title: Sonarr
  description: ニュースグループおよび BitTorrent ユーザー向けのスマート PVR。
spec:
  fullDescription: |
    Sonarr は Usenet および BitTorrent ユーザー向けの PVR です。お気に入り番組の新エピソードを複数の RSS フィードで監視し、取得・整理・リネームします。より良い品質フォーマットが利用可能になったとき、すでにダウンロード済みのファイルの品質を自動アップグレードするよう設定することもできます。

    **機能:**
    - カレンダー: 今後のエピソードを一箇所で確認
    - 手動検索: すべてのリリースを見つけ、希望のものをダウンロードクライアントへ送信
    - 失敗ダウンロードの自動処理: パスワード保護、修復ブロック欠落など — Sonarr は自動でそのリリースをブロックし、成功するまで別のものを試します
  upgradeDescription: |
    Sonarr をバージョン 4.0.18（2026-06-24）にアップグレード
    設定変更: Olares ディレクトリのマウントパスと entrance の authLevel。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - コンテナイメージを linuxserver/sonarr に切り替え
    - Entrance の認証レベルを internal に変更

    ハイライト:
    - [qBittorrent] qBittorrent 修正のバックポート；API 呼び出しで認証クッキーを再利用
    - [Fixes] qBittorrent 5.x 向けログインおよびダウンロードクライアント連携の改善

    リリースノート全文: https://github.com/Sonarr/Sonarr/releases/tag/v4.0.18.2971
