metadata:
  title: Sonarr
  description: Intelligenter PVR für Newsgroup- und BitTorrent-Nutzer.
spec:
  fullDescription: |
    Sonarr ist ein PVR für Usenet- und BitTorrent-Nutzer. Es überwacht mehrere RSS-Feeds auf neue Episoden deiner Lieblingsserien und lädt, sortiert und benennt sie. Es kann auch so konfiguriert werden, dass bereits heruntergeladene Dateien automatisch auf bessere Qualität aktualisiert werden, sobald ein besseres Format verfügbar ist.

    **Funktionen:**
    - Kalender: Sieh alle kommenden Episoden an einem Ort.
    - Manuelle Suche: Finde alle Releases, wähle das gewünschte aus und sende es direkt an deinen Download-Client.
    - Automatische Behandlung fehlgeschlagener Downloads: Passwortgeschützte Releases, fehlende Reparaturblöcke oder andere Gründe — Sonarr blockiert das Release automatisch und versucht ein anderes, bis eines funktioniert.
  upgradeDescription: |
    Upgrade von Sonarr auf Version 4.0.18 (2026-06-24)
    Konfigurationsänderungen: Olares-Verzeichnis-Mountpfad und Entrance-authLevel angepasst.
    - Standard-Mountpfad des Olares Home Directory auf /olares/userdata/home geändert
    - Container-Image auf linuxserver/sonarr umgestellt
    - Entrance-authLevel auf internal geändert

    Upgrade-Highlights:
    - [qBittorrent] Backport der qBittorrent-Fixes; Authentifizierungs-Cookies für qBittorrent-API-Aufrufe wiederverwenden
    - [Fixes] Verbesserungen bei Login und Download-Client-Integration für qBittorrent 5.x

    Vollständige Release Notes: https://github.com/Sonarr/Sonarr/releases/tag/v4.0.18.2971
