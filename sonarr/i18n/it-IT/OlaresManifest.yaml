metadata:
  title: Sonarr
  description: PVR intelligente per utenti newsgroup e BitTorrent.
spec:
  fullDescription: |
    Sonarr è un PVR per utenti Usenet e BitTorrent. Può monitorare più feed RSS per nuovi episodi delle tue serie preferite e li scarica, ordina e rinomina. Può anche essere configurato per aggiornare automaticamente la qualità dei file già scaricati quando diventa disponibile un formato di qualità migliore.

    **Funzionalità:**
    - Calendario: vedi tutti i prossimi episodi in un unico posto.
    - Ricerca manuale: trova tutti i release, scegli quello che vuoi e invialo al client di download.
    - Gestione automatica dei download falliti: release protetti da password, blocchi di riparazione mancanti o altri motivi — Sonarr blocca automaticamente il release e ne prova un altro finché non ne trova uno funzionante.
  upgradeDescription: |
    Aggiornamento di Sonarr alla versione 4.0.18 (2026-06-24)
    Modifiche di configurazione: percorso di mount della directory Olares e authLevel dell'ingresso.
    - Percorso di mount predefinito di Olares Home Directory cambiato in /olares/userdata/home
    - Immagine del container cambiata in linuxserver/sonarr
    - Livello di autenticazione dell'ingresso cambiato in internal

    Punti salienti:
    - [qBittorrent] Backport delle correzioni qBittorrent; riutilizzo dei cookie di autenticazione per le chiamate API qBittorrent
    - [Fixes] Miglioramenti di login e integrazione del client di download per qBittorrent 5.x

    Note complete: https://github.com/Sonarr/Sonarr/releases/tag/v4.0.18.2971
