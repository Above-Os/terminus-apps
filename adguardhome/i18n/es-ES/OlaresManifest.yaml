metadata:
  title: AdGuard Home
  description: Servidor DNS para bloquear anuncios y rastreadores en toda la red
spec:
  fullDescription: |
    AdGuard Home es un software para bloquear anuncios y rastreo en toda la red. Tras configurarlo, protege TODOS los dispositivos de tu hogar y no necesitas software del lado del cliente.

    Funciona como un servidor DNS que redirige los dominios de rastreo a un “agujero negro”, impidiendo que tus dispositivos se conecten a esos servidores. Se basa en el software que usamos en los servidores DNS públicos de AdGuard, y ambos comparten gran parte del código.

    **Funciones**
    Bloquea anuncios en todas partes
    - Bloquea anuncios a nivel de red y protege navegadores y apps. Elige entre docenas de filtros para quitar anuncios de sitios web, reproductores de vídeo y juegos
    
    Protege tu privacidad
    - Protege tu información personal y otros datos sensibles de rastreadores y sistemas de analítica que intentan robar tus datos mientras navegas
    
    Protege a tus hijos
    - Protege a tus hijos de contenido inadecuado en línea con el Control parental y activa la Búsqueda segura en sus navegadores
    
    Protege toda tu red
    - Instala AdGuard Home en tu router y protege automáticamente todos los dispositivos de la red, incluidos IoT. No se necesitan apps cliente individuales
