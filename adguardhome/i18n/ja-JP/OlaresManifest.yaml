metadata:
  title: AdGuard Home
  description: ネットワーク全体で広告とトラッカーを遮断する DNS サーバー
spec:
  fullDescription: |
    AdGuard Home は、広告とトラッキングをネットワーク全体でブロックするソフトウェアです。セットアップ後は自宅のすべてのデバイスをカバーし、クライアント側のソフトウェアは不要です。

    トラッキングドメインを「ブラックホール」へ転送する DNS サーバーとして動作し、デバイスがそれらのサーバーへ接続するのを防ぎます。公開 AdGuard DNS サーバーで使っているソフトウェアを基にしており、多くのコードを共有しています。

    **機能**
    どこでも広告をブロック
    - ネットワークレベルで広告をブロックし、ブラウザとアプリの両方を保護。数十の広告フィルターから選び、ウェブサイト、動画プレーヤー、ゲームから広告を除去
    
    プライバシーを守る
    - Web 閲覧中にデータを盗もうとするオンライントラッカーや分析システムから、個人情報などの機微情報を保護
    
    子どもを守る
    - ペアレンタルコントロールで不適切なオンラインコンテンツから子どもを守り、ブラウザでセーフサーチを強制
    
    ネットワーク全体を保護
    - ルーターに AdGuard Home をインストールし、IoT を含むネットワーク上のすべてのデバイスを自動保護。個別のクライアントアプリは不要
