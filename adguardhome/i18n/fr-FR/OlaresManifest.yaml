metadata:
  title: AdGuard Home
  description: Serveur DNS bloquant publicités et trackers sur tout le réseau
spec:
  fullDescription: |
    AdGuard Home est un logiciel de blocage des publicités et du suivi à l’échelle du réseau. Une fois configuré, il protège TOUS vos appareils domestiques, sans logiciel côté client.

    Il fonctionne comme un serveur DNS qui redirige les domaines de suivi vers un « trou noir », empêchant vos appareils de se connecter à ces serveurs. Il repose sur le logiciel de nos serveurs DNS AdGuard publics, et les deux partagent une grande partie du code.

    **Fonctionnalités**
    Bloquer les publicités partout
    - Bloquez les publicités au niveau du réseau et protégez navigateurs et applications. Choisissez parmi des dizaines de filtres pour retirer les pubs des sites, lecteurs vidéo et jeux
    
    Protéger votre vie privée
    - Protégez vos informations personnelles et autres données sensibles des trackers et systèmes d’analyse qui tentent de voler vos données pendant la navigation
    
    Protéger vos enfants
    - Protégez vos enfants des contenus en ligne inappropriés grâce au Contrôle parental et imposez la Recherche sécurisée dans leurs navigateurs
    
    Protéger tout votre réseau
    - Installez AdGuard Home sur votre routeur et protégez automatiquement tous les appareils du réseau, y compris les IoT. Aucune application client individuelle requise
