metadata:
  title: AdGuard Home
  description: Netzwerkweiter DNS-Server zum Blockieren von Werbung und Trackern
spec:
  fullDescription: |
    AdGuard Home ist eine netzwerkweite Software zum Blockieren von Werbung und Tracking. Nach der Einrichtung schützt sie ALLE Ihre Geräte zu Hause — ohne clientseitige Software.

    Sie arbeitet als DNS-Server, der Tracking-Domains in ein „schwarzes Loch“ umleitet und so verhindert, dass Ihre Geräte sich mit diesen Servern verbinden. Sie basiert auf der Software unserer öffentlichen AdGuard-DNS-Server und teilt viel Code mit ihnen.

    **Funktionen**
    Werbung überall blockieren
    - Blockieren Sie Werbung auf Netzwerkebene und schützen Sie Browser und Apps. Wählen Sie aus Dutzenden von Werbefiltern, um Werbung von Websites, Videoplayern und Spielen zu entfernen
    
    Ihre Privatsphäre schützen
    - Schützen Sie persönliche und andere sensible Informationen vor Online-Trackern und Analysesystemen, die beim Surfen Ihre Daten stehlen wollen
    
    Ihre Kinder schützen
    - Schützen Sie Kinder vor ungeeignetem Online-Inhalt mit der Kindersicherung und erzwingen Sie die sichere Suche in ihren Browsern
    
    Ihr gesamtes Netzwerk schützen
    - Installieren Sie AdGuard Home auf Ihrem Router und schützen Sie automatisch alle Geräte im Netzwerk — einschließlich IoT. Keine einzelnen Client-Apps nötig
