metadata:
  title: AdGuard Home
  description: Server DNS per bloccare annunci e tracker a livello di rete
spec:
  fullDescription: |
    AdGuard Home è un software per bloccare annunci e tracciamento a livello di rete. Dopo la configurazione, protegge TUTTI i dispositivi di casa, senza bisogno di software lato client.

    Funziona come un server DNS che reindirizza i domini di tracking verso un “buco nero”, impedendo ai dispositivi di connettersi a quei server. Si basa sul software usato per i server DNS pubblici AdGuard e condivide gran parte del codice.

    **Funzionalità**
    Blocca gli annunci ovunque
    - Blocca gli annunci a livello di rete e proteggi browser e app. Scegli tra dozzine di filtri per rimuovere gli annunci da siti, lettori video e giochi
    
    Tutela la privacy
    - Proteggi informazioni personali e altri dati sensibili da tracker e sistemi di analytics che cercano di rubare i tuoi dati mentre navighi
    
    Proteggi i bambini
    - Proteggi i bambini da contenuti online inappropriati con il Controllo genitori e attiva la Ricerca sicura nei loro browser
    
    Proteggi l’intera rete
    - Installa AdGuard Home sul router e proteggi automaticamente tutti i dispositivi in rete, inclusi quelli IoT. Nessuna app client individuale richiesta
