metadata:
  title: Firefox
  description: Navigateur Firefox
spec:
  fullDescription: |
    Le navigateur Firefox, également connu sous le nom de Mozilla Firefox ou simplement Firefox, est un navigateur web gratuit et open source développé par la Mozilla Foundation et sa filiale, la Mozilla Corporation. Firefox utilise le moteur de rendu Gecko pour afficher les pages web, qui implémente les standards web actuels et anticipés.

  upgradeDescription: |
    - Mise à niveau de Firefox de 151.0.1 vers 160.0 (image LinuxServer `1160.0build1-1xtradeb1.2404.1-ls136`)
    - Suppression du NodePort 30002 inutilisé ; le service n'est plus accessible qu'à l'intérieur du cluster
