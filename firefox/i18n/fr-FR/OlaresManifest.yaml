metadata:
  title: Firefox
  description: Navigateur Firefox
spec:
  fullDescription: |
    Le navigateur Firefox, également connu sous le nom de Mozilla Firefox ou simplement Firefox, est un navigateur web gratuit et open source développé par la Mozilla Foundation et sa filiale, la Mozilla Corporation. Firefox utilise le moteur de rendu Gecko pour afficher les pages web, qui implémente les standards web actuels et anticipés.

  upgradeDescription: |
    Stockage : le `/config` durable a été déplacé de `appCache/firefox` vers `appData/firefox`. Au premier démarrage après la mise à niveau, un initContainer copie les données héritées vers `appData/firefox` lorsque la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données appCache sont conservées pour un éventuel rollback.

    - Mise à niveau de LinuxServer Firefox vers la version de fin mai 2026
