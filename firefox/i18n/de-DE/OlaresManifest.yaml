metadata:
  title: Firefox
  description: Firefox-Browser
spec:
  fullDescription: |
    Der Firefox-Browser, auch bekannt als Mozilla Firefox oder einfach Firefox, ist ein kostenloser und quelloffener Webbrowser, der von der Mozilla Foundation und ihrer Tochtergesellschaft, der Mozilla Corporation, entwickelt wird. Firefox verwendet die Gecko-Layout-Engine zum Rendern von Webseiten und implementiert aktuelle sowie erwartete Webstandards.

  upgradeDescription: |
    Speicher: dauerhaftes `/config` wurde von `appCache/firefox` nach `appData/firefox` verschoben. Beim ersten Start nach dem Upgrade kopiert ein initContainer Legacy-Daten nach `appData/firefox`, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Alte appCache-Daten bleiben für ein Rollback erhalten.

    - Upgrade von LinuxServer Firefox auf die Veröffentlichung Ende Mai 2026
