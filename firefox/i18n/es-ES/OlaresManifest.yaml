metadata:
  title: Firefox
  description: Navegador Firefox
spec:
  fullDescription: |
    El navegador Firefox, también conocido como Mozilla Firefox o simplemente Firefox, es un navegador web gratuito y de código abierto desarrollado por la Mozilla Foundation y su subsidiaria, la Mozilla Corporation. Firefox utiliza el motor de diseño Gecko para renderizar páginas web, implementando estándares web actuales y previstos.

  upgradeDescription: |
    Almacenamiento: el `/config` persistente se movió de `appCache/firefox` a `appData/firefox`. En el primer inicio tras la actualización, un initContainer copia los datos antiguos a `appData/firefox` cuando el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos de appCache se conservan para rollback.

    - Actualización de LinuxServer Firefox a la versión de finales de mayo de 2026
