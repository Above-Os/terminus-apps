metadata:
  title: Firefox
  description: Navegador Firefox
spec:
  fullDescription: |
    El navegador Firefox, también conocido como Mozilla Firefox o simplemente Firefox, es un navegador web gratuito y de código abierto desarrollado por la Mozilla Foundation y su subsidiaria, la Mozilla Corporation. Firefox utiliza el motor de diseño Gecko para renderizar páginas web, implementando estándares web actuales y previstos.

  upgradeDescription: |
    - Actualización de Firefox de 151.0.1 a 160.0 (imagen de LinuxServer `1160.0build1-1xtradeb1.2404.1-ls136`)
    - Se elimina el NodePort 30002 sin uso; el servicio ahora solo es accesible dentro del clúster
