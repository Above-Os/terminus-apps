metadata:
  title: Firefox
  description: Firefox ブラウザ
spec:
  fullDescription: |
    Firefox ブラウザ（Mozilla Firefox、または単に Firefox とも呼ばれる）は、Mozilla Foundation とその子会社 Mozilla Corporation が開発する無料のオープンソース Web ブラウザです。Firefox は Gecko レイアウトエンジンを使用して Web ページを描画し、現行および今後の Web 標準を実装しています。

  upgradeDescription: |
    ストレージ：永続的な `/config` を `appCache/firefox` から `appData/firefox` へ移動しました。アップグレード後の初回起動時、宛先が空の場合に initContainer がレガシーデータを `appData/firefox` へコピーします（マーカー：`.migration_from_appcache_done`）。ロールバック用に古い appCache データはそのまま残します。

    - LinuxServer Firefox を 2026 年 5 月下旬リリースへアップグレード
