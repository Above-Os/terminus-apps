metadata:
  title: Firefox
  description: Browser Firefox
spec:
  fullDescription: |
    Il browser Firefox, noto anche come Mozilla Firefox o semplicemente Firefox, è un browser web gratuito e open-source sviluppato dalla Mozilla Foundation e dalla sua sussidiaria, la Mozilla Corporation. Firefox utilizza il motore di layout Gecko per il rendering delle pagine web, implementando gli standard web attuali e previsti.

  upgradeDescription: |
    - Upgrade di Firefox da 151.0.1 a 160.0 (immagine LinuxServer `1160.0build1-1xtradeb1.2404.1-ls136`)
