metadata:
  title: Firefox
  description: Browser Firefox
spec:
  fullDescription: |
    Il browser Firefox, noto anche come Mozilla Firefox o semplicemente Firefox, è un browser web gratuito e open-source sviluppato dalla Mozilla Foundation e dalla sua sussidiaria, la Mozilla Corporation. Firefox utilizza il motore di layout Gecko per il rendering delle pagine web, implementando gli standard web attuali e previsti.

  upgradeDescription: |
    Archiviazione: il `/config` durevole è stato spostato da `appCache/firefox` a `appData/firefox`. Al primo avvio dopo l'upgrade, un initContainer copia i dati legacy in `appData/firefox` quando la destinazione è vuota (marker: `.migration_from_appcache_done`). I vecchi dati appCache restano intatti per il rollback.

    - Upgrade di LinuxServer Firefox alla release di fine maggio 2026
