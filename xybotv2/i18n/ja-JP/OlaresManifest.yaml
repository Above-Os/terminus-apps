metadata:
  title: XYBotV2
  description: 多機能な WeChat ボットフレームワーク
spec:
  fullDescription: |
    XYBot V2 は多彩なインタラクティブ機能とゲームプレイを備えた多機能 WeChat ボットフレームワークです。

    **デフォルト管理者アカウント／パスワード**
    アカウント: admin
    パスワード: admin123
    アカウントのパスワードは速やかに変更してください

    **注意**
    設定を変更したあと、反映にはコンテナの再起動が必要です

    **主な機能**
    *基本機能*
    - AI チャット – テキスト・画像・音声などのマルチモーダル対話
    - デイリーニュース – 毎日のニュースを自動プッシュ
    - 曲リクエストシステム – オンラインでの曲リクエスト
    - 天気照会 – 全国の天気を照会
    - ゲーム機能 – 五目並べ、War Thunder プレイヤー照会など

    *ポイントシステム*
    - デイリーサインイン – 連続サインイン報酬
    - 抽選システム – 複数の抽選プレイ
    - レッドパケットシステム – グループでポイントのレッドパケットを送る
    - ポイント取引 – ユーザー間のポイント送金
    - ポイントランキング – ポイントランキングを表示

    *管理機能*
    - プラグイン管理 – プラグインの動的ロード／アンロード
    - ホワイトリスト管理 – ロボット利用権限を制御
    - ポイント管理 – 管理者がユーザーポイントを調整
    - サインインリセット – 全ユーザーのサインイン状態をリセット

    プラグインシステム
    *XYBot V2 はプラグイン設計を採用し、すべての機能をプラグインとして実装しています。主なプラグイン:*
    - AdminPoint - ポイント管理
    - AdminSignInReset - サインインリセット
    - AdminWhitelist - ホワイトリスト管理
    - Ai - AI チャット
    - BotStatus - ロボット状態
    - GetContact - アドレス帳取得
    - GetWeather - 天気照会
    - Gomoku - 五目並べゲーム
    - GoodMorning - おはよう挨拶
    - Leaderboard - ポイントランキング
    - LuckyDraw - 抽選
    - Menu - メニューシステム
    - Music - 曲リクエストシステム
    - News - ニュースプッシュ
    - PointTrade - ポイント取引
    - QueryPoint - ポイント照会
    - RandomMember - ランダムグループメンバー
    - RandomPicture - ランダム画像
    - RedPacket - レッドパケットシステム
    - SignIn - デイリーサインイン
    - Warthunder - War Thunder 照会
