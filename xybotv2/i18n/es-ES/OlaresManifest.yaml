metadata:
  title: XYBotV2
  description: Framework de bot de WeChat con muchas funciones
spec:
  fullDescription: |
    XYBot V2 es un framework de bot de WeChat rico en funciones que admite diversas interacciones y juegos.

    **Cuenta y contraseña de administrador predeterminadas**
    Cuenta: admin
    Contraseña: admin123
    Cambia la contraseña de la cuenta a tiempo

    **Nota**
    Reinicia el contenedor tras modificar la configuración para que los cambios surtan efecto

    **Funciones principales**
    *Funciones básicas*
    - Chat con IA – Interactúa con texto, imágenes y voz
    - Noticias diarias – Envío automático de noticias diarias
    - Sistema de pedido de canciones – Pedido de canciones en línea
    - Consulta del tiempo – Consulta el tiempo en todo el país
    - Funciones de juego – Gobang, consulta de jugadores de War Thunder, etc.

    *Sistema de puntos*
    - Check-in diario – Recompensas por check-in continuo
    - Sistema de lotería – Varios modos de lotería
    - Sistema de sobres rojos – Envía sobres de puntos en el grupo
    - Comercio de puntos – Transferencia de puntos entre usuarios
    - Ranking de puntos – Ver el ranking de puntos

    *Funciones de administración*
    - Gestión de plugins – Carga/descarga dinámica de plugins
    - Gestión de lista blanca – Controlar permisos de uso del robot
    - Gestión de puntos – Los administradores pueden ajustar puntos de usuarios
    - Reinicio de check-in – Reiniciar el estado de check-in de todos los usuarios

    Sistema de plugins
    *XYBot V2 adopta un diseño por plugins; todas las funciones se implementan como plugins. Los plugins principales incluyen:*
    - AdminPoint - gestión de puntos
    - AdminSignInReset - reinicio de check-in
    - AdminWhitelist - gestión de lista blanca
    - Ai - chat con IA
    - BotStatus - estado del robot
    - GetContact - obtener agenda
    - GetWeather - consulta del tiempo
    - Gomoku - juego Gobang
    - GoodMorning - saludos de buenos días
    - Leaderboard - ranking de puntos
    - LuckyDraw - sorteo
    - Menu - sistema de menú
    - Music - sistema de pedido de canciones
    - News - envío de noticias
    - PointTrade - comercio de puntos
    - QueryPoint - consulta de puntos
    - RandomMember - miembros aleatorios del grupo
    - RandomPicture - imágenes aleatorias
    - RedPacket - sistema de sobres rojos
    - SignIn - check-in diario
    - Warthunder - consulta de War Thunder
