metadata:
  title: XYBotV2
  description: Funktionsreicher WeChat-Bot-Framework
spec:
  fullDescription: |
    XYBot V2 ist ein funktionsreiches WeChat-Bot-Framework mit vielfältigen interaktiven Funktionen und Spielen.

    **Standard-Administrator-Konto/Passwort**
    Konto: admin
    Passwort: admin123
    Bitte ändern Sie Ihr Kontopasswort rechtzeitig

    **Hinweis**
    Bitte starten Sie den Container nach Änderungen an der Konfiguration neu, damit die Änderungen wirksam werden

    **Hauptfunktionen**
    *Grundfunktionen*
    - KI-Chat – Unterstützt multimodale Interaktionen wie Text, Bilder und Sprache
    - Tägliche Nachrichten – Automatischer Push täglicher Nachrichten
    - Song-Bestellsystem – Online-Songbestellung
    - Wetterabfrage – Wetter landesweit abfragen
    - Spielfunktionen – Gobang, War-Thunder-Spielerabfrage usw.

    *Punktesystem*
    - Tägliches Einchecken – Belohnungen für kontinuierliches Einchecken
    - Lotteriesystem – Mehrere Lotterie-Spielarten
    - Rote-Umschläge-System – Punkte-Rote-Umschläge in der Gruppe senden
    - Punktehandel – Punkteübertragung zwischen Benutzern
    - Punkte-Rangliste – Punkterangliste anzeigen

    *Verwaltungsfunktionen*
    - Plugin-Verwaltung – Dynamisches Laden/Entladen von Plugins
    - Whitelist-Verwaltung – Roboternutzungsrechte steuern
    - Punkteverwaltung – Administratoren können Benutzerpunkte anpassen
    - Einchecken zurücksetzen – Eincheckstatus aller Benutzer zurücksetzen

    Plugin-System
    *XYBot V2 verwendet ein Plugin-Design; alle Funktionen sind als Plugins umgesetzt. Die wichtigsten Plugins umfassen:*
    - AdminPoint - Punkteverwaltung
    - AdminSignInReset - Einchecken zurücksetzen
    - AdminWhitelist - Whitelist-Verwaltung
    - Ai - KI-Chat
    - BotStatus - Roboterstatus
    - GetContact - Adressbuch abrufen
    - GetWeather - Wetterabfrage
    - Gomoku - Gobang-Spiel
    - GoodMorning - Guten-Morgen-Grüße
    - Leaderboard - Punkte-Rangliste
    - LuckyDraw - Glücksziehung
    - Menu - Menüsystem
    - Music - Song-Bestellsystem
    - News - Nachrichten-Push
    - PointTrade - Punktehandel
    - QueryPoint - Punkteabfrage
    - RandomMember - Zufällige Gruppenmitglieder
    - RandomPicture - Zufällige Bilder
    - RedPacket - Rote-Umschläge-System
    - SignIn - Tägliches Einchecken
    - Warthunder - War-Thunder-Abfrage
