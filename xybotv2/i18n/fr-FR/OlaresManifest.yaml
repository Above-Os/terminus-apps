metadata:
  title: XYBotV2
  description: Framework de bot WeChat riche en fonctionnalités
spec:
  fullDescription: |
    XYBot V2 est un framework de bot WeChat riche en fonctionnalités prenant en charge diverses interactions et jeux.

    **Compte et mot de passe administrateur par défaut**
    Compte : admin
    Mot de passe : admin123
    Veuillez changer le mot de passe du compte rapidement

    **Remarque**
    Veuillez redémarrer le conteneur après modification de la configuration pour que les changements prennent effet

    **Fonctions principales**
    *Fonctions de base*
    - Chat IA – Interactions multimodales texte, images et voix
    - Actualités quotidiennes – Envoi automatique des actualités du jour
    - Système de commande de chansons – Commande de chansons en ligne
    - Requête météo – Consulter la météo dans tout le pays
    - Fonctions de jeu – Gobang, requête joueurs War Thunder, etc.

    *Système de points*
    - Connexion quotidienne – Récompenses pour connexions continues
    - Système de loterie – Plusieurs modes de loterie
    - Système d'enveloppes rouges – Envoyer des enveloppes de points dans le groupe
    - Échange de points – Transfert de points entre utilisateurs
    - Classement des points – Afficher le classement des points

    *Fonctions d'administration*
    - Gestion des plugins – Chargement/déchargement dynamique des plugins
    - Gestion de la liste blanche – Contrôler les droits d'utilisation du robot
    - Gestion des points – Les administrateurs peuvent ajuster les points utilisateur
    - Réinitialisation de connexion – Réinitialiser le statut de connexion de tous les utilisateurs

    Système de plugins
    *XYBot V2 adopte une conception par plugins ; toutes les fonctions sont implémentées sous forme de plugins. Les principaux plugins incluent :*
    - AdminPoint - gestion des points
    - AdminSignInReset - réinitialisation de connexion
    - AdminWhitelist - gestion de la liste blanche
    - Ai - chat IA
    - BotStatus - statut du robot
    - GetContact - obtenir le carnet d'adresses
    - GetWeather - requête météo
    - Gomoku - jeu Gobang
    - GoodMorning - salutations du matin
    - Leaderboard - classement des points
    - LuckyDraw - tirage au sort
    - Menu - système de menu
    - Music - système de commande de chansons
    - News - envoi d'actualités
    - PointTrade - échange de points
    - QueryPoint - requête de points
    - RandomMember - membres aléatoires du groupe
    - RandomPicture - images aléatoires
    - RedPacket - système d'enveloppes rouges
    - SignIn - connexion quotidienne
    - Warthunder - requête War Thunder
