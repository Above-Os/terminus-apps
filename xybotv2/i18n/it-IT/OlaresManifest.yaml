metadata:
  title: XYBotV2
  description: Framework per bot WeChat ricco di funzioni
spec:
  fullDescription: |
    XYBot V2 è un framework per bot WeChat ricco di funzioni che supporta molte interazioni e giochi.

    **Account e password amministratore predefiniti**
    Account: admin
    Password: admin123
    Modifica tempestivamente la password dell'account

    **Nota**
    Riavvia il container dopo aver modificato la configurazione affinché le modifiche abbiano effetto

    **Funzioni principali**
    *Funzioni di base*
    - Chat IA – Supporta interazioni multimodali con testo, immagini e voce
    - Notizie quotidiane – Push automatico delle notizie del giorno
    - Sistema di richiesta brani – Richiesta brani online
    - Query meteo – Consulta il meteo in tutto il paese
    - Funzioni di gioco – Gobang, query giocatori War Thunder, ecc.

    *Sistema punti*
    - Check-in giornaliero – Ricompense per check-in continui
    - Sistema lotteria – Multiple modalità di lotteria
    - Sistema buste rosse – Invia buste di punti nel gruppo
    - Scambio punti – Trasferimento punti tra utenti
    - Classifica punti – Visualizza la classifica dei punti

    *Funzioni di gestione*
    - Gestione plugin – Caricamento/scaricamento dinamico dei plugin
    - Gestione whitelist – Controlla i permessi d'uso del robot
    - Gestione punti – Gli amministratori possono regolare i punti utente
    - Reset check-in – Resetta lo stato di check-in di tutti gli utenti

    Sistema di plugin
    *XYBot V2 adotta un design a plugin; tutte le funzioni sono implementate come plugin. I plugin principali includono:*
    - AdminPoint - gestione punti
    - AdminSignInReset - reset check-in
    - AdminWhitelist - gestione whitelist
    - Ai - chat IA
    - BotStatus - stato robot
    - GetContact - ottieni rubrica
    - GetWeather - query meteo
    - Gomoku - gioco Gobang
    - GoodMorning - saluti del mattino
    - Leaderboard - classifica punti
    - LuckyDraw - estrazione
    - Menu - sistema menu
    - Music - sistema richiesta brani
    - News - push notizie
    - PointTrade - scambio punti
    - QueryPoint - query punti
    - RandomMember - membri casuali del gruppo
    - RandomPicture - immagini casuali
    - RedPacket - sistema buste rosse
    - SignIn - check-in giornaliero
    - Warthunder - query War Thunder
