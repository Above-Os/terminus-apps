olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: "v3"

workloadReplicas:
  testapp8: 1
metadata:
  name: testapp8
  description: Test app for Olares system version dependency checks
  icon: https://app.cdn.olares.com/appstore/homebox/icon.png
  version: "1.0.6"
  title: TestApp8 - System Version Test
  categories:
    - Lifestyle
    - workspace
  categories_v2:
    - workspace
  tags:
    - finance

spec:
  versionName: "0.21.0"
  fullDescription: |
    Tests the Olares system version dependency requirement >=1.12.8-0.

  upgradeDescription: |
    Tests the Olares system version dependency requirement >=1.12.8-0.
  developer: SysAdmins Media
  website: https://homebox.software/
  sourceCode: https://github.com/sysadminsmedia/homebox
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://homebox.software/en/
  license:
    - text: AGPL-3.0
      url: https://github.com/sysadminsmedia/homebox?tab=License-1-ov-file#AGPL-3.0-1-ov-file
  requiredMemory: 20Mi
  limitedMemory: 100Mi
  requiredDisk: 50Mi
  limitedDisk: 256Mi
  requiredCpu: 50m
  limitedCpu: 100m
  supportArch:
    - amd64
    - arm64
  chartRepo: https://github.com/beclab/apps/tree/main/steamheadless
permission:
  appData: true
  appCache: true
middleware:
  postgres:
    username: testapp8
    password: testapp8
    databases:
      - name: testapp8
        distributed: false
entrances:
  - name: testapp8
    host: testapp8
    port: 3100
    title: TestApp8 - System Version Test
    icon: https://app.cdn.olares.com/appstore/homebox/icon.png
    authLevel: private
options:
  allowMultipleInstall: true
  allowedOutboundPorts:
    - 587
  dependencies:
    - name: olares
      type: system
      version: ">=1.12.8-0"
