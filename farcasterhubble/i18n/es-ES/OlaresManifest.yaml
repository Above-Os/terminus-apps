metadata:
  title: Hubble
  description: Una implementación oficial de Farcaster Hub
spec:
  fullDescription: |
    Hubble es una implementación de un Farcaster Hub, escrita en TypeScript y Rust.
    
    Hubble crea una instancia privada de la red Farcaster en tu máquina. Almacena una copia de cada mensaje de cada usuario y se sincroniza con otros hubs para mantenerse al día. Los mensajes subidos a Hubble se difundirán a otros Hubs.
  upgradeDescription: |
    Cambios del parche
    8e7dec1: fix: Corregir el padding incorrecto de mensajes de enlace
    c261fba: añadido approxSize a getInfo()
    0e342af: fix: Obtener el snapshot anterior si el actual de la BD no está presente
    8c759d6: fix: Limitar el pruning para que el hub no se sobrecargue
    Dependencias actualizadas [c261fba]
      @farcaster/hub-nodejs@0.11.12
    
    Notas de la versión completas: https://github.com/farcasterxyz/hub-monorepo/releases/tag/%40farcaster%2Fhubble%401.19.3
