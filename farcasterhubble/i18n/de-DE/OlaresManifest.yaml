metadata:
  title: Hubble
  description: Eine offizielle Farcaster-Hub-Implementierung
spec:
  fullDescription: |
    Hubble ist eine Implementierung eines Farcaster Hub, geschrieben in TypeScript und Rust.
    
    Hubble erstellt eine private Instanz des Farcaster-Netzwerks auf Ihrem Rechner. Es speichert eine Kopie jeder Nachricht jedes Nutzers und synchronisiert sich mit anderen Hubs, um aktuell zu bleiben. An Hubble hochgeladene Nachrichten werden an andere Hubs weitergegeben.
  upgradeDescription: |
    Patch-Änderungen
    8e7dec1: fix: Falsches Padding bei Link-Nachrichten behoben
    c261fba: approxSize zu getInfo() hinzugefügt
    0e342af: fix: Vorherigen Snapshot abrufen, wenn der aktuelle DB-Snapshot fehlt
    8c759d6: fix: Pruning drosseln, damit der Hub nicht überlastet wird
    Aktualisierte Abhängigkeiten [c261fba]
      @farcaster/hub-nodejs@0.11.12
    
    Vollständige Release Notes: https://github.com/farcasterxyz/hub-monorepo/releases/tag/%40farcaster%2Fhubble%401.19.3
