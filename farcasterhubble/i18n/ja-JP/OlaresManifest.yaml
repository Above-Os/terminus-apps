metadata:
  title: Hubble
  description: 公式の Farcaster Hub 実装
spec:
  fullDescription: |
    Hubble は TypeScript と Rust で書かれた Farcaster Hub の実装です。
    
    Hubble はマシン上に Farcaster ネットワークのプライベートインスタンスを作成します。すべてのユーザーのすべてのメッセージのコピーを保存し、他のハブと同期して最新状態を保ちます。Hubble にアップロードされたメッセージは他の Hub にブロードキャストされます。
  upgradeDescription: |
    パッチ変更
    8e7dec1: fix: リンクメッセージの不正なパディングを修正
    c261fba: getInfo() に approxSize を追加
    0e342af: fix: 現在の DB スナップショットが存在しない場合、以前のスナップショットを取得
    8c759d6: fix: ハブが過負荷にならないよう pruning を制限
    依存関係を更新 [c261fba]
      @farcaster/hub-nodejs@0.11.12
    
    完全なリリースノート: https://github.com/farcasterxyz/hub-monorepo/releases/tag/%40farcaster%2Fhubble%401.19.3
