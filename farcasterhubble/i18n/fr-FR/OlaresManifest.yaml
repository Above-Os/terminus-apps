metadata:
  title: Hubble
  description: Une implémentation officielle de Farcaster Hub
spec:
  fullDescription: |
    Hubble est une implémentation d'un Farcaster Hub, écrite en TypeScript et Rust.
    
    Hubble crée une instance privée du réseau Farcaster sur votre machine. Il stocke une copie de chaque message de chaque utilisateur et se synchronise avec d'autres hubs pour rester à jour. Les messages téléversés vers Hubble seront diffusés aux autres Hubs.
  upgradeDescription: |
    Corrections du correctif
    8e7dec1: fix: Correction du padding incorrect des messages de lien
    c261fba: ajout de approxSize à getInfo()
    0e342af: fix: Récupérer le snapshot précédent si celui actuel de la bd est absent
    8c759d6: fix: Limiter le pruning pour que le hub ne soit pas surchargé
    Dépendances mises à jour [c261fba]
      @farcaster/hub-nodejs@0.11.12
    
    Notes de version complètes : https://github.com/farcasterxyz/hub-monorepo/releases/tag/%40farcaster%2Fhubble%401.19.3
