metadata:
  title: Hubble
  description: "Un'implementazione ufficiale di Farcaster Hub"
spec:
  fullDescription: |
    Hubble è un'implementazione di un Farcaster Hub, scritta in TypeScript e Rust.
    
    Hubble crea un'istanza privata della rete Farcaster sulla tua macchina. Memorizza una copia di ogni messaggio di ogni utente e si sincronizza con altri hub per restare aggiornato. I messaggi caricati su Hubble verranno trasmessi ad altri Hub.
  upgradeDescription: |
    Modifiche della patch
    8e7dec1: fix: Correzione del padding errato nei messaggi di link
    c261fba: aggiunto approxSize a getInfo()
    0e342af: fix: Recupera lo snapshot precedente se quello attuale del db non è presente
    8c759d6: fix: Limitare il pruning affinché l'hub non sia sovraccarico
    Dipendenze aggiornate [c261fba]
      @farcaster/hub-nodejs@0.11.12
    
    Note di rilascio complete: https://github.com/farcasterxyz/hub-monorepo/releases/tag/%40farcaster%2Fhubble%401.19.3
