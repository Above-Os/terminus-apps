metadata:
  title: YT-DLP V3 for test
  description: Ein Wise-Plugin zum Herunterladen von Audio/Video von Websites.
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Einmal vom Olares Admin installiert, können alle Nutzer im Cluster sie über Referenz-Apps (z. B. wise) nutzen.

    Ein Wise-Plugin zum Herunterladen von Audio/Video von Websites mit YT-DLP.

    YT-DLP ist ein funktionsreiches Kommandozeilen-Tool auf Basis von youtube-dl, das Videos und Audio von Websites wie YouTube, Vimeo und Hunderten weiterer herunterlädt. Das Projekt ist ein Fork von youtube-dl basierend auf dem inzwischen inaktiven youtube-dlc.

    *Funktionen*

    - Unterstützung für Tausende von Seiten
    - Automatische Formatwahl
    - Eingebettete Untertitel
    - Audio-Extraktion
    - Metadaten-Einbettung
    - Cookie-basierte Authentifizierung
    - Segmentierte Livestream-Verarbeitung

  upgradeDescription: |
    Migration von YT-DLP auf das v3 Shared-App-Schema.

    **Änderungen**

    - **Schema**: OlaresManifest auf `apiVersion: v3` aktualisiert.
    - **Layout**: vorherige Subcharts `ytserver` + `ytdlp` in ein einziges Chart zusammengeführt.
    - **Sharing**: `appScope.clusterScoped` + `appRef` durch `options.shared: true` ersetzt.
    - **Skalierung**: `workloadReplicas` deklariert die Replikazahlen für den Workload `ytdlpv3`.
