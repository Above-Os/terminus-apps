metadata:
  title: YT-DLP V3 for test
  description: ウェブサイトから音声／動画をダウンロードする Wise プラグイン
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin が一度インストールすれば、クラスター内のすべてのユーザーが参照アプリ（例: wise）経由で利用できます。

    YT-DLP を使ってウェブサイトから音声／動画をダウンロードする Wise プラグインです。

    YT-DLP は youtube-dl をベースにした高機能なコマンドラインツールで、YouTube、Vimeo など数百のサイトから動画と音声をダウンロードします。現在非アクティブな youtube-dlc を基にした youtube-dl のフォークです。

    *機能*

    - 数千サイトをサポート
    - 自動フォーマット選択
    - 埋め込み字幕
    - 音声抽出
    - メタデータ埋め込み
    - Cookie ベースの認証
    - セグメント化されたライブ配信の処理

  upgradeDescription: |
    YT-DLP を v3 共有アプリスキーマへ移行。

    **変更点**

    - **スキーマ**: OlaresManifest を `apiVersion: v3` にアップグレード。
    - **レイアウト**: 以前の `ytserver` + `ytdlp` サブチャートを単一チャートに統合。
    - **共有**: `appScope.clusterScoped` + `appRef` を `options.shared: true` に置き換え。
    - **スケーリング**: `workloadReplicas` が `ytdlpv3` ワークロードのレプリカ数を宣言。
