metadata:
  title: YT-DLP V3 for test
  description: Un plugin de Wise para descargar audio/vídeo de sitios web
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Admin de Olares, todos los usuarios del clúster pueden usarla mediante apps de referencia (p. ej. wise).

    Un plugin de Wise para descargar audio/vídeo de sitios web con YT-DLP.

    YT-DLP es una herramienta de línea de comandos rica en funciones basada en youtube-dl que descarga vídeo y audio de sitios como YouTube, Vimeo y cientos más. El proyecto es un fork de youtube-dl basado en el ya inactivo youtube-dlc.

    *Funciones*

    - Compatibilidad con miles de sitios
    - Selección automática de formato
    - Subtítulos incrustados
    - Extracción de audio
    - Incrustación de metadatos
    - Autenticación basada en cookies
    - Manejo de livestreams segmentados

  upgradeDescription: |
    Migración de YT-DLP al esquema de app compartida v3.

    **Cambios**

    - **Esquema**: OlaresManifest actualizado a `apiVersion: v3`.
    - **Diseño**: se fusionaron los subcharts `ytserver` + `ytdlp` en un solo chart.
    - **Compartido**: se reemplazó `appScope.clusterScoped` + `appRef` por `options.shared: true`.
    - **Escalado**: `workloadReplicas` declara el recuento de réplicas del workload `ytdlpv3`.
