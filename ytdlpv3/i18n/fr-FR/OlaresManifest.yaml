metadata:
  title: YT-DLP V3 for test
  description: Un plugin Wise pour télécharger audio/vidéo depuis des sites web
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s’agit d’une app partagée. Une fois installée par l’Admin Olares, tous les utilisateurs du cluster peuvent l’utiliser via des apps de référence (p. ex. wise).

    Un plugin Wise pour télécharger audio/vidéo depuis des sites web avec YT-DLP.

    YT-DLP est un outil en ligne de commande riche en fonctionnalités basé sur youtube-dl qui télécharge des vidéos et de l’audio depuis des sites comme YouTube, Vimeo et des centaines d’autres. Le projet est un fork de youtube-dl basé sur youtube-dlc, désormais inactif.

    *Fonctionnalités*

    - Prise en charge de milliers de sites
    - Sélection automatique du format
    - Sous-titres intégrés
    - Extraction audio
    - Intégration des métadonnées
    - Authentification par cookies
    - Gestion des livestreams segmentés

  upgradeDescription: |
    Migration de YT-DLP vers le schéma d’app partagée v3.

    **Changements**

    - **Schéma** : OlaresManifest mis à jour vers `apiVersion: v3`.
    - **Structure** : fusion des sous-charts `ytserver` + `ytdlp` en un seul chart.
    - **Partage** : remplacement de `appScope.clusterScoped` + `appRef` par `options.shared: true`.
    - **Mise à l’échelle** : `workloadReplicas` déclare le nombre de réplicas pour le workload `ytdlpv3`.
