metadata:
  title: YT-DLP V3 for test
  description: Un plugin Wise per scaricare audio/video da siti web
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un’app condivisa. Una volta installata dall’Admin Olares, tutti gli utenti del cluster possono usarla tramite app di riferimento (ad es. wise).

    Un plugin Wise per scaricare audio/video da siti web con YT-DLP.

    YT-DLP è uno strumento da riga di comando ricco di funzioni basato su youtube-dl che scarica video e audio da siti come YouTube, Vimeo e centinaia di altri. Il progetto è un fork di youtube-dl basato sull’ormai inattivo youtube-dlc.

    *Funzionalità*

    - Supporto per migliaia di siti
    - Selezione automatica del formato
    - Sottotitoli incorporati
    - Estrazione audio
    - Incorporamento metadati
    - Autenticazione basata su cookie
    - Gestione livestream segmentati

  upgradeDescription: |
    Migrazione di YT-DLP allo schema shared-app v3.

    **Cosa è cambiato**

    - **Schema**: OlaresManifest aggiornato a `apiVersion: v3`.
    - **Layout**: uniti i precedenti subchart `ytserver` + `ytdlp` in un unico chart.
    - **Condivisione**: sostituiti `appScope.clusterScoped` + `appRef` con `options.shared: true`.
    - **Scaling**: `workloadReplicas` dichiara il conteggio delle repliche per il workload `ytdlpv3`.
