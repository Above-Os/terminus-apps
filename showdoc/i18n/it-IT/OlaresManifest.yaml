metadata:
  title: ShowDoc
  description: Uno strumento ideale per condividere documenti online nei team IT
spec:
  fullDescription: |
    ShowDoc è uno strumento particolarmente adatto ai team IT per condividere documenti online. Può migliorare l'efficienza della comunicazione tra i membri del team.

    Per cosa può essere utilizzato?
    **Documentazione API**
    Con lo sviluppo di Internet mobile, BaaS (Backend as a Service) sta diventando sempre più popolare. Il lato server (backend) fornisce un'API e la APP o il frontend Web possono richiamare comodamente i dati attraverso il backend. ShowDoc consente di creare documentazioni API curate in modo molto rapido e semplice.

    **Dizionario dei dati**
    Un buon dizionario dei dati, ad esempio la struttura di un database, può essere mostrato facilmente agli altri insieme alla definizione di ogni campo.

    **Documentazione esplicativa**
    Puoi usare ShowDoc anche per scrivere istruzioni per strumenti o documenti che spiegano specifiche tecniche consultabili dal team.

    Quali funzioni offre attualmente?
    **Condivisione ed esportazione**
    Il design Web responsivo consente di condividere i documenti del progetto per la lettura su computer o dispositivi mobili. È inoltre possibile esportare il progetto come documento Word offline.

    **Gestione dei permessi**
    - Progetti pubblici e privati
    - Trasferimento dei progetti
    - Gestione semplice dei membri del progetto

    **Funzioni di modifica**
    - Supporto Markdown
    - Inserimento di modelli
    - Cronologia delle versioni
