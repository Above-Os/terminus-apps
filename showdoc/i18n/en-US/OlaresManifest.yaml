metadata:
  title: ShowDoc
  description: A tool greatly applicable for an IT team to share documents online
spec:
  upgradeDescription: |
    Rebuilds official ShowDoc 3.9.5 source for both architectures on a pinned base with PHP 8.3.36, fixing CVE-2026-109618 and CVE-2026-109619. Retains the non-root web/Mock/MCP runtime, SQLite data, uploads and configuration. After backing up, repacks only the known upstream seed unused-page anomaly, checking schema, every row and row IDs before replacing the database; other integrity errors stop startup and retain the original. Matches upstream static-upload access restrictions; use application-provided download links. Back up the database and uploaded files before upgrading. Upgrading a legacy single-entrance Chart can change the Web domain; reopen from Desktop, sign in again, and update bookmarks and document links using the old domain.

  fullDescription: |
    ShowDoc is a tool greatly applicable for an IT team to share documents online. It can promote communication efficiency between members of a team.

    What can it be used for?
    **API Document**
    With the development of mobile Internet, BaaS (Backend as a Service) becomes more
    and more popular. The server side(backend) provides API, and the APP side or Webpage
    frontend can conveniently invoke data through the backend. Using ShowDoc can compile
    exquisite API documents in a very fast and convenient way.

    **Data Dictionary**
    A good Data Dictionary, such as database structure can be easily exhibited to
    others, shown the definition of each field of the database structure.

    **Explain Document**
    You can absolutely use ShowDoc to write instructions of some tools, or some technical
    specifications explanation documents for the team to query.

    What functions does it have now?
    **Sharing and Exporting**
    Responsive webpage design can share the project documents to computer or mobile
    devices for reading. It can also export the project into offline word document.

    **Permission Manage**
    - Public and Private Project
    - Project Transfer
    - Easily Manage Project Members

    **Edit Function**
    - Support Markdown
    - Template Insert
    - History Version
