metadata:
  title: ShowDoc
  description: Un outil idéal pour permettre aux équipes informatiques de partager des documents en ligne
spec:
  upgradeDescription: |
    Rebuilds official ShowDoc 3.9.5 source for both architectures on a pinned base with PHP 8.3.36, fixing CVE-2026-109618 and CVE-2026-109619. Retains the non-root web/Mock/MCP runtime, SQLite data, uploads and configuration. After backing up, repacks only the known upstream seed unused-page anomaly, checking schema, every row and row IDs before replacing the database; other integrity errors stop startup and retain the original. Matches upstream static-upload access restrictions; use application-provided download links. Back up the database and uploaded files before upgrading. Upgrading a legacy single-entrance Chart can change the Web domain; reopen from Desktop, sign in again, and update bookmarks and document links using the old domain.

  fullDescription: |
    ShowDoc est un outil particulièrement adapté au partage de documents en ligne par les équipes informatiques. Il améliore l'efficacité de la communication entre les membres d'une équipe.

    À quoi peut-il servir ?
    **Documentation d'API**
    Avec le développement de l'Internet mobile, le BaaS (Backend as a Service) gagne en popularité. Le serveur (backend) fournit une API, et l'APP ou le frontend Web peut facilement appeler les données via le backend. ShowDoc permet de rédiger très rapidement et simplement une documentation d'API soignée.

    **Dictionnaire de données**
    Un bon dictionnaire de données, comme une structure de base de données, peut être facilement présenté aux autres avec la définition de chaque champ.

    **Documentation explicative**
    Vous pouvez également utiliser ShowDoc pour rédiger des instructions relatives à des outils ou des documents expliquant des spécifications techniques que l'équipe pourra consulter.

    Quelles fonctions propose-t-il actuellement ?
    **Partage et exportation**
    Grâce à une conception Web adaptative, les documents du projet peuvent être partagés et lus sur ordinateur ou appareil mobile. Le projet peut également être exporté sous forme de document Word hors ligne.

    **Gestion des autorisations**
    - Projets publics et privés
    - Transfert de projets
    - Gestion simplifiée des membres du projet

    **Fonctions d'édition**
    - Prise en charge de Markdown
    - Insertion de modèles
    - Historique des versions
