metadata:
  title: ShowDoc
  description: Ein besonders geeignetes Werkzeug für IT-Teams zum Online-Teilen von Dokumenten
spec:
  fullDescription: |
    ShowDoc ist ein besonders geeignetes Werkzeug, mit dem IT-Teams Dokumente online teilen können. Es verbessert die Kommunikationseffizienz zwischen Teammitgliedern.

    Wofür kann es verwendet werden?
    **API-Dokumentation**
    Mit der Entwicklung des mobilen Internets wird BaaS (Backend as a Service) immer beliebter. Die Serverseite (Backend) stellt eine API bereit, über die die APP oder das Web-Frontend bequem Daten abrufen kann. Mit ShowDoc lassen sich sehr schnell und einfach ansprechende API-Dokumentationen erstellen.

    **Datenwörterbuch**
    Ein gutes Datenwörterbuch, beispielsweise eine Datenbankstruktur, kann anderen übersichtlich präsentiert werden und die Definition jedes Feldes der Datenbankstruktur zeigen.

    **Erklärende Dokumentation**
    Sie können ShowDoc selbstverständlich verwenden, um Anleitungen für Werkzeuge oder Dokumente zur Erläuterung technischer Spezifikationen für das Team zu verfassen.

    Welche Funktionen bietet es derzeit?
    **Teilen und Exportieren**
    Dank responsivem Webdesign können Projektdokumente zum Lesen auf Computern oder Mobilgeräten geteilt werden. Projekte können außerdem als Offline-Word-Dokument exportiert werden.

    **Berechtigungsverwaltung**
    - Öffentliche und private Projekte
    - Projektübertragung
    - Einfache Verwaltung von Projektmitgliedern

    **Bearbeitungsfunktionen**
    - Markdown-Unterstützung
    - Vorlagen einfügen
    - Versionsverlauf
