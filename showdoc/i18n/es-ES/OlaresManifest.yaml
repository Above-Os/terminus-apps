metadata:
  title: ShowDoc
  description: Una herramienta ideal para que los equipos de TI compartan documentos en línea
spec:
  fullDescription: |
    ShowDoc es una herramienta especialmente indicada para que los equipos de TI compartan documentos en línea. Puede mejorar la eficiencia de la comunicación entre los miembros del equipo.

    ¿Para qué se puede utilizar?
    **Documentación de API**
    Con el desarrollo de Internet móvil, BaaS (Backend as a Service) es cada vez más popular. El servidor (backend) proporciona una API, y la APP o el frontend web pueden acceder cómodamente a los datos a través del backend. ShowDoc permite crear documentación de API atractiva de forma muy rápida y sencilla.

    **Diccionario de datos**
    Un buen diccionario de datos, como la estructura de una base de datos, puede mostrarse fácilmente a otras personas e indicar la definición de cada campo.

    **Documentación explicativa**
    También puedes usar ShowDoc para redactar instrucciones de herramientas o documentos que expliquen especificaciones técnicas para que el equipo los consulte.

    ¿Qué funciones ofrece actualmente?
    **Compartir y exportar**
    El diseño web adaptable permite compartir la documentación del proyecto para leerla en ordenadores o dispositivos móviles. También permite exportar el proyecto como documento de Word sin conexión.

    **Gestión de permisos**
    - Proyectos públicos y privados
    - Transferencia de proyectos
    - Gestión sencilla de miembros del proyecto

    **Funciones de edición**
    - Compatibilidad con Markdown
    - Inserción de plantillas
    - Historial de versiones
