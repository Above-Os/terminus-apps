metadata:
  title: ShowDoc
  description: IT チームがオンラインでドキュメントを共有するための最適なツール
spec:
  upgradeDescription: |
    Rebuilds official ShowDoc 3.9.5 source for both architectures on a pinned base with PHP 8.3.36, fixing CVE-2026-109618 and CVE-2026-109619. Retains the non-root web/Mock/MCP runtime, SQLite data, uploads and configuration. After backing up, repacks only the known upstream seed unused-page anomaly, checking schema, every row and row IDs before replacing the database; other integrity errors stop startup and retain the original. Matches upstream static-upload access restrictions; use application-provided download links. Back up the database and uploaded files before upgrading. Upgrading a legacy single-entrance Chart can change the Web domain; reopen from Desktop, sign in again, and update bookmarks and document links using the old domain.

  fullDescription: |
    ShowDoc は、IT チームがオンラインでドキュメントを共有するのに最適なツールです。チームメンバー間のコミュニケーション効率を高めます。

    どのような用途に使えますか？
    **API ドキュメント**
    モバイルインターネットの発展に伴い、BaaS（Backend as a Service）の人気が高まっています。サーバー側（backend）が API を提供し、APP 側や Web フロントエンドは backend 経由で簡単にデータを呼び出せます。ShowDoc を使えば、洗練された API ドキュメントをすばやく簡単に作成できます。

    **データディクショナリ**
    データベース構造などの優れたデータディクショナリを、各フィールドの定義とともにわかりやすく提示できます。

    **説明ドキュメント**
    ShowDoc を使って、ツールの手順書や、チームが参照する技術仕様の説明ドキュメントを作成することもできます。

    現在どのような機能がありますか？
    **共有とエクスポート**
    レスポンシブ Web デザインにより、プロジェクトドキュメントをコンピューターやモバイル端末で閲覧できます。プロジェクトをオフラインの Word ドキュメントとしてエクスポートすることもできます。

    **権限管理**
    - 公開・非公開プロジェクト
    - プロジェクトの移管
    - プロジェクトメンバーの簡単な管理

    **編集機能**
    - Markdown 対応
    - テンプレート挿入
    - バージョン履歴
