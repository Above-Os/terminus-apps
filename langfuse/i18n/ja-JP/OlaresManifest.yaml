metadata:
  title: Langfuse
  description: オープンソースの LLM エンジニアリングプラットフォーム
spec:
  fullDescription: |
    Langfuse はオープンソースの LLM エンジニアリングプラットフォームです。チームが AI アプリケーションを共同で開発・監視・評価・デバッグするのを支援します。数分でセルフホストでき、実戦で検証されています。

    コア機能
    LLM Application Observability: アプリを計装し、Langfuse へトレースを取り込み始めます。LLM 呼び出しや retrieval、embedding、エージェント動作などの関連ロジックを追跡し、複雑なログやユーザーセッションを検査・デバッグできます。

    Prompt Management はプロンプトの一元管理、バージョン管理、共同イテレーションを支援します。サーバー／クライアント双方の強力なキャッシュにより、アプリにレイテンシを足さずにプロンプトを改善できます。

    Evaluations は LLM アプリ開発ワークフローの要であり、Langfuse はニーズに合わせて適応します。LLM-as-a-judge、ユーザーフィードバック収集、手動ラベリング、API/SDK によるカスタム評価パイプラインに対応します。

    Datasets は LLM アプリ評価のためのテストセットとベンチマークを可能にします。継続的改善、デプロイ前テスト、構造化実験、柔軟な評価、LangChain や LlamaIndex などのフレームワークとのシームレスな統合を支えます。

    LLM Playground はプロンプトとモデル設定を試しイテレーションするツールで、フィードバックループを短縮し開発を加速します。トレーシングで悪い結果を見つけたら、そのまま playground へジャンプできます。

    Comprehensive API: Langfuse は API 経由のビルディングブロックを使い、独自の LLMOps ワークフローを支える用途でもよく使われます。OpenAPI 仕様、Postman コレクション、Python / JS/TS の型付き SDK が利用できます。
