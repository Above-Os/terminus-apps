metadata:
  title: Langfuse
  description: Open-Source-Plattform für LLM-Engineering
spec:
  fullDescription: |
    Langfuse ist eine Open-Source-Plattform für LLM-Engineering. Sie hilft Teams, KI-Anwendungen gemeinsam zu entwickeln, zu überwachen, zu bewerten und zu debuggen. Langfuse lässt sich in Minuten selbst hosten und ist praxiserprobt.

    Kernfunktionen
    LLM Application Observability: Instrumentiere deine App und beginne, Traces an Langfuse zu senden — so verfolgst du LLM-Aufrufe und weitere relevante Logik wie Retrieval, Embedding oder Agent-Aktionen. Inspiziere und debugge komplexe Logs und Nutzersitzungen.

    Prompt Management hilft dir, Prompts zentral zu verwalten, zu versionieren und gemeinsam zu iterieren. Dank starkem Caching auf Server- und Client-Seite kannst du Prompts iterieren, ohne Latenz zur Anwendung hinzuzufügen.

    Evaluations sind zentral für den LLM-Entwicklungsworkflow, und Langfuse passt sich deinen Bedürfnissen an. Unterstützt werden LLM-as-a-judge, Nutzerfeedback, manuelle Kennzeichnung und eigene Evaluationspipelines über APIs/SDKs.

    Datasets ermöglichen Testsätze und Benchmarks zur Bewertung deiner LLM-Anwendung. Sie unterstützen kontinuierliche Verbesserung, Pre-Deployment-Tests, strukturierte Experimente, flexible Evaluation und nahtlose Integration mit Frameworks wie LangChain und LlamaIndex.

    LLM Playground ist ein Werkzeug zum Testen und Iterieren von Prompts und Modellkonfigurationen — verkürzt die Feedbackschleife und beschleunigt die Entwicklung. Bei schlechten Trace-Ergebnissen kannst du direkt zum Playground springen.

    Comprehensive API: Langfuse wird häufig genutzt, um maßgeschneiderte LLMOps-Workflows zu betreiben und dabei die Bausteine von Langfuse über die API zu nutzen. OpenAPI-Spezifikation, Postman-Collection und typisierte SDKs für Python, JS/TS sind verfügbar.
