metadata:
  title: Langfuse
  description: Plateforme open source d'ingénierie LLM
spec:
  fullDescription: |
    Langfuse est une plateforme open source d'ingénierie LLM. Elle aide les équipes à développer, surveiller, évaluer et déboguer collaborativement des applications d'IA. Langfuse peut être auto-hébergée en quelques minutes et est éprouvée.

    Fonctionnalités principales
    LLM Application Observability : instrumentez votre app et commencez à ingérer des traces dans Langfuse, en suivant les appels LLM et d'autres logiques pertinentes comme la retrieval, l'embedding ou les actions d'agents. Inspectez et déboguez des logs complexes et des sessions utilisateur.

    Prompt Management vous aide à gérer centralement, versionner et itérer collaborativement vos prompts. Grâce à un fort cache côté serveur et client, vous pouvez itérer sur les prompts sans ajouter de latence à votre application.

    Les Evaluations sont centrales au workflow de développement d'applications LLM, et Langfuse s'adapte à vos besoins. Prise en charge de LLM-as-a-judge, collecte de feedback utilisateur, étiquetage manuel et pipelines d'évaluation personnalisés via APIs/SDKs.

    Datasets permettent des jeux de tests et benchmarks pour évaluer votre application LLM. Ils prennent en charge l'amélioration continue, les tests pré-déploiement, les expériences structurées, l'évaluation flexible et l'intégration transparente avec des frameworks comme LangChain et LlamaIndex.

    LLM Playground est un outil pour tester et itérer prompts et configurations de modèles, raccourcissant la boucle de feedback et accélérant le développement. Quand vous voyez un mauvais résultat dans le tracing, vous pouvez passer directement au playground.

    Comprehensive API : Langfuse est souvent utilisé pour alimenter des workflows LLMOps sur mesure en utilisant les briques fournies via l'API. Spécification OpenAPI, collection Postman et SDK typés pour Python, JS/TS sont disponibles.
