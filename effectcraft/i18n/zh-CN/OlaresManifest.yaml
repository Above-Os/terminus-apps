metadata:
  title: EffectCraft
  description: 在浏览器中运行的 After Effects 风格动态图形与合成软件
spec:
  fullDescription: |
    ## 概述
    EffectCraft 是一款用 Rust 编写的开源动态图形与合成软件，目标是对标 After Effects。
    本应用提供它的 WebAssembly 版本：合成、效果、关键帧和渲染都在你的浏览器里完成，
    素材不会离开你的设备。

    项目和导入的素材保存在浏览器存储里，保存和导出会下载文件。
    清除网站数据或换浏览器之前，请先下载需要保留的文件。

    ## Agent 接入（MCP）
    本应用还以 Streamable HTTP 方式运行 EffectCraft 的无界面引擎，作为 MCP 服务。
    它的入口不显示在桌面上，可以在设置里找到，只能从局域网或 LarePass VPN 访问。
    Agent 可以搭建合成、用 CPU 渲染画面，只能读写 Home/EffectCraft 目录。
    想在浏览器里继续编辑 agent 生成的项目，请从 Files 下载后用浏览器的文件选择框打开。

    ## 要求
    - 支持 WebGPU 或 WebGL2 的浏览器
    - 架构：amd64、arm64
