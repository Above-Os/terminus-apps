metadata:
  title: EffectCraft
  description: After Effects-style motion graphics and compositing in your browser
spec:
  fullDescription: |
    ## Overview
    EffectCraft is an open-source, After Effects-comparable motion graphics
    and compositing app written in Rust. This app serves its WebAssembly
    build: compositions, effects, keyframes and renders run entirely in your
    browser, and your media never leaves your device.

    Projects and imported media are kept in the browser's storage; Save and
    Export download files. Download anything you want to keep before
    clearing site data or switching browsers.

    ## Agent access (MCP)
    The app also runs EffectCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    build compositions and render frames on the CPU, and can read and write
    files only in Home/EffectCraft. To keep editing an agent's project in the
    browser, download it from Files and open it with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
