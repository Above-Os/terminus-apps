{{- if and .Values.capture.bluetooth.enabled .Values.capture.hostAudioSetup.enabled }}
# The host audio setup script, run on the host by the job below.
# required: a missing file renders as an empty script, which the host would
# run and report as ready, so stop the install instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: note-host-audio-setup
data:
  olares-bt-audio.sh: |-
{{ .Files.Get "files/olares-bt-audio.sh" | required "files/olares-bt-audio.sh is missing from the chart" | indent 4 }}
  olares-note-host.sh: |-
{{ .Files.Get "files/olares-note-host.sh" | required "files/olares-note-host.sh is missing from the chart" | indent 4 }}
  # Lets the host's systemd run a step: see "run-on-host.sh" below.
  olares-note-audio.service: |-
    [Unit]
    Description=Note host audio: %i

    [Service]
    Type=oneshot
    TimeoutStartSec=170
    ExecStart=/bin/bash /var/lib/olares-bt-audio/run/%i.sh
  # What the install job does, on the host.
  setup.sh: |-
    #!/bin/bash
    D=/var/lib/olares-bt-audio
    S=$D/olares-bt-audio.sh
    B=$D/olares-note-host.sh
    # No terminal here: btmgmt and bluetoothctl wait on a stdin that never
    # ends, so give them one that has ended. --quick does what needs no
    # package and no session restart, and exits 4 when the rest is
    # missing; that rest runs in a unit of its own, so a slow apt cannot
    # hold the job.
    LC_ALL=C timeout 90 bash "$S" setup --quick </dev/null; rc=$?
    echo "host audio: setup --quick exited $rc (0 ready; 3 a real PulseAudio left alone; 4 needs apply; 5 no systemd)"
    # 124 and 137 are --quick cut short by its own 60 s limit, or by this
    # timeout, before it could tell: hand the full setup to the host as
    # well, which checks first and changes only what is missing.
    step_status=0
    case "$rc" in
      0|3) ;;
      4|124|137)
        if LC_ALL=C timeout 30 bash "$S" apply-async </dev/null; then
          echo "host audio: apply started on the host; journalctl -u olares-bt-audio-apply"
        else
          rc=$?
          echo "host audio: apply did not start, exited $rc"
          step_status=1
        fi;;
      *) step_status=1;;
    esac
    # The host services for Note: the Bluetooth helper, which pairs
    # headsets for the record dialog, and where olares-desktop is, the
    # desktop bridge, which gives the desktop's browser an output into the
    # host session (the desktop's own sound server has no Bluetooth).
    # attach records this Note as one using them, so removing another Note
    # leaves them (note-host-audio-detach below).
    LC_ALL=C timeout 30 env OLARES_NOTE_DESKTOP_BRIDGE={{ if .Values.capture.desktopBridge.enabled }}on{{ else }}off{{ end }} bash "$B" attach {{ .Release.Namespace | quote }} </dev/null
    rc=$?
    echo "host audio: host services attach exited $rc"
    [ "$rc" -eq 0 ] || step_status=1
    exit "$step_status"
  # What the uninstall job does, on the host. The last Note out also has
  # the Bluetooth audio setup remove what it did for Note.
  detach.sh: |-
    #!/bin/bash
    LC_ALL=C timeout 75 bash /var/lib/olares-bt-audio/olares-note-host.sh detach {{ .Release.Namespace | quote }} </dev/null
    rc=$?
    echo "host audio: host services detach exited $rc"
    exit "$rc"
  # Both jobs reach the host through its /proc: they enter the host's mount,
  # UTS, IPC and network namespaces by path, and stay in their own PID
  # namespace, which no container can leave (setns answers "Invalid
  # argument"). From there the files of the host are in reach but not
  # systemctl, whose library refuses a peer whose PID it cannot see ("Failed
  # to connect to bus: No data available"). dbus-send has no such check, so
  # it asks the host's systemd to run the step as a unit, where systemctl,
  # loginctl and systemd-run all work. The step's output comes back through
  # /run, which the host's boot clears. Always exits 0: Note starts whatever
  # happens here.
  run-on-host.sh: |-
    step=$1 wait=$2
    H="nsenter -m/host-proc/1/ns/mnt -u/host-proc/1/ns/uts -i/host-proc/1/ns/ipc -n/host-proc/1/ns/net --"
    D=/var/lib/olares-bt-audio
    id=$step-{{ .Release.Namespace }}
    out=/run/olares-note-audio/$id
    put() { timeout 10 $H tee "$2" >/dev/null <"/setup/$1"; }
    # The boot self-check runs the script copied here, and setup compares
    # the two to restart that check when the script changed.
    timeout 10 $H mkdir -p "$D/run" /run/olares-note-audio \
      && put olares-bt-audio.sh "$D/olares-bt-audio.sh" \
      && put olares-note-host.sh "$D/olares-note-host.sh" \
      && put olares-note-audio.service /etc/systemd/system/olares-note-audio@.service \
      && {
        echo '#!/bin/bash'
        echo "exec >$out.log 2>&1"
        echo "trap 'echo \$? >$out.rc' EXIT"
        cat "/setup/$step.sh"
      } | timeout 10 $H tee "$D/run/$id.sh" >/dev/null \
      || { echo "host audio: cannot reach the host, skipped"; exit 0; }
    timeout 10 $H rm -f "$out.rc" "$out.log"
    S="timeout 15 $H dbus-send --system --print-reply --dest=org.freedesktop.systemd1 /org/freedesktop/systemd1 org.freedesktop.systemd1.Manager"
    $S.Reload >/dev/null && $S.StartUnit "string:olares-note-audio@$id.service" string:replace >/dev/null \
      || { echo "host audio: the host's systemd did not take the step, skipped"; exit 0; }
    i=0
    while [ "$i" -lt "$wait" ] && ! timeout 5 $H test -f "$out.rc"; do
      sleep 1; i=$((i + 1))
    done
    timeout 10 $H cat "$out.log"
    echo "host audio: $step on the host exited $(timeout 5 $H cat "$out.rc" 2>/dev/null || echo "nothing after ${wait}s")"
    exit 0
---
# Prepare the host for recording from Bluetooth headsets, at every install
# and upgrade of Note. Recording from a headset needs, on the host, BlueZ's
# audio plugin for PipeWire, a sound server running with nobody logged in,
# wideband speech, and a pulse socket an app of another uid can reach;
# olares-bt-audio.sh setup checks each and changes only what is missing or
# has drifted, so a box set up already (by lares or by hand) is left as it
# is. It also installs a boot self-check on the host, which keeps the box
# ready after a power cut. It shares lares's wideband unit and WirePlumber
# file, never touches lares's voice agent and never replaces a real
# PulseAudio.
#
# A job of its own rather than an init container of Note: Note starts without
# waiting for it. Its pulse relay looks for the sound server at every
# connection, so nothing needs a restart once the host is ready.
#
# The job reaches the host through the host's /proc, not the pod-wide
# hostPID: it enters the mount, UTS, IPC and network namespaces of the host's
# PID 1 by path and stays in its own PID namespace, which no container can
# leave (setns answers "Invalid argument"). lares enters the host the same
# way. The price is a privileged pod at each install and upgrade;
# capture.hostAudioSetup.enabled turns it off.
apiVersion: batch/v1
kind: Job
metadata:
  name: note-host-audio-r{{ .Release.Revision }}
spec:
  backoffLimit: 0
  # The step on the host is capped at 90 s for --quick, 30 s for apply-async
  # and 30 s for the desktop bridge: 150 s at worst, and the unit stops it at
  # 170 s. A deadline of 150 once cut it off on the bridge, half installed
  # (review of 0.6.1). Until this pod ends, stopping Note waits on it.
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      # The script exits in about a minute; a sidecar does not, so the pod
      # stays Running and stopping Note fails while it waits for every pod in
      # the namespace to finish. This job only reaches the host and calls no
      # other app, so it needs no mesh. Olares injects its mesh-in agent into
      # every non-entrance pod of an app that calls a shared app, and then
      # sets linkerd.io/inject to enabled whatever the pod asked for; only
      # this label keeps both sidecars out. The annotation still covers a box
      # whose mesh-in admission is off, where linkerd alone would inject.
      labels:
        gateway.olares.io/shared-caller-outbound: "false"
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      containers:
        - name: host-audio-setup
          image: beclab/aboveos-busybox:1.37.0
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - sh
            - -c
            - sh /setup/run-on-host.sh setup 165
          volumeMounts:
            - name: host-audio-setup
              mountPath: /setup
            - name: host-proc
              mountPath: /host-proc
              readOnly: true
      volumes:
        - name: host-audio-setup
          configMap:
            name: note-host-audio-setup
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
---
# Uninstalling Note takes the desktop bridge with it, unless another Note on
# this host (a renamed preview) still uses it: detach forgets this namespace
# and uninstalls only when none is left. Olares uninstalls through helm with
# hooks on, and a hook that fails or never starts leaves the app in
# UninstallFailed, its hook rerun every few seconds, until app-service gives
# up and deletes the namespace: about two minutes (yaotest005, 2026-10-14,
# a hook exiting 1 and one whose image could not be pulled). That uninstall
# still ends clean, but without detach, so this namespace stays in the list
# and the bridge stays. So everything here is bounded and the pod always
# exits 0. It runs while the release's ConfigMap is still there.
# Only a release installed or upgraded with this hook runs it on uninstall.
apiVersion: batch/v1
kind: Job
metadata:
  name: note-host-audio-detach
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  # The step on the host is capped at 75 s and this job waits 120 s for it;
  # the rest is room for pulling the image, which the setup job already
  # brought to the node.
  activeDeadlineSeconds: 180
  template:
    metadata:
      # As for the setup job: no sidecar, or the pod never completes.
      labels:
        gateway.olares.io/shared-caller-outbound: "false"
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      containers:
        - name: host-audio-detach
          image: beclab/aboveos-busybox:1.37.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - sh
            - -c
            - sh /setup/run-on-host.sh detach 120
          volumeMounts:
            - name: host-audio-setup
              mountPath: /setup
            - name: host-proc
              mountPath: /host-proc
              readOnly: true
      volumes:
        - name: host-audio-setup
          configMap:
            name: note-host-audio-setup
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
{{- end }}
