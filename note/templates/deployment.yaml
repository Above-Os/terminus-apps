apiVersion: apps/v1
kind: Deployment
metadata:
  name: note
  namespace: {{ .Release.Namespace }}
  labels:
    app: note
spec:
  replicas: {{ .Values.workloads.note.replicaCount }}
  selector:
    matchLabels:
      app: note
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: note
      annotations:
        config.linkerd.io/skip-outbound-ports: "4222"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # Olares grants the appData mount but does not hand over ownership of
        # it, and kubelet creates a missing subPath as root. Each directory is
        # chowned on its own: recursing has been observed to fail on
        # subdirectories the app already created as uid 1000, which leaves the
        # pod stuck initializing on upgrade.
        - name: init-permissions
          image: beclab/aboveos-busybox:1.37.0
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              for d in /data /data/meetings; do
                mkdir -p "$d" && chown 1000:1000 "$d"
              done
          volumeMounts:
            - name: app-data
              mountPath: /data
      containers:
        - name: note
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOTE_PORT
              value: "8080"
            - name: NOTE_DATA_DIR
              value: /data
            - name: TZ
              value: Etc/UTC
            # Router's shared gateway entrance is stable across users. The host
            # is two rounds of md5, not one: appid = md5("router")[:8] = f3395cd5,
            # then md5(appid + "shared")[:8] = 3a77b15d. Hashing "routershared"
            # in one round yields 8a0b4a6e, which resolves nowhere.
            # The app's own identity rides along as x-caller-appid.
            - name: LLM_GATEWAY_URL
              value: "http://3a77b15d.shared.olares.com/v1"
            - name: OLARES_APP_ID
              value: "note"
            - name: NOTE_CATALOG_EVENTS_NATS_URL
              value: {{ printf "nats://nats.user-system-%s:4222" .Values.bfl.username | quote }}
            - name: NOTE_CATALOG_EVENTS_NATS_USER
              value: {{ printf "%s-note-catalog" .Release.Namespace | quote }}
            - name: NOTE_CATALOG_EVENTS_NATS_PASS
              valueFrom:
                secretKeyRef:
                  name: note-nats
                  key: password
            - name: NOTE_CATALOG_EVENTS_SUBJECT
              value: "router.catalog"
            - name: NOTE_LLDAP_READONLY_URL
              value: "http://lldap-provider-svc.os-framework:28080"
            - name: NOTE_LLDAP_TOKEN_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: NOTE_LLDAP_NATS_URL
              value: "nats://nats.os-platform:4222"
            - name: NOTE_LLDAP_NATS_USER
              value: {{ printf "%s-note-users" .Release.Namespace | quote }}
            - name: NOTE_LLDAP_NATS_PASS
              valueFrom:
                secretKeyRef:
                  name: note-nats
                  key: password
            - name: NOTE_LLDAP_RESYNC_INTERVAL
              value: "5m"
            # Browser uploads land on this pod's volume. Files is still used
            # to browse and import from the caller's Home, and for HLS.
            # {user} is replaced from the authenticated caller so each user
            # reaches their own Files entrance. The domain is the platform's,
            # taken from the installing admin's zone: a caller on the LAN name
            # arrives from <entrance>.<user>.olares.local, which resolves on
            # their side of the network and nowhere in this cluster.
            - name: NOTE_FILES_BASE_URL
              value: {{ printf "https://files.{user}.%s" (.Values.user.zone | splitList "." | rest | join ".") | quote }}
            - name: NOTE_CPU_WORKERS
              value: {{ .Values.workers.cpu | quote }}
            - name: NOTE_GPU_WORKERS
              value: {{ .Values.workers.gpu | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.databases.note | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: app-data
              mountPath: /data
      volumes:
        - name: app-data
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: note-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: note
spec:
  selector:
    app: note
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
