metadata:
  title: Note
  description: Un'app di trascrizione per riunioni con riassunti automatici, traduzione e sottotitoli, con account propri

spec:
  upgradeDescription: |
    - Note 0.6.20: con MOSS-Transcribe-Diarize ogni frase resta attribuita a chi l'ha pronunciata; quando due parlanti si susseguono da vicino, nessuna parola passa più all'altro parlante né viene spezzata a metà.
  fullDescription: |
    Note trasforma una registrazione o un video in una trascrizione da leggere e riascoltare. Indica chi ha parlato e quando, poi può riassumere automaticamente la riunione, tradurre la trascrizione e generare i sottotitoli.

    **Funzionalità principali**

    - Distinguere i parlanti e indicare chi ha parlato e quando.
    - Trascrivere il parlato con tempi a livello di parola, così il testo resta allineato all'audio.
    - Generare automaticamente un riassunto della riunione.
    - Tradurre la trascrizione.
    - Generare ed esportare i sottotitoli.
    - Caricare un file nel browser.
    - Usare gli account propri di Note: il proprietario aggiunge amministratori e membri, ognuno con la propria password e l'accesso in due passaggi facoltativo.

    Questa app usa Router e le applicazioni di modelli audio installate su questo Olares. Router deve essere in esecuzione e i modelli vocali e di chat necessari devono essere installati. Ogni utente Olares installa la propria copia, e anche chi non ha un account Olares può usarla con un account creato dal proprietario. L'importazione dall'app File e l'API degli agenti interna al cluster non sono disponibili.
