metadata:
  title: Note
  description: Un'app di trascrizione per riunioni con riassunti automatici, traduzione e sottotitoli

spec:
  fullDescription: |
    Note trasforma una registrazione o un video in una trascrizione da leggere e riascoltare. Indica chi ha parlato e quando, poi può riassumere automaticamente la riunione, tradurre la trascrizione e generare i sottotitoli.

    **Funzionalità principali**

    - Distinguere i parlanti e indicare chi ha parlato e quando.
    - Trascrivere il parlato con tempi a livello di parola, così il testo resta allineato all'audio.
    - Generare automaticamente un riassunto della riunione.
    - Tradurre la trascrizione.
    - Generare ed esportare i sottotitoli.
    - Importare un file dall'app File o caricarlo nel browser.

    Questa app usa Router e le applicazioni di modelli audio installate su questo Olares. Router deve essere in esecuzione e i modelli vocali e di chat necessari devono essere installati. Una sola installazione serve tutte le persone su questo Olares.
