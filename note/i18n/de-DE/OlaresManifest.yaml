metadata:
  title: Note
  description: Eine Meeting-Transkriptions-App mit automatischen Zusammenfassungen, Übersetzung und Untertiteln

spec:
  upgradeDescription: |
    - Freigaben haben jetzt drei Rollen: Eigentümer, Kann bearbeiten und Kann ansehen. Wer bearbeiten kann, kann Meetings jetzt auch freigeben, verschieben, erneut verarbeiten und in den Papierkorb verschieben. Bisherige Verwalter haben jetzt die Rolle Kann bearbeiten.
    - Ask-Sitzungen sind jetzt nur für ihren Eigentümer sichtbar und können nicht mehr freigegeben werden.
    - Lange Meetings öffnen sich schneller, und Zurück sowie andere Schaltflächen reagieren, während das Transkript lädt.
    - Ein API-Schlüssel ist jetzt der einzige Wert, den ein externes Aufnahmegerät oder eine Integration zum Hochladen von Audio braucht.
    - Ein geöffneter Tab bietet nach einem Update von Note an, die Seite neu zu laden.
    - Beim Import aus Files zeigt Note an, wenn die Datei bereits importiert wurde.
  fullDescription: |
    Note macht aus einer Aufnahme oder einem Video ein Transkript zum Lesen und erneuten Abspielen. Die App kennzeichnet, wer wann gesprochen hat, und kann das Meeting anschließend automatisch zusammenfassen, das Transkript übersetzen und Untertitel erzeugen.

    **Hauptfunktionen**

    - Sprecher trennen und kennzeichnen, wer wann gesprochen hat.
    - Sprache mit Zeitangaben auf Wortebene transkribieren, damit Text und Audio synchron bleiben.
    - Automatisch eine Meeting-Zusammenfassung erstellen.
    - Das Transkript übersetzen.
    - Untertitel erzeugen und exportieren.
    - Eine Datei aus der App Dateien importieren oder im Browser hochladen.

    Diese App verwendet Router und die auf diesem Olares installierten Audiomodell-Anwendungen. Router muss laufen, und die benötigten Sprach- und Chat-Modelle müssen installiert sein. Eine Installation steht allen Personen auf diesem Olares zur Verfügung.
