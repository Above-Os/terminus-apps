metadata:
  title: Note
  description: Eine Meeting-Transkriptions-App mit automatischen Zusammenfassungen, Übersetzung und Untertiteln, mit eigenen Konten

spec:
  upgradeDescription: |
    - Note 0.6.19: MOSS-Transcribe-Diarize transkribiert und unterscheidet Sprecher in einem Durchgang und ist jetzt das empfohlene Modell für beide Schritte. Bluetooth-Headsets werden über den Bluetooth-Dienst von Olares gekoppelt, Note installiert nichts mehr auf dem Host. Die Wortausrichtung ist bei langen Aufnahmen schneller.
  fullDescription: |
    Note macht aus einer Aufnahme oder einem Video ein Transkript zum Lesen und erneuten Abspielen. Die App kennzeichnet, wer wann gesprochen hat, und kann das Meeting anschließend automatisch zusammenfassen, das Transkript übersetzen und Untertitel erzeugen.

    **Hauptfunktionen**

    - Sprecher trennen und kennzeichnen, wer wann gesprochen hat.
    - Sprache mit Zeitangaben auf Wortebene transkribieren, damit Text und Audio synchron bleiben.
    - Automatisch eine Meeting-Zusammenfassung erstellen.
    - Das Transkript übersetzen.
    - Untertitel erzeugen und exportieren.
    - Eine Datei im Browser hochladen.
    - Eigene Konten von Note: Der Eigentümer fügt Admins und Mitglieder hinzu, jeweils mit eigenem Passwort und optionaler Zwei-Faktor-Anmeldung.

    Diese App verwendet Router und die auf diesem Olares installierten Audiomodell-Anwendungen. Router muss laufen, und die benötigten Sprach- und Chat-Modelle müssen installiert sein. Jede Olares-Person installiert ihre eigene Kopie, und auch Personen ohne Olares-Konto können sie mit einem Konto vom Eigentümer nutzen. Der Import aus Dateien und die clusterinterne Agent-API sind nicht verfügbar.
