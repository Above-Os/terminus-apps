metadata:
  title: Note
  description: 自動要約、翻訳、字幕に対応した会議文字起こしアプリ

spec:
  upgradeDescription: |
    - 共有の役割は、所有者、編集可、閲覧可の3つになりました。編集できるユーザーは、会議の共有、移動、再処理、ゴミ箱への移動もできます。以前の管理者は編集可になりました。
    - Askセッションは所有者だけに表示され、共有できなくなりました。
    - 長い会議をより速く開けるようになり、文字起こしの読み込み中も戻るボタンなどがすぐに反応します。
    - 外部の録音機器や連携サービスが音声をアップロードするのに必要な値は、APIキー1つだけになりました。
    - Noteの更新後、開いているタブに再読み込みの案内が表示されます。
    - Filesからファイルをインポートするとき、そのファイルがすでにインポート済みかどうかを表示します。
  fullDescription: |
    Noteは、録音や動画を読んで再生できる文字起こしに変換します。誰がいつ話したかを示し、その後、会議の自動要約、文字起こしの翻訳、字幕の生成ができます。

    **主な機能**

    - 話者を分け、誰がいつ話したかを示します。
    - 単語単位の時刻付きで音声を文字起こしし、テキストと音声を同期させます。
    - 会議の要約を自動生成します。
    - 文字起こしを翻訳します。
    - 字幕を生成して書き出します。
    - ファイルアプリからファイルをインポートするか、ブラウザでアップロードします。

    このアプリは、RouterとこのOlaresにインストールされた音声モデルアプリを使用します。Routerが稼働している必要があり、必要な音声モデルとチャットモデルをインストールしておく必要があります。一度のインストールで、このOlaresの全員が利用できます。
