metadata:
  title: Note
  description: 自動要約、翻訳、字幕に対応した会議文字起こしアプリ

spec:
  upgradeDescription: |
    - Note 0.6.10 では初回セットアップを追加しました。管理者が Router と 6 つのモデルアプリを一度確認します（今回のアップグレード後も必要です）。完了するまで、ほかのメンバーには待機画面が表示されます。各ユーザーの初回利用時には短いオンボーディングがあります。モデルの状態表示をすべての画面で統一し、応答が失われてもアップロードやインポートで会議が二重に作成されなくなりました。議事録に ToDo の章がなくても ToDo を表示し、議事録テンプレートを複製できるようにし、画面全体の文言を見直しました。
  fullDescription: |
    Noteは、録音や動画を読んで再生できる文字起こしに変換します。誰がいつ話したかを示し、その後、会議の自動要約、文字起こしの翻訳、字幕の生成ができます。

    **主な機能**

    - 話者を分け、誰がいつ話したかを示します。
    - 単語単位の時刻付きで音声を文字起こしし、テキストと音声を同期させます。
    - 会議の要約を自動生成します。
    - 文字起こしを翻訳します。
    - 字幕を生成して書き出します。
    - ファイルアプリからファイルをインポートするか、ブラウザでアップロードします。

    このアプリは、RouterとこのOlaresにインストールされた音声モデルアプリを使用します。Routerが稼働している必要があり、必要な音声モデルとチャットモデルをインストールしておく必要があります。一度のインストールで、このOlaresの全員が利用できます。
