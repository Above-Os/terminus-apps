metadata:
  title: Note
  description: 自動要約、翻訳、字幕に対応した会議文字起こしアプリ

spec:
  fullDescription: |
    Noteは、録音や動画を読んで再生できる文字起こしに変換します。誰がいつ話したかを示し、その後、会議の自動要約、文字起こしの翻訳、字幕の生成ができます。

    **主な機能**

    - 話者を分け、誰がいつ話したかを示します。
    - 単語単位の時刻付きで音声を文字起こしし、テキストと音声を同期させます。
    - 会議の要約を自動生成します。
    - 文字起こしを翻訳します。
    - 字幕を生成して書き出します。
    - ファイルアプリからファイルをインポートするか、ブラウザでアップロードします。

    このアプリは、RouterとこのOlaresにインストールされた音声モデルアプリを使用します。Routerが稼働している必要があり、必要な音声モデルとチャットモデルをインストールしておく必要があります。一度のインストールで、このOlaresの全員が利用できます。
