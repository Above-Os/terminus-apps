metadata:
  title: Note
  description: 自動要約、翻訳、字幕に対応した会議文字起こしアプリ（独自アカウント付き）

spec:
  upgradeDescription: |
    - Note 0.6.21：セットアップ画面で音声認識と話者分離のモデルを切り替え、選んだモデルを確認できます。設定では未インストールのモデルを準備完了と表示しなくなり、新規インストールが Router に残ったモデルに固定されることもなく、ファイルサービスを使わない構成ではアップロード時にファイルサービスの警告も出なくなりました。
  fullDescription: |
    Noteは、録音や動画を読んで再生できる文字起こしに変換します。誰がいつ話したかを示し、その後、会議の自動要約、文字起こしの翻訳、字幕の生成ができます。

    **主な機能**

    - 話者を分け、誰がいつ話したかを示します。
    - 単語単位の時刻付きで音声を文字起こしし、テキストと音声を同期させます。
    - 会議の要約を自動生成します。
    - 文字起こしを翻訳します。
    - 字幕を生成して書き出します。
    - ブラウザでファイルをアップロードします。
    - Note独自のアカウントを使います。オーナーが管理者とメンバーを追加し、各自が自分のパスワードと任意の2段階認証でサインインします。

    このアプリは、RouterとこのOlaresにインストールされた音声モデルアプリを使用します。Routerが稼働している必要があり、必要な音声モデルとチャットモデルをインストールしておく必要があります。Olaresユーザーがそれぞれ自分用にインストールします。Olaresアカウントを持たない人も、オーナーが作成したアカウントで利用できます。ファイルアプリからのインポートとクラスタ内のエージェントAPIは利用できません。
