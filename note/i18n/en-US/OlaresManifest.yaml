metadata:
  title: Note
  description: Local meeting transcripts with speaker identities, glossary and cited AI answers

spec:
  fullDescription: |
    Note turns recordings into local, verifiable transcripts: who spoke, when each word was said, and which source passage supports an answer or action item. Personal and project glossaries keep important names consistent.

    **Key features**

    - Check local Router readiness before processing and recover interrupted stages.
    - Separate speakers, review voice identities, and label who spoke when.
    - Improve important names with personal and project glossaries.
    - Transcribe speech with word-level timings so text and audio stay in sync.
    - Ask questions with answers linked back to transcript evidence and timestamps.
    - Track structured action items with owners, due dates, status, and sources.
    - Optionally generate versioned summaries, translations, and subtitles.
    - Import a file from Files or upload it in the browser.

    This app uses Router and the model applications installed on this Olares. Router must be running, with local speech recognition, diarization, speaker embedding, and forced alignment models available for a complete transcript. Chat and translation models are optional. One install serves everyone on this Olares.
