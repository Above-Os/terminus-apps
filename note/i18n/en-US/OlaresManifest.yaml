metadata:
  title: Note
  description: A meeting transcription app with automatic summaries, translation, and subtitles

spec:
  fullDescription: |
    Note turns a recording or video into a transcript you can read and replay. It labels who spoke and when, then can automatically summarize the meeting, translate the transcript, and generate subtitles.

    **Key features**

    - Separate speakers and label who spoke when.
    - Transcribe speech with word-level timings so the text stays in sync with the audio.
    - Automatically generate a meeting summary.
    - Translate the transcript.
    - Generate and export subtitles.
    - Import a file from Files or upload it in the browser.

    This app uses Router and the audio model applications installed on this Olares. Router must be running, and the needed speech and chat models must be installed. One install serves everyone on this Olares.
