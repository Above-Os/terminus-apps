metadata:
  title: Note
  description: Turn recordings and videos into transcripts you can read, replay and export

spec:
  fullDescription: |
    ## Overview
    Note turns a recording into a transcript you can read: who spoke, when each
    word was said, what it means in another language, and what the meeting
    decided. Click any sentence and the player jumps to that second.

    ## Highlights
    - Speaker diarization, with speakers you can rename
    - Transcription with word-level alignment, so text and audio stay in sync
    - Translation and meeting summaries (decisions, sections, action items)
    - Import from your own Olares drive through Files, or upload from the browser
    - Export transcripts and subtitles in several formats

    ## How AI is wired
    Every model call goes through Olares Router to the audio model applications
    installed on this Olares — nothing is sent to a third party and no API key
    is needed. The app authenticates with its platform-issued identity.

    ## Requirements
    - Olares >= 1.12.6
    - Router installed and running
    - Audio model applications for diarization, speech recognition and forced
      alignment, plus a chat model for translation and summaries
    - Architecture: amd64, arm64
