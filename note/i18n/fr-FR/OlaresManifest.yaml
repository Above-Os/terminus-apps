metadata:
  title: Note
  description: Une application de transcription de réunions avec résumés automatiques, traduction et sous-titres

spec:
  upgradeDescription: |
    - Le partage compte désormais trois rôles : Propriétaire, Peut modifier et Peut consulter. Les personnes qui peuvent modifier peuvent aussi partager, déplacer, retraiter les réunions et les placer dans la corbeille. Les anciens gestionnaires ont désormais le rôle Peut modifier.
    - Les sessions Ask ne sont plus visibles que par leur propriétaire et ne peuvent plus être partagées.
    - Les longues réunions s'ouvrent plus vite, et le bouton Retour comme les autres boutons répondent pendant le chargement de la transcription.
    - Une clé API est désormais la seule valeur dont un enregistreur ou une intégration externe a besoin pour envoyer de l'audio.
    - Un onglet ouvert propose une actualisation après la mise à jour de Note.
    - Lors d'une importation depuis Files, Note indique si le fichier a déjà été importé.
  fullDescription: |
    Note transforme un enregistrement ou une vidéo en une transcription que l'on peut lire et réécouter. Il indique qui a parlé et à quel moment, puis peut résumer automatiquement la réunion, traduire la transcription et générer des sous-titres.

    **Fonctionnalités principales**

    - Distinguer les locuteurs et indiquer qui a parlé et quand.
    - Transcrire la parole avec un minutage au niveau des mots, pour que le texte reste synchronisé avec l'audio.
    - Générer automatiquement un résumé de réunion.
    - Traduire la transcription.
    - Générer et exporter des sous-titres.
    - Importer un fichier depuis Fichiers ou le téléverser dans le navigateur.

    Cette application utilise Router et les applications de modèles audio installées sur cet Olares. Router doit être en cours d'exécution, et les modèles vocaux et de chat nécessaires doivent être installés. Une seule installation sert toutes les personnes de cet Olares.
