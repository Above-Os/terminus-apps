metadata:
  title: Note
  description: Une application de transcription de réunions avec résumés automatiques, traduction et sous-titres, avec ses propres comptes

spec:
  upgradeDescription: |
    - Note 0.6.21 : sur la page d’installation, vous pouvez changer les modèles de reconnaissance vocale et de séparation des locuteurs et vérifier ceux que vous avez choisis. Les réglages ne présentent plus comme prêt un modèle non installé, une nouvelle installation n’est plus bloquée sur des modèles Router restants, et les envois n’avertissent plus pour Fichiers quand cette installation ne s’en sert pas.
  fullDescription: |
    Note transforme un enregistrement ou une vidéo en une transcription que l'on peut lire et réécouter. Il indique qui a parlé et à quel moment, puis peut résumer automatiquement la réunion, traduire la transcription et générer des sous-titres.

    **Fonctionnalités principales**

    - Distinguer les locuteurs et indiquer qui a parlé et quand.
    - Transcrire la parole avec un minutage au niveau des mots, pour que le texte reste synchronisé avec l'audio.
    - Générer automatiquement un résumé de réunion.
    - Traduire la transcription.
    - Générer et exporter des sous-titres.
    - Téléverser un fichier dans le navigateur.
    - Utiliser les comptes propres à Note : le propriétaire ajoute des administrateurs et des membres, chacun avec son mot de passe et une connexion en deux étapes facultative.

    Cette application utilise Router et les applications de modèles audio installées sur cet Olares. Router doit être en cours d'exécution, et les modèles vocaux et de chat nécessaires doivent être installés. Chaque utilisateur d'Olares installe sa propre copie, et les personnes sans compte Olares peuvent l'utiliser avec un compte créé par son propriétaire. L'import depuis Fichiers et l'API d'agent interne au cluster ne sont pas disponibles.
