metadata:
  title: Note
  description: 支持说话人身份、名词库和 AI 纪要的本地会议转写，自带账号体系

spec:
  upgradeDescription: |
    - Note 0.6.21：引导页可直接更换语音识别和说话人分离模型，并按所选模型检查。设置页不再把未安装的模型显示为就绪，新装不再被 Router 里残留模型锁死，没有文件服务的安装上传时也不再提示文件服务不可用。
  fullDescription: |
    Note 将录音转成本地、可验证的文字稿：谁在说话、每个词出现的时间，以及行动项依据了哪段原文。个人和项目名词库能让重要名称保持一致。

    **主要功能**

    - 处理前检查本地 Router 状态，并能从中断的阶段恢复。
    - 区分说话人、复核声音身份，并标注各自的发言时间。
    - 通过个人和项目名词库提升人名、产品名和术语的准确性。
    - 转写语音并做词级时间对齐，使文字与音频保持同步。
    - 用独立行动项跟踪负责人、截止时间、状态和来源。
    - 可选生成有版本记录的摘要、翻译和字幕。
    - 在浏览器中上传文件。
    - 使用 Note 自己的账号：所有者可以添加管理员和普通用户，每人有自己的密码，可开启两步验证。
    - 创建个人 API Key，供外部设备安全上传音频并查询处理进度。

    本应用通过 Router 使用这台 Olares 上已安装的模型应用。Router 必须处于运行状态；完整文字稿需要本地语音识别、人声分离、人声指纹和强制对齐模型。对话与翻译模型是可选能力。每位 Olares 用户各自安装一份；没有 Olares 账号的人，也可以用所有者创建的账号使用。不支持从文件管理器导入，也不提供集群内的 Agent API。
