metadata:
  title: Note
  description: 支持说话人身份、名词库和 AI 纪要的本地会议转写

spec:
  upgradeDescription: |
    - Note 0.6.10 新增首次配置：管理员确认一次 Router 和六个模型应用（这次升级后也需要），完成前其他成员会看到等待页；每位用户首次使用时有简短引导。各页面的模型状态说法统一；回复丢失时，上传和导入不再多建一场会议；纪要没有待办章节时也会显示待办；纪要模板可以复制；全界面文案统一修订。
  fullDescription: |
    Note 将录音转成本地、可验证的文字稿：谁在说话、每个词出现的时间，以及行动项依据了哪段原文。个人和项目名词库能让重要名称保持一致。

    **主要功能**

    - 处理前检查本地 Router 状态，并能从中断的阶段恢复。
    - 区分说话人、复核声音身份，并标注各自的发言时间。
    - 通过个人和项目名词库提升人名、产品名和术语的准确性。
    - 转写语音并做词级时间对齐，使文字与音频保持同步。
    - 用独立行动项跟踪负责人、截止时间、状态和来源。
    - 可选生成有版本记录的摘要、翻译和字幕。
    - 从文件管理器导入文件，或在浏览器中上传。
    - 创建个人 API Key，供外部设备安全上传音频并查询处理进度。

    本应用通过 Router 使用这台 Olares 上已安装的模型应用。Router 必须处于运行状态；完整文字稿需要本地语音识别、人声分离、人声指纹和强制对齐模型。对话与翻译模型是可选能力。一次安装可供这台 Olares 上的所有人使用。
