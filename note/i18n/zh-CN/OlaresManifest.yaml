metadata:
  title: Note
  description: 把录音和视频转成能读、能播、能导出的文字稿

spec:
  fullDescription: |
    ## 这是什么
    Note 把一段录音变成一份能读的稿子：谁说的、每个词是在第几秒说的、
    换一种语言是什么意思、这场会定下了什么。点稿子里任何一句话，
    播放器就跳到那一秒。

    ## 能做什么
    - 说话人分离，认出来的人可以改名
    - 转写并做词级对齐，所以文字和声音是对得上的
    - 翻译，以及会议纪要（结论 / 章节 / 待办）
    - 经 Files 从自己的 Olares 网盘导入，也可以从浏览器上传
    - 稿子和字幕可以导出成多种格式

    ## AI 能力从哪来
    每一次模型调用都经 Olares Router 打到这台 Olares 上装着的音频模型应用
    ——不发给任何第三方，也不用填任何密钥。身份用的是平台签发的应用凭据。

    ## 需要什么
    - Olares >= 1.12.6
    - 装好并跑着 Router
    - 说话人分离、语音识别、强制对齐这三类音频模型应用，
      以及一个用来翻译和写纪要的对话模型
    - 架构：amd64、arm64
