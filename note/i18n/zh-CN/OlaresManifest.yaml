metadata:
  title: Note
  description: 把录音和视频转成能读、能播、能导出的文字稿

spec:
  fullDescription: |
    ## 这是什么
    Note 把录音和视频转成能读、能播、能导出的文字稿。
    点稿子里任何一句话，播放器就跳到那一秒。

    ## 能做什么
    - 转写，并做词级对齐，所以文字和声音是对得上的
    - 说话人分离，认出来的人可以改名
    - 会议纪要（结论 / 章节 / 待办）和翻译
    - 从自己的 Olares 网盘导入，也可以从浏览器上传
    - 稿子和字幕可以一次导出多种格式

    ## AI 能力从哪来
    全部经 Olares Router 调用——不自带模型，也不用填任何密钥。
    身份用的是平台签发的应用凭据。

    ## 运行要求
    - Olares >= 1.12.6
    - 已安装并运行 Router
    - 架构：amd64
