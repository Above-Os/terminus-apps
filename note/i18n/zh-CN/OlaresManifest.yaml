metadata:
  title: Note
  description: 带自动摘要、翻译和字幕的会议转写应用

spec:
  fullDescription: |
    Note 可将录音或视频转成能阅读和回放的文字稿。它会标出谁在说话以及发言时间，然后可以自动生成会议摘要、翻译文字稿，并生成字幕。

    **主要功能**

    - 区分说话人，并标注各自的发言时间。
    - 转写语音，并用词级时间对齐，使文字与音频保持同步。
    - 自动生成会议摘要。
    - 翻译文字稿。
    - 生成并导出字幕。
    - 从文件管理器导入文件，或在浏览器中上传。

    本应用通过 Router 使用本机已安装的音频模型应用。Router 必须处于运行状态，并且需要先安装相应的语音和对话模型。一次安装可供这台 Olares 上的所有人使用。
