metadata:
  title: Note
  description: 支持说话人身份、名词库和可追溯问答的本地会议转写

spec:
  upgradeDescription: |
    - 共享权限改为所有者、可编辑、可查看三级。可编辑的成员现在也能共享、移动、重新处理会议，以及把会议移入回收站。原来的「可管理」成员变为可编辑。
    - Ask 会话改为仅所有者可见，不能再共享。
    - 长会议打开更快，转写加载期间返回键等按钮也能立即响应。
    - 外部录音设备或集成上传音频时，只需要一个 API Key。
    - Note 更新后，已打开的页面会提示刷新。
    - 从文件管理器导入文件时，会提示该文件是否已导入过。
  fullDescription: |
    Note 将录音转成本地、可验证的文字稿：谁在说话、每个词出现的时间，以及问答和行动项依据了哪段原文。个人和项目名词库能让重要名称保持一致。

    **主要功能**

    - 处理前检查本地 Router 状态，并能从中断的阶段恢复。
    - 区分说话人、复核声音身份，并标注各自的发言时间。
    - 通过个人和项目名词库提升人名、产品名和术语的准确性。
    - 转写语音并做词级时间对齐，使文字与音频保持同步。
    - 针对单份记录提问，回答附带可跳转的原文和时间戳。
    - 用独立行动项跟踪负责人、截止时间、状态和来源。
    - 可选生成有版本记录的摘要、翻译和字幕。
    - 从文件管理器导入文件，或在浏览器中上传。
    - 创建个人 API Key，供外部设备安全上传音频并查询处理进度。

    本应用通过 Router 使用这台 Olares 上已安装的模型应用。Router 必须处于运行状态；完整文字稿需要本地语音识别、人声分离、人声指纹和强制对齐模型。对话与翻译模型是可选能力。一次安装可供这台 Olares 上的所有人使用。
