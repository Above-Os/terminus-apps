metadata:
  title: Note
  description: Una aplicación de transcripción de reuniones con resúmenes automáticos, traducción y subtítulos

spec:
  upgradeDescription: |
    - Note 0.6.10 añade una configuración inicial: un administrador confirma una vez Router y las seis aplicaciones de modelos, también después de esta actualización, y los demás miembros esperan hasta que termine. Cada persona recibe una breve introducción. El estado de los modelos se muestra igual en todas las pantallas, una subida o importación ya no crea una segunda reunión cuando se pierde una respuesta, las tareas aparecen aunque el acta no tenga sección de tareas, las plantillas de acta se pueden copiar y los textos de la interfaz están unificados.
  fullDescription: |
    Note convierte una grabación o un vídeo en una transcripción que se puede leer y reproducir. Indica quién habló y cuándo, y después puede resumir automáticamente la reunión, traducir la transcripción y generar subtítulos.

    **Funciones principales**

    - Separar a los hablantes e indicar quién habló y cuándo.
    - Transcribir el habla con tiempos a nivel de palabra para que el texto siga sincronizado con el audio.
    - Generar automáticamente un resumen de la reunión.
    - Traducir la transcripción.
    - Generar y exportar subtítulos.
    - Importar un archivo desde Archivos o subirlo en el navegador.

    Esta aplicación usa Router y las aplicaciones de modelos de audio instaladas en este Olares. Router debe estar en ejecución y hay que instalar los modelos de voz y de chat necesarios. Una sola instalación sirve a todas las personas de este Olares.
