metadata:
  title: Note
  description: Una aplicación de transcripción de reuniones con resúmenes automáticos, traducción y subtítulos, con cuentas propias

spec:
  upgradeDescription: |
    - Note 0.6.20: con MOSS-Transcribe-Diarize, cada frase se queda con la persona que la dijo; cuando dos hablantes se suceden muy de cerca, ninguna palabra pasa ya al otro hablante ni se corta por la mitad.
  fullDescription: |
    Note convierte una grabación o un vídeo en una transcripción que se puede leer y reproducir. Indica quién habló y cuándo, y después puede resumir automáticamente la reunión, traducir la transcripción y generar subtítulos.

    **Funciones principales**

    - Separar a los hablantes e indicar quién habló y cuándo.
    - Transcribir el habla con tiempos a nivel de palabra para que el texto siga sincronizado con el audio.
    - Generar automáticamente un resumen de la reunión.
    - Traducir la transcripción.
    - Generar y exportar subtítulos.
    - Subir un archivo en el navegador.
    - Usar las cuentas propias de Note: el propietario añade administradores y miembros, cada uno con su contraseña y un inicio de sesión en dos pasos opcional.

    Esta aplicación usa Router y las aplicaciones de modelos de audio instaladas en este Olares. Router debe estar en ejecución y hay que instalar los modelos de voz y de chat necesarios. Cada usuario de Olares instala su propia copia, y las personas sin cuenta de Olares pueden usarla con una cuenta creada por su propietario. La importación desde Archivos y la API de agentes interna del clúster no están disponibles.
