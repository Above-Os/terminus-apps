apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: note
  appid: note
  title: Note
  description: Local meeting transcripts with speaker identities, glossary and cited AI answers
  icon: https://app.cdn.olares.com/appstore/note/icon.png
  version: 0.6.7
  categories:
    - Utilities_v112
    - AI
spec:
  onlyAdmin: true
  versionName: "0.6.7"
  runAsUser: true
  fullDescription: |
    ## Overview
    Note turns recordings into local, verifiable transcripts: who spoke, when
    each word was said, and which source passage supports an answer or action
    item. Personal and project glossaries keep important names consistent.

    Every model call goes through Olares Router to the audio model
    applications installed on this Olares — nothing is sent to a third party.
    Personal API keys are only needed when an external recorder or integration
    uploads audio through Note's restricted upload API.

    ## Pipeline
    1. Extract and normalise the audio (ffmpeg), then chunk it
    2. Run diarization and speech recognition
    3. Review speaker evidence and voice identities
    4. Forced alignment — word-level timings
    5. Optionally create summaries, translations and cited answers

    ## Requirements
    - Olares >= 1.12.7
    - Router installed and running
    - Local model applications for speech recognition, diarization, speaker
      embeddings and forced alignment
    - A dedicated translation model when translation is enabled
    - A chat model when minutes or Ask are used
    - Arch: amd64, arm64
  developer: pengpeng
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  requiredCpu: 500m
  limitedCpu: "4"
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
  limitedDisk: 100Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
entrances:
  - name: note
    host: note-svc
    port: 8080
    title: Note
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    authLevel: private
    openMethod: window
  - name: note-api
    host: note-svc
    port: 8081
    title: Note Upload API
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    authLevel: public
    invisible: true
options:
  shared: true
  # The entrance proxy cuts every request at 15s by default, which would kill
  # both the progress event stream and any upload larger than a short clip.
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
middleware:
  postgres:
    username: note
    password: note
    databases:
      - name: note
        distributed: false
workloadReplicas:
  note: 1
