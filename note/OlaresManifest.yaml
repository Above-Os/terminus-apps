apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: note
  appid: note
  title: Note
  description: Local meeting transcripts with speaker identities, glossary and AI minutes
  icon: https://app.cdn.olares.com/appstore/note/icon.png
  version: 0.6.13
  categories:
  - workspace  

spec:
  onlyAdmin: true
  versionName: "0.6.13"
  runAsUser: true
  upgradeDescription: |
    - Note 0.6.13: members of a shared installation can now import recordings from their own Files.
  fullDescription: |
    Note turns recordings into local, verifiable transcripts: who spoke, when each word was said, and which source passage supports an action item. Personal and project glossaries keep important names consistent.

    **Key features**

    - Check local Router readiness before processing and recover interrupted stages.
    - Separate speakers, review voice identities, and label who spoke when.
    - Improve important names with personal and project glossaries.
    - Transcribe speech with word-level timings so text and audio stay in sync.
    - Track structured action items with owners, due dates, status, and sources.
    - Optionally generate versioned summaries, translations, and subtitles.
    - Import a file from Files or upload it in the browser.
    - Create personal API keys for restricted external audio uploads and progress checks.

    This app uses Router and the model applications installed on this Olares. Router must be running, with local speech recognition, diarization, speaker embedding, and forced alignment models available for a complete transcript. Chat and translation models are optional. One install serves everyone on this Olares.
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 500m
  limitedCpu: "4"
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
  limitedDisk: 100Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  userData:
    - Home
entrances:
  - name: note
    host: note-svc
    port: 8080
    title: Note
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    authLevel: private
    openMethod: window
  - name: note-api
    host: note-svc
    port: 8081
    title: Note Upload API
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    authLevel: public
    invisible: true
sharedEntrances:
  - name: noteagents
    host: sharedentrances-note
    port: 0
    title: Note Agent API
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    invisible: true
    authLevel: internal
options:
  shared: true
  # The entrance proxy cuts every request at 15s by default, which would kill
  # both the progress event stream and any upload larger than a short clip.
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
    - name: router
      version: '>=1.0.0-0'
      type: application
      mandatory: true
    - name: audioqwen3asrv3
      version: '>=1.0.21-0'
      type: application
      mandatory: true
    - name: audionemotrondiarv3
      version: '>=1.0.0-0'
      type: application
      mandatory: true
    - name: audiopyannoteembedv3
      version: '>=1.0.0-0'
      type: application
      mandatory: true
    - name: audioqwenalignerv3
      version: '>=1.0.0-0'
      type: application
      mandatory: true
    - name: audiosilerovadv3
      version: '>=1.0.0-0'
      type: application
      mandatory: true
    - name: llamacpphymt218bggufv3
      version: '>=1.0.0-0'
      type: application
      mandatory: true
middleware:
  postgres:
    username: note
    password: note
    databases:
      - name: note
        distributed: false
workloadReplicas:
  note: 1
