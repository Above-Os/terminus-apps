apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: note
  appid: note
  title: Note
  description: Local meeting transcripts with speaker identities, glossary and AI minutes, with its own accounts
  icon: https://app.cdn.olares.com/appstore/note/icon.png
  version: 0.6.21
  categories:
  - workspace  

spec:
  versionName: "0.6.21"
  runAsUser: true
  upgradeDescription: |
    - Note 0.6.21: On the setup page you can change the speech recognition and speaker separation models and check the ones you chose. Settings no longer shows an uninstalled model as ready, a new install is no longer locked to leftover Router models, and uploads no longer warn about Files when this installation does not use it.
  fullDescription: |
    Note turns recordings into local, verifiable transcripts: who spoke, when each word was said, and which source passage supports an action item. Personal and project glossaries keep important names consistent.

    **Key features**

    - Check local Router readiness before processing and recover interrupted stages.
    - Separate speakers, review voice identities, and label who spoke when.
    - Improve important names with personal and project glossaries.
    - Transcribe speech with word-level timings so text and audio stay in sync.
    - Track structured action items with owners, due dates, status, and sources.
    - Optionally generate versioned summaries, translations, and subtitles.
    - Upload a file in the browser.
    - Keep Note's own accounts: the owner adds admins and members, each with their own password and optional two-factor sign-in.
    - Create personal API keys for restricted external audio uploads and progress checks.

    This app uses Router and the model applications installed on this Olares. Router must be running, with local speech recognition, diarization, speaker embedding, and forced alignment models available for a complete transcript. Chat and translation models are optional. Each Olares user installs their own copy, and people without an Olares account can use it with an account from its owner. Importing from Files and the in-cluster agent API are not available.
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 500m
  limitedCpu: "4"
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
  limitedDisk: 100Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
entrances:
  - name: note
    host: note-svc
    port: 8080
    title: Note
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    # Note's own sign-in guards it; an Olares login in front would ask
    # people without an Olares account for one.
    authLevel: public
    openMethod: window
  - name: note-api
    host: note-svc
    port: 8081
    title: Note Upload API
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    authLevel: public
    invisible: true
options:
  # The entrance proxy cuts every request at 15s by default, which would kill
  # both the progress event stream and any upload larger than a short clip.
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.8-0'
      type: system
    - name: router
      version: '>=1.0.0-0'
      type: application
      mandatory: true
    - name: audioqwen3asrv3
      version: '>=1.0.21-0'
      type: application
      mandatory: false
    - name: audionemotrondiarv3
      version: '>=1.0.0-0'
      type: application
      mandatory: false
    - name: audiopyannoteembedv3
      version: '>=1.0.0-0'
      type: application
      mandatory: false
    - name: audioqwenalignerv3
      version: '>=1.0.0-0'
      type: application
      mandatory: false
    - name: audiosilerovadv3
      version: '>=1.0.0-0'
      type: application
      mandatory: false
    - name: llamacpphymt218bggufv3
      version: '>=1.0.0-0'
      type: application
      mandatory: false
middleware:
  postgres:
    username: note
    password: note
    databases:
      - name: note
        distributed: false
workloadReplicas:
  note: 1
