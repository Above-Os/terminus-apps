apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: note
  appid: note
  title: Note
  description: A meeting transcription app with automatic summaries, translation, and subtitles
  icon: https://app.cdn.olares.com/appstore/note/icon.png
  version: 0.4.13
  categories:
    - Utilities_v112
    - AI
spec:
  onlyAdmin: true
  versionName: "0.4.12"
  runAsUser: true
  fullDescription: |
    Note turns a recording or video into a transcript you can read and replay. It labels who spoke and when, then can automatically summarize the meeting, translate the transcript, and generate subtitles.

    **Key features**

    - Separate speakers and label who spoke when.
    - Transcribe speech with word-level timings so the text stays in sync with the audio.
    - Automatically generate a meeting summary.
    - Translate the transcript.
    - Generate and export subtitles.
    - Import a file from Files or upload it in the browser.

    This app uses Router and the audio model applications installed on this Olares. Router must be running, and the needed speech and chat models must be installed. One install serves everyone on this Olares.
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 500m
  limitedCpu: "4"
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
  limitedDisk: 100Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  userData:
    - Home
entrances:
  - name: note
    host: note-svc
    port: 8080
    title: Note
    icon: https://app.cdn.olares.com/appstore/note/icon.png
    authLevel: private
    openMethod: window
options:
  shared: true
  # The entrance proxy cuts every request at 15s by default, which would kill
  # both the progress event stream and any upload larger than a short clip.
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
middleware:
  postgres:
    username: note
    password: note
    databases:
      - name: note
        distributed: false
workloadReplicas:
  note: 1
