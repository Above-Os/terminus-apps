image: docker.io/beclab/note:0.6.21
imagePullPolicy: IfNotPresent

# What Router's usage names this app by; the manifest's appid.
appId: note

bfl:
  username: owner

# The installing admin's zone. app-service overwrites it; the default is only
# so that a local `helm template` renders, and only its domain part is read.
user:
  zone: owner.olares.com

# Each entrance's host under the installing admin's zone, keyed by entrance
# name. app-service overwrites it; the default is only so that a local
# `helm template` renders, and only the first label is read.
domain:
  note-api: aad653ca1.owner.olares.com

postgres:
  host: postgres
  port: 5432
  username: note
  password: note
  databases:
    note: note

userspace:
  appData: /tmp/note

# Recording from devices plugged into or paired with the box: two switches,
# side by side. USB is off by default, Bluetooth on. With neither, Note
# records from the browser's microphone only.
capture:
  # USB speakerphones and microphones. It mounts the host's /dev/snd and runs
  # the container privileged, because the device cgroup gives an unprivileged
  # container no sound devices; Olares 1.12.8's device.audio workload option
  # is the way to drop that once boxes run it. audioGroup is the host's audio
  # group id (29 on Ubuntu), which owns the device nodes.
  usb:
    enabled: false
    audioGroup: 29
  # Bluetooth headsets and speakerphones that can take calls. Pairing from the
  # record dialog talks to BlueZ through the proxy Olares injects into a
  # workload whose manifest allows the bluetooth capability, read from
  # DBUS_SYSTEM_BUS_ADDRESS. Audio goes through the host's sound server
  # (PipeWire, or PulseAudio on older hosts), not /dev/snd, so Note itself
  # needs no privilege: a root sidecar, pulse-relay, reaches it through
  # /run/olares-audio/pulse and /run/user. PipeWire takes the relay's
  # connections; PulseAudio itself refuses them, since it authenticates a
  # client by credentials or cookie and the relay passes neither. Which user
  # runs the sound server is the host's business, not this chart's.
  # On by default: a package installed from the market cannot have its values
  # changed, so off would leave every such install without Bluetooth for
  # good, while a host without the proxy or a sound server only lists no
  # devices (the mounts are DirectoryOrCreate).
  bluetooth:
    enabled: true

# Switches a preview installation turns on to measure or debug itself. Off in
# every released installation, and nothing here is a product feature waiting
# to be enabled.
devTools:
  # Keep performance records: how long a screen took to appear for whoever
  # opened it, how each API route behaved, and the results of measurement
  # runs, in a schema of their own. On, the records hold who visited and from
  # which address, which is only acceptable where the people recorded are the
  # people testing. Off, no table is created and the routes that report and
  # read them answer 404.
  perf:
    enabled: false
  # How much of what belongs to the people using Note the log may carry:
  #   off         every released installation; the log says only how much
  #               was left out.
  #   diagnostic  internal testing: other services' failure messages, drive
  #               paths and addresses. Not what a model wrote.
  #   full        a preview whose users are the testers: model output and
  #               whole bodies other services sent back as well.
  logContent:
    level: "off"
  # How much the log says: error, warning, info, debug or verbose. Empty is info.
  logLevel: ""

workloads:
  note:
    # Must stay 1; the chart refuses anything else (templates/deployment.yaml).
    replicaCount: 1

# One GPU consumer, because Olares time-slices the accelerator across the
# audio model applications: a second concurrent stage would contend for VRAM
# rather than finish sooner.
workers:
  cpu: 3
  gpu: 1

diarization:
  # evidence_v3 uses the engine's frame-support reconstruction and audit trail;
  # evidence_v2 remains the interval-based rollback policy.
  postprocessStrategy: evidence_v3
