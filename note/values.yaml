image: docker.io/beclab/note:0.4.16
imagePullPolicy: IfNotPresent

bfl:
  username: owner

# The installing admin's zone. app-service overwrites it; the default is only
# so that a local `helm template` renders, and only its domain part is read.
user:
  zone: owner.olares.com

postgres:
  host: postgres
  port: 5432
  username: note
  password: note
  databases:
    note: note

userspace:
  appData: /tmp/note

workloads:
  note:
    replicaCount: 1

# One GPU consumer, because Olares time-slices the accelerator across the
# audio model applications: a second concurrent stage would contend for VRAM
# rather than finish sooner.
workers:
  cpu: 3
  gpu: 1
