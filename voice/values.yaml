image: docker.io/beclab/voice:0.4.26
imagePullPolicy: IfNotPresent

postgres:
  host: postgres
  port: 5432
  username: voice
  password: ""
  databases:
    voice: voice

userspace:
  appData: /tmp/voice

workloads:
  voice:
    replicaCount: 1

# Release charts stay false. A local upload package may set hotReload true;
# market upgrade keeps the values from the first install.
dev:
  hotReload: false
  sourceSubPath: devsrc
