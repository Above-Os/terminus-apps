apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: voice
  appid: voice
  title: Voice
  description: A text-to-speech app for creating voices and reading text aloud
  icon: https://cdn.olares.com/images/2026/09/82a709dec6a0298f470af4c9e33de228.png
  version: 0.4.24
  categories:
    - Utilities_v112
    - agent
spec:
  versionName: "0.4.22"
  runAsUser: true
  fullDescription: |
    Voice turns written text into spoken audio. You can generate speech from a script, clone a voice, or design a new voice. Requests go through Router to a text-to-speech model on this Olares or from a connected cloud provider.

    **Key features**

    - Turn written text into spoken audio.
    - Clone a voice.
    - Design a new voice.
    - Choose a text-to-speech model configured in Router.

    Router must be running, and at least one text-to-speech model must be available in Router. Voice does not install those models itself.
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 250m
  limitedCpu: "2"
  requiredMemory: 256Mi
  limitedMemory: 2Gi
  requiredDisk: 1Gi
  limitedDisk: 20Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
entrances:
  - name: voice
    host: voice-svc
    port: 8430
    title: Voice
    icon: https://cdn.olares.com/images/2026/09/82a709dec6a0298f470af4c9e33de228.png
    authLevel: private
    openMethod: window
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
middleware:
  postgres:
    username: voice
    databases:
      - name: voice
        distributed: false
workloadReplicas:
  voice: 1
