metadata:
  title: Voice
  description: Eine Text-zu-Sprache-App zum Erstellen von Stimmen und Vorlesen von Text

spec:
  fullDescription: |
    Voice macht aus geschriebenem Text gesprochene Audio. Es kann Sprache aus einem Skript erzeugen, eine Stimme aus einer Aufnahme klonen oder eine neue Stimme entwerfen. Anfragen laufen über Router zu einem Text-zu-Sprache-Modell auf diesem Olares oder einem verbundenen Cloud-Anbieter.

    **Hauptfunktionen**

    - Geschriebenen Text in gesprochene Audio umwandeln.
    - Eine Stimme aus einer Referenzaufnahme klonen.
    - Eine neue Stimme aus einer Beschreibung entwerfen.
    - Ein in Router konfiguriertes Text-zu-Sprache-Modell wählen.

    Router muss laufen, und in Router muss mindestens ein Text-zu-Sprache-Modell verfügbar sein. Voice installiert diese Modelle nicht selbst.
