metadata:
  title: Voice
  description: Un'app di sintesi vocale per creare voci e leggere il testo ad alta voce

spec:
  fullDescription: |
    Voice trasforma il testo scritto in audio parlato. Si può generare il parlato da uno script, clonare una voce o progettare una voce nuova. Le richieste passano da Router a un modello di sintesi vocale su questo Olares o a un provider cloud collegato.

    **Funzionalità principali**

    - Trasformare il testo scritto in audio parlato.
    - Clonare una voce.
    - Progettare una voce nuova.
    - Scegliere un modello di sintesi vocale configurato in Router.

    Router deve essere in esecuzione e in Router deve essere disponibile almeno un modello di sintesi vocale. Voice non installa questi modelli da solo.
