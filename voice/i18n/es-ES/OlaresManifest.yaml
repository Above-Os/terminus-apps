metadata:
  title: Voice
  description: Una aplicación de síntesis de voz para crear voces y leer texto en voz alta

spec:
  fullDescription: |
    Voice convierte texto escrito en audio hablado. Se puede generar voz a partir de un guion, clonar una voz o diseñar una voz nueva. Las solicitudes pasan por Router a un modelo de texto a voz en este Olares o a un proveedor en la nube conectado.

    **Funciones principales**

    - Convertir texto escrito en audio hablado.
    - Clonar una voz.
    - Diseñar una voz nueva.
    - Elegir un modelo de texto a voz configurado en Router.

    Router debe estar en ejecución y en Router debe haber al menos un modelo de texto a voz disponible. Voice no instala esos modelos por sí mismo.
