metadata:
  title: Voice
  description: 音声を作成しテキストを読み上げる音声合成アプリ

spec:
  fullDescription: |
    Voiceは、書かれたテキストを音声に変換します。原稿から音声を生成する、音声をクローンする、新しい音声を設計することができます。リクエストはRouter経由で、このOlares上の音声合成モデル、または接続済みのクラウドプロバイダーに送られます。

    **主な機能**

    - 書かれたテキストを音声に変換します。
    - 音声をクローンします。
    - 新しい音声を設計します。
    - Routerに設定された音声合成モデルを選びます。

    Routerが稼働している必要があり、Routerで少なくとも1つの音声合成モデルが利用できる必要があります。Voiceはこれらのモデルを自分ではインストールしません。
