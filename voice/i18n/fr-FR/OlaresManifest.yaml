metadata:
  title: Voice
  description: Une application de synthèse vocale pour créer des voix et lire du texte à voix haute

spec:
  fullDescription: |
    Voice transforme du texte écrit en parole. On peut générer de la voix à partir d'un script, cloner une voix, ou concevoir une nouvelle voix. Les requêtes passent par Router vers un modèle de synthèse vocale sur cet Olares ou un fournisseur cloud connecté.

    **Fonctionnalités principales**

    - Transformer du texte écrit en parole.
    - Cloner une voix.
    - Concevoir une nouvelle voix.
    - Choisir un modèle de synthèse vocale configuré dans Router.

    Router doit être en cours d'exécution, et au moins un modèle de synthèse vocale doit être disponible dans Router. Voice n'installe pas ces modèles lui-même.
