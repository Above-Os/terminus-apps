metadata:
  title: Voice
  description: 用于创建音色并朗读文本的语音合成应用

spec:
  fullDescription: |
    Voice 可将书面文本转换成语音。可以根据文稿生成语音、克隆音色，或设计新音色。请求经 Router 发到本机的文本转语音模型，或已接入的云端服务。

    **主要功能**

    - 将书面文本转换成语音。
    - 克隆音色。
    - 设计新音色。
    - 选择在 Router 中已配置的文本转语音模型。

    Router 必须处于运行状态，并且其中至少要有一个可用的文本转语音模型。Voice 不会自行安装这些模型。
