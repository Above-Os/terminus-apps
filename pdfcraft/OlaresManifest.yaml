apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: pdfcraft
  appid: pdfcraft
  title: PdfCraft
  description: Acrobat-style PDF workbench that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/pdfcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.pdfcraft.png
  version: 0.1.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/PdfCraft/
spec:
  versionName: "0.8.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    PdfCraft is an open-source, Acrobat-comparable PDF workbench written in
    Rust: view, annotate, edit, organize, fill forms, sign and export PDFs.
    This app serves its WebAssembly build: everything runs in your browser,
    and documents never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs PdfCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/PdfCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/pdfcraft
  sourceCode: https://github.com/beclab/pdfcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/pdfcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "3"
  requiredMemory: 256Mi
  limitedMemory: 3584Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: pdfcraft
    host: pdfcraft-svc
    port: 8080
    title: PdfCraft
    icon: https://raw.githubusercontent.com/beclab/pdfcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.pdfcraft.png
    authLevel: private
    openMethod: window
  - name: pdfcraftmcp
    host: pdfcraft-svc
    port: 8090
    title: PdfCraft MCP
    icon: https://raw.githubusercontent.com/beclab/pdfcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.pdfcraft.png
    authLevel: internal
    invisible: true
options:
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  pdfcraft: 1
