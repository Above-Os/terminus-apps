metadata:
  title: PdfCraft
  description: Acrobat-style PDF workbench that runs in your browser
spec:
  fullDescription: |
    ## Overview
    PdfCraft is an open-source, Acrobat-comparable PDF workbench written in
    Rust: view, annotate, edit, organize, fill forms, sign and export PDFs.
    This app serves its WebAssembly build: everything runs in your browser,
    and documents never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs PdfCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/PdfCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
