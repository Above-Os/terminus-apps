apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: gridcraft
  appid: gridcraft
  title: GridCraft
  description: Excel-style spreadsheet that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/gridcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.gridcraft.png
  version: 0.1.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/GridCraft/
spec:
  versionName: "0.7.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    GridCraft is an open-source, Excel-comparable spreadsheet written in
    Rust. This app serves its WebAssembly build: editing runs entirely in
    your browser, and workbooks never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs GridCraft's headless engine as an MCP server over
    Streamable HTTP. Agents can open, edit, recalculate and save workbooks
    (xlsx, csv, ods and more). Its entrance is hidden from the desktop and
    listed in Settings; it is reachable from your LAN or the LarePass VPN.
    Agents can read and write files only in Home/GridCraft; relative paths
    resolve there. To keep editing an agent's result in the browser, open
    it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/gridcraft
  sourceCode: https://github.com/beclab/gridcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/gridcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "3"
  requiredMemory: 256Mi
  limitedMemory: 2560Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: gridcraft
    host: gridcraft-svc
    port: 8080
    title: GridCraft
    icon: https://raw.githubusercontent.com/beclab/gridcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.gridcraft.png
    authLevel: private
    openMethod: window
  - name: gridcraftmcp
    host: gridcraft-svc
    port: 8090
    title: GridCraft MCP
    icon: https://raw.githubusercontent.com/beclab/gridcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.gridcraft.png
    authLevel: internal
    invisible: true
options:
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  gridcraft: 1
