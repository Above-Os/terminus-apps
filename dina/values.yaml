image: docker.io/luolong01/dina:0.16.0
imagePullPolicy: IfNotPresent

workloads:
  dina:
    replicaCount: 1

dev:
  hotReload: false
  sourceSubPath: devsrc

olaresEnv:
  # Empty renders Router's shared entrance on this cluster.
  LLM_GATEWAY_URL: ""
  OLARES_APP_ID: dina
  DINA_ROUTER_API_KEY: ""
  DINA_DEFAULT_MODEL: ""
