apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: figcraft
  appid: figcraft
  title: FigCraft
  description: Figma-style interface design tool that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/figcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.figcraft.png
  version: 0.1.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/FigCraft/
spec:
  versionName: "0.6.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    FigCraft is an open-source, Figma-comparable interface design tool written
    in Rust: frames, auto layout, components and variants, styles and
    variables, prototyping and inspection. This app serves its WebAssembly
    build: editing runs entirely in your browser, and designs never leave your
    device. Online sharing is off unless you enter a server in Preferences.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs FigCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/FigCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/figcraft
  sourceCode: https://github.com/beclab/figcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/figcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "3"
  requiredMemory: 256Mi
  limitedMemory: 2560Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: figcraft
    host: figcraft-svc
    port: 8080
    title: FigCraft
    icon: https://raw.githubusercontent.com/beclab/figcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.figcraft.png
    authLevel: private
    openMethod: window
  - name: figcraftmcp
    host: figcraft-svc
    port: 8090
    title: FigCraft MCP
    icon: https://raw.githubusercontent.com/beclab/figcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.figcraft.png
    authLevel: internal
    invisible: true
options:
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  figcraft: 1
