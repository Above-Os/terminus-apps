metadata:
  title: FigCraft
  description: Figma-style interface design tool that runs in your browser
spec:
  fullDescription: |
    ## Overview
    FigCraft is an open-source, Figma-comparable interface design tool written
    in Rust: frames, auto layout, components and variants, styles and
    variables, prototyping and inspection. This app serves its WebAssembly
    build: editing runs entirely in your browser, and designs never leave your
    device. Online sharing is off unless you enter a server in Preferences.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs FigCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/FigCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
