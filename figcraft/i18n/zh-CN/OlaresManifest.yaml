metadata:
  title: FigCraft
  description: 在浏览器中运行的 Figma 风格界面设计工具
spec:
  fullDescription: |
    ## 概述
    FigCraft 是一款用 Rust 编写的开源界面设计工具，目标是对标 Figma：
    画框、自动布局、组件与变体、样式与变量、原型和标注检查。
    本应用提供它的 WebAssembly 版本：所有编辑都在你的浏览器里完成，
    设计稿不会离开你的设备。除非你在偏好设置里填写服务器，在线共享是关闭的。

    打开文件使用浏览器的文件选择框，保存和导出会下载文件。
    关闭或刷新页面前请先保存。

    ## Agent 接入（MCP）
    本应用还以 Streamable HTTP 方式运行 FigCraft 的无界面引擎，作为 MCP 服务。
    它的入口不显示在桌面上，可以在设置里找到，只能从局域网或 LarePass VPN 访问。
    Agent 只能读写 Home/FigCraft 目录。想在浏览器里继续编辑 agent 生成的结果，
    请用浏览器的文件选择框从 Files 打开。

    ## 要求
    - 支持 WebGPU 或 WebGL2 的浏览器
    - 架构：amd64、arm64
