metadata:
  title: Test App Shared V3
  description: apiVersion v3 共有アプリのテスト
spec:
  fullDescription: |
    **重要な注意**
    これは apiVersion v3 の共有アプリテストです。Olares システム全体でサービスは 1 つだけインストールされます。

    **概要**
    Test App Shared V3 — rembgv3 の共有アプリパターンに基づきます。

    ONNX モデルはインストール時に `downloader-init` 経由で Olares CDN バンドルからダウンロードされます。
  upgradeDescription: |
    Test App Shared V3 の初回リリース。
