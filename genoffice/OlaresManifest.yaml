olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  genoffice: 1

metadata:
  name: genoffice
  appid: genoffice
  title: GenOffice
  description: The world's first full-featured open-source AI Office suite.
  icon: https://cdn.olares.com/images/2026/08/23af0fafa534e616c1fb1e31aceaabb6.png
  version: 0.0.2
  categories:
  - Productivity_v112
  - workspace
  tags:
  - doc-process

entrances:
- name: genoffice
  host: genoffice
  port: 3000
  title: GenOffice
  icon: https://cdn.olares.com/images/2026/08/23af0fafa534e616c1fb1e31aceaabb6.png
  authLevel: private
  openMethod: window

spec:
  versionName: "0.7.512"
  featuredImage: https://cdn.olares.com/images/2026/08/f573211d59c6e5443d093182b5689420.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/f573211d59c6e5443d093182b5689420.png
  - https://cdn.olares.com/images/2026/08/3f6493844c3167f78c58f3c8660d5622.png
  - https://cdn.olares.com/images/2026/08/e69ba3bbaed3b9f10379e23302647d06.png
  fullDescription: |
    GenOffice is a free, open-source alternative to Microsoft Office, built
    around AI editing as a first-class workflow. It opens and saves real
    Word (.docx), Excel (.xlsx), and PowerPoint (.pptx) files, and edits
    PDF and Markdown too.

    This Olares port streams the official Linux desktop app into the
    browser over KasmVNC. Documents and downloads live in your Home
    Documents and Downloads folders. AI features sign in to a Genspark
    account (device-code); local document editing does not need that
    login. Genspark AI uses that account's paid credits — the apps
    themselves stay Apache-2.0.

    Highlights
    - Byte-preserving .docx, .xlsx, and .pptx round-trip
    - Real PDF text and image editing, original fonts preserved
    - Markdown editor that stays local
    - Document-aware AI edits via Genspark (optional)

    Requirements
    - Olares >= 1.12.6
    - amd64 node (no arm64 image)
    - A browser; the suite is a remote desktop, not a web SPA
  upgradeDescription: |
    0.0.2: Stop KasmVNC from crashing the page after ~20 minutes idle
    (lastActiveAt TypeError). Enable websocket keep-alive and reconnect.
  developer: Genspark
  website: https://genoffice.ai/
  sourceCode: https://github.com/genspark-ai/genoffice
  submitter: harveyff
  locale:
  - en-US
  - zh-CN
  license:
  - text: Apache-2.0
    url: https://github.com/genspark-ai/genoffice/blob/main/LICENSE
  runAsUser: false
  supportArch:
  - amd64
  requiredCpu: "500m"
  limitedCpu: "4"
  requiredMemory: 2Gi
  limitedMemory: 8Gi
  requiredDisk: 5Gi

permission:
  appData: true
  userData:
  - Documents
  - Downloads

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
