metadata:
  title: GenOffice
  description: The world's first full-featured open-source AI Office suite.

spec:
  fullDescription: |
    GenOffice is a free, open-source alternative to Microsoft Office, built
    around AI editing as a first-class workflow. It opens and saves real
    Word (.docx), Excel (.xlsx), and PowerPoint (.pptx) files, and edits
    PDF and Markdown too.

    This Olares port streams the official Linux desktop app into the
    browser over KasmVNC. Documents and downloads live in your Home
    Documents and Downloads folders. AI features sign in to a Genspark
    account (device-code); local document editing does not need that
    login. Genspark AI uses that account's paid credits — the apps
    themselves stay Apache-2.0.

    Highlights
    - Byte-preserving .docx, .xlsx, and .pptx round-trip
    - Real PDF text and image editing, original fonts preserved
    - Markdown editor that stays local
    - Document-aware AI edits via Genspark (optional)

    Requirements
    - Olares >= 1.12.6
    - amd64 node (no arm64 image)
    - A browser; the suite is a remote desktop, not a web SPA
