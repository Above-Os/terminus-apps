metadata:
  title: GenOffice
  description: The world's first full-featured open-source AI Office suite.

spec:
  fullDescription: |
    GenOffice is a free, open-source alternative to Microsoft Office, built
    around AI editing as a first-class workflow. It opens and saves real
    Word (.docx) files, edits Markdown, and marks up PDFs, in the browser.

    This Olares port is a web application, not a streamed desktop: the
    editors run in the browser and a small Node service reads and writes
    your Documents folder. AI needs no account and no API key — it goes
    through Olares Router using this app's in-cluster identity, and the
    model list is whatever Router has.

    Highlights
    - Byte-preserving .docx round-trip
    - Markdown editor that stays local
    - PDF markup, signing, page editing, splitting and merging
    - Document-aware AI through Router, with nothing to sign in to
    - Files live in your Documents folder, not inside the app

    Requirements
    - Olares >= 1.12.6
    - Router app installed and running

    Not included in this port
    - Spreadsheets and slides
    - Genspark accounts, web search and image search
  upgradeDescription: |
    0.3.0: PDFs open, are marked up, signed, split, merged and saved back to
    the drive, and a blank one can be created from the workbench.

    0.2.1: The model and thinking level are picked from the composer itself,
    in both the document and the Markdown editor, from the list Router serves.

    0.2.0: The home page is now the workbench, with recent files, starred
    files and projects. The model and thinking level are chosen in the AI
    panel itself, from what Router serves. The app also opens over a plain
    http address on the local network, where it used to stay blank.

    0.1.1: Replaced the streamed Linux desktop with a real web application.
    The editors now run in the browser, files are read and written directly
    in Documents, and AI goes through Olares Router with no account and no
    API key. Spreadsheets, slides and PDF are not part of this port yet.
