metadata:
  title: GenOffice
  description: 全球首款功能完整的开源 AI 办公套件。

spec:
  fullDescription: |
    GenOffice 是免费开源的 Microsoft Office 替代方案，把 AI 编辑当作一等能力，
    而不是外挂聊天框。它在浏览器里打开并保存真正的 Word（.docx），也能编辑
    Markdown。

    本 Olares 移植是真正的 Web 应用，不是投屏的远程桌面：编辑器跑在浏览器里，
    一个很小的 Node 服务直接读写你的 Documents 目录。AI 不需要账号、不需要
    API Key —— 它经 Olares Router 走本应用的集群内身份，模型列表就是 Router
    里已有的模型。

    亮点
    - 字节级保留的 .docx 往返
    - 完全本地的 Markdown 编辑
    - 经 Router 的文档级 AI，没有任何要登录的地方
    - 文件落在你的 Documents 目录，而不是应用内部

    运行要求
    - Olares >= 1.12.6
    - 已安装并运行 Router 应用

    本次移植暂不包含
    - 表格、幻灯片与 PDF 编辑
    - Genspark 账号、联网搜索与图片搜索
  upgradeDescription: |
    0.1.1：把投屏的 Linux 桌面换成真正的 Web 应用。编辑器现在跑在浏览器里，
    文件直接读写 Documents，AI 经 Olares Router 且无需账号与 API Key。
    表格、幻灯片与 PDF 暂未包含在本次移植中。
