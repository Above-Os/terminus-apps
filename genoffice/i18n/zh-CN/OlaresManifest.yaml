metadata:
  title: GenOffice
  description: 全球首款功能完整的开源 AI 办公套件。

spec:
  fullDescription: |
    GenOffice 是免费开源的 Microsoft Office 替代方案，把 AI 编辑当作一等能力，
    而不是外挂聊天框。它打开并保存真正的 Word（.docx）、Excel（.xlsx）和
    PowerPoint（.pptx），也能编辑 PDF 和 Markdown。

    本 Olares 移植通过 KasmVNC 把官方 Linux 桌面应用投到浏览器。文档和下载
    落在用户 Home 的 Documents 与 Downloads。AI 功能通过设备码登录 Genspark
    账号；本地编辑不需要登录。Genspark AI 会消耗该账号的付费额度，应用本身
    仍是 Apache-2.0。

    亮点
    - 字节级保留的 .docx / .xlsx / .pptx 往返
    - 真正改 PDF 文字和图片，保留原字体
    - 完全本地的 Markdown 编辑
    - 可选的 Genspark 文档级 AI 编辑

    运行要求
    - Olares >= 1.12.6
    - amd64 节点（无 arm64 镜像）
    - 浏览器即可；这是远程桌面，不是 Web SPA
