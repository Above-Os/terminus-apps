apiVersion: apps/v1
kind: Deployment
metadata:
  name: genoffice
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: genoffice
spec:
  replicas: {{ .Values.workloads.genoffice.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: genoffice
  template:
    metadata:
      labels:
        io.kompose.service: genoffice
    spec:
      enableServiceLinks: false
      containers:
        - name: genoffice
          image: docker.io/beclab/harveyff-genoffice:v0.0.9
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - bash /scripts/enable-ime.sh; exec /init
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Asia/Shanghai
            - name: TITLE
              value: GenOffice
            - name: START_DOCKER
              value: "false"
            - name: NO_DECOR
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - containerPort: 3001
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: kasm-ime
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /config
            - name: documents
              mountPath: /config/Documents
            - name: downloads
              mountPath: /config/Downloads
            - name: dshm
              mountPath: /dev/shm
      restartPolicy: Always
      volumes:
        - name: kasm-ime
          configMap:
            name: genoffice-kasm-ime
            defaultMode: 0755
        - name: config
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}/config'
        - name: documents
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.userData }}/Documents'
        - name: downloads
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.userData }}/Downloads'
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
