apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: deckcraft
  appid: deckcraft
  title: DeckCraft
  description: PowerPoint-style presentation editor that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/deckcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.deckcraft.png
  version: 0.1.1
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/DeckCraft/
spec:
  versionName: "0.7.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    DeckCraft is an open-source, PowerPoint-comparable presentation editor
    written in Rust. This app serves its WebAssembly build: editing runs
    entirely in your browser, and decks never leave your device. It opens
    and saves .pptx and exports PDF and images.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs DeckCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/DeckCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/deckcraft
  sourceCode: https://github.com/beclab/deckcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/deckcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "5"
  requiredMemory: 256Mi
  limitedMemory: 3584Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: deckcraft
    host: deckcraft-svc
    port: 8080
    title: DeckCraft
    icon: https://raw.githubusercontent.com/beclab/deckcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.deckcraft.png
    authLevel: private
    openMethod: window
  - name: deckcraftmcp
    host: deckcraft-svc
    port: 8090
    title: DeckCraft MCP
    icon: https://raw.githubusercontent.com/beclab/deckcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.deckcraft.png
    authLevel: internal
    invisible: true
options:
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  deckcraft: 1
