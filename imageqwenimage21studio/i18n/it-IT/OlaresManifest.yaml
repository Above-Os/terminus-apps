metadata:
  title: "Qwen Image 2.1"
  description: "Qwen Image 2.1 genera e modifica immagini da testo o fino a dieci immagini di riferimento"
spec:
  fullDescription: |
    Genera immagini da una descrizione, oppure aggiungi fino a dieci immagini e citale nel prompt. Mantieni il formato della prima immagine per modificarla, oppure scegli un rapporto d'aspetto per comporre una nuova immagine dai riferimenti, ad esempio una persona di un'immagine che tiene un prodotto di un'altra. Dipingi sulla parte da cambiare, estendi la tela o rimuovi lo sfondo da qualsiasi risultato. Risultati, caricamenti e coda restano sul tuo Olares e sono condivisi su ogni dispositivo in cui apri l'app.

    L'app esegue il modello sul tuo Olares per generare e modificare immagini:
    - Un solo campo prompt: scrivi una descrizione per generare, oppure aggiungi immagini da modificare e cita ciascuna nel prompt.
    - Fino a dieci immagini: mantieni il formato della prima per modificarla, oppure scegli un rapporto d'aspetto per comporre una nuova immagine dai riferimenti. Segna un'immagine come persona, prodotto o stile per dire cosa conservarne.
    - L'ottimizzazione IA amplia il prompt con il potenziatore di prompt ufficiale di Qwen Image 2.1, tramite un modello di chat di Router che vede anche le immagini aggiunte. Il modello si sceglie nelle Impostazioni.
    - Dipingi sulla zona da cambiare, estendi la tela o rimuovi lo sfondo con uno o due clic.
    - Una coda e una griglia di risultati condivise su tutti i dispositivi, con vista prima e dopo per ogni modifica.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con ogni workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.

    L'ottimizzazione IA richiede un'app di modello di chat installata e disponibile in Router. Le sue istruzioni sono il potenziatore di prompt di Qwen-Image-2.1, come incluso nei modelli di workflow di ComfyUI, con la Qwen Research License.
  upgradeDescription: |
    Prima di caricare le immagini di riferimento puoi controllare i limiti e i formati supportati. Puoi annullare la cancellazione del prompt e dei riferimenti. La libreria mostra tutte le immagini per impostazione predefinita, con origine, data e dimensioni.

    Se sono disponibili stime, puoi confrontare la durata prevista delle modifiche standard e rapide.

    Segui la coda e l’avanzamento della generazione, poi controlla il tempo effettivo di generazione per ogni immagine o per l’intero gruppo.

    Se esegui l’aggiornamento da un’installazione per singolo utente, disinstalla la versione precedente prima di installare questa versione condivisa.

    [Vedi questa versione](https://github.com/beclab/flowstudio2/releases/tag/imageqwenimage21studio/v0.1.23)
