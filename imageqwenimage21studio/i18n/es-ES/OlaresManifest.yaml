metadata:
  title: "Qwen Image 2.1"
  description: "Qwen Image 2.1 genera y edita imágenes a partir de texto o hasta diez imágenes de referencia"
spec:
  fullDescription: |
    Genera imágenes a partir de una descripción, o añade hasta diez imágenes y menciónalas en el prompt. Mantén la forma de la primera imagen para editarla, o elige una relación de aspecto para crear una imagen nueva a partir de las referencias, por ejemplo una persona de una imagen sosteniendo un producto de otra. Pinta sobre la parte que quieres cambiar, amplía el lienzo o quita el fondo de cualquier resultado. Los resultados, las subidas y la cola se guardan en tu Olares y se comparten en todos los dispositivos donde abras la app.

    La app ejecuta el modelo en tu Olares para generar y editar imágenes:
    - Un cuadro de prompt: escribe una descripción para generar, o añade imágenes para editarlas y menciona cada una en el prompt.
    - Hasta diez imágenes: mantén la forma de la primera para editarla, o elige una relación de aspecto para crear una imagen nueva a partir de las referencias. Marca una imagen como persona, producto o estilo para indicar qué conservar de ella.
    - La optimización con IA amplía tu prompt con el potenciador de prompts oficial de Qwen Image 2.1, usando un modelo de chat de Router que también ve las imágenes que añades. El modelo se elige en Ajustes.
    - Pinta sobre la zona que quieres cambiar, amplía el lienzo o quita el fondo con uno o dos clics.
    - Una cola y una cuadrícula de resultados compartidas en todos los dispositivos, con vista de antes y después para cada edición.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con cada flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.

    La optimización con IA necesita una app de modelo de chat instalada y disponible en Router. Sus instrucciones son el potenciador de prompts de Qwen-Image-2.1, tal como se incluye en las plantillas de flujos de trabajo de ComfyUI, bajo la Qwen Research License.
  upgradeDescription: |
    En Olares One, cuando la GPU se comparte por turnos, el tiempo estimado de generación incluye la carga de los modelos tras un periodo de inactividad. Si pones varias imágenes en cola a la vez, la estimación cuenta el tiempo de carga una sola vez.
    Si estás actualizando desde una instalación individual, desinstala esa versión antes de instalar la versión compartida.
