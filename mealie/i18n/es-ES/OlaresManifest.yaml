metadata:
  title: Mealie
  description: Un lugar para todas tus recetas
spec:
  fullDescription: |
    Mealie es un gestor de recetas autoalojado, planificador de comidas y lista de la compra con backend RestAPI y frontend reactivo en Vue para una experiencia agradable para toda la familia. Añade recetas fácilmente proporcionando la URL y Mealie importará automáticamente los datos relevantes, o añade una receta familiar con el editor de la UI. Mealie también ofrece una API para interacciones desde aplicaciones de terceros.

    **Funciones principales**
    - Importación de recetas: crea recetas importando desde una URL o introduciendo datos manualmente
    - Planificador de comidas: usa el Meal Planner para planificar lo que cocinarás la próxima semana
    - Lista de la compra: pon los ingredientes necesarios en tu lista, organizados por secciones de tu supermercado local
    - Libros de cocina: agrupa recetas en Cookbooks según tus propios criterios
    - Localización: traducciones para más de 35 idiomas
