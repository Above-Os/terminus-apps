metadata:
  title: Mealie
  description: Un posto per tutte le tue ricette
spec:
  fullDescription: |
    Mealie è un gestore di ricette self-hosted, meal planner e lista della spesa con backend RestAPI e frontend reattivo in Vue per un'esperienza piacevole per tutta la famiglia. Aggiungi facilmente le ricette fornendo l'URL e Mealie importerà automaticamente i dati rilevanti, oppure aggiungi una ricetta di famiglia con l'editor dell'interfaccia. Mealie offre anche un'API per interazioni da applicazioni di terze parti.

    **Funzionalità principali**
    - Importazione ricette: crea ricette importando da un URL o inserendo i dati manualmente
    - Meal Planner: usa il Meal Planner per pianificare cosa cucinerai la prossima settimana
    - Lista della spesa: metti gli ingredienti necessari sulla lista, organizzati per sezioni del supermercato locale
    - Libri di cucina: raggruppa le ricette in Cookbooks secondo i tuoi criteri
    - Localizzazione: traduzioni per oltre 35 lingue
