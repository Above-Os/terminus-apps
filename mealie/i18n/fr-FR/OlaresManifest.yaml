metadata:
  title: Mealie
  description: Un endroit pour toutes vos recettes
spec:
  fullDescription: |
    Mealie est un gestionnaire de recettes auto-hébergé, planificateur de repas et liste de courses avec un backend RestAPI et un frontend réactif en Vue pour une expérience agréable pour toute la famille. Ajoutez facilement des recettes en fournissant l'URL et Mealie importera automatiquement les données pertinentes, ou ajoutez une recette familiale avec l'éditeur de l'interface. Mealie fournit également une API pour les interactions depuis des applications tierces.

    **Fonctionnalités clés**
    - Import de recettes : créez des recettes en important depuis une URL ou en saisissant les données manuellement
    - Planificateur de repas : utilisez le Meal Planner pour planifier ce que vous cuisinerez la semaine suivante
    - Liste de courses : ajoutez les ingrédients nécessaires à votre liste, organisés selon les rayons de votre supermarché local
    - Livres de recettes : regroupez les recettes en Cookbooks selon vos propres critères
    - Localisation : traductions pour plus de 35 langues
