metadata:
  title: Mealie
  description: すべてのレシピのための場所
spec:
  upgradeDescription: |
    Mealie を 3.30.0 に更新します。アプリ内の AI プロンプト設定、調理手順の所要時間、週単位の献立作成を追加します。OPENAI_CUSTOM_PROMPT_DIR は廃止され、既存のカスタムプロンプトは自動で取り込まれ、アプリ内で管理できます。

    リリースノート: https://github.com/mealie-recipes/mealie/releases/tag/v3.30.0

  fullDescription: |
    Mealie はセルフホスト型のレシピ管理、献立プランナー、買い物リストで、RestAPI バックエンドと Vue 製のリアクティブフロントエンドにより、家族全員にとって快適な体験を提供します。URL を指定するだけで関連データを自動取り込みしたり、UI エディタで家庭のレシピを追加できます。サードパーティアプリ向けの API も用意されています。

    **主な機能**
    - レシピ取り込み: URL からインポート、または手動入力でレシピを作成
    - 献立プランナー: Meal Planner で来週の料理を計画
    - 買い物リスト: 必要な食材を地元スーパーの売り場区分ごとに整理
    - クックブック: 独自の基準でレシピをグループ化
    - 多言語対応: 35 以上の言語の翻訳
