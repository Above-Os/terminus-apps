metadata:
  description: Un modello di riconoscimento vocale multilingue per registrazioni e audio dal vivo
  title: Qwen3-ASR 0.6B

spec:
  upgradeDescription: |
    v1.0.8: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    Qwen3-ASR 0.6B converte in testo il parlato in più lingue. Può trascrivere una registrazione completa o elaborare l'audio dal vivo mentre viene ricevuto.

    **Funzionalità principali**
    - Trascrivere il parlato in più lingue.
    - Elaborare registrazioni audio complete.
    - Supportare il riconoscimento in streaming per l'audio dal vivo.
    - Rendere la trascrizione disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `2662Mi` di memoria video.
