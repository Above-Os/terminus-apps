metadata:
  description: Un modelo de reconocimiento de voz multilingüe para grabaciones y audio en directo
  title: Qwen3-ASR 0.6B

spec:
  upgradeDescription: |
    v1.0.13: El motor v1.1.53: en GPU Intel, cuando la GPU rechaza un lote por falta de memoria gráfica, las transcripciones siguientes ya no salen corruptas, y el tamaño de los lotes en Intel Arc se calcula midiendo la memoria gráfica con más precisión.
    v1.0.12: El motor v1.1.52 transcribe en GPU Intel las grabaciones de más de 90 segundos en fragmentos cortados en las pausas, por lo que la memoria gráfica ya no crece con la duración de la grabación. La transcripción por lotes en Intel Arc se mantiene dentro de su memoria gráfica. La memoria gráfica Intel requerida baja a `3584Mi`.
    v1.0.11: El motor v1.1.50 carga el modelo una sola vez en GPU Intel, por lo que la memoria gráfica Intel requerida baja a `4Gi`. Las grabaciones de más de 30 segundos ya no se cortan.
    v1.0.8: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    Qwen3-ASR 0.6B convierte en texto el habla en varios idiomas. Puede transcribir una grabación completa o procesar audio en directo a medida que se recibe.

    **Funciones principales**
    - Transcribir voz en varios idiomas.
    - Procesar grabaciones de audio completas.
    - Admitir reconocimiento en streaming para audio en directo.
    - Poner la transcripción a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `2662Mi` de memoria gráfica.
