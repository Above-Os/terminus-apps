metadata:
  description: Ein mehrsprachiges Spracherkennungsmodell für Aufnahmen und Live-Audio
  title: Qwen3-ASR 0.6B

spec:
  upgradeDescription: |
    v1.0.12: Engine v1.1.52 transkribiert Aufnahmen über 90 Sekunden auf Intel-GPUs in an Pausen geschnittenen Abschnitten, sodass der Grafikspeicher nicht mehr mit der Aufnahmelänge wächst. Stapeltranskription auf Intel Arc bleibt innerhalb des Grafikspeichers. Der Intel-Grafikspeicherbedarf sinkt auf `3584Mi`.
    v1.0.11: Engine v1.1.50 lädt das Modell auf Intel-GPUs nur noch einmal, daher sinkt der Intel-Grafikspeicherbedarf auf `4Gi`. Aufnahmen über 30 Sekunden werden nicht mehr abgeschnitten.
    v1.0.8: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    Qwen3-ASR 0.6B wandelt gesprochene Sprache in mehreren Sprachen in Text um. Es kann vollständige Aufnahmen transkribieren oder eingehendes Live-Audio fortlaufend verarbeiten.

    **Hauptfunktionen**
    - Sprache in mehreren Sprachen transkribieren.
    - Vollständige Audioaufnahmen verarbeiten.
    - Streaming-Spracherkennung für Live-Audio unterstützen.
    - Transkriptionen für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `2662Mi` Grafikspeicher ist erforderlich.
