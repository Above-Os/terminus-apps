metadata:
  description: Ein mehrsprachiges Spracherkennungsmodell für Aufnahmen und Live-Audio
  title: Qwen3-ASR 0.6B

spec:
  fullDescription: |
    Qwen3-ASR 0.6B wandelt gesprochene Sprache in mehreren Sprachen in Text um. Es kann vollständige Aufnahmen transkribieren oder eingehendes Live-Audio fortlaufend verarbeiten.

    **Hauptfunktionen**
    - Sprache in mehreren Sprachen transkribieren.
    - Vollständige Audioaufnahmen verarbeiten.
    - Streaming-Spracherkennung für Live-Audio unterstützen.
    - Transkriptionen für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `2355Mi` Grafikspeicher ist erforderlich.
