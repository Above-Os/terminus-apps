metadata:
  description: A multilingual speech recognition model for recorded and live audio
  title: Qwen3-ASR 0.6B

spec:
  fullDescription: |
    Qwen3-ASR 0.6B converts spoken audio in multiple languages into written text. It can transcribe a complete recording or process live audio while it is arriving.

    **Key features**
    - Transcribe speech in multiple languages.
    - Process complete audio recordings.
    - Support streaming recognition for live audio.
    - Make transcription available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `2355Mi` of GPU memory is required.
