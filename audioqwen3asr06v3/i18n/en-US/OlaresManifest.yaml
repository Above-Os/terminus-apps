metadata:
  description: A multilingual speech recognition model for recorded and live audio
  title: Qwen3-ASR 0.6B

spec:
  upgradeDescription: |
    v1.0.13: Engine v1.1.53: on Intel GPUs, when the GPU turns a batch down for lack of memory, the transcripts that follow are no longer garbled, and batch sizing on Intel Arc reads GPU memory more accurately.
    v1.0.12: Engine v1.1.52 transcribes recordings longer than 90 seconds in pieces cut at pauses on Intel GPUs, so GPU memory no longer grows with the length of the recording, and batch transcription on Intel Arc stays within its GPU memory. The Intel GPU memory requirement drops to `3584Mi`.
    v1.0.11: Engine v1.1.50 loads the model once on Intel GPUs, so the Intel GPU memory requirement drops to `4Gi`. Recordings longer than 30 seconds are no longer cut off.
    v1.0.8: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.
  fullDescription: |
    Qwen3-ASR 0.6B converts spoken audio in multiple languages into written text. It can transcribe a complete recording or process live audio while it is arriving.

    **Key features**
    - Transcribe speech in multiple languages.
    - Process complete audio recordings.
    - Support streaming recognition for live audio.
    - Make transcription available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `2662Mi` of GPU memory is required.
