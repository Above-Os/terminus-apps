metadata:
  description: 録音とライブ音声に対応する多言語音声認識モデル
  title: Qwen3-ASR 0.6B

spec:
  upgradeDescription: |
    v1.0.13: エンジンを v1.1.53 に更新しました。Intel GPU で GPU メモリ不足のため一括文字起こしが拒否されても、その後の文字起こしが文字化けしなくなりました。Intel Arc での一括文字起こしの分け方も、GPU メモリをより正確に測って決めるようになりました。
    v1.0.12: エンジンを v1.1.52 に更新しました。Intel GPU では 90 秒を超える録音を無音の箇所で区切って文字起こしするため、録音が長くなっても GPU メモリが増えなくなりました。Intel Arc での一括文字起こしも GPU メモリの範囲内に収まります。Intel の GPU メモリ要件は `3584Mi` に下がります。
    v1.0.11: エンジンを v1.1.50 に更新しました。Intel GPU ではモデルを一度だけ読み込むため、Intel の GPU メモリ要件が `4Gi` に下がります。30 秒を超える録音が途中で切れなくなりました。
    v1.0.8: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    Qwen3-ASR 0.6Bは、複数言語の音声をテキストに変換します。録音全体の文字起こしに加え、入力中のライブ音声を逐次処理できます。

    **主な機能**
    - 複数の言語で音声を文字起こしします。
    - 録音済みの音声全体を処理します。
    - ライブ音声のストリーミング認識に対応します。
    - 対応するOlaresアプリから文字起こし機能を利用できます。

    `2662Mi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。
