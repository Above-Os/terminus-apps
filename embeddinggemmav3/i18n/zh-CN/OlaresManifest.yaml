metadata:
  title: EmbeddingGemma
  description: "用于语义搜索的多语言文本嵌入模型"

spec:
  upgradeDescription: |
    v1.1.8: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    EmbeddingGemma 将文本转换为表示其含义的数值向量。应用可以比较这些向量，查找相关段落、归类相似文档，或为 AI 回答检索上下文。

    本应用为兼容的 Olares 应用提供 Google 的 EmbeddingGemma-300M 模型。该模型支持超过 100 种语言，用于生成文本嵌入向量，而非生成回答。
