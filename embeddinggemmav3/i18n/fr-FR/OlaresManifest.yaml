metadata:
  title: EmbeddingGemma
  description: "Un modèle multilingue de plongements textuels pour la recherche sémantique"

spec:
  upgradeDescription: |
    v1.1.8: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    EmbeddingGemma transforme le texte en vecteurs numériques qui représentent son sens. Les applications peuvent comparer ces vecteurs pour trouver des passages pertinents, regrouper des documents similaires ou récupérer du contexte pour les réponses d'une IA.

    Cette application met le modèle EmbeddingGemma-300M de Google à la disposition des applications Olares compatibles. Le modèle prend en charge plus de 100 langues et produit des représentations vectorielles du texte, plutôt que des réponses.
