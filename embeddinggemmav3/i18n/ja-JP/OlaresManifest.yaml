metadata:
  title: EmbeddingGemma
  description: "意味に基づく検索のための多言語テキスト埋め込みモデル"

spec:
  upgradeDescription: |
    v1.1.8: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    EmbeddingGemmaは、テキストをその意味を表す数値ベクトルに変換します。アプリはこれらのベクトルを比較し、関連する文章の検索、類似文書のグループ化、AIの回答に必要な文脈の取得に利用できます。

    このアプリは、GoogleのEmbeddingGemma-300Mモデルを対応するOlaresアプリに提供します。モデルは100以上の言語に対応し、回答の生成ではなくテキストの埋め込みベクトルの生成に使用します。
