metadata:
  title: EmbeddingGemma
  description: "Ein mehrsprachiges Text-Embedding-Modell für die semantische Suche"

spec:
  upgradeDescription: |
    v1.1.8: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    EmbeddingGemma wandelt Text in Zahlenvektoren um, die seine Bedeutung abbilden. Anwendungen können diese Vektoren vergleichen, um relevante Textstellen zu finden, ähnliche Dokumente zu gruppieren oder Kontext für KI-Antworten abzurufen.

    Diese App stellt Googles Modell EmbeddingGemma-300M für kompatible Olares-Anwendungen bereit. Das Modell unterstützt mehr als 100 Sprachen und erzeugt Text-Embeddings statt Antworten.
