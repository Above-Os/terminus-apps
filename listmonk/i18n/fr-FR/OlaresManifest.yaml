metadata:
  title: Listmonk
  description: Gestionnaire de newsletters et de listes de diffusion auto-hébergé haute performance avec un tableau de bord moderne
spec:
  upgradeDescription: |
    Mise à jour vers listmonk v6.2.0 (sécurité + fonctionnalités). Limites CPU/mémoire légèrement relevées.

    Points forts :
    - Correctifs de sécurité pour la validation des permissions campagne/liste et l'injection SQL à l'export des abonnés (CVE-2026-62361)
    - Intégrer des images inline (CID) dans les e-mails
    - Redirections d'URL de confiance après soumission du formulaire abonné
    - Sélection du serveur SMTP selon les domaines « from e-mail »
    - Expressions de modèle dans les en-têtes personnalisés de campagne
    - Mode de compatibilité Outlook dans le Visual e-mail builder
    - Prise en charge du webhook de rebonds Azure

    Voir : https://github.com/knadh/listmonk/releases/tag/v6.2.0
  fullDescription: |
    listmonk est un gestionnaire de newsletters et de listes de diffusion autonome et auto-hébergé. Il est rapide, riche en fonctionnalités et emballé dans un seul binaire. Il utilise une base de données PostgreSQL (⩾ 12) comme magasin de données.

    **Fonctionnalités**
    Listes de diffusion unidirectionnelles
    - Gérez des millions d'abonnés sur de nombreuses listes unidirectionnelles en opt-in simple et double avec des attributs JSON personnalisés par abonné. Interrogez et segmentez les abonnés avec des expressions SQL.
    - Utilisez l'importateur en masse rapide (~10k enregistrements par seconde) ou les API HTTP/JSON, ou interagissez avec le schéma de tables simple pour intégrer des CRM externes et des bases d'abonnés.

    E-mails transactionnels
    - API simple pour envoyer des messages transactionnels arbitraires aux abonnés à l'aide de modèles prédéfinis. Envoyez des messages en e-mail, SMS, WhatsApp ou tout autre medium via des interfaces Messenger.

    Analytique
    - Analytique et visualisations simples. Connectez facilement des programmes de visualisation externes à la base grâce à la structure de tables simple.

    Modèles
    - Créez de puissants modèles d'e-mail dynamiques avec le langage de templating Go. Utilisez des expressions de modèle, de la logique et plus de 100 fonctions dans les objets et le contenu. Rédigez des e-mails HTML dans un éditeur WYSIWYG, Markdown, HTML brut avec coloration syntaxique ou texte brut.

    Performances
    - Files d'attente e-mail multi-SMTP multithread à haut débit. Limitation de débit et de fenêtre glissante pour un contrôle fin. Application binaire unique avec une empreinte CPU et mémoire nominale qui tourne partout. La seule dépendance est une base Postgres (⩾ 12).

    Médias
    - Utilisez le gestionnaire de médias pour téléverser des images de campagnes e-mail sur le système de fichiers du serveur, Amazon S3 ou tout backend compatible S3 (Minio).

    Extensibilité
    - Plus que des campagnes e-mail. Connectez des webhooks HTTP pour envoyer des SMS, WhatsApp, notifications FCM ou tout type de message.

    Confidentialité
    - Permettez aux abonnés de se bloquer définitivement, d'exporter toutes leurs données et de les effacer en un clic.
