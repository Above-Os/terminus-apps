metadata:
  title: Listmonk
  description: モダンなダッシュボードを備えた高性能セルフホストのニュースレター／メーリングリストマネージャー
spec:
  upgradeDescription: |
    listmonk v6.2.0 へ更新（セキュリティ＋機能）。CPU／メモリ上限をわずかに引き上げ。

    ハイライト:
    - キャンペーン／リスト権限検証と購読者エクスポートの SQL インジェクションに対するセキュリティ修正（CVE-2026-62361）
    - e-mail へのインライン画像（CID）埋め込み
    - 購読者フォーム送信後の信頼できる URL リダイレクト
    - 「from e-mail」ドメインに基づく SMTP サーバー選択
    - キャンペーンカスタムヘッダーでのテンプレート式
    - Visual e-mail builder の Outlook 互換モード
    - Azure バウンス Webhook サポート

    参照: https://github.com/knadh/listmonk/releases/tag/v6.2.0
  fullDescription: |
    listmonk はスタンドアロンのセルフホスト型ニュースレター／メーリングリストマネージャーです。高速で機能が豊富、単一バイナリにまとまっています。データストアとして PostgreSQL（⩾ 12）データベースを使用します。

    **機能**
    一方向メーリングリスト
    - 購読者ごとのカスタム JSON 属性付きの多数のシングル／ダブルオプトイン一方向メーリングリストで数百万の購読者を管理。SQL 式で購読者を照会・セグメント化。
    - 高速一括インポーター（秒間約 1 万件）や HTTP/JSON API、シンプルなテーブルスキーマで外部 CRM や購読者データベースと統合。

    トランザクションメール
    - 定義済みテンプレートを使い、購読者へ任意のトランザクションメッセージを送るシンプルな API。Messenger インターフェース経由で e-mail、SMS、WhatsApp など任意の媒体で送信。

    分析
    - シンプルな分析と可視化。シンプルなテーブル構造により外部可視化ツールをデータベースに容易に接続。

    テンプレート
    - Go テンプレート言語で強力な動的 e-mail テンプレートを作成。件名と本文でテンプレート式・ロジック・100 以上の関数を利用。WYSIWYG、Markdown、構文強調付き生 HTML、またはプレーンテキストで HTML メールを作成。

    パフォーマンス
    - マルチスレッド・高スループット・マルチ SMTP の e-mail キュー。スループットとスライディングウィンドウのレート制限で細かく制御。CPU／メモリ負荷が小さくどこでも動く単一バイナリ。依存は Postgres（⩾ 12）のみ。

    メディア
    - メディアマネージャーでキャンペーン用画像をサーバーのファイルシステム、Amazon S3、または S3 互換（Minio）バックエンドにアップロード。

    拡張性
    - e-mail キャンペーンにとどまらず。HTTP Webhook で SMS、WhatsApp、FCM 通知など任意のメッセージを送信。

    プライバシー
    - 購読者が恒久的にブロックリスト登録し、全データをエクスポートし、ワンクリックですべて削除できるようにします。
