metadata:
  title: Listmonk
  description: Gestore di newsletter e mailing list self-hosted ad alte prestazioni con una dashboard moderna
spec:
  upgradeDescription: |
    Aggiornamento a listmonk v6.2.0 (sicurezza + funzionalità). Limiti di CPU/memoria leggermente aumentati.

    Highlight:
    - Fix di sicurezza per la validazione dei permessi di campaign/list e SQL injection nell'export degli iscritti (CVE-2026-62361)
    - Incorporare immagini inline (CID) nelle e-mail
    - Redirect URL attendibili dopo l'invio del form iscritto
    - Selezione del server SMTP in base ai domini 'from e-mail'
    - Espressioni template nelle intestazioni personalizzate della campagna
    - Modalità di compatibilità Outlook nel Visual e-mail builder
    - Supporto webhook bounce di Azure

    Vedi: https://github.com/knadh/listmonk/releases/tag/v6.2.0
  fullDescription: |
    listmonk è un gestore di newsletter e mailing list autonomo e self-hosted. È veloce, ricco di funzionalità e racchiuso in un singolo binario. Usa un database PostgreSQL (⩾ 12) come data store.

    **Funzionalità**
    Mailing list unidirezionali
    - Gestisci milioni di iscritti su molte mailing list unidirezionali single e double opt-in con attributi JSON personalizzati per iscritto. Interroga e segmenta gli iscritti con espressioni SQL.
    - Usa il veloce importatore bulk (~10k record al secondo) o le API HTTP/JSON, oppure interagisci con lo schema delle tabelle semplice per integrare CRM esterni e database di iscritti.

    Mail transazionali
    - API semplice per inviare messaggi transazionali arbitrari agli iscritti usando template predefiniti. Invia messaggi come e-mail, SMS, WhatsApp o qualsiasi mezzo tramite interfacce Messenger.

    Analytics
    - Analytics e visualizzazioni semplici. Collega facilmente programmi di visualizzazione esterni al database grazie alla struttura delle tabelle semplice.

    Templating
    - Crea potenti template e-mail dinamici con il linguaggio di templating Go. Usa espressioni di template, logica e oltre 100 funzioni in oggetti e contenuti. Scrivi e-mail HTML in un editor WYSIWYG, Markdown, HTML grezzo con evidenziazione della sintassi o testo semplice.

    Prestazioni
    - Code e-mail multi-SMTP multi-thread ad alto throughput. Limitazione della velocità per throughput e sliding window per un controllo fine. Applicazione a singolo binario con impronta nominale di CPU e memoria che gira ovunque. L'unica dipendenza è un database Postgres (⩾ 12).

    Media
    - Usa il media manager per caricare immagini per le campagne e-mail sul filesystem del server, Amazon S3 o qualsiasi backend compatibile S3 (Minio).

    Estensibile
    - Più delle sole campagne e-mail. Collega webhook HTTP per inviare SMS, WhatsApp, notifiche FCM o qualsiasi tipo di messaggio.

    Privacy
    - Consenti agli iscritti di bloccarsi permanentemente, esportare tutti i propri dati e cancellarli con un clic.
