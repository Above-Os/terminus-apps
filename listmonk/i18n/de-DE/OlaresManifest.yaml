metadata:
  title: Listmonk
  description: "Hochperformanter, selbst gehosteter Newsletter- und Mailinglisten-Manager mit modernem\
  \ Dashboard"
spec:
  upgradeDescription: |
    Update auf listmonk v6.2.0 (Sicherheit + Funktionen). CPU-/Speicherlimits leicht angehoben.

    Highlights:
    - Sicherheitsfixes für Campaign-/Listen-Berechtigungsvalidierung und SQL-Injection beim Abonnentenexport (CVE-2026-62361)
    - Inline-Bilder (CID) in E-Mails einbetten
    - Vertrauenswürdige URL-Weiterleitungen nach Absenden des Abonnentenformulars
    - SMTP-Server-Auswahl basierend auf „from e-mail“-Domains
    - Template-Ausdrücke in benutzerdefinierten Kampagnen-Headern
    - Outlook-Kompatibilitätsmodus im Visual e-mail builder
    - Azure-Bounce-Webhook-Unterstützung

    Siehe: https://github.com/knadh/listmonk/releases/tag/v6.2.0
  fullDescription: |
    listmonk ist ein eigenständiger, selbst gehosteter Newsletter- und Mailinglisten-Manager. Er ist schnell, funktionsreich und in einer einzigen Binary gepackt. Als Datenspeicher nutzt er eine PostgreSQL-Datenbank (⩾ 12).

    **Funktionen**
    Einweg-Mailinglisten
    - Verwalten Sie Millionen von Abonnenten über viele Single- und Double-Opt-in-Einweg-Mailinglisten mit benutzerdefinierten JSON-Attributen pro Abonnent. Abonnenten mit SQL-Ausdrücken abfragen und segmentieren.
    - Nutzen Sie den schnellen Bulk-Importer (~10k Datensätze pro Sekunde) oder HTTP/JSON-APIs bzw. das einfache Tabellenschema zur Integration externer CRMs und Abonnentendatenbanken.

    Transaktionsmails
    - Einfache API zum Senden beliebiger Transaktionsnachrichten an Abonnenten mit vordefinierten Vorlagen. Senden Sie Nachrichten als E-Mail, SMS, WhatsApp oder jedes Medium über Messenger-Schnittstellen.

    Analysen
    - Einfache Analysen und Visualisierungen. Verbinden Sie externe Visualisierungsprogramme dank der einfachen Tabellenstruktur leicht mit der Datenbank.

    Vorlagen
    - Erstellen Sie leistungsstarke, dynamische E-Mail-Vorlagen mit der Go-Templating-Sprache. Nutzen Sie Template-Ausdrücke, Logik und 100+ Funktionen in Betreffzeilen und Inhalten. Schreiben Sie HTML-E-Mails in einem WYSIWYG-Editor, Markdown, rohem syntaxhervorgehobenem HTML oder Klartext.

    Leistung
    - Multithreaded, hochdurchsatzfähige Multi-SMTP-E-Mail-Warteschlangen. Durchsatz- und Sliding-Window-Ratenbegrenzung für feingranulare Kontrolle. Einzelne Binary mit geringem CPU- und Speicherbedarf, die überall läuft. Die einzige Abhängigkeit ist eine Postgres-Datenbank (⩾ 12).

    Medien
    - Nutzen Sie den Medienmanager zum Hochladen von Bildern für E-Mail-Kampagnen auf dem Dateisystem des Servers, Amazon S3 oder jedem S3-kompatiblen (Minio) Backend.

    Erweiterbar
    - Mehr als nur E-Mail-Kampagnen. Verbinden Sie HTTP-Webhooks zum Senden von SMS, WhatsApp, FCM-Benachrichtigungen oder beliebigen Nachrichtentypen.

    Privatsphäre
    - Abonnenten können sich dauerhaft blockieren, alle ihre Daten exportieren und mit einem Klick alle Daten löschen.
