metadata:
  title: Listmonk
  description: Gestor de newsletters y listas de correo autoalojado de alto rendimiento con un panel moderno
spec:
  upgradeDescription: |
    Actualización a listmonk v6.2.0 (seguridad + funciones). Límites de CPU/memoria ligeramente aumentados.

    Destacados:
    - Correcciones de seguridad para la validación de permisos de campaña/lista y la inyección SQL en la exportación de suscriptores (CVE-2026-62361)
    - Incrustar imágenes en línea (CID) en e-mails
    - Redirecciones de URL de confianza tras el envío del formulario de suscriptor
    - Selección de servidor SMTP según dominios de «from e-mail»
    - Expresiones de plantilla en cabeceras personalizadas de campaña
    - Modo de compatibilidad con Outlook en el Visual e-mail builder
    - Soporte de webhook de rebotes de Azure

    Ver: https://github.com/knadh/listmonk/releases/tag/v6.2.0
  fullDescription: |
    listmonk es un gestor de newsletters y listas de correo autónomo y autoalojado. Es rápido, rico en funciones y empaquetado en un único binario. Usa una base de datos PostgreSQL (⩾ 12) como almacén de datos.

    **Características**
    Listas de correo unidireccionales
    - Gestione millones de suscriptores en muchas listas unidireccionales de opt-in simple y doble con atributos JSON personalizados por suscriptor. Consulte y segmente suscriptores con expresiones SQL.
    - Use el importador masivo rápido (~10k registros por segundo) o las APIs HTTP/JSON, o interactúe con el esquema de tablas sencillo para integrar CRMs externos y bases de datos de suscriptores.

    Correos transaccionales
    - API sencilla para enviar mensajes transaccionales arbitrarios a suscriptores usando plantillas predefinidas. Envíe mensajes como e-mail, SMS, WhatsApp o cualquier medio mediante interfaces Messenger.

    Analítica
    - Analítica y visualizaciones sencillas. Conecte fácilmente programas de visualización externos a la base de datos gracias a la estructura de tablas sencilla.

    Plantillas
    - Cree potentes plantillas de e-mail dinámicas con el lenguaje de plantillas de Go. Use expresiones de plantilla, lógica y más de 100 funciones en asuntos y contenido. Escriba e-mails HTML en un editor WYSIWYG, Markdown, HTML resaltado en crudo o texto plano.

    Rendimiento
    - Colas de e-mail multi-SMTP multi-hilo de alto rendimiento. Limitación de velocidad por rendimiento y ventana deslizante para un control fino. Aplicación de un solo binario con huella nominal de CPU y memoria que se ejecuta en todas partes. La única dependencia es una base de datos Postgres (⩾ 12).

    Medios
    - Use el gestor de medios para subir imágenes de campañas de e-mail al sistema de archivos del servidor, Amazon S3 o cualquier backend compatible con S3 (Minio).

    Extensible
    - Más que campañas de e-mail. Conecte webhooks HTTP para enviar SMS, WhatsApp, notificaciones FCM o cualquier tipo de mensaje.

    Privacidad
    - Permita a los suscriptores bloquearse permanentemente, exportar todos sus datos y borrarlos con un solo clic.
