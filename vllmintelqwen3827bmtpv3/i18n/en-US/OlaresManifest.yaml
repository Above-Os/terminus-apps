metadata:
  description: "Qwen3.8-27B (GPTQ-Int4) with MTP speculative decoding on Intel Arc vLLM, tuned for Arc Pro B70."
  title: Qwen3.8-27B MTP (Intel vLLM)

spec:
  upgradeDescription: |
    v1.0.1: Fix engine start on hosts with an older kernel (seen on 6.14): grant the engine CAP_PERFMON so the xe driver reports used VRAM. Without it vLLM sized the KV cache as if the card were empty and failed with XPU out of memory.

    v1.0.0: First release. Qwen3.8-27B GPTQ-Int4 (with BF16 MTP head) on `beclab/llm-scaler-vllm:0.26.0-b2-pp-mtp-263b3a7`, Intel discrete GPU only. MTP with 3 draft tokens and an int4 draft lm_head, V2 model runner, XPU graphs for decode, fp8 KV cache, 128K context, up to 64 concurrent requests.
  fullDescription: |
    **Model Overview**
    Qwen3.8-27B is a vision-language model from the Qwen series (Alibaba), built on the Qwen3.5 architecture. It supports thinking, tool-calling, and image understanding. This app serves the community GPTQ build `SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16` (int4 weights, group size 128, BF16 multi-token-prediction head kept) with vLLM on Intel Arc.

    **Target hardware**
    Intel discrete GPUs with 32GB VRAM, tuned on **Intel Arc Pro B70**. Install with compute mode **`intel-gpu`**. Other GPUs are not supported by this app.

    **Preset Configuration**
    - Engine image: `beclab/llm-scaler-vllm:0.26.0-b2-pp-mtp-263b3a7` = `intel/llm-scaler-vllm:0.26.0-b2` plus fixes for MTP on the V2 model runner (wrong output on prompts of exactly 1 + draft-length tokens, eager drafter under TP) and an optional int4 draft lm_head.
    - Speculative decoding: MTP, 3 draft tokens, int4 draft lm_head (about 2–3× faster decoding than without MTP).
    - Runner: `VLLM_USE_V2_MODEL_RUNNER=1`, `VLLM_XPU_ENABLE_XPU_GRAPH=1`, `-cc.cudagraph_mode=FULL_DECODE_ONLY`.
    - Context: 128K (`--max-model-len 131072`), up to 64 concurrent requests. KV cache in fp8 (`--kv-cache-dtype fp8`): about 191K tokens in total, enough for 1.4 full-length requests at once; the Gated DeltaNet state stays float32.
    - Capabilities: thinking, tools, vision.
    - Engine args: `--dtype float16 --gpu-memory-utilization 0.9 --max-model-len 131072 --kv-cache-dtype fp8 --max-num-batched-tokens 8192 --max-num-seqs 64 --block-size 64 --trust-remote-code --speculative-config.method=qwen3_5_mtp --speculative-config.num_speculative_tokens=3 --speculative-config.draft_lm_head_quantization=int4 -cc.mode=none -cc.cudagraph_mode=FULL_DECODE_ONLY --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3`
    - Required GPU memory: `29Gi` (the engine takes 90% of a 32GB card).

    **Tuning**
    - Single user: `--speculative-config.num_speculative_tokens=4` is about 7% faster for one request at a time; 3 is faster from 8 concurrent requests up.
    - Keep `--dtype float16` and do not add `--quantization` (GPTQ is detected from the model).
    - Use dotted flags (`--speculative-config.key=value`) in ENGINE_ARGS, not inline JSON.
    - Do not raise `--gpu-memory-utilization` above 0.9: at 0.93 a 150K-token prompt runs out of device memory during prefill.
    - Without `--kv-cache-dtype fp8` the KV cache holds only about 83K tokens; lower `--max-model-len` to 65536 in that case.

    **Measured on one Arc Pro B70** (this preset, greedy)
    | Workload | Throughput |
    |---|---|
    | Short math Q&A, 1 request | 80 output tok/s |
    | Short math Q&A, 8 concurrent | 404 output tok/s |
    | Short math Q&A, 32 concurrent | 421 output tok/s |
    | 30K-token prompt, 1 request | 1404 tok/s (prompt + output) |
    | 130K-token prompt | prefill about 147 s |

    **How It Works**
    First, Model Console downloads the model and gets it ready, then vLLM starts serving the model when it's ready. These two parts run separately but share files and progress info.

    **Stack**
    - **vLLM** (`beclab/llm-scaler-vllm:0.26.0-b2-pp-mtp-263b3a7`): Runs the model and serves API requests (port 8000)
    - **Model Console**: Downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to vLLM.

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.
