# Per-workload replica counts (keys match Deployment metadata.name /
# workloadReplicas in OlaresManifest).
#   paddleocrhybrid — llama.cpp CUDA/ROCm/SYCL VLM (== appid / Release.Name)
#   llminit         — llm-init download + OCR API proxy
#   ocradapter      — OCRAdapter (Redis job queue → llamacpp + layout)
#   layout          — PP-DocLayoutV3 ONNX (CPU) via ocrlayout.sh
workloads:
  llminit:
    replicaCount: 1
  ocradapter:
    replicaCount: 1
  layout:
    replicaCount: 1
  paddleocrhybrid:
    replicaCount: 1

# llama.cpp engine image selected by the Olares accelerator mode.
engine:
  images:
    nvidia: docker.io/beclab/ggml-org-llama.cpp:server-cuda12-b10143
    nvidiaGb10: docker.io/beclab/ggml-org-llama.cpp:server-cuda12-b10143
    amdGpu: docker.io/beclab/ggml-org-llama.cpp:server-rocm-b10731
    intelGpu: docker.io/beclab/ggml-org-llama.cpp:server-intel-b10752
