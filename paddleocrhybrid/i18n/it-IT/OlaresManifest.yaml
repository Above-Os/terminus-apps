metadata:
  title: PaddleOCR Hybrid
  description: "Un toolkit per il riconoscimento del testo e l’analisi dei documenti"

spec:
  upgradeDescription: |
    v1.0.39: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    PaddleOCR è un toolkit di OCR e analisi dei documenti per estrarre testo e comprenderne il layout. Converte documenti e immagini in contenuti che le applicazioni possono usare per la ricerca, l'analisi e ulteriori elaborazioni.

    PaddleOCR Hybrid combina il rilevamento del layout di PP-DocLayoutV3 con il riconoscimento dei documenti di PaddleOCR-VL-1.5. Individua le aree nelle immagini di documenti e nelle pagine PDF, quindi ne riconosce il contenuto, inclusi testo, tabelle e formule, con supporto per più lingue.

    Questa versione Hybrid esegue il rilevamento del layout sulla CPU e il riconoscimento dei documenti su una GPU NVIDIA o una GPU discreta AMD o Intel supportata. Rende queste funzioni disponibili alle applicazioni Olares compatibili.
