metadata:
  title: PaddleOCR Hybrid
  description: "Riconoscimento multilingue dei documenti con rilevamento del layout"

spec:
  fullDescription: |
    PaddleOCR Hybrid combina il rilevamento del layout di PP-DocLayoutV3 con il riconoscimento dei documenti di PaddleOCR-VL-1.5. Individua le aree nelle immagini di documenti e nelle pagine PDF, quindi ne riconosce il contenuto, inclusi testo, tabelle e formule.

    Le applicazioni Olares compatibili possono usarlo per estrarre contenuti da documenti multilingue da elaborare successivamente. Il rilevamento del layout viene eseguito sulla CPU, mentre il riconoscimento dei documenti richiede una GPU NVIDIA supportata.
