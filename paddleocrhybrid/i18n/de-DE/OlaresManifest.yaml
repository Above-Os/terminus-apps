metadata:
  title: PaddleOCR Hybrid
  description: "Mehrsprachige Dokumenterkennung mit Layouterkennung"

spec:
  fullDescription: |
    PaddleOCR Hybrid kombiniert die Layouterkennung von PP-DocLayoutV3 mit der Dokumenterkennung von PaddleOCR-VL-1.5. Es erkennt Bereiche in Dokumentbildern und PDF-Seiten und liest anschließend deren Inhalte, darunter Text, Tabellen und Formeln.

    Kompatible Olares-Anwendungen können damit mehrsprachige Dokumentinhalte zur Weiterverarbeitung extrahieren. Die Layouterkennung läuft auf der CPU; die Dokumenterkennung benötigt eine unterstützte NVIDIA-GPU.
