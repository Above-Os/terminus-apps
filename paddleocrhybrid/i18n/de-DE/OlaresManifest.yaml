metadata:
  title: PaddleOCR Hybrid
  description: "Ein Toolkit für Texterkennung und Dokumentanalyse"

spec:
  upgradeDescription: |
    v1.0.39: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    PaddleOCR ist ein Toolkit für OCR und Dokumentanalyse, das Text extrahiert und Dokumentlayouts analysiert. Es wandelt Dokumente und Bilder in Inhalte um, die Anwendungen für Suche, Analyse und weitere Verarbeitung nutzen können.

    PaddleOCR Hybrid kombiniert die Layouterkennung von PP-DocLayoutV3 mit der Dokumenterkennung von PaddleOCR-VL-1.5. Es erkennt Bereiche in Dokumentbildern und PDF-Seiten und liest anschließend deren Inhalte, darunter Text, Tabellen und Formeln. Dabei werden mehrere Sprachen unterstützt.

    Diese Hybrid-Version führt die Layouterkennung auf der CPU und die Dokumenterkennung auf einer unterstützten NVIDIA-GPU oder einer diskreten AMD- oder Intel-GPU aus. Sie stellt diese Funktionen kompatiblen Olares-Anwendungen bereit.
