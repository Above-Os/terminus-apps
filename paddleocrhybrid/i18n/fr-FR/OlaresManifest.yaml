metadata:
  title: PaddleOCR Hybrid
  description: "Reconnaissance multilingue de documents avec détection de la mise en page"

spec:
  fullDescription: |
    PaddleOCR Hybrid associe la détection de mise en page de PP-DocLayoutV3 à la reconnaissance de documents de PaddleOCR-VL-1.5. Il repère les régions dans les images de documents et les pages PDF, puis reconnaît leur contenu, notamment le texte, les tableaux et les formules.

    Les applications Olares compatibles peuvent l'utiliser pour extraire le contenu de documents multilingues en vue de traitements ultérieurs. La détection de mise en page s'exécute sur le CPU, tandis que la reconnaissance de documents nécessite un GPU NVIDIA pris en charge.
