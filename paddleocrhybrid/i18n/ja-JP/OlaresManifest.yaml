metadata:
  title: PaddleOCR Hybrid
  description: "レイアウト検出を組み合わせた多言語の文書認識"

spec:
  fullDescription: |
    PaddleOCR Hybridは、PP-DocLayoutV3のレイアウト検出とPaddleOCR-VL-1.5の文書認識を組み合わせています。文書画像やPDFページ内の領域を検出し、各領域の文字、表、数式などの内容を認識します。

    対応するOlaresアプリは、多言語文書の内容を抽出して後続の処理に利用できます。レイアウト検出はCPUで実行し、文書認識には対応するNVIDIA GPUが必要です。
