metadata:
  title: PaddleOCR Hybrid
  description: "文字認識と文書解析のツールキット"

spec:
  upgradeDescription: |
    v1.0.39: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    PaddleOCRは、テキストの抽出と文書レイアウトの理解に使用するOCR・文書解析ツールキットです。文書や画像を、アプリでの検索、分析、後続処理に利用できるコンテンツに変換します。

    PaddleOCR Hybridは、PP-DocLayoutV3のレイアウト検出とPaddleOCR-VL-1.5の文書認識を組み合わせています。文書画像やPDFページ内の領域を検出し、各領域の文字、表、数式などの内容を認識します。複数の言語に対応しています。

    このHybrid版は、レイアウト検出をCPUで、文書認識を対応するNVIDIA GPUまたはAMD・IntelディスクリートGPUで実行します。これらの機能を対応するOlaresアプリに提供します。
