metadata:
  title: PaddleOCR Hybrid
  description: "PaddleOCR-VL hybrid OCR (GGUF + PP-DocLayoutV3) via llm-init + OCRAdapter + llama.cpp + layout"

spec:
  fullDescription: |
    **PaddleOCR Hybrid** document OCR: layout (CPU ONNX) + PaddleOCR-VL-1.5 GGUF (CUDA).

    **Stack**
    Client → llm-init:8090 → ocradapter:8080 → llamacpp:8081
                              ├─ Olares Redis middleware
                              └─ layout:8090 (PP-DocLayoutV3)

    **Models (whole-repo download)**
    - [PaddlePaddle/PaddleOCR-VL-1.5-GGUF](https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.5-GGUF)
    - [beclab/PP-DocLayoutV3_onnx](https://huggingface.co/beclab/PP-DocLayoutV3_onnx)

    **Accelerator:** CUDA for VLM (`nvidia` / `nvidia-gb10`); layout on CPU.
    **Sizing (full-stack profile 2026-08-11):** VLM VRAM peak ~**8.4 GiB**, request **8Gi**; layout RAM peak ~**1.1 GiB** (limit **2Gi**).
