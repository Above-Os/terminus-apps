metadata:
  title: PaddleOCR Hybrid
  description: "Multilingual document recognition with layout detection"

spec:
  fullDescription: |
    PaddleOCR Hybrid combines PP-DocLayoutV3 layout detection with PaddleOCR-VL-1.5 document recognition. It identifies regions on document images and PDF pages, then recognizes their content, including text, tables, and formulas.

    Compatible Olares applications can use it to extract multilingual document content for further processing. Layout detection runs on the CPU, while document recognition requires a supported NVIDIA GPU.
