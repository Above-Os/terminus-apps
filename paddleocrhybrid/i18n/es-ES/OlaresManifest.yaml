metadata:
  title: PaddleOCR Hybrid
  description: "Herramientas de reconocimiento de texto y análisis de documentos"

spec:
  upgradeDescription: |
    v1.0.39: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    PaddleOCR es un conjunto de herramientas de OCR y análisis de documentos para extraer texto e interpretar el diseño de las páginas. Convierte documentos e imágenes en contenido que las aplicaciones pueden usar para búsquedas, análisis y otros procesos.

    PaddleOCR Hybrid combina la detección del diseño de PP-DocLayoutV3 con el reconocimiento de documentos de PaddleOCR-VL-1.5. Identifica regiones en imágenes de documentos y páginas PDF y, a continuación, reconoce su contenido, incluidos texto, tablas y fórmulas, con soporte para varios idiomas.

    Esta versión Hybrid ejecuta la detección del diseño en la CPU y el reconocimiento de documentos en una GPU NVIDIA o una GPU discreta AMD o Intel compatible. Ofrece estas funciones a las aplicaciones Olares compatibles.
