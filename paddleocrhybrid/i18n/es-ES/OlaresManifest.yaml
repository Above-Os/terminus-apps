metadata:
  title: PaddleOCR Hybrid
  description: "Reconocimiento multilingüe de documentos con detección del diseño"

spec:
  fullDescription: |
    PaddleOCR Hybrid combina la detección del diseño de PP-DocLayoutV3 con el reconocimiento de documentos de PaddleOCR-VL-1.5. Identifica regiones en imágenes de documentos y páginas PDF y, a continuación, reconoce su contenido, incluidos texto, tablas y fórmulas.

    Las aplicaciones Olares compatibles pueden usarlo para extraer contenido de documentos multilingües y procesarlo después. La detección del diseño se ejecuta en la CPU, mientras que el reconocimiento de documentos requiere una GPU NVIDIA compatible.
