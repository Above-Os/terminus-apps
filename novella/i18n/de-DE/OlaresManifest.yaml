metadata:
  title: Novel
  description: Notion-ähnlicher WYSIWYG-Editor mit KI-gestützter Autovervollständigung
spec:
  fullDescription: |
    Novel ist ein webbasierter Open-Source-WYSIWYG-Editor (What You See Is What You Get), inspiriert von Notion, mit KI-gestützten Autovervollständigungen.

    Besonders nützlich für alle, die längere Texte wie Essays oder Berichte schreiben, und hilft, einen konsistenten Ton und Stil beizubehalten.

    **Hauptfunktionen:**
    - WYSIWYG-Bearbeitung: Benutzerfreundliches Editing, bei dem Nutzer in Echtzeit sehen, wie der Inhalt aussehen wird.

    - KI-Autovervollständigungen:
    Schlägt relevante Wörter, Phrasen und Sätze vor, während Nutzer tippen.

    - Open Source:
    Entwickler können beitragen, anpassen und die Funktionalität nach Bedarf erweitern.
  upgradeDescription: |
    KI-Anmeldedaten aus den globalen Olares-Einstellungen (Einstellungen → Integration → OpenAI / Custom OpenAI) als Container-Umgebungsvariablen verdrahtet, statt einer gemounteten /src/.env-Datei.

    OPENAI_API_KEY bevorzugt OLARES_USER_CUSTOM_OPENAI_APIKEY, falls gesetzt, sonst OLARES_USER_OPENAI_APIKEY. OPENAI_BASE_URL kommt von OLARES_USER_CUSTOM_OPENAI_SERVICE (leer lassen für die offizielle OpenAI-Standardadresse).
