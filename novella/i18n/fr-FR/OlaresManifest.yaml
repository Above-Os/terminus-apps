metadata:
  title: Novel
  description: Éditeur WYSIWYG style Notion avec autocomplétion alimentée par l'IA
spec:
  fullDescription: |
    Novel est un éditeur WYSIWYG (What You See Is What You Get) web open source inspiré de Notion, offrant des autocomplétions alimentées par l'IA.

    Il est particulièrement utile pour ceux qui rédigent du contenu long, comme des essais ou des rapports, et les aide à conserver un ton et un style cohérents.

    **Fonctionnalités clés :**
    - Édition WYSIWYG : expérience d'édition conviviale où les utilisateurs voient en temps réel à quoi ressemblera le contenu.

    - Autocomplétions IA :
    Propose des mots, phrases et phrases pertinentes pendant la saisie.

    - Open source :
    Permet aux développeurs de contribuer, personnaliser et étendre les fonctionnalités selon leurs besoins.
  upgradeDescription: |
    Branche les identifiants IA depuis les paramètres globaux Olares (Paramètres → Integration → OpenAI / Custom OpenAI) dans des variables d'environnement du conteneur au lieu d'un fichier /src/.env monté.

    OPENAI_API_KEY privilégie OLARES_USER_CUSTOM_OPENAI_APIKEY s'il est défini, sinon OLARES_USER_OPENAI_APIKEY. OPENAI_BASE_URL provient de OLARES_USER_CUSTOM_OPENAI_SERVICE (laisser vide pour le défaut officiel OpenAI).
