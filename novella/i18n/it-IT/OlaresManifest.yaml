metadata:
  title: Novel
  description: Editor WYSIWYG in stile Notion con autocompletamento basato su IA
spec:
  fullDescription: |
    Novel è un editor WYSIWYG (What You See Is What You Get) web open-source ispirato a Notion, con autocompletamenti basati su IA.

    È particolarmente utile per chi scrive contenuti lunghi, come saggi o report, e li aiuta a mantenere un tono e uno stile coerenti.

    **Funzionalità principali:**
    - Editing WYSIWYG: esperienza di editing intuitiva in cui gli utenti vedono in tempo reale come apparirà il contenuto.

    - Autocompletamenti IA:
    Suggerisce parole, frasi e periodi rilevanti mentre l'utente digita.

    - Open source:
    Consente agli sviluppatori di contribuire, personalizzare ed estendere le funzionalità secondo le proprie esigenze.
  upgradeDescription: |
    Collega le credenziali IA dalle impostazioni globali di Olares (Impostazioni → Integration → OpenAI / Custom OpenAI) alle variabili d'ambiente del container invece di un file /src/.env montato.

    OPENAI_API_KEY preferisce OLARES_USER_CUSTOM_OPENAI_APIKEY se impostato, altrimenti OLARES_USER_OPENAI_APIKEY. OPENAI_BASE_URL proviene da OLARES_USER_CUSTOM_OPENAI_SERVICE (lasciare vuoto per il default ufficiale OpenAI).
