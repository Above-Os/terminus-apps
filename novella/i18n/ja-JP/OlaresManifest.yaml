metadata:
  title: Novel
  description: AI オートコンプリート付き Notion スタイルの WYSIWYG エディタ
spec:
  fullDescription: |
    Novel は Notion に着想を得た、ウェブベースのオープンソース WYSIWYG（What You See Is What You Get）エディタで、AI によるオートコンプリートを提供します。

    エッセイやレポートなど長文を書く人に特に便利で、一貫したトーンとスタイルの維持を助けます。

    **主な機能:**
    - WYSIWYG 編集: コンテンツの見た目をリアルタイムで確認できる使いやすい編集体験

    - AI オートコンプリート:
    入力中に関連する語・句・文を提案

    - オープンソース:
    開発者が要件に応じて貢献・カスタマイズ・機能拡張可能
  upgradeDescription: |
    マウントされた /src/.env ファイルの代わりに、Olares グローバル設定（設定 → Integration → OpenAI / Custom OpenAI）から AI 認証情報をコンテナ環境変数へ配線。

    OPENAI_API_KEY は設定されている場合 OLARES_USER_CUSTOM_OPENAI_APIKEY を優先し、なければ OLARES_USER_OPENAI_APIKEY。OPENAI_BASE_URL は OLARES_USER_CUSTOM_OPENAI_SERVICE から取得（OpenAI 公式デフォルトの場合は空のまま）。
