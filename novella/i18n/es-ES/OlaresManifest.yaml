metadata:
  title: Novel
  description: Editor WYSIWYG estilo Notion con autocompletado impulsado por IA
spec:
  fullDescription: |
    Novel es un editor WYSIWYG (What You See Is What You Get) web de código abierto inspirado en Notion, con autocompletados impulsados por IA.

    Es especialmente útil para quienes escriben contenido largo, como ensayos o informes, y les ayuda a mantener un tono y estilo coherentes.

    **Funciones principales:**
    - Edición WYSIWYG: experiencia de edición amigable donde los usuarios ven en tiempo real cómo aparecerá el contenido.

    - Autocompletados con IA:
    Sugiere palabras, frases y oraciones relevantes mientras el usuario escribe.

    - Código abierto:
    Permite a los desarrolladores contribuir, personalizar y ampliar la funcionalidad según sus necesidades.
  upgradeDescription: |
    Conecta las credenciales de IA desde los ajustes globales de Olares (Ajustes → Integration → OpenAI / Custom OpenAI) a variables de entorno del contenedor en lugar de un archivo /src/.env montado.

    OPENAI_API_KEY prefiere OLARES_USER_CUSTOM_OPENAI_APIKEY cuando está definido; de lo contrario OLARES_USER_OPENAI_APIKEY. OPENAI_BASE_URL proviene de OLARES_USER_CUSTOM_OPENAI_SERVICE (déjalo vacío para el valor predeterminado oficial de OpenAI).
