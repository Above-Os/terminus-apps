metadata:
  title: Jupyter Notebook
  description: Jupyter Notebook v7 für interaktives Computing
spec:
  fullDescription: |
    Jupyter Notebook ist eine Anwendung zum Erstellen von Notebooks unter dem Dach des Project Jupyter. Basierend auf dem leistungsfähigen Format für rechnergestützte Notebooks bietet Jupyter Notebook schnelle, interaktive neue Möglichkeiten, Code zu prototypisieren und zu erklären, Daten zu untersuchen und zu visualisieren sowie Ideen mit anderen zu teilen.

    Notebooks erweitern den konsolenbasierten Ansatz des interaktiven Computings in eine qualitativ neue Richtung. Sie stellen eine webbasierte Anwendung bereit, mit der sich der gesamte Berechnungsprozess erfassen lässt: Code entwickeln, dokumentieren und ausführen sowie Ergebnisse vermitteln. Das Jupyter Notebook vereint zwei Komponenten:
    - **Eine Webanwendung**: Ein browserbasiertes Bearbeitungsprogramm für die interaktive Erstellung rechnergestützter Notebooks, das eine schnelle interaktive Umgebung zum Prototypisieren und Erklären von Code, zum Untersuchen und Visualisieren von Daten und zum Teilen von Ideen bietet
    - **Computational-Notebook-Dokumente**: Ein teilbares Dokument, das Computercode, natürlichsprachliche Beschreibungen, Daten, umfangreiche Visualisierungen wie 3D-Modelle, Diagramme, Mathematik, Graphen und Abbildungen sowie interaktive Steuerelemente kombiniert

    **Funktionen:**
    - Bearbeitung von Code im Browser mit automatischer Syntaxhervorhebung, Einrückung und Tab-Vervollständigung/Introspektion.
    - Code kann im Browser ausgeführt werden, wobei die Berechnungsergebnisse dem erzeugenden Code zugeordnet werden.
    - Darstellung von Berechnungsergebnissen mit Rich-Media-Formaten wie HTML, LaTeX, PNG, SVG usw. Beispielsweise können mit der Bibliothek [matplotlib] erzeugte Abbildungen in Publikationsqualität direkt eingebettet werden.
    - Bearbeitung von Rich Text im Browser mit der Auszeichnungssprache [Markdown], die Kommentare zum Code ermöglicht und nicht auf reinen Text beschränkt ist.
    - Mathematische Notation lässt sich einfach mit LaTeX in Markdown-Zellen einfügen und wird nativ von MathJax gerendert.

    **Zusätzliche Hinweise:**
    - **Mehrbenutzer-Unterstützung** — Jeder Olares-Benutzer kann eine eigene isolierte Instanz von Jupyter Notebook bereitstellen.
    - **Klonbare Instanzen** — Benutzer können bei Bedarf mehrere unabhängige Jupyter-Notebook-Instanzen installieren.
    - **CPU- oder NVIDIA-GPU-Modus** — Wählen Sie bei der Installation einfach den CPU- oder NVIDIA-GPU-Modus. Der GPU-Modus erfordert standardmäßig 20Gi GPU-Speicher und 20Gi Containerspeicher.
