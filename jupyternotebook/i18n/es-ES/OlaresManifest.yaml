metadata:
  title: Jupyter Notebook
  description: Jupyter Notebook v7 para computación interactiva
spec:
  fullDescription: |
    Jupyter Notebook es una aplicación para crear cuadernos que forma parte de Project Jupyter. Basado en la potencia del formato de cuaderno computacional, Jupyter Notebook ofrece formas nuevas, rápidas e interactivas de crear prototipos y explicar código, explorar y visualizar datos y compartir ideas con otras personas.

    Los cuadernos amplían el enfoque de la computación interactiva basada en consola en una dirección cualitativamente nueva, proporcionando una aplicación web adecuada para capturar todo el proceso de computación: desarrollar, documentar y ejecutar código, además de comunicar los resultados. Jupyter Notebook combina dos componentes:
    - **Una aplicación web**: Un programa de edición basado en el navegador para la creación interactiva de cuadernos computacionales que proporciona un entorno rápido e interactivo para crear prototipos y explicar código, explorar y visualizar datos y compartir ideas
    - **Documentos de cuaderno computacional**: Un documento que se puede compartir y que combina código informático, descripciones en lenguaje natural, datos, visualizaciones enriquecidas como modelos 3D, diagramas, matemáticas, gráficos y figuras, y controles interactivos

    **Características:**
    - Edición de código en el navegador, con resaltado automático de sintaxis, sangría y completado con tabulador/introspección.
    - Capacidad de ejecutar código desde el navegador, con los resultados de los cálculos adjuntos al código que los generó.
    - Visualización del resultado de los cálculos mediante representaciones multimedia enriquecidas, como HTML, LaTeX, PNG, SVG, etc. Por ejemplo, se pueden incluir en línea figuras con calidad de publicación generadas por la biblioteca [matplotlib].
    - Edición de texto enriquecido en el navegador mediante el lenguaje de marcado [Markdown], que permite añadir comentarios al código y no se limita al texto sin formato.
    - Capacidad de incluir fácilmente notación matemática en celdas Markdown mediante LaTeX, renderizada de forma nativa por MathJax.

    **Notas adicionales:**
    - **Compatibilidad multiusuario** — Cada usuario de Olares puede desplegar su propia instancia aislada de Jupyter Notebook.
    - **Instancias clonables** — Los usuarios tienen la flexibilidad de instalar varias instancias independientes de Jupyter Notebook según sea necesario.
    - **Modos CPU o GPU NVIDIA** — Seleccione fácilmente el modo CPU o GPU NVIDIA durante la instalación. El modo GPU requiere un límite predeterminado de 20Gi de memoria GPU y 20Gi de memoria del contenedor.
