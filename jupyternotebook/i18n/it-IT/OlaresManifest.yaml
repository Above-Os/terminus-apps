metadata:
  title: Jupyter Notebook
  description: Jupyter Notebook v7 per il calcolo interattivo.
spec:
  fullDescription: |
    Jupyter Notebook è un'applicazione per la creazione di notebook appartenente al progetto Project Jupyter. Basato sulla potenza del formato notebook computazionale, Jupyter Notebook offre nuovi modi rapidi e interattivi per creare prototipi e spiegare il codice, esplorare e visualizzare i dati e condividere le proprie idee.

    I notebook estendono l'approccio basato su console al calcolo interattivo in una direzione qualitativamente nuova, fornendo un'applicazione web adatta a catturare l'intero processo di calcolo: sviluppo, documentazione ed esecuzione del codice, oltre alla comunicazione dei risultati. Jupyter Notebook combina due componenti:
    - **Un'applicazione web**: Un programma di modifica basato su browser per la creazione interattiva di notebook computazionali, che offre un ambiente rapido e interattivo per creare prototipi e spiegare il codice, esplorare e visualizzare i dati e condividere idee
    - **Documenti di notebook computazionale**: Un documento condivisibile che combina codice, descrizioni in linguaggio naturale, dati, visualizzazioni avanzate come modelli 3D, diagrammi, matematica, grafici e figure e controlli interattivi

    **Funzionalità:**
    - Modifica del codice nel browser, con evidenziazione automatica della sintassi, rientro e completamento tramite tabulazione/introspezione.
    - Possibilità di eseguire codice dal browser, con i risultati dei calcoli allegati al codice che li ha generati.
    - Visualizzazione dei risultati dei calcoli tramite rappresentazioni multimediali avanzate, come HTML, LaTeX, PNG, SVG, ecc. Ad esempio, è possibile includere direttamente figure di qualità editoriale generate dalla libreria [matplotlib].
    - Modifica di testo avanzato nel browser tramite il linguaggio di markup [Markdown], che consente di aggiungere commenti al codice senza limitarsi al testo normale.
    - Possibilità di includere facilmente notazioni matematiche nelle celle Markdown tramite LaTeX, con rendering nativo di MathJax.

    **Note aggiuntive:**
    - **Supporto multiutente** — Ogni utente Olares può distribuire la propria istanza isolata di Jupyter Notebook.
    - **Istanze clonabili** — Gli utenti possono installare più istanze indipendenti di Jupyter Notebook secondo necessità.
    - **Modalità CPU o GPU NVIDIA** — Durante l'installazione è possibile selezionare facilmente la modalità CPU o GPU NVIDIA. La modalità GPU richiede un limite predefinito di 20Gi di memoria GPU e 20Gi di memoria del container.
