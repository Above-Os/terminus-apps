metadata:
  title: Jupyter Notebook
  description: Jupyter Notebook v7 pour le calcul interactif
spec:
  fullDescription: |
    Jupyter Notebook est une application de création de notebooks qui fait partie de Project Jupyter. S'appuyant sur la puissance du format de notebook informatique, Jupyter Notebook offre de nouvelles méthodes rapides et interactives pour prototyper et expliquer votre code, explorer et visualiser vos données et partager vos idées.

    Les notebooks étendent l'approche du calcul interactif en console dans une direction qualitativement nouvelle, en fournissant une application web capable de capturer l'ensemble du processus de calcul : développement, documentation et exécution du code, ainsi que communication des résultats. Jupyter Notebook associe deux composants :
    - **Une application web** : Un programme d'édition dans le navigateur pour la création interactive de notebooks informatiques, qui fournit un environnement rapide et interactif pour prototyper et expliquer le code, explorer et visualiser les données et partager des idées
    - **Des documents de notebook informatique** : Un document partageable qui associe du code informatique, des descriptions en langage naturel, des données, des visualisations riches telles que des modèles 3D, des diagrammes, des mathématiques, des graphiques et des figures, ainsi que des commandes interactives

    **Fonctionnalités :**
    - Édition du code dans le navigateur, avec coloration syntaxique, indentation et complétion par tabulation/introspection automatiques.
    - Possibilité d'exécuter du code depuis le navigateur, les résultats des calculs étant joints au code qui les a générés.
    - Affichage des résultats des calculs à l'aide de représentations multimédias riches, telles que HTML, LaTeX, PNG, SVG, etc. Par exemple, des figures de qualité publication produites par la bibliothèque [matplotlib] peuvent être intégrées.
    - Édition de texte riche dans le navigateur à l'aide du langage de balisage [Markdown], qui permet de commenter le code sans se limiter au texte brut.
    - Possibilité d'inclure facilement des notations mathématiques dans les cellules Markdown à l'aide de LaTeX, avec un rendu natif par MathJax.

    **Notes supplémentaires :**
    - **Prise en charge multi-utilisateur** — Chaque utilisateur Olares peut déployer sa propre instance isolée de Jupyter Notebook.
    - **Instances clonables** — Les utilisateurs peuvent installer plusieurs instances indépendantes de Jupyter Notebook selon leurs besoins.
    - **Modes CPU ou GPU NVIDIA** — Sélectionnez facilement le mode CPU ou GPU NVIDIA pendant l'installation. Le mode GPU nécessite une limite par défaut de 20Gi de mémoire GPU et de 20Gi de mémoire de conteneur.
