metadata:
  title: Jupyter Notebook
  description: インタラクティブコンピューティング向けの Jupyter Notebook v7
spec:
  fullDescription: |
    Jupyter Notebook は、Project Jupyter の傘下にあるノートブック作成アプリケーションです。計算ノートブック形式の能力を基盤として、コードのプロトタイプ作成と説明、データの探索と可視化、アイデアの共有をすばやく対話的に行う新しい方法を提供します。

    ノートブックは、コンソールベースのインタラクティブコンピューティングを質的に新しい方向へ拡張し、コードの開発、文書化、実行から結果の伝達まで、計算プロセス全体を記録できる Web アプリケーションを提供します。Jupyter Notebook は次の 2 つの要素を組み合わせています。
    - **Web アプリケーション**：計算ノートブックを対話的に作成するためのブラウザベースの編集プログラムで、コードのプロトタイプ作成と説明、データの探索と可視化、アイデアの共有を行う高速な対話環境を提供します
    - **計算ノートブック文書**：コンピューターコード、自然言語による説明、データ、3D モデル、チャート、数式、グラフ、図などの高度な可視化、対話型コントロールを組み合わせた共有可能な文書です

    **機能：**
    - コードの自動シンタックスハイライト、インデント、タブ補完/イントロスペクションを備えたブラウザ内編集。
    - ブラウザからコードを実行し、計算結果をその生成元のコードに関連付ける機能。
    - HTML、LaTeX、PNG、SVG などのリッチメディア表現による計算結果の表示。たとえば、[matplotlib] ライブラリで作成した出版品質の図をインラインで含めることができます。
    - [Markdown] マークアップ言語を使用したブラウザ内のリッチテキスト編集。コードへのコメントを記述でき、プレーンテキストに限定されません。
    - LaTeX を使用して Markdown セルに数式表記を簡単に含め、MathJax でネイティブにレンダリングする機能。

    **追加情報：**
    - **マルチユーザー対応** — 各 Olares ユーザーは、それぞれ独立した Jupyter Notebook インスタンスをデプロイできます。
    - **複製可能なインスタンス** — 必要に応じて、複数の独立した Jupyter Notebook インスタンスを柔軟にインストールできます。
    - **CPU または NVIDIA GPU モード** — インストール時に CPU または NVIDIA GPU モードを簡単に選択できます。GPU モードには、デフォルトで 20Gi の GPU メモリと 20Gi のコンテナメモリ制限が必要です。
