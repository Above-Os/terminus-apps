metadata:
  title: PaddleOCR
  description: "Boîte à outils de reconnaissance de texte et d'analyse de documents"
spec:
  fullDescription: |
    PaddleOCR est un moteur OCR et d'IA documentaire leader du secteur et prêt pour la production, offrant des solutions de bout en bout de l'extraction de texte à la compréhension intelligente de documents
    
    PaddleOCR convertit documents et images en données structurées adaptées à l'IA (comme JSON et Markdown) avec une précision leader du secteur—alimentant des applications IA pour tous, des développeurs indépendants et startups aux grandes entreprises dans le monde. Avec plus de 60 000 étoiles et une intégration profonde dans des projets leaders comme MinerU, RAGFlow, pathway et cherry-studio, PaddleOCR est devenu la solution de référence pour les développeurs construisant des applications documentaires intelligentes à l'ère de l'IA.
    
    **Fonctionnalités principales**
    Document Recognition : Pipeline OCR documentaire avancé basé sur PaddleOCR-VL pour une reconnaissance précise du texte des documents.
    Layout Analysis : Modèle PP-DocLayoutV3 intégré pour une détection et une analyse précises de la mise en page documentaire.
    PaddleOCR-VL Model : Propulsé par le modèle PaddleOCR-VL-1.5-0.9B pour une compréhension documentaire et une extraction de texte de haute qualité.
    PaddleX Deployment : Déployé avec le framework PaddleX pour une inférence optimisée et des performances prêtes pour la production.
    
    **Avantages clés**
    High Accuracy : Modèles de reconnaissance documentaire à l'état de l'art entraînés sur des jeux de données à grande échelle pour une précision supérieure.
    Fast Processing : Moteur d'inférence optimisé via PaddleX pour un traitement documentaire rapide.
    Document-Oriented : Spécialisé dans les tâches de reconnaissance documentaire avec des capacités avancées de compréhension de mise en page.
    Production Ready : Déployé avec PaddleX pour un déploiement de production stable et efficace.
    
    **Détails techniques**
    Model : PaddleOCR-VL-1.5-0.9B pour la reconnaissance documentaire et l'extraction de texte.
    Layout Model : PP-DocLayoutV3 pour la détection de mise en page et l'analyse structurelle.
    Deployment Framework : PaddleX pour le service de modèles et l'inférence optimisés.
    Use Case : OCR documentaire et analyse de mise en page pour divers types de documents.
