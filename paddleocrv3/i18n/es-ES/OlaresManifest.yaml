metadata:
  title: PaddleOCR
  description: Kit de reconocimiento de texto y análisis de documentos
spec:
  fullDescription: |
    PaddleOCR es un motor de OCR e IA documental líder en la industria y listo para producción, que ofrece soluciones de extremo a extremo desde la extracción de texto hasta la comprensión inteligente de documentos
    
    PaddleOCR convierte documentos e imágenes en datos estructurados y aptos para IA (como JSON y Markdown) con precisión líder en la industria, impulsando aplicaciones de IA para todos, desde desarrolladores independientes y startups hasta grandes empresas en todo el mundo. Con más de 60.000 estrellas y una profunda integración en proyectos líderes como MinerU, RAGFlow, pathway y cherry-studio, PaddleOCR se ha convertido en la solución principal para desarrolladores que construyen aplicaciones documentales inteligentes en la era de la IA.
    
    **Funciones principales**
    Document Recognition: Pipeline OCR documental avanzado basado en PaddleOCR-VL para un reconocimiento preciso del texto de documentos.
    Layout Analysis: Modelo PP-DocLayoutV3 integrado para detección y análisis precisos del diseño documental.
    PaddleOCR-VL Model: Impulsado por el modelo PaddleOCR-VL-1.5-0.9B para comprensión documental y extracción de texto de alta calidad.
    PaddleX Deployment: Desplegado con el framework PaddleX para inferencia optimizada y rendimiento listo para producción.
    
    **Ventajas clave**
    High Accuracy: Modelos de reconocimiento documental de última generación entrenados en conjuntos de datos a gran escala para una precisión superior.
    Fast Processing: Motor de inferencia optimizado a través de PaddleX para un procesamiento documental rápido.
    Document-Oriented: Especializado en tareas de reconocimiento documental con capacidades avanzadas de comprensión de diseño.
    Production Ready: Desplegado con PaddleX para un despliegue de producción estable y eficiente.
    
    **Detalles técnicos**
    Model: PaddleOCR-VL-1.5-0.9B para reconocimiento documental y extracción de texto.
    Layout Model: PP-DocLayoutV3 para detección de diseño documental y análisis de estructura.
    Deployment Framework: PaddleX para servicio e inferencia de modelos optimizados.
    Use Case: OCR documental y análisis de diseño para diversos tipos de documentos.
