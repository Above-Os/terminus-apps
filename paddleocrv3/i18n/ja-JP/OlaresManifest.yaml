metadata:
  title: PaddleOCR
  description: テキスト認識＆ドキュメント解析ツールキット
spec:
  fullDescription: |
    PaddleOCR は業界をリードする本番対応の OCR およびドキュメント AI エンジンで、テキスト抽出からインテリジェントなドキュメント理解までのエンドツーエンドソリューションを提供します
    
    PaddleOCR はドキュメントと画像を業界トップクラスの精度で構造化された AI 向けデータ（JSON や Markdown など）に変換し、インディー開発者やスタートアップから世界中の大企業まで、あらゆる AI アプリケーションを支えます。60,000 を超えるスターと MinerU、RAGFlow、pathway、cherry-studio などの主要プロジェクトへの深い統合により、PaddleOCR は AI 時代にインテリジェントなドキュメントアプリケーションを構築する開発者向けの最有力ソリューションとなっています。
    
    **コア機能**
    Document Recognition: PaddleOCR-VL に基づく高度なドキュメント OCR パイプラインで正確なドキュメントテキスト認識。
    Layout Analysis: 統合 PP-DocLayoutV3 モデルによる精密なドキュメントレイアウト検出と解析。
    PaddleOCR-VL Model: 高品質なドキュメント理解とテキスト抽出のための PaddleOCR-VL-1.5-0.9B モデルを搭載。
    PaddleX Deployment: 最適化された推論と本番対応性能のための PaddleX フレームワークによるデプロイ。
    
    **主な利点**
    High Accuracy: 大規模データセットで学習した最先端のドキュメント認識モデルによる優れた精度。
    Fast Processing: PaddleX による最適化推論エンジンで高速なドキュメント処理。
    Document-Oriented: 高度なレイアウト理解能力を備えたドキュメント認識タスク向けに特化。
    Production Ready: 安定かつ効率的な本番デプロイのための PaddleX による展開。
    
    **技術詳細**
    Model: ドキュメント認識とテキスト抽出用 PaddleOCR-VL-1.5-0.9B。
    Layout Model: ドキュメントレイアウト検出と構造解析用 PP-DocLayoutV3。
    Deployment Framework: 最適化されたモデルサービングと推論用 PaddleX。
    Use Case: 各種ドキュメントタイプ向けのドキュメント OCR とレイアウト解析。
