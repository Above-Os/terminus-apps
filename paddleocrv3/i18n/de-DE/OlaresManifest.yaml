metadata:
  title: PaddleOCR
  description: Texterkennungs- und Dokumentenanalyse-Toolkit
spec:
  fullDescription: |
    PaddleOCR ist eine branchenführende, produktionsreife OCR- und Dokumenten-KI-Engine und bietet End-to-End-Lösungen von der Textextraktion bis zum intelligenten Dokumentverständnis
    
    PaddleOCR wandelt Dokumente und Bilder mit branchenführender Genauigkeit in strukturierte, KI-freundliche Daten (wie JSON und Markdown) um – und betreibt KI-Anwendungen für alle, von Indie-Entwicklern und Startups bis zu großen Unternehmen weltweit. Mit über 60,000 Sternen und tiefer Integration in führende Projekte wie MinerU, RAGFlow, pathway und cherry-studio ist PaddleOCR die führende Lösung für Entwickler, die intelligente Dokumentenanwendungen im KI-Zeitalter bauen.
    
    **Kernfunktionen**
    Document Recognition: Fortschrittliche Dokumenten-OCR-Pipeline basierend auf PaddleOCR-VL für genaue Dokumententexterkennung.
    Layout Analysis: Integriertes PP-DocLayoutV3-Modell für präzise Dokumentenlayout-Erkennung und -Analyse.
    PaddleOCR-VL Model: Angetrieben vom PaddleOCR-VL-1.5-0.9B Modell für hochwertiges Dokumentverständnis und Textextraktion.
    PaddleX Deployment: Bereitgestellt mit dem PaddleX-Framework für optimierte Inferenz und produktionsreife Leistung.
    
    **Wichtige Vorteile**
    High Accuracy: State-of-the-art Dokumentenerkennungsmodelle, trainiert auf großskaligen Datensätzen für überlegene Genauigkeit.
    Fast Processing: Optimierte Inferenz-Engine durch PaddleX für schnelle Dokumentenverarbeitung.
    Document-Oriented: Spezialisiert auf Dokumentenerkennungsaufgaben mit fortschrittlichen Layout-Verständnis-Fähigkeiten.
    Production Ready: Bereitgestellt mit PaddleX für stabile und effiziente Produktionsbereitstellung.
    
    **Technische Details**
    Model: PaddleOCR-VL-1.5-0.9B für Dokumentenerkennung und Textextraktion.
    Layout Model: PP-DocLayoutV3 für Dokumentenlayout-Erkennung und Strukturanalyse.
    Deployment Framework: PaddleX für optimiertes Model Serving und Inferenz.
    Use Case: Dokumenten-OCR und Layout-Analyse für verschiedene Dokumenttypen.
