metadata:
  title: Cognee
  description: Crea grafi di conoscenza ricercabili a partire da documenti e testo
spec:
  fullDescription: 'Cognee trasforma testi e documenti in conoscenze collegate che puoi cercare ed esplorare. Questo pacchetto include l’interfaccia web e l’API. Durante l’installazione, imposta una password di almeno 12 caratteri e accedi come default_user@example.com. Le password degli account esistenti vengono conservate durante gli aggiornamenti.


    Le attività linguistiche utilizzano AI Router default-chat. Un piccolo modello di embedding viene eseguito localmente in Cognee e scaricato al primo utilizzo. I dati relazionali utilizzano Olares PostgreSQL; i dati caricati, i file del grafo, gli indici vettoriali e la cache dei modelli vengono conservati nello spazio di archiviazione dell’applicazione.


    Questo pacchetto utilizza un’immagine di sviluppo del progetto originale fissata a una versione specifica. I download iniziali dei modelli possono ritardare l’elaborazione. L’elaborazione utilizza la CPU e non richiede una GPU dedicata.'
