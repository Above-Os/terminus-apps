metadata:
  title: Cognee
  description: Build searchable knowledge graphs from documents and text
spec:
  fullDescription: 'Cognee turns text and documents into connected knowledge that you can search and explore. This package includes the web interface and API. Set a password with at least 12 characters during installation and sign in as default_user@example.com. Existing account passwords are preserved on upgrade.


    AI Router default-chat is used for language tasks. A small embedding model runs locally inside Cognee and is downloaded on first use. Relational records use Olares PostgreSQL; uploaded data, graph files, vector indexes and model cache persist in application storage.


    This package pins an upstream development image. Initial model downloads can delay processing. Processing uses CPU and does not require a dedicated GPU.'
