metadata:
  title: Cognee
  description: ドキュメントやテキストから検索可能なナレッジグラフを構築
spec:
  fullDescription: 'Cogneeはテキストやドキュメントを、検索・探索できる相互につながった知識に変換します。このパッケージにはウェブインターフェースとAPIが含まれます。インストール時に12文字以上のパスワードを設定し、default_user@example.comでサインインします。既存アカウントのパスワードはアップグレード後も保持されます。


    言語処理にはAI Routerのdefault-chatを使用します。小規模な埋め込みモデルがCognee内でローカル実行され、初回利用時にダウンロードされます。リレーショナルデータにはOlares PostgreSQLを使用し、アップロードしたデータ、グラフファイル、ベクトルインデックス、モデルキャッシュはアプリのストレージに保持されます。


    このパッケージは、上流プロジェクトの開発用イメージを固定して使用します。初回のモデルダウンロードにより、処理に時間がかかる場合があります。処理にはCPUを使用し、専用GPUは不要です。'
