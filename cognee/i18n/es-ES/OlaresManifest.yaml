metadata:
  title: Cognee
  description: Crea grafos de conocimiento con búsqueda a partir de documentos y texto
spec:
  fullDescription: 'Cognee convierte textos y documentos en conocimiento conectado que puedes buscar y explorar. Este paquete incluye la interfaz web y la API. Durante la instalación, establece una contraseña de al menos 12 caracteres e inicia sesión como default_user@example.com. Las contraseñas de las cuentas existentes se conservan al actualizar.


    Las tareas de lenguaje utilizan AI Router default-chat. Un pequeño modelo de embeddings se ejecuta localmente dentro de Cognee y se descarga en el primer uso. Los registros relacionales utilizan Olares PostgreSQL; los datos subidos, los archivos del grafo, los índices vectoriales y la caché de modelos se conservan en el almacenamiento de la aplicación.


    Este paquete fija una imagen de desarrollo del proyecto original. Las descargas iniciales de modelos pueden retrasar el procesamiento. El procesamiento utiliza CPU y no requiere una GPU dedicada.'
