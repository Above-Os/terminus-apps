apiVersion: v1
kind: ConfigMap
metadata:
  name: cognee-mcp
  namespace: {{ .Release.Namespace | quote }}
data:
  start.py: |
    import json, os, re
    from pathlib import Path
    key = os.environ.get("MCP_API_KEY", "")
    if key and not re.fullmatch(r"[A-Za-z0-9_.-]+", key):
        raise ValueError("MCP_API_KEY contains unsupported characters")
    # The official server uses one configured API identity. Require its exact
    # key at the entrance so another account's key cannot access that identity.
    auth = Path("/mcp-auth/key.conf")
    auth.write_text("set $cognee_mcp_key " + json.dumps(key) + ";\n")
    auth.chmod(0o600)
    os.environ["COGNEE_API_KEY"] = key
    os.execv("/app/.venv/bin/cognee-mcp", ["cognee-mcp", "--transport", "http", "--host", "127.0.0.1", "--port", "8001", "--api-url", "http://127.0.0.1:8000", "--api-auth-scheme", "x-api-key", "--tool-mode", "all", "--no-migration"])
  nginx.conf: |
    pid /tmp/mcp-nginx.pid;
    error_log /dev/stderr warn;
    events {worker_connections 128;}
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/mcp-body;
      proxy_temp_path /tmp/mcp-proxy;
      fastcgi_temp_path /tmp/mcp-fastcgi;
      uwsgi_temp_path /tmp/mcp-uwsgi;
      scgi_temp_path /tmp/mcp-scgi;
      server {
        listen 8083;
        client_max_body_size 15m;
        include /mcp-auth/key.conf;
        location ~ ^/mcp/?$ {
          if ($http_x_api_key = "") { return 401; }
          if ($http_x_api_key != $cognee_mcp_key) { return 403; }
          proxy_pass http://127.0.0.1:8001;
          proxy_set_header Host 127.0.0.1:8001;
          proxy_set_header Origin "";
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 1800s;
          proxy_send_timeout 1800s;
        }
        location / { return 404; }
      }
    }
