metadata:
  title: "MiniMax H3"
  description: "MiniMax H3 はテキスト、最初と最後のフレーム、または参照画像・動画・音声から音声付きの動画を作ります。フル品質か、Lightning LoRA による高速生成を選べます"
spec:
  fullDescription: |
    MiniMax 公式の H3 モデル（INT8）で、映像と音声を同期して生成します。プロンプトを書き、必要に応じて最初と最後のフレーム、または最大 5 枚の参照画像、1 本の参照動画、1 つの参照音声を追加すると、アプリが対応するワークフローを選びます。品質モードは 20 ステップ、高速モードは MiniMax の Lightning LoRA を加えて 8 ステップ（参照素材ありは 4 ステップ）で動きます。結果、アップロードした素材、キューは Olares に保存され、アプリを開くすべてのデバイスで共有されます。

    このアプリは、Olares 上でこのモデルを動かします。
    - 素材トレイ付きのプロンプト欄：最初と最後のフレーム、または参照画像・動画・音声を追加すると、対応するワークフローが選ばれます。
    - 品質モードは MiniMax H3 を 20 ステップで実行します。高速モードは MiniMax の Lightning LoRA を加え（8 ステップ、参照素材は 4 ステップ）、2 倍以上速くなります。
    - AI 最適化は Router のチャットモデルを使い、プロンプトを MiniMax H3 が想定する構造（ショット、セリフ、音）に書き直します。モデルは設定で選べます。
    - キューと結果のフィードはすべてのデバイスで共有され、各結果から再利用、最後のフレームから続ける、フレームの切り出し、ダウンロードができます。
    - アップロードと結果は Olares 上のライブラリに保存され、再起動後も残ります。
    - 各ワークフローを読み込んだ状態で ComfyUI エディターを開き、アプリ以外の変更もできます。
    - 管理者が一度インストールすれば Olares の全員が使えます。キュー、アップロード、結果は各自のもので、プロジェクトを使って選んだ人や全員と共有できます。
    - ファイルは Common/Studio の下に、ユーザーごとのフォルダーで保存されます。
    - モデルは初回起動時にダウンロードされ、他の ComfyUI アプリや FlowStudio と共有されます。

    AI 最適化を使うには、チャットモデルのアプリをインストールし、Router で利用できる状態にする必要があります。指示文は MiniMax の H3 プロンプト作成ガイドに基づき、独自の表現で書き直したものです。
  upgradeDescription: |
    最初のリリースです。
