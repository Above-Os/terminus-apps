metadata:
  title: "MiniMax H3"
  description: "MiniMax H3 crée des vidéos sonores à partir de texte, de première et dernière images, ou d'images, vidéo et audio de référence, en pleine qualité ou rapidement avec la LoRA Lightning"
spec:
  fullDescription: |
    Générez vidéo et audio synchronisés avec les modèles H3 de MiniMax en INT8. Écrivez un prompt, ajoutez si besoin une première et une dernière image, ou jusqu'à cinq images de référence, une vidéo et un audio de référence, et l'app choisit le workflow adapté. Le mode Qualité fait 20 étapes ; le mode Rapide ajoute la LoRA Lightning de MiniMax et en fait 8, ou 4 avec des références. Les résultats, les imports et la file d'attente restent sur votre Olares et sont partagés sur tous les appareils où vous ouvrez l'app.

    L'app exécute le modèle sur votre Olares :
    - Une zone de prompt avec un plateau de médias : ajoutez première et dernière images, ou images, vidéo et audio de référence, et l'app choisit le workflow adapté.
    - Le mode Qualité exécute MiniMax H3 en 20 étapes ; le mode Rapide ajoute la LoRA Lightning de MiniMax (8 étapes, 4 avec des références) et va plus de deux fois plus vite.
    - L'optimisation IA réécrit votre prompt avec un modèle de chat de Router dans la structure attendue par MiniMax H3, avec plans, dialogues et son. Choisissez le modèle dans les réglages.
    - Une file d'attente et un fil de résultats partagés sur tous les appareils, avec réutiliser, continuer depuis la dernière image, extraire une image et télécharger pour chaque résultat.
    - Les imports et les résultats restent dans une bibliothèque sur votre Olares, même après un redémarrage.
    - L'éditeur ComfyUI complet s'ouvre avec chaque workflow chargé, pour aller au-delà de l'app.
    - Un administrateur l'installe une seule fois pour tous sur votre Olares ; la file d'attente, les imports et les résultats de chacun lui restent propres, et les projets permettent de les partager avec certaines personnes ou avec tous.
    - Les fichiers sont conservés dans Common/Studio, dans un dossier par personne.
    - Les modèles sont téléchargés au premier démarrage et partagés avec les autres apps ComfyUI et FlowStudio.

    L'optimisation IA nécessite une app de modèle de chat installée et disponible dans Router. Ses instructions suivent le guide de rédaction de prompts H3 de MiniMax, reformulé avec nos propres mots.
  upgradeDescription: |
    Première version.
