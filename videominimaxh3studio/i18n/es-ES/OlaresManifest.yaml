metadata:
  title: "MiniMax H3"
  description: "MiniMax H3 crea vídeos con sonido a partir de texto, primer y último fotograma, o imágenes, vídeo y audio de referencia, con calidad completa o rápido con la LoRA Lightning"
spec:
  fullDescription: |
    Genera vídeo y audio sincronizados con los modelos H3 de MiniMax en INT8. Elige el modo Texto, Fotogramas o Referencias y describe el vídeo que quieres crear. El modo Referencias admite hasta cinco imágenes, un vídeo y un clip de audio de referencia. El modo Calidad usa 20 pasos; el modo Rápido añade la LoRA Lightning de MiniMax y usa 8 pasos, o 4 con referencias. Los resultados, las subidas y la cola se guardan en tu Olares y se comparten en todos los dispositivos donde abras la app.

    La app ejecuta el modelo en tu Olares:
    - En el modo Texto, empieza con un prompt. En Fotogramas, añade un primer fotograma y, si quieres, uno final. En Referencias, añade imágenes o un vídeo y, opcionalmente, audio.
    - El modo Calidad ejecuta MiniMax H3 con 20 pasos; el modo Rápido añade la LoRA Lightning de MiniMax (8 pasos, 4 con referencias) y es más del doble de rápido.
    - La optimización con IA reescribe tu prompt con un modelo de chat de Router en la estructura que espera MiniMax H3, con planos, diálogo y sonido. El modelo se elige en Ajustes.
    - Una cola y un feed de resultados compartidos en todos los dispositivos, con reutilizar, continuar desde el último fotograma, capturar un fotograma y descargar en cada resultado.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con cada flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.

    La optimización con IA necesita una app de modelo de chat instalada y disponible en Router. Sus instrucciones siguen la guía de MiniMax para escribir prompts de H3, redactada con nuestras propias palabras.
  upgradeDescription: |
    MiniMax H3 ahora usa el mismo espacio de trabajo de vídeo que FastH3. Crea un vídeo en el modo Texto, Fotogramas o Referencias. Cambia entre Calidad y Rápido en los ajustes avanzados.
