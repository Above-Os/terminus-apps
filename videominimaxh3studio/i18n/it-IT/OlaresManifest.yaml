metadata:
  title: "MiniMax H3"
  description: "MiniMax H3 crea video con audio da testo, primo e ultimo fotogramma, o immagini, video e audio di riferimento, in qualità piena o in modo rapido con la LoRA Lightning"
spec:
  fullDescription: |
    Genera video e audio sincronizzati con i modelli H3 di MiniMax in INT8. Scegli la modalità Testo, Fotogrammi o Riferimenti e descrivi il video che vuoi creare. La modalità Riferimenti supporta fino a cinque immagini, un video e una clip audio di riferimento. La modalità Qualità usa 20 passi; la modalità Rapida aggiunge la LoRA Lightning di MiniMax e ne usa 8, o 4 con i riferimenti. Risultati, caricamenti e coda restano sul tuo Olares e sono condivisi su ogni dispositivo in cui apri l'app.

    L'app esegue il modello sul tuo Olares:
    - Nella modalità Testo, inizia con un prompt. In Fotogrammi, aggiungi il primo fotogramma e, se vuoi, anche l’ultimo. In Riferimenti, aggiungi immagini o video e, facoltativamente, audio.
    - La modalità Qualità esegue MiniMax H3 in 20 passi; la modalità Rapida aggiunge la LoRA Lightning di MiniMax (8 passi, 4 con i riferimenti) ed è più del doppio più veloce.
    - L'ottimizzazione IA riscrive il prompt con un modello di chat di Router nella struttura attesa da MiniMax H3, con inquadrature, dialoghi e suono. Il modello si sceglie nelle Impostazioni.
    - Una coda e un feed di risultati condivisi su tutti i dispositivi, con riuso, continua dall'ultimo fotogramma, estrai un fotogramma e scarica su ogni risultato.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con ogni workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.

    L'ottimizzazione IA richiede un'app di modello di chat installata e disponibile in Router. Le sue istruzioni seguono la guida di MiniMax alla scrittura dei prompt per H3, riformulata con parole nostre.
  upgradeDescription: |
    Visualizza in anteprima i fotogrammi e i contenuti di riferimento, controlla i limiti di caricamento e annulla la cancellazione dei dati inseriti. Imposta una durata precisa e consulta quale riferimento determina le proporzioni automatiche.

    Confronta i tempi stimati delle modalità Qualità e Rapida, se disponibili. Segui la coda e l’avanzamento, filtra i risultati per modalità, risoluzione o stato e consulta il tempo effettivo di generazione dei video e dei gruppi di lavori completati.

    [Vedi questa versione](https://github.com/beclab/flowstudio2/releases/tag/videominimaxh3studio/v0.1.7)
