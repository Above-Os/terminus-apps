metadata:
  title: "MiniMax H3"
  description: "MiniMax H3 erstellt Videos mit Ton aus Text, erstem und letztem Bild oder Referenzbildern, -videos und -audio, in voller Qualität oder schnell mit der Lightning-LoRA"
spec:
  fullDescription: |
    Erzeugen Sie synchrones Video und Audio mit den H3-Modellen von MiniMax in INT8. Wählen Sie den Modus für Text, Einzelbilder oder Referenzen und beschreiben Sie das gewünschte Video. Im Referenzmodus können Sie bis zu fünf Referenzbilder, ein Referenzvideo und einen Referenzaudioclip hinzufügen. Qualität läuft mit 20 Schritten; Schnell nutzt zusätzlich die Lightning-LoRA von MiniMax und braucht 8 Schritte, mit Referenzen 4. Ergebnisse, Uploads und die Warteschlange bleiben auf Ihrem Olares und sind auf jedem Gerät verfügbar, auf dem Sie die App öffnen.

    Die App führt das Modell auf Ihrem Olares aus:
    - Beginnen Sie im Textmodus mit einem Prompt. Fügen Sie im Einzelbildmodus ein erstes und optional ein letztes Bild hinzu. Im Referenzmodus können Sie Bilder oder Video und optional Audio hinzufügen.
    - Qualität führt MiniMax H3 mit 20 Schritten aus; Schnell nutzt zusätzlich die Lightning-LoRA von MiniMax (8 Schritte, 4 mit Referenzen) und ist mehr als doppelt so schnell.
    - KI-Optimierung schreibt Ihren Prompt mit einem Chat-Modell aus dem Router in die Struktur um, die MiniMax H3 erwartet, mit Einstellungen, Dialog und Ton. Das Modell wählen Sie in den Einstellungen.
    - Eine Warteschlange und ein Ergebnis-Feed, geteilt auf allen Geräten, mit Wiederverwenden, Fortsetzen ab dem letzten Bild, Einzelbild entnehmen und Herunterladen bei jedem Ergebnis.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem jeweiligen Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.

    Für die KI-Optimierung muss eine Chat-Modell-App installiert und im Router verfügbar sein. Ihre Anweisungen folgen dem H3-Leitfaden von MiniMax zum Schreiben von Prompts, in eigenen Worten formuliert.
  upgradeDescription: |
    MiniMax H3 verwendet jetzt denselben Video-Arbeitsbereich wie FastH3. Erstellen Sie Videos im Modus für Text, Einzelbilder oder Referenzen. In den erweiterten Einstellungen wechseln Sie zwischen Qualität und Schnell.
