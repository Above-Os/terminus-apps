metadata:
  title: "MiniMax H3"
  description: "MiniMax H3 从文字、首尾帧或参考图片、视频和音频生成带声音的视频，可选完整质量，或用 Lightning LoRA 快速生成"
spec:
  fullDescription: |
    使用 MiniMax 官方的 H3 模型（INT8）同步生成视频和音频。选择文生、首尾帧或参考模式，再描述想生成的视频。参考模式最多支持五张参考图片、一段参考视频和一段参考音频。质量档运行 20 步；快速档加上 MiniMax 的 Lightning LoRA，只需 8 步，有参考素材时 4 步。结果、上传的素材和队列都保存在你的 Olares 上，在任何设备上打开应用都能看到。

    这个应用在你的 Olares 上运行该模型：
    - 文生模式从提示词开始。首尾帧模式需要添加首帧，尾帧可选。参考模式可添加图片或视频，也可以附上音频。
    - 质量档以 20 步运行 MiniMax H3；快速档加上 MiniMax 的 Lightning LoRA（8 步，参考素材 4 步），速度是质量档的两倍多。
    - AI 优化使用 Router 中的对话模型，把提示词改写成 MiniMax H3 需要的结构，包括分镜、台词和声音。可在设置中选择模型。
    - 队列和结果流在所有设备上同步，每个结果都可以复用、从最后一帧继续、截取画面和下载。
    - 上传的素材和生成结果保存在 Olares 的素材库中，重启后仍在。
    - 可以打开完整的 ComfyUI 编辑器，每个工作流都已载入，用于应用之外的修改。
    - 管理员安装一次，Olares 上的所有人都能用；每个人的队列、上传和结果各自独立，可以通过项目分享给指定的人或所有人。
    - 文件保存在 Common/Studio 下，每人一个文件夹。
    - 模型在首次启动时下载，并与其他 ComfyUI 应用和 FlowStudio 共享。

    AI 优化需要安装一个对话模型应用，并在 Router 中可用。它的指令参考 MiniMax 的 H3 提示词写作指南，由我们重新撰写。
  upgradeDescription: |
    MiniMax H3 采用与 FastH3 相同的视频工作台，支持文生、首尾帧和参考三种模式。可在高级设置中切换质量和快速。
