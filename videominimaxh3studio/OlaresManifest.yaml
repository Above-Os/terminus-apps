spec:
  versionName: "0.1.4"
  onlyAdmin: true
  fullDescription: |
    Generate synchronized video and audio with MiniMax's own H3 models in INT8. Choose Text, Frames, or References, then describe the video you want to make. References mode supports up to five reference images, one reference video, and one reference audio clip. Quality runs 20 steps; Fast adds MiniMax's Lightning LoRA and takes 8 steps, or 4 with references. Results, uploads and the queue are kept on your Olares and shared by every device you open the app on.

    The app runs the model on your Olares:
    - Choose Text to start with a prompt, Frames to add a first frame and an optional last frame, or References to add images or video with optional audio.
    - Quality runs MiniMax H3 at 20 steps; Fast adds MiniMax's Lightning LoRA (8 steps, 4 for references) and is more than twice as fast.
    - AI optimize rewrites your prompt into the structure MiniMax H3 expects, with shots, dialogue and sound, using a chat model from Router. Pick the model in Settings.
    - A queue and a result feed shared by every device you open it on, with reuse, continue from the last frame, grab a frame and download on each result.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with each workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.

    AI optimize needs a chat model application installed and listed in Router. Its instructions follow MiniMax's H3 prompt-writing guide, written in our own words.
  upgradeDescription: |
    Disable local file drops in the video input area to prevent stuck drag-and-drop prompts. Use the file picker to add local media.
  developer: Olares
  website: https://github.com/beclab/flowstudio2
