metadata:
  title: Hermes Agent
  description: "L'agent qui grandit avec vous"
spec:
  fullDescription: |
    **L'agent IA qui s'améliore lui-même, créé par [Nous Research](https://nousresearch.com).** C'est le seul agent avec une boucle d'apprentissage intégrée — il crée des skills à partir de l'expérience, les améliore pendant l'usage, se pousse à persister les connaissances, cherche dans ses conversations passées et construit un modèle de plus en plus profond de qui vous êtes entre les sessions. Exécutez-le sur un VPS à 5 $, un cluster GPU ou une infrastructure serverless qui ne coûte presque rien en idle. Il n'est pas lié à votre ordinateur portable — parlez-lui depuis Telegram pendant qu'il travaille sur une VM cloud.
    
    **Fonctionnalités clés**
    - **Une vraie interface terminal** : TUI complète avec édition multiligne, autocomplétion des slash-commands, historique de conversation, interrupt-and-redirect et sortie d'outils en streaming.
    - **Vit là où vous êtes** : Telegram, Discord, Slack, WhatsApp, Signal et CLI — le tout depuis un seul processus gateway. Transcription de mémos vocaux, continuité de conversation multiplateforme.
    - **Une boucle d'apprentissage fermée** : Mémoire curatée par l'agent avec des nudges périodiques. Création autonome de skills après des tâches complexes. Les skills s'améliorent pendant l'usage. Recherche de sessions FTS5 avec résumé LLM pour le rappel inter-sessions. Modélisation dialectique utilisateur [Honcho](https://github.com/plastic-labs/honcho). Compatible avec le standard ouvert [agentskills.io](https://agentskills.io).
    - **Automatisations planifiées** : Planificateur cron intégré avec livraison sur n'importe quelle plateforme. Rapports quotidiens, sauvegardes nocturnes, audits hebdomadaires — le tout en langage naturel, sans supervision.
    - **Délègue et parallélise** : Lance des sous-agents isolés pour des workstreams parallèles. Écrivez des scripts Python qui appellent des outils via RPC, en condensant des pipelines multi-étapes en tours à coût de contexte nul.
    - **Tourne partout, pas seulement sur votre ordinateur** : Six backends terminal — local, Docker, SSH, Singularity, Modal et Daytona. Daytona et Modal offrent une persistence serverless — l'environnement de votre agent hiberne en idle et se réveille à la demande, ne coûtant presque rien entre les sessions. Exécutez-le sur un VPS à 5 $ ou un cluster GPU.
    - **Prêt pour la recherche** : Génération batch de trajectoires, compression de trajectoires pour entraîner la prochaine génération de modèles tool-calling.
  upgradeDescription: |
    Mise à jour vers Hermes Agent v0.21.1 (v2026.9.7) : améliorations du démarrage, des fichiers, des fournisseurs, des modèles, de MCP, de cron et de la délégation.

    https://github.com/NousResearch/hermes-agent/releases/tag/v2026.9.7
