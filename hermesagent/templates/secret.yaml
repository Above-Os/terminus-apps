apiVersion: v1
kind: Secret
metadata:
  name: hermesagent-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hermesagent
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  API_SERVER_KEY: {{ .Values.olaresEnv.HERMES_API_SERVER_KEY | default "" | quote }}
