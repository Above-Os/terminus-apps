metadata:
  description: "Qwen3-TTS 1.7B Base for zero-shot voice cloning from a reference clip."
  title: Qwen3-TTS Clone 1.7B

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Qwen3-TTS 1.7B Base for zero-shot voice cloning from a reference clip.

    **配置**
    - 模型：`Qwen/Qwen3-TTS-12Hz-1.7B-Base`
    - 来源：`hf://Qwen/Qwen3-TTS-12Hz-1.7B-Base`
    - 能力：`tts_clone`
    - GPU 显存：`6Gi`
    - 引擎：faster-qwen3-tts（进程内，CUDA Graph）

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
