metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: Qwopus3.6-27B-v2 MTP Q4_K_M servido con llama.cpp
spec:
  upgradeDescription: |
    v1.0.13: Reducir la reserva de memoria de host NVIDIA para que los nodos timeslice 1.12.6 instalen más fácilmente (solicitud del motor 21Gi→6Gi, requiredMemory del chart 22Gi→7Gi). La cuota de GPU no cambia.

    v1.0.9: Mover `HF_TOKEN` a Secret (`secretKeyRef`); mapear HF desde `OLARES_SYSTEM_HUGGINGFACE_*`; subir llama.cpp a `server-cuda12-b10068`.

    v1.0.8: LLAMACPP_MEMORY_LIMIT 30Gi; límite llm-init 2Gi; limitedMemory 32Gi (30+2).
    v1.0.7: memoria de host nvidia — requiredMemory 22Gi, LLAMACPP_MEMORY_REQUEST 21Gi, LLAMACPP_MEMORY_LIMIT 26Gi, limitedMemory 30Gi.
    v1.0.6: memoria de host nvidia — requiredMemory 16Gi, LLAMACPP_MEMORY_REQUEST 15Gi, LLAMACPP_MEMORY_LIMIT 19Gi, limitedMemory 26Gi.
    v1.0.5: subir llm-init a v1.3.1.
  fullDescription: |
    **Resumen del modelo**
    Qwopus3.6-27B-v2 con cabezas Multi-Token Prediction (MTP) integradas, cuantización `Q4_K_M` de `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF`, servido mediante decodificación draft de llama.cpp. Variante afinada de Qwen3.6-27B para cargas de coding, matemáticas y agentes. Preset solo texto (sin visión/mmproj).

    Recomendado cuando necesita alta velocidad de generación de tokens, o cuando su carga requiere salida estructurada estricta y tareas estilo DevOps. Esta build de la comunidad está afinada para salidas compactas y bien formadas en esos escenarios.

    **Configuración del preset**
    - Modelo: `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF:Q4_K_M`
    - Capacidades: thinking, tools
    - Args del motor: `-c 131072 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1 --spec-type draft-mtp --spec-draft-n-max 2` (12
    - MTP añade una sobrecarga moderada de VRAM; si hay OOM con el contexto completo de 128K, reduzca `-c` (p. ej. `-c 65536`).
    - Memoria GPU requerida: `23Gi`

    **Cómo funciona**
    Primero, `Model Console` descarga el modelo y lo prepara; luego `llama.cpp` empieza a servir cuando está listo. MTP (`--spec-type draft-mtp`) usa la cabeza draft integrada del modelo para predecir varios tokens por paso y aumentar el throughput de decode.

    **Stack**
    - **llama.cpp**: Ejecuta el modelo y sirve solicitudes API (puerto 8081)
    - **Model Console**: Descarga el modelo, muestra el progreso y proporciona la API OpenAI en el puerto 8090, con proxy a `llamacpp`.

    **Modos de acelerador**
    | Mode           | Device            | Details                                          |
    |----------------|-------------------|--------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Usa `23Gi` de memoria GPU; `-ngl all` para GPU completa |
    | `nvidia-gb10`  | GPU (Spark)       | Como arriba, pero la memoria la gestiona el pod  |

    **Almacenamiento del modelo**
    Todos los archivos del modelo se guardan en una carpeta compartida en `appCommon/huggingface`, montada como `/cache/hf/hub`. Todas las apps similares usan esta ubicación para modelos.
