metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: "Un modelo de programación y razonamiento servido con llama.cpp. llm-init y el motor de inferencia comparten el estado de ejecución mediante Common y pueden ejecutarse en nodos distintos."

spec:
  upgradeDescription: |
    v1.0.24: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

    v1.0.23: Model Console (llm-init) se ha actualizado a v1.7.26.

    v1.0.21: Model Console (llm-init) se ha actualizado a v1.7.21.

    Model Console se actualiza a llm-init v1.7.19.

    Esta consola descarga el modelo, muestra el progreso y proporciona la API compatible con OpenAI.
  fullDescription: |
    Qwopus3.6-27B-v2 es un ajuste fino comunitario de Qwen3.6-27B para programación, matemáticas, trabajo DevOps y salida estructurada estricta. La Multi-Token Prediction (MTP) permite que el modelo redacte más de un token por paso, lo que puede aumentar la velocidad de generación. Esta aplicación sirve la compilación GGUF `Q4_K_M` solo texto de `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF` con llama.cpp. El ajuste preestablecido admite el razonamiento y la llamada a herramientas, y no incluye visión.

    **Funciones principales**

    - Generar respuestas de código, matemáticas y de estilo DevOps.
    - Usar el razonamiento y la llamada a herramientas.
    - Redactar varios tokens por paso con las cabezas MTP integradas.
    - Poner el modelo a disposición de las aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `23Gi` de memoria GPU. Si un contexto de 128K agota la memoria GPU, baje el valor `-c` en `ENGINE_ARGS`.

    Para los detalles del modelo, consulte la [página GGUF de Qwopus3.6-27B-v2-MTP](https://huggingface.co/Jackrong/Qwopus3.6-27B-v2-MTP-GGUF).
