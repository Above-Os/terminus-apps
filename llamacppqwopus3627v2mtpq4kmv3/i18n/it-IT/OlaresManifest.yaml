metadata:
  title: Qwopus3.6-27B MTP (llama.cpp)
  description: "Un modello di programmazione e ragionamento servito con llama.cpp. llm-init e il motore di inferenza condividono lo stato di esecuzione tramite Common e possono essere eseguiti su nodi diversi."

spec:
  upgradeDescription: |
    v1.0.24: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

    v1.0.23: Model Console (llm-init) è stato aggiornato alla versione v1.7.26.

    v1.0.21: Model Console (llm-init) è stato aggiornato alla versione v1.7.21.

    Model Console viene aggiornato a llm-init v1.7.19.

    Questa console scarica il modello, mostra l'avanzamento e fornisce l'API compatibile OpenAI.
  fullDescription: |
    Qwopus3.6-27B-v2 è un fine-tune della community di Qwen3.6-27B per programmazione, matematica, lavoro DevOps e output strutturato rigoroso. La Multi-Token Prediction (MTP) consente al modello di predire più di un token per passo, il che può aumentare la velocità di generazione. Questa app serve la build GGUF `Q4_K_M` solo testo da `Jackrong/Qwopus3.6-27B-v2-MTP-GGUF` con llama.cpp. Il preset supporta il ragionamento e la chiamata di strumenti e non include la visione.

    **Funzionalità principali**

    - Generare risposte di codice, matematica e in stile DevOps.
    - Usare il ragionamento e la chiamata di strumenti.
    - Predire più token per passo con le teste MTP integrate.
    - Rendere il modello disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `23Gi` di memoria GPU. Se un contesto 128K esaurisce la memoria GPU, riduci il valore `-c` in `ENGINE_ARGS`.

    Per i dettagli del modello, consulta la [pagina GGUF Qwopus3.6-27B-v2-MTP](https://huggingface.co/Jackrong/Qwopus3.6-27B-v2-MTP-GGUF).
