apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaneo.secretName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kaneo
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AUTH_SECRET: {{ include "kaneo.authSecret" . | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.databases.kaneo }}"
