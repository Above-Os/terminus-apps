olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

metadata:
  name: kaneo
  appid: kaneo
  title: Kaneo
  description: Focused, fast, open source project management
  icon: https://cdn.olares.com/images/2026/08/6a6e24447c18942d9e38949c7c2f76ae.png
  version: 1.0.0
  categories:
  - Productivity_v112

entrances:
- name: kaneo
  host: kaneo
  port: 5173
  title: Kaneo
  icon: https://cdn.olares.com/images/2026/08/6a6e24447c18942d9e38949c7c2f76ae.png
  authLevel: private
  openMethod: window

spec:
  versionName: "2.16.2"
  fullDescription: |
    Kaneo is a fast, focused project management platform for teams that want
    to organize work without unnecessary process or clutter.

    ## Highlights
    - Organize projects and tasks with clear Kanban boards
    - Collaborate with team members in a clean, responsive interface
    - Track priorities, labels, assignees, due dates, and task activity
    - Keep project data on your own Olares
    - Connect AI tools through Kaneo's built-in MCP endpoint

    Kaneo is open source under the MIT License.
  developer: Kaneo
  website: https://kaneo.app/
  sourceCode: https://github.com/usekaneo/kaneo
  submitter: pengpeng
  featuredImage: https://cdn.olares.com/images/2026/08/0145b4201938a325d589cbde23c3ddc3.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/0145b4201938a325d589cbde23c3ddc3.png
  - https://cdn.olares.com/images/2026/08/8074c82e53aedaf748fcf4e75936ce86.png
  - https://cdn.olares.com/images/2026/08/592abc4989cfa810752c7fd8c380b0e1.png
  locale:
  - en-US
  doc: https://kaneo.app/docs/core
  license:
  - text: MIT
    url: https://github.com/usekaneo/kaneo/blob/main/LICENSE
  requiredMemory: 256Mi
  limitedMemory: 1Gi
  requiredDisk: 50Mi
  limitedDisk: 1Gi
  requiredCpu: 100m
  limitedCpu: "1"
  supportArch:
  - amd64
  - arm64

middleware:
  postgres:
    username: kaneo
    databases:
    - name: kaneo

options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

workloadReplicas:
  kaneo: 1
