spec:
  onlyAdmin: true
  versionName: 'nvidia/Qwen3.6-35B-A3B-NVFP4'
  upgradeDescription: |
    v1.0.0: First release. Derived from the llama.cpp GGUF preset
      (llamacppqwen3635ba3bggufv3 v1.0.24), with three things changed:
      the engine is FreeToken 0.1.3 (CUDA 13) instead of llama.cpp, the
      weights are NVIDIA's NVFP4 checkpoint instead of a GGUF quant, and
      the experts live in host RAM under FreeToken's offload strategy
      rather than being offloaded to the GPU whole.

      Three consequences worth reading before installing:

      - Host RAM, not just VRAM. `--moe-strategy auto` resolves to
        `offload` on this MoE checkpoint: the NVFP4 expert banks (21.8Gi
        measured) stay in host memory for the life of the process and
        stream over PCIe into an LRU cache on the card. The engine
        container therefore reserves 24Gi and may grow to 32Gi, where the
        GGUF preset reserved 6Gi.
      - The preset pins `--expert-load serial`. FreeToken's default
        (`auto`) reads the expert banks in parallel, which needs the banks
        plus a whole-shard buffer on top (the largest NVFP4 shard is
        9.3Gi), and it sizes that read against free host RAM -- a number
        that inside a container describes the node, not the cgroup. On a
        node with 84Gi free it takes the parallel path and the 32Gi
        container is OOMKilled about 25 seconds in, right after "Loading
        experts". `serial` is the bounded, reclaimable read.
      - amd64 only. The FreeToken image is built for x86_64 CUDA 13,
        so there is no `nvidia-gb10` (DGX Spark) mode here and the
        driver must be recent enough for CUDA 13 (R580+).
  fullDescription: |
    **Model Overview**
    Qwen3.6-35B-A3B is a Mixture-of-Experts vision-language model from the Qwen series (Alibaba), with 35B total parameters and about 3B active per token. This app serves NVIDIA's `nvidia/Qwen3.6-35B-A3B-NVFP4` checkpoint — the same model quantized to NVFP4 with TensorRT Model Optimizer — through FreeToken, a CUDA serving runtime built for exactly this shape of model: a small active path plus a large bank of experts that does not have to fit in VRAM.

    **Preset Configuration**
    - Model: `nvidia/Qwen3.6-35B-A3B-NVFP4` (safetensors, ~23.5 GB downloaded once into the shared cache)
    - Capabilities: thinking, tools, vision
    - Engine args: `--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1`
    - Required GPU memory: `23Gi`; engine host memory request `24Gi`, limit `32Gi` (the expert banks live in host RAM, not on the card)

    **What the engine args mean**
    - `--moe-strategy auto` — FreeToken picks the MoE placement. On this checkpoint that is `offload`: experts stay in host RAM, an LRU slice of them is cached on the GPU, and misses stream over PCIe. (Run `ft bench bw` once inside the container and `auto` can upgrade to `hybrid`; the profile it writes to `~/.cache/freetoken/benchbw/` survives restarts, that directory is a mounted volume.)
    - `--max-seq-len-override 131072` — 128K tokens per request. The checkpoint itself declares 256K positions; capping it at 128K keeps the KV pool inside a 24GB card.
    - `--expert-load serial` — how the expert banks are read into host RAM at startup. `auto` would read them in parallel, which is faster but needs the banks (21.8Gi) plus a whole-shard buffer on top, and it decides that against *free host RAM* — a number that inside a container describes the node, not the cgroup. That is how a 32Gi container got OOMKilled on a node with 84Gi free. `serial` is the bounded read.
    - `--max-prefill-length 8192` — chunked-prefill chunk size. Long prompts are prefilled in 8192-token chunks rather than one allocation.
    - `--kv-reserve-tokens 131072` — floor the KV pool at 128K tokens *before* the expert cache claims free VRAM. Without it the expert cache fills the card first and leaves only the 8192-token default, which is what a 128K request would actually hit.
    - `--max-running-requests 1` — one request at a time, so that single request owns the whole KV pool and everything left over goes to the expert cache. Model Console and Router read this number off the card and queue accordingly.

    Everything else resolves from the checkpoint and the card: attention backend, NVFP4 kernels, expert-cache size, CUDA-graph batch size, and the tool-call and reasoning parsers. The vision encoder is built by default (`--text-model-only` skips it and gives its VRAM to the KV and expert pools).

    **Accelerator modes**
    | Mode      | Device     | Details                                                        |
    |-----------|------------|----------------------------------------------------------------|
    | `nvidia`  | GPU (CUDA) | `23Gi` GPU memory; experts stream from host RAM                 |

    **How It Works**
    First, Model Console downloads the model and gets it ready, then FreeToken starts serving it. These two parts run separately but share files and progress info.

    **Stack**
    - **FreeToken**: runs the model and serves the OpenAI and Anthropic APIs (port 30000 in-cluster)
    - **Model Console**: downloads the model, shows progress, and provides the OpenAI API on port 8090, proxying to the engine.

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.


  developer: Alibaba
  website: https://qwen.ai/home
  sourceCode: https://github.com/FlashML-org/FreeToken
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: Apache-2.0
      url: https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4

  accelerator:
    # nvidia — discrete GPU; FREETOKEN_REQUIRED_GPU_MEMORY -> nvidia.com/gpumem.
    # No nvidia-gb10 entry: the FreeToken image is amd64-only (CUDA 13
    # devel base -- tag 0.1.3-cu132; the kernels are compiled on first use).
    - mode: nvidia
      limitedCpu: "15360m"
      requiredCpu: "1100m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      # Engine MEMORY_REQUEST 24Gi + llm-init 256Mi <= requiredMemory 25Gi;
      # MEMORY_LIMIT 32Gi + llm-init 2Gi <= limitedMemory 34Gi.
      #
      # The request has to cover the model itself: under MoE offload the NVFP4
      # expert banks (21.8Gi, measured) sit in host RAM for the life of the
      # process -- they are the model, not a transient. Steady state is ~25Gi
      # with the ~3Gi python/torch/CUDA context on top, and --expert-load
      # serial keeps the startup read bounded, so there is no load-time spike
      # to leave room for: the 32Gi cap is ~7Gi of headroom over steady state,
      # and an OOMKill under it would mean something is actually growing.
      limitedMemory: "34Gi"
      requiredMemory: "25Gi"
      requiredGPUMemory: "23Gi"
      limitedGPUMemory: "24Gi"

  supportArch:
    - amd64
permission:
  appCache: true
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  # Model is preset for this app; these values are fixed and not user-editable.
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://nvidia/Qwen3.6-35B-A3B-NVFP4"
    description:  "Example: hf://nvidia/Qwen3.6-35B-A3B-NVFP4. The source to download your model. FreeToken loads a Hugging Face checkpoint directory, so the whole repo is fetched — no `--include` filter."
    regex: "^hf://"
  - envName: MODEL_NAME          # served model id, also the name Router shows
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "nvidia/Qwen3.6-35B-A3B-NVFP4"
    description:  "Example: nvidia/Qwen3.6-35B-A3B-NVFP4. The model id this app serves, passed to FreeToken as --served-model-name."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "thinking,tools,vision"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description:  "The model capabilities. Pick what your model supports, if no extra capabilities, pick None."
  - envName: ENGINE_ARGS
    required: true
    default: "--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1"
    type: string
    editable: true
    applyOnChange: true
    description:  "Raw `ft serve` flags. `--moe-strategy auto` picks the MoE placement (offload on this checkpoint), `--max-seq-len-override` sets the context window, `--kv-reserve-tokens` floors the KV pool before the expert cache takes the rest of the VRAM, `--max-running-requests` is the concurrency, `--expert-load serial` bounds how much host RAM the expert-bank read needs (see below). The wrapper also accepts SGLang's `--context-length N` as an alias for `--max-seq-len-override N`, which is the only spelling the model card can read the window from; a native `--max-seq-len-override` always wins over it."
  - envName: LOG_LEVEL           # single-select: debug | info | warn | error
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: FREETOKEN_CPU_REQUEST    # default: 500m
    required: true
    default: "500m"
    type: string
    editable: false
    applyOnChange: false
  - envName: FREETOKEN_MEMORY_REQUEST # sum with llm-init <= requiredMemory 25Gi
    required: true
    default: "24Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: FREETOKEN_CPU_LIMIT      # default: 8
    required: true
    default: "8"
    type: string
    editable: false
    applyOnChange: false
  - envName: FREETOKEN_MEMORY_LIMIT # 32Gi + llm-init 2Gi <= limitedMemory 34Gi
    required: true
    default: "32Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: FREETOKEN_REQUIRED_GPU_MEMORY  # 23Gi/23552/23552Mi -> bare-MiB gpumem
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "23Gi"
    description:  "Example: `23Gi`, `23552`, or `23552Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB."
    regex: "^[0-9]+(Gi|Mi)?$"
