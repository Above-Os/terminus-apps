{{- $freetokenclientDomainENV := split "," .Values.domain.freetokenclient -}}
{{- $freetokenclientDomain := index $freetokenclientDomainENV "_0" -}}
{{- /* Clone-configurable surface via olaresEnv. FreeToken loads a Hugging Face
       checkpoint directory, so MODEL_SOURCE is a bare `hf://<repo>` (whole repo,
       no --include) and llm-init writes the snapshot dir to model_path, which
       wrappers/freetoken.sh passes to `ft serve --model`. MODEL_NAME is only the
       served model id. ENGINE_ARGS is a string of raw `ft serve` flags. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- /* MODEL_SUPPORTS is a multi-select of coarse capability GROUPS (vision /
       tools / thinking). Expand each group one-to-many into the supports_*
       keys llm-init validates against its gateway AllSupports mirror, then
       re-join into the CSV the container env expects. "none" is the
       required-field fallback (no extra capabilities); the legacy "embedding"
       token is kept as an alias for it. Unknown tokens pass through verbatim
       so a raw supports_* key still works. */ -}}
{{- $supportsGroups := dict
      "vision" "supports_vision"
      "tools" "supports_function_calling,supports_parallel_function_calling,supports_tool_choice"
      "thinking" "supports_reasoning,supports_reasoning_effort"
      "none" ""
      "embedding" "" -}}
{{- $modelSupports := $oe.MODEL_SUPPORTS | default "" -}}
{{- $expandedSupports := list -}}
{{- range $tok := splitList "," $modelSupports -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- if hasKey $supportsGroups $tok -}}
{{- $mapped := index $supportsGroups $tok -}}
{{- if $mapped -}}
{{- $expandedSupports = append $expandedSupports $mapped -}}
{{- end -}}
{{- else -}}
{{- $expandedSupports = append $expandedSupports $tok -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $modelSupports = join "," $expandedSupports -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- $logLevel := $oe.LOG_LEVEL | default "debug" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $runStateHostPath := printf "%s/llm-init-run/%s" .Values.userspace.appCommon .Release.Name -}}
---
# llm-init Pod (no GPU). Downloads the checkpoint, writes sentinel + model_path,
# serves progress UI + OpenAI /v1/* proxy on :8090, and reverse-proxies the
# engine at the URL it derives from ENGINE_KIND.
#
# ENGINE_KIND=freetoken derives http://freetoken:1919, matching the Service
# in freetoken.yaml, which forwards to the engine on port 30000.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Static name — engine Deployment uses {{ .Release.Name }} for allowMultipleInstall.
  name: llminit
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llm-init
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
    spec:
      restartPolicy: Always
      volumes:
        - name: legacy-run-state
          hostPath:
            path: "{{ .Values.userspace.appCache }}/llm-init-run/{{ .Release.Name }}"
            type: DirectoryOrCreate
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
      initContainers:
        - name: migrate-run-state
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              mkdir -p /run/llm-init
              chown 1000:1000 /run/llm-init
              if [ -f /run/llm-init/model-spec.json ]; then
                exit 0
              fi
              if [ -f /legacy-run-state/model-spec.json ]; then
                # Publish the config last so an interrupted copy can be retried.
                stage=/run/llm-init/.legacy-migration
                mkdir -p "$stage"
                cp -a /legacy-run-state/. "$stage/"
                mv "$stage/model-spec.json" /run/llm-init/.model-spec.migrating
                cp -a "$stage/." /run/llm-init/
                rm -rf "$stage"
                mv /run/llm-init/.model-spec.migrating /run/llm-init/model-spec.json
              fi
          volumeMounts:
            - name: legacy-run-state
              mountPath: /legacy-run-state
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        # hostPath dirs are created root-owned; llm-init runs as UID 1000.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - "mkdir -p /cache/hf/hub/.locks /cache/hf/hub/freetoken-cache && chown 1000:1000 /cache/hf/hub /cache/hf/hub/.locks /cache/hf/hub/freetoken-cache /run/llm-init"
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
          securityContext:
            runAsUser: 0
      containers:
        - name: llm-init
          image: docker.io/beclab/llm-init:v1.7.24
          imagePullPolicy: IfNotPresent
          env:
            - name: ENGINE_KIND
              value: freetoken
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: "{{ $modelSource }}"
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
{{- if $modelSupports }}
            - name: MODEL_SUPPORTS
              value: "{{ $modelSupports }}"
{{- end }}
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "{{ $logLevel }}"
            - name: LOG_FORMAT
              value: json
            - name: APP_URL
              value: "https://{{ $freetokenclientDomain }}"
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # The safetensors shards stream to disk with a bounded footprint,
              # but `hf download` still runs a python subprocess in this cgroup;
              # 2Gi gives the huggingface_hub CLI headroom on a 3-shard repo.
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP
