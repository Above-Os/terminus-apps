metadata:
  description: "FreeTokenで提供するQwen3.6視覚言語モデル"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    **プリセット構成**

    - モデル：`nvidia/Qwen3.6-35B-A3B-NVFP4`（約23.5 GB。`appCommon/huggingface`へ一度だけダウンロード）
    - コンテキスト：リクエストあたり128Kトークン（ネイティブ262,144。キャッシュが`23Gi`のGPUメモリに収まるよう制限）
    - 機能：思考、ツール、ビジョン
    - 同時実行：同時に処理するリクエストは1件
    - エンジン引数：`--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1`
    - GPUメモリ：`23Gi`。エンジンのホストメモリrequest `24Gi`、limit `32Gi`（エキスパートの重みはホストRAMに常駐）
    - GPU：NVIDIA、CUDA 13（ドライバR580以降）

    このアプリは、ローカルNVIDIA GPU上のMixture-of-Expertsモデル向けFlashMLエンジンであるFreeTokenでチェックポイントを提供します。FreeTokenはエキスパートの重みをホストメモリに置き、GPU上で作業中のエキスパートをキャッシュし、初回起動時にチェックポイントをFTWへ変換して`appCache/freetoken-ftw`に保存して以降再利用し、OpenAIおよびAnthropic互換APIを提供します。[FreeToken](https://github.com/FlashML-org/FreeToken)を参照してください。

    Qwen3.6-35B-A3BはAlibabaのQwenシリーズの視覚言語Mixture-of-Expertsモデルで、総パラメータ数は35B、トークンあたり約3Bがアクティブです。テキストと画像を受け取り、思考とツール呼び出しに対応します。このプリセットはNVIDIAの4-bit NVFP4量子化を使用します。[Qwen3.6-35B-A3Bモデルカード](https://huggingface.co/Qwen/Qwen3.6-35B-A3B)と[NVFP4チェックポイント](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4)を参照してください。
