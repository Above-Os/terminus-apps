metadata:
  description: "Ein Qwen3.6-Vision-Language-Modell, bereitgestellt mit FreeToken"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    **Preset-Konfiguration**

    - Modell: `nvidia/Qwen3.6-35B-A3B-NVFP4` (etwa 23.5 GB, einmalig nach `appCommon/huggingface` heruntergeladen)
    - Kontext: 128K Token pro Anfrage (nativ 262,144; begrenzt, damit der Cache in `23Gi` GPU-Speicher passt)
    - Fähigkeiten: Nachdenken, Werkzeuge, Vision
    - Nebenläufigkeit: eine laufende Anfrage gleichzeitig
    - Engine-Argumente: `--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1`
    - GPU-Speicher: `23Gi`; Hostspeicher der Engine request `24Gi`, limit `32Gi` (Expertengewichte bleiben im Host-RAM)
    - GPU: NVIDIA, CUDA 13 (Treiber R580 oder neuer)

    Diese App stellt den Checkpoint mit FreeToken bereit, einer FlashML-Engine für Mixture-of-Experts-Modelle auf einer lokalen NVIDIA-GPU. FreeToken hält Expertengewichte im Hostspeicher, speichert eine Arbeitsmenge auf der GPU zwischen, wandelt den Checkpoint beim ersten Start nach FTW in `appCache/freetoken-ftw` um und stellt OpenAI- und Anthropic-kompatible APIs bereit. Siehe [FreeToken](https://github.com/FlashML-org/FreeToken).

    Qwen3.6-35B-A3B ist ein visuell-sprachliches Mixture-of-Experts-Modell der Qwen-Serie von Alibaba, mit 35 Milliarden Parametern insgesamt und etwa 3 Milliarden aktiv pro Token. Es akzeptiert Text und Bilder und unterstützt Nachdenken sowie Werkzeugaufrufe. Dieses Preset verwendet die 4-bit-NVFP4-Quantisierung von NVIDIA. Siehe die [Qwen3.6-35B-A3B-Modellkarte](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) und den [NVFP4-Checkpoint](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4).
