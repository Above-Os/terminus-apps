metadata:
  description: "Un modello visivo-linguistico Qwen3.6 servito con FreeToken"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    **Configurazione predefinita**

    - Modello: `nvidia/Qwen3.6-35B-A3B-NVFP4` (circa 23.5 GB, scaricato una sola volta in `appCommon/huggingface`)
    - Contesto: 128K token per richiesta (nativo 262,144; limitato perché la cache stia in `23Gi` di memoria GPU)
    - Capacità: ragionamento, strumenti, visione
    - Concorrenza: una richiesta in esecuzione alla volta
    - Argomenti del motore: `--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1`
    - Memoria GPU: `23Gi`; memoria host del motore request `24Gi`, limit `32Gi` (i pesi degli esperti restano nella RAM host)
    - GPU: NVIDIA, CUDA 13 (driver R580 o successivo)

    Questa app fornisce il checkpoint con FreeToken, un motore FlashML per modelli Mixture-of-Experts su una GPU NVIDIA locale. FreeToken tiene i pesi degli esperti nella memoria host, mette in cache un insieme di esperti attivi sulla GPU, converte il checkpoint in FTW in `appCache/freetoken-ftw` al primo avvio per i riavvii successivi e fornisce API compatibili con OpenAI e Anthropic. Vedere [FreeToken](https://github.com/FlashML-org/FreeToken).

    Qwen3.6-35B-A3B è un modello Mixture-of-Experts visivo-linguistico della serie Qwen di Alibaba, con 35 miliardi di parametri in totale e circa 3 miliardi attivi per token. Accetta testo e immagini e supporta ragionamento e chiamata di strumenti. Questo preset usa la quantizzazione NVFP4 a 4-bit di NVIDIA. Vedere la [scheda del modello Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) e il [checkpoint NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4).
