metadata:
  description: "Un modelo de visión y lenguaje Qwen3.6 servido con FreeToken"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    **Configuración predefinida**

    - Modelo: `nvidia/Qwen3.6-35B-A3B-NVFP4` (unos 23.5 GB, descargado una sola vez en `appCommon/huggingface`)
    - Contexto: 128K tokens por solicitud (nativo 262,144; limitado para que la caché quepa en `23Gi` de memoria GPU)
    - Capacidades: razonamiento, herramientas, visión
    - Concurrencia: una solicitud en ejecución a la vez
    - Argumentos del motor: `--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1`
    - Memoria GPU: `23Gi`; memoria del host del motor request `24Gi`, limit `32Gi` (los pesos de los expertos permanecen en la RAM del host)
    - GPU: NVIDIA, CUDA 13 (controlador R580 o posterior)

    Esta aplicación sirve el checkpoint con FreeToken, un motor de FlashML para modelos Mixture-of-Experts en una GPU NVIDIA local. FreeToken mantiene los pesos de los expertos en la memoria del host, almacena en caché un conjunto de expertos activos en la GPU, convierte el checkpoint a FTW en `appCache/freetoken-ftw` en el primer arranque para reutilizarlo después y ofrece API compatibles con OpenAI y Anthropic. Véase [FreeToken](https://github.com/FlashML-org/FreeToken).

    Qwen3.6-35B-A3B es un modelo Mixture-of-Experts de visión y lenguaje de la serie Qwen de Alibaba, con 35 mil millones de parámetros en total y unos 3 mil millones activos por token. Acepta texto e imágenes y admite razonamiento y llamada a herramientas. Este preset usa la cuantización NVFP4 de 4-bit de NVIDIA. Véase la [ficha del modelo Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) y el [checkpoint NVFP4](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4).
