metadata:
  description: "通过 FreeToken 运行的 Qwen3.6 视觉语言模型"
  title: Qwen3.6-35B-A3B (FreeToken)

spec:
  fullDescription: |
    **预设配置**

    - 模型：`nvidia/Qwen3.6-35B-A3B-NVFP4`（约 23.5 GB，只下载一次到 `appCommon/huggingface`）
    - 上下文：每次请求 128K token（原生 262,144；压到 128K 是为了让缓存放入 `23Gi` 显存）
    - 能力：思考、工具、视觉
    - 并发：同一时间只处理 1 个请求
    - 引擎参数：`--moe-strategy auto --expert-load serial --max-seq-len-override 131072 --kv-reserve-tokens 131072 --max-prefill-length 8192 --max-running-requests 1`
    - 显存：`23Gi`；引擎主机内存 request `24Gi`、limit `32Gi`（专家权重常驻主机内存）
    - GPU：NVIDIA，CUDA 13（驱动 R580 或更高）

    本应用通过 FreeToken 提供该检查点。FreeToken 是 FlashML 的混合专家推理引擎，在本地 NVIDIA GPU 上运行：专家权重放在主机内存，活跃专家缓存在 GPU 上，首次启动会把检查点转换成 FTW 并保存到 `appCache/freetoken-ftw` 供之后复用，并提供 OpenAI 与 Anthropic 兼容 API。详见 [FreeToken](https://github.com/FlashML-org/FreeToken)。

    Qwen3.6-35B-A3B 是阿里巴巴 Qwen 系列的视觉语言混合专家模型，总参数量 35B，每个 token 约激活 3B。它接受文本和图像，支持思考和工具调用。本预设使用 NVIDIA 的 4-bit NVFP4 量化。详见 [Qwen3.6-35B-A3B 模型卡](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) 和 [NVFP4 检查点](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4)。
