{{- /* vLLM engine Deployment. ENGINE_ARGS = raw vLLM CLI flags, word-split and
       appended after --model by wrappers/vllm.sh. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- /* Defaults avoid empty K8s quantities. CPU needs "m" (200m = 0.2 core).
       Sums (llm-init + vllm) must fit the manifest accelerator limits. */ -}}
{{- $cpuRequest := trim ($oe.VLLM_CPU_REQUEST | default "200m") -}}
{{- $memRequest := trim ($oe.VLLM_MEMORY_REQUEST | default "2Gi") -}}
{{- $cpuLimit := trim ($oe.VLLM_CPU_LIMIT | default "6") -}}
{{- $memLimit := trim ($oe.VLLM_MEMORY_LIMIT | default "35Gi") -}}
{{- $gpuType := include "llmbase.gpuType" . -}}
{{- $engineImage := include "vllmllmbasev3.engineImage" . -}}
{{- $gb10FromNodes := eq (include "llmbase.isGb10" .) "true" -}}
{{- $isAmdGpu := eq $gpuType "amd-gpu" -}}
{{- $isIntelIgpu := eq $gpuType "intel" -}}
{{- $isIntelGpu := eq $gpuType "intel-gpu" -}}
{{- $isIntelXpu := or $isIntelIgpu $isIntelGpu -}}
{{- $needDri := or $isAmdGpu $isIntelXpu -}}
{{- /* intel iGPU is unified memory (same as Spark): size pod memory from quota. */ -}}
{{- $unifiedMem := or $gb10FromNodes (eq $gpuType "nvidia-gb10") $isIntelIgpu -}}
{{- /* nvidia.com/gpumem is NVIDIA-HAMi only. amd-gpu / intel-gpu use
       gpu-inject + manifest requiredGPUMemory. */ -}}
{{- $needNvidiaGpumem := and (not $unifiedMem) (not $isAmdGpu) (not $isIntelGpu) -}}
{{- $shmLimit := "16Gi" -}}
{{- if $isIntelXpu -}}
{{- $shmLimit = "10Gi" -}}
{{- end -}}
{{- $engineArgs = include "vllmllmbasev3.engineArgs" (dict "Args" $engineArgs) -}}
{{- /* nvidia.com/gpumem: nvidia -> explicit in chart; gb10 -> pod memory quota only,
       gpu-inject sets matching requests/limits (chart gpumem on gb10 breaks K8s
       validation: requests has gpumem but limits stripped by platform). */ -}}
{{- $gpuMiB := include "llmbase.gpuMiB" ($oe.VLLM_REQUIRED_GPU_MEMORY | default "4096") -}}
{{- if $unifiedMem -}}
{{- $memRequest = printf "%sMi" $gpuMiB -}}
{{- $memLimit = printf "%sMi" $gpuMiB -}}
{{- end -}}
{{- /* Must match llm-init.yaml: per-release run-state hostPath. */ -}}
{{- $runStateHostPath := printf "%s/huggingface/llm-init-run/%s" .Values.userspace.appCommon .Release.Name -}}
---
# vLLM engine Deployment. wrappers/vllm.sh waits on llm-init's sentinel in
# the shared run-state dir, then serves --model "$MODEL_NAME" on :8000. llm-init
# reverse-proxies http://vllm:8000 via the "vllm" Service below.
# Shared hostPath volumes (read-only here, llm-init owns writes): hf-cache
# (/cache/hf/hub), run-state (sentinel handshake). vllm-cache and .nv/ComputeCache
# live as subdirs of the same appCommon/huggingface store (siblings to models--*).
apiVersion: apps/v1
kind: Deployment
metadata:
  # Primary workload: named after the release (== appid vllmllmbasev3) for v3
  # allowMultipleInstall. Label/selector stays io.kompose.service: vllm.
  name: '{{ .Release.Name }}'
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: vllm
  annotations:
    applications.app.bytetrade.io/gpu-inject: "vllm"
    vllmllmbasev3.io/engine-image: {{ $engineImage | quote }}
spec:
  replicas: {{ .Values.workloads.vllmllmbasev3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: vllm
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: llm-init-wrappers
            defaultMode: 0555
{{- if $isAmdGpu }}
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
{{- end }}
{{- if $needDri }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: drm
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $shmLimit }}
{{- end }}
{{- if $isAmdGpu }}
      securityContext:
        supplementalGroups:
          - 44
          - 992
{{- end }}
      containers:
        - name: vllm
          image: "{{ $engineImage }}"
          imagePullPolicy: IfNotPresent
{{- if $isIntelXpu }}
          command: ["/bin/bash", "/llm-init/wrappers/vllm.sh"]
{{- else }}
          command: ["/bin/sh", "/llm-init/wrappers/vllm.sh"]
{{- end }}
          env:
            - name: ENGINE_KIND
              value: vllm
            - name: WRAPPER_COMMON
              value: /run/llm-init/wrappers/common.sh
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: VLLM_PORT
              value: "8000"
            - name: WAIT_TIMEOUT
              value: "3600"
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
            - name: OLARES_GPU_MODE
              value: {{ $gpuType | quote }}
            # Read the model llm-init already downloaded to the shared HF Hub
            # cache (hostPath /cache/hf/hub) instead of re-downloading to the
            # container's default ~/.cache/huggingface (ephemeral, lost on restart). 
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: PYTHONUNBUFFERED
              value: "1"
{{- if $isIntelXpu }}
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
{{- end }}
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
{{- if $unifiedMem }}
            - name: VLLM_PATCH_SPARK_MEM_UTILS
              value: "true"
            - name: VLLM_SPARK_AUTO_GPU_UTIL
              value: "false"
{{- end }}
{{- if $isAmdGpu }}
            # RDNA4 (R9700 / gfx1201): AITER C++/ASM kernels are unreliable;
            # Triton FlashAttention is the supported path. Wrapper also maps
            # gfx1201 in AITER's Triton arch table for FP8 imports.
            - name: VLLM_ROCM_USE_AITER
              value: "0"
            - name: FLASH_ATTENTION_TRITON_AMD_ENABLE
              value: "TRUE"
            # gfx1201 GDN/Triton autotune can hang mid-decode (0 tok/s, engine
            # core stops logging). First-config skips the exploding IR path.
            - name: VLLM_TRITON_FORCE_FIRST_CONFIG
              value: "1"
            # HIP still sees the whole card; same Spark tuner maps ENGINE_ARGS
            # --gpu-memory-utilization 0.9 onto VLLM_REQUIRED_GPU_MEMORY.
            - name: VLLM_POD_MEMORY_MIB
              value: "{{ $gpuMiB }}"
{{- end }}
          ports:
            - name: vllm
              containerPort: 8000
          # No readiness/liveness probe (intentional): serving readiness is owned
          # by llm-init (polls /v1/models, flips its own /readyz). A probe here
          # would keep the Pod NotReady during the long model load and couple the
          # app status back to it. restartPolicy: Always still recovers crashes.
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: hf-cache
              mountPath: /cache/vllm
              subPath: vllm-cache
            - name: hf-cache
              mountPath: /root/.nv/ComputeCache
              subPath: .nv/ComputeCache
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /llm-init/wrappers
              readOnly: true
{{- if $isAmdGpu }}
            - name: kfd
              mountPath: /dev/kfd
{{- end }}
{{- if $needDri }}
            - name: dri
              mountPath: /dev/dri
            - name: drm
              mountPath: /sys/class/drm
            - name: dshm
              mountPath: /dev/shm
{{- end }}
          resources:
            # nvidia.com/gpumem: nvidia only in chart; gb10 / intel via pod
            # memory + gpu-inject; amd-gpu / intel-gpu via gpu-inject.
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if $needNvidiaGpumem }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if $needNvidiaGpumem }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
---
# Service name MUST be "vllm": llm-init v1.1.0 derives the engine URL
# http://vllm:8000 from ENGINE_KIND (no override). Internal only.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: vllm
spec:
  selector:
    io.kompose.service: vllm
  ports:
    - name: vllm
      port: 8000
      targetPort: 8000
  type: ClusterIP
