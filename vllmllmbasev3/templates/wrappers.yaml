# Engine wrapper mounted into the vLLM container at /llm-init/wrappers. Sources
# the helpers llm-init publishes into RUN_DIR and runs vLLM under
# supervise_engine, so Model Console can relaunch the engine with updated
# model-card engine_args without restarting the Pod. llm-init downloads the
# model and writes model_download_finish under /run/llm-init; the wrapper waits
# on it, then loads --model from MODEL_NAME (owner/repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-init-wrappers
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: vllm
data:
  spark_tune_gpu_util.py: |
    #!/usr/bin/env python3
    import os
    import re
    import sys

    args = os.environ.get("ENGINE_ARGS", "").strip()
    pod_mib = int(os.environ.get("VLLM_POD_MEMORY_MIB", "0") or "0")
    if pod_mib <= 0:
        print(args)
        raise SystemExit

    import torch

    if not torch.cuda.is_available():
        print(args)
        raise SystemExit

    _free, total = torch.cuda.mem_get_info()
    headroom = float(os.environ.get("VLLM_SPARK_UTIL_HEADROOM", "0.90"))
    target = (pod_mib * 1024 * 1024 / total) * headroom
    target = max(0.05, min(target, 0.95))

    old_m = re.search(r"--gpu-memory-utilization\s+([0-9.]+)", args)
    old = old_m.group(1) if old_m else None
    args = re.sub(r"\s*--gpu-memory-utilization\s+[0-9.]+", "", args).strip()
    args = f"{args} --gpu-memory-utilization {target:.4f}".strip()

    print(
        f"GPU budget {pod_mib}Mi vs visible pool {total / (1024 ** 3):.2f}GiB: "
        f"--gpu-memory-utilization {old or '<unset>'} -> {target:.4f}",
        file=sys.stderr,
    )
    print(args)
  vllm.sh: |
    #!/bin/sh
    # Waits for llm-init's sentinel, then starts vLLM's OpenAI server with
    # --model "$MODEL_NAME" (HF owner/repo). ENGINE_ARGS is word-split and
    # appended after the baseline flags, e.g. "--max-model-len 8192 --gpu-memory-utilization 0.9".
    # Do NOT pass --disable-log-stats (llm-init's /api/diag/gpu needs /metrics).
    set -eu

    ENGINE=vllm
    # Source the shared helpers llm-init publishes into RUN_DIR. That copy can
    # arrive late - the two containers are separate Deployments with no ordering
    # between them - so waiting here is the normal path.
    WRAPPER_COMMON=${WRAPPER_COMMON:-"$(dirname "$0")/common.sh"}
    _wc=0
    while [ ! -f "$WRAPPER_COMMON" ] && [ "$_wc" -lt "${WRAPPER_COMMON_WAIT:-3600}" ]; do
        printf '[wrapper] waiting for %s (elapsed=%ss)\n' "$WRAPPER_COMMON" "$_wc"
        sleep 5
        _wc=$((_wc + 5))
    done
    [ -f "$WRAPPER_COMMON" ] || { printf '[wrapper] %s never appeared\n' "$WRAPPER_COMMON" >&2; exit 1; }
    unset _wc
    . "$WRAPPER_COMMON"

    # DGX Spark (GB10 unified memory): disable vLLM's UMA free-memory override so
    # cudaMemGetInfo is used (legacy charts cleared shared_sysmem_device_mem_sms;
    # v0.20+ uses is_integrated_gpu instead).
    patch_spark_mem_utils() {
        [ "${VLLM_PATCH_SPARK_MEM_UTILS:-}" = "true" ] || return 0
        _MEM_UTILS="/usr/local/lib/python3.12/dist-packages/vllm/utils/mem_utils.py"
        if [ ! -f "$_MEM_UTILS" ]; then
            log "WARN: $_MEM_UTILS missing, Spark mem_utils patch skipped"
            return 0
        fi
        if grep -q 'spark-patched' "$_MEM_UTILS" || grep -q 'shared_sysmem_device_mem_sms = ()' "$_MEM_UTILS"; then
            log "mem_utils.py already Spark-patched"
            return 0
        fi
        if grep -q 'shared_sysmem_device_mem_sms = ' "$_MEM_UTILS"; then
            sed -i 's/shared_sysmem_device_mem_sms = .*$/shared_sysmem_device_mem_sms = ()/' "$_MEM_UTILS"
            if grep -q 'shared_sysmem_device_mem_sms = ()' "$_MEM_UTILS"; then
                log "patched mem_utils.py (shared_sysmem_device_mem_sms cleared)"
            else
                log "WARN: Spark mem_utils patch failed (shared_sysmem_device_mem_sms unchanged)"
            fi
        elif grep -q 'is_integrated_gpu(device.index)' "$_MEM_UTILS"; then
            sed -i 's/if current_platform.is_integrated_gpu(device.index):/if False:  # spark-patched/' "$_MEM_UTILS"
            if grep -q 'spark-patched' "$_MEM_UTILS"; then
                log "patched mem_utils.py (is_integrated_gpu branch disabled)"
            else
                log "WARN: Spark mem_utils patch failed (is_integrated_gpu pattern unchanged)"
            fi
        else
            log "WARN: no known Spark mem_utils pattern, patch skipped"
        fi
    }

    # Same tuner Spark uses: ENGINE_ARGS keeps --gpu-memory-utilization 0.9
    # against the quota; this rewrites it to visible-pool * (quota/card) * 0.9
    # when HIP/CUDA still sees the whole device (amd-gpu today; Spark when
    # VLLM_SPARK_AUTO_GPU_UTIL=true).
    tune_gpu_memory_utilization() {
        [ -n "${VLLM_POD_MEMORY_MIB:-}" ] || return 0
        _tune_script="/llm-init/wrappers/spark_tune_gpu_util.py"
        if [ ! -f "$_tune_script" ]; then
            log "WARN: $_tune_script missing, gpu util tune skipped"
            return 0
        fi
        _tune_log=$(mktemp)
        _new_args=$(ENGINE_ARGS="${ENGINE_ARGS:-}" python3 "$_tune_script" 2>"$_tune_log") || true
        if [ -s "$_tune_log" ]; then
            while IFS= read -r _line; do
                log "$_line"
            done <"$_tune_log"
        fi
        rm -f "$_tune_log"
        if [ -n "${_new_args:-}" ]; then
            ENGINE_ARGS="$_new_args"
        fi
    }

    spark_tune_gpu_memory_utilization() {
        [ "${VLLM_PATCH_SPARK_MEM_UTILS:-}" = "true" ] || return 0
        [ "${VLLM_SPARK_AUTO_GPU_UTIL:-false}" = "true" ] || return 0
        tune_gpu_memory_utilization
    }

    amd_tune_gpu_memory_utilization() {
        [ "${OLARES_GPU_MODE:-}" = "amd-gpu" ] || return 0
        tune_gpu_memory_utilization
    }

    looks_like_hf_repo_id() {
        s=$1
        case "$s" in
            ""|/*|./*|*://*) return 1 ;;
        esac
        case "$s" in
            */*)
                rest=${s#*/}
                case "$rest" in
                    */*|*:*) return 1 ;;
                esac
                return 0
                ;;
            *) return 1 ;;
        esac
    }

    # RDNA4 / gfx1201 (R9700): AITER C++/ASM is off (VLLM_ROCM_USE_AITER=0),
    # but vLLM FP8 still imports AITER Triton kernels that KeyError on gfx1201.
    # Map the arch so those Triton paths compile; no-op if aiter is absent.
    patch_rdna4_aiter_arch() {
        [ "${OLARES_GPU_MODE:-}" = "amd-gpu" ] || return 0
        python3 -c "import aiter.ops.triton.utils.arch_info as ai; ai._ARCH_TO_DEVICE.setdefault('gfx1201','MI350X'); ai._ARCH_TO_DEVICE.setdefault('gfx1200','MI350X')" >/dev/null 2>&1 || true
    }

    # Intel XPU image: libccl / Level Zero come from oneAPI setvars.
    source_oneapi() {
        case "${OLARES_GPU_MODE:-}" in
            intel|intel-gpu) ;;
            *) return 0 ;;
        esac
        if [ -f /opt/intel/oneapi/setvars.sh ]; then
            log "sourcing oneAPI env: /opt/intel/oneapi/setvars.sh"
            set +u
            # shellcheck disable=SC1091
            . /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
            set -u
        else
            log "WARN: /opt/intel/oneapi/setvars.sh missing; continuing without oneAPI env"
        fi
    }

    # XE1 / older iGPU: xpu_kernels may JIT bf16 SYCL paths the hardware lacks.
    # Discrete Arc is fine with the same native RMSNorm. Skip if the user set it.
    append_intel_xe1_compat() {
        case "${OLARES_GPU_MODE:-}" in
            intel|intel-gpu) ;;
            *) return 0 ;;
        esac
        case " ${ENGINE_ARGS:-} " in
            *" --ir-op-priority.rms_norm="*|*" --ir-op-priority.fused_add_rms_norm="*) return 0 ;;
        esac
        ENGINE_ARGS="${ENGINE_ARGS:-} --ir-op-priority.fused_add_rms_norm=native --ir-op-priority.rms_norm=native"
        ENGINE_ARGS=$(printf '%s' "$ENGINE_ARGS" | sed 's/^[[:space:]]*//')
    }

    wait_for_sentinel
    wait_for_engine_args_handoff

    if ! looks_like_hf_repo_id "${MODEL_NAME:-}"; then
        log "MODEL_NAME must be owner/repo for --model (got ${MODEL_NAME:-<empty>})"
        exit 1
    fi

    patch_spark_mem_utils
    patch_rdna4_aiter_arch
    source_oneapi

    run_vllm() {
        load_engine_args_from_handoff
        # Olares env field is ENGINE_ARGS; value must be flags only (not "ENGINE_ARGS=...").
        case "${ENGINE_ARGS:-}" in
            ENGINE_ARGS=*) ENGINE_ARGS=${ENGINE_ARGS#ENGINE_ARGS=} ;;
        esac
        # Re-tuned on every launch: the card's engine_args may set a different
        # --gpu-memory-utilization than the one this pod can actually afford.
        spark_tune_gpu_memory_utilization
        amd_tune_gpu_memory_utilization
        append_intel_xe1_compat
        log "starting vLLM with model=$MODEL_NAME args=${ENGINE_ARGS:-<empty>}"
        # shellcheck disable=SC2086  # intentional word-splitting of ENGINE_ARGS
        exec python3 -m vllm.entrypoints.openai.api_server \
            --model "$MODEL_NAME" \
            --served-model-name "$MODEL_NAME" \
            --host 0.0.0.0 \
            --port "${VLLM_PORT:-8000}" \
            ${ENGINE_ARGS:-} \
            "$@"
    }

    supervise_engine run_vllm "$@"
