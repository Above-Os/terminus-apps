metadata:
  description: "通用 vLLM 引擎基座。在安装时通过环境变量选择任意 HuggingFace Safetensors 模型。"
  title: vLLM 引擎基座

spec:
  upgradeDescription: |
    Chart 1.2.39 — 让 `amd-gpu` / `intel-gpu` 的显存配额可被解析。
    这两种模式改为下发 `gpu.bytetrade.io/*-gpu-memory` pod annotation，
    修复其 `requiredGPUMemory: "-1"` 被解析为 0、导致恢复时显卡被移出自身算力绑定的问题。
    NVIDIA 与 Spark 路径不变。

    Chart 1.2.37 — 新增 Intel 独显 XPU（`intel-gpu`），并升级 llm-init。
    Intel 引擎镜像：`intel/vllm:0.21.0-ubuntu24.04-20260805`。
    llm-init：`v1.5.0` → `v1.7.1`。
    NVIDIA / Spark / `amd-gpu` 路径不变。

    Chart 1.2.36 — 新增 AMD 独显（`amd-gpu` / ROCm）。

    **更新内容**
    - 新增加速器模式 `amd-gpu`，面向 AMD 独显（如 Radeon AI PRO R9700 / gfx1201）
    - `amd-gpu` 引擎镜像：`vllm/vllm-openai-rocm:v0.28.0`
    - NVIDIA CUDA 仍为 `vllm/vllm-openai:v0.27.1`；Spark 仍为 aarch64 标签
    - RDNA4 默认：关闭 AITER C++/ASM，启用 Triton FlashAttention，单卡（`--tensor-parallel-size 1`）

    详细发布说明请访问：
    https://github.com/vllm-project/vllm/releases
  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`hf://<仓库>`。HuggingFace 模型下载源，例如 `hf://Qwen/Qwen3.5-2B`。请选择包含 `.safetensors` 权重文件的仓库。可选追加 `--include <文件>` 或 `--revision <sha>`。
    - `MODEL_NAME`：`owner/repo`。模型名称，取 `MODEL_SOURCE` 中 `hf://` 之后的字符串，例如 `Qwen/Qwen3.5-2B`。此项也作为 OpenAI 别名和 vLLM `--model` 参数。
    - `MODEL_MODE`：`chat` 或 `embedding`。对话模型选 `chat`；向量模型选 embedding 时，图表会自动添加 `--task embed`。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能。
    - `ENGINE_ARGS`：`--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --enable-prefix-caching --kv-cache-dtype fp8`。vLLM 额外 CLI 参数，多个 `--key value` 之间用空格分隔。`amd-gpu`（RDNA4 / R9700）请加 `--attention-backend ROCM_ATTN` 并保持 `--tensor-parallel-size 1`，不要默认加 `--kv-cache-dtype fp8`。`intel-gpu`（Arc / XPU）可先用 `--dtype half --enforce-eager --block-size 64 --gpu-memory-utilization 0.95 --max-model-len 32768 --language-model-only`。详见 https://docs.vllm.ai/en/v0.17.0/configuration/engine_args/。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。llm-init 容器的日志等级。
    - `VLLM_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型所需显存。`nvidia` 下设置 `nvidia.com/gpumem`；`nvidia-gb10` 下设置 pod 内存供 gpu-inject 切分；`amd-gpu` 与 `intel-gpu` 下通过 pod annotation `gpu.bytetrade.io/required-gpu-memory` 声明独立显存配额。

    **工作流程说明**
    首先，`llm-init` 下载并准备模型，然后 vLLM 在模型准备好后启动服务。两个容器运行在同一 Pod 内，共享模型目录与就绪 sentinel。

    **技术栈说明**
    - **vLLM**（8000 端口）：运行模型并通过 API 提供服务
    - **llm-init**（8090 端口）：下载模型、展示进度，并通过 OpenAI API 代理到 vLLM

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `VLLM_REQUIRED_GPU_MEMORY`；可在 ENGINE_ARGS 中调整 `--gpu-memory-utilization` |
    | `nvidia-gb10`  | GPU (Spark)      | 与 `nvidia` 相同；`--gpu-memory-utilization` 由 ENGINE_ARGS 指定（不自动换算） |
    | `amd-gpu`      | GPU (ROCm)       | AMD 独显（如 Radeon AI PRO R9700 / gfx1201）。镜像 `vllm/vllm-openai-rocm:v0.28.0`。请使用 `--attention-backend ROCM_ATTN` 且 `--tensor-parallel-size 1`。 |
    | `intel-gpu`    | GPU (XPU)        | Intel Arc 独显（如 Arc Pro B70）。镜像 `intel/vllm:0.21.0-ubuntu24.04-20260805`。建议 `--dtype half --enforce-eager --block-size 64`。 |

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - vLLM 加载大模型可能需要数分钟，请保持应用 Running 直至就绪
    - 高并发场景下，vLLM 的 PagedAttention 可提供出色吞吐；可在 `ENGINE_ARGS` 中调整 `--max-num-batched-tokens` 和 `--gpu-memory-utilization`
