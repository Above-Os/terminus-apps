metadata:
  title: vLLM Engine Base
  description: Base genérica del motor vLLM. Elija cualquier modelo HuggingFace Safetensors en la instalación mediante env.
spec:
  upgradeDescription: |
    Actualizar vLLM de v0.26.0 a v0.27.1. Chart 1.2.29.

    **Cambios** (relevantes para Olares)

    v0.27.1
    - Compatibilidad con cabezas Markov DSpark cuantizadas

    v0.27.0
    - Soporte full-stack de Kimi K3 (kernels, DeepGEMM, compressed-tensors NVFP4, fusión DSpark AR)
    - Nuevos modelos: Qwen3.5 dense/MoE, K-EXAONE-2.0, VaultGemma, jina-embeddings-v5; Inkling NVFP4/FP8
    - Actualización a PyTorch 2.13.0 (cambio incompatible del entorno)
    - FlashAttention 4 en SM100: caché KV FP8 y headdim-256; el warmup JIT elimina stalls de la primera petición
    - DeepSeek-V4: paralelismo de secuencia, optimizaciones de router/topk, caché KV indexador MXFP4 compacto
    - Model Runner V2: atención solo encoder, pooling de embedding/clasificación, multimodal en CPU, MTP multicapa
    - Descarga KV: almacenamiento por niveles, nivel secundario P2P, políticas de eviction enchufables
    - Serving a gran escala: marco de tolerancia a fallos para DP+EP; NIXL P/D para modelos híbridos MLA+SSM
    - Frontend Rust: plano de control gRPC (salud, abort, discovery de modelo/KV); `vllm-bench` en la CLI

    Notas de versión detalladas:
    https://github.com/vllm-project/vllm/releases

  fullDescription: |
    **NOTA IMPORTANTE**
    Esta app es una plantilla y no puede usarse por sí sola. Para usarla, establezca las variables de entorno siguientes para conectar un modelo concreto.

    **Guía de configuración de variables de entorno**
    - `MODEL_SOURCE`: `hf://<repo>`. La fuente HuggingFace para descargar su modelo, por ejemplo `hf://Qwen/Qwen3.5-2B`. Use un repo que contenga archivos de pesos `.safetensors`. Opcionalmente añada `--include <file>` o `--revision <sha>`.
    - `MODEL_NAME`: `owner/repo`. El nombre de su modelo — use la cadena tras `hf://` en `MODEL_SOURCE`, por ejemplo `Qwen/Qwen3.5-2B`. También se usa como alias OpenAI y vLLM `--model`.
    - `MODEL_MODE`: `chat` o `embedding`. Use `chat` para modelos conversacionales; para embedding, el chart añade automáticamente `--task embed`.
    - `MODEL_SUPPORTS`: Opciones de capacidad del modelo (Vision / Tools / Thinking / None). Elija lo que su modelo admite.
    - `ENGINE_ARGS`: `--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --enable-prefix-caching --kv-cache-dtype fp8`. Flags CLI extra de vLLM. Separe varios pares `--key value` con espacios. Véase https://docs.vllm.ai/en/v0.17.0/configuration/engine_args/.
    - `LOG_LEVEL`: `debug`, `info`, `warn` o `error`. Nivel de log del contenedor llm-init.
    - `VLLM_REQUIRED_GPU_MEMORY`: `8Gi`, `8192` o `8192Mi`. Memoria de modelo necesaria. En `nvidia` establece `nvidia.com/gpumem`; en `nvidia-gb10` dimensiona la memoria del pod para gpu-inject.

    **Cómo funciona**
    Primero, `llm-init` descarga su modelo y lo prepara; luego vLLM empieza a servir el modelo cuando está listo. Ambos contenedores se ejecutan en el mismo Pod y comparten el directorio del modelo y el sentinel de readiness.

    **Stack**
    - **vLLM** (puerto 8000): ejecuta el modelo y sirve solicitudes API
    - **llm-init** (puerto 8090): descarga el modelo, muestra el progreso y proporciona la API OpenAI, con proxy a vLLM

    **Modos de acelerador**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Establezca `VLLM_REQUIRED_GPU_MEMORY`; ajuste `--gpu-memory-utilization` en ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Igual que `nvidia`; `--gpu-memory-utilization` desde ENGINE_ARGS (no se remapea automáticamente) |

    **Almacenamiento del modelo**
    Todos los archivos del modelo se guardan en una carpeta compartida en `appCommon/huggingface`, montada como `/cache/hf/hub`. Todas las apps similares usan esta ubicación para modelos.

    **Consejos de recursos**
    - CPU, RAM y GPU se autoconfiguran según el chart; los ajustes de disco son fijos.
    - La carga de modelos vLLM puede tardar varios minutos en modelos grandes. Mantenga la app Running hasta que esté lista.
    - Para cargas de alta concurrencia, PagedAttention de vLLM ofrece un fuerte throughput; ajuste `--max-num-batched-tokens` y `--gpu-memory-utilization` en `ENGINE_ARGS`.

