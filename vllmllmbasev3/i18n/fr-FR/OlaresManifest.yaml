metadata:
  title: vLLM Engine Base
  description: "Base générique du moteur vLLM. Choisissez n'importe quel modèle HuggingFace Safetensors à l'installation via env"
spec:
  upgradeDescription: |
    v1.2.44 : l'image du moteur NVIDIA passe à vLLM v0.29.0 (`v0.27.1` -> `v0.29.0`, y compris le tag `-aarch64` utilisé par Spark / GB10). ROCm reste sur `v0.28.0` et Intel XPU sur `0.21.0-ubuntu24.04-20260805`.

    **vLLM v0.29.0 (09/09/2026)**
    - Model Runner V2 devient le moteur par défaut pour tous les modèles, avec profilage mémoire des graphes CUDA pour le dimensionnement automatique du cache KV, échantillonnage réparti par lot (mémoire de logits par étape divisée par TP), prompt embeds et dispatch cudagraph FULL rembourré. Model Runner V1 est déprécié et sa suppression est prévue en v0.32.
    - Cache de préfixes Mamba avec points de contrôle internes de préremplissage : TTFT amélioré de 9% à 25%.
    - Nouveaux modèles : Hy4-preview, Qwen3.8-Flash-Next, GraniteSWA / GraniteMoeSWA, NemotronH_Omni_Reasoning_V3, Kimi K3 NVFP4.
    - Décodage spéculatif : statistiques d'acceptation par requête (`--per-request-spec-decode-metrics`), vérification adaptative avec logprobs, MLA creux SM100.
    - Nouvelles valeurs par défaut : all-reduce FlashInfer activé pour les groupes CUDA TP (désactivable via `VLLM_ALLREDUCE_USE_FLASHINFER=0`), `NONE_HASH` déterministe pour le cache de préfixes, et nouveau contrôle d'admission `--max-num-queued-reqs` / `--max-num-queued-tokens`.
    - Ruptures : dix architectures de modèles dépréciées et le décodeur vidéo PyAV supprimés ; `python -m vllm.entrypoints.openai.api_server` est déprécié au profit de `vllm serve`.

    **vLLM v0.28.0 (26/08/2026)**
    - Nouvelles valeurs par défaut : `max_num_batched_tokens` passe de 8192 à 16384, cache de préfixes activé par défaut pour les modèles Mamba, capture de graphe CUDA Blackwell portée à 1024.
    - Maturation de Model Runner V2 : désagrégation E/P/D, déchargement des poids, graphes CUDA pour l'encodeur, `thinking_token_budget`.
    - Déchargement hiérarchisé du cache KV, y compris vers le disque, avec métriques associées.
    - Important travail de performance sur Kimi-K3 / DeepSeek V4 (noyaux, parallélisme de contexte de décodage, décodage spéculatif).
    - Nouveaux modèles : Muse Glimmer, Ling 3.0 Flash, Dots3 NOTE, Interns2mobius.
    - Ruptures : bitsandbytes devient un plugin externe, Transformers passe à 5.15.0, `calculate_kv_scales` et `override_attention_dtype` sont supprimés.

    v1.2.43 : Model Console passe à llm-init v1.7.19.

    Ajout de la prise en charge des GPU AMD discrets (`amd-gpu`) avec ROCm. Chart 1.2.36 : budget de mémoire GPU de type Spark.

    **Changements**
    - Nouveau mode d'accélérateur `amd-gpu` pour les cartes AMD discrètes (Radeon AI PRO R9700 / gfx1201 et autres GPU ROCm)
    - Image du moteur avec `amd-gpu` : `vllm/vllm-openai-rocm:v0.28.0`
    - NVIDIA CUDA reste sur `vllm/vllm-openai:v0.27.1` ; Spark conserve le tag aarch64
    - Valeurs par défaut RDNA4 : AITER C++/ASM désactivé, Triton FlashAttention activé, GPU unique (`--tensor-parallel-size 1`)

    Notes de version détaillées :
    https://github.com/vllm-project/vllm/releases

  fullDescription: |
    **NOTE IMPORTANTE**
    Cette application est un modèle et ne peut pas être utilisée seule. Pour l'utiliser, définissez les variables d'environnement ci-dessous afin de connecter un modèle spécifique.

    **Guide de configuration des variables d'environnement**
    - `MODEL_SOURCE` : `hf://<repo>`. La source HuggingFace pour télécharger votre modèle, par exemple `hf://Qwen/Qwen3.5-2B`. Utilisez un dépôt contenant des fichiers de poids `.safetensors`. Ajoutez éventuellement `--include <file>` ou `--revision <sha>`.
    - `MODEL_NAME` : `owner/repo`. Le nom de votre modèle — utilisez la chaîne après `hf://` dans `MODEL_SOURCE`, par exemple `Qwen/Qwen3.5-2B`. Utilisé aussi comme alias OpenAI et vLLM `--model`.
    - `MODEL_MODE` : `chat` ou `embedding`. Utilisez `chat` pour les modèles conversationnels ; pour l'embedding, le chart ajoute automatiquement `--task embed`.
    - `MODEL_SUPPORTS` : Options de capacité du modèle (Vision / Tools / Thinking / None). Choisissez ce que votre modèle prend en charge.
    - `ENGINE_ARGS` : `--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --enable-prefix-caching --kv-cache-dtype fp8`. Indicateurs CLI vLLM supplémentaires. Séparez plusieurs paires `--key value` par des espaces. Sur `amd-gpu` (RDNA4 / R9700), préférez `--attention-backend ROCM_ATTN` et conservez `--tensor-parallel-size 1` ; n'utilisez pas `--kv-cache-dtype fp8` par défaut. Voir https://docs.vllm.ai/en/v0.17.0/configuration/engine_args/.
    - `LOG_LEVEL` : `debug`, `info`, `warn` ou `error`. Niveau de journal du conteneur llm-init.
    - `VLLM_REQUIRED_GPU_MEMORY` : `8Gi`, `8192` ou `8192Mi`. Mémoire modèle nécessaire. Sur `nvidia`, définit `nvidia.com/gpumem` ; sur `nvidia-gb10`, dimensionne la mémoire du pod pour gpu-inject ; sur `amd-gpu` et `intel-gpu`, déclare le quota de VRAM discrète via l'annotation de pod `gpu.bytetrade.io/required-gpu-memory`.

    **Fonctionnement**
    D'abord, `llm-init` télécharge votre modèle et le prépare ; puis vLLM commence à servir le modèle lorsqu'il est prêt. Les deux conteneurs s'exécutent dans le même Pod et partagent le répertoire du modèle et le sentinel de readiness.

    **Stack**
    - **vLLM** (port 8000) : exécute le modèle et sert les requêtes API
    - **llm-init** (port 8090) : télécharge le modèle, affiche la progression et fournit l'API OpenAI, avec proxy vers vLLM

    **Modes accélérateur**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Définir `VLLM_REQUIRED_GPU_MEMORY` ; régler `--gpu-memory-utilization` dans ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Comme `nvidia` ; `--gpu-memory-utilization` depuis ENGINE_ARGS (non remappé automatiquement) |
    | `amd-gpu`      | GPU (ROCm)        | AMD discret (p. ex. Radeon AI PRO R9700 / gfx1201). Image `vllm/vllm-openai-rocm:v0.28.0`. Utilisez `--attention-backend ROCM_ATTN` et `--tensor-parallel-size 1`. |

    **Stockage du modèle**
    Tous les fichiers du modèle sont stockés dans un dossier partagé à `appCommon/huggingface`, monté comme `/cache/hf/hub`. Toutes les apps similaires utilisent cet emplacement pour les modèles.

    **Conseils ressources**
    - CPU, RAM et GPU se configurent automatiquement selon le chart ; les réglages disque sont fixes.
    - Le chargement de modèles vLLM peut prendre plusieurs minutes pour les grands modèles. Gardez l'app Running jusqu'à ce qu'elle soit prête.
    - Pour les charges à haute concurrence, PagedAttention de vLLM offre un fort débit ; réglez `--max-num-batched-tokens` et `--gpu-memory-utilization` dans `ENGINE_ARGS`.
