olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: vllmllmbasev3
  icon: https://app.cdn.olares.com/appstore/vllm/icon.png
  description: "Generic vLLM engine base. Pick any HuggingFace Safetensors model at install via env."
  appid: vllmllmbasev3
  title: vLLM Engine Base
  version: '1.2.37'
  categories:
  - AI
  - models
  tags:
  - engine
sharedEntrances:
  - name: vllmllmbasev3
    host: sharedentrances-api
    port: 0
    title: vLLM API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/vllm/icon.png
entrances:
  - name: vllmclient
    port: 8090
    host: download-svc
    title: vLLM
    icon: https://app.cdn.olares.com/appstore/vllm/icon.png
    openMethod: window
    authLevel: internal
#   vllmllmbasev3 — engine Deployment (== appid / Release.Name)
#   llminit        — llm-init / entrance Deployment
workloadReplicas:
  vllmllmbasev3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: '0.27.1 / 0.28.0-rocm / 0.21.0-xpu'
  upgradeDescription: |
    Chart 1.2.37 — add Intel discrete XPU (`intel-gpu`) and bump llm-init.

    **What's Changed**
    - New accelerator mode `intel-gpu` for discrete Intel Arc (Arc Pro B70 and other XPU cards)
    - Engine image on `intel-gpu`: `intel/vllm:0.21.0-ubuntu24.04-20260805`
    - llm-init: `v1.5.0` → `v1.7.1`
    - Mount `/dev/dri` and `/sys/class/drm`; source oneAPI setvars; native RMSNorm on XE1
    - NVIDIA / Spark / `amd-gpu` paths unchanged

    Chart 1.2.36 — add AMD discrete GPU (`amd-gpu`) on ROCm.

    **What's Changed**
    - New accelerator mode `amd-gpu` for AMD discrete cards (Radeon AI PRO R9700 / gfx1201 and other ROCm GPUs)
    - Engine image on `amd-gpu`: `vllm/vllm-openai-rocm:v0.28.0`
    - NVIDIA CUDA stays on `vllm/vllm-openai:v0.27.1`; Spark stays on the aarch64 tag
    - RDNA4 defaults: AITER C++/ASM off, Triton FlashAttention on, single-GPU (`--tensor-parallel-size 1`)

    For detailed release notes, visit:
    https://github.com/vllm-project/vllm/releases
  fullDescription: |
    **IMPORTANT NOTE**  
    This app is a template and cannot be used on its own. To use it, set the environment variables below to connect a specific model.

    **Environment Variables Setup Guide**
    - `MODEL_SOURCE`: `hf://<repo>`. The HuggingFace source to download your model, for example `hf://Qwen/Qwen3.5-2B`. Use a repo that contains `.safetensors` weight files. Optionally append `--include <file>` or `--revision <sha>`.
    - `MODEL_NAME`: `owner/repo`. The name of your model — use the string after `hf://` in `MODEL_SOURCE`, for example `Qwen/Qwen3.5-2B`. This is also used as the OpenAI alias and vLLM `--model`.
    - `MODEL_MODE`: `chat` or `embedding`. Use `chat` for conversational models; for embedding, the chart auto-adds `--task embed`.
    - `MODEL_SUPPORTS`: Model capability options (Vision / Tools / Thinking / None). Pick what your model supports.
    - `ENGINE_ARGS`: `--max-model-len 65536 --gpu-memory-utilization 0.9 --tensor-parallel-size 1 --max-num-batched-tokens 8192 --enable-prefix-caching --kv-cache-dtype fp8`. Extra vLLM CLI flags. Separate multiple `--key value` pairs with spaces. On `amd-gpu` (RDNA4 / R9700) prefer `--attention-backend ROCM_ATTN` and keep `--tensor-parallel-size 1`; do not default `--kv-cache-dtype fp8`. On `intel-gpu` (Arc / XPU) a proven starting set is `--dtype half --enforce-eager --block-size 64 --gpu-memory-utilization 0.95 --max-model-len 32768 --language-model-only`. See https://docs.vllm.ai/en/v0.17.0/configuration/engine_args/.
    - `LOG_LEVEL`: `debug`, `info`, `warn`, or `error`. Log level for the llm-init container.
    - `VLLM_REQUIRED_GPU_MEMORY`: `8Gi`, `8192`, or `8192Mi`. Model memory needed. On `nvidia` sets `nvidia.com/gpumem`; on `nvidia-gb10` sizes pod memory for gpu-inject; on `amd-gpu` and `intel-gpu` sizes the discrete VRAM quota via gpu-inject. Tune `--gpu-memory-utilization` in ENGINE_ARGS against that budget.

    **How It Works**
    First, `llm-init` downloads your model and gets it ready, then vLLM starts serving the model when it's ready. Both containers run in the same Pod and share the model directory and readiness sentinel.

    **Stack**
    - **vLLM** (port 8000): runs the model and serves API requests
    - **llm-init** (port 8090): downloads the model, shows progress, and provides the OpenAI API, proxying to vLLM

    **Accelerator modes**
    | Mode           | Device            | Details                                                              |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | Set `VLLM_REQUIRED_GPU_MEMORY`; tune `--gpu-memory-utilization` in ENGINE_ARGS |
    | `nvidia-gb10`  | GPU (Spark)       | Same as `nvidia`: set `VLLM_REQUIRED_GPU_MEMORY`; tune `--gpu-memory-utilization` in ENGINE_ARGS (no auto remapping) |
    | `amd-gpu`      | GPU (ROCm)        | Discrete AMD (e.g. Radeon AI PRO R9700 / gfx1201). Image `vllm/vllm-openai-rocm:v0.28.0`. Use `--attention-backend ROCM_ATTN` and `--tensor-parallel-size 1`. |
    | `intel-gpu`    | GPU (XPU)         | Discrete Intel Arc (e.g. Arc Pro B70). Image `intel/vllm:0.21.0-ubuntu24.04-20260805`. Prefer `--dtype half --enforce-eager --block-size 64`. |

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`. All similar apps use this location for models.

    **Resource Tips**
    - CPU, RAM, and GPU auto-configure based on the chart; disk settings are fixed.
    - vLLM model loading can take several minutes for large models. Keep the app Running until ready.
    - For high-concurrency workloads, vLLM's PagedAttention delivers strong throughput; tune `--max-num-batched-tokens` and `--gpu-memory-utilization` in `ENGINE_ARGS`.

  developer: vLLM
  website: https://vllm.ai/
  sourceCode: https://github.com/vllm-project/vllm
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  license:
    - text: Apache-2.0
      url: https://github.com/vllm-project/vllm/blob/main/LICENSE

  accelerator:
    #   nvidia       — discrete GPU; VLLM_REQUIRED_GPU_MEMORY -> nvidia.com/gpumem
    #   nvidia-gb10  — DGX Spark unified memory; VLLM_REQUIRED_GPU_MEMORY -> pod memory
    #   amd-gpu      — discrete AMD ROCm; VLLM_REQUIRED_GPU_MEMORY -> gpu-inject VRAM quota
    #   intel-gpu    — discrete Intel Arc XPU; VLLM_REQUIRED_GPU_MEMORY -> gpu-inject
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
    - mode: amd-gpu
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: intel-gpu
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE        # example: hf://Qwen/Qwen3.5-2B
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: hf://Qwen/Qwen3.5-2B. The HuggingFace source to download your model. Use a repo with `.safetensors` weights. Optionally append `--include <file>` or `--revision <sha>`."
    regex: "^hf://"
  - envName: MODEL_NAME          # example: Qwen/Qwen3.5-2B
    required: true
    type: string
    editable: true
    applyOnChange: true
    description: "Example: Qwen/Qwen3.5-2B. The name of your model — use the string after `hf://` in MODEL_SOURCE. This is also used as the OpenAI alias and vLLM `--model`."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "The model capabilities. Pick what your model supports. If no extra capabilities, pick None."
  - envName: ENGINE_ARGS         # stability-first example for quantized Ornith 9B on 24GB: --max-model-len 131072 --gpu-memory-utilization 0.92 --tensor-parallel-size 1 --max-num-batched-tokens 4096 --kv-cache-dtype fp8 --quantization compressed-tensors --language-model-only --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_xml --trust-remote-code --enforce-eager
    required: true
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description: "Flags only — do not prefix with ENGINE_ARGS=. Example: --max-model-len 131072 --gpu-memory-utilization 0.92 .... On Spark (nvidia-gb10) and amd-gpu, keep --gpu-memory-utilization against VLLM_REQUIRED_GPU_MEMORY (do not scale it to the whole card). On amd-gpu (RDNA4 / R9700) add --attention-backend ROCM_ATTN and keep --tensor-parallel-size 1; skip --kv-cache-dtype fp8 unless you have verified it. On intel-gpu use --dtype half --enforce-eager --block-size 64."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: VLLM_CPU_REQUEST    # default: 200m
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: VLLM_MEMORY_REQUEST # default: 2Gi
    required: true
    default: "2Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: VLLM_CPU_LIMIT      # default: 6
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: VLLM_MEMORY_LIMIT   # default: 35Gi
    required: true
    default: "35Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: VLLM_REQUIRED_GPU_MEMORY  # GPU modes: 8Gi/8192/8192Mi -> bare-MiB gpumem; cpu: ignored
    required: true
    type: string
    editable: false
    applyOnChange: false
    description: "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On nvidia sets nvidia.com/gpumem; on nvidia-gb10 sizes pod memory; on amd-gpu and intel-gpu sizes the discrete VRAM quota via gpu-inject."
    regex: "^[0-9]+(Gi|Mi)?$"
