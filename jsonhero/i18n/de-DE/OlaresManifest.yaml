metadata:
  title: JSON Hero
  description: JSON-Dateien einfach lesen und verstehen.
spec:
  fullDescription: |
    JSON Hero ist ein quelloffener, schöner JSON-Explorer fürs Web, mit dem Sie Ihre JSON-Dateien schnell durchsuchen, suchen und navigieren können.
    
    JSON Hero macht das Lesen und Verstehen von JSON-Dateien einfach, indem es eine saubere und schöne Oberfläche mit zusätzlichen Funktionen bietet.
    - JSON so anzeigen, wie Sie möchten: Spaltenansicht, Baumansicht, Editoransicht und mehr.
    - Leitet den Inhalt von Zeichenketten automatisch ab und bietet nützliche Vorschauen
    - Erstellt ein abgeleitetes JSON Schema, das zur Validierung Ihres JSON verwendet werden könnte
    - Verwandte Werte schnell scannen, um Sonderfälle zu prüfen
    - JSON-Dateien durchsuchen (sowohl Schlüssel als auch Werte)
    - Tastaturzugänglich
    - Einfach teilbare URLs mit Pfadunterstützung
