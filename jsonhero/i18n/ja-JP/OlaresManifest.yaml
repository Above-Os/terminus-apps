metadata:
  title: JSON Hero
  description: JSON ファイルの読み取りと理解を簡単に。
spec:
  fullDescription: |
    JSON Hero は、JSON ファイルを高速に閲覧・検索・ナビゲートできる、オープンソースの美しい Web 向け JSON エクスプローラーです。
    
    JSON Hero は、追加機能を備えたクリーンで美しい UI により、JSON ファイルの読み取りと理解を簡単にします。
    - 好きな方法で JSON を表示：カラムビュー、ツリービュー、エディタービューなど
    - 文字列の内容を自動推論し、便利なプレビューを提供
    - JSON の検証に使える推論 JSON Schema を作成
    - 関連する値をすばやくスキャンしてエッジケースを確認
    - JSON ファイルを検索（キーと値の両方）
    - キーボード操作対応
    - パス対応で簡単に共有できる URL
