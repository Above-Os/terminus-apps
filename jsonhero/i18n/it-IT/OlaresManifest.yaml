metadata:
  title: JSON Hero
  description: Rendi semplice leggere e comprendere i file JSON.
spec:
  fullDescription: |
    JSON Hero è un bellissimo esploratore JSON open source per il web che ti permette di sfogliare, cercare e navigare i tuoi file JSON ad alta velocità.
    
    JSON Hero rende facile leggere e comprendere i file JSON offrendoti un'interfaccia pulita e bella ricca di funzioni extra.
    - Visualizza JSON come preferisci: vista a colonne, vista ad albero, vista editor e altro.
    - Deduce automaticamente il contenuto delle stringhe e fornisce anteprime utili
    - Crea uno JSON Schema dedotto che potrebbe essere usato per validare il tuo JSON
    - Scansiona rapidamente i valori correlati per individuare casi limite
    - Cerca nei tuoi file JSON (sia chiavi che valori)
    - Accessibile da tastiera
    - URL facilmente condivisibili con supporto dei percorsi
