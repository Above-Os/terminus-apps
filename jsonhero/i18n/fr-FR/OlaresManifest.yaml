metadata:
  title: JSON Hero
  description: Facilitez la lecture et la compréhension des fichiers JSON
spec:
  fullDescription: |
    JSON Hero est un bel explorateur JSON open source pour le web qui vous permet de parcourir, rechercher et naviguer dans vos fichiers JSON à grande vitesse.
    
    JSON Hero facilite la lecture et la compréhension des fichiers JSON en vous offrant une interface propre et belle riche en fonctionnalités.
    - Affichez le JSON comme vous le souhaitez : vue en colonnes, vue arborescente, vue éditeur, et plus encore.
    - Déduit automatiquement le contenu des chaînes et fournit des aperçus utiles
    - Crée un JSON Schema déduit qui pourrait servir à valider votre JSON
    - Scannez rapidement les valeurs liées pour détecter les cas limites
    - Recherchez dans vos fichiers JSON (clés et valeurs)
    - Accessible au clavier
    - URLs facilement partageables avec prise en charge des chemins
