metadata:
  title: JSON Hero
  description: Facilita la lectura y comprensión de archivos JSON.
spec:
  fullDescription: |
    JSON Hero es un explorador JSON hermoso y de código abierto para la web que te permite examinar, buscar y navegar tus archivos JSON a gran velocidad.
    
    JSON Hero facilita la lectura y comprensión de archivos JSON ofreciéndote una interfaz limpia y atractiva con funciones extra.
    - Visualiza JSON como quieras: vista de columnas, vista de árbol, vista de editor y más.
    - Infiere automáticamente el contenido de las cadenas y ofrece vistas previas útiles
    - Crea un JSON Schema inferido que podría usarse para validar tu JSON
    - Escanea rápidamente valores relacionados para detectar casos límite
    - Busca en tus archivos JSON (tanto claves como valores)
    - Accesible por teclado
    - URLs fáciles de compartir con soporte de rutas
