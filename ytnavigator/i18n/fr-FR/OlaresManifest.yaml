metadata:
  title: YT Navigator
  description: "Explorateur de contenu YouTube propulsé par l'IA"
spec:
  fullDescription: |
    YT Navigator est une application propulsée par l'IA qui vous aide à naviguer et rechercher efficacement le contenu des chaînes YouTube. Au lieu de regarder manuellement des heures de vidéos pour trouver des informations précises, YT Navigator vous permet de :
    - Rechercher dans les vidéos d'une chaîne avec des requêtes en langage naturel
    - Discuter avec le contenu d'une chaîne pour obtenir des réponses basées sur les transcriptions
    - Découvrir des segments vidéo pertinents avec des horodatages précis
    
    Parfait pour les chercheurs, étudiants, créateurs de contenu ou quiconque a besoin d'extraire rapidement des informations des chaînes YouTube.
    
    **Fonctionnalités principales**
    - Authentification : Connexion sécurisée et sessions indépendantes
    - Gestion des chaînes : Analysez jusqu'à 100 vidéos par chaîne et obtenez un résumé de la chaîne
    - Recherche : Trouvez des segments vidéo pertinents avec Semantic Search
    - Chat : Conversations avec une IA qui connaît le contenu de la chaîne
