metadata:
  title: YT Navigator
  description: KI-gestützter YouTube-Inhalts-Explorer
spec:
  fullDescription: |
    YT Navigator ist eine KI-gestützte Anwendung, die Ihnen hilft, YouTube-Kanalinhalte effizient zu navigieren und zu durchsuchen. Anstatt stundenlang Videos manuell anzusehen, um bestimmte Informationen zu finden, ermöglicht YT Navigator Ihnen:
    - Videos eines Kanals mit natürlichsprachlichen Abfragen zu durchsuchen
    - Mit dem Inhalt eines Kanals zu chatten und Antworten basierend auf Videotranskripten zu erhalten
    - Relevante Videosegmente mit präzisen Zeitstempeln zu entdecken
    
    Perfekt für Forscher, Studierende, Content-Ersteller oder alle, die schnell Informationen aus YouTube-Kanälen extrahieren müssen.
    
    **Hauptfunktionen**
    - Authentifizierung: Sichere Anmeldung und unabhängige Sitzungen
    - Kanalverwaltung: Bis zu 100 Videos pro Kanal scannen und eine Zusammenfassung des Kanals erhalten
    - Suche: Relevante Videosegmente mit Semantic Search finden
    - Chat: Gespräche mit einer KI führen, die den Inhalt des Kanals kennt
