metadata:
  title: YT Navigator
  description: AI 搭載の YouTube コンテンツエクスプローラー
spec:
  fullDescription: |
    YT Navigator は、YouTube チャンネルのコンテンツを効率的にナビゲート・検索できる AI 搭載アプリケーションです。特定の情報を探すために何時間も動画を手動で視聴する代わりに、YT Navigator では次のことができます：
    - 自然言語クエリでチャンネルの動画を検索
    - 動画トランスクリプトに基づく回答を得るため、チャンネルのコンテンツとチャット
    - 正確なタイムスタンプ付きの関連動画セグメントを発見
    
    研究者、学生、コンテンツクリエイター、または YouTube チャンネルからすばやく情報を抽出する必要があるすべての人に最適です。
    
    **主な機能**
    - 認証：安全なログインと独立したセッション
    - チャンネル管理：チャンネルあたり最大 100 本の動画をスキャンし、チャンネルの要約を取得
    - 検索：Semantic Search で関連する動画セグメントを検索
    - チャット：チャンネルの内容を把握した AI と会話
