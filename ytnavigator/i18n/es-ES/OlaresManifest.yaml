metadata:
  title: YT Navigator
  description: Explorador de contenido de YouTube impulsado por IA
spec:
  fullDescription: |
    YT Navigator es una aplicación impulsada por IA que te ayuda a navegar y buscar el contenido de canales de YouTube de forma eficiente. En lugar de ver horas de vídeos manualmente para encontrar información concreta, YT Navigator te permite:
    - Buscar en los vídeos de un canal con consultas en lenguaje natural
    - Chatear con el contenido de un canal para obtener respuestas basadas en las transcripciones
    - Descubrir segmentos de vídeo relevantes con marcas de tiempo precisas
    
    Perfecto para investigadores, estudiantes, creadores de contenido o cualquiera que necesite extraer información de canales de YouTube rápidamente.
    
    **Funciones principales**
    - Autenticación: Inicio de sesión seguro y sesiones independientes
    - Gestión de canales: Escanea hasta 100 vídeos por canal y obtén un resumen del canal
    - Búsqueda: Encuentra segmentos de vídeo relevantes con Semantic Search
    - Chat: Mantén conversaciones con una IA que conoce el contenido del canal
