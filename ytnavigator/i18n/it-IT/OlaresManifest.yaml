metadata:
  title: YT Navigator
  description: Esploratore di contenuti YouTube basato su IA
spec:
  fullDescription: |
    YT Navigator è un'applicazione basata su IA che ti aiuta a navigare e cercare i contenuti dei canali YouTube in modo efficiente. Invece di guardare manualmente ore di video per trovare informazioni specifiche, YT Navigator ti consente di:
    - Cercare nei video di un canale con query in linguaggio naturale
    - Chattare con i contenuti di un canale per ottenere risposte basate sulle trascrizioni
    - Scoprire segmenti video rilevanti con timestamp precisi
    
    Perfetto per ricercatori, studenti, content creator o chiunque abbia bisogno di estrarre rapidamente informazioni dai canali YouTube.
    
    **Funzionalità principali**
    - Autenticazione: Accesso sicuro e sessioni indipendenti
    - Gestione canali: Scansiona fino a 100 video per canale e ottieni un riepilogo del canale
    - Ricerca: Trova segmenti video rilevanti con Semantic Search
    - Chat: Conversazioni con un'IA che conosce i contenuti del canale
