olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

metadata:
  name: flowstudio
  appid: flowstudio
  title: FlowStudio
  description: All-in-one AI workflow production app on Olares
  # Public direct URL required by Market; source icons/icon.png — sync flowstudio-assets when changing.
  icon: https://raw.githubusercontent.com/ffkijjkokok/flowstudio-assets/main/icon.png
  version: 0.3.45
  categories:
  - Creativity
  - AI

entrances:
- name: flowstudio
  host: flowstudio-svc
  port: 8080
  title: FlowStudio
  icon: https://raw.githubusercontent.com/ffkijjkokok/flowstudio-assets/main/icon.png
  authLevel: private
  openMethod: window

sharedEntrances:
- name: flowstudio-api
  host: flowstudio-svc
  port: 8080
  title: FlowStudio API
  invisible: true
  authLevel: internal

spec:
  versionName: "0.3.45"
  onlyAdmin: true
  runAsUser: true
  fullDescription: |
    ## Overview
    FlowStudio is an all-in-one AI workflow production app on Olares.
    Import ComfyUI workflows, resolve models and custom nodes, then generate
    images or video from a dual-end workspace (PC + mobile).

    ## Highlights
    - Parse workflow dependencies and create projects end to end
    - Dynamic engine orchestration with per-project NVIDIA GPU allocation
    - Automatic model download and node install during project initialization
    - Admin console for network, GPU / engine lock, downloads, and model library

    ## Requirements
    - Olares >= 1.12.6
    - NVIDIA GPU (bind an accelerator when installing or resuming)
    - Recommended free VRAM >= 6 GiB for lite image templates

    ## Getting started
    1. Install from Market and bind a NVIDIA GPU when prompted.
    2. Open the FlowStudio entrance; in Admin, detect GPU and lock the engine.
    3. Create a project from a recommended template or your own workflow JSON.
    4. Wait until initialization finishes, then generate in the workspace.
  upgradeDescription: |
    ## FlowStudio 0.3.45

    - Keep marketplace source and the packed plaza bundle in the image
      context so workflow covers unpack at build time.
    - Serving a plaza cover extracts `covers.tar.gz` when the unpacked
      directory is missing.
  developer: luolong
  website: https://github.com/beclab/flowstudio
  sourceCode: https://github.com/beclab/flowstudio
  submitter: luolong
  locale:
  - en-US
  - zh-CN
  # accelerator mutually exclusive with flat requiredCpu; envelope must cover api+engine.
  # Do not use gpumem-percentage — app writes gpumem from detect/lock caps.
  supportArch:
  - amd64
  accelerator:
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    # api(≤4)+engine(≤8); aligned with templates / ENGINE_CPU_LIMIT.
    requiredCpu: "2"
    limitedCpu: "12"
    requiredMemory: 4Gi
    # api(≤6Gi)+engine(≤32Gi); too low → engine Pending → whole app stopped.
    limitedMemory: 40Gi
    requiredDisk: 2Gi
    limitedDisk: 10Gi
    requiredGPUMemory: 6Gi
    limitedGPUMemory: 24Gi

permission:
  appData: true
  appCommon: true

middleware:
  postgres:
    username: flowstudio
    password: flowstudio
    databases:
    - name: flowstudio

options:
  shared: true
  # 0: long-running init / model download must not be cut by gateway default.
  apiTimeout: 0
  LLMGatewaySupported: true
  # PWA assets public; pages and API stay private.
  policies:
  - entranceName: flowstudio
    description: PWA service worker
    uriRegex: ^/sw\.js$
    level: public
  # PC assets at site root; UniApp under /static/ — both path shapes.
  - entranceName: flowstudio
    description: PWA web app manifest
    uriRegex: ^/(static/)?site\.webmanifest$
    level: public
  - entranceName: flowstudio
    description: PWA icons and touch assets
    uriRegex: ^/(static/)?(icon-(192|256|512)\.png|apple-touch-icon\.png|favicon\.ico|logo(-mark)?\.(svg|png))$
    level: public
  # postgres is middleware only — listing it as a dependency makes Market reject install.
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system

workloadReplicas:
  flowstudio: 1
  flowstudioengine: 1

# Declarations only — no template reads these. Market lifts them out of the
# rendered envs block so Router can file the app under a capability domain
# before anything is installed; every model application is category AI.
envs:
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: "image_generation"
  options:
  - title: Image Generation
    value: image_generation
# Empty: Router's supports_* whitelist has no image-generation key.
- envName: MODEL_SUPPORTS
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: ""
  multiSelect: true
  splitter: ","
