metadata:
  title: FlowStudio
  description: La aplicación todo en uno de producción con flujos de trabajo de IA para Olares

spec:
  fullDescription: |
    FlowStudio convierte un flujo de trabajo de ComfyUI en un proyecto de producción reutilizable en Olares. Importa un flujo de trabajo JSON o empieza con una plantilla recomendada: FlowStudio identifica los modelos y nodos personalizados necesarios, descarga los elementos que faltan, ejecuta el flujo en un motor dedicado con GPU y ofrece un formulario de parámetros tanto en PC como en dispositivos móviles. Los administradores gestionan los flujos y el entorno; los demás usuarios eligen un proyecto e inician la generación.

    **Funciones principales**
    - **Del flujo de trabajo al producto**: importa un ComfyUI Save JSON o una plantilla recomendada y consulta un informe de análisis sobre nodos, modelos, VRAM y riesgos de los nodos personalizados antes de confirmar.
    - **Resolución de dependencias**: durante la inicialización se descargan los pesos de los modelos, se instalan los nodos personalizados y se descargan por adelantado las imágenes de los motores, con pasos concretos de recuperación si falla una fuente.
    - **Un motor dedicado por proyecto**: cada proyecto dispone de su propio motor ComfyUI y de una asignación de GPU NVIDIA; la aplicación y el motor se distribuyen como imágenes separadas y se comunican solo mediante HTTP/WS.
    - **Espacio de trabajo para PC y móviles**: los mismos proyectos, parámetros, trabajos e historial están disponibles en ambas plataformas, para ajustar parámetros y generar contenido desde cualquiera de ellas.
    - **Biblioteca de modelos compartida**: los pesos se guardan en una biblioteca compartida a nivel de nodo, se reutilizan entre proyectos y se conservan de forma predeterminada al desinstalar la aplicación.
    - **Consola de administración unificada**: fuentes de descarga, detección de GPU y bloqueo del motor, centro de descargas y biblioteca de modelos en un solo lugar, con aislamiento de datos por propietario.
    - **API de Router y OpenAI**: se registra en Olares Router como proveedor de generación de imágenes y expone `/v1/models` y `/v1/images/generations` con el estilo de OpenAI, junto con un catálogo de flujos de trabajo y una API de generación.

    **Requisitos**
    - Olares >= 1.12.7 en `amd64` y `arm64` (incluido GB10)
    - Una GPU NVIDIA, vinculada al instalar o reanudar la aplicación
    - VRAM libre >= 6 GiB para las plantillas ligeras de imágenes
  upgradeDescription: |
    **FlowStudio 0.3.91**

    - El vídeo de referencia recomendado pasa a FastH3 OmniRef.
    - Los motores NVIDIA pasan a ComfyUI v0.42.5: `engine-1.0.9` en tarjetas discretas y `engine-1.0.9-arm64` en GB10.
