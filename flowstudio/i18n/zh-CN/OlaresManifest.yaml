metadata:
  title: FlowStudio
  description: Olares 上的一体化 AI 工作流生产应用

spec:
  fullDescription: |
    FlowStudio 是运行在 Olares 上的一体化 AI 工作流生产应用。

    - 导入 ComfyUI 工作流，解析依赖，并端到端管理项目。
    - 内置引擎编排，按项目动态分配 GPU。
    - 项目初始化阶段自动下载模型并安装节点。
    - 双端界面（PC + 移动端），私有入口鉴权。

    使用方式：
    - 安装后按提示绑定 NVIDIA GPU，打开 FlowStudio 入口。
    - 用工作流 JSON 创建项目，跟随初始化进度直至就绪。
    - 在项目工作区中生成与迭代。
