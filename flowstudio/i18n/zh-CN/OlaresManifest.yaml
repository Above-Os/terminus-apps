metadata:
  title: FlowStudio
  description: Olares 上的一体化 AI 工作流生产应用

spec:
  fullDescription: |
    ## 概述
    FlowStudio 是运行在 Olares 上的一体化 AI 工作流生产应用。
    可导入 ComfyUI 工作流，自动解析模型与自定义节点，并在双端
    （PC / 移动）工作区中生成图片或视频。

    ## 能力
    - 解析工作流依赖并端到端创建项目
    - 按项目动态编排引擎并分配 NVIDIA GPU
    - 项目初始化阶段自动下载模型、安装节点
    - 管理台：网络、GPU / 引擎锁定、下载中心、模型库

    ## 运行要求
    - Olares >= 1.12.6
    - NVIDIA GPU（安装或恢复时按提示绑定加速器）
    - 轻量图片模板建议可用显存 ≥ 6 GiB

    ## 开始使用
    1. 从 Market 安装，并按提示绑定 NVIDIA GPU。
    2. 打开 FlowStudio 入口；在管理台完成 GPU 探测并锁定引擎。
    3. 从推荐模板或自备工作流 JSON 创建项目。
    4. 等待初始化完成，再在工作区中生成。
  upgradeDescription: |
    ## FlowStudio 0.3.20

    - 新增独立「编辑 mask」控件（Fill / 局部重绘，与 ControlNet 解耦）。
    - 服务端权威 RGBA 合成，保证绘制蒙版可靠写入 LoadImage。
    - 推荐图像编辑流优先主线路槽位，并裁剪旁路子图。
    - 生产页编辑 mask 双栏 UI；自定义组件添加顺序按使用频率排列。
