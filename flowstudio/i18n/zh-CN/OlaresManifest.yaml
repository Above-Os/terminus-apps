metadata:
  title: FlowStudio
  description: Olares 上的一体化 AI 工作流生产应用

spec:
  fullDescription: |
    ## 概述
    FlowStudio 是运行在 Olares 上的一体化 AI 工作流生产应用。
    可导入 ComfyUI 工作流，自动解析模型与自定义节点，并在双端
    （PC / 移动）工作区中生成图片或视频。

    ## 能力
    - 解析工作流依赖并端到端创建项目
    - 按项目动态编排引擎并分配 NVIDIA GPU
    - 项目初始化阶段自动下载模型、安装节点
    - 管理台：网络、GPU / 引擎锁定、下载中心、模型库

    ## 运行要求
    - Olares >= 1.12.6
    - NVIDIA GPU（安装或恢复时按提示绑定加速器）
    - 轻量图片模板建议可用显存 ≥ 6 GiB

    ## 开始使用
    1. 从 Market 安装，并按提示绑定 NVIDIA GPU。
    2. 打开 FlowStudio 入口；在管理台完成 GPU 探测并锁定引擎。
    3. 从推荐模板或自备工作流 JSON 创建项目。
    4. 等待初始化完成，再在工作区中生成。
  upgradeDescription: |
    ## FlowStudio 0.3.43

    - 先监听 8080 再做广场 / 引擎预热，入口在启动完成前即可连通。
    - 停应用时回收 GPU 引擎，避免残留引擎卡住 Market 停止或卸载。
    - 预删除 Job 关闭 sidecar，钩子任务可以正常 Succeeded。
