metadata:
  title: FlowStudio
  description: All-in-one AI workflow production app on Olares

spec:
  fullDescription: |
    ## Overview
    FlowStudio is an all-in-one AI workflow production app on Olares.
    Import ComfyUI workflows, resolve models and custom nodes, then generate
    images or video from a dual-end workspace (PC + mobile).

    ## Highlights
    - Parse workflow dependencies and create projects end to end
    - Dynamic engine orchestration with per-project NVIDIA GPU allocation
    - Automatic model download and node install during project initialization
    - Admin console for network, GPU / engine lock, downloads, and model library

    ## Requirements
    - Olares >= 1.12.6
    - NVIDIA GPU (bind an accelerator when installing or resuming)
    - Recommended free VRAM >= 6 GiB for lite image templates

    ## Getting started
    1. Install from Market and bind a NVIDIA GPU when prompted.
    2. Open the FlowStudio entrance; in Admin, detect GPU and lock the engine.
    3. Create a project from a recommended template or your own workflow JSON.
    4. Wait until initialization finishes, then generate in the workspace.
  upgradeDescription: |
    ## FlowStudio 0.3.46

    - Pack refuses a plaza bundle that drops official recommendations
      or their covers; scrape keeps those templates and seed backfills
      missing plaza rows.
    - Scene cards fall back to the plaza thumbnail when the project
      has no cover.
    - Hot-reload also syncs the packed marketplace bundle.
