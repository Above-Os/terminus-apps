metadata:
  title: FlowStudio
  description: All-in-one AI workflow production app on Olares

spec:
  fullDescription: |
    FlowStudio is an all-in-one AI workflow production app on Olares.

    - Import ComfyUI workflows, parse dependencies, and manage projects end to end.
    - Built-in engine orchestration with dynamic GPU allocation per project.
    - Model download and node install during project initialization.
    - Dual-end UI (PC + mobile) with private entrance auth.

    Usage:
    - Install, bind a NVIDIA GPU when prompted, then open the FlowStudio entrance.
    - Create a project from a workflow JSON and follow the init progress until ready.
    - Generate and iterate from the project workspace.
