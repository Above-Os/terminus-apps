# App-owned overrides only — do not duplicate system-injected
# postgres / userspace / user / domain.
# Upgrade reuses values: bump appImage (templates prefer it over image).

appImage: docker.io/luolong01/flowstudio:0.2.0@sha256:1c33292ea5756dc89e83033c915227f061af7cc69c5af7239bd60a99b95f2c68
image: docker.io/luolong01/flowstudio:0.2.0@sha256:1c33292ea5756dc89e83033c915227f061af7cc69c5af7239bd60a99b95f2c68
imagePullPolicy: IfNotPresent

engineImage: docker.io/luolong01/flowstudio:engine-1.0.1
engineImagePullPolicy: IfNotPresent
# Empty = AMD unavailable (never fall back to CUDA silently).
engineImageAmd: docker.io/luolong01/flowstudio:engine-1.0.1-rocm

# exclusiveGpu: absolute gpumem only — never gpumem-percentage.
dynamicEngine:
  enabled: true
  serviceAccountName: flowstudio-engine-orchestrator
  exclusiveGpu: true
  gpuMemMiB: 6144
  idleTtlSeconds: 900
  wsIdleTimeoutSeconds: 300
  execTimeoutSeconds: 600
  gpuVendor: auto
  # Empty → probe default app-service compute-resources URL.
  gpuApiUrl: ""
  # On API SIGTERM / uninstall: delete dynamic engines (hotReload forces false).
  shutdownReap: true

# Defaults only; admin network probe may persist overrides later.
network:
  region: global
  githubMirror: ""
  pipIndexUrl: ""

modelDownload:
  enabled: true
  requireAllResolved: true
  hfToken: ""
  civitaiToken: ""

nodeInstall:
  enabled: true

workloads:
  flowstudio:
    replicaCount: 1
  flowstudioengine:
    replicaCount: 1

# Must be false for release / Market submit.
# true also sets SHOW_TEST_WORKFLOW_TEMPLATES (ControlNet fixtures).
dev:
  hotReload: false
  sourceSubPath: devsrc
