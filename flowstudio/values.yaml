# App-owned overrides only — do not duplicate system-injected
# postgres / userspace / user / domain.
# Upgrade reuses values: bump appImage (templates prefer it over image).

# Keep the docker.io/ prefix: app-service rewrites every chart image ref to this
# image's registry, and OPA only trusts docker.io/beclab for the root init containers.
appImage: docker.io/beclab/flowstudio:0.3.55
image: docker.io/beclab/flowstudio:0.3.55
imagePullPolicy: IfNotPresent

engineImage: docker.io/beclab/flowstudio:engine-1.0.7
engineImagePullPolicy: IfNotPresent
# Empty = AMD unavailable (never fall back to CUDA silently).
engineImageAmd: docker.io/beclab/flowstudio:engine-1.0.6-rocm

# exclusiveGpu: absolute gpumem only — never gpumem-percentage.
dynamicEngine:
  enabled: true
  serviceAccountName: flowstudio-engine-orchestrator
  exclusiveGpu: true
  gpuMemMiB: 6144
  memLimit: 80Gi
  memRequestMax: 80Gi
  idleTtlSeconds: 900
  gpuVendor: auto
  # Empty → probe default app-service compute-resources URL.
  gpuApiUrl: ""

# Defaults only; admin network probe may persist overrides later.
network:
  region: global
  githubMirror: ""
  pipIndexUrl: ""

modelDownload:
  enabled: true
  requireAllResolved: true
  hfToken: ""
  civitaiToken: ""

nodeInstall:
  enabled: true

workloads:
  flowstudio:
    replicaCount: 1
  flowstudioengine:
    replicaCount: 1

# Must be false for release / Market submit.
# true also sets SHOW_TEST_WORKFLOW_TEMPLATES (ControlNet fixtures).
dev:
  hotReload: false
  sourceSubPath: devsrc
