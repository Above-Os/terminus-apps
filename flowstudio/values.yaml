# 应用自有可覆盖项。系统注入（postgres / userspace / user / domain）勿在此重复。
# Olares upgrade 会 reuse values：换镜像请 bump appImage（模板优先于 image）。

appImage: docker.io/luolong01/flowstudio:0.1.17
image: docker.io/luolong01/flowstudio:0.1.17
imagePullPolicy: IfNotPresent

engineImage: docker.io/luolong01/flowstudio:engine-1.0.1
engineImagePullPolicy: IfNotPresent
# 留空则 AMD 不可用（不静默降级到 CUDA）。
engineImageAmd: docker.io/luolong01/flowstudio:engine-1.0.1-rocm

# 动态引擎（默认）；exclusiveGpu 勿用 gpumem-percentage。
dynamicEngine:
  enabled: true
  serviceAccountName: flowstudio-engine-orchestrator
  exclusiveGpu: true
  gpuMemMiB: 6144
  idleTtlSeconds: 900
  wsIdleTimeoutSeconds: 300
  execTimeoutSeconds: 600
  gpuVendor: auto
  # 可选 compute-resources URL；留空则试探默认 app-service。
  gpuApiUrl: ""

# env 默认；管理台网络探测持久化后覆盖。
network:
  region: global
  githubMirror: ""
  pipIndexUrl: ""

modelDownload:
  enabled: true
  requireAllResolved: true
  hfToken: ""
  civitaiToken: ""

nodeInstall:
  enabled: true

workloads:
  flowstudio:
    replicaCount: 1
  flowstudioengine:
    replicaCount: 1

# 正式发包 / 市场提交必须 false。
dev:
  hotReload: false
  sourceSubPath: devsrc
