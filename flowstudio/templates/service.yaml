apiVersion: v1
kind: Service
metadata:
  name: flowstudio-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: flowstudio
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
{{- if eq (toString (default dict .Values.dynamicEngine).enabled) "false" }}
---
# 仅静态引擎模式；集群 DNS，不对外暴露。
apiVersion: v1
kind: Service
metadata:
  name: flowstudio-engine-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: flowstudioengine
  ports:
  - name: http
    port: 8188
    targetPort: 8188
    protocol: TCP
{{- end }}
