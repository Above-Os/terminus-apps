{{- $de := (default dict .Values.dynamicEngine) }}
{{- $sa := ($de.serviceAccountName | default "flowstudio-engine-orchestrator") }}
{{- if ne (toString $de.enabled) "false" }}
# 本 ns 内编排引擎；无集群级权限。enabled 显式 false 时不建。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $sa }}
  apiGroup: rbac.authorization.k8s.io
---
# 集群级 GPUBinding：自愈「resume 多绑一张卡 → 引擎 Pending → 整应用 stopped」。
# 代码侧只 mutate spec.namespace==本 ns 的条目。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-gpubinding-{{ .Release.Namespace }}
rules:
- apiGroups: ["gpu.bytetrade.io"]
  resources: ["gpubindings"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-gpubinding-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $sa }}-gpubinding-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
