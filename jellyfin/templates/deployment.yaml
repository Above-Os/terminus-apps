apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-migration
  namespace: {{ .Release.Namespace }}
data:
  encoding.sh: |
    #!/bin/sh
    set -eu
    file=/config/config/encoding.xml
    [ -f "$file" ] || exit 0
    pattern='<EncoderPreset([[:space:]]+xsi:nil="true")?[[:space:]]*/>|<EncoderPreset>[[:space:]]*</EncoderPreset>'
    if grep -Eq "$pattern" "$file"; then
      backup="$file.pre-12.1"
      if [ ! -e "$backup" ]; then
        cp -p "$file" "$backup"
        cmp -s "$file" "$backup"
      fi
      tmp=$(mktemp "$file.tmp.XXXXXX")
      trap 'rm -f "$tmp"' EXIT HUP INT TERM
      cp -p "$file" "$tmp"
      sed -E "s#$pattern#<EncoderPreset>auto</EncoderPreset>#g" "$file" > "$tmp"
      [ -s "$tmp" ]
      if grep -Eq "$pattern" "$tmp"; then
        echo 'Encoding migration incomplete; refusing to start' >&2
        exit 1
      fi
      mv "$tmp" "$file"
      echo 'Converted legacy empty EncoderPreset to auto; original encoding.xml retained'
    fi
---
{{- $gpuObj := .Values.GPU | default dict }}
{{- $gpuType := .Values.gpu | default ($gpuObj.Type) | default "cpu" }}
{{- $isIgpuMode := or (eq $gpuType "intel") (eq $gpuType "amd") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: jellyfin
  {{- if $isIgpuMode }}
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
  {{- end }}
spec:
  replicas: {{ .Values.workloads.jellyfin.replicaCount }}
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
        applications.app.bytetrade.io/macvlan-init: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        {{- if $isIgpuMode }}
        supplementalGroups:
          - 44
          - 994
        {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      volumes:
        - name: migration
          configMap:
            name: jellyfin-migration
        - name: home
          hostPath:
            type: Directory
            path: {{ .Values.userspace.userData }}
        - hostPath:
            path: '{{ .Values.userspace.appData }}/config'
            type: DirectoryOrCreate
          name: config
        - hostPath:
            path: '{{ .Values.userspace.appData }}/cache'
            type: DirectoryOrCreate
          name: cache
        - hostPath:
            path: '{{ .Values.userspace.appData }}'
            type: DirectoryOrCreate
          name: app-data-root
        - name: external
          hostPath:
            type: DirectoryOrCreate
            path: "{{ .Values.sharedlib }}"
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - '-c'
            - |
              set -eu
              # Older charts ran Jellyfin as root. Migrate only root-owned
              # application data; never follow symlinks or revisit user-owned files.
              for dir in /app-data-root /app-data-root/config /app-data-root/cache; do
                [ -d "$dir" ] && [ ! -L "$dir" ] || exit 1
                if [ "$(stat -c %u "$dir")" = 0 ]; then
                  chown 1000:1000 "$dir"
                fi
              done
              for dir in /app-data-root/config /app-data-root/cache; do
                find "$dir" -xdev -user 0 \( -type d -o -type f \) -exec sh -ec '
                  for path do
                    [ ! -L "$path" ] || exit 1
                    [ "$(stat -c %u "$path")" = 0 ] || continue
                    chown -h 1000:1000 "$path"
                  done
                ' sh {} +
              done
          resources: {}
          volumeMounts:
            - name: app-data-root
              mountPath: /app-data-root
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0

        - name: migrate-encoding
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command: ["sh", "/migration/encoding.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: migration
              mountPath: /migration
              readOnly: true
            - name: config
              mountPath: /config

      containers:
        - name: jellyfin
          image: "docker.io/beclab/jellyfin-jellyfin:12.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          ports:
          - containerPort: 8096
          volumeMounts:
          - name: home
            mountPath: /olares/userdata/home
          - name: home
            mountPath: /home
          - name: config
            mountPath: /config
          - name: cache
            mountPath: /cache
          - name: external
            mountPath: /olares/userdata/external
          - name: external
            mountPath: /external
          env:
          - name: PGID
            value: "1000"
          - name: PUID
            value: "1000"
          - name: UMASK
            value: "002"
          - name: TZ
            value: Etc/UTC

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      port: 8096
      targetPort: 8096
