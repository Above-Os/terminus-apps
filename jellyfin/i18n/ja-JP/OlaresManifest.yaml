metadata:
  title: Jellyfin
  description: フリーソフトウェアのメディアシステム
spec:
  fullDescription: |
    Jellyfin は、メディアの管理とストリーミングを自分でコントロールできるフリーソフトウェアのメディアシステムです。プロプライエタリな Emby や Plex の代替として、専用サーバーから複数のアプリ経由でエンドユーザー端末へメディアを届けます。

    Jellyfin でメディアを収集・管理・ストリーミングできます。システム上で Jellyfin サーバーを動かし、先進的なフリーソフトウェア・エンターテインメントシステムへアクセスしましょう。

    Jellyfin でできること
    - 美しいアートワーク付きで、映画コレクション全体を手軽に閲覧・視聴。
    - お気に入りの番組をシーズン別に自動整理し、一気見。
    - 自宅でも外出先でも、アーティストやプレイリストの音楽を聴く。
    - TV を視聴し、自動録画でライブラリを拡張。
    - 本、コミック、雑誌を読む。
    - 写真を整理し、友人や家族と思い出を共有。
    - リモートで映画の夜を共有。これほど簡単だったことはありません。

    Why Jellyfin
    **Privacy Focused**
    Jellyfin にトラッキング、フォンホーム、データ収集用の中央サーバーはありません。ソフトウェアをオープンで透明に保つことを信条とします。メディアビジネスでもないため、見えるメディアはあなた自身のものだけです。

    **Free Software**
    Jellyfin は GNU GPL ライセンスの Free Software です。変更も同じライセンスであれば、自由に使用・研究・改変・ビルド・配布できます。

    **No Fees**
    Jellyfin サーバーと公式クライアントは、今もこれからも無料でダウンロードできます。あなた、友人、会社のいずれにも隠れた費用はありません。付随コストはあなたのようなユーザーの寄付で賄われています。

    **Community Built**
    プロジェクトはボランティアの貢献に完全に依存しています。手伝いたいですか？方法はたくさんあり、コーディングすら不要です！
  upgradeDescription: |
    旧版で root が作成した設定とキャッシュをアプリのユーザーに移行し、他の所有者を維持してシンボリックリンクを除外します。
    旧版の空の EncoderPreset を auto に移行し、他の変換設定を保持して encoding.xml をバックアップします。
    Jellyfin を 10.11.11 から 12.1 に更新します。設定とデータ全体をバックアップしてください。データベース移行後のロールバックにはバックアップの復元が必要です。更新前にサードパーティープラグインを削除し、大文字と小文字だけが異なるユーザー名を修正してください。更新後はライブラリー全体をスキャンしてください。旧 /emby と /mediabrowser ルートは削除されるため、クライアントの互換性を確認してください。

    https://github.com/jellyfin/jellyfin/releases/tag/v12.0
    https://github.com/jellyfin/jellyfin/releases/tag/v12.1
