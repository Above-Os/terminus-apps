metadata:
  title: Studio
  description: Strumenti completi per sviluppare, eseguire il debug e distribuire app su Olares.
spec:
  fullDescription: |
    Studio è uno strumento di sviluppo completo per semplificare la creazione, il test e la distribuzione di applicazioni su Olares.
    
    Perché Studio è necessario per gli sviluppatori?
    Olares ha molte funzionalità cloud difficili da simulare in un ambiente di sviluppo autonomo. Inoltre, l'esclusivo sistema sandbox di Olares richiede un ambiente di sistema reale per i test end-to-end. Per semplificare la simulazione delle app e ridurre al minimo gli sforzi di integrazione durante lo sviluppo, forniamo Studio. Studio è un set di strumenti rapido e automatico per creare sandbox di app.
    
    **Funzioni**
    Porting e debug di applicazioni in sandbox
    - Generazione automatica della configurazione: Durante la build, Studio genera automaticamente i file Olares Application Configuration, consentendo modifiche flessibili per il porting di applicazioni esistenti.
    - Test e ottimizzazione continui: Modifica le configurazioni in modo iterativo, testa le installazioni in tempo reale e risolvi i problemi prima del deployment finale.
    - Pubblicazione semplice: Dopo test riusciti, scarica l'Application Chart e invialo direttamente all'Olares Market Repository per la pubblicazione.
    
    Sviluppo nativo di applicazioni
    - Studio fornisce un container di sviluppo online in cui gli sviluppatori possono lavorare in un ambiente reale, utilizzare altre interfacce di sistema, cluster di database e altro.
  upgradeDescription: |
    Aggiornamento alla versione 1.6.25
    
    **Correzioni di bug:**
    - correzione del messaggio di rete di studio
    - correzione di bug del frontend
