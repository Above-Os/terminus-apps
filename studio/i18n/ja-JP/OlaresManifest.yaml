metadata:
  title: Studio
  description: Olares 上でアプリの開発・デバッグ・デプロイを行う総合ツール。
spec:
  fullDescription: |
    Studio は、Olares 上でのアプリケーションのビルド、テスト、デプロイを効率化する総合開発ツールです。
    
    なぜ開発者に Studio が必要か？
    Olares にはスタンドアロンの開発環境では再現しにくいクラウド機能が多くあります。さらに、Olares 独自のサンドボックスシステムはエンドツーエンドテストに実システム環境を必要とします。開発者のアプリシミュレーションを簡素化し、開発中のシステム統合作業を最小限にするため、Studio を提供します。Studio はアプリサンドボックスを作成するための迅速で自動的なツールセットです。
    
    **機能**
    サンドボックス化されたアプリケーションの移植とデバッグ
    - 自動設定生成: アプリビルド時に Studio が Olares Application Configuration ファイルを自動生成し、既存アプリの移植向けに柔軟に変更できます。
    - 継続的なテストと最適化: 設定を反復的に変更し、リアルタイムでインストールをテストし、最終デプロイ前に問題を解決します。
    - 簡単な公開: テスト成功後、Application Chart をダウンロードし、Olares Market Repository に直接提出して公開できます。
    
    ネイティブアプリケーション開発
    - Studio はオンライン開発コンテナを提供し、開発者は実環境で作業し、他のシステムインターフェースやデータベースクラスターなどを利用できます。
  upgradeDescription: |
    バージョン 1.6.25 へ更新
    
    **バグ修正:**
    - studio のネットワークメッセージを修正
    - フロントエンドのバグを修正
