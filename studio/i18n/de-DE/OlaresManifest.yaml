metadata:
  title: Studio
  description: Umfassende Tools zum Entwickeln, Debuggen und Bereitstellen von Apps auf Olares
spec:
  fullDescription: |
    Studio ist ein umfassendes Entwicklungswerkzeug, das das Erstellen, Testen und Bereitstellen von Anwendungen auf Olares vereinfacht.
    
    Warum ist Studio für Entwickler notwendig?
    Olares verfügt über viele Cloud-Funktionen, die in einer eigenständigen Entwicklungsumgebung schwer zu simulieren sind. Zudem erfordert das einzigartige Sandbox-System von Olares eine echte Systemumgebung für End-to-End-Tests. Um die App-Simulation für Entwickler zu vereinfachen und den Integrationsaufwand während der Entwicklung zu minimieren, stellen wir Studio bereit. Studio ist ein schnelles, automatisches Toolset zum Erstellen von App-Sandboxes.
    
    **Funktionen**
    Sandboxed Application Porting & Debugging
    - Automatische Konfigurationsgenerierung: Beim App-Build erzeugt Studio automatisch Olares Application Configuration-Dateien, die flexibel angepasst werden können, um bestehende Anwendungen zu portieren.
    - Kontinuierliches Testen & Optimieren: Konfigurationen iterativ ändern, Installationen in Echtzeit testen und Probleme vor der finalen Bereitstellung beheben.
    - Einfaches Veröffentlichen: Nach erfolgreichem Test den Application Chart herunterladen und direkt an das Olares Market Repository zur Veröffentlichung übermitteln.
    
    Native Application Development
    - Studio bietet einen Online-Entwicklungscontainer, in dem Entwickler in einer realen Umgebung arbeiten und andere Systemschnittstellen, Datenbankcluster und mehr nutzen können.
  upgradeDescription: |
    Update auf Version 1.6.25
    
    **Fehlerbehebungen:**
    - Studio-Netzwerknachricht behoben
    - Frontend-Fehler behoben
