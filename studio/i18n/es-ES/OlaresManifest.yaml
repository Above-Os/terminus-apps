metadata:
  title: Studio
  description: Herramientas completas para desarrollar, depurar e implementar apps en Olares
spec:
  fullDescription: |
    Studio es una herramienta de desarrollo integral para agilizar la creación, prueba e implementación de aplicaciones en Olares.
    
    ¿Por qué es necesario Studio para los desarrolladores?
    Olares tiene muchas funciones basadas en la nube difíciles de simular en un entorno de desarrollo independiente. Además, el sistema de sandbox único de Olares requiere un entorno de sistema real para pruebas de extremo a extremo. Para simplificar la simulación de apps y minimizar el esfuerzo de integración durante el desarrollo, ofrecemos Studio. Studio es un conjunto de herramientas rápido y automático para crear sandboxes de apps.
    
    **Funciones**
    Portabilidad y depuración de aplicaciones en sandbox
    - Generación automática de configuración: Durante la compilación, Studio genera automáticamente archivos de Olares Application Configuration, permitiendo modificaciones flexibles para portar aplicaciones existentes.
    - Pruebas y optimización continuas: Modifique configuraciones de forma iterativa, pruebe instalaciones en tiempo real y resuelva problemas antes del despliegue final.
    - Publicación sencilla: Tras pruebas exitosas, descargue el Application Chart y envíelo directamente al Olares Market Repository para su publicación.
    
    Desarrollo nativo de aplicaciones
    - Studio proporciona un contenedor de desarrollo en línea donde los programadores pueden trabajar en un entorno real, utilizar otras interfaces del sistema, clústeres de bases de datos y más.
  upgradeDescription: |
    Actualización a la versión 1.6.25
    
    **Correcciones de errores:**
    - corrección del mensaje de red de studio
    - corrección de errores del frontend
