metadata:
  title: Studio
  description: Outils complets pour développer, déboguer et déployer des apps sur Olares
spec:
  fullDescription: |
    Studio est un outil de développement complet pour fluidifier la création, les tests et le déploiement d'applications sur Olares.
    
    Pourquoi Studio est-il nécessaire pour les développeurs ?
    Olares dispose de nombreuses fonctionnalités cloud difficiles à simuler dans un environnement de développement autonome. De plus, le système de sandbox unique d'Olares nécessite un environnement système réel pour les tests de bout en bout. Pour simplifier la simulation d'apps et minimiser les efforts d'intégration pendant le développement, nous fournissons Studio. Studio est un ensemble d'outils rapide et automatique pour créer des sandboxes d'apps.
    
    **Fonctionnalités**
    Portage et débogage d'applications en sandbox
    - Génération automatique de configuration : Lors de la construction, Studio génère automatiquement les fichiers Olares Application Configuration, permettant des modifications flexibles pour porter des applications existantes.
    - Tests et optimisation continus : Modifiez les configurations de façon itérative, testez les installations en temps réel et résolvez les problèmes avant le déploiement final.
    - Publication simple : Après des tests réussis, téléchargez l'Application Chart et soumettez-le directement au dépôt Olares Market pour publication.
    
    Développement d'applications natives
    - Studio fournit un conteneur de développement en ligne où les développeurs peuvent travailler dans un environnement réel, utiliser d'autres interfaces système, des clusters de bases de données, etc.
  upgradeDescription: |
    Mise à jour vers la version 1.6.25
    
    **Corrections de bugs :**
    - correction du message réseau de studio
    - correction de bugs frontend
