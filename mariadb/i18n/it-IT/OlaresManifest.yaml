metadata:
  title: MariaDB
  description: Il database open source innovativo
spec:
  fullDescription: |
    MariaDB Server è uno dei database relazionali open source più popolari. È realizzato dagli sviluppatori originali di MySQL e garantito di rimanere open source. Fa parte della maggior parte delle offerte cloud ed è il predefinito nella maggior parte delle distribuzioni Linux.
    
    Si basa sui valori di prestazioni, stabilità e apertura, e la MariaDB Foundation garantisce che i contributi vengano accettati per merito tecnico. Le funzionalità recenti includono clustering avanzato con Galera Cluster 4, funzioni di compatibilità con Oracle Database e Temporal Data Tables, che consentono di interrogare i dati così come erano in qualsiasi momento del passato.
