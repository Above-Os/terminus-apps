metadata:
  title: MariaDB
  description: La innovadora base de datos de código abierto
spec:
  fullDescription: |
    MariaDB Server es una de las bases de datos relacionales de código abierto más populares. Está hecha por los desarrolladores originales de MySQL y garantiza que seguirá siendo de código abierto. Forma parte de la mayoría de ofertas en la nube y es la predeterminada en la mayoría de distribuciones Linux.
    
    Se construye sobre los valores de rendimiento, estabilidad y apertura, y la MariaDB Foundation asegura que las contribuciones se acepten por mérito técnico. La funcionalidad reciente incluye clustering avanzado con Galera Cluster 4, funciones de compatibilidad con Oracle Database y Temporal Data Tables, que permiten consultar los datos tal como estaban en cualquier momento del pasado.
