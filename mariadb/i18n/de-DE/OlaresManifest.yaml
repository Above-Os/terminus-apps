metadata:
  title: MariaDB
  description: Die innovative Open-Source-Datenbank
spec:
  fullDescription: |
    MariaDB Server ist eine der beliebtesten quelloffenen relationalen Datenbanken. Sie wurde von den ursprünglichen Entwicklern von MySQL geschaffen und bleibt garantiert Open Source. Sie ist Teil der meisten Cloud-Angebote und die Standarddatenbank in den meisten Linux-Distributionen.
    
    Sie basiert auf den Werten Leistung, Stabilität und Offenheit, und die MariaDB Foundation stellt sicher, dass Beiträge nach technischem Verdienst angenommen werden. Neuere Funktionen umfassen erweitertes Clustering mit Galera Cluster 4, Kompatibilitätsfunktionen mit Oracle Database sowie Temporal Data Tables, mit denen man Daten zu jedem beliebigen Zeitpunkt in der Vergangenheit abfragen kann.
