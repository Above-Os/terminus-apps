metadata:
  title: MariaDB
  description: La base de données open source innovante
spec:
  fullDescription: |
    MariaDB Server est l'une des bases de données relationnelles open source les plus populaires. Elle est créée par les développeurs originaux de MySQL et garantie de rester open source. Elle fait partie de la plupart des offres cloud et est la base par défaut dans la plupart des distributions Linux.
    
    Elle repose sur les valeurs de performance, de stabilité et d'ouverture, et la MariaDB Foundation veille à ce que les contributions soient acceptées sur le mérite technique. Les fonctionnalités récentes incluent le clustering avancé avec Galera Cluster 4, des fonctions de compatibilité avec Oracle Database et les Temporal Data Tables, permettant d'interroger les données telles qu'elles étaient à n'importe quel moment du passé.
