metadata:
  title: MariaDB
  description: 革新的なオープンソースデータベース
spec:
  fullDescription: |
    MariaDB Server は最も人気のあるオープンソースリレーショナルデータベースのひとつです。MySQL のオリジナル開発者によって作られ、オープンソースであり続けることが保証されています。ほとんどのクラウドサービスに含まれ、多くの Linux ディストリビューションでデフォルトになっています。
    
    パフォーマンス、安定性、オープンさという価値観の上に構築されており、MariaDB Foundation は技術的メリットに基づいてコントリビューションが受け入れられることを保証しています。最近の新機能には、Galera Cluster 4 による高度なクラスタリング、Oracle Database との互換性機能、過去の任意の時点のデータを照会できる Temporal Data Tables などがあります。
