  description: Traducción de artículos científicos en PDF conservando el formato
spec:
  fullDescription: |
    Traducción de artículos científicos en PDF y comparación bilingüe.
    
    **Funciones clave**
    - Conserva fórmulas, gráficos, tabla de contenidos y anotaciones.
    - Admite varios idiomas y diversos servicios de traducción.
