metadata:
  title: PDFMathTranslate
  description: Übersetzung wissenschaftlicher PDF-Artikel bei beibehaltenem Layout
spec:
  fullDescription: |
    PDF-Übersetzung wissenschaftlicher Artikel und zweisprachiger Vergleich.
    
    **Hauptfunktionen**
    - Formeln, Diagramme, Inhaltsverzeichnis und Anmerkungen bleiben erhalten.
    - Unterstützung mehrerer Sprachen und verschiedener Übersetzungsdienste.
