{{- $runStatePath := include "layatypeddecisionsv3.runStatePath" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: systemone-engine
spec:
  replicas: {{ .Values.workloads.layatypeddecisionsv3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: systemone-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: systemone-engine
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: systemone-engine
          image: '{{ include "layatypeddecisionsv3.engineImage" . }}'
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/systemone/start.sh"]
          env:
            - name: SYSTEMONE_BACKEND
              value: laya
            - name: MODEL_NAME
              value: '{{ include "layatypeddecisionsv3.modelName" . }}'
            - name: MODEL_REVISION
              value: '{{ include "layatypeddecisionsv3.modelRevision" . }}'
            - name: DEVICE
              value: cpu
            - name: SYSTEM_ONE_CONTEXT_SIZE
              value: "1024"
            - name: SYSTEM_ONE_MAX_CHOICE_OPTIONS
              value: "20"
            - name: SYSTEM_ONE_MAX_SCORE_LEVELS
              value: "10"
            - name: SYSTEM_ONE_LANGUAGES
              value: en
            - name: SYSTEM_ONE_DEFAULT_ELIGIBLE
              value: "false"
            - name: SYSTEM_ONE_MAX_CONCURRENCY
              value: "1"
            - name: SYSTEM_ONE_MAX_QUEUE
              value: "128"
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrapper
              mountPath: /opt/systemone
              readOnly: true
      volumes:
        - name: hf-cache
          hostPath:
            path: '{{ .Values.userspace.appCommon }}/huggingface'
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: '{{ $runStatePath }}'
            type: DirectoryOrCreate
        - name: wrapper
          configMap:
            name: layatypeddecisionsv3-wrapper
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: systemone
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    io.kompose.service: systemone-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

