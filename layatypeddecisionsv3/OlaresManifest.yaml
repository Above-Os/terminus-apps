olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: v3
metadata:
  name: layatypeddecisionsv3
  appid: layatypeddecisionsv3
  title: Laya Typed Decisions
  description: Lightweight CPU System One decisions for explicit workloads
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.0
  categories:
    - AI
    - models
  tags:
    - system-one
    - decision-model
entrances:
  - name: layaapi
    host: download-svc
    port: 8090
    title: Laya Typed Decisions API
    invisible: true
    authLevel: internal
workloadReplicas:
  layatypeddecisionsv3: 1
  llminit: 1
spec:
  onlyAdmin: true
  runAsUser: true
  versionName: "0.3.3"
  fullDescription: |
    Laya Typed Decisions is a lightweight, non-autoregressive System One model
    for choice, score, and noul questions through the TypeSafe-compatible
    /v1/systemone API. This CPU deployment is English-only, has a 1,024-token
    context, and supports at most 20 choice options and 10 score levels. It is
    available only when callers select it explicitly and is not eligible for
    Olares default System One routing.
  developer: Convai Innovations
  website: https://huggingface.co/convaiinnovations/laya-typed-decisions
  sourceCode: https://github.com/NandhaKishorM/laya
  submitter: Olares
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/NandhaKishorM/laya/blob/6a5819129eb220570792e417e49723d697efd76f/LICENSE
  supportArch:
    - amd64
  requiredCpu: "2"
  limitedCpu: "8"
  requiredMemory: 3Gi
  limitedMemory: 10Gi
  requiredDisk: 2Gi
  limitedDisk: 20Gi
permission:
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  shared: true
  LLMGatewaySupported: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: info
    options:
      - title: Debug
        value: debug
      - title: Info
        value: info
      - title: Warn
        value: warn
      - title: Error
        value: error

