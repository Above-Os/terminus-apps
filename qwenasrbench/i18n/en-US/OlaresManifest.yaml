metadata:
  description: "ASR Bench for offline + streaming STT."
  title: ASR Bench

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    ASR Bench for offline + streaming STT.

    **Configuration**
    - Model: `Qwen/Qwen3-ASR-1.7B`
    - Source: `hf://Qwen/Qwen3-ASR-1.7B`
    - Capabilities: `stt,stt_stream`
    - Required GPU memory: `12Gi`
    - Engine: Qwen ASR (qwen-asr / vLLM)

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
