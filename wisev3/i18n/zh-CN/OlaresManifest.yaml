metadata:
  title: Wise V3 for test
  description: 您的数字后花园
spec:
  fullDescription: |
    **重要说明**
    这是 Wise 的共享版本。由 Olares 管理员在整个系统中安装一份（Wise 前端 +
    knowledge 后端），每个用户仍会在启动器里获得一个 Wise 入口，全部指向同一个
    共享实例。

    Wise 是一款本地优先的现代化阅读与知识管理工具。它不仅能帮助您从网络和设备中
    收集各类内容，还可以通过本地运行的算法发现有价值的内容，避免被困在巨头平台的
    推荐算法信息茧房中。

    *为什么选择 Wise*
    - AI 驱动，本地优先的阅读器：轻松收集、阅读和管理来自不同平台的信息。
    - 定制化推荐：通过自托管的推荐算法提供定制内容，实现无偏见的信息收集。
    - 应用集成：开放 API，集成海量三方知识应用
  upgradeDescription: |
    将 per-user 的 Wise 前端与共享 knowledge 后端合并为单一的、仅管理员可安装的
    共享应用。管理员安装一份，平台为每个用户注册 Wise 入口。
