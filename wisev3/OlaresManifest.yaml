olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: wisev3
  appid: wisev3
  icon: https://app.cdn.olares.com/appstore/wise/icon.png
  description: Your Digital Secret Garden
  title: Wise
  version: '1.2.32'
  categories:
    - homelab
    - Fun
  tags:
    - reading

sharedEntrances:
  - name: knowledge
    host: sharedentrances-knowledge
    port: 0
    title: Knowledge API
    icon: https://app.cdn.olares.com/appstore/wise/icon.png
    invisible: true
    authLevel: internal

# Entrances:
#   - wiseclient: the Wise UI (merged-in frontend). Registered by the Olares
#     gateway for every user; all users' entrances point at the single shared
#     `wise-svc` frontend (admin installs once, everyone gets an entry).
#   - knowledge: admin-only, invisible API entrance for direct access
#     (debugging / admin tooling). Backed by the `rss-svc` Service (name kept
#     for compatibility with the Wise frontend image, which hardcodes
#     `rss-svc.<knowledge-ns>` as nginx upstreams).
entrances:
  - name: wiseclient
    port: 80
    host: wise-svc
    title: Wise
    icon: https://app.cdn.olares.com/appstore/wise/icon.png
    authLevel: internal
    openMethod: window
  - name: knowledge
    port: 3010
    host: rss-svc
    title: Knowledge API
    icon: https://app.cdn.olares.com/appstore/wise/icon.png
    authLevel: private
    invisible: true

workloadReplicas:
  wisev3: 1
  knowledge: 1

permission:
  appData: true
  appCache: true
  userData:
    - Home

middleware:
  redis:
    namespace: knowledge
  postgres:
    username: knowledge
    databases:
      - name: knowledge
        extensions:
          - pg_trgm
          - btree_gin

spec:
  versionName: '1.11.43'
  featuredImage: https://app.cdn.olares.com/appstore/wise/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/wise/1.webp
    - https://app.cdn.olares.com/appstore/wise/2.webp
    - https://app.cdn.olares.com/appstore/wise/3.webp
    - https://app.cdn.olares.com/appstore/wise/4.webp
  fullDescription: |
    Wise is a local-first reader that collects articles, videos, audio, and
    feeds into one library on Olares. Use it to save pages, upload files,
    subscribe to sources, and organize what you want to read.

    **Key features**

    - Subscribe to websites, blogs, podcasts, and video channels through RSS.
    - Save web pages with the LarePass browser extension or the LarePass mobile app.
    - Upload PDF, EPUB, audio, video, and other documents into the library.
    - Organize items with Inbox, Read Later, tags, notes, and filtered views.
    - Search PDF, web article, and EPUB items through Olares search.
    - Import an existing feed list from an OPML file.

    **For Olares users**

    This is a shared app. An Admin installs it once for the whole system.
    Every user still gets a Wise entrance. All entrances open the same
    shared instance.

    Some features need extra Market apps. Use RSS Subscribe for in-browser
    feeds, YT-DLP for media downloads, and the Twitter/X plugin for posts.

    Login-restricted pages may need cookies. 

    For setup and daily use, see the [Wise documentation](https://docs.olares.com/manual/olares/wise/).

  developer: Olares
  website: https://www.olares.com/
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://docs.olares.com/manual/olares/wise/
  requiredCpu: 310m
  limitedCpu: 7.5
  requiredMemory: 664Mi
  limitedMemory: 10184Mi
  requiredDisk: 50Mi
  limitedDisk: 500Gi
  supportArch:
    - amd64
    - arm64
  onlyAdmin: true

options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
