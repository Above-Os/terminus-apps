metadata:
  title: Plex Media Server
  description: Un servidor multimedia para organizar y transmitir tus propios vídeos y música
spec:
  fullDescription: |
    Plex Media Server organiza tus archivos de vídeo y música en una biblioteca que puedes explorar y los transmite a las aplicaciones Plex.

    **Funciones principales**

    - Explora tu colección con carteles, descripciones y detalles de los contenidos multimedia.
    - Reproduce directamente los archivos compatibles o convierte los vídeos para el dispositivo de reproducción.
    - Usa la transcodificación acelerada por hardware NVIDIA con un Plex Pass activo y una GPU compatible.
    - Añade subtítulos externos, incluidos archivos SRT y ASS.

    **Usar Plex en Olares**

    Añade archivos a `Home/Movies` y `Home/Music` y selecciona `/media/Movies` y `/media/Music` al crear las bibliotecas. Plex puede leer estas carpetas, pero no puede modificar los archivos originales. Usa Plex Account Setup para conectar el servidor a tu cuenta Plex.

    Se necesita una cuenta Plex para vincular el servidor. La transcodificación por hardware requiere Plex Pass; otras funciones y clientes de Plex pueden requerir suscripciones independientes. Los clientes nativos y el acceso remoto pueden necesitar configuración de red adicional. Los archivos multimedia y las suscripciones Plex no están incluidos.

    [Más información sobre Plex Media Server](https://www.plex.tv/your-media/)

    **Acceso local y aplicaciones de TV**

    Activa Plex en Ajustes de Olares > Red > Overlay para obtener una IP local dedicada. Los dispositivos de la misma LAN pueden conectarse a esa IP por el puerto TCP `32400`. Los dispositivos remotos necesitan una VPN u otra ruta hacia esta red. La entrada web privada de Olares requiere iniciar sesión en Olares y no sustituye una dirección para clientes nativos.

    Para un acceso seguro desde clientes nativos, utiliza una URL HTTPS `plex.direct` específica del servidor, con un certificado válido, correspondiente a la IP local y al puerto `32400`, y añádela a las URL de acceso personalizadas del servidor en Plex. Este paquete no añade automáticamente la dirección Overlay a las URL anunciadas por Plex. Una IP y un puerto accesibles no garantizan la detección automática por las aplicaciones de TV.

    Un usuario de TV LG confirmó una reproducción breve con un puerto publicado manualmente y una dirección HTTPS anunciada. Aún no se han validado la detección de TV mediante esta opción Overlay, la reproducción prolongada ni los contenidos con tasas de bits muy altas. No se garantiza que los cambios de puertos realizados fuera de este paquete se conserven tras las actualizaciones del mercado; comprueba la conexión después de actualizar.

    **Compatibilidad de reproducción HEVC**

    Algunos vídeos Dolby Vision/HDR10 pueden congelar la imagen durante la transcodificación HEVC en Chrome. Si ocurre, establece Enable HEVC video encoding en Never en los ajustes del transcodificador Plex, mantén activadas ambas opciones de aceleración por hardware e inicia una nueva sesión de reproducción. Plex podrá usar la transcodificación H.264 por hardware. HEVC funciona con las muestras compatibles probadas, pero aún no se ha confirmado la causa del fallo notificado. Este ajuste es una solución provisional, no una corrección general de HEVC.
  upgradeDescription: |
    Añade acceso local opcional mediante Olares Overlay en el puerto TCP `32400`. Actívalo en Ajustes de Olares > Red > Overlay. Las direcciones HTTPS para clientes nativos aún deben configurarse en Plex; la detección automática de TV todavía no se ha validado.
