metadata:
  title: Plex Media Server
  description: 用于整理和串流个人视频及音乐的媒体服务器
spec:
  fullDescription: |
    Plex Media Server 将自己的视频和音乐文件整理为可浏览的媒体库，并串流到 Plex 客户端。

    **主要功能**

    - 通过海报、简介和媒体详情浏览收藏。
    - 直接播放支持的文件，或将视频转换为播放设备适用的格式。
    - 搭配有效的 Plex Pass 和兼容的 GPU，使用 NVIDIA 硬件加速转码。
    - 添加外部字幕，包括 SRT 和 ASS 文件。

    **在 Olares 上使用 Plex**

    将文件放入 `Home/Movies` 和 `Home/Music`，创建媒体库时选择 `/media/Movies` 和 `/media/Music`。Plex 可以读取这些目录，但不能修改源文件。通过 Plex Account Setup 将服务器绑定到自己的 Plex 账号。

    绑定服务器需要 Plex 账号。硬件转码需要 Plex Pass；其他 Plex 功能及客户端可能另有订阅要求。原生客户端和远程访问可能需要额外配置网络。本应用不附带媒体文件或 Plex 订阅。

    [了解 Plex Media Server](https://www.plex.tv/your-media/)

    **本地访问与电视客户端**

    在 Olares 设置 > 网络 > Overlay 中启用 Plex，获取独立的局域网 IP。同一局域网的设备可通过该 IP 的 TCP `32400` 端口连接；远程设备需要 VPN 或其他可达该网络的路由。Olares 私有网页入口需要 Olares 登录，不能替代原生客户端连接地址。

    原生客户端使用安全连接时，应使用与本地 IP 和 `32400` 端口对应、且证书有效的服务器专属 HTTPS `plex.direct` 地址，并将其加入 Plex 的“自定义服务器访问 URL”。本应用不会自动将 Overlay 地址加入 Plex 广告的访问地址。IP 和端口可达并不保证电视客户端能自动发现服务器。

    一位 LG 电视用户已通过手动发布端口并广告 HTTPS 地址，确认短时间播放成功。本 Overlay 选项下的电视自动发现、持续播放和超高码率内容尚未完成验证。在本应用包之外自定义修改的端口不保证在市场升级后保留；升级后请检查连接。

    **HEVC 播放兼容性**

    部分 Dolby Vision/HDR10 视频在 Chrome 中进行 HEVC 转码时可能出现画面冻结。遇到此情况，请在 Plex 的转码器设置中将“启用 HEVC 视频编码”设为“从不”（Never），保留两项硬件加速设置，并重新开始播放。Plex 随后可使用 H.264 硬件转码。已测试的兼容样片可以正常使用 HEVC，但用户反馈问题的根因尚未确认。这是临时绕过方案，并非 HEVC 的通用修复。
  upgradeDescription: |
    新增通过 Olares Overlay 使用 TCP `32400` 端口进行本地访问的选项。请在 Olares 设置 > 网络 > Overlay 中启用。原生客户端的 HTTPS 地址仍需在 Plex 中配置；电视自动发现尚未完成验证。
