metadata:
  title: Plex Media Server
  description: Un server multimediale per organizzare e trasmettere i propri video e la propria musica
spec:
  fullDescription: |
    Plex Media Server organizza i propri file video e musicali in una libreria consultabile e li trasmette alle app Plex.

    **Funzionalità principali**

    - Esplora la tua raccolta con locandine, descrizioni e dettagli sui contenuti multimediali.
    - Riproduci direttamente i file supportati o converti i video per il dispositivo di riproduzione.
    - Usa la transcodifica con accelerazione hardware NVIDIA con un Plex Pass attivo e una GPU compatibile.
    - Aggiungi sottotitoli esterni, inclusi file SRT e ASS.

    **Usare Plex su Olares**

    Aggiungi i file a `Home/Movies` e `Home/Music`, quindi seleziona `/media/Movies` e `/media/Music` quando crei le librerie. Plex può leggere queste cartelle, ma non può modificare i file originali. Usa Plex Account Setup per collegare il server al tuo account Plex.

    Per associare il server è necessario un account Plex. La transcodifica hardware richiede Plex Pass; altre funzionalità e altri client Plex possono richiedere abbonamenti separati. I client nativi e l’accesso remoto possono richiedere una configurazione di rete aggiuntiva. I file multimediali e gli abbonamenti Plex non sono inclusi.

    [Scopri Plex Media Server](https://www.plex.tv/your-media/)

    **Accesso locale e app TV**

    Abilita Plex in Impostazioni Olares > Rete > Overlay per ottenere un IP locale dedicato. I dispositivi sulla stessa LAN possono collegarsi a questo IP sulla porta TCP `32400`. I dispositivi remoti richiedono una VPN o un altro percorso verso questa rete. L’ingresso Web privato di Olares richiede l’accesso a Olares e non sostituisce un indirizzo per i client nativi.

    Per un accesso sicuro dai client nativi, usa un URL HTTPS `plex.direct` specifico del server, con certificato valido, corrispondente all’IP locale e alla porta `32400`, e aggiungilo agli URL di accesso personalizzati del server in Plex. Questo pacchetto non aggiunge automaticamente l’indirizzo Overlay agli URL annunciati da Plex. Un IP e una porta raggiungibili non garantiscono il rilevamento automatico da parte delle app TV.

    Un utente di TV LG ha confermato una breve riproduzione con una porta pubblicata manualmente e un indirizzo HTTPS annunciato. Il rilevamento TV tramite questa opzione Overlay, la riproduzione prolungata e i contenuti con bitrate molto elevato non sono ancora stati verificati. Le modifiche alle porte effettuate al di fuori del pacchetto non sono garantite dopo gli aggiornamenti del mercato; verifica la connessione dopo l’aggiornamento.

    **Compatibilità di riproduzione HEVC**

    Alcuni video Dolby Vision/HDR10 possono mostrare un’immagine bloccata durante la transcodifica HEVC in Chrome. In tal caso, imposta Enable HEVC video encoding su Never nelle impostazioni del transcodificatore Plex, mantieni abilitate entrambe le opzioni di accelerazione hardware e avvia una nuova sessione di riproduzione. Plex può quindi usare la transcodifica hardware H.264. HEVC funziona con i campioni compatibili testati, ma la causa del problema segnalato non è ancora confermata. Questa impostazione è una soluzione temporanea, non una correzione generale di HEVC.
  upgradeDescription: |
    Aggiunge l’accesso locale facoltativo tramite Olares Overlay sulla porta TCP `32400`. Abilitalo in Impostazioni Olares > Rete > Overlay. Gli indirizzi HTTPS per i client nativi richiedono ancora la configurazione in Plex; il rilevamento automatico delle TV non è ancora verificato.
