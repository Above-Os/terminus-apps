metadata:
  title: Plex Media Server
  description: Ein Medienserver zum Organisieren und Streamen eigener Videos und Musik
spec:
  fullDescription: |
    Plex Media Server organisiert Ihre eigenen Video- und Musikdateien in einer durchsuchbaren Mediathek und streamt sie an Plex-Apps.

    **Hauptfunktionen**

    - Durchsuchen Sie Ihre Sammlung mit Postern, Beschreibungen und Medieninformationen.
    - Spielen Sie unterstützte Dateien direkt ab oder konvertieren Sie Videos für das Wiedergabegerät.
    - Nutzen Sie hardwarebeschleunigtes Transcoding mit NVIDIA, einem aktiven Plex Pass und einer kompatiblen GPU.
    - Fügen Sie externe Untertitel hinzu, darunter SRT- und ASS-Dateien.

    **Plex auf Olares verwenden**

    Legen Sie Dateien in `Home/Movies` und `Home/Music` ab und wählen Sie beim Erstellen der Mediatheken `/media/Movies` und `/media/Music` aus. Plex kann diese Ordner lesen, die Quelldateien jedoch nicht verändern. Verbinden Sie den Server über Plex Account Setup mit Ihrem Plex-Konto.

    Zum Zuordnen des Servers ist ein Plex-Konto erforderlich. Hardware-Transcoding erfordert Plex Pass; andere Plex-Funktionen und Clients können separate Abonnements voraussetzen. Native Clients und Fernzugriff können zusätzliche Netzwerkkonfiguration erfordern. Mediendateien und Plex-Abonnements sind nicht enthalten.

    [Mehr über Plex Media Server](https://www.plex.tv/your-media/)

    **Lokaler Zugriff und TV-Apps**

    Aktivieren Sie Plex unter Olares-Einstellungen > Netzwerk > Overlay, um eine eigene lokale IP-Adresse zu erhalten. Geräte im selben LAN können diese IP über TCP-Port `32400` erreichen. Entfernte Geräte benötigen ein VPN oder eine andere Route in dieses Netzwerk. Der private Olares-Webzugang erfordert eine Olares-Anmeldung und ersetzt keinen Endpunkt für native Apps.

    Verwenden Sie für den sicheren Zugriff nativer Apps eine serverspezifische HTTPS-URL unter `plex.direct` mit gültigem Zertifikat für die lokale IP und Port `32400`. Tragen Sie diese in Plex unter den benutzerdefinierten Serverzugriffs-URLs ein. Dieses Paket ergänzt die von Plex bekannt gegebenen URLs nicht automatisch um die Overlay-Adresse. Eine erreichbare IP und ein erreichbarer Port garantieren keine automatische Erkennung durch TV-Apps.

    Verwenden Sie für den lokalen Zugriff die Overlay-Option dieser App. Prüfen Sie nach einem Markt-Update die Verbindung, wenn Sie eigene Netzwerkeinstellungen verwenden.

    **HEVC-Wiedergabekompatibilität**

    Bei einigen Dolby Vision/HDR10-Videos kann das Bild während der HEVC-Transkodierung in Chrome einfrieren. Stellen Sie in diesem Fall in den Plex-Transcoder-Einstellungen Enable HEVC video encoding auf Never, lassen Sie beide Optionen zur Hardwarebeschleunigung aktiviert und starten Sie eine neue Wiedergabesitzung. Plex kann dann H.264-Hardwaretranskodierung verwenden.
  upgradeDescription: |
    Fügt optionalen lokalen Zugriff über Olares Overlay auf TCP-Port `32400` hinzu. Aktivieren Sie ihn unter Olares-Einstellungen > Netzwerk > Overlay. HTTPS-Adressen für native Apps müssen weiterhin in Plex konfiguriert werden.
