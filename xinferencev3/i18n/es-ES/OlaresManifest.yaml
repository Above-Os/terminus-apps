metadata:
  title: Xinference
  description: Model Serving hecho fácil
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla mediante la app de referencia.

    **RESUMEN**
    Xorbits Inference (Xinference) es una biblioteca potente y versátil diseñada para servir modelos de lenguaje, reconocimiento de voz y multimodales. Con Xorbits Inference puede desplegar y servir sus modelos o los integrados de última generación con un solo comando. Ya sea investigador, desarrollador o científico de datos, Xorbits Inference le permite aprovechar al máximo los modelos de IA más avanzados.

    Características principales
    Model Serving hecho fácil: Simplifica el servicio de grandes modelos de lenguaje, reconocimiento de voz y multimodales. Configure y despliegue para experimentación y producción con un solo comando.

    Modelos de última generación: Experimente con modelos integrados de punta con un solo comando. Inference da acceso a modelos open source de última generación.

    Uso de hardware heterogéneo: Aproveche al máximo su hardware con ggml. Xorbits Inference utiliza de forma inteligente GPUs y CPUs para acelerar la inferencia.

    API e interfaces flexibles: Varias interfaces para interactuar con sus modelos: API RESTful compatible con OpenAI (incluida Function Calling API), RPC, CLI y WebUI para gestión e interacción fluidas.

    Despliegue distribuido: Destaca en escenarios distribuidos, permitiendo repartir la inferencia entre varios dispositivos o máquinas.

    Integración integrada con bibliotecas de terceros: Integración fluida con LangChain, LlamaIndex, Dify y Chatbox.

  upgradeDescription: |
    Migración V3 de la app compartida Xinference (xinferencev2 -> xinferencev3).

    **Cambios**
    - **Arquitectura**: se aplanaron los subcharts xinferencev2server / xinferencev2
      en un solo chart. Se eliminó la capa nginx clientproxy — la entrada
      enruta directamente al Service del motor en el puerto 9997. Memoria del motor
      elevada a 40Gi (/dev/shm 8Gi) para modelos grandes.
    - **Recursos**: se eliminaron las protecciones condicionales solo-admin; la GPU se declara vía
      spec.accelerator (nvidia).
