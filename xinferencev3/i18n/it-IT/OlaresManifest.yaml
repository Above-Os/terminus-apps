metadata:
  title: Xinference
  description: Model Serving reso semplice
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite l'app di riferimento.

    **PANORAMICA**
    Xorbits Inference (Xinference) è una libreria potente e versatile progettata per servire modelli di linguaggio, riconoscimento vocale e multimodali. Con Xorbits Inference puoi distribuire e servire i tuoi modelli o quelli built-in all'avanguardia con un solo comando. Che tu sia ricercatore, sviluppatore o data scientist, Xorbits Inference ti permette di sfruttare appieno i modelli AI più avanzati.

    Funzionalità principali
    Model Serving reso semplice: Semplifica il serving di grandi modelli di linguaggio, riconoscimento vocale e multimodali. Configura e distribuisci per sperimentazione e produzione con un solo comando.

    Modelli all'avanguardia: Sperimenta con modelli built-in all'avanguardia con un solo comando. Inference offre accesso a modelli open source state-of-the-art!

    Utilizzo di hardware eterogeneo: Sfrutta al massimo le risorse hardware con ggml. Xorbits Inference utilizza in modo intelligente GPU e CPU per accelerare l'inferenza.

    API e interfacce flessibili: Più interfacce per interagire con i modelli: API RESTful compatibile OpenAI (inclusa Function Calling API), RPC, CLI e WebUI per gestione e interazione fluide.

    Deployment distribuito: Eccellente in scenari distribuiti, consentendo di distribuire l'inferenza su più dispositivi o macchine.

    Integrazione built-in con librerie di terze parti: Integrazione fluida con LangChain, LlamaIndex, Dify e Chatbox.

  upgradeDescription: |
    Migrazione V3 dell'app condivisa Xinference (xinferencev2 -> xinferencev3).

    **Cosa è cambiato**
    - **Architettura**: i sub-chart xinferencev2server / xinferencev2 sono stati
      uniti in un unico chart. Rimossa la layer nginx clientproxy — l'entrance
      instrada direttamente al Service del motore sulla porta 9997. Memoria del motore
      portata a 40Gi (/dev/shm 8Gi) per modelli grandi.
    - **Risorse**: rimossi i guard condizionali solo-admin; la GPU è dichiarata via
      spec.accelerator (nvidia).
