metadata:
  title: Penpot
  description: Penpot es la herramienta de diseño web de código abierto que cierra la brecha
    entre diseñadores y desarrolladores
spec:
  fullDescription: |
    Penpot es la primera herramienta de diseño de código abierto para la colaboración entre diseño y código. Los diseñadores pueden crear diseños impresionantes, prototipos interactivos y design systems a escala, mientras los desarrolladores disfrutan de código listo para usar y hacen su flujo de trabajo fácil y rápido. Y todo ello sin drama de handoff.

    **Por qué Penpot**
    Penpot expresa los diseños como código. Los diseñadores pueden hacer su mejor trabajo y ver que será implementado hermosamente por los desarrolladores en una colaboración bidireccional.

    - Diseñado para desarrolladores
    Penpot se creó para servir tanto a diseñadores como a desarrolladores y crear un proceso fluido diseño-código. Puedes disfrutar de colaboración en tiempo real o trabajar en solitario.

    - Modo inspect
    Trabaja con código listo para usar y haz tu flujo de trabajo fácil y rápido. La pestaña inspect da acceso instantáneo a código SVG, CSS y HTML.

    - Aloja tu propia instancia
    Proporciona a tu equipo u organización una herramienta de diseño colaborativo completamente propia. Usa el servicio en la nube de Penpot o despliega tu propio servidor Penpot.

    - Integraciones
    Penpot ofrece integración en la cadena de herramientas de desarrollo gracias a su soporte de webhooks y una API accesible mediante access tokens.

    **Qué es genial para el diseño**
    Con Penpot puedes diseñar bibliotecas para compartir y reutilizar; convertir elementos de diseño en componentes y tokens para permitir reutilización y escalabilidad; y construir flujos de usuario e interacciones realistas
  upgradeDescription: |
    Upgrade Penpot to 2.17 (`penpotapp/backend`, `penpotapp/frontend`, `penpotapp/exporter`, `penpotapp/mcp` all 2.17).

    All four Penpot images must stay on the same tag. MCP now uses the official `penpotapp/mcp:2.17` image instead of installing `@penpot/mcp` at runtime.

    Release notes: https://github.com/penpot/penpot/releases/tag/2.17
