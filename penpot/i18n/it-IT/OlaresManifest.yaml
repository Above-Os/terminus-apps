metadata:
  title: Penpot
  description: Penpot è lo strumento di design web open-source che colma il divario
    tra designer e sviluppatori
spec:
  fullDescription: |
    Penpot è il primo strumento di design open-source per la collaborazione tra design e codice. I designer possono creare design straordinari, prototipi interattivi e design system su larga scala, mentre gli sviluppatori godono di codice pronto all'uso e rendono il loro flusso di lavoro semplice e veloce. E tutto questo senza il dramma del handoff.

    **Perché Penpot**
    Penpot esprime i design come codice. I designer possono fare il loro miglior lavoro e vedere che sarà splendidamente implementato dagli sviluppatori in una collaborazione bidirezionale.

    - Progettato per gli sviluppatori
    Penpot è stato creato per servire sia designer sia sviluppatori e creare un processo fluido design-codice. Puoi godere della collaborazione in tempo reale o lavorare in solitaria.

    - Modalità inspect
    Lavora con codice pronto all'uso e rendi il flusso di lavoro semplice e veloce. La scheda inspect dà accesso immediato a codice SVG, CSS e HTML.

    - Ospita la tua istanza
    Fornisci al tuo team o organizzazione uno strumento di design collaborativo completamente di proprietà. Usa il servizio cloud di Penpot o distribuisci il tuo server Penpot.

    - Integrazioni
    Penpot offre integrazione nella toolchain di sviluppo grazie al supporto per webhook e a un'API accessibile tramite access token.

    **Cosa è ottimo per il design**
    Con Penpot puoi progettare librerie da condividere e riusare; trasformare elementi di design in componenti e token per consentire riusabilità e scalabilità; e costruire flussi utente e interazioni realistiche
