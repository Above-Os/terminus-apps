metadata:
  title: Penpot
  description: Penpot est l'outil de design web open source qui comble le fossé
    entre designers et développeurs.
spec:
  fullDescription: |
    Penpot est le premier outil de design open source pour la collaboration design et code. Les designers peuvent créer des designs époustouflants, des prototypes interactifs et des design systems à grande échelle, tandis que les développeurs profitent de code prêt à l'emploi et rendent leur flux de travail simple et rapide. Et tout cela sans drame de handoff.

    **Pourquoi Penpot**
    Penpot exprime les designs sous forme de code. Les designers peuvent faire leur meilleur travail et voir qu'il sera magnifiquement implémenté par les développeurs dans une collaboration bidirectionnelle.

    - Conçu pour les développeurs
    Penpot a été construit pour servir à la fois designers et développeurs et créer un processus fluide design-code. Vous pouvez profiter de la collaboration en temps réel ou travailler en solo.

    - Mode inspect
    Travaillez avec du code prêt à l'emploi et rendez votre flux de travail simple et rapide. L'onglet inspect donne un accès immédiat au code SVG, CSS et HTML.

    - Hébergez votre propre instance
    Fournissez à votre équipe ou organisation un outil de design collaboratif entièrement maîtrisé. Utilisez le service cloud de Penpot ou déployez votre propre serveur Penpot.

    - Intégrations
    Penpot offre une intégration dans la chaîne d'outils de développement grâce au support des webhooks et à une API accessible via des access tokens.

    **Ce qui est génial pour le design**
    Avec Penpot vous pouvez concevoir des bibliothèques à partager et réutiliser ; transformer des éléments de design en composants et tokens pour permettre réutilisabilité et scalabilité ; et construire des parcours utilisateurs et interactions réalistes
  upgradeDescription: |
    v1.0.19 : Déplace `PENPOT_SMTP_PASSWORD` dans un Secret (`secretKeyRef`) ; supprime le branchement de chemins hérité `sysVersion >= 1.12.3`.

    2.14.4

    **Bugs corrigés**
    - Correction de la validation e-mail.
    - Correction de la liste noire e-mail.
    - Correction des erreurs removeChild dues à des conditions de course au démontage.

    Pour plus de détails : https://github.com/penpot/penpot/releases/tag/2.14.4
