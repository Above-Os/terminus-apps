metadata:
  title: Speakrs Diarization
  description: Ein lokaler Dienst, der Sprecher kennzeichnet und ihre Sprechzeiten in Aufnahmen markiert
spec:
  upgradeDescription: |
    v0.0.41: Stellt audio-engines v1.1.22 bereit, damit der optionale score-aware Exclusive-Modus und seine kompakten Segmentnachweise im laufenden Dienst tatsächlich verfügbar sind. Bestehende Clients verwenden standardmäßig weiterhin die alte Methode.

  fullDescription: |
    Speakrs Diarization verarbeitet Aufnahmen lokal und markiert, wann die einzelnen Personen sprechen. Sprachabschnitte werden anonymen Sprecherkennungen zugeordnet, ohne Personen namentlich zu identifizieren. Kompatible Olares-Anwendungen können diese Ergebnisse nutzen, um Sprecher in einer Aufnahme zu unterscheiden.

    **Hauptfunktionen**

    - Sprache und Sprecherwechsel erkennen.
    - Einheitliche anonyme Sprecherkennungen für die gesamte Aufnahme vergeben.
    - Bei NVIDIA-Installationen zwischen einer auf Genauigkeit ausgelegten und einer schnelleren Verarbeitung wählen; der schnellere Modus kann die Genauigkeit verringern.

    **Vor der Installation**

    Wählen Sie bei der Installation die Verarbeitung auf CPU, NVIDIA-GPU oder Intel-GPU. NVIDIA-GPUs müssen die Turing-Architektur oder eine neuere Architektur verwenden. Intel-Installationen benötigen eine funktionsfähige Intel-GPU und wechseln nicht automatisch zur CPU. Um stattdessen die CPU zu nutzen, installieren Sie die Anwendung im CPU-Rechenmodus neu.

    [Speakrs-Dokumentation](https://docs.rs/speakrs)
