metadata:
  title: Speakrs Diarization
  description: Ein lokales Modell zur genauen Aufteilung von Aufnahmen in Sprecherabschnitte

spec:
  upgradeDescription: |
    v0.0.37: Läuft auf Intel-Maschinen und lässt sich auch dort installieren, wo überhaupt keine GPU vorhanden ist. Der bei der Installation angebotene Rechenmodus umfasst jetzt neben NVIDIA auch CPU, Intel und Intel GPU.

  fullDescription: |
    Speakrs Diarization teilt eine Aufnahme in Sprecherabschnitte und markiert, wann jede Person spricht. Es vergibt anonyme Labels, ohne Personen namentlich zu identifizieren. Diese App verwendet die auf Genauigkeit ausgelegte Pipeline und läuft lokal mit ONNX Runtime.

    **Hauptfunktionen**

    - Sprache und Sprecherwechsel erkennen.
    - Durchgängig anonyme Sprecherlabels zuweisen.
    - Segmentierung, Sprecher-Embeddings und Clustering in einer Pipeline verarbeiten.
    - Nach der Installation einen genaueren oder schnelleren Verarbeitungsmodus wählen.
    - Diarisierungsergebnisse für kompatible Olares-Anwendungen bereitstellen.

    Läuft auf einer NVIDIA-GPU, auf einer integrierten oder dedizierten Intel-GPU oder allein auf der CPU; der Rechenmodus wird bei der Installation gewählt. Eine NVIDIA-Karte benötigt mindestens `3Gi` GPU-Speicher und Turing oder neuer, daher werden Karten der GTX-10-Serie sowie Tesla P100 und V100 nicht unterstützt. Eine Intel-Installation hat keinen Rückfall auf die CPU: Lässt sich die Karte nicht nutzen, stoppt die Engine, statt langsam weiterzuarbeiten; eine Neuinstallation im CPU-Rechenmodus ist der Weg zurück.
