metadata:
  title: Speakrs Diarization
  description: Un servicio local que etiqueta a los hablantes e indica cuándo hablan en las grabaciones
spec:
  upgradeDescription: |
    v0.0.41: Despliega audio-engines v1.1.22 para que el modo exclusivo opcional basado en puntuaciones y sus evidencias compactas por segmento estén realmente presentes en el servicio en ejecución. Los clientes existentes siguen usando el método anterior de forma predeterminada.

  fullDescription: |
    Speakrs Diarization procesa las grabaciones localmente para indicar cuándo habla cada persona. Agrupa los segmentos de voz bajo etiquetas anónimas de hablante, sin identificar a las personas por su nombre. Las aplicaciones Olares compatibles pueden usar estos resultados para distinguir a los hablantes en una grabación.

    **Funciones principales**

    - Detectar la voz y los cambios de hablante.
    - Asignar etiquetas anónimas coherentes a los hablantes a lo largo de una grabación.
    - En las instalaciones NVIDIA, elegir entre un procesamiento centrado en la precisión y otro más rápido; el modo más rápido puede reducir la precisión.

    **Antes de instalar**

    Elige el procesamiento con CPU, GPU NVIDIA o GPU Intel durante la instalación. Las GPU NVIDIA deben utilizar la arquitectura Turing o una posterior. Las instalaciones Intel requieren una GPU Intel que funcione y no cambian automáticamente a la CPU. Para utilizar la CPU en su lugar, reinstala la aplicación con el modo de cómputo CPU.

    [Documentación de Speakrs](https://docs.rs/speakrs)
