metadata:
  title: Speakrs Diarization
  description: Speaker diarization on ONNX Runtime, no torch stack

spec:
  upgradeDescription: |
    v0.0.37: Runs on Intel machines, and installs where there is no GPU at all. The compute mode offered at install now includes CPU, Intel and Intel GPU alongside NVIDIA.

  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization separates a recording into speaker turns and marks when each person speaks. It assigns anonymous labels rather than identifying people by name. This app uses the accuracy-focused pipeline and runs locally with ONNX Runtime.

    **Key features**

    - Detect speech and changes between speakers.
    - Assign consistent anonymous labels across a recording.
    - Process segmentation, speaker embeddings, and clustering in one pipeline.
    - Choose a more accurate or a faster processing mode after install.
    - Make diarization results available to compatible Olares applications.

    Runs on an NVIDIA GPU, on an Intel integrated or discrete GPU, or on the CPU alone; the compute mode is chosen at install. An NVIDIA card needs at least `3Gi` of GPU memory and Turing or newer, so GTX 10-series, Tesla P100 and V100 are not supported. An Intel install has no CPU fallback: if the card cannot be used the engine stops rather than serving slowly, and reinstalling on the CPU compute mode is the way back.

entrances:
