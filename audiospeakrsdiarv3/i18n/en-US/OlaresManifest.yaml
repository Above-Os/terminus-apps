metadata:
  title: Speakrs Diarization
  description: A local service that labels speakers and marks when they speak in recordings
spec:
  upgradeDescription: |
    v0.0.39: Exclusive diarization responses now also include the ordinary overlapping timeline from the same inference, enabling evidence-based correction of overlap-clipped short turns while preserving the existing segments field.

  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization processes recordings locally to mark when each speaker talks. It groups speech segments under anonymous speaker labels, without identifying people by name. Compatible Olares applications can use these results to distinguish speakers in a recording.

    **Key features**

    - Detect speech and changes between speakers.
    - Assign consistent anonymous speaker labels across a recording.
    - On NVIDIA installations, choose between accuracy-focused and faster processing; the faster mode can reduce accuracy.

    **Before you install**

    Choose CPU, NVIDIA GPU, or Intel GPU processing at installation. NVIDIA GPUs must use the Turing architecture or newer. Intel installations require a working Intel GPU and do not automatically fall back to the CPU. To use CPU processing instead, reinstall with the CPU compute mode.

    [Speakrs documentation](https://docs.rs/speakrs)
