metadata:
  title: Speakrs Diarization
  description: A local model for separating recordings into anonymous speaker turns

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization separates a recording into speaker turns and marks when each person speaks. It assigns anonymous labels rather than identifying people by name, and runs locally with ONNX Runtime.

    **Key features**
    - Detect speech and changes between speakers.
    - Assign consistent anonymous labels across a recording.
    - Process segmentation, speaker embeddings, and clustering in one pipeline.
    - Make diarization results available to compatible Olares applications.

    A compatible NVIDIA GPU is required.
  upgradeDescription: |
    0.0.23: Initial release.

entrances:
  - name: audiospeakrsdiarv3
    title: Speakrs Diarization
