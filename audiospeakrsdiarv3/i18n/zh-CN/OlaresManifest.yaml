metadata:
  title: Speakrs Diarization
  description: 在本地为录音中的说话人分配标签并标记发言时间的服务
spec:
  upgradeDescription: |
    v0.0.40：新增可选的 score-aware exclusive 模式，直接根据二值化前的帧级支持度解决重叠说话人归属，并返回紧凑的分段证据与可复现的平票决策。现有客户端默认仍使用旧模式。

  fullDescription: |
    Speakrs Diarization 在本地处理录音，标记每位说话人的发言时间。它将语音片段归入匿名说话人标签，不会按姓名识别真实身份。兼容的 Olares 应用可以使用这些结果区分录音中的说话人。

    **主要功能**

    - 检测语音和说话人变化。
    - 在整段录音中使用一致的匿名说话人标签。
    - 在 NVIDIA 安装模式下，可选择侧重准确度或速度的处理方式；更快的模式可能降低准确度。

    **安装之前**

    安装时选择 CPU、NVIDIA GPU 或 Intel GPU 处理模式。NVIDIA GPU 需要采用 Turing 或更新的架构。Intel 安装模式需要可正常使用的 Intel GPU，不会自动回退到 CPU。如需改用 CPU 处理，请选择 CPU 算力模式重新安装。

    [Speakrs 文档](https://docs.rs/speakrs)
