metadata:
  title: Speakrs Diarization
  description: 用于精确划分录音中说话人片段的本地模型

spec:
  upgradeDescription: |
    v0.0.37：可在 Intel 机器上运行，也可在完全没有显卡的机器上安装。安装时可选的算力模式在 NVIDIA 之外新增了 CPU、Intel 和 Intel GPU。

  fullDescription: |
    Speakrs Diarization 可将录音划分为不同说话人的片段，并标记每个人的发言时间。它使用匿名标签，不会按姓名识别真实身份。本应用使用偏重准确度的处理流程，并通过 ONNX Runtime 在本地运行。

    **主要功能**

    - 检测语音和说话人变化。
    - 在整段录音中使用一致的匿名说话人标签。
    - 在一个流程中完成分段、说话人嵌入和聚类。
    - 安装后可在更准确或更快的处理模式之间选择。
    - 向兼容的 Olares 应用提供说话人分离结果。

    可在 NVIDIA 显卡、Intel 核显或独显上运行，也可只用 CPU 运行；算力模式在安装时选择。NVIDIA 显卡需要至少 `3Gi` 显存且为 Turing 或更新的架构，因此不支持 GTX 10 系列、Tesla P100 和 V100。Intel 安装没有 CPU 回退：显卡不可用时引擎会停止，而不是降速继续服务，改用 CPU 算力模式重新安装即可恢复。
