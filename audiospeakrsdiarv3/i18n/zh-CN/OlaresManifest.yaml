# 🔴 Not optional decoration. The Market serves an application's title as a language map
# when translations exist and as a bare string when they do not, and Router's projector
# decodes that field into map[string]string. One application without translations makes the
# whole model-application catalog fail to decode -- Router then keeps its previous snapshot,
# and every model application installed after that point is invisible, with the only symptom
# a warning in Router's own log.
metadata:
  title: Speakrs Diarization
  description: 说话人分离，跑在 ONNX Runtime 上，不带 torch

spec:
  onlyAdmin: true
  fullDescription: |
    **模型**

    speakrs——把 pyannote `community-1` 分离流水线用 Rust 在 ONNX Runtime 上重写了一遍：
    分割、powerset 解码、重叠相加汇总、二值化、声纹嵌入、PLDA 与 VBx 聚类。

    **配置**
    - 模型名：`speakrs/speakrs-community-1`
    - 权重：`hf://avencera/speakrs-models`
    - 能力：`diar`
    - 所需显存：`3Gi`
    - 引擎：speakrs，跑在 ONNX Runtime 的 CUDA 后端上
    - 显卡：NVIDIA，图灵（Turing）及更新的架构。基于 CUDA 13 构建，不再支持帕斯卡
      （GTX 10 系、P100）和伏特（V100）；arm64 上只支持 GB10

    **精度与速度**

    由 `EXECUTION_MODE` 这一项选择，改动后引擎会重启。`cuda` 的精度与 pyannote 持平，
    速度约为它的 1.8 倍；`cuda-fast` 速度约为 3.6 倍，代价是 0.3 到 1.0 个 DER 点，
    说话人重叠越密代价越大。两种模式加载的是同一份权重——模式改变的是流水线怎么跑，
    不是跑的什么——所以切换模式不会重新下载，模型名两边也一样。也正因为模型名一样，
    这一项设置是唯一能看出某次运行用了哪种模式的地方。

    **可调参数**

    调用方每次请求都可以单独指定 `exclusive`、`min_duration_off`、`min_duration_on`
    和 `clustering_threshold`；`ENGINE_ARGS` 则是这四项在这个部署里的默认值。
    本引擎从聚类中自行推断说话人数，无法被指定，因此 `num_speakers`、`min_speakers` 和
    `max_speakers` 会被明确拒绝，而不是接受后忽略。

    **工作方式**

    llm-init 负责下载权重并提供控制面；引擎等权重就绪后，在 llm-init 的反向代理后面提供 `/v1/*`。

entrances:
  - name: audiospeakrsdiarv3
    title: Speakrs Diarization
