metadata:
  title: Speakrs Diarization
  description: 録音を話者区間に正確に分割するローカルモデル

spec:
  upgradeDescription: |
    v0.0.37: Intelマシンで動作し、GPUがまったくない環境にもインストールできます。インストール時に選べる計算モードに、NVIDIAに加えてCPU、Intel、Intel GPUが追加されました。

  fullDescription: |
    Speakrs Diarizationは、録音を話者ごとの区間に分け、各人物が話した時間を示します。個人名を特定せず匿名ラベルを割り当てます。このアプリは精度を重視した処理を使い、ONNX Runtimeでローカルに動作します。

    **主な機能**

    - 発話と話者の交代を検出します。
    - 録音全体で一貫した匿名の話者ラベルを割り当てます。
    - セグメンテーション、話者埋め込み、クラスタリングを一つの処理で行います。
    - インストール後に、より正確な処理モードかより高速な処理モードかを選べます。
    - 対応するOlaresアプリから話者ダイアライゼーション結果を利用できます。

    NVIDIA GPU、Intelの内蔵GPUまたは外付けGPU、あるいはCPUのみで動作します。計算モードはインストール時に選択します。NVIDIAカードは`3Gi`以上のGPUメモリとTuring以降の世代が必要で、GTX 10シリーズ、Tesla P100、V100には対応していません。Intelでのインストールには CPU へのフォールバックがありません。カードが使用できない場合、速度を落として動作を続けるのではなくエンジンが停止します。CPU計算モードで再インストールすると元に戻せます。
