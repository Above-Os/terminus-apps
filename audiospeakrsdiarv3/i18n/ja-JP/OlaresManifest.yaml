metadata:
  title: Speakrs Diarization
  description: 録音内の話者にラベルを付け、発言時間を示すローカルサービス
spec:
  upgradeDescription: |
    v0.0.45: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

    v0.0.42：話者数を指定してもリクエストが失敗しなくなりました。話者数は引き続き録音からエンジンが判定し、無視された指定は結果に記載されます。

  fullDescription: |
    Speakrs Diarizationは録音をローカルで処理し、各話者が話す時間を示します。発話区間を匿名の話者ラベルごとにまとめ、個人名による識別は行いません。対応するOlaresアプリは、この結果を使って録音内の話者を区別できます。

    **主な機能**

    - 発話と話者の交代を検出します。
    - 録音全体で一貫した匿名の話者ラベルを割り当てます。
    - NVIDIAでのインストールでは、精度重視の処理と高速な処理を選べます。高速モードでは精度が低下する場合があります。

    **インストール前に**

    インストール時にCPU、NVIDIA GPU、Intel GPUの処理モードを選択します。NVIDIA GPUにはTuring以降のアーキテクチャが必要です。Intelでのインストールには正常に動作するIntel GPUが必要で、CPUへの自動フォールバックはありません。代わりにCPUで処理するには、CPU計算モードで再インストールしてください。

    [Speakrsのドキュメント](https://docs.rs/speakrs)
