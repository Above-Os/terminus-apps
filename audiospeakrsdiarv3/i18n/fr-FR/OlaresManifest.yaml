metadata:
  title: Speakrs Diarization
  description: Un service local qui étiquette les locuteurs et indique quand ils parlent
spec:
  upgradeDescription: |
    v0.0.42 : Indiquer un nombre de locuteurs ne fait plus échouer la requête. Le moteur détermine toujours le nombre de locuteurs à partir de l’enregistrement, et le résultat indique la valeur ignorée.

  fullDescription: |
    Speakrs Diarization traite les enregistrements localement pour indiquer quand chaque personne parle. Il regroupe les segments de parole sous des étiquettes de locuteurs anonymes, sans identifier les personnes par leur nom. Les applications Olares compatibles peuvent utiliser ces résultats pour distinguer les locuteurs dans un enregistrement.

    **Fonctionnalités principales**

    - Détecter la parole et les changements de locuteur.
    - Attribuer des étiquettes de locuteurs anonymes cohérentes tout au long d’un enregistrement.
    - Sur les installations NVIDIA, choisir entre un traitement axé sur la précision et un traitement plus rapide ; le mode plus rapide peut réduire la précision.

    **Avant l’installation**

    Choisissez le traitement sur CPU, GPU NVIDIA ou GPU Intel lors de l’installation. Les GPU NVIDIA doivent utiliser l’architecture Turing ou une architecture plus récente. Les installations Intel nécessitent un GPU Intel fonctionnel et ne basculent pas automatiquement sur le CPU. Pour utiliser le CPU à la place, réinstallez l’application en choisissant le mode de calcul CPU.

    [Documentation de Speakrs](https://docs.rs/speakrs)
