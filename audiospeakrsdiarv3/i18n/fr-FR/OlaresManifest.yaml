metadata:
  title: Speakrs Diarization
  description: Un modèle local qui sépare les enregistrements en tours de parole anonymes

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization sépare un enregistrement en tours de parole et indique quand chaque personne parle. Il attribue des étiquettes anonymes sans identifier les personnes par leur nom et fonctionne en local avec ONNX Runtime.

    **Fonctionnalités principales**
    - Détecter la parole et les changements de locuteur.
    - Attribuer des étiquettes anonymes cohérentes dans tout l'enregistrement.
    - Effectuer la segmentation, la représentation des locuteurs et le regroupement dans un même processus.
    - Mettre les résultats de diarisation à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible est requis.
  upgradeDescription: |
    0.0.23 : Version initiale.

entrances:
  - name: audiospeakrsdiarv3
    title: Speakrs Diarization
