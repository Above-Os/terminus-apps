metadata:
  title: Speakrs Diarization
  description: Un servizio locale che etichetta i parlanti e indica quando parlano nelle registrazioni
spec:
  upgradeDescription: |
    v0.0.42: Indicare un numero di parlanti non fa più fallire la richiesta. Il motore continua a determinare il numero di parlanti dalla registrazione e il risultato indica il valore ignorato.

  fullDescription: |
    Speakrs Diarization elabora le registrazioni in locale per indicare quando parla ciascuna persona. Raggruppa i segmenti di parlato sotto etichette anonime, senza identificare le persone per nome. Le applicazioni Olares compatibili possono usare questi risultati per distinguere i parlanti in una registrazione.

    **Funzionalità principali**

    - Rilevare il parlato e i cambi di parlante.
    - Assegnare etichette anonime coerenti ai parlanti nell’intera registrazione.
    - Nelle installazioni NVIDIA, scegliere tra un’elaborazione orientata alla precisione e una più veloce; la modalità più veloce può ridurre la precisione.

    **Prima dell’installazione**

    Durante l’installazione, scegli l’elaborazione su CPU, GPU NVIDIA o GPU Intel. Le GPU NVIDIA devono usare l’architettura Turing o una successiva. Le installazioni Intel richiedono una GPU Intel funzionante e non passano automaticamente alla CPU. Per usare invece la CPU, reinstalla l’applicazione con la modalità di calcolo CPU.

    [Documentazione di Speakrs](https://docs.rs/speakrs)
