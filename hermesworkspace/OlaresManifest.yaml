olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: hermesworkspace
  title: Hermes Workspace
  description: A browser workspace for AI conversations and files
  icon: https://cdn.olares.com/images/2026/10/e54eb1e64f5ac519b6e96d263ef59eb0.png
  version: 0.0.7
  categories:
  - Productivity_v112
  - AI
entrances:
- name: hermesworkspace
  host: hermesworkspace
  port: 3000
  title: Hermes Workspace
  authLevel: private
  openMethod: window
spec:
  versionName: 2.3.0
  developer: outsourc-e
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  locale:
  - de-DE
  - en-US
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  - zh-CN
  fullDescription: Chat with Router default-chat and manage workspace files in your
    browser. Conversations, files and local settings are stored in application storage.
    Sign in with the password supplied during installation. Advanced agent tools require
    a separately installed and configured Hermes Agent gateway and dashboard; this
    package does not include Hermes Agent.
  website: https://github.com/outsourc-e/hermes-workspace
  sourceCode: https://github.com/outsourc-e/hermes-workspace
  license:
  - text: MIT
    url: https://github.com/outsourc-e/hermes-workspace/blob/main/LICENSE
  accelerator:
  - mode: cpu
    requiredCpu: 220m
    limitedCpu: '2.1'
    requiredMemory: 544Mi
    limitedMemory: 3200Mi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
  featuredImage: https://cdn.olares.com/images/2026/10/14f94ec88ee1925c757ef9617bf56674.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/14f94ec88ee1925c757ef9617bf56674.png
  - https://cdn.olares.com/images/2026/10/bf98503be7d30c4b01a95d1c1e0193d7.png
permission:
  appData: true
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: router
    type: application
    version: '>=0.0.1-0'
    mandatory: true
  - name: hermesagent
    type: application
    version: '>=1.3.49-0'
    mandatory: false
workloadReplicas:
  hermesworkspace: 1
envs:
- envName: WORKSPACE_PASSWORD
  type: password
  required: true
  editable: true
  regex: ^.{12,}$
  description: Workspace sign-in password (at least 12 characters).
