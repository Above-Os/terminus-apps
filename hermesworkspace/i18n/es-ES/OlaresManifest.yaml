metadata:
  title: Hermes Workspace
  description: Conversaciones con IA y archivos de trabajo en el navegador
spec:
  fullDescription: Conversa con Router default-chat y gestiona los archivos de tu
    espacio de trabajo desde el navegador. Las conversaciones, los archivos y los
    ajustes locales se guardan en el almacenamiento de la aplicación. Inicia sesión
    con la contraseña definida durante la instalación. Las herramientas avanzadas
    requieren una pasarela y un panel de Hermes Agent instalados y configurados por
    separado. Este paquete no incluye Hermes Agent.
