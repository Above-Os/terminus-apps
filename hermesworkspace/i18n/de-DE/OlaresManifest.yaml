metadata:
  title: Hermes Workspace
  description: KI-Gespräche und Arbeitsdateien direkt im Browser
spec:
  fullDescription: 'Chatten Sie mit Router default-chat und verwalten Sie Arbeitsdateien
    im Browser. Gespräche, Dateien und lokale Einstellungen werden im Anwendungsspeicher
    gespeichert. Melden Sie sich mit dem bei der Installation festgelegten Passwort
    an. Erweiterte Agentenwerkzeuge benötigen ein separat installiertes und konfiguriertes
    Hermes Agent-Gateway samt Dashboard. Dieses Paket enthält Hermes Agent nicht.


    Von Hermes Agent erstellte Dateien und sein Agentengedächtnis werden getrennt
    von den Browser-Arbeitsdateien und lokalen Gedächtnisnotizen gespeichert.'
