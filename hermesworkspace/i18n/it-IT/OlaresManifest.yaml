metadata:
  title: Hermes Workspace
  description: Conversazioni con IA e file di lavoro nel browser
spec:
  fullDescription: Chatta con Router default-chat e gestisci i file dello spazio di
    lavoro nel browser. Conversazioni, file e impostazioni locali vengono salvati
    nello spazio di archiviazione dell’applicazione. Accedi con la password impostata
    durante l’installazione. Gli strumenti avanzati richiedono un gateway e una dashboard
    Hermes Agent installati e configurati separatamente. Questo pacchetto non include
    Hermes Agent.
