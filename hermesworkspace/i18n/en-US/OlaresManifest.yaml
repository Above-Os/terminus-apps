metadata:
  title: Hermes Workspace
  description: A browser workspace for AI conversations and files
spec:
  fullDescription: 'Chat with Router default-chat and manage workspace files in your
    browser. Conversations, files and local settings are stored in application storage.
    Sign in with the password supplied during installation. Advanced agent tools require
    a separately installed and configured Hermes Agent gateway and dashboard; this
    package does not include Hermes Agent.


    Hermes Agent stores its tool-created files and agent memory separately from the
    browser workspace files and local memory notes.'
