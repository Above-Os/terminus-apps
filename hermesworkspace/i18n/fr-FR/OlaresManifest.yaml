metadata:
  title: Hermes Workspace
  description: Conversations avec une IA et fichiers de travail dans le navigateur
spec:
  fullDescription: Discutez avec Router default-chat et gérez les fichiers de votre
    espace de travail dans le navigateur. Les conversations, les fichiers et les paramètres
    locaux sont conservés dans le stockage de l’application. Connectez-vous avec le
    mot de passe défini lors de l’installation. Les outils avancés nécessitent une
    passerelle et un tableau de bord Hermes Agent installés et configurés séparément.
    Ce paquet ne contient pas Hermes Agent.
