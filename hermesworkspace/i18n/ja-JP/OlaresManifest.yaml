metadata:
  title: Hermes Workspace
  description: ブラウザーでAIと対話し、ワークスペースのファイルを管理
spec:
  fullDescription: 'Router default-chatで対話し、ブラウザーでワークスペースのファイルを管理できます。会話、ファイル、ローカル設定はアプリのストレージに保存されます。インストール時に設定したパスワードでログインしてください。高度なエージェント機能には、別途インストールして設定したHermes
    Agentのゲートウェイとダッシュボードが必要です。このパッケージにHermes Agentは含まれません。


    Hermes Agentのツールで作成したファイルとエージェントの記憶は、ブラウザーのワークスペースファイルやローカルのメモとは別に保存されます。'
