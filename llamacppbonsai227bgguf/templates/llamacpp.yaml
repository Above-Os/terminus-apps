{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $engineArgs := include "llamacppbonsai227bgguf.presetArgs" ($oe.ENGINE_ARGS | default "") -}}
{{- /* MODEL_MODE=embedding -> auto-add llama.cpp's --embedding so it works out
       of the box; skipped if the user already passed it in ENGINE_ARGS. */ -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- if and (eq $modelMode "embedding") (not (contains "--embedding" $engineArgs)) -}}
{{- $engineArgs = trim (printf "%s --embedding" $engineArgs) -}}
{{- end -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $cpuRequest := trim ($oe.LLAMACPP_CPU_REQUEST | default "200m") -}}
{{- $memRequest := trim ($oe.LLAMACPP_MEMORY_REQUEST | default "4Gi") -}}
{{- $cpuLimit := trim ($oe.LLAMACPP_CPU_LIMIT | default "6") -}}
{{- $memLimit := trim ($oe.LLAMACPP_MEMORY_LIMIT | default "24Gi") -}}
{{- /* Upgrade persisted, non-editable resource defaults together with the preset. */ -}}
{{- if eq $memLimit "21Gi" -}}
{{- $memLimit = "24Gi" -}}
{{- end -}}
{{- $engineArgs = include "llamacppbonsai227bgguf.engineArgs" (dict "Args" $engineArgs) -}}
{{- /* nvidia.com/gpumem needs a BARE MiB int. This app is amd64/CUDA only —
       the PrismML fork publishes no linux-arm64 CUDA build — so there is no
       nvidia-gb10 (Spark unified memory) branch here. */ -}}
{{- $gpuMiB := include "llmbase.gpuMiB" ($oe.LLAMACPP_REQUIRED_GPU_MEMORY | default "15Gi") -}}
{{- if eq $gpuMiB "12288" -}}
{{- $gpuMiB = "15360" -}}
{{- end -}}
{{- $runStateHostPath := printf "%s/llm-init-run/%s" .Values.userspace.appCache .Release.Name -}}
---
# llama.cpp engine Deployment. wrappers/llamacpp.sh blocks on the sentinel
# (download ready), then execs llama-server -hf "$MODEL_NAME".
# llm-init reverse-proxies at http://llamacpp:8081 — Service name MUST be
# "llamacpp". GPU base: PrismML CUDA server build + gpu-inject; put `-ngl all`
# in ENGINE_ARGS to offload all layers to the GPU.
#
# The image MUST be the PrismML fork: stock llama.cpp rejects PQ2_0/PTQ1_0 as
# unknown types, and loads Q2_0 without warning and produces garbage, because
# it has no Hadamard activation runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Primary workload: named after the release (== appid llamacppbonsai227bgguf) for v3
  # allowMultipleInstall. Label/selector stays io.kompose.service: llamacpp.
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llamacpp
  annotations:
    applications.app.bytetrade.io/gpu-inject: "llamacpp"
spec:
  replicas: {{ .Values.workloads.llamacppbonsai227bgguf.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacpp
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: llm-init-wrappers
            defaultMode: 0555
      containers:
        - name: llamacpp
          image: docker.io/leamon2code/prismml-llama.cpp:server-cuda12.8-prism-b10709
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/llm-init/wrappers/llamacpp.sh"]
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: WRAPPER_COMMON
              value: /run/llm-init/wrappers/common.sh
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
            - name: LLAMACPP_PORT
              value: "8081"
            - name: WAIT_TIMEOUT
              value: "3600"
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          ports:
            - name: llamacpp
              containerPort: 8081
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /llm-init/wrappers
              readOnly: true
          resources:
            # nvidia.com/gpumem is the per-instance GPU memory quota read by the
            # Olares gpu-inject webhook (accelerator is -1/auto, can't carry it).
            # It's a non-overcommittable extended resource, so it must be in BOTH
            # requests and limits with the same value.
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
              nvidia.com/gpumem: {{ $gpuMiB }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
              nvidia.com/gpumem: {{ $gpuMiB }}
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llamacpp
spec:
  selector:
    io.kompose.service: llamacpp
  ports:
    - name: llamacpp
      port: 8081
      targetPort: 8081
  type: ClusterIP
