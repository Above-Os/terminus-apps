metadata:
  description: "用于本地推理、编程、工具调用和图像问答的 AI 模型"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    NVIDIA 模式所需显存调整为 23Gi，默认并发请求槽位由一个增加为两个。CPU 模式仍使用一个槽位。

    已有的默认配置会自动更新，自定义启动参数保持不变。

  fullDescription: |
    Bonsai 2 27B 是 Prism ML 开发的模型，可用于回答问题、编写代码和处理图像。模型采用压缩权重在本地运行，支持推理和工具调用。

    **主要功能**

    - 在兼容的聊天应用中进行文本和图像问答。
    - 通过推理处理需要多个步骤的任务，包括编程和问题求解。
    - 连接支持工具调用的应用，让模型通过应用提供的工具请求执行操作。
    - 通过模型控制台下载和管理模型，并通过 Olares AI 网关或兼容 OpenAI 的 API 访问模型。

    **安装前须知**

    本应用提供 `PQ2_0` 模型及其视觉组件，支持在 `amd64` 系统上使用 NVIDIA GPU 或 CPU 模式。本应用不支持集成 GPU 加速和 DGX Spark。

    模型文件下载完成后才能使用。图像输入和工具调用需要使用支持相应功能的客户端。

    模型详情和使用建议请参阅[官方模型卡](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf)。
