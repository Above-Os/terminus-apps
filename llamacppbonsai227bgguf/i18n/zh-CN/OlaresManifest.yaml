metadata:
  description: "Ternary Bonsai 2 27B（GGUF PQ2_0），由 PrismML 的 llama.cpp 分支提供服务。"
  title: Bonsai 2 27B (llama.cpp)

spec:
  upgradeDescription: |
    v1.0.6：NVIDIA 单槽位默认参数移除 --kv-unified，CPU 模式保留。
    旧 NVIDIA 默认参数自动迁移，自定义参数保持原样。

    v1.0.5：CPU 和 NVIDIA 默认上下文统一为 131072 token。CPU 保留 f16 K/V 和单槽位，
    引擎内存预留设为 16Gi、上限设为 20Gi；旧 CPU 默认参数自动迁移，自定义参数保留。
    内存预算为估算，128K CPU 推理性能和峰值占用仍需目标机器验证。

    v1.0.4：非 NVIDIA 这条路改用 CPU 构建，不再用 Vulkan —— Vulkan 镜像在目标机器上起不来，
    而上游声明支持的后端本来就是 CUDA / Metal / CPU。模式 `intel` 替换为 `cpu`：与 nvidia
    共用同一个 PQ2_0 文件（CPU 后端对 PQ2_0 有重排后的 GEMM 通路，对 PTQ1_0 只有逐向量点积），
    不需要设备透传，不需要 privileged，改为 8 核 + 20Gi 主机内存，不占显存配额。

    v1.0.3：nvidia 模式上下文由 98,304 提升到 131,072 token（128 Ki），显存配额仍为 15Gi。
    24Gi 显卡实测常驻 12.75Gi（权重 + mmproj + Q8_0 K/V）。

    v1.0.2：GPU 配额提升至 15Gi；单槽位 98,304 token 上下文，Q8_0 K/V 缓存，batch 512 / ubatch 128。
    引擎内存上限提高到 24Gi，保留 GPU 驱逐至主机内存的余量。

    v1.0.0：首个版本。PrismML llama.cpp 分支 `prism-b10709-9a9394a`（CUDA 12.8），llm-init v1.7.21。
    prism-ml/Ternary-Bonsai-2-27B-gguf PQ2_0 + mmproj-Q8_0，32K 上下文（-c 32768），GPU 配额 12Gi。
  fullDescription: |
    **模型简介**
    Ternary Bonsai 2 27B 是 PrismML 发布的三值权重（{-1, 0, +1}）视觉语言模型，参数量 27.36B，
    基于 Qwen3.8-27B 改造为混合注意力架构（约 75% 线性注意力 + 25% 全注意力）。
    支持思考、工具调用和图像/视频理解，上下文窗口 262K。
    本应用提供 `prism-ml/Ternary-Bonsai-2-27B-gguf` 的 `PQ2_0` GGUF 构建。

    **为什么需要分支版引擎**
    官方 llama.cpp 无法运行这些文件：它会把 `PQ2_0` / `PTQ1_0` 判为未知类型而拒绝加载，
    并且会静默地把 `Q2_0` 读进来输出乱码——因为它没有 Hadamard 激活变换的运行时。
    因此本应用使用 PrismML 分支（[PrismML-Eng/llama.cpp](https://github.com/PrismML-Eng/llama.cpp)），
    其中包含三值混合注意力的 CUDA 内核。`-fa on` 是必需的：它启用权重旋转基所依赖的 Hadamard 激活变换。

    **预设配置**
    - 模型：`prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0`（7.21 GB，含视觉投影器 `mmproj-Q8_0`）—— 两种模式共用同一个文件
    - 能力：思考、工具调用、视觉
    - 引擎参数（nvidia）：`-c 131072 -ngl all -fa on --jinja -np 1 -ctk q8_0 -ctv q8_0 -b 512 -ub 128`（128 Ki token；单槽位，Q8_0 K/V）
    - 引擎参数（cpu）：`-c 131072 -fa on --jinja -np 1 --kv-unified -b 512 -ub 128 -t 8`（128 Ki token；单槽位，f16 K/V；`-t` 与容器 CPU limit 对齐）
    - 所需 GPU 显存：nvidia 模式 `15Gi`；cpu 模式不占用显存
    - 上下文预算包含输入、图像 token、思考和输出；单次请求独占一个槽位。
    - nvidia：128 Ki 上下文下 Q8_0 K/V 约 4.25Gi，24Gi 显卡实测常驻 12.75Gi，占 15Gi 配额。
    - cpu：PQ2_0 6.72Gi + mmproj 0.59Gi + 128 Ki 的 f16 K/V 估算约 8–8.5Gi，全部占用主机内存。
    - 模型卡推荐的采样参数：思考模式 `temp 1.0 / top_p 0.95 / top_k 20`；
      指令模式 `temp 0.7 / top_p 0.80 / top_k 20 / presence_penalty 1.5`

    **加速器模式**
    | 模式     | 设备                | 说明                                              |
    |----------|---------------------|---------------------------------------------------|
    | `nvidia` | NVIDIA 独显（CUDA） | `15Gi` 显存配额，128 Ki 上下文，Q8_0 K/V，`-ngl all` |
    | `cpu`    | 无加速器            | 8 核 / 20Gi 主机内存，128 Ki 上下文，f16 K/V，固定 `-t` |

    模式只决定镜像；两种模式用同一个 PQ2_0 文件，切换模式不会重新下载。PQ2_0 也是 CPU 上
    的正确选择：CPU 后端对它有重排后的 GEMM 通路（`ggml_gemm_pq2_0_4x8_q8_0`），对 PTQ1_0
    只有逐向量点积。没有核显模式 —— 分支确实发布了 Vulkan 构建，但它在目标机器上起不来，
    所以核显机器走 CPU 路径。上游没有公布任何 CPU 吞吐数据；decode 是内存带宽瓶颈，定上下文
    大小前先用 `llama-bench` 实测。

    仅支持 amd64：PrismML 分支没有发布 linux-arm64 的 CUDA 构建，因此不支持 DGX Spark（`nvidia-gb10`）。

    **工作方式**
    Model Console 先下载并准备好模型，就绪后 `llama.cpp` 再启动并提供服务。
    两者是独立的工作负载，通过共享文件和进度信息协作。

    **技术栈**
    - **llama.cpp**（PrismML `prism-b10709-9a9394a`，CUDA 12.8）：运行模型并提供 API（端口 8081）
    - **Model Console**：下载模型、展示进度，并在端口 8090 提供 OpenAI 兼容 API，反向代理到 `llamacpp`。

    **模型存储**
    所有模型文件保存在共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。同类应用共用该位置。
