metadata:
  description: "用于推理、编程、图像理解和工具调用的本地 AI 模型"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    不再提供 Intel 集成 GPU 模式。恢复 CPU 支持，并新增 Intel 独立 GPU 支持。

    默认情况下，NVIDIA 可并行处理两个请求，CPU 和 Intel 独立 GPU 处理一个请求。已有的默认配置会自动更新，自定义启动参数保持不变。

  fullDescription: |
    Bonsai 2 27B 是 Prism ML 开发的本地模型，可用于回答问题、编写代码和理解图像。压缩后的模型权重减少了存储需求，同时保留推理和工具调用能力。

    **主要功能**

    - 处理需要多步推理的任务，包括编程和问题求解。
    - 在兼容的应用中针对图像提问。
    - 通过兼容的应用将模型连接到工具，以执行更多操作。
    - 通过 Model Console 下载和管理模型，再通过 Olares AI 网关或兼容 OpenAI 的 API 访问模型。

    **使用前须知**

    本应用包含 `PQ2_0` 模型及其视觉组件。请等待模型文件下载完成后再使用。图像输入和工具调用需要客户端支持相应功能。

    模型详情和使用指导请参阅[官方模型卡](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf)。
