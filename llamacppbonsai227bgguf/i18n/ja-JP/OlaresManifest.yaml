metadata:
  description: "推論、コーディング、画像理解、ツール呼び出しに対応するローカルAIモデル"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    v1.0.8: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

    Intel内蔵GPUモードは利用できなくなりました。CPU対応を復元し、IntelディスクリートGPUへの対応を追加しました。

    デフォルトでは、NVIDIAは2件のリクエストを並列処理し、CPUとIntelディスクリートGPUは1件を処理します。既存のデフォルト設定は自動更新され、カスタムのエンジン引数は保持されます。

  fullDescription: |
    Bonsai 2 27Bは、質問への回答、コードの作成、画像の解釈をローカルで行うPrism MLのモデルです。圧縮されたモデルの重みにより、推論とツール呼び出しの機能を維持しながら、モデルの保存に必要な容量を削減します。

    **主な機能**

    - コーディングや問題解決など、複数段階の推論が必要なタスクに取り組めます。
    - 対応するアプリケーションで画像について質問できます。
    - 対応するアプリケーションを通じてモデルをツールに接続し、追加の操作を実行できます。
    - Model Consoleでモデルをダウンロードして管理し、Olares AIゲートウェイまたはOpenAI互換APIからアクセスできます。

    **利用前の確認事項**

    このアプリには`PQ2_0`モデルと視覚コンポーネントが含まれています。モデルファイルのダウンロードが完了してから利用してください。画像入力とツール呼び出しには、それぞれの機能に対応したクライアントが必要です。

    モデルの詳細と利用方法は[公式モデルカード](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf)をご覧ください。
