metadata:
  description: "Ein lokales KI-Modell für logisches Denken, Programmieren, Bildverständnis und Tool-Aufrufe"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    Der Modus für integrierte Intel-GPUs ist nicht mehr verfügbar. Die CPU-Unterstützung wurde wiederhergestellt und die Unterstützung für dedizierte Intel-GPUs hinzugefügt.

    Standardmäßig verarbeitet NVIDIA zwei Anfragen parallel; CPU und dedizierte Intel-GPU verarbeiten eine Anfrage. Bestehende Standardeinstellungen werden automatisch aktualisiert. Benutzerdefinierte Engine-Argumente bleiben erhalten.

  fullDescription: |
    Bonsai 2 27B ist ein Modell von Prism ML, das lokal Fragen beantwortet, Code schreibt und Bilder interpretiert. Die komprimierten Modellgewichte reduzieren den Speicherplatzbedarf, während die Fähigkeiten zum logischen Denken und zu Tool-Aufrufen erhalten bleiben.

    **Wichtige Funktionen**

    - Aufgaben bearbeiten, die mehrere Denkschritte erfordern, etwa Programmieren und Problemlösen.
    - In kompatiblen Anwendungen Fragen zu Bildern stellen.
    - Das Modell über kompatible Anwendungen mit Tools verbinden, um weitere Aktionen auszuführen.
    - Das Modell über Model Console herunterladen und verwalten und anschließend über das Olares AI-Gateway oder eine OpenAI-kompatible API darauf zugreifen.

    **Vor der Nutzung**

    Diese App enthält das Modell `PQ2_0` und seine Bildverarbeitungskomponente. Warten Sie vor der Nutzung, bis die Modelldateien vollständig heruntergeladen sind. Bildeingaben und Tool-Aufrufe erfordern einen Client, der diese Funktionen unterstützt.

    Details zum Modell und Hinweise zur Nutzung finden Sie in der [offiziellen Modellkarte](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf).
