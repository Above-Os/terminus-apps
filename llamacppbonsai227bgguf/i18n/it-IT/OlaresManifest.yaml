metadata:
  description: "Un modello IA locale per ragionamento, programmazione, analisi delle immagini e uso di strumenti"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    La modalità GPU Intel integrata non è più disponibile. Il supporto CPU è stato ripristinato ed è stato aggiunto il supporto per le GPU Intel dedicate.

    Per impostazione predefinita, NVIDIA elabora due richieste in parallelo; CPU e GPU Intel dedicata ne elaborano una. Le impostazioni predefinite esistenti vengono aggiornate automaticamente, mentre gli argomenti personalizzati del motore vengono mantenuti.

  fullDescription: |
    Bonsai 2 27B è un modello di Prism ML che viene eseguito localmente per rispondere a domande, scrivere codice e interpretare immagini. I pesi compressi riducono lo spazio necessario per archiviare il modello, mantenendo le capacità di ragionamento e di chiamata agli strumenti.

    **Funzionalità principali**

    - Affrontare attività che richiedono più passaggi di ragionamento, tra cui programmazione e risoluzione di problemi.
    - Porre domande sulle immagini nelle applicazioni compatibili.
    - Collegare il modello a strumenti tramite applicazioni compatibili per eseguire ulteriori azioni.
    - Scaricare e gestire il modello tramite Model Console, quindi accedervi attraverso il gateway IA di Olares o un’API compatibile con OpenAI.

    **Prima dell’uso**

    Questa app include il modello `PQ2_0` e il relativo componente visivo. Attendere che il download dei file del modello sia completato prima dell’uso. L’inserimento di immagini e le chiamate agli strumenti richiedono un client che supporti queste funzionalità.

    Consultare la [scheda ufficiale del modello](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf) per dettagli e indicazioni sull’uso.
