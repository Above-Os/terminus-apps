metadata:
  description: "A local AI model for reasoning, coding, image understanding, and tool use"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    Intel integrated GPU mode is no longer available. CPU support is restored, and Intel discrete GPU support is added.

    NVIDIA handles two requests in parallel by default; CPU and Intel discrete GPU handle one. Existing default settings are updated automatically, while custom engine arguments are preserved.

  fullDescription: |
    Bonsai 2 27B is a model from Prism ML that runs locally to answer questions, write code, and interpret images. Its compressed weights reduce model storage needs while retaining reasoning and tool-calling capabilities.

    **Key features**

    - Work through tasks that require multiple reasoning steps, including coding and problem solving.
    - Ask questions about images in compatible applications.
    - Let compatible applications connect the model to tools for additional actions.
    - Download and manage the model through Model Console, then access it through the Olares AI gateway or an OpenAI-compatible API.

    **Before using**

    This app includes the `PQ2_0` model and its vision component. Wait for the model files to finish downloading before use. Image input and tool calling require a client that supports those features.

    See the [official model card](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf) for model details and usage guidance.
