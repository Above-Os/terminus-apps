metadata:
  description: "Un modelo de IA local para razonamiento, programación, análisis de imágenes y uso de herramientas"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    El modo de GPU Intel integrada ya no está disponible. Se ha restablecido la compatibilidad con CPU y se ha añadido compatibilidad con GPU Intel dedicadas.

    De forma predeterminada, NVIDIA procesa dos solicitudes en paralelo; la CPU y la GPU Intel dedicada procesan una. La configuración predeterminada existente se actualiza automáticamente y se conservan los argumentos personalizados del motor.

  fullDescription: |
    Bonsai 2 27B es un modelo de Prism ML que se ejecuta localmente para responder preguntas, escribir código e interpretar imágenes. Sus pesos comprimidos reducen el espacio necesario para almacenar el modelo, manteniendo las capacidades de razonamiento y de llamada a herramientas.

    **Funciones principales**

    - Abordar tareas que requieren varios pasos de razonamiento, como la programación y la resolución de problemas.
    - Hacer preguntas sobre imágenes en aplicaciones compatibles.
    - Conectar el modelo a herramientas mediante aplicaciones compatibles para realizar acciones adicionales.
    - Descargar y gestionar el modelo mediante Model Console y acceder a él a través de la pasarela de IA de Olares o de una API compatible con OpenAI.

    **Antes de usarlo**

    Esta aplicación incluye el modelo `PQ2_0` y su componente de visión. Espere a que termine la descarga de los archivos del modelo antes de usarlo. La entrada de imágenes y las llamadas a herramientas requieren un cliente compatible con estas funciones.

    Consulte la [ficha oficial del modelo](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf) para obtener más información y orientación sobre su uso.
