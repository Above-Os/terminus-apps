metadata:
  description: "Un modèle d’IA local pour le raisonnement, le code, l’analyse d’images et l’appel d’outils"
  title: Bonsai 2 27B

spec:
  upgradeDescription: |
    v1.0.8: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

    Le mode GPU Intel intégré n’est plus disponible. La prise en charge du CPU est rétablie et celle des GPU Intel dédiés est ajoutée.

    Par défaut, NVIDIA traite deux requêtes en parallèle ; le CPU et le GPU Intel dédié en traitent une. Les paramètres par défaut existants sont mis à jour automatiquement, tandis que les arguments personnalisés du moteur sont conservés.

  fullDescription: |
    Bonsai 2 27B est un modèle de Prism ML qui fonctionne localement pour répondre aux questions, écrire du code et interpréter des images. Ses poids compressés réduisent l’espace de stockage nécessaire tout en préservant ses capacités de raisonnement et d’appel d’outils.

    **Principales fonctionnalités**

    - Traiter des tâches nécessitant plusieurs étapes de raisonnement, notamment la programmation et la résolution de problèmes.
    - Poser des questions sur des images dans des applications compatibles.
    - Connecter le modèle à des outils via des applications compatibles pour effectuer des actions supplémentaires.
    - Télécharger et gérer le modèle dans Model Console, puis y accéder via la passerelle IA Olares ou une API compatible avec OpenAI.

    **Avant utilisation**

    Cette application inclut le modèle `PQ2_0` et son composant de vision. Attendez la fin du téléchargement des fichiers du modèle avant de l’utiliser. L’entrée d’images et l’appel d’outils nécessitent un client prenant en charge ces fonctionnalités.

    Consultez la [fiche officielle du modèle](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf) pour connaître les détails du modèle et les conseils d’utilisation.
