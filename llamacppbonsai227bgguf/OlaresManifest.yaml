#   llamacppbonsai227bgguf — engine Deployment (== appid / Release.Name)
#   llminit                — llm-init / entrance Deployment
workloadReplicas:
  llamacppbonsai227bgguf: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0'
  upgradeDescription: |
    NVIDIA mode now requires 23Gi of GPU memory and provides two parallel request slots by default, up from one. CPU mode continues to use one slot.

    Existing default settings are updated automatically. Custom engine arguments are preserved.

  fullDescription: |
    Bonsai 2 27B is a model from Prism ML for answering questions, writing code, and working with images. It uses compressed model weights to run locally and supports reasoning and tool calling.

    **Key features**

    - Ask questions about text and images in compatible chat applications.
    - Use reasoning for tasks that require multiple steps, including coding and problem solving.
    - Connect applications that support tool calling so the model can request actions from their tools.
    - Download and manage the model through Model Console, and access it through the Olares AI gateway or an OpenAI-compatible API.

    **Before installing**

    This app provides the `PQ2_0` model with its vision component. It supports NVIDIA GPU and CPU modes on `amd64` systems. Integrated GPU acceleration and DGX Spark are not supported by this app.

    Model files must finish downloading before the model is ready to use. Image input and tool calling require a client that supports those features.

    See the [official model card](https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf) for model details and usage guidance.

  developer: Prism ML
  website: https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf
  sourceCode: https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf
  doc: https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: Apache-2.0
      url: https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/blob/main/LICENSE

  accelerator:
    #   nvidia — discrete GPU; LLAMACPP_REQUIRED_GPU_MEMORY -> gpumem
    - mode: nvidia
      limitedCpu: "15360m"
      requiredCpu: "1100m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      # Host memory also accounts for UVM pages spilled by mode-2 eviction
      # and the GGUF page cache.
      # Engine MEMORY_REQUEST 4Gi + llm-init 256Mi <= requiredMemory 5Gi;
      # MEMORY_LIMIT 24Gi + llm-init 2Gi <= limitedMemory 26Gi.
      limitedMemory: "26Gi"
      requiredMemory: "5Gi"
      requiredGPUMemory: "23Gi"
      limitedGPUMemory: "23Gi"
    #   cpu — no accelerator: the ubuntu-x64 build, for a host with no NVIDIA
    #   card. No GPU-memory field (there is no device), and the CPU is the
    #   compute rather than just the driver, so the core budget is larger.
    - mode: cpu
      # Engine cpu 2 -> 8 plus llm-init 200m -> 1 fits 2200m / 9216m.
      limitedCpu: "9216m"
      requiredCpu: "2200m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      # Engine MEMORY_REQUEST 16Gi + llm-init 256Mi <= requiredMemory 17Gi;
      # engine limit 20Gi + llm-init 2Gi <= limitedMemory 22Gi.
      # Reserve weights and 128K f16 K/V, with additional buffer headroom in the limit.
      limitedMemory: "22Gi"
      requiredMemory: "17Gi"

  supportArch:
    - amd64
permission:
  appCache: true
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  # Model is preset for this app; these values are fixed and not user-editable.
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://prism-ml/Ternary-Bonsai-2-27B-gguf --include Ternary-Bonsai-2-27B-PQ2_0.gguf,hf://prism-ml/Ternary-Bonsai-2-27B-gguf --include Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"
    description:  "Example: hf://unsloth/Qwen3-0.6B-GGUF --include Qwen3-0.6B-Q4_K_M.gguf. The source to download your model. For models with split files, only include the first part; for vision-language models, add the projector with a comma, like `hf://<repo> --include model.gguf,hf://<repo> --include mmproj-F16.gguf`."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0"
    description:  "Example: unsloth/Qwen3-0.6B-GGUF:Q4_K_M. The name of your model in `owner/repo:quant` format"
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "thinking,tools,vision"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description:  "The model capabilities. Pick what your model supports, if no extra capabilities, pick None."
  # Not editable: which levels exist is a fact of this model and this chat
  # template, not a preference. The template raises on anything outside
  # low / medium / xhigh, so an extra level would turn into a failed
  # request for whichever client read the levels off the model card.
  - envName: MODEL_REASONING_EFFORT
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "low,medium,xhigh"
    description:  "The reasoning_effort levels this model accepts, published on the model card so clients can read them instead of guessing."
  # The level llama.cpp's template already uses when a request carries no
  # reasoning_effort. It is published, never injected: nothing in the chain
  # writes it into a request, so it has to match the engine's real default.
  - envName: MODEL_REASONING_EFFORT_DEFAULT
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "medium"
    description:  "The level this model uses when a request does not ask for one."
  # `-fa on` is required by the ternary kernels (Hadamard activation transforms).
  # NVIDIA uses two slots without --kv-unified; CPU retains one slot and --kv-unified.
  # No --spec-type draft-mtp: this ternary re-architecture has no MTP head.
  - envName: ENGINE_ARGS
    required: true
    default: "-c 131072 -ngl all -fa on --jinja -np 2 -ctk q8_0 -ctv q8_0 -b 512 -ub 128"
    type: string
    editable: true
    applyOnChange: true
    description:  "Example: -c 8192 -ngl all -fa on. Extra llama.cpp options, to fully use GPU, add `-ngl all`. You can also use values like `LLAMA_ARG_*=val`."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: LLAMACPP_CPU_REQUEST
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_REQUEST
    required: true
    default: "4Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_CPU_LIMIT
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_LIMIT
    required: true
    default: "24Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "23Gi"
    description:  "Example: `8Gi`, `8192`, or `8192Mi`. GPU memory required for the model. On NVIDIA this sets `nvidia.com/gpumem` in MiB."
    regex: "^[0-9]+(Gi|Mi)?$"
