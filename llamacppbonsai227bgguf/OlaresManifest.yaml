  name: llamacppbonsai227bgguf
  icon: https://raw.githubusercontent.com/Above-Os/terminus-apps/2f3e60bfe6bb36bb0fa542d141b08a0850672aaa/llamacppbonsai227bgguf/assets/icon.png
  description: "A local AI model for reasoning, coding, tool use, and questions about images"
  appid: llamacppbonsai227bgguf
  title: Bonsai 2 27B
  version: '1.0.7'
  categories:
    - AI
    - models
  tags:
    - llm
sharedEntrances:
  - name: llamacppbonsai227bgguf
    host: sharedentrances-api
    port: 0
    title: Bonsai 2 27B
    invisible: true
    authLevel: internal
    icon: https://raw.githubusercontent.com/Above-Os/terminus-apps/2f3e60bfe6bb36bb0fa542d141b08a0850672aaa/llamacppbonsai227bgguf/assets/icon.png
