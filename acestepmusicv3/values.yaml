# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   acestepmusicv3        — nginx entrance Deployment (must match metadata.name / appid)
#   acestepserver      — ACE-Step 1.5 staged API engine Deployment
#   acestepdownloader  — llm-init download-only model fetcher
workloads:
  acestepdownloader:
    replicaCount: 1
  acestepserver:
    replicaCount: 1
  acestepmusicv3:
    replicaCount: 1
