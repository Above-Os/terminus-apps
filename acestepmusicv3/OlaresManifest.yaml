olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: acestepmusicv3
  description: ACE-Step 1.5 XL and 4B LM API with staged GPU memory release
  icon: https://app.cdn.olares.com/appstore/acestep/icon2.png
  appid: acestepmusicv3
  version: '0.1.7'
  title: ACE-Step Music 4B (Staged)
  categories:
  - Creativity
  - AI
  - models
  tags:
  - text-to-audio

entrances:
  - name: modelconsole
    port: 8080
    host: acestep-web-svc
    title: ACE-Step Music API
    icon: https://app.cdn.olares.com/appstore/acestep/icon2.png
    authLevel: internal
    openMethod: window
  - name: musicapi
    port: 8001
    host: acestep-svc
    title: ACE-Step Music API
    icon: https://app.cdn.olares.com/appstore/acestep/icon2.png
    authLevel: internal
    invisible: true

# Declares every workload's replica count (v3 schema). Keys MUST match the
# rendered Deployment metadata.name and values.yaml workloads.<name>:
#   acestepmusicv3        — nginx entrance Deployment (must match metadata.name / appid)
#   acestepserver      — ACE-Step 1.5 staged API engine Deployment
#   acestepdownloader  — llm-init download-only model fetcher
workloadReplicas:
  acestepmusicv3: 1
  acestepserver: 1
  acestepdownloader: 1

permission:
  appData: true
  appCache: true   # llm-init sentinel/run-state under appCache/llm-init-run/<release>
  # ACE-Step HF models live in the shared cross-app App Common store
  # (appCommon/huggingface, mounted at the fixed /cache/hf/hub container path).
  appCommon: true

spec:
  versionName: '0.1.8'
  featuredImage: https://app.cdn.olares.com/appstore/acestep/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/acestep/1.webp
    - https://app.cdn.olares.com/appstore/acestep/2.webp
    - https://app.cdn.olares.com/appstore/acestep/3.webp

  fullDescription: |
    Experimental Olares model application for ACE-Step 1.5 on a single 24 GiB
    NVIDIA GPU. It serves the official asynchronous API with the XL-SFT 4B DiT
    and 5Hz 4B language model. The runtime serializes jobs and unloads the
    language model before diffusion so four-minute generation has enough GPU
    headroom. Models are downloaded once into Olares App Common storage; audio
    and API temporary files persist in App Data.

    This build is intended for deployment validation. The public contract is the
    ACE-Step API (`/health`, `/release_task`, `/query_result`, `/v1/audio`).
    A future Music Studio application can call it through Router `/v1/music`.

  developer: ace-step
  website: https://acemusic.ai/
  sourceCode: https://github.com/ace-step/ACE-Step-1.5
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://github.com/ace-step/ACE-Step-1.5
  license:
    - text: MIT License
      url: https://github.com/ace-step/ACE-Step-1.5?tab=MIT-1-ov-file

  accelerator:
  # nvidia — discrete GPU; GPU memory via nvidia.com/gpumem. amd64 only.
  - mode: nvidia
    requiredCpu: "2"
    limitedCpu: "12"
    requiredMemory: 32Gi
    limitedMemory: 72Gi
    requiredDisk: 36Gi
    limitedDisk: 100Gi
    requiredGPUMemory: 20Gi
    limitedGPUMemory: 24Gi

  supportArch:
    - amd64
  onlyAdmin: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: true
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE

options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
