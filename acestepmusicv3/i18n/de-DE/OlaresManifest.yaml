metadata:
  title: Music Studio
  description: "Ein KI-Musikstudio für Songs aus Ideen und Songtexten"

spec:
  upgradeDescription: |
    v0.1.77: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    Music Studio verwandelt Ihre Ideen und Songtexte in Songs mit Gesang oder Instrumentalmusik. Erstellen Sie Musik mit ACE-Step XL-SFT, überarbeiten Sie ausgewählte Abschnitte und speichern Sie fertige Titel in Ihrer Bibliothek.

    **Hauptfunktionen**

    - Songtexte und Musikbeschreibungen aus einer kurzen Idee entwerfen.
    - Musikstil, Tempo, Tonart und Gesangssprache festlegen.
    - Einen ausgewählten Abschnitt eines Titels neu generieren.
    - Synchronisierte Songtexte für unterstützte Titel mit Gesang anzeigen.
    - Fertige Titel in der Bibliothek abspielen, herunterladen und organisieren.

    Bei der ersten Nutzung lädt Music Studio die erforderlichen Modelle mit einem Gesamtumfang von etwa 30 GB herunter. Sie können den Download- und Ladefortschritt auf dem Bildschirm verfolgen. Sobald die Modelle bereit sind, öffnet sich die Erstellungsansicht automatisch.

    Erfordert Olares 1.12.7 oder neuer und ein amd64-System mit einer NVIDIA-GPU mit 24 GiB Speicher.
