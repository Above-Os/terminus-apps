metadata:
  title: ACE-Step Music 4B (Staged)
  description: ACE-Step 1.5 XL and 4B LM API with staged GPU memory release
spec:
  fullDescription: |
    Validation build for a single 24 GiB NVIDIA GPU. It runs the official
    ACE-Step asynchronous API with XL-SFT quality, XL-Turbo fast mode, and the 5Hz 4B language model.
    Jobs are serialized and the LM is unloaded before diffusion, preserving GPU
    headroom for long-form generation up to the model's 600-second limit.
