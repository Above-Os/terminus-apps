apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: wordcraft
  appid: wordcraft
  title: WordCraft
  description: Word-style word processor that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/wordcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.wordcraft.png
  version: 0.1.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/WordCraft/
spec:
  versionName: "0.7.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    WordCraft is an open-source, Word-comparable word processor written in
    Rust. This app serves its WebAssembly build: editing runs entirely in
    your browser, and documents never leave your device. It opens and saves
    DOCX, ODT, RTF, HTML, Markdown and plain text, and exports PDF.

    Open uses the browser file picker; Save and Export download files.
    The browser keeps no copy of your documents, so save your work before
    closing or reloading the page.

    ## Agent access (MCP)
    The app also runs WordCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    create, edit, convert and export documents, and read and write files only
    in Home/WordCraft. To keep editing an agent's result in the browser, open
    it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/wordcraft
  sourceCode: https://github.com/beclab/wordcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/wordcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "3"
  requiredMemory: 256Mi
  limitedMemory: 2560Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: wordcraft
    host: wordcraft-svc
    port: 8080
    title: WordCraft
    icon: https://raw.githubusercontent.com/beclab/wordcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.wordcraft.png
    authLevel: private
    openMethod: window
  - name: wordcraftmcp
    host: wordcraft-svc
    port: 8090
    title: WordCraft MCP
    icon: https://raw.githubusercontent.com/beclab/wordcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.wordcraft.png
    authLevel: internal
    invisible: true
options:
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  wordcraft: 1
