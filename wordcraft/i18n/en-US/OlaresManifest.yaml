metadata:
  title: WordCraft
  description: Word-style word processor that runs in your browser
spec:
  fullDescription: |
    ## Overview
    WordCraft is an open-source, Word-comparable word processor written in
    Rust. This app serves its WebAssembly build: editing runs entirely in
    your browser, and documents never leave your device. It opens and saves
    DOCX, ODT, RTF, HTML, Markdown and plain text, and exports PDF.

    Open uses the browser file picker; Save and Export download files.
    The browser keeps no copy of your documents, so save your work before
    closing or reloading the page.

    ## Agent access (MCP)
    The app also runs WordCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    create, edit, convert and export documents, and read and write files only
    in Home/WordCraft. To keep editing an agent's result in the browser, open
    it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  upgradeDescription: |
    Fixes Chinese interface text showing as boxes: with a Simplified Chinese
    browser language, the app loads a Chinese font at startup. Documents
    exported by the agent now include Chinese, Japanese and Arabic fonts.
