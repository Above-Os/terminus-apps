metadata:
  title: WordCraft
  description: 在浏览器中运行的 Word 风格文字处理软件
spec:
  fullDescription: |
    ## 概述
    WordCraft 是一款用 Rust 编写的开源文字处理软件，目标是对标 Word。
    本应用提供它的 WebAssembly 版本：所有编辑都在你的浏览器里完成，
    文档不会离开你的设备。支持打开和保存 DOCX、ODT、RTF、HTML、Markdown
    和纯文本，并可导出 PDF。

    打开文件使用浏览器的文件选择框，保存和导出会下载文件。
    浏览器不会保留文档副本，关闭或刷新页面前请先保存。

    ## Agent 接入（MCP）
    本应用还以 Streamable HTTP 方式运行 WordCraft 的无界面引擎，作为 MCP 服务。
    它的入口不显示在桌面上，可以在设置里找到，只能从局域网或 LarePass VPN 访问。
    Agent 可以创建、编辑、转换和导出文档，只能读写 Home/WordCraft 目录。
    想在浏览器里继续编辑 agent 生成的结果，请用浏览器的文件选择框从 Files 打开。

    ## 要求
    - 支持 WebGPU 或 WebGL2 的浏览器
    - 架构：amd64、arm64
