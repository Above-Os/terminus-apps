metadata:
  title: MinIO Dashboard
  description: MinIO-Dashboard zur Verwaltung von MinIO-Daten
spec:
  fullDescription: |
    MinIO Dashboard ist ein quelloffenes, plattformübergreifendes Kommandozeilen-Dienstprogramm, das als Client für MinIO Server dient.
    Es bietet umfangreiche Funktionen für Dateioperationen, Bucket-Verwaltung und administrative Aufgaben auf Objektspeichersystemen.
