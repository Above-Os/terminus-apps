metadata:
  title: MinIO Dashboard
  description: Tableau de bord MinIO pour gérer les données MinIO
spec:
  fullDescription: |
    MinIO Dashboard est un utilitaire en ligne de commande open source et multiplateforme qui sert de client pour MinIO Server.
    Il offre un riche ensemble de fonctionnalités pour les opérations sur les fichiers, la gestion des buckets et les tâches administratives sur les systèmes de stockage d'objets.
