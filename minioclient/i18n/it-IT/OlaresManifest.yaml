metadata:
  title: MinIO Dashboard
  description: Dashboard MinIO per gestire i dati MinIO
spec:
  fullDescription: |
    MinIO Dashboard è un'utilità a riga di comando open source e multipiattaforma che funge da client per MinIO Server.
    Offre un ricco set di funzionalità per operazioni sui file, gestione dei bucket e attività amministrative sui sistemi di object storage.
