metadata:
  title: MinIO Dashboard
  description: Panel de MinIO para operar datos de MinIO
spec:
  fullDescription: |
    MinIO Dashboard es una utilidad de línea de comandos de código abierto y multiplataforma que sirve como cliente de MinIO Server.
    Ofrece un rico conjunto de funciones para operaciones de archivos, gestión de buckets y tareas administrativas en sistemas de almacenamiento de objetos.
