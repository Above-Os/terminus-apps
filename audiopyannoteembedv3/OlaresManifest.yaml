olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiopyannoteembedv3
  icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
  description: "Pyannote speaker embedding / voiceprint (review submission)."
  appid: audiopyannoteembedv3
  title: Pyannote Embedding
  version: '1.0.0'
  categories:
    - AI
# sharedEntrances stub: http://sharedentrances-api.<ns>:80/v1 (in-cluster).
sharedEntrances:
  - name: audiopyannoteembedv3api
    host: sharedentrances-api
    port: 0
    title: Pyannote Embedding API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
# Entrance -> llm-init:8090 (dashboard + /v1/* proxy); authLevel internal.
entrances:
  - name: audiopyannoteembedv3
    port: 8090
    host: download-svc
    title: Pyannote Embedding
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiopyannoteembedv3: 1
  llminit: 1
spec:
  versionName: 'pyannote-embedding'
  fullDescription: |
    **Model Overview**
    Pyannote speaker embedding / voiceprint (review submission).

    **Preset Configuration**
    - Model: `pyannote-embedding`
    - Source: `hf://pyannote/embedding`
    - Capabilities: `speaker_embed`
    - Required GPU memory: `0` (CPU-only)
    - Engine: Pyannote speaker embedding

    **How It Works**
    First, Model Console (llm-init) downloads the model and gets it ready, then the
    audio engine starts serving when the download sentinel appears. llm-init reverse-proxies
    `/v1/*` to the engine and serves its control plane / dashboard on `/`.

    **Stack**
    - **audio engine**: Pyannote speaker embedding (port 8000); self-reports `/v1/models` + `/metrics`
    - **Model Console (llm-init)**: Downloads the model, shows progress, OpenAI API on 8090

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`.

  upgradeDescription: |
    v1.0.0: initial direct-install preset (public entrance, fixed model env defaults).

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/audio-engines
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/llm-init

  accelerator:
    # accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "3"
      requiredCpu: "400m"
      requiredDisk: 50Mi
      limitedDisk: 20Gi
      limitedMemory: "6Gi"
      requiredMemory: "768Mi"
      requiredGPUMemory: "0"
      limitedGPUMemory: "0"
    - mode: nvidia-gb10
      limitedCpu: "3"
      requiredCpu: "400m"
      requiredDisk: 50Mi
      limitedDisk: 20Gi
      limitedMemory: "6Gi"
      requiredMemory: "768Mi"

  supportArch:



    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://pyannote/embedding"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "pyannote-embedding"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "speaker_embed"
    multiSelect: true
    splitter: ","
    options:
    - title: Speaker embedding (voiceprint)
      value: speaker_embed
    description: "Capabilities this preset exposes (locked for this model app)."
  - envName: AUDIO_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "0"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: AUDIO_CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "200m"
  - envName: AUDIO_MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "512Mi"
  - envName: AUDIO_CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2"
  - envName: AUDIO_MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
