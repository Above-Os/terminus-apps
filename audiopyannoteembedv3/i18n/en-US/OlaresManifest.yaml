metadata:
  description: "Pyannote speaker embedding / voiceprint."
  title: Pyannote Embedding

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    Pyannote speaker embedding / voiceprint.

    **Configuration**
    - Model: `pyannote/embedding`
    - Source: `hf://beclab/embedding`
    - Capabilities: `speaker_embed`
    - Compute: CPU-only (`0` GPU memory)
    - Engine: Pyannote speaker embedding

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
