metadata:
  description: アプリで比較できる話者の音声表現を作成するモデル
  title: Pyannote Embedding

spec:
  upgradeDescription: |
    v1.0.21: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    Pyannote Embeddingは、音声サンプルを話者の声を表すコンパクトな数値データに変換します。アプリはこのデータを比較して、複数のサンプルが同じ話者のものかを推定できますが、個人名の特定は行いません。

    **主な機能**
    - 音声サンプルから話者埋め込みを作成します。
    - 音声サンプル間の話者類似度を比較します。
    - 話者ダイアライゼーションや音声分析での話者照合を支援します。
    - GPUを必要とせずCPUで実行します。
