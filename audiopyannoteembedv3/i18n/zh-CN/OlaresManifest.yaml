metadata:
  description: "Pyannote speaker embedding / voiceprint."
  title: Pyannote Embedding

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Pyannote speaker embedding / voiceprint.

    **配置**
    - 模型：`pyannote-embedding`
    - 来源：`hf://beclab/embedding`
    - 能力：`speaker_embed`
    - GPU 显存：`2Gi`
    - 引擎：Pyannote speaker embedding

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
