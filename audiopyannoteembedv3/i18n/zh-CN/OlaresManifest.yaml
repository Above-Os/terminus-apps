metadata:
  description: 用于创建可比较声纹表示的模型
  title: Pyannote Embedding

spec:
  upgradeDescription: |
    v1.0.21: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    Pyannote Embedding 可将语音样本转换为说话人声音的紧凑数值表示。应用可以比较这些表示，估计不同样本是否来自同一位说话人；该模型不会识别真实身份。

    **主要功能**
    - 根据语音样本创建说话人嵌入。
    - 比较语音样本的说话人相似度。
    - 支持说话人分离和音频分析中的说话人匹配。
    - 使用 CPU 运行，无需 GPU。
