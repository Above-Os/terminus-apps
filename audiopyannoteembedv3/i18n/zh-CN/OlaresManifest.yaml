metadata:
  description: "Pyannote 说话人嵌入与声纹模型。"
  title: Pyannote Embedding

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Pyannote 说话人嵌入与声纹模型。

    **配置**
    - 模型：`pyannote/embedding`
    - 来源：`hf://beclab/embedding`
    - 能力：`speaker_embed`
    - 计算模式：仅 CPU（GPU 显存为 `0`）
    - 引擎：Pyannote 说话人嵌入

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
