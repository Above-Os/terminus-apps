metadata:
  title: Palworld
  description: Servidor dedicado de Palworld.
spec:
  fullDescription: |
    Un servidor dedicado de Palworld. No hay interfaz web: abre el terminal de consola desde el escritorio. Los jugadores se conectan con el cliente oficial de Palworld seleccionando Unirse a partida multijugador e introduciendo manualmente la dirección del servidor (`IP:8211`).

    Clientes que permiten la conexión manual: Steam en Windows y Mac (Linux/Steam Deck mediante Proton). Xbox, PS5 y la versión de PC Game Pass (Microsoft Store) no pueden conectarse a este servidor: esos clientes no tienen campo IP y aquí la búsqueda de servidores comunitarios está desactivada.

    El primer inicio descarga el servidor dedicado oficial mediante SteamCMD (varios GB; puede tardar). Los datos del mundo se guardan en el directorio de datos de esta aplicación. No necesitas tener Palworld para alojar el servidor; los jugadores que se conecten sí deben tener el juego.

    En la misma LAN, abre Ajustes → Red → Puerta de enlace Overlay, activa la puerta de enlace y habilita Overlay para esta aplicación. Después conéctate mediante la IP LAN y el puerto que aparecen allí (UDP 8211).

    Para conectarse por VPN cuando los jugadores no están en la misma red, usa `<olares-id>.olares.com:8211` (por ejemplo, olarestest001.olares.com:8211). Primero desactiva Overlay para esta aplicación: Overlay y VPN no pueden usarse juntos en Palworld. El listado comunitario está desactivado.
  upgradeDescription: |
    Fija el pod del servidor de juego al plano de control (master) mediante nodeAffinity para el acceso LAN de la puerta de enlace Overlay.
