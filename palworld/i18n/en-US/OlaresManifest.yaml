metadata:
  title: Palworld
  description: Palworld dedicated server.
spec:
  fullDescription: |
    A Palworld dedicated server. There is no web UI — open the console terminal from the desktop, and join from the official Palworld client on Steam (Windows).

    First start downloads the official dedicated server via SteamCMD (several GB, can take a while). World data is stored in this app's data directory. Hosting the server does not require owning Palworld; players who join must own the game.

    To connect, open Settings → Network → Overlay gateway, turn on the gateway and enable Overlay for this app. Note the LAN IP address and port shown there (UDP 8211), then join from the official Palworld client using `<ip>:8211`. Community listing is off.

  upgradeDescription: |
    Wire overlay gateway LAN access (macvlan-init, overlayGateway entrance for UDP 8211). Drop Tailscale ACL and external query port 27015. Update join instructions for Settings → Network → Overlay gateway.
