metadata:
  title: Palworld
  description: Serveur dédié Palworld
spec:
  fullDescription: |
    Un serveur dédié Palworld. Il n’y a pas d’interface Web : ouvrez le terminal de la console depuis le bureau. Les joueurs se connectent avec le client officiel Palworld en choisissant Rejoindre une partie multijoueur et en saisissant manuellement l’adresse du serveur (`IP:8211`).

    Clients permettant la connexion manuelle : Steam sous Windows et Mac (Linux/Steam Deck via Proton). Xbox, PS5 et la version PC Game Pass (Microsoft Store) ne peuvent pas rejoindre ce serveur : ces clients n’ont pas de champ IP et la recherche des serveurs communautaires est désactivée ici.

    Au premier démarrage, le serveur dédié officiel est téléchargé via SteamCMD (plusieurs Go, cela peut prendre du temps). Les données du monde sont stockées dans le répertoire de données de cette application. Il n’est pas nécessaire de posséder Palworld pour héberger le serveur ; les joueurs qui le rejoignent doivent posséder le jeu.

    Sur le même LAN, ouvrez Paramètres → Réseau → Passerelle Overlay, activez la passerelle et Overlay pour cette application, puis connectez-vous avec l’adresse IP LAN et le port affichés (UDP 8211).

    Pour se connecter via VPN lorsque les joueurs ne sont pas sur le même réseau, utilisez `<olares-id>.olares.com:8211` (par exemple olarestest001.olares.com:8211). Désactivez d’abord Overlay pour cette application : Overlay et VPN ne peuvent pas être utilisés ensemble avec Palworld. Le référencement communautaire est désactivé.
  upgradeDescription: |
    Épinglage du pod du serveur de jeu au plan de contrôle (master) via nodeAffinity pour l’accès LAN de la passerelle Overlay.
