metadata:
  title: Palworld
  description: Server dedicato Palworld
spec:
  fullDescription: |
    Un server dedicato Palworld. Non è presente un'interfaccia web: apri il terminale della console dal desktop. I giocatori si collegano con il client ufficiale Palworld selezionando Partecipa a partita multigiocatore e inserendo manualmente l'indirizzo del server (`IP:8211`).

    Client che supportano l'accesso manuale: Steam su Windows e Mac (Linux/Steam Deck tramite Proton). Xbox, PS5 e la versione PC Game Pass (Microsoft Store) non possono accedere a questo server: questi client non dispongono di un campo IP e qui la ricerca dei server della community è disattivata.

    Al primo avvio viene scaricato il server dedicato ufficiale tramite SteamCMD (diversi GB, potrebbe richiedere tempo). I dati del mondo sono archiviati nella directory dati dell'app. Per ospitare il server non è necessario possedere Palworld; i giocatori che si collegano devono possedere il gioco.

    Sulla stessa LAN, apri Impostazioni → Rete → Gateway Overlay, attiva il gateway e abilita Overlay per questa app, quindi collegati usando l'IP LAN e la porta mostrati (UDP 8211).

    Per collegarsi tramite VPN quando i giocatori non sono sulla stessa rete, usa `<olares-id>.olares.com:8211` (ad esempio olarestest001.olares.com:8211). Prima disattiva Overlay per questa app: Overlay e VPN non possono essere usati insieme su Palworld. L'elenco della community è disattivato.
  upgradeDescription: |
    Vincola il pod del server di gioco al control-plane (master) tramite nodeAffinity per l'accesso LAN del gateway Overlay.
