metadata:
  title: Palworld
  description: Dedizierter Palworld-Server
spec:
  fullDescription: |
    Ein dedizierter Palworld-Server. Es gibt keine Weboberfläche – öffnen Sie das Konsolenterminal vom Desktop aus. Spieler treten mit dem offiziellen Palworld-Client bei, indem sie „Mehrspieler-Spiel beitreten“ wählen und die Serveradresse manuell eingeben (`IP:8211`).

    Clients mit manueller Beitrittsfunktion: Steam unter Windows und Mac (Linux/Steam Deck über Proton). Xbox, PS5 und die PC Game Pass-Version (Microsoft Store) können diesem Server nicht beitreten – diese Clients haben kein IP-Feld und die Suche nach Community-Servern ist hier deaktiviert.

    Beim ersten Start wird der offizielle dedizierte Server über SteamCMD heruntergeladen (mehrere GB, kann eine Weile dauern). Weltdaten werden im Datenverzeichnis dieser App gespeichert. Zum Hosten des Servers muss Palworld nicht erworben werden; beitretende Spieler müssen das Spiel besitzen.

    Öffnen Sie im selben LAN Einstellungen → Netzwerk → Overlay-Gateway, aktivieren Sie das Gateway und Overlay für diese App. Treten Sie dann über die dort angezeigte LAN-IP und den Port bei (UDP 8211).

    Für den Beitritt über VPN, wenn sich Spieler nicht im selben Netzwerk befinden, verwenden Sie `<olares-id>.olares.com:8211` (zum Beispiel olarestest001.olares.com:8211). Deaktivieren Sie zuerst Overlay für diese App – Overlay und VPN können bei Palworld nicht gleichzeitig verwendet werden. Die Community-Auflistung ist deaktiviert.
  upgradeDescription: |
    Den Gameserver-Pod mittels nodeAffinity für den LAN-Zugriff über das Overlay-Gateway an die Control Plane (Master) binden.
