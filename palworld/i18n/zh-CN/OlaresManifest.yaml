metadata:
  title: Palworld
  description: Palworld 专用服务器。
spec:
  fullDescription: |
    Palworld 专用服务器。没有网页界面——从桌面打开控制台终端，用 Steam 上的官方 Windows 客户端加入。

    首次启动会通过 SteamCMD 下载官方服务端（数 GB，可能较久）。存档保存在本应用的数据目录。托管服务器不需要购买 Palworld；进服的玩家需要正版。

    连接方式：打开「设置 → 网络 → Overlay 网关」，开启网关并为本应用打开 Overlay，记下页面显示的局域网 IP 与端口（UDP 8211），在官方 Palworld 客户端填 `<ip>:8211` 进服。未开启社区列表。

  upgradeDescription: |
    接入 Overlay 网关局域网暴露（macvlan-init、UDP 8211 overlayGateway 入口），去掉 Tailscale ACL 与对外 27015 query 口，更新为在「设置 → 网络 → Overlay 网关」查看 IP 与端口后进服。
