metadata:
  title: Palworld
  description: Palworld 专用服务器。
spec:
  fullDescription: |
    Palworld 专用服务器。没有网页界面——从桌面打开控制台终端，用 Steam 上的官方 Windows 客户端加入。

    首次启动会通过 SteamCMD 下载官方服务端（数 GB，可能较久）。存档保存在本应用的数据目录。托管服务器不需要购买 Palworld；进服的玩家需要正版。

    同一局域网内：打开「设置 → 网络 → Overlay 网关」，开启网关并为本应用打开 Overlay，使用页面显示的局域网 IP 与端口（UDP 8211）进服。

    通过 VPN 进服（玩家不在同一网络时）请填 `<olares-id>.olares.com:8211`（例如 olarestest001.olares.com:8211），需先关闭本应用的 Overlay——帕鲁服不能同时使用 Overlay 与 VPN。未开启社区列表。

  upgradeDescription: |
    补充 VPN 地址 `<olares-id>.olares.com:8211` 及需先关闭 Overlay 的说明。
