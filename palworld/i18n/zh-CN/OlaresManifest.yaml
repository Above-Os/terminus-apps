metadata:
  title: Palworld
  description: Palworld 专用服务器。
spec:
  fullDescription: |
    Palworld 专用服务器。没有网页界面——从桌面打开控制台终端，用 Steam 上的官方 Windows 客户端加入。

    首次启动会通过 SteamCMD 下载官方服务端（数 GB，可能较久）。存档保存在本应用的数据目录。托管服务器不需要购买 Palworld；进服的玩家需要正版。

    使用官方 Palworld 客户端连接。地址填应用三级域名加 UDP 端口 8211（例如 palworld.<olares-id>.olares.com:8211），同一局域网也可用 Olares 节点 IP。未开启社区列表。

  upgradeDescription: |
    增加 Market 图标和实机游戏宣传图。
