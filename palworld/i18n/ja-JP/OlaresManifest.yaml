metadata:
  title: Palworld
  description: Palworld 専用サーバー。
spec:
  fullDescription: |
    Palworld 専用サーバーです。Web UI はありません。デスクトップからコンソールターミナルを開いてください。プレイヤーは公式 Palworld クライアントで「マルチプレイヤーゲームに参加」を選び、サーバーアドレス（`IP:8211`）を手動入力して参加します。

    手動参加に対応するクライアント: Windows および Mac の Steam（Linux/Steam Deck は Proton 経由）。Xbox、PS5、PC Game Pass（Microsoft Store）版はこのサーバーに参加できません。これらのクライアントには IP 入力欄がなく、ここではコミュニティサーバー閲覧が無効になっています。

    初回起動時に SteamCMD から公式専用サーバーをダウンロードします（数 GB のため時間がかかる場合があります）。ワールドデータはこのアプリのデータディレクトリに保存されます。サーバーのホストに Palworld の所有は不要ですが、参加するプレイヤーはゲームを所有している必要があります。

    同じ LAN 内では、設定 → ネットワーク → Overlay ゲートウェイを開き、ゲートウェイをオンにしてこのアプリの Overlay を有効にします。そこに表示される LAN IP とポート（UDP 8211）を使って参加してください。

    プレイヤーが同じネットワークにいない場合に VPN 経由で参加するには、`<olares-id>.olares.com:8211`（例: olarestest001.olares.com:8211）を使用します。先にこのアプリの Overlay をオフにしてください。Palworld では Overlay と VPN を同時に使用できません。コミュニティ一覧は無効です。
  upgradeDescription: |
    Overlay ゲートウェイの LAN アクセス用に、nodeAffinity でゲームサーバー pod を control-plane（master）へ固定。
