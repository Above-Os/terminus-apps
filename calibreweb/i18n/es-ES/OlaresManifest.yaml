metadata:
  title: Calibre-Web
  description: App web para explorar, leer y descargar eBooks almacenados en una base de datos Calibre
spec:
  fullDescription: |
    Calibre-Web es una app web que ofrece una interfaz limpia e intuitiva para explorar, leer y descargar eBooks usando una base de datos Calibre válida.

    **Credenciales por defecto**
    Usuario: admin
    Contraseña: admin123
    Por favor, cambia el usuario y la contraseña lo antes posible.

    **Funciones**
    - Interfaz HTML5 Bootstrap 3 moderna y responsive
    - Configuración gráfica completa
    - Gestión integral de usuarios con permisos granulares por usuario
    - Interfaz de administración
    - Interfaz de usuario multilingüe con soporte para más de 20 idiomas (idiomas admitidos)
    - Feed OPDS para apps de lectura de eBooks
    - Opciones avanzadas de búsqueda y filtrado
    - Creación de colecciones de libros personalizadas (estantes)
    - Edición y eliminación de metadatos de eBooks
    - Descarga de metadatos desde varias fuentes (extensible mediante plugins)
    - Conversión de eBooks mediante binarios de Calibre
    - Restricción de descarga de eBooks a usuarios conectados
    - Soporte de registro público de usuarios
    - Enviar eBooks a eReaders con un solo clic
    - Sincronizar dispositivos Kobo con tu biblioteca Calibre
    - Lectura de eBooks en el navegador para múltiples formatos
    - Subida de nuevos libros en varios formatos, incluidos formatos de audio
    - Soporte de Custom Columns de Calibre
    - Ocultación de contenido según categorías y contenido de Custom Column por usuario
    - Capacidad de autoactualización
    - Login por "Magic Link" para acceso fácil en eReaders
    - Soporte de autenticación LDAP, Google/GitHub OAuth y proxy
  upgradeDescription: |
    **Nuevas funciones:**
    - Manejo de errores mejorado para bibliotecas inválidas
    - Comprobación de dependencias y estabilidad mejoradas para la versión EXE de Windows
    - Añadido soporte de rutas binarias para FreeBSD
    - Enlaces Kobo actualizados para soportar "reading_service_host"
    - Añadida la etiqueta <title> al feed OPDS
    - El lector EPUB ahora admite el formato Kepub
    - Añadidas funciones masivas: eliminar, archivar y marcar como leído en la tabla de libros
    - Añadido Storygraph a los enlaces de identificadores
    - Implementada la carga diferida de imágenes de portada
    - Añadidos smashwords.com y ebooks.com a los identificadores reconocidos
    - Manejo de errores mejorado para direcciones de destinatario inválidas en correos
    - Generación mejorada de identificadores únicos al enviar correos a lectores
    - Las actividades registradas ahora incluyen direcciones IP
    - Salida del logger mejorada: se registra el nombre de archivo en lugar del logger responsable
    - El diálogo modal del lector EPUB ahora se puede cerrar en smartphones
    - Añadida traducción al árabe
    - Soporte oficial para Python 3.12

    **Correcciones de errores:**
    - La detección de versión ahora funciona con SQLAlchemy 2.0.36.dev0 (Arch Linux)
    - Corregido el error 500 al subir metadatos con series_index no numérico (3230)
    - Los libros invisibles ya no se cuentan en la página de archivados (3221)
    - Las portadas y metadatos se muestran correctamente al compartir un libro público vía WhatsApp (y otras apps con Open Graph)
    - Los identificadores de Amazon distintos de amazon_uk ahora se convierten correctamente
    - Corregido el layout de identificadores en la página de edición del libro al empezar sin ninguno
    - El manejo de conexión a metadata.db ahora es por solicitud, resolviendo problemas de subida con varios archivos a la vez
    - Corregido un typo en la configuración de seguridad
    - Manejo de MIME actualizado: se usan MIME types distintos para validación de descarga vs. subida (#3245, #3243)
    - Los errores de permisos al generar nuevas carpetas durante el cambio de nombre de autor se manejan correctamente (3261)
    - La subida de archivos AZW, MOBI y RTF vuelve a funcionar (3263)
    - Corregido el problema de portadas subidas que aparecían demasiado oscuras (3275)
    - El visor PDF ahora carga correctamente en Windows (problema de MIME type corregido) (3277)
    - Las descargas del navegador Kindle manejan correctamente nombres de archivo solo ASCII (3266)
    - Manejo de errores mejorado al hacer proxy de solicitudes Kobo (3334)
    - Corregido el fallo de sincronización Kobo cuando “Synchronize Notebooks” estaba habilitado
    - Los nombres de locale e idioma se ordenan alfabéticamente; eliminada la entrada duplicada “English”
    - Salida de error mejorada para valores vacíos de author sort
    - Los errores no manejados en tareas en segundo plano ahora se registran
    - Mejoras de UI del tema Caliblur en la página de edición del libro
    - Implementada la comprobación correcta del MIME type DjVu
    - Corregido el problema con Overdrive donde la devolución de libros prestados fallaba parcialmente (3398)
    - Corregido el error 403 al acceder a /ajax/updateThumbnails desde una sesión autenticada por reverse proxy

    Consulta las Release Notes para correcciones y más información: https://github.com/janeczku/calibre-web/releases/tag/0.6.21
