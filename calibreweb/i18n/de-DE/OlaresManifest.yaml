metadata:
  title: Calibre-Web
  description: Web-App zum Durchsuchen, Lesen und Herunterladen von in einer Calibre-Datenbank gespeicherten E-Books
spec:
  fullDescription: |
    Calibre-Web ist eine Web-App mit einer klaren und intuitiven Oberfläche zum Durchsuchen, Lesen und Herunterladen von E-Books anhand einer gültigen Calibre-Datenbank.

    **Standardzugangsdaten**
    Benutzername: admin
    Passwort: admin123
    Bitte ändern Sie Benutzername und Passwort so bald wie möglich.

    **Funktionen**
    - Moderne und responsive Bootstrap-3-HTML5-Oberfläche
    - Vollständige grafische Einrichtung
    - Umfassende Benutzerverwaltung mit feingranularen Berechtigungen pro Benutzer
    - Admin-Oberfläche
    - Mehrsprachige Benutzeroberfläche mit Unterstützung für über 20 Sprachen (unterstützte Sprachen)
    - OPDS-Feed für E-Book-Reader-Apps
    - Erweiterte Such- und Filteroptionen
    - Erstellung benutzerdefinierter Buchsammlungen (Regale)
    - Bearbeitung und Löschung von E-Book-Metadaten
    - Metadaten-Download aus verschiedenen Quellen (erweiterbar über Plugins)
    - E-Book-Konvertierung über Calibre-Binaries
    - Download-Beschränkung auf angemeldete Benutzer
    - Öffentliche Benutzerregistrierung
    - E-Books mit einem Klick an E-Reader senden
    - Kobo-Geräte mit Ihrer Calibre-Bibliothek synchronisieren
    - In-Browser-E-Book-Lesen für mehrere Formate
    - Upload neuer Bücher in verschiedenen Formaten, einschließlich Audioformaten
    - Unterstützung für Calibre Custom Columns
    - Inhaltsausblendung basierend auf Kategorien und Custom-Column-Inhalten pro Benutzer
    - Selbstaktualisierungsfähigkeit
    - „Magic Link“-Login für einfachen Zugriff auf E-Readern
    - Unterstützung für LDAP, Google/GitHub OAuth und Proxy-Authentifizierung
  upgradeDescription: |
    **Neue Funktionen:**
    - Verbesserte Fehlerbehandlung für ungültige Bibliotheken
    - Verbesserte Abhängigkeitsprüfung und Stabilität für die Windows-EXE-Version
    - Unterstützung für Binary-Pfade unter FreeBSD hinzugefügt
    - Kobo-Links aktualisiert zur Unterstützung von „reading_service_host“
    - <title>-Tag zum OPDS-Feed hinzugefügt
    - EPUB-Reader unterstützt nun das Kepub-Format
    - Massenfunktionen hinzugefügt: Löschen, Archivieren und als gelesen markieren in der Buchtabelle
    - Storygraph zu Identifier-Links hinzugefügt
    - Lazy Loading von Cover-Bildern implementiert
    - smashwords.com und ebooks.com zu erkannten Identifiern hinzugefügt
    - Verbesserte Fehlerbehandlung für ungültige Empfängeradressen in E-Mails
    - Verbesserte Generierung eindeutiger Identifier beim Senden von E-Mails an Reader
    - Protokollierte Aktivitäten enthalten nun IP-Adressen
    - Logger-Ausgabe verbessert: Dateiname wird statt des zuständigen Loggers protokolliert
    - Modaldialog im EPUB-Reader kann nun auf Smartphones geschlossen werden
    - Arabische Übersetzung hinzugefügt
    - Offizielle Unterstützung für Python 3.12

    **Bugfixes:**
    - Versionserkennung funktioniert nun mit SQLAlchemy 2.0.36.dev0 (Arch Linux)
    - Fehler 500 beim Upload von Metadaten mit nicht-numerischem series_index behoben (3230)
    - Unsichtbare Bücher werden auf der Archivseite nicht mehr gezählt (3221)
    - Cover und Metadaten werden korrekt angezeigt, wenn ein öffentliches Buch über WhatsApp (und andere Open-Graph-fähige Apps) geteilt wird
    - Amazon-Identifier neben amazon_uk werden nun korrekt konvertiert
    - Layout der Identifier auf der Buchbearbeitungsseite behoben, wenn mit keinem gestartet wird
    - Verbindungsbehandlung zu metadata.db ist nun request-basiert und löst Upload-Probleme mit mehreren Dateien gleichzeitig
    - Tippfehler in den Sicherheitseinstellungen behoben
    - MIME-Type-Behandlung aktualisiert: unterschiedliche MIME-Typen für Download vs. Upload-Validierung (#3245, #3243)
    - Berechtigungsfehler beim Erzeugen neuer Ordner während Autorenumbenennung werden korrekt behandelt (3261)
    - Upload von AZW-, MOBI- und RTF-Dateien funktioniert wieder (3263)
    - Problem behoben, bei dem hochgeladene Cover-Bilder zu dunkel erschienen (3275)
    - PDF-Viewer lädt unter Windows korrekt (MIME-Type-Problem behoben) (3277)
    - Kindle-Browser-Downloads behandeln ASCII-only-Dateinamen korrekt (3266)
    - Verbesserte Fehlerbehandlung beim Proxien von Kobo-Anfragen (3334)
    - Kobo-Sync-Fehler behoben, wenn „Synchronize Notebooks“ aktiviert war
    - Locale- und Sprachnamen werden alphabetisch sortiert; doppelter „English“-Eintrag entfernt
    - Verbesserte Fehlerausgabe für leere Author-Sort-Werte
    - Unbehandelte Fehler in Hintergrundaufgaben werden nun protokolliert
    - UI-Verbesserungen für das Caliblur-Theme auf der Buchbearbeitungsseite
    - Korrekte Prüfung des DjVu-MIME-Typs implementiert
    - Problem mit Overdrive behoben, bei dem die Rückgabe ausgeliehener Bücher teilweise fehlschlug (3398)
    - 403-Fehler beim Zugriff auf /ajax/updateThumbnails aus einer per Reverse-Proxy authentifizierten Sitzung behoben

    Release Notes für Bugfixes und weitere Informationen: https://github.com/janeczku/calibre-web/releases/tag/0.6.21
