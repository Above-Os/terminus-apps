metadata:
  title: Calibre-Web
  description: App web per sfogliare, leggere e scaricare eBook memorizzati in un database Calibre
spec:
  fullDescription: |
    Calibre-Web è un'app web che offre un'interfaccia pulita e intuitiva per sfogliare, leggere e scaricare eBook usando un database Calibre valido.

    **Credenziali predefinite**
    Username: admin
    Password: admin123
    Modifica username e password il prima possibile.

    **Funzionalità**
    - Interfaccia HTML5 Bootstrap 3 moderna e responsive
    - Setup grafico completo
    - Gestione utenti completa con permessi granulari per utente
    - Interfaccia di amministrazione
    - Interfaccia utente multilingue con supporto per oltre 20 lingue (lingue supportate)
    - Feed OPDS per app di lettura eBook
    - Opzioni avanzate di ricerca e filtro
    - Creazione di collezioni di libri personalizzate (scaffali)
    - Modifica ed eliminazione dei metadati eBook
    - Download dei metadati da varie fonti (estensibile tramite plugin)
    - Conversione eBook tramite binari Calibre
    - Restrizione del download eBook agli utenti autenticati
    - Supporto alla registrazione pubblica degli utenti
    - Invio di eBook agli eReader con un clic
    - Sincronizzazione dei dispositivi Kobo con la tua libreria Calibre
    - Lettura eBook nel browser per più formati
    - Upload di nuovi libri in vari formati, inclusi formati audio
    - Supporto alle Custom Columns di Calibre
    - Nascondere i contenuti in base a categorie e contenuto Custom Column per utente
    - Capacità di auto-aggiornamento
    - Login "Magic Link" per un accesso facile sugli eReader
    - Supporto all'autenticazione LDAP, Google/GitHub OAuth e proxy
  upgradeDescription: |
    **Nuove funzionalità:**
    - Gestione errori migliorata per librerie non valide
    - Controllo dipendenze e stabilità migliorati per la versione EXE Windows
    - Aggiunto supporto ai percorsi binari per FreeBSD
    - Link Kobo aggiornati per supportare "reading_service_host"
    - Aggiunto il tag <title> al feed OPDS
    - Il reader EPUB ora supporta il formato Kepub
    - Aggiunte funzioni bulk: elimina, archivia e segna come letto nella tabella libri
    - Aggiunto Storygraph ai link degli identifier
    - Implementato il lazy loading delle immagini di copertina
    - Aggiunti smashwords.com e ebooks.com agli identifier riconosciuti
    - Gestione errori migliorata per indirizzi destinatario non validi nelle email
    - Generazione migliorata di identifier unici nell'invio di email ai reader
    - Le attività registrate includono ora gli indirizzi IP
    - Output del logger migliorato: viene registrato il nome file invece del logger responsabile
    - Il dialogo modale nel reader EPUB può ora essere chiuso sugli smartphone
    - Aggiunta traduzione in arabo
    - Supporto ufficiale per Python 3.12

    **Correzioni di bug:**
    - Il rilevamento della versione ora funziona con SQLAlchemy 2.0.36.dev0 (Arch Linux)
    - Corretto l'errore 500 nell'upload dei metadati con series_index non numerico (3230)
    - I libri invisibili non vengono più conteggiati nella pagina archiviati (3221)
    - Copertine e metadati vengono visualizzati correttamente condividendo un libro pubblico via WhatsApp (e altre app Open Graph)
    - Gli identifier Amazon oltre amazon_uk vengono ora convertiti correttamente
    - Corretto il layout degli identifier nella pagina di modifica libro partendo da nessuno
    - La gestione della connessione a metadata.db è ora basata sulla richiesta, risolvendo problemi di upload con più file contemporaneamente
    - Corretto un typo nelle impostazioni di sicurezza
    - Gestione MIME aggiornata: MIME type distinti per validazione download vs. upload (#3245, #3243)
    - Gli errori di permesso nella generazione di nuove cartelle durante la rinomina dell'autore sono gestiti correttamente (3261)
    - L'upload di file AZW, MOBI e RTF funziona di nuovo (3263)
    - Corretto il problema delle immagini di copertina caricate troppo scure (3275)
    - Il PDF Viewer ora carica correttamente su Windows (problema MIME type risolto) (3277)
    - I download del browser Kindle gestiscono correttamente i nomi file solo ASCII (3266)
    - Gestione errori migliorata nel proxy delle richieste Kobo (3334)
    - Corretto il fallimento della sync Kobo con “Synchronize Notebooks” abilitato
    - I nomi di locale e lingua sono ordinati alfabeticamente; rimossa la voce duplicata “English”
    - Output di errore migliorato per valori author sort vuoti
    - Gli errori non gestiti nei task in background vengono ora registrati
    - Miglioramenti UI per il tema Caliblur nella pagina di modifica libro
    - Implementato il controllo corretto del MIME type DjVu
    - Corretto il problema con Overdrive in cui la restituzione dei libri presi in prestito falliva parzialmente (3398)
    - Corretto l'errore 403 nell'accesso a /ajax/updateThumbnails da una sessione autenticata da reverse proxy

    Controlla le Release Note per bug fix e altre informazioni: https://github.com/janeczku/calibre-web/releases/tag/0.6.21
