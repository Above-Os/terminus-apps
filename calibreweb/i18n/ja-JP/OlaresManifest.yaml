metadata:
  title: Calibre-Web
  description: Calibre データベースに保存された eBook を閲覧・読書・ダウンロードする Web アプリ
spec:
  fullDescription: |
    Calibre-Web は、有効な Calibre データベースを使って eBook を閲覧・読書・ダウンロードするための、クリーンで直感的なインターフェースを提供する Web アプリです。

    **デフォルト認証情報**
    ユーザー名：admin
    パスワード：admin123
    できるだけ早くユーザー名とパスワードを変更してください。

    **機能**
    - モダンでレスポンシブな Bootstrap 3 HTML5 インターフェース
    - 完全なグラフィカルセットアップ
    - ユーザーごとの細粒度権限付きの包括的ユーザー管理
    - 管理インターフェース
    - 20 以上の言語に対応する多言語 UI（サポート言語）
    - eBook リーダーアプリ向け OPDS フィード
    - 高度な検索とフィルタオプション
    - カスタム書籍コレクション（棚）の作成
    - eBook メタデータの編集と削除
    - 各種ソースからのメタデータダウンロード（プラグインで拡張可能）
    - Calibre バイナリによる eBook 変換
    - ログインユーザーへの eBook ダウンロード制限
    - 公開ユーザー登録のサポート
    - ワンクリックで eBook を E-Reader へ送信
    - Kobo デバイスを Calibre ライブラリと同期
    - 複数形式のブラウザ内 eBook 読書
    - 音声形式を含む各種形式の新規書籍アップロード
    - Calibre Custom Columns 対応
    - カテゴリと Custom Column 内容に基づくユーザーごとのコンテンツ非表示
    - 自己更新機能
    - eReader での簡単アクセス向け「Magic Link」ログイン
    - LDAP、Google/GitHub OAuth、プロキシ認証対応
  upgradeDescription: |
    **新機能：**
    - 無効なライブラリのエラー処理を改善
    - Windows EXE 版の依存関係チェックと安定性を強化
    - FreeBSD 向けバイナリパスサポートを追加
    - Kobo リンクを「reading_service_host」対応に更新
    - OPDS フィードに <title> タグを追加
    - EPUB リーダーが Kepub 形式をサポート
    - 書籍テーブルに一括削除・アーカイブ・既読マーク機能を追加
    - 識別子リンクに Storygraph を追加
    - カバー画像の遅延読み込みを実装
    - 認識識別子に smashwords.com と ebooks.com を追加
    - メールの無効な宛先アドレスのエラー処理を改善
    - リーダーへのメール送信時の一意識別子生成を改善
    - 記録されたアクティビティに IP アドレスを含む
    - ロガー出力を改善：担当ロガーではなくファイル名を記録
    - EPUB リーダーのモーダルダイアログをスマートフォンで閉じられるように
    - アラビア語翻訳を追加
    - Python 3.12 の公式サポート

    **バグ修正：**
    - SQLAlchemy 2.0.36.dev0（Arch Linux）でバージョン検出が動作
    - 非数値 series_index のメタデータアップロード時の 500 エラーを修正（3230）
    - 非表示の本がアーカイブページでカウントされなくなった（3221）
    - WhatsApp（および他の Open Graph 対応アプリ）で公開本を共有する際、カバーとメタデータが正しく表示
    - amazon_uk 以外の Amazon 識別子が正しく変換される
    - 識別子なしから始めた場合の書籍編集ページの識別子レイアウトを修正
    - metadata.db への接続処理をリクエストベースにし、複数ファイル同時アップロードの問題を解決
    - セキュリティ設定のタイポを修正
    - MIME タイプ処理を更新：ダウンロードとアップロード検証で別 MIME タイプを使用（#3245、#3243）
    - 著者名変更時の新フォルダ生成での権限エラーを正しく処理（3261）
    - AZW、MOBI、RTF ファイルのアップロードが再び動作（3263）
    - アップロードしたカバー画像が暗すぎる問題を修正（3275）
    - Windows で PDF Viewer が正しく読み込まれる（MIME タイプ問題を修正）（3277）
    - Kindle ブラウザのダウンロードが ASCII のみのファイル名を正しく処理（3266）
    - Kobo リクエストのプロキシ時のエラー処理を改善（3334）
    - 「Synchronize Notebooks」有効時の Kobo 同期失敗を修正
    - ロケールと言語名をアルファベット順にソート；重複する「English」エントリを削除
    - 空の author sort 値のエラー出力を改善
    - バックグラウンドタスクの未処理エラーをログに記録
    - 書籍編集ページの Caliblur テーマの UI 改善
    - DjVu MIME タイプの正しいチェックを実装
    - Overdrive で借りた本の返却が部分的に失敗する問題を修正（3398）
    - リバースプロキシ認証セッションから /ajax/updateThumbnails にアクセスする際の 403 エラーを修正

    バグ修正とその他情報は Release Note を確認：https://github.com/janeczku/calibre-web/releases/tag/0.6.21
