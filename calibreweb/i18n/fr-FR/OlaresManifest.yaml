metadata:
  title: Calibre-Web
  description: Application web pour parcourir, lire et télécharger des eBooks stockés dans une base Calibre
spec:
  fullDescription: |
    Calibre-Web est une application web qui offre une interface claire et intuitive pour parcourir, lire et télécharger des eBooks à l'aide d'une base de données Calibre valide.

    **Identifiants par défaut**
    Nom d'utilisateur : admin
    Mot de passe : admin123
    Veuillez changer le nom d'utilisateur et le mot de passe dès que possible.

    **Fonctionnalités**
    - Interface HTML5 Bootstrap 3 moderne et responsive
    - Configuration graphique complète
    - Gestion complète des utilisateurs avec permissions granulaires par utilisateur
    - Interface d'administration
    - Interface utilisateur multilingue prenant en charge plus de 20 langues (langues prises en charge)
    - Flux OPDS pour les applications de lecture d'eBooks
    - Options avancées de recherche et de filtrage
    - Création de collections de livres personnalisées (étagères)
    - Édition et suppression des métadonnées d'eBooks
    - Téléchargement de métadonnées depuis diverses sources (extensible via plugins)
    - Conversion d'eBooks via les binaires Calibre
    - Restriction du téléchargement d'eBooks aux utilisateurs connectés
    - Prise en charge de l'inscription publique des utilisateurs
    - Envoi d'eBooks vers les liseuses en un clic
    - Synchronisation des appareils Kobo avec votre bibliothèque Calibre
    - Lecture d'eBooks dans le navigateur pour plusieurs formats
    - Téléversement de nouveaux livres dans divers formats, y compris audio
    - Prise en charge des Custom Columns Calibre
    - Masquage de contenu basé sur les catégories et le contenu Custom Column par utilisateur
    - Capacité d'auto-mise à jour
    - Connexion « Magic Link » pour un accès facile sur les liseuses
    - Prise en charge de l'authentification LDAP, Google/GitHub OAuth et proxy
  upgradeDescription: |
    **Nouvelles fonctionnalités :**
    - Gestion des erreurs améliorée pour les bibliothèques invalides
    - Vérification des dépendances et stabilité améliorées pour la version EXE Windows
    - Ajout de la prise en charge des chemins binaires pour FreeBSD
    - Liens Kobo mis à jour pour prendre en charge « reading_service_host »
    - Ajout de la balise <title> au flux OPDS
    - Le lecteur EPUB prend désormais en charge le format Kepub
    - Ajout de fonctions en masse : supprimer, archiver et marquer comme lu dans la table des livres
    - Ajout de Storygraph aux liens d'identifiants
    - Chargement différé des images de couverture implémenté
    - Ajout de smashwords.com et ebooks.com aux identifiants reconnus
    - Gestion des erreurs améliorée pour les adresses de destinataire invalides dans les e-mails
    - Génération améliorée d'identifiants uniques lors de l'envoi d'e-mails aux lecteurs
    - Les activités journalisées incluent désormais les adresses IP
    - Sortie du logger améliorée : le nom de fichier est journalisé au lieu du logger responsable
    - La boîte de dialogue modale du lecteur EPUB peut désormais être fermée sur smartphones
    - Ajout de la traduction arabe
    - Prise en charge officielle de Python 3.12

    **Corrections de bugs :**
    - La détection de version fonctionne désormais avec SQLAlchemy 2.0.36.dev0 (Arch Linux)
    - Correction de l'erreur 500 lors du téléversement de métadonnées avec un series_index non numérique (3230)
    - Les livres invisibles ne sont plus comptés dans la page archivée (3221)
    - Couvertures et métadonnées s'affichent correctement lors du partage d'un livre public via WhatsApp (et autres apps Open Graph)
    - Les identifiants Amazon autres que amazon_uk sont désormais correctement convertis
    - Correction de la mise en page des identifiants sur la page d'édition du livre en partant de zéro
    - La gestion des connexions à metadata.db est désormais basée sur la requête, résolvant les problèmes de téléversement de plusieurs fichiers à la fois
    - Correction d'une faute de frappe dans les paramètres de sécurité
    - Gestion des types MIME mise à jour : types MIME distincts pour la validation téléchargement vs. téléversement (#3245, #3243)
    - Les erreurs de permission lors de la génération de nouveaux dossiers pendant le renommage d'auteur sont correctement gérées (3261)
    - Le téléversement de fichiers AZW, MOBI et RTF fonctionne à nouveau (3263)
    - Correction du problème où les images de couverture téléversées apparaissaient trop sombres (3275)
    - Le visionneuse PDF se charge correctement sous Windows (problème de type MIME corrigé) (3277)
    - Les téléchargements du navigateur Kindle gèrent correctement les noms de fichiers ASCII uniquement (3266)
    - Gestion des erreurs améliorée lors du proxy des requêtes Kobo (3334)
    - Correction de l'échec de synchronisation Kobo lorsque « Synchronize Notebooks » était activé
    - Les noms de locale et de langue sont triés alphabétiquement ; entrée « English » en double supprimée
    - Sortie d'erreur améliorée pour les valeurs author sort vides
    - Les erreurs non gérées dans les tâches d'arrière-plan sont désormais journalisées
    - Améliorations UI du thème Caliblur sur la page d'édition du livre
    - Vérification correcte du type MIME DjVu implémentée
    - Correction du problème Overdrive où le retour de livres empruntés échouait partiellement (3398)
    - Correction de l'erreur 403 lors de l'accès à /ajax/updateThumbnails depuis une session authentifiée par reverse proxy

    Consultez les Release Notes pour les corrections et autres informations : https://github.com/janeczku/calibre-web/releases/tag/0.6.21
