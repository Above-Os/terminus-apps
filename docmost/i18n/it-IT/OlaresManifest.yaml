metadata:
  title: Docmost
  description: Software open source per wiki e documentazione collaborativa
spec:
  fullDescription: |
    Docmost è un'alternativa open source a Notion e Confluence. Che tu gestisca un wiki, una knowledge base o un'ampia documentazione di progetto, Docmost fornisce gli strumenti necessari per creare, collaborare e condividere conoscenza senza sforzo. Docmost è completamente self-hosted e può funzionare in ambienti air-gapped senza dipendenze esterne.

    Docmost supporta gli Spaces. Puoi creare Spaces per team, progetti o dipartimenti diversi a seconda delle esigenze. Ogni Space ha i propri permessi. Con un'edizione enterprise opzionale, Docmost scala per organizzazioni più grandi con SSO, IA, accesso API e altro.

    **Funzionalità**
    - **Collaborative Real-time Editor:** Lavora insieme sulle pagine in tempo reale.
    - **Spaces:** Organizza le pagine per team, progetti o dipartimenti per una migliore collaborazione.
    - **Permissions Management:** Controlla facilmente l'accesso ai contenuti con permessi intuitivi a livello di workspace e space.
    - **Groups:** Concedi permessi unificati agli utenti tramite gruppi.
    - **Nested Navigation:** Annida, riordina e trascina le pagine dalla barra laterale.
    - **Tables:** Inserisci e modifica tabelle con colonne ridimensionabili, celle unibili, righe/colonne di intestazione e colori di sfondo delle celle.
    - **Diagrams:** Supporto integrato per Draw.io, Excalidraw e Mermaid.
    - **Math Equations:** Scrivi equazioni matematiche inline e a livello di blocco con KaTeX.
    - **Callouts and Toggle Blocks:** Struttura i contenuti con avvisi callout e blocchi toggle richiudibili.
    - **Comments:** Aggiungi commenti alle pagine per una migliore comunicazione e feedback.
    - **Page History:** Traccia le modifiche con una cronologia delle versioni completa e ripristina versioni precedenti.
    - **Public Sharing:** Condividi pubblicamente le pagine, consentendo a chiunque abbia il link di visualizzarle.
    - **Search:** Ricerca full-text tra le pagine con filtri per space e tipo.
    - **File Attachment:** Allega file alle pagine per riferimento e condivisione facili.
    - **Import / Export:** Importa ed esporta pagine in formati Markdown e HTML.
      - Importazione archivio ZIP
      - Importazione Notion:
      - Importazione Confluence (Enterprise):
      - Importazione DOCX (Enterprise):
    - **Print to PDF:** Genera versioni PDF delle pagine usando la finestra di stampa del browser.
    - **@ Mentions:** Menziona i membri del team e collega le pagine direttamente nell'editor.
    - **Markdown Shortcuts:** Digita la sintassi Markdown direttamente nell'editor e viene convertita automaticamente in rich text.
    - **Keyboard Shortcuts:** Set completo di scorciatoie da tastiera per formattazione, navigazione e azioni dell'editor.
    - **Dark Mode:** Passa tra temi chiaro, scuro e di sistema.
    - **Read/Edit Mode:** Imposta una modalità pagina predefinita per evitare modifiche accidentali.
    - **Translations:** Disponibile in oltre 12 lingue

  upgradeDescription: |
    Archiviazione: lo storage durevole è stato spostato da `appCache` a `appData`. Al primo avvio dopo l'upgrade, un initContainer copia il `appCache` legacy in `appData` quando la destinazione è vuota (marker: `.migration_from_appcache_done`). I dati appCache precedenti restano intatti per il rollback.

    Rimossa la ramificazione legacy dei percorsi appData `sysVersion >= 1.12.3` per Redis; il minimo Olares è ora 1.12.6.

