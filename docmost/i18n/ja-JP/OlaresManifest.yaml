metadata:
  title: Docmost
  description: オープンソースの共同編集 wiki・ドキュメントソフトウェア。
spec:
  fullDescription: |
    Docmost は Notion や Confluence のようなツールのオープンソース代替です。wiki、ナレッジベース、大規模なプロジェクト文書のいずれを管理する場合でも、Docmost は知識を簡単に作成・共同編集・共有するためのツールを提供します。Docmost は完全にセルフホストでき、外部依存なしのエアギャップ環境でも動作します。

    Docmost は Spaces をサポートします。ニーズに応じてチーム、プロジェクト、部門ごとに Space を作成できます。各 Space には独自の権限があります。オプションのエンタープライズ版では、SSO、AI、API アクセスなどで大規模組織のニーズにスケールします。

    **機能**
    - **Collaborative Real-time Editor:** ページをリアルタイムで共同編集。
    - **Spaces:** チーム、プロジェクト、部門ごとにページを整理してコラボレーションを強化。
    - **Permissions Management:** ワークスペースおよびスペースレベルの直感的な権限でコンテンツへのアクセスを簡単に制御。
    - **Groups:** グループ経由でユーザーに統一権限を付与。
    - **Nested Navigation:** サイドバーでページを入れ子化・並べ替え・ドラッグ＆ドロップ。
    - **Tables:** リサイズ可能な列、結合可能なセル、ヘッダー行／列、セル背景色付きの表を挿入・編集。
    - **Diagrams:** Draw.io、Excalidraw、Mermaid の組み込みサポート。
    - **Math Equations:** KaTeX でインラインおよびブロックレベルの数式を記述。
    - **Callouts and Toggle Blocks:** コールアウト通知と折りたたみトグルブロックでコンテンツを構造化。
    - **Comments:** より良いコミュニケーションとフィードバックのためページにコメントを追加。
    - **Page History:** 包括的なバージョン履歴で変更を追跡し、以前のバージョンを復元。
    - **Public Sharing:** ページを公開共有し、リンクを持つ誰でも閲覧可能に。
    - **Search:** スペースとタイプのフィルター付きでページを全文検索。
    - **File Attachment:** 参照と共有のためページにファイルを添付。
    - **Import / Export:** Markdown と HTML 形式でページをインポート／エクスポート。
      - ZIP アーカイブインポート
      - Notion インポート:
      - Confluence インポート（Enterprise）:
      - DOCX インポート（Enterprise）:
    - **Print to PDF:** ブラウザの印刷ダイアログでページの PDF 版を生成。
    - **@ Mentions:** エディター内でチームメンバーをメンションし、ページへリンク。
    - **Markdown Shortcuts:** エディターで Markdown 構文を入力するとリッチテキストに自動変換。
    - **Keyboard Shortcuts:** 書式設定、ナビゲーション、エディター操作のフルセットのキーボードショートカット。
    - **Dark Mode:** ライト、ダーク、システムテーマを切り替え。
    - **Read/Edit Mode:** 誤編集防止のためデフォルトのページモードを設定。
    - **Translations:** 12 以上の言語で利用可能

  upgradeDescription: |
    ストレージ：永続ストレージを `appCache` から `appData` へ移動。アップグレード後の初回起動時、宛先が空の場合 initContainer がレガシー `appCache` を `appData` へコピー（マーカー：`.migration_from_appcache_done`）。旧 appCache データはロールバック用に残します。

    Redis 向けのレガシー `sysVersion >= 1.12.3` appData パス分岐を削除。Olares 最小要件は 1.12.6。

    v0.21.0 へアップグレード

