{{- $secretName := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $authKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "ROMM_AUTH_SECRET_KEY") -}}
{{- $authKey = index $existing.data "ROMM_AUTH_SECRET_KEY" | b64dec -}}
{{- else -}}
{{- $authKey = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: romm
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ROMM_AUTH_SECRET_KEY: {{ $authKey | quote }}
  DB_PASSWD: {{ .Values.postgres.password | toString | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | toString | quote }}
