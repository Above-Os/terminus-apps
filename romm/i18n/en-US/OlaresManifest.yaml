metadata:
  title: RomM
  description: Self-hosted ROM manager and in-browser player.
spec:
  fullDescription: |
    RomM is a self-hosted ROM manager with a clean web UI. Scan and organize your retro library, pull metadata and cover art, then play in the browser with EmulatorJS.

    Put game files under Home/Games/roms/{platform}/ (for example Home/Games/roms/gba/). You can also upload through the web UI. First launch opens a setup wizard to create the admin user.

  upgradeDescription: |
    Clarify IGDB environment variable descriptions for covers and game identification.

envs:
- envName: IGDB_CLIENT_ID
  description: Twitch/IGDB Client ID for covers and metadata. Create an app at https://dev.twitch.tv/console/apps then paste the Client ID.
- envName: IGDB_CLIENT_SECRET
  description: Twitch/IGDB Client Secret paired with IGDB_CLIENT_ID. Copied from the same Twitch application.
