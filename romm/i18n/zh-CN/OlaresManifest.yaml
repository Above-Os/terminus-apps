metadata:
  title: RomM
  description: 自托管 ROM 管理器，可在浏览器里直接玩。
spec:
  fullDescription: |
    RomM 是一个自托管的 ROM 管理器，界面干净，可以扫描和整理复古游戏库、拉取封面和元数据，并用 EmulatorJS 在浏览器里直接玩。

    把游戏文件放到 Home/Games/roms/{平台}/（例如 Home/Games/roms/gba/）。也可以在网页里上传。首次打开会进入向导，用来创建管理员账号。

  upgradeDescription: |
    完善 IGDB 环境变量说明。填写后可用于封面和游戏识别。

envs:
- envName: IGDB_CLIENT_ID
  description: IGDB/Twitch 客户端 ID，用于封面和游戏资料。在 https://dev.twitch.tv/console/apps 创建应用后粘贴 Client ID。
- envName: IGDB_CLIENT_SECRET
  description: IGDB/Twitch 客户端密钥，与 IGDB_CLIENT_ID 配对，从同一个 Twitch 应用复制。
