olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  romm: 1

metadata:
  name: romm
  appid: romm
  title: RomM
  description: Self-hosted ROM manager and in-browser player.
  icon: https://cdn.olares.com/images/2026/08/a2f888a587832b7ffbe7454306a4a5da.png
  version: 0.1.4
  categories:
  - Fun

entrances:
- name: romm
  host: romm
  port: 8080
  title: RomM
  icon: https://cdn.olares.com/images/2026/08/a2f888a587832b7ffbe7454306a4a5da.png
  authLevel: private
  openMethod: window
  windowPushState: true

permission:
  appData: true
  appCache: true
  userData:
  - Home

spec:
  versionName: "5.1.0"
  developer: RomM
  website: https://romm.app/
  sourceCode: https://github.com/rommapp/romm
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://docs.romm.app/
  license:
  - text: AGPL-3.0
    url: https://github.com/rommapp/romm/blob/master/LICENSE
  requiredMemory: 512Mi
  limitedMemory: 4Gi
  requiredDisk: 128Mi
  limitedDisk: 10Gi
  requiredCpu: 0.25
  limitedCpu: 2
  supportArch:
  - amd64
  - arm64
  runAsUser: true
  featuredImage: https://cdn.olares.com/images/2026/08/0c2740bf33c44de606201581305466da.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/0c2740bf33c44de606201581305466da.png
  - https://cdn.olares.com/images/2026/08/fc375c548408d322626d6cc5d18a3688.png
  - https://cdn.olares.com/images/2026/08/5360b57258b0057ffa021607c6d57c25.png
  fullDescription: |
    RomM is a self-hosted ROM manager with a clean web UI. Scan and organize your retro library, pull metadata and cover art, then play in the browser with EmulatorJS.

    Put game files under Home/Games/roms/{platform}/ (for example Home/Games/roms/gba/). You can also upload through the web UI. First launch opens a setup wizard to create the admin user.

  upgradeDescription: |
    Clarify IGDB Client ID/Secret env descriptions so they are easier to fill in Settings.

middleware:
  postgres:
    username: romm
    password: romm
    databases:
    - name: romm
      distributed: false
  redis:
    namespace: romm

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'

envs:
- envName: IGDB_CLIENT_ID
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Twitch/IGDB Client ID for covers and metadata. Create an app at https://dev.twitch.tv/console/apps then paste the Client ID.
- envName: IGDB_CLIENT_SECRET
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: Twitch/IGDB Client Secret paired with IGDB_CLIENT_ID. Copied from the same Twitch application.
- envName: SCREENSCRAPER_USER
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Optional ScreenScraper username.
- envName: SCREENSCRAPER_PASSWORD
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: Optional ScreenScraper password.
