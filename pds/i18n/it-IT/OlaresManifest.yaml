metadata:
  description: Personal Data Server di Bluesky
  title: Bluesky PDS
spec:
  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico di Bitnami di `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Bluesky PDS (Personal Data Server) è un server self-hosted per il social network Bluesky. Ti consente di eseguire il tuo Personal Data Server, dandoti pieno controllo sui tuoi dati e sulla tua identità social.

    **Funzionalità**
    - Self-Hosted: Esegui il tuo Personal Data Server per il controllo completo dei dati
    - Protocollo ATProto: Basato su ATProto (Authenticated Transfer Protocol) per il social networking decentralizzato
    - Gestione account: Crea e gestisci account Bluesky sul tuo server
    - Controllo dei dati: Pieno controllo su dati e contenuti social
    - Supporto WebSocket: Aggiornamenti in tempo reale tramite connessioni WebSocket
    - Integrazione email: Verifica e notifiche email opzionali via SMTP
