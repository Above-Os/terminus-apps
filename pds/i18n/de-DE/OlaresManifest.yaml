metadata:
  description: "Bluesky persönlicher Datenserver"
  title: Bluesky PDS
spec:
  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.
  fullDescription: |
    Bluesky PDS (Personal Data Server) ist ein selbst gehosteter Server für das Bluesky-Sozialnetzwerk. Er ermöglicht Ihnen, Ihren eigenen Personal Data Server zu betreiben und volle Kontrolle über Ihre Social-Media-Daten und Identität zu behalten.

    **Funktionen**
    - Self-Hosted: Betreiben Sie Ihren eigenen Personal Data Server für vollständige Kontrolle über Ihre Daten
    - ATProto-Protokoll: Basierend auf ATProto (Authenticated Transfer Protocol) für dezentrale soziale Netzwerke
    - Kontoverwaltung: Erstellen und verwalten Sie Bluesky-Konten auf Ihrem eigenen Server
    - Datenkontrolle: Volle Kontrolle über Ihre Social-Media-Daten und Inhalte
    - WebSocket-Unterstützung: Echtzeit-Updates über WebSocket-Verbindungen
    - E-Mail-Integration: Optionale E-Mail-Verifizierung und Benachrichtigungen per SMTP
