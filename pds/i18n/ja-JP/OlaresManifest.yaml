metadata:
  description: "Bluesky パーソナルデータサーバー"
  title: Bluesky PDS
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
  fullDescription: |
    Bluesky PDS（Personal Data Server）は、Bluesky ソーシャルネットワーク向けのセルフホストサーバーです。独自の Personal Data Server を運用し、ソーシャルメディアのデータとアイデンティティを完全に制御できます。

    **機能**
    - セルフホスト：独自の Personal Data Server を運用しデータを完全に管理
    - ATProto プロトコル：分散型ソーシャル向けの ATProto（Authenticated Transfer Protocol）を基盤に構築
    - アカウント管理：自前サーバー上で Bluesky アカウントを作成・管理
    - データ制御：ソーシャルメディアのデータとコンテンツを完全に管理
    - WebSocket 対応：WebSocket 接続によるリアルタイム更新
    - メール連携：SMTP による任意のメール認証・通知
