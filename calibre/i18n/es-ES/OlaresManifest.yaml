metadata:
  title: Calibre
  description: Aplicación web para explorar, leer y descargar libros electrónicos almacenados en una base de datos de Calibre.
spec:
  fullDescription: |
    **Acerca de**
    Calibre-Web es una aplicación web que proporciona una interfaz limpia para navegar, leer y descargar libros electrónicos utilizando una base de datos válida de Calibre.
