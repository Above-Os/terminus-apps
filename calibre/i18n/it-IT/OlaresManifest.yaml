metadata:
  title: Calibre
  description: App Web per sfogliare, leggere e scaricare eBook archiviati in un database Calibre
spec:
  fullDescription: |
    **Informazioni**
    Calibre-Web è un'app Web che fornisce un'interfaccia pulita per sfogliare, leggere e scaricare eBook utilizzando un database Calibre valido.
