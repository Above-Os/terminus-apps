metadata:
  title: Calibre
  description: Application Web pour parcourir, lire et télécharger des livres électroniques stockés dans une base de données Calibre.
spec:
  fullDescription: |
    **À propos**
    Calibre-Web est une application Web fournissant une interface claire pour parcourir, lire et télécharger des livres électroniques à l'aide d'une base de données Calibre valide.
