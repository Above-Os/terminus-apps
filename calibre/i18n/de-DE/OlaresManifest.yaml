metadata:
  title: Calibre
  description: Web-App zum Durchsuchen, Lesen und Herunterladen von in einer Calibre-Datenbank gespeicherten E-Books.
spec:
  fullDescription: |
    **Über**
    Calibre-Web ist eine Web-App, die eine übersichtliche Oberfläche zum Durchsuchen, Lesen und Herunterladen von E-Books mithilfe einer gültigen Calibre-Datenbank bietet.
