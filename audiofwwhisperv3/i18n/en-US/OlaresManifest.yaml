metadata:
  description: "OpenAI whisper-large-v3 via Faster-Whisper for offline STT (review submission)."
  title: Whisper Large V3 (FW)

spec:
  fullDescription: |
    **Model Overview**
    OpenAI whisper-large-v3 via Faster-Whisper for offline STT (review submission).

    **Preset Configuration**
    - Model: `openai/whisper-large-v3`
    - Source: `hf://openai/whisper-large-v3`
    - Capabilities: `stt`
    - Required GPU memory: `8Gi`
    - Engine: Faster-Whisper (CTranslate2)

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
