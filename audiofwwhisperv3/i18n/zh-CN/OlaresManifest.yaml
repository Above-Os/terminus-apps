metadata:
  description: "OpenAI whisper-large-v3 via Faster-Whisper for offline STT (review submission)."
  title: Whisper Large V3 (FW)

spec:
  fullDescription: |
    **模型概览**
    OpenAI whisper-large-v3 via Faster-Whisper for offline STT (review submission).

    **预设配置**
    - 模型：`openai/whisper-large-v3`
    - 来源：`hf://openai/whisper-large-v3`
    - 能力：`stt`
    - GPU 显存：`8Gi`
    - 引擎：Faster-Whisper (CTranslate2)

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
