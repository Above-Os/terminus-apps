metadata:
  title: Transmission
  description: Transmission es un cliente BitTorrent multiplataforma
spec:
  fullDescription: |
    Transmission es un cliente BitTorrent rápido, fácil y gratuito.

    **Funciones**
    Easy & Powerful
    - Transmission está diseñado para un uso fácil y potente. Los valores por defecto simplemente funcionan y solo hacen falta unos clics para configurar funciones avanzadas como carpetas vigiladas, listas de bloqueo de peers malos y la interfaz web.

    Native for Your System
    - A diferencia de muchas aplicaciones multiplataforma, Transmission se integra sin fricción con tu sistema operativo.

    Lightweight & Lightning Fast
    - Transmission tiene una de las menores huellas de memoria y recursos de cualquier cliente BitTorrent importante. Ese bajo overhead lo hace ideal para NAS domésticos y servidores multimedia.

    Open Source & Privacy Focused
    - A diferencia de algunos clientes BitTorrent, Transmission no juega con sus usuarios para ganar dinero: no incluye barras de herramientas, anuncios emergentes, flash ads, herramientas de Twitter ni nada similar. No retiene funciones para una versión de pago. Su código fuente está disponible para quien quiera revisarlo. No rastreamos a nuestros usuarios, y nuestro sitio y foros no tienen anuncios ni analítica de terceros.

    Sleek & Feature Rich
    - Las funciones que quieres de un cliente BitTorrent con una interfaz fácil de usar: protección de privacidad, interfaz web, comunicación completa entre peers, edición de trackers, límites de velocidad y más.
  upgradeDescription: |
    Actualización de Transmission a la versión 4.1.2 (2025-06-02)
    Cambios de configuración: directorio de descarga unificado y nivel de auth de la entrada.
    - Cambiar la ruta de montaje predeterminada del Home Directory de Olares a /olares/userdata/home
    - Añadir Olares External Directory con montaje en /olares/userdata/external
    - Mantener el montaje legado /downloads para configuraciones existentes
    - Establecer rutas de descarga por defecto vía settings.json para instalaciones nuevas: Home/Downloads/transmission
    - Nivel de auth de la entrada cambiado a internal
    - Cambiar la imagen del contenedor a linuxserver/transmission

    Aspectos destacados de la actualización:
    - [Highlights] Corregido un bug de 4.1.0 que podía causar announces HTTP duplicados a trackers
    - [All Platforms] Corregidas descargas atascadas al 99%; corrección de la regresión de conexión peer TCP de 4.1.0; la actualización ya no sobrescribe utp_enabled/tcp_enabled; rechazo de datos benc inválidos; salvaguardas HTTP contra clickjacking; sanitización UTF-8 de nombres de cliente peer
    - [Web Client] Corregida la visualización de marcas de tiempo en desplegables; corregido el estado incorrecto del torrent tras reconectar
    - [Qt/GTK] Corregidos cuelgues y problemas de migración de ajustes de 4.1.0
    - [macOS] Corregida fuga de memoria de 4.1.0; mejorado el uso de CPU de la UI

    Notas de versión completas: https://github.com/transmission/transmission/releases/tag/4.1.2
