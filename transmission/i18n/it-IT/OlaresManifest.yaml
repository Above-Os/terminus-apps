metadata:
  title: Transmission
  description: Transmission è un client BitTorrent multipiattaforma
spec:
  fullDescription: |
    Transmission è un client BitTorrent veloce, semplice e gratuito.

    **Funzionalità**
    Easy & Powerful
    - Transmission è pensato per un uso semplice e potente. I valori predefiniti funzionano subito e bastano pochi clic per configurare funzioni avanzate come directory di monitoraggio, blocklist dei peer cattivi e l’interfaccia web.

    Native for Your System
    - A differenza di molte applicazioni multipiattaforma, Transmission si integra senza attriti con il sistema operativo.

    Lightweight & Lightning Fast
    - Transmission ha una delle impronte di memoria e risorse più basse tra i principali client BitTorrent. Questo overhead ridotto lo rende particolarmente adatto a NAS domestici e media server.

    Open Source & Privacy Focused
    - A differenza di alcuni client BitTorrent, Transmission non gioca con gli utenti per fare soldi: non include toolbar, pop-up, flash ads, strumenti Twitter o altro. Non trattiene funzioni per una versione a pagamento. Il codice sorgente è disponibile per chiunque. Non tracciamo gli utenti e il sito e i forum non hanno annunci o analytics di terze parti.

    Sleek & Feature Rich
    - Le funzioni che vuoi da un client BitTorrent con un’interfaccia facile da usare: protezione della privacy, interfaccia web, comunicazione peer completa, modifica dei tracker, limiti di velocità e altro.
  upgradeDescription: |
    Aggiornamento di Transmission alla versione 4.1.2 (2025-06-02)
    Modifiche di configurazione: directory di download unificata e livello auth dell’ingresso.
    - Percorso di mount predefinito della Home Directory Olares impostato su /olares/userdata/home
    - Aggiunta Olares External Directory con mount su /olares/userdata/external
    - Conservato il mount legacy /downloads per le configurazioni esistenti
    - Percorsi di download predefiniti impostati via settings.json per nuove installazioni: Home/Downloads/transmission
    - Livello auth dell’ingresso impostato su internal
    - Immagine del container passata a linuxserver/transmission

    Highlight dell’upgrade:
    - [Highlights] Corretto un bug di 4.1.0 che poteva causare announce HTTP duplicati ai tracker
    - [All Platforms] Corretti download bloccati al 99%; corretta la regressione delle connessioni peer TCP di 4.1.0; l’upgrade non sovrascrive più utp_enabled/tcp_enabled; rifiuto di dati benc non validi; salvaguardie HTTP anti-clickjacking; sanitizzazione UTF-8 dei nomi client peer
    - [Web Client] Corretta la visualizzazione dei timestamp nei menu a tendina; corretto lo stato torrent errato dopo la riconnessione
    - [Qt/GTK] Corretti crash e problemi di migrazione impostazioni di 4.1.0
    - [macOS] Corretta memory leak di 4.1.0; migliorato l’uso CPU dell’UI

    Note di rilascio complete: https://github.com/transmission/transmission/releases/tag/4.1.2
