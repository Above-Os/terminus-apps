metadata:
  title: Transmission
  description: Transmission è un client BitTorrent multipiattaforma
spec:
  fullDescription: |
    Transmission è un client BitTorrent veloce, semplice e gratuito.

    **Funzionalità**
    Easy & Powerful
    - Transmission è pensato per un uso semplice e potente. I valori predefiniti funzionano subito e bastano pochi clic per configurare funzioni avanzate come directory di monitoraggio, blocklist dei peer cattivi e l’interfaccia web.

    Native for Your System
    - A differenza di molte applicazioni multipiattaforma, Transmission si integra senza attriti con il sistema operativo.

    Lightweight & Lightning Fast
    - Transmission ha una delle impronte di memoria e risorse più basse tra i principali client BitTorrent. Questo overhead ridotto lo rende particolarmente adatto a NAS domestici e media server.

    Open Source & Privacy Focused
    - A differenza di alcuni client BitTorrent, Transmission non gioca con gli utenti per fare soldi: non include toolbar, pop-up, flash ads, strumenti Twitter o altro. Non trattiene funzioni per una versione a pagamento. Il codice sorgente è disponibile per chiunque. Non tracciamo gli utenti e il sito e i forum non hanno annunci o analytics di terze parti.

    Sleek & Feature Rich
    - Le funzioni che vuoi da un client BitTorrent con un’interfaccia facile da usare: protezione della privacy, interfaccia web, comunicazione peer completa, modifica dei tracker, limiti di velocità e altro.
  upgradeDescription: |
    Aggiorna transmission da 4.1.2 a 4.1.4. Include i miglioramenti e le correzioni descritti nelle note di rilascio.

    Note di rilascio: https://github.com/transmission/transmission/releases/tag/4.1.4
