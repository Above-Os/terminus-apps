metadata:
  title: Transmission
  description: Transmission est un client BitTorrent multiplateforme
spec:
  fullDescription: |
    Transmission est un client BitTorrent rapide, simple et gratuit.

    **Fonctionnalités**
    Easy & Powerful
    - Transmission est conçu pour une utilisation simple et puissante. Les valeurs par défaut fonctionnent immédiatement, et quelques clics suffisent pour configurer des fonctions avancées comme les dossiers surveillés, les listes de blocage de mauvais pairs et l’interface web.

    Native for Your System
    - Contrairement à de nombreuses applications multiplateformes, Transmission s’intègre parfaitement à votre système d’exploitation.

    Lightweight & Lightning Fast
    - Transmission a l’une des plus faibles empreintes mémoire et ressources parmi les clients BitTorrent majeurs. Cette faible charge en fait un excellent choix pour les NAS domestiques et serveurs multimédias.

    Open Source & Privacy Focused
    - Contrairement à certains clients BitTorrent, Transmission ne joue pas avec ses utilisateurs pour gagner de l’argent : pas de barres d’outils, pop-ups, flash ads, outils Twitter ou autre. Aucune fonctionnalité n’est réservée à une version payante. Le code source est disponible pour qui veut l’examiner. Nous ne suivons pas nos utilisateurs, et notre site et forums n’ont ni pubs ni analytics tiers.

    Sleek & Feature Rich
    - Les fonctions que vous attendez d’un client BitTorrent avec une interface facile à utiliser : protection de la vie privée, interface web, communication complète entre pairs, édition de trackers, limites de vitesse et plus.
  upgradeDescription: |
    Mise à niveau de Transmission vers la version 4.1.2 (2025-06-02)
    Changements de configuration : répertoire de téléchargement unifié et niveau d’auth de l’entrée.
    - Chemin de montage par défaut du Home Directory Olares changé en /olares/userdata/home
    - Ajout du montage Olares External Directory vers /olares/userdata/external
    - Conservation du montage legacy /downloads pour les configurations existantes
    - Chemins de téléchargement par défaut définis via settings.json pour les nouvelles installations : Home/Downloads/transmission
    - Niveau d’auth de l’entrée passé à internal
    - Image du conteneur passée à linuxserver/transmission

    Points forts de la mise à niveau :
    - [Highlights] Correction d’un bug 4.1.0 pouvant provoquer des announces HTTP en double vers les trackers
    - [All Platforms] Correction des téléchargements bloqués à 99 % ; correction de la régression de connexion peer TCP de 4.1.0 ; la mise à niveau n’écrase plus utp_enabled/tcp_enabled ; rejet des données benc invalides ; protections HTTP anti-clickjacking ; assainissement UTF-8 des noms de clients peer
    - [Web Client] Correction de l’affichage des horodatages dans les menus ; correction du statut torrent incorrect après reconnexion
    - [Qt/GTK] Correction des plantages et problèmes de migration des réglages de 4.1.0
    - [macOS] Correction d’une fuite mémoire 4.1.0 ; amélioration de l’usage CPU de l’UI

    Notes de version complètes : https://github.com/transmission/transmission/releases/tag/4.1.2
