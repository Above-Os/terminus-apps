metadata:
  title: Transmission
  description: Transmission はクロスプラットフォームの BitTorrent クライアントです
spec:
  fullDescription: |
    Transmission は高速・簡単・無料の BitTorrent クライアントです。

    **機能**
    Easy & Powerful
    - Transmission は簡単かつ強力な利用のために設計されています。デフォルト設定ですぐ使え、ウォッチディレクトリ、悪いピアのブロックリスト、Web インターフェースなどの高度な機能も数クリックで設定できます。

    Native for Your System
    - 多くのクロスプラットフォームアプリと異なり、Transmission は OS とシームレスに統合されます。

    Lightweight & Lightning Fast
    - Transmission は主要 BitTorrent クライアントの中でもメモリ／リソース使用量が最も少ない部類です。この軽さがホーム NAS やメディアサーバーに適している理由の一つです。

    Open Source & Privacy Focused
    - 一部の BitTorrent クライアントと異なり、Transmission は収益のためにユーザーを弄びません。ツールバー、ポップアップ広告、Flash 広告、Twitter ツールなどは同梱しません。有料版のために機能を隠しません。ソースコードは誰でもレビューできます。ユーザーを追跡せず、サイトやフォーラムにも第三者広告や分析はありません。

    Sleek & Feature Rich
    - BitTorrent クライアントに求める機能を、使いやすい UI で提供。プライバシー保護、Web インターフェース、完全なピア通信、トラッカー編集、速度制限など。
  upgradeDescription: |
    transmission を 4.1.2 から 4.1.4 に更新します。リリースノートに記載された改善と不具合修正を含みます。

    リリースノート: https://github.com/transmission/transmission/releases/tag/4.1.4
