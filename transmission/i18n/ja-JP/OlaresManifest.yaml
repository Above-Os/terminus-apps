metadata:
  title: Transmission
  description: Transmission はクロスプラットフォームの BitTorrent クライアントです
spec:
  fullDescription: |
    Transmission は高速・簡単・無料の BitTorrent クライアントです。

    **機能**
    Easy & Powerful
    - Transmission は簡単かつ強力な利用のために設計されています。デフォルト設定ですぐ使え、ウォッチディレクトリ、悪いピアのブロックリスト、Web インターフェースなどの高度な機能も数クリックで設定できます。

    Native for Your System
    - 多くのクロスプラットフォームアプリと異なり、Transmission は OS とシームレスに統合されます。

    Lightweight & Lightning Fast
    - Transmission は主要 BitTorrent クライアントの中でもメモリ／リソース使用量が最も少ない部類です。この軽さがホーム NAS やメディアサーバーに適している理由の一つです。

    Open Source & Privacy Focused
    - 一部の BitTorrent クライアントと異なり、Transmission は収益のためにユーザーを弄びません。ツールバー、ポップアップ広告、Flash 広告、Twitter ツールなどは同梱しません。有料版のために機能を隠しません。ソースコードは誰でもレビューできます。ユーザーを追跡せず、サイトやフォーラムにも第三者広告や分析はありません。

    Sleek & Feature Rich
    - BitTorrent クライアントに求める機能を、使いやすい UI で提供。プライバシー保護、Web インターフェース、完全なピア通信、トラッカー編集、速度制限など。
  upgradeDescription: |
    Transmission をバージョン 4.1.2（2025-06-02）へアップグレード
    設定変更: ダウンロードディレクトリの統一と入口の認証レベル。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - Olares External Directory のマウントパス /olares/userdata/external を追加
    - 既存設定向けにレガシーの /downloads マウントを維持
    - 新規インストール向けに settings.json 経由でデフォルトダウンロードパスを設定: Home/Downloads/transmission
    - 入口の認証レベルを internal に変更
    - コンテナイメージを linuxserver/transmission に切り替え

    アップグレードのハイライト:
    - [Highlights] トラッカーへの重複 HTTP announce を引き起こし得た 4.1.0 のバグを修正
    - [All Platforms] 99% で止まるダウンロードを修正; 4.1.0 の TCP ピア接続リグレッションを修正; アップグレードで utp_enabled/tcp_enabled を上書きしないよう修正; 無効な benc データを拒否; HTTP クリックジャッキング対策を追加; UTF-8 ピアクライアント名のサニタイズ
    - [Web Client] ドロップダウンのタイムスタンプ表示を修正; 再接続後の誤ったトレント状態を修正
    - [Qt/GTK] 4.1.0 のクラッシュと設定移行の問題を修正
    - [macOS] 4.1.0 のメモリリークを修正; UI の CPU 使用を改善

    完全なリリースノート: https://github.com/transmission/transmission/releases/tag/4.1.2
