metadata:
  title: Transmission
  description: Transmission ist ein plattformübergreifender BitTorrent-Client
spec:
  fullDescription: |
    Transmission ist ein schneller, einfacher und kostenloser BitTorrent-Client.

    **Funktionen**
    Easy & Powerful
    - Transmission ist für einfache, leistungsstarke Nutzung ausgelegt. Die Standardwerte funktionieren einfach, und mit wenigen Klicks konfigurieren Sie erweiterte Funktionen wie Überwachungsverzeichnisse, Bad-Peer-Blocklisten und die Weboberfläche.

    Native for Your System
    - Anders als viele Cross-Platform-Anwendungen integriert sich Transmission nahtlos in Ihr Betriebssystem.

    Lightweight & Lightning Fast
    - Transmission hat einen der niedrigsten Speicher- und Ressourcenbedarfe unter den großen BitTorrent-Clients. Dieser geringe Overhead macht Transmission besonders geeignet für Home-NAS und Medienserver.

    Open Source & Privacy Focused
    - Anders als manche BitTorrent-Clients spielt Transmission keine Spiele mit Nutzern, um Geld zu verdienen: Keine Toolbars, Popup-Werbung, Flash-Ads, Twitter-Tools oder Ähnliches. Es hält keine Funktionen für eine Bezahlversion zurück. Der Quellcode ist für jeden einsehbar. Wir tracken unsere Nutzer nicht, und unsere Website sowie Foren haben keine Drittanbieter-Werbung oder Analytics.

    Sleek & Feature Rich
    - Die Funktionen, die Sie von einem BitTorrent-Client erwarten, mit einer benutzerfreundlichen Oberfläche: Privatsphärenschutz, Weboberfläche, volle Peer-Kommunikation, Tracker-Bearbeitung, Geschwindigkeitslimits und mehr.
  upgradeDescription: |
    Upgrade von Transmission auf Version 4.1.2 (2025-06-02)
    Konfigurationsänderungen: einheitliches Download-Verzeichnis & Entrance-Auth-Level.
    - Standard-Mountpfad des Olares Home Directory auf /olares/userdata/home geändert
    - Olares External Directory Mountpfad /olares/userdata/external hinzugefügt
    - Legacy-Mount /downloads für bestehende Konfigurationen beibehalten
    - Standard-Downloadpfade über settings.json für Neuinstallationen gesetzt: Home/Downloads/transmission
    - Entrance-Auth-Level auf internal geändert
    - Container-Image auf linuxserver/transmission umgestellt

    Upgrade-Highlights:
    - [Highlights] Bug in 4.1.0 behoben, der doppelte HTTP-Announces an Tracker verursachen konnte
    - [All Platforms] Downloads bei 99 % stecken geblieben behoben; TCP-Peer-Verbindungsregression aus 4.1.0 behoben; Upgrade überschreibt utp_enabled/tcp_enabled nicht mehr; ungültige benc-Daten abgelehnt; HTTP-Clickjacking-Schutz hinzugefügt; UTF-8-Peer-Clientnamen bereinigt
    - [Web Client] Zeitstempelanzeige in Dropdowns behoben; falscher Torrent-Status nach Reconnect behoben
    - [Qt/GTK] Abstürze und Migrationsprobleme der Einstellungen aus 4.1.0 behoben
    - [macOS] Memory Leak aus 4.1.0 behoben; UI-CPU-Nutzung verbessert

    Vollständige Release Notes: https://github.com/transmission/transmission/releases/tag/4.1.2
