metadata:
  title: redroid
  description: Remote-Android, una soluzione Android in Cloud multi-arch con GPU.
spec:
  fullDescription: |
    redroid (Remote anDroid) è una soluzione AIC (Android In Cloud) accelerata da GPU. Puoi avviare molte istanze su un host Linux (Docker, podman, k8s, ecc.).
    redroid supporta le architetture arm64 e amd64. redroid è adatto per Cloud Gaming, telefoni virtualizzati, test di automazione e altro.

    Questa versione usa Android 12.
