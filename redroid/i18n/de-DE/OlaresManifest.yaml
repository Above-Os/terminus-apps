metadata:
  title: redroid
  description: Remote-Android – eine multi-arch, GPU-fähige Android-in-Cloud-Lösung
spec:
  fullDescription: |
    redroid (Remote anDroid) ist eine GPU-beschleunigte AIC-Lösung (Android In Cloud). Sie können viele Instanzen auf einem Linux-Host starten (Docker, podman, k8s usw.).
    redroid unterstützt sowohl arm64- als auch amd64-Architekturen. redroid eignet sich für Cloud Gaming, virtualisierte Telefone, Automatisierungstests und mehr.

    Diese Version verwendet Android 12.
