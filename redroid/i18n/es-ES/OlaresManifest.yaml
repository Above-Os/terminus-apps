metadata:
  title: redroid
  description: Remote-Android, una solución Android en la nube multiarquitectura con GPU.
spec:
  fullDescription: |
    redroid (Remote anDroid) es una solución AIC (Android In Cloud) acelerada por GPU. Puede iniciar muchas instancias en un host Linux (Docker, podman, k8s, etc.).
    redroid admite arquitecturas arm64 y amd64. redroid es adecuado para Cloud Gaming, teléfonos virtualizados, pruebas de automatización y más.

    Esta versión usa Android 12.
