metadata:
  title: redroid
  description: Remote-Android, une solution Android in Cloud multi-arch avec GPU
spec:
  fullDescription: |
    redroid (Remote anDroid) est une solution AIC (Android In Cloud) accélérée par GPU. Vous pouvez démarrer de nombreuses instances sur un hôte Linux (Docker, podman, k8s, etc.).
    redroid prend en charge les architectures arm64 et amd64. redroid convient au Cloud Gaming, aux téléphones virtualisés, aux tests d'automatisation et plus encore.

    Cette version utilise Android 12.
