metadata:
  title: redroid
  description: Remote-Android — マルチアーキテクチャ対応の GPU 対応 Android in Cloud ソリューション
spec:
  fullDescription: |
    redroid（Remote anDroid）は GPU 加速の AIC（Android In Cloud）ソリューションです。Linux ホスト（Docker、podman、k8s など）上で多数のインスタンスを起動できます。
    redroid は arm64 と amd64 の両方のアーキテクチャをサポートします。Cloud Gaming、仮想スマートフォン、自動テストなどに適しています。

    このバージョンは Android 12 を使用します。
