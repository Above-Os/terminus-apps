metadata:
  title: Presenton
  description: Crea presentaciones editables con IA y expórtalas a PowerPoint o PDF
spec:
  fullDescription: 'Presenton crea presentaciones a partir de instrucciones o documentos, con diapositivas editables y exportación a PowerPoint o PDF. Elige una plantilla, revisa el esquema y ajusta el resultado antes de exportarlo.


    La aplicación utiliza AI Router default-chat para generar texto. La generación de imágenes está desactivada en este paquete, por lo que el flujo básico no requiere credenciales adicionales para un modelo de imágenes.


    Los registros de las presentaciones utilizan Olares PostgreSQL. Los documentos subidos, los recursos y los archivos exportados se conservan en el almacenamiento de la aplicación. Este paquete fija mediante su digest la imagen de contenedor 0.9.12-beta del proyecto original; revisa el contenido generado y el diseño antes de compartirlos.'
