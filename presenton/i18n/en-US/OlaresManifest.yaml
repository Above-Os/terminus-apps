metadata:
  title: Presenton
  description: Create editable presentations with AI and export PowerPoint or PDF
spec:
  fullDescription: 'Presenton creates presentations from prompts or documents, with editable slides and PowerPoint or PDF export. Select a template, review the outline and refine the result before exporting.


    The application uses AI Router default-chat for text generation. Image generation is disabled in this package, so no separate image-model credentials are needed for the basic workflow.


    Presentation records use Olares PostgreSQL. Uploaded documents, assets and exported files persist in application storage. This package pins the upstream 0.9.12-beta container image by digest; review generated content and layout before sharing.'
