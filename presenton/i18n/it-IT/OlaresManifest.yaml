metadata:
  title: Presenton
  description: Crea presentazioni modificabili con IA ed esportale in PowerPoint o PDF
spec:
  fullDescription: 'Presenton crea presentazioni a partire da prompt o documenti, con diapositive modificabili ed esportazione in PowerPoint o PDF. Scegli un modello, controlla la struttura e perfeziona il risultato prima di esportarlo.


    L’applicazione utilizza AI Router default-chat per generare il testo. La generazione di immagini è disattivata in questo pacchetto, quindi il flusso di base non richiede credenziali separate per un modello di immagini.


    I dati delle presentazioni utilizzano Olares PostgreSQL. I documenti caricati, le risorse e i file esportati vengono conservati nello spazio di archiviazione dell’applicazione. Questo pacchetto fissa tramite digest l’immagine di container 0.9.12-beta del progetto originale; controlla il contenuto generato e l’impaginazione prima di condividerli.'
