metadata:
  title: Presenton
  description: Bearbeitbare Präsentationen mit KI erstellen und als PowerPoint oder PDF exportieren
spec:
  fullDescription: 'Presenton erstellt Präsentationen aus Eingabeaufforderungen oder Dokumenten, mit bearbeitbaren Folien und Export als PowerPoint oder PDF. Wählen Sie eine Vorlage, prüfen Sie die Gliederung und überarbeiten Sie das Ergebnis vor dem Export.


    Die Anwendung nutzt AI Router default-chat zur Texterstellung. Die Bilderzeugung ist in diesem Paket deaktiviert, sodass für den grundlegenden Ablauf keine separaten Zugangsdaten für ein Bildmodell erforderlich sind.


    Präsentationsdaten verwenden Olares PostgreSQL. Hochgeladene Dokumente, Medien und exportierte Dateien bleiben im Anwendungsspeicher erhalten. Dieses Paket fixiert das Upstream-Container-Image 0.9.12-beta anhand seines Digests. Prüfen Sie generierte Inhalte und das Layout, bevor Sie sie teilen.'
