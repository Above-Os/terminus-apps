metadata:
  title: Presenton
  description: Créer des présentations modifiables avec l’IA et les exporter en PowerPoint ou PDF
spec:
  fullDescription: 'Presenton crée des présentations à partir d’instructions ou de documents, avec des diapositives modifiables et une exportation en PowerPoint ou PDF. Choisissez un modèle, vérifiez le plan et affinez le résultat avant de l’exporter.


    L’application utilise AI Router default-chat pour générer le texte. La génération d’images est désactivée dans ce paquet : le flux de base ne nécessite donc pas d’identifiants distincts pour un modèle d’images.


    Les données des présentations utilisent Olares PostgreSQL. Les documents importés, les ressources et les fichiers exportés sont conservés dans le stockage de l’application. Ce paquet fixe l’image de conteneur amont 0.9.12-beta à l’aide de son empreinte ; vérifiez le contenu généré et la mise en page avant de les partager.'
