metadata:
  title: Presenton
  description: AIで編集可能なプレゼンテーションを作成し、PowerPointやPDFに出力
spec:
  fullDescription: 'Presentonはプロンプトやドキュメントからプレゼンテーションを作成し、スライドの編集とPowerPointまたはPDFへのエクスポートに対応します。テンプレートを選び、アウトラインを確認して、結果を調整してからエクスポートします。


    テキスト生成にはAI Routerのdefault-chatを使用します。このパッケージでは画像生成が無効になっているため、基本的な手順に画像モデル用の認証情報を別途用意する必要はありません。


    プレゼンテーションの記録にはOlares PostgreSQLを使用します。アップロードしたドキュメント、素材、エクスポートしたファイルはアプリのストレージに保持されます。このパッケージは上流の0.9.12-betaコンテナイメージをダイジェストで固定しています。共有する前に、生成された内容とレイアウトを確認してください。'
