image: docker.io/beclab/mins:0.4.5
imagePullPolicy: IfNotPresent

bfl:
  username: owner

postgres:
  host: postgres
  port: 5432
  username: mins
  password: mins
  databases:
    mins: mins

userspace:
  appData: /tmp/mins

workloads:
  mins:
    replicaCount: 1

# One GPU consumer, because Olares time-slices the accelerator across the
# audio model applications: a second concurrent stage would contend for VRAM
# rather than finish sooner.
workers:
  cpu: 3
  gpu: 1
