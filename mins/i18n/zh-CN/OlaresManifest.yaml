metadata:
  title: Mins
  description: 会议录音转文字稿，带说话人、词级时间和纪要

spec:
  fullDescription: |
    ## 这是什么
    Mins 把一段录音变成能读的文字稿：谁在说、每个词说在哪一秒、
    换成另一种语言是什么意思、这场会议定下了什么。

    所有模型调用都经 Olares Router 走到这台 Olares 上装好的音频模型
    应用——不发给第三方，也不用填任何密钥。

    ## 处理流程
    1. 抽取并归一化音轨（ffmpeg），再切块
    2. 说话人分离——谁在什么时候说
    3. 语音识别——按说话人分段转写
    4. 强制对齐——词级时间戳
    5. 经对话模型做翻译和纪要

    ## 运行要求
    - Olares >= 1.12.6
    - 已安装并运行 Router
    - 说话人分离、语音识别、强制对齐三类音频模型应用，以及一个用于
      翻译和纪要的对话模型
    - 架构：amd64、arm64
