metadata:
  title: Metabase
  description: 誰もがデータで働ける Business Intelligence および組み込み分析ツール
spec:
  fullDescription: |
    Metabase は、会社の誰もが質問し、データから学べる簡単でオープンソースな方法です。
    
    機能
    5 分でセットアップ（本当です）。
    チームの誰でも SQL を知らなくても質問できます。
    より複雑なクエリには SQL エディターを使用。
    フィルター、自動更新、フルスクリーン、カスタムクリック動作付きの美しいインタラクティブダッシュボードを構築。
    生テーブルを整理・注釈付け・結合するモデルを作成。
    チームが使う正規のセグメントとメトリクスを定義。
    ダッシュボード購読でスケジュールに従って Slack やメールにデータを送信。
    データが変わったときに Metabase が通知するアラートを設定。
    チャートやダッシュボードをアプリに埋め込み、あるいは Metabase 全体を埋め込み。
