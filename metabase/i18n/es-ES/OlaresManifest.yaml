metadata:
  title: Metabase
  description: Herramienta de Business Intelligence y analítica embebida para que todos trabajen con datos
spec:
  fullDescription: |
    Metabase es la forma fácil y de código abierto para que todos en tu empresa hagan preguntas y aprendan de los datos.
    
    Funciones
    Configúralo en cinco minutos (no es broma).
    Permite que cualquiera de tu equipo haga preguntas sin saber SQL.
    Usa el editor SQL para consultas más complejas.
    Crea dashboards atractivos e interactivos con filtros, actualización automática, pantalla completa y comportamiento de clic personalizado.
    Crea modelos que limpien, anoten y/o combinen tablas en bruto.
    Define segmentos y métricas canónicos para que los use tu equipo.
    Envía datos a Slack o correo según programación con suscripciones de dashboard.
    Configura alertas para que Metabase te avise cuando cambien tus datos.
    Incrusta gráficos y dashboards en tu app, o incluso todo Metabase.
