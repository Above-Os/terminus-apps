metadata:
  title: Metabase
  description: "Outil de Business Intelligence et d'analytique embarquée pour que chacun travaille avec les données"
spec:
  fullDescription: |
    Metabase est le moyen simple et open source pour que chacun dans votre entreprise pose des questions et apprenne des données.
    
    Fonctionnalités
    Mise en place en cinq minutes (on ne plaisante pas).
    Laissez n'importe qui dans votre équipe poser des questions sans connaître SQL.
    Utilisez l'éditeur SQL pour des requêtes plus complexes.
    Créez de beaux tableaux de bord interactifs avec filtres, actualisation automatique, plein écran et comportement de clic personnalisé.
    Créez des modèles qui nettoient, annotent et/ou combinent des tables brutes.
    Définissez des segments et métriques canoniques pour votre équipe.
    Envoyez des données vers Slack ou e-mail selon un planning avec les abonnements aux tableaux de bord.
    Configurez des alertes pour que Metabase vous notifie lorsque vos données changent.
    Intégrez graphiques et tableaux de bord dans votre app, ou même tout Metabase.
