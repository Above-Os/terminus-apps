metadata:
  title: NocoDB
  description: Alternativa open source ad Airtable
spec:
  fullDescription: |
    NocoDB consente di creare soluzioni database no-code con la semplicità dei fogli di calcolo.
    
    NocoDB offre un'interfaccia intuitiva a foglio di calcolo per creare database online, da zero o collegandosi a database. Puoi trasformare qualsiasi MySQL, PostgreSQL, SQL Server, SQLite e MariaDB in un foglio di calcolo intelligente e accedere ai dati tramite UI interattive come Kanban, Form e Gallery, oppure via API e SQL.
    
    
    Funzioni
    
    * Ricca interfaccia a foglio di calcolo con più viste e tipi di cella variati.
    
    * Condividi base / viste con il team.
    
    * Controllo accessi a grana fine a diversi livelli.
    
    * Collegati senza attriti a chat, email e storage per le automazioni di workflow.
    
    * Invoca azioni in modo programmatico con REST API o NocoDB SDK.
    
    * Sincronizza le modifiche allo schema fuori dalla GUI di NocoDB.
    
    * Tutti i log delle operazioni utente sono conservati in Audit.
  upgradeDescription: |
    Aggiorna nocodb da 2026.09.0 a 2026.10.1. Include i miglioramenti e le correzioni descritti nelle note di rilascio.

    Note di rilascio: https://github.com/nocodb/nocodb/releases/tag/2026.10.1
