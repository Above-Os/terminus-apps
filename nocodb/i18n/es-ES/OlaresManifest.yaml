metadata:
  title: NocoDB
  description: Alternativa open source a Airtable
spec:
  fullDescription: |
    NocoDB permite construir soluciones de base de datos no-code con la facilidad de las hojas de cálculo.
    
    NocoDB ofrece una interfaz intuitiva tipo hoja de cálculo para crear bases de datos online, desde cero o conectándose a bases de datos. Puedes convertir cualquier MySQL, PostgreSQL, SQL Server, SQLite y MariaDB en una hoja de cálculo inteligente y acceder a tus datos mediante UIs interactivas como Kanban, Form y Gallery, o vía API y SQL.
    
    
    Funciones
    
    * Rica interfaz de hoja de cálculo con múltiples vistas y tipos de celda variados.
    
    * Compartir bases / vistas con el equipo.
    
    * Control de acceso de grano fino en distintos niveles.
    
    * Conéctate sin fricción a chat, correo y almacenamiento para automatizaciones de flujo de trabajo.
    
    * Invoca acciones de forma programática con REST APIs o el SDK de NocoDB.
    
    * Sincroniza cambios de esquema fuera de la GUI de NocoDB.
    
    * Todos los registros de operaciones de usuario se conservan en Audit.
  upgradeDescription: |
    Actualiza nocodb de 2026.09.0 a 2026.10.1. Incluye las mejoras y correcciones descritas en las notas de versión.

    Notas de versión: https://github.com/nocodb/nocodb/releases/tag/2026.10.1
