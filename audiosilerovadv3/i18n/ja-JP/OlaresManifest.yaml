metadata:
  description: 音声内で発話が始まり終わる位置を検出するモデル
  title: Silero VAD V5

spec:
  upgradeDescription: |
    v1.0.19: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    Silero VAD V5は、録音内で人の発話を含む部分を検出します。発話の開始と終了を示すため、アプリは無音区間を省いたり、録音を発話単位に分割したりできます。

    **主な機能**
    - 発話を無音やその他の音から区別します。
    - 発話を含む時間範囲を返します。
    - リクエストごとに検出しきい値と区間のタイミングを調整します。
    - 文字起こしと話者ダイアライゼーションの前処理を支援します。

    このモデルはCPUで動作し、GPUを必要としません。
