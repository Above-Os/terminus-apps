metadata:
  description: "Silero VAD v5 for voice activity detection."
  title: Silero VAD V5

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    Silero VAD v5 for voice activity detection.

    **Configuration**
    - Model: `onnx-community/silero-vad`
    - Source: `hf://onnx-community/silero-vad`
    - Capabilities: `vad`
    - Required GPU memory: `0`
    - Engine: Silero VAD (pyannote runtime)

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
