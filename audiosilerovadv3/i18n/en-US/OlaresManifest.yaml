metadata:
  description: A model for finding where speech starts and stops in audio
  title: Silero VAD V5

spec:
  upgradeDescription: |
    v1.0.19: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.
  fullDescription: |
    Silero VAD V5 finds the parts of an audio recording that contain human speech. It marks when speech starts and stops so applications can skip silence or divide a recording into speech segments.

    **Key features**
    - Distinguish speech from silence and non-speech audio.
    - Return the time ranges that contain speech.
    - Adjust detection thresholds and segment timing for each request.
    - Support transcription and diarization preprocessing.

    The model runs on the CPU and does not require a GPU.
