metadata:
  description: "用于语音活动检测的 Silero VAD v5 模型。"
  title: Silero VAD V5

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    用于语音活动检测的 Silero VAD v5 模型。

    **配置**
    - 模型：`onnx-community/silero-vad`
    - 来源：`hf://onnx-community/silero-vad`
    - 能力：`vad`
    - 计算模式：仅 CPU（GPU 显存为 `0`）
    - 引擎：Silero VAD（pyannote 运行时）
    - 引擎参数：无；此 VAD 引擎不读取 `ENGINE_ARGS`。请在每次请求中调整
      `threshold`、`min_silence_ms`、`speech_pad_ms`、`min_speech_ms` 和 `max_speech_s`。

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
