metadata:
  description: "Silero VAD v5 for voice activity detection (review submission)."
  title: Silero VAD V5

spec:
  fullDescription: |
    **模型概览**
    Silero VAD v5 for voice activity detection (review submission).

    **预设配置**
    - 模型：`silero-v5`
    - 来源：`hf://onnx-community/silero-vad`
    - 能力：`vad`
    - GPU 显存：`0`
    - 引擎：Silero VAD (pyannote runtime)

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
