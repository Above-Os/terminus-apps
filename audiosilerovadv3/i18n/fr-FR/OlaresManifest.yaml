metadata:
  description: Un modèle qui repère le début et la fin de la parole dans un enregistrement
  title: Silero VAD V5

spec:
  upgradeDescription: |
    v1.0.19: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    Silero VAD V5 repère les parties d'un enregistrement qui contiennent de la parole. Il indique leur début et leur fin afin que les applications puissent ignorer les silences ou diviser l'enregistrement en segments parlés.

    **Fonctionnalités principales**
    - Distinguer la parole du silence et des autres sons.
    - Renvoyer les intervalles qui contiennent de la parole.
    - Régler les seuils de détection et la durée des segments pour chaque requête.
    - Préparer l'audio pour la transcription et la diarisation.

    Le modèle fonctionne sur le CPU et ne nécessite pas de GPU.
