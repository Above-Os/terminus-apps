metadata:
  description: Un modello per individuare l'inizio e la fine del parlato nell'audio
  title: Silero VAD V5

spec:
  onlyAdmin: true
  fullDescription: |
    Silero VAD V5 individua le parti di una registrazione che contengono voce umana. Segna l'inizio e la fine del parlato, permettendo alle applicazioni di ignorare il silenzio o dividere una registrazione in segmenti vocali.

    **Funzionalità principali**
    - Distinguere il parlato dal silenzio e dagli altri suoni.
    - Restituire gli intervalli temporali che contengono parlato.
    - Regolare soglie di rilevamento e tempi dei segmenti per ogni richiesta.
    - Supportare la preparazione dell'audio per trascrizione e diarizzazione.

    Il modello funziona sulla CPU e non richiede una GPU.
  upgradeDescription: |
    v1.0.9: Dichiarata l'esecuzione sulla sola CPU, allineate le risorse e aggiornato il motore audio alla versione v1.1.2.
