  runtime-pin-inventory.py: |
    """Inspect resolved runtime metadata only; never import torch or load models."""
    import argparse
    import hashlib
    import importlib.metadata as metadata
    import importlib.util
    import json
    from pathlib import Path
    import sys
    
    
    def main():
        parser = argparse.ArgumentParser()
        parser.add_argument('--root', type=Path, required=True)
        parser.add_argument('--profile', choices=['frontend', 'youdao-asr', 'ming-frozen'], required=True)
        parser.add_argument('--roots-json', required=True)
        args = parser.parse_args()
        if args.profile == 'ming-frozen':
            sys.path[:0] = [str(args.root / 'envs/ming-overlay'), str(args.root / 'sources/Ming-frozen')]
        from packaging.utils import canonicalize_name
        from packaging.requirements import Requirement
        packages = {}
        distributions = {}
        for distribution in metadata.distributions():
            name = canonicalize_name(distribution.metadata['Name'])
            if name in packages:
                continue
            distributions[name] = distribution
            raw = distribution.read_text('METADATA') or ''
            packages[name] = {'version': distribution.version, 'path': str(distribution._path),
                              'requires_dist': distribution.requires or [],
                              'metadata_sha256': hashlib.sha256(raw.encode()).hexdigest()}
        origins = {}
        for name in ['torch', 'torchaudio', 'transformers', 'tokenizers', 'numpy', 'soundfile',
                     'soxr', 'pydantic', 'regex', 'diffusers', 'x_transformers', 'onnxruntime']:
            spec = importlib.util.find_spec(name)
            origins[name] = spec.origin if spec else None
        pending = [('runtime-root', Requirement(value)) for value in json.loads(args.roots_json)]
        visited = set()
        closure = {}
        missing = []
        conflicts = []
        while pending:
            parent, requirement = pending.pop(0)
            name = canonicalize_name(requirement.name)
            distribution = distributions.get(name)
            if not distribution:
                missing.append({'parent': parent, 'requirement': str(requirement)})
                continue
            if distribution.version not in requirement.specifier:
                conflicts.append({'parent': parent, 'requirement': str(requirement),
                                  'installed': distribution.version})
            closure[name] = distribution.version
            key = (name, tuple(sorted(requirement.extras)))
            if key in visited:
                continue
            visited.add(key)
            for raw in distribution.requires or []:
                child = Requirement(raw)
                if child.marker and not any(child.marker.evaluate({'extra': value})
                                            for value in ['', *requirement.extras]):
                    continue
                pending.append((name, child))
        print(json.dumps({'profile': args.profile, 'python': sys.version.split()[0],
                          'executable': sys.executable, 'packages': packages, 'origins': origins,
                          'active_dependency_closure': closure, 'uninstalled_dependencies': missing,
                          'requirement_conflicts': conflicts,
                          'model_runtime_imported': False, 'model_inference_started': False}))
    
    
    if __name__ == '__main__':
        main()
  collect-runtime-metadata.py: |
    """Read small actual service configurations after a Chart timing cohort."""
    import argparse
    import hashlib
    import json
    from pathlib import Path
    import re
    
    
    def main():
        parser = argparse.ArgumentParser()
        parser.add_argument('--family', choices=['tencent', 'youdao'], required=True)
        parser.add_argument('--role', choices=['s2st', 's2t'], required=True)
        args = parser.parse_args()
        root = Path('/data/s2st/runs')
        pattern = re.compile('service-' + args.family + r'-(\d+)$')
        candidates = [(int(m[1]), path) for path in root.iterdir() if path.is_dir() and (m := pattern.fullmatch(path.name))]
        if not candidates:
            raise RuntimeError('No actual owned Chart service directory')
        service = max(candidates)[1]
        names = ['configuration.json', 'youdao-configuration.json', 'actual-ASR-capacity.json',
                 'frontend-command.json', 'config.toml', 'app-runtime/resident-backend/configuration.json',
                 'app-runtime/transport-receipt.json', 'ming-cache/device-audit.json']
        files = {}
        for name in names:
            path = service / name
            if not path.exists():
                continue
            raw = path.read_bytes()
            if len(raw) > 1024 ** 2 or b'\0' in raw:
                raise RuntimeError('Not a small textual service receipt')
            files[name] = {'sha256': hashlib.sha256(raw).hexdigest(), 'raw_text': raw.decode('utf-8')}
        command_file = 'app-runtime/resident-backend/configuration.json' if args.family == 'tencent' else 'youdao-configuration.json'
        value = json.loads(files[command_file]['raw_text'])
        server = value.get('command') if args.family == 'tencent' else value.get('commands', {}).get('mt')
        if not server:
            raise RuntimeError('Actual upstream model server command is missing')
        if args.role == 's2st':
            audit = json.loads(files['ming-cache/device-audit.json']['raw_text'])
            if audit['speaker_providers'][0] != 'CUDAExecutionProvider' or audit['speaker_cpu_weighted_node_executions'] != 0 or audit['speaker_weighted_node_executions'] <= 0:
                raise RuntimeError('Actual MING neural GPU placement is not proven')
        print(json.dumps({'state': 'actual_Chart_runtime_metadata_retained', 'family': args.family,
            'role': args.role, 'service_directory': str(service), 'server_args': server, 'files': files,
            'scope': 'Selectedsmallactualconfigurationandauditfilesaftertiming; nomedia,weights,tracesormodelchanges.'}))
    
    
    if __name__ == '__main__':
        main()
  prepare-warmup.py: |
    """Prepare the exact excluded warm-up prefix from its pinned public source."""
    import argparse
    import hashlib
    import json
    from pathlib import Path
    import tempfile
    import urllib.request
    import wave
    
    import numpy as np
    
    
    def valid(path, recipe):
        if not path.is_file():
            return False
        with wave.open(str(path), 'rb') as reader:
            if (reader.getframerate(), reader.getnchannels(), reader.getsampwidth(), reader.getnframes()) != (16000, 1, 2, 160000):
                return False
            return hashlib.sha256(reader.readframes(160000)).hexdigest() == recipe['expected_PCM_SHA256']
    
    
    def prepare(recipe, output):
        output.mkdir(parents=True, exist_ok=True)
        target = output / recipe['target_file']
        if valid(target, recipe):
            return 'verified_existing_prefix'
        with tempfile.TemporaryDirectory(prefix='warmup-source-', dir=output) as directory:
            raw = Path(directory) / 'public-original.wav'
            digest = hashlib.sha256()
            total = 0
            with urllib.request.urlopen(recipe['source_url'], timeout=90) as response, raw.open('wb') as writer:
                while block := response.read(1024 * 1024):
                    total += len(block)
                    if total > recipe['source_bytes']:
                        raise RuntimeError('Public warm-up source exceeds its immutable size')
                    digest.update(block)
                    writer.write(block)
            if total != recipe['source_bytes'] or digest.hexdigest() != recipe['source_sha256']:
                raise RuntimeError('Public warm-up source hash differs')
            with wave.open(str(raw), 'rb') as reader:
                if (reader.getframerate(), reader.getnchannels(), reader.getsampwidth()) != (16000, 2, 2):
                    raise RuntimeError('Pinned public source format differs')
                stereo = np.frombuffer(reader.readframes(160000), dtype='<i2').reshape(-1, 2)
            # Recovered from the actual frozen input, not a guessed ffmpeg mix:
            # all160000 samples match both hosts' baseline prefixes exactly.
