# Engine-container shell: source the helpers llm-init publishes, wait for the download sentinel, then run the baked wrapper under supervise_engine so Model Console can relaunch the engine without restarting the Pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-wrappers
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: audio-engine
data:
  s2st.sh: |
    #!/bin/sh
    set -eu

    ENGINE=s2st
    # Source the shared helpers llm-init publishes into RUN_DIR. That copy can arrive late - the two containers are separate Deployments with no ordering between them - so waiting here is the normal path.
    WRAPPER_COMMON=${WRAPPER_COMMON:-"$(dirname "$0")/common.sh"}
    # Shared storage can briefly report a file that cannot yet be opened.
    _common_copy=$(mktemp "${TMPDIR:-/tmp}/llm-common.XXXXXX")
    _wc=0
    while ! cp "$WRAPPER_COMMON" "$_common_copy" 2>/dev/null; do
        if [ "$_wc" -ge "${WRAPPER_COMMON_WAIT:-3600}" ]; then
            rm -f "$_common_copy"
            printf '[wrapper] %s could not be read\n' "$WRAPPER_COMMON" >&2
            exit 1
        fi
        printf '[wrapper] waiting for %s (elapsed=%ss)\n' "$WRAPPER_COMMON" "$_wc"
        sleep 5
        _wc=$((_wc + 5))
    done
    . "$_common_copy"
    rm -f "$_common_copy"
    unset _wc _common_copy

    wait_for_sentinel

    export HF_HUB_OFFLINE=1
    export PYTHONUNBUFFERED=1

    /opt/venvs/frontend/bin/python /wrappers/prepare-assets.py --family tencent --lock /wrappers/asset-lock.json
    /opt/venvs/frontend/bin/python /wrappers/prepare-warmup.py --recipe /wrappers/warmup-recipe.json

    run_audio() {
        log "starting engine offline (audio-python -m wrapper.app)"
        exec audio-python -m wrapper.app "$@"
    }

    supervise_engine run_audio "$@"
  prepare-assets.py: |
    """Create checked private symlink views without changing the shared Common cache."""
    import argparse
    import hashlib
    import json
    from pathlib import Path
    import time
    
    
    def digest(path):
        result = hashlib.sha256()
        with path.open('rb') as reader:
            for block in iter(lambda: reader.read(8 * 1024**2), b''):
                result.update(block)
        return result.hexdigest()
    
    
    def prepare(lock, family, cache, output, overrides):
        receipts = []
        for name in lock['families'][family]:
            role = lock['roles'][name]
            snapshot = cache / ('models--' + role['repository'].replace('/', '--')) / 'snapshots' / role['revision']
            destination = output / name
            for relative, expected in role['files'].items():
                source = overrides / expected['override'] if 'override' in expected else snapshot / relative
                if not source.is_file() or source.stat().st_size != expected['bytes'] or digest(source) != expected['sha256']:
                    raise RuntimeError('Common-cache asset differs from the tested profile: ' + name + '/' + relative)
                target = destination / relative
                target.parent.mkdir(parents=True, exist_ok=True)
                if target.is_symlink():
                    if target.resolve() != source.resolve():
                        raise RuntimeError('Private model view points elsewhere: ' + str(target))
                elif target.exists():
                    raise RuntimeError('Refusing to replace a private non-symlink model asset')
                else:
                    target.symlink_to(source)
                receipts.append({'role': name, 'file': relative, 'sha256': expected['sha256'],
                                 'snapshot_revision': role['revision'], 'override': 'override' in expected})
            actual = {str(p.relative_to(destination)) for p in destination.rglob('*') if p.is_file()}
            if actual != set(role['files']):
                raise RuntimeError('Private model view has an unexpected asset')
        output.mkdir(parents=True, exist_ok=True)
        (output / 'asset-receipt.json').write_text(json.dumps({'family': family, 'assets': receipts,
            'Common_cache_modified': False, 'inference_parameters_modified': False}, indent=2) + '\n')
        return receipts
    
    
    if __name__ == '__main__':
        parser = argparse.ArgumentParser()
        parser.add_argument('--family', choices=['tencent', 'youdao'], required=True)
        parser.add_argument('--lock', type=Path, required=True)
        parser.add_argument('--cache', type=Path, default=Path('/cache/hf/hub'))
        parser.add_argument('--output', type=Path, default=Path('/data/s2st/assets'))
        parser.add_argument('--overrides', type=Path, default=Path('/wrappers'))
        args = parser.parse_args()
        lock = json.loads(args.lock.read_text())
        required = []
        for name in lock['families'][args.family]:
            role = lock['roles'][name]
            snapshot = args.cache / ('models--' + role['repository'].replace('/', '--')) / 'snapshots' / role['revision']
            for relative, expected in role['files'].items():
                if 'override' in expected:
                    if not (args.overrides / expected['override']).is_file():
                        raise RuntimeError('Required sealed override is missing: ' + relative)
                else:
                    required.append(snapshot / relative)
        started = time.monotonic()
        while missing := [str(p) for p in required if not p.is_file()]:
            if time.monotonic() - started > 1800:
                raise TimeoutError('Required locked assets have not arrived: ' + repr(missing))
            print(json.dumps({'state': 'waiting_for_required_locked_assets', 'missing_files': missing,
                              'elapsed_seconds': round(time.monotonic() - started)}), flush=True)
            time.sleep(5)
        result = prepare(lock, args.family, args.cache, args.output, args.overrides)
        print(json.dumps({'state': 'tested_assets_verified_private_views_ready', 'files': len(result)}))
