metadata:
  title: "Hy-SimulMT + MING"
  description: "Streaming Chinese-English speech translation"
spec:
  upgradeDescription: "Initial release of Chinese-English speech translation."
  fullDescription: "Chinese-English speech translation combines Hy-SimulMT Q4_K_M with MING 0.5B. Accepts complete WAV files or live 16 kHz PCM and returns translated text and 24 kHz speech. Supports both directions, incremental output and asynchronous tasks. One active session at a time. Neural inference runs on a compatible NVIDIA GPU; reference audio conditions the generated voice."
