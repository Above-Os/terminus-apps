metadata:
  title: FreshRSS
  description: Un agregador de feeds gratuito y autoalojable.
spec:
  fullDescription: |
    FreshRSS es un agregador de feeds RSS y Atom autoalojado. Es ligero, fácil de usar, potente y personalizable.
    
    **Funciones**
    - Control independiente de datos: Admite despliegue autoalojado, permitiendo a los usuarios tener control total sobre sus datos sin depender de terceros, garantizando privacidad y seguridad.
    - Open-Source y actualizaciones estables: Código abierto bajo licencia AGPL 3, con una comunidad activa. Ha mantenido iteraciones y actualizaciones continuas de 2023 a 2024, asegurando una sólida estabilidad.
    - Agregación de contenido multi-fuente: Agrega feeds RSS/Atom de sitios web, podcasts y canales de vídeo. También puede hacer scraping de sitios sin feeds oficiales para generar fuentes de suscripción personalizadas.
    - Gestión eficiente de contenido: Permite buscar y guardar consultas, generar nuevos feeds basados en reglas, y marcar, favoritar y categorizar artículos.
    - Sincronización en tiempo real y migración: Logra sincronización de contenido en tiempo real basada en WebSub, y admite importar/exportar listas de suscripción en formato OPML.
    - Personalización y permisos flexibles: Ofrece personalización de temas y extensiones, así como gestión de permisos multiusuario.
    - Adaptación multi-dispositivo y alta eficiencia: Diseño responsive compatible con ordenadores y móviles, capaz de gestionar eficientemente más de 1 millón de artículos y más de 50.000 feeds.
    - Soporte multiidioma e integración: Admite más de 15 idiomas y proporciona interfaces API para clientes de terceros o sistemas propios.
    - Despliegue de bajo umbral: Bajo umbral de despliegue, compatible con servidores web principales y documentación de instalación detallada, ideal para principiantes.
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    Almacenamiento: el almacenamiento durable se movió de `appCache` a `appData`. En el primer arranque tras la actualización, un initContainer copia el `appCache` legacy a `appData` cuando el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos de appCache se conservan para rollback.
    
    Se elimina el ramificado legacy de rutas appCache `sysVersion >= 1.12.3`; el mínimo de Olares es ahora 1.12.6.
    
    Actualización de la versión de la app a 1.28.1
    
    Esta es una versión centrada en corrección de errores, en particular regresiones de la versión 1.28.0.
    
    **Nuevas funciones seleccionadas:**
    - Nuevo mensaje personalizable para registros cerrados
    - Añadir nombre de usuario en logs de acceso de Apache (también en logs Docker): para GReader API y HTTP Basic Auth desde reverse proxy
    
    **Rendimiento mejorado:**
    - Desactivar el conteo de artículos en etiquetas de usuario para solicitudes Ajax (no usado)
    
    **Correcciones de errores:**
    - Corregida la expansión no deseada de consultas de usuario (búsquedas guardadas) aplicadas a filtros
    - Corregida la codificación de acciones de filtro para etiquetas
    - Corregida la búsqueda de tags
    - Corregida la actualización de feeds con token mientras la actualización anónima está deshabilitada
    - Corregido el acceso RSS y OPML por token
    - Corregido el fallback transliterator_transliterate de MySQL/MariaDB
    - Corregida la regresión con index hint de MySQL/MariaDB
    - Corregido el atajo para el siguiente artículo no leído
    - Corregido session.cookie-lifetime personalizado
    - Corregido el botón del validador de feed al cambiar la URL del feed
    
    Notas completas: https://github.com/FreshRSS/FreshRSS/releases/tag/1.28.1
