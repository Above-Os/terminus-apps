metadata:
  title: FreshRSS
  description: 無料でセルフホスト可能なフィードアグリゲーター
spec:
  fullDescription: |
    FreshRSS はセルフホスト型の RSS / Atom フィードアグリゲーターです。軽量で扱いやすく、強力かつカスタマイズ可能です。
    
    **機能**
    - 独立したデータ管理: セルフホスト展開に対応し、サードパーティに依存せずデータを完全に管理でき、プライバシーとセキュリティを確保。
    - オープンソースと安定した更新: AGPL 3 ライセンスのオープンソースで、活発なコミュニティあり。2023〜2024 年も継続的に更新され、高い安定性を維持。
    - マルチソースのコンテンツ集約: Web サイトの RSS/Atom フィード、ポッドキャスト、動画チャンネルを集約。公式フィードがないサイトもスクレイピングして独自購読源を生成可能。
    - 効率的なコンテンツ管理: 検索とクエリ保存、ルールに基づく新フィード生成、記事のマーク・お気に入り・カテゴリ分けに対応。
    - リアルタイム同期と移行: WebSub に基づくリアルタイム同期、OPML 形式の購読リストのインポート／エクスポートに対応。
    - 柔軟なカスタマイズと権限: テーマと拡張のカスタマイズ、マルチユーザー権限管理を提供。
    - マルチデバイス対応と高効率: PC／スマホ対応のレスポンシブデザインで、100 万件超の記事と 5 万超のフィードを効率管理可能。
    - 多言語対応と統合: 15 以上の言語に対応し、サードパーティクライアントや独自システム向け API を提供。
    - 低い導入ハードル: 主要 Web サーバーと互換で、詳細なインストール文書あり、初心者でも始めやすい。
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    ストレージ: 永続ストレージを `appCache` から `appData` へ移動。アップグレード後の初回起動時、宛先が空なら initContainer がレガシー `appCache` を `appData` にコピー（マーカー: `.migration_from_appcache_done`）。ロールバック用に旧 appCache データは残します。
    
    レガシーな `sysVersion >= 1.12.3` の appCache パス分岐を削除。Olares の最小要件は現在 1.12.6。
    
    アプリバージョンを 1.28.1 へアップグレード
    
    本リリースはバグ修正中心で、特に 1.28.0 のリグレッションに対応します。
    
    **主な新機能:**
    - 登録クローズ時のカスタマイズ可能なメッセージ
    - Apache アクセスログ（Docker ログにも）へユーザー名を追加: GReader API およびリバースプロキシからの HTTP Basic Auth 用
    
    **パフォーマンス改善:**
    - Ajax リクエストでのユーザーラベル記事カウントを無効化（未使用）
    
    **バグ修正:**
    - フィルターに適用されたユーザークエリ（保存検索）の不要な展開を修正
    - ラベル向けフィルターアクションのエンコーディングを修正
    - タグ検索を修正
    - 匿名リフレッシュ無効時のトークン付きフィード更新を修正
    - トークンによる RSS / OPML アクセスを修正
    - MySQL/MariaDB の transliterator_transliterate フォールバックを修正
    - MySQL/MariaDB インデックスヒントのリグレッションを修正
    - 次の未読記事ショートカットを修正
    - カスタム session.cookie-lifetime を修正
    - フィード URL 変更時のフィードバリデーターボタンを修正
    
    完全なリリースノート: https://github.com/FreshRSS/FreshRSS/releases/tag/1.28.1
