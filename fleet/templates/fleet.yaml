apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.workloads.fleet.replicaCount }}
  # Recreate, not RollingUpdate. Two of these would both hold the scheduler's loop and both accept
  # device tunnels, and while the second is survivable the database migration on startup is not:
  # an old replica keeps serving against a schema the new one has already changed.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fleet
  template:
    metadata:
      labels:
        app: fleet
        io.bytetrade.app: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: fleet
          image: docker.io/beclab/fleet:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENTD_SERVER_ADDR
              value: "0.0.0.0:8080"
            # Postgres comes from the platform: the manifest's `middleware.postgres` block asks
            # for the database and these values are what it was given. The password is a value
            # here rather than a secret reference because that is where the chart receives it.
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.databases.fleet }}?sslmode=disable"
            # Identity is the platform's. The edge authenticates every request and stamps who made
            # it, having first stripped whatever the client sent -- which is what makes trusting
            # the header safe here and nowhere else. Without this the server would look for an
            # OpenID provider it has not been given and refuse every request.
            - name: AGENTD_BEHIND_OLARES_EDGE
              value: "1"
            # The roster, read from the Olares directory. Empty until this is settled, and empty
            # is a real posture rather than a disabled feature: nobody arrives with a role, so
            # everybody who signs in is a member and no account is swept when the Olares deletes
            # it. Set it and the fleet refuses to start unless the directory answers, which is
            # what makes the degraded state the one you chose rather than the one you got.
            #
            # Not set here because an app namespace cannot reach LLDAP on this platform. It runs
            # in `os-platform`, and every port of it answers a synthetic 504 in exactly one second
            # from here — the mesh refusing, not the directory being absent, since an address that
            # does not resolve fails in a millisecond instead. Router reads the same directory and
            # runs in a `-shared` namespace with `options.shared: true`, which is the difference
            # worth asking about.
            - name: AGENTD_DIRECTORY_URL
              value: "{{ .Values.directoryURL | default "" }}"
            # The control-plane address, because what this is used for is a page: when a laptop
            # starts pairing, the server tells it where a person should go to type the code in,
            # and that person is in a browser. The data-plane entrance is where `agentd link`
            # points and nothing here needs to know it -- the daemon was told it by whoever ran
            # the command.
            - name: AGENTD_PUBLIC_URL
              value: "https://{{ .Values.domain.fleet }}"
            - name: TZ
              value: "UTC"
          # Readiness rather than liveness for the first one: a server that cannot reach its
          # database should stop taking traffic, not be killed and restarted into the same
          # database it still cannot reach.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-svc
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    app: fleet
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
# The data plane. The same pod as the entrance above: one server, two ways in, and which one a
# request came through is the platform's business rather than this server's. What differs is what
# the edge does before the request arrives -- it authenticates a person on one and lets a token
# through on the other -- and the server's own `authenticate` is what decides either way.
apiVersion: v1
kind: Service
metadata:
  name: fleet-machines-svc
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    app: fleet
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
