metadata:
  title: Fleet
  description: 从一个地方，用上团队已经有的那些机器
spec:
  fullDescription: |
    **这是什么**
    Fleet 是机队的控制面。跑 agent 的是那些机器自己——笔记本、服务器，或者这台 Olares 上内嵌 agentd 的
    agent 应用——它们主动拨出来连到这里。这台服务器从不反过来伸进它们。

    **它给你什么**
    - 哪些机器接进来了、每台上有哪些 agent CLI、其中哪些你可以用。
    - 在任意一台上起一条 run，回答它提出的权限请求，追问，并读它在磁盘上改了什么。
    - 比这条 run 活得更久的历史：每个 turn、工具调用、每轮的 diff、token 用量，以及谁批了什么。

    **谁看得见什么**
    一条 run 只有起它的人和那台机器的主人看得见，别人看不见——同在一个 Olares 不构成对别人的
    prompt 或别人工作树的所有权主张。管理员读的是另一份审批审计：谁、什么时候、批了什么，不含
    prompt、不含 diff、不含输出。

    **角色来自这台 Olares**
    没有东西要加入，也没有成员名单要维护：这里的人就是这台 Olares 的人，从它的目录读来；是
    Olares 管理员，就是 fleet 管理员。
