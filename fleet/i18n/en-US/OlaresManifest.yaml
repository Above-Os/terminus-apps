metadata:
  title: Fleet
  description: Use the machines your team already has, from one place
spec:
  fullDescription: |
    **Overview**
    Fleet is the control plane for the machines your team runs coding agents on. The machines
    themselves run `agentd` — on laptops, servers, or embedded in agent applications on this Olares — and
    they dial out to this server. It never reaches into them.

    **What it gives you**
    - Every machine that has joined, what agent CLIs each one has, and which of them you may use.
    - Starting a run on any of them, answering the permission requests it raises, following up,
      and reading what changed on disk afterwards.
    - History that outlives the run: turns, tool calls, per-turn diffs, token usage, and who
      approved what.

    **Who can see what**
    A run is visible to the person who asked for it and to the machine's owner, and to nobody
    else — being in the same Olares is not a claim on somebody's prompt or somebody else's
    working tree. Administrators read the approval audit instead, which carries who decided what
    and when, and no prompts, diffs or output.

    **Roles come from this Olares**
    There is nothing to join and no member list to maintain: the people here are this Olares's
    people, read from its directory, and being an Olares admin is what makes you a fleet admin.
