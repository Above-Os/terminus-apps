olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: "v3"

workloadReplicas:
  fleet: 1

metadata:
  name: fleet
  appid: fleet
  description: Run and watch coding agents on the machines you own, from one place.
  icon: https://app.cdn.olares.com/appstore/fleet/icon.png
  version: "0.1.4"
  title: Fleet
  categories:
    - Utilities_v112
    - agents
  tags:
    - agents
    - developer

permission:
  appData: true

spec:
  # Required: the platform refuses a manifest with `options.shared: true` and this false, and says
  # why -- a shared app serves every user on the cluster, so installing one is an administrator's
  # act.
  #
  # It reads like it contradicts "everybody on this Olares is in the fleet", and it does not. Both
  # of the checks behind this flag are about installing, and their message says so: "only admin
  # user can install this app". Neither hides an entrance. What `wording.md` warns about -- a
  # non-admin being told an app is "not installed" rather than "not permitted" -- is the per-user
  # case, where an admin-installed app genuinely exists only in the admin's namespace. A shared app
  # is installed once for the cluster and is not that.
  #
  # Still worth confirming on a machine with a second account, which this one does not have: that a
  # non-admin signing in can open the entrance and lands in the same fleet.
  onlyAdmin: true
  versionName: "0.1.4"
  requiredMemory: 128Mi
  limitedMemory: 512Mi
  requiredCpu: 50m
  limitedCpu: "1"
  requiredDisk: 100Mi
  limitedDisk: 1Gi
  supportArch:
    - amd64
    - arm64

options:
  # Shared, because a fleet is one Olares. Not a preference: installed per user, every account
  # would get its own server, its own database and its own mirror, and "one fleet, and everybody
  # on this Olares is in it" would be false by construction -- each person alone in a fleet of one.
  # The model this whole app rests on needs exactly one of it.
  #
  # It is also what makes the roster reachable, and missing it is why the RBAC in templates/
  # looked like it was not working. From a per-user namespace the directory gateway answers a
  # synthetic 504 after exactly one second -- a refusal rather than an absence, since an address
  # that does not resolve fails in a millisecond. From the shared namespace the same address
  # answers in three. The binding says which cluster role a namespace holds; this says which
  # namespace the app gets.
  shared: true
  dependencies:
    - name: olares
      version: ">=1.12.7-0"
      type: system

# Two entrances, because this app has two kinds of caller and only one of them is a person.
#
# The control plane is a browser. The platform's edge authenticates it, strips whatever the client
# sent, and stamps who it is -- which is the only reason this server trusts an identity header at
# all. `private` because a fleet is this Olares's machines and its people.
#
# The data plane is a daemon on somebody's laptop, dialling in from wherever that laptop is. It is
# not a person and has no session: it presents a token the server issued when the machine was
# paired, and the server checks it. So this entrance is `public` -- the edge must let the request
# reach the server for the server to be able to refuse it -- and `invisible`, because it is not a
# page and belongs in nobody's launcher.
entrances:
  - name: fleet
    host: fleet-svc
    port: 80
    title: Fleet
    icon: https://app.cdn.olares.com/appstore/fleet/icon.png
    openMethod: window
    authLevel: private
  - name: machines
    host: fleet-machines-svc
    port: 80
    title: Fleet machines
    authLevel: public
    invisible: true

middleware:
  postgres:
    username: fleet
    password: fleet
    databases:
      - name: fleet
        distributed: false
