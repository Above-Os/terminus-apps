metadata:
  description: "NVIDIA Streaming Sortformer for streaming diarization."
  title: Sortformer Diar Stream

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    NVIDIA Streaming Sortformer for streaming diarization.

    **配置**
    - 模型：`nvidia/diar_streaming_sortformer_4spk-v2.1`
    - 来源：`hf://nvidia/diar_streaming_sortformer_4spk-v2.1`
    - 能力：`diar_stream`
    - GPU 显存：`6Gi`
    - 引擎：NVIDIA NeMo Streaming Sortformer

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
