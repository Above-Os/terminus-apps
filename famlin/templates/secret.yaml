{{- $existing := lookup "v1" "Secret" .Release.Namespace "famlin-auth" -}}
apiVersion: v1
kind: Secret
metadata:
  name: famlin-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Preserve the signing key across upgrades and reinstalls that retain data.
  # Delete this Secret deliberately only when rotating all application sessions.
  {{- if and $existing $existing.data (index $existing.data "JWT_SECRET") }}
  JWT_SECRET: {{ index $existing.data "JWT_SECRET" | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: famlin-database
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s?schema=public" (.Values.postgres.username | urlquery) (.Values.postgres.password | urlquery) .Values.postgres.host .Values.postgres.port .Values.postgres.databases.famlin | quote }}
