metadata:
  title: Famlin
  description: "Foto, video e aggiornamenti di famiglia su un’app self-hosted"
spec:
  fullDescription: |
    Famlin è un’app self-hosted per condividere foto, video e aggiornamenti scritti di famiglia all’interno di gruppi. I membri possono consultare un feed condiviso e aggiungere commenti e reazioni.

    **Funzionalità principali**
    - Aggiornamenti di famiglia con testo e contenuti multimediali, organizzati per gruppo
    - Commenti, risposte e reazioni
    - Un’interfaccia nel browser per i membri e un’interfaccia di amministrazione
    - Possibilità di collegare album da Immich o da cartelle di immagini locali

    **Primi passi su Olares**
    Apri `/admin/` per creare il primo amministratore. Famlin gestisce i propri account; l’accesso unico di Olares non è configurato. Il punto di accesso principale è impostato su Interno (Internal) per impostazione predefinita e può essere cambiato in Pubblico (Public) nelle Impostazioni di Olares per i familiari che dispongono solo di un account Famlin. Criteri indipendenti per i singoli percorsi richiedono l’autenticazione Olares per `/admin`, `/api/admin` e gli endpoint di configurazione iniziale e registrazione degli amministratori, anche quando il punto di accesso principale è pubblico.

    I file caricati vengono archiviati in `Home/Pictures/Famlin/uploads`. Una directory separata, `Home/Pictures/Famlin/library`, viene montata in sola lettura su `/media/library` per gli album locali facoltativi. Configura questo percorso in Famlin prima di usare gli album collegati. Gli album da cartelle locali supportano attualmente le immagini, ma non i video o il formato HEIC.

    **Limitazione dell’accesso ai contenuti multimediali nella versione 0.7.0**
    Usa questa versione solo con membri fidati di un’unica famiglia. Gli altri utenti connessi alla stessa istanza possono leggere i file caricati nei normali post se ne conoscono l’URL; il filtro del feed per gruppo non isola completamente questi file.

    Il progetto originale Famlin è ancora in una fase iniziale. Conserva copie di backup del database e dei file caricati prima di eseguire un aggiornamento.
