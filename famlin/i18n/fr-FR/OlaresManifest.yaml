metadata:
  title: Famlin
  description: "Photos, vidéos et nouvelles de famille en auto-hébergement"
spec:
  fullDescription: |
    Famlin est une application auto-hébergée permettant de partager des photos, des vidéos et des nouvelles écrites de la famille dans des groupes. Les membres peuvent consulter un fil partagé et ajouter des commentaires et des réactions.

    **Fonctionnalités principales**
    - Nouvelles de famille organisées par groupe, avec du texte et des médias
    - Commentaires, réponses et réactions
    - Une interface dans le navigateur pour les membres et une interface d’administration
    - Possibilité de lier des albums provenant d’Immich ou de dossiers d’images locaux

    **Premiers pas sur Olares**
    Ouvrez `/admin/` pour créer le premier administrateur. Famlin gère ses propres comptes ; l’authentification unique Olares n’est pas configurée. Le point d’entrée principal est en mode Interne (Internal) par défaut et peut être réglé sur Public dans les Paramètres Olares pour les proches qui disposent uniquement d’un compte Famlin. Des règles distinctes par chemin imposent une authentification Olares pour `/admin`, `/api/admin` et les points d’accès d’initialisation et d’inscription des administrateurs, même lorsque le point d’entrée principal est public.

    Les fichiers téléversés sont stockés dans `Home/Pictures/Famlin/uploads`. Un répertoire distinct, `Home/Pictures/Famlin/library`, est monté en lecture seule sur `/media/library` pour les albums locaux facultatifs. Configurez ce chemin dans Famlin avant d’utiliser les albums liés. Les albums issus de dossiers locaux prennent actuellement en charge les images, mais pas les vidéos ni le format HEIC.

    **Limitation d’accès aux médias dans la version 0.7.0**
    Utilisez cette version uniquement avec des membres de confiance d’une même famille. Les autres utilisateurs connectés à la même instance peuvent lire les fichiers téléversés dans les publications ordinaires s’ils en connaissent l’URL ; le filtrage du fil par groupe n’isole pas complètement ces fichiers.

    Le projet d’origine Famlin est encore à un stade précoce. Conservez des sauvegardes de la base de données et des fichiers téléversés avant toute mise à niveau.
