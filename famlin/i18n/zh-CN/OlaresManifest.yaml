metadata:
  title: Famlin
  description: "自托管的家庭照片、视频与动态分享应用"
spec:
  fullDescription: |
    Famlin 是一款自托管应用，用于在群组中分享家庭照片、视频和文字动态。成员可以浏览共享动态流，并发表评论和表情回应。

    **主要功能**
    - 按群组分享包含文字和媒体的家庭动态
    - 评论、回复和表情回应
    - 面向成员的浏览器界面及管理界面
    - 可选关联来自 Immich 或本地图片文件夹的相册

    **在 Olares 上开始使用**
    打开 `/admin/` 创建首个管理员。Famlin 使用自己的账户体系，未配置 Olares 单点登录。主入口默认为内部（Internal），可在 Olares 设置中改为公开（Public），供只有 Famlin 账户的亲友访问。独立路径策略要求访问 `/admin`、`/api/admin` 以及管理员初始化和注册接口时进行 Olares 身份验证，即使主入口已设为公开也是如此。

    上传文件保存在 `Home/Pictures/Famlin/uploads`。独立目录 `Home/Pictures/Famlin/library` 以只读方式挂载到 `/media/library`，用于可选的本地相册。使用关联相册前，请在 Famlin 中配置该路径。本地文件夹相册目前支持图片，不支持视频或 HEIC。

    **0.7.0 的媒体访问限制**
    此版本仅适合一个家庭中相互信任的成员使用。同一实例中其他已登录用户只要知道普通动态上传文件的 URL，就能读取这些文件；群组动态流筛选并不能完全隔离这些文件。

    Famlin 上游项目仍处于早期阶段。升级前请备份数据库和上传文件。
