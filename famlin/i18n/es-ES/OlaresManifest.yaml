metadata:
  title: Famlin
  description: "Fotos, vídeos y novedades familiares en una aplicación autoalojada"
spec:
  fullDescription: |
    Famlin es una aplicación autoalojada para compartir fotos, vídeos y novedades familiares por escrito en grupos. Los miembros pueden consultar un canal de publicaciones compartido y añadir comentarios y reacciones.

    **Funciones principales**
    - Novedades familiares con texto y contenido multimedia organizadas por grupos
    - Comentarios, respuestas y reacciones
    - Una interfaz en el navegador para los miembros y una interfaz de administración
    - Posibilidad de vincular álbumes de Immich o de carpetas locales de imágenes

    **Primeros pasos en Olares**
    Abre `/admin/` para crear el primer administrador. Famlin gestiona sus propias cuentas; el inicio de sesión único de Olares no está configurado. El acceso principal está configurado como Interno (Internal) de forma predeterminada y se puede cambiar a Público (Public) en los Ajustes de Olares para los familiares que solo tengan una cuenta de Famlin. Las políticas independientes por ruta exigen autenticación de Olares para `/admin`, `/api/admin` y los endpoints de configuración inicial y registro de administradores, incluso cuando el acceso principal es público.

    Los archivos subidos se guardan en `Home/Pictures/Famlin/uploads`. Un directorio independiente, `Home/Pictures/Famlin/library`, se monta en modo de solo lectura en `/media/library` para los álbumes locales opcionales. Configura esa ruta en Famlin antes de utilizar los álbumes vinculados. Los álbumes de carpetas locales admiten actualmente imágenes, pero no vídeos ni archivos HEIC.

    **Limitación de acceso al contenido multimedia en 0.7.0**
    Utiliza esta versión únicamente con miembros de confianza de una misma familia. Otros usuarios que hayan iniciado sesión en la misma instancia pueden leer los archivos subidos en publicaciones normales si conocen su URL; el filtrado del canal de publicaciones por grupo no aísla completamente estos archivos.

    El proyecto original Famlin todavía está en una fase temprana. Guarda copias de seguridad de la base de datos y de los archivos subidos antes de actualizar.
