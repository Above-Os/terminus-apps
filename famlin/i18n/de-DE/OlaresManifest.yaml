metadata:
  title: Famlin
  description: "Selbst gehostete Familienfotos, Videos und Neuigkeiten"
spec:
  fullDescription: |
    Famlin ist eine selbst gehostete App zum Teilen von Familienfotos, Videos und schriftlichen Neuigkeiten in Gruppen. Mitglieder können einen gemeinsamen Feed ansehen sowie Kommentare und Reaktionen hinzufügen.

    **Hauptfunktionen**
    - Familienneuigkeiten mit Text und Medien, nach Gruppen organisiert
    - Kommentare, Antworten und Reaktionen
    - Eine Browseroberfläche für Mitglieder und eine Verwaltungsoberfläche
    - Optional verknüpfte Alben aus Immich oder lokalen Bilderordnern

    **Erste Schritte mit Olares**
    Öffnen Sie `/admin/`, um den ersten Administrator anzulegen. Famlin verwaltet eigene Konten; Olares Single Sign-on ist nicht eingerichtet. Der Hauptzugang ist standardmäßig auf Intern (Internal) eingestellt und kann in den Olares-Einstellungen auf Öffentlich (Public) umgestellt werden, damit Angehörige mit ausschließlich einem Famlin-Konto darauf zugreifen können. Unabhängige Regeln für einzelne Pfade verlangen eine Olares-Authentifizierung für `/admin`, `/api/admin` sowie die Endpunkte zur Ersteinrichtung und Registrierung von Administratoren, auch wenn der Hauptzugang öffentlich ist.

    Hochgeladene Dateien werden unter `Home/Pictures/Famlin/uploads` gespeichert. Ein separates Verzeichnis `Home/Pictures/Famlin/library` wird für optionale lokale Alben schreibgeschützt unter `/media/library` eingebunden. Konfigurieren Sie diesen Pfad in Famlin, bevor Sie verknüpfte Alben verwenden. Alben aus lokalen Ordnern unterstützen derzeit Bilder, aber keine Videos oder HEIC-Dateien.

    **Einschränkung beim Medienzugriff in 0.7.0**
    Verwenden Sie diese Version nur mit vertrauenswürdigen Mitgliedern einer einzigen Familie. Andere angemeldete Benutzer derselben Instanz können Dateien aus gewöhnlichen Beitragsuploads lesen, wenn sie deren URL kennen; die Filterung des Gruppenfeeds isoliert diese Dateien nicht vollständig.

    Das ursprüngliche Famlin-Projekt befindet sich noch in einer frühen Entwicklungsphase. Sichern Sie die Datenbank und die hochgeladenen Dateien vor einem Upgrade.
