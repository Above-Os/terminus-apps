metadata:
  title: Famlin
  description: "家族の写真、動画、近況を共有するセルフホスト型アプリ"
spec:
  fullDescription: |
    Famlinは、家族の写真、動画、文章による近況をグループで共有するセルフホスト型アプリです。メンバーは共有フィードを閲覧し、コメントやリアクションを追加できます。

    **主な機能**
    - テキストやメディアを含む家族の近況をグループ単位で共有
    - コメント、返信、リアクション
    - メンバー向けのブラウザー画面と管理画面
    - Immichやローカルの画像フォルダーにあるアルバムとの連携（任意）

    **Olaresでの利用開始**
    `/admin/`を開いて最初の管理者を作成します。Famlinは独自のアカウントを管理し、Olaresのシングルサインオンは設定されていません。メインの入口はデフォルトで内部（Internal）に設定されており、Famlinアカウントのみを持つ親族がアクセスできるよう、Olaresの設定で公開（Public）に変更できます。メインの入口が公開されている場合でも、独立したパスポリシーにより、`/admin`、`/api/admin`、管理者の初期設定および登録用エンドポイントへのアクセスにはOlares認証が必要です。

    アップロードしたファイルは`Home/Pictures/Famlin/uploads`に保存されます。任意のローカルアルバム用に、別のディレクトリ`Home/Pictures/Famlin/library`が`/media/library`に読み取り専用でマウントされます。連携アルバムを利用する前に、Famlinでこのパスを設定してください。ローカルフォルダーのアルバムは現在、画像に対応していますが、動画やHEICには対応していません。

    **0.7.0のメディアアクセス制限**
    このバージョンは、信頼できる同じ家族のメンバー間でのみ使用してください。同じインスタンスにログインしている他のユーザーは、通常の投稿でアップロードされたファイルのURLを知っていれば、そのファイルを読み取れます。グループごとのフィードの絞り込みでは、これらのファイルは完全には分離されません。

    Famlinの開発元プロジェクトはまだ初期段階です。アップグレード前に、データベースとアップロードしたファイルをバックアップしてください。
