metadata:
  title: Famlin
  description: "Self-hosted family photos, videos, and updates"
spec:
  fullDescription: |
    Famlin is a self-hosted app for sharing family photos, videos, and written updates in groups. Members can browse a shared feed and add comments and reactions.

    **Key features**
    - Group-based family updates with text and media
    - Comments, replies, and reactions
    - A browser interface for members and an administration interface
    - Optional linked albums from Immich or local image folders

    **Getting started on Olares**
    Open `/admin/` to create the first administrator. Famlin manages its own accounts; Olares single sign-on is not configured. The main entrance defaults to Internal and can be changed to Public in Olares Settings for relatives who only have Famlin accounts. Independent path policies require Olares authentication for `/admin`, `/api/admin`, and the administrator setup and registration endpoints, including when the main entrance is Public.

    Uploads are stored in `Home/Pictures/Famlin/uploads`. A separate `Home/Pictures/Famlin/library` directory is mounted read-only at `/media/library` for optional local albums. Configure that path in Famlin before using linked albums. Local folder albums currently support images, not videos or HEIC.

    **Media access limitation in 0.7.0**
    Use this version only with trusted members of one family. Ordinary posted upload URLs can be read by other logged-in users of the same instance when they know the URL; group feed filtering does not fully isolate these files.

    Famlin is an early-stage upstream project. Keep backups of the database and uploaded files before upgrading.
