metadata:
  description: "在 NVIDIA Blackwell 显卡（RTX 50 系列）上使用 llama.cpp 运行 Qwen3.8-27B（带 MTP 的 NVFP4 GGUF）模型。"
  title: Qwen3.8-27B NVFP4 (llama.cpp)

spec:
  fullDescription: |
    **模型简介**
    Qwen3.8-27B 是阿里巴巴 Qwen 系列的视觉语言模型，基于 Qwen3.5 架构，支持思考、工具调用与原生图像/视频理解，上下文窗口 256K。本应用通过 llama.cpp 运行 `esatapedico/Qwen3.8-27B-NVFP4-MTP-GGUF` 的 NVFP4 `MTP-LOW` GGUF 版本（由 `unsloth/Qwen3.8-27B-NVFP4` 量化而来）。

    **硬件要求**
    NVFP4 只能在 NVIDIA Blackwell 显卡（如 RTX 50 系列）上原生运行。需要 23Gi 显存，至少 24 GB 显卡。更早的 NVIDIA 显卡无法运行本应用，请改用 Qwen3.8-27B 的 GGUF Q4 版本。

    **预设配置**
    - 模型：`esatapedico/Qwen3.8-27B-NVFP4-MTP-GGUF:MTP-LOW`（含 `mmproj-BF16.gguf` 视觉投影文件）
    - 能力：思考、工具、视觉
    - 引擎参数：`-c 104448 -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 4 -kvu --spec-type draft-mtp --spec-draft-n-max 4 -ub 1024`（102K 上下文由 4 个槽共享，MTP 投机解码，草稿深度 4）
    - 所需显存：`23Gi`

    **工作流程说明**
    首先，Model Console 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**（`server-cuda13-b11718`）：运行模型并通过 8081 端口提供 API 服务
    - **Model Console**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。
