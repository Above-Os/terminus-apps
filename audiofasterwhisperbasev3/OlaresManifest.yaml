olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiofasterwhisperbasev3
  icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
  description: Audio model base (Whisper family on CTranslate2 — faster-whisper engine, llm-init reverse-proxy). One instance = one model; capability via MODEL_SUPPORTS (stt). The engine image self-reports /v1/models + /metrics; llm-init downloads the model AND reverse-proxies the engine's OpenAI /v1/* directly.
  appid: audiofasterwhisperbasev3
  title: Faster-Whisper Base V3
  version: '1.0.0'
  categories:
    - AI
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1, off the edge (no SSO).
sharedEntrances:
  - name: audiofasterwhisperbasev3api
    host: sharedentrances-api
    port: 0
    title: Faster-Whisper Base V3 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", the engine's /v1/* reverse-proxied; internal auth.
entrances:
  - name: audiofasterwhisperbasev3
    port: 8090
    host: download-svc
    title: Faster-Whisper Base V3
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiofasterwhisperbasev3: 1
  llminit: 1
spec:
  versionName: '1.0.0'
  fullDescription: |
    **Audio model base — Whisper family on CTranslate2 (`audiofasterwhisperbasev3`)**
    A generic *base* for Whisper-family models served by faster-whisper
    (CTranslate2). One installed instance = one model. The capability is chosen at
    install time via `MODEL_SUPPORTS`: `stt`.

    **HOW IT WORKS**
    llm-init does BOTH jobs: (1) downloads the configured model into the shared HF
    cache, and (2) IS the OpenAI-compatible data plane — it reverse-proxies `/v1/*`
    to the sibling audio engine at `http://audio-engine:8000` and serves its control
    plane / dashboard on `/`. The engine image (`beclab/audio-fasterwhisper`) bakes
    the wrapper + all deps and self-reports `/v1/models` (id + mode + supports +
    endpoints) and generic `/metrics` (gpu_*); llm-init proxies these unchanged. The
    engine container waits for llm-init's download sentinel rather than polling,
    avoiding the proxy<->engine deadlock.

    **Model storage (App Common)**
    Model files go to `appCommon/huggingface`, mounted at `/cache/hf/hub`. llm-init
    writes, the engine reads offline.

    **Clone form (5 fields)**
    - `MODEL_SOURCE` — `hf://<repo>` (llm-init download spec). Either a CTranslate2
      conversion (`hf://Systran/faster-whisper-large-v3`, loads immediately) or a
      transformers-format Whisper checkpoint (`hf://openai/whisper-large-v3` and its
      fine-tunes), which the engine converts to CTranslate2 on first load — a few
      extra minutes once, cached in the shared model volume for every later start.
    - `MODEL_NAME` — model id advertised to clients (must match the engine's /v1/models id).
    - `MODEL_SUPPORTS` — `stt` (offline transcription).
    - `AUDIO_REQUIRED_GPU_MEMORY` — e.g. faster-whisper large-v3 `6Gi`. `0` or empty
      runs on CPU (int8).

    **Engine** — faster-whisper's `WhisperModel` wrapped in a
    `BatchedInferencePipeline` (VAD-cut + parallel batched decode), which is why this
    base beats vLLM-Whisper on a time-sliced vGPU. Besides `/v1/audio/transcriptions`
    (single + batch `segments`) it serves `/v1/audio/translations`, Whisper's native
    speech-to-English task. GPU engines force `GPU_CORE_UTILIZATION_POLICY=disable`
    so they run full-speed under time-sliced vGPU.

    **Example clone set**
    - STT (faster-whisper large-v3): MODEL_SOURCE=hf://Systran/faster-whisper-large-v3
      MODEL_NAME=Systran/faster-whisper-large-v3  MODEL_SUPPORTS=stt  AUDIO_REQUIRED_GPU_MEMORY=6Gi
    - STT (OpenAI Whisper large-v3, converted on first load):
      MODEL_SOURCE=hf://openai/whisper-large-v3
      MODEL_NAME=openai/whisper-large-v3  MODEL_SUPPORTS=stt  AUDIO_REQUIRED_GPU_MEMORY=8Gi

  upgradeDescription: |
    v1.0.0: initial faster-whisper base. Engine + wrapper baked into one image
    (beclab/audio-fasterwhisper); the image self-reports /v1/models + /metrics and
    llm-init (ENGINE_KIND=audio) reverse-proxies it. Capability chosen at clone via
    MODEL_SUPPORTS (stt); speech-to-English translations come with the Whisper task.

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/llm-init
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/llm-init

  accelerator:
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: MODEL_NAME
    required: true
    type: string
    editable: true
    applyOnChange: true
  # MODEL_SUPPORTS: one capability here, kept in the other bases' multi-select shape for one clone form.
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: STT (offline transcription)
      value: stt
  - envName: AUDIO_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
