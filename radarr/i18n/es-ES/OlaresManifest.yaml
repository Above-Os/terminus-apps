metadata:
  title: Radarr
  description: Un gestor de colección de películas para usuarios de Usenet y BitTorrent.
spec:
  fullDescription: |
    Radarr puede monitorizar varios feeds RSS en busca de películas nuevas e interactuar con clientes e indexadores para descargarlas, ordenarlas y renombrarlas. También puede configurarse para actualizar automáticamente la calidad de los archivos existentes en la biblioteca cuando haya disponible un formato de mejor calidad. Ten en cuenta que solo se admite un tipo de una película determinada. Si quieres una versión 4k y una 1080p de la misma película, necesitarás varias instancias.
    
    **Funciones principales**
    - Añadir películas nuevas con mucha información, como tráilers, valoraciones, etc.
    - Soporte para las principales plataformas: Windows, Linux, macOS, Raspberry Pi, etc.
    - Puede vigilar una mejor calidad de las películas que tienes y actualizar automáticamente, p. ej. de DVD a Blu-Ray
    - El manejo automático de descargas fallidas probará otra publicación si una falla
    - Búsqueda manual para elegir cualquier publicación o ver por qué no se descargó automáticamente
    - Integración completa con SABnzbd y NZBGet
    - Búsqueda automática de publicaciones además de RSS Sync
    - Importación automática de películas descargadas
    - Reconocimiento de Special Editions, Director's Cut, etc.
    - Identificación de publicaciones con subtítulos quemados
    - Identificación de publicaciones con nombres AKA de películas
    - SABnzbd, NZBGet, QBittorrent, Deluge, rTorrent, Transmission, uTorrent y otros clientes de descarga están soportados e integrados
    - Integración completa con Kodi y Plex (notificaciones, actualizaciones de biblioteca)
    - Importación de metadatos como tráilers o subtítulos
    - Añadir metadatos como pósters e información para que usen Kodi y otros
    - Personalización avanzada de perfiles para que Radarr siempre descargue la copia que quieres
    - Una interfaz hermosa
  upgradeDescription: |
    Actualizar Radarr a la versión 6.2.1 (2026-06-09)
    Cambios de configuración: cambiar la ruta de montaje del directorio olares y el nivel de auth de la entrada.
    - Cambiar la ruta de montaje predeterminada del Olares Home Directory a /olares/userdata/home
    - Añadir Olares External Directory y montar en /olares/userdata/external
    - Nivel de auth de la entrada cambiado a internal
    
    Aspectos destacados de la actualización:
    - [Major] Migrado a .NET 8; eliminado Basic Auth en favor de autenticación Forms
    - [Major] Idioma deseado predeterminado de los perfiles de calidad cambiado a Original; cambios de validación en tokens del formato de carpeta de película
    - [qBittorrent] Soporte de API key; correcciones de login para qBittorrent 5.2; soporte Basic auth; reutilización de cookies para llamadas API
    - [New Features] Opción de cadena de conexión Postgres; integración Simkl Anime List; ajuste TTL de Pushover; etiquetar Parse Group GiLG
    - [Improvements] Bump del runtime .NET 8.0.27; menor transferencia de datos de stream de vídeo; timeout busy de SQLite aumentado a 1000ms
    - [Fixes] Redes conocidas RFC 1918/IPv6 privadas; errores de API de colección; parsing de URL en algunos locales; descarga de backup con rutas con barra final; modificador de calidad desde media info
    
    Nota de versión completa: https://github.com/Radarr/Radarr/releases/tag/v6.2.1.10461
