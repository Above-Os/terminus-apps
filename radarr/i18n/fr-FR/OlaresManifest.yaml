metadata:
  title: Radarr
  description: Un gestionnaire de collection de films pour les utilisateurs Usenet et BitTorrent
spec:
  fullDescription: |
    Radarr peut surveiller plusieurs flux RSS pour de nouveaux films et interagir avec des clients et indexeurs pour les récupérer, les trier et les renommer. Il peut aussi être configuré pour améliorer automatiquement la qualité des fichiers existants dans la bibliothèque lorsqu'un format de meilleure qualité devient disponible. Notez qu'un seul type d'un film donné est pris en charge. Si vous voulez à la fois une version 4k et une version 1080p d'un film, vous aurez besoin de plusieurs instances.
    
    **Fonctionnalités majeures**
    - Ajout de nouveaux films avec beaucoup d'informations, comme bandes-annonces, notes, etc.
    - Prise en charge des principales plateformes : Windows, Linux, macOS, Raspberry Pi, etc.
    - Peut surveiller une meilleure qualité des films que vous avez et faire une mise à niveau automatique, p. ex. de DVD à Blu-Ray
    - La gestion automatique des téléchargements échoués essaiera une autre release si l'une échoue
    - Recherche manuelle pour choisir n'importe quelle release ou voir pourquoi une n'a pas été téléchargée automatiquement
    - Intégration complète avec SABnzbd et NZBGet
    - Recherche automatique des releases ainsi que RSS Sync
    - Importation automatique des films téléchargés
    - Reconnaissance des Special Editions, Director's Cut, etc.
    - Identification des releases avec sous-titres incrustés
    - Identification des releases avec noms AKA de films
    - SABnzbd, NZBGet, QBittorrent, Deluge, rTorrent, Transmission, uTorrent et d'autres clients de téléchargement sont pris en charge et intégrés
    - Intégration complète avec Kodi et Plex (notifications, mises à jour de bibliothèque)
    - Importation de métadonnées comme bandes-annonces ou sous-titres
    - Ajout de métadonnées comme affiches et informations pour Kodi et autres
    - Personnalisation avancée des profils, pour que Radarr télécharge toujours la copie que vous voulez
    - Une belle interface
  upgradeDescription: |
    Mettre à jour Radarr vers la version 6.2.1 (2026-06-09)
    Changements de configuration : modifier le chemin de montage du répertoire olares et le niveau d'auth de l'entrée.
    - Changer le chemin de montage par défaut du Olares Home Directory en /olares/userdata/home
    - Ajouter Olares External Directory et monter sur /olares/userdata/external
    - Niveau d'auth de l'entrée changé en internal
    
    Points forts de la mise à jour :
    - [Major] Migration vers .NET 8 ; Basic Auth retiré au profit de l'authentification Forms
    - [Major] Langue souhaitée par défaut des profils de qualité changée en Original ; changements de validation pour les jetons de format de dossier de film
    - [qBittorrent] Prise en charge de la clé API ; correctifs de connexion pour qBittorrent 5.2 ; prise en charge Basic auth ; réutilisation des cookies pour les appels API
    - [New Features] Option de chaîne de connexion Postgres ; intégration Simkl Anime List ; réglage TTL Pushover ; balise Parse Group GiLG
    - [Improvements] Bump runtime .NET 8.0.27 ; transfert de données de flux vidéo réduit ; timeout busy SQLite porté à 1000ms
    - [Fixes] Réseaux connus RFC 1918/IPv6 privés ; erreurs d'API collection ; parsing d'URL sur certains locales ; téléchargement de sauvegarde avec chemins à slash final ; modificateur de qualité depuis media info
    
    Notes de version complètes : https://github.com/Radarr/Radarr/releases/tag/v6.2.1.10461
