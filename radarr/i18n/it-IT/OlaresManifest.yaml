metadata:
  title: Radarr
  description: Un gestore di collezioni di film per utenti Usenet e BitTorrent.
spec:
  fullDescription: |
    Radarr può monitorare più feed RSS per nuovi film e interagire con client e indexer per scaricarli, ordinarli e rinominarli. Può anche essere configurato per aggiornare automaticamente la qualità dei file esistenti nella libreria quando diventa disponibile un formato di qualità superiore. Nota che è supportato un solo tipo di un dato film. Se vuoi sia una versione 4k sia una 1080p dello stesso film, ti serviranno più istanze.
    
    **Funzionalità principali**
    - Aggiunta di nuovi film con molte informazioni, come trailer, valutazioni, ecc.
    - Supporto per le principali piattaforme: Windows, Linux, macOS, Raspberry Pi, ecc.
    - Può controllare una qualità migliore dei film che hai e fare un upgrade automatico, ad es. da DVD a Blu-Ray
    - La gestione automatica dei download falliti proverà un'altra release se una fallisce
    - Ricerca manuale per scegliere qualsiasi release o vedere perché una non è stata scaricata automaticamente
    - Integrazione completa con SABnzbd e NZBGet
    - Ricerca automatica delle release oltre a RSS Sync
    - Importazione automatica dei film scaricati
    - Riconoscimento di Special Editions, Director's Cut, ecc.
    - Identificazione delle release con sottotitoli hardcoded
    - Identificazione delle release con nomi AKA dei film
    - SABnzbd, NZBGet, QBittorrent, Deluge, rTorrent, Transmission, uTorrent e altri client di download sono supportati e integrati
    - Integrazione completa con Kodi e Plex (notifiche, aggiornamenti libreria)
    - Importazione di metadati come trailer o sottotitoli
    - Aggiunta di metadati come poster e informazioni per Kodi e altri
    - Personalizzazione avanzata dei profili, così che Radarr scarichi sempre la copia che desideri
    - Una bellissima UI
  upgradeDescription: |
    Aggiornare Radarr alla versione 6.2.1 (2026-06-09)
    Modifiche di configurazione: cambiare il percorso di mount della directory olares e il livello di auth dell'ingresso.
    - Cambiare il percorso di mount predefinito di Olares Home Directory in /olares/userdata/home
    - Aggiungere Olares External Directory e montare su /olares/userdata/external
    - Livello di auth dell'ingresso cambiato in internal
    
    Highlight dell'upgrade:
    - [Major] Migrato a .NET 8; rimosso Basic Auth a favore dell'autenticazione Forms
    - [Major] Lingua desiderata predefinita dei profili di qualità cambiata in Original; modifiche di validazione per i token del formato cartella film
    - [qBittorrent] Supporto API key; fix login per qBittorrent 5.2; supporto Basic auth; riuso cookie per chiamate API
    - [New Features] Opzione connection string Postgres; integrazione Simkl Anime List; impostazione TTL Pushover; tag Parse Group GiLG
    - [Improvements] Bump runtime .NET 8.0.27; ridotto trasferimento dati stream video; timeout busy SQLite aumentato a 1000ms
    - [Fixes] Reti note RFC 1918/IPv6 private; errori API collection; parsing URL in alcuni locale; download backup con percorsi con slash finale; modificatore qualità da media info
    
    Note di rilascio complete: https://github.com/Radarr/Radarr/releases/tag/v6.2.1.10461
