metadata:
  title: Radarr
  description: Usenet および BitTorrent ユーザー向けの映画コレクションマネージャー
spec:
  fullDescription: |
    Radarr は複数の RSS フィードを監視して新しい映画を探し、クライアントやインデクサーと連携して取得・並べ替え・名前変更できます。また、より良い品質フォーマットが利用可能になったときにライブラリ内の既存ファイルの品質を自動アップグレードするよう設定できます。ある映画についてサポートされるのは 1 種類のみであることに注意してください。同じ映画の 4k 版と 1080p 版の両方が必要な場合は、複数インスタンスが必要です。
    
    **主な機能**
    - トレーラー、評価などの多くの情報付きで新しい映画を追加
    - 主要プラットフォームをサポート：Windows、Linux、macOS、Raspberry Pi など
    - 所持映画のより良い品質を監視し、自動アップグレード（例：DVD から Blu-Ray）
    - 失敗したダウンロードの自動処理：1 件失敗したら別のリリースを試行
    - 手動検索で任意のリリースを選ぶ、または自動ダウンロードされなかった理由を確認
    - SABnzbd と NZBGet との完全統合
    - リリースの自動検索および RSS Sync
    - ダウンロードした映画の自動インポート
    - Special Editions、Director's Cut などの認識
    - ハードコード字幕付きリリースの識別
    - AKA 映画名付きリリースの識別
    - SABnzbd、NZBGet、QBittorrent、Deluge、rTorrent、Transmission、uTorrent などのダウンロードクライアントをサポート・統合
    - Kodi と Plex との完全統合（通知、ライブラリ更新）
    - トレーラーや字幕などのメタデータインポート
    - Kodi などが使うポスターや情報などのメタデータ追加
    - プロファイルの高度なカスタマイズにより、常に希望のコピーをダウンロード
    - 美しい UI
  upgradeDescription: |
    Radarr をバージョン 6.2.1（2026-06-09）にアップグレード
    設定変更：olares ディレクトリのマウントパスとエントランス認証レベルを変更。
    - デフォルトの Olares Home Directory マウントパスを /olares/userdata/home に変更
    - Olares External Directory を追加し /olares/userdata/external にマウント
    - エントランス認証レベルを internal に変更
    
    アップグレードのハイライト：
    - [Major] .NET 8 へ移行；Basic Auth を廃止し Forms 認証へ
    - [Major] 品質プロファイルのデフォルト希望言語を Original に変更；映画フォルダ形式トークンの検証変更
    - [qBittorrent] API キー対応；qBittorrent 5.2 のログイン修正；Basic auth 対応；API 呼び出しの Cookie 再利用
    - [New Features] Postgres 接続文字列オプション；Simkl Anime List 統合；Pushover TTL 設定；Parse Group GiLG リリースタグ
    - [Improvements] .NET 8.0.27 ランタイム更新；動画ストリームデータ転送の削減；SQLite busy timeout を 1000ms に増加
    - [Fixes] RFC 1918／プライベート IPv6 既知ネットワーク；コレクション API エラー；一部ロケールでの URL 解析；末尾スラッシュ付きパスでのバックアップダウンロード；メディア情報からの品質修飾子
    
    完全なリリースノート: https://github.com/Radarr/Radarr/releases/tag/v6.2.1.10461
