metadata:
  title: Radarr
  description: Ein Film-Sammlungsmanager für Usenet- und BitTorrent-Nutzer.
spec:
  fullDescription: |
    Radarr kann mehrere RSS-Feeds auf neue Filme überwachen und mit Clients sowie Indexern interagieren, um sie zu holen, zu sortieren und umzubenennen. Es kann auch so konfiguriert werden, dass die Qualität vorhandener Dateien in der Bibliothek automatisch aktualisiert wird, wenn ein besseres Qualitätsformat verfügbar wird. Beachten Sie, dass nur ein Typ eines bestimmten Films unterstützt wird. Wenn Sie sowohl eine 4K- als auch eine 1080p-Version eines Films möchten, benötigen Sie mehrere Instanzen.
    
    **Wichtige Funktionen umfassen**
    - Hinzufügen neuer Filme mit vielen Informationen wie Trailern, Bewertungen usw.
    - Unterstützung der wichtigsten Plattformen: Windows, Linux, macOS, Raspberry Pi usw.
    - Kann auf bessere Qualität der vorhandenen Filme achten und automatisch upgraden, z. B. von DVD zu Blu-Ray
    - Automatische Behandlung fehlgeschlagener Downloads versucht eine andere Veröffentlichung, wenn eine fehlschlägt
    - Manuelle Suche, damit Sie jede Veröffentlichung wählen oder sehen können, warum eine nicht automatisch heruntergeladen wurde
    - Volle Integration mit SABnzbd und NZBGet
    - Automatische Suche nach Veröffentlichungen sowie RSS Sync
    - Automatisches Importieren heruntergeladener Filme
    - Erkennung von Special Editions, Director's Cut usw.
    - Erkennung von Veröffentlichungen mit hartkodierten Untertiteln
    - Erkennung von Veröffentlichungen mit AKA-Filmnamen
    - SABnzbd, NZBGet, QBittorrent, Deluge, rTorrent, Transmission, uTorrent und andere Download-Clients werden unterstützt und integriert
    - Volle Integration mit Kodi und Plex (Benachrichtigungen, Bibliotheksaktualisierungen)
    - Importieren von Metadaten wie Trailern oder Untertiteln
    - Hinzufügen von Metadaten wie Postern und Informationen für Kodi und andere
    - Erweiterte Anpassung für Profile, sodass Radarr immer die gewünschte Kopie herunterlädt
    - Eine schöne Benutzeroberfläche
  upgradeDescription: |
    Radarr auf Version 6.2.1 aktualisieren (2026-06-09)
    Konfigurationsänderungen: Olares-Verzeichnis-Mount-Pfad und Entrance-Auth-Level ändern.
    - Standard-Mount-Pfad des Olares Home Directory auf /olares/userdata/home ändern
    - Olares External Directory hinzufügen und Mount-Pfad auf /olares/userdata/external
    - Entrance-Auth-Level auf internal geändert
    
    Upgrade-Highlights:
    - [Major] Migration zu .NET 8; Basic Auth zugunsten von Forms-Authentifizierung entfernt
    - [Major] Standard-Wunschsprache für Qualitätsprofile auf Original geändert; Validierungsänderungen für Filmordner-Format-Tokens
    - [qBittorrent] API-Key-Unterstützung; Login-Fixes für qBittorrent 5.2; Basic-Auth-Unterstützung; Cookie-Wiederverwendung für API-Aufrufe
    - [New Features] Postgres-Connection-String-Option; Simkl Anime List-Integration; Pushover-TTL-Einstellung; Parse Group GiLG Release-Tag
    - [Improvements] .NET 8.0.27 Runtime-Bump; reduzierte Video-Stream-Datenübertragung; SQLite busy timeout auf 1000ms erhöht
    - [Fixes] RFC 1918/private IPv6 bekannte Netzwerke; Collection-API-Fehler; URL-Parsing in einigen Locales; Backup-Download mit trailing slash Pfaden; Qualitätsmodifikator aus Media-Info
    
    Vollständige Release Notes: https://github.com/Radarr/Radarr/releases/tag/v6.2.1.10461
