olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

metadata:
  name: olaresdesign
  appid: olaresdesign
  title: Olares Design
  description: Agent-native image and video creation powered by Router and FlowStudio
  icon: https://raw.githubusercontent.com/ffkijjkokok/olaresdesign-assets/main/icon.png
  version: 0.1.0
  categories:
  - Creativity
  - AI
  - agents
  - models

entrances:
- name: olaresdesign
  host: olaresdesign-svc
  port: 3000
  title: Olares Design
  icon: https://raw.githubusercontent.com/ffkijjkokok/olaresdesign-assets/main/icon.png
  authLevel: private
  openMethod: window

spec:
  versionName: "0.1.0"
  runAsUser: true
  supportArch:
  - amd64
  requiredCpu: 200m
  limitedCpu: "2"
  requiredMemory: 256Mi
  limitedMemory: 4Gi
  requiredDisk: 128Mi

permission:
  appData: true

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
  - name: router
    version: '>=1.0.0'
    type: application
  - name: flowstudio
    version: '>=0.3.0'
    type: application
    mandatory: false

workloadReplicas:
  olaresdesign: 1
