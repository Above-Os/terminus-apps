# The API scales chat-model deployments to zero while a FlowStudio engine
# runs. One GPU cannot hold both. The process only touches deployments whose
# model-spec mode is chat.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olaresdesign-llm-park-{{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olaresdesign-llm-park-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: olaresdesign-llm-park-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
