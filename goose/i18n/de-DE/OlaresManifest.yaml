metadata:
  title: Goose
  description: "Persönliches KI-Agent-Backend für den nativen Goose-Desktop-Client"
spec:
  fullDescription: |
    Goose ist ein quelloffener KI-Agent für Programmierung, Recherche, Texte und Workflows. Diese Anwendung betreibt das Agent-Backend auf Olares. Die Bedienung erfolgt über den nativen Goose-Desktop-Client auf deinem Computer.

    Funktionen
    - Goose Desktop über ACP mit dem Agent auf Olares verbinden.
    - Konfiguration, Sitzungen, Recipes und Arbeitsergebnisse dauerhaft im Anwendungsspeicher sichern.
    - Unterstützte Modellanbieter, OpenAI-kompatible Endpunkte und MCP-Erweiterungen verbinden.
    - Das Verwaltungsterminal für CLI-Unterhaltungen und Konfiguration verwenden.

    Erste Schritte
    1. Goose Desktop 1.54.0 auf deinem Computer installieren und mit dem Olares-Netzwerk verbinden.
    2. Goose Terminal öffnen und ausführen: printenv GOOSE_SERVER__SECRET_KEY
    3. Die URL des Goose-ACP-Zugangs in den Olares-Einstellungen suchen. Unter Settings > goose Server im Desktop-Client den externen Server aktivieren, HTTPS-URL und Verbindungsschlüssel eingeben und /config/workspace als entferntes Arbeitsverzeichnis festlegen.
    4. Einen Modellanbieter im verbundenen Desktop-Client oder in den Umgebungsvariablen der Olares-Anwendung konfigurieren. Modelle und API-Schlüssel für Modellanbieter sind nicht enthalten.

    Aufgaben werden auf Olares ausgeführt. Diese Anwendung bietet einen Backend-Dienst und ein Verwaltungsterminal, keine Chatoberfläche im Browser. Der Zugriff auf Home und External ist optional und standardmäßig deaktiviert. Automatische KI-Sitzungstitel sind standardmäßig deaktiviert, damit sie bei Modellen mit nur einer gleichzeitigen Anfrage nicht mit Unterhaltungen konkurrieren. Du kannst sie in den Anwendungseinstellungen aktivieren.
