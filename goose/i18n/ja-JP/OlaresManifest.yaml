metadata:
  title: Goose
  description: "ネイティブ Goose Desktop クライアント向けのパーソナル AI エージェントバックエンド"
spec:
  fullDescription: |
    Goose は、プログラミング、調査、文章作成、ワークフローに使えるオープンソースの AI エージェントです。このアプリは Olares 上でエージェントのバックエンドを実行し、パソコンのネイティブ Goose Desktop クライアントから利用できます。

    機能
    - ACP を介して Goose Desktop を Olares 上のエージェントに接続。
    - 設定、セッション、Recipes、タスクの出力をアプリの永続ストレージに保存。
    - 対応するモデルプロバイダー、OpenAI 互換エンドポイント、MCP 拡張機能に接続。
    - 管理ターミナルで CLI の会話と設定を実行。

    使い始めるには
    1. パソコンに Goose Desktop 1.54.0 をインストールし、Olares ネットワークに接続します。
    2. Goose Terminal を開き、次のコマンドを実行します：printenv GOOSE_SERVER__SECRET_KEY
    3. Olares の設定で Goose ACP の入口 URL を確認します。クライアントの Settings > goose Server で外部サーバーを有効にし、HTTPS URL と接続キーを入力します。リモート作業ディレクトリは /config/workspace に設定します。
    4. AI Router のデフォルトチャットモデルが設定されています。他社のモデルを使用する場合は、アプリの環境変数で設定を変更してください。

    タスクは Olares 上で実行されます。このアプリはバックエンドサービスと管理ターミナルを提供し、ブラウザーのチャット画面は提供しません。Home と External へのアクセスは任意で、デフォルトでは無効です。同時に 1 件しか処理できないモデルで会話と競合しないよう、AI によるセッションタイトルの自動生成もデフォルトで無効です。アプリの設定で有効にできます。
