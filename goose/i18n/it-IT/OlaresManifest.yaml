metadata:
  title: Goose
  description: "Backend personale di agente IA per il client nativo Goose Desktop"
spec:
  fullDescription: |
    Goose è un agente IA open source per programmazione, ricerca, scrittura e flussi di lavoro. Questa applicazione esegue il backend dell’agente su Olares, mentre utilizzi il client nativo Goose Desktop sul tuo computer.

    Funzionalità
    - Collegare Goose Desktop al tuo agente ospitato su Olares tramite ACP.
    - Conservare configurazione, sessioni, Recipes e risultati nello spazio di archiviazione persistente dell’applicazione.
    - Collegare fornitori di modelli supportati, endpoint compatibili con OpenAI ed estensioni MCP.
    - Usare il terminale di amministrazione per conversazioni CLI e configurazione.

    Primi passi
    1. Installa Goose Desktop 1.54.0 sul computer e connettiti alla rete Olares.
    2. Apri Goose Terminal ed esegui: printenv GOOSE_SERVER__SECRET_KEY
    3. Trova l’URL dell’accesso Goose ACP nelle impostazioni di Olares. In Settings > goose Server del client, abilita il server esterno, inserisci l’URL HTTPS e la chiave di connessione e imposta /config/workspace come directory di lavoro remota.
    4. Il modello di chat predefinito di AI Router è già configurato. Per usare altri modelli di terze parti, modifica le variabili d’ambiente dell’applicazione.

    Le attività vengono eseguite su Olares. Questa applicazione offre un servizio backend e un terminale di amministrazione, senza un’interfaccia di chat nel browser. L’accesso a Home ed External è facoltativo e disabilitato per impostazione predefinita. I titoli delle sessioni generati dall’IA sono disabilitati per impostazione predefinita per evitare di competere con le conversazioni sui modelli che consentono una sola richiesta simultanea. Puoi abilitarli nelle impostazioni dell’applicazione.
