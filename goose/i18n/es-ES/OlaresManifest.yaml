metadata:
  title: Goose
  description: "Backend personal de agente de IA para el cliente nativo Goose Desktop"
spec:
  fullDescription: |
    Goose es un agente de IA de código abierto para programación, investigación, escritura y flujos de trabajo. Esta aplicación ejecuta el backend del agente en Olares, mientras utilizas el cliente nativo Goose Desktop en tu ordenador.

    Funciones
    - Conectar Goose Desktop con tu agente alojado en Olares mediante ACP.
    - Conservar la configuración, las sesiones, las Recipes y los resultados en el almacenamiento persistente de la aplicación.
    - Conectar proveedores de modelos compatibles, endpoints compatibles con OpenAI y extensiones MCP.
    - Utilizar el terminal de administración para conversaciones por CLI y configuración.

    Primeros pasos
    1. Instala Goose Desktop 1.54.0 en tu ordenador y conéctate a la red de Olares.
    2. Abre Goose Terminal y ejecuta: printenv GOOSE_SERVER__SECRET_KEY
    3. Busca la URL de la entrada Goose ACP en los ajustes de Olares. En Settings > goose Server del cliente, activa el servidor externo, introduce la URL HTTPS y la clave de conexión y establece /config/workspace como directorio de trabajo remoto.
    4. Configura un proveedor de modelos en el cliente conectado o en las variables de entorno de la aplicación Olares. No se incluyen modelos ni claves API de proveedores.

    Las tareas se ejecutan en Olares. Esta aplicación ofrece un servicio backend y un terminal de administración, sin interfaz de chat en el navegador. El acceso a Home y External es opcional y está desactivado por defecto. Los títulos de sesión generados por IA están desactivados por defecto para evitar competir con las conversaciones en modelos que solo admiten una solicitud simultánea. Puedes activarlos en los ajustes de la aplicación.
