metadata:
  description: "Qwen3 Forced Aligner 0.6B for word-level alignment (review submission)."
  title: Qwen3 Forced Aligner

spec:
  fullDescription: |
    **模型概览**
    Qwen3 Forced Aligner 0.6B for word-level alignment (review submission).

    **预设配置**
    - 模型：`Qwen/Qwen3-ForcedAligner-0.6B`
    - 来源：`hf://Qwen/Qwen3-ForcedAligner-0.6B`
    - 能力：`align`
    - GPU 显存：`4Gi`
    - 引擎：Qwen Forced Aligner

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
