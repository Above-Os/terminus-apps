metadata:
  description: Un modello per associare le parole di una trascrizione ai relativi tempi in una registrazione
  title: Qwen3 Forced Aligner

spec:
  upgradeDescription: |
    v1.0.29: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    Qwen3 Forced Aligner riceve una registrazione audio e la sua trascrizione esistente, quindi indica l'inizio e la fine di ogni parola. Sincronizza un testo noto con il parlato; non crea autonomamente una trascrizione.

    **Funzionalità principali**
    - Associare le parole della trascrizione alle posizioni in una registrazione.
    - Produrre marcatori temporali a livello di parola per le lingue supportate.
    - Supportare la sincronizzazione di sottotitoli e trascrizioni.
    - Rendere l'allineamento disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `4Gi` di memoria video.
