metadata:
  description: Ein Modell zum zeitlichen Zuordnen von Transkriptwörtern in einer Aufnahme
  title: Qwen3 Forced Aligner

spec:
  upgradeDescription: |
    v1.0.29: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    Qwen3 Forced Aligner verarbeitet eine Audioaufnahme und das vorhandene Transkript und markiert Anfang und Ende jedes Wortes. Es synchronisiert bekannten Text mit Sprache und erstellt nicht selbstständig ein Transkript.

    **Hauptfunktionen**
    - Transkriptwörter Positionen in einer Audioaufnahme zuordnen.
    - Zeitstempel auf Wortebene für unterstützte Sprachen erzeugen.
    - Untertitel und Transkripte synchronisieren.
    - Ausrichtung für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `4Gi` Grafikspeicher ist erforderlich.
