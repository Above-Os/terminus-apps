spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    Qwen3 Forced Aligner 0.6B for word-level alignment.

    **Configuration**
    - Model: `Qwen/Qwen3-ForcedAligner-0.6B`
    - Source: `hf://Qwen/Qwen3-ForcedAligner-0.6B`
    - Capabilities: `align`
    - Required GPU memory: `4Gi`
    - Engine: Qwen Forced Aligner

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
