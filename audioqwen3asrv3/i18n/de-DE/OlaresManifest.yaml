metadata:
  description: Ein mehrsprachiges Spracherkennungsmodell für Aufnahmen und Live-Audio
  title: Qwen3-ASR 1.7B

spec:
  upgradeDescription: |
    v1.0.32: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    Qwen3-ASR 1.7B wandelt gesprochene Sprache in mehreren Sprachen in Text um. Es kann vollständige Aufnahmen transkribieren oder eingehendes Live-Audio fortlaufend verarbeiten.

    **Hauptfunktionen**
    - Sprache in mehreren Sprachen transkribieren.
    - Vollständige Audioaufnahmen verarbeiten.
    - Streaming-Spracherkennung für Live-Audio unterstützen.
    - Transkriptionen für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `12Gi` Grafikspeicher ist erforderlich.
