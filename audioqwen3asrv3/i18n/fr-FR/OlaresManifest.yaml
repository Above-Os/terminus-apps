metadata:
  description: Un modèle de reconnaissance vocale multilingue pour les enregistrements et l'audio en direct
  title: Qwen3-ASR 1.7B

spec:
  upgradeDescription: |
    v1.0.38: Le moteur v1.1.53 : sur les GPU Intel, lorsque le GPU refuse un lot faute de mémoire vidéo, les transcriptions suivantes ne sont plus corrompues, et la taille des lots sur Intel Arc s'appuie sur une mesure plus précise de la mémoire vidéo.
    v1.0.37: Le moteur v1.1.52 transcrit sur les GPU Intel les enregistrements de plus de 90 secondes en segments découpés aux pauses : la mémoire vidéo n'augmente plus avec la durée de l'enregistrement. La transcription par lots sur Intel Arc reste dans sa mémoire vidéo.
    v1.0.36: Le moteur v1.1.50 charge le modèle une seule fois sur les GPU Intel ; la mémoire vidéo Intel requise passe à `5Gi`. Les enregistrements de plus de 30 secondes ne sont plus tronqués.
    v1.0.33: Réinitialiser l’état d’exécution obsolète en conservant la configuration du modèle et démarrer le moteur après le nettoyage.
    v1.0.32: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    Qwen3-ASR 1.7B convertit la parole en texte dans plusieurs langues. Il peut transcrire un enregistrement complet ou traiter un flux audio en direct à mesure qu'il arrive.

    **Fonctionnalités principales**
    - Transcrire la parole dans plusieurs langues.
    - Traiter des enregistrements audio complets.
    - Prendre en charge la reconnaissance en continu pour l'audio en direct.
    - Mettre la transcription à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `12Gi` de mémoire vidéo est requis.
