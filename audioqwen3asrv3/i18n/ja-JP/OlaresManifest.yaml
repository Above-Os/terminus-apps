metadata:
  description: 録音とライブ音声に対応する多言語音声認識モデル
  title: Qwen3-ASR 1.7B

spec:
  upgradeDescription: |
    v1.0.37: エンジンを v1.1.52 に更新しました。Intel GPU では 90 秒を超える録音を無音の箇所で区切って文字起こしするため、録音が長くなっても GPU メモリが増えなくなりました。Intel Arc での一括文字起こしも GPU メモリの範囲内に収まります。
    v1.0.36: エンジンを v1.1.50 に更新しました。Intel GPU ではモデルを一度だけ読み込むため、Intel の GPU メモリ要件が `5Gi` に下がります。30 秒を超える録音が途中で切れなくなりました。
    v1.0.33: モデル設定を保持して古い実行状態を消去し、消去の完了後にエンジンを起動します。
    v1.0.32: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    Qwen3-ASR 1.7Bは、複数言語の音声をテキストに変換します。録音全体の文字起こしに加え、入力中のライブ音声を逐次処理できます。

    **主な機能**
    - 複数の言語で音声を文字起こしします。
    - 録音済みの音声全体を処理します。
    - ライブ音声のストリーミング認識に対応します。
    - 対応するOlaresアプリから文字起こし機能を利用できます。

    `12Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。
