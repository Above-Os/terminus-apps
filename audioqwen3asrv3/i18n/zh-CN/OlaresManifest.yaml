metadata:
  description: 用于录音和实时音频的多语言语音识别模型
  title: Qwen3-ASR 1.7B

spec:
  upgradeDescription: |
    v1.0.37: 引擎升级到 v1.1.52：在 Intel GPU 上，超过 90 秒的录音会在停顿处切段识别，显存不再随录音变长而增加；Intel Arc 上的批量转写也不会再超出显存。
    v1.0.36: 引擎升级到 v1.1.50：Intel GPU 上模型只加载一次，Intel 显存需求降到 `5Gi`；超过 30 秒的录音不再被截断。
    v1.0.33: 保留模型配置并清理旧运行状态，引擎等待清理完成后再启动。
    v1.0.32: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    Qwen3-ASR 1.7B 可将多种语言的语音转换为文本。它既能转写完整录音，也能在实时音频传入时持续处理。

    **主要功能**
    - 转写多种语言的语音。
    - 处理完整的音频录音。
    - 支持实时音频的流式语音识别。
    - 向兼容的 Olares 应用提供转写能力。

    需要配备至少 `12Gi` 显存的兼容 NVIDIA GPU。
