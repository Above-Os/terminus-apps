metadata:
  description: "Qwen3-ASR 1.7B for offline + streaming STT."
  title: Qwen3-ASR 1.7B

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Qwen3-ASR 1.7B for offline + streaming STT.

    **配置**
    - 模型：`Qwen/Qwen3-ASR-1.7B`
    - 来源：`hf://Qwen/Qwen3-ASR-1.7B`
    - 能力：`stt,stt_stream`
    - GPU 显存：`12Gi`
    - 引擎：Qwen ASR (qwen-asr / vLLM)

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
