metadata:
  description: Un modelo de reconocimiento de voz multilingüe para grabaciones y audio en directo
  title: Qwen3-ASR 1.7B

spec:
  upgradeDescription: |
    v1.0.36: El motor v1.1.50 carga el modelo una sola vez en GPU Intel, por lo que la memoria gráfica Intel requerida baja a `5Gi`. Las grabaciones de más de 30 segundos ya no se cortan.
    v1.0.33: Restablecer el estado de ejecución obsoleto conservando la configuración del modelo e iniciar el motor después de la limpieza.
    v1.0.32: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    Qwen3-ASR 1.7B convierte en texto el habla en varios idiomas. Puede transcribir una grabación completa o procesar audio en directo a medida que se recibe.

    **Funciones principales**
    - Transcribir voz en varios idiomas.
    - Procesar grabaciones de audio completas.
    - Admitir reconocimiento en streaming para audio en directo.
    - Poner la transcripción a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `12Gi` de memoria gráfica.
