metadata:
  title: HomeBox
  description: 家庭ユーザー向け在庫・整理システム HomeBox の継続版
spec:
  fullDescription: |
    HomeBox は家庭ユーザー向けに作られた在庫・整理システムです！シンプルさと使いやすさに重点を置き、家庭の在庫・整理・管理に最適です。開発にあたって次の原則を意識しました：
    - シンプルだが拡張可能 — 複雑なセットアップ不要で使いやすく、望むインフラ水準まで拡張できます。
    - 非常に高速 — Go で書かれており極めて高速で、必要リソースは最小限。一般にアイドル時のメモリ使用量はコンテナ全体で 50MB 未満です。
    - ポータブル — どこでも動くよう設計。SQLite と組み込み Web UI でデプロイ・利用・バックアップが容易です。

    **主な機能**
    - 豊富な整理 — カテゴリ、場所、タグでアイテムを整理。追加情報用のカスタムフィールドも作成可能。
    - 強力な検索 — 強力な検索機能で在庫からすばやく見つける。
    - 画像アップロード — アイテムの画像をアップロードして識別しやすく。
    - 書類・保証の追跡 — 重要な書類と保証を管理。
    - 購入・メンテナンス追跡 — 購入日、価格、メンテナンスタイムテーブルを追跡。
    - レスポンシブデザイン — デスクトップ、タブレット、スマートフォンなどあらゆるデバイスで動作。
  upgradeDescription: |
    新機能
    - バーコードによる製品取得 @crumbowl in #818
    - Unix ソケットと systemd ソケットのリッスン対応 @balki in #878
    - feat: Markdown の画像サイズ設定プラグイン @adamantike in #901
    - postgres 証明書認証のサポート @tankerkiller125 in #897
    - 強化 Docker イメージを作成 @tankerkiller125 in #955

    注意
    - 新しい -hardened サフィックスの Docker イメージは実験的で、他のビルドでは通常ない不具合がある場合があります。

    主なバグ修正
    - サムネイル作成時にアスペクト比を使用 @tankerkiller125 in #857
    - Windows パスの修正 @tankerkiller125 in #917
    - アイテムに追加添付を付けたときの写真表示問題を修正

    変更内容
    - 論理が逆で無視されていた HBOX_LOG_LEVEL 環境変数を修正
    - 古い sqlite タイムスタンプの移行 @mcarbonne in #869
    - フォークでの GitHub Actions を許可 @mcarbonne in #870
    - 生涯保証有効時の保証セクション表示を修正
    - フロントエンド Label Selector の重複タグ作成を修正
    - 印刷コマンドテンプレートに label パラメータを渡す @alhafoudh in #886
    - secrets アクセス用 GitHub Actions Docker ワークフロー構文エラーを修正
    - fix(frontend/scanner): QR スキャン成功後にスキャナーモーダルを閉じる @Ahmosys in #889
    - fix(frontend/location): 「Create and Add another」で親ロケーションを保持 @Ahmosys in #879
    - シャットダウン時のサムネイル購読でのヌルポインタパニックを修正
    - アクセント無視の検索 @mattogodoy in #887
    - Daily Analytics @tankerkiller125 in #896
    - Windows ビルド修正と unix ソケット対応の再適用 @balki in #906
    - ラベルメーカーへの外部ラベルサービス対応 @alhafoudh in #913
    - Postgres でのアクセント無視検索を修正 @mattogodoy in #932
    - fix: ラベル説明を最大 1000 文字まで許可 @adamantike in #948
    - 添付修正のため content disposition を inline に変更 @tonyaellie in #950
    - ラベル名の長さを修正 @natilou in #822
    - feat: 複製の改善 @tonyaellie in #927
    - fix: log.Fatal をエラー返却に置き換え @adamantike in #953
    - ダイアログ改善、編集で画像ダイアログを開いてから削除するオプション @tonyaellie in #951

    詳細: https://github.com/sysadminsmedia/homebox/releases/tag/v0.21.0
