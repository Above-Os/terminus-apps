metadata:
  title: HomeBox
  description: Une continuation de HomeBox, le système d'inventaire et d'organisation conçu pour l'utilisateur domestique
spec:
  fullDescription: |
    HomeBox est le système d'inventaire et d'organisation conçu pour l'utilisateur domestique ! Avec un accent sur la simplicité et la facilité d'utilisation, Homebox est la solution idéale pour votre inventaire, organisation et gestion à domicile. Lors du développement, nous avons gardé ces principes à l'esprit :
    - Simple mais extensible — Homebox est conçu pour être simple et facile à utiliser. Aucune configuration compliquée. Mais extensible au niveau d'infrastructure que vous souhaitez.
    - Extrêmement rapide — Homebox est écrit en Go, ce qui le rend très rapide et peu gourmand. En général, l'utilisation mémoire au repos est inférieure à 50 Mo pour tout le conteneur.
    - Portable — Homebox est conçu pour être portable et fonctionner partout. Nous utilisons SQLite et une interface web intégrée pour faciliter le déploiement, l'usage et la sauvegarde.

    **Fonctionnalités clés**
    - Organisation riche — Organisez vos articles en catégories, emplacements et tags. Vous pouvez aussi créer des champs personnalisés.
    - Recherche puissante — Trouvez rapidement des articles grâce à la recherche puissante.
    - Téléversement d'images — Téléversez des images de vos articles pour les identifier facilement.
    - Suivi documents et garanties — Suivez les documents et garanties importants.
    - Suivi achats et maintenance — Suivez dates d'achat, prix et calendriers de maintenance.
    - Design responsive — Homebox fonctionne sur tout appareil : ordinateurs, tablettes et smartphones.
  upgradeDescription: |
    Nouvelles fonctionnalités
    - Récupération de produits via codes-barres par @crumbowl dans #818
    - Prise en charge des sockets unix et systemd par @balki dans #878
    - feat : Plugin pour définir les tailles d'image en Markdown par @adamantike dans #901
