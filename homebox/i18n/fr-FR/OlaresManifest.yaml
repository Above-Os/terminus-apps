    - Migration pour les anciens horodatages sqlite par @mcarbonne dans #869
    - Autoriser GitHub Actions sur les forks par @mcarbonne dans #870
    - Visibilité de la section garantie avec garantie à vie activée — corrigé
    - Création de tags en double dans le Label Selector frontend — corrigé
    - Passer le paramètre label au modèle de commande d'impression par @alhafoudh dans #886
    - Erreurs de syntaxe du workflow Docker GitHub Actions pour l'accès aux secrets — corrigé
    - fix(frontend/scanner) : fermer le modal scanner après un scan QR réussi par @Ahmosys dans #889
    - fix(frontend/location) : conserver l'emplacement parent avec « Create and Add another » par @Ahmosys dans #879
    - Panic par déréférencement nul dans la subscription miniature à l'arrêt — corrigé
    - Recherche insensible aux accents par @mattogodoy dans #887
    - Daily Analytics par @tankerkiller125 dans #896
    - Build Windows et support unix socket réappliqué par @balki dans #906
    - Support d'un service d'étiquettes externe pour le label maker par @alhafoudh dans #913
    - Recherche insensible aux accents pour Postgres par @mattogodoy dans #932
    - fix : Autoriser jusqu'à 1000 caractères pour la description d'étiquette par @adamantike dans #948
    - Content disposition en inline pour corriger les pièces jointes par @tonyaellie dans #950
    - Longueur du nom d'étiquette par @natilou dans #822
