    - Image docker renforcée créée par @tankerkiller125 dans #955

    Note
    - Nos nouvelles images docker à suffixe -hardened sont expérimentales et peuvent présenter des bugs inhabituels dans d'autres builds.

    Corrections majeures
    - Utiliser le ratio d'aspect lors de la création des miniatures par @tankerkiller125 dans #857
    - Corriger les chemins Windows par @tankerkiller125 dans #917
    - Corriger l'affichage des photos lors de l'ajout de pièces jointes supplémentaires

    Changements
