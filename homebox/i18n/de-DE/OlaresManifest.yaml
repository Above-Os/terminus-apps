metadata:
  title: HomeBox
  description: Eine Fortsetzung von HomeBox — das Inventar- und Organisationssystem für den Heimnutzer
spec:
  fullDescription: |
    HomeBox ist das Inventar- und Organisationssystem für den Heimnutzer! Mit Fokus auf Einfachheit und Benutzerfreundlichkeit ist Homebox die perfekte Lösung für Inventar, Organisation und Verwaltung zu Hause. Bei der Entwicklung haben wir folgende Prinzipien im Blick behalten:
    - Einfach, aber erweiterbar — Homebox ist einfach und leicht zu bedienen. Keine komplizierte Einrichtung. Aber erweiterbar auf jedes Infrastruktur-Niveau, das Sie möchten.
    - Blitzschnell — Homebox ist in Go geschrieben, extrem schnell und benötigt minimale Ressourcen. Im Idle liegt der Speicherverbrauch typischerweise unter 50 MB für den gesamten Container.
    - Portabel — Homebox ist portabel und läuft überall. Wir nutzen SQLite und eine eingebettete Web-UI für einfache Bereitstellung, Nutzung und Sicherung.

    **Hauptfunktionen**
    - Reichhaltige Organisation — Organisieren Sie Artikel in Kategorien, Orten und Tags. Erstellen Sie auch benutzerdefinierte Felder für zusätzliche Informationen.
    - Leistungsstarke Suche — Finden Sie Artikel in Ihrem Inventar schnell mit der leistungsstarken Suche.
    - Bild-Upload — Laden Sie Bilder Ihrer Artikel hoch, um sie leicht zu identifizieren.
    - Dokument- und Garantieverfolgung — Behalten Sie wichtige Dokumente und Garantien im Blick.
    - Kauf- & Wartungsverfolgung — Verfolgen Sie Kaufdaten, Preise und Wartungspläne.
    - Responsives Design — Homebox funktioniert auf jedem Gerät: Desktop, Tablet und Smartphone.
  upgradeDescription: |
    Neue Funktionen
    - Produktabruf per Barcode von @crumbowl in #818
    - Unterstützung für Unix-Sockets und systemd-Sockets von @balki in #878
    - feat: Plugin zum Setzen von Bildgrößen in Markdown von @adamantike in #901
    - Unterstützung für Postgres-Zertifikatsauthentifizierung von @tankerkiller125 in #897
    - Gehärtetes Docker-Image erstellt von @tankerkiller125 in #955

    Hinweis
    - Unsere neuen Docker-Images mit Suffix -hardened sind experimentell und können Bugs aufweisen, die in anderen Builds normalerweise nicht auftreten.

    Wichtige Bugfixes
    - Seitenverhältnis beim Erstellen von Thumbnails verwenden von @tankerkiller125 in #857
    - Windows-Pfade korrigiert von @tankerkiller125 in #917
    - Anzeigeproblem bei Fotos behoben, wenn zusätzliche Anhänge zu Artikeln hinzugefügt werden

    Was sich geändert hat
    - HBOX_LOG_LEVEL-Umgebungsvariable wurde wegen rückwärts wirkender Logik ignoriert — behoben
    - Migration für alte SQLite-Zeitstempel von @mcarbonne in #869
    - GitHub Actions auf Forks erlauben von @mcarbonne in #870
    - Sichtbarkeit des Garantieabschnitts bei aktivierter Lebenszeitgarantie korrigiert
    - Doppelte Tag-Erstellung im Label Selector im Frontend behoben
    - Label-Parameter an Print-Command-Template übergeben von @alhafoudh in #886
    - Syntaxfehler im GitHub Actions Docker-Workflow für Secrets-Zugriff behoben
    - fix(frontend/scanner): Scanner-Modal nach erfolgreichem QR-Scan schließen von @Ahmosys in #889
    - fix(frontend/location): übergeordneten Ort bei „Create and Add another“ beibehalten von @Ahmosys in #879
    - Nullzeiger-Panic in Thumbnail-Subscription beim Herunterfahren behoben
    - Suche akzentunempfindlich gemacht von @mattogodoy in #887
    - Daily Analytics von @tankerkiller125 in #896
    - Windows-Build und Unix-Socket-Unterstützung erneut angewendet von @balki in #906
    - Externe Label-Service-Unterstützung für Label Maker von @alhafoudh in #913
    - Akzentunempfindliche Suche für Postgres behoben von @mattogodoy in #932
    - fix: Bis zu 1000 Zeichen für Label-Beschreibung erlauben von @adamantike in #948
    - Content-Disposition auf inline geändert, um Anhänge zu reparieren von @tonyaellie in #950
    - Label-Namenslänge korrigiert von @natilou in #822
    - feat: verbessertes Duplizieren von @tonyaellie in #927
    - fix: log.Fatal zugunsten von Fehler-Rückgaben entfernt von @adamantike in #953
