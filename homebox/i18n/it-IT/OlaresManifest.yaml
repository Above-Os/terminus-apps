    - Migrazione per vecchi timestamp sqlite di @mcarbonne in #869
    - Consentire GitHub Actions sui fork di @mcarbonne in #870
    - Visibilità sezione garanzia con garanzia a vita abilitata — corretto
    - Creazione duplicata di tag nel Label Selector frontend — corretto
    - Passare il parametro label al template del comando di stampa di @alhafoudh in #886
    - Errori di sintassi nel workflow Docker GitHub Actions per accesso ai secrets — corretto
    - fix(frontend/scanner): chiudere il modal scanner dopo scansione QR riuscita di @Ahmosys in #889
    - fix(frontend/location): preservare la location padre con «Create and Add another» di @Ahmosys in #879
    - Panic per null pointer nella subscription thumbnail in shutdown — corretto
    - Ricerca accent-insensitive di @mattogodoy in #887
    - Daily Analytics di @tankerkiller125 in #896
    - Build Windows e supporto unix socket riapplicato di @balki in #906
    - Supporto servizio etichette esterno per label maker di @alhafoudh in #913
    - Ricerca accent-insensitive per Postgres di @mattogodoy in #932
