metadata:
  title: HomeBox
  description: Una continuazione di HomeBox, il sistema di inventario e organizzazione per l'utente domestico
spec:
  fullDescription: |
    HomeBox è il sistema di inventario e organizzazione pensato per l'utente domestico! Con un focus su semplicità e facilità d'uso, Homebox è la soluzione ideale per inventario, organizzazione e gestione domestica. Nello sviluppo abbiamo tenuto presenti questi principi:
    - Semplice ma espandibile — Homebox è semplice e facile da usare. Nessuna configurazione complicata. Ma espandibile al livello di infrastruttura che desideri.
    - Estremamente veloce — HomeBox è scritto in Go, è molto veloce e richiede risorse minime. In generale, l'uso di memoria a riposo è inferiore a 50 MB per l'intero container.
    - Portabile — Homebox è progettato per essere portabile e funzionare ovunque. Usiamo SQLite e una Web UI incorporata per semplificare deploy, uso e backup.

    **Funzionalità principali**
    - Organizzazione ricca — Organizza gli articoli in categorie, luoghi e tag. Puoi anche creare campi personalizzati.
    - Ricerca potente — Trova rapidamente gli articoli con la potente funzione di ricerca.
    - Upload immagini — Carica immagini degli articoli per identificarli facilmente.
    - Tracciamento documenti e garanzie — Tieni traccia di documenti e garanzie importanti.
    - Tracciamento acquisti e manutenzione — Registra date di acquisto, prezzi e piani di manutenzione.
    - Design responsive — Homebox funziona su qualsiasi dispositivo: desktop, tablet e smartphone.
  upgradeDescription: |
    Nuove funzionalità
    - Recupero prodotti tramite barcode di @crumbowl in #818
    - Supporto per socket unix e socket systemd di @balki in #878
    - feat: Plugin per impostare dimensioni immagine in Markdown di @adamantike in #901
    - Supporto autenticazione certificato postgres di @tankerkiller125 in #897
    - Immagine docker hardened creata di @tankerkiller125 in #955

    Nota
    - Le nuove immagini docker con suffisso -hardened sono sperimentali e possono presentare bug non tipici di altre build.

    Bug fix principali
    - Usare l'aspect ratio nella creazione delle miniature di @tankerkiller125 in #857
    - Corretti i percorsi Windows di @tankerkiller125 in #917
    - Risolto problema di visualizzazione foto quando si aggiungono allegati extra agli articoli

    Cosa è cambiato
