metadata:
  title: HomeBox
  description: Una continuación de HomeBox, el sistema de inventario y organización para el usuario doméstico
spec:
  fullDescription: |
    ¡HomeBox es el sistema de inventario y organización pensado para el usuario doméstico! Con foco en la simplicidad y facilidad de uso, Homebox es la solución perfecta para tu inventario, organización y gestión en casa. Al desarrollar este proyecto, hemos tenido en cuenta estos principios:
    - Simple pero ampliable — Homebox está diseñado para ser simple y fácil de usar. Sin configuración complicada. Pero ampliable al nivel de infraestructura que quieras.
    - Extremadamente rápido — Homebox está escrito en Go, lo que lo hace muy rápido y con requisitos mínimos. En general, el uso de memoria en reposo es inferior a 50 MB para todo el contenedor.
    - Portable — Homebox está diseñado para ser portable y ejecutarse en cualquier sitio. Usamos SQLite y una UI web integrada para facilitar el despliegue, uso y copia de seguridad.

    **Funciones clave**
    - Organización rica — Organiza tus artículos en categorías, ubicaciones y etiquetas. También puedes crear campos personalizados.
    - Búsqueda potente — Encuentra rápidamente artículos en tu inventario con la potente búsqueda.
    - Subida de imágenes — Sube imágenes de tus artículos para identificarlos fácilmente.
    - Seguimiento de documentos y garantías — Controla documentos y garantías importantes.
    - Seguimiento de compras y mantenimiento — Registra fechas de compra, precios y calendarios de mantenimiento.
    - Diseño adaptable — Homebox funciona en cualquier dispositivo: escritorio, tablet y smartphone.
  upgradeDescription: |
    Nuevas funciones
    - Obtención de productos mediante códigos de barras por @crumbowl en #818
    - Compatibilidad con sockets unix y sockets systemd por @balki en #878
    - feat: Plugin para definir tamaños de imagen en Markdown por @adamantike en #901
    - Compatibilidad con autenticación por certificado de postgres por @tankerkiller125 en #897
    - Imagen docker reforzada creada por @tankerkiller125 en #955

    Nota
    - Nuestras nuevas imágenes docker con sufijo -hardened son experimentales y pueden tener errores no habituales en otras builds.

    Correcciones importantes
    - Usar la relación de aspecto al crear miniaturas por @tankerkiller125 en #857
    - Corregir rutas de Windows por @tankerkiller125 en #917
    - Corregir la visualización de fotos al añadir adjuntos adicionales a los artículos

    Qué cambió
    - Corregida la variable HBOX_LOG_LEVEL ignorada por lógica invertida
    - Migración para marcas de tiempo sqlite antiguas por @mcarbonne en #869
    - Permitir GitHub Actions en forks por @mcarbonne en #870
    - Corregida la visibilidad de la sección de garantía cuando la garantía de por vida está activada
    - Corregida la creación duplicada de etiquetas en el Label Selector del frontend
    - Pasar el parámetro label a la plantilla del comando de impresión por @alhafoudh en #886
    - Corregidos errores de sintaxis del workflow Docker de GitHub Actions para acceso a secrets
    - fix(frontend/scanner): cerrar el modal del escáner tras un escaneo QR correcto por @Ahmosys en #889
    - fix(frontend/location): conservar la ubicación padre al usar «Create and Add another» por @Ahmosys en #879
    - Corregido panic por desreferencia nula en la suscripción de miniaturas al apagar
    - Búsqueda sin distinción de acentos por @mattogodoy en #887
    - Daily Analytics por @tankerkiller125 en #896
    - Corregida la build de Windows y reaplicado el soporte de unix socket por @balki en #906
    - Compatibilidad con servicio externo de etiquetas en el label maker por @alhafoudh en #913
    - Corregida la búsqueda sin acentos en bases Postgres por @mattogodoy en #932
    - fix: Permitir hasta 1000 caracteres en la descripción de etiqueta por @adamantike en #948
    - Cambiar content disposition a inline para corregir adjuntos por @tonyaellie en #950
    - Corregir longitud del nombre de etiqueta por @natilou en #822
    - feat: duplicado mejorado por @tonyaellie en #927
    - fix: Eliminar log.Fatal a favor de devolver errores por @adamantike en #953
    - mejorar diálogos, opción de abrir el diálogo de imagen en edición y luego eliminar por @tonyaellie en #951

    Más detalles: https://github.com/sysadminsmedia/homebox/releases/tag/v0.21.0
