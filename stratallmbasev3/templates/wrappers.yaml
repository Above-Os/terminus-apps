    #!/bin/sh
    set -eu
    for cand in \
        "${STRATA_PYTHON:-}" \
        /opt/strata/.venv/bin/python \
        /opt/strata/.venv/bin/python3 \
        /opt/strata/terminal/python/bin/python3 \
        /opt/strata/python/bin/python3 \
        "$(command -v python3 2>/dev/null || true)"; do
        if [ -n "$cand" ] && [ -f "$cand" ]; then
            exec "$cand" /llm-init/wrappers/strata-healthcheck.py
        fi
    done
    exit 1
  strata-healthcheck.py: |
    #!/usr/bin/env python3
    import json
    import os
    import sys
    import urllib.request


    def healthy(state):
        return isinstance(state, dict) and state.get('status') == 'ok' and state.get('loaded') is True


    def main():
        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
        try:
            with opener.open('http://127.0.0.1:' + os.environ.get('STRATA_PORT', '8080') + '/health', timeout=3) as response:
                return 0 if healthy(json.load(response)) else 1
        except (OSError, ValueError):
            return 1


    if __name__ == '__main__':
        sys.exit(main())
