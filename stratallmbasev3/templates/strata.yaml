{{- include "strata.validate" . -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $us := .Values.userspace | default dict -}}
{{- $appCommon := $us.appCommon | default "/olares/common" -}}
{{- $res := include "strata.resources" . | fromJson -}}
{{- $gpuMiB := include "llmbase.gpuMiB" $res.gpuMemory -}}
{{- $runStateHostPath := include "strata.runStateHostPath" . -}}
{{- $dataHostPath := include "strata.dataHostPath" . -}}
{{- $vision := include "strata.vision" . -}}
{{- $build := include "strata.build" . | fromJson -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  # Primary workload: named after the release (== appid stratallmbasev3) for
  # allowMultipleInstall. The Service name stays "strata": llm-init derives
  # the engine URL from ENGINE_KIND.
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    applications.app.bytetrade.io/gpu-inject: strata
spec:
  replicas: {{ .Values.workloads.stratallmbasev3.replicaCount }}
  selector:
    matchLabels: {io.kompose.service: strata}
  strategy: {type: Recreate}
  template:
    metadata:
      labels:
        io.kompose.service: strata
      annotations:
        checksum/wrappers: {{ include (print $.Template.BasePath "/wrappers.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 60
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ $appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: {{ $runStateHostPath | quote }}
            type: DirectoryOrCreate
        - name: strata-data
          hostPath:
            # Tokenizer, setup marks and server.json. The shared HF cache stays
            # read-only in this container; each clone has its own writable tree.
            path: {{ $dataHostPath | quote }}
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: llm-init-wrappers
            defaultMode: 0555
      initContainers:
        - name: init-permissions
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command: [sh, -ec, "chown 1000:1000 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: strata-data, mountPath: /data}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: strata
          image: {{ .Values.images.strata | quote }}
          imagePullPolicy: IfNotPresent
          # bash job control gives the supervisor a process group even without a tty.
          command: [/bin/bash, /llm-init/wrappers/strata.sh]
          env:
            - name: HF_HUB_CACHE
              value: {{ include "strata.hfPath" . | quote }}
            - {name: ENGINE_KIND, value: strata}
            - {name: WRAPPER_COMMON, value: /run/llm-init/wrappers/common.sh}
            - {name: WAIT_TIMEOUT, value: "86400"}
            - {name: WRAPPER_COMMON_WAIT, value: "86400"}
            - {name: STRATA_PORT, value: "8080"}
            - name: STRATA_ALLOWED_HOSTS
              value: strata
            - {name: STRATA_DATA, value: /data}
            - {name: STRATA_FAMILY, value: {{ $build.family | quote }}}
            - {name: STRATA_MODEL, value: {{ $build.model | quote }}}
            - {name: STRATA_VISION, value: {{ $vision | quote }}}
            - {name: XDG_CONFIG_HOME, value: /data/config}
            - {name: XDG_CACHE_HOME, value: /data/cache}
            - {name: XDG_STATE_HOME, value: /data/state}
            - {name: HOME, value: /data/home}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: STRATA_READ_AHEAD, value: "1"}
{{- with (.Values.strata | default dict).cpuThreads }}
            - {name: STRATA_CPU_THREADS, value: {{ . | quote }}}
{{- end }}
            - name: MODEL_NAME
              value: {{ $oe.MODEL_NAME | default "" | quote }}
            - name: MODEL_SOURCE
              value: {{ $oe.MODEL_SOURCE | default "" | quote }}
            - name: ENGINE_ARGS
              value: {{ $oe.ENGINE_ARGS | default "" | quote }}
{{- if $oe.HF_ENDPOINT }}
            - name: HF_ENDPOINT
              value: {{ $oe.HF_ENDPOINT | quote }}
{{- end }}
{{- if $oe.HF_TOKEN }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-secrets, key: HF_TOKEN}
{{- end }}
          ports:
            - {name: http, containerPort: 8080}
          # Olares waits for startupProbe before completing installation.
          # The wrapper can be up while llm-init is still downloading.
          # Readiness stays gated on the loaded model. No liveness probe:
          # a Model Console relaunch may take minutes.
          startupProbe:
            exec:
              command: [/bin/bash, -ec, 'kill -0 1; test -r /run/llm-init/wrappers/common.sh']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 8640
          readinessProbe:
            exec:
              command: [/bin/sh, /llm-init/wrappers/strata-healthcheck.sh]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - {name: hf-cache, mountPath: {{ include "strata.hfPath" . }}, readOnly: true}
            - {name: run-state, mountPath: /run/llm-init, readOnly: true}
            - {name: strata-data, mountPath: /data}
            - {name: wrappers, mountPath: /llm-init/wrappers, readOnly: true}
          resources:
            requests:
              cpu: {{ $res.cpuRequest | quote }}
              memory: {{ $res.memoryRequest | quote }}
              nvidia.com/gpumem: {{ $gpuMiB }}
            limits:
              cpu: {{ $res.cpuLimit | quote }}
              memory: {{ $res.memoryLimit | quote }}
              nvidia.com/gpumem: {{ $gpuMiB }}
---
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: {{ .Release.Namespace }}
spec:
  selector: {io.kompose.service: strata}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
  type: ClusterIP
