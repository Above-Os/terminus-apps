spec:
  versionName: "0.1.6"
  onlyAdmin: true
  fullDescription: |
    Generate images from a description, or add up to ten images and mention them in the prompt. Keep the shape of the first image to edit it, or pick an aspect ratio to compose a new image from the references, such as a person from one image holding a product from another. Paint over the part to change, extend the canvas or remove the background from any result. Results, uploads and the queue are kept on your Olares and shared by every device you open the app on.

    The app runs the model on your Olares for generating and editing images:
    - One prompt box: write a description to generate, or add images to edit them and mention each one in the prompt.
    - Add up to ten images: keep the first image's shape to edit it, or pick an aspect ratio to compose a new image from the references. Mark an image as a person, product or style to say what to keep from it.
    - AI optimize expands your prompt with MiniMax H3 Image's prompt enhancer instructions, using a chat model from Router that also sees the images you add. Pick the model in Settings.
    - Paint over the part of an image to change, extend the canvas, or remove the background, in one or two clicks.
    - A queue and a result grid shared by every device you open it on, with a before and after view for each edit.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with each workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.

    AI optimize needs a chat model application installed and listed in Router. Its instructions are adapted from the prompt enhancer in ComfyUI's MiniMax H3 Image workflow templates (MIT).
  upgradeDescription: |
    Improved language handling for AI prompt rewriting. Keep-language mode explicitly tells the model which language to use, and the English modes ask it to translate the full description. Studio attempts to correct language mismatches and keeps your original prompt if it cannot correct the result.
    If you are upgrading from a per-user installation, uninstall that version before installing this shared release.
  developer: Olares
