metadata:
  title: "H3 Image"
  description: "H3 Image は MiniMax H3 Image で、テキストまたは最大 10 枚の参照画像から画像を生成・編集します"
spec:
  fullDescription: |
    説明文から画像を生成するか、最大 10 枚の画像を追加してプロンプトでそれぞれに触れます。最初の画像の縦横比を保てばその画像を編集し、アスペクト比を選べば参照画像から新しい画像を作ります。たとえば、ある画像の人物に別の画像の商品を持たせることができます。どの結果でも、変えたい部分の塗りつぶし、キャンバスの拡張、背景の削除ができます。結果、アップロードした素材、キューは Olares に保存され、アプリを開くすべてのデバイスで共有されます。

    このアプリは、Olares 上でこのモデルを動かして画像を生成・編集します。
    - プロンプト欄ひとつ：説明を書いて生成するか、画像を追加して編集し、プロンプトでそれぞれに触れます。
    - 最大 10 枚の画像を追加：最初の画像の縦横比を保てば編集、アスペクト比を選べば参照画像から新しい画像を作ります。画像に人物・商品・スタイルの印を付けて、何を残すかを伝えられます。
    - AI 最適化は MiniMax H3 Image のプロンプト拡張指示でプロンプトを書き広げます。Router のチャットモデルを使い、追加した画像もモデルに渡します。モデルは設定で選べます。
    - 変えたい部分の塗りつぶし、キャンバスの拡張、背景の削除が 1〜2 クリックでできます。
    - キューと結果グリッドはすべてのデバイスで共有され、編集ごとに前後を比較できます。
    - アップロードと結果は Olares 上のライブラリに保存され、再起動後も残ります。
    - 各ワークフローを読み込んだ状態で ComfyUI エディターを開き、アプリ以外の変更もできます。
    - 管理者が一度インストールすれば Olares の全員が使えます。キュー、アップロード、結果は各自のもので、プロジェクトを使って選んだ人や全員と共有できます。
    - ファイルは Common/Studio の下に、ユーザーごとのフォルダーで保存されます。
    - モデルは初回起動時にダウンロードされ、他の ComfyUI アプリや FlowStudio と共有されます。

    AI 最適化を使うには、チャットモデルのアプリをインストールし、Router で利用できる状態にする必要があります。指示文は ComfyUI の MiniMax H3 Image ワークフローテンプレートに含まれるプロンプト拡張（MIT）を元にしています。
  upgradeDescription: |
    Studio はバックグラウンドで再接続し、切断が8秒続いた場合にのみ通知を表示します。再接続するとキューが更新され、切断中に生成された画像も複数のページにわたって確認できます。サンプリングの進捗と処理時間は、取得できた場合にキューに表示されます。素材を選ぶ際は、プレビューの読み込み中にプレースホルダーが表示されます。

    ユーザーごとにインストールした旧バージョンから更新する場合は、旧バージョンをアンインストールしてから、この共有バージョンをインストールしてください。

    [このリリースを見る](https://github.com/beclab/flowstudio2/releases/tag/imageminimaxh3image/v0.1.9)
