metadata:
  description: "Pyannote speaker-diarization-community-1."
  title: Pyannote Diarization

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Pyannote speaker-diarization-community-1.

    **配置**
    - 模型：`pyannote-community-1`
    - 来源：`hf://beclab/speaker-diarization-community-1`
    - 能力：`diar`
    - GPU 显存：`4Gi`
    - 引擎：Pyannote speaker diarization

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
