  title: Pyannote Diarization

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    Pyannote speaker-diarization-community-1.

    **Configuration**
    - Model: `pyannote/speaker-diarization-community-1`
    - Source: `hf://beclab/speaker-diarization-community-1`
    - Capabilities: `diar`
    - Required GPU memory: `4Gi`
    - Engine: Pyannote speaker diarization

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
