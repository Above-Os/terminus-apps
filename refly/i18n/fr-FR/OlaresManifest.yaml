metadata:
  title: Refly
  description: L'Agentic Workspace open source pour la collaboration humain-IA
spec:
  fullDescription: |
    Refly.AI est l'Agentic Workspace open source pour la collaboration humain-IA. Mélangez sans friction l'insight humain et l'exécution IA dans des scénarios réels — qu'il s'agisse de prototyper rapidement un design produit, de créer des présentations soignées, d'analyser des sujets brûlants, d'automatiser des workflows de deep research, de générer du contenu marketing multimodal ou d'orchestrer des pipelines opérationnels complexes, Refly permet à votre équipe d'accomplir toute tâche avec transparence et contrôle.

    **Fonctionnalités clés**
    1. Système de conversation multi-thread
    Basé sur une architecture multi-thread innovante permettant la gestion parallèle de contextes de conversation indépendants. Implémente des Agentic Workflows complexes via une gestion d'état efficace et le changement de contexte, dépassant les limites des modèles de dialogue traditionnels.

    2. Framework d'intégration multi-modèles
    - Intégration avec plus de 13 modèles de langage leaders, dont DeepSeek R1, Claude 3.5 Sonnet, Google Gemini 2.0 et OpenAI O3-mini
    - Support du scheduling hybride de modèles et du traitement parallèle
    - Changement flexible de modèle avec interface de conversation unifiée
    - Collaboration multi-modèles sur les bases de connaissances

    3. Capacités de traitement multimodal
    - Formats de fichiers : plus de 7 formats dont PDF, DOCX, RTF, TXT, MD, HTML, EPUB
    - Traitement d'images : formats courants dont PNG, JPG, JPEG, BMP, GIF, SVG, WEBP
    - Traitement par lots intelligent : sélection multi-éléments sur le canvas et analyse IA

    4. Système de compétences alimenté par l'IA
    Intégrant des capacités avancées de Perplexity AI, Stanford Storm et plus :
    - Recherche intelligente sur le web et agrégation d'informations
    - Récupération de connaissances basée sur des bases de données vectorielles
    - Réécriture intelligente de requêtes et recommandations
    - Workflow de génération de documents assisté par l'IA

    5. Système de gestion du contexte
    - Construction précise de bases de connaissances temporaires
    - Mécanisme flexible de sélection de nœuds
    - Corrélation de contexte multidimensionnelle
    - Compréhension intelligente du contexte de type Cursor

    6. Moteur de base de connaissances
    - Import de données hétérogènes multi-sources
    - Architecture de récupération sémantique basée sur RAG
    - Construction intelligente de graphes de connaissances
    - Gestion personnalisée de l'espace de connaissances

    7. Capture intelligente de contenu
    - Capture en un clic depuis les plateformes majeures (Github, Medium, Wikipedia, Arxiv)
    - Analyse et structuration intelligentes du contenu
    - Classification et tagging automatiques des connaissances
    - Intégration profonde avec la base de connaissances

    8. Système de citations
    - Référencement flexible de contenu multi-sources
    - Corrélation intelligente de contexte
    - Génération de citations en un clic
    - Suivi des sources de référence

    9. Éditeur enrichi par l'IA
    - Rendu Markdown en temps réel
    - Optimisation de contenu assistée par l'IA
    - Analyse intelligente du contenu
    - Expérience d'édition de type Notion

    10. Génération d'artefacts de code
    - Générer HTML, SVG, diagrammes Mermaid et applications React
    - Optimisation intelligente de la structure du code
    - Support d'architecture basée sur les composants
    - Aperçu et débogage de code en temps réel

    11. Moteur de visualisation de sites web
    - Rendu et aperçu interactifs de pages web
    - Support de visualisation de concepts complexes
    - Génération dynamique de SVG et diagrammes
    - Modèles de design responsive
    - Prototypage de sites web en temps réel
    - Intégration avec les frameworks web modernes

  releaseNotes: |
    Notes de version Refly v1.1.0

    Résumé de la mise à niveau

    Cette mise à niveau fait passer Refly de v0.9.1 à v1.1.0, une mise à jour majeure axée sur la productivité des développeurs, la transparence des workflows et la gouvernance avancée pour l'infrastructure agentique.

    Nouvelles fonctionnalités

    Outils CLI : puissance développeur
    - Gestion des Skills en langage naturel : créer, exécuter, exporter et partager des Skills avec de simples commandes en langage naturel
    - Support d'upload de fichiers : intégrer des fichiers locaux dans vos workflows distants directement depuis la CLI
    - Gestion de variables complexes : passage de données structurées et paramètres complexes dans les workflows avec une fiabilité de 100 %

    Contrôle des workflows et de l'exécution
    - Aperçu instantané des ressources : prévisualiser documents texte et fichiers de code directement dans le panneau de sortie du workflow
    - Journaux d'exécution détaillés : suivre chaque étape de l'exécution de la tâche avec des journaux en temps réel
    - Contrôle granulaire des nœuds : exécuter des nœuds individuels indépendamment pour des tests et débogages rapides sans relancer tout le workflow
    - Gestion des workflows : renommer facilement les workflows et interroger les détails de nœuds spécifiques pour garder l'espace de travail organisé

    Écosystème et opérations
    - Génération d'images ByteDance : nouveau support natif d'outil pour une génération d'images de haute qualité
    - Planification flexible : les tâches planifiées prennent désormais en charge des intervalles horaires pour des automatisations plus fréquentes
    - Routage multi-modèles : routage aléatoire ou pondéré entre plusieurs modèles pour les tâches planifiées afin d'optimiser coût ou performance
    - Autorisation d'outils optimisée : flux allégé pour vérifier et autoriser les outils, rendant l'intégration plus fluide

    Performance et corrections de bugs

    - Correction des imprécisions d'affichage de progression (affiche maintenant correctement 100 %) et extension des limites de requête pour un suivi transparent et fiable
    - Résolution des échecs de conversion de fichiers sur documents et e-mails, et des bugs intermittents de livraison d'e-mails
    - Affinement du mécanisme de citation de l'agent pour des références de résultats plus précises et stables

    Notes de version complètes : https://github.com/refly-ai/refly/releases/tag/v1.1.0
