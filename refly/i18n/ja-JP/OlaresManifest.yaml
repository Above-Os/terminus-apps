metadata:
  title: Refly
  description: Human-AI コラボレーション向けオープンソース Agentic Workspace。
spec:
  fullDescription: |
    Refly.AI は Human-AI コラボレーション向けのオープンソース Agentic Workspace です。製品デザインの迅速なプロトタイピング、洗練されたプレゼン作成、ホットトピック分析、ディープリサーチワークフローの自動化、マルチモーダルなマーケティングコンテンツ生成、複雑な運用パイプラインのオーケストレーションなど、現実のシナリオで人間の洞察と AI 実行をシームレスに組み合わせ、透明性と制御をもってあらゆるタスクを達成できます。

    **主な機能**
    1. マルチスレッド会話システム
    独立した会話コンテキストを並列管理できる革新的なマルチスレッドアーキテクチャに基づきます。効率的な状態管理とコンテキスト切替により複雑な Agentic Workflow を実装し、従来の対話モデルの限界を超えます。

    2. マルチモデル統合フレームワーク
    - DeepSeek R1、Claude 3.5 Sonnet、Google Gemini 2.0、OpenAI O3-mini など 13 以上の主要言語モデルと統合
    - モデルのハイブリッドスケジューリングと並列処理をサポート
    - 統一された会話インターフェースでの柔軟なモデル切替
    - マルチモデルナレッジベース連携

    3. マルチモーダル処理能力
    - ファイル形式: PDF、DOCX、RTF、TXT、MD、HTML、EPUB など 7 以上
    - 画像処理: PNG、JPG、JPEG、BMP、GIF、SVG、WEBP など主要形式
    - インテリジェントバッチ処理: キャンバス上の複数要素選択と AI 分析

    4. AI 駆動スキルシステム
    Perplexity AI、Stanford Storm などの高度な能力を統合:
    - インテリジェントなウェブ全体検索と情報集約
    - ベクトルデータベースに基づく知識検索
    - スマートなクエリ書き換えと推薦
    - AI 支援ドキュメント生成ワークフロー

    5. コンテキスト管理システム
    - 一時ナレッジベースの精密構築
    - 柔軟なノード選択メカニズム
    - 多次元のコンテキスト相関
    - Cursor のようなインテリジェントなコンテキスト理解

    6. ナレッジベースエンジン
    - マルチソース異種データのインポート
    - RAG ベースのセマンティック検索アーキテクチャ
    - インテリジェントなナレッジグラフ構築
    - パーソナライズされたナレッジスペース管理

    7. インテリジェントコンテンツキャプチャ
    - 主要プラットフォーム（Github、Medium、Wikipedia、Arxiv）からのワンクリックキャプチャ
    - コンテンツのインテリジェント解析と構造化
    - 知識の自動分類とタグ付け
    - ナレッジベースとの深い統合

    8. 引用システム
    - 柔軟なマルチソースコンテンツ参照
    - インテリジェントなコンテキスト相関
    - ワンクリック引用生成
    - 参照ソースの追跡

    9. AI 強化エディタ
    - リアルタイム Markdown レンダリング
    - AI 支援コンテンツ最適化
    - インテリジェントコンテンツ分析
    - Notion のような編集体験

    10. コード成果物生成
    - HTML、SVG、Mermaid 図、React アプリケーションの生成
    - スマートなコード構造最適化
    - コンポーネントベースアーキテクチャ対応
    - リアルタイムコードプレビューとデバッグ

    11. ウェブサイト可視化エンジン
    - インタラクティブな Web ページレンダリングとプレビュー
    - 複雑な概念の可視化サポート
    - 動的 SVG と図の生成
    - レスポンシブデザインテンプレート
    - リアルタイムウェブサイトプロトタイピング
    - モダン Web フレームワークとの統合

  releaseNotes: |
    Refly v1.1.0 リリースノート

    アップグレード概要

    本アップグレードは Refly を v0.9.1 から v1.1.0 へ進めます。開発者生産性、ワークフローの透明性、エージェント基盤の高度なガバナンスに焦点を当てたメジャーアップデートです。

    新機能

    CLI ツール: 開発者向けパワーハウス
    - 自然言語スキル管理: 簡単な自然言語コマンドでスキルの作成・実行・エクスポート・共有
    - ファイルアップロード対応: CLI からローカルファイルをリモートワークフローへシームレス統合
    - 複雑な変数処理: 構造化データと複雑なパラメータを 100% の信頼性でワークフローへ渡す

    ワークフローと実行制御
    - インスタントリソースプレビュー: ワークフロー出力パネル内でテキスト文書とコードファイルを直接プレビュー
    - 詳細な実行ログ: リアルタイムログでタスク実行の各ステップを追跡
    - きめ細かなノード制御: 全体を再実行せず個別ノードを独立実行して迅速にテスト・デバッグ
    - ワークフロー管理: ワークフローの簡単なリネームと特定ノード詳細の照会でワークスペースを整理

    エコシステムと運用
    - ByteDance 画像生成: 高品質画像生成の新しいネイティブツール対応
    - 柔軟なスケジューリング: スケジュールタスクが時間間隔に対応し、より頻繁な自動化が可能
    - マルチモデルルーティング: スケジュールタスクで複数モデルへランダムまたは加重ルーティングし、コストや性能を最適化
    - 最適化されたツール認可: ツールの確認と認可フローを簡素化し、統合をより円滑に

    パフォーマンスとバグ修正

    - 進捗表示の不正確さを修正（正しく 100% を表示）し、クエリ上限を拡大して透明で信頼性の高いタスク追跡を実現
    - 文書・メールのファイル変換失敗と断続的なメール配信バグを解消
    - エージェントの引用メカニズムを精緻化し、より正確で安定した結果参照を提供

    完全なリリースノート: https://github.com/refly-ai/refly/releases/tag/v1.1.0
