metadata:
  title: Refly
  description: Der Open-Source Agentic Workspace für Human-AI-Zusammenarbeit
spec:
  fullDescription: |
    Refly.AI ist der Open-Source Agentic Workspace für Human-AI-Zusammenarbeit. Verbinden Sie menschliche Einsicht nahtlos mit KI-Ausführung in realen Szenarien — ob Sie schnell ein Produktdesign prototypisieren, polierte Präsentationen erstellen, Trendanalysen durchführen, Deep-Research-Workflows automatisieren, multimodale Marketinginhalte erzeugen oder komplexe operative Pipelines orchestrieren: Refly befähigt Ihr Team, jede Aufgabe mit Transparenz und Kontrolle zu erledigen.

    **Hauptfunktionen**
    1. Multi-Thread-Gesprächssystem
    Basierend auf einer innovativen Multi-Thread-Architektur, die parallele Verwaltung unabhängiger Gesprächskontexte ermöglicht. Implementiert komplexe Agentic Workflows durch effizientes State-Management und Kontextwechsel und überwindet Grenzen traditioneller Dialogmodelle.

    2. Multi-Modell-Integrationsframework
    - Integration mit über 13 führenden Sprachmodellen, einschließlich DeepSeek R1, Claude 3.5 Sonnet, Google Gemini 2.0 und OpenAI O3-mini
    - Unterstützung für hybrides Modell-Scheduling und Parallelverarbeitung
    - Flexibler Modellwechsel mit einheitlicher Gesprächsschnittstelle
    - Multi-Modell-Kollaboration über Wissensbasen

    3. Multimodale Verarbeitungsfähigkeiten
    - Dateiformat-Unterstützung: über 7 Formate einschließlich PDF, DOCX, RTF, TXT, MD, HTML, EPUB
    - Bildverarbeitung: Mainstream-Formate einschließlich PNG, JPG, JPEG, BMP, GIF, SVG, WEBP
    - Intelligente Batch-Verarbeitung: Canvas-Mehrfachauswahl und KI-Analyse

    4. KI-gestütztes Skill-System
    Integration fortschrittlicher Fähigkeiten von Perplexity AI, Stanford Storm und mehr:
    - Intelligente websweite Suche und Informationsaggregation
    - Wissensabruf basierend auf Vektordatenbanken
    - Intelligentes Query-Rewriting und Empfehlungen
    - KI-gestützter Dokumentgenerierungs-Workflow

    5. Kontextverwaltungssystem
    - Präziser Aufbau temporärer Wissensbasen
    - Flexibler Node-Auswahlmechanismus
    - Mehrdimensionale Kontextkorrelation
    - Cursor-ähnliches intelligentes Kontextverständnis

    6. Wissensbasis-Engine
    - Import multi-source heterogener Daten
    - RAG-basierte semantische Retrieval-Architektur
    - Intelligenter Knowledge-Graph-Aufbau
    - Personalisierte Wissensraumverwaltung

    7. Intelligente Inhaltserfassung
    - Ein-Klick-Erfassung von Mainstream-Plattformen (Github, Medium, Wikipedia, Arxiv)
    - Intelligentes Parsing und Strukturierung von Inhalten
    - Automatische Wissensklassifikation und -tagging
    - Tiefe Integration in die Wissensbasis

    8. Zitationssystem
    - Flexible Multi-Quellen-Inhaltsreferenzierung
    - Intelligente Kontextkorrelation
    - Ein-Klick-Zitationsgenerierung
    - Nachverfolgung von Referenzquellen

    9. KI-erweiterter Editor
    - Echtzeit-Markdown-Rendering
    - KI-gestützte Inhaltsoptimierung
    - Intelligente Inhaltsanalyse
    - Notion-ähnliches Bearbeitungserlebnis

    10. Code-Artefakt-Generierung
    - Generierung von HTML, SVG, Mermaid-Diagrammen und React-Anwendungen
    - Intelligente Code-Struktur-Optimierung
    - Unterstützung komponentenbasierter Architektur
    - Echtzeit-Codevorschau und Debugging

    11. Website-Visualisierungs-Engine
    - Interaktives Webseiten-Rendering und Vorschau
    - Unterstützung komplexer Konzeptvisualisierung
    - Dynamische SVG- und Diagrammgenerierung
    - Responsive Design-Vorlagen
    - Echtzeit-Website-Prototyping
    - Integration mit modernen Web-Frameworks

  releaseNotes: |
    Refly v1.1.0 Release Notes

    Upgrade-Zusammenfassung

    Dieses Upgrade bringt Refly von v0.9.1 auf v1.1.0 — ein Major-Update mit Fokus auf Entwicklerproduktivität, Workflow-Transparenz und erweiterte Governance für agentische Infrastruktur.

    Neue Funktionen

    CLI-Tools: Entwickler-Powerhouse
    - Natürlichsprachliche Skill-Verwaltung: Skills mit einfachen natürlichsprachlichen Befehlen erstellen, ausführen, exportieren und teilen
    - Datei-Upload-Unterstützung: Lokale Dateien nahtlos aus der CLI in Remote-Workflows integrieren
    - Komplexe Variablenbehandlung: Übergabe strukturierter Daten und komplexer Parameter in Workflows mit 100 % Zuverlässigkeit

    Workflow- und Ausführungssteuerung
    - Sofortige Ressourcen-Vorschau: Textdokumente und Codedateien direkt im Workflow-Ausgabe-Panel anzeigen
    - Detaillierte Laufzeit-Logs: Jeden Schritt der Aufgabenausführung mit Echtzeit-Logs verfolgen
    - Granulare Node-Steuerung: Einzelne Nodes unabhängig ausführen für schnelles Testen und Debugging ohne den gesamten Workflow neu zu starten
    - Workflow-Verwaltung: Workflows leicht umbenennen und spezifische Node-Details abfragen, um den Arbeitsbereich organisiert zu halten

    Ökosystem und Betrieb
    - ByteDance-Bildgenerierung: Neue native Tool-Unterstützung für hochwertige Bildgenerierung
    - Flexibles Scheduling: Geplante Tasks unterstützen jetzt stündliche Intervalle für häufigere Automatisierungen
    - Multi-Modell-Routing: Zufälliges oder gewichtetes Routing über mehrere Modelle für geplante Tasks zur Kosten- oder Leistungsoptimierung
    - Optimierte Tool-Autorisierung: Strafferer Ablauf zur Prüfung und Autorisierung von Tools für reibungslosere Integration

    Leistung und Fehlerbehebungen

    - Ungenaue Fortschrittsanzeige behoben (zeigt jetzt korrekt 100 %) und Query-Limits erweitert für transparente, zuverlässige Aufgabenverfolgung
    - Dateikonvertierungsfehler bei Dokumenten und E-Mails behoben sowie intermittierende E-Mail-Zustellungsfehler
    - Zitationsmechanismus des Agenten verfeinert für genauere und stabilere Ergebnisreferenzen

    Vollständige Release Notes: https://github.com/refly-ai/refly/releases/tag/v1.1.0
