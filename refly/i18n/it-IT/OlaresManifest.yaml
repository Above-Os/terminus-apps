metadata:
  title: Refly
  description: L'Agentic Workspace open source per la collaborazione umano-IA.
spec:
  fullDescription: |
    Refly.AI è l'Agentic Workspace open source per la collaborazione umano-IA. Unisci senza soluzione di continuità l'intuito umano all'esecuzione IA negli scenari reali — che tu stia prototipando rapidamente un design di prodotto, creando presentazioni rifinite, analizzando temi caldi, automatizzando deep research, generando contenuti marketing multimodali o orchestrando pipeline operative complesse, Refly consente al team di completare qualsiasi compito con trasparenza e controllo.

    **Funzionalità principali**
    1. Sistema di conversazione multi-thread
    Basato su un'architettura multi-thread innovativa che consente la gestione parallela di contesti di conversazione indipendenti. Implementa Agentic Workflows complessi tramite gestione efficiente dello stato e cambio di contesto, superando i limiti dei modelli di dialogo tradizionali.

    2. Framework di integrazione multi-modello
    - Integrazione con oltre 13 modelli linguistici leader, inclusi DeepSeek R1, Claude 3.5 Sonnet, Google Gemini 2.0 e OpenAI O3-mini
    - Supporto per scheduling ibrido dei modelli e elaborazione parallela
    - Cambio flessibile di modello con interfaccia di conversazione unificata
    - Collaborazione multi-modello sulle knowledge base

    3. Capacità di elaborazione multimodale
    - Formati file: oltre 7 formati inclusi PDF, DOCX, RTF, TXT, MD, HTML, EPUB
    - Elaborazione immagini: formati mainstream inclusi PNG, JPG, JPEG, BMP, GIF, SVG, WEBP
    - Batch processing intelligente: selezione multipla sul canvas e analisi IA

    4. Sistema di skill potenziato dall'IA
    Integra capacità avanzate di Perplexity AI, Stanford Storm e altro:
    - Ricerca intelligente sul web e aggregazione di informazioni
    - Retrieval della conoscenza basato su database vettoriali
    - Query rewriting intelligente e raccomandazioni
    - Workflow di generazione documenti assistito dall'IA

    5. Sistema di gestione del contesto
    - Costruzione precisa di knowledge base temporanee
    - Meccanismo flessibile di selezione dei nodi
    - Correlazione di contesto multidimensionale
    - Comprensione intelligente del contesto in stile Cursor

    6. Motore della knowledge base
    - Import di dati eterogenei multi-sorgente
    - Architettura di retrieval semantico basata su RAG
    - Costruzione intelligente del knowledge graph
    - Gestione personalizzata dello spazio di conoscenza

    7. Cattura intelligente dei contenuti
    - Cattura one-click da piattaforme mainstream (Github, Medium, Wikipedia, Arxiv)
    - Parsing e strutturazione intelligenti dei contenuti
    - Classificazione e tagging automatici della conoscenza
    - Integrazione profonda con la knowledge base

    8. Sistema di citazioni
    - Riferimento flessibile a contenuti multi-sorgente
    - Correlazione intelligente del contesto
    - Generazione di citazioni one-click
    - Tracciamento delle fonti di riferimento

    9. Editor potenziato dall'IA
    - Rendering Markdown in tempo reale
    - Ottimizzazione dei contenuti assistita dall'IA
    - Analisi intelligente dei contenuti
    - Esperienza di editing in stile Notion

    10. Generazione di artefatti di codice
    - Genera HTML, SVG, diagrammi Mermaid e applicazioni React
    - Ottimizzazione intelligente della struttura del codice
    - Supporto di architettura component-based
    - Anteprima e debug del codice in tempo reale

    11. Motore di visualizzazione siti web
    - Rendering e anteprima interattivi di pagine web
    - Supporto della visualizzazione di concetti complessi
    - Generazione dinamica di SVG e diagrammi
    - Template di design responsive
    - Prototipazione siti web in tempo reale
    - Integrazione con framework web moderni

  releaseNotes: |
    Note di rilascio Refly v1.1.0

    Riepilogo dell'upgrade

    Questo upgrade porta Refly da v0.9.1 a v1.1.0, un aggiornamento maggiore incentrato sulla produttività degli sviluppatori, sulla trasparenza dei workflow e sulla governance avanzata per l'infrastruttura agentic.

    Nuove funzionalità

    Strumenti CLI: potenza per sviluppatori
    - Gestione Skills in linguaggio naturale: crea, esegui, esporta e condividi Skill con semplici comandi in linguaggio naturale
    - Supporto upload file: integra file locali nei workflow remoti direttamente dalla CLI
    - Gestione variabili complesse: passaggio di dati strutturati e parametri complessi nei workflow con affidabilità al 100%

    Controllo di workflow ed esecuzione
    - Anteprima istantanea delle risorse: anteprima di documenti di testo e file di codice direttamente nel pannello di output del workflow
    - Log di esecuzione dettagliati: traccia ogni passo dell'esecuzione del task con log in tempo reale
    - Controllo granulare dei nodi: esegui nodi singoli in modo indipendente per test e debug rapidi senza rieseguire l'intero workflow
    - Gestione workflow: rinomina facilmente i workflow e interroga i dettagli di nodi specifici per mantenere organizzato lo spazio di lavoro

    Ecosistema e operazioni
    - Generazione immagini ByteDance: nuovo supporto nativo di tool per generazione immagini di alta qualità
    - Scheduling flessibile: i task pianificati supportano ora intervalli orari per automazioni più frequenti
    - Routing multi-modello: routing casuale o ponderato tra più modelli per task pianificati per ottimizzare costi o prestazioni
    - Autorizzazione tool ottimizzata: flusso snellito per verificare e autorizzare i tool, rendendo l'integrazione più fluida

    Prestazioni e correzioni di bug

    - Corrette imprecisioni nella visualizzazione del progresso (ora mostra correttamente il 100%) e ampliati i limiti delle query per un tracking trasparente e affidabile
    - Risolti fallimenti di conversione file su documenti ed email, e bug intermittenti di consegna email
    - Raffinato il meccanismo di citazione dell'agent per riferimenti ai risultati più accurati e stabili

    Note di rilascio complete: https://github.com/refly-ai/refly/releases/tag/v1.1.0
