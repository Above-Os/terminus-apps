metadata:
  title: Refly
  description: El Agentic Workspace de código abierto para la colaboración humano-IA.
spec:
  fullDescription: |
    Refly.AI es el Agentic Workspace de código abierto para la colaboración humano-IA. Combine sin fricción la visión humana con la ejecución de IA en escenarios reales — ya sea prototipar rápido un diseño de producto, crear presentaciones pulidas, analizar temas de actualidad, automatizar investigación profunda, generar contenido de marketing multimodal u orquestar pipelines operativos complejos, Refly permite a su equipo lograr cualquier tarea con transparencia y control.

    **Características principales**
    1. Sistema de conversación multiproceso
    Basado en una arquitectura multiproceso innovadora que permite gestionar en paralelo contextos de conversación independientes. Implementa Agentic Workflows complejos mediante gestión eficiente de estado y cambio de contexto, superando las limitaciones de los modelos de diálogo tradicionales.

    2. Framework de integración multimodelo
    - Integración con más de 13 modelos de lenguaje líderes, incluidos DeepSeek R1, Claude 3.5 Sonnet, Google Gemini 2.0 y OpenAI O3-mini
    - Soporte de programación híbrida de modelos y procesamiento en paralelo
    - Cambio flexible de modelo con interfaz de conversación unificada
    - Colaboración multimodelo sobre bases de conocimiento

    3. Capacidades de procesamiento multimodal
    - Formatos de archivo: más de 7 formatos incluidos PDF, DOCX, RTF, TXT, MD, HTML, EPUB
    - Procesamiento de imágenes: formatos habituales incluidos PNG, JPG, JPEG, BMP, GIF, SVG, WEBP
    - Procesamiento por lotes inteligente: selección múltiple en el canvas y análisis con IA

    4. Sistema de habilidades impulsado por IA
    Integrando capacidades avanzadas de Perplexity AI, Stanford Storm y más:
    - Búsqueda inteligente en toda la web y agregación de información
    - Recuperación de conocimiento basada en bases de datos vectoriales
    - Reescritura inteligente de consultas y recomendaciones
    - Flujo de generación de documentos asistido por IA

    5. Sistema de gestión de contexto
    - Construcción precisa de bases de conocimiento temporales
    - Mecanismo flexible de selección de nodos
    - Correlación de contexto multidimensional
    - Comprensión de contexto inteligente tipo Cursor

    6. Motor de base de conocimiento
    - Importación de datos heterogéneos de múltiples fuentes
    - Arquitectura de recuperación semántica basada en RAG
    - Construcción inteligente de grafos de conocimiento
    - Gestión personalizada del espacio de conocimiento

    7. Captura inteligente de contenido
    - Captura en un clic desde plataformas principales (Github, Medium, Wikipedia, Arxiv)
    - Análisis y estructuración inteligentes del contenido
    - Clasificación y etiquetado automáticos del conocimiento
    - Integración profunda con la base de conocimiento

    8. Sistema de citas
    - Referencia flexible de contenido de múltiples fuentes
    - Correlación inteligente de contexto
    - Generación de citas en un clic
    - Seguimiento de fuentes de referencia

    9. Editor potenciado por IA
    - Renderizado Markdown en tiempo real
    - Optimización de contenido asistida por IA
    - Análisis inteligente de contenido
    - Experiencia de edición tipo Notion

    10. Generación de artefactos de código
    - Generar HTML, SVG, diagramas Mermaid y aplicaciones React
    - Optimización inteligente de la estructura del código
    - Soporte de arquitectura basada en componentes
    - Vista previa y depuración de código en tiempo real

    11. Motor de visualización de sitios web
    - Renderizado y vista previa interactiva de páginas web
    - Soporte de visualización de conceptos complejos
    - Generación dinámica de SVG y diagramas
    - Plantillas de diseño responsive
    - Prototipado de sitios web en tiempo real
    - Integración con frameworks web modernos

  releaseNotes: |
    Notas de la versión Refly v1.1.0

    Resumen de la actualización

    Esta actualización lleva Refly de v0.9.1 a v1.1.0, una actualización mayor centrada en la productividad del desarrollador, la transparencia de los flujos y la gobernanza avanzada para infraestructura agentic.

    Nuevas funciones

    Herramientas CLI: potencia para desarrolladores
    - Gestión de Skills en lenguaje natural: crear, ejecutar, exportar y compartir Skills con comandos simples en lenguaje natural
    - Soporte de subida de archivos: integrar archivos locales en flujos remotos directamente desde la CLI
    - Manejo de variables complejas: pasar datos estructurados y parámetros complejos a los flujos con 100 % de fiabilidad

    Control de flujo y ejecución
    - Vista previa instantánea de recursos: previsualizar documentos de texto y archivos de código directamente en el panel de salida del flujo
    - Registros de ejecución detallados: seguir cada paso de la ejecución de la tarea con registros en tiempo real
    - Control granular de nodos: ejecutar nodos individuales de forma independiente para pruebas y depuración rápidas sin volver a ejecutar todo el flujo
    - Gestión de flujos: renombrar flujos fácilmente y consultar detalles de nodos específicos para mantener el espacio de trabajo organizado

    Ecosistema y operaciones
    - Generación de imágenes ByteDance: nuevo soporte nativo de herramientas para generación de imágenes de alta calidad
    - Programación flexible: las tareas programadas ahora admiten intervalos horarios para automatizaciones más frecuentes
    - Enrutamiento multimodelo: enrutamiento aleatorio o ponderado entre varios modelos en tareas programadas para optimizar coste o rendimiento
    - Autorización de herramientas optimizada: flujo más ágil para comprobar y autorizar herramientas, haciendo la integración más fluida

    Rendimiento y correcciones de errores

    - Corregidas imprecisiones en la visualización del progreso (ahora muestra correctamente el 100 %) y ampliados los límites de consulta para un seguimiento transparente y fiable
    - Resueltos fallos de conversión de archivos en documentos y correos, y errores intermitentes de entrega de correo
    - Refinado el mecanismo de citas del agente para referencias de resultados más precisas y estables

    Notas de la versión completas: https://github.com/refly-ai/refly/releases/tag/v1.1.0
