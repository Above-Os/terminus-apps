metadata:
  description: "Qwen3-TTS 1.7B VoiceDesign for instruction-based voice design."
  title: Qwen3-TTS Design 1.7B

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    Qwen3-TTS 1.7B VoiceDesign: a written description becomes the voice. No preset
    speakers and no reference clip.

    **Configuration**
    - Model: `Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign`
    - Source: `hf://Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign`
    - Capabilities: `tts`
    - Required GPU memory: `6Gi`
    - Engine: faster-qwen3-tts (in-process, CUDA graphs)

    **How It Works**
    First, Model Console (llm-init) downloads the model and gets it ready, then the
    audio engine starts serving when the download sentinel appears. llm-init reverse-proxies
    `/v1/*` to the engine and serves its control plane / dashboard on `/`.

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`.
