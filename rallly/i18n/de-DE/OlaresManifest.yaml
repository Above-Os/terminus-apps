metadata:
  title: Rallly
  description: Open-Source-Planungs- und Kollaborationstool zur einfacheren Organisation von Events und Meetings
spec:
  fullDescription: |
    Rallly ist ein Open-Source-Planungs- und Kollaborationstool, das die Organisation von Events und Meetings erleichtert.
    
    Planen Sie Gruppentreffen mit Freunden, Kollegen und Teams. Erstellen Sie Meeting-Umfragen, um anhand der Verfügbarkeit der Teilnehmer den besten Termin zu finden. Sparen Sie Zeit und vermeiden Sie Hin- und Her-E-Mails.
    
    **Wichtiger Hinweis**
    Magic-Link-Login und E-Mail-Benachrichtigungen benötigen SMTP. Konfigurieren Sie die Olares-Mail-/SMTP-Einstellungen (oder lassen Sie sie leer, wenn Sie nur Umfrage-Links ohne E-Mail teilen). Leere SMTP-Werte werden nicht in den Container injiziert.
  upgradeDescription: |
    Upgrade auf Rallly 4.11.1 (von 4.3.1). Chart 1.0.11 → 1.0.12.
    
    **Release Notes**
    - 4.11.1: Self-Hosting-Fix — Env-Validierung aus dem Client-Bundle entfernt (behebt Absturz auf jeder Seite in 4.11.0)
    - Für den 4.11.x-Fix sind keine Konfigurations- oder Datenbankänderungen erforderlich
    - Vollständiges Changelog: https://github.com/lukevella/rallly/compare/v4.3.1...v4.11.1
    
    **Chart-/Env-Änderungen**
    - Image: `lukevella/rallly:4.11.1`
    - `NEXT_PUBLIC_SELF_HOSTED` auf `true` gesetzt
    - SMTP-Variablen werden nur injiziert, wenn Olares nicht-leere Werte bereitstellt
    - `SUPPORT_EMAIL` wird immer gesetzt (Olares-SMTP-Absender oder Fallback `noreply@<domain>`)
    - Kernvariablen unverändert: `SECRET_PASSWORD`, `NEXT_PUBLIC_BASE_URL`, `AUTH_URL`, `DATABASE_URL`, `DIRECT_DATABASE_URL`
