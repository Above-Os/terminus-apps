metadata:
  title: Rallly
  description: Outil open source de planification et de collaboration pour organiser plus facilement événements et réunions
spec:
  fullDescription: |
    Rallly est un outil open source de planification et de collaboration conçu pour faciliter l'organisation d'événements et de réunions.
    
    Planifiez des réunions de groupe avec des amis, collègues et équipes. Créez des sondages pour trouver la meilleure date et heure selon la disponibilité des participants. Gagnez du temps et évitez les allers-retours d'e-mails.
    
    **Note importante**
    La connexion par magic-link et les notifications e-mail nécessitent SMTP. Configurez les paramètres mail/SMTP d'Olares (ou laissez-les vides si vous partagez uniquement des liens de sondage sans e-mail). Les valeurs SMTP vides ne sont pas injectées dans le conteneur.
  upgradeDescription: |
    Mise à niveau vers Rallly 4.11.1 (depuis 4.3.1). Chart 1.0.11 → 1.0.12.
    
    **Notes de version**
    - 4.11.1 : correctif self-hosting — garder la validation env hors du bundle client (corrige le plantage sur chaque page en 4.11.0)
    - Aucun changement de configuration ou de base de données requis pour le correctif 4.11.x
    - Changelog complet : https://github.com/lukevella/rallly/compare/v4.3.1...v4.11.1
    
    **Changements Chart / env**
    - Image : `lukevella/rallly:4.11.1`
    - `NEXT_PUBLIC_SELF_HOSTED` défini sur `true`
    - Les variables SMTP ne sont injectées que lorsque Olares fournit des valeurs non vides
    - `SUPPORT_EMAIL` est toujours défini (adresse d'expédition SMTP Olares, ou fallback `noreply@<domain>`)
    - Variables principales inchangées : `SECRET_PASSWORD`, `NEXT_PUBLIC_BASE_URL`, `AUTH_URL`, `DATABASE_URL`, `DIRECT_DATABASE_URL`
