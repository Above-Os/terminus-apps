metadata:
  title: Rallly
  description: Strumento open-source di pianificazione e collaborazione per organizzare eventi e riunioni più facilmente
spec:
  fullDescription: |
    Rallly è uno strumento open-source di pianificazione e collaborazione progettato per semplificare l'organizzazione di eventi e riunioni.
    
    Pianifica riunioni di gruppo con amici, colleghi e team. Crea sondaggi per trovare la data e l'ora migliori in base alla disponibilità dei partecipanti. Risparmia tempo ed evita email di andata e ritorno.
    
    **Nota importante**
    Il login con magic-link e le notifiche email richiedono SMTP. Configura le impostazioni mail/SMTP di Olares (o lasciale vuote se condividi solo i link del sondaggio senza email). I valori SMTP vuoti non vengono iniettati nel container.
  upgradeDescription: |
    Aggiornamento a Rallly 4.11.1 (da 4.3.1). Chart 1.0.11 → 1.0.12.
    
    **Note di rilascio**
    - 4.11.1: fix self-hosting — mantenere la validazione env fuori dal client bundle (risolve il crash su ogni pagina in 4.11.0)
    - Nessuna modifica di configurazione o database richiesta per il fix 4.11.x
    - Changelog completo: https://github.com/lukevella/rallly/compare/v4.3.1...v4.11.1
    
    **Modifiche Chart / env**
    - Image: `lukevella/rallly:4.11.1`
    - `NEXT_PUBLIC_SELF_HOSTED` impostato a `true`
    - Le variabili SMTP vengono iniettate solo quando Olares fornisce valori non vuoti
    - `SUPPORT_EMAIL` è sempre impostato (indirizzo mittente SMTP di Olares, o fallback `noreply@<domain>`)
    - Variabili core invariate: `SECRET_PASSWORD`, `NEXT_PUBLIC_BASE_URL`, `AUTH_URL`, `DATABASE_URL`, `DIRECT_DATABASE_URL`
