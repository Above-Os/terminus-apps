metadata:
  title: Rallly
  description: Herramienta open-source de programación y colaboración para organizar eventos y reuniones con más facilidad
spec:
  fullDescription: |
    Rallly es una herramienta open-source de programación y colaboración diseñada para facilitar la organización de eventos y reuniones.
    
    Programe reuniones grupales con amigos, colegas y equipos. Cree encuestas de reunión para encontrar la mejor fecha y hora según la disponibilidad de los participantes. Ahorre tiempo y evite correos de ida y vuelta.
    
    **Nota importante**
    El inicio de sesión con magic-link y las notificaciones por correo requieren SMTP. Configure los ajustes de correo/SMTP de Olares (o déjelos vacíos si solo comparte enlaces de encuesta sin correo). Los valores SMTP vacíos no se inyectan en el contenedor.
  upgradeDescription: |
    Actualización a Rallly 4.11.1 (desde 4.3.1). Chart 1.0.11 → 1.0.12.
    
    **Notas de la versión**
    - 4.11.1: corrección de self-hosting — mantener la validación de env fuera del bundle del cliente (corrige el fallo en cada página en 4.11.0)
    - No se requieren cambios de configuración ni de base de datos para la corrección 4.11.x
    - Changelog completo: https://github.com/lukevella/rallly/compare/v4.3.1...v4.11.1
    
    **Cambios de Chart / env**
    - Image: `lukevella/rallly:4.11.1`
    - `NEXT_PUBLIC_SELF_HOSTED` establecido en `true`
    - Las variables SMTP solo se inyectan cuando Olares proporciona valores no vacíos
    - `SUPPORT_EMAIL` siempre se establece (dirección de origen SMTP de Olares, o fallback `noreply@<domain>`)
    - Variables principales sin cambios: `SECRET_PASSWORD`, `NEXT_PUBLIC_BASE_URL`, `AUTH_URL`, `DATABASE_URL`, `DIRECT_DATABASE_URL`
