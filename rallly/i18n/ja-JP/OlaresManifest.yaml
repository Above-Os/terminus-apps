metadata:
  title: Rallly
  description: イベントや会議の調整を簡単にするオープンソースのスケジュール・コラボレーションツール
spec:
  fullDescription: |
    Rallly は、イベントや会議の調整を簡単にするために設計されたオープンソースのスケジュール・コラボレーションツールです。
    
    友人、同僚、チームとのグループミーティングをスケジュール。参加者の空き状況に基づき最適な日時を見つけるミーティング投票を作成。時間を節約し、メールのやり取りを減らします。
    
    **重要なお知らせ**
    マジックリンクログインとメール通知には SMTP が必要です。Olares のメール/SMTP 設定を構成してください（メールなしで投票リンクだけ共有する場合は空のままで可）。空の SMTP 値はコンテナに注入されません。
  upgradeDescription: |
    Rallly 4.11.1 へアップグレード（4.3.1 から）。Chart 1.0.11 → 1.0.12。
    
    **リリースノート**
    - 4.11.1: セルフホスト修正 — env 検証をクライアントバンドル外に維持（4.11.0 の全ページクラッシュを修正）
    - 4.11.x の修正に設定やデータベース変更は不要
    - 完全な changelog: https://github.com/lukevella/rallly/compare/v4.3.1...v4.11.1
    
    **Chart / env の変更**
    - Image: `lukevella/rallly:4.11.1`
    - `NEXT_PUBLIC_SELF_HOSTED` を `true` に設定
    - SMTP 変数は Olares が非空の値を提供する場合のみ注入
    - `SUPPORT_EMAIL` は常に設定（Olares SMTP の送信元、または `noreply@<domain>` フォールバック）
    - コア変数は変更なし: `SECRET_PASSWORD`、`NEXT_PUBLIC_BASE_URL`、`AUTH_URL`、`DATABASE_URL`、`DIRECT_DATABASE_URL`
