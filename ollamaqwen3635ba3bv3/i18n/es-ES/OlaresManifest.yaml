metadata:
  title: Qwen3.6 35B A3B for Studios
  description: Un modelo de chat local que reescribe prompts para aplicaciones Studio y se descarga tras cada respuesta
spec:
  fullDescription: |
    Qwen3.6 35B A3B es un modelo de visión y lenguaje del equipo de Qwen. Esta aplicación está pensada sobre todo para aplicaciones como Qwen Image 2.1 Studio y FastH3 Studio: al pulsar Optimización con IA, estas aplicaciones lo usan para reescribir prompts y ver tus imágenes de referencia.

    Después de cada respuesta, la aplicación descarga el modelo de la memoria de la GPU, para que el modelo de imagen o vídeo conserve la GPU. La siguiente respuesta tarda unos segundos más mientras el modelo se vuelve a cargar.

    **Funciones principales**

    - Reescribe y traduce prompts, y responde preguntas sobre imágenes.
    - Modo de razonamiento para reescrituras difíciles; las aplicaciones que no lo necesitan lo desactivan en cada solicitud.
    - Llamadas a herramientas en aplicaciones compatibles que ofrecen herramientas.

    **Usar el modelo en Olares**

    La aplicación descarga `qwen3.6:35b-a3b` de la biblioteca de Ollama. Model Console muestra el progreso de la descarga y registra el modelo en Router para las aplicaciones de Olares compatibles. La ventana de contexto predeterminada es de 32K tokens.

    Para un chat general en el que las respuestas seguidas deban ser rápidas, asigna a `OLLAMA_KEEP_ALIVE` un valor más largo (por ejemplo, `30m` o `-1`) en `ENGINE_ARGS` o en Model Console, o usa una aplicación que mantenga el modelo cargado.

    [Qwen3.6 en Ollama](https://ollama.com/library/qwen3.6)
