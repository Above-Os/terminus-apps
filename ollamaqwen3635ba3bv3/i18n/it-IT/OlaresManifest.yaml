metadata:
  title: Qwen3.6 35B A3B for Studios
  description: Un modello di chat locale che riscrive i prompt per le app Studio e si scarica dopo ogni risposta
spec:
  fullDescription: |
    Qwen3.6 35B A3B è un modello visione-linguaggio del team Qwen. Questa app è pensata soprattutto per app come Qwen Image 2.1 Studio e FastH3 Studio: quando premi Ottimizzazione IA, queste app lo usano per riscrivere i prompt e guardare le tue immagini di riferimento.

    Dopo ogni risposta l'app scarica il modello dalla memoria della GPU, così il modello di immagini o video mantiene la GPU. La risposta successiva richiede qualche secondo in più, perché il modello viene ricaricato.

    **Funzionalità principali**

    - Riscrive e traduce i prompt e risponde a domande sulle immagini.
    - Modalità di ragionamento per le riscritture più difficili; le app che non ne hanno bisogno la disattivano a ogni richiesta.
    - Chiamata di strumenti nelle applicazioni compatibili che forniscono strumenti.

    **Usare il modello su Olares**

    L'app scarica `qwen3.6:35b-a3b` dalla libreria di Ollama. Model Console mostra l'avanzamento del download e registra il modello in Router per le applicazioni Olares compatibili. La finestra di contesto predefinita è di 32K token.

    Per una chat generica in cui le risposte consecutive devono essere rapide, imposta `OLLAMA_KEEP_ALIVE` su un valore più lungo (ad esempio `30m` o `-1`) in `ENGINE_ARGS` o in Model Console, oppure usa un'app che mantiene il modello caricato.

    [Qwen3.6 su Ollama](https://ollama.com/library/qwen3.6)
