metadata:
  title: Qwen3.6 35B A3B for Studios
  description: 为 Studio 类应用改写提示词的本地对话模型，每次回答后卸载
spec:
  fullDescription: |
    Qwen3.6 35B A3B 是通义千问团队的视觉语言模型。本应用主要供 Qwen Image 2.1 Studio、FastH3 Studio 等应用使用：点击"AI 优化"时，这些应用用它改写提示词并查看你的参考图。

    每次回答完，本应用都会把模型从显存中卸载，让生图或生视频的模型独占 GPU。下一次回答需要重新加载模型，会多等几秒。

    **主要功能**

    - 改写和翻译提示词，回答关于图片的问题。
    - 思考模式用于较难的改写；不需要思考的应用会在请求中关闭它。
    - 在提供工具的兼容应用中支持工具调用。

    **在 Olares 上使用模型**

    本应用从 Ollama 模型库下载 `qwen3.6:35b-a3b`。Model Console 显示下载进度，并把模型登记到 Router，供兼容的 Olares 应用使用。默认上下文窗口为 32K tokens。

    如果用于日常聊天、希望连续回答更快，可以在 `ENGINE_ARGS` 或 Model Console 中把 `OLLAMA_KEEP_ALIVE` 设得更长（例如 `30m` 或 `-1`），或改用常驻显存的应用。

    [Ollama 上的 Qwen3.6](https://ollama.com/library/qwen3.6)
