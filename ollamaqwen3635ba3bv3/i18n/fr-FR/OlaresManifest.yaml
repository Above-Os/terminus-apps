metadata:
  title: Qwen3.6 35B A3B for Studios
  description: Un modèle de chat local qui réécrit les prompts des applications Studio et se décharge après chaque réponse
spec:
  fullDescription: |
    Qwen3.6 35B A3B est un modèle vision-langage de l'équipe Qwen. Cette application est surtout destinée à des applications comme Qwen Image 2.1 Studio et FastH3 Studio : quand vous cliquez sur Optimisation IA, elles l'utilisent pour réécrire les prompts et examiner vos images de référence.

    Après chaque réponse, l'application décharge le modèle de la mémoire GPU, afin que le modèle d'image ou de vidéo garde le GPU. La réponse suivante prend quelques secondes de plus, le temps de recharger le modèle.

    **Fonctionnalités principales**

    - Réécrit et traduit les prompts, et répond aux questions sur les images.
    - Mode de réflexion pour les réécritures difficiles ; les applications qui n'en ont pas besoin le désactivent à chaque requête.
    - Appel d'outils dans les applications compatibles qui fournissent des outils.

    **Utiliser le modèle sur Olares**

    L'application télécharge `qwen3.6:35b-a3b` depuis la bibliothèque Ollama. Model Console affiche la progression du téléchargement et inscrit le modèle dans Router pour les applications Olares compatibles. La fenêtre de contexte par défaut est de 32K tokens.

    Pour un usage de chat général où les réponses successives doivent être rapides, donnez à `OLLAMA_KEEP_ALIVE` une valeur plus longue (par exemple `30m` ou `-1`) dans `ENGINE_ARGS` ou dans Model Console, ou utilisez une application qui garde le modèle chargé.

    [Qwen3.6 sur Ollama](https://ollama.com/library/qwen3.6)
