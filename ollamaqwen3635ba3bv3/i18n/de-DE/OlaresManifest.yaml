metadata:
  title: Qwen3.6 35B A3B for Studios
  description: Ein lokales Chatmodell, das Prompts für Studio-Apps umschreibt und nach jeder Antwort entladen wird
spec:
  fullDescription: |
    Qwen3.6 35B A3B ist ein Bild-Sprach-Modell des Qwen-Teams. Diese App ist vor allem für Apps wie Qwen Image 2.1 Studio und FastH3 Studio gedacht: Wenn Sie auf KI-Optimierung klicken, schreiben diese Apps damit Prompts um und sehen sich Ihre Referenzbilder an.

    Nach jeder Antwort entlädt die App das Modell aus dem GPU-Speicher, sodass das Bild- oder Videomodell die GPU behält. Die nächste Antwort dauert einige Sekunden länger, weil das Modell neu geladen wird.

    **Wichtige Funktionen**

    - Schreibt Prompts um, übersetzt sie und beantwortet Fragen zu Bildern.
    - Denkmodus für schwierigere Umschreibungen; Apps, die ihn nicht brauchen, schalten ihn pro Anfrage ab.
    - Tool-Aufrufe in kompatiblen Anwendungen, die Tools bereitstellen.

    **Das Modell auf Olares verwenden**

    Die App lädt `qwen3.6:35b-a3b` aus der Ollama-Bibliothek herunter. Model Console zeigt den Download-Fortschritt an und trägt das Modell im Router für kompatible Olares-Anwendungen ein. Das Standard-Kontextfenster umfasst 32K Tokens.

    Für allgemeinen Chat mit schnellen aufeinanderfolgenden Antworten setzen Sie `OLLAMA_KEEP_ALIVE` in `ENGINE_ARGS` oder in der Model Console auf einen längeren Wert (zum Beispiel `30m` oder `-1`), oder verwenden Sie eine App, die das Modell geladen hält.

    [Qwen3.6 bei Ollama](https://ollama.com/library/qwen3.6)
