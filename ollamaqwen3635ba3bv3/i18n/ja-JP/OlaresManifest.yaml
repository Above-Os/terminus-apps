metadata:
  title: Qwen3.6 35B A3B for Studios
  description: Studio 系アプリのプロンプトを書き換え、回答ごとにアンロードするローカルチャットモデル
spec:
  fullDescription: |
    Qwen3.6 35B A3B は Qwen チームによる視覚言語モデルです。このアプリは主に Qwen Image 2.1 Studio や FastH3 Studio などのアプリ向けで、AI 最適化を押すと、これらのアプリがプロンプトの書き換えと参照画像の確認に使います。

    回答のたびにモデルを GPU メモリからアンロードするため、画像や動画のモデルが GPU を使い続けられます。次の回答ではモデルを読み込み直すため、数秒長くかかります。

    **主な機能**

    - プロンプトの書き換えと翻訳、画像についての質問への回答。
    - 難しい書き換えには思考モード。不要なアプリはリクエストごとにオフにします。
    - ツールを提供する対応アプリでのツール呼び出し。

    **Olares でのモデルの使用**

    このアプリは Ollama ライブラリから `qwen3.6:35b-a3b` をダウンロードします。Model Console がダウンロードの進行状況を表示し、対応する Olares アプリが使えるようにモデルを Router に登録します。既定のコンテキストウィンドウは 32K トークンです。

    連続した回答を速くしたい一般的なチャットでは、`ENGINE_ARGS` または Model Console で `OLLAMA_KEEP_ALIVE` を長めの値（例: `30m` や `-1`）に設定するか、モデルを常駐させるアプリを使ってください。

    [Ollama の Qwen3.6](https://ollama.com/library/qwen3.6)
