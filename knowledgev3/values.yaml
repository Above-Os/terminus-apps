# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   knowledgev3 — knowledge backend Deployment (== appid / Release.Name; the
#                 primary workload MUST be named after the release/appid)
#                 (knowledge + vectorcrawl + camoufox + nginx, 4 containers)
#   wise        — Wise frontend nginx Deployment (merged in; free name)
workloads:
  knowledgev3:
    replicaCount: 1
  wise:
    replicaCount: 1
