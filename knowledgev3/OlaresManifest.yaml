olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: knowledgev3
  appid: knowledgev3
  icon: https://app.cdn.olares.com/appstore/wise/icon.png
  description: Your Digital Secret Garden
  title: Wise
  version: '1.2.15'
  categories:
    - Productivity_v112
    - Fun

# Exposed to other v3 apps (primarily wisev3 frontend) over Service DNS:
#   http://sharedentrances-knowledge.knowledgev3-shared.svc.cluster.local:80
#     -> knowledge-base-api (3010)
# Additional in-pod ports (8080 backend-server, 3100 ws) are also exposed on
# the same Service for callers that need them.
sharedEntrances:
  - name: knowledge
    host: sharedentrances-knowledge
    port: 0
    title: Knowledge API
    icon: https://app.cdn.olares.com/appstore/wise/icon.png
    invisible: true
    authLevel: internal

# Entrances:
#   - wiseclient: the Wise UI (merged-in frontend). Registered by the Olares
#     gateway for every user; all users' entrances point at the single shared
#     `wise-svc` frontend (admin installs once, everyone gets an entry).
#   - knowledge: admin-only, invisible API entrance for direct access
#     (debugging / admin tooling). Backed by the `rss-svc` Service (name kept
#     for compatibility with the Wise frontend image, which hardcodes
#     `rss-svc.<knowledge-ns>` as nginx upstreams).
entrances:
  - name: wiseclient
    port: 80
    host: wise-svc
    title: Wise
    icon: https://app.cdn.olares.com/appstore/wise/icon.png
    authLevel: internal
    openMethod: window
  - name: knowledge
    port: 3010
    host: rss-svc
    title: Knowledge API
    icon: https://app.cdn.olares.com/appstore/wise/icon.png
    authLevel: private
    invisible: true

# Declares every workload's replica count (v3 schema). Keys MUST match the
# rendered Deployment metadata.name and values.yaml workloads.<name>. The
# primary workload MUST be named after the appid (upload validator requires a
# Deployment/StatefulSet named exactly "knowledgev3"):
#   knowledgev3 — knowledge backend Deployment (== appid; 4 containers in one
#                 Pod: knowledge + vectorcrawl + camoufox + nginx sidecar)
#   wise        — Wise frontend nginx Deployment (merged in; free name)
workloadReplicas:
  knowledgev3: 1
  wise: 1

permission:
  appData: true
  appCache: true
  userData:
    - Home

middleware:
  redis:
    namespace: knowledge
  postgres:
    username: knowledge
    databases:
      - name: knowledge
        extensions:
          - pg_trgm
          - btree_gin

spec:
  versionName: '1.0.1'
  featuredImage: https://app.cdn.olares.com/appstore/wise/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/wise/1.webp
    - https://app.cdn.olares.com/appstore/wise/2.webp
  fullDescription: |
    **IMPORTANT NOTE**
    This is a shared version of Wise. Only one service (the Wise frontend plus
    the knowledge backend) is installed across the entire Olares system by the
    Admin. Every user still gets a Wise entrance in their launcher, all pointing
    at the same shared instance.

    Wise is a modern knowledge management tool built for control and insight.
    Wise empowers you to collect diverse content from across the web and your
    devices. Crucially, it leverages locally-run AI to unearth valuable
    insights, freeing you from the filter bubbles and privacy compromises of
    big-platform algorithms.

    **COMPONENTS**
    - wise (port 80): the Wise frontend (nginx). Backs the `wiseclient` entrance.
    - knowledge-base-api (port 3010): main HTTP API for the knowledge base.
    - vectorcrawl (port 8080): vector indexing and crawl worker.
    - camoufox (port 8191): CAPTCHA / Cloudflare bypass companion (in-pod, localhost).
    - nginx (port 3009): reverse-proxy front door. rss-svc targets it; it
      serves /download/* from the download provider-proxy and everything
      else from knowledge-base-api on 127.0.0.1:3010.

    **STORAGE & MIDDLEWARE**
    - Postgres database `knowledge` (extensions: pg_trgm, btree_gin).
    - Redis (shared via platform middleware, namespace: knowledge).
    - NATS subjects: rssubscribe_status, download_status, knowledge.*.
  upgradeDescription: |
    **Merged Wise frontend + knowledge backend into a single shared app.**
    The previously separate per-user `wisev3` frontend and shared `knowledgev3`
    backend are now one shared, admin-only app (`options.shared` +
    `spec.onlyAdmin`). The Admin installs it once; the Wise frontend
    (`wise-svc`) and the knowledge backend both run once in the shared
    namespace, and the platform registers the `wiseclient` entrance for every
    user.

    Note: the Wise frontend's per-user `files-proxy` / `download-proxy` and
    their ClusterRoleBindings are keyed on the installing Admin; per-user file
    and download routing relies on the gateway propagating X-BFL-USER to the
    multi-tenant backend.

    **Previously**
    v1.2.5: moved PG/REDIS passwords into a Secret and added the nginx
    (openresty) reverse-proxy sidecar (port 3009) in front of the knowledge
    API; rss-svc targets the sidecar, which routes /download/* to the
    os-framework download provider-proxy and everything else to
    knowledge-base-api on 127.0.0.1:3010.
  developer: Olares
  website: https://www.olares.com/
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://docs.olares.com/manual/olares/wise/

  # Σ across all application containers (initContainers excluded):
  #   knowledge      req 20m  / 50Mi   lim 3500m / 6Gi
  #   vectorcrawl    req 20m  / 50Mi   lim 1000m / 2Gi
  #   camoufox       req 250m / 512Mi  lim 2000m / 1.5Gi
  #   nginx          req 10m  / 32Mi   lim 500m  / 256Mi
  #   wise (frontend)req 10m  / 20Mi   lim 500m  / 200Mi
  #   -------------------------------------------------
  #   Σ              req 310m / 664Mi  lim 7500m / 10184Mi (~9.95Gi)
  requiredCpu: 310m
  limitedCpu: 7.5
  requiredMemory: 664Mi
  limitedMemory: 10184Mi
  requiredDisk: 50Mi
  limitedDisk: 500Gi
  supportArch:
    - amd64
    - arm64
  onlyAdmin: true

options:
  shared: true
  apiTimeout: 0
  # No `conflicts:` against `wise` anymore.
  #
  # The old v2 wise (<= 1.1.51) used to bundle the knowledge sub-chart and
  # claim the same postgres user `knowledge` / db `knowledge` / redis
  # namespace `knowledge` that this shared backend now claims. Conflict
  # entries only support `name` + `type` (no version range), so a blanket
  # `conflicts: wise` would also block the new v3 wise (1.1.52+), which
  # is exactly the per-user frontend that REQUIRES this backend. We rely
  # on Olares' middleware-claim collision check to refuse install when an
  # older v2 wise is still around.
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
