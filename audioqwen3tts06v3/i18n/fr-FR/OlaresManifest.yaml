metadata:
  description: Un modèle de synthèse vocale à voix prédéfinies pour lire un texte à haute voix
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  upgradeDescription: |
    v1.0.3: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice lit un texte à haute voix avec l'une de neuf voix prédéfinies. Il peut lire un passage terminé ou commencer à parler pendant que le texte arrive encore.

    **Fonctionnalités principales**
    - Lire un texte dans dix langues, dont le chinois et l'anglais.
    - Choisir parmi neuf voix prédéfinies.
    - Diffuser la parole pendant que le texte arrive encore.
    - Mettre la synthèse vocale à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `4Gi` de mémoire vidéo est requis.
