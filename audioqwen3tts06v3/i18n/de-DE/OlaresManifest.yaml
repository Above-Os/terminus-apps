metadata:
  description: Ein Sprachmodell mit vorgegebenen Stimmen zum Vorlesen von Text
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice liest Text mit einer von neun vorgegebenen Stimmen vor. Es kann einen fertigen Abschnitt sprechen oder schon beginnen, während der Text noch eintrifft.

    **Hauptfunktionen**
    - Text in zehn Sprachen vorlesen, darunter Chinesisch und Englisch.
    - Eine von neun vorgegebenen Stimmen wählen.
    - Sprache streamen, während der Text noch eintrifft.
    - Sprachausgabe für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU mit mindestens `4Gi` Grafikspeicher ist erforderlich.
