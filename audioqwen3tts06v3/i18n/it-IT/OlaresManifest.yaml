metadata:
  description: Un modello vocale con voci predefinite per leggere un testo ad alta voce
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  upgradeDescription: |
    v1.0.3: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice legge un testo ad alta voce con una di nove voci predefinite. Può leggere un brano concluso o iniziare a parlare mentre il testo sta ancora arrivando.

    **Funzionalità principali**
    - Leggere un testo in dieci lingue, tra cui cinese e inglese.
    - Scegliere tra nove voci predefinite.
    - Trasmettere la voce mentre il testo sta ancora arrivando.
    - Rendere la sintesi vocale disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `4Gi` di memoria video.
