metadata:
  description: 決まった声で文章を読み上げる音声モデル
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  fullDescription: |
    Qwen3-TTS 0.6B CustomVoiceは、9種類の決まった声のいずれかで文章を読み上げます。書き終えた文章を読むほか、文章が届いている途中から読み始めることもできます。

    **主な機能**
    - 中国語と英語を含む10言語で読み上げます。
    - 9種類の決まった声から選べます。
    - 文章が届いている途中でもストリーミングで発話します。
    - 対応するOlaresアプリから読み上げ機能を利用できます。

    `4Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。
