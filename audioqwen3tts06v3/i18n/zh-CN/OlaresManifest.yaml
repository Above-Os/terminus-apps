metadata:
  description: 用预设音色把文字读出来的语音模型
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  upgradeDescription: |
    v1.0.3: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice 用九个预设音色之一把文字读出来。它既能读完整的一段话，也能在文字还在输入时就开始朗读。

    **主要功能**
    - 用十种语言朗读文字，包括中文和英文。
    - 从九个预设音色中选择。
    - 在文字还在输入时流式出声。
    - 向兼容的 Olares 应用提供朗读能力。

    需要配备至少 `4Gi` 显存的兼容 NVIDIA GPU。
