metadata:
  description: Un modelo de voz con voces predefinidas para leer un texto en voz alta
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice lee un texto en voz alta con una de nueve voces predefinidas. Puede leer un pasaje terminado o empezar a hablar mientras el texto todavía está llegando.

    **Funciones principales**
    - Leer un texto en diez idiomas, incluidos el chino y el inglés.
    - Elegir entre nueve voces predefinidas.
    - Transmitir la voz mientras el texto todavía está llegando.
    - Poner la síntesis de voz a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `4Gi` de memoria gráfica.
