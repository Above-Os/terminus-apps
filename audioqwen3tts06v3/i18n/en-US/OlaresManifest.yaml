metadata:
  description: A preset-voice speech model for reading text aloud
  title: Qwen3-TTS 0.6B CustomVoice

spec:
  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice reads text aloud in one of nine preset voices. It speaks a finished passage or starts speaking while the text is still arriving.

    **Key features**
    - Read text aloud in ten languages, including Chinese and English.
    - Choose among nine preset voices.
    - Stream speech while the text is still arriving.
    - Make speech available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `4Gi` of GPU memory is required.
