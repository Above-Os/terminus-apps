olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audioqwen3tts06v3
  icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
  description: A preset-voice speech model for reading text aloud
  appid: audioqwen3tts06v3
  title: Qwen3-TTS 0.6B CustomVoice
  version: '1.0.2'
  categories:
    - AI
    - models
  tags:
  - text-to-speech
  - audio
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1.
sharedEntrances:
  - name: audioqwen3tts06v3api
    host: sharedentrances-api
    port: 0
    title: Qwen3-TTS 0.6B CustomVoice API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", engine /v1/* reverse-proxied; authLevel internal.
entrances:
  - name: audioqwen3tts06v3
    port: 8090
    host: download-svc
    title: Qwen3-TTS 0.6B CustomVoice
    icon: https://app.cdn.olares.com/appstore/audioengines/qwen/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audioqwen3tts06v3: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice'
  fullDescription: |
    Qwen3-TTS 0.6B CustomVoice reads text aloud in one of nine preset voices. It speaks a finished passage or starts speaking while the text is still arriving.

    **Key features**
    - Read text aloud in ten languages, including Chinese and English.
    - Choose among nine preset voices.
    - Stream speech while the text is still arriving.
    - Make speech available to compatible Olares applications.

    A compatible NVIDIA GPU with at least `4Gi` of GPU memory is required.

  upgradeDescription: |
    v1.0.2: Engine v1.1.34. A streamed sentence whose client hangs up no longer leaves the engine stuck; each request's length is bounded by its text; first audio stays fast while an LLM shares the GPU.

  developer: Alibaba
  website: https://qwen.ai/
  sourceCode: https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  doc: https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  license:
    - text: Apache-2.0
      url: https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice

  accelerator:
    # Sum rule: accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "12Gi"
      requiredMemory: "2304Mi"
      requiredGPUMemory: "4Gi"
      limitedGPUMemory: "4Gi"
    - mode: nvidia-gb10
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "8Gi"
      requiredMemory: "4352Mi"
    # Intel iGPU: engine request 4Gi / limit 8Gi + llm-init 256Mi/4Gi. No GPU-memory field.
    - mode: intel
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "12Gi"
      requiredMemory: "4352Mi"
    # Intel Arc: discrete. GPU-memory field is the installer label. The pod bind-mounts /dev/dri.
    - mode: intel-gpu
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "12Gi"
      requiredMemory: "4352Mi"
      requiredGPUMemory: "4Gi"
      limitedGPUMemory: "4Gi"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    options:
    - title: Audio
      value: audio
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "tts"
    multiSelect: true
    splitter: ","
    options:
    - title: TTS (preset-voice speech synthesis)
      value: tts
    description: "Capabilities this app exposes."
  - envName: REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4Gi"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
  - envName: CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4"
  - envName: MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "8Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
    # No default: nvidia/gb10 stay on the CUDA image; intel/intel-gpu use the OpenVINO image.
    description: "Engine image override. Left empty, nvidia and nvidia-gb10 use
      docker.io/beclab/audio-qwen3tts:v1.1.34; intel and intel-gpu use
      docker.io/beclab/audio-qwen3tts-ov:v1.1.34. Filling this REPLACES that choice for every mode."
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    description: "Engine-native flags (llm-init ENGINE_ARGS). Left empty, the engine
      keeps its own defaults. Whatever is here replaces that whole list."
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
