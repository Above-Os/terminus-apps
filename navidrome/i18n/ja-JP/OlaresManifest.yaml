metadata:
  title: Navidrome
  description: あなた専用のストリーミングサービス
spec:
  fullDescription: |
    Navidrome はオープンソースの Web ベース音楽コレクションサーバー／ストリーマーです。任意のブラウザやモバイル端末から音楽コレクションを聴けます。
    個人用の Spotify のような存在です！

    **機能**
    - 非常に大きな音楽コレクションに対応
    - 利用可能なほぼすべての音声フォーマットをストリーム
    - 丁寧に整備したメタデータをすべて読み取り活用
    - コンピレーション（Various Artists）やボックスセット（複数ディスク）の優れたサポート
    - マルチユーザー：各ユーザーが独自の再生回数、プレイリスト、お気に入りなどを持てます
    - 非常に低いリソース使用量
    - マルチプラットフォーム：macOS、Linux、Windows。Docker イメージも提供
    - Raspberry Pi を含む主要プラットフォーム向けのすぐ使えるバイナリ
    - ライブラリの変更を自動監視し、新規ファイルのインポートとメタデータの再読み込み
    - Material UI ベースのテーマ対応・モダン・レスポンシブな Web インターフェース
    - すべての Subsonic/Madsonic/Airsonic クライアントと互換
    - オンザフライ・トランスコード。ユーザー／プレイヤーごとに設定可能。Opus エンコード対応
    - 多言語翻訳済み
  upgradeDescription: |
    アプリバージョンを 0.52.5 にアップグレード、スクリーンショット追加、必要リソースを調整。

    **バグ修正ポイントリリース**
    主にバグ修正版で、一部の Jukebox 問題に焦点を当てつつ、その他の一般的な改善と修正も含みます。

    **ハイライト**
    [UI] Catppuccin Macchiato テーマを追加 (3014)。Thanks @edthu
    [UI] 名前／タイトルでのリスト並び替えを大文字小文字無視に (2993)
    [Server] HTTPSecurityHeaders.CustomFrameOptionsValue 設定オプションを追加。
    [Server] 順序が乱れた繰り返し歌詞を並べ替え (2989)。Thanks @kgarner7
    [Server] AlbumPlayCountMode が normalize のときの playCount によるアルバム並び替えを修正
    [Server] MIME タイプを外部ファイル $DataFolder/resources/mime_types.yml で上書き可能に（ドキュメント必要）
    [Server] .dsf の MIME タイプを audio/x-dsf に変更 (3021)
    [Server] Jukebox モードの一般的な改善 (#2997, #2996, #2849, #3008)。Thanks @ms140569
    [Subsonic] OpenSubsonic 応答に samplingRate を追加

    完全なリリースノート: https://github.com/navidrome/navidrome/releases/tag/v0.52.5
