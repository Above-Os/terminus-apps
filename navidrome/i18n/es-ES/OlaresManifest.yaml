metadata:
  title: Navidrome
  description: Tu servicio de streaming personal
spec:
  fullDescription: |
    Navidrome es un servidor y streamer de colección musical web de código abierto. Te da libertad para escuchar tu colección desde cualquier navegador o dispositivo móvil.
    ¡Es como tu Spotify personal!

    **Funciones**
    - Gestiona colecciones musicales muy grandes
    - Transmite prácticamente cualquier formato de audio disponible
    - Lee y usa todos tus metadatos cuidadosamente curados
    - Gran compatibilidad con recopilaciones (Various Artists) y box sets (álbumes multidisco)
    - Multiusuario: cada usuario tiene sus propios recuentos de reproducción, listas, favoritos, etc.
    - Uso de recursos muy bajo
    - Multiplataforma: macOS, Linux y Windows. También hay imágenes Docker
    - Binarios listos para usar en las principales plataformas, incluido Raspberry Pi
    - Supervisa automáticamente tu biblioteca en busca de cambios, importa archivos nuevos y recarga metadatos
    - Interfaz web tematizable, moderna y adaptable basada en Material UI
    - Compatible con todos los clientes Subsonic/Madsonic/Airsonic
    - Transcodificación al vuelo. Configurable por usuario/reproductor. Compatible con codificación Opus
    - Traducido a varios idiomas
  upgradeDescription: |
    Actualizar la versión de la app a 0.52.5, añadir capturas y ajustar los recursos necesarios.

    **Versión de corrección de errores**
    Es principalmente una versión de corrección, centrada en algunos problemas del Jukebox, pero también con otras mejoras y correcciones generales.

    **Destacados**
    [UI] Añadido tema Catppuccin Macchiato (3014). Gracias @edthu
    [UI] Ordenación de listas por nombre/título sin distinguir mayúsculas (2993)
    [Server] Añadida opción HTTPSecurityHeaders.CustomFrameOptionsValue.
    [Server] Ordenar letras repetidas que puedan estar desordenadas (2989). Gracias @kgarner7
    [Server] Corregida la ordenación de álbumes por playCount cuando AlbumPlayCountMode es normalize
    [Server] Los tipos MIME se pueden sobrescribir con un archivo externo, $DataFolder/resources/mime_types.yml (necesita documentación)
    [Server] Tipo MIME .dsf cambiado a audio/x-dsf (3021)
    [Server] Mejoras generales del modo Jukebox (#2997, #2996, #2849, #3008). Gracias @ms140569
    [Subsonic] Añadido samplingRate a las respuestas OpenSubsonic

    Notas de la versión completa: https://github.com/navidrome/navidrome/releases/tag/v0.52.5
