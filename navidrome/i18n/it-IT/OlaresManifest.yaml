metadata:
  title: Navidrome
  description: Il tuo servizio di streaming personale
spec:
  fullDescription: |
    Navidrome è un server e streamer web open source per collezioni musicali. Ti dà la libertà di ascoltare la tua collezione da qualsiasi browser o dispositivo mobile.
    È come il tuo Spotify personale!

    **Funzionalità**
    - Gestisce collezioni musicali molto grandi
    - Streaming di praticamente qualsiasi formato audio disponibile
    - Legge e usa tutti i tuoi metadati curati con cura
    - Ottimo supporto per compilation (Various Artists) e box set (album multi-disco)
    - Multiutente: ogni utente ha i propri play count, playlist, preferiti, ecc.
    - Uso risorse molto basso
    - Multipiattaforma: macOS, Linux e Windows. Disponibili anche immagini Docker
    - Binary pronti all'uso per le principali piattaforme, incluso Raspberry Pi
    - Monitora automaticamente la libreria per le modifiche, importa nuovi file e ricarica i metadati
    - Interfaccia web tematizzabile, moderna e responsive basata su Material UI
    - Compatibile con tutti i client Subsonic/Madsonic/Airsonic
    - Transcoding al volo. Impostabile per utente/player. Supportato encoding Opus
    - Tradotto in varie lingue
  upgradeDescription: |
    Aggiornamento app alla versione 0.52.5, aggiunta screenshot e regolazione delle risorse richieste.

    **Release di bugfix**
    Questa è principalmente una versione di bugfix, con focus su alcuni problemi del Jukebox, ma anche altri miglioramenti e correzioni generali.

    **Highlight**
    [UI] Aggiunto tema Catppuccin Macchiato (3014). Grazie @edthu
    [UI] Ordinamento elenchi per nome/titolo senza distinzione maiuscole/minuscole (2993)
    [Server] Aggiunta opzione HTTPSecurityHeaders.CustomFrameOptionsValue.
    [Server] Ordinamento testi ripetuti eventualmente fuori ordine (2989). Grazie @kgarner7
    [Server] Corretto ordinamento album per playCount con AlbumPlayCountMode=normalize
    [Server] I tipi MIME possono essere sovrascritti con un file esterno, $DataFolder/resources/mime_types.yml (serve documentazione)
    [Server] MIME-type .dsf cambiato in audio/x-dsf (3021)
    [Server] Miglioramenti generali alla modalità Jukebox (#2997, #2996, #2849, #3008). Grazie @ms140569
    [Subsonic] Aggiunto samplingRate alle risposte OpenSubsonic

    Note di rilascio complete: https://github.com/navidrome/navidrome/releases/tag/v0.52.5
