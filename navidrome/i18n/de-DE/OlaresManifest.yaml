metadata:
  title: Navidrome
  description: Ihr persönlicher Streaming-Dienst
spec:
  fullDescription: |
    Navidrome ist ein Open-Source-, webbasierter Musiksammlungs-Server und Streamer. Er gibt Ihnen die Freiheit, Ihre Musiksammlung von jedem Browser oder Mobilgerät aus zu hören.
    Es ist wie Ihr persönliches Spotify!

    **Funktionen**
    - Bewältigt sehr große Musiksammlungen
    - Streamt praktisch jedes verfügbare Audioformat
    - Liest und nutzt all Ihre sorgfältig gepflegten Metadaten
    - Hervorragende Unterstützung für Compilations (Various Artists) und Box-Sets (Mehrfach-CDs)
    - Mehrbenutzerfähig — jeder Benutzer hat eigene Playcounts, Playlists, Favoriten usw.
    - Sehr geringer Ressourcenverbrauch
    - Multiplattform: macOS, Linux und Windows. Auch Docker-Images verfügbar
    - Einsatzbereite Binaries für alle großen Plattformen, inklusive Raspberry Pi
    - Überwacht Ihre Bibliothek automatisch auf Änderungen, importiert neue Dateien und lädt neue Metadaten
    - Themesfähige, moderne und responsive Weboberfläche auf Basis von Material UI
    - Kompatibel mit allen Subsonic-/Madsonic-/Airsonic-Clients
    - On-the-fly-Transcoding. Pro Benutzer/Player einstellbar. Opus-Kodierung wird unterstützt
    - In verschiedene Sprachen übersetzt
  upgradeDescription: |
    App-Version auf 0.52.5 aktualisieren, Screenshots hinzufügen und erforderliche Ressourcen anpassen.

    **Bugfix-Punktversion**
    Dies ist vor allem eine Bugfix-Version mit Fokus auf einige Jukebox-Probleme, aber auch allgemeinen Verbesserungen und Fixes.

    **Highlights**
    [UI] Catppuccin-Macchiato-Theme hinzugefügt (3014). Danke @edthu
    [UI] Sortierung von Listen nach Name/Titel jetzt ohne Berücksichtigung der Groß-/Kleinschreibung (2993)
    [Server] Konfigurationsoption HTTPSecurityHeaders.CustomFrameOptionsValue hinzugefügt.
    [Server] Wiederholte Lyrics sortieren, die außer der Reihe sein können (2989). Danke @kgarner7
    [Server] Sortierung von Alben nach playCount bei AlbumPlayCountMode=normalize korrigiert
    [Server] MIME-Typen können jetzt über eine externe Datei überschrieben werden, $DataFolder/resources/mime_types.yml (Dokumentation nötig)
    [Server] .dsf-MIME-Typ zu audio/x-dsf geändert (3021)
    [Server] Allgemeine Verbesserungen am Jukebox-Modus (#2997, #2996, #2849, #3008). Danke @ms140569
    [Subsonic] samplingRate zu OpenSubsonic-Antworten hinzugefügt

    Vollständige Release Notes: https://github.com/navidrome/navidrome/releases/tag/v0.52.5
