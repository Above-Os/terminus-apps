metadata:
  title: Navidrome
  description: Votre service de streaming personnel
spec:
  fullDescription: |
    Navidrome est un serveur et streamer web open source pour collections musicales. Il vous donne la liberté d'écouter votre collection depuis n'importe quel navigateur ou appareil mobile.
    C'est comme votre Spotify personnel !

    **Fonctionnalités**
    - Gère de très grandes collections musicales
    - Diffuse pratiquement tous les formats audio disponibles
    - Lit et utilise toutes vos métadonnées soigneusement organisées
    - Excellent support des compilations (Various Artists) et box sets (albums multi-disques)
    - Multi-utilisateurs : chaque utilisateur a ses propres compteurs de lecture, playlists, favoris, etc.
    - Très faible consommation de ressources
    - Multiplateforme : macOS, Linux et Windows. Images Docker également disponibles
    - Binaires prêts à l'emploi pour les principales plateformes, y compris Raspberry Pi
    - Surveille automatiquement votre bibliothèque pour les changements, importe les nouveaux fichiers et recharge les métadonnées
    - Interface web thématisable, moderne et responsive basée sur Material UI
    - Compatible avec tous les clients Subsonic/Madsonic/Airsonic
    - Transcodage à la volée. Configurable par utilisateur/lecteur. Encodage Opus pris en charge
    - Traduit en plusieurs langues
  upgradeDescription: |
    Mise à jour de l'application vers 0.52.5, ajout de captures d'écran et ajustement des ressources requises.

    **Version de correction de bugs**
    Il s'agit surtout d'une version de correction, centrée sur quelques problèmes du Jukebox, mais aussi d'autres améliorations et correctifs généraux.

    **Points forts**
    [UI] Ajout du thème Catppuccin Macchiato (3014). Merci @edthu
    [UI] Tri des listes par nom/titre insensible à la casse (2993)
    [Server] Ajout de l'option HTTPSecurityHeaders.CustomFrameOptionsValue.
    [Server] Tri des paroles répétées éventuellement désordonnées (2989). Merci @kgarner7
    [Server] Correction du tri des albums par playCount lorsque AlbumPlayCountMode est normalize
    [Server] Les types MIME peuvent désormais être remplacés via un fichier externe, $DataFolder/resources/mime_types.yml (documentation nécessaire)
    [Server] Type MIME .dsf changé en audio/x-dsf (3021)
    [Server] Améliorations générales du mode Jukebox (#2997, #2996, #2849, #3008). Merci @ms140569
    [Subsonic] Ajout de samplingRate aux réponses OpenSubsonic

    Notes de version complètes : https://github.com/navidrome/navidrome/releases/tag/v0.52.5
