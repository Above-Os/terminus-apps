olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  tensorzeroingress: 1
  tensorzero: 1
metadata:
  name: tensorzero
  description: An open-source platform for building, monitoring, and improving LLM applications
  icon: https://app.cdn.olares.com/appstore/tensorzero/icon.png
  appid: tensorzero
  version: '1.0.18'
  title: TensorZero
  categories:
  - Utilities_v112
  - agents
  tags:
  - gateway

permission:
  appData: true
  appCache: true
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 fixes a high-risk vulnerability in the gateway.

    [Release notes](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  versionName: '2026.6.0'
  promoteImage:
    - https://app.cdn.olares.com/appstore/tensorzero/1.webp
    - https://app.cdn.olares.com/appstore/tensorzero/2.webp
    - https://app.cdn.olares.com/appstore/tensorzero/3.webp
  fullDescription: |
    TensorZero is an open-source platform for developers building applications with large language models (LLMs). It brings model access, request monitoring, evaluation, and optimization together so teams can compare results and improve their applications.

    **Key features**

    - Access supported model providers through a unified API.
    - Inspect model requests, responses, and feedback in the web interface.
    - Compare prompts and models using datasets, scoring rules, and LLM-based evaluators.
    - Use production metrics and human feedback to improve prompts and model choices.
    - Run A/B tests and configure request routing, retries, and fallback models.

    [Documentation](https://www.tensorzero.com/docs)
  developer: TensorZero
  website: https://www.tensorzero.com/
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  requiredMemory: 1.75Gi
  limitedMemory: 7.5Gi
  requiredDisk: 512Mi
  limitedDisk: 2Gi
  requiredCpu: 0.5
  limitedCpu: 4.5
  doc: https://www.tensorzero.com/docs
  supportArch:
  - amd64
  - arm64
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
  - authLevel: internal
    host: tensorzeroingress
    icon: https://app.cdn.olares.com/appstore/tensorzero/icon.png
    name: tensorzero
    openMethod: window
    port: 8080
    title: TensorZero
middleware:
  postgres:
    username: tensorzero
    databases:
      - name: tensorzerodb
        distributed: false
        extensions:
          - vector
