metadata:
  title: TensorZero
  description: Stack open-source per applicazioni LLM di livello industriale
spec:
  upgradeDescription: |
    Passaggio dell'immagine reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineamento dei mount della config nginx e dei percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), e rimozione del wiring Bitnami specifico `OPENRESTY_CONF_FILE`.
  fullDescription: |
    TensorZero è uno stack open-source per applicazioni LLM di livello industriale. Unifica un gateway LLM, osservabilità, ottimizzazione, valutazione e sperimentazione.

    - Gateway: accesso a ogni provider LLM tramite un'API unificata, progettato per le prestazioni (<1ms latenza p99)
    - Osservabilità: memorizza inferenze e feedback nel database, disponibili programmaticamente o nella UI
    - Ottimizzazione: raccoglie metriche e feedback umano per ottimizzare prompt, modelli e strategie di inferenza
    - Valutazione: confronta singole inferenze o workflow end-to-end con euristiche, giudici LLM, ecc.
    - Sperimentazione: rilascia con fiducia con A/B testing, routing, fallback, retry, ecc. integrati

    **Funzionalità**
    - LLM Gateway: integrati una volta con TensorZero e accedi a ogni provider LLM principale.
    - LLM Observability: esegui il debug di singole chiamate API o monitora le metriche su modelli e prompt — tutto con la UI open-source di TensorZero.
    - LLM Optimization: invia metriche di produzione e feedback umano per ottimizzare prompt, modelli e strategie — via UI o programmaticamente.
    - LLM Evaluation: confronta prompt, modelli e strategie con valutazioni basate su euristiche e giudici LLM.
    - LLM Experimentation: rilascia con fiducia con A/B testing, routing, fallback, retry, ecc.
    - e altro: costruisci con uno stack open-source adatto ai prototipi ma progettato fin dall'inizio per le applicazioni LLM più complesse.
