metadata:
  title: TensorZero
  description: Una piattaforma open source per creare, monitorare e migliorare applicazioni basate su LLM
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 corregge una vulnerabilità ad alto rischio nel gateway.

    [Note di rilascio](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero è una piattaforma open source per sviluppatori di applicazioni basate su modelli linguistici di grandi dimensioni (LLM). Riunisce accesso ai modelli, monitoraggio delle richieste, valutazione e ottimizzazione, per aiutare i team a confrontare i risultati e migliorare le applicazioni.

    **Funzionalità principali**

    - Accedere ai fornitori di modelli supportati tramite un’API unificata.
    - Esaminare richieste ai modelli, risposte e feedback nell’interfaccia web.
    - Confrontare prompt e modelli usando set di dati, regole di assegnazione dei punteggi e valutatori basati su LLM.
    - Migliorare i prompt e la scelta dei modelli con metriche di produzione e feedback umano.
    - Eseguire test A/B e configurare l’instradamento delle richieste, i tentativi successivi e i modelli di riserva.

    [Documentazione](https://www.tensorzero.com/docs)
