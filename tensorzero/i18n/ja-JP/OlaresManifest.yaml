metadata:
  title: TensorZero
  description: 大規模言語モデルを使うアプリの構築・監視・改善のためのオープンソースプラットフォーム
spec:
  upgradeDescription: |
    TensorZero 2026.6.0では、ゲートウェイの高リスクな脆弱性が修正されています。

    [リリースノート](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZeroは、大規模言語モデル（LLM）を使ったアプリケーションを構築する開発者向けのオープンソースプラットフォームです。モデルの呼び出し、リクエストの監視、評価、最適化をまとめて扱い、チームが結果を比較してアプリケーションを改善できるようにします。

    **主な機能**

    - 統一されたAPIで対応するモデルプロバイダーを利用できます。
    - ウェブ画面でモデルへのリクエスト、応答、フィードバックを確認できます。
    - データセット、採点ルール、LLMを使った評価器でプロンプトとモデルを比較できます。
    - 本番環境の指標と人によるフィードバックを基に、プロンプトとモデルの選択を改善できます。
    - A/Bテストを実施し、リクエストのルーティング、再試行、代替モデルを設定できます。

    [ドキュメント](https://www.tensorzero.com/docs)
