metadata:
  title: TensorZero
  description: 産業グレードの LLM アプリケーション向けオープンソーススタック
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替え。

    nginx 設定マウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
  fullDescription: |
    TensorZero は産業グレードの LLM アプリケーション向けオープンソーススタックです。LLM ゲートウェイ、オブザーバビリティ、最適化、評価、実験を統合します。

    - Gateway: 統一 API ですべての LLM プロバイダーにアクセス。パフォーマンス重視（p99 レイテンシ <1ms）
    - Observability: 推論とフィードバックをデータベースに保存。プログラムまたは UI から利用可能
    - Optimization: メトリクスと人のフィードバックを収集し、プロンプト・モデル・推論戦略を最適化
    - Evaluation: ヒューリスティックや LLM ジャッジなどで個別推論やエンドツーエンドワークフローをベンチマーク
    - Experimentation: 組み込みの A/B テスト、ルーティング、フォールバック、リトライなどで自信を持って出荷

    **機能**
    - LLM Gateway: TensorZero に一度統合すれば主要 LLM プロバイダーすべてにアクセス
    - LLM Observability: 個別 API 呼び出しのデバッグや、モデル／プロンプト横断のメトリクス監視 — すべてオープンソースの TensorZero UI で
    - LLM Optimization: 本番メトリクスと人のフィードバックを送り、プロンプト・モデル・推論戦略を最適化 — UI またはプログラムから
    - LLM Evaluation: ヒューリスティックと LLM ジャッジによる評価でプロンプト・モデル・戦略を比較
    - LLM Experimentation: A/B テスト、ルーティング、フォールバック、リトライなどで自信を持って出荷
    - その他: プロトタイプにも適しつつ、最も複雑な LLM アプリケーションとデプロイ向けに一から設計されたオープンソーススタックで構築
