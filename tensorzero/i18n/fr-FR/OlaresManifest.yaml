metadata:
  title: TensorZero
  description: Une plateforme open source pour créer, surveiller et améliorer les applications utilisant des LLM
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 corrige une vulnérabilité à haut risque dans la passerelle.

    [Notes de version](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero est une plateforme open source destinée aux développeurs d’applications utilisant de grands modèles de langage (LLM). Elle réunit l’accès aux modèles, le suivi des requêtes, l’évaluation et l’optimisation pour aider les équipes à comparer les résultats et à améliorer leurs applications.

    **Fonctionnalités principales**

    - Accéder aux fournisseurs de modèles pris en charge via une API unifiée.
    - Examiner les requêtes aux modèles, les réponses et les retours dans l’interface web.
    - Comparer les prompts et les modèles à l’aide de jeux de données, de règles de notation et d’évaluateurs fondés sur des LLM.
    - Améliorer les prompts et le choix des modèles à partir des métriques de production et des retours humains.
    - Effectuer des tests A/B et configurer le routage des requêtes, les nouvelles tentatives et les modèles de secours.

    [Documentation](https://www.tensorzero.com/docs)
