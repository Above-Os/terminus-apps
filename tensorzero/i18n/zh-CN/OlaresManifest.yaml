metadata:
  title: TensorZero
  description: 用于构建、监测和改进大语言模型应用的开源平台
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 修复了网关中的一个高风险漏洞。

    [发布说明](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero 是面向开发者的开源平台，用于构建大语言模型（LLM）应用。它将模型调用、请求监测、评估和优化整合在一起，帮助团队比较结果并改进应用。

    **主要功能**

    - 通过统一的 API 调用受支持的模型服务。
    - 在网页界面中查看模型请求、响应和反馈。
    - 使用数据集、评分规则和基于 LLM 的评估器比较提示词与模型。
    - 利用生产环境指标和人工反馈改进提示词与模型选择。
    - 开展 A/B 测试，并配置请求路由、重试和备用模型。

    [使用文档](https://www.tensorzero.com/docs)
