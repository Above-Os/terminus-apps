metadata:
  title: TensorZero
  description: Stack de código abierto para aplicaciones LLM de nivel industrial
spec:
  upgradeDescription: |
    Cambio de la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alineación de montajes de configuración nginx y rutas de logs con el layout de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado Bitnami específico `OPENRESTY_CONF_FILE`.
  fullDescription: |
    TensorZero es un stack de código abierto para aplicaciones LLM de nivel industrial. Unifica un gateway LLM, observabilidad, optimización, evaluación y experimentación.

    - Gateway: accede a cada proveedor LLM a través de una API unificada, diseñado para el rendimiento (<1ms de latencia p99)
    - Observabilidad: almacena inferencias y feedback en tu base de datos, disponible por programación o en la UI
    - Optimización: recopila métricas y feedback humano para optimizar prompts, modelos y estrategias de inferencia
    - Evaluación: compara inferencias individuales o flujos de extremo a extremo con heurísticas, jueces LLM, etc.
    - Experimentación: publica con confianza con A/B testing, enrutamiento, fallbacks, reintentos, etc. integrados

    **Funciones**
    - LLM Gateway: intégrate una vez con TensorZero y accede a cada proveedor LLM principal.
    - LLM Observability: depura llamadas API individuales o monitoriza métricas entre modelos y prompts — todo con la UI open-source de TensorZero.
    - LLM Optimization: envía métricas de producción y feedback humano para optimizar prompts, modelos y estrategias de inferencia — vía UI o programáticamente.
    - LLM Evaluation: compara prompts, modelos y estrategias con evaluaciones basadas en heurísticas y jueces LLM.
    - LLM Experimentation: publica con confianza con A/B testing, routing, fallbacks, retries, etc.
    - y más: construye con un stack open-source adecuado para prototipos pero diseñado desde cero para las aplicaciones LLM más complejas.
