metadata:
  title: TensorZero
  description: Una plataforma de código abierto para crear, supervisar y mejorar aplicaciones con LLM
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 corrige una vulnerabilidad de alto riesgo en la puerta de enlace.

    [Notas de la versión](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero es una plataforma de código abierto para desarrolladores de aplicaciones con grandes modelos de lenguaje (LLM). Reúne el acceso a modelos, la supervisión de solicitudes, la evaluación y la optimización para que los equipos puedan comparar resultados y mejorar sus aplicaciones.

    **Funciones principales**

    - Acceder a los proveedores de modelos compatibles mediante una API unificada.
    - Examinar las solicitudes a los modelos, las respuestas y los comentarios en la interfaz web.
    - Comparar prompts y modelos mediante conjuntos de datos, reglas de puntuación y evaluadores basados en LLM.
    - Mejorar los prompts y la selección de modelos con métricas de producción y comentarios humanos.
    - Realizar pruebas A/B y configurar el enrutamiento de solicitudes, los reintentos y los modelos de respaldo.

    [Documentación](https://www.tensorzero.com/docs)
