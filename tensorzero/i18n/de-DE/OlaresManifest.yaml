metadata:
  title: TensorZero
  description: Open-Source-Stack für LLM-Anwendungen in Industriequalität
spec:
  upgradeDescription: |
    Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat` umgestellt.

    Nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images angepasst (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernt.
  fullDescription: |
    TensorZero ist ein Open-Source-Stack für LLM-Anwendungen in Industriequalität. Er vereint LLM-Gateway, Observability, Optimierung, Evaluation und Experimentation.

    - Gateway: Zugriff auf jeden LLM-Anbieter über eine einheitliche API, für Performance gebaut (<1ms p99-Latenz)
    - Observability: Speichert Inferences und Feedback in Ihrer Datenbank, programmatisch oder in der UI verfügbar
    - Optimierung: Sammelt Metriken und menschliches Feedback zur Optimierung von Prompts, Modellen und Inference-Strategien
    - Evaluation: Benchmark einzelner Inferences oder End-to-End-Workflows mit Heuristiken, LLM-Judges usw.
    - Experimentation: Mit Zuversicht ausliefern dank eingebautem A/B-Testing, Routing, Fallbacks, Retries usw.

    **Funktionen**
    - LLM Gateway: Einmal mit TensorZero integrieren und auf jeden großen LLM-Anbieter zugreifen.
    - LLM Observability: Einzelne API-Aufrufe debuggen oder Metriken über Modelle und Prompts hinweg überwachen — alles mit der Open-Source-TensorZero-UI.
    - LLM Optimization: Produktionsmetriken und menschliches Feedback senden, um Prompts, Modelle und Inference-Strategien zu optimieren — per UI oder programmatisch.
    - LLM Evaluation: Prompts, Modelle und Inference-Strategien mit Heuristiken und LLM-Judges vergleichen.
    - LLM Experimentation: Mit Zuversicht ausliefern dank A/B-Testing, Routing, Fallbacks, Retries usw.
    - & mehr: Mit einem Open-Source-Stack bauen, der für Prototypen geeignet ist, aber von Grund auf für die komplexesten LLM-Anwendungen und Deployments entworfen wurde.
