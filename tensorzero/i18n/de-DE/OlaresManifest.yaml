metadata:
  title: TensorZero
  description: Eine Open-Source-Plattform zum Entwickeln, Überwachen und Verbessern von LLM-Anwendungen
spec:
  upgradeDescription: |
    TensorZero 2026.6.0 behebt eine Sicherheitslücke mit hohem Risiko im Gateway.

    [Versionshinweise](https://github.com/tensorzero/tensorzero/releases/tag/2026.6.0)
  fullDescription: |
    TensorZero ist eine Open-Source-Plattform für Entwickler von Anwendungen mit großen Sprachmodellen (LLMs). Sie vereint Modellzugriff, Anfrageüberwachung, Evaluation und Optimierung, damit Teams Ergebnisse vergleichen und ihre Anwendungen verbessern können.

    **Hauptfunktionen**

    - Unterstützte Modellanbieter über eine einheitliche API nutzen.
    - Modellanfragen, Antworten und Feedback in der Weboberfläche prüfen.
    - Prompts und Modelle anhand von Datensätzen, Bewertungsregeln und LLM-basierten Evaluatoren vergleichen.
    - Prompts und Modellauswahl mit Produktionsmetriken und menschlichem Feedback verbessern.
    - A/B-Tests durchführen und Anfragerouting, Wiederholungsversuche sowie Ausweichmodelle konfigurieren.

    [Dokumentation](https://www.tensorzero.com/docs)
