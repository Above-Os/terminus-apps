apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: frappehrms
spec:
  replicas: {{ .Values.workloads.frappehrms.replicaCount }}
  selector:
    matchLabels:
      app: frappehrms
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frappehrms
      annotations:
        checksum/nginx-bootstrap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: init-permissions
          image: docker.io/beclab/aboveos-busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for d in /data /data/sites /cache /cache/logs; do
                mkdir -p "$d" && chown 1000:1000 "$d"
              done
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-data
              mountPath: /data
            - name: app-cache
              mountPath: /cache
        - name: configurator
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              cd /home/frappe/frappe-bench
              mkdir -p sites
              if [ ! -f sites/common_site_config.json ]; then
                echo '{}' > sites/common_site_config.json
              fi
              ls -1 apps > sites/apps.txt
              bench set-config -g db_host "$DB_HOST"
              bench set-config -gp db_port "$DB_PORT"
              bench set-config -g redis_cache "$REDIS_CACHE"
              bench set-config -g redis_queue "$REDIS_QUEUE"
              bench set-config -g redis_socketio "$REDIS_QUEUE"
              bench set-config -gp socketio_port 9000
              bench set-config -g chromium_path /usr/bin/chromium-headless-shell
          env:
            - name: DB_HOST
              value: "{{ .Values.mariadb.host }}"
            - name: DB_PORT
              value: "{{ .Values.mariadb.port | default 3306 }}"
            - name: REDIS_CACHE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REDIS_CACHE
            - name: REDIS_QUEUE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REDIS_QUEUE
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
        - name: create-site
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              cd /home/frappe/frappe-bench
              SITE_NAME="${SITE_NAME:-frontend}"
              wait-for-it -t 180 "${DB_HOST}:${DB_PORT}"
              wait-for-it -t 180 "${REDIS_HOST}:${REDIS_PORT}"
              if [ ! -f "sites/${SITE_NAME}/.olares-ready-v3" ]; then
                echo "Creating site ${SITE_NAME} on existing middleware database"
                /home/frappe/frappe-bench/env/bin/python /olares/create_site.py
                touch "sites/${SITE_NAME}/.olares-ready-v3"
              else
                echo "Site ${SITE_NAME} already provisioned"
              fi
              if [ -n "${FRAPPE_HOST_NAME:-}" ]; then
                bench --site "${SITE_NAME}" set-config host_name "https://${FRAPPE_HOST_NAME}"
              fi
          env:
            - name: SITE_NAME
              value: frontend
            - name: FRAPPE_HOST_NAME
              value: "{{ .Values.domain.frappehrms }}"
            - name: DB_HOST
              value: "{{ .Values.mariadb.host }}"
            - name: DB_PORT
              value: "{{ .Values.mariadb.port | default 3306 }}"
            - name: DB_NAME
              value: "{{ .Values.mariadb.databases.frappehrms }}"
            - name: DB_USER
              value: "{{ .Values.mariadb.username }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_PASSWORD
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ADMIN_PASSWORD
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port | default 6379 }}"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
            - name: nginx-bootstrap
              mountPath: /olares
              readOnly: true
      containers:
        - name: frappehrms
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /home/frappe/frappe-bench/sites/frontend/public
              cp /olares/login.html /home/frappe/frappe-bench/sites/frontend/public/login
              sed -E '/^[[:space:]]*(exec[[:space:]]+)?nginx([[:space:]]|$)/d' /usr/local/bin/nginx-entrypoint.sh > /tmp/gen-nginx.sh
              bash /tmp/gen-nginx.sh
              python3 /olares/patch_nginx.py
              exec nginx -g "daemon off;"
          env:
            - name: BACKEND
              value: 127.0.0.1:8000
            - name: SOCKETIO
              value: 127.0.0.1:9000
            - name: FRAPPE_SITE_NAME_HEADER
              value: frontend
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: 0.0.0.0/0
            - name: UPSTREAM_REAL_IP_HEADER
              value: X-Forwarded-For
            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "on"
            - name: PROXY_READ_TIMEOUT
              value: "120"
            - name: CLIENT_MAX_BODY_SIZE
              value: 50m
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
            - name: nginx-bootstrap
              mountPath: /olares
              readOnly: true
        - name: backend
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GUNICORN_WORKERS
              value: "2"
            - name: GUNICORN_THREADS
              value: "4"
            - name: GUNICORN_TIMEOUT
              value: "120"
          ports:
            - name: gunicorn
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
            - name: dshm
              mountPath: /dev/shm
        - name: websocket
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/socketio.js
          ports:
            - name: socketio
              containerPort: 9000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
        - name: worker
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          command:
            - bench
            - worker
            - --queue
            - short,default,long
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
        - name: scheduler
          image: docker.io/beclab/frappe-hrms:v16.16.0
          imagePullPolicy: IfNotPresent
          command:
            - bench
            - schedule
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: app-data
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: app-cache
          hostPath:
            path: "{{ .Values.userspace.appCache }}"
            type: DirectoryOrCreate
        - name: sites
          hostPath:
            path: "{{ .Values.userspace.appData }}/sites"
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: "{{ .Values.userspace.appCache }}/logs"
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: nginx-bootstrap
          configMap:
            name: {{ .Release.Name }}-nginx-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: frappehrms-svc
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: frappehrms
spec:
  type: ClusterIP
  selector:
    app: frappehrms
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
