metadata:
  title: Crawl4AI
  description: Open-Source LLM-freundlicher Web-Crawler und Scraper
spec:
  fullDescription: |
    Crawl4AI verwandelt das Web in sauberes, LLM-bereites Markdown für RAG, Agenten und Datenpipelines. Schnell, steuerbar, erprobt von einer Community mit 50k+ Sternen.
    
    **Funktionen**
    **Markdown-Generierung**
    - Clean Markdown: Erzeugt sauberes, strukturiertes Markdown mit genauer Formatierung.
    - Fit Markdown: Heuristikbasiertes Filtern, um Rauschen und irrelevante Teile für KI-freundliche Verarbeitung zu entfernen.
    - Citations and References: Wandelt Seitenlinks in eine nummerierte Referenzliste mit sauberen Zitaten um.
    - Custom Strategies: Nutzer können eigene Markdown-Generierungsstrategien für spezifische Bedürfnisse erstellen.
    - BM25 Algorithm: Nutzt BM25-basiertes Filtern zur Extraktion von Kerninformationen und Entfernung irrelevanten Inhalts.
    
    **Strukturierte Datenextraktion**
    - LLM-Driven Extraction: Unterstützt alle LLMs (open-source und proprietär) für strukturierte Datenextraktion.
    - Chunking Strategies: Implementiert Chunking (themenbasiert, Regex, Satzebene) für gezielte Inhaltsverarbeitung.
    - Cosine Similarity: Findet relevante Inhalts-Chunks basierend auf Nutzerabfragen für semantische Extraktion.
    - CSS-Based Extraction: Schnelle schema-basierte Datenextraktion mit XPath und CSS-Selektoren.
    - Schema Definition: Definieren Sie benutzerdefinierte Schemas zur Extraktion strukturierten JSONs aus wiederkehrenden Mustern.
    
    **Browser-Integration**
    - Managed Browser: Nutzen Sie nutzereigene Browser mit voller Kontrolle und vermeiden Sie Bot-Erkennung.
    - Remote Browser Control: Verbinden Sie sich mit dem Chrome Developer Tools Protocol für remote, großskalige Datenextraktion.
    - Browser Profiler: Erstellen und verwalten Sie persistente Profile mit gespeicherten Authentifizierungszuständen, Cookies und Einstellungen.
    - Session Management: Browserzustände bewahren und für mehrstufiges Crawling wiederverwenden.
    - Proxy Support: Nahtlos mit Authentifizierung zu Proxys verbinden für sicheren Zugriff.
    - Full Browser Control: Header, Cookies, User Agents und mehr für angepasste Crawling-Setups ändern.
    - Multi-Browser Support: Kompatibel mit Chromium, Firefox und WebKit.
    - Dynamic Viewport Adjustment: Passt den Browser-Viewport automatisch an den Seiteninhalt an und stellt vollständiges Rendering und Erfassen aller Elemente sicher.
    
    **Crawling & Scraping**
    - Media Support: Extrahiert Bilder, Audio, Videos und responsive Bildformate wie srcset und picture.
    - Dynamic Crawling: Führt JS aus und wartet auf async oder sync für dynamische Inhaltsextraktion.
    - Screenshots: Erfasst Seiten-Screenshots während des Crawlings für Debugging oder Analyse.
    - Raw Data Crawling: Verarbeitet direkt rohes HTML (raw:) oder lokale Dateien (file://).
    - Comprehensive Link Extraction: Extrahiert interne, externe Links und eingebetteten iframe-Inhalt.
    - Customizable Hooks: Definieren Sie Hooks bei jedem Schritt, um das Crawling-Verhalten anzupassen.
    - Caching: Daten cachen für bessere Geschwindigkeit und Vermeidung redundanter Abrufe.
    - Metadata Extraction: Strukturierte Metadaten von Webseiten abrufen.
    - IFrame Content Extraction: Nahtlose Extraktion aus eingebettetem iframe-Inhalt.
    - Lazy Load Handling: Wartet, bis Bilder vollständig geladen sind, damit kein Inhalt durch Lazy Loading verloren geht.
    - Full-Page Scanning: Simuliert Scrollen, um alle dynamischen Inhalte zu laden und zu erfassen – ideal für Infinite-Scroll-Seiten.
    
    **Bereitstellung**
    - Dockerized Setup: Optimiertes Docker-Image mit FastAPI-Server für einfache Bereitstellung.
    - Secure Authentication: Eingebaute JWT-Token-Authentifizierung für API-Sicherheit.
    - API Gateway: One-Click-Bereitstellung mit sicherer Token-Authentifizierung für API-basierte Workflows.
    - Scalable Architecture: Für Massenskalierung in der Produktion und optimierte Serverleistung ausgelegt.
    - Cloud Deployment: Bereitstellbereite Konfigurationen für große Cloud-Plattformen.
    
    **Zusätzliche Funktionen**
    - Stealth Mode: Bot-Erkennung vermeiden, indem echte Nutzer nachgeahmt werden.
    - Tag-Based Content Extraction: Crawling anhand benutzerdefinierter Tags, Header oder Metadaten verfeinern.
    - Link Analysis: Alle Links extrahieren und analysieren für detaillierte Datenexploration.
    - Error Handling: Robuste Fehlerverwaltung für nahtlose Ausführung.
    - CORS & Static Serving: Unterstützt dateisystembasiertes Caching und Cross-Origin-Anfragen.
    - Clear Documentation: Vereinfachte und aktualisierte Guides für Onboarding und erweiterte Nutzung.
    - Community Recognition: Würdigt Mitwirkende und Pull Requests für Transparenz.
