metadata:
  title: Crawl4AI
  description: Crawler et scraper web open source adapté aux LLM
spec:
  fullDescription: |
    Crawl4AI transforme le web en Markdown propre et prêt pour les LLM pour RAG, agents et pipelines de données. Rapide, contrôlable, éprouvé par une communauté de plus de 50k étoiles.
    
    **Fonctionnalités**
    **Génération Markdown**
    - Clean Markdown : Génère un Markdown propre et structuré avec un formatage précis.
    - Fit Markdown : Filtrage heuristique pour supprimer le bruit et les parties non pertinentes pour un traitement adapté à l'IA.
    - Citations and References : Convertit les liens de page en une liste de références numérotée avec des citations propres.
    - Custom Strategies : Les utilisateurs peuvent créer leurs propres stratégies de génération Markdown adaptées à des besoins spécifiques.
    - BM25 Algorithm : Emploie un filtrage basé sur BM25 pour extraire l'information centrale et supprimer le contenu non pertinent.
    
    **Extraction de données structurées**
    - LLM-Driven Extraction : Prend en charge tous les LLM (open source et propriétaires) pour l'extraction de données structurées.
    - Chunking Strategies : Implémente le chunking (par sujet, regex, au niveau phrase) pour un traitement de contenu ciblé.
    - Cosine Similarity : Trouve des chunks de contenu pertinents selon les requêtes utilisateur pour une extraction sémantique.
    - CSS-Based Extraction : Extraction de données rapide basée sur un schéma avec XPath et sélecteurs CSS.
    - Schema Definition : Définissez des schémas personnalisés pour extraire du JSON structuré à partir de motifs répétitifs.
    
    **Intégration navigateur**
    - Managed Browser : Utilisez des navigateurs appartenant à l'utilisateur avec un contrôle total, en évitant la détection de bots.
    - Remote Browser Control : Connectez-vous au Chrome Developer Tools Protocol pour une extraction distante à grande échelle.
    - Browser Profiler : Créez et gérez des profils persistants avec états d'authentification, cookies et réglages enregistrés.
    - Session Management : Préservez les états du navigateur et réutilisez-les pour un crawling multi-étapes.
    - Proxy Support : Connectez-vous sans friction à des proxies avec authentification pour un accès sécurisé.
    - Full Browser Control : Modifiez headers, cookies, user agents et plus pour des setups de crawling sur mesure.
    - Multi-Browser Support : Compatible avec Chromium, Firefox et WebKit.
    - Dynamic Viewport Adjustment : Ajuste automatiquement le viewport du navigateur au contenu de la page, assurant un rendu et une capture complets de tous les éléments.
    
    **Crawling et scraping**
    - Media Support : Extrait images, audio, vidéos et formats d'image responsive comme srcset et picture.
    - Dynamic Crawling : Exécute du JS et attend async ou sync pour l'extraction de contenu dynamique.
    - Screenshots : Capture des captures d'écran de page pendant le crawling pour le débogage ou l'analyse.
    - Raw Data Crawling : Traite directement le HTML brut (raw:) ou des fichiers locaux (file://).
    - Comprehensive Link Extraction : Extrait les liens internes, externes et le contenu iframe intégré.
    - Customizable Hooks : Définissez des hooks à chaque étape pour personnaliser le comportement du crawling.
    - Caching : Met en cache les données pour améliorer la vitesse et éviter les récupérations redondantes.
    - Metadata Extraction : Récupère des métadonnées structurées depuis les pages web.
    - IFrame Content Extraction : Extraction fluide depuis le contenu iframe intégré.
    - Lazy Load Handling : Attend que les images soient entièrement chargées, garantissant qu'aucun contenu ne soit manqué à cause du lazy loading.
    - Full-Page Scanning : Simule le défilement pour charger et capturer tout le contenu dynamique, idéal pour les pages à défilement infini.
    
    **Déploiement**
    - Dockerized Setup : Image Docker optimisée avec serveur FastAPI pour un déploiement facile.
    - Secure Authentication : Authentification JWT intégrée pour la sécurité de l'API.
    - API Gateway : Déploiement en un clic avec authentification par jeton sécurisée pour les workflows basés sur l'API.
    - Scalable Architecture : Conçu pour la production à grande échelle et des performances serveur optimisées.
    - Cloud Deployment : Configurations prêtes à déployer pour les principales plateformes cloud.
    
    **Fonctionnalités supplémentaires**
    - Stealth Mode : Évitez la détection de bots en imitant de vrais utilisateurs.
    - Tag-Based Content Extraction : Affinez le crawling selon des balises, headers ou métadonnées personnalisés.
    - Link Analysis : Extraire et analyser tous les liens pour une exploration de données détaillée.
    - Error Handling : Gestion d'erreurs robuste pour une exécution fluide.
    - CORS & Static Serving : Prend en charge le cache basé sur le système de fichiers et les requêtes cross-origin.
    - Clear Documentation : Guides simplifiés et mis à jour pour l'onboarding et l'usage avancé.
    - Community Recognition : Reconnaît les contributeurs et pull requests pour la transparence.
