metadata:
  title: Crawl4AI
  description: Web crawler e scraper open source LLM-friendly
spec:
  fullDescription: |
    Crawl4AI trasforma il web in Markdown pulito e pronto per LLM per RAG, agenti e pipeline di dati. Veloce, controllabile, collaudato da una community con oltre 50k stelle.
    
    **Funzionalità**
    **Generazione Markdown**
    - Clean Markdown: Genera Markdown pulito e strutturato con formattazione accurata.
    - Fit Markdown: Filtraggio euristico per rimuovere rumore e parti irrilevanti per un'elaborazione AI-friendly.
    - Citations and References: Converte i link della pagina in un elenco di riferimenti numerato con citazioni pulite.
    - Custom Strategies: Gli utenti possono creare le proprie strategie di generazione Markdown su misura per esigenze specifiche.
    - BM25 Algorithm: Impiega filtraggio basato su BM25 per estrarre informazioni principali e rimuovere contenuti irrilevanti.
    
    **Estrazione di dati strutturati**
    - LLM-Driven Extraction: Supporta tutti gli LLM (open-source e proprietari) per l'estrazione di dati strutturati.
    - Chunking Strategies: Implementa chunking (per argomento, regex, a livello di frase) per l'elaborazione mirata dei contenuti.
    - Cosine Similarity: Trova chunk di contenuto rilevanti in base alle query dell'utente per l'estrazione semantica.
    - CSS-Based Extraction: Estrazione dati rapida basata su schema usando XPath e selettori CSS.
    - Schema Definition: Definisci schemi personalizzati per estrarre JSON strutturato da pattern ripetitivi.
    
    **Integrazione browser**
    - Managed Browser: Usa browser di proprietà dell'utente con pieno controllo, evitando il rilevamento bot.
    - Remote Browser Control: Connettiti al Chrome Developer Tools Protocol per estrazione remota su larga scala.
    - Browser Profiler: Crea e gestisci profili persistenti con stati di autenticazione, cookie e impostazioni salvati.
    - Session Management: Conserva gli stati del browser e riutilizzali per crawling multi-step.
    - Proxy Support: Connettiti senza problemi a proxy con autenticazione per accesso sicuro.
    - Full Browser Control: Modifica header, cookie, user agent e altro per setup di crawling su misura.
    - Multi-Browser Support: Compatibile con Chromium, Firefox e WebKit.
    - Dynamic Viewport Adjustment: Regola automaticamente il viewport del browser al contenuto della pagina, assicurando rendering e cattura completi di tutti gli elementi.
    
    **Crawling e scraping**
    - Media Support: Estrae immagini, audio, video e formati immagine responsive come srcset e picture.
    - Dynamic Crawling: Esegue JS e attende async o sync per l'estrazione di contenuti dinamici.
    - Screenshots: Cattura screenshot di pagina durante il crawling per debug o analisi.
    - Raw Data Crawling: Elabora direttamente HTML grezzo (raw:) o file locali (file://).
    - Comprehensive Link Extraction: Estrae link interni, esterni e contenuti iframe incorporati.
    - Customizable Hooks: Definisci hook a ogni passo per personalizzare il comportamento di crawling.
    - Caching: Memorizza i dati in cache per migliorare la velocità ed evitare fetch ridondanti.
    - Metadata Extraction: Recupera metadati strutturati dalle pagine web.
    - IFrame Content Extraction: Estrazione fluida dai contenuti iframe incorporati.
    - Lazy Load Handling: Attende che le immagini siano completamente caricate, assicurando che nessun contenuto venga perso a causa del lazy loading.
    - Full-Page Scanning: Simula lo scorrimento per caricare e catturare tutti i contenuti dinamici, ideale per pagine a scroll infinito.
    
    **Deployment**
    - Dockerized Setup: Immagine Docker ottimizzata con server FastAPI per un deploy facile.
    - Secure Authentication: Autenticazione JWT integrata per la sicurezza dell'API.
    - API Gateway: Deploy con un clic con autenticazione sicura tramite token per workflow basati su API.
    - Scalable Architecture: Progettato per produzione su larga scala e prestazioni server ottimizzate.
    - Cloud Deployment: Configurazioni pronte al deploy per le principali piattaforme cloud.
    
    **Funzionalità aggiuntive**
    - Stealth Mode: Evita il rilevamento bot imitando utenti reali.
    - Tag-Based Content Extraction: Affina il crawling in base a tag, header o metadati personalizzati.
    - Link Analysis: Estrai e analizza tutti i link per un'esplorazione dati dettagliata.
    - Error Handling: Gestione errori robusta per un'esecuzione fluida.
    - CORS & Static Serving: Supporta caching basata su filesystem e richieste cross-origin.
    - Clear Documentation: Guide semplificate e aggiornate per onboarding e uso avanzato.
    - Community Recognition: Riconosce contributor e pull request per trasparenza.
