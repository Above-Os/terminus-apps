metadata:
  title: Crawl4AI
  description: Crawler y scraper web de código abierto amigable con LLM
spec:
  fullDescription: |
    Crawl4AI convierte la web en Markdown limpio y listo para LLM para RAG, agentes y pipelines de datos. Rápido, controlable, probado en batalla por una comunidad de más de 50k estrellas.
    
    **Funciones**
    **Generación de Markdown**
    - Clean Markdown: Genera Markdown limpio y estructurado con formato preciso.
    - Fit Markdown: Filtrado heurístico para eliminar ruido y partes irrelevantes para un procesamiento apto para IA.
    - Citations and References: Convierte los enlaces de la página en una lista de referencias numerada con citas limpias.
    - Custom Strategies: Los usuarios pueden crear sus propias estrategias de generación de Markdown adaptadas a necesidades específicas.
    - BM25 Algorithm: Emplea filtrado basado en BM25 para extraer información central y eliminar contenido irrelevante.
    
    **Extracción de datos estructurados**
    - LLM-Driven Extraction: Compatible con todos los LLM (open-source y propietarios) para extracción de datos estructurados.
    - Chunking Strategies: Implementa chunking (por tema, regex, a nivel de frase) para procesamiento de contenido dirigido.
    - Cosine Similarity: Encuentra chunks de contenido relevantes según consultas del usuario para extracción semántica.
    - CSS-Based Extraction: Extracción de datos rápida basada en esquemas usando XPath y selectores CSS.
    - Schema Definition: Define esquemas personalizados para extraer JSON estructurado de patrones repetitivos.
    
    **Integración del navegador**
    - Managed Browser: Usa navegadores propiedad del usuario con control total, evitando la detección de bots.
    - Remote Browser Control: Conéctate al Chrome Developer Tools Protocol para extracción remota a gran escala.
    - Browser Profiler: Crea y gestiona perfiles persistentes con estados de autenticación, cookies y ajustes guardados.
    - Session Management: Conserva estados del navegador y reutilízalos para crawling multipaso.
    - Proxy Support: Conéctate sin problemas a proxies con autenticación para acceso seguro.
    - Full Browser Control: Modifica headers, cookies, user agents y más para configuraciones de crawling a medida.
    - Multi-Browser Support: Compatible con Chromium, Firefox y WebKit.
    - Dynamic Viewport Adjustment: Ajusta automáticamente el viewport del navegador al contenido de la página, asegurando el renderizado y captura completos de todos los elementos.
    
    **Crawling y scraping**
    - Media Support: Extrae imágenes, audio, vídeos y formatos de imagen responsive como srcset y picture.
    - Dynamic Crawling: Ejecuta JS y espera async o sync para extracción de contenido dinámico.
    - Screenshots: Captura capturas de página durante el crawling para depuración o análisis.
    - Raw Data Crawling: Procesa directamente HTML en bruto (raw:) o archivos locales (file://).
    - Comprehensive Link Extraction: Extrae enlaces internos, externos y contenido de iframes incrustados.
    - Customizable Hooks: Define hooks en cada paso para personalizar el comportamiento del crawling.
    - Caching: Almacena datos en caché para mejorar la velocidad y evitar recuperaciones redundantes.
    - Metadata Extraction: Recupera metadatos estructurados de páginas web.
    - IFrame Content Extraction: Extracción fluida del contenido de iframes incrustados.
    - Lazy Load Handling: Espera a que las imágenes se carguen por completo, asegurando que no se pierda contenido por lazy loading.
    - Full-Page Scanning: Simula el desplazamiento para cargar y capturar todo el contenido dinámico, ideal para páginas de scroll infinito.
    
    **Despliegue**
    - Dockerized Setup: Imagen Docker optimizada con servidor FastAPI para un despliegue fácil.
    - Secure Authentication: Autenticación JWT integrada para seguridad de la API.
    - API Gateway: Despliegue con un clic con autenticación segura por token para flujos basados en API.
    - Scalable Architecture: Diseñado para producción a gran escala y rendimiento de servidor optimizado.
    - Cloud Deployment: Configuraciones listas para desplegar en las principales plataformas cloud.
    
    **Funciones adicionales**
    - Stealth Mode: Evita la detección de bots imitando usuarios reales.
    - Tag-Based Content Extraction: Refina el crawling según etiquetas, headers o metadatos personalizados.
    - Link Analysis: Extrae y analiza todos los enlaces para una exploración de datos detallada.
    - Error Handling: Gestión robusta de errores para una ejecución fluida.
    - CORS & Static Serving: Admite caché basada en sistema de archivos y peticiones cross-origin.
    - Clear Documentation: Guías simplificadas y actualizadas para onboarding y uso avanzado.
    - Community Recognition: Reconoce a colaboradores y pull requests por transparencia.
