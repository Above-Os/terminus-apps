metadata:
  title: Crawl4AI
  description: オープンソースの LLM フレンドリーな Web クローラー＆スクレイパー
spec:
  fullDescription: |
    Crawl4AI は、Web を RAG、エージェント、データパイプライン向けのクリーンで LLM 対応の Markdown に変換します。高速で制御可能、50k+ スターのコミュニティで実戦検証済みです。
    
    **機能**
    **Markdown 生成**
    - Clean Markdown: 正確な書式のクリーンで構造化された Markdown を生成。
    - Fit Markdown: ヒューリスティックに基づくフィルタリングでノイズと無関係な部分を除去し、AI 向け処理を実現。
    - Citations and References: ページリンクをクリーンな引用付きの番号付き参照リストに変換。
    - Custom Strategies: 特定のニーズに合わせた独自の Markdown 生成戦略を作成可能。
    - BM25 Algorithm: BM25 ベースのフィルタリングで核心情報を抽出し、無関係なコンテンツを除去。
    
    **構造化データ抽出**
    - LLM-Driven Extraction: すべての LLM（オープンソースおよびプロプライエタリ）で構造化データ抽出をサポート。
    - Chunking Strategies: トピックベース、正規表現、文レベルなどのチャンク化で対象コンテンツ処理。
    - Cosine Similarity: ユーザークエリに基づき関連コンテンツチャンクを見つけ、セマンティック抽出。
    - CSS-Based Extraction: XPath と CSS セレクターによる高速スキーマベースデータ抽出。
    - Schema Definition: 反復パターンから構造化 JSON を抽出するカスタムスキーマを定義。
    
    **ブラウザ統合**
    - Managed Browser: ユーザー所有のブラウザをフルコントロールで使用し、ボット検出を回避。
    - Remote Browser Control: Chrome Developer Tools Protocol に接続し、リモート大規模データ抽出。
    - Browser Profiler: 認証状態、Cookie、設定を保存した永続プロファイルを作成・管理。
    - Session Management: ブラウザ状態を保持し、多段階クローリングに再利用。
    - Proxy Support: 認証付きプロキシにシームレス接続し安全にアクセス。
    - Full Browser Control: ヘッダー、Cookie、ユーザーエージェントなどを変更し、クローリング設定を調整。
    - Multi-Browser Support: Chromium、Firefox、WebKit に対応。
    - Dynamic Viewport Adjustment: ページコンテンツに合わせてブラウザビューポートを自動調整し、全要素の完全なレンダリングとキャプチャを確保。
    
    **クローリング＆スクレイピング**
    - Media Support: 画像、音声、動画、および srcset や picture などのレスポンシブ画像形式を抽出。
    - Dynamic Crawling: JS を実行し、async または sync を待って動的コンテンツを抽出。
    - Screenshots: クローリング中にページスクリーンショットをキャプチャし、デバッグや分析に利用。
    - Raw Data Crawling: 生 HTML（raw:）やローカルファイル（file://）を直接処理。
    - Comprehensive Link Extraction: 内部・外部リンクおよび埋め込み iframe コンテンツを抽出。
    - Customizable Hooks: 各ステップでフックを定義し、クローリング動作をカスタマイズ。
    - Caching: データをキャッシュして速度向上と冗長フェッチを回避。
    - Metadata Extraction: Web ページから構造化メタデータを取得。
    - IFrame Content Extraction: 埋め込み iframe コンテンツからシームレスに抽出。
    - Lazy Load Handling: 画像の完全読み込みを待ち、遅延読み込みによる取りこぼしを防止。
    - Full-Page Scanning: スクロールをシミュレートして動的コンテンツをすべて読み込み・キャプチャ。無限スクロールページに最適。
    
    **デプロイ**
    - Dockerized Setup: FastAPI サーバー付き最適化 Docker イメージで簡単デプロイ。
    - Secure Authentication: API セキュリティ向けの組み込み JWT トークン認証。
    - API Gateway: API ベースのワークフロー向けにセキュアなトークン認証付きワンクリックデプロイ。
    - Scalable Architecture: 大規模本番向けに設計され、サーバー性能を最適化。
    - Cloud Deployment: 主要クラウドプラットフォーム向けのデプロイ準備済み構成。
    
    **追加機能**
    - Stealth Mode: 実ユーザーを模倣してボット検出を回避。
    - Tag-Based Content Extraction: カスタムタグ、ヘッダー、メタデータに基づきクローリングを精緻化。
    - Link Analysis: すべてのリンクを抽出・分析し、詳細なデータ探索。
    - Error Handling: 堅牢なエラー管理でシームレスな実行。
    - CORS & Static Serving: ファイルシステムベースのキャッシュとクロスオリジンリクエストをサポート。
    - Clear Documentation: オンボーディングと高度な利用向けの簡潔で更新されたガイド。
    - Community Recognition: 透明性のため貢献者とプルリクエストを認識。
