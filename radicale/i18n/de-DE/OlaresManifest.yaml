metadata:
  title: Radicale
  description: Freier und quelloffener CalDAV- und CardDAV-Server
spec:
  fullDescription: |
    Radicale ist ein kleiner, aber leistungsfähiger CalDAV- (Kalender, Aufgabenlisten) und CardDAV-Server (Kontakte)

    **Standard-Anmeldedaten**
    Sie können sich mit jedem Benutzernamen und Passwort anmelden, sollten jedoch so bald wie möglich einen Benutzernamen und ein Passwort festlegen.

    **Funktionen:**
    - Gibt Kalender und Kontaktlisten über CalDAV, CardDAV und HTTP frei.
    - Unterstützt Ereignisse, Aufgaben, Journaleinträge und Visitenkarten.
    - Funktioniert sofort und erfordert keine komplizierte Einrichtung oder Konfiguration.
    - Kann den Zugriff durch Authentifizierung beschränken.
    - Kann Verbindungen mit TLS absichern.
    - Funktioniert mit vielen CalDAV- und CardDAV-Clients.
    - Speichert alle Daten im Dateisystem in einer einfachen Ordnerstruktur.
    - Kann mit Plugins erweitert werden.
    - Ist freie Software unter der GPLv3-Lizenz.
  upgradeDescription: |
    v1.0.7 (Radicale 3.1.1 → 3.7.3)
    - Neu: Sammlungsfreigabe per Zuordnung oder Token, einschließlich Verwaltungs-API und WebUI-Erweiterung
    - Neu: Adressbuch als Geburtstagskalender freigeben
    - Neu: Serveroption `delay_on_error` und Protokollierungsoption `limit_content`
    - Neu: standardmäßig strengerer `Content-Security-Policy`-Header bei neuen Konfigurationen
    - Neu: `validate_user_value` / `validate_path_value` für sicherere Dateisysteme
    - Verbessert: WebUI-Refactoring, kleinere JS-Module, besseres Caching und bessere Fehlerbehandlung
    - Verbessert: Leistung von `path_to_filesystem()` und Vorabladen von Zugriffsrechten
    - Verbessert: `max_resource_size` bei Storage discover/get durchsetzen
    - Behoben: MOVE mit URL-codiertem Destination-Header
    - Behoben: Berechtigungsprüfungen für Freigabe/PROPFIND/PROPPATCH und Storage-Hook beim Löschen
    - Abhängigkeit: nicht mehr gepflegtes `passlib` durch `libpass >= 1.9.3` ersetzt, kompatibel mit bcrypt 5.x

    v1.0.6 (Radicale 3.1.x)
    - setuptools-Anforderung bei der Installation eines Wheels behoben
    - Tests: von `python setup.py test` zu tox gewechselt
    - Kleine Änderungen an Build-Systemkonfiguration und Tests
