metadata:
  title: Radicale
  description: Servidor CalDAV y CardDAV libre y de código abierto
spec:
  fullDescription: |
    Radicale es un servidor CalDAV (calendarios y listas de tareas) y CardDAV (contactos) pequeño pero potente

    **Credenciales predeterminadas**
    Puedes iniciar sesión con cualquier nombre de usuario y contraseña, pero configura un nombre de usuario y una contraseña lo antes posible.

    **Funciones:**
    - Comparte calendarios y listas de contactos mediante CalDAV, CardDAV y HTTP.
    - Admite eventos, tareas, entradas de diario y tarjetas de visita.
    - Funciona de inmediato, sin instalaciones ni configuraciones complicadas.
    - Puede limitar el acceso mediante autenticación.
    - Puede proteger las conexiones con TLS.
    - Funciona con numerosos clientes CalDAV y CardDAV.
    - Almacena todos los datos en el sistema de archivos con una estructura de carpetas sencilla.
    - Se puede ampliar mediante plugins.
    - Es software libre con licencia GPLv3.
  upgradeDescription: |
    v1.0.7 (Radicale 3.1.1 → 3.7.3)
    - Nuevo: uso compartido de colecciones mediante mapa o token, incluida la API de gestión y la extensión WebUI
    - Nuevo: compartir una libreta de direcciones como calendario de cumpleaños
    - Nuevo: opción de servidor `delay_on_error` y opción de registro `limit_content`
    - Nuevo: encabezado `Content-Security-Policy` más estricto de forma predeterminada en configuraciones nuevas
    - Nuevo: `validate_user_value` / `validate_path_value` para sistemas de archivos más seguros
    - Mejorado: refactorización de WebUI, módulos JS más pequeños, mejor caché y gestión de errores
    - Mejorado: rendimiento de `path_to_filesystem()` y precarga de permisos de acceso
    - Mejorado: aplicación de `max_resource_size` en discover/get del almacenamiento
    - Corregido: MOVE con encabezado Destination codificado para URL
    - Corregido: comprobaciones de permisos de uso compartido/PROPFIND/PROPPATCH y hook de almacenamiento al eliminar
    - Dependencia: se sustituye `passlib`, sin mantenimiento, por `libpass >= 1.9.3`, compatible con bcrypt 5.x

    v1.0.6 (Radicale 3.1.x)
    - Se corrige el requisito de setuptools al instalar un wheel
    - Pruebas: cambio de `python setup.py test` a tox
    - Pequeños cambios en la configuración del sistema de compilación y las pruebas
