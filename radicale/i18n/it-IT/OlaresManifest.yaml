metadata:
  title: Radicale
  description: Server CalDAV e CardDAV libero e open source
spec:
  fullDescription: |
    Radicale è un server CalDAV (calendari ed elenchi di attività) e CardDAV (contatti) piccolo ma potente

    **Credenziali predefinite**
    Puoi accedere con qualsiasi nome utente e password, ma imposta nome utente e password il prima possibile.

    **Funzionalità:**
    - Condivide calendari ed elenchi di contatti tramite CalDAV, CardDAV e HTTP.
    - Supporta eventi, attività, voci di diario e biglietti da visita.
    - Funziona subito, senza installazioni o configurazioni complicate.
    - Può limitare l'accesso tramite autenticazione.
    - Può proteggere le connessioni con TLS.
    - Funziona con molti client CalDAV e CardDAV.
    - Memorizza tutti i dati nel file system con una semplice struttura di cartelle.
    - Può essere esteso con plugin.
    - È software libero con licenza GPLv3.
  upgradeDescription: |
    v1.0.7 (Radicale 3.1.1 → 3.7.3)
    - Novità: condivisione delle raccolte tramite mappa o token, inclusa l'API di gestione e l'estensione WebUI
    - Novità: condivisione di una rubrica come calendario dei compleanni
    - Novità: opzione server `delay_on_error` e opzione di logging `limit_content`
    - Novità: header `Content-Security-Policy` più restrittivo per impostazione predefinita nelle nuove configurazioni
    - Novità: `validate_user_value` / `validate_path_value` per file system più sicuri
    - Migliorato: refactoring della WebUI, moduli JS più piccoli, cache e gestione degli errori migliori
    - Migliorato: prestazioni di `path_to_filesystem()` e precaricamento dei diritti di accesso
    - Migliorato: applicazione di `max_resource_size` durante discover/get dello storage
    - Corretto: MOVE con header Destination codificato per URL
    - Corretto: controlli dei permessi per condivisione/PROPFIND/PROPPATCH e hook dello storage all'eliminazione
    - Dipendenza: `passlib`, non più mantenuto, sostituito con `libpass >= 1.9.3`, compatibile con bcrypt 5.x

    v1.0.6 (Radicale 3.1.x)
    - Corretto il requisito setuptools durante l'installazione di un wheel
    - Test: passaggio da `python setup.py test` a tox
    - Piccole modifiche alla configurazione del sistema di build e ai test
