metadata:
  title: Radicale
  description: Serveur CalDAV et CardDAV libre et open source
spec:
  fullDescription: |
    Radicale est un serveur CalDAV (calendriers et listes de tâches) et CardDAV (contacts) petit mais puissant

    **Identifiants par défaut**
    Vous pouvez vous connecter avec n'importe quel nom d'utilisateur et mot de passe, mais veuillez en définir dès que possible.

    **Fonctionnalités :**
    - Partage les calendriers et listes de contacts via CalDAV, CardDAV et HTTP.
    - Prend en charge les événements, tâches, entrées de journal et cartes de visite.
    - Fonctionne immédiatement, sans installation ni configuration complexe.
    - Peut limiter l'accès par authentification.
    - Peut sécuriser les connexions avec TLS.
    - Fonctionne avec de nombreux clients CalDAV et CardDAV.
    - Stocke toutes les données dans le système de fichiers selon une structure de dossiers simple.
    - Peut être étendu avec des plugins.
    - Est un logiciel libre sous licence GPLv3.
  upgradeDescription: |
    v1.0.7 (Radicale 3.1.1 → 3.7.3)
    - Nouveau : partage de collections par mappage ou jeton, avec API de gestion et extension WebUI
    - Nouveau : partage d'un carnet d'adresses comme calendrier d'anniversaires
    - Nouveau : option serveur `delay_on_error` et option de journalisation `limit_content`
    - Nouveau : en-tête `Content-Security-Policy` plus strict par défaut pour les nouvelles configurations
    - Nouveau : `validate_user_value` / `validate_path_value` pour des systèmes de fichiers plus sûrs
    - Amélioration : refonte de la WebUI, modules JS plus petits, meilleure mise en cache et gestion des erreurs
    - Amélioration : performances de `path_to_filesystem()` et préchargement des droits d'accès
    - Amélioration : application de `max_resource_size` lors des opérations discover/get du stockage
    - Correction : MOVE avec en-tête Destination encodé pour URL
    - Correction : contrôles des autorisations de partage/PROPFIND/PROPPATCH et hook de stockage à la suppression
    - Dépendance : remplacement de `passlib`, non maintenu, par `libpass >= 1.9.3`, compatible avec bcrypt 5.x

    v1.0.6 (Radicale 3.1.x)
    - Correction de la dépendance setuptools lors de l'installation d'un wheel
    - Tests : remplacement de `python setup.py test` par tox
    - Petites modifications de la configuration du système de build et des tests
