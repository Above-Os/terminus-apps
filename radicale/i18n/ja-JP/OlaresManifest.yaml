metadata:
  title: Radicale
  description: 自由でオープンソースの CalDAV・CardDAV サーバー
spec:
  fullDescription: |
    Radicale は、小規模ながら強力な CalDAV（カレンダー、ToDo リスト）および CardDAV（連絡先）サーバーです

    **デフォルト認証情報**
    任意のユーザー名とパスワードでログインできますが、できるだけ早くユーザー名とパスワードを設定してください。

    **機能:**
    - CalDAV、CardDAV、HTTP を介してカレンダーと連絡先リストを共有。
    - イベント、ToDo、日記エントリ、名刺をサポート。
    - 複雑なセットアップや設定なしですぐに動作。
    - 認証によるアクセス制限。
    - TLS による接続の保護。
    - 多数の CalDAV・CardDAV クライアントに対応。
    - すべてのデータをシンプルなフォルダー構成でファイルシステムに保存。
    - プラグインによる拡張が可能。
    - GPLv3 ライセンスの自由ソフトウェア。
  upgradeDescription: |
    v1.0.7 (Radicale 3.1.1 → 3.7.3)
    - 新機能: マップまたはトークンによるコレクション共有（管理 API と WebUI 拡張を含む）
    - 新機能: アドレス帳を誕生日カレンダーとして共有
    - 新機能: サーバーオプション `delay_on_error` とログオプション `limit_content`
    - 新機能: 新規設定でより厳格な `Content-Security-Policy` ヘッダーをデフォルト化
    - 新機能: より安全なファイルシステム向けの `validate_user_value` / `validate_path_value`
    - 改善: WebUI のリファクタリング、JS モジュールの小型化、キャッシュとエラー処理の改善
    - 改善: `path_to_filesystem()` の性能とアクセス権の事前読み込み
    - 改善: ストレージの discover/get で `max_resource_size` を適用
    - 修正: URL エンコードされた Destination ヘッダーを伴う MOVE
    - 修正: 共有/PROPFIND/PROPPATCH の権限確認と削除時のストレージ hook
    - 依存関係: メンテナンスされていない `passlib` を bcrypt 5.x 対応の `libpass >= 1.9.3` に置換

    v1.0.6 (Radicale 3.1.x)
    - wheel インストール時の setuptools 要件を修正
    - テスト: `python setup.py test` から tox へ移行
    - ビルドシステム設定とテストの軽微な変更
