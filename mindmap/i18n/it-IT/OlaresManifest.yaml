metadata:
  title: SimpleMindMap
  description: Una libreria semplice e potente di mappe mentali per il Web
spec:
  fullDescription: |
    Simple mind map è una libreria semplice e potente di mappe mentali per il Web.

    **Funzionalità**
    - Architettura a plugin: oltre alle funzioni core, le altre sono fornite come plugin, uso on-demand, dimensione del pacchetto ridotta
    - Supporta diagrammi a struttura logica (sinistra, destra), mappe mentali, organigrammi, organigrammi a directory, timeline (orizzontale, verticale), diagrammi a lisca di pesce e altre strutture
    - Molti temi integrati, stili altamente personalizzabili, registrazione di nuovi temi
    - Il contenuto dei nodi supporta testo (normale, rich text), immagini, icone, collegamenti ipertestuali, note, etichette, riepiloghi, formule matematiche
    - I nodi supportano il trascinamento (drag and drop, regolazione libera), più forme; contenuto del nodo estendibile, personalizzazione completa con DDM
    - Supporta trascinamento e zoom del canvas
    - Supporta selezione multipla tramite trascinamento del mouse e Ctrl+clic sinistro
    - Esportazione in json, png, svg, pdf, markdown, xmind, txt; importazione da json, xmind, markdown
    - Scorciatoie, avanti/indietro, linee di associazione, cerca e sostituisci, minimappa, filigrana, barra di scorrimento, stile disegnato a mano, linee arcobaleno, segni e cornici
    - Configurazioni ricche per vari scenari e abitudini d'uso
    - Supporta l'editing collaborativo
    - Supporta la modalità presentazione
