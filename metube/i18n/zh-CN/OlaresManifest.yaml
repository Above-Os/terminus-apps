metadata:
  title: Metube
  description: 自托管的YouTube下载器
spec:
  upgradeDescription: |
    将 MeTube 升级至 2026.11.06。修复播放列表和频道下载的自定义文件名前缀，并在打开页面时聚焦 URL 输入框。

    发行说明：https://github.com/alexta69/MeTube/releases/tag/2026.11.06

  fullDescription: |
    一个基于 youtube-dl（使用 yt-dlp 分支）支持播放列表的网页图形界面，支持从 YouTube 及数十个其他网站下载视频。

    主要特性：
    支持多种视频画质选项
    支持仅下载音频
    支持批量下载
    下载队列管理
    支持 1000+ 个除 YouTube 以外的网站
    下载进度跟踪
    移动端友好界面
