metadata:
  title: Metube
  description: セルフホスト型 YouTube ダウンローダー
spec:
  upgradeDescription: |
    MeTube を 2026.11.06 に更新します。プレイリストとチャンネルのダウンロードで独自のファイル名接頭辞を保持し、ページ表示時に URL 入力欄へフォーカスします。

    リリースノート: https://github.com/alexta69/MeTube/releases/tag/2026.11.06

  fullDescription: |
    youtube-dl（yt-dlp フォークを使用）をベースにした、プレイリスト対応の Web グラフィカルユーザーインターフェースです。YouTube をはじめ、数十の Web サイトから動画をダウンロードできます。

    主な機能：
    複数の動画品質オプション
    音声のみのダウンロード
    一括ダウンロード
    ダウンロードキュー管理
    YouTube 以外の 1000 以上の Web サイトに対応
    ダウンロード進捗の追跡
    モバイル対応インターフェース
