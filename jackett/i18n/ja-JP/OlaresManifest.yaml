metadata:
  title: Jackett
  description: お気に入りのトレントトラッカー向け API サポート
spec:
  upgradeDescription: |
    ストレージ: 永続ストレージを `appCache` から `appData` へ移行。アップグレード後の初回起動時、宛先が空の場合 initContainer がレガシー `appCache` を `appData` にコピーします（マーカー: `.migration_from_appcache_done`）。旧 appCache データはロールバック用に残します。

    公式 `linuxserver/jackett` イメージ（amd64/arm64）で Jackett を v0.24.766 から v0.24.2166 に更新。

    レガシーな `sysVersion >= 1.12.3` の appCache パス分岐を削除。Olares の最低バージョンは現在 1.12.6 です。

    アップグレード後、管理者パスワードなしの外部アクセスに関するセキュリティバナーが表示される場合があります。Docker/Olares では想定どおりです（External Access は有効のままにしてください）。Jackett 設定で Admin Password を設定するかバナーを閉じれば問題ありません — Olares の入口はすでにログインが必要です。External Access を無効にすると Web UI に到達できなくなる可能性があります。
  fullDescription: |
    Jackett はプロキシサーバーとして動作します。アプリ（Sonarr、Radarr、SickRage、CouchPotato、Mylar3、Lidarr、DuckieTV、qBittorrent、Nefarious、NZBHydra2 など）からのクエリをトラッカーサイト固有の HTTP クエリに変換し、HTML または JSON レスポンスを解析して、要求元のソフトウェアに結果を返します。これにより、最近のアップロード（RSS のような）の取得や検索が可能になります。Jackett は維持されたインデクサースクレイピング／変換ロジックの単一リポジトリであり、他アプリの負担を軽減します。
