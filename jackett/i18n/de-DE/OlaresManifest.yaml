metadata:
  title: Jackett
  description: API-Unterstützung für deine Lieblings-Torrent-Tracker
spec:
  upgradeDescription: |
    Speicher: dauerhafte Daten von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopiert ein initContainer Legacy-`appCache` nach `appData`, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Alte appCache-Daten bleiben für Rollback erhalten.

    Jackett von v0.24.766 auf v0.24.2166 mit dem offiziellen Image `linuxserver/jackett` (amd64/arm64) aktualisiert.

    Legacy-Verzweigung für `sysVersion >= 1.12.3` appCache-Pfade entfernt; Olares-Minimum ist jetzt 1.12.6.

    Nach dem Upgrade kann Jackett einen Sicherheitshinweis zu externem Zugriff ohne Admin-Passwort anzeigen. Das ist unter Docker/Olares erwartet (External Access muss aktiviert bleiben). Setze ein Admin-Passwort in den Jackett-Einstellungen oder schließe den Hinweis — der Olares-Eingang erfordert bereits Login. Deaktiviere External Access nicht, sonst kann die Web-UI unerreichbar werden.
  fullDescription: |
    Jackett arbeitet als Proxy-Server: Es übersetzt Abfragen von Apps (Sonarr, Radarr, SickRage, CouchPotato, Mylar3, Lidarr, DuckieTV, qBittorrent, Nefarious, NZBHydra2 usw.) in tracker-spezifische HTTP-Abfragen, parst die HTML- oder JSON-Antwort und sendet die Ergebnisse an die anfragende Software zurück. So lassen sich aktuelle Uploads (wie RSS) abrufen und Suchen durchführen. Jackett ist ein zentrales Repository gepflegter Indexer-Scraping- und Übersetzungslogik — und entlastet andere Apps.
