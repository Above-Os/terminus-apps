metadata:
  title: Jackett
  description: Compatibilidad con API para tus trackers de torrents favoritos
spec:
  upgradeDescription: |
    Almacenamiento: el almacenamiento duradero se movió de `appCache` a `appData`. En el primer arranque tras la actualización, un initContainer copia el `appCache` heredado a `appData` cuando el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos de appCache se conservan para rollback.

    Actualización de Jackett de v0.24.766 a v0.24.2166 usando la imagen oficial `linuxserver/jackett` (amd64/arm64).

    Se elimina la ramificación heredada de rutas appCache para `sysVersion >= 1.12.3`; el mínimo de Olares es ahora 1.12.6.

    Tras la actualización, Jackett puede mostrar un aviso de seguridad sobre acceso externo sin contraseña de administrador. Es esperado en Docker/Olares (External Access debe permanecer habilitado). Establece una Admin Password en la configuración de Jackett o descarta el aviso — la entrada de Olares ya requiere inicio de sesión. No desactives External Access o la Web UI puede quedar inaccesible.
  fullDescription: |
    Jackett funciona como un servidor proxy: traduce consultas de aplicaciones (Sonarr, Radarr, SickRage, CouchPotato, Mylar3, Lidarr, DuckieTV, qBittorrent, Nefarious, NZBHydra2, etc.) en consultas HTTP específicas del sitio tracker, analiza la respuesta HTML o JSON y envía los resultados al software solicitante. Esto permite obtener subidas recientes (como RSS) y realizar búsquedas. Jackett es un único repositorio de lógica mantenida de scraping y traducción de indexadores, liberando a otras aplicaciones de esa carga.
