metadata:
  title: Jackett
  description: Prise en charge API pour vos trackers torrent préférés
spec:
  upgradeDescription: |
    Stockage : le stockage durable a été déplacé de `appCache` vers `appData`. Au premier démarrage après la mise à jour, un initContainer copie le `appCache` hérité vers `appData` lorsque la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données appCache sont conservées pour un éventuel rollback.

    Mise à jour de Jackett de v0.24.766 vers v0.24.2166 avec l'image officielle `linuxserver/jackett` (amd64/arm64).

    Suppression du branchement hérité des chemins appCache pour `sysVersion >= 1.12.3` ; le minimum Olares est désormais 1.12.6.

    Après la mise à jour, Jackett peut afficher une bannière de sécurité concernant l'accès externe sans mot de passe admin. C'est attendu sous Docker/Olares (External Access doit rester activé). Définissez un Admin Password dans les paramètres Jackett, ou ignorez la bannière — l'entrée Olares exige déjà une connexion. Ne désactivez pas External Access, sinon l'interface Web peut devenir inaccessible.
  fullDescription: |
    Jackett fonctionne comme un serveur proxy : il traduit les requêtes des applications (Sonarr, Radarr, SickRage, CouchPotato, Mylar3, Lidarr, DuckieTV, qBittorrent, Nefarious, NZBHydra2, etc.) en requêtes HTTP spécifiques au site tracker, analyse la réponse HTML ou JSON, puis renvoie les résultats au logiciel demandeur. Cela permet d'obtenir les uploads récents (comme le RSS) et d'effectuer des recherches. Jackett est un dépôt unique de logique maintenue de scraping et de traduction d'indexeurs — ce qui allège les autres applications.
