metadata:
  title: Jackett
  description: Supporto API per i tuoi tracker torrent preferiti
spec:
  upgradeDescription: |
    Storage: archiviazione persistente spostata da `appCache` a `appData`. Al primo avvio dopo l'aggiornamento, un initContainer copia il legacy `appCache` in `appData` quando la destinazione è vuota (marker: `.migration_from_appcache_done`). I vecchi dati appCache restano intatti per il rollback.

    Aggiornamento di Jackett da v0.24.766 a v0.24.2166 con l'immagine ufficiale `linuxserver/jackett` (amd64/arm64).

    Rimossa la ramificazione legacy dei percorsi appCache per `sysVersion >= 1.12.3`; il minimo Olares è ora 1.12.6.

    Dopo l'aggiornamento, Jackett può mostrare un avviso di sicurezza sull'accesso esterno senza password admin. È previsto in Docker/Olares (External Access deve restare abilitato). Imposta una Admin Password nelle impostazioni di Jackett o chiudi l'avviso — l'ingresso Olares richiede già il login. Non disabilitare External Access o la Web UI potrebbe diventare irraggiungibile.
  fullDescription: |
    Jackett funziona come server proxy: traduce le query dalle app (Sonarr, Radarr, SickRage, CouchPotato, Mylar3, Lidarr, DuckieTV, qBittorrent, Nefarious, NZBHydra2, ecc.) in query HTTP specifiche del sito tracker, analizza la risposta HTML o JSON e invia i risultati al software richiedente. Questo consente di ottenere upload recenti (come RSS) e di eseguire ricerche. Jackett è un unico repository di logica mantenuta di scraping e traduzione degli indexer, alleggerendo le altre app.
