olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  litellm: 1
  litellmingress: 1
metadata:
  name: litellm
  icon: https://app.cdn.olares.com/appstore/litellm/icon.png
  description: Call 100+ LLMs in OpenAI format
  appid: litellm
  title: LiteLLM
  version: "1.0.23"
  categories:
  - Utilities_v112
  - models
  tags:
  - gateway

spec:
  versionName: "1.106.2"
  featuredImage: https://app.cdn.olares.com/appstore/litellm/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/litellm/1.webp
    - https://app.cdn.olares.com/appstore/litellm/2.webp
    - https://app.cdn.olares.com/appstore/litellm/3.webp
  fullDescription: |
    LiteLLM is a Python SDK and Proxy Server (AI Gateway) to call 100+ LLM APIs in OpenAI (or native) format, with cost tracking, guardrails, loadbalancing and logging.

    **Features**
    - Unified API: Call 100+ LLM APIs (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) in OpenAI format
    - Cost Tracking: Track costs across all providers
    - Load Balancing: Distribute requests across multiple models/endpoints
    - Guardrails: Content filtering and safety checks
    - Logging & Observability: Comprehensive logging and monitoring
    - Rate Limiting: Built-in rate limiting and throttling
    - Proxy Server: Deploy as an AI Gateway/Proxy server
    - Multi-tenant: Support for multiple users and teams

  upgradeDescription: |
    Chart 1.0.23 upgrades LiteLLM Proxy from v1.103.0 to v1.106.2.
    Before upgrading, replace an empty or publicly known master key (including sk-1234) with a secure key. If stored credentials use the old key, also set LITELLM_MIGRATE_FROM_MASTER_KEY to that key; remove it after migration succeeds. Existing secure keys are preserved. Admin UI users must sign in again.
    Before Prisma migrations, an existing database is backed up to appData/backups/chart-1.0.23/litellm.dump. Startup stops if the backup fails. PostgreSQL and persistent paths are unchanged.
    Compatibility: stdio MCP servers are disabled by upstream; response caching now defaults to at most four messages; upstream MCP servers need their own credentials. Review the upstream release notes before upgrading customized deployments.
    Release notes: https://github.com/BerriAI/litellm/releases/tag/v1.106.2

  developer: BerriAI
  website: https://www.litellm.ai
  sourceCode: https://github.com/BerriAI/litellm
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - de-DE
    - es-ES
    - it-IT
    - fr-FR
    - ja-JP
  doc: https://docs.litellm.ai
  license:
    - text: MIT
      url: https://github.com/BerriAI/litellm/blob/main/LICENSE
  limitedCpu: 4.5
  requiredCpu: 200m
  requiredDisk: 1Gi
  limitedDisk: 500Gi
  limitedMemory: 4.5Gi
  requiredMemory: 576Mi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
entrances:
  - name: litellmui
    host: litellmingress
    port: 8080
    title: LiteLLM
    icon: https://app.cdn.olares.com/appstore/litellm/icon.png
    authLevel: private
    openMethod: window
  - name: litellmapi
    host: litellm-svc
    icon: https://app.cdn.olares.com/appstore/litellm/icon.png
    openMethod: window
    port: 80
    title: LiteLLM API
    authLevel: internal
    invisible: true
middleware:
  postgres:
    username: litellm
    password: litellm
    databases:
      - name: litellm
        distributed: false
envs:
  - envName: LITELLM_MASTER_KEY
    required: true
    type: password
    editable: true
    applyOnChange: true
    regex: '^sk-[A-Za-z0-9]+$'
    description: "Secure master API key (sk- followed by letters and numbers). Public defaults such as sk-1234 are refused. Preserve the existing key or use the migration field when rotating it."
  - envName: LITELLM_MIGRATE_FROM_MASTER_KEY
    required: false
    type: password
    editable: true
    applyOnChange: true
    description: "Previous master key, only when rotating a key used to encrypt stored credentials. Set together with the new master key; clear after successful migration."
  - envName: UI_USERNAME
    required: true
    type: string
    editable: true
    applyOnChange: true
    regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{1,}$'
    description: "Username for admin UI"
  - envName: UI_PASSWORD
    required: true
    type: password
    editable: true
    applyOnChange: true
    regex: '^[\w\-!@#$%^&*()+={}\[\]:,.?~]{6,}$'
    description: "Password for admin UI (must be at least 6 characters)"
  - envName: LITELLM_DROP_PARAMS
    required: false
    applyOnChange: true
    editable: true
    type: bool
    default: "true"
    description: "Drop the unsupported parameter instead of raising an exception"
  - envName: USE_SYSTEM_SMTP_SETTINGS
    required: false
    applyOnChange: true
    editable: true
    type: bool
    default: "true"
    description: "Use system SMTP settings (when enabled, SMTP envs are managed by system envs"
  - envName: SMTP_ENABLED
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_ENABLED
  - envName: SMTP_HOST
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_SERVER
  - envName: SMTP_PORT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PORT
  - envName: SMTP_SENDER_EMAIL
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_FROM_ADDRESS
  - envName: SMTP_TLS
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_USE_TLS
  - envName: SMTP_USERNAME
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_USERNAME
  - envName: SMTP_PASSWORD
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_SMTP_PASSWORD

