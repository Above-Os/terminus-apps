metadata:
  description: 以 OpenAI 格式调用 100+ LLM API
  title: LiteLLM
spec:
  fullDescription: |
    LiteLLM 是一个 Python SDK 和代理服务器（AI 网关），用于以 OpenAI（或原生）格式调用 100+ LLM API，具有成本跟踪、防护、负载均衡和日志记录功能。

    **主要功能：**
    - 统一 API：以 OpenAI 格式调用 100+ LLM API（OpenAI、Anthropic、Azure、Bedrock、VertexAI 等）
    - 成本跟踪：跟踪所有提供商的成本
    - 负载均衡：在多个模型/端点之间分发请求
    - 防护：内容过滤和安全检查
    - 日志和可观测性：全面的日志记录和监控
    - 速率限制：内置速率限制和节流
    - 代理服务器：部署为 AI 网关/代理服务器
    - 多租户：支持多个用户和团队

    管理员登录设置：先用 UI_USERNAME/UI_PASSWORD 登录，在 Internal Users 中创建独立的 Proxy Admin，通过邀请链接设置独立密码。使用无痕窗口确认新账号可正常登录后，在 Olares 应用环境变量设置中将 DISABLE_ENV_CREDENTIAL_LOGIN 设为 true。应用重启后，环境变量登录将关闭，对应红色提示消失。确认独立账号可用前请保持默认 false；如无法登录，可改回 false 恢复初始登录方式。master API key 仍然有效。

  upgradeDescription: |
    管理员登录设置：先用 UI_USERNAME/UI_PASSWORD 登录，在 Internal Users 中创建独立的 Proxy Admin，通过邀请链接设置独立密码。使用无痕窗口确认新账号可正常登录后，在 Olares 应用环境变量设置中将 DISABLE_ENV_CREDENTIAL_LOGIN 设为 true。应用重启后，环境变量登录将关闭，对应红色提示消失。确认独立账号可用前请保持默认 false；如无法登录，可改回 false 恢复初始登录方式。master API key 仍然有效。
    Chart 1.0.23 将 LiteLLM Proxy 从 v1.103.0 升级到 v1.106.2。
    升级前，请将空 master key 或已知公共密钥（包括 sk-1234）更换为安全密钥。若已有凭据使用旧密钥加密，还需将 LITELLM_MIGRATE_FROM_MASTER_KEY 设置为旧密钥，迁移成功后清空此项。已有安全密钥保持不变。管理界面用户需要重新登录。
    执行 Prisma 迁移前，已有数据库将备份至 appData/backups/chart-1.0.23/litellm.dump；备份失败会停止启动。PostgreSQL 配置及持久化路径保持不变。
    兼容性变化：上游默认禁用 stdio MCP；响应缓存默认仅处理不超过四条消息的请求；上游 MCP 服务器需要独立凭据。自定义部署升级前请阅读上游发行说明。
    发行说明：https://github.com/BerriAI/litellm/releases/tag/v1.106.2
