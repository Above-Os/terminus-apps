metadata:
  title: LiteLLM
  description: Llama a más de 100 LLM en formato OpenAI
spec:
  fullDescription: |
    LiteLLM es un SDK de Python y Proxy Server (AI Gateway) para llamar a más de 100 APIs de LLM en formato OpenAI (o nativo), con seguimiento de costes, guardrails, balanceo de carga y logging.
    
    **Funciones**
    - Unified API: Llama a más de 100 APIs de LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) en formato OpenAI
    - Cost Tracking: Rastrea costes en todos los proveedores
    - Load Balancing: Distribuye solicitudes entre múltiples modelos/endpoints
    - Guardrails: Filtrado de contenido y comprobaciones de seguridad
    - Logging & Observability: Logging y monitorización completos
    - Rate Limiting: Limitación de tasa y throttling integrados
    - Proxy Server: Despliega como AI Gateway/Proxy
    - Multi-tenant: Soporte para varios usuarios y equipos
    Acceso de administrador: inicia sesión con UI_USERNAME/UI_PASSWORD, crea un Proxy Admin independiente en Internal Users y establece su contraseña mediante un enlace de invitación. Comprueba el acceso en una ventana privada y activa DISABLE_ENV_CREDENTIAL_LOGIN en las variables de la aplicación de Olares. Tras reiniciar, se desactivan el acceso compartido y su aviso rojo. Mantén false hasta verificar la cuenta; vuelve a false para recuperar el acceso inicial. Las claves API maestras siguen funcionando.

  upgradeDescription: |
    Acceso de administrador: inicia sesión con UI_USERNAME/UI_PASSWORD, crea un Proxy Admin independiente en Internal Users y establece su contraseña mediante un enlace de invitación. Comprueba el acceso en una ventana privada y activa DISABLE_ENV_CREDENTIAL_LOGIN en las variables de la aplicación de Olares. Tras reiniciar, se desactivan el acceso compartido y su aviso rojo. Mantén false hasta verificar la cuenta; vuelve a false para recuperar el acceso inicial. Las claves API maestras siguen funcionando.
    Chart 1.0.23 actualiza LiteLLM Proxy de v1.103.0 a v1.106.2.
    Antes de actualizar, sustituya las claves maestras vacías o públicas conocidas (incluida sk-1234) por una clave segura. Si hay credenciales cifradas con la anterior, configure también LITELLM_MIGRATE_FROM_MASTER_KEY con ella y vacíelo tras migrar. Se conservan las claves seguras. Es necesario volver a iniciar sesión en la interfaz de administración.
    Antes de las migraciones Prisma, se guarda la base de datos existente en appData/backups/chart-1.0.23/litellm.dump. Si falla la copia, se detiene el inicio. PostgreSQL y las rutas persistentes no cambian.
    Compatibilidad: stdio MCP está desactivado por defecto; la caché admite por defecto hasta cuatro mensajes; los servidores MCP necesitan credenciales propias. Revise las notas oficiales para instalaciones personalizadas.
    Notas: https://github.com/BerriAI/litellm/releases/tag/v1.106.2
