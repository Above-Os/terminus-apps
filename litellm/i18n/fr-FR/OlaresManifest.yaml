metadata:
  title: LiteLLM
  description: Appelez plus de 100 LLM au format OpenAI
spec:
  fullDescription: |
    LiteLLM est un SDK Python et Proxy Server (AI Gateway) pour appeler plus de 100 API LLM au format OpenAI (ou natif), avec suivi des coûts, guardrails, répartition de charge et journalisation.
    
    **Fonctionnalités**
    - Unified API : Appelez plus de 100 API LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, etc.) au format OpenAI
    - Cost Tracking : Suivez les coûts sur tous les fournisseurs
    - Load Balancing : Répartissez les requêtes sur plusieurs modèles/endpoints
    - Guardrails : Filtrage de contenu et contrôles de sécurité
    - Logging & Observability : Journalisation et supervision complètes
    - Rate Limiting : Limitation de débit et throttling intégrés
    - Proxy Server : Déployez comme AI Gateway/Proxy
    - Multi-tenant : Prise en charge de plusieurs utilisateurs et équipes
  upgradeDescription: |
    Le chart 1.0.23 met à jour LiteLLM Proxy de v1.103.0 vers v1.106.2.
    Avant la mise à jour, remplacez toute clé maître vide ou publique connue (dont sk-1234) par une clé sûre. Si des identifiants sont chiffrés avec l’ancienne clé, définissez aussi LITELLM_MIGRATE_FROM_MASTER_KEY avec celle-ci, puis videz ce champ après migration. Les clés sûres sont conservées. Une nouvelle connexion à l’interface d’administration est nécessaire.
    Avant les migrations Prisma, la base existante est sauvegardée dans appData/backups/chart-1.0.23/litellm.dump. Un échec de sauvegarde bloque le démarrage. PostgreSQL et les chemins persistants restent inchangés.
    Compatibilité : stdio MCP est désactivé par défaut ; le cache traite par défaut au plus quatre messages ; les serveurs MCP nécessitent leurs propres identifiants. Consultez les notes amont pour les déploiements personnalisés.
    Notes : https://github.com/BerriAI/litellm/releases/tag/v1.106.2
