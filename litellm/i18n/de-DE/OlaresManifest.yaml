metadata:
  title: LiteLLM
  description: Über 100 LLMs im OpenAI-Format aufrufen
spec:
  fullDescription: |
    LiteLLM ist ein Python-SDK und Proxy-Server (AI Gateway), um über 100 LLM-APIs im OpenAI- (oder nativen) Format aufzurufen – mit Kostenverfolgung, Guardrails, Load Balancing und Logging.
    
    **Funktionen**
    - Unified API: Über 100 LLM-APIs (OpenAI, Anthropic, Azure, Bedrock, VertexAI usw.) im OpenAI-Format aufrufen
    - Cost Tracking: Kosten über alle Anbieter hinweg verfolgen
    - Load Balancing: Anfragen auf mehrere Modelle/Endpunkte verteilen
    - Guardrails: Inhaltsfilterung und Sicherheitsprüfungen
    - Logging & Observability: Umfassendes Logging und Monitoring
    - Rate Limiting: Integriertes Rate Limiting und Throttling
    - Proxy Server: Als AI Gateway/Proxy-Server bereitstellen
    - Multi-tenant: Unterstützung für mehrere Benutzer und Teams
  upgradeDescription: |
    Chart 1.0.23 aktualisiert LiteLLM Proxy von v1.103.0 auf v1.106.2.
    Vor dem Upgrade leere oder bekannte öffentliche Master Keys (einschließlich sk-1234) durch einen sicheren Schlüssel ersetzen. Bei damit verschlüsselten Zugangsdaten zusätzlich LITELLM_MIGRATE_FROM_MASTER_KEY auf den alten Schlüssel setzen und nach erfolgreicher Migration leeren. Sichere Schlüssel bleiben erhalten. Die Admin-UI erfordert eine erneute Anmeldung.
    Vor Prisma-Migrationen wird eine bestehende Datenbank nach appData/backups/chart-1.0.23/litellm.dump gesichert. Bei einem Sicherungsfehler stoppt der Start. PostgreSQL und persistente Pfade bleiben unverändert.
    Kompatibilität: stdio-MCP ist standardmäßig deaktiviert; der Antwortcache berücksichtigt standardmäßig höchstens vier Nachrichten; MCP-Server benötigen eigene Zugangsdaten. Angepasste Installationen müssen die Upstream-Hinweise beachten.
    Versionshinweise: https://github.com/BerriAI/litellm/releases/tag/v1.106.2
