metadata:
  title: LiteLLM
  description: Chiama oltre 100 LLM in formato OpenAI
spec:
  fullDescription: |
    LiteLLM è un SDK Python e Proxy Server (AI Gateway) per chiamare oltre 100 API LLM in formato OpenAI (o nativo), con cost tracking, guardrail, load balancing e logging.
    
    **Funzioni**
    - Unified API: Chiama oltre 100 API LLM (OpenAI, Anthropic, Azure, Bedrock, VertexAI, ecc.) in formato OpenAI
    - Cost Tracking: Traccia i costi su tutti i provider
    - Load Balancing: Distribuisci le richieste su più modelli/endpoint
    - Guardrails: Filtraggio dei contenuti e controlli di sicurezza
    - Logging & Observability: Logging e monitoraggio completi
    - Rate Limiting: Rate limiting e throttling integrati
    - Proxy Server: Distribuisci come AI Gateway/Proxy
    - Multi-tenant: Supporto per più utenti e team
  upgradeDescription: |
    Il chart 1.0.23 aggiorna LiteLLM Proxy da v1.103.0 a v1.106.2.
    Prima dell’aggiornamento, sostituire le master key vuote o pubbliche note (inclusa sk-1234) con una chiave sicura. Per credenziali cifrate con la precedente, impostare anche LITELLM_MIGRATE_FROM_MASTER_KEY e svuotarlo dopo la migrazione. Le chiavi sicure vengono conservate. È necessario accedere nuovamente all’interfaccia amministrativa.
    Prima delle migrazioni Prisma, il database esistente viene salvato in appData/backups/chart-1.0.23/litellm.dump. Se il backup fallisce, l’avvio si arresta. PostgreSQL e i percorsi persistenti non cambiano.
    Compatibilità: stdio MCP è disabilitato per impostazione predefinita; la cache considera al massimo quattro messaggi; i server MCP richiedono credenziali proprie. Consultare le note upstream per installazioni personalizzate.
    Note: https://github.com/BerriAI/litellm/releases/tag/v1.106.2
