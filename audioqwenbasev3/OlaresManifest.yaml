olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audioqwenbasev3
  icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
  description: Audio model base (Qwen ASR family — qwen-asr in-process vLLM engine, llm-init reverse-proxy). One instance = one model; capabilities via MODEL_SUPPORTS (stt / stt_stream / align). The engine image self-reports /v1/models + /metrics; llm-init downloads the model AND reverse-proxies the engine's OpenAI /v1/* directly.
  appid: audioqwenbasev3
  title: Audio Qwen Base V3
  version: '1.0.0'
  categories:
    - AI
# Internal shared API stub: in-cluster callers use http://sharedentrances-api.<ns>:80 + /v1, off the edge (no SSO).
sharedEntrances:
  - name: audioqwenbasev3api
    host: sharedentrances-api
    port: 0
    title: Audio Qwen Base V3 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
# Entrance -> llm-init (download-svc:8090): dashboard on "/", the engine's /v1/* reverse-proxied; internal auth.
entrances:
  - name: audioqwenbasev3
    port: 8090
    host: download-svc
    title: Audio Qwen Base V3
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audioqwenbasev3: 1
  llminit: 1
spec:
  versionName: '1.0.0'
  fullDescription: |
    **Audio model base — Qwen ASR family (`audioqwenbasev3`)**
    A generic *base* for the Qwen ASR family served on qwen-asr's in-process vLLM
    engine. One installed instance = one model. Which capabilities the instance
    exposes is chosen at install time via `MODEL_SUPPORTS` (multi-select):
    `stt` / `stt_stream` / `align`.

    **HOW IT WORKS**
    llm-init does BOTH jobs: (1) downloads the configured model into the shared HF
    cache, and (2) IS the OpenAI-compatible data plane — it reverse-proxies `/v1/*`
    (incl. WebSocket streaming) to the sibling audio engine at
    `http://audio-engine:8000` and serves its control plane / dashboard on `/`. The
    engine image (`beclab/audio-qwen`) bakes the wrapper + all deps and self-reports
    `/v1/models` (id + mode + supports + endpoints) and generic `/metrics` (gpu_*);
    llm-init proxies these unchanged. The engine container waits for llm-init's
    download sentinel rather than polling, avoiding the proxy<->engine deadlock.

    **Model storage (App Common)**
    Model files go to `appCommon/huggingface`, mounted at `/cache/hf/hub`. llm-init
    writes, the engine reads offline.

    **Clone form (5 fields)**
    - `MODEL_SOURCE` — `hf://<repo>` (llm-init download spec).
    - `MODEL_NAME` — model id advertised to clients (must match the engine's /v1/models id).
    - `MODEL_SUPPORTS` — multi-select of the capabilities this model exposes:
      `stt` (offline transcription), `stt_stream` (streaming ASR, WebSocket),
      `align` (forced alignment). Pick what the chosen model actually supports.
    - `AUDIO_REQUIRED_GPU_MEMORY` — e.g. Qwen3-ASR (1.7B) stt / stt_stream `12Gi`;
      Qwen3-ForcedAligner (0.6B) align `4Gi`.

    **Engine** — qwen-asr's in-process `Qwen3ASRModel.LLM` (vLLM backend), loaded
    ONCE. `stt` uses the native offline `asr.transcribe()`; `stt_stream` uses
    `asr.streaming_transcribe` over a WebSocket — both off the SAME load (no double
    GPU). `align` is a SEPARATE model (Qwen3-ForcedAligner), cloned as its own
    instance. GPU engines force `GPU_CORE_UTILIZATION_POLICY=disable` so they run
    full-speed under time-sliced vGPU.

    **Example clone sets**
    - STT + STT Stream (Qwen3-ASR): MODEL_SOURCE=hf://Qwen/Qwen3-ASR-1.7B
      MODEL_NAME=Qwen/Qwen3-ASR-1.7B  MODEL_SUPPORTS=stt,stt_stream  AUDIO_REQUIRED_GPU_MEMORY=12Gi
    - Align (Qwen3-ForcedAligner): MODEL_SOURCE=hf://Qwen/Qwen3-ForcedAligner-0.6B
      MODEL_NAME=Qwen/Qwen3-ForcedAligner-0.6B  MODEL_SUPPORTS=align  AUDIO_REQUIRED_GPU_MEMORY=4Gi

  upgradeDescription: |
    v1.0.0: initial Qwen ASR base. Engine + wrapper baked into one image
    (beclab/audio-qwen); the image self-reports /v1/models + /metrics and llm-init
    (ENGINE_KIND=audio) reverse-proxies it. Capabilities chosen at clone via
    MODEL_SUPPORTS (stt / stt_stream / align); stt + stt_stream share one model load.

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/llm-init
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/llm-init

  accelerator:
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: MODEL_NAME
    required: true
    type: string
    editable: true
    applyOnChange: true
  # MODEL_SUPPORTS: pick what the chosen model actually serves; the engine self-reports it on /v1/models.
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: true
    applyOnChange: true
    multiSelect: true
    splitter: ","
    options:
    - title: STT (offline transcription)
      value: stt
    - title: STT Stream (streaming ASR, WebSocket)
      value: stt_stream
    - title: Align (forced alignment)
      value: align
  - envName: AUDIO_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
