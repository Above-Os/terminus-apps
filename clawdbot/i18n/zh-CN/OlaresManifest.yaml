metadata:
  title: OpenClaw
  description: 支持多渠道收件箱的个人 AI 助手

spec:
  fullDescription: |
    **OpenClaw** 是一个可以在您自己的设备上运行的 _个人 AI 助手_。
    它会在您常用的聊天渠道中为您答疑解惑。支持在 macOS/iOS/Android 上语音对话，以及实时渲染您可控的 Canvas 画布。Gateway 只是管理和调度面板，真正的产品是您的 AI 助手本身。

    如果您想要一款本地化、响应迅速、始终在线的个人单用户助手，这就是最佳之选。

    **使用提示**
    网关重启
    - `openclaw gateway restart` 在容器化部署中无法正常工作。使用 `restart-gateway` 可终止正在运行的网关，加载最新配置，并在约 5 秒内重新上线。同一哨兵机制还会绕过崩溃后的 30 秒回退窗口。

    支持的渠道包括：
    WhatsApp、Telegram、Slack、Discord、Google Chat、Signal、iMessage、BlueBubbles、IRC、Microsoft Teams、Matrix、飞书、LINE、Mattermost、Nextcloud Talk、Nostr、群晖聊天、Tlon、Twitch、Zalo、Zalo Personal、微信、QQ、WebChat。

    **主要亮点**
    - **[本地优先 Gateway](https://docs.openclaw.ai/gateway)** —— 为会话、渠道、工具和事件等提供统一的控制面板
    - **[多渠道统一收件箱](https://docs.openclaw.ai/channels)** —— 集成 WhatsApp、Telegram、Slack、Discord、Google Chat、Signal、BlueBubbles（iMessage）、iMessage（旧版）、IRC、Microsoft Teams、Matrix、飞书、LINE、Mattermost、Nextcloud Talk、Nostr、群晖聊天、Tlon、Twitch、Zalo、Zalo Personal、微信、QQ、WebChat、macOS、iOS/Android
    - **[多智能体路由](https://docs.openclaw.ai/gateway/configuration)** —— 支持将不同渠道/账号/联系人分配到不同的智能体（独立会话和工作区）
    - **[语音唤醒](https://docs.openclaw.ai/nodes/voicewake) + [对话模式](https://docs.openclaw.ai/nodes/talk)** —— 支持在 macOS/iOS 上通过唤醒词激活、Android 端持续语音对话（支持 ElevenLabs 及系统 TTS 备用通道）
    - **[实时 Canvas 画布](https://docs.openclaw.ai/platforms/mac/canvas)** —— 智能体可驱动的可视化工作区，支持 [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui)
    - **[一流工具集](https://docs.openclaw.ai/tools)** —— 集成浏览器、画布、节点、定时任务（cron）、会话管理及 Discord/Slack 操作
    - **[配套应用](https://docs.openclaw.ai/platforms/macos)** —— 覆盖 macOS 菜单栏应用 和 iOS/Android [节点工具](https://docs.openclaw.ai/nodes)
    - **[引导配置](https://docs.openclaw.ai/start/wizard) + [技能体系](https://docs.openclaw.ai/tools/skills)** —— 提供完善的引导流程，内置/可管理/可扩展的技能体系

  upgradeDescription: |
    Chart 1.0.32：OpenClaw v2026.8.2，改用 beclab 镜像；环境变量改为 OPENCLAW_*，并兼容旧的 CLAWDBOT_*。升级时只清掉挡住 8.2 启动的 7.x workspace/session 残留，不必再手动跑 `openclaw doctor --fix`。
    https://github.com/openclaw/openclaw/releases/tag/v2026.8.2

    镜像：
    - 应用/网关：`beclab/openclaw-openclaw:2026.8.2`
    - Brew base：`beclab/harveyff-openclaw-brew-base:2026.9.2-cli`
    - 终端：`beclab/terminal:v0.0.14`

    环境变量（必读）：
    - v2026.8.2 只认 `OPENCLAW_*`。旧的 `CLAWDBOT_*` / `MOLTBOT_*` 会被上游忽略，并打 `OPENCLAW_LEGACY_ENV_VARS` 警告。
    - 本 chart 显式设置 `OPENCLAW_HOME`、`OPENCLAW_STATE_DIR`、`OPENCLAW_WORKSPACE_DIR`、`OPENCLAW_SYSTEMD_UNIT`。
    - 兼容层会把残留的 `CLAWDBOT_*` / `MOLTBOT_*` 复制到尚未设置的 `OPENCLAW_*`。Gateway 进程随后清掉旧前缀，避免启动警告。工作区容器还会把 `OPENCLAW_*` 回写为 `CLAWDBOT_*`，方便旧脚本继续用。
    - 请把 `~/.openclaw/.env` 或进程环境里的自定义 `CLAWDBOT_*` 改名为 `OPENCLAW_*`（例如 `CLAWDBOT_GATEWAY_TOKEN` → `OPENCLAW_GATEWAY_TOKEN`）。过渡期内两边都能用。

    从 2026.7.x 升级的破坏性变更：
    - OpenProse 插件和 `/prose` 已移除；若还在用 `.prose` 文件，按 https://docs.openclaw.ai/prose 迁移
    - 出厂 `codex/*`、`openai-codex/*` 现已对应 `openai/*`
    - 新默认：空闲/跨日不再自动 reset、dreaming 与 self-learning 默认开、同 agent 会话默认可互访、heartbeat 改打 owner DM

    反代 / Control UI：
    - 新装 `openclaw.json` 带 `gateway.trustedProxies`（集群 CNI + 回环）以及 `auth.trustedProxy.allowLoopback` 和 `userHeader: x-forwarded-user`。没有这些时，Envoy/nginx 会触发 `proxy_attribution_required`，界面表现为无法连接。
    - 只要写了 `auth.trustedProxy` 就必须带 `userHeader`，否则 Gateway 会以 78 退出。
    - Control UI 登录用的是 `openclaw.json` 里的 `gateway.auth.token`。新装默认 `controlUi.dangerouslyDisableDeviceAuth: true`，避免在 Olares 反代后还要配对（1.12.6 无法 exec `openclaw devices approve`）。已有配置不会被覆盖。
    - Ingress 会改写 `X-Forwarded-For`，让 Gateway 看到可信跳。

    本地 / llama.cpp 模型：
    - 新装默认 `agents.defaults.thinkingDefault: off`、`timeoutSeconds: 300`。Qwen 思考会吃光 token 预算（`reasoning-only retries exhausted` / “Agent couldn't generate a response”）。已有配置请自行把 thinking 关掉（必要时在模型上设 `compat.thinkingFormat: qwen-chat-template` 和 `enable_thinking: false`）。
    - 自定义 OpenAI 兼容的 llama.cpp 需要 `compat.toolSchemaProfile: "llamacpp"`，否则工具调用会 `400 failed to parse grammar`。schema 仍然过大时可把 `cron` 加进 deny。
    - `contextWindow` / `maxTokens` 应对齐引擎（例如 131072）。超长工具轮次再叠另一个 GPU 应用可能把引擎打挂（502/503 Loading model）。
    - Memory / 仪表盘会话标题仍走 OpenAI 形态的 utility 模型。没有 `OPENAI_API_KEY`（或本地 embedding/utility）会看到 `memory sync failed: No API key for provider "openai"`，聊天本身不受影响。

    说明：
    - 升级不覆盖已有 `openclaw.json`（init 只在文件不存在时拷默认配置）
    - 新装会跳过迁移 init。从 2026.7.x 升级时，init 只删掉或改名挡住 8.2 的 workspace-state / attestation / `sessions.json`。不会跑 `openclaw doctor --fix`（那条命令会关掉未使用的 skill，包括 Olares 技能包）。
    - 容器内请用 `restart-gateway`，不要用 `openclaw gateway restart`。`restart-gateway` 现已带 token 访问 `/readyz`（v2026.8.2 拒绝未鉴权探测）
    - Gateway 就绪探针改为 exec 访问本机 `/readyz` 并携带配置中的 token
