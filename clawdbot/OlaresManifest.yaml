  fullDescription: |
    **OpenClaw** is a _personal AI assistant_ you run on your own devices.
    It answers you on the channels you already use. It can speak and listen on macOS/iOS/Android, and can render a live Canvas you control. The Gateway is just the control plane — the product is the assistant.

    If you want a personal, single-user assistant that feels local, fast, and always-on, this is it.

    **Tips**
    Gateway Restart
    - `openclaw gateway restart` does NOT work in containerized deployments. Use `restart-gateway` to tear down the running gateway, pick up the latest config, and come back online within ~5 seconds. The same sentinel also short-circuits the post-crash 30-second backoff window.

    Supported channels include: 
    WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, iMessage, BlueBubbles, IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat.

    **Highlights**
    - **[Local-first Gateway](https://docs.openclaw.ai/gateway)** — single control plane for sessions, channels, tools, and events.
    - **[Multi-channel inbox](https://docs.openclaw.ai/channels)** — WhatsApp, Telegram, Slack, Discord, Google Chat, Signal, BlueBubbles (iMessage), iMessage (legacy), IRC, Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr, Synology Chat, Tlon, Twitch, Zalo, Zalo Personal, WeChat, QQ, WebChat, macOS, iOS/Android.
    - **[Multi-agent routing](https://docs.openclaw.ai/gateway/configuration)** — route inbound channels/accounts/peers to isolated agents (workspaces + per-agent sessions).
    - **[Voice Wake](https://docs.openclaw.ai/nodes/voicewake) + [Talk Mode](https://docs.openclaw.ai/nodes/talk)** — wake words on macOS/iOS and continuous voice on Android (ElevenLabs + system TTS fallback).
    - **[Live Canvas](https://docs.openclaw.ai/platforms/mac/canvas)** — agent-driven visual workspace with [A2UI](https://docs.openclaw.ai/platforms/mac/canvas#canvas-a2ui).
    - **[First-class tools](https://docs.openclaw.ai/tools)** — browser, canvas, nodes, cron, sessions, and Discord/Slack actions.
    - **[Companion apps](https://docs.openclaw.ai/platforms/macos)** — macOS menu bar app + iOS/Android [nodes](https://docs.openclaw.ai/nodes).
    - **[Onboarding](https://docs.openclaw.ai/start/wizard) + [skills](https://docs.openclaw.ai/tools/skills)** — onboarding-driven setup with bundled/managed/workspace skills.

  upgradeDescription: |
    Chart 1.0.31 — OpenClaw v2026.8.2 on the beclab image, with OPENCLAW_* env and leftover CLAWDBOT_* compatibility.
    https://github.com/openclaw/openclaw/releases/tag/v2026.8.2

    Images:
    - App/Gateway: `beclab/openclaw-openclaw:2026.8.2`
    - Brew base: `beclab/harveyff-openclaw-brew-base:2026.9.2-cli`
    - Terminal: `beclab/terminal:v0.0.14`

    Environment (must-read):
    - v2026.8.2 only reads `OPENCLAW_*`. Legacy `CLAWDBOT_*` / `MOLTBOT_*` names are ignored by upstream and would log `OPENCLAW_LEGACY_ENV_VARS`.
    - This chart sets `OPENCLAW_HOME`, `OPENCLAW_STATE_DIR`, `OPENCLAW_WORKSPACE_DIR`, and `OPENCLAW_SYSTEMD_UNIT`.
    - A gateway/workspace compat shim copies leftover `CLAWDBOT_*` / `MOLTBOT_*` into `OPENCLAW_*` when the new name is unset. The gateway then unsets the legacy names so the deprecation warning is silent. The workspace container also exports `CLAWDBOT_*` from `OPENCLAW_*` so leftover scripts still work.
    - Rename any custom `CLAWDBOT_*` in `~/.openclaw/.env` or process env to `OPENCLAW_*` (example: `CLAWDBOT_GATEWAY_TOKEN` → `OPENCLAW_GATEWAY_TOKEN`). The shim keeps both working during the transition.

    Breaking if you upgrade from 2026.7.x:
    - OpenProse plugin and `/prose` removed; stop the Gateway, run `openclaw doctor --fix`, then follow https://docs.openclaw.ai/prose
    - Shipped `codex/*` and `openai-codex/*` model refs migrate to `openai/*` via `openclaw doctor --fix`
    - New defaults: no idle/day session reset, dreaming and self-learning on, same-agent session visibility, heartbeat to owner DM

    Reverse-proxy / Control UI:
    - Fresh `openclaw.json` includes `gateway.trustedProxies` (cluster CNI + loopback) and `auth.trustedProxy.allowLoopback` plus `userHeader: x-forwarded-user`. Without these, Envoy/nginx can trigger `proxy_attribution_required` and the UI looks like it cannot connect.
    - `auth.trustedProxy` requires `userHeader` or Gateway exits 78.
    - Control UI login is the `gateway.auth.token` in `openclaw.json`. Fresh installs also set `controlUi.dangerouslyDisableDeviceAuth: true` so pairing is not required behind Olares (1.12.6 cannot exec `openclaw devices approve`). Existing configs keep their current pairing setting.
    - Ingress overwrites `X-Forwarded-For` so the gateway sees a trusted hop.

    Local / llama.cpp models:
    - Fresh installs default `agents.defaults.thinkingDefault: off` and `timeoutSeconds: 300`. Qwen thinking can consume the whole token budget (`reasoning-only retries exhausted` / "Agent couldn't generate a response"). Existing configs should set `thinkingDefault: off` (and `compat.thinkingFormat: qwen-chat-template` plus `enable_thinking: false` on the model if needed).
    - Custom OpenAI-compat llama.cpp providers need `compat.toolSchemaProfile: "llamacpp"` or tool calls fail with `400 failed to parse grammar`. Deny `cron` if that tool's schema is still too large.
    - Match `contextWindow` / `maxTokens` to the engine (for example 131072). Long tool turns plus another GPU app can OOM the engine (502/503 "Loading model").
    - Memory / dashboard session titles still call an OpenAI-shaped utility model. Without `OPENAI_API_KEY` (or a local embedding/utility provider) you will see `memory sync failed: No API key for provider "openai"` — chat still works.

    Notes:
    - Existing `openclaw.json` is preserved on upgrade (init copies the default only when the file is missing)
    - Fresh installs should boot without doctor; upgraded 7.x state may need `openclaw doctor --fix` with Gateway stopped
    - Use `restart-gateway` in containers, not `openclaw gateway restart`. `restart-gateway` now sends the gateway token to `/readyz` (v2026.8.2 rejects unauthenticated probes)
    - Gateway readiness exec-probes localhost `/readyz` with the configured token

