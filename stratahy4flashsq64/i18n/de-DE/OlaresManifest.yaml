metadata:
  title: Hy4-Flash SQ-64 (Strata)
  description: "Tencent Hy4-Flash SQ-64 für multimodalen Chat, Schlussfolgern und Tool-Aufrufe, lokal mit Strata"
spec:
  fullDescription: |
    Tencent Hy4-Flash ist ein multimodales Mixture-of-Experts-KI-Modell mit 220 Milliarden Parametern (12B aktive Parameter pro Token sowie 63,4B Parameter in vier Engram-Lookup-Modulen) zum Beantworten von Fragen, Verstehen von Bildern, Schlussfolgern und Aufrufen von Werkzeugen. Diese App führt Stratas native `.strata`-v1.0-Quantisierung `SQ-64` lokal über die dedizierte C++/CUDA-Engine `strata-hy4` aus.

    Strata ist eine Open-Source-Inferenz-Engine für große lokale KI-Modelle. Bei Hy4-Flash hält sie den dichten Trunk, den MLA-KV-Cache und die aktivsten Experten im GPU-Speicher, legt die übrigen Experten im Arbeitsspeicher ab und liest die 4-KiB-ausgerichtete `Engram-Q8`-Tabelle mit einem 900-MiB-RAM-Cache direkt von der NVMe-SSD. Model Console verbindet die Engine mit Olares.

    **Hauptfunktionen**

    - Textantworten aus Text- und Bildeingaben erzeugen, inklusive Denkmodus (`high` / `max`) und Tool-Aufrufen in kompatiblen Anwendungen.
    - Beschleunigte Generierung durch den eingebetteten 5-Layer-`DFly2`-Drafter (`0 B` zusätzlicher KV-Cache).
    - Mit Model Console das Modell herunterladen, den Bereitschaftsstatus prüfen und Engine-Einstellungen anpassen.
    - Kompatible Anwendungen über Olares Router oder die OpenAI-kompatible Chat-API verbinden.

    **Diese Ausgabe**

    Diese Ausgabe (`SQ-64`) unterstützt Text- und Bildeingaben (`Hy4-Flash-Vision.strata` läuft nativ in `strata-hy4`); Videoeingaben sind nicht aktiviert. Das voreingestellte Kontextlimit beträgt 131.072 Token bei einer gleichzeitigen Anfrage. Der verfügbare Kontext hängt vom Speicher und den Engine-Einstellungen ab.

    **Vor der ersten Nutzung**

    Beim ersten Start werden insgesamt 130,5 GB in drei `.strata`-v1.0-Dateien heruntergeladen (`Hy4-Flash-SQ-64.strata`, `Hy4-Flash-Engram-Q8.strata` und `Hy4-Flash-Vision.strata`). Da `.strata` v1.0 direkt ohne GGUF-Umpacken geladen wird, startet das Modell unmittelbar nach dem Download.

    Erforderlich sind eine AVX2-fähige CPU, schneller NVMe-Speicher und ein NVIDIA-Treiber ab Reihe R580. Diese Voreinstellung ist für Olares One (24 GiB VRAM und 96 GiB Host-RAM) ausgelegt. Prüfen Sie vor der Installation die angegebenen Ressourcenanforderungen.

    [Modelldokumentation](https://huggingface.co/tencent/Hy4-flash) · [Quantisiertes Modell](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Strata-Dokumentation](https://github.com/Niko1221/Strata)
