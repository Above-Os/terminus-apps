metadata:
  title: Hy4-Flash SQ-64 (Strata)
  description: "Tencent Hy4-Flash SQ-64 pour chat multimodal, raisonnement et appels d'outils, en local avec Strata"
spec:
  fullDescription: |
    Tencent Hy4-Flash est un modèle d'IA multimodal Mixture-of-Experts de 220 milliards de paramètres (12B actifs par token et 63,4B dans 4 modules de recherche Engram) conçu pour répondre aux questions, analyser des images, raisonner et appeler des outils. Cette application exécute localement l'édition quantifiée native `.strata` v1.0 `SQ-64` avec le moteur C++/CUDA dédié `strata-hy4`.

    Strata est un moteur d'inférence open source permettant d'exécuter de grands modèles d'IA localement. Pour Hy4-Flash, il conserve le tronc dense, le cache KV MLA et les experts les plus sollicités en mémoire GPU, garde les autres experts en mémoire vive (RAM) et pagine la table `Engram-Q8` alignée sur 4 KiB directement depuis le SSD NVMe avec un cache RAM de 900 MiB. Model Console relie le moteur à Olares.

    **Principales fonctionnalités**

    - Générer des réponses à partir de texte et d'images, avec mode de raisonnement (`high` / `max`) et appels d'outils dans les applications compatibles.
    - Accélérer la génération grâce au décodeur spéculatif intégré `DFly2` à 5 couches (`0 B` de cache KV supplémentaire).
    - Utiliser Model Console pour télécharger le modèle, suivre son état et ajuster les paramètres du moteur.
    - Connecter des applications compatibles via Olares Router ou l'API de chat compatible avec OpenAI.

    **Cette édition**

    Cette édition (`SQ-64`) prend en charge le texte et les images en entrée (`Hy4-Flash-Vision.strata` s'exécute nativement dans `strata-hy4`) ; l'entrée vidéo n'est pas activée. La limite de contexte par défaut est de 131 072 tokens, avec une seule requête traitée à la fois. Le contexte disponible dépend de la mémoire et des paramètres du moteur.

    **Avant la première utilisation**

    Au premier démarrage, 130,5 GB répartis en trois fichiers `.strata` v1.0 (`Hy4-Flash-SQ-64.strata`, `Hy4-Flash-Engram-Q8.strata` et `Hy4-Flash-Vision.strata`) sont téléchargés. Le format `.strata` v1.0 étant chargé directement sans conversion GGUF, le modèle démarre immédiatement après le téléchargement.

    Un processeur compatible AVX2, un stockage NVMe rapide et un pilote NVIDIA de la série R580 ou ultérieure sont requis. Ce préréglage est dimensionné pour Olares One (24 GiB de VRAM et 96 GiB de RAM hôte). Consultez les ressources requises avant l'installation.

    [Documentation du modèle](https://huggingface.co/tencent/Hy4-flash) · [Modèle quantifié](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Documentation de Strata](https://github.com/Niko1221/Strata)
