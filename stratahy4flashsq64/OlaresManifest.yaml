spec:
  onlyAdmin: true
  versionName: Tencent Hy4-Flash SQ-64
  fullDescription: |
    Tencent Hy4-Flash is a 220B-parameter Mixture-of-Experts multimodal AI model (12B active parameters per token, with 63.4B parameters in 4 Engram lookup modules) for answering questions, understanding images, reasoning, and calling tools. This app runs Strata's native `.strata` v1.0 `SQ-64` quantized edition locally using the dedicated `strata-hy4` C++/CUDA engine.

    Strata is an open-source inference engine for running large AI models locally. For Hy4-Flash, it keeps the dense trunk, MLA KV cache, and hottest experts in GPU memory, holds the remaining experts in system RAM, and pages the 4-KiB-aligned `Engram-Q8` lookup table directly from NVMe storage with a 900 MiB RAM cache. Model Console connects the engine to Olares.

    **Key features**

    - Generate text responses from text and image inputs, with thinking (`high` / `max` reasoning effort) and tool calling in compatible applications.
    - Accelerate generation with the embedded 5-layer `DFly2` speculative drafter (`0 B` additional KV cache).
    - Use Model Console to download the model, monitor readiness, and adjust engine settings.
    - Connect compatible applications through Olares Router or the OpenAI-compatible chat API.

    **This edition**

    This edition (`SQ-64`) supports text and image input (`Hy4-Flash-Vision.strata` runs natively inside `strata-hy4`); video input is not enabled. The default context limit is 131,072 tokens, with one request processed at a time. Available context depends on memory and engine settings.

    **Before first use**

    First startup downloads 130.5 GB across three `.strata` v1.0 files (`Hy4-Flash-SQ-64.strata`, `Hy4-Flash-Engram-Q8.strata`, and `Hy4-Flash-Vision.strata`). Because `.strata` v1.0 loads directly without GGUF repacking, startup proceeds straight to tokenizer extraction and model loading once the download completes.

    On amd64, an AVX2-capable CPU, fast NVMe storage, and an NVIDIA driver from the R580 series or newer are required. This preset is sized for Olares One (24 GiB VRAM and 96 GiB of host RAM). See the listed resource requirements before installing.

    [Model documentation](https://huggingface.co/tencent/Hy4-flash) · [Quantized model](https://huggingface.co/strata-engine/Hy4-Flash-Strata) · [Strata documentation](https://github.com/Niko1221/Strata)
  developer: Tencent (model), Niko1221 (Strata engine)
  website: https://huggingface.co/tencent/Hy4-flash
  sourceCode: https://github.com/Niko1221/Strata
  doc: https://github.com/Niko1221/Strata#readme
  submitter: Niko1221, Olares
  featuredImage: https://cdn.olares.com/images/2026/11/11145c7d662ed1adb457e6cb2c64d29a.png
  promoteImage:
  - https://cdn.olares.com/images/2026/11/11145c7d662ed1adb457e6cb2c64d29a.png
  - https://cdn.olares.com/images/2026/11/1ea008ed41225b16c41073798792fce1.png
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - it-IT
  - fr-FR
  - ja-JP
  license:
  - text: Tencent HY Community License (model)
    url: https://huggingface.co/tencent/Hy4-flash/blob/main/LICENSE
  - text: MIT (Strata engine)
    url: https://github.com/Niko1221/Strata/blob/main/LICENSE
  accelerator:
  - mode: nvidia
    limitedCpu: '20'
    requiredCpu: 1600m
    requiredDisk: 160Gi
    limitedDisk: 220Gi
    requiredMemory: 51Gi
    limitedMemory: 69Gi
    requiredGPUMemory: 23Gi
    limitedGPUMemory: 24Gi
  supportArch:
  - amd64
  runAsUser: true
permission:
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
  - name: olares
    version: '>=1.12.7-0'
    type: system
envs:
- envName: MODEL_SOURCE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hf://strata-engine/Hy4-Flash-Strata --include Hy4-Flash-SQ-64.strata,hf://strata-engine/Hy4-Flash-Strata --include Hy4-Flash-Engram-Q8.strata,hf://strata-engine/Hy4-Flash-Strata --include Hy4-Flash-Vision.strata
  description: Three native .strata v1.0 single-file sources sharing one HF snapshot (SQ-64 weights, Engram-Q8 NVMe shard, and Vision shard); extras finish before the main model handoff.
- envName: MODEL_NAME
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: hy4-flash-sq-64
- envName: MODEL_MODE
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: chat
- envName: MODEL_SUPPORTS
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: vision,thinking,tools
- envName: MODEL_REASONING_EFFORT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "high,max"
  description: "The reasoning_effort levels Tencent Hy4-Flash accepts (high, max; none/off disables thinking), published on the model card for clients."
- envName: MODEL_REASONING_EFFORT_DEFAULT
  required: false
  type: string
  editable: false
  applyOnChange: false
  default: "high"
  description: "The reasoning_effort level Hy4-Flash uses when a request does not specify one."
- envName: ENGINE_ARGS
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: --context 131072
  description: Strata setup.py / strata-hy4 options. Model/source/host/port/GPU/vision are managed by the chart. Default context is 131072 tokens with built-in Tree-8 DFly2 speculative decoding (--draft dfly2; pass --draft off to disable), lossless expert routing (--tail-skip 0; optionally add --tail-skip 12 for higher open-ended prose throughput), and automatic dynamic VRAM + cgroup RAM expert placement. Saving engine_args in Model Console relaunches setup and the server without re-downloading weights.
- envName: LOG_LEVEL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: info
- envName: HF_ENDPOINT
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
- envName: HF_TOKEN
  required: false
  applyOnChange: true
  valueFrom:
    envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
- envName: STRATA_CPU_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 1300m
- envName: STRATA_MEMORY_REQUEST
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 50Gi
- envName: STRATA_CPU_LIMIT
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: '12'
  description: CPU limit for the Strata engine, a whole number of cores from 1 to 19. The default is 12. The app ceiling is 20 cores, including llm-init. Saving this relaunches the engine.
  regex: '^(?:[1-9]|1[0-9])$'
- envName: STRATA_MEMORY_LIMIT
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 64Gi
- envName: STRATA_REQUIRED_GPU_MEMORY
  required: true
  type: string
  editable: false
  applyOnChange: false
  default: 23Gi
