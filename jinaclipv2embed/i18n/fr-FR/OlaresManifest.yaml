metadata:
  title: Jina CLIP v2
  description: "Des plongements multilingues de texte et d’images pour la recherche sémantique"

spec:
  upgradeDescription: |
    v1.0.16: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    Jina CLIP v2 convertit le texte et les images en vecteurs numériques dans un espace commun. Les applications compatibles peuvent utiliser ces vecteurs pour trouver des images à partir de descriptions textuelles ou comparer le sens de passages de texte.

    Le modèle prend en charge 89 langues pour le texte en entrée. Cette application fournit ses capacités de plongement de texte et d'images aux applications Olares compatibles.

    Les poids du modèle sont sous licence CC BY-NC 4.0, pour un usage non commercial. Contactez Jina AI pour obtenir une licence commerciale.
