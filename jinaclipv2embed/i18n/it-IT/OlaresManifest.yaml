metadata:
  title: Jina CLIP v2
  description: "Embedding multilingue di testo e immagini per la ricerca semantica"

spec:
  upgradeDescription: |
    v1.0.16: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    Jina CLIP v2 converte testo e immagini in vettori numerici in uno spazio comune. Le applicazioni compatibili possono usare questi vettori per trovare immagini a partire da descrizioni testuali o confrontare il significato di passaggi di testo.

    Il modello supporta input testuali in 89 lingue. Questa app fornisce le sue capacità di embedding di testo e immagini alle applicazioni Olares compatibili.

    I pesi del modello sono concessi in licenza CC BY-NC 4.0 per uso non commerciale. Per una licenza commerciale, contattare Jina AI.
