metadata:
  title: Jina CLIP v2
  description: "Multilingual text and image embeddings for semantic search"

spec:
  upgradeDescription: |
    v1.0.16: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.
  fullDescription: |
    Jina CLIP v2 converts text and images into numerical vectors in a shared space. Compatible applications can use these vectors to find images from text descriptions or compare the meaning of text passages.

    The model supports 89 languages for text input. This app provides its text and image embedding capabilities to compatible Olares applications.

    Model weights are licensed for non-commercial use under CC BY-NC 4.0. Contact Jina AI for commercial licensing.
