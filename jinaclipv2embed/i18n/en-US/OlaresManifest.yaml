metadata:
  title: Jina Clip V2 Embed
  description: "Jina CLIP v2 split text + image embeddings via IREmbeddingServer (OpenVINO / ONNX)"

spec:
  fullDescription: |
    **Jina CLIP v2 split** dual-tower embedding service powered by EmbeddingServer. Serves OpenAI-compatible `/v1/embeddings` (text and image) and `/v1/models` on port 8080.

    **Accelerator modes**
    | Olares mode | Image | Backend | `EMBED_DEVICE` |
    |-------------|-------|---------|----------------|
    | `intel` | `embed-server:v0.1.2-ov-intel` | OpenVINO IR | `igpu` |
    | `cpu` | `embed-server:v0.1.2-onnx-cpu` | ONNX CPU EP | `cpu` |
    | `nvidia` | `embed-server:v0.1.2-onnx-cuda12/13` | ONNX CUDA EP | `cuda` |
    | `nvidia-gb10` | `embed-server:v0.1.2-onnx-cuda13-gb10-arm64` | ONNX CUDA EP | `cuda` |

    **Model download**
    On first start, llm-init downloads from the unified Hugging Face repo into App Common cache:
    - [beclab/jina-clip-v2-split](https://huggingface.co/beclab/jina-clip-v2-split)
    - `intel` mode: `openvino/` subdirectory only (~9GB)
    - All other modes: `onnx/` subdirectory only

    **Device mounts**
    - `intel`: `/dev/dri`, `/sys/class/drm` for Intel iGPU stack
    - `nvidia` / `nvidia-gb10`: GPU injection via Olares scheduler

    **Stack**
    - **embed-server** (`beclab/embed-server:v0.1.2`, internal port 8080): Rust CLIP inference.
    - **llm-init** (`beclab/llm-init:v1.3.5`, `ENGINE_KIND=clipembed`, port 8090): download, progress UI, and OpenAI API proxy.
