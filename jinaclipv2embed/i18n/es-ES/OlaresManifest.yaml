metadata:
  title: Jina CLIP v2
  description: "Embeddings multilingües de texto e imágenes para la búsqueda semántica"

spec:
  upgradeDescription: |
    v1.0.16: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    Jina CLIP v2 convierte texto e imágenes en vectores numéricos dentro de un espacio compartido. Las aplicaciones compatibles pueden usar estos vectores para encontrar imágenes a partir de descripciones textuales o comparar el significado de pasajes de texto.

    El modelo admite texto de entrada en 89 idiomas. Esta aplicación ofrece sus funciones de embedding de texto e imágenes a las aplicaciones Olares compatibles.

    Los pesos del modelo se distribuyen bajo CC BY-NC 4.0 para uso no comercial. Contacta con Jina AI para obtener una licencia comercial.
