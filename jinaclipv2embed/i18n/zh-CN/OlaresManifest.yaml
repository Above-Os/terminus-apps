metadata:
  title: Jina CLIP v2
  description: "用于语义搜索的多语言文本与图像嵌入模型"

spec:
  upgradeDescription: |
    v1.0.16: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    Jina CLIP v2 将文本和图像转换为同一向量空间中的数值向量。兼容应用可以利用这些向量，根据文字描述查找图像，或比较文本段落的语义。

    该模型支持 89 种语言的文本输入。本应用为兼容的 Olares 应用提供文本和图像嵌入能力。

    模型权重依据 CC BY-NC 4.0 许可，仅限非商业使用。商业授权请联系 Jina AI。
