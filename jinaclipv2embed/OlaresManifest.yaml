olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: jinaclipv2embed
  icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
  description: "Jina CLIP v2 split text + image embeddings via IREmbeddingServer (OpenVINO / ONNX)"
  appid: jinaclipv2embed
  title: Jina Clip V2 Embed
  version: '1.0.4'
  categories:
    - AI
sharedEntrances:
  - name: jinaclipv2embed
    host: sharedentrances-api
    port: 0
    title: Jina Clip V2 Embed API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
entrances:
  - name: clipclient
    port: 8090
    host: download-svc
    title: Jina Clip V2 Embed
    icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
    openMethod: window
    authLevel: internal
  - name: clipapi
    port: 8090
    host: download-svc
    title: Jina Clip V2 Embed API
    icon: https://app.cdn.olares.com/appstore/jinaclipv2/icon.png
    invisible: true
    openMethod: window
    authLevel: internal
#   jinaclipv2embed — embed-server engine Deployment (== appid / Release.Name)
#   llminit           — llm-init (ENGINE_KIND=clipembed): download + API proxy
workloadReplicas:
  jinaclipv2embed: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'jina-clip-v2'
  fullDescription: |
    **Jina CLIP v2 split** dual-tower embedding service powered by IREmbeddingServer. Serves OpenAI-compatible `/v1/embeddings` (text and image) and `/v1/models` on port 8080.

    **Accelerator modes**
    | Olares mode | Image | Backend | `EMBED_DEVICE` |
    |-------------|-------|---------|----------------|
    | `intel` | `embed-server:v0.1.2-ov-intel` | OpenVINO IR | `igpu` |
    | `cpu` | `embed-server:v0.1.2-onnx-cpu` | ONNX CPU EP | `cpu` |
    | `nvidia` | `embed-server:v0.1.2-onnx-cuda12/13` | ONNX CUDA EP | `cuda` |
    | `nvidia-gb10` | `embed-server:v0.1.2-onnx-cuda13-gb10-arm64` | ONNX CUDA EP | `cuda` |

    **Model download**
    On first start, llm-init downloads from the unified Hugging Face repo into App Common cache (`appCommon/huggingface` → `/cache/hf/hub`):
    - [beclab/jina-clip-v2-split](https://huggingface.co/beclab/jina-clip-v2-split)
    - `intel` mode: `openvino/` subdirectory only (~9GB)
    - All other modes: `onnx/` subdirectory only

    **Device mounts**
    - `intel`: `/dev/dri`, `/sys/class/drm` for Intel iGPU stack
    - `nvidia` / `nvidia-gb10`: GPU injection via Olares scheduler

    **Stack**
    - **embed-server** (`beclab/embed-server:v0.1.2`, port 8080): Rust CLIP inference (internal; reached as `http://clipembed:8080`).
    - **llm-init** (`beclab/llm-init:v1.3.5`, `ENGINE_KIND=clipembed`, port 8090): model download, progress UI, and OpenAI API proxy (`/v1/embeddings`, `/v1/models`).
      Use **clipclient** for download UI; **clipapi** / shared entrance hit llm-init proxy on port 8090.

  developer: Jina AI
  website: https://jina.ai/
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: Apache-2.0
      url: https://huggingface.co/beclab/jina-clip-v2-split

  accelerator:
    # Olares upload validates Σ(all container limits) ≤ accelerator limits:
    #   embed-server 4 CPU / 6Gi (+ llm-init 1 CPU / 1Gi) → need limitedCpu≥5, limitedMemory≥7Gi
    #   nvidia-gb10 embed-server 14Gi → Σ memory 15Gi, limitedMemory 16Gi
    # Profile: /var/wangzhong/local-dev/llminit/clipembed_resource_reports/Jina-CLIP-v2-资源画像.md
    - mode: cpu
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 5Gi
      limitedDisk: 50Gi
    - mode: nvidia
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 10Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 10240Mi
      limitedGPUMemory: 12288Mi
    - mode: nvidia-gb10
      # No requiredGPUMemory/limitedGPUMemory on nvidia-gb10 (Spark unified memory).
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 12Gi
      limitedMemory: 16Gi
      requiredDisk: 10Gi
      limitedDisk: 50Gi
    - mode: intel
      requiredCpu: 400m
      limitedCpu: "5"
      requiredMemory: 4Gi
      limitedMemory: 8Gi
      requiredDisk: 5Gi
      limitedDisk: 50Gi

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  allowMultipleInstall: true
  LLMGatewaySupported: true
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "embedding"
    options:
    - title: Embedding
      value: embedding
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
