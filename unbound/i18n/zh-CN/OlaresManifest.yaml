metadata:
  title: Unbound
  description: 自己从根服务器解析域名的 DNS 解析器，不依赖公共解析服务
spec:
  fullDescription: |
    Unbound 解析域名时，自己向根服务器发问，逐级找到对该域名有权威的服务器，而不是把
    问题交给某个公共 DNS 服务。返回的结果由它在你自己的机器上校验 DNSSEC 签名，而不是
    采信别的解析器"我验过了"的说法。

    与 AdGuard Home 这类 DNS 过滤器搭配时，它取代的正是过滤器原本要转发过去的公共上游。

    **能得到什么**
    - 不再由单一服务商掌握你的完整查询历史
    - DNSSEC 由本机验证，而不是采信上游的验证结果
    - 本机所有应用共用一份解析缓存

    **安装前需要了解**
    - 递归查询发往根、TLD 和权威服务器时是明文 DNS。DNSSEC 保证的是真实性与完整性，
      不提供加密或匿名。这些查询你的 ISP 可以观察到；而通过 DoT/DoH 访问公共解析器则不会。
    - 首次解析陌生域名比大型公共解析器慢。
    - 部分 ISP 会封锁或劫持出站 53 端口，这会导致递归完全不可用。此时 Unbound 可退回
      DoT（853 端口）转发，但它没有 DoH 客户端——如果网络只放行 443，Unbound 完全无法
      工作，只能改用 AdGuard Home 配 DoH 上游。
    - 整台 Olares 共用这一个解析器及其缓存。这正是它快的原因，但缓存内容对任何能查询
      它或读取其缓存的人可见：可以看出这台机器上有人解析过某个域名，但看不出是谁。
      DNS 解析器是共享的基础设施，和它前面的过滤器一样。

    Unbound 没有图形界面，通过内置终端编辑 `unbound.conf` 进行配置；配置文件保存在持久化
    存储上，重启和升级后保留。
