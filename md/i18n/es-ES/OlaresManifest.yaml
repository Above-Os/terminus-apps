metadata:
  title: WeChat Markdown Editor
  description: "Un editor Markdown minimalista para WeChat"
spec:
  fullDescription: |
    WeChat Markdown Editor es un editor Markdown minimalista para WeChat: admite sintaxis Markdown, paleta de colores, carga múltiple de imágenes, descarga de documentos con un clic, estilos CSS personalizados, restablecimiento con un clic y otras funciones

    **Funciones**
    - Admite toda la sintaxis básica de Markdown y fórmulas matemáticas
    - Ofrece renderizado de diagramas Mermaid y bloques de advertencia GFM
    - Temas ricos de resaltado para bloques de código para mejorar la legibilidad
    - Permite colores de tema y estilos CSS personalizados, personalización flexible de la visualización
    - Proporciona carga múltiple de imágenes y configuración personalizable del alojamiento de imágenes
    - Funciones convenientes de importación y exportación de archivos para mejorar la eficiencia
    - Gestión local de contenido integrada con guardado automático de borradores
