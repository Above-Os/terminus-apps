apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: filmcraft
  appid: filmcraft
  title: FilmCraft
  description: Premiere-style video editor that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/filmcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.filmcraft.png
  version: 0.1.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/FilmCraft/
spec:
  versionName: "0.8.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    FilmCraft is an open-source, Premiere-comparable video editor written
    in Rust. This app serves its WebAssembly build: editing, playback and
    export run entirely in your browser, and media never leaves your device.

    Import media with the browser file picker or drag and drop; Save and
    Export download files. Save your project before closing or reloading
    the page.

    ## Agent access (MCP)
    The app also runs FilmCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/FilmCraft (seen by the server as
    /data/files). To keep editing an agent's project or export in the
    browser, download it from Files and open it with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/filmcraft
  sourceCode: https://github.com/beclab/filmcraft
  license:
