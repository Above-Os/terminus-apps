metadata:
  title: FilmCraft
  description: 在浏览器中运行的 Premiere 风格视频编辑器
spec:
  fullDescription: |
    ## 概述
    FilmCraft 是一款用 Rust 编写的开源视频编辑器，目标是对标 Premiere。
    本应用提供它的 WebAssembly 版本：剪辑、播放和导出都在你的浏览器里完成，
    素材不会离开你的设备。

    用浏览器的文件选择框或拖放导入素材，保存和导出会下载文件。
    关闭或刷新页面前请先保存项目。

    ## Agent 接入（MCP）
    本应用还以 Streamable HTTP 方式运行 FilmCraft 的无界面引擎，作为 MCP 服务。
    它的入口不显示在桌面上，可以在设置里找到，只能从局域网或 LarePass VPN 访问。
    Agent 只能读写 Home/FilmCraft 目录（服务端路径为 /data/files）。
    想在浏览器里继续编辑 agent 生成的项目或导出结果，请从 Files 下载，
    再用浏览器的文件选择框打开。

    ## 要求
    - 支持 WebGPU 或 WebGL2 的浏览器
    - 架构：amd64、arm64
