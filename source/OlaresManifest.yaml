  fullDescription: |
    Market Source lets you use your own GitHub repository as an app source.

    #### Add a custom source to Market

    After installing Market Source, add it to the Market application:

    1. Open **Market** in Olares and go to **My Olares → Settings**.
    2. Click **Add source**.
    3. In the Market Source application's **Market Source API** Entrance, copy the value of **Endpoint** and enter it as the source URL.
    4. If the source needs to be accessed from outside the cluster, change the **Authentication level** of the **Market Source API** Entrance to **Public** before adding it.

    The **Market Source API** Entrance is used as the custom source URL. The **Market Source GitBot** Entrance is used separately for receiving GitHub Webhook events.

    #### Repository setup

    Create a GitHub repository to store your app source files. The repository can be public or private.

    After installing Market Source, open the **Market Source Admin** entrance and complete **Setup**. Configure the code-hosting provider, repository URL, branch, access token, and webhook signing secret there. These values are no longer requested during installation.

    For GitHub, use a fine-grained Personal Access Token with access to the repository and these permissions:

    - **Contents: Read-only**
    - **Pull requests: Read and write**

    The repository URL must be the complete HTTPS Git URL in this format:

    `https://github.com/<account>/<repository>.git`

    Example:

    `https://github.com/example-org/app-source.git`

    Do not enter the repository's web page URL without the `.git` suffix. The token is required even for a public repository because GitBot performs authenticated GitHub API operations.

    Keep the token private and do not commit it to the repository.

    #### GitHub Webhook

    To let GitHub send pull request events to GitBot:

    1. In Olares Desktop, open **Settings → Applications**, find **Market Source**, open **Entrances**, find **Market Source GitBot**, and change its **Authentication level** to **Public**.
    2. Copy the **Market Source GitBot** Entrance URL.
    3. In your GitHub repository, open **Settings → Webhooks → Add webhook** and paste the Entrance URL into **Payload URL**.
    4. Set **Content type** to `application/json`.
    5. Enter the webhook signing secret configured in **Market Source Admin → Setup** in GitHub's **Secret** field.
    6. Select the required events, including **Pull requests**, and enable **Active**.

    The webhook signing secret is different from the access token. Keep both private and do not commit them to the repository.
