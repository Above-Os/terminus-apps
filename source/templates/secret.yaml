{{- $secretName := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := randAlphaNum 64 -}}
{{- if and $existing $existing.data (index $existing.data "INTERNAL_API_TOKEN") -}}
{{- $token = index $existing.data "INTERNAL_API_TOKEN" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: source
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  INTERNAL_API_TOKEN: {{ $token | quote }}
