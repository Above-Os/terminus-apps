apiVersion: apps/v1
kind: Deployment
metadata:
  name: source
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: source
spec:
  replicas: {{ .Values.workloads.sourceadmin.replicaCount }}
  selector:
    matchLabels:
      app: source
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: source
    spec:
      serviceAccountName: default
      containers:
        - name: admin
          image: aboveos/appstore-adminv2:v2.1.11
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: appstore-adminv2-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SOURCE_ID
              value: "market.source"
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.databases.source }}
            - name: APP_STORE_SERVER
              value: http://source-server-svc:8081
            - name: APP_STORE_SERVER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-secrets"
                  key: INTERNAL_API_TOKEN
          ports:
            - containerPort: 4003
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: admin-frontend
          image: aboveos/appstore-adminv2-frontend:v2.1.11
          imagePullPolicy: IfNotPresent
          env:
            - name: ADMINV2_API_UPSTREAM
              value: http://127.0.0.1:4003
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: source
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: source
spec:
  type: ClusterIP
  selector:
    app: source
  ports:
    - name: http
      port: 4003
      targetPort: 4003
      protocol: TCP
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
