{{- $sourceDomainENV := split "," .Values.domain.source -}}
{{- $sourceDomain := index $sourceDomainENV "_0" -}}
{{- $topDomain := regexReplaceAll ".*?([^.]+\\.[^.]+)$" $sourceDomain "$1" -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appstore-adminv2-config
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: source
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  AUTH_MODE: olares_header
  LLDAP_SYNC_ENABLED: "false"
  BOOTSTRAP_ADMIN_EMAIL: "{{ .Values.bfl.username }}@{{ $topDomain }}"
  TRUSTED_PROXIES: "none"
