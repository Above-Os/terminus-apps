metadata:
  title: qBittorrent
  description: 無料の BitTorrent ダウンローダー
spec:
  fullDescription: |
    qBittorrent は定評のあるオープンソース BitTorrent クライアントです。フットプリントは軽く、必要な機能はすべて備えます。高度な libtorrent-rasterbar ライブラリを使用し、高いダウンロード／アップロード速度と BitTorrent プロトコル最新機能への優れた対応を実現します。

    **機能**
    - 洗練された µTorrent 風ユーザーインタフェース
    - 広告なし
    - よく統合され拡張可能な検索エンジン
      - 多数の Torrent 検索サイトでの同時検索
      - カテゴリ別検索リクエスト（例：Books、Music、Software）
    - 高度なダウンロードフィルタ（正規表現含む）付き RSS フィード対応
    - 多数の BitTorrent 拡張に対応：
      - Magnet リンク
      - Distributed hash table（DHT）、peer exchange protocol（PEX）、local peer discovery（LSD）
      - プライベート torrent
      - 暗号化接続
      - その他多数…
    - AJAX 製 Web ユーザーインタフェースによるリモート制御
      - 通常の GUI とほぼ同一
    - シーケンシャルダウンロード（順番どおりにダウンロード）
    - torrent・トラッカー・ピアの高度な制御
      - torrent のキューイングと優先度付け
      - torrent コンテンツの選択と優先度付け
    - 帯域スケジューラ
    - torrent 作成ツール
    - IP フィルタリング（eMule & PeerGuardian 形式互換）
    - IPv6 準拠
    - UPnP / NAT-PMP ポート転送対応
    - 全プラットフォームで利用可能：Windows、Linux、macOS、FreeBSD、OS/2
    - 約 70 言語に対応
  upgradeDescription: |
    qBittorrent を 5.3.0 に更新します。MatchAll 共有制限、WebUI の情報ハッシュ検索とファイルパスのコピーを追加します。API クライアントは search/downloadTorrent と rss/setFeedRefreshInterval に POST を使用する必要があります。

    リリースノート: https://github.com/qbittorrent/qBittorrent/releases/tag/release-5.3.0
