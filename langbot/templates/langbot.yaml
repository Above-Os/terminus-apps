apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: langbot
  name: langbot
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.langbot.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: langbot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: langbot
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - |
              for d in /app/data /app/data/.cache /app/data/.cache/uv /app/data/metadata /app/data/logs /app/data/labels /app/plugins; do
                mkdir -p "$d" && chown 1000:1000 "$d"
              done
          securityContext:
            runAsUser: 0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-plugins
              mountPath: /app/plugins
      containers:
        - image: rockchin/langbot:v4.10.10
          imagePullPolicy: IfNotPresent
          name: langbot
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 5300
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Asia/Shanghai
            - name: DISPLAY
              value: ':0'
            - name: HOME
              value: /app/data
            - name: UV_CACHE_DIR
              value: /app/data/.cache/uv
            - name: XDG_CACHE_HOME
              value: /app/data/.cache
            - name: TMPDIR
              value: /app/temp
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: app-plugins
              mountPath: /app/plugins
            - name: app-data
              mountPath: /app/data
            - name: app-temp
              mountPath: /app/temp
      volumes:
        - name: app-temp
          emptyDir: {}
        - name: app-data
          hostPath:
            type: DirectoryOrCreate
            {{- if .Values.sysVersion }}
              {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appData }}/app-data'
              {{- else }}
            path: '{{ .Values.userspace.appData }}/langbot/app-data'
              {{- end }}
            {{- else }}
            path: '{{ .Values.userspace.appData }}/langbot/app-data'
            {{- end }}
        - name: app-plugins
          hostPath:
            type: DirectoryOrCreate
            {{- if .Values.sysVersion }}
              {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appData }}/app-plugins'
              {{- else }}
            path: '{{ .Values.userspace.appData }}/langbot/app-plugins'
              {{- end }}
            {{- else }}
            path: '{{ .Values.userspace.appData }}/langbot/app-plugins'
            {{- end }}
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: langbot-svc
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: langbot
spec:
  ports:
    - name: 'http'
      port: 5300
      targetPort: 5300
  selector:
    io.kompose.service: langbot
