metadata:
  title: LangBot
  description: エージェンティックな IM ボット構築向けの本番級プラットフォーム
spec:
  fullDescription: |
    **LangBot とは？**
    LangBot は、AI 搭載のインスタントメッセージングボットを構築するための**オープンソースの本番級プラットフォーム**です。Large Language Models（LLM）をあらゆるチャットプラットフォームに接続し、会話・タスク実行・既存ワークフロー連携ができるインテリジェントエージェントを作成できます。

    **主な機能**

    - **AI 会話＆エージェント** — マルチターン対話、ツール呼び出し、マルチモーダル対応、ストリーミング出力。組み込み RAG（ナレッジベース）と [Dify](https://dify.ai)、[Coze](https://coze.com)、[n8n](https://n8n.io)、[Langflow](https://langflow.org) への深い統合。
    - **ユニバーサル IM プラットフォーム対応** — Discord、Telegram、Slack、LINE、QQ、WeChat、WeCom、Lark、DingTalk、KOOK を単一コードベースで。
    - **本番対応** — アクセス制御、レート制限、センシティブワードフィルタ、包括的モニタリング、例外処理。企業でも信頼されています。
    - **プラグインエコシステム** — 数百のプラグイン、イベント駆動アーキテクチャ、コンポーネント拡張、[MCP プロトコル](https://modelcontextprotocol.io/) 対応。
    - **Web 管理パネル** — 直感的なブラウザ UI でボットを設定・管理・監視。YAML 編集は不要。
    - **マルチパイプラインアーキテクチャ** — シナリオごとに異なるボットを運用し、包括的なモニタリングと例外処理を提供。

  upgradeDescription: |
    上流リリース：[LangBot 4.10.10](https://github.com/langbot-app/LangBot/releases/tag/v4.10.10)

    **変更点**

    - 新規アカウントの Workspace 準備と初回起動がより安定します。
    - ネイティブ Ollama ツール呼び出しは LiteLLM の `ollama_chat` プロバイダーを使います。

    **修正**

    - Lark の重複ストリーミング返信を停止します。
    - DingTalk カードレイアウト、WeCom メディア ID、任意トークンなしの QQ Official Bot 設定を修正します。
    - 空の assistant フレームの後も返信が保持されます。
    - アダプター読み込み失敗時はボット記録をロールバックします。
    - 監視セッションとメッセージがページ分割されます。
