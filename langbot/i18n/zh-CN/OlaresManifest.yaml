metadata:
  title: LangBot
  description: 生产级 AI 即时通信机器人开发平台

spec:
  fullDescription: |
    **什么是 LangBot？**
    LangBot 是一个**开源的生产级平台**，用于构建 AI 驱动的即时通信机器人。它将大语言模型（LLM）连接到各种聊天平台，帮助你创建能够对话、执行任务、并集成到现有工作流程中的智能 Agent。

    **Key Capabilities**
    - **AI 对话与 Agent** — 多轮对话、工具调用、多模态、流式输出。自带 RAG（知识库），深度集成 [Dify](https://dify.ai)、[Coze](https://coze.com)、[n8n](https://n8n.io)、[Langflow](https://langflow.org) 等 LLMOps 平台。
    - **全平台支持** — 一套代码，覆盖 QQ、微信、企业微信、飞书、钉钉、Discord、Telegram、Slack、LINE、KOOK 等平台。
    - **生产就绪** — 访问控制、限速、敏感词过滤、全面监控与异常处理，已被多家企业采用。
    - **插件生态** — 数百个插件，跨进程的事件驱动架构，组件扩展，适配 [MCP 协议](https://modelcontextprotocol.io/)。
    - **Web 管理面板** — 通过浏览器直观地配置、管理和监控机器人，无需手动编辑配置文件。
    - **多流水线架构** — 不同机器人用于不同场景，具备全面的监控和异常处理能力。

  upgradeDescription: |
    上游发布：[LangBot 4.10.10](https://github.com/langbot-app/LangBot/releases/tag/v4.10.10)

    **主要更新**

    - 新账号工作区开通与首次启动更可靠。
    - 原生 Ollama 工具调用使用 LiteLLM 的 `ollama_chat` 提供商。

    **修复**

    - 已停止飞书重复的流式回复。
    - 已修正钉钉卡片布局、企微媒体 ID，以及缺少可选 token 的 QQ 官方机器人配置。
    - 空 assistant 帧之后仍会保留回复。
    - 适配器加载失败会回滚机器人记录。
    - 监控会话与消息支持分页。
