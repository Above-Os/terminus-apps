metadata:
  title: LangBot
  description: Plataforma de nivel producción para crear bots de mensajería agenticos
spec:
  fullDescription: |
    **¿Qué es LangBot?**
    LangBot es una **plataforma de código abierto de nivel producción** para crear bots de mensajería instantánea impulsados por IA. Conecta Large Language Models (LLMs) a cualquier plataforma de chat, permitiéndote crear agentes inteligentes que conversan, ejecutan tareas e integran con tus flujos de trabajo existentes.

    **Capacidades clave**

    - **Conversaciones y agentes de IA** — Diálogos multiturno, tool calling, soporte multimodal, salida en streaming. RAG integrado (base de conocimiento) con integración profunda en [Dify](https://dify.ai), [Coze](https://coze.com), [n8n](https://n8n.io), [Langflow](https://langflow.org).
    - **Soporte universal de plataformas IM** — Un solo código para Discord, Telegram, Slack, LINE, QQ, WeChat, WeCom, Lark, DingTalk, KOOK.
    - **Listo para producción** — Control de acceso, limitación de tasa, filtrado de palabras sensibles, monitorización integral y manejo de excepciones. De confianza en empresas.
    - **Ecosistema de plugins** — Cientos de plugins, arquitectura orientada a eventos, extensiones de componentes y soporte del [protocolo MCP](https://modelcontextprotocol.io/).
    - **Panel de gestión web** — Configura, gestiona y monitoriza tus bots mediante una interfaz intuitiva en el navegador. Sin editar YAML.
    - **Arquitectura multi-pipeline** — Diferentes bots para distintos escenarios, con monitorización integral y manejo de excepciones.

  upgradeDescription: |
    Versión upstream: [LangBot 4.10.10](https://github.com/langbot-app/LangBot/releases/tag/v4.10.10)

    **Novedades**

    - El aprovisionamiento del Workspace y el primer arranque de cuentas nuevas son más fiables.
    - La llamada nativa a herramientas Ollama usa el proveedor LiteLLM `ollama_chat`.

    **Correcciones**

    - Se detienen las respuestas de streaming duplicadas de Lark.
    - Se corrigen el diseño de tarjetas de DingTalk, los ID de medios de WeCom y las configuraciones de QQ Official Bot sin un token opcional.
    - Las respuestas se conservan tras marcos assistant vacíos.
    - Una carga fallida del adaptador revierte el registro del bot.
    - Las sesiones y mensajes de supervisión se paginan.
