metadata:
  title: LangBot
  description: Production-grade platform for building agentic IM bots
spec:
  fullDescription: |
    **What is LangBot?**
    LangBot is an **open-source, production-grade platform** for building AI-powered instant messaging bots. It connects Large Language Models (LLMs) to any chat platform, enabling you to create intelligent agents that can converse, execute tasks, and integrate with your existing workflows.

    **Key Capabilities**

    - **AI Conversations & Agents** — Multi-turn dialogues, tool calling, multi-modal support, streaming output. Built-in RAG (knowledge base) with deep integration to [Dify](https://dify.ai), [Coze](https://coze.com), [n8n](https://n8n.io), [Langflow](https://langflow.org).
    - **Universal IM Platform Support** — One codebase for Discord, Telegram, Slack, LINE, QQ, WeChat, WeCom, Lark, DingTalk, KOOK.
    - **Production-Ready** — Access control, rate limiting, sensitive word filtering, comprehensive monitoring, and exception handling. Trusted by enterprises.
    - **Plugin Ecosystem** — Hundreds of plugins, event-driven architecture, component extensions, and [MCP protocol](https://modelcontextprotocol.io/) support.
    - **Web Management Panel** — Configure, manage, and monitor your bots through an intuitive browser interface. No YAML editing required.
    - **Multi-Pipeline Architecture** — Different bots for different scenarios, with comprehensive monitoring and exception handling.

  upgradeDescription: |
    Upstream release: [LangBot 4.10.10](https://github.com/langbot-app/LangBot/releases/tag/v4.10.10)

    **What's changed**

    - New-account Workspace provisioning and first launch are more reliable.
    - Native Ollama tool calling uses LiteLLM’s `ollama_chat` provider.

    **Fixes**

    - Duplicate Lark streaming replies are stopped.
    - DingTalk card layout, WeCom media IDs, and QQ Official Bot configs without an optional token are corrected.
    - Replies are kept after empty assistant frames.
    - Failed adapter loads roll back the bot record.
    - Monitoring sessions and messages paginate.
