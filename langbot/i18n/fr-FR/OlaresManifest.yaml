metadata:
  title: LangBot
  description: Plateforme de niveau production pour créer des bots IM agentiques
spec:
  fullDescription: |
    **Qu'est-ce que LangBot ?**
    LangBot est une **plateforme open source de niveau production** pour créer des bots de messagerie instantanée alimentés par l'IA. Elle connecte des Large Language Models (LLM) à n'importe quelle plateforme de chat, vous permettant de créer des agents intelligents qui conversent, exécutent des tâches et s'intègrent à vos workflows existants.

    **Capacités clés**

    - **Conversations et agents IA** — Dialogues multi-tours, tool calling, support multimodal, sortie en streaming. RAG intégré (base de connaissances) avec intégration profonde à [Dify](https://dify.ai), [Coze](https://coze.com), [n8n](https://n8n.io), [Langflow](https://langflow.org).
    - **Support universel des plateformes IM** — Une seule base de code pour Discord, Telegram, Slack, LINE, QQ, WeChat, WeCom, Lark, DingTalk, KOOK.
    - **Prêt pour la production** — Contrôle d'accès, limitation de débit, filtrage des mots sensibles, monitoring complet et gestion des exceptions. Approuvé par les entreprises.
    - **Écosystème de plugins** — Des centaines de plugins, architecture événementielle, extensions de composants et support du [protocole MCP](https://modelcontextprotocol.io/).
    - **Panneau de gestion web** — Configurez, gérez et surveillez vos bots via une interface navigateur intuitive. Aucune édition YAML requise.
    - **Architecture multi-pipeline** — Différents bots pour différents scénarios, avec monitoring complet et gestion des exceptions.
