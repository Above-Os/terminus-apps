metadata:
  title: LangBot
  description: Piattaforma di livello produzione per creare bot IM agentici
spec:
  fullDescription: |
    **Cos'è LangBot?**
    LangBot è una **piattaforma open-source di livello produzione** per creare bot di messaggistica istantanea basati su IA. Collega Large Language Models (LLM) a qualsiasi piattaforma di chat, consentendoti di creare agenti intelligenti che conversano, eseguono attività e si integrano con i tuoi flussi di lavoro esistenti.

    **Capacità principali**

    - **Conversazioni e agenti IA** — Dialoghi multi-turno, tool calling, supporto multimodale, output in streaming. RAG integrato (knowledge base) con integrazione profonda in [Dify](https://dify.ai), [Coze](https://coze.com), [n8n](https://n8n.io), [Langflow](https://langflow.org).
    - **Supporto universale delle piattaforme IM** — Un'unica codebase per Discord, Telegram, Slack, LINE, QQ, WeChat, WeCom, Lark, DingTalk, KOOK.
    - **Pronto per la produzione** — Controllo accessi, rate limiting, filtro parole sensibili, monitoraggio completo e gestione delle eccezioni. Affidabile per le aziende.
    - **Ecosistema di plugin** — Centinaia di plugin, architettura event-driven, estensioni di componenti e supporto del [protocollo MCP](https://modelcontextprotocol.io/).
    - **Pannello di gestione web** — Configura, gestisci e monitora i bot tramite un'interfaccia browser intuitiva. Nessuna modifica YAML richiesta.
    - **Architettura multi-pipeline** — Bot diversi per scenari diversi, con monitoraggio completo e gestione delle eccezioni.

  upgradeDescription: |
    Release upstream: [LangBot 4.10.10](https://github.com/langbot-app/LangBot/releases/tag/v4.10.10)

    **Novità**

    - Il provisioning dello Workspace e il primo avvio dei nuovi account sono più affidabili.
    - La chiamata nativa degli strumenti Ollama usa il provider LiteLLM `ollama_chat`.

    **Correzioni**

    - Le risposte streaming duplicate di Lark vengono interrotte.
    - Layout delle card DingTalk, ID media WeCom e configurazioni QQ Official Bot senza token opzionale sono corretti.
    - Le risposte restano dopo frame assistant vuoti.
    - Un caricamento adapter non riuscito ripristina il record del bot.
    - Sessioni e messaggi di monitoraggio sono paginati.
