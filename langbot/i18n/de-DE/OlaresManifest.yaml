metadata:
  title: LangBot
  description: Produktionsreife Plattform zum Erstellen agentischer IM-Bots
spec:
  fullDescription: |
    **Was ist LangBot?**
    LangBot ist eine **quelloffene, produktionsreife Plattform** zum Erstellen KI-gestützter Instant-Messaging-Bots. Sie verbindet Large Language Models (LLMs) mit jeder Chat-Plattform und ermöglicht intelligente Agenten, die konversieren, Aufgaben ausführen und sich in bestehende Workflows integrieren.

    **Kernfunktionen**

    - **KI-Gespräche & Agenten** — Mehrturn-Dialoge, Tool Calling, multimodale Unterstützung, Streaming-Ausgabe. Eingebautes RAG (Wissensdatenbank) mit tiefer Integration in [Dify](https://dify.ai), [Coze](https://coze.com), [n8n](https://n8n.io), [Langflow](https://langflow.org).
    - **Universelle IM-Plattformunterstützung** — Eine Codebasis für Discord, Telegram, Slack, LINE, QQ, WeChat, WeCom, Lark, DingTalk, KOOK.
    - **Produktionsbereit** — Zugriffskontrolle, Ratenbegrenzung, Filterung sensibler Wörter, umfassendes Monitoring und Ausnahmebehandlung. Von Unternehmen vertrauenswürdig.
    - **Plugin-Ökosystem** — Hunderte Plugins, ereignisgesteuerte Architektur, Komponentenerweiterungen und Unterstützung des [MCP-Protokolls](https://modelcontextprotocol.io/).
    - **Web-Verwaltungspanel** — Bots über eine intuitive Browseroberfläche konfigurieren, verwalten und überwachen. Keine YAML-Bearbeitung nötig.
    - **Multi-Pipeline-Architektur** — Unterschiedliche Bots für unterschiedliche Szenarien, mit umfassendem Monitoring und Ausnahmebehandlung.
