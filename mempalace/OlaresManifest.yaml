olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  mempalace: 1
  mempalaceingress: 1
  terminal: 1
metadata:
  name: mempalace
  icon: https://app.cdn.olares.com/appstore/mempalace/icon.png
  description: A local memory app for keeping conversation text and finding it by meaning
  appid: mempalace
  title: MemPalace
  version: '0.0.10'
  categories:
  - Utilities_v112
  - Developer Tools
  - AI
  - agents
  tags:
  - memory
  
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '3.3.6'
  fullDescription: |
    MemPalace stores conversation history as the original wording and finds matching passages by meaning, not only by exact words. It does not summarize or rewrite what you stored. The index is organized like a palace: wings for people or projects, rooms for topics, and drawers for the original text. A local knowledge graph tracks how those facts relate over time.

    This Olares app provides a web terminal for the MemPalace command-line tools, so you can import files, search memory, and load a short briefing for a new session. Agents can also look up and add memory through MCP.

    **Key features**

    - Keep conversation text as originally written and search it by meaning.
    - Organize memory by person, project, and topic.
    - Import files from the Home folder through the web terminal.
    - Load a short memory briefing for a new session.
    - Let agents look up and add memory through MCP.

    Memory stays on this Olares. Embedding and search run locally, without a cloud API key.
  developer: MemPalace
  website: https://mempalaceofficial.com
  sourceCode: https://github.com/MemPalace/mempalace
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - fr-FR
  - de-DE
  - ja-JP
  - it-IT
  - es-ES
  doc: https://mempalaceofficial.com
  license:
  - text: Apache-2.0
    url: https://github.com/MemPalace/mempalace/blob/main/LICENSE
  requiredMemory: 1Gi
  limitedMemory: 3Gi
  requiredDisk: 50Mi
  limitedDisk: 5Gi
  requiredCpu: 500m
  limitedCpu: '2'
  supportArch:
  - amd64
  - arm64
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
entrances:
- name: terminal
  host: mempalaceingress
  port: 8080
  title: MemPalace Terminal
  icon: https://app.cdn.olares.com/appstore/mempalace/icon.png
  openMethod: window
  authLevel: internal
- name: mempalacemcp
  host: mempalaceingress
  port: 8081
  title: MemPalace MCP
  icon: https://app.cdn.olares.com/appstore/mempalace/icon.png
  openMethod: default
  authLevel: internal
  invisible: true
