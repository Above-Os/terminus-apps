metadata:
  title: MemPalace
  description: Une application de mémoire locale pour conserver le texte des conversations et le retrouver par le sens

spec:
  fullDescription: |
    MemPalace conserve l'historique des conversations dans leur formulation d'origine et trouve les passages correspondants par le sens, pas seulement par les mots exacts. Il ne résume ni ne réécrit ce qui a été stocké. L'index est organisé comme un palais : des wings pour les personnes ou les projets, des rooms pour les sujets, et des drawers pour le texte original. Un graphe de connaissances local suit comment ces faits se relient dans le temps.

    Cette application Olares fournit un terminal web pour les outils en ligne de commande MemPalace, afin d'importer des fichiers, rechercher dans la mémoire, et charger un court contexte pour une nouvelle session. Les agents peuvent aussi consulter et ajouter de la mémoire via MCP.

    **Fonctionnalités principales**

    - Conserver le texte des conversations tel qu'il a été écrit et le rechercher par le sens.
    - Organiser la mémoire par personne, projet et sujet.
    - Importer des fichiers depuis le dossier Home via le terminal web.
    - Charger un court contexte mémoire pour une nouvelle session.
    - Permettre aux agents de consulter et d'ajouter de la mémoire via MCP.

    La mémoire reste sur cet Olares. L'embedding et la recherche s'exécutent localement, sans clé d'API cloud.
