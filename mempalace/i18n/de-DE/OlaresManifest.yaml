metadata:
  title: MemPalace
  description: Eine lokale Gedächtnis-App zum Aufbewahren von Gesprächstext und Finden nach Bedeutung

spec:
  fullDescription: |
    MemPalace speichert den Gesprächsverlauf in der ursprünglichen Formulierung und findet passende Passagen nach Bedeutung, nicht nur nach exakten Wörtern. Gespeichertes wird nicht zusammengefasst oder umgeschrieben. Der Index ist wie ein Palast organisiert: Wings für Personen oder Projekte, Rooms für Themen und Drawers für den Originaltext. Ein lokaler Wissensgraph verfolgt, wie diese Fakten sich über die Zeit beziehen.

    Diese Olares-App bietet ein Web-Terminal für die MemPalace-Kommandozeilenwerkzeuge, um Dateien zu importieren, im Gedächtnis zu suchen und eine kurze Einweisung für eine neue Sitzung zu laden. Agenten können Gedächtnisinhalte auch über MCP nachschlagen und hinzufügen.

    **Hauptfunktionen**

    - Gesprächstext originalgetreu behalten und nach Bedeutung durchsuchen.
    - Gedächtnis nach Person, Projekt und Thema organisieren.
    - Dateien über das Web-Terminal aus dem Home-Ordner importieren.
    - Eine kurze Gedächtnis-Einweisung für eine neue Sitzung laden.
    - Agenten Gedächtnisinhalte über MCP nachschlagen und hinzufügen lassen.

    Das Gedächtnis bleibt auf diesem Olares. Embedding und Suche laufen lokal, ohne einen Cloud-API-Schlüssel.
