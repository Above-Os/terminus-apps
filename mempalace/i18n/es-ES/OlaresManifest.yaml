metadata:
  title: MemPalace
  description: Una aplicación de memoria local para guardar el texto de las conversaciones y encontrarlo por significado

spec:
  fullDescription: |
    MemPalace guarda el historial de conversaciones con la redacción original y encuentra los pasajes coincidentes por significado, no solo por palabras exactas. No resume ni reescribe lo almacenado. El índice se organiza como un palacio: wings para personas o proyectos, rooms para temas y drawers para el texto original. Un grafo de conocimiento local sigue cómo se relacionan esos hechos con el tiempo.

    Esta aplicación de Olares ofrece un terminal web para las herramientas de línea de comandos de MemPalace, de modo que se pueden importar archivos, buscar en la memoria y cargar un briefing breve para una sesión nueva. Los agentes también pueden consultar y añadir memoria a través de MCP.

    **Funciones principales**

    - Conservar el texto de las conversaciones tal como se escribió y buscarlo por significado.
    - Organizar la memoria por persona, proyecto y tema.
    - Importar archivos de la carpeta Home a través del terminal web.
    - Cargar un briefing breve de memoria para una sesión nueva.
    - Permitir que los agentes consulten y añadan memoria a través de MCP.

    La memoria permanece en este Olares. El embedding y la búsqueda se ejecutan en local, sin una clave de API en la nube.
