metadata:
  title: MemPalace
  description: Un'app di memoria locale per conservare il testo delle conversazioni e ritrovarlo per significato

spec:
  fullDescription: |
    MemPalace conserva la cronologia delle conversazioni nella formulazione originale e trova i passaggi corrispondenti per significato, non solo per parole esatte. Non riassume né riscrive ciò che è stato salvato. L'indice è organizzato come un palazzo: wings per persone o progetti, rooms per argomenti e drawers per il testo originale. Un grafo di conoscenza locale tiene traccia di come questi fatti si collegano nel tempo.

    Questa app Olares offre un terminale web per gli strumenti da riga di comando di MemPalace, così si possono importare file, cercare nella memoria e caricare un breve briefing per una nuova sessione. Gli agenti possono anche consultare e aggiungere memoria tramite MCP.

    **Funzionalità principali**

    - Conservare il testo delle conversazioni come scritto in origine e cercarlo per significato.
    - Organizzare la memoria per persona, progetto e argomento.
    - Importare file dalla cartella Home tramite il terminale web.
    - Caricare un breve briefing di memoria per una nuova sessione.
    - Consentire agli agenti di consultare e aggiungere memoria tramite MCP.

    La memoria resta su questo Olares. Embedding e ricerca vengono eseguiti in locale, senza una chiave API cloud.
