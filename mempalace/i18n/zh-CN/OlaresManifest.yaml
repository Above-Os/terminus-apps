metadata:
  title: MemPalace
  description: 用于保存对话原文并按含义查找的本地记忆应用

spec:
  fullDescription: |
    MemPalace 以原文保存对话历史，并按含义查找匹配片段，而不仅靠精确字词。不会对已保存内容做摘要或改写。索引按宫殿结构组织：wings 对应人物或项目，rooms 对应主题，drawers 存放原文。本地知识图谱会记录这些事实如何随时间关联。

    本 Olares 应用提供用于 MemPalace 命令行工具的 Web 终端，可导入文件、搜索记忆，并为新会话加载简要说明。智能体也可以通过 MCP 查找和写入记忆。

    **主要功能**

    - 按原文保存对话文本，并按含义搜索。
    - 按人物、项目和主题组织记忆。
    - 通过 Web 终端从 Home 目录导入文件。
    - 为新会话加载简要的记忆说明。
    - 让智能体通过 MCP 查找和写入记忆。

    记忆留在这台 Olares 上。向量化和搜索在本地运行，无需云端 API 密钥。
