metadata:
  title: MemPalace
  description: 会話の原文を保存し意味で探すローカル記憶アプリ

spec:
  fullDescription: |
    MemPalaceは、会話履歴を元の文言のまま保存し、完全一致だけでなく意味で該当箇所を見つけます。保存した内容を要約したり書き直したりしません。索引は宮殿のように整理されます。wingsは人物やプロジェクト、roomsは話題、drawersは原文です。ローカルの知識グラフが、これらの事実が時間とともにどう関係するかを追跡します。

    このOlaresアプリは、MemPalaceのコマンドラインツール用のWebターミナルを提供します。ファイルの取り込み、記憶の検索、新しいセッション向けの短いブリーフィングの読み込みができます。エージェントはMCP経由で記憶を参照・追加することもできます。

    **主な機能**

    - 会話テキストを原文のまま保持し、意味で検索します。
    - 人物、プロジェクト、話題ごとに記憶を整理します。
    - WebターミナルからHomeフォルダのファイルを取り込みます。
    - 新しいセッション向けに短い記憶のブリーフィングを読み込みます。
    - エージェントがMCP経由で記憶を参照・追加できるようにします。

    記憶はこのOlares上に留まります。埋め込みと検索はローカルで実行され、クラウドのAPIキーは不要です。
