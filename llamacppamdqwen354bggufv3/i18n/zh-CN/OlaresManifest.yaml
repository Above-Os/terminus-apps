metadata:
  description: "AMD ROCm llama.cpp 运行 Qwen3.5-4B GGUF UD-Q4_K_XL 纯文本对话。"
  title: Qwen3.5-4B AMD llama.cpp

spec:
  fullDescription: |
    **目标硬件**
    AMD ROCm 统一内存（安装时选 **`amd`** 计算模式），例如 gtr-pro。
    镜像：`beclab/ggml-org-llama.cpp:server-rocm-b10362`。

    **模型**
    [unsloth/Qwen3.5-4B-GGUF](https://huggingface.co/unsloth/Qwen3.5-4B-GGUF) — `Qwen3.5-4B-UD-Q4_K_XL.gguf` 纯文本。

    **预设**
    - 能力：tools（默认关闭 thinking）
    - 引擎参数：`-c 32768 --no-mmproj-auto --reasoning-format none -ngl all -fa on -ctk q8_0 -ctv q8_0 --jinja -np 1`
    - Pod 内存：`12Gi`

    **OpenWebUI 建议**
    - 安装后新建对话；日常上下文 8K-16K 即可
  upgradeDescription: |
    v1.0.1：llm-init v1.3.5。
    v1.0.0：Qwen3.5-4B-UD-Q4_K_XL.gguf 初始 AMD 版本。
