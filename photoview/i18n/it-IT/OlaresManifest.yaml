metadata:
  title: Photoview
  description: Galleria fotografica per server personali self-hosted
spec:
  fullDescription: |
    Photoview è una galleria fotografica semplice e user-friendly pensata per i fotografi, con l’obiettivo di offrire un modo facile e veloce di navigare directory con migliaia di foto ad alta risoluzione.

    Configuri Photoview per cercare foto e video in una directory del file system. Lo scanner rileva automaticamente i media e genera miniature per una navigazione rapidissima.

    Quando i media sono stati scansionati appaiono sul sito, organizzati come sul file system

    **Funzionalità principali**
    Closely tied to the file system
    - Il sito presenta le immagini trovate sul file system locale del server; le directory sono mappate agli album.

    User management
    - Ogni utente è creato insieme a un percorso sul file system locale; le foto in quel percorso sono accessibili a quell’utente.

    Sharing
    - Album e singoli media possono essere facilmente condivisi con un link pubblico; il link può essere protetto opzionalmente da password.

    Made for photography
    - Photoview è costruito pensando ai fotografi e supporta quindi formati RAW e parsing EXIF.

    Video support
    - Sono supportati molti formati video comuni. I video vengono ottimizzati automaticamente per il web.

    Face recognition
    - I volti vengono rilevati automaticamente nelle foto e le foto della stessa persona vengono raggruppate.

    Performant
    - Le miniature sono generate automaticamente e le foto si caricano quando sono visibili sullo schermo. A schermo intero le miniature restano finché l’immagine ad alta risoluzione non è completamente caricata.

    Secure
    - Tutte le risorse media sono protette con un cookie-token, tutte le password sono correttamente hashiate e l’API usa una policy CORS rigorosa.
