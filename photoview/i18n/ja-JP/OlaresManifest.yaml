metadata:
  title: Photoview
  description: セルフホスト個人サーバー向けフォトギャラリー
spec:
  fullDescription: |
    Photoview は写真家向けに作られたシンプルで使いやすいフォトギャラリーで、数千枚の高解像度写真があるディレクトリを簡単かつ高速にナビゲートすることを目指しています。

    Photoview をファイルシステムのディレクトリ内の写真・動画を探すよう設定します。スキャナーがメディアを自動検出し、閲覧を高速にするサムネイルを生成します。

    スキャン済みメディアはウェブサイトに表示され、ファイルシステムと同じ構成で整理されます

    **主な機能**
    Closely tied to the file system
    - サイトはサーバーのローカルファイルシステム上の画像を表示し、ディレクトリはアルバムに対応します。

    User management
    - 各ユーザーはローカルファイルシステム上のパスとともに作成され、そのパス内の写真にアクセスできます。

    Sharing
    - アルバムや個別メディアを公開リンクで簡単に共有でき、任意でパスワード保護も可能です。

    Made for photography
    - 写真家向けに作られており、RAW 形式と EXIF 解析をサポートします。

    Video support
    - 多くの一般的な動画形式に対応。動画は Web 向けに自動最適化されます。

    Face recognition
    - 写真内の顔を自動検出し、同一人物の写真をグループ化します。

    Performant
    - サムネイルは自動生成され、画面に表示されたときに初めて写真が読み込まれます。フルスクリーンでは高解像度画像の読み込み完了までサムネイルが表示されます。

    Secure
    - すべてのメディアリソースは cookie-token で保護され、パスワードは適切にハッシュされ、API は厳格な CORS ポリシーを使用します。
