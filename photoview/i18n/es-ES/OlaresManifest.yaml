metadata:
  title: Photoview
  description: Galería de fotos para servidores personales autoalojados
spec:
  fullDescription: |
    Photoview es una galería de fotos sencilla y fácil de usar, hecha para fotógrafos, y busca ofrecer una forma rápida y sencilla de navegar directorios con miles de fotos de alta resolución.

    Configuras Photoview para buscar fotos y vídeos en un directorio de tu sistema de archivos. El escáner recoge automáticamente tus medios y genera miniaturas para una navegación muy rápida.

    Cuando los medios se han escaneado aparecen en el sitio web, organizados igual que en el sistema de archivos

    **Funciones principales**
    Closely tied to the file system
    - El sitio presenta las imágenes encontradas en el sistema de archivos local del servidor; los directorios se asignan a álbumes.

    User management
    - Cada usuario se crea junto con una ruta en el sistema de archivos local; las fotos de esa ruta son accesibles para ese usuario.

    Sharing
    - Los álbumes, así como medios individuales, se pueden compartir fácilmente con un enlace público; el enlace puede protegerse opcionalmente con contraseña.

    Made for photography
    - Photoview está pensado para fotógrafos y por tanto admite formatos RAW y análisis EXIF.

    Video support
    - Se admiten muchos formatos de vídeo habituales. Los vídeos se optimizan automáticamente para la web.

    Face recognition
    - Los rostros se detectan automáticamente en las fotos, y las fotos de la misma persona se agrupan.

    Performant
    - Las miniaturas se generan automáticamente y las fotos se cargan cuando son visibles en pantalla. A pantalla completa se muestran miniaturas hasta que la imagen de alta resolución se ha cargado por completo.

    Secure
    - Todos los recursos multimedia están protegidos con un cookie-token, todas las contraseñas se hashean correctamente y la API usa una política CORS estricta.
