metadata:
  title: Photoview
  description: Fotogalerie für selbst gehostete persönliche Server
spec:
  fullDescription: |
    Photoview ist eine einfache und benutzerfreundliche Fotogalerie für Fotografen und bietet eine schnelle, leichte Navigation durch Verzeichnisse mit Tausenden hochauflösender Fotos.

    Sie konfigurieren Photoview so, dass es Fotos und Videos in einem Verzeichnis Ihres Dateisystems sucht. Der Scanner erkennt Ihre Medien automatisch und erzeugt Vorschaubilder für besonders schnelles Browsen.

    Nach dem Scan erscheinen die Medien auf der Website, organisiert wie im Dateisystem

    **Hauptfunktionen**
    Closely tied to the file system
    - Die Website zeigt die auf dem lokalen Dateisystem des Servers gefundenen Bilder; Verzeichnisse werden auf Alben abgebildet.

    User management
    - Jeder Nutzer wird zusammen mit einem Pfad auf dem lokalen Dateisystem angelegt; Fotos in diesem Pfad kann dieser Nutzer sehen.

    Sharing
    - Alben sowie einzelne Medien lassen sich leicht per öffentlichem Link teilen; optional passwortgeschützt.

    Made for photography
    - Photoview ist für Fotografen gebaut und unterstützt daher RAW-Formate und EXIF-Parsing.

    Video support
    - Viele gängige Videoformate werden unterstützt. Videos werden automatisch fürs Web optimiert.

    Face recognition
    - Gesichter werden in Fotos automatisch erkannt, und Fotos derselben Person werden gruppiert.

    Performant
    - Vorschaubilder werden automatisch erzeugt und Fotos laden erst, wenn sie auf dem Bildschirm sichtbar sind. Im Vollbild werden Thumbnails angezeigt, bis das hochauflösende Bild vollständig geladen ist.

    Secure
    - Alle Medienressourcen sind mit einem Cookie-Token geschützt, alle Passwörter korrekt gehasht, und die API nutzt eine strikte CORS-Richtlinie.
