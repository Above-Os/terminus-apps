metadata:
  title: Photoview
  description: Galerie photo pour serveurs personnels auto-hébergés
spec:
  fullDescription: |
    Photoview est une galerie photo simple et conviviale conçue pour les photographes, visant à offrir un moyen rapide et facile de parcourir des répertoires contenant des milliers de photos haute résolution.

    Vous configurez Photoview pour chercher photos et vidéos dans un répertoire de votre système de fichiers. Le scanner détecte automatiquement vos médias et génère des miniatures pour une navigation très rapide.

    Une fois scannés, les médias apparaissent sur le site, organisés comme sur le système de fichiers

    **Fonctionnalités principales**
    Closely tied to the file system
    - Le site présente les images trouvées sur le système de fichiers local du serveur ; les répertoires sont mappés en albums.

    User management
    - Chaque utilisateur est créé avec un chemin sur le système de fichiers local ; les photos de ce chemin sont accessibles à cet utilisateur.

    Sharing
    - Les albums, ainsi que les médias individuels, peuvent facilement être partagés via un lien public ; le lien peut éventuellement être protégé par mot de passe.

    Made for photography
    - Photoview est conçu pour les photographes et prend donc en charge les formats RAW et le parsing EXIF.

    Video support
    - De nombreux formats vidéo courants sont pris en charge. Les vidéos sont automatiquement optimisées pour le web.

    Face recognition
    - Les visages sont automatiquement détectés dans les photos, et les photos de la même personne sont regroupées.

    Performant
    - Les miniatures sont générées automatiquement et les photos ne se chargent que lorsqu’elles sont visibles à l’écran. En plein écran, les miniatures s’affichent jusqu’au chargement complet de l’image haute résolution.

    Secure
    - Toutes les ressources média sont protégées par un cookie-token, tous les mots de passe sont correctement hachés, et l’API utilise une politique CORS stricte.
