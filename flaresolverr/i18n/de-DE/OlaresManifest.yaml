metadata:
  title: FlareSolverr
  description: Proxyserver zum Umgehen von Cloudflare- und DDoS-GUARD-Schutz
spec:
  fullDescription: |
    FlareSolverr ist ein leistungsstarker Proxyserver, der Anwendungen hilft, Cloudflare und andere Anti-Bot-Schutzmaßnahmen automatisch zu umgehen. Er simuliert eine echte Browserumgebung, sodass Skripte und Automatisierungstools geschützte Websites ohne Blockierung erreichen können.

    Durch das Lösen von JavaScript-Challenges und Sicherheitsprüfungen im Hintergrund ermöglicht FlareSolverr zuverlässigen Zugriff auf Websites, die automatisierte Anfragen normalerweise einschränken. Das macht es besonders nützlich für Web-Scraping-Tools, APIs und Anwendungen, die konsistenten Datenzugriff benötigen.

    Mit Flexibilität und Leistung im Blick integriert sich FlareSolverr leicht in verschiedene Software und unterstützt mehrere Plattformen. Sein automatisiertes Challenge-Solving sorgt für reibungslose, sichere und unterbrechungsfreie Kommunikation mit geschützten Websites.

    Mit FlareSolverr können Sie:
    - Proxy-Einstellungen anpassen: Proxy-Parameter wie Rotationsfrequenz, geografischen Standort und Proxy-Typen feinabstimmen, um Scraping-Leistung und Anonymität zu optimieren.
    - Echtzeitanpassungen: Sofortige Änderungen an Proxy-Konfigurationen, um sich an wandelnde Scraping-Anforderungen oder Website-Abwehr anzupassen.
    - Erhöhte Sicherheit: Erweiterte Funktionen nutzen, um das Erkennungsrisiko zu minimieren und Scraping-Aktivitäten unter dem Radar zu halten.
    - Nahtlose Integration: Proxy-Management leicht in bestehende Workflows und Scraping-Tools integrieren für eine reibungslose, unterbrechungsfreie Datenextraktion.
    - Umfassende Kontrolle: Proxy-Nutzung in Echtzeit überwachen und anpassen und so volle Kontrolle darüber behalten, wie Daten abgerufen und gesammelt werden.
  upgradeDescription: |
    Switch des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Nginx-Config-Mounts und Log-Pfade an das Layout des offiziellen Images anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Bitnami-spezifische `OPENRESTY_CONF_FILE`-Verdrahtung entfernen.

    Upgrade auf v3.4.6

    Änderungen:
    - Option zum Deaktivieren von Bildern, CSS und Schriften mit CDP hinzugefügt (1626)
    
    Vollständige Release Notes: https://github.com/FlareSolverr/FlareSolverr/releases/tag/v3.4.6
