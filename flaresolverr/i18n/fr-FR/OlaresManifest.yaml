metadata:
  title: FlareSolverr
  description: Serveur proxy pour contourner la protection Cloudflare et DDoS-GUARD
spec:
  fullDescription: |
    FlareSolverr est un puissant serveur proxy conçu pour aider les applications à contourner automatiquement Cloudflare et d’autres protections anti-bot. Il simule un environnement de navigateur réel, permettant aux scripts et outils d’automatisation d’accéder à des sites protégés sans être bloqués.

    En résolvant les défis JavaScript et les contrôles de sécurité en arrière-plan, FlareSolverr permet un accès fiable aux sites qui restreignent normalement les requêtes automatisées. Il est particulièrement utile pour les outils de web scraping, les API et les applications nécessitant un accès cohérent aux données.

    Conçu pour la flexibilité et la performance, FlareSolverr s’intègre facilement à divers logiciels et prend en charge plusieurs plateformes. Son système automatisé de résolution des défis assure une communication fluide, sécurisée et ininterrompue avec les sites protégés.

    Avec FlareSolverr, vous pouvez :
    - Personnaliser les paramètres proxy : Affiner les paramètres comme la fréquence de rotation, la localisation géographique et les types de proxy pour optimiser le scraping et l’anonymat.
    - Ajustements en temps réel : Modifier instantanément vos configurations proxy pour vous adapter à l’évolution des besoins de scraping ou des défenses du site.
    - Sécurité renforcée : Utiliser des fonctions avancées pour minimiser le risque de détection et garder vos activités de scraping hors radar.
    - Intégration transparente : Intégrer facilement la gestion des proxies à vos flux et outils de scraping existants pour une extraction de données sans interruption.
    - Contrôle complet : Surveiller et ajuster l’usage des proxies en temps réel, avec un contrôle total sur la façon dont les données sont accessées et collectées.
  upgradeDescription: |
    Remplacement de l’image reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l’image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l’image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage Bitnami `OPENRESTY_CONF_FILE`.

    Mise à niveau vers v3.4.6

    Changements :
    - Ajout de l’option pour désactiver image, CSS et polices avec CDP (1626)
    
    Notes de version complètes : https://github.com/FlareSolverr/FlareSolverr/releases/tag/v3.4.6
