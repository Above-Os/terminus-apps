  fullDescription: |
    Blinko es un proyecto innovador de código abierto pensado para quienes quieren capturar y organizar rápidamente pensamientos fugaces. Blinko permite anotar ideas en el momento en que surgen, para que no se pierda ninguna chispa de creatividad.

    **Funciones principales**
    - Recuperación de notas con IA: Con el RAG (Retrieval-Augmented Generation) avanzado de Blinko, puede buscar y acceder a sus notas con consultas en lenguaje natural.

    - Propiedad de los datos: Su privacidad importa. Todas sus notas y datos se almacenan de forma segura en su entorno autoalojado, con control total sobre su información.

    - Eficiente y rápido: Capture ideas al instante y guárdelas como texto plano, con soporte completo de Markdown para formatear y compartir con facilidad.

    - Arquitectura ligera con soporte multiplataforma: Creado con Tauri, Blinko ofrece una arquitectura limpia y ligera con sólido rendimiento, y soporte nativo para macOS, Windows, Android y Linux.

    - Abierto a la colaboración: Como proyecto de código abierto, Blinko invita a contribuir. Todo el código es transparente y está disponible en GitHub.

