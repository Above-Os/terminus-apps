metadata:
  title: Blinko
  description: プライバシーを重視したオープンソースのセルフホスト型パーソナル AI ノートツール
spec:
  upgradeDescription: |
    パッケージ変更（chart 1.0.11）
    - Blinko を 1.8.7 にアップグレード（公式 docker.io/blinkospace/blinko）。
    - Ollama プロバイダー依存とレガシーな Ollama sysData バインディングを削除。
    - インストールまたはアップグレード後、Blinko 設定で AI モデルを構成してください。

    前回のリリース（app 1.8.0）

    新機能
    pg-boss への移行と AI スケジュールタスクの追加 945a0db
    MCP サーバー管理機能の追加 73e29b8
    スワイプ操作と UI 改善による BlinkoCard の強化 b8c39a4

    リファクタリング
    アニメーション設定の更新とタスクワーカー管理の改善 169e98b

    メンテナンス
    バージョンを 1.8.0 に更新 cf8782c

    その他の変更
    [ci skip] バージョンを 1.7.1 に更新 5e57ca5
    blinkospace/pr/pg-boss-migration-ai-tasks からの blinko-space によるプルリクエスト #1048 をマージ cbeaeee

    詳細はリリースノートを参照：https://github.com/blinkospace/blinko/releases/tag/1.8.0

  fullDescription: |
    Blinko は、ふとした考えをすばやく捉え整理したい人のための革新的なオープンソースプロジェクトです。アイデアが浮かんだ瞬間に書き残せるため、創造の火花を逃しません。

    **主な機能**
    - AI 強化ノート検索：Blinko の高度な AI 搭載 RAG（Retrieval-Augmented Generation）により、自然言語クエリでノートをすばやく検索・参照できます。

    - データの所有権：プライバシーを重視。すべてのノートとデータはセルフホスト環境に安全に保存され、情報を完全に管理できます。

    - 効率的で高速：アイデアを即座に捉え、プレーンテキストとして保存。Markdown を完全サポートし、すばやい整形と共有が可能です。

    - 軽量アーキテクチャとマルチプラットフォーム対応：Tauri で構築され、クリーンで軽量な構成ながら堅牢な性能を発揮。macOS、Windows、Android、Linux をネイティブサポートします。

    - コラボレーションに開放：オープンソースとしてコミュニティの貢献を歓迎。すべてのコードは GitHub 上で透明に公開されています。

