  fullDescription: |
    Blinko ist ein innovatives Open-Source-Projekt für alle, die flüchtige Gedanken schnell festhalten und organisieren möchten. Blinko ermöglicht es, Ideen nahtlos im Moment des Aufkommens festzuhalten, damit kein Funke der Kreativität verloren geht.

    **Hauptfunktionen**
    - KI-gestützte Notizsuche: Mit Blinkos fortschrittlichem KI-gestütztem RAG (Retrieval-Augmented Generation) können Sie Notizen mit natürlicher Sprache schnell suchen und finden.

    - Datenhoheit: Ihre Privatsphäre zählt. Alle Notizen und Daten werden sicher in Ihrer selbst gehosteten Umgebung gespeichert – mit voller Kontrolle über Ihre Informationen.

    - Effizient und schnell: Ideen sofort erfassen und als Klartext speichern, mit voller Markdown-Unterstützung für schnelle Formatierung und einfaches Teilen.

    - Leichte Architektur mit Multiplattform-Support: Mit Tauri gebaut, bietet Blinko eine saubere, leichte Architektur mit robuster Leistung bei hoher Geschwindigkeit und nativer Unterstützung für macOS, Windows, Android und Linux.

    - Offen für Zusammenarbeit: Als Open-Source-Projekt lädt Blinko zu Community-Beiträgen ein. Der gesamte Code ist transparent auf GitHub verfügbar.

