  fullDescription: |
    Blinko è un progetto open-source innovativo pensato per chi vuole catturare e organizzare rapidamente pensieri fugaci. Blinko consente di annotare le idee nel momento in cui nascono, affinché nessuna scintilla di creatività vada persa.

    **Funzionalità principali**
    - Recupero note potenziato dall'IA: Con il RAG (Retrieval-Augmented Generation) avanzato di Blinko, puoi cercare e accedere alle note con query in linguaggio naturale.

    - Proprietà dei dati: La tua privacy conta. Tutte le note e i dati sono archiviati in modo sicuro nel tuo ambiente self-hosted, con controllo completo sulle informazioni.

    - Efficiente e veloce: Cattura le idee all'istante e conservale come testo semplice, con pieno supporto Markdown per formattare e condividere facilmente.

    - Architettura leggera con supporto multipiattaforma: Realizzato con Tauri, Blinko offre un'architettura pulita e leggera con prestazioni solide e supporto nativo per macOS, Windows, Android e Linux.

    - Aperto alla collaborazione: Come progetto open-source, Blinko invita i contributi della community. Tutto il codice è trasparente e disponibile su GitHub.

