  fullDescription: |
    Blinko est un projet open source innovant conçu pour ceux qui veulent capturer et organiser rapidement leurs pensées fugaces. Blinko permet de noter les idées dès qu'elles surgissent, afin qu'aucune étincelle de créativité ne soit perdue.

    **Fonctionnalités principales**
    - Recherche de notes assistée par l'IA : Grâce au RAG (Retrieval-Augmented Generation) avancé de Blinko, recherchez et accédez à vos notes avec des requêtes en langage naturel.

    - Propriété des données : Votre confidentialité compte. Toutes vos notes et données sont stockées en toute sécurité dans votre environnement auto-hébergé, avec un contrôle total sur vos informations.

    - Efficace et rapide : Capturez les idées instantanément et stockez-les en texte brut, avec un support Markdown complet pour formater et partager facilement.

    - Architecture légère avec support multiplateforme : Construit avec Tauri, Blinko offre une architecture propre et légère avec de solides performances, et un support natif pour macOS, Windows, Android et Linux.

    - Ouvert à la collaboration : En tant que projet open source, Blinko invite les contributions de la communauté. Tout le code est transparent et disponible sur GitHub.

