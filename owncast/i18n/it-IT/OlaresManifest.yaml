metadata:
  title: Owncast
  description: Server gratuito e open source di video live e web chat da usare con software di broadcasting popolari.
spec:
  upgradeDescription: |
    Passare l'immagine del reverse proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico Bitnami `OPENRESTY_CONF_FILE`.
  fullDescription: |
    **Credenziali predefinite**
    AdminPath: /admin
    Username: admin
    Password: abc123

    **Panoramica**
    Owncast è un server di live video streaming e chat open source, self-hosted, decentralizzato e monoutente per gestire i propri live in stile simile alle grandi piattaforme mainstream. Offre piena proprietà su contenuti, interfaccia, moderazione e pubblico.

    **Funzionalità principali**
    Self-hosted e indipendente
    - Controllo e proprietà completi sul tuo stream, per creare i contenuti e la community che desideri.

    Chat
    - La chat integrata senza attriti permette agli spettatori di partecipare. Includi emote personalizzate e chat bot per favorire l'engagement.

    Funziona con il tuo software
    - Punta il tuo software di broadcasting esistente al server Owncast e inizia a trasmettere sul tuo server in pochi minuti.

    Il Fediverso
    - Il tuo live può raggiungere un pubblico più ampio sul Fediverso, permettendo di seguire e condividere lo stream su Mastodon e altri servizi.
