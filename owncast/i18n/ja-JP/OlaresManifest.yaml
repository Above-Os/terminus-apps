metadata:
  title: Owncast
  description: 既存の人気配信ソフトと使える、無料オープンソースのライブ動画＆Webチャットサーバー
spec:
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えます。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除します。
  fullDescription: |
    **デフォルト認証情報**
    AdminPath: /admin
    Username: admin
    Password: abc123

    **概要**
    Owncast はオープンソースのセルフホスト型・分散型・単一ユーザー向けライブ動画ストリーミング＆チャットサーバーで、大手配信サービスに似たスタイルで独自のライブを運用できます。コンテンツ、インターフェース、モデレーション、オーディエンスを完全に所有できます。

    **主な機能**
    セルフホスト＆独立
    - ストリームを完全に制御・所有し、望むコンテンツとコミュニティを作れます。

    チャット
    - 摩擦の少ない組み込みチャットで視聴者が参加できます。カスタム絵文字やチャットボットでエンゲージメントを高められます。

    既存ソフトと連携
    - 既存の配信ソフトを Owncast サーバーに向け、数分で自前サーバー配信を開始できます。

    Fediverse
    - ライブストリームを Fediverse でより広い視聴者に届け、Mastodon などでのフォローや共有が可能です。
