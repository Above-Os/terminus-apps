metadata:
  title: MySQL
  description: Die weltweit beliebteste Open-Source-Datenbank
spec:
  fullDescription: |
    MySQL ist ein quelloffenes RDBMS, das SQL zum Erstellen und Verwalten von Datenbanken verwendet. Als relationale Datenbank speichert MySQL Daten in Tabellen aus Zeilen und Spalten, organisiert in Schemas. Ein Schema definiert, wie Daten organisiert und gespeichert werden, und beschreibt die Beziehungen zwischen verschiedenen Tabellen. Mit diesem Format können Entwickler viele Datentypen einfach speichern, abrufen und analysieren – darunter einfachen Text, Zahlen, Daten, Zeiten und neuerdings auch JSON und Vektoren.

    Hauptfunktionen
    **Einfach zu bedienen**
    MySQL gilt unter RDBMS als benutzerfreundlich. Es arbeitet mit grundlegendem SQL und bietet dank Reife und Verbreitung umfangreiche Dokumentation.

    **Sicher**
    Die Reife von MySQL trägt auch zur Sicherheit bei. Es wird regelmäßig aktualisiert, hat eine lebendige Entwickler-Community und aufgrund der weiten Unternehmensnutzung werden viele CVE-Patches oft vor der öffentlichen CVE-Ankündigung veröffentlicht. Zusammen machen diese Faktoren MySQL zu einer stabilen und sicheren Wahl unter RDBMS.

    #Open Source
    Die Community Edition von MySQL ist enterprise-tauglich und unter der GNU General Public License lizenziert. Für Nutzer, die vergleichbare proprietäre Funktionen ohne den Aufpreis möchten, gibt es im Ökosystem Alternativen — wie MariaDB — die ähnliche und darüber hinausgehende Funktionalität bieten können.

    **Skalierbar**
    MySQL ist für ein RDBMS hoch skalierbar, mit einer Vielzahl von Optionen zur Abstimmung, Anpassung und Erweiterung Ihres MySQL-Erlebnisses.

    **Zuverlässig**
    MySQL ist zuverlässig — nicht nur aus Datensicht, sondern auch aus Entwicklungsperspektive. Es ist ausgereift, hat regelmäßige Releases und Patches sowie eine etablierte Entwickler-Community. Das macht es zu einer sicheren Wahl gegenüber neueren, weniger ausgereiften RDBMS-Optionen.
