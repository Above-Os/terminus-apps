metadata:
  title: MySQL
  description: La base de datos de código abierto más popular del mundo
spec:
  fullDescription: |
    MySQL es un RDBMS de código abierto que usa SQL para crear y gestionar bases de datos. Como base de datos relacional, MySQL almacena datos en tablas de filas y columnas organizadas en esquemas. Un esquema define cómo se organizan y almacenan los datos y describe la relación entre varias tablas. Con este formato, los desarrolladores pueden almacenar, recuperar y analizar fácilmente muchos tipos de datos, incluidos texto simple, números, fechas, horas y, más recientemente, JSON y vectores.

    Características clave
    **Fácil de usar**
    MySQL se considera fácil de usar entre los RDBMS. Funciona con SQL básico y, dada su madurez y adopción, hay abundante documentación disponible.

    **Seguro**
    La madurez de MySQL también favorece la seguridad. Se actualiza con regularidad, tiene una comunidad de desarrolladores activa y, por su amplia adopción empresarial, muchos parches CVE se publican antes de que se anuncie el CVE. Estos factores combinados hacen de MySQL una opción estable y segura entre los RDBMS.

    #Open Source
    La edición comunitaria de MySQL está lista para empresas y se rige por la GNU General Public License. Para usuarios que quieren funcionalidad propietaria similar sin el coste adicional, hay otras opciones en el ecosistema — como MariaDB — que pueden aportar niveles similares de funcionalidad y más.

    **Escalable**
    MySQL es altamente escalable para un RDBMS, con una amplia gama de opciones que permiten afinar, personalizar y mejorar tu experiencia con MySQL.

    **Fiable**
    MySQL es fiable — no solo desde la perspectiva de los datos, sino también del desarrollo. Es maduro, tiene versiones y parches regulares, y una comunidad de desarrolladores consolidada. Esto lo convierte en una opción segura frente a RDBMS más nuevos y menos maduros.
