metadata:
  title: MySQL
  description: 世界で最も人気のあるオープンソースデータベース
spec:
  fullDescription: |
    MySQL は、SQL を使ってデータベースを作成・管理するオープンソースの RDBMS です。リレーショナルデータベースとして、MySQL はスキーマに整理された行と列のテーブルにデータを格納します。スキーマはデータの整理・保存方法を定義し、各種テーブル間の関係を記述します。この形式により、開発者は単純なテキスト、数値、日付、時刻、そして最近では JSON やベクトルを含む多くのデータ型を容易に保存・取得・分析できます。

    主な機能
    **使いやすい**
    MySQL は RDBMS の中でも使いやすいとされています。基本的な SQL で動作し、成熟度と普及度から豊富なドキュメントが利用できます。

    **セキュア**
    MySQL の成熟度はセキュリティにもつながります。定期的に更新され、活発な開発者コミュニティがあり、企業での幅広い採用により、多くの CVE パッチが CVE 発表前にリリースされます。これらの要因が組み合わさり、RDBMS の中でも安定して安全な選択肢となっています。

    #Open Source
    MySQL のコミュニティ版はエンタープライズ向けに利用可能で、GNU General Public License で提供されます。追加コストなしで同等のプロプライエタリ機能を求めるユーザー向けには、MariaDB などエコシステム内の他の選択肢があり、同様以上の機能を追加できます。

    **スケーラブル**
    MySQL は RDBMS として高いスケーラビリティを持ち、チューニング、カスタマイズ、体験向上のための幅広いオプションがあります。

    **信頼性**
    MySQL はデータ面だけでなく開発面でも信頼できます。成熟しており、定期的なリリースとパッチ、定着した開発者コミュニティがあります。これにより、より新しい・未成熟な RDBMS と比べて安全な選択となります。
