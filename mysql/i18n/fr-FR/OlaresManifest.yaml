metadata:
  title: MySQL
  description: La base de données open source la plus populaire au monde
spec:
  fullDescription: |
    MySQL est un RDBMS open source qui utilise SQL pour créer et gérer des bases de données. En tant que base de données relationnelle, MySQL stocke les données dans des tables de lignes et de colonnes organisées en schémas. Un schéma définit comment les données sont organisées et stockées et décrit les relations entre les différentes tables. Avec ce format, les développeurs peuvent facilement stocker, récupérer et analyser de nombreux types de données, y compris du texte simple, des nombres, des dates, des heures et, plus récemment, du JSON et des vecteurs.

    Fonctionnalités clés
    **Facile à utiliser**
    MySQL est considéré comme facile à utiliser parmi les RDBMS. Il fonctionne avec le SQL de base et, compte tenu de sa maturité et de son adoption, une documentation abondante est disponible.

    **Sécurisé**
    La maturité de MySQL contribue aussi à la sécurité. Il est régulièrement mis à jour, dispose d'une communauté de développeurs dynamique et, grâce à son large adoption en entreprise, de nombreux correctifs CVE sont publiés avant l'annonce du CVE. Ces facteurs font de MySQL un choix stable et sécurisé parmi les RDBMS.

    #Open Source
    L'édition communautaire de MySQL est prête pour l'entreprise et est couverte par une GNU General Public License. Pour les utilisateurs qui souhaitent des fonctionnalités propriétaires équivalentes sans le surcoût, il existe d'autres options dans l'écosystème — comme MariaDB — qui peuvent offrir des niveaux de fonctionnalités similaires et au-delà.

    **Scalable**
    MySQL est hautement scalable pour un RDBMS, avec un large éventail d'options permettant d'ajuster, de personnaliser et d'améliorer votre expérience MySQL.

    **Fiable**
    MySQL est fiable — non seulement du point de vue des données, mais aussi du développement. Il est mature, a des versions et correctifs réguliers, et une communauté de développeurs bien établie. Cela en fait un choix sûr par rapport à des RDBMS plus récents et moins matures.
