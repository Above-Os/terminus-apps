metadata:
  title: MySQL
  description: Il database open source più popolare al mondo
spec:
  fullDescription: |
    MySQL è un RDBMS open source che usa SQL per creare e gestire database. Come database relazionale, MySQL memorizza i dati in tabelle di righe e colonne organizzate in schemi. Uno schema definisce come i dati sono organizzati e memorizzati e descrive le relazioni tra le varie tabelle. Con questo formato, gli sviluppatori possono facilmente memorizzare, recuperare e analizzare molti tipi di dati, inclusi testo semplice, numeri, date, orari e, più di recente, JSON e vettori.

    Caratteristiche principali
    **Facile da usare**
    MySQL è considerato facile da usare tra gli RDBMS. Funziona con SQL di base e, data la sua maturità e adozione, c'è abbondante documentazione disponibile.

    **Sicuro**
    La maturità di MySQL contribuisce anche alla sicurezza. È aggiornato regolarmente, ha una vivace community di sviluppatori e, grazie all'ampia adozione aziendale, molti patch CVE vengono rilasciati prima dell'annuncio del CVE. Questi fattori rendono MySQL una scelta stabile e sicura tra gli RDBMS.

    #Open Source
    L'edizione community di MySQL è pronta per l'enterprise ed è supportata da una GNU General Public License. Per gli utenti che vogliono funzionalità proprietarie equivalenti senza il costo aggiuntivo, ci sono altre opzioni nell'ecosistema — come MariaDB — che possono offrire livelli simili di funzionalità e oltre.

    **Scalabile**
    MySQL è altamente scalabile per un RDBMS, con una vasta gamma di opzioni per ottimizzare, personalizzare e migliorare la tua esperienza MySQL.

    **Affidabile**
    MySQL è affidabile — non solo dal punto di vista dei dati, ma anche dello sviluppo. È maturo, ha rilasci e patch regolari e una community di sviluppatori consolidata. Questo lo rende una scelta sicura rispetto a RDBMS più nuovi e meno maturi.
