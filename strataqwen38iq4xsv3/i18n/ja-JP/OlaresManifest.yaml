metadata:
  title: Strata Qwen3.8-Flash-Next
  description: "Strataによるテキスト生成・推論・ツール呼び出し向けのローカルQwen3.8実行"
spec:
  fullDescription: |
    Strataは、大規模なAIモデルをローカルで実行するためのオープンソース推論エンジンです。GPUメモリ、システムRAM、ストレージを連携させることで、モデル全体をGPUメモリに収める必要がなくなります。

    このアプリは、Unslothが提供するQwen3.8-Flash-NextのUD-IQ4_XS量子化版をStrataで実行します。Qwen3.8-Flash-Nextは、質問への回答やテキスト生成に使う、AlibabaのQwenチームによる実験的なモデルです。Model Consoleを通じてエンジンをOlaresに接続します。

    **主な機能**

    - 対応するアプリで、思考モードやツール呼び出しを使ってテキストの回答を生成できます。
    - Model Consoleでモデルのダウンロード、状態の確認、エンジン設定の調整ができます。
    - Olares RouterまたはOpenAI互換のチャットAPIを通じて、対応するアプリを接続できます。

    **このエディションについて**

    このエディションはテキスト入力のみを受け付けます。画像と動画の入力は無効です。デフォルトのコンテキスト上限は131,072トークンで、一度に処理するリクエストは1件です。利用可能なコンテキストは、メモリとエンジン設定によって異なります。

    **初回利用前の確認事項**

    初回起動時には約94GBのモデルファイルとStrataに必要な追加ファイルをダウンロードし、その後モデルを準備します。Model Consoleでメインのダウンロードが完了と表示されても、Strataによるモデルの準備が続いている場合があります。

    AVX2に対応したCPUと、R580シリーズ以降のNVIDIAドライバが必要です。このプリセットは96GiBのRAMを搭載したホストを想定しています。インストール前に、記載されているリソース要件を確認してください。

    [モデルのドキュメント](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [量子化モデル](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Strataのドキュメント](https://github.com/Niko1221/Strata)
