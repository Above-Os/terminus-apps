metadata:
  title: Qwen3.8-Flash-Next
  description: Un modèle d’IA local pour dialoguer par texte, raisonner et appeler des outils
spec:
  fullDescription: |
    Qwen3.8-Flash-Next est un modèle d’IA expérimental de l’équipe Qwen d’Alibaba, conçu pour répondre aux questions et générer du texte. Cette application exécute localement le modèle quantifié UD-IQ4_XS d’Unsloth avec Strata et le connecte à Olares via Model Console.

    **Principales fonctionnalités**

    - Générer des réponses textuelles avec un mode de raisonnement et des appels d’outils dans les applications compatibles.
    - Utiliser Model Console pour télécharger le modèle, consulter son état et ajuster les paramètres du moteur.
    - Connecter des applications compatibles via Olares Router ou l’API de chat compatible avec OpenAI.

    **Cette édition**

    Cette édition accepte uniquement du texte en entrée ; les entrées image et vidéo sont désactivées. La limite de contexte par défaut est de 131 072 tokens, avec une seule requête traitée à la fois. Le contexte disponible dépend de la mémoire et des paramètres du moteur.

    **Avant la première utilisation**

    Au premier démarrage, environ 94 GB de fichiers du modèle sont téléchargés, ainsi que les fichiers supplémentaires nécessaires à Strata, puis le modèle est préparé. Model Console peut indiquer que le téléchargement principal est terminé alors que Strata prépare encore le modèle.

    Un processeur (CPU) prenant en charge AVX2 et un pilote NVIDIA de la série R580 ou ultérieure sont requis. La configuration par défaut est prévue pour un hôte disposant de 96 GiB de RAM. Consultez les ressources requises indiquées avant l’installation.

    [Documentation du modèle](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) · [Modèle quantifié](https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF) · [Documentation de Strata](https://github.com/Niko1221/Strata)
