metadata:
  title: PaddleOCR
  description: Kit de reconocimiento de texto y análisis de documentos
spec:
  fullDescription: |    
    PaddleOCR es un motor OCR y de Document AI líder en la industria y listo para producción, que ofrece soluciones de extremo a extremo desde la extracción de texto hasta la comprensión inteligente de documentos

    PaddleOCR convierte documentos e imágenes en datos estructurados y amigables para AI (como JSON y Markdown) con precisión líder — impulsando aplicaciones AI desde desarrolladores independientes y startups hasta grandes empresas en todo el mundo. Con más de 60.000 estrellas e integración profunda en proyectos líderes como MinerU, RAGFlow, pathway y cherry-studio, PaddleOCR se ha convertido en la solución preferida para desarrolladores de aplicaciones documentales inteligentes en la era de la AI.

    **Funciones principales**
    Document Recognition: Pipeline OCR de documentos avanzado basado en PaddleOCR-VL para un reconocimiento preciso del texto.
    
    Layout Analysis: Modelo PP-DocLayoutV3 integrado para detección y análisis precisos del layout.
    
    PaddleOCR-VL Model: Impulsado por el modelo PaddleOCR-VL-1.5-0.9B para comprensión documental y extracción de texto de alta calidad.
    
    PaddleX Deployment: Desplegado con el framework PaddleX para inferencia optimizada y rendimiento listo para producción.

    **Ventajas clave**
    High Accuracy: Modelos de reconocimiento documental de vanguardia entrenados en conjuntos de datos a gran escala para una precisión superior.
    
    Fast Processing: Motor de inferencia optimizado mediante PaddleX para un procesamiento documental rápido.
    
    Document-Oriented: Especializado en tareas de reconocimiento documental con capacidades avanzadas de comprensión de layout.
    
    Production Ready: Desplegado con PaddleX para un despliegue de producción estable y eficiente.

    **Detalles técnicos**
    Model: PaddleOCR-VL-1.5-0.9B para reconocimiento documental y extracción de texto.
    
    Layout Model: PP-DocLayoutV3 para detección de layout y análisis de estructura.
    
    Deployment Framework: PaddleX para serving e inferencia de modelos optimizados.
    
    Use Case: OCR documental y análisis de layout para varios tipos de documentos.
  upgradeDescription: |
    Lanzamiento inicial del servicio PaddleOCR para la plataforma Olares.
