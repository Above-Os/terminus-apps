metadata:
  title: PaddleOCR
  description: テキスト認識＆ドキュメント解析ツールキット
spec:
  fullDescription: |    
    PaddleOCR は業界をリードする本番対応の OCR・Document AI エンジンで、テキスト抽出からインテリジェントな文書理解までエンドツーエンドのソリューションを提供します

    PaddleOCR はドキュメントと画像を、業界トップクラスの精度で構造化され AI フレンドリーなデータ（JSON や Markdown など）に変換し、インディー開発者やスタートアップから世界の大企業まで AI アプリケーションを支えます。6 万を超えるスターと MinerU、RAGFlow、pathway、cherry-studio などの主要プロジェクトへの深い統合により、AI 時代のインテリジェント文書アプリ構築における第一の選択肢となっています。

    **コア機能**
    Document Recognition: PaddleOCR-VL に基づく高度な文書 OCR パイプラインで正確な文書テキスト認識。
    
    Layout Analysis: 統合 PP-DocLayoutV3 モデルによる精密なレイアウト検出と分析。
    
    PaddleOCR-VL Model: PaddleOCR-VL-1.5-0.9B モデルによる高品質な文書理解とテキスト抽出。
    
    PaddleX Deployment: PaddleX フレームワークによる最適化された推論と本番対応パフォーマンス。

    **主な利点**
    High Accuracy: 大規模データセットで学習した最先端の文書認識モデルによる高い精度。
    
    Fast Processing: PaddleX による最適化推論エンジンで高速な文書処理。
    
    Document-Oriented: 高度なレイアウト理解を備えた文書認識タスクに特化。
    
    Production Ready: PaddleX による安定かつ効率的な本番デプロイ。

    **技術詳細**
    Model: 文書認識とテキスト抽出向け PaddleOCR-VL-1.5-0.9B。
    
    Layout Model: レイアウト検出と構造分析向け PP-DocLayoutV3。
    
    Deployment Framework: 最適化されたモデルサービングと推論向け PaddleX。
    
    Use Case: 各種ドキュメント向けの Document OCR とレイアウト分析。
  upgradeDescription: |
    Olares プラットフォーム向け PaddleOCR サービスの初回リリース。
