metadata:
  title: PaddleOCR
  description: Toolkit für Texterkennung & Dokumentenparsing
spec:
  fullDescription: |    
    PaddleOCR ist eine branchenführende, produktionsreife OCR- und Document-AI-Engine und bietet End-to-End-Lösungen von der Textextraktion bis zum intelligenten Dokumentenverständnis

    PaddleOCR wandelt Dokumente und Bilder mit branchenführender Genauigkeit in strukturierte, AI-freundliche Daten (wie JSON und Markdown) um — und treibt AI-Anwendungen von Indie-Entwicklern und Startups bis hin zu großen Unternehmen weltweit an. Mit über 60,000 Stars und tiefer Integration in führende Projekte wie MinerU, RAGFlow, pathway und cherry-studio ist PaddleOCR die bevorzugte Lösung für Entwickler intelligenter Dokumentenanwendungen im AI-Zeitalter.

    **Kernfunktionen**
    Document Recognition: Fortschrittliche Document-OCR-Pipeline basierend auf PaddleOCR-VL für genaue Dokumententexterkennung.
    
    Layout Analysis: Integriertes PP-DocLayoutV3-Modell für präzise Layout-Erkennung und -Analyse.
    
    PaddleOCR-VL Model: Angetrieben vom PaddleOCR-VL-1.5-0.9B Modell für hochwertiges Dokumentenverständnis und Textextraktion.
    
    PaddleX Deployment: Bereitstellung mit dem PaddleX-Framework für optimierte Inferenz und produktionsreife Leistung.

    **Zentrale Vorteile**
    High Accuracy: State-of-the-Art-Modelle zur Dokumentenerkennung, trainiert auf groß angelegten Datensätzen für überlegene Genauigkeit.
    
    Fast Processing: Optimierte Inference-Engine über PaddleX für schnelle Dokumentenverarbeitung.
    
    Document-Oriented: Spezialisiert auf Dokumentenerkennungsaufgaben mit fortschrittlichem Layout-Verständnis.
    
    Production Ready: Mit PaddleX für stabile und effiziente Produktionsbereitstellung deployt.

    **Technische Details**
    Model: PaddleOCR-VL-1.5-0.9B für Dokumentenerkennung und Textextraktion.
    
    Layout Model: PP-DocLayoutV3 für Layout-Erkennung und Strukturanalyse.
    
    Deployment Framework: PaddleX für optimiertes Model Serving und Inferenz.
    
    Use Case: Document OCR und Layout-Analyse für verschiedene Dokumenttypen.
  upgradeDescription: |
    Erste Veröffentlichung des PaddleOCR-Dienstes für die Olares-Plattform.
