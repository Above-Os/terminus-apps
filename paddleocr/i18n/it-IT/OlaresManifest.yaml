metadata:
  title: PaddleOCR
  description: Toolkit per riconoscimento testo e parsing documenti
spec:
  fullDescription: |    
    PaddleOCR è un motore OCR e Document AI leader del settore e pronto per la produzione, che offre soluzioni end-to-end dall’estrazione del testo alla comprensione intelligente dei documenti

    PaddleOCR converte documenti e immagini in dati strutturati e AI-friendly (come JSON e Markdown) con accuratezza leader — alimentando applicazioni AI da sviluppatori indie e startup fino a grandi imprese in tutto il mondo. Con oltre 60.000 star e una profonda integrazione in progetti leader come MinerU, RAGFlow, pathway e cherry-studio, PaddleOCR è diventato la soluzione di riferimento per chi costruisce applicazioni documentali intelligenti nell’era dell’AI.

    **Funzionalità principali**
    Document Recognition: Pipeline OCR documentale avanzata basata su PaddleOCR-VL per un riconoscimento testo accurato.
    
    Layout Analysis: Modello PP-DocLayoutV3 integrato per rilevamento e analisi precisi del layout.
    
    PaddleOCR-VL Model: Basato sul modello PaddleOCR-VL-1.5-0.9B per comprensione documentale ed estrazione testo di alta qualità.
    
    PaddleX Deployment: Distribuito con il framework PaddleX per inferenza ottimizzata e prestazioni production-ready.

    **Vantaggi chiave**
    High Accuracy: Modelli di riconoscimento documentale all’avanguardia addestrati su dataset su larga scala per un’accuratezza superiore.
    
    Fast Processing: Motore di inferenza ottimizzato tramite PaddleX per un’elaborazione documentale rapida.
    
    Document-Oriented: Specializzato in task di riconoscimento documentale con capacità avanzate di comprensione del layout.
    
    Production Ready: Distribuito con PaddleX per un deployment di produzione stabile ed efficiente.

    **Dettagli tecnici**
    Model: PaddleOCR-VL-1.5-0.9B per riconoscimento documentale ed estrazione testo.
    
    Layout Model: PP-DocLayoutV3 per rilevamento layout e analisi della struttura.
    
    Deployment Framework: PaddleX per model serving e inferenza ottimizzati.
    
    Use Case: OCR documentale e analisi layout per vari tipi di documenti.
  upgradeDescription: |
    Rilascio iniziale del servizio PaddleOCR per la piattaforma Olares.
