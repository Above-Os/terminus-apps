metadata:
  title: SearXNG
  description: Cerca senza essere tracciato

spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio sull'intero sistema Olares. Tuttavia, ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall'Olares Admin.

    **PANORAMICA**
    SearXNG è un metasearch engine internet gratuito che aggrega risultati da più di 70 servizi di ricerca. Gli utenti non sono tracciati né profilati. Inoltre, SearXNG può essere usato su Tor per l'anonimato online.

    **Perché usarlo?**
    - SearXNG potrebbe non offrirti risultati personalizzati come Google, ma non genera un profilo su di te.
    - SearXNG non si interessa di cosa cerchi, non condivide nulla con terze parti e non può essere usato per comprometterti.
    - SearXNG è software libero, il codice è 100% aperto, e tutti sono i benvenuti a migliorarlo.

    **Funzionalità**
    - self hosted
    - nessun tracking utenti / nessun profiling
    - script e cookie opzionali
    - connessioni sicure e crittografate
    - circa 200 motori di ricerca
    - circa 60 traduzioni
    - circa 100 istanze ben mantenute su searx.space
    - facile integrazione di motori di ricerca
    - sviluppo professionale: CI, quality assurance e UI testata automaticamente

  upgradeDescription: |
    Migrazione di SearXNG al pattern shared app apiVersion v3 (searxngv2 → searxngv3).

    **Cosa è cambiato**

    - **Architettura**: sub-chart appiattiti; rimosso nginx clientproxy — l'ingresso instrada direttamente a SearXNG sulla porta 8080.
    - **Scaling**: `workloadReplicas` per il workload `searxngv3`.
    - **Runtime**: immagine SearXNG `2026.5.10-df1f24fb7` con elenco engine ereditato.
