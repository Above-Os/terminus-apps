apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsloth
  namespace: {{ .Release.Namespace }}
  labels:
    app: unsloth
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.unsloth.replicaCount }}
  selector:
    matchLabels:
      app: unsloth
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: unsloth
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: init-permissions
        image: beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          set -eu
          for d in /workspace /opt/unsloth-studio /workspace/host /cache/huggingface /cache/triton /root /run /dev/shm; do
            mkdir -p "$d"
            chown 1000:1000 "$d"
          done
          chmod 1777 /dev/shm
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: studio
          mountPath: /opt/unsloth-studio
        - name: home
          mountPath: /workspace/host
        - name: hf-cache
          mountPath: /cache/huggingface
        - name: triton-cache
          mountPath: /cache/triton
        - name: root-home
          mountPath: /root
        - name: run
          mountPath: /run
        - name: dshm
          mountPath: /dev/shm
      containers:
      - name: unsloth
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        args:
        - bash
        - -lc
        - |
          set -eu
          dest=/opt/unsloth-studio/llama-cpp
          if [ -L "$dest" ] || [ ! -f "$dest/convert_hf_to_gguf.py" ] || [ ! -w "$dest" ]; then
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -a /opt/unsloth/llama.cpp/. "$dest/"
          fi
          export UNSLOTH_LLAMA_CPP_PATH="$dest"
          exec /usr/local/bin/unsloth-studio-launch
        ports:
        - name: studio
          containerPort: 8000
        - name: jupyter
          containerPort: 8888
        env:
        - name: UNSLOTH_STUDIO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth
              key: UNSLOTH_STUDIO_PASSWORD
        - name: JUPYTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth
              key: JUPYTER_PASSWORD
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        - name: HF_HUB_CACHE
          value: /workspace/.cache/huggingface
        - name: HUGGINGFACE_HUB_CACHE
          value: /workspace/.cache/huggingface
        - name: TRITON_CACHE_DIR
          value: /workspace/.cache/triton
        - name: UNSLOTH_LLAMA_CPP_PATH
          value: /opt/unsloth-studio/llama-cpp
        {{- $oe := .Values.olaresEnv | default dict -}}
        {{- if $oe.HF_ENDPOINT }}
        - name: HF_ENDPOINT
          value: {{ $oe.HF_ENDPOINT | quote }}
        {{- end }}
        {{- if $oe.HF_TOKEN }}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth
              key: HF_TOKEN
        {{- end }}
        readinessProbe:
          httpGet:
            path: /
            port: studio
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: "2"
            memory: 12Gi
          limits:
            cpu: "12"
            memory: 48Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: studio
          mountPath: /opt/unsloth-studio
        - name: home
          mountPath: /workspace/host
        - name: hf-cache
          mountPath: /workspace/.cache/huggingface
        - name: triton-cache
          mountPath: /workspace/.cache/triton
        - name: root-home
          mountPath: /root
        - name: run
          mountPath: /run
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        hostPath:
          path: {{ .Values.userspace.appData }}/workspace
          type: DirectoryOrCreate
      - name: studio
        hostPath:
          path: {{ .Values.userspace.appData }}/studio
          type: DirectoryOrCreate
      - name: home
        hostPath:
          path: {{ .Values.userspace.userData }}
          type: DirectoryOrCreate
      - name: hf-cache
        hostPath:
          path: {{ .Values.userspace.appCommon }}/huggingface
          type: DirectoryOrCreate
      - name: triton-cache
        hostPath:
          path: {{ .Values.userspace.appCache }}/triton
          type: DirectoryOrCreate
      - name: root-home
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
