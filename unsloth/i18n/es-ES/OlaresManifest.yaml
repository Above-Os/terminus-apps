metadata:
  title: Unsloth
  description: Interfaz local para ejecutar y entrenar modelos abiertos
spec:
  upgradeDescription: |
    - Actualizar a la imagen oficial unsloth/unsloth:nightly-2026.10.26. Solo instalación con GPU NVIDIA; usar el endpoint y el token de Hugging Face del sistema.
    - Novedades: prompts programados y ajustes de ejecución reutilizables. Abrir Scheduled desde More en la barra lateral; las tareas requieren que Studio esté en ejecución. Guardar ajustes en el selector de modelos.
    - Los modelos de chat se descargan de la memoria GPU tras 5 minutos de inactividad de forma predeterminada. No se interrumpen respuestas en curso ni se eliminan archivos. No se liberan tareas de entrenamiento ni la cuota de memoria de Olares.
    - En Olares Settings > Applications > Unsloth, editar la variable UNSLOTH_MODEL_IDLE_TTL: 300 significa 5 minutos; 0 desactiva este temporizador predeterminado, no descarga inmediatamente el modelo. Los valores activos deben ser de al menos 60 segundos. Aplicar cambios reinicia la aplicación.
    - Sin temporizador, el modelo puede ocupar memoria hasta expulsarlo manualmente o detener la aplicación. Los ajustes guardados en Studio tienen prioridad, incluso sobre 0. Keep model in GPU memory impide la descarga automática.
    - Para liberar memoria manualmente, abrir Chat y el selector de modelos; elegir Eject model abajo a la derecha, o Eject all para varios modelos. Los archivos se conservan.
    - La actualización conserva los modelos descargados y los ajustes de Studio. El reinicio del servicio descarga el modelo de la memoria; hay que volver a cargarlo. Si ningún ajuste guardado lo sustituye, se aplica el valor predeterminado de 5 minutos.
  fullDescription: |
    Unsloth Studio es una interfaz de navegador local para ejecutar y ajustar modelos abiertos. Este paquete también incluye JupyterLab.

    Carga un modelo GGUF o safetensors, conversa con él, prepara un conjunto de datos con Data Recipes, ejecuta un entrenamiento corto de LoRA o QLoRA y exporta un punto de control a GGUF. Studio y Jupyter solicitan una contraseña durante la instalación. La contraseña de Studio se guarda en el primer arranque y los cambios posteriores del entorno no la sustituyen.

    El modo GPU requiere una GPU NVIDIA. Este paquete solo admite amd64. Los modelos de imagen y vídeo de Studio son grandes: la pila de imagen más pequeña ocupa unos 7 GB y la de vídeo unos 61 GB. Una GPU de 24 GB puede alojar el modelo de imagen pequeño si la asignación de GPU se eleva por encima del mínimo de 4 GB. La pila de vídeo no cabe en esta GPU ni en el límite de memoria de la aplicación.

    El repositorio original usa Apache-2.0. La interfaz de Studio incluida en la imagen contiene componentes AGPL-3.0.
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: Contraseña inicial de Unsloth Studio para el usuario unsloth (mínimo 8 caracteres). Solo se usa en el primer arranque; los cambios posteriores no sustituyen la contraseña guardada en los datos de la aplicación.
- envName: JUPYTER_PASSWORD
  description: Contraseña de JupyterLab (mínimo 8 caracteres)
