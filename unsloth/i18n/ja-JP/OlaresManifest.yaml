metadata:
  title: Unsloth
  description: オープンモデルをローカルで実行・学習する画面
spec:
  upgradeDescription: |
    - 公式イメージ unsloth/unsloth:nightly-2026.10.26 に更新。NVIDIA GPU モードのみ提供し、システムの Hugging Face エンドポイントとトークンを使用します。
    - 新機能：プロンプトの定期実行とモデルごとの実行プリセット。サイドバーの More から Scheduled を開きます。タスクは Studio の起動中のみ実行されます。プリセットはモデル選択画面で保存できます。
    - チャットモデルは既定で 5 分間使用されないと GPU メモリから解放されます。生成中の回答を中断せず、ダウンロード済みファイルも削除しません。学習処理や Olares のメモリ割り当て枠は解放しません。
    - Olares Settings > Applications > Unsloth の環境変数 UNSLOTH_MODEL_IDLE_TTL を変更します。300 は 5 分、0 は既定の待機タイマーを無効にする値で、即時解放ではありません。有効な値は 60 秒以上です。変更の適用でアプリが再起動します。
    - タイマーを無効にすると、手動で解放するかアプリを停止するまでモデルが GPU メモリに残る場合があります。Studio に保存された設定は 0 を含む既定値より優先されます。Keep model in GPU memory は自動解放を防ぎます。
    - 手動で解放するには Chat でモデル選択画面を開き、右下の Eject model、複数の場合は Eject all を選びます。モデルファイルは残ります。
    - アップグレード後もダウンロード済みモデルと Studio の保存設定は保持されます。サービス再起動でメモリ上のモデルは解放されるため、再度読み込んで使用します。保存設定による上書きがなければ、既定の 5 分タイマーが適用されます。
  fullDescription: |
    Unsloth Studio は、オープンモデルをローカルで実行しファインチューニングするブラウザ画面です。このパッケージには JupyterLab も含まれます。

    GGUF または safetensors モデルを読み込んで対話し、Data Recipes でデータセットを用意し、短い LoRA または QLoRA の学習を実行して、チェックポイントを GGUF に書き出せます。インストール時に Studio と Jupyter のパスワードをそれぞれ設定します。Studio のパスワードは初回起動時に保存され、その後の環境変数の変更では置き換わりません。

    GPU モードには NVIDIA GPU が必要です。このパッケージは amd64 のみに対応します。Studio の画像モデルと動画モデルは大きく、最小の画像構成は約 7 GB、最小の動画構成は約 61 GB です。24 GB の GPU は、GPU 割り当てを 4 GB の下限より上げれば、この小さい画像モデルを保持できます。動画構成はこの GPU とアプリのメモリ上限には収まりません。

    上流リポジトリは Apache-2.0 です。イメージに含まれる Studio 画面には AGPL-3.0 のコンポーネントが含まれます。
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: ユーザー unsloth の Unsloth Studio 初期パスワード（8 文字以上）。初回起動時にのみ使われ、その後の変更ではアプリデータに保存されたパスワードは置き換わりません。
- envName: JUPYTER_PASSWORD
  description: JupyterLab のパスワード（8 文字以上）
