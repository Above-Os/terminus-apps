metadata:
  title: Unsloth
  description: 在本地运行和微调开源模型的界面
spec:
  upgradeDescription: |
    - 升级至官方镜像 unsloth/unsloth:nightly-2026.10.26。仅提供 NVIDIA GPU 安装模式，并使用系统配置的 Hugging Face 地址和 Token。
    - 新增亮点：定时执行提示词，以及可重复使用的模型运行预设。从侧栏 More 打开 Scheduled；任务仅在 Studio 运行时执行。可在模型选择器中保存运行预设。
    - 空闲卸载：默认在对话模型空闲 5 分钟后将其从 GPU 显存卸载，不中断正在生成的回答，也不删除已下载的模型文件。此设置不释放训练任务占用，也不返还 Olares 显存切片配额。
    - 修改默认值：打开 Olares 设置 > 应用 > Unsloth，在环境变量中设置 UNSLOTH_MODEL_IDLE_TTL。300 表示 5 分钟；0 表示关闭此默认空闲计时器，并非立即卸载。启用时至少为 60 秒。应用变更会重启应用。
    - 关闭计时器后，已加载模型可能持续占用显存，直到手动卸载或应用停止。Studio 中已保存的自动卸载设置优先于该默认值，包括默认值为 0 的情况；启用 Keep model in GPU memory 会阻止自动卸载。
    - 手动卸载：进入 Chat，打开模型选择器，选择右下角的 Eject model；加载多个模型时可选择 Eject all。这会释放模型占用的显存，保留模型文件。
    - 已有模型：升级保留已下载的模型及 Studio 已保存的设置。升级会重启服务，原先驻留显存的模型会卸载，之后需重新加载才能继续使用。没有已保存设置覆盖时，重新加载的模型采用默认 5 分钟空闲卸载。
  fullDescription: |
    Unsloth Studio 是在本地运行和微调开源模型的浏览器界面。本应用同时包含 JupyterLab。

    可以加载 GGUF 或 safetensors 模型并对话，用 Data Recipes 准备数据集，运行较短的 LoRA 或 QLoRA 训练，再将检查点导出为 GGUF。安装时需要分别设置 Studio 和 Jupyter 的密码。Studio 密码在首次启动时写入应用数据，之后修改环境变量不会替换已保存的密码。

    GPU 模式需要 NVIDIA 显卡。本应用仅支持 amd64。Studio 中的图像和视频模型体积较大：最小图像组合约 7 GB，最小视频组合约 61 GB。24 GB 显卡在将 GPU 配额提高到 4 GB 下限以上后，可以装下小型图像模型。视频组合超出 24 GB 显存，也超过应用内存上限。

    上游仓库采用 Apache-2.0。镜像中附带的 Studio 界面包含 AGPL-3.0 组件。
entrances:
- name: unsloth
  title: Unsloth Studio
- name: jupyter
  title: JupyterLab
envs:
- envName: UNSLOTH_STUDIO_PASSWORD
  description: 用户 unsloth 的 Unsloth Studio 初始密码（至少 8 个字符）。仅在首次启动时使用；之后的修改不会替换已保存在应用数据中的密码。
- envName: JUPYTER_PASSWORD
  description: JupyterLab 密码（至少 8 个字符）
