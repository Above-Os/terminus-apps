metadata:
  title: Documenso
  description: オープンソースの DocuSign 代替製品。
spec:
  fullDescription: |
    Documenso は、デジタル署名プラットフォームであり、オープンソースの DocuSign 代替製品です。
    豊富なカスタマイズ機能とオープン API により、ビジネス業務へシームレスに統合できます。美しく、シンプルな署名。驚くほどオープンです。

    **機能**
    **どこでも署名**
    すぐに導入でき、自由に拡張できる署名インフラでビジネスを強化します。

    **チームの作成と管理**
    - 全員を参加させ、複数チームへシームレスに拡張できます。非公開文書を安全に保ちながら署名ワークフローで共同作業し、Documenso でチームを強化できます。

    **公開プロフィールの作成**
    - 公開プロフィールで信頼を築きます。ユーザーが必要なときに、すぐ署名できるテンプレートを提供できます。

    **文書を簡単に作成、送信、署名。まるで魔法**
    - 使いやすいインターフェースで、下書きから署名までのワークフローを定義できます。

    **連携**
    - Documenso は Zapier 経由でお気に入りのツールと連携し、任意のフレームワークへ簡単に埋め込めます。

    **テンプレートを作成して直接リンクを有効化**

    **Documenso API**
  upgradeDescription: |
    v1.0.16: イメージを `documenso/documenso:v2.16.0` にアップグレード。
    DB URL と SMTP パスワードを Kubernetes Secret（`secretKeyRef`）へ移動。
    SMTP 環境変数を任意にし、従来の `sysVersion >= 1.12.3` 分岐を削除。
