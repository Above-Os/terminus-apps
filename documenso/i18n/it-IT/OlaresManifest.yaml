metadata:
  title: Documenso
  description: L'alternativa open source a DocuSign
spec:
  fullDescription: |
    Documenso è una piattaforma di firma digitale e un'alternativa open source a DocuSign.
    Documenso si integra perfettamente nelle attività aziendali grazie ad ampie opzioni di personalizzazione e a un'API aperta. Firmare in modo semplice ed elegante. Straordinariamente aperto.

    **Funzionalità**
    **Firma ovunque**
    Potenzia la tua attività con la nostra infrastruttura di firma plug-and-play, pronta da acquistare o su cui sviluppare.

    **Crea e gestisci team**
    - Coinvolgi tutti e scala facilmente tra i team. Collabora sui flussi di firma mantenendo al sicuro i documenti privati. Potenzia il tuo team con Documenso.

    **Crea il tuo profilo pubblico**
    - Crea fiducia con un profilo pubblico. Offri modelli pronti da firmare ogni volta che servono ai tuoi utenti.

    **Crea, invia e firma documenti con facilità. Sembra una magia**
    - Definisci flussi dalla bozza alla firma con la nostra interfaccia intuitiva.

    **Integrazioni**
    - Documenso si collega ai tuoi strumenti preferiti tramite Zapier e si incorpora facilmente nel framework che preferisci.

    **Crea modelli e abilita i collegamenti diretti**

    **Documenso API**
  upgradeDescription: |
    v1.0.16: Immagine aggiornata a `documenso/documenso:v2.16.0`.
    URL del DB e password SMTP spostati in un Kubernetes Secret (`secretKeyRef`).
    Variabili SMTP rese facoltative; rimossa la logica obsoleta per `sysVersion >= 1.12.3`.
