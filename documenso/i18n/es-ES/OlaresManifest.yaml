metadata:
  title: Documenso
  description: La alternativa de código abierto a DocuSign
spec:
  fullDescription: |
    Documenso es una plataforma de firma digital y una alternativa de código abierto a DocuSign.
    Documenso se integra perfectamente en las operaciones de tu empresa gracias a sus amplias opciones de personalización y una API abierta. Firmas bonitas y sencillas. Extraordinariamente abierto.

    **Funciones**
    **Firma en cualquier lugar**
    Potencia tu empresa con nuestra infraestructura de firma lista para usar. Lista para adquirir o para desarrollar sobre ella.

    **Crea y gestiona equipos**
    - Incorpora a todos y escala sin problemas entre equipos. Colabora en flujos de firma mientras mantienes seguros los documentos privados. Potencia tu equipo con Documenso.

    **Crea tu perfil público**
    - Genera confianza con un perfil público. Ofrece plantillas listas para firmar siempre que tus usuarios las necesiten.

    **Crea, envía y firma documentos fácilmente. Parece magia**
    - Define flujos desde el borrador hasta la firma con nuestra interfaz fácil de usar.

    **Integraciones**
    - Documenso se conecta con tus herramientas favoritas mediante Zapier y se integra fácilmente en tu framework preferido.

    **Crea plantillas y habilita enlaces directos**

    **Documenso API**
  upgradeDescription: |
    v1.0.16: Imagen actualizada a `documenso/documenso:v2.16.0`.
    Las URL de la base de datos y la contraseña SMTP se trasladaron a un Kubernetes Secret (`secretKeyRef`).
    Las variables SMTP ahora son opcionales; se eliminó la lógica heredada para `sysVersion >= 1.12.3`.
