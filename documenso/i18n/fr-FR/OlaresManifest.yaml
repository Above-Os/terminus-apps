metadata:
  title: Documenso
  description: L'alternative open source à DocuSign
spec:
  fullDescription: |
    Documenso est une plateforme de signature numérique et une alternative open source à DocuSign.
    Documenso s'intègre parfaitement à vos activités grâce à de nombreuses options de personnalisation et à une API ouverte. Une signature belle et simple. Remarquablement ouvert.

    **Fonctionnalités**
    **Signez partout**
    Donnez de l'élan à votre entreprise avec notre infrastructure de signature prête à l'emploi, disponible telle quelle ou comme base de développement.

    **Créez et gérez des équipes**
    - Réunissez tout le monde et évoluez facilement entre les équipes. Collaborez sur les processus de signature tout en protégeant les documents privés. Renforcez votre équipe avec Documenso.

    **Créez votre profil public**
    - Instaurez la confiance avec un profil public. Proposez des modèles prêts à signer dès que vos utilisateurs en ont besoin.

    **Créez, envoyez et signez facilement des documents. Comme par magie**
    - Définissez les processus du brouillon à la signature grâce à notre interface facile à utiliser.

    **Intégrations**
    - Documenso se connecte à vos outils favoris via Zapier et s'intègre aisément à votre framework préféré.

    **Créez des modèles et activez les liens directs**

    **Documenso API**
  upgradeDescription: |
    v1.0.16 : image mise à niveau vers `documenso/documenso:v2.16.0`.
    Les URL de DB et le mot de passe SMTP ont été déplacés dans un Kubernetes Secret (`secretKeyRef`).
    Les variables SMTP sont désormais facultatives ; l'ancienne branche `sysVersion >= 1.12.3` a été supprimée.
