metadata:
  title: Documenso
  description: Die quelloffene Alternative zu DocuSign.
spec:
  fullDescription: |
    Documenso ist eine Plattform für digitale Signaturen und eine quelloffene Alternative zu DocuSign.
    Documenso lässt sich mit umfangreichen Anpassungsmöglichkeiten und einer offenen API nahtlos in Ihre Geschäftsabläufe integrieren. Schönes, einfaches Signieren. Außergewöhnlich offen.

    **Funktionen**
    **Überall unterschreiben**
    Stärken Sie Ihr Unternehmen mit unserer sofort einsetzbaren Signaturinfrastruktur. Direkt einsatzbereit oder als Grundlage für eigene Lösungen.

    **Teams erstellen und verwalten**
    - Holen Sie alle an Bord und skalieren Sie nahtlos über Teams hinweg. Arbeiten Sie gemeinsam an Signaturabläufen und schützen Sie dabei private Dokumente. Stärken Sie Ihr Team mit Documenso.

    **Öffentliches Profil erstellen**
    - Schaffen Sie Vertrauen mit einem öffentlichen Profil. Bieten Sie unterschriftsfertige Vorlagen an, wann immer Ihre Benutzer sie benötigen.

    **Dokumente mühelos erstellen, senden und unterschreiben. Wie von Zauberhand**
    - Definieren Sie mit unserer benutzerfreundlichen Oberfläche Abläufe vom Entwurf bis zur Unterschrift.

    **Integrationen**
    - Documenso verbindet sich über Zapier mit Ihren bevorzugten Tools und lässt sich mühelos in Ihr bevorzugtes Framework einbetten.

    **Vorlagen erstellen und Direktlinks ermöglichen**

    **Documenso API**
  upgradeDescription: |
    v1.0.16: Image auf `documenso/documenso:v2.16.0` aktualisiert.
    DB-URLs und SMTP-Passwort in ein Kubernetes Secret (`secretKeyRef`) verschoben.
    SMTP-Umgebungsvariablen optional gemacht; veraltete Verzweigung für `sysVersion >= 1.12.3` entfernt.
