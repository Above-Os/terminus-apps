metadata:
  title: "FastH3"
  description: "FastH3 runs MiniMax H3 in eight steps to make videos with sound from text, first and last frames, or reference images, video and audio"
spec:
  fullDescription: |
    Generate synchronized video and audio with the FastH3 eight-step distilled models. Write a prompt, optionally add a first and last frame or up to five reference images, one reference video and one reference audio, and the app picks the matching workflow. Results, uploads and the queue are kept on your Olares and shared by every device you open the app on.

    The app runs the model on your Olares:
    - One prompt box with an asset tray: add first and last frames or reference images, video and audio, and the app picks the matching workflow.
    - AI optimize rewrites your prompt into the structure MiniMax H3 expects, with shots, dialogue and sound, using a chat model from Router. Pick the model in Settings.
    - A queue and a result feed shared by every device you open it on, with reuse, continue from the last frame, grab a frame and download on each result.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with each workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.

    AI optimize needs a chat model application installed and listed in Router. Its instructions follow MiniMax's H3 prompt-writing guide, written in our own words.
  upgradeDescription: |
    Now a shared app: an admin installs it once for everyone on the Olares, and each person sees only their own queue, uploads and results. Uninstall the previous version before installing this one.
