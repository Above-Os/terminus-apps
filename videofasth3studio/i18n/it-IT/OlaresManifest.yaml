metadata:
  title: "FastH3"
  description: "FastH3 esegue MiniMax H3 in otto passi per creare video con audio da testo, primo e ultimo fotogramma, o immagini, video e audio di riferimento"
spec:
  fullDescription: |
    Genera video e audio sincronizzati con i modelli distillati a otto passi di FastH3. Scrivi un prompt e, se vuoi, aggiungi un primo e un ultimo fotogramma oppure fino a cinque immagini di riferimento, un video e un audio di riferimento; l'app sceglie il workflow adatto. Risultati, caricamenti e coda restano sul tuo Olares e sono condivisi su ogni dispositivo in cui apri l'app.

    L'app esegue il modello sul tuo Olares:
    - Un campo prompt con una barra dei contenuti: aggiungi primo e ultimo fotogramma o immagini, video e audio di riferimento, e l'app sceglie il workflow adatto.
    - L'ottimizzazione IA riscrive il prompt con un modello di chat di Router nella struttura attesa da MiniMax H3, con inquadrature, dialoghi e suono. Il modello si sceglie nelle Impostazioni.
    - Una coda e un feed di risultati condivisi su tutti i dispositivi, con riuso, continua dall'ultimo fotogramma, estrai un fotogramma e scarica su ogni risultato.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con ogni workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.

    L'ottimizzazione IA richiede un'app di modello di chat installata e disponibile in Router. Le sue istruzioni seguono la guida di MiniMax alla scrittura dei prompt per H3, riformulata con parole nostre.
  upgradeDescription: |
    Router può inviare richieste di generazione con la propria identità di servizio Olares. Puoi seguirne lo stato in Studio.

    Quando aggiungi un video di riferimento, Studio mostra la stima della memoria GPU necessaria e la memoria disponibile. Seleziona Aggiorna per controllare di nuovo. Se manca poca memoria, puoi comunque provare a generare il video. Se ne manca molta, il pulsante di generazione viene disattivato. Riduci la risoluzione o la durata del video da generare per usare meno memoria.

    Se esegui l’aggiornamento da un’installazione per singolo utente, disinstalla la versione precedente prima di installare questa versione condivisa.

