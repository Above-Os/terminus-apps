metadata:
  title: "FastH3"
  description: "FastH3 ejecuta MiniMax H3 en ocho pasos para crear vídeos con sonido a partir de texto, primer y último fotograma, o imágenes, vídeo y audio de referencia"
spec:
  fullDescription: |
    Genera vídeo y audio sincronizados con los modelos destilados de ocho pasos de FastH3. Escribe un prompt y, si quieres, añade un primer y último fotograma o hasta cinco imágenes de referencia, un vídeo de referencia y un audio de referencia; la app elige el flujo de trabajo adecuado. Los resultados, las subidas y la cola se guardan en tu Olares y se comparten en todos los dispositivos donde abras la app.

    La app ejecuta el modelo en tu Olares:
    - Un cuadro de prompt con bandeja de recursos: añade primer y último fotograma o imágenes, vídeo y audio de referencia, y la app elige el flujo de trabajo adecuado.
    - La optimización con IA reescribe tu prompt con un modelo de chat de Router en la estructura que espera MiniMax H3, con planos, diálogo y sonido. El modelo se elige en Ajustes.
    - Una cola y un feed de resultados compartidos en todos los dispositivos, con reutilizar, continuar desde el último fotograma, capturar un fotograma y descargar en cada resultado.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con cada flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.

    La optimización con IA necesita una app de modelo de chat instalada y disponible en Router. Sus instrucciones siguen la guía de MiniMax para escribir prompts de H3, redactada con nuestras propias palabras.
  upgradeDescription: |
    Al añadir un vídeo de referencia, Studio muestra la memoria de GPU que estima necesaria y la que queda libre. Pulsa Actualizar para volver a consultarla. Si falta poca memoria, aún puedes intentar generar el vídeo. Si falta mucha, el botón de generación se desactiva. Reduce la resolución o la duración del vídeo de salida para usar menos memoria.

    Si actualizas desde una instalación para un solo usuario, desinstala esa versión antes de instalar esta versión compartida.

    [Ver esta versión](https://github.com/beclab/flowstudio2/releases/tag/videofasth3studio/v0.1.23)
