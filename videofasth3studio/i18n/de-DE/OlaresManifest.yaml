metadata:
  title: "FastH3"
  description: "FastH3 führt MiniMax H3 in acht Schritten aus und erstellt Videos mit Ton aus Text, erstem und letztem Bild oder Referenzbildern, -videos und -audio"
spec:
  fullDescription: |
    Erzeugen Sie synchrones Video und Audio mit den destillierten Acht-Schritt-Modellen von FastH3. Schreiben Sie einen Prompt und fügen Sie optional ein erstes und letztes Bild oder bis zu fünf Referenzbilder, ein Referenzvideo und ein Referenzaudio hinzu; die App wählt den passenden Workflow. Ergebnisse, Uploads und die Warteschlange bleiben auf Ihrem Olares und sind auf jedem Gerät verfügbar, auf dem Sie die App öffnen.

    Die App führt das Modell auf Ihrem Olares aus:
    - Ein Prompt-Feld mit Medienleiste: Fügen Sie erstes und letztes Bild oder Referenzbilder, -video und -audio hinzu, und die App wählt den passenden Workflow.
    - KI-Optimierung schreibt Ihren Prompt mit einem Chat-Modell aus dem Router in die Struktur um, die MiniMax H3 erwartet, mit Einstellungen, Dialog und Ton. Das Modell wählen Sie in den Einstellungen.
    - Eine Warteschlange und ein Ergebnis-Feed, geteilt auf allen Geräten, mit Wiederverwenden, Fortsetzen ab dem letzten Bild, Einzelbild entnehmen und Herunterladen bei jedem Ergebnis.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem jeweiligen Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.

    Für die KI-Optimierung muss eine Chat-Modell-App installiert und im Router verfügbar sein. Ihre Anweisungen folgen dem H3-Leitfaden von MiniMax zum Schreiben von Prompts, in eigenen Worten formuliert.
  upgradeDescription: |
    Studio stellt die Verbindung im Hintergrund wieder her. Eine Warnung erscheint erst, wenn die Verbindung acht Sekunden lang unterbrochen ist. Nach der Wiederherstellung wird die Warteschlange aktualisiert. Während der Unterbrechung erstellte Videos lassen sich auch über mehrere Seiten hinweg ansehen. Die Warteschlange zeigt den Sampling-Fortschritt und die Verarbeitungszeit an, sofern verfügbar. Bei der Medienauswahl erscheinen Platzhalter, während die Vorschauen geladen werden.

    Wenn Sie eine Version für einzelne Benutzer installiert haben, deinstallieren Sie diese zuerst und installieren Sie anschließend diese gemeinsam genutzte Version.

    [Diese Version ansehen](https://github.com/beclab/flowstudio2/releases/tag/videofasth3studio/v0.1.22)
