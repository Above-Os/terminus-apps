apiVersion: v3

metadata:
  name: videofasth3studio
  appid: videofasth3studio
  title: "FastH3"
  description: "FastH3 runs MiniMax H3 in eight steps to make videos with sound from text, first and last frames, or reference images, video and audio"
  icon: https://cdn.olares.com/images/2026/11/bce44004af7ed295ec5f2febd21bf8da.png
  version: 0.1.23
