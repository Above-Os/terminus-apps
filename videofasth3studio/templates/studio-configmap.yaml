# The Studio front end, flat files as binaryData. Mounted as a directory
# (no subPath, no items) and left out of the Deployment's checksum, so a new
# front end reaches nginx without restarting the Pod (and ComfyUI's queue).
apiVersion: v1
kind: ConfigMap
metadata:
  name: videofasth3studio-studio
  namespace: {{ .Release.Namespace }}
binaryData:
  icon.svg: {{ .Files.Get "files/studio/icon.svg" | b64enc }}
  index-DbQwXKVf.js: {{ .Files.Get "files/studio/index-DbQwXKVf.js" | b64enc }}
  index.html: {{ .Files.Get "files/studio/index.html" | b64enc }}
  manifest.webmanifest: {{ .Files.Get "files/studio/manifest.webmanifest" | b64enc }}
  style-DjMSAVu9.css: {{ .Files.Get "files/studio/style-DjMSAVu9.css" | b64enc }}
  sw.js: {{ .Files.Get "files/studio/sw.js" | b64enc }}
