metadata:
  title: Hasura
  description: "Des API GraphQL temps réel instantanées et ultra-rapides sur votre BD avec un contrôle\
  \ d'accès fin ; déclenche également des webhooks sur les événements de base de données."
spec:
  upgradeDescription: |
    **Serveur**
     - Correction des spécifications OpenAPI non conformes générées lorsque la route utilisait des paramètres de chemin ou était une route GET avec paramètres.
     - Correction d'un bug dans la fonctionnalité expérimentale remove_empty_subscription_responses entraînant une erreur de requête de base de données pour les live queries ne renvoyant pas de tableaux.
     - Ignorer tout type de clé inconnu lors de l'analyse du JSON JWK-set : Autrefois, tout JWK dans la liste avec un champ use autre que sig ou enc provoquait une erreur. Désormais, ces clés non pertinentes sont silencieusement ignorées.
     - Définir JAVA_OPTS=-Dnet.snowflake.jdbc.enableBouncyCastle=true sur le super-connector inclus pour prendre en charge l'authentification par clé RSA. (Édition Enterprise uniquement)
    
    Corrections de bugs et améliorations
    
    Voir la note de version complète ici : https://github.com/hasura/graphql-engine/releases/tag/v2.48.4
  fullDescription: |
    **Secret admin par défaut :**
    qwer1234

    **Qu'est-ce que Hasura ?**
    Le moteur Hasura est un projet open source qui accélère la construction d'applications modernes en fournissant l'accès aux données via un unique point de terminaison d'API composable et sécurisé.

    **Accélérer le développement d'API**
    Avec une approche pilotée par les métadonnées, Hasura réduit le temps et l'effort nécessaires pour configurer et maintenir une API robuste (GraphQL, REST, etc.) sur vos données.
    Rationalisez chaque étape du cycle de vie de l'API pour livrer sans effort une couche d'accès qui débloque vos données.
    - Du domaine à l'API en quelques minutes
    - Évolution d'API sans effort
    - Performance maximale. Zéro effort.

    **API low-code pilotées par les métadonnées et le domaine**
    Connect — Hasura introspecte votre domaine et génère les métadonnées qui alimentent l'API. Ces métadonnées capturent la cartographie données-API et servent de plan entièrement personnalisable pour votre API.
    Query — À l'exécution, le moteur Hasura agit comme un compilateur qui traduit dynamiquement la requête API en la requête la plus efficace et compacte dans le « langage » compris par les sources de données upstream.

    **Une API incroyable pour toutes vos données.**
    Hasura génère une API standardisée et autodocumentée avec une composabilité incroyable. Recherchez, découvrez, comprenez et composez de façon flexible uniquement les données dont vous avez besoin en une seule fois — peu importe le domaine d'origine ou le mode de stockage.
    - Une composabilité exceptionnelle
    - Plus d'attente pour les fonctionnalités d'API
    - Visualisez, découvrez, explorez

    **Nous avons un connecteur pour ça**
    Avec un riche écosystème de connecteurs de données natifs open source, et la possibilité de construire les vôtres, obtenir une API puissante sur vos données, ou ajouter vos données à une API supergraph existante, est un pas.

    **Contrôle d'accès granulaire**
    Configurez des privilèges basés sur les rôles jusqu'au niveau du champ directement dans Hasura ou peuptez-les depuis votre système d'autorisation existant pour exposer l'API en toute sécurité aux développeurs à l'intérieur ou à l'extérieur de votre organisation.

    **Une expérience que les développeurs adoreront**
    Hasura s'intègre à vos workflows CI/CD existants, permettant aux développeurs de construire et d'itérer rapidement sur votre API — sans rien casser.

    **Fluidifier la collaboration entre équipes de domaine**
    Avec un modèle de gouvernance fédérée, plusieurs équipes de domaine peuvent construire et faire évoluer de façon collaborative l'API supergraph unifiée. Les équipes de domaine peuvent avancer avec autonomie et vitesse, tout en restant conformes aux normes de gouvernance centralisées.

    **Aucun angle mort**
    Anticipez les problèmes et améliorez continuellement votre API avec des données détaillées de performance, de tracing et d'utilisation

    **Continuité, assurée.**
    Hasura déploie instantanément l'API sur une infrastructure runtime serverless mondiale. Obtenez des garanties opérationnelles de fiabilité, de performance et d'échelle, sans le travail opérationnel.
