metadata:
  title: Hasura
  description: 細粒度のアクセス制御付きで DB 上に超高速・即時リアルタイム GraphQL API を提供し、データベースイベントで Webhook も発火
spec:
  upgradeDescription: |
    Hasura を 2.51.4 に更新し、テーブル権限編集、OpenAPI インポート、データベース再読み込みの表示を修正します。OpenTelemetry の SQL テキスト属性が `db.query.text` に変わります。`db.query` を参照する監視を更新してください。

    既存のインストールでは管理者シークレットを保持します。コンソールとAPIへのアクセスには、インストール時またはSettings > Applications > Hasura > Environment VariablesでHASURA_ADMIN_SECRETを設定してください。新規インストールでは共通の既定シークレットを使用せず、空欄の場合はランダムに生成します。変更後はAPIクライアントにも新しいシークレットを設定してください。

    リリースノート: https://github.com/Hasura/graphql-engine/releases/tag/v2.51.4

  fullDescription: |
    **コンソールとAPIへのアクセス：**
    インストール時またはSettings > Applications > Hasura > Environment VariablesでHASURA_ADMIN_SECRETを設定し、そのシークレットでログインしてください。新規インストールで空欄にするとランダムなシークレットが生成されるため、ログイン前にSettingsで独自の値を設定してください。既存のインストールでは、明示的に変更するまで現在のシークレットを保持します。

    **Hasura とは？**
    Hasura エンジンは、単一の構成可能で安全な API エンドポイント経由でデータアクセスを提供し、モダンアプリケーション構築を加速するオープンソースプロジェクトです。

    **API 開発を加速**
    メタデータ駆動のアプローチにより、Hasura はデータ上に堅牢な API（GraphQL、REST など）を構築・維持する時間と労力を大幅に削減します。
    API ライフサイクルの各ステップを合理化し、データを解き放つアクセス層を容易に届けます。
    - ドメインから API まで数分
    - 手間のない API 進化
    - 最高性能。ゼロ手間。

    **ローコード・メタデータ駆動・ドメイン駆動 API**
    Connect — Hasura がドメインをイントロスペクトし、API を駆動するメタデータを生成。このメタデータはデータ→API の対応を捉え、完全にカスタマイズ可能な設計図となります。
    Query — 実行時、Hasura エンジンはコンパイラのように振る舞い、API リクエストをアップストリームデータソースが理解する「言語」で最も効率的・コンパクトなクエリへ動的に変換します。

    **すべてのデータのための 1 つの驚異的な API。**
    Hasura は標準化され自己文書化された、驚異的な構成可能性を持つ API を生成します。データの出自ドメインや保存方法に関係なく、必要なデータだけを一度に検索・発見・理解・柔軟に構成できます。
    - 極めて優れた構成可能性
    - API 機能を待たない
    - 可視化、発見、探索

    **そのためのコネクタがあります**
    豊富なオープンソースネイティブデータコネクタのエコシステムと自作能力により、データ上に強力な API を得る、または既存のスーパーグラフ API にデータを追加するのは一歩です。

    **きめ細かいアクセス制御**
    Hasura 内でフィールドレベルまでロールベースの権限を設定するか、既存の認可システムから投入し、組織内外の開発者に安全に API を公開します。

    **開発者が愛する体験**
    Hasura は既存の CI/CD ワークフローに収まり、壊さずに API をすばやく構築・反復できます。

    **ドメインチーム間のコラボレーションを合理化**
    フェデレーテッドガバナンスモデルにより、複数のドメインチームが統一スーパーグラフ API を協働で構築・進化できます。ドメインチームは自律と速度で進みつつ、中央ガバナンス規範に準拠できます。

    **盲点なし**
    詳細なパフォーマンス、トレーシング、利用データで問題を先取りし、API を継続的に改善

    **継続性を確保。**
    Hasura はグローバルなサーバーレスランタイム基盤に API を即座にデプロイ。運用作業なしに、信頼性・性能・スケールの運用保証を得ます。
