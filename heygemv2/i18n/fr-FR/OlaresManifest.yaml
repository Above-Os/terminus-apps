metadata:
  title: Duix.Avatar
  description: Boîte à outils d'avatar IA (humain numérique) véritablement open source pour la génération vidéo hors ligne et le clonage d'humains numériques
spec:
  fullDescription: |
    Duix.Avatar (anciennement connu sous le nom de Heygem) est un outil de synthèse vidéo entièrement hors ligne conçu pour les systèmes Windows qui peut cloner précisément votre apparence et votre voix, numérisant votre image. Vous pouvez créer des vidéos en pilotant des avatars virtuels par le texte et la voix. Aucune connexion Internet n'est requise, protégeant votre vie privée tout en offrant des expériences numériques pratiques et efficaces.

    **Fonctionnalités principales**
    Clonage précis de l'apparence et de la voix : À l'aide d'algorithmes d'IA avancés, capture les traits du visage humain avec une haute précision, y compris les traits faciaux, les contours, etc., pour construire des modèles virtuels réalistes. Il peut aussi cloner précisément les voix, capturant et reproduisant les caractéristiques subtiles de la voix humaine, avec divers réglages de paramètres vocaux pour des effets de clonage très similaires.

    Avatars virtuels pilotés par le texte et la voix : Comprend le contenu textuel via le traitement du langage naturel, le convertissant en parole naturelle et fluide pour piloter les avatars virtuels. L'entrée vocale peut aussi être utilisée directement, permettant aux avatars d'effectuer des actions et des expressions faciales selon le rythme et l'intonation de la voix, rendant la performance plus naturelle et vivante.

    Synthèse vidéo efficace : Synchronise fortement les images vidéo de l'humain numérique avec le son, obtenant un lip-sync naturel et fluide, en optimisant intelligemment la synchronisation audio-vidéo.

    Prise en charge multilingue : Les scripts prennent en charge huit langues — anglais, japonais, coréen, chinois, français, allemand, arabe et espagnol.

    **Avantages clés**
    Fonctionnement entièrement hors ligne : Aucune connexion Internet requise, protégeant efficacement la vie privée et permettant de créer dans un environnement sécurisé et indépendant, en évitant d'éventuelles fuites de données lors de la transmission réseau.

    Convivial : Interface claire et intuitive, facile à utiliser même pour les débutants sans formation technique, maîtrisant rapidement le logiciel pour commencer leur création d'humains numériques.

    Prise en charge de plusieurs modèles : Prend en charge l'importation de plusieurs modèles et leur gestion via des packages de démarrage en un clic, facilitant le choix de modèles adaptés à différents besoins créatifs et scénarios d'application.

    **Support technique**
    Technologie de Voice Cloning : Utilise des technologies avancées comme l'intelligence artificielle pour générer des voix similaires ou identiques à partir d'échantillons vocaux donnés, couvrant le contexte, l'intonation, la vitesse et d'autres aspects de la parole.

    Reconnaissance automatique de la parole : Technologie qui convertit le contenu lexical de la parole humaine en entrée lisible par ordinateur (format texte), permettant aux ordinateurs de « comprendre » la parole humaine.

    Technologie de Computer Vision : Utilisée dans la synthèse vidéo pour le traitement visuel, y compris la reconnaissance faciale et l'analyse des mouvements des lèvres, garantissant que les mouvements des lèvres de l'avatar virtuel correspondent à la voix et au texte.
  upgradeDescription: |
    Mettre à niveau la version de l'app vers 1.0.6
    Le nom de projet original « HeyGem » a officiellement été changé en « Duix.Avatar ».
