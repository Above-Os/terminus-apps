metadata:
  title: Duix.Avatar
  description: Toolkit davvero open-source di avatar IA (umano digitale) per generazione video offline e clonazione di umani digitali
spec:
  fullDescription: |
    Duix.Avatar (precedentemente noto come Heygem) è uno strumento di sintesi video completamente offline progettato per sistemi Windows che può clonare con precisione il tuo aspetto e la tua voce, digitalizzando la tua immagine. Puoi creare video guidando avatar virtuali tramite testo e voce. Non è richiesta alcuna connessione Internet, proteggendo la tua privacy e offrendo al contempo esperienze digitali comode ed efficienti.

    **Funzionalità principali**
    Clonazione precisa di aspetto e voce: Utilizzando algoritmi IA avanzati cattura i tratti facciali umani con alta precisione, inclusi tratti del volto, contorni, ecc., per costruire modelli virtuali realistici. Può anche clonare le voci con precisione, catturando e riproducendo caratteristiche sottili della voce umana, con vari parametri vocali per effetti di clonazione molto simili.

    Avatar virtuali guidati da testo e voce: Comprende il contenuto testuale tramite elaborazione del linguaggio naturale, convertendolo in parlato naturale e fluido per guidare gli avatar virtuali. È possibile anche usare l'input vocale direttamente, consentendo agli avatar di eseguire azioni ed espressioni facciali in base al ritmo e all'intonazione della voce, rendendo la performance più naturale e vivida.

    Sintesi video efficiente: Sincronizza altamente le immagini video dell'umano digitale con il suono, ottenendo lip-sync naturale e fluido e ottimizzando intelligentemente la sincronizzazione audio-video.

    Supporto multilingue: Gli script supportano otto lingue — inglese, giapponese, coreano, cinese, francese, tedesco, arabo e spagnolo.

    **Vantaggi chiave**
    Funzionamento completamente offline: Nessuna connessione Internet richiesta, proteggendo efficacemente la privacy e consentendo di creare in un ambiente sicuro e indipendente, evitando potenziali fughe di dati durante la trasmissione di rete.

    Facile da usare: Interfaccia pulita e intuitiva, facile da usare anche per principianti senza background tecnico, padroneggiando rapidamente il software per iniziare il percorso di creazione di umani digitali.

    Supporto di più modelli: Supporta l'importazione di più modelli e la loro gestione tramite pacchetti di avvio con un clic, facilitando la scelta di modelli adatti a diverse esigenze creative e scenari applicativi.

    **Supporto tecnico**
    Tecnologia di Voice Cloning: Usa tecnologie avanzate come l'intelligenza artificiale per generare voci simili o identiche basate su campioni vocali dati, coprendo contesto, intonazione, velocità e altri aspetti del parlato.

    Riconoscimento automatico del parlato: Tecnologia che converte il contenuto lessicale del parlato umano in input leggibile dal computer (formato testo), consentendo ai computer di «comprendere» il parlato umano.

    Tecnologia di Computer Vision: Usata nella sintesi video per l'elaborazione visiva, inclusa il riconoscimento facciale e l'analisi del movimento labiale, assicurando che i movimenti labiali dell'avatar virtuale corrispondano a voce e testo.
  upgradeDescription: |
    Aggiornare la versione dell'app a 1.0.6
    Il nome originale del progetto «HeyGem» è stato ufficialmente cambiato in «Duix.Avatar».
