metadata:
  title: Duix.Avatar
  description: Kit de herramientas de avatar IA (humano digital) verdaderamente open-source para generación de vídeo offline y clonación de humanos digitales
spec:
  fullDescription: |
    Duix.Avatar (anteriormente conocido como Heygem) es una herramienta de síntesis de vídeo totalmente offline diseñada para sistemas Windows que puede clonar con precisión tu apariencia y voz, digitalizando tu imagen. Puedes crear vídeos impulsando avatares virtuales mediante texto y voz. No se requiere conexión a Internet, protegiendo tu privacidad mientras disfrutas de experiencias digitales convenientes y eficientes.

    **Funciones principales**
    Clonación precisa de apariencia y voz: Mediante algoritmos de IA avanzados captura rasgos faciales humanos con alta precisión, incluidos rasgos faciales, contornos, etc., para construir modelos virtuales realistas. También puede clonar voces con precisión, capturando y reproduciendo características sutiles de la voz humana, con diversos ajustes de parámetros de voz para efectos de clonación muy similares.

    Avatares virtuales impulsados por texto y voz: Comprende el contenido del texto mediante procesamiento de lenguaje natural, convirtiéndolo en habla natural y fluida para impulsar avatares virtuales. También se puede usar entrada de voz directamente, permitiendo que los avatares realicen acciones y expresiones faciales según el ritmo y la entonación de la voz, haciendo la actuación más natural y vivida.

    Síntesis de vídeo eficiente: Sincroniza altamente las imágenes de vídeo del humano digital con el sonido, logrando lip-sync natural y fluido, optimizando inteligentemente la sincronización audio-vídeo.

    Soporte multilingüe: Los guiones admiten ocho idiomas: inglés, japonés, coreano, chino, francés, alemán, árabe y español.

    **Ventajas clave**
    Funcionamiento totalmente offline: No se requiere Internet, protegiendo eficazmente la privacidad y permitiendo crear en un entorno seguro e independiente, evitando posibles fugas de datos en la transmisión de red.

    Fácil de usar: Interfaz limpia e intuitiva, fácil de usar incluso para principiantes sin formación técnica, dominando rápidamente el software para iniciar su creación de humanos digitales.

    Soporte de múltiples modelos: Admite importar múltiples modelos y gestionarlos mediante paquetes de inicio con un clic, facilitando elegir modelos adecuados según distintas necesidades creativas y escenarios de aplicación.

    **Soporte técnico**
    Tecnología de clonación de voz: Usa tecnologías avanzadas como IA para generar voces similares o idénticas a partir de muestras dadas, cubriendo contexto, entonación, velocidad y otros aspectos del habla.

    Reconocimiento automático del habla: Tecnología que convierte el contenido léxico del habla humana en entrada legible por ordenador (formato texto), permitiendo que los ordenadores «entiendan» el habla humana.

    Tecnología de visión por computador: Usada en la síntesis de vídeo para el procesamiento visual, incluyendo reconocimiento facial y análisis del movimiento labial, asegurando que los movimientos labiales del avatar virtual coincidan con la voz y el texto.
  upgradeDescription: |
    Actualizar la versión de la app a 1.0.6
    El nombre original del proyecto «HeyGem» ha pasado oficialmente a «Duix.Avatar».
