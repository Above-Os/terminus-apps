metadata:
  title: Duix.Avatar
  description: Wirklich Open-Source-KI-Avatar-(Digital Human)-Toolkit für Offline-Videogenerierung und Digital-Human-Klonen
spec:
  fullDescription: |
    Duix.Avatar (früher bekannt als Heygem) ist ein vollständig offline arbeitendes Videosynthese-Tool für Windows-Systeme, das Ihr Aussehen und Ihre Stimme präzise klonen und Ihr Bild digitalisieren kann. Sie können Videos erstellen, indem Sie virtuelle Avatare per Text und Stimme steuern. Keine Internetverbindung erforderlich — schützt Ihre Privatsphäre und bietet zugleich komfortable und effiziente digitale Erlebnisse.

    **Kernfunktionen**
    Präzises Aussehen- und Stimmenklonieren: Mit fortschrittlichen KI-Algorithmen werden menschliche Gesichtsmerkmale hochpräzise erfasst — einschließlich Gesichtszüge, Konturen usw. — um realistische virtuelle Modelle zu erstellen. Stimmen können ebenfalls präzise geklont werden, indem subtile Merkmale der menschlichen Stimme erfasst und reproduziert werden; verschiedene Stimmparameter ermöglichen hochähnliche Kloneffekte.

    Text- und stimmengetriebene virtuelle Avatare: Textinhalte werden per Natural Language Processing verstanden und in natürliche, flüssige Sprache umgewandelt, um virtuelle Avatare anzutreiben. Auch Direkteingabe per Stimme ist möglich, sodass Avatare anhand von Rhythmus und Intonation entsprechende Bewegungen und Gesichtsausdrücke ausführen — für natürlichere und lebendigere Darbietungen.

    Effiziente Videosynthese: Digitale Human-Videobilder werden hochgradig mit dem Ton synchronisiert, für natürliches und flüssiges Lippensyncing sowie intelligente Optimierung der Audio-Video-Synchronisation.

    Mehrsprachige Unterstützung: Skripte unterstützen acht Sprachen — Englisch, Japanisch, Koreanisch, Chinesisch, Französisch, Deutsch, Arabisch und Spanisch.

    **Zentrale Vorteile**
    Vollständig offline: Keine Internetverbindung erforderlich, schützt effektiv die Privatsphäre und ermöglicht kreatives Arbeiten in einer sicheren, unabhängigen Umgebung ohne potenzielle Datenlecks bei der Netzübertragung.

    Benutzerfreundlich: Klare und intuitive Oberfläche — auch ohne technischen Hintergrund schnell erlernbar, um die digitale Human-Erstellung zu starten.

    Mehrere Modelle: Import mehrerer Modelle und Verwaltung über One-Click-Startpakete, damit Nutzer passende Modelle für unterschiedliche kreative Anforderungen und Anwendungsszenarien wählen können.

    **Technische Unterstützung**
    Voice Cloning: Mit fortschrittlichen Technologien wie künstlicher Intelligenz werden ähnliche oder identische Stimmen aus gegebenen Samples erzeugt — inklusive Kontext, Intonation, Tempo und weiterer Sprachaspekte.

    Automatische Spracherkennung: Technologie, die menschliche Sprachinhalte in computerlesbaren Text umwandelt, sodass Computer menschliche Sprache „verstehen“ können.

    Computer Vision: Für die visuelle Verarbeitung in der Videosynthese, einschließlich Gesichtserkennung und Lippenbewegungsanalyse, damit Lippenbewegungen von virtuellen Avataren zu Stimme und Text passen.
  upgradeDescription: |
    App-Version auf 1.0.6 aktualisieren
    Der ursprüngliche Projektname „HeyGem“ wurde offiziell in „Duix.Avatar“ geändert.
