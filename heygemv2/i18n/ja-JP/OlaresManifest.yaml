metadata:
  title: Duix.Avatar
  description: オフライン動画生成とデジタルヒューマン複製向けの、真にオープンソースな AI アバター（デジタルヒューマン）ツールキット
spec:
  fullDescription: |
    Duix.Avatar（旧称 Heygem）は、Windows 向けに設計された完全オフラインの動画合成ツールで、外見と声を精密にクローンし、イメージをデジタル化できます。テキストと音声で仮想アバターを駆動して動画を作成できます。インターネット接続は不要で、プライバシーを守りつつ便利で効率的なデジタル体験を提供します。

    **コア機能**
    精密な外見・声クローン：高度な AI アルゴリズムで顔の特徴（五官、輪郭など）を高精度に捉え、リアルな仮想モデルを構築。声も精密にクローンし、人間の声の微妙な特性を再現。各種ボイスパラメータで高い類似性のクローン効果を実現。

    テキスト・音声駆動の仮想アバター：自然言語処理でテキストを理解し、自然で流暢な音声に変換して仮想アバターを駆動。音声入力も直接利用でき、リズムと抑揚に応じた動作・表情でより自然で生き生きとした演技を実現。

    効率的な動画合成：デジタルヒューマン映像と音声を高度に同期し、自然で滑らかなリップシンクと知能的な音映像同期最適化を実現。

    多言語対応：スクリプトは英語、日本語、韓国語、中国語、フランス語、ドイツ語、アラビア語、スペイン語の 8 言語に対応。

    **主な利点**
    完全オフライン動作：インターネット不要でプライバシーを効果的に保護し、安全で独立した環境で制作でき、ネットワーク伝送時のデータ漏洩リスクを回避。

    使いやすさ：クリーンで直感的な UI。技術背景がなくても初心者がすぐに習得し、デジタルヒューマン制作を始められる。

    複数モデル対応：複数モデルのインポートとワンクリック起動パッケージでの管理に対応し、創作ニーズや用途に応じたモデル選択が容易。

    **技術サポート**
    ボイスクローン技術：AI などの先進技術で、与えられた音声サンプルから類似または同一の声を生成。文脈、抑揚、速度など音声の諸側面をカバー。

    自動音声認識：人間の発話内容をコンピュータが読める入力（テキスト形式）に変換し、コンピュータが人間の発話を「理解」できるようにする技術。

    コンピュータビジョン技術：動画合成での視覚処理に使用。顔認識や口の動き解析を含み、仮想アバターの口の動きが声・テキストと一致するよう保証。
  upgradeDescription: |
    アプリバージョンを 1.0.6 へアップグレード
    元のプロジェクト名「HeyGem」は正式に「Duix.Avatar」へ変更されました。
