apiVersion: apps/v1
kind: Deployment
metadata:
  name: photocraft
  namespace: {{ .Release.Namespace }}
  labels:
    app: photocraft
spec:
  replicas: {{ .Values.workloads.photocraft.replicaCount }}
  selector:
    matchLabels:
      app: photocraft
  template:
    metadata:
      labels:
        app: photocraft
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: photocraft
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: photocraft-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: photocraft
spec:
  selector:
    app: photocraft
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
