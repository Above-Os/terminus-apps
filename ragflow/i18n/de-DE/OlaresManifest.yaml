metadata:
  title: RAGFlow
  description: Eine Open-Source-RAG-Engine basierend auf tiefem Dokumentverständnis.
spec:
  upgradeDescription: |
    v1.0.30: RAGFlow auf v0.26.4 aktualisieren (`docker.io/infiniflow/ragflow:v0.26.4`). Begleitimages unverändert (Infinity v0.7.0, Elasticsearch 8.11.3, MinIO, Valkey).

    Highlights seit v0.26.1
    - NLP: sprachbewusster Snowball-Stemmer (16 Sprachen), niederländische Tokenisierung.
    - Chat-Kanäle (v0.26.2): WhatsApp-, DingTalk-, WeCom-Integrationen.
    - Parsing (v0.26.3): SoMark OCR für komplexe Layouts; Ingest-documents-API; Batch-Upload mit Partial-Success-Handling.
    - Fixes (v0.26.4): LM-Studio-Modellnamen mit `@`, MCP list_chats-Paginierung, Docling-Matheformeln, Inline-Metadatenbearbeitung, Bulk-Datei-zu-Dataset-Verknüpfung, chinesischer Filter, Laws-Chunker-Überschriften und mehr.

    Vollständige Release Notes: https://github.com/infiniflow/ragflow/releases/tag/v0.26.4

    v1.0.29: `ELASTIC_PASSWORD`, `REDIS_PASSWORD` und `MINIO_PASSWORD` in ein Kubernetes Secret (`secretKeyRef`) verschieben.

    Speicher: dauerhafte Volumes (ragflow-Logs, infinity, minio, redis, elasticsearch) von `appCache` nach `appData`-Unterpfaden verschoben. Beim ersten Start nach dem Upgrade kopieren initContainers den Inhalt des alten appCache nach appData, wenn die Ziele leer sind (eindeutige Marker `.migration_from_appcache_*_done` pro Volume). Alte appCache-Daten bleiben für ein Rollback erhalten.

    LLM- und Embedding-Modelle nach Installation oder Upgrade in den RAGFlow-Einstellungen konfigurieren.
  fullDescription: |
    Was ist RAGFlow?
    RAGFlow ist eine Open-Source-RAG-Engine (Retrieval-Augmented Generation) basierend auf tiefem Dokumentverständnis. Sie bietet einen schlanken RAG-Workflow für Unternehmen jeder Größe und kombiniert LLM (Large Language Models), um wahrheitsgemäße Frage-Antwort-Fähigkeiten zu liefern, gestützt durch fundierte Zitate aus verschiedenen komplex formatierten Daten.

    **Schlüsselfunktionen**
    „Quality in, quality out“
    - Wissens extraktion basierend auf tiefem Dokumentverständnis aus unstrukturierten Daten mit komplizierten Formaten.
    - Findet die „Nadel im Heuhaufen“ bei buchstäblich unbegrenzt vielen Tokens.

    Template-basiertes Chunking
    - Intelligent und erklärbar.
    - Viele Template-Optionen zur Auswahl.

    Fundierte Zitate mit weniger Halluzinationen
    - Visualisierung des Text-Chunkings für menschliche Eingriffe.
    - Schnellansicht der wichtigsten Referenzen und nachvollziehbare Zitate für fundierte Antworten.

    Kompatibilität mit heterogenen Datenquellen
    - Unterstützt Word, Folien, Excel, txt, Bilder, Scans, strukturierte Daten, Webseiten und mehr.

    Automatisierter und müheloser RAG-Workflow
    - Schlanke RAG-Orchestrierung für Privatpersonen und große Unternehmen.
    - Konfigurierbare LLMs sowie Embedding-Modelle.
    - Multiple Recall kombiniert mit fused Re-Ranking.
    - Intuitive APIs für nahtlose Integration in das Geschäft.
