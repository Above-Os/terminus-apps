metadata:
  title: RAGFlow
  description: Un moteur RAG open source basé sur une compréhension approfondie des documents.
spec:
  upgradeDescription: |
    v1.0.30 : Mettre à niveau RAGFlow vers v0.26.4 (`docker.io/infiniflow/ragflow:v0.26.4`). Images compagnons inchangées (Infinity v0.7.0, Elasticsearch 8.11.3, MinIO, Valkey).

    Points forts depuis v0.26.1
    - NLP : stemmer Snowball sensible à la langue (16 langues), prise en charge de la tokenisation néerlandaise.
    - Canaux de chat (v0.26.2) : intégrations WhatsApp, DingTalk, WeCom.
    - Parsing (v0.26.3) : SoMark OCR pour mises en page complexes ; API Ingest documents ; gestion du succès partiel en téléversement par lots.
    - Correctifs (v0.26.4) : noms de modèles LM-Studio avec `@`, pagination MCP list_chats, formules mathématiques Docling, édition inline des métadonnées, liaison en masse fichier-vers-dataset, filtre chinois, titres Laws chunker, et plus.

    Note de version complète : https://github.com/infiniflow/ragflow/releases/tag/v0.26.4

    v1.0.29 : Déplacer `ELASTIC_PASSWORD`, `REDIS_PASSWORD` et `MINIO_PASSWORD` dans un Secret Kubernetes (`secretKeyRef`).

    Stockage : volumes durables (logs ragflow, infinity, minio, redis, elasticsearch) déplacés de `appCache` vers des sous-chemins `appData`. Au premier démarrage après la mise à niveau, les initContainers copient le contenu legacy d'appCache vers appData lorsque les destinations sont vides (marqueurs uniques `.migration_from_appcache_*_done` par volume). Les anciennes données appCache sont conservées pour un rollback.

    Configurez les modèles LLM et d'embedding dans les paramètres RAGFlow après l'installation ou la mise à niveau.
  fullDescription: |
    Qu'est-ce que RAGFlow ?
    RAGFlow est un moteur RAG (Retrieval-Augmented Generation) open source basé sur une compréhension approfondie des documents. Il offre un flux de travail RAG allégé pour les entreprises de toute taille, combinant des LLM (Large Language Models) pour fournir des capacités de questions-réponses véridiques, étayées par des citations bien fondées à partir de données aux formats complexes.

    **Fonctionnalités clés**
    « Quality in, quality out »
    - Extraction de connaissances basée sur une compréhension approfondie des documents à partir de données non structurées aux formats complexes.
    - Trouve l'« aiguille dans une botte de foin » de données avec des jetons littéralement illimités.

    Chunking basé sur des modèles
    - Intelligent et explicable.
    - De nombreuses options de modèles parmi lesquelles choisir.

    Citations fondées avec moins d'hallucinations
    - Visualisation du chunking de texte pour permettre une intervention humaine.
    - Vue rapide des références clés et citations traçables pour étayer des réponses fondées.

    Compatibilité avec des sources de données hétérogènes
    - Prend en charge Word, diapositives, excel, txt, images, copies numérisées, données structurées, pages web, et plus.

    Flux de travail RAG automatisé et sans effort
    - Orchestration RAG allégée adaptée aux particuliers comme aux grandes entreprises.
    - LLM configurables ainsi que modèles d'embedding.
    - Multiple recall associé à un re-ranking fusionné.
    - API intuitives pour une intégration fluide avec l'entreprise.
