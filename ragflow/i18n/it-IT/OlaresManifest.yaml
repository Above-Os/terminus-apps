metadata:
  title: RAGFlow
  description: Un motore RAG open source basato sulla comprensione approfondita dei documenti
spec:
  upgradeDescription: |
    v1.0.30: Aggiorna RAGFlow a v0.26.4 (`docker.io/infiniflow/ragflow:v0.26.4`). Immagini companion invariate (Infinity v0.7.0, Elasticsearch 8.11.3, MinIO, Valkey).

    Highlight da v0.26.1
    - NLP: stemmer Snowball language-aware (16 lingue), supporto tokenizzazione olandese.
    - Canali chat (v0.26.2): integrazioni WhatsApp, DingTalk, WeCom.
    - Parsing (v0.26.3): SoMark OCR per layout complessi; API Ingest documents; gestione successo parziale nell'upload batch.
    - Fix (v0.26.4): nomi modello LM-Studio con `@`, paginazione MCP list_chats, formule matematiche Docling, modifica inline dei metadati, collegamento bulk file-to-dataset, filtro cinese, intestazioni Laws chunker e altro.

    Nota di rilascio completa: https://github.com/infiniflow/ragflow/releases/tag/v0.26.4

    v1.0.29: Sposta `ELASTIC_PASSWORD`, `REDIS_PASSWORD` e `MINIO_PASSWORD` in un Secret Kubernetes (`secretKeyRef`).

    Storage: volumi durevoli (log ragflow, infinity, minio, redis, elasticsearch) spostati da `appCache` a sottopercorsi `appData`. Al primo avvio dopo l'upgrade, gli initContainers copiano i contenuti legacy di appCache in appData quando le destinazioni sono vuote (marker unici `.migration_from_appcache_*_done` per volume). I vecchi dati appCache restano intatti per il rollback.

    Configura i modelli LLM e di embedding nelle impostazioni di RAGFlow dopo l'installazione o l'upgrade.
  fullDescription: |
    Cos'è RAGFlow?
    RAGFlow è un motore RAG (Retrieval-Augmented Generation) open source basato sulla comprensione approfondita dei documenti. Offre un flusso di lavoro RAG snello per aziende di qualsiasi dimensione, combinando LLM (Large Language Models) per fornire capacità di domanda-risposta veritiere, supportate da citazioni ben fondate da dati in formati complessi.

    **Funzionalità chiave**
    «Quality in, quality out»
    - Estrazione di conoscenza basata sulla comprensione approfondita dei documenti da dati non strutturati con formati complicati.
    - Trova l'«ago nel pagliaio» di dati con token letteralmente illimitati.

    Chunking basato su template
    - Intelligente e spiegabile.
    - Molte opzioni di template tra cui scegliere.

    Citazioni fondate con meno allucinazioni
    - Visualizzazione del chunking del testo per consentire l'intervento umano.
    - Vista rapida dei riferimenti chiave e citazioni tracciabili a supporto di risposte fondate.

    Compatibilità con fonti di dati eterogenee
    - Supporta Word, slide, excel, txt, immagini, copie scansionate, dati strutturati, pagine web e altro.

    Flusso di lavoro RAG automatizzato e senza sforzo
    - Orchestrazione RAG snella per privati e grandi aziende.
    - LLM configurabili nonché modelli di embedding.
    - Multiple recall abbinato a fused re-ranking.
    - API intuitive per un'integrazione senza soluzione di continuità con il business.
