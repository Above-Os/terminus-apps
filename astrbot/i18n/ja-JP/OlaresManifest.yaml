metadata:
  title: AstrBot
  description: 使いやすいマルチプラットフォーム LLM チャットボット＆開発フレームワーク
spec:
  fullDescription: |
    **デフォルト認証情報**
    ユーザー名: astrbot
    パスワード: インストール時に `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` で設定（最低 8 文字、大文字・小文字・数字を含む）。初回ログイン後に変更してください。

    **概要**
    AstrBot は、マルチプラットフォーム展開に対応した疎結合・非同期のチャットボット兼開発フレームワークで、使いやすいプラグインシステムと包括的な大規模言語モデル（LLM）統合を備えています。

    **主な機能**
    LLM 会話
    - OpenAI API、Google Gemini、Llama、Deepseek、ChatGLM など各種 LLM に対応。Ollama/LLMTuner によるローカルモデル展開も可能。マルチターン対話、人格コンテキスト、マルチモーダル（画像理解）、音声認識（Whisper）に対応。

    マルチプラットフォーム統合
    - QQ（OneBot）、QQ チャンネル、WeChat（Gewechat）、Feishu、Telegram に対応。DingTalk、Discord、WhatsApp、Xiaomi スマートスピーカーも予定。レート制限、ホワイトリスト、キーワードフィルタ、Baidu コンテンツ審査を含む。

    エージェント機能
    - コード実行、自然言語 TODO リスト、Web 検索をネイティブサポート。Dify Platform と連携し、Dify アシスタント／ナレッジベース／ワークフローへ容易にアクセス。

    プラグインシステム
    - 開発負荷を抑えた最適化されたプラグイン機構。複数プラグインのインストールに対応。

    Web ダッシュボード
    - 設定の可視化管理、プラグイン制御、ログ、LLM と直接対話する WebChat インターフェース。

    高い安定性とモジュール性
    - イベントバスとパイプラインアーキテクチャにより高いモジュール化と疎結合を実現。
  upgradeDescription: |
    v1.0.11: `ASTRBOT_RESET_DASHBOARD_PASSWORD` を Kubernetes Secret（`secretKeyRef`）へ移動。

    AstrBot を 4.26.6 へアップグレードし、インストール時ダッシュボードパスワードに対応。

    **バージョンアップグレード（chart 1.0.8 → 1.0.9、アプリ 3.5.26 → 4.26.6）**

    **デプロイ変更**
    - イメージを `beclab/soulter-astrbot:v3.5.26` から公式 `soulter/astrbot:v4.26.6` へ更新
    - レガシー Olares `<1.12.3` hostPath 分岐を削除; パスは常に現行 appData レイアウト（Olares >= 1.12.6）
    - 必須 env `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` と任意 `ASTRBOT_RESET_DASHBOARD_PASSWORD` を追加
    - 起動ブートストラップが `password_change_required=false` でインストールパスワードを適用し、ログイン後の再変更を強制しない

    **重要な注意**
    - パスワード方針: 最低 8 文字、大文字・小文字・数字を含む
    - ユーザー名は引き続き `astrbot`
    - 次回起動でインストールパスワードを再適用するには、一度 `ASTRBOT_RESET_DASHBOARD_PASSWORD=true` を設定

    リリースノート全文: https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.26.6
