metadata:
  title: AstrBot
  description: Einfach zu bedienender Multi-Plattform-LLM-Chatbot & Entwicklungsframework
spec:
  fullDescription: |
    **Standard-Anmeldedaten**
    Benutzername: astrbot
    Passwort: wird bei der Installation über `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` gesetzt (min. 8 Zeichen, muss Groß- und Kleinbuchstaben sowie eine Ziffer enthalten). Nach dem ersten Login ändern.

    **Überblick**
    AstrBot ist ein lose gekoppeltes, asynchrones Chatbot- und Entwicklungsframework mit Multi-Plattform-Deployment, einem einfach nutzbaren Plugin-System und umfassender Large-Language-Model-(LLM)-Integration.

    **Hauptfunktionen**
    LLM-Gespräche
    - Unterstützt verschiedene LLMs einschließlich OpenAI API, Google Gemini, Llama, Deepseek, ChatGLM usw. Ermöglicht lokales Modell-Deployment via Ollama/LLMTuner. Multi-Turn-Dialoge, Persönlichkeitskontexte, multimodale Fähigkeiten (Bildverständnis) und Speech-to-Text (Whisper).

    Multi-Plattform-Integration
    - Unterstützt QQ (OneBot), QQ Channels, WeChat (Gewechat), Feishu und Telegram. Geplant: DingTalk, Discord, WhatsApp und Xiaomi Smart Speakers. Rate Limiting, Whitelisting, Keyword-Filterung und Baidu Content Moderation.

    Agent-Fähigkeiten
    - Native Unterstützung für Codeausführung, natürlichsprachliche TODO-Listen, Websuche. Integration mit der Dify Platform für einfachen Zugriff auf Dify-Assistenten/Wissensbasen/Workflows.

    Plugin-System
    - Optimierter Plugin-Mechanismus mit minimalem Entwicklungsaufwand. Mehrere installierte Plugins möglich.

    Web-Dashboard
    - Visuelle Konfigurationsverwaltung, Plugin-Steuerung, Logging und WebChat-Oberfläche für direkte LLM-Interaktion.

    Hohe Stabilität & Modularität
    - Event-Bus und Pipeline-Architektur sorgen für hohe Modularisierung und lose Kopplung.
  upgradeDescription: |
    v1.0.11: `ASTRBOT_RESET_DASHBOARD_PASSWORD` in Kubernetes Secret (`secretKeyRef`) verschoben.

    AstrBot auf 4.26.6 mit Install-Zeit-Dashboard-Passwort-Unterstützung aktualisiert.

    **Versions-Upgrade (Chart 1.0.8 → 1.0.9, App 3.5.26 → 4.26.6)**

    **Bereitstellungsänderungen**
    - Image von `beclab/soulter-astrbot:v3.5.26` auf offizielles `soulter/astrbot:v4.26.6` aktualisiert
    - Legacy-Olares-`<1.12.3`-hostPath-Zweige entfernt; Pfade nutzen immer das aktuelle appData-Layout (Olares >= 1.12.6)
    - Erforderliche Env `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` und optionale `ASTRBOT_RESET_DASHBOARD_PASSWORD` hinzugefügt
    - Startup-Bootstrap setzt das Install-Passwort mit `password_change_required=false`, sodass Login keinen zweiten Passwortwechsel erzwingt

    **Wichtige Hinweise**
    - Passwortrichtlinie: mindestens 8 Zeichen, mit Groß-, Kleinbuchstaben und einer Ziffer
    - Benutzername bleibt `astrbot`
    - Einmal `ASTRBOT_RESET_DASHBOARD_PASSWORD=true` setzen, um das Install-Passwort beim nächsten Start erneut anzuwenden

    Vollständige Release Notes: https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.26.6
