metadata:
  title: AstrBot
  description: Chatbot LLM multipplataforma y framework de desarrollo fáciles de usar
spec:
  fullDescription: |
    **Credenciales predeterminadas**
    Usuario: astrbot
    Contraseña: se define en la instalación mediante `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` (mín. 8 caracteres, con mayúscula, minúscula y un dígito). Cámbiela tras el primer inicio de sesión.

    **Resumen**
    AstrBot es un chatbot y framework de desarrollo asíncrono y débilmente acoplado con despliegue multipplataforma, un sistema de plugins fácil de usar e integración completa de Large Language Models (LLM).

    **Características principales**
    Conversaciones LLM
    - Compatible con varios LLM, incluidos OpenAI API, Google Gemini, Llama, Deepseek, ChatGLM, etc. Permite despliegue local vía Ollama/LLMTuner. Diálogos multi-turno, contextos de personalidad, capacidades multimodales (comprensión de imágenes) y speech-to-text (Whisper).

    Integración multipplataforma
    - Compatible con QQ (OneBot), QQ Channels, WeChat (Gewechat), Feishu y Telegram. Planificado: DingTalk, Discord, WhatsApp y altavoces Xiaomi. Incluye rate limiting, listas blancas, filtrado por palabras clave y moderación Baidu.

    Capacidades de agente
    - Soporte nativo de ejecución de código, listas TODO en lenguaje natural y búsqueda web. Integración con Dify Platform para acceder a asistentes/bases de conocimiento/flujos de Dify.

    Sistema de plugins
    - Mecanismo de plugins optimizado con mínimo esfuerzo de desarrollo. Varios plugins instalados.

    Panel web
    - Gestión visual de configuración, control de plugins, registro y WebChat para interactuar directamente con el LLM.

    Alta estabilidad y modularidad
    - Arquitectura de bus de eventos y pipeline garantiza alta modularización y acoplamiento débil.
  upgradeDescription: |
    v1.0.11: Mover `ASTRBOT_RESET_DASHBOARD_PASSWORD` a un Kubernetes Secret (`secretKeyRef`).

    Actualizar AstrBot a 4.26.6 con soporte de contraseña del panel en la instalación.

    **Actualización de versión (chart 1.0.8 → 1.0.9, app 3.5.26 → 4.26.6)**

    **Cambios de despliegue**
    - Imagen actualizada de `beclab/soulter-astrbot:v3.5.26` a la oficial `soulter/astrbot:v4.26.6`
    - Eliminadas ramas hostPath legacy de Olares `<1.12.3`; las rutas usan siempre el layout appData actual (Olares >= 1.12.6)
    - Añadidas la env requerida `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` y la opcional `ASTRBOT_RESET_DASHBOARD_PASSWORD`
    - El bootstrap de arranque aplica la contraseña de instalación con `password_change_required=false`, así el login no fuerza un segundo cambio

    **Notas importantes**
    - Política de contraseña: al menos 8 caracteres, con mayúscula, minúscula y un dígito
    - El usuario sigue siendo `astrbot`
    - Establezca `ASTRBOT_RESET_DASHBOARD_PASSWORD=true` una vez para reaplicar la contraseña de instalación en el siguiente arranque

    Notas de la versión completas: https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.26.6
