metadata:
  title: AstrBot
  description: Chatbot LLM multipiattaforma e framework di sviluppo facili da usare
spec:
  fullDescription: |
    **Credenziali predefinite**
    Nome utente: astrbot
    Password: impostata in installazione tramite `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` (min. 8 caratteri, con maiuscola, minuscola e una cifra). Cambiarla dopo il primo accesso.

    **Panoramica**
    AstrBot è un chatbot e framework di sviluppo asincrono e debolmente accoppiato con deployment multipiattaforma, un sistema di plugin facile da usare e integrazione completa di Large Language Model (LLM).

    **Funzionalità principali**
    Conversazioni LLM
    - Supporta vari LLM tra cui OpenAI API, Google Gemini, Llama, Deepseek, ChatGLM, ecc. Consente il deployment locale via Ollama/LLMTuner. Dialoghi multi-turno, contesti di personalità, capacità multimodali (comprensione immagini) e speech-to-text (Whisper).

    Integrazione multipiattaforma
    - Supporta QQ (OneBot), QQ Channels, WeChat (Gewechat), Feishu e Telegram. Pianificato: DingTalk, Discord, WhatsApp e Xiaomi Smart Speakers. Include rate limiting, whitelist, filtro parole chiave e moderazione Baidu.

    Capacità Agent
    - Supporto nativo per esecuzione codice, liste TODO in linguaggio naturale, ricerca web. Integrazione con Dify Platform per accedere ad assistenti/knowledge base/workflow Dify.

    Sistema di plugin
    - Meccanismo plugin ottimizzato con minimo sforzo di sviluppo. Supporta più plugin installati.

    Dashboard Web
    - Gestione configurazione visuale, controlli plugin, logging e interfaccia WebChat per interazione diretta con l'LLM.

    Alta stabilità e modularità
    - Architettura event bus e pipeline garantisce alta modularizzazione e basso accoppiamento.
  upgradeDescription: |
    v1.0.11: Spostare `ASTRBOT_RESET_DASHBOARD_PASSWORD` in un Kubernetes Secret (`secretKeyRef`).

    Aggiornare AstrBot a 4.26.6 con supporto password dashboard in installazione.

    **Upgrade di versione (chart 1.0.8 → 1.0.9, app 3.5.26 → 4.26.6)**

    **Modifiche al deployment**
    - Immagine aggiornata da `beclab/soulter-astrbot:v3.5.26` all'ufficiale `soulter/astrbot:v4.26.6`
    - Rimosse le branche hostPath legacy Olares `<1.12.3`; i percorsi usano sempre il layout appData attuale (Olares >= 1.12.6)
    - Aggiunte l'env obbligatoria `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` e l'opzionale `ASTRBOT_RESET_DASHBOARD_PASSWORD`
    - Il bootstrap di avvio applica la password di installazione con `password_change_required=false`, così il login non forza un secondo cambio

    **Note importanti**
    - Policy password: almeno 8 caratteri, con maiuscola, minuscola e una cifra
    - Il nome utente resta `astrbot`
    - Impostare una volta `ASTRBOT_RESET_DASHBOARD_PASSWORD=true` per riapplicare la password di installazione al prossimo avvio

    Note di rilascio complete: https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.26.6
