metadata:
  title: AstrBot
  description: Chatbot LLM multiplateforme et framework de développement faciles à utiliser
spec:
  fullDescription: |
    **Identifiants par défaut**
    Nom d'utilisateur : astrbot
    Mot de passe : défini à l'installation via `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` (min. 8 caractères, majuscule, minuscule et un chiffre). À changer après la première connexion.

    **Aperçu**
    AstrBot est un chatbot et framework de développement asynchrone faiblement couplé avec déploiement multiplateforme, un système de plugins facile à utiliser et une intégration complète des Large Language Models (LLM).

    **Fonctionnalités clés**
    Conversations LLM
    - Prend en charge divers LLM dont OpenAI API, Google Gemini, Llama, Deepseek, ChatGLM, etc. Permet le déploiement local via Ollama/LLMTuner. Dialogues multi-tours, contextes de personnalité, capacités multimodales (compréhension d'images) et speech-to-text (Whisper).

    Intégration multiplateforme
    - Prend en charge QQ (OneBot), QQ Channels, WeChat (Gewechat), Feishu et Telegram. Prévu : DingTalk, Discord, WhatsApp et enceintes Xiaomi. Inclut rate limiting, listes blanches, filtrage par mots-clés et modération Baidu.

    Capacités d'agent
    - Support natif de l'exécution de code, listes TODO en langage naturel, recherche web. Intégration avec Dify Platform pour accéder aux assistants/bases de connaissances/workflows Dify.

    Système de plugins
    - Mécanisme de plugins optimisé avec un effort de développement minimal. Plusieurs plugins installés possibles.

    Tableau de bord web
    - Gestion visuelle de la configuration, contrôles des plugins, journalisation et interface WebChat pour interagir directement avec le LLM.

    Haute stabilité et modularité
    - Architecture bus d'événements et pipeline garantit une forte modularisation et un faible couplage.
  upgradeDescription: |
    v1.0.11 : Déplacer `ASTRBOT_RESET_DASHBOARD_PASSWORD` dans un Kubernetes Secret (`secretKeyRef`).

    Mise à niveau d'AstrBot vers 4.26.6 avec prise en charge du mot de passe du tableau de bord à l'installation.

    **Mise à niveau de version (chart 1.0.8 → 1.0.9, app 3.5.26 → 4.26.6)**

    **Changements de déploiement**
    - Image mise à jour de `beclab/soulter-astrbot:v3.5.26` vers l'officielle `soulter/astrbot:v4.26.6`
    - Branches hostPath legacy Olares `<1.12.3` supprimées ; les chemins utilisent toujours le layout appData actuel (Olares >= 1.12.6)
    - Ajout de l'env requise `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` et de l'optionnelle `ASTRBOT_RESET_DASHBOARD_PASSWORD`
    - Le bootstrap de démarrage applique le mot de passe d'installation avec `password_change_required=false`, ainsi la connexion n'impose plus un second changement

    **Notes importantes**
    - Politique de mot de passe : au moins 8 caractères, avec majuscule, minuscule et un chiffre
    - Le nom d'utilisateur reste `astrbot`
    - Définir une fois `ASTRBOT_RESET_DASHBOARD_PASSWORD=true` pour réappliquer le mot de passe d'installation au prochain démarrage

    Notes de version complètes : https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.26.6
