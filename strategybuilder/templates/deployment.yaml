apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategybuilder
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: strategybuilder
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  replicas: {{ .Values.workloads.strategybuilder.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: strategybuilder
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strategybuilder
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      containers:
        - name: strategybuilder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: APP_NAME
              value: {{ .Values.app.name | quote }}
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: STRATEGY_OUTPUT_DIR
              value: {{ .Values.app.outputDir | quote }}
            - name: STRATEGY_BUILDER_ROOTS
              value: {{ .Values.app.roots | quote }}
            - name: STRATEGY_BUILDER_CUSTOM_OUTPUT_BASE
              value: "/app/data"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.targetPort }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.targetPort }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: strategybuilder-data
              mountPath: /app/data
      restartPolicy: Always
      volumes:
        - name: strategybuilder-data
          hostPath:
            path: '{{ .Values.userspace.appData | default "/tmp/strategybuilderdata" }}'
            type: DirectoryOrCreate
