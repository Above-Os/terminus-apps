metadata:
  title: Strategy Builder
  description: "通过可视化构建和 AI 论文分析，设计、检查并导出 Freqtrade 策略草稿。"
spec:
  fullDescription: |
    以本地优先的引导式流程设计兼容 Freqtrade 的策略草稿。

    - 95 个策略模板，包含 20 个文献启发策略。
    - 引导式构建、自组策略工作室与 Puzzle Builder Pro。
    - 使用 Strategy Doctor 检查策略草稿。
    - 使用自己的服务商 API 密钥进行 AI 论文分析。
    - 策略库支持版本管理、对比、报告和 ZIP 导出。

    应用界面支持英语和简体中文；不执行回测、不连接交易所、不执行交易。
