metadata:
  title: Strategy Builder
  description: "Diseña, revisa y exporta borradores de estrategias Freqtrade con herramientas visuales y análisis de artículos mediante IA."
spec:
  fullDescription: |
    Crea borradores compatibles con Freqtrade mediante un flujo guiado que prioriza el uso local.

    - 95 plantillas, incluidas 20 estrategias inspiradas en publicaciones.
    - Guided Builder, Self-Build Studio y Puzzle Builder Pro.
    - Revisión de borradores con Strategy Doctor.
    - AI Paper Lab con tu propia clave API de un proveedor compatible.
    - Biblioteca con versiones, comparaciones, informes y exportación ZIP.

    La interfaz admite inglés y chino simplificado. No ejecuta backtests ni operaciones y no se conecta a exchanges.
