metadata:
  title: Strategy Builder
  description: "Concevez, vérifiez et exportez des ébauches de stratégies Freqtrade avec des outils visuels et une analyse de publications par IA."
spec:
  fullDescription: |
    Créez des ébauches compatibles avec Freqtrade grâce à un parcours guidé privilégiant le stockage local.

    - 95 modèles, dont 20 stratégies inspirées de publications.
    - Guided Builder, Self-Build Studio et Puzzle Builder Pro.
    - Vérification des ébauches avec Strategy Doctor.
    - AI Paper Lab avec votre propre clé API auprès d’un fournisseur compatible.
    - Bibliothèque avec versions, comparaisons, rapports et export ZIP.

    L’interface est disponible en anglais et en chinois simplifié. L’application ne réalise ni backtests ni transactions et ne se connecte pas aux plateformes d’échange.
