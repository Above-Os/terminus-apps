metadata:
  title: Strategy Builder
  description: "Progetta, verifica ed esporta bozze di strategie Freqtrade con strumenti visivi e analisi di pubblicazioni tramite IA."
spec:
  fullDescription: |
    Crea bozze compatibili con Freqtrade con un flusso guidato che privilegia i dati locali.

    - 95 modelli, incluse 20 strategie ispirate alla letteratura.
    - Guided Builder, Self-Build Studio e Puzzle Builder Pro.
    - Verifica delle bozze con Strategy Doctor.
    - AI Paper Lab con la tua chiave API di un fornitore supportato.
    - Libreria con versioni, confronti, report ed esportazione ZIP.

    L’interfaccia supporta inglese e cinese semplificato. Non esegue backtest o operazioni e non si collega agli exchange.
