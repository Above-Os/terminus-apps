metadata:
  title: Strategy Builder
  description: "Freqtrade-Strategieentwürfe visuell erstellen, prüfen und exportieren, mit KI-gestützter Papieranalyse."
spec:
  fullDescription: |
    Freqtrade-kompatible Strategieentwürfe mit einem geführten, lokal ausgerichteten Ablauf erstellen.

    - 95 Vorlagen, darunter 20 literaturbasierte Strategien.
    - Guided Builder, Self-Build Studio und Puzzle Builder Pro.
    - Strategieentwürfe mit Strategy Doctor prüfen.
    - AI Paper Lab mit einem eigenen API-Schlüssel eines unterstützten Anbieters.
    - Strategiebibliothek mit Versionierung, Vergleichen, Berichten und ZIP-Export.

    Die Anwendung unterstützt Englisch und vereinfachtes Chinesisch. Sie führt keine Backtests oder Trades aus und verbindet sich nicht mit Börsen.
