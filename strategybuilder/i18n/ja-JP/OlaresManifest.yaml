metadata:
  title: Strategy Builder
  description: "ビジュアル構築と AI 論文分析で Freqtrade 戦略の草案を設計、確認、エクスポートします。"
spec:
  fullDescription: |
    ローカルデータを重視したガイド付きの手順で、Freqtrade 対応の戦略草案を作成します。

    - 文献を参考にした 20 種類を含む 95 種類のテンプレート。
    - Guided Builder、Self-Build Studio、Puzzle Builder Pro。
    - Strategy Doctor による戦略草案の確認。
    - 対応プロバイダーの API キーを使う AI Paper Lab。
    - バージョン管理、比較、レポート、ZIP 出力に対応した戦略ライブラリ。

    アプリの画面は英語と簡体字中国語に対応しています。バックテストや取引は実行せず、取引所にも接続しません。
