workloadReplicas:
  strategybuilder: 1
metadata:
  name: strategybuilder
  appid: strategybuilder
  version: 1.2.20
  title: Strategy Builder
  description: A guided Freqtrade strategy builder with literature strategies, visual construction, AI paper analysis, and safe export workflow.
  icon: https://cdn.olares.com/images/2026/09/3802dbda20b53d4f60bd40940f7f89a5.png
  categories:
  - Developer Tools
  - developer
  - Productivity_v112
  - workspace
entrances:
- name: strategybuilder
  host: strategybuilder
  port: 8010
  title: Strategy Builder
  icon: https://cdn.olares.com/images/2026/09/3802dbda20b53d4f60bd40940f7f89a5.png
  authLevel: private
  openMethod: default
permission:
  appData: true
spec:
  versionName: 1.2.20
  featuredImage: https://cdn.olares.com/images/2026/09/87595658e9ced4c55b43a8d198996cbd.png
  promoteImage:
  - https://cdn.olares.com/images/2026/09/87595658e9ced4c55b43a8d198996cbd.png
  - https://cdn.olares.com/images/2026/09/e63160ddbfa2a58d5081b6b2c1854668.png
  developer: Strategy Builder
  website: https://github.com/leolianger/strategybuilder
  sourceCode: https://github.com/leolianger/strategybuilder
  doc: https://github.com/leolianger/strategybuilder#readme
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  fullDescription: |
    Design Freqtrade-compatible strategy drafts with a guided, local-first workflow.

    - 95 templates, including 20 literature-inspired strategies.
    - Guided Builder, Self-Build Studio, and Puzzle Builder Pro.
    - Strategy Doctor for reviewing strategy drafts.
    - AI Paper Lab with your own supported provider API key.
    - Strategy Library with versioning, comparisons, reports, and ZIP export.

    The application interface supports English and Simplified Chinese. It does not run backtests, connect to exchanges, or execute trades.

  supportArch:
  - amd64
  - arm64
  limitedCpu: 1000m
  limitedMemory: 768Mi
  requiredCpu: 100m
  requiredMemory: 256Mi
  requiredDisk: 512Mi
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
