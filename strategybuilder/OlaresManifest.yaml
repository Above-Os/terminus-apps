olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  strategybuilder: 1
metadata:
  name: strategybuilder
  appid: strategybuilder
  version: 1.2.20
  title: Strategy Builder
  description: A guided Freqtrade strategy builder with literature strategies, visual construction, AI paper analysis, and safe export workflow.
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  categories:
  - Developer Tools
entrances:
- name: strategybuilder
  host: strategybuilder
  port: 8010
  title: Strategy Builder
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  authLevel: private
  openMethod: default
permission:
  appData: true
spec:
  versionName: 1.2.20
  developer: Strategy Builder
  submitter: Strategy Builder
  locale:
  - en-US
  - zh-CN
  fullDescription: 'Strategy Builder helps users design, document, review, and export Freqtrade-compatible strategy files. It includes literature strategies, guided and self-build tools, Puzzle Builder Pro, Strategy Doctor, AI Paper Lab, a strategy library, and manual Freqtrade export. It does not run backtests, connect to exchanges, or execute trades.

'
  upgradeDescription: 'Chart-only package: pulls docker.io/goai007/strategybuilder for application code. Source and Dockerfile live in https://github.com/leolianger/strategybuilder.'
  supportArch:
  - amd64
  - arm64
  limitedCpu: 8000m
  limitedMemory: 8Gi
  requiredCpu: 100m
  requiredMemory: 256Mi
  requiredDisk: 512Mi
options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
