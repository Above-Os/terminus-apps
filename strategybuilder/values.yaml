app:
  name: strategybuilder
  version: 1.2.20
  outputDir: /app/data/strategies
  roots: /app/data,/app/data/strategies,/tmp
# Image is built/pushed from the application repo CI.
# repository = registry/namespace/name (no tag); tag is separate.
image:
  repository: docker.io/goai007/strategybuilder
  tag: '1.2.20'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8010
  targetPort: 8010
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi
userspace:
  appData: ''
workloads:
  strategybuilder:
    replicaCount: 1
