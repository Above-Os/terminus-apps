metadata:
  description: "Qwen3-TTS 1.7B CustomVoice for preset-voice text to speech."
  title: Qwen3-TTS 1.7B CustomVoice

spec:
  upgradeDescription: |
    v1.0.15: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    Qwen3-TTS 1.7B CustomVoice for preset-voice text to speech.

    **Configuration**
    - Model: `Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice`
    - Source: `hf://Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice`
    - Capabilities: `tts`
    - Required GPU memory: `5837Mi`
    - Engine: faster-qwen3-tts (in-process, CUDA graphs)

    **How It Works**
    First, Model Console (llm-init) downloads the model and gets it ready, then the
    audio engine starts serving when the download sentinel appears. llm-init reverse-proxies
    `/v1/*` to the engine and serves its control plane / dashboard on `/`.

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`.
