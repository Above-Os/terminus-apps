metadata:
  description: "Qwen3-TTS 1.7B CustomVoice for preset-voice text to speech."
  title: Qwen3-TTS 1.7B CustomVoice

spec:
  upgradeDescription: |
    v1.0.15: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    Qwen3-TTS 1.7B CustomVoice for preset-voice text to speech.

    **配置**
    - 模型：`Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice`
    - 来源：`hf://Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice`
    - 能力：`tts`
    - GPU 显存：`5837Mi`
    - 引擎：faster-qwen3-tts（进程内，CUDA Graph）

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
