metadata:
  title: SD WebUI Shared
  description: Stable Diffusion Web-UI.
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer muss jedoch weiterhin einen Desktop-Eintrag installieren, um den vom Olares-Admin installierten Dienst zu nutzen.
    
    **Übersicht**
    Eine einfache Möglichkeit, Stable Diffusion direkt im Browser zu nutzen.
    Stable Diffusion web UI ist eine Browser-Oberfläche für Stable Diffusion auf Basis der Gradio-Bibliothek.
    
    Feature-Highlights:
    * Originale txt2img- und img2img-Modi
    * Outpainting und Inpainting
    * Color Sketch
    * Prompt Matrix
    * Stable Diffusion Upscale
    * Loopback – img2img mehrmals ausführen
    * Textual Inversion
    * Extras-Tab mit GFPGAN/CodeFormer/RealESRGAN/ESRGAN/SwinIR und Swin2SR/LDSR
    * Optionen für das Seitenverhältnis beim Skalieren
  upgradeDescription: |
    Chart-Konfiguration aktualisieren
    - Eingabeverzeichnis hinzufügen
    
    Änderungen in Version 1.10.1-lastest commit
    
    Fehlerbehebungen:
    Image-Upscale auf CPU behoben (16275)
