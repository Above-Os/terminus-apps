metadata:
  title: SD WebUI Shared
  description: Interfaz web de Stable Diffusion.
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una aplicación compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario aún debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el administrador de Olares.
    
    **Resumen**
    Una forma sencilla de trabajar con Stable Diffusion desde el navegador.
    Stable Diffusion web UI es una interfaz de navegador para Stable Diffusion basada en la biblioteca Gradio.
    
    Aspectos destacados:
    * Modos originales txt2img e img2img
    * Outpainting e Inpainting
    * Color Sketch
    * Prompt Matrix
    * Stable Diffusion Upscale
    * Loopback, ejecutar el procesamiento img2img varias veces
    * Textual Inversion
    * Pestaña Extras con GFPGAN/CodeFormer/RealESRGAN/ESRGAN/SwinIR y Swin2SR/LDSR
    * Opciones de relación de aspecto al redimensionar
  upgradeDescription: |
    Actualizar configuración del Chart
    - Añadir directorio de entrada
    
    Cambios en la versión 1.10.1-lastest commit
    
    Correcciones de errores:
    corrección del upscale de imagen en CPU (16275)
