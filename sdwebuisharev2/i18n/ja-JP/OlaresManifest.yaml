metadata:
  title: SD WebUI Shared
  description: Stable Diffusion web UI。
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でインストールされるサービスは1つだけです。ただし、各ユーザーは Olares 管理者がインストールしたサービスにアクセスするため、デスクトップエントリを別途インストールする必要があります。
    
    **概要**
    ブラウザから Stable Diffusion を簡単に扱える方法です。
    Stable Diffusion web UI は Gradio ライブラリに基づく Stable Diffusion のブラウザインターフェースです。
    
    主な機能:
    * オリジナルの txt2img / img2img モード
    * Outpainting と Inpainting
    * Color Sketch
    * Prompt Matrix
    * Stable Diffusion Upscale
    * Loopback（img2img を複数回実行）
    * Textual Inversion
    * GFPGAN/CodeFormer/RealESRGAN/ESRGAN/SwinIR および Swin2SR/LDSR 付き Extras タブ
    * リサイズ時のアスペクト比オプション
  upgradeDescription: |
    Chart 設定の更新
    - 入力ディレクトリを追加
    
    バージョン 1.10.1-lastest commit の変更点
    
    バグ修正:
    CPU 上の画像アップスケールを修正 (16275)
