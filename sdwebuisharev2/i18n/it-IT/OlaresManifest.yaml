metadata:
  title: SD WebUI Shared
  description: Web UI di Stable Diffusion
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Tuttavia, ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall'amministratore Olares.
    
    **Panoramica**
    Un modo semplice per lavorare con Stable Diffusion direttamente dal browser.
    Stable Diffusion web UI è un'interfaccia browser per Stable Diffusion basata sulla libreria Gradio.
    
    Funzioni principali:
    * Modalità originali txt2img e img2img
    * Outpainting e Inpainting
    * Color Sketch
    * Prompt Matrix
    * Stable Diffusion Upscale
    * Loopback, eseguire più volte l'elaborazione img2img
    * Textual Inversion
    * Scheda Extras con GFPGAN/CodeFormer/RealESRGAN/ESRGAN/SwinIR e Swin2SR/LDSR
    * Opzioni di proporzioni per il ridimensionamento
  upgradeDescription: |
    Aggiornare la configurazione del Chart
    - Aggiungere directory di input
    
    Modifiche nella versione 1.10.1-lastest commit
    
    Correzioni di bug:
    correzione dell'upscale immagine su CPU (16275)
