metadata:
  title: SD WebUI Shared
  description: Interface web Stable Diffusion.
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé dans l'ensemble du système Olares. Cependant, chaque utilisateur doit toujours installer une entrée de bureau pour accéder au service installé par l'administrateur Olares.
    
    **Aperçu**
    Un moyen simple de travailler avec Stable Diffusion depuis votre navigateur.
    Stable Diffusion web UI est une interface navigateur pour Stable Diffusion basée sur la bibliothèque Gradio.
    
    Points forts :
    * Modes originaux txt2img et img2img
    * Outpainting et Inpainting
    * Color Sketch
    * Prompt Matrix
    * Stable Diffusion Upscale
    * Loopback, exécuter le traitement img2img plusieurs fois
    * Textual Inversion
    * Onglet Extras avec GFPGAN/CodeFormer/RealESRGAN/ESRGAN/SwinIR et Swin2SR/LDSR
    * Options de ratio d'aspect pour le redimensionnement
  upgradeDescription: |
    Mettre à jour la configuration du Chart
    - Ajouter le répertoire d'entrée
    
    Modifications dans la version 1.10.1-lastest commit
    
    Corrections de bugs :
    correction de l'upscale d'image sur CPU (16275)
