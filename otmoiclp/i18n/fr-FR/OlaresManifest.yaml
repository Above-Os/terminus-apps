metadata:
  title: Otmoic LP
  description: Otmoic LP
spec:
  fullDescription: |
    Otmoic est un protocole d'échange automatique de valeur sans confiance basé sur Snowinning Protocol, conçu pour Depin, AI Agent et Crypto Trading.

    **Fonctionnalités :**
    Fournit un mécanisme de réputation on-chain pour les traders et les fournisseurs de liquidité, résolvant le problème du free mint
    Prend en charge le KYC basé sur Verifiable Credential
    Découverte de prix basée sur RFQ
    Prend en charge l'Atomic swap basé sur des transactions on-chain
    Prend en charge le market making automatique par les fournisseurs de liquidité via l'installation d'applications dans Olares OS

  upgradeDescription: |
    Mise à jour vers v2.5.4

    **Mises à jour de configuration**
    Ports traefik changés en 8001/4443 pour éviter l'exigence de privilèges

    **Node**
    Tableau de bord enrichi avec prise en charge de la configuration hedge et visualiseur d'historique des transactions ;
    Améliorations de stabilité de ChainClient ;
    Vérification de la concordance entre les informations KYC de la partie à la transaction et les restrictions KYC dans la configuration du bridge

    **Dashboard**
    Optimisation du guide de configuration
    Prise en charge de la configuration de stratégies de restriction de cotation basées sur les informations KYC de la contrepartie

    **Chainclient Evm**
    Aide le relay à compléter la fonction anti-triche
    Prise en charge de la re-interrogation de données historiques sur une période
    Utilise le secret vault fourni par le système pour stocker la clé privée du portefeuille
