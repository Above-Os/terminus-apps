metadata:
  title: Otmoic LP
  description: Otmoic LP
spec:
  fullDescription: |
    Otmoic は Snowinning Protocol に基づくトラストレスな自動価値交換プロトコルで、Depin、AI Agent、Crypto Trading 向けに構築されています。

    **機能:**
    トレーダーと流動性提供者向けのオンチェーン評判メカニズムを提供し、フリーミント問題を解決
    Verifiable Credential に基づく KYC をサポート
    RFQ ベースの価格発見
    オンチェーン取引に基づく Atomic swap をサポート
    Olares OS へのアプリインストールによる流動性提供者の自動マーケットメイキングをサポート

  upgradeDescription: |
    v2.5.4 へアップグレード

    **設定の更新**
    特権要件を避けるため traefik ポートを 8001/4443 に変更

    **Node**
    ヘッジ設定対応と取引履歴ビューアを備えたダッシュボード強化;
    ChainClient の安定性改善;
    取引当事者の KYC 情報とブリッジ設定の KYC 制限の一致検証

    **Dashboard**
    設定ガイダンスの最適化
    相手方 KYC 情報に基づく見積制限戦略の設定をサポート

    **Chainclient Evm**
    リレーのアンチチート機能完了を支援
    一定期間の履歴データの再クエリをサポート
    システムのシークレットボールトでウォレット秘密鍵を保管
