metadata:
  title: Otmoic LP
  description: Otmoic LP
spec:
  fullDescription: |
    Otmoic è un protocollo trustless di scambio automatico di valore basato su Snowinning Protocol, creato per Depin, AI Agent e Crypto Trading.

    **Funzionalità:**
    Fornisce un meccanismo di reputazione on-chain per trader e liquidity provider, risolvendo il problema del free mint
    Supporta KYC basato su Verifiable Credential
    Scoperta dei prezzi basata su RFQ
    Supporta Atomic swap basato su transazioni on-chain
    Supporta market making automatico da parte dei liquidity provider tramite installazione di applicazioni in Olares OS

  upgradeDescription: |
    Aggiornamento a v2.5.4

    **Aggiornamenti di configurazione**
    Porte traefik cambiate in 8001/4443 per evitare il requisito di privilegi

    **Node**
    Dashboard migliorata con supporto configurazione hedge e visualizzatore cronologia transazioni;
    Miglioramenti di stabilità di ChainClient;
    Verifica della corrispondenza tra le informazioni KYC della parte della transazione e le restrizioni KYC nella configurazione del bridge

    **Dashboard**
    Ottimizzazione della guida alla configurazione
    Supporta la configurazione di strategie di restrizione delle quotazioni basate sulle informazioni KYC della controparte

    **Chainclient Evm**
    Assiste il relay nel completare la funzione anti-cheating
    Supporta la ri-interrogazione di dati storici di un certo periodo
    Usa il secret vault fornito dal sistema per memorizzare la chiave privata del wallet
