metadata:
  title: Otmoic LP
  description: Otmoic LP
spec:
  fullDescription: |
    Otmoic ist ein trustless automatisches Value-Exchange-Protokoll auf Basis des Snowinning Protocol, gebaut für Depin, AI Agent und Crypto Trading.

    **Funktionen:**
    Bietet einen On-Chain-Reputationsmechanismus für Trader und Liquidity Provider und löst das Free-Mint-Problem
    Unterstützt KYC basierend auf Verifiable Credential
    RFQ-basierte Preisfindung
    Unterstützt Atomic Swap basierend auf On-Chain-Transaktionen
    Unterstützt automatisches Market Making durch Liquidity Provider über App-Installation in Olares OS

  upgradeDescription: |
    Upgrade auf v2.5.4

    **Konfigurationsupdates**
    Traefik-Ports auf 8001/4443 geändert, um Privilegienanforderungen zu vermeiden

    **Node**
    Erweitertes Dashboard mit Hedge-Konfiguration und Transaktionsverlaufs-Viewer;
    Stabilitätsverbesserungen am ChainClient;
    Überprüfung der Übereinstimmung zwischen KYC-Informationen der Transaktionspartei und KYC-Einschränkungen in der Bridge-Konfiguration

    **Dashboard**
    Konfigurationsführung optimiert
    Unterstützung für Quoten-Einschränkungsstrategien basierend auf KYC-Informationen der Gegenpartei

    **Chainclient Evm**
    Unterstützt Relay bei der Anti-Cheating-Funktion
    Unterstützung für erneute Abfrage historischer Daten eines Zeitraums
    Nutzung des vom System bereitgestellten Secret Vaults zur Speicherung des Wallet-Private-Keys
