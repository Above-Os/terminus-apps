metadata:
  title: Otmoic LP
  description: Otmoic LP
spec:
  fullDescription: |
    Otmoic es un protocolo de intercambio automático de valor sin confianza basado en Snowinning Protocol, creado para Depin, AI Agent y Crypto Trading.

    **Funciones:**
    Proporciona un mecanismo de reputación on-chain para traders y proveedores de liquidez, resolviendo el problema del free mint
    Admite KYC basado en Verifiable Credential
    Descubrimiento de precios basado en RFQ
    Admite Atomic swap basado en transacciones on-chain
    Admite market making automático por proveedores de liquidez mediante la instalación de aplicaciones en Olares OS

  upgradeDescription: |
    Actualización a v2.5.4

    **Actualizaciones de configuración**
    Cambio de puertos de traefik a 8001/4443 para evitar el requisito de privilegios

    **Node**
    Dashboard mejorado con soporte de configuración hedge y visor de historial de transacciones;
    Mejoras de estabilidad de ChainClient;
    Verificación de coincidencia entre la información KYC de la parte de la transacción y las restricciones KYC en la configuración del bridge

    **Dashboard**
    Optimización de la guía de configuración
    Admite configurar estrategias de restricción de cotización según la información KYC de la contraparte

    **Chainclient Evm**
    Ayuda al relay a completar la función anti-trampa
    Admite volver a consultar datos históricos de un período
    Usa el secret vault del sistema para almacenar la clave privada del monedero
