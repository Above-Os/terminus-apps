# Build thin jasl/vLLM SM120 image for DeepSeek-V4-Flash-0731 + DSpark.
# Runs on Above-Os 64Gi runner (label: linux-ubuntu22.04).
name: build-jasl-sm120

on:
  push:
    branches: [build/jasl-sm120-20260804]
    paths:
      - ".github/workflows/build-jasl-sm120.yml"
      - "scripts/Dockerfile.jasl-sm120-thin"
      - "scripts/build-jasl-vllm-sm120.sh"
  workflow_dispatch:
    inputs:
      jasl_ref:
        description: jasl/vllm git SHA or tag
        required: true
        default: 9a9c41c0cf4f3f66d3d721f0042fa68ffc2582c1
      image_tag:
        description: tag under ghcr.io/<owner>/vllm-jasl-dsv4
        required: true
        default: sm120-20260804
      max_jobs:
        description: ninja parallelism (4 is fine on 64Gi; use 1 on 16Gi)
        required: true
        default: "4"

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Above-Os org runner (~64Gi). Personal forks cannot see this label.
    runs-on: linux-ubuntu22.04
    timeout-minutes: 420
    env:
      JASL_REF: ${{ github.event.inputs.jasl_ref || '9a9c41c0cf4f3f66d3d721f0042fa68ffc2582c1' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || 'sm120-20260804' }}
      MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner resources
        run: |
          set -eux
          free -h
          df -h
          nproc
          docker version

      # Do NOT run free-disk-space on shared self-hosted runners (destructive).
      # Optional swap only if free RAM is tight.
      - name: Ensure swap headroom
        run: |
          set -eux
          free -h
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          swapon --show
          free -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/vllm-jasl-dsv4:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ghcr.io/${OWNER_LC}/vllm-jasl-dsv4:${IMAGE_TAG} from ${JASL_REF} MAX_JOBS=${MAX_JOBS}"

      # Use classic docker build --progress=plain so ninja [N/M] streams to Actions logs.
      - name: Build image (plain progress)
        run: |
          set -eux
          docker build --progress=plain \
            --build-arg "JASL_REF=${JASL_REF}" \
            --build-arg "TORCH_CUDA_ARCH_LIST=12.0a" \
            --build-arg "MAX_JOBS=${MAX_JOBS}" \
            --build-arg "PIP_INDEX_URL=https://pypi.org/simple" \
            -t "${{ steps.meta.outputs.image }}" \
            -t "ghcr.io/${{ steps.meta.outputs.owner_lc }}/vllm-jasl-dsv4:sm120-${{ github.run_number }}" \
            -f scripts/Dockerfile.jasl-sm120-thin \
            scripts

      - name: Push image
        run: |
          set -eux
          docker push "${{ steps.meta.outputs.image }}"
          docker push "ghcr.io/${{ steps.meta.outputs.owner_lc }}/vllm-jasl-dsv4:sm120-${{ github.run_number }}"

      - name: Summary
        run: |
          {
            echo "## Image"
            echo "\`${{ steps.meta.outputs.image }}\`"
            echo ""
            echo "jasl ref: \`${JASL_REF}\`"
            echo "MAX_JOBS: \`${MAX_JOBS}\`"
            echo "runner: \`linux-ubuntu22.04\`"
          } >> "$GITHUB_STEP_SUMMARY"
