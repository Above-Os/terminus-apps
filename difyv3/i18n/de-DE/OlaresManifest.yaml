metadata:
  title: Dify
  description: Die Innovations-Engine für GenAI-Anwendungen
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared-Version von Dify. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Benutzer muss dennoch einen Desktop-Eintrag installieren, um auf den vom Olares-Admin installierten Dienst zuzugreifen.

    Nach der Installation können alle Nutzer dieses Olares-Clusters dieselbe Anwendung nutzen. Dieses Shared-Setup erleichtert den Informationsaustausch, reduziert den Wartungsaufwand und spart Ressourcen.

    **Migrationshinweis**
    Wenn Sie eine ältere Version von Dify nutzen, kann sie mit Dify v1.0 oder neuer kollidieren. Wir empfehlen, Ihre Daten zu sichern, die alte Version zu deinstallieren und dann diese neueste Version zu installieren.

    **ÜBERSICHT**
    Dify ist eine Open-Source-Plattform für die Entwicklung von LLM-Apps. Die intuitive Oberfläche kombiniert AI-Workflow, RAG-Pipeline, Agenten-Fähigkeiten, Modellverwaltung, Observability und mehr — so gelangen Sie schnell vom Prototyp zur Produktion.
  upgradeDescription: |
    v1.1.13: Fix plugin-daemon CrashLoop — `DB_EXTRAS` leeren (api/worker-Keepalive-DSN-Optionen stören den pg-Treiber von plugin-daemon).
    v1.1.12: Secret-Migration abschließen — verbleibende Passwörter und API-Schlüssel von Vector-Store / Object-Storage / optionalen Providern von ConfigMap in Secret verschieben; plugin-daemon auf `envFrom` (configMap + secret) umstellen, damit keine Klartext-Credentials mehr eingebettet sind.
    v1.1.11: `PGVECTOR_*`-Passwörter, Weaviate-/Sandbox-/Plugin-API-Schlüssel in Secret verschieben; plugin-daemon und Sandbox über `secretKeyRef` anbinden.

    Speicher: dauerhafte Volumes von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopieren initContainers Legacy-appCache-Inhalte nach appData, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Alte appCache-Daten bleiben für Rollback erhalten.

    Legacy-Verzweigung `sysVersion >= 1.12.3` für appCache-Pfade entfernt; Olares-Minimum ist jetzt 1.12.6.

    Dauerhafte Dify-Volumes von appCache nach appData migriert.

    **Was sich geändert hat**

    - **Architektur**: Untercharts abgeflacht; nginx-Clientproxy entfernt — der Eingang routet direkt zu Dify-nginx auf Port 80.
    - **Skalierung**: `workloadReplicas` für alle Dify-Workloads (api, worker, web, nginx, redis, weaviate, sandbox, ssrf-proxy, plugin-daemon).
    - **Runtime**: Dify v1.13.3 mit übernommenen Olares-Packaging-Fixes.
