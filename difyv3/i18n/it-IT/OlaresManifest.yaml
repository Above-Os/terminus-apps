metadata:
  title: Dify
  description: Il motore di innovazione per le applicazioni GenAI
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è una versione condivisa di Dify. Nell'intero sistema Olares verrà installato un solo servizio. Tuttavia, ogni utente deve installare una voce desktop per accedere e usare il servizio installato dall'amministratore Olares.

    Dopo l'installazione, tutti in questo cluster Olares possono usare la stessa applicazione. Questa configurazione condivisa facilita la condivisione delle informazioni, riduce la manutenzione e usa meno risorse.

    **Nota di migrazione**
    Se usi una versione precedente di Dify, potrebbe entrare in conflitto con Dify v1.0 o successive. Consigliamo di eseguire il backup dei dati, disinstallare la vecchia versione e poi installare questa versione più recente.

    **PANORAMICA**
    Dify è una piattaforma open-source per lo sviluppo di app LLM. L'interfaccia intuitiva combina workflow AI, pipeline RAG, capacità agent, gestione modelli, osservabilità e altro, permettendoti di passare rapidamente dal prototipo alla produzione.
  upgradeDescription: |
    v1.1.13: Correzione CrashLoop di plugin-daemon — svuotare `DB_EXTRAS` (le opzioni DSN keepalive di api/worker rompono il driver pg di plugin-daemon).
    v1.1.12: Completare la migrazione Secret — spostare le restanti password e chiavi API di vector-store / object-storage / provider opzionali da ConfigMap a Secret; passare plugin-daemon a `envFrom` (configMap + secret) così non incorpora più credenziali in chiaro.
    v1.1.11: Spostare password `PGVECTOR_*` e chiavi API Weaviate/sandbox/plugin in Secret; collegare plugin-daemon e sandbox via `secretKeyRef`.

    Storage: volumi durevoli spostati da `appCache` ad `appData`. Al primo avvio dopo l'upgrade, gli initContainers copiano i contenuti legacy di appCache in appData se la destinazione è vuota (marker: `.migration_from_appcache_done`). I vecchi dati appCache restano per il rollback.

    Rimossa la ramificazione legacy `sysVersion >= 1.12.3` sui percorsi appCache; il minimo Olares è ora 1.12.6.

    Volumi durevoli Dify migrati da appCache ad appData.

    **Cosa è cambiato**

    - **Architettura**: sottograph appiattiti; rimosso nginx clientproxy — l'ingresso instrada direttamente al nginx di Dify sulla porta 80.
    - **Scaling**: `workloadReplicas` per tutti i workload Dify (api, worker, web, nginx, redis, weaviate, sandbox, ssrf-proxy, plugin-daemon).
    - **Runtime**: Dify v1.13.3 con fix di packaging Olares ereditati.
