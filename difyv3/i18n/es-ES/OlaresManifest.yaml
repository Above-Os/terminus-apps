metadata:
  title: Dify
  description: El motor de innovación para aplicaciones GenAI
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una versión compartida de Dify. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el administrador de Olares.

    Tras la instalación, todos en este clúster Olares pueden usar la misma aplicación. Esta configuración compartida facilita compartir información, reduce el mantenimiento y usa menos recursos.

    **Nota de migración**
    Si usas una versión antigua de Dify, puede entrar en conflicto con Dify v1.0 o posterior. Recomendamos respaldar tus datos, desinstalar la versión antigua e instalar esta última versión.

    **RESUMEN**
    Dify es una plataforma open-source de desarrollo de apps LLM. Su interfaz intuitiva combina flujo de trabajo de IA, pipeline RAG, capacidades de agente, gestión de modelos, observabilidad y más, permitiéndote pasar rápidamente del prototipo a producción.
  upgradeDescription: |
    v1.1.13: Corregir CrashLoop de plugin-daemon — vaciar `DB_EXTRAS` (las opciones DSN de keepalive de api/worker rompen el driver pg de plugin-daemon).
    v1.1.12: Completar migración a Secret — mover las contraseñas y claves API restantes de vector-store / object-storage / proveedores opcionales de ConfigMap a Secret; pasar plugin-daemon a `envFrom` (configMap + secret) para que ya no incruste credenciales en texto plano.
    v1.1.11: Mover contraseñas `PGVECTOR_*` y claves API de Weaviate/sandbox/plugin a Secret; conectar plugin-daemon y sandbox mediante `secretKeyRef`.

    Almacenamiento: volúmenes duraderos movidos de `appCache` a `appData`. En el primer arranque tras la actualización, los initContainers copian el contenido legado de appCache a appData si el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos de appCache se conservan para rollback.

    Eliminada la ramificación legada `sysVersion >= 1.12.3` de rutas appCache; el mínimo de Olares es ahora 1.12.6.

    Volúmenes duraderos de Dify migrados de appCache a appData.

    **Qué cambió**

    - **Arquitectura**: subgráficos aplanados; eliminado el clientproxy nginx — la entrada enruta directamente al nginx de Dify en el puerto 80.
    - **Escalado**: `workloadReplicas` para todas las cargas de Dify (api, worker, web, nginx, redis, weaviate, sandbox, ssrf-proxy, plugin-daemon).
    - **Runtime**: Dify v1.13.3 con correcciones de empaquetado Olares heredadas.
