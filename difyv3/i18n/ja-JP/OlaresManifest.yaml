metadata:
  title: Dify
  description: GenAI アプリケーションのためのイノベーションエンジン
spec:
  fullDescription: |
    **重要なお知らせ**
    これは Dify の共有バージョンです。Olares システム全体でサービスは1つだけインストールされます。ただし、各ユーザーは Olares 管理者がインストールしたサービスにアクセス・利用するためにデスクトップエントリをインストールする必要があります。

    インストール後、この Olares クラスタ上の全員が同じアプリケーションを利用できます。この共有構成により情報共有が容易になり、保守作業とリソース使用量を削減できます。

    **移行に関する注意**
    古いバージョンの Dify を使用している場合、Dify v1.0 以降と競合する可能性があります。データをバックアップし、旧バージョンをアンインストールしてから最新版をインストールすることを推奨します。

    **概要**
    Dify はオープンソースの LLM アプリ開発プラットフォームです。直感的なインターフェースが AI ワークフロー、RAG パイプライン、エージェント機能、モデル管理、オブザーバビリティなどを統合し、プロトタイプから本番まで迅速に進められます。
  upgradeDescription: |
    v1.1.13: plugin-daemon の CrashLoop を修正 — `DB_EXTRAS` をクリア（api/worker の keepalive DSN オプションが plugin-daemon の pg ドライバを壊す）。
    v1.1.12: Secret 移行を完了 — 残りの vector-store / object-storage / オプションプロバイダのパスワードと API キーを ConfigMap から Secret へ移動；plugin-daemon を `envFrom`（configMap + secret）に切り替え、平文クレデンシャルを埋め込まないようにする。
    v1.1.11: `PGVECTOR_*` パスワード、Weaviate/sandbox/plugin API キーを Secret へ移動；plugin-daemon と sandbox を `secretKeyRef` で接続。

    ストレージ：永続ボリュームを `appCache` から `appData` へ移動。アップグレード後の初回起動時、宛先が空なら initContainers がレガシー appCache の内容を appData にコピー（マーカー: `.migration_from_appcache_done`）。旧 appCache データはロールバック用に残します。

    レガシーな `sysVersion >= 1.12.3` の appCache パス分岐を削除；Olares の最小要件は 1.12.6。

    Dify の永続ボリュームを appCache から appData へ移行。

    **変更内容**

    - **アーキテクチャ**: サブチャートを平坦化；nginx clientproxy を削除 — エントランスがポート 80 の Dify nginx に直接ルーティング。
    - **スケーリング**: すべての Dify ワークロード（api、worker、web、nginx、redis、weaviate、sandbox、ssrf-proxy、plugin-daemon）に `workloadReplicas`。
    - **ランタイム**: 継承された Olares パッケージング修正付きの Dify v1.13.3。
