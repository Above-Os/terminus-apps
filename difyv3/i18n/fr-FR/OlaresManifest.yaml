metadata:
  title: Dify
  description: Le moteur d'innovation pour les applications GenAI
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une version partagée de Dify. Un seul service sera installé sur l'ensemble du système Olares. Cependant, chaque utilisateur doit installer une entrée de bureau pour accéder et utiliser le service installé par l'administrateur Olares.

    Après l'installation, tout le monde sur ce cluster Olares peut utiliser la même application. Cette configuration partagée facilite le partage d'informations, réduit la maintenance et utilise moins de ressources.

    **Note de migration**
    Si vous utilisez une ancienne version de Dify, elle peut entrer en conflit avec Dify v1.0 ou ultérieure. Nous recommandons de sauvegarder vos données, de désinstaller l'ancienne version, puis d'installer cette dernière version.

    **APERÇU**
    Dify est une plateforme open-source de développement d'applications LLM. Son interface intuitive combine workflow IA, pipeline RAG, capacités d'agents, gestion des modèles, observabilité et plus encore, vous permettant de passer rapidement du prototype à la production.
  upgradeDescription: |
    v1.1.13 : Correction du CrashLoop de plugin-daemon — vider `DB_EXTRAS` (les options DSN keepalive d'api/worker cassent le pilote pg de plugin-daemon).
    v1.1.12 : Terminer la migration Secret — déplacer les mots de passe et clés API restants de vector-store / object-storage / fournisseurs optionnels de ConfigMap vers Secret ; basculer plugin-daemon vers `envFrom` (configMap + secret) pour ne plus intégrer d'identifiants en clair.
    v1.1.11 : Déplacer les mots de passe `PGVECTOR_*` et les clés API Weaviate/sandbox/plugin vers Secret ; brancher plugin-daemon et sandbox via `secretKeyRef`.

    Stockage : volumes durables déplacés de `appCache` vers `appData`. Au premier démarrage après la mise à jour, les initContainers copient le contenu legacy d'appCache vers appData si la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données appCache sont conservées pour le rollback.

    Suppression du branchement legacy `sysVersion >= 1.12.3` des chemins appCache ; le minimum Olares est désormais 1.12.6.

    Volumes durables Dify migrés d'appCache vers appData.

    **Changements**

    - **Architecture** : sous-charts aplatis ; suppression du clientproxy nginx — l'entrée route directement vers le nginx Dify sur le port 80.
    - **Mise à l'échelle** : `workloadReplicas` pour toutes les charges Dify (api, worker, web, nginx, redis, weaviate, sandbox, ssrf-proxy, plugin-daemon).
    - **Runtime** : Dify v1.13.3 avec correctifs d'empaquetage Olares hérités.
