metadata:
  title: Uptime Kuma
  description: Una elegante herramienta de monitorización autoalojada
spec:
  fullDescription: |
    Uptime Kuma es una herramienta de monitorización autoalojada fácil de usar.

    Características
    Monitorización de disponibilidad para HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    IU/UX elegante, reactiva y rápida
    Notificaciones vía Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP) y más de 90 servicios de notificación; haga clic aquí para la lista completa
    Intervalos de 20 segundos
    Varios idiomas
    Varias páginas de estado
    Asignar páginas de estado a dominios específicos
    Gráfico de ping
    Información del certificado
    Soporte de proxy
    Soporte 2FA
