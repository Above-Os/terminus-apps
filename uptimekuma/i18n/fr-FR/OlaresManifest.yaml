metadata:
  title: Uptime Kuma
  description: Un outil de surveillance auto-hébergé élégant
spec:
  upgradeDescription: |
    Met à jour Uptime Kuma vers 2.5.9. Corrige les unités de délai, les tentatives des moniteurs push, les minuteries de rafraîchissement en double et les fuseaux horaires des maintenances récurrentes. Inclut un correctif de sécurité du cache RSS.

    Notes de version : https://github.com/louislam/uptime-kuma/releases/tag/2.5.9

  fullDescription: |
    Uptime Kuma est un outil de surveillance auto-hébergé facile à utiliser.

    Fonctionnalités
    Surveillance de la disponibilité pour HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    UI/UX élégante, réactive et rapide
    Notifications via Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP) et plus de 90 services de notification ; cliquez ici pour la liste complète
    Intervalles de 20 secondes
    Plusieurs langues
    Plusieurs pages d'état
    Associer des pages d'état à des domaines spécifiques
    Graphique de ping
    Informations sur le certificat
    Prise en charge des proxys
    Prise en charge de la 2FA
