metadata:
  title: Uptime Kuma
  description: Uno strumento di monitoraggio self-hosted elegante
spec:
  upgradeDescription: |
    Aggiorna Uptime Kuma a 2.5.9. Corregge unità dei timeout, tentativi dei monitor push, timer duplicati delle pagine di stato e fusi orari delle manutenzioni ricorrenti. Include una correzione di sicurezza della cache RSS.

    Note di rilascio: https://github.com/louislam/uptime-kuma/releases/tag/2.5.9

  fullDescription: |
    Uptime Kuma è uno strumento di monitoraggio self-hosted facile da usare.

    Funzionalità
    Monitoraggio dell'uptime per HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers
    UI/UX elegante, reattiva e veloce
    Notifiche tramite Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP) e oltre 90 servizi di notifica; clicca qui per l'elenco completo
    Intervalli di 20 secondi
    Più lingue
    Più pagine di stato
    Mappa le pagine di stato a domini specifici
    Grafico ping
    Informazioni sul certificato
    Supporto proxy
    Supporto 2FA
