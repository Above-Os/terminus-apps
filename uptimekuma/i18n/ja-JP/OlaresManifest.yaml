metadata:
  title: Uptime Kuma
  description: おしゃれなセルフホスト監視ツール
spec:
  upgradeDescription: |
    uptimekuma を 2.5.5 から 2.5.9 に更新します。リリースノートに記載された改善と不具合修正を含みます。

    リリースノート: https://github.com/louislam/uptime-kuma/releases/tag/2.5.9

  fullDescription: |
    Uptime Kuma は使いやすいセルフホストの監視ツールです。

    機能
    HTTP(s) / TCP / HTTP(s) Keyword / HTTP(s) Json Query / Ping / DNS Record / Push / Steam Game Server / Docker Containers の稼働監視
    洗練された高速なリアクティブ UI/UX
    Telegram、Discord、Gotify、Slack、Pushover、Email (SMTP) など 90 以上の通知サービスに対応（一覧はこちら）
    20 秒間隔
    多言語対応
    複数のステータスページ
    ステータスページを特定ドメインに割り当て
    Ping チャート
    証明書情報
    プロキシ対応
    2FA 対応
