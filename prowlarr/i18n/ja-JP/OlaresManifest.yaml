metadata:
  title: Prowlarr
  description: 各種 PVR アプリケーションの統合
spec:
  fullDescription: |
    Prowlarr は、人気の *arr .net/reactjs ベーススタック上に構築されたインデクサーマネージャー／プロキシで、各種 PVR アプリと統合します。Prowlarr は Torrent トラッカーと Usenet インデクサーの両方の管理に対応。Lidarr、Mylar3、Radarr、Readarr、Sonarr とシームレスに連携し、アプリごとのインデクサー設定なしで完全な管理を提供します（すべてこちらで行います）。
    
    **主な機能**
    - Headphones VIP を含む 24 のインデクサー向けネイティブ Usenet サポート
    - 「Generic Newznab」経由で任意の Newznab 互換インデクサーに対応
    - 500 以上のトラッカー向け Torrent サポート（随時追加）
    - 「Generic Torznab」経由で任意の Torznab 互換トラッカーに対応
    - Cardigann によるカスタム YML 定義（JSON/XML パース含む）
    - Lidarr/Mylar3/Radarr/Readarr/Sonarr へのインデクサー同期（他アプリの手動設定不要）
    - インデクサー履歴と統計
    - カテゴリ単位でのトラッカー＆インデクサー手動検索
    - パラメータベースの手動検索
    - Prowlarr からダウンロードクライアントへ複数リリースを一度にプッシュ
    - インデクサーのヘルス／ステータス通知
    - インデクサーごとのプロキシ（SOCKS4、SOCKS5、HTTP、Flaresolverr）
  upgradeDescription: |
    Prowlarr をバージョン 2.4.0（2026-06-09）へアップグレード
    設定変更: Entrance の認証レベルを internal に変更
    
    ハイライト:
    - [Major] .NET 8 へ移行; .NET 8.0.27 ランタイム更新
    - [qBittorrent] API キー対応; Basic auth 対応; qBittorrent 5.2 のログイン修正; API 呼び出しの Cookie 再利用
    - [New Features] Postgres 接続文字列オプション; 同期アプリ向け Basic Auth
    - [Indexer] MyAnonamouse と SecretCinema の改善; Newznab パラメータ修正
    - [Fixes] PWA マニフェスト画像; Newznab インデクサーへ limit=0 を送らない
    
    完全なリリースノート: https://github.com/Prowlarr/Prowlarr/releases/tag/v2.4.0.5397
