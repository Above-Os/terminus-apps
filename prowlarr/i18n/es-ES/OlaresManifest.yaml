metadata:
  title: Prowlarr
  description: Integración de diversas aplicaciones PVR
spec:
  fullDescription: |
    Prowlarr es un gestor/proxy de indexadores construido sobre el popular stack base *arr .net/reactjs para integrarse con tus distintas apps PVR. Prowlarr admite la gestión de trackers torrent e indexadores Usenet. Se integra a la perfección con Lidarr, Mylar3, Radarr, Readarr y Sonarr, ofreciendo una gestión completa de tus indexadores sin configuración de indexador por app (lo hacemos todo nosotros).
    
    **Funciones principales**
    - Soporte Usenet nativo para 24 indexadores, incluido Headphones VIP
    - Soporte Usenet para cualquier indexador compatible Newznab vía "Generic Newznab"
    - Soporte torrent para más de 500 trackers, con más añadidos constantemente
    - Soporte torrent para cualquier tracker compatible Torznab vía "Generic Torznab"
    - Soporte de definiciones YML personalizadas vía Cardigann con parsing JSON y XML
    - Sincronización de indexadores con Lidarr/Mylar3/Radarr/Readarr/Sonarr, sin configuración manual de las otras apps
    - Historial y estadísticas de indexadores
    - Búsqueda manual de trackers e indexadores a nivel de categoría
    - Búsqueda manual basada en parámetros
    - Soporte para empujar varios releases a la vez a tus clientes de descarga desde Prowlarr
    - Notificaciones de salud y estado de indexadores
    - Soporte de proxy por indexador (SOCKS4, SOCKS5, HTTP, Flaresolverr)
  upgradeDescription: |
    Actualización de Prowlarr a la versión 2.4.0 (2026-06-09)
    Cambios de configuración: nivel de autenticación de Entrance cambiado a internal
    
    Aspectos destacados:
    - [Major] Migración a .NET 8; actualización del runtime a .NET 8.0.27
    - [qBittorrent] Soporte de API key; Basic auth; correcciones de login para qBittorrent 5.2; reutilización de cookies para llamadas API
    - [New Features] Opción de cadena de conexión Postgres; Basic Auth para aplicaciones de sync
    - [Indexer] Mejoras en MyAnonamouse y SecretCinema; correcciones de parámetros Newznab
    - [Fixes] Imágenes del manifiesto PWA; no enviar limit=0 a indexadores Newznab
    
    Nota completa: https://github.com/Prowlarr/Prowlarr/releases/tag/v2.4.0.5397
