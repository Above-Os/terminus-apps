metadata:
  title: Prowlarr
  description: Integrazione di varie applicazioni PVR
spec:
  fullDescription: |
    Prowlarr è un indexer manager/proxy costruito sullo stack base *arr .net/reactjs per integrarsi con le tue varie app PVR. Prowlarr supporta la gestione di tracker torrent e indexer Usenet. Si integra perfettamente con Lidarr, Mylar3, Radarr, Readarr e Sonarr offrendo la gestione completa degli indexer senza setup per app (lo facciamo noi).
    
    **Funzioni principali**
    - Supporto Usenet nativo per 24 indexer, incluso Headphones VIP
    - Supporto Usenet per qualsiasi indexer Newznab-compatible tramite "Generic Newznab"
    - Supporto torrent per oltre 500 tracker, con aggiunte continue
    - Supporto torrent per qualsiasi tracker Torznab-compatible tramite "Generic Torznab"
    - Supporto di definizioni YML personalizzate tramite Cardigann con parsing JSON e XML
    - Sync degli indexer verso Lidarr/Mylar3/Radarr/Readarr/Sonarr, senza configurazione manuale delle altre app
    - Cronologia e statistiche degli indexer
    - Ricerca manuale di tracker e indexer a livello di categoria
    - Ricerca manuale basata su parametri
    - Supporto per push di più release contemporaneamente ai download client da Prowlarr
    - Notifiche di salute e stato degli indexer
    - Supporto proxy per indexer (SOCKS4, SOCKS5, HTTP, Flaresolverr)
  upgradeDescription: |
    Aggiornamento di Prowlarr alla versione 2.4.0 (2026-06-09)
    Modifiche di configurazione: livello auth Entrance impostato su internal
    
    Highlight:
    - [Major] Migrazione a .NET 8; bump runtime .NET 8.0.27
    - [qBittorrent] Supporto API key; Basic auth; fix login per qBittorrent 5.2; riuso cookie per chiamate API
    - [New Features] Opzione connection string Postgres; Basic Auth per app di sync
    - [Indexer] Miglioramenti MyAnonamouse e SecretCinema; fix parametri Newznab
    - [Fixes] Immagini manifesto PWA; non inviare limit=0 agli indexer Newznab
    
    Nota completa: https://github.com/Prowlarr/Prowlarr/releases/tag/v2.4.0.5397
