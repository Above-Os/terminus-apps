metadata:
  title: Prowlarr
  description: Integration verschiedener PVR-Anwendungen
spec:
  fullDescription: |
    Prowlarr ist ein Indexer-Manager/Proxy, der auf dem beliebten *arr .NET/ReactJS-Basisstack aufbaut, um Ihre verschiedenen PVR-Apps zu integrieren. Prowlarr unterstützt die Verwaltung von Torrent-Trackern und Usenet-Indexern. Es integriert sich nahtlos mit Lidarr, Mylar3, Radarr, Readarr und Sonarr und bietet die vollständige Verwaltung Ihrer Indexer ohne Indexer-Setup pro App (wir erledigen das alles).
    
    **Wichtige Funktionen**
    - Native Usenet-Unterstützung für 24 Indexer, einschließlich Headphones VIP
    - Usenet-Unterstützung für jeden Newznab-kompatiblen Indexer über „Generic Newznab“
    - Torrent-Unterstützung für über 500 Tracker – laufend erweitert
    - Torrent-Unterstützung für jeden Torznab-kompatiblen Tracker über „Generic Torznab“
    - Unterstützung benutzerdefinierter YML-Definitionen über Cardigann inklusive JSON- und XML-Parsing
    - Indexer-Sync zu Lidarr/Mylar3/Radarr/Readarr/Sonarr – keine manuelle Konfiguration der anderen Apps nötig
    - Indexer-Verlauf und Statistiken
    - Manuelle Suche von Trackern & Indexern auf Kategorieebene
    - Parameterbasierte manuelle Suche
    - Unterstützung zum gleichzeitigen Pushen mehrerer Releases direkt an Ihre Download-Clients aus Prowlarr
    - Indexer-Gesundheits- und Statusbenachrichtigungen
    - Proxy-Unterstützung pro Indexer (SOCKS4, SOCKS5, HTTP, Flaresolverr)
  upgradeDescription: |
    Upgrade von Prowlarr auf Version 2.4.0 (2026-06-09)
    Konfigurationsänderungen: Entrance-Auth-Level auf internal geändert
    
    Upgrade-Highlights:
    - [Major] Migration auf .NET 8; Runtime-Bump auf .NET 8.0.27
    - [qBittorrent] API-Key-Unterstützung; Basic-Auth-Unterstützung; Login-Fixes für qBittorrent 5.2; Cookie-Wiederverwendung für API-Aufrufe
    - [New Features] Option für Postgres-Connection-String; Basic-Auth-Unterstützung für Sync-Anwendungen
    - [Indexer] Verbesserungen bei MyAnonamouse und SecretCinema; Newznab-Parameter-Fixes
    - [Fixes] PWA-Manifest-Bilder; limit=0 nicht an Newznab-Indexer senden
    
    Vollständige Release Note: https://github.com/Prowlarr/Prowlarr/releases/tag/v2.4.0.5397
