metadata:
  title: Prowlarr
  description: Intégration de diverses applications PVR
spec:
  fullDescription: |
    Prowlarr est un gestionnaire/proxy d'indexeurs construit sur la stack de base *arr .net/reactjs pour s'intégrer à vos différentes apps PVR. Prowlarr prend en charge la gestion des trackers torrent et des indexeurs Usenet. Il s'intègre parfaitement à Lidarr, Mylar3, Radarr, Readarr et Sonarr, offrant une gestion complète de vos indexeurs sans configuration d'indexeur par app (nous nous en chargeons).
    
    **Fonctionnalités majeures**
    - Prise en charge Usenet native pour 24 indexeurs, dont Headphones VIP
    - Prise en charge Usenet pour tout indexeur compatible Newznab via « Generic Newznab »
    - Prise en charge torrent pour plus de 500 trackers, avec des ajouts continus
    - Prise en charge torrent pour tout tracker compatible Torznab via « Generic Torznab »
    - Prise en charge de définitions YML personnalisées via Cardigann avec parsing JSON et XML
    - Sync des indexeurs vers Lidarr/Mylar3/Radarr/Readarr/Sonarr, sans configuration manuelle des autres apps
    - Historique et statistiques des indexeurs
    - Recherche manuelle des trackers et indexeurs au niveau catégorie
    - Recherche manuelle basée sur des paramètres
    - Prise en charge de l'envoi de plusieurs releases à la fois vers vos clients de téléchargement depuis Prowlarr
    - Notifications de santé et d'état des indexeurs
    - Prise en charge de proxy par indexeur (SOCKS4, SOCKS5, HTTP, Flaresolverr)
  upgradeDescription: |
    Mise à niveau de Prowlarr vers la version 2.4.0 (2026-06-09)
    Changements de configuration : niveau d'auth Entrance passé à internal
    
    Points forts :
    - [Major] Migration vers .NET 8 ; bump runtime .NET 8.0.27
    - [qBittorrent] Prise en charge de clé API ; Basic auth ; correctifs de login pour qBittorrent 5.2 ; réutilisation des cookies pour les appels API
    - [New Features] Option de chaîne de connexion Postgres ; Basic Auth pour les apps de sync
    - [Indexer] Améliorations MyAnonamouse et SecretCinema ; correctifs de paramètres Newznab
    - [Fixes] Images du manifeste PWA ; ne pas envoyer limit=0 aux indexeurs Newznab
    
    Note complète : https://github.com/Prowlarr/Prowlarr/releases/tag/v2.4.0.5397
