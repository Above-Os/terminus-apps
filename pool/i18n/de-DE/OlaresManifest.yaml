metadata:
  title: Pool CLI
  description: Der Programmieragent von Poolside für Ihr Terminal
spec:
  fullDescription: |
    **Überblick**
    Pool ist der Programmieragent von Poolside für das Terminal. Er liest Ihre Codebasis, führt Tools aus, bearbeitet Dateien und unterstützt MCP-Server, Skills und AGENTS.md-Projektanweisungen.

    **Hauptfunktionen**
    - Interaktive Terminal-TUI mit Slash-Befehlen, unscharfer Dateisuche, Shell-Modus und Genehmigungsmodi.
    - Echte Dateibearbeitung, Shell-Ausführung und Git-Workflows, gesteuert durch natürliche Sprache.
    - MCP-Tool-Integration und wiederverwendbare Skills-Workflows.
    - Nicht interaktive Automatisierung über `pool exec` für Skripte und CI.
    - Vorinstallierte Toolchain: Python, Node.js, Go, Rust, Java, PHP, git, ripgrep, DB-Clients.
    - Optionales DinD (`ENABLE_DIND`, standardmäßig aktiviert): `docker` / `docker compose` im Terminal (privilegierter Sidecar).

    **Ersteinrichtung**
    - **Lokales Ollama (auf Olares empfohlen):** Setzen Sie `USE_LOCAL_LLM` auf `true`, setzen Sie `POOL_MODEL` auf den exakten Tag des in Ollama geladenen Modells (Standard `qwen3-coder:30b`), starten Sie die App neu und führen Sie dann `pool` oder `pool exec` aus – das Modell wird automatisch verbunden.
    - **Poolside Cloud:** Setzen Sie `USE_LOCAL_LLM` auf `false`, führen Sie `pool setup` aus (bei Poolside anmelden) oder setzen Sie `POOLSIDE_API_KEY`.
    - **Selbst gehostete Poolside-Plattform:** Setzen Sie `USE_LOCAL_LLM` auf `false` und konfigurieren Sie `POOLSIDE_API_URL` sowie `POOLSIDE_API_KEY` / `POOLSIDE_TOKEN`.
