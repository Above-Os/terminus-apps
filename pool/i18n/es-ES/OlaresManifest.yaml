metadata:
  title: Pool CLI
  description: El agente de programación de Poolside que se ejecuta en tu terminal
spec:
  fullDescription: |
    **Descripción general**
    Pool es el agente de programación de Poolside para el terminal. Lee tu código, ejecuta herramientas, edita archivos y admite servidores MCP, Skills e instrucciones de proyecto AGENTS.md.

    **Funciones principales**
    - TUI interactiva de terminal con comandos de barra, búsqueda difusa de archivos, modo shell y modos de aprobación.
    - Edición real de archivos, ejecución de shell y flujos de trabajo git controlados mediante lenguaje natural.
    - Integración de herramientas MCP y flujos de trabajo Skills reutilizables.
    - Automatización no interactiva mediante `pool exec` para scripts y CI.
    - Cadena de herramientas preinstalada: Python, Node.js, Go, Rust, Java, PHP, git, ripgrep y clientes de bases de datos.
    - DinD opcional (`ENABLE_DIND`, activado de forma predeterminada): `docker` / `docker compose` en el terminal (sidecar con privilegios).

    **Configuración inicial**
    - **Ollama local (recomendado en Olares):** establece `USE_LOCAL_LLM` en `true`, configura `POOL_MODEL` con la etiqueta exacta descargada en Ollama (valor predeterminado `qwen3-coder:30b`), reinicia la aplicación y ejecuta `pool` o `pool exec`; el modelo se conecta automáticamente.
    - **Poolside Cloud:** establece `USE_LOCAL_LLM` en `false`, ejecuta `pool setup` (inicia sesión con Poolside) o define `POOLSIDE_API_KEY`.
    - **Plataforma Poolside autoalojada:** establece `USE_LOCAL_LLM` en `false` y configura `POOLSIDE_API_URL` y `POOLSIDE_API_KEY` / `POOLSIDE_TOKEN`.
