metadata:
  title: LobeChat
  description: Ein Open-Source-KI-Chat-Framework mit modernem Design
spec:
  fullDescription: |
    Lobe Chat ist ein Open-Source-ChatGPT/LLMs-UI/Framework mit modernem Design. Unterstützt Sprachsynthese, Multimodalität und ein erweiterbares (Function-Call-)Plugin-System.

    **Funktionen**

    **Datei-Upload / Wissensbasis**
    LobeChat unterstützt Datei-Upload und Wissensbasis-Funktionen. Sie können verschiedene Dateitypen hochladen — Dokumente, Bilder, Audio und Video — sowie Wissensbasen erstellen, um Dateien bequem zu verwalten und zu durchsuchen. Dateien und Wissensbasis können auch in Gesprächen genutzt werden und ermöglichen ein reichhaltigeres Dialogerlebnis.

    **Unterstützung mehrerer Modell-Service-Anbieter**
    Wir haben Unterstützung für folgende Modell-Service-Anbieter implementiert:
    - OpenAI
    - Ollama
    - Anthropic
    - Bedrock
    - Google
    - DeepSeek
    - HuggingFace
    - OpenRouter
    - Cloudflare Workers AI
    - GitHub

    **Lokale Large-Language-Model-(LLM)-Unterstützung**
    Um spezifische Nutzeranforderungen zu erfüllen, unterstützt LobeChat auch lokale Modelle auf Basis von Ollama, sodass Nutzer eigene oder Drittanbieter-Modelle flexibel nutzen können.

    **Visuelle Modellerkennung**
    LobeChat unterstützt jetzt das neueste gpt-4-vision-Modell von OpenAI mit visueller Erkennung — eine multimodale Intelligenz, die Visuelles wahrnehmen kann. Nutzer können Bilder einfach hochladen oder in das Dialogfeld ziehen; der Agent erkennt den Bildinhalt und führt darauf basierend intelligente Gespräche.

    **TTS- & STT-Sprachkonversation**
    LobeChat unterstützt Text-to-Speech (TTS) und Speech-to-Text (STT), sodass die Anwendung Textnachrichten in klare Sprachausgaben umwandeln und Nutzer mit dem Konversationsagenten wie mit einer echten Person interagieren können. Nutzer können aus verschiedenen Stimmen wählen.

    **Text-zu-Bild-Generierung**
    Mit Unterstützung der neuesten Text-zu-Bild-Technologie können Nutzer Bildgenerierungswerkzeuge direkt in Gesprächen mit dem Agenten aufrufen.

    **Plugin-System (Function Calling)**
    Das Plugin-Ökosystem von LobeChat ist eine wichtige Erweiterung der Kernfunktionalität und steigert Nutzen und Flexibilität des LobeChat-Assistenten erheblich.

    **Agent Market (GPTs)**
    Im LobeChat Agent Marketplace entdecken Ersteller eine lebendige, innovative Community mit vielen sorgfältig gestalteten Agenten — nützlich in Arbeitsszenarien und hilfreich beim Lernen.

    **Unterstützung der Mehrbenutzerverwaltung**
    LobeChat unterstützt Mehrbenutzerverwaltung und bietet zwei Hauptlösungen für Authentifizierung und Verwaltung:
    - next-auth: LobeChat integriert next-auth, eine flexible Identitätsverifizierungsbibliothek mit mehreren Authentifizierungsmethoden
    - Clerk: Für fortgeschrittenere Nutzerverwaltung unterstützt LobeChat auch Clerk, eine moderne Nutzerverwaltungsplattform.

    **Progressive Web App (PWA) und mobile Anpassung**
    Über PWA kann LobeChat auf Desktop und Mobilgeräten eine stark optimierte Nutzererfahrung bieten und bleibt dabei leichtgewichtig und leistungsfähig.

    **Eigene Themes**
    Als design- und engineering-orientierte Anwendung legt LobeChat großen Wert auf personalisierte Erlebnisse und bietet flexible Themenmodi — Hellmodus für den Tag und Dunkelmodus für die Nacht. Neben dem Moduswechsel ermöglichen Farboptionen, die Themenfarben nach Vorliebe anzupassen.
  upgradeDescription: |
    Olares-Auth, ComfyUI-Async-Tasks und Cloudflare-R2-Objektspeicher-Defaults behoben.

    Änderungen
    - Doppeltes Präfix `JWKS_KEY=` behoben, das die JWT-Signierung für asynchrone Bildgenerierung brach
    - `INTERNAL_APP_URL=http://127.0.0.1:3210` für In-Pod-Self-Calls hinzugefügt (ComfyUI / async tRPC)
    - `AUTH_TRUSTED_ORIGINS` und `MIDDLEWARE_REWRITE_THROUGH_LOCAL=0` für Olares-Hash-Entrance und Reverse-Proxy hinzugefügt
    - `APP_URL` auf HTTPS-Entrance gesetzt; Preload-Patch schreibt Pod-Self-Calls auf `INTERNAL_APP_URL` um (2.1.39 ComfyUI)
    - R2-Defaults hinzugefügt: `S3_REGION=auto`, `S3_SET_ACL=0` (S3_*-Platzhalter durch Ihren Bucket ersetzen)

    Hinweise
    - Weiterhin auf LobeHub v2.1.39 gepinnt (>=2.1.40 erfordert `pg_search` auf Olares-System-Postgres)
    - ComfyUI-Provider in 2.1.39 nutzt weiterhin `APP_URL` für `/webapi/create-image/comfyui`

    Vollständige Release Notes: https://github.com/lobehub/lobehub/releases/tag/v2.1.39
