metadata:
  title: LobeChat
  description: Un framework di chat AI open source dal design moderno
spec:
  fullDescription: |
    Lobe Chat è un UI/Framework ChatGPT/LLMs open source dal design moderno. Supporta sintesi vocale, multimodalità e un sistema di plugin estendibile (function call).

    **Funzionalità**

    **Upload file / knowledge base**
    LobeChat supporta upload di file e knowledge base. Puoi caricare documenti, immagini, audio e video e creare knowledge base per gestire e cercare file. File e knowledge base sono usabili anche nelle conversazioni per un dialogo più ricco.

    **Supporto multi-provider di modelli**
    Abbiamo implementato il supporto per i seguenti provider:
    - OpenAI
    - Ollama
    - Anthropic
    - Bedrock
    - Google
    - DeepSeek
    - HuggingFace
    - OpenRouter
    - Cloudflare Workers AI
    - GitHub

    **Supporto Large Language Model (LLM) locale**
    Per esigenze specifiche, LobeChat supporta anche modelli locali basati su Ollama, consentendo di usare modelli propri o di terze parti con flessibilità.

    **Riconoscimento visivo del modello**
    LobeChat supporta ora l'ultimo modello gpt-4-vision di OpenAI con capacità di riconoscimento visivo. Gli utenti possono caricare o trascinare immagini nella finestra di dialogo; l'agent riconosce il contenuto e conversa in modo intelligente.

    **Conversazione vocale TTS e STT**
    LobeChat supporta Text-to-Speech (TTS) e Speech-to-Text (STT), convertendo i messaggi di testo in voce chiara per interagire con l'agent come con una persona reale. Sono disponibili varie voci.

    **Generazione testo-immagine**
    Con la tecnologia più recente di text-to-image, gli utenti possono invocare strumenti di creazione immagini direttamente nella conversazione con l'agent.

    **Sistema di plugin (Function Calling)**
    L'ecosistema di plugin di LobeChat è un'importante estensione della funzionalità core e aumenta utilità e flessibilità dell'assistente.

    **Agent Market (GPTs)**
    Nel LobeChat Agent Marketplace i creator scoprono una community vibrante con molti agent ben progettati, utili nel lavoro e nell'apprendimento.

    **Supporto gestione multiutente**
    LobeChat supporta la gestione multiutente con due soluzioni principali di autenticazione e gestione:
    - next-auth: LobeChat integra next-auth, una libreria flessibile di verifica identità con più metodi
    - Clerk: Per gestione utenti più avanzata, LobeChat supporta anche Clerk, una piattaforma moderna di gestione utenti.

    **Progressive Web App (PWA) e adattamento mobile**
    Tramite PWA, LobeChat offre un'esperienza altamente ottimizzata su desktop e mobile restando leggero e performante.

    **Temi personalizzati**
    Come applicazione orientata a design e engineering, LobeChat valorizza la personalizzazione e introduce modalità tema flessibili — chiaro di giorno e scuro di notte. Oltre al cambio modalità, opzioni di colore permettono di adattare i colori del tema.
  upgradeDescription: |
    Corretti auth Olares, task asincroni ComfyUI e default di storage oggetti Cloudflare R2.

    Modifiche
    - Corretto il prefisso duplicato `JWKS_KEY=` che rompeva la firma JWT della generazione immagini asincrona
    - Aggiunto `INTERNAL_APP_URL=http://127.0.0.1:3210` per self-call in-pod (ComfyUI / async tRPC)
    - Aggiunti `AUTH_TRUSTED_ORIGINS` e `MIDDLEWARE_REWRITE_THROUGH_LOCAL=0` per entrance hash Olares e reverse proxy
    - `APP_URL` impostato all'entrance HTTPS; il patch di preload riscrive le self-call del pod su `INTERNAL_APP_URL` (ComfyUI 2.1.39)
    - Default R2: `S3_REGION=auto`, `S3_SET_ACL=0` (sostituisci i placeholder S3_* con il tuo bucket)

    Note
    - Ancora fissato a LobeHub v2.1.39 (>=2.1.40 richiede `pg_search` sul postgres di sistema Olares)
    - Il provider ComfyUI in 2.1.39 usa ancora `APP_URL` per `/webapi/create-image/comfyui`

    Note di rilascio complete: https://github.com/lobehub/lobehub/releases/tag/v2.1.39
