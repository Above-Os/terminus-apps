metadata:
  title: LobeChat
  description: Un framework de chat de IA de código abierto y diseño moderno
spec:
  fullDescription: |
    Lobe Chat es un UI/Framework ChatGPT/LLMs de código abierto y diseño moderno. Admite síntesis de voz, multimodalidad y un sistema de plugins extensible (function call).

    **Características**

    **Subida de archivos / base de conocimiento**
    LobeChat admite subida de archivos y bases de conocimiento. Puede subir documentos, imágenes, audio y vídeo, así como crear bases de conocimiento para gestionar y buscar archivos. También puede usar archivos y bases de conocimiento en conversaciones para una experiencia más rica.

    **Soporte de múltiples proveedores de modelos**
    Hemos implementado soporte para los siguientes proveedores:
    - OpenAI
    - Ollama
    - Anthropic
    - Bedrock
    - Google
    - DeepSeek
    - HuggingFace
    - OpenRouter
    - Cloudflare Workers AI
    - GitHub

    **Soporte de Large Language Model (LLM) local**
    Para necesidades específicas, LobeChat también admite modelos locales basados en Ollama, permitiendo usar modelos propios o de terceros con flexibilidad.

    **Reconocimiento visual del modelo**
    LobeChat ahora admite el último modelo gpt-4-vision de OpenAI con capacidades de reconocimiento visual. Los usuarios pueden subir o arrastrar imágenes al diálogo; el agente reconocerá el contenido e interactuará de forma inteligente.

    **Conversación por voz TTS y STT**
    LobeChat admite Text-to-Speech (TTS) y Speech-to-Text (STT), convirtiendo mensajes de texto en voz clara para interactuar con el agente como con una persona real. Hay varias voces disponibles.

    **Generación de texto a imagen**
    Con la tecnología más reciente de texto a imagen, los usuarios pueden invocar herramientas de creación de imágenes directamente en la conversación con el agente.

    **Sistema de plugins (Function Calling)**
    El ecosistema de plugins de LobeChat es una extensión importante de su funcionalidad principal y mejora mucho la utilidad y flexibilidad del asistente.

    **Agent Market (GPTs)**
    En el LobeChat Agent Marketplace, los creadores descubren una comunidad vibrante con muchos agentes bien diseñados, útiles en el trabajo y en el aprendizaje.

    **Soporte de gestión multiusuario**
    LobeChat admite gestión multiusuario con dos soluciones principales de autenticación y gestión:
    - next-auth: LobeChat integra next-auth, una biblioteca flexible de verificación de identidad con múltiples métodos
    - Clerk: Para gestión de usuarios más avanzada, LobeChat también admite Clerk, una plataforma moderna de gestión de usuarios.

    **Progressive Web App (PWA) y adaptación móvil**
    Mediante PWA, LobeChat ofrece una experiencia muy optimizada en escritorio y móvil manteniendo ligereza y alto rendimiento.

    **Temas personalizados**
    Como aplicación orientada al diseño e ingeniería, LobeChat valora la personalización e introduce modos de tema flexibles — claro de día y oscuro de noche. Además del cambio de modo, opciones de color permiten ajustar los colores del tema.
  upgradeDescription: |
    Corregir autenticación Olares, tareas asíncronas de ComfyUI y valores por defecto de almacenamiento R2 de Cloudflare.

    Cambios
    - Corregido el prefijo duplicado `JWKS_KEY=` que rompía la firma JWT de generación de imágenes asíncrona
    - Añadido `INTERNAL_APP_URL=http://127.0.0.1:3210` para auto-llamadas in-pod (ComfyUI / async tRPC)
    - Añadidos `AUTH_TRUSTED_ORIGINS` y `MIDDLEWARE_REWRITE_THROUGH_LOCAL=0` para la entrada hash de Olares y el reverse proxy
    - `APP_URL` a la entrada HTTPS; el parche de preload reescribe auto-llamadas del pod a `INTERNAL_APP_URL` (ComfyUI 2.1.39)
    - Defaults R2: `S3_REGION=auto`, `S3_SET_ACL=0` (sustituya los marcadores S3_* por su bucket)

    Notas
    - Sigue fijado a LobeHub v2.1.39 (>=2.1.40 requiere `pg_search` en el postgres del sistema Olares)
    - El proveedor ComfyUI en 2.1.39 sigue usando `APP_URL` para `/webapi/create-image/comfyui`

    Nota de versión completa: https://github.com/lobehub/lobehub/releases/tag/v2.1.39
