metadata:
  title: LobeChat
  description: Un framework de chat IA open source au design moderne.
spec:
  fullDescription: |
    Lobe Chat est un UI/Framework ChatGPT/LLMs open source au design moderne. Il prend en charge la synthèse vocale, le multimodal et un système de plugins extensible (function call).

    **Fonctionnalités**

    **Upload de fichiers / base de connaissances**
    LobeChat prend en charge l'upload de fichiers et les bases de connaissances. Vous pouvez téléverser documents, images, audio et vidéo, et créer des bases de connaissances pour gérer et rechercher des fichiers. Fichiers et bases de connaissances sont aussi utilisables en conversation pour une expérience plus riche.

    **Prise en charge de plusieurs fournisseurs de modèles**
    Nous avons implémenté le support des fournisseurs suivants :
    - OpenAI
    - Ollama
    - Anthropic
    - Bedrock
    - Google
    - DeepSeek
    - HuggingFace
    - OpenRouter
    - Cloudflare Workers AI
    - GitHub

    **Prise en charge des Large Language Model (LLM) locaux**
    Pour des besoins spécifiques, LobeChat prend aussi en charge les modèles locaux basés sur Ollama, permettant d'utiliser ses propres modèles ou ceux de tiers avec flexibilité.

    **Reconnaissance visuelle du modèle**
    LobeChat prend désormais en charge le dernier modèle gpt-4-vision d'OpenAI avec capacités de reconnaissance visuelle. Les utilisateurs peuvent téléverser ou glisser des images dans la boîte de dialogue ; l'agent reconnaît le contenu et converse intelligemment.

    **Conversation vocale TTS et STT**
    LobeChat prend en charge Text-to-Speech (TTS) et Speech-to-Text (STT), convertissant les messages texte en voix claire pour interagir avec l'agent comme avec une personne réelle. Plusieurs voix sont disponibles.

    **Génération texte-image**
    Avec la dernière technologie text-to-image, les utilisateurs peuvent invoquer des outils de création d'images directement dans la conversation avec l'agent.

    **Système de plugins (Function Calling)**
    L'écosystème de plugins de LobeChat est une extension importante de sa fonctionnalité centrale et accroît grandement l'utilité et la flexibilité de l'assistant.

    **Agent Market (GPTs)**
    Dans le LobeChat Agent Marketplace, les créateurs découvrent une communauté vivante avec de nombreux agents bien conçus, utiles au travail et à l'apprentissage.

    **Prise en charge de la gestion multi-utilisateur**
    LobeChat prend en charge la gestion multi-utilisateur avec deux solutions principales d'authentification et de gestion :
    - next-auth : LobeChat intègre next-auth, une bibliothèque flexible de vérification d'identité avec plusieurs méthodes
    - Clerk : Pour une gestion utilisateurs plus avancée, LobeChat prend aussi en charge Clerk, une plateforme moderne de gestion utilisateurs.

    **Progressive Web App (PWA) et adaptation mobile**
    Via la PWA, LobeChat offre une expérience très optimisée sur desktop et mobile tout en restant léger et performant.

    **Thèmes personnalisés**
    En tant qu'application orientée design et ingénierie, LobeChat valorise la personnalisation et propose des modes de thème flexibles — clair le jour et sombre la nuit. Au-delà du changement de mode, des options de couleur permettent d'ajuster les couleurs du thème.
  upgradeDescription: |
    Correction de l'auth Olares, des tâches asynchrones ComfyUI et des défauts de stockage objets Cloudflare R2.

    Changements
    - Correction du préfixe `JWKS_KEY=` en double qui cassait la signature JWT de la génération d'images asynchrone
    - Ajout de `INTERNAL_APP_URL=http://127.0.0.1:3210` pour les auto-appels in-pod (ComfyUI / async tRPC)
    - Ajout de `AUTH_TRUSTED_ORIGINS` et `MIDDLEWARE_REWRITE_THROUGH_LOCAL=0` pour l'entrée hash Olares et le reverse proxy
    - `APP_URL` défini sur l'entrée HTTPS ; le patch de preload réécrit les auto-appels du pod vers `INTERNAL_APP_URL` (ComfyUI 2.1.39)
    - Défauts R2 : `S3_REGION=auto`, `S3_SET_ACL=0` (remplacez les placeholders S3_* par votre bucket)

    Notes
    - Toujours épinglé à LobeHub v2.1.39 (>=2.1.40 nécessite `pg_search` sur le postgres système Olares)
    - Le fournisseur ComfyUI en 2.1.39 utilise encore `APP_URL` pour `/webapi/create-image/comfyui`

    Notes de version complètes : https://github.com/lobehub/lobehub/releases/tag/v2.1.39
