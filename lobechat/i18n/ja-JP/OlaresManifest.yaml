metadata:
  title: LobeChat
  description: オープンソースでモダンデザインの AI チャットフレームワーク
spec:
  fullDescription: |
    Lobe Chat はオープンソースでモダンデザインの ChatGPT/LLMs UI/フレームワークです。音声合成、マルチモーダル、拡張可能な（function call）プラグインシステムに対応します。

    **機能**

    **ファイルアップロード／ナレッジベース**
    LobeChat はファイルアップロードとナレッジベース機能に対応。文書、画像、音声、動画など各種ファイルのアップロードやナレッジベース作成ができ、ファイル管理と検索が容易です。会話中にもファイルとナレッジベースを活用し、より豊かな対話が可能です。

    **マルチモデルサービスプロバイダー対応**
    次のモデルサービスプロバイダーに対応しています:
    - OpenAI
    - Ollama
    - Anthropic
    - Bedrock
    - Google
    - DeepSeek
    - HuggingFace
    - OpenRouter
    - Cloudflare Workers AI
    - GitHub

    **ローカル大規模言語モデル（LLM）対応**
    特定のニーズに応えるため、Ollama ベースのローカルモデルにも対応し、独自またはサードパーティモデルを柔軟に利用できます。

    **モデルの視覚認識**
    LobeChat は OpenAI 最新の gpt-4-vision モデルによる視覚認識に対応。画像をアップロードまたはドラッグ＆ドロップすると、エージェントが内容を認識し、それに基づく知的な会話が可能です。

    **TTS & STT 音声会話**
    Text-to-Speech（TTS）と Speech-to-Text（STT）に対応し、テキストメッセージを明瞭な音声に変換。実在の人のようにエージェントと対話できます。複数の声から選択可能です。

    **テキストから画像生成**
    最新のテキストから画像生成技術により、エージェントとの会話中に画像作成ツールを直接呼び出せます。

    **プラグインシステム（Function Calling）**
    LobeChat のプラグインエコシステムは中核機能の重要な拡張で、アシスタントの実用性と柔軟性を大きく高めます。

    **エージェントマーケット（GPTs）**
    LobeChat Agent Marketplace では、仕事にも学習にも役立つ、よく設計された多数のエージェントが集う活気あるコミュニティを発見できます。

    **マルチユーザー管理対応**
    LobeChat はマルチユーザー管理に対応し、認証・管理の主な 2 つのソリューションを提供します:
    - next-auth: 複数の認証方式をサポートする柔軟な本人確認ライブラリ next-auth を統合
    - Clerk: より高度なユーザー管理が必要な場合は、モダンなユーザー管理プラットフォーム Clerk にも対応

    **Progressive Web App（PWA）とモバイル対応**
    PWA により、軽量・高性能を保ちつつデスクトップとモバイルの両方で高度に最適化された体験を提供します。

    **カスタムテーマ**
    デザインエンジニアリング志向のアプリとしてパーソナライズを重視し、昼のライトモードと夜のダークモードなど柔軟なテーマモードを導入。モード切替に加え、好みに合わせてテーマカラーを調整できます。
  upgradeDescription: |
    Olares 認証、ComfyUI 非同期タスク、Cloudflare R2 オブジェクトストレージのデフォルトを修正。

    変更点
    - 非同期画像生成の JWT 署名を壊していた重複 `JWKS_KEY=` プレフィックスを修正
    - ポッド内セルフコール用に `INTERNAL_APP_URL=http://127.0.0.1:3210` を追加（ComfyUI / async tRPC）
    - Olares ハッシュエントランスとリバースプロキシ向けに `AUTH_TRUSTED_ORIGINS` と `MIDDLEWARE_REWRITE_THROUGH_LOCAL=0` を追加
    - `APP_URL` を HTTPS エントランスに設定; プリロードパッチがポッドセルフコールを `INTERNAL_APP_URL` に書き換え（2.1.39 ComfyUI）
    - R2 デフォルト追加: `S3_REGION=auto`、`S3_SET_ACL=0`（S3_* プレースホルダをバケットに置換）

    注意
    - 引き続き LobeHub v2.1.39 にピン留め（>=2.1.40 は Olares システム postgres に `pg_search` が必要）
    - 2.1.39 の ComfyUI プロバイダーは `/webapi/create-image/comfyui` に引き続き `APP_URL` を使用

    リリースノート全文: https://github.com/lobehub/lobehub/releases/tag/v2.1.39
