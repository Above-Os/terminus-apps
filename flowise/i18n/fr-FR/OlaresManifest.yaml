metadata:
  title: Flowise
  description: Interface glisser-déposer pour créer votre flux LLM personnalisé
spec:
  fullDescription: |
    Flowise est un outil low-code open source permettant aux développeurs de créer des flux d'orchestration LLM personnalisés et des agents IA
    
    **Fonctionnalités**
    Itérez, rapidement
    - Développer des apps LLM demande d'innombrables itérations. Avec l'approche low-code, nous permettons des itérations rapides du test à la production
    
    Orchestration LLM
    - Connectez les LLM à la mémoire, aux chargeurs de données, au cache, à la modération et bien plus. (Langchain, LlamaIndex, plus de 100 intégrations)
    
    Agents et assistants
    - Créez des agents autonomes qui utilisent des outils pour exécuter différentes tâches. (Custom Tools, OpenAI Assistant, Function Agent)
    
    API, SDK, Embed
    - Étendez et intégrez à vos applications via APIs, SDK et Embedded Chat
    
    LLM open source
    - Exécutez dans un environnement air-gapped avec des LLM locaux, des embeddings et des bases de données vectorielles
