apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: vectorcraft
  appid: vectorcraft
  title: VectorCraft
  description: Illustrator-style vector illustration app that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/vectorcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.vectorcraft.png
  version: 0.1.2
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/VectorCraft/
spec:
  versionName: "0.11.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    VectorCraft is an open-source, Illustrator-comparable vector illustration
    app written in Rust. This app serves its WebAssembly build: editing runs
    entirely in your browser, and drawings never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs VectorCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/VectorCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/vectorcraft
  sourceCode: https://github.com/beclab/vectorcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/vectorcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "5"
  requiredMemory: 256Mi
  limitedMemory: 3584Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: vectorcraft
    host: vectorcraft-svc
    port: 8080
    title: VectorCraft
    icon: https://raw.githubusercontent.com/beclab/vectorcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.vectorcraft.png
    authLevel: private
    openMethod: window
  - name: vectorcraftmcp
    host: vectorcraft-svc
    port: 8090
    title: VectorCraft MCP
    icon: https://raw.githubusercontent.com/beclab/vectorcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.vectorcraft.png
    authLevel: internal
    invisible: true
options:
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  vectorcraft: 1
