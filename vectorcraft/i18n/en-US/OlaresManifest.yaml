metadata:
  title: VectorCraft
  description: Illustrator-style vector illustration app that runs in your browser
spec:
  fullDescription: |
    ## Overview
    VectorCraft is an open-source, Illustrator-comparable vector illustration
    app written in Rust. This app serves its WebAssembly build: editing runs
    entirely in your browser, and drawings never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs VectorCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    read and write files only in Home/VectorCraft. To keep editing an agent's
    result in the browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
