metadata:
  description: 高性能自建照片视频管理方案。
  title: Immich
spec:
  fullDescription: |
    **应用概览**
    Immich 是一个自建的照片和视频管理方案，允许您直接从手机备份重要回忆。

    主要功能包括：
    **网页和移动应用**
    Immich 提供便捷的网页界面及 iOS 和 Android 应用。轻松浏览、整理和管理媒体文件。

    **自动备份**
    像 Google Photos 一样，Immich 自动备份您的照片和视频。再也不用手动上传了！

    **批量上传**
    需要传输大量文件？Immich 支持批量上传，迁移媒体高效便捷。

    **分享给伙伴**
    与亲友分享特定相册或记忆。 Immich 让您能够共同协作和回顾。

    **人脸识别**
    Immich 能识别照片中的人脸，帮您轻松找到特定人或时刻。

    **逆地理编码**
    想知道某张照片的拍摄地点？Immich 会为您的媒体添加地点信息。

  upgradeDescription: |
    将 Immich 升级至 v3.3.5，包含上游安全修复。
    新增可选的 UPLOAD_LOCATION 配置，可将媒体存储在 NAS，数据库仍保留在 Olares。
    UPLOAD_LOCATION 留空时使用默认本地存储，填写已挂载的 NAS 目录时使用 NAS。切换前需先迁移完整媒体目录。
    https://github.com/immich-app/immich/releases/tag/v3.3.5
