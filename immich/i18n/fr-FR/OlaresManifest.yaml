metadata:
  title: Immich
  description: Solution auto-hébergée performante de gestion de photos et vidéos
spec:
  fullDescription: |
    **PRÉSENTATION**
    Immich est une solution auto-hébergée de gestion de photos et vidéos permettant de sauvegarder vos précieux souvenirs directement depuis votre téléphone.

    Fonctionnalités principales :
    **Portail Web et application mobile**
    Interface Web conviviale et application iOS et Android pour parcourir, organiser et gérer vos médias.

    **Sauvegarde automatique**
    Sauvegarde automatiquement vos photos et vidéos, comme Google Photos.

    **Importation en masse**
    Transférez efficacement de grands lots de fichiers.

    **Partage avec un partenaire**
    Partagez des albums ou souvenirs avec vos proches.

    **Reconnaissance faciale**
    Retrouvez facilement des personnes ou moments précis.

    **Géocodage inverse**
    Ajoute des informations de localisation à vos médias.
  upgradeDescription: |
    Version mise à niveau de v2.6.2 vers v2.7.5

    Immich v2.7.5 couvre la série v2.7.x avec des améliorations de la visionneuse, de la sécurité et de la déduplication, ainsi que de nombreux correctifs.

    Nouveautés (v2.7.0) :

    Retirer de l'album : nouvelle action dans la visionneuse pour les propriétaires de l'album ou du média.

    Raccourcis : 'e' ouvre l'éditeur, '[' ou ']' effectue une rotation de +/- 90 degrés et 'ENTER' enregistre et ferme.

    Créer un visage à la volée : créez une personne depuis l'éditeur d'étiquetage des visages.

    Déduplication : le serveur recommande le média à conserver selon sa taille et ses données EXIF, puis synchronise albums, favoris, note, description, visibilité, lieu et étiquettes.

    Configuration Helmet (CSP) : activez Content Security Policy avec IMMICH_HELMET_FILE=true ; les politiques personnalisées par chemin sont prises en charge.

    Vérification de version : utilise version.immich.cloud au lieu de github.com pour plus de confidentialité.

    Correctifs notables :
    - Téléchargement des Live Photos et vidéos dans Safari
    - Échappement HTML dans Panorama Photo Viewer (XSS)
    - Limitation et déduplication des vérifications de version
    - Affichage des images sur mobile
    - Recherche de personnes avec 3 caractères ou moins

    Notes complètes : https://github.com/immich-app/immich/releases/tag/v2.7.5
