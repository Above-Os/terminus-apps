metadata:
  title: Immich
  description: Leistungsstarke selbst gehostete Foto- und Videoverwaltung
spec:
  fullDescription: |
    **ÜBERBLICK**
    Immich ist eine selbst gehostete Foto- und Videoverwaltung, mit der Sie wertvolle Erinnerungen direkt vom Mobiltelefon sichern können.

    Wichtige Funktionen:
    **Webportal und mobile App**
    Benutzerfreundliche Weboberfläche sowie iOS- und Android-App zum Durchsuchen, Organisieren und Verwalten Ihrer Medien.

    **Automatische Sicherung**
    Fotos und Videos werden wie bei Google Photos automatisch gesichert.

    **Massen-Upload**
    Übertragen Sie große Dateimengen effizient.

    **Partnerfreigabe**
    Teilen Sie Alben oder Erinnerungen mit Freunden und Familie.

    **Gesichtserkennung**
    Findet Gesichter und erleichtert die Suche nach Personen oder Momenten.

    **Umgekehrte Geokodierung**
    Fügt Ihren Medien Standortinformationen hinzu.
  upgradeDescription: |
    App-Version von v2.6.2 auf v2.7.5 aktualisiert

    Willkommen bei Immich v2.7.5. Dieses Upgrade umfasst die v2.7.x-Reihe mit Verbesserungen an Medienansicht, Sicherheit, Deduplizierung und zahlreichen Fehlerbehebungen.

    Highlights (v2.7.0):

    Aus Album entfernen: Neue Aktion in der Medienansicht für Album- und Medieneigentümer.

    Editor-Kürzel: 'e' öffnet den Editor, '[' oder ']' dreht um +/- 90 Grad, 'ENTER' speichert und schließt.

    Gesicht spontan erstellen: Neue Person direkt im Gesichtserkennungseditor anlegen.

    Deduplizierung: Der Server empfiehlt anhand von Bildgröße und EXIF, welches Medium behalten wird, und synchronisiert Metadaten wie Alben, Favoriten, Bewertung, Beschreibung, Sichtbarkeit, Ort und Tags.

    Helmet-Konfiguration (CSP): Mit IMMICH_HELMET_FILE=true kann eine Content Security Policy aktiviert werden; eigene Richtlinien per Dateipfad werden unterstützt.

    Versionsprüfung: Nutzt für mehr Datenschutz version.immich.cloud statt github.com.

    Wichtige Fehlerbehebungen:
    - Live-Foto- und Video-Download in Safari
    - HTML-Escaping im Panorama Photo Viewer (XSS)
    - Ratenbegrenzung und Deduplizierung der Versionsprüfung
    - Bilddarstellung in der mobilen App
    - Personensuche mit höchstens 3 Zeichen

    Vollständige Hinweise: https://github.com/immich-app/immich/releases/tag/v2.7.5
