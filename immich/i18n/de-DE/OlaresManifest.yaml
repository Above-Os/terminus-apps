metadata:
  title: Immich
  description: Leistungsstarke selbst gehostete Foto- und Videoverwaltung
spec:
  fullDescription: |
    **ÜBERBLICK**
    Immich ist eine selbst gehostete Foto- und Videoverwaltung, mit der Sie wertvolle Erinnerungen direkt vom Mobiltelefon sichern können.

    Wichtige Funktionen:
    **Webportal und mobile App**
    Benutzerfreundliche Weboberfläche sowie iOS- und Android-App zum Durchsuchen, Organisieren und Verwalten Ihrer Medien.

    **Automatische Sicherung**
    Fotos und Videos werden wie bei Google Photos automatisch gesichert.

    **Massen-Upload**
    Übertragen Sie große Dateimengen effizient.

    **Partnerfreigabe**
    Teilen Sie Alben oder Erinnerungen mit Freunden und Familie.

    **Gesichtserkennung**
    Findet Gesichter und erleichtert die Suche nach Personen oder Momenten.

    **Umgekehrte Geokodierung**
    Fügt Ihren Medien Standortinformationen hinzu.
  upgradeDescription: |
    Aus Sicherheitsgründen entfällt die Olares-Einmalanmeldung (OIDC). Vor dem Upgrade die Passwortanmeldung aktivieren, unter Verwaltung → Benutzer für bestehende reine OIDC-Konten lokale Passwörter setzen und die Anmeldung im privaten Fenster testen. Danach Immich über den Olares-Desktop öffnen und mit der bisherigen E-Mail-Adresse und dem Immich-Passwort auf die eigene Bibliothek zugreifen. Eine gespeicherte OAuth-Einstellung nach erfolgreichem Test in Immich deaktivieren. Bei ausgesperrtem Administrator hilft immich-admin reset-admin-password im Immich-Servercontainer.

    Update von Immich v3.3.5 auf v3.4.2 mit JPEG XL, Tags auf Mobilgeräten und Workflows, die Fotos nach der Texterkennung anhand von Schlüsselwörtern in Alben sortieren können. Der Download von Integritätsberichten wurde korrigiert.
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - Korrigiert die Schreibrechte für Redis-Snapshots, damit Uploads und Hintergrundaufgaben nicht mehr an diesem Fehler scheitern.
    - Fehlende Vorschaubilder werden im Hintergrund erstellt. Bei alten Videos ohne Metadaten zuerst die Metadaten über das Videomenü aktualisieren und danach das Vorschaubild neu erstellen.
