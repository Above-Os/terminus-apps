metadata:
  title: Immich
  description: 高性能なセルフホスト型の写真・動画管理ソリューション
spec:
  fullDescription: |
    **概要**
    Immich はセルフホスト型の写真・動画管理ソリューションで、大切な思い出をスマートフォンから直接バックアップできます。

    主な機能:
    **Web ポータルとモバイルアプリ**
    使いやすい Web インターフェースと iOS/Android アプリでメディアを閲覧、整理、管理できます。

    **自動バックアップ**
    Google Photos のように写真と動画を自動バックアップします。

    **一括アップロード**
    大量のファイルを効率よく転送できます。

    **パートナー共有**
    アルバムや思い出を友人や家族と共有できます。

    **顔認識**
    写真内の顔を認識し、人物や場面を簡単に検索できます。

    **逆ジオコーディング**
    メディアに位置情報を追加します。
  upgradeDescription: |
    セキュリティ上の理由から、Olares シングルサインオン（OIDC）の提供を終了します。更新前に Immich のパスワードログインを有効にし、管理 → ユーザーで OIDC のみを使っていた既存アカウントにパスワードを設定し、プライベートウィンドウでログインを確認してください。更新後は Olares デスクトップから Immich を開き、元のメールアドレスと Immich のパスワードで同じライブラリにアクセスできます。OAuth 設定が残っている場合は、ログイン確認後に Immich の管理画面で無効にしてください。唯一の管理者がログインできない場合はサーバーコンテナで immich-admin enable-password-login を実行し、次に immich-admin reset-admin-password を実行してください。

    Immich を v3.3.5 から v3.4.2 に更新しました。JPEG XL、モバイル版のタグ、文字認識後にキーワードで写真を整理するワークフローに対応しました。整合性レポートのダウンロードも修正しました。
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - アップロード失敗やサムネイルの欠落、バックグラウンド処理のエラーを引き起こしていた Redis スナップショットの書き込み権限を修正しました。
    - 不足するサムネイルはバックグラウンドで生成されます。メタデータのない旧動画は、動画メニューからメタデータを更新し、完了後にサムネイルを再生成してください。 複数のファイルを処理するには、管理 → ジョブで不足分のメタデータ抽出を実行し、完了後に不足分のサムネイル生成を実行してください。
