metadata:
  title: Immich
  description: 高性能なセルフホスト型の写真・動画管理ソリューション。
spec:
  fullDescription: |
    **概要**
    Immich はセルフホスト型の写真・動画管理ソリューションで、大切な思い出をスマートフォンから直接バックアップできます。

    主な機能:
    **Web ポータルとモバイルアプリ**
    使いやすい Web インターフェースと iOS/Android アプリでメディアを閲覧、整理、管理できます。

    **自動バックアップ**
    Google Photos のように写真と動画を自動バックアップします。

    **一括アップロード**
    大量のファイルを効率よく転送できます。

    **パートナー共有**
    アルバムや思い出を友人や家族と共有できます。

    **顔認識**
    写真内の顔を認識し、人物や場面を簡単に検索できます。

    **逆ジオコーディング**
    メディアに位置情報を追加します。
  upgradeDescription: |
    アプリを v2.6.2 から v2.7.5 へアップグレード

    Immich v2.7.5 へようこそ。このアップグレードには、アセットビューアー、セキュリティ、重複排除の改善と多数の修正を含む v2.7.x シリーズが含まれます。

    主な変更（v2.7.0）:

    アルバムから削除: アルバムとアセットの所有者が使える新しい操作をアセットビューアーに追加。

    エディターショートカット: 'e' でエディターを開き、'[' または ']' で +/- 90 度回転、'ENTER' で保存して閉じます。

    顔をその場で作成: 顔タグエディターから新しい人物を直接作成できます。

    重複排除: 画像サイズと EXIF を基に残すアセットを自動提案し、アルバム、お気に入り、評価、説明、表示設定、場所、タグを同期します。

    Helmet 設定（CSP）: IMMICH_HELMET_FILE=true で Content Security Policy を有効化。ファイルパスによる独自ポリシーにも対応。

    バージョン確認: プライバシー向上のため github.com ではなく version.immich.cloud を使用。

    主な修正:
    - Safari での Live Photo と動画のダウンロード
    - Panorama Photo Viewer の HTML エスケープ（XSS）
    - バージョン確認のレート制限と重複排除
    - モバイルアプリの画像描画
    - 3文字以下の人物検索

    完全なリリースノート: https://github.com/immich-app/immich/releases/tag/v2.7.5
