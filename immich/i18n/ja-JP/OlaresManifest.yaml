metadata:
  title: Immich
  description: 高性能なセルフホスト型の写真・動画管理ソリューション
spec:
  fullDescription: |
    **概要**
    Immich はセルフホスト型の写真・動画管理ソリューションで、大切な思い出をスマートフォンから直接バックアップできます。

    主な機能:
    **Web ポータルとモバイルアプリ**
    使いやすい Web インターフェースと iOS/Android アプリでメディアを閲覧、整理、管理できます。

    **自動バックアップ**
    Google Photos のように写真と動画を自動バックアップします。

    **一括アップロード**
    大量のファイルを効率よく転送できます。

    **パートナー共有**
    アルバムや思い出を友人や家族と共有できます。

    **顔認識**
    写真内の顔を認識し、人物や場面を簡単に検索できます。

    **逆ジオコーディング**
    メディアに位置情報を追加します。
  upgradeDescription: |
    Upgrade Immich to v3.1.0 (`beclab/immich-app-immich-server` / `beclab/immich-app-immich-machine-learning` v3.1.0).

    Major release: back up Postgres and review Immich v3 migration notes before upgrading. Server and ML images must stay on the same tag.

    Release notes: https://github.com/immich-app/immich/releases
