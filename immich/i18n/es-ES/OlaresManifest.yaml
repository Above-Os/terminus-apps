metadata:
  title: Immich
  description: Solución autoalojada de alto rendimiento para gestionar fotos y vídeos.
spec:
  fullDescription: |
    **DESCRIPCIÓN GENERAL**
    Immich es una solución autoalojada para gestionar fotos y vídeos que permite guardar tus recuerdos directamente desde el móvil.

    Funciones principales:
    **Portal web y aplicación móvil**
    Interfaz web intuitiva y aplicación para iOS y Android para explorar, organizar y gestionar tus archivos.

    **Copia automática**
    Copia tus fotos y vídeos automáticamente, como Google Photos.

    **Carga masiva**
    Transfiere grandes lotes de archivos con eficiencia.

    **Compartir con socios**
    Comparte álbumes o recuerdos con amigos y familiares.

    **Reconocimiento facial**
    Encuentra personas o momentos mediante el reconocimiento de rostros.

    **Geocodificación inversa**
    Añade información de ubicación a tus archivos.
  upgradeDescription: |
    Versión actualizada de v2.6.2 a v2.7.5

    Immich v2.7.5 abarca la serie v2.7.x e incluye mejoras en el visor, seguridad, deduplicación y numerosas correcciones.

    Novedades (v2.7.0):

    Quitar del álbum: nueva acción en el visor para propietarios del álbum o recurso.

    Atajos del editor: 'e' abre el editor, '[' o ']' gira +/- 90 grados y 'ENTER' guarda y cierra.

    Crear rostro al instante: crea una persona desde el editor de etiquetas faciales.

    Deduplicación: el servidor recomienda qué recurso conservar según tamaño y EXIF, y sincroniza álbumes, favoritos, valoración, descripción, visibilidad, ubicación y etiquetas.

    Configuración Helmet (CSP): activa Content Security Policy con IMMICH_HELMET_FILE=true; admite políticas personalizadas mediante una ruta.

    Comprobación de versión: usa version.immich.cloud en lugar de github.com para mejorar la privacidad.

    Correcciones destacadas:
    - Descarga de Live Photos y vídeos en Safari
    - Escape de HTML en Panorama Photo Viewer (XSS)
    - Límite y deduplicación de comprobaciones de versión
    - Renderizado de imágenes en móvil
    - Búsqueda de personas con 3 caracteres o menos

    Notas completas: https://github.com/immich-app/immich/releases/tag/v2.7.5
