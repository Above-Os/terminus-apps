metadata:
  title: Immich
  description: Solución autoalojada de alto rendimiento para gestionar fotos y vídeos
spec:
  fullDescription: |
    **DESCRIPCIÓN GENERAL**
    Immich es una solución autoalojada para gestionar fotos y vídeos que permite guardar tus recuerdos directamente desde el móvil.

    Funciones principales:
    **Portal web y aplicación móvil**
    Interfaz web intuitiva y aplicación para iOS y Android para explorar, organizar y gestionar tus archivos.

    **Copia automática**
    Copia tus fotos y vídeos automáticamente, como Google Photos.

    **Carga masiva**
    Transfiere grandes lotes de archivos con eficiencia.

    **Compartir con socios**
    Comparte álbumes o recuerdos con amigos y familiares.

    **Reconocimiento facial**
    Encuentra personas o momentos mediante el reconocimiento de rostros.

    **Geocodificación inversa**
    Añade información de ubicación a tus archivos.
  upgradeDescription: |
    Actualiza Immich a v3.3.5 con correcciones de seguridad.
    Añade almacenamiento multimedia NAS mediante UPLOAD_LOCATION; la base de datos permanece en Olares.
    Deje UPLOAD_LOCATION vacío para usar almacenamiento local o indique una carpeta NAS montada. Antes de cambiar, migre toda la carpeta multimedia.
    https://github.com/immich-app/immich/releases/tag/v3.3.5
