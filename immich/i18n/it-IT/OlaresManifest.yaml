metadata:
  title: Immich
  description: Soluzione self-hosted ad alte prestazioni per gestire foto e video
spec:
  fullDescription: |
    **PANORAMICA**
    Immich è una soluzione self-hosted per gestire foto e video che consente di salvare i tuoi ricordi direttamente dal telefono.

    Funzioni principali:
    **Portale web e app mobile**
    Interfaccia web intuitiva e app iOS e Android per sfogliare, organizzare e gestire i media.

    **Backup automatico**
    Esegue automaticamente il backup di foto e video, come Google Photos.

    **Caricamento in massa**
    Trasferisce in modo efficiente grandi quantità di file.

    **Condivisione con partner**
    Condividi album o ricordi con amici e familiari.

    **Riconoscimento facciale**
    Trova più facilmente persone o momenti specifici.

    **Geocodifica inversa**
    Aggiunge informazioni sulla posizione ai media.
  upgradeDescription: |
    Per motivi di sicurezza viene dismesso l’accesso singolo Olares (OIDC). Prima di aggiornare, abilita l’accesso con password. In Amministrazione → Utenti imposta una password locale sugli account esistenti che usano solo OIDC e verifica l’accesso in una finestra privata. Dopo l’aggiornamento apri Immich dal desktop Olares e usa l’indirizzo e-mail originale e la password di Immich per accedere alla stessa libreria. Se OAuth rimane attivo, disattivalo in Immich dopo la verifica. Se l’unico amministratore perde l’accesso, esegui immich-admin enable-password-login e poi immich-admin reset-admin-password nel container del server.

    Aggiorna Immich dalla v3.3.5 alla v3.4.2 con supporto per JPEG XL, tag sui dispositivi mobili e flussi che organizzano le foto per parole chiave dopo il riconoscimento del testo. Corregge anche il download dei rapporti di integrità.
    https://github.com/immich-app/immich/releases/tag/v3.4.2

    - Corregge i permessi di scrittura degli snapshot Redis che causavano errori nei caricamenti e nei processi in background e impedivano la generazione delle miniature.
    - Le miniature mancanti vengono generate in background. Per i vecchi video privi di metadati, aggiorna prima i metadati dal menu del video e al termine rigenera la miniatura. Per più file, in Amministrazione → Attività avvia l’estrazione dei metadati mancanti. Al termine avvia la generazione delle miniature mancanti.
