metadata:
  title: Immich
  description: Soluzione self-hosted ad alte prestazioni per gestire foto e video.
spec:
  fullDescription: |
    **PANORAMICA**
    Immich è una soluzione self-hosted per gestire foto e video che consente di salvare i tuoi ricordi direttamente dal telefono.

    Funzioni principali:
    **Portale web e app mobile**
    Interfaccia web intuitiva e app iOS e Android per sfogliare, organizzare e gestire i media.

    **Backup automatico**
    Esegue automaticamente il backup di foto e video, come Google Photos.

    **Caricamento in massa**
    Trasferisce in modo efficiente grandi quantità di file.

    **Condivisione con partner**
    Condividi album o ricordi con amici e familiari.

    **Riconoscimento facciale**
    Trova più facilmente persone o momenti specifici.

    **Geocodifica inversa**
    Aggiunge informazioni sulla posizione ai media.
  upgradeDescription: |
    Versione aggiornata da v2.6.2 a v2.7.5

    Immich v2.7.5 copre la serie v2.7.x e include miglioramenti al visualizzatore, alla sicurezza, alla deduplicazione e numerose correzioni.

    Novità (v2.7.0):

    Rimuovi dall'album: nuova azione nel visualizzatore per proprietari dell'album o della risorsa.

    Scorciatoie editor: 'e' apre l'editor, '[' o ']' ruota di +/- 90 gradi e 'ENTER' salva e chiude.

    Crea volto al volo: crea una persona dall'editor dei tag facciali.

    Deduplicazione: il server suggerisce quale risorsa conservare in base a dimensioni ed EXIF e sincronizza album, preferiti, valutazione, descrizione, visibilità, posizione e tag.

    Configurazione Helmet (CSP): abilita Content Security Policy con IMMICH_HELMET_FILE=true; supporta criteri personalizzati tramite percorso file.

    Controllo versione: usa version.immich.cloud invece di github.com per maggiore privacy.

    Correzioni principali:
    - Download di Live Photo e video in Safari
    - Escape HTML in Panorama Photo Viewer (XSS)
    - Limite e deduplicazione dei controlli versione
    - Rendering immagini nell'app mobile
    - Ricerca persone con 3 caratteri o meno

    Note complete: https://github.com/immich-app/immich/releases/tag/v2.7.5
