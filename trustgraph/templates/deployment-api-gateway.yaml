apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-gateway
  name: api-gateway
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "api-gateway").replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        trustgraph.olares.com/chart-version: '0.1.13'
    spec:
      containers:
      - command:
        - api-gateway
        - --pubsub-backend
        - pulsar
        - --pulsar-host
        - pulsar://pulsar:6650
        - --timeout
        - '600'
        - --port
        - '8088'
        - --log-level
        - INFO
        - --no-loki-enabled
        image: docker.io/trustgraph/trustgraph-flow:2.10.10
        name: api-gateway
        ports:
        - containerPort: 8088
        resources:
          limits:
            cpu: '0.5'
            memory: 512M
          requests:
            cpu: '0.1'
            memory: 512M
        env:
        - name: HOME
          value: /tmp
      enableServiceLinks: false
      volumes: []
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  strategy:
    type: Recreate
