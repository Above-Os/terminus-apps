metadata:
  title: TrustGraph
  description: Piattaforma di intelligenza semantica e Graph RAG
spec:
  fullDescription: |
    TrustGraph è una piattaforma open source di intelligenza semantica che trasforma i documenti in conoscenze tracciabili per domande in linguaggio naturale e flussi di lavoro di IA.

    Carica documenti, esplora entità e relazioni e poni domande con Document RAG o Graph RAG. L’interfaccia web offre anche navigazione dei grafi, gestione dei prompt e query SPARQL.

    Questo pacchetto Olares archivia i documenti in Olares MinIO e si collega a Router tramite un’API compatibile con OpenAI. Durante l’installazione, inserisci l’URL dell’API dei modelli e la chiave API. Prima di elaborare documenti, avvia in Router un modello di chat, EmbeddingGemma e un modello di riordinamento. Il flusso predefinito usa vettori EmbeddingGemma a 768 dimensioni; Jina CLIP v2 richiede una raccolta separata a 1024 dimensioni. Usa raccolte distinte per dimensioni dei vettori diverse.

    La velocità di elaborazione e la qualità delle risposte dipendono dai modelli e dalle risorse configurati. Attualmente è stata verificata solo l’architettura amd64. L’applicazione richiede almeno 10 GiB di memoria, oltre alle risorse dei modelli.

    Imposta una password amministratore di 12–128 caratteri durante l’installazione e accedi come admin. Viene usata solo per creare l’account iniziale. Aggiornamenti e riavvii mantengono la password esistente; le modifiche successive si effettuano in TrustGraph.
