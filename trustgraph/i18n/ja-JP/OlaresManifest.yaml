metadata:
  title: TrustGraph
  description: セマンティックインテリジェンスと Graph RAG のプラットフォーム
spec:
  fullDescription: |
    TrustGraph は、文書を追跡可能な知識に変換し、自然言語による質問や AI ワークフローに活用するオープンソースのセマンティックインテリジェンスプラットフォームです。

    文書をアップロードし、エンティティと関係を探索して、Document RAG または Graph RAG で質問できます。Web インターフェースには、グラフのナビゲーション、プロンプト管理、SPARQL クエリも用意されています。

    この Olares パッケージは Olares MinIO に文書を保存し、OpenAI 互換 API を通じて Router に接続します。インストール時にモデル API の URL と API キーを入力してください。文書を処理する前に、Router でチャットモデル、EmbeddingGemma、リランキングモデルを起動します。既定のフローは 768 次元の EmbeddingGemma ベクトルを使用します。Jina CLIP v2 には、1024 次元の独立したコレクションが必要です。ベクトルの次元が異なる場合は、コレクションを分けてください。

    文書処理の速度と回答の品質は、設定したモデルとリソースによって異なります。現在、動作確認済みのアーキテクチャは amd64 のみです。アプリ自体に最低 10 GiB のメモリが必要で、モデルには追加のリソースが必要です。

    インストール時に 12～128 文字の管理者パスワードを設定し、ユーザー名 admin でログインします。このパスワードは初回のアカウント作成時にのみ使用されます。アップグレードや再起動では既存のパスワードを保持します。以後の変更は TrustGraph 内で行ってください。
