metadata:
  title: TrustGraph
  description: Plataforma de inteligencia semántica y Graph RAG
spec:
  fullDescription: |
    TrustGraph es una plataforma de inteligencia semántica de código abierto que convierte documentos en conocimiento trazable para preguntas en lenguaje natural y flujos de trabajo de IA.

    Suba documentos, explore sus entidades y relaciones y haga preguntas con Document RAG o Graph RAG. La interfaz web también ofrece navegación por grafos, gestión de instrucciones y consultas SPARQL.

    Este paquete de Olares almacena documentos en Olares MinIO y se conecta a Router mediante una API compatible con OpenAI. Durante la instalación, indique la URL de la API de modelos y la clave de API. Antes de procesar documentos, inicie en Router un modelo de chat, EmbeddingGemma y un modelo de reordenación. El flujo predeterminado utiliza vectores EmbeddingGemma de 768 dimensiones; Jina CLIP v2 requiere una colección independiente de 1024 dimensiones. Use colecciones distintas para dimensiones de vectores diferentes.

    La velocidad de procesamiento y la calidad de las respuestas dependen de los modelos y recursos configurados. Actualmente solo se ha validado amd64. La aplicación requiere al menos 10 GiB de memoria, además de los recursos de los modelos.

    Configure una contraseña de administrador de 12–128 caracteres durante la instalación e inicie sesión como admin. Solo se utiliza para crear la cuenta por primera vez. Las actualizaciones y los reinicios conservan la contraseña existente; los cambios posteriores se realizan en TrustGraph.
