metadata:
  title: Stable Fast 3D
  description: Reconstruction de maillage Stable Fast 3D
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé sur l'ensemble du système Olares. Cependant, chaque utilisateur doit tout de même installer une entrée bureau pour accéder et utiliser le service installé par l'Olares Admin.
    
    **APERÇU**
    Stable Fast 3D est un modèle open source de pointe pour la reconstruction rapide feedforward de maillages 3D à partir d'une seule image.
    
    Stable Fast 3D est basé sur TripoSR mais introduit plusieurs nouvelles techniques clés. D'une part, nous optimisons explicitement notre modèle pour produire de bons maillages sans artefacts ainsi que des textures avec UV unwrapping. Nous déluminons également la couleur et prédisons les paramètres de matériau afin que les assets puissent être facilement intégrés dans un jeu. Nous obtenons tout cela tout en conservant les vitesses d'inférence rapides de TripoSR.
  upgradeDescription: |
    Mettre à jour la configuration du Chart
    - Corriger l'injection GPU
