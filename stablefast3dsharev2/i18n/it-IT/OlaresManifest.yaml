metadata:
  title: Stable Fast 3D
  description: Ricostruzione mesh Stable Fast 3D
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Tuttavia, ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall'Olares Admin.
    
    **PANORAMICA**
    Stable Fast 3D è un modello open-source all'avanguardia per la rapida ricostruzione feedforward di mesh 3D a partire da una singola immagine.
    
    Stable Fast 3D si basa su TripoSR ma introduce diverse nuove tecniche chiave. Innanzitutto, ottimizziamo esplicitamente il nostro modello per produrre buone mesh senza artefatti insieme a texture con UV unwrapping. Inoltre delightiamo il colore e prevediamo i parametri dei materiali così che gli asset possano essere facilmente integrati in un gioco. Otteniamo tutto questo mantenendo le velocità di inferenza rapide di TripoSR.
  upgradeDescription: |
    Aggiornare la configurazione del Chart
    - Correzione dell'iniezione GPU
