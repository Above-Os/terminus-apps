metadata:
  title: Stable Fast 3D
  description: Reconstrucción de mallas Stable Fast 3D
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el Olares Admin.
    
    **DESCRIPCIÓN GENERAL**
    Stable Fast 3D es un modelo open-source de última generación para la reconstrucción rápida feedforward de mallas 3D a partir de una sola imagen.
    
    Stable Fast 3D se basa en TripoSR pero introduce varias técnicas clave nuevas. Por un lado, optimizamos explícitamente nuestro modelo para producir buenas mallas sin artefactos junto con texturas con UV unwrapping. También eliminamos el color y predecimos parámetros de material para que los assets se integren fácilmente en un juego. Logramos todo esto manteniendo las velocidades de inferencia rápidas de TripoSR.
  upgradeDescription: |
    Actualizar la configuración del Chart
    - Corregir la inyección de GPU
