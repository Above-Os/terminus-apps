metadata:
  title: Stable Fast 3D
  description: Stable Fast 3D メッシュ再構成
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でインストールされるサービスは 1 つだけです。ただし、各ユーザーは Olares Admin がインストールしたサービスにアクセスして使用するために、デスクトップエントリをインストールする必要があります。
    
    **概要**
    Stable Fast 3D は、単一画像からの高速フィードフォワード 3D メッシュ再構成のための最先端オープンソースモデルです。
    
    Stable Fast 3D は TripoSR をベースにしつつ、いくつかの新しい主要技術を導入しています。まず、アーティファクトのない良好なメッシュと UV 展開付きテクスチャを生成するようモデルを明示的に最適化しています。また色をディライトし、マテリアルパラメータを予測するため、アセットをゲームに容易に統合できます。これらすべてを、TripoSR の高速推論速度を維持したまま実現しています。
  upgradeDescription: |
    Chart 設定を更新
    - GPU 注入を修正
