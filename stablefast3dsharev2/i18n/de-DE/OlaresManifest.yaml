metadata:
  title: Stable Fast 3D
  description: Stable Fast 3D Mesh-Rekonstruktion
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsame App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer muss jedoch trotzdem einen Desktop-Eintrag installieren, um auf den vom Olares Admin installierten Dienst zuzugreifen und ihn zu nutzen.
    
    **ÜBERBLICK**
    Stable Fast 3D ist ein hochmodernes Open-Source-Modell für die schnelle Feedforward-3D-Mesh-Rekonstruktion aus einem einzelnen Bild.
    
    Stable Fast 3D basiert auf TripoSR, führt jedoch mehrere neue Schlüsseltechniken ein. Zum einen optimieren wir unser Modell ausdrücklich darauf, gute Meshes ohne Artefakte sowie Texturen mit UV-Unwrapping zu erzeugen. Wir entfärben außerdem die Farbe und sagen Materialparameter voraus, damit die Assets leicht in ein Spiel integriert werden können. All dies erreichen wir und behalten dabei die schnellen Inferenzgeschwindigkeiten von TripoSR bei.
  upgradeDescription: |
    Chart-Konfiguration aktualisieren
    - GPU-Injection behoben
