spec:
  versionName: "0.3.0"
  onlyAdmin: true
  fullDescription: |
    Upscale an image or a video to four times its width and height with Real-ESRGAN x4plus, a fast GAN upscaler that works frame by frame. Switch between image and video at the top of the panel. Compare an upscaled image with the original under a slider; for video, preview a few seconds side by side with the original, then upscale the whole video. Suited to animation, screenshots, screen recordings and clean low-resolution sources; for heavily compressed or old material a restoration model such as SeedVR2 does better.

    The app runs the model on your Olares for upscaling images and video:
    - Switch between image and video at the top, add one, and see its size and the size of the result before anything runs.
    - Compare an upscaled image with the original under a slider.
    - For video, preview a few seconds first and compare them with the original side by side, then upscale the whole video with the same settings; the sound of the source is kept.
    - A queue and a result feed shared by every device you open it on.
    - Uploads and results stay in a library on your Olares, across restarts.
    - The full ComfyUI editor opens with each workflow loaded, for changes beyond the app.
    - An admin installs it once for everyone on your Olares; each person's queue, uploads and results are their own, and projects share them with chosen people or everyone.
    - Files are kept under Common/Studio, in a folder per person.
    - Models download on first start and are shared with other ComfyUI apps and FlowStudio.
  upgradeDescription: |
    First release.
  developer: Olares
  website: https://github.com/beclab/flowstudio2
