metadata:
  title: "Real-ESRGAN"
  description: "Real-ESRGAN ingrandisce rapidamente immagini e video di 4 volte, con confronto prima/dopo e una breve anteprima video prima di elaborare tutto il video"
spec:
  fullDescription: |
    Ingrandisci un'immagine o un video a quattro volte larghezza e altezza con Real-ESRGAN x4plus, un upscaler GAN veloce che lavora fotogramma per fotogramma. Passa da immagine a video in alto nel pannello. Confronta un'immagine ingrandita con l'originale tramite un cursore; per i video, guarda in anteprima qualche secondo accanto all'originale, poi ingrandisci tutto il video. Adatto ad animazioni, screenshot, registrazioni dello schermo e sorgenti pulite a bassa risoluzione; per materiale molto compresso o vecchio funziona meglio un modello di restauro come SeedVR2.

    L'app esegue il modello sul tuo Olares per ingrandire immagini e video:
    - Scegli immagine o video in alto, aggiungine uno e vedi le sue dimensioni e quelle del risultato prima di avviare qualsiasi elaborazione.
    - Confronta un'immagine ingrandita con l'originale tramite un cursore.
    - Per i video, guarda prima qualche secondo in anteprima e confrontalo con l'originale fianco a fianco, poi ingrandisci tutto il video con le stesse impostazioni; l'audio della sorgente viene mantenuto.
    - Una coda e un feed di risultati condivisi su tutti i dispositivi.
    - Caricamenti e risultati restano in una libreria sul tuo Olares, anche dopo il riavvio.
    - L'editor ComfyUI completo si apre con ogni workflow caricato, per modifiche oltre l'app.
    - Un amministratore la installa una sola volta per tutti sul tuo Olares; coda, caricamenti e risultati di ciascuno restano personali, e i progetti permettono di condividerli con persone scelte o con tutti.
    - I file sono salvati in Common/Studio, in una cartella per persona.
    - I modelli vengono scaricati al primo avvio e condivisi con le altre app ComfyUI e FlowStudio.
  upgradeDescription: |
    Prima versione.
