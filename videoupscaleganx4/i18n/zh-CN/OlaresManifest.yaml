metadata:
  title: "Real-ESRGAN"
  description: "Real-ESRGAN 快速把图片和视频放大 4 倍，可对比前后效果，视频可先试渲染一小段再处理整段"
spec:
  fullDescription: |
    用 Real-ESRGAN x4plus 把图片或视频的宽和高各放大四倍，这是一个逐帧处理的快速 GAN 放大模型。在面板顶部切换图片和视频。放大后的图片可以用滑块与原图对比；视频可以先预览几秒并与原片并排对比，再放大整段。适合动画、截图、录屏和干净的低分辨率素材；压缩严重或老旧的素材，用 SeedVR2 这类修复模型效果更好。

    这个应用在你的 Olares 上运行该模型，用来放大图片和视频：
    - 在顶部切换图片或视频，添加一个文件，处理前就能看到它的尺寸和结果的尺寸。
    - 用滑块对比放大后的图片和原图。
    - 视频可以先预览几秒并与原片并排对比，再用同样的设置放大整段，保留原视频的声音。
    - 队列和结果流在所有设备上同步。
    - 上传的素材和生成结果保存在 Olares 的素材库中，重启后仍在。
    - 可以打开完整的 ComfyUI 编辑器，每个工作流都已载入，用于应用之外的修改。
    - 管理员安装一次，Olares 上的所有人都能用；每个人的队列、上传和结果各自独立，可以通过项目分享给指定的人或所有人。
    - 文件保存在 Common/Studio 下，每人一个文件夹。
    - 模型在首次启动时下载，并与其他 ComfyUI 应用和 FlowStudio 共享。
  upgradeDescription: |
    首次发布。
