metadata:
  title: "Real-ESRGAN"
  description: "Real-ESRGAN amplía imágenes y vídeos 4× rápidamente, con comparación de antes y después y una vista previa corta de vídeo antes de procesarlo entero"
spec:
  fullDescription: |
    Amplía una imagen o un vídeo a cuatro veces su anchura y altura con Real-ESRGAN x4plus, un ampliador GAN rápido que trabaja fotograma a fotograma. Cambia entre imagen y vídeo en la parte superior del panel. Compara una imagen ampliada con la original con un control deslizante; en vídeo, previsualiza unos segundos junto al original y después amplía el vídeo entero. Adecuado para animación, capturas de pantalla, grabaciones de pantalla y fuentes limpias de baja resolución; para material muy comprimido o antiguo funciona mejor un modelo de restauración como SeedVR2.

    La app ejecuta el modelo en tu Olares para ampliar imágenes y vídeo:
    - Elige imagen o vídeo arriba, añade uno y consulta su tamaño y el del resultado antes de procesar nada.
    - Compara una imagen ampliada con la original con un control deslizante.
    - En vídeo, previsualiza primero unos segundos y compáralos con el original lado a lado, y después amplía el vídeo entero con los mismos ajustes; se conserva el sonido del original.
    - Una cola y un feed de resultados compartidos en todos los dispositivos.
    - Las subidas y los resultados quedan en una biblioteca en tu Olares, también tras reiniciar.
    - El editor completo de ComfyUI se abre con cada flujo de trabajo cargado, para cambios más allá de la app.
    - Un administrador la instala una sola vez para todos en tu Olares; la cola, las subidas y los resultados de cada persona son suyos, y los proyectos permiten compartirlos con personas elegidas o con todos.
    - Los archivos se guardan en Common/Studio, en una carpeta por persona.
    - Los modelos se descargan en el primer inicio y se comparten con otras apps de ComfyUI y FlowStudio.
  upgradeDescription: |
    Primera versión.
