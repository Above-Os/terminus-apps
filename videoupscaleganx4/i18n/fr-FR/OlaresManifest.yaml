metadata:
  title: "Real-ESRGAN"
  description: "Real-ESRGAN agrandit rapidement images et vidéos par 4, avec une comparaison avant/après et un court aperçu vidéo avant de traiter toute la vidéo"
spec:
  fullDescription: |
    Agrandissez une image ou une vidéo à quatre fois sa largeur et sa hauteur avec Real-ESRGAN x4plus, un upscaler GAN rapide qui traite image par image. Passez de l'image à la vidéo en haut du panneau. Comparez une image agrandie avec l'original à l'aide d'un curseur ; pour une vidéo, prévisualisez quelques secondes côte à côte avec l'original, puis agrandissez toute la vidéo. Adapté à l'animation, aux captures d'écran, aux enregistrements d'écran et aux sources propres en basse résolution ; pour des contenus très compressés ou anciens, un modèle de restauration comme SeedVR2 fait mieux.

    L'app exécute le modèle sur votre Olares pour agrandir images et vidéos :
    - Choisissez image ou vidéo en haut, ajoutez un fichier et voyez sa taille et celle du résultat avant tout traitement.
    - Comparez une image agrandie avec l'original à l'aide d'un curseur.
    - Pour une vidéo, prévisualisez d'abord quelques secondes et comparez-les côte à côte avec l'original, puis agrandissez toute la vidéo avec les mêmes réglages ; le son de la source est conservé.
    - Une file d'attente et un fil de résultats partagés sur tous les appareils.
    - Les imports et les résultats restent dans une bibliothèque sur votre Olares, même après un redémarrage.
    - L'éditeur ComfyUI complet s'ouvre avec chaque workflow chargé, pour aller au-delà de l'app.
    - Un administrateur l'installe une seule fois pour tous sur votre Olares ; la file d'attente, les imports et les résultats de chacun lui restent propres, et les projets permettent de les partager avec certaines personnes ou avec tous.
    - Les fichiers sont conservés dans Common/Studio, dans un dossier par personne.
    - Les modèles sont téléchargés au premier démarrage et partagés avec les autres apps ComfyUI et FlowStudio.
  upgradeDescription: |
    Première version.
