metadata:
  title: "Real-ESRGAN"
  description: "Real-ESRGAN は画像と動画をすばやく 4 倍に拡大します。前後の比較ができ、動画は全体を処理する前に短いプレビューを確認できます"
spec:
  fullDescription: |
    Real-ESRGAN x4plus で、画像や動画の幅と高さを 4 倍に拡大します。フレームごとに処理する高速な GAN アップスケーラーです。パネル上部で画像と動画を切り替えます。拡大した画像はスライダーで元画像と比較でき、動画は数秒を元の動画と並べてプレビューしてから全体を拡大できます。アニメ、スクリーンショット、画面録画、きれいな低解像度素材に向いています。圧縮の強い素材や古い素材には、SeedVR2 のような修復モデルのほうが適しています。

    このアプリは、Olares 上でこのモデルを動かして画像と動画を拡大します。
    - 上部で画像か動画を選んで追加すると、処理の前にサイズと結果のサイズがわかります。
    - 拡大した画像をスライダーで元画像と比較できます。
    - 動画はまず数秒をプレビューして元の動画と並べて比較し、同じ設定で全体を拡大します。元の動画の音声も残ります。
    - キューと結果のフィードはすべてのデバイスで共有されます。
    - アップロードと結果は Olares 上のライブラリに保存され、再起動後も残ります。
    - 各ワークフローを読み込んだ状態で ComfyUI エディターを開き、アプリ以外の変更もできます。
    - 管理者が一度インストールすれば Olares の全員が使えます。キュー、アップロード、結果は各自のもので、プロジェクトを使って選んだ人や全員と共有できます。
    - ファイルは Common/Studio の下に、ユーザーごとのフォルダーで保存されます。
    - モデルは初回起動時にダウンロードされ、他の ComfyUI アプリや FlowStudio と共有されます。
  upgradeDescription: |
    初回リリース。
