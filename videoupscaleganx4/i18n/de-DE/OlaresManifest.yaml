metadata:
  title: "Real-ESRGAN"
  description: "Real-ESRGAN skaliert Bilder und Videos schnell auf das Vierfache, mit Vorher-Nachher-Vergleich und einer kurzen Videovorschau, bevor das ganze Video läuft"
spec:
  fullDescription: |
    Skalieren Sie ein Bild oder Video mit Real-ESRGAN x4plus auf die vierfache Breite und Höhe, einem schnellen GAN-Upscaler, der Bild für Bild arbeitet. Oben im Bedienfeld wechseln Sie zwischen Bild und Video. Vergleichen Sie ein hochskaliertes Bild mit einem Schieberegler mit dem Original; bei Videos sehen Sie sich zuerst einige Sekunden neben dem Original an und skalieren dann das ganze Video. Geeignet für Animationen, Screenshots, Bildschirmaufnahmen und saubere, niedrig aufgelöste Quellen; für stark komprimiertes oder altes Material eignet sich ein Restaurierungsmodell wie SeedVR2 besser.

    Die App führt das Modell auf Ihrem Olares aus, um Bilder und Videos hochzuskalieren:
    - Wechseln Sie oben zwischen Bild und Video, fügen Sie eine Datei hinzu und sehen Sie ihre Größe und die Größe des Ergebnisses, bevor etwas läuft.
    - Vergleichen Sie ein hochskaliertes Bild mit einem Schieberegler mit dem Original.
    - Bei Videos sehen Sie sich zuerst einige Sekunden neben dem Original an und skalieren dann das ganze Video mit denselben Einstellungen; der Ton der Quelle bleibt erhalten.
    - Eine Warteschlange und ein Ergebnis-Feed, geteilt auf allen Geräten.
    - Uploads und Ergebnisse bleiben in einer Bibliothek auf Ihrem Olares, auch nach Neustarts.
    - Der vollständige ComfyUI-Editor öffnet sich mit dem jeweiligen Workflow, für Änderungen über die App hinaus.
    - Ein Admin installiert die App einmal für alle auf Ihrem Olares; Warteschlange, Uploads und Ergebnisse gehören jeder Person selbst, und Projekte teilen sie mit ausgewählten Personen oder allen.
    - Dateien liegen unter Common/Studio, in einem Ordner pro Person.
    - Modelle werden beim ersten Start heruntergeladen und mit anderen ComfyUI-Apps und FlowStudio geteilt.
  upgradeDescription: |
    Erste Veröffentlichung.
