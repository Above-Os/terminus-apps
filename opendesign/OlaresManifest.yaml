olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3

workloadReplicas:
  opendesign: 1
metadata:
  name: opendesign
  appid: opendesign
  title: Open Design
  description: Local-first AI design studio for slides, prototypes, and decks on Olares.
  icon: https://cdn.olares.com/images/2026/08/919ec8a2cbd0b0285ee33e455376c90b.png
  version: 0.0.9
  categories:
  - Creativity
  - agents
spec:
  versionName: '0.19.1'
  featuredImage: https://cdn.olares.com/images/2026/08/0021804b205933301ee29bb63136a996.png
  promoteImage:
  - https://cdn.olares.com/images/2026/08/0021804b205933301ee29bb63136a996.png
  - https://cdn.olares.com/images/2026/08/a8738623c1c6426d237529f3ecfa889d.png
  - https://cdn.olares.com/images/2026/08/f14baaf81c224fe76aa76c90aa04ea63.png
  fullDescription: |
    ## Overview
    Open Design is a local-first AI design studio from [nexu-io/open-design](https://github.com/nexu-io/open-design).
    On Olares it runs as a web app with BYOK model providers, OpenCode agent workflows, and real HTML/PDF/PPTX artifacts.

    ## Highlights
    - Generate slides, landing pages, wireframes, and design docs from prompts
    - Bring your own API key and connect Olares-hosted llama.cpp or LiteLLM gateways
    - Bundled OpenCode runtime for agent-driven design tasks
    - Persistent project data under appData

    ## Requirements
    - Olares >= 1.12.6
    - amd64 node
    - Optional: a local or Olares-hosted OpenAI-compatible model endpoint for BYOK runs

    ## Getting started
    1. Install from Market (test source: `market.test`).
    2. Open Open Design and go to **Settings → Models & Providers → API Provider**.
    3. Set Base URL, API key, and model; add internal Olares model hostnames to `OD_ALLOWED_INTERNAL_HOSTS` when needed.
    4. Start with a simple slide prompt, then move to multi-page decks.
  upgradeDescription: |
    ## Open Design 0.0.9

    - Initial Olares chart for nexu-io/od 0.19.1.
    - Auto-install OpenCode (musl) for BYOK agent runs.
    - Headless OpenCode permissions for bundled plugins and project dirs.
    - SSRF allowlist env for Olares-hosted model API entrances.
  developer: nexu-io
  website: https://open-design.ai/
  sourceCode: https://github.com/nexu-io/open-design
  submitter: harveyff
  locale:
  - en-US
  - zh-CN
  license:
  - text: Apache-2.0
    url: https://github.com/nexu-io/open-design/blob/main/LICENSE
  runAsUser: true
  requiredCpu: 0.1
  limitedCpu: 1
  requiredMemory: 256Mi
  limitedMemory: 2Gi
  requiredDisk: 128Mi
  limitedDisk: 8Gi
  supportArch:
  - amd64
permission:
  appData: true
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 443
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
envs:
  - envName: OPENAI_API_KEY
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_OPENAI_APIKEY
  - envName: ANTHROPIC_API_KEY
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_ANTHROPIC_APIKEY
  - envName: DEEPSEEK_API_KEY
    type: password
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: Optional DeepSeek API key for agent-driven design generation.
  - envName: OD_ALLOWED_INTERNAL_HOSTS
    type: string
    required: false
    editable: true
    applyOnChange: true
    default: ""
    description: >-
      Comma-separated hostnames Open Design may call for Olares-hosted model APIs.
      Required when Base URL points at another Olares app entrance (fixes
      "Internal IPs blocked" when fetching models). Example:
      abc12345.yourname.olares.com,def67890.shared.olares.com
entrances:
- name: opendesign
  host: opendesign
  port: 7456
  title: Open Design
  icon: https://cdn.olares.com/images/2026/08/919ec8a2cbd0b0285ee33e455376c90b.png
  openMethod: window
  authLevel: private
