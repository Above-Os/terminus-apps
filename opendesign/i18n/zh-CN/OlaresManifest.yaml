metadata:
  title: Open Design
  description: 在 Olares 上运行的本地优先 AI 设计工作室，支持幻灯片、原型与 Deck 生成

spec:
  fullDescription: |
    Open Design 来自 nexu-io/open-design，在 Olares 上以 Web 应用运行，支持 BYOK 模型提供商、OpenCode Agent 工作流，以及 HTML/PDF/PPTX 等真实产物。

    能力
    - 通过提示词生成幻灯片、落地页、线框图与设计文档
    - 可对接 Olares 上的 llama.cpp 或 LiteLLM 作为 OpenAI 兼容网关
    - 内置 OpenCode 运行时，支持 Agent 驱动的设计任务
    - 项目数据持久化在 appData

    Olares 推荐配置
    - 模型：优先使用本机 llama.cpp 部署的 Qwen3.8 本地模型（例如 Qwen3.8-27B）
    - Max tokens：在 Open Design 设置中建议设为 65536 或 32768，减少多步 Deck 任务被截断
    - Olares 托管模型 Base URL 的主机名会随 BYOK 配置自动放行；仅在需要时通过 OD_ALLOWED_INTERNAL_HOSTS 添加额外域名

    运行要求
    - Olares >= 1.12.6
    - amd64 或 arm64 节点

    开始使用
    1. 从 Market 安装 Open Design。
    2. 安装并启动 Qwen3.8 llama.cpp 本地模型，复制其 OpenAI 兼容 Base URL。
    3. 在 Open Design 中进入 设置 → 模型与提供商 → API 提供商，配置 Base URL、模型 ID，并将 Max tokens 设为 65536 或 32768。
    4. 先用简单单页任务验证，再尝试多页 Deck。
  upgradeDescription: |
    升级 Open Design 至 0.27.0。

    - 规划与制作合并为同一个任务展示，步骤按顺序排列，并显示累计耗时。
    - 支持以参考视频为起点创作动效，新增 13 个动效模板。
    - 问题表单会等待你的回答，不再在 10 分钟后自动提交。
    - 运行失败或被停止时，已输出的文字会保留。
    - 最近项目按你最近发送的消息排序。

    Olares 修复
    - 内置 OpenDesign Cloud 命令行工具（vela 0.1.8），修复云端登录、项目删除对话框和图库搜索。
    - OpenDesign 自己的 Qwen 思考限制为 OD_THINKING_TOKEN_BUDGET 个 token（2000）。使用同一模型的其他应用不受影响。
    - 云端登录会在浏览器中打开授权页。复制链接仍然可用。

    保留 OpenCode 1.18.30、私有模型地址支持及 /app/.od 中的现有数据。

    https://github.com/nexu-io/open-design/releases/tag/open-design-v0.27.0
