metadata:
  title: Surya OCR 2
  description: "Surya OCR 2 文档 OCR（GGUF）：llm-init + OCRAdapter + llama.cpp（仅 CUDA）"

spec:
  fullDescription: |
    **Surya OCR 2** 文档 OCR，以 GGUF 在 CUDA 上通过 llama.cpp 提供服务。

    **拓扑**
    客户端 → llm-init:8090 → ocradapter:8080 → llamacpp:8081（Redis 使用 Olares 中间件）。

    **模型** 来自 [datalab-to/surya-ocr-2-gguf](https://huggingface.co/datalab-to/surya-ocr-2-gguf)：
    只下载 `surya-2.gguf` 与 `surya-2-mmproj.gguf`（同仓 tokenizer/assets 不下载）。

    **加速器：** 仅 CUDA（`nvidia` / `nvidia-gb10`）。峰值显存约 8.1 GiB → 申请 **10Gi**。
