metadata:
  title: Surya OCR 2
  description: "Extracción multilingüe de texto de imágenes de documentos y PDF"

spec:
  upgradeDescription: |
    v1.0.39: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    Surya OCR 2 reconoce texto en imágenes de documentos y páginas PDF y convierte su contenido en texto que las aplicaciones Olares compatibles pueden procesar después.

    Esta aplicación usa el modelo Surya OCR 2 de Datalab en formato GGUF y admite GPU NVIDIA y GPU dedicadas AMD o Intel.

    Los pesos del modelo usan una versión modificada de la licencia AI Pubs Open RAIL-M. Salvo para uso personal o investigación, el uso por tu parte o por tu organización está restringido si los ingresos brutos del año anterior o la financiación total superan los 5 millones de dólares estadounidenses. La licencia también restringe el uso por proveedores de productos o servicios que compitan con Datalab. Consulta la licencia del modelo para conocer las condiciones completas y contacta con Datalab para obtener una licencia más amplia.
