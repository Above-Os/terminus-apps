metadata:
  title: Surya OCR 2
  description: "Surya OCR 2 document OCR (GGUF) via llm-init + OCRAdapter + llama.cpp (CUDA)"

spec:
  fullDescription: |
    **Surya OCR 2** document OCR, served as GGUF on CUDA via llama.cpp.

    **Stack**
    Client → llm-init:8090 → ocradapter:8080 → llamacpp:8081 (+ Olares Redis middleware).

    **Model** from [datalab-to/surya-ocr-2-gguf](https://huggingface.co/datalab-to/surya-ocr-2-gguf):
    `surya-2.gguf` + `surya-2-mmproj.gguf` (tokenizer/assets not downloaded).

    **Accelerator:** CUDA only (`nvidia` / `nvidia-gb10`). Peak VRAM ~8.1 GiB → **10Gi** GPU request.
