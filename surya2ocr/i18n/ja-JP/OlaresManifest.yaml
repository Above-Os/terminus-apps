metadata:
  title: Surya OCR 2
  description: "文書画像やPDFからの多言語テキスト抽出"

spec:
  upgradeDescription: |
    v1.0.39: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    Surya OCR 2は、文書画像やPDFページ内の文字を認識します。ページの内容をテキストに変換し、対応するOlaresアプリでの後続処理に利用できるようにします。

    このアプリは、DatalabのSurya OCR 2モデルをGGUF形式で使用し、NVIDIA GPU、AMDおよびIntelのディスクリートGPUに対応しています。

    モデルの重みには、修正版AI Pubs Open RAIL-Mライセンスが適用されます。個人利用や研究を除き、利用者または所属組織の前年の総売上高または累計資金調達額が500万米ドルを超える場合、利用が制限されます。また、Datalabと競合する製品やサービスの提供者による利用も制限されます。詳細はモデルのライセンスを確認し、より広い利用の許諾についてはDatalabにお問い合わせください。
