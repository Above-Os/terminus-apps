olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: surya2ocr
  icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
  description: "Surya OCR 2 document OCR (GGUF) via llm-init + OCRAdapter + llama.cpp (CUDA)"
  appid: surya2ocr
  title: Surya OCR 2
  version: '1.0.5'
  categories:
    - AI
sharedEntrances:
  - name: surya2ocr
    host: sharedentrances-api
    port: 0
    title: Surya OCR 2 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
entrances:
  - name: ocrclient
    port: 8090
    host: download-svc
    title: Surya OCR 2
    icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
    openMethod: window
    authLevel: internal
  - name: ocrapi
    port: 8090
    host: download-svc
    title: Surya OCR 2 API
    icon: https://app.cdn.olares.com/appstore/embeddinggemmav3/icon.png
    invisible: true
    openMethod: window
    authLevel: internal
#   surya2ocr   — llama.cpp CUDA (== appid / Release.Name)
#   llminit     — llm-init (ENGINE_KIND=ocr): download + /v1/ocr* proxy
#   ocradapter  — OCRAdapter job worker
workloadReplicas:
  surya2ocr: 1
  llminit: 1
  ocradapter: 1
spec:
  onlyAdmin: true
  versionName: 'datalab-to/surya-ocr-2-gguf'
  fullDescription: |
    **Surya OCR 2** document OCR, served as GGUF on CUDA via llama.cpp.

    **Stack** (same topology as llm-init `deploy/compose/ocr.yml`)
    ```
    Client → llm-init:8090 → ocradapter:8080 → llamacpp:8081
                                └─ Olares middleware Redis
    ```
    - **llm-init** (`ENGINE_KIND=ocr`, `MODEL_MODE=ocr`): downloads GGUF weights, progress UI, proxies `/v1/ocr*` and `/v1/models`.
    - **OCRAdapter**: async OCR jobs (Redis queue); pipeline `surya2`.
    - **llama.cpp** (CUDA): vision VLM with mmproj.

    **Model**
    Source: [datalab-to/surya-ocr-2-gguf](https://huggingface.co/datalab-to/surya-ocr-2-gguf)
    llm-init downloads **only** (comma dual-source, one `--include` each):
    - `surya-2.gguf` (~1.2 GiB) — main
    - `surya-2-mmproj.gguf` (~0.2 GiB) — projector
    Tokenizer / assets in the same repo are **not** downloaded.

    **Accelerator**
    CUDA only (`nvidia` / `nvidia-gb10`). No CPU / Intel mode.

    **Sizing** (local resource profile, png + pdf page1)
    - Peak VRAM ~8.1 GiB → request **10Gi** GPU memory
    - Stack RAM ~0.44 GiB peak (plus download headroom on llm-init)
    - Suggested engine CPU request **1250m**

  upgradeDescription: |
    v1.0.0: initial — Surya OCR 2 GGUF via llm-init + OCRAdapter + llama.cpp CUDA; Olares Redis middleware.

  developer: datalab-to
  website: https://huggingface.co/datalab-to/surya-ocr-2-gguf
  sourceCode: https://github.com/datalab-to/surya
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: OpenRAIL
      url: https://huggingface.co/datalab-to/surya-ocr-2-gguf

  accelerator:
    # Sum ≈ llamacpp + llm-init + ocradapter. GPU from surya2 peak ~8.1Gi → 10Gi.
    - mode: nvidia
      requiredCpu: "2"
      limitedCpu: "6"
      requiredMemory: "4Gi"
      limitedMemory: "8Gi"
      requiredDisk: "5Gi"
      limitedDisk: "50Gi"
      requiredGPUMemory: "10Gi"
      limitedGPUMemory: "11Gi"
    - mode: nvidia-gb10
      requiredCpu: "2"
      limitedCpu: "6"
      requiredMemory: "12Gi"
      limitedMemory: "16Gi"
      requiredDisk: "5Gi"
      limitedDisk: "50Gi"

  supportArch:
    - amd64
    - arm64

permission:
  appData: true
  appCache: true
  appCommon: true

middleware:
  redis:
    namespace: surya2ocr

options:
  apiTimeout: 0
  allowMultipleInstall: true
  LLMGatewaySupported: true
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system

envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    # Comma dual-source (each one --include) → two single-file hf downloads.
    # Do NOT use one hf:// with two --include: that path can leave only mmproj in snapshot.
    default: "hf://datalab-to/surya-ocr-2-gguf --include surya-2.gguf,hf://datalab-to/surya-ocr-2-gguf --include surya-2-mmproj.gguf"
    description: "Comma dual hf:// (main GGUF + mmproj). Each segment one --include so only the two GGUFs download."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "surya2"
    description: "OCRAdapter pipeline id (must be surya2)."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "ocr"
    options:
      - title: OCR
        value: ocr
  - envName: ENGINE_ARGS
    required: true
    type: string
    editable: true
    applyOnChange: true
    # Matches local resource profile; mmproj is auto-resolved beside the main GGUF.
    default: "-ngl 99 -c 16384 -n 4096 --image-min-tokens 1024"
    description: "llama.cpp flags on the engine Pod only (not llm-init). mmproj is auto-resolved next to the main GGUF."
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "10Gi"
    description: "Per-instance GPU memory (nvidia.com/gpumem). surya2 profile peak ~8.1Gi → 10Gi."
  - envName: LLAMACPP_CPU_REQUEST
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1250m"
  - envName: LLAMACPP_CPU_LIMIT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "4"
  - envName: LLAMACPP_MEMORY_REQUEST
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1Gi"
  - envName: LLAMACPP_MEMORY_LIMIT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "4Gi"
  - envName: OCR_PIPELINE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "surya2"
  - envName: OCR_MAX_INFLIGHT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1"
  - envName: OCR_PDF_STRATEGY
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "vision"
  - envName: OCR_DEFAULT_FORMAT
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "text"
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: LOG_LEVEL
    required: false
    editable: true
    applyOnChange: true
    default: "info"
    options:
      - title: debug
        value: debug
      - title: info
        value: info
      - title: warn
        value: warn
      - title: error
        value: error
