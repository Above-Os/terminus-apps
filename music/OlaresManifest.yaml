apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: music
  appid: music
  title: Music Studio
  description: A music studio for turning song ideas into finished tracks
  icon: https://raw.githubusercontent.com/Above-Os/terminus-apps/7c09017cb3b19fd491b15df6cc1cf5176ed4c70e/music/assets/icon.png
  version: 0.1.38
  categories:
    - Creativity
    - AI
spec:
  versionName: "0.1.35"
  runAsUser: true
  fullDescription: |
    Music Studio turns a song idea into a finished track. You can generate a song through a music model and keep the result in the app. Requests go through Router to the music model you select.

    **Key features**

    - Turn a song idea into a finished track.
    - Play and keep finished tracks in the app.
    - Choose a music model configured in Router.

    Router must be running, and at least one compatible music model must be available in Router. Music Studio does not install those models itself.
  developer: Olares
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 250m
  limitedCpu: "2"
  requiredMemory: 256Mi
  limitedMemory: 2Gi
  requiredDisk: 1Gi
  limitedDisk: 100Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
entrances:
  - name: music
    host: music-svc
    port: 8440
    title: Music Studio
    icon: https://raw.githubusercontent.com/Above-Os/terminus-apps/7c09017cb3b19fd491b15df6cc1cf5176ed4c70e/music/assets/icon.png
    authLevel: private
    openMethod: window
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
middleware:
  postgres:
    username: music
    databases:
      - name: music
        distributed: false
workloadReplicas:
  music: 1
