metadata:
  title: Music Studio
  description: Ein Musikstudio zum Umsetzen von Songideen in fertige Tracks

spec:
  fullDescription: |
    Music Studio macht aus einer Songidee einen fertigen Track. Es kann einen Song über ein Musikmodell erzeugen und das Ergebnis in der App behalten. Anfragen laufen über Router zu dem ausgewählten Musikmodell.

    **Hauptfunktionen**

    - Eine Songidee in einen fertigen Track umsetzen.
    - Fertige Tracks in der App abspielen und behalten.
    - Ein in Router konfiguriertes Musikmodell wählen.

    Router muss laufen, und in Router muss mindestens ein kompatibles Musikmodell verfügbar sein. Music Studio installiert diese Modelle nicht selbst.
