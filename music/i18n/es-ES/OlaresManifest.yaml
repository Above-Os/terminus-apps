metadata:
  title: Music Studio
  description: Un estudio musical para convertir ideas de canciones en pistas terminadas

spec:
  fullDescription: |
    Music Studio convierte una idea de canción en una pista terminada. Se puede generar una canción con un modelo musical y guardar el resultado en la aplicación. Las solicitudes pasan por Router al modelo musical seleccionado.

    **Funciones principales**

    - Convertir una idea de canción en una pista terminada.
    - Reproducir y guardar las pistas terminadas en la aplicación.
    - Elegir un modelo musical configurado en Router.

    Router debe estar en ejecución y en Router debe haber al menos un modelo musical compatible. Music Studio no instala esos modelos por sí mismo.
