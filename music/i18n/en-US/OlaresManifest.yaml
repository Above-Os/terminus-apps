metadata:
  title: Music Studio
  description: Create and keep AI-generated music on your Olares

spec:
  fullDescription: |
    ## Overview
    Music Studio turns song ideas into finished tracks through music models
    available in Olares Router. Generated masters are saved in the app's
    private data storage.

    Music Studio does not download or manage inference models. Generation
    requests are sent through Router to the music model selected by the user.

    ## Requirements
    - Olares >= 1.12.6
    - Router installed and running
    - A compatible music model configured in Router
    - Arch: amd64, arm64
