metadata:
  title: Music Studio
  description: A music studio for turning song ideas into finished tracks

spec:
  fullDescription: |
    Music Studio turns a song idea into a finished track. You can generate a song through a music model and keep the result in the app. Requests go through Router to the music model you select.

    **Key features**

    - Turn a song idea into a finished track.
    - Play and keep finished tracks in the app.
    - Choose a music model configured in Router.

    Router must be running, and at least one compatible music model must be available in Router. Music Studio does not install those models itself.
