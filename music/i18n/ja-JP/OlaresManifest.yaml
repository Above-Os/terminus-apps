metadata:
  title: Music Studio
  description: 曲のアイデアを完成した楽曲にするミュージックスタジオ

spec:
  fullDescription: |
    Music Studioは、曲のアイデアを完成した楽曲にします。音楽モデルで曲を生成し、結果をアプリ内に残せます。リクエストはRouter経由で、選択した音楽モデルに送られます。

    **主な機能**

    - 曲のアイデアを完成した楽曲にします。
    - 完成した楽曲をアプリ内で再生し、保存します。
    - Routerに設定された音楽モデルを選びます。

    Routerが稼働している必要があり、Routerで少なくとも1つの互換性のある音楽モデルが利用できる必要があります。Music Studioはこれらのモデルを自分ではインストールしません。
