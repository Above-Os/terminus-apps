metadata:
  title: 音乐工作室
  description: 在 Olares 上创作并保存 AI 生成的音乐

spec:
  fullDescription: |
    ## 简介
    音乐工作室通过 Olares Router 中可用的音乐模型，把歌曲灵感制作成
    完整曲目。生成的母带会保存在应用的私有数据目录中。

    音乐工作室不会下载或管理推理模型。生成请求会通过 Router 发送给
    用户选择的音乐模型。

    ## 运行要求
    - Olares >= 1.12.6
    - 已安装并运行 Router
    - Router 中已配置兼容的音乐模型
    - 架构：amd64、arm64
