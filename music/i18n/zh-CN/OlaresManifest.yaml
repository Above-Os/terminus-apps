metadata:
  title: Music Studio
  description: 用于把歌曲灵感做成完整曲目的音乐工作室

spec:
  fullDescription: |
    Music Studio 可将歌曲灵感做成完整曲目。可以通过音乐模型生成歌曲，并保存在应用中。请求经 Router 发到所选的音乐模型。

    **主要功能**

    - 将歌曲灵感做成完整曲目。
    - 在应用中播放并保存完成的曲目。
    - 选择在 Router 中已配置的音乐模型。

    Router 必须处于运行状态，并且其中至少要有一个兼容的音乐模型。Music Studio 不会自行安装这些模型。
