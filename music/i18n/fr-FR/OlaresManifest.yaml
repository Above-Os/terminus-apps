metadata:
  title: Music Studio
  description: Un studio musical pour transformer des idées de chanson en morceaux terminés

spec:
  fullDescription: |
    Music Studio transforme une idée de chanson en morceau terminé. On peut générer une chanson avec un modèle musical et conserver le résultat dans l'application. Les requêtes passent par Router vers le modèle musical choisi.

    **Fonctionnalités principales**

    - Transformer une idée de chanson en morceau terminé.
    - Lire et conserver les morceaux terminés dans l'application.
    - Choisir un modèle musical configuré dans Router.

    Router doit être en cours d'exécution, et au moins un modèle musical compatible doit être disponible dans Router. Music Studio n'installe pas ces modèles lui-même.
