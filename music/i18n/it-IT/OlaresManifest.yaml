metadata:
  title: Music Studio
  description: Uno studio musicale per trasformare idee di canzoni in brani finiti

spec:
  fullDescription: |
    Music Studio trasforma un'idea di canzone in un brano finito. Si può generare una canzone con un modello musicale e conservare il risultato nell'app. Le richieste passano da Router al modello musicale selezionato.

    **Funzionalità principali**

    - Trasformare un'idea di canzone in un brano finito.
    - Riprodurre e conservare i brani finiti nell'app.
    - Scegliere un modello musicale configurato in Router.

    Router deve essere in esecuzione e in Router deve essere disponibile almeno un modello musicale compatibile. Music Studio non installa questi modelli da solo.
