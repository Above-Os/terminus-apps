metadata:
  title: Obsidian LiveSync
  description: Server di sincronizzazione Obsidian.
spec:
  fullDescription: |
    **Credenziali predefinite**
    Nome utente: admin
    Password: password
    Cambia nome utente e password il prima possibile.
    
    **Panoramica**
    Self-hosted LiveSync è un plugin di sincronizzazione implementato dalla community, disponibile su ogni piattaforma compatibile con Obsidian e che usa CouchDB come server.
    Nota: Questo plugin non può sincronizzarsi con l'ufficiale «Obsidian Sync».
    
    **Funzionalità**
    - Sincronizza i vault in modo molto efficiente con meno traffico.
    
    - Buono con modifiche in conflitto.
      - Unione automatica per conflitti semplici.*
    
    - Usa una soluzione OSS per il server.
      - Si possono usare soluzioni compatibili.
    
    - Supporto della crittografia end-to-end.
    
    - Sincronizzazione di impostazioni, snippet, temi e plug-in tramite Customization sync (Beta) o Hidden File Sync
    
    - WebClip da obsidian-livesync-webclip
    
    Questo plug-in può essere utile per ricercatori, ingegneri e sviluppatori che devono mantenere le note completamente self-hosted per motivi di sicurezza. O semplicemente per chiunque voglia la tranquillità di sapere che le proprie note sono completamente private.
    
    **Importante**
    - Prima di installare o aggiornare questo plug-in, esegui il backup del vault.
    - Non abilitare questo plugin insieme a un'altra soluzione di sincronizzazione (inclusi iCloud e Obsidian Sync).
    - Questo è un plugin di sincronizzazione. Non è una soluzione di backup. Non affidarti a esso per i backup.
  upgradeDescription: |
    Impostare `apiTimeout: 0` per correggere il 504 dell'ingresso durante la replica LiveSync; correggere il reverse proxy nginx (`proxy_buffering off`, inoltro header, `proxy_read_timeout 3600s`).
