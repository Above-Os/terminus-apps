metadata:
  title: Obsidian LiveSync
  description: Obsidian 同期サーバー
spec:
  fullDescription: |
    **デフォルト認証情報**
    ユーザー名: admin
    パスワード: password
    できるだけ早くユーザー名とパスワードを変更してください。
    
    **概要**
    Self-hosted LiveSync はコミュニティ実装の同期プラグインで、Obsidian 互換のすべてのプラットフォームで利用でき、サーバーとして CouchDB を使用します。
    注意: このプラグインは公式の「Obsidian Sync」とは同期できません。
    
    **機能**
    - トラフィックを抑えつつ Vault を非常に効率的に同期。
    
    - 競合する変更に強い。
      - 単純な競合の自動マージ。*
    
    - サーバーに OSS ソリューションを使用。
      - 互換ソリューションも利用可能。
    
    - エンドツーエンド暗号化をサポート。
    
    - Customization sync（Beta）または Hidden File Sync による設定、スニペット、テーマ、プラグインの同期
    
    - obsidian-livesync-webclip からの WebClip
    
    このプラグインは、セキュリティ上の理由でノートを完全にセルフホストする必要がある研究者、エンジニア、開発者、あるいはノートが完全にプライベートであることを安心したいすべての人に役立つ可能性があります。
    
    **重要**
    - このプラグインをインストールまたはアップグレードする前に、Vault をバックアップしてください。
    - 他の同期ソリューション（iCloud や Obsidian Sync を含む）と同時にこのプラグインを有効にしないでください。
    - これは同期プラグインです。バックアップソリューションではありません。バックアップの目的で頼らないでください。
  upgradeDescription: |
    LiveSync レプリケーション中のエントランス 504 を修正するため `apiTimeout: 0` を設定；nginx リバースプロキシを修正（`proxy_buffering off`、ヘッダー転送、`proxy_read_timeout 3600s`）。
