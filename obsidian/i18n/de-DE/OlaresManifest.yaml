metadata:
  title: Obsidian LiveSync
  description: Obsidian-Sync-Server
spec:
  fullDescription: |
    **Standard-Zugangsdaten**
    Benutzername: admin
    Passwort: password
    Bitte ändern Sie Benutzername und Passwort so bald wie möglich.
    
    **Überblick**
    Self-hosted LiveSync ist ein von der Community implementiertes Synchronisations-Plugin, verfügbar auf jeder Obsidian-kompatiblen Plattform und mit CouchDB als Server.
    Hinweis: Dieses Plugin kann nicht mit dem offiziellen „Obsidian Sync“ synchronisieren.
    
    **Funktionen**
    - Vaults sehr effizient mit weniger Traffic synchronisieren.
    
    - Gut bei konfliktbehafteten Änderungen.
      - Automatisches Zusammenführen bei einfachen Konflikten.*
    
    - Verwendung einer OSS-Lösung für den Server.
      - Kompatible Lösungen können verwendet werden.
    
    - Unterstützung von Ende-zu-Ende-Verschlüsselung.
    
    - Synchronisation von Einstellungen, Snippets, Themes und Plug-ins über Customization sync (Beta) oder Hidden File Sync
    
    - WebClip von obsidian-livesync-webclip
    
    Dieses Plug-in kann nützlich sein für Forscher, Ingenieure und Entwickler, die ihre Notizen aus Sicherheitsgründen vollständig selbst hosten müssen. Oder einfach für jeden, der die Gewissheit möchte, dass seine Notizen vollständig privat sind.
    
    **Wichtig**
    - Sichern Sie Ihren Vault, bevor Sie dieses Plug-in installieren oder aktualisieren.
    - Aktivieren Sie dieses Plugin nicht gleichzeitig mit einer anderen Synchronisationslösung (einschließlich iCloud und Obsidian Sync).
    - Dies ist ein Synchronisations-Plugin. Keine Backup-Lösung. Verlassen Sie sich nicht darauf für Backups.
  upgradeDescription: |
    `apiTimeout: 0` setzen, um Entrance-504 während LiveSync-Replikation zu beheben; nginx-Reverse-Proxy korrigieren (`proxy_buffering off`, Header-Weiterleitung, `proxy_read_timeout 3600s`).
