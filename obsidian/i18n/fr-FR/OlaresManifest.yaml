metadata:
  title: Obsidian LiveSync
  description: Serveur de synchronisation Obsidian
spec:
  fullDescription: |
    **Identifiants par défaut**
    Nom d'utilisateur : admin
    Mot de passe : password
    Veuillez changer le nom d'utilisateur et le mot de passe dès que possible.
    
    **Aperçu**
    Self-hosted LiveSync est un plugin de synchronisation implémenté par la communauté, disponible sur toutes les plateformes compatibles Obsidian et utilisant CouchDB comme serveur.
    Note : Ce plugin ne peut pas synchroniser avec l'« Obsidian Sync » officiel.
    
    **Fonctionnalités**
    - Synchroniser les vaults très efficacement avec moins de trafic.
    
    - Bon avec les modifications en conflit.
      - Fusion automatique pour les conflits simples.*
    
    - Utilisation d'une solution OSS pour le serveur.
      - Des solutions compatibles peuvent être utilisées.
    
    - Prise en charge du chiffrement de bout en bout.
    
    - Synchronisation des paramètres, snippets, thèmes et plug-ins via Customization sync (Beta) ou Hidden File Sync
    
    - WebClip depuis obsidian-livesync-webclip
    
    Ce plug-in peut être utile aux chercheurs, ingénieurs et développeurs qui doivent garder leurs notes entièrement auto-hébergées pour des raisons de sécurité. Ou simplement à quiconque souhaite la tranquillité de savoir que ses notes sont entièrement privées.
    
    **Important**
    - Avant d'installer ou de mettre à jour ce plug-in, sauvegardez votre vault.
    - N'activez pas ce plugin en même temps qu'une autre solution de synchronisation (y compris iCloud et Obsidian Sync).
    - Ceci est un plugin de synchronisation. Pas une solution de sauvegarde. Ne vous y fiez pas pour les sauvegardes.
  upgradeDescription: |
    Définir `apiTimeout: 0` pour corriger le 504 de l'entrée pendant la réplication LiveSync ; corriger le reverse proxy nginx (`proxy_buffering off`, transfert des en-têtes, `proxy_read_timeout 3600s`).
