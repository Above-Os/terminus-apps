metadata:
  title: Obsidian LiveSync
  description: Servidor de sincronización de Obsidian
spec:
  fullDescription: |
    **Credenciales predeterminadas**
    Usuario: admin
    Contraseña: password
    Cambia el usuario y la contraseña lo antes posible.
    
    **Descripción general**
    Self-hosted LiveSync es un plugin de sincronización implementado por la comunidad, disponible en todas las plataformas compatibles con Obsidian y que usa CouchDB como servidor.
    Nota: Este plugin no puede sincronizar con el oficial «Obsidian Sync».
    
    **Funciones**
    - Sincroniza vaults de forma muy eficiente con menos tráfico.
    
    - Bueno con modificaciones en conflicto.
      - Fusión automática para conflictos simples.*
    
    - Usa una solución OSS para el servidor.
      - Se pueden usar soluciones compatibles.
    
    - Compatible con cifrado de extremo a extremo.
    
    - Sincronización de ajustes, snippets, temas y plug-ins mediante Customization sync (Beta) o Hidden File Sync
    
    - WebClip desde obsidian-livesync-webclip
    
    Este plug-in puede ser útil para investigadores, ingenieros y desarrolladores que necesitan mantener sus notas totalmente autoalojadas por seguridad. O simplemente para cualquiera que quiera la tranquilidad de saber que sus notas son totalmente privadas.
    
    **Importante**
    - Antes de instalar o actualizar este plug-in, haz una copia de seguridad de tu vault.
    - No actives este plugin a la vez que otra solución de sincronización (incluido iCloud y Obsidian Sync).
    - Este es un plugin de sincronización. No es una solución de backup. No confíes en él para backups.
  upgradeDescription: |
    Establecer `apiTimeout: 0` para corregir el 504 de la entrada durante la replicación LiveSync; corregir el reverse proxy nginx (`proxy_buffering off`, reenvío de cabeceras, `proxy_read_timeout 3600s`).
