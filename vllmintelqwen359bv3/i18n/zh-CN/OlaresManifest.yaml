metadata:
  description: "Qwen3.5-9B Intel Arc XPU vLLM — 面向 Arc Pro B70（intel-gpu 模式，32K 上下文）。"
  title: Qwen3.5-9B Intel Arc vLLM

spec:
  fullDescription: |
    **目标硬件**
    面向 **Intel Arc Pro B70** 及同档独立 Arc 显卡（约 32GB 显存）。安装时选择 **`intel-gpu`**
    加速模式。推理栈为 Intel **XPU**（oneAPI / Level Zero），镜像 `intel/vllm:0.21.0-ubuntu24.04-20260805`，
    llm-init v1.3.5。

    **模型：** `Qwen/Qwen3.5-9B` fp16，支持 thinking、tools（`--language-model-only` 纯文本）。

    **intel-gpu 预设：** 32K 上下文，GPU 预算 `28Gi`（OOM 可提到 `30Gi`）。

    **intel（核显 / 统一内存）：** 实验性支持；wrapper 限制 4K 上下文。

    | 模式        | 设备           | 推荐 | 上下文 |
    |-------------|----------------|------|--------|
    | `intel-gpu` | Arc 独显（B70） | 是   | 32K    |
    | `intel`     | 核显统一内存   | 实验 | 4K     |
  upgradeDescription: |
    v1.0.6：intel-gpu 32K 上下文；B70 导向描述。
    v1.0.5：intel-gpu 8192 上下文。
    v1.0.4：统一内存 intel 模式 4K 上限。
