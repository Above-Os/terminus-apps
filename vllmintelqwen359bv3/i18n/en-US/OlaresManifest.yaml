metadata:
  description: "Qwen3.5-9B on Intel Arc XPU vLLM — optimized for Arc Pro B70 (intel-gpu, 32K context)."
  title: Qwen3.5-9B Intel Arc vLLM

spec:
  fullDescription: |
    **Target hardware**
    Tuned for **Intel Arc Pro B70** and other discrete Intel Arc GPUs (~32GB VRAM).
    Install with compute mode **`intel-gpu`**. Engine stack: Intel **XPU** (oneAPI / Level Zero)
    via `intel/vllm:0.21.0-ubuntu24.04-20260805` and llm-init v1.3.5.

    **Model:** `Qwen/Qwen3.5-9B` fp16 — thinking + tools (text-only).

    **intel-gpu preset:** 32K context, `28Gi` GPU budget. Wrapper applies mode-specific caps.

    **intel (iGPU / unified):** experimental; 4K context cap only.

    | Mode        | Device              | Recommended | Context |
    |-------------|---------------------|-------------|---------|
    | `intel-gpu` | Arc discrete (B70…) | Yes         | 32K     |
    | `intel`     | iGPU unified memory | Experimental| 4K      |
  upgradeDescription: |
    v1.0.6: intel-gpu 32K context; B70-focused listing copy.
    v1.0.5: intel-gpu 8192 context.
    v1.0.4: Unified intel 4K cap for XE1 KV profiling.
