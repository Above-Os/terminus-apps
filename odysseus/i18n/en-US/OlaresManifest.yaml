metadata:
  title: Odysseus
  description: A self-hosted AI workspace for chat, research and personal productivity
spec:
  fullDescription: |
    Odysseus brings AI chat, agents, research and personal information into one self-hosted workspace.

    - Chat with local or cloud models, attach images and keep conversation history.
    - Use agents, skills and MCP tools for connected workflows.
    - Research the web and write reports with source links.
    - Manage documents, notes, tasks, email, calendars and contacts.
    - Connect compatible speech services for transcription and read-aloud.

    Olares Router and default-chat are configured automatically on first installation. Email and calendar integrations require your own service configuration.

    Word/PDF parsers are prepared in the background with download retries and mirror fallback. Download failures do not block app installation or startup. Document features become available when preparation succeeds. Built-in AI denoising, upscaling, background removal and SAM segmentation require additional model runtimes and are not included. Local GPU model serving and the host Docker socket are not configured by this package.
envs:
- envName: ADMIN_PASSWORD
  description: Initial admin password (8–72 characters). Leave blank to generate a password, saved in Files at Data/odysseus/workspace/admin-password.txt.
    Existing accounts retain their password.
- envName: SEARXNG_URL
  description: Optional SearXNG URL without /search. Leave blank to configure search later.
