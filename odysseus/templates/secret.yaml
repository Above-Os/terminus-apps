{{- $previous := lookup "v1" "Secret" .Release.Namespace "odysseus-config" -}}
{{- if and .Release.IsUpgrade $previous $previous.data -}}
{{- $url := index $previous.data "DATABASE_URL" | default "" | b64dec -}}
{{- if hasPrefix "postgres" $url -}}
{{- fail "This installation uses PostgreSQL. Migrate its data before switching to the SQLite chart." -}}
{{- end -}}
{{- end -}}
{{- $password := .Values.olaresEnv.ADMIN_PASSWORD | default "" -}}
{{- if not $password -}}
{{- if and $previous $previous.data (index $previous.data "ODYSSEUS_ADMIN_PASSWORD") -}}
{{- $password = index $previous.data "ODYSSEUS_ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: odysseus-config
  namespace: {{ .Release.Namespace | quote }}
type: Opaque
stringData:
  ODYSSEUS_ADMIN_PASSWORD: {{ $password | quote }}
  DATABASE_URL: sqlite:////app/data/app.db
