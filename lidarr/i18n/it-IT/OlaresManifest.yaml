metadata:
  title: Lidarr
  description: Un gestore di raccolte musicali per utenti Usenet e BitTorrent
spec:
  fullDescription: |
    Lidarr può monitorare più feed RSS per individuare nuovi album dei tuoi artisti preferiti e interagire con client e indicizzatori per recuperarli, ordinarli e rinominarli. Può inoltre essere configurato per migliorare automaticamente la qualità dei file esistenti nella libreria quando diventa disponibile un formato di qualità superiore.

    **Funzionalità principali:**
    - Supporto per le principali piattaforme: Windows, Linux, macOS, Raspberry Pi, ecc.
    - Rileva automaticamente le nuove tracce.
    - Può analizzare la libreria esistente e scaricare le tracce mancanti.
    - Può cercare versioni di qualità migliore delle tracce già presenti ed eseguire un aggiornamento automatico.
    - La gestione automatica dei download non riusciti proverà un'altra versione in caso di errore
    - Ricerca manuale per scegliere qualsiasi versione o vedere perché una versione non è stata scaricata automaticamente
    - Ridenominazione delle tracce completamente configurabile
    - Integrazione completa con SABnzbd e NZBGet
    - Integrazione completa con Kodi, Plex (notifiche, aggiornamento della libreria, metadati)
    - Supporto completo per contenuti speciali e pubblicazioni multi-album
    - E una splendida interfaccia utente
  upgradeDescription: |
    Aggiornamento di Lidarr alla versione 3.1.0 (2025-11-16)
    Modifiche alla configurazione: cambiare il percorso di montaggio della directory Olares e il livello di autenticazione dell'ingresso.
    - Cambiare il percorso di montaggio predefinito di Olares Home Directory in /olares/userdata/home
    - Passare all'immagine container linuxserver/lidarr
    - Livello di autenticazione dell'ingresso modificato in internal

    Punti salienti dell'aggiornamento:
    - [Importante] Migrazione a .NET 8; Basic Auth rimosso a favore dell'autenticazione tramite moduli
    - [qBittorrent] Corretta la verifica di riuscita dell'API /login di qBittorrent
    - [Miglioramenti] Reti note RFC 1918/IPv6 private; aggiornamenti di FluentMigrator e SQLite
    - [Correzioni] Il rilevamento dei file audio utilizza il percorso file corretto

    Note di rilascio complete: https://github.com/Lidarr/Lidarr/releases/tag/v3.1.0.4875
