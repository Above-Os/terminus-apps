metadata:
  title: Lidarr
  description: Ein Musikbibliotheks-Manager für Usenet- und BitTorrent-Benutzer
spec:
  fullDescription: |
    Lidarr kann mehrere RSS-Feeds auf neue Alben Ihrer Lieblingskünstler überwachen und mit Clients und Indexern zusammenarbeiten, um diese abzurufen, zu sortieren und umzubenennen. Es kann außerdem so konfiguriert werden, dass die Qualität vorhandener Dateien in der Bibliothek automatisch verbessert wird, sobald ein Format mit höherer Qualität verfügbar ist.

    **Wichtige Funktionen:**
    - Unterstützung wichtiger Plattformen: Windows, Linux, macOS, Raspberry Pi usw.
    - Erkennt neue Titel automatisch.
    - Kann Ihre vorhandene Bibliothek durchsuchen und fehlende Titel herunterladen.
    - Kann nach besserer Qualität bereits vorhandener Titel suchen und automatisch ein Upgrade durchführen.
    - Die automatische Behandlung fehlgeschlagener Downloads versucht bei einem Fehler eine andere Veröffentlichung
    - Manuelle Suche, damit Sie eine beliebige Veröffentlichung auswählen oder sehen können, warum eine Veröffentlichung nicht automatisch heruntergeladen wurde
    - Vollständig konfigurierbare Umbenennung von Titeln
    - Vollständige Integration mit SABnzbd und NZBGet
    - Vollständige Integration mit Kodi, Plex (Benachrichtigung, Bibliotheksaktualisierung, Metadaten)
    - Vollständige Unterstützung für Specials und Veröffentlichungen mit mehreren Alben
    - Und eine ansprechende Benutzeroberfläche
  upgradeDescription: |
    Upgrade von Lidarr auf Version 3.1.0 (2025-11-16)
    Konfigurationsänderungen: Olares-Verzeichnispfad und Authentifizierungsstufe des Eingangs ändern.
    - Standardmäßigen Mount-Pfad des Olares Home Directory in /olares/userdata/home ändern
    - Container-Image auf linuxserver/lidarr umstellen
    - Authentifizierungsstufe des Eingangs auf internal geändert

    Upgrade-Highlights:
    - [Wichtig] Migration auf .NET 8; Basic Auth zugunsten der Formularauthentifizierung entfernt
    - [qBittorrent] Erfolgsprüfung der qBittorrent-API /login korrigiert
    - [Verbesserungen] Bekannte RFC 1918/private IPv6-Netzwerke; Aktualisierungen für FluentMigrator und SQLite
    - [Korrekturen] Die Audiodateierkennung verwendet den richtigen Dateipfad

    Vollständige Versionshinweise: https://github.com/Lidarr/Lidarr/releases/tag/v3.1.0.4875
