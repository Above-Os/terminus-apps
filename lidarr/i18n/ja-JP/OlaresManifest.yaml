metadata:
  title: Lidarr
  description: Usenet および BitTorrent ユーザー向けの音楽コレクション管理ツール
spec:
  fullDescription: |
    Lidarr は複数の RSS フィードを監視してお気に入りのアーティストの新しいアルバムを検出し、クライアントやインデクサーと連携して取得、整理、名前変更を行います。また、より高品質な形式が利用可能になったときに、ライブラリ内の既存ファイルの品質を自動的にアップグレードするよう設定できます。

    **主な機能：**
    - Windows、Linux、macOS、Raspberry Pi などの主要プラットフォームに対応。
    - 新しいトラックを自動検出。
    - 既存のライブラリをスキャンし、不足しているトラックをダウンロード。
    - 既存トラックの高品質版を監視し、自動的にアップグレード。
    - ダウンロードに失敗した場合、別のリリースを自動的に試行
    - 任意のリリースを選択したり、自動ダウンロードされなかった理由を確認したりできる手動検索
    - 完全に設定可能なトラック名変更
    - SABnzbd および NZBGet との完全な統合
    - Kodi、Plex との完全な統合（通知、ライブラリ更新、メタデータ）
    - スペシャルおよび複数アルバムのリリースを完全サポート
    - 美しい UI
  upgradeDescription: |
    Lidarr をバージョン 3.1.0 (2025-11-16) にアップグレード
    設定変更：Olares ディレクトリのマウントパスと入口の認証レベルを変更。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - コンテナイメージを linuxserver/lidarr に変更
    - 入口の認証レベルを internal に変更

    アップグレードのハイライト：
    - [メジャー] .NET 8 へ移行。Basic Auth を廃止し、フォーム認証に変更
    - [qBittorrent] qBittorrent /login API の成功判定を修正
    - [改善] RFC 1918/プライベート IPv6 の既知ネットワーク、FluentMigrator と SQLite の更新
    - [修正] オーディオファイル検出で正しいファイルパスを使用

    完全なリリースノート：https://github.com/Lidarr/Lidarr/releases/tag/v3.1.0.4875
