metadata:
  title: Lidarr
  description: Un gestionnaire de collection musicale pour les utilisateurs d'Usenet et BitTorrent
spec:
  fullDescription: |
    Lidarr peut surveiller plusieurs flux RSS afin de détecter les nouveaux albums de vos artistes préférés et interagir avec des clients et des indexeurs pour les récupérer, les trier et les renommer. Il peut également être configuré pour améliorer automatiquement la qualité des fichiers existants de la bibliothèque lorsqu'un format de meilleure qualité devient disponible.

    **Fonctionnalités principales :**
    - Prise en charge des principales plateformes : Windows, Linux, macOS, Raspberry Pi, etc.
    - Détection automatique des nouvelles pistes.
    - Analyse de votre bibliothèque existante et téléchargement des pistes manquantes.
    - Recherche de versions de meilleure qualité des pistes existantes et mise à niveau automatique.
    - La gestion automatique des échecs de téléchargement essaie une autre version en cas d'échec
    - Recherche manuelle pour choisir n'importe quelle version ou savoir pourquoi une version n'a pas été téléchargée automatiquement
    - Renommage des pistes entièrement configurable
    - Intégration complète avec SABnzbd et NZBGet
    - Intégration complète avec Kodi, Plex (notification, mise à jour de la bibliothèque, métadonnées)
    - Prise en charge complète des contenus spéciaux et des sorties multi-albums
    - Et une superbe interface utilisateur
  upgradeDescription: |
    Mise à niveau de Lidarr vers la version 3.1.0 (2025-11-16)
    Modifications de configuration : changement du chemin de montage du répertoire Olares et du niveau d'authentification de l'entrée.
    - Remplacement du chemin de montage par défaut de Olares Home Directory par /olares/userdata/home
    - Remplacement de l'image du conteneur par linuxserver/lidarr
    - Niveau d'authentification de l'entrée remplacé par internal

    Points forts de la mise à niveau :
    - [Majeur] Migration vers .NET 8 ; suppression de Basic Auth au profit de l'authentification par formulaire
    - [qBittorrent] Correction de la vérification de réussite de l'API /login de qBittorrent
    - [Améliorations] Réseaux connus RFC 1918/IPv6 privés ; mises à jour de FluentMigrator et SQLite
    - [Corrections] La détection des fichiers audio utilise le chemin de fichier approprié

    Notes de version complètes : https://github.com/Lidarr/Lidarr/releases/tag/v3.1.0.4875
