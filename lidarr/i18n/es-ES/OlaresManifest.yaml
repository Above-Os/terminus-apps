metadata:
  title: Lidarr
  description: Un gestor de colecciones de música para usuarios de Usenet y BitTorrent
spec:
  fullDescription: |
    Lidarr puede supervisar varios canales RSS en busca de nuevos álbumes de sus artistas favoritos e interactuar con clientes e indexadores para obtenerlos, ordenarlos y cambiarles el nombre. También se puede configurar para mejorar automáticamente la calidad de los archivos existentes en la biblioteca cuando esté disponible un formato de mayor calidad.

    **Características principales:**
    - Compatibilidad con las principales plataformas: Windows, Linux, macOS, Raspberry Pi, etc.
    - Detecta automáticamente las pistas nuevas.
    - Puede analizar su biblioteca existente y descargar las pistas que falten.
    - Puede buscar versiones de mejor calidad de las pistas que ya tiene y actualizarlas automáticamente.
    - La gestión automática de descargas fallidas intentará otra versión si una falla
    - Búsqueda manual para elegir cualquier versión o ver por qué una versión no se descargó automáticamente
    - Cambio de nombre de pistas totalmente configurable
    - Integración completa con SABnzbd y NZBGet
    - Integración completa con Kodi, Plex (notificaciones, actualización de la biblioteca, metadatos)
    - Compatibilidad total con especiales y lanzamientos de varios álbumes
    - Y una atractiva interfaz de usuario
  upgradeDescription: |
    Actualización de Lidarr a la versión 3.1.0 (2025-11-16)
    Cambios de configuración: cambiar la ruta de montaje del directorio de Olares y el nivel de autenticación de la entrada.
    - Cambiar la ruta de montaje predeterminada de Olares Home Directory a /olares/userdata/home
    - Cambiar la imagen del contenedor a linuxserver/lidarr
    - El nivel de autenticación de la entrada cambió a internal

    Aspectos destacados de la actualización:
    - [Importante] Migración a .NET 8; se eliminó Basic Auth en favor de la autenticación mediante formularios
    - [qBittorrent] Se corrigió la comprobación de éxito de la API /login de qBittorrent
    - [Mejoras] Redes conocidas RFC 1918/IPv6 privadas; actualizaciones de FluentMigrator y SQLite
    - [Correcciones] La detección de archivos de audio utiliza la ruta de archivo correcta

    Notas completas de la versión: https://github.com/Lidarr/Lidarr/releases/tag/v3.1.0.4875
