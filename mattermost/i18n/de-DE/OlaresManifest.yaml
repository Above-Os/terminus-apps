metadata:
  title: Mattermost
  description: Eine Open-Source-Plattform für sichere Zusammenarbeit über den gesamten Softwareentwicklungslebenszyklus
spec:
  upgradeDescription: |
    Mattermost Team Edition von 11.8.2 auf 11.11.1 aktualisieren.

    **Anwendung**
    - Offizielles Image `mattermost/mattermost-team-edition:11.11.1` (linux/amd64)
    - Beim Start laufen die Datenbankmigrationen von v11.9 bis v11.11, einschließlich Enum für den Kanaltyp und Recap-Indizes in v11.11. Upstream erwartet keine Datenbank-Ausfallzeit.
    - PostgreSQL 14+ bleibt unverändert. Dieses Chart nutzt das Standard-Team-Edition-Image, nicht den FIPS-Build.
    - Ab v11.9 werden Redirect-Allowlists für OAuth Dynamic Client Registration je URL-Komponente geprüft. Ein Muster für Query-Strings braucht einen zusätzlichen `?**`-Eintrag. Dieses Chart konfiguriert DCR nicht.

    **Chart**
    - Das Deployment-Image ist fest verdrahtet, damit ein Upgrade 11.8.2 ersetzt, wenn gespeicherte Values `image` auslassen oder noch den alten Tag setzen.

    Release Notes: https://github.com/mattermost/mattermost/releases/tag/v11.11.1
    Upgrade Notes: https://docs.mattermost.com/administration-guide/upgrade/important-upgrade-notes
  fullDescription: |
    Mattermost ist eine Open-Source-Plattform für sichere Zusammenarbeit über den gesamten Softwareentwicklungslebenszyklus. Sie bietet sichere Unternehmenszusammenarbeit mit voller Kontrolle über Ihre Daten.

    **Warum Mattermost?**
    Die Produktivität von Teams überall steigern
    - Ein zentraler Ort für die Zusammenarbeit. Speziell für digitale Operationen konzipiert.

    Entwickler, Ops und alles dazwischen vereinen
    - Mattermost befähigt technische und operative Teams zur Zusammenarbeit, ohne die Sicherheit zu opfern.

    Channels
    - Die gesamte Teamkommunikation an einem Ort. Gehen Sie über allgemeine Zusammenarbeit hinaus und nutzen Sie Automatisierung, Slash-Befehle, Bot-Integrationen, Code-Snippets und mehr.

    Playbooks
    - Orchestrieren Sie Arbeit über Tools und Teams hinweg für Prozesse, die sowohl Zusammenarbeit als auch Struktur brauchen. Playbooks sind vorgegebene Workflows für spezifische digitale Betriebsszenarien und Anwendungsfälle mit zuverlässigen, wiederholbaren Prozessen.

    Calls
    - Verbinden Sie Ihr Team sicher in Echtzeit mit nativen Sprachanrufen in Channels. Vom Starten von Incident-War-Rooms über Pair Programming bis zu Team-Standups – Calls startet das Gespräch mit einem Klick.

    Connections
    - Passen Sie Ihre Plattform an und erweitern Sie sie durch Integration der Tools, auf die Ihr Team täglich angewiesen ist. Nutzen Sie tiefe Integrationen mit beliebten SaaS-Tools, finden Sie Community-Integrationen oder bauen Sie eigene mit unserem Plugin Framework und offenen APIs.

    Controls
    - Wählen Sie sicheres Cloud- oder On-Premise-Deployment und behalten Sie die vollständige Kontrolle über Ihre Daten. Individuelle Sicherheits-, Compliance- und Zugriffskontrollen stellen sicher, dass Ihre Daten dort bleiben, wo Sie sie haben wollen – und nirgendwo sonst.
