metadata:
  title: Mattermost
  description: "Una piattaforma open source per la collaborazione sicura lungo l'intero ciclo di\
  \ vita dello sviluppo software"
spec:
  upgradeDescription: |
    Aggiorna Mattermost Team Edition da 11.8.2 a 11.11.1.

    **Applicazione**
    - Immagine ufficiale `mattermost/mattermost-team-edition:11.11.1` (linux/amd64)
    - All'avvio vengono applicate le migrazioni del database da v11.9 a v11.11, inclusi l'enum del tipo di canale e gli indici recap di v11.11. L'upstream non prevede downtime del database.
    - PostgreSQL 14+ resta invariato. Questo chart usa l'immagine Team Edition standard, non la build FIPS.
    - Da v11.9 le allowlist di redirect per OAuth Dynamic Client Registration vengono confrontate per componente URL. Un pattern che deve corrispondere a una query string richiede una voce `?**` separata. Questo chart non configura DCR.

    **Chart**
    - L'immagine del Deployment è fissa, così un aggiornamento sostituisce 11.8.2 quando i values salvati omettono `image` o conservano il tag precedente.

    Note di rilascio: https://github.com/mattermost/mattermost/releases/tag/v11.11.1
    Note di aggiornamento: https://docs.mattermost.com/administration-guide/upgrade/important-upgrade-notes
  fullDescription: |
    Mattermost è una piattaforma open source per la collaborazione sicura lungo l'intero ciclo di vita dello sviluppo software. Offre collaborazione enterprise sicura con pieno controllo sui tuoi dati.

    **Perché Mattermost?**
    Aumentare la produttività dei team ovunque vadano
    - Un unico punto di collaborazione. Progettato specificamente per le operazioni digitali.

    Unire sviluppatori, ops e tutto ciò che sta in mezzo
    - Mattermost consente a team tecnici e operativi di collaborare senza sacrificare la sicurezza.

    Channels
    - Tutte le comunicazioni del team in un unico posto. Vai oltre la collaborazione generica includendo automazione, slash command, integrazioni bot, snippet di codice e altro.

    Playbooks
    - Orchestra il lavoro tra strumenti e team per processi che richiedono sia collaborazione sia struttura. I Playbooks sono workflow prescritti che supportano scenari e casi d'uso di operazioni digitali specifici che richiedono processi affidabili e ripetibili.

    Calls
    - Collega il team in modo sicuro in tempo reale con chiamate vocali native su Channels. Dal lancio di war room per incidenti al pair programming e agli standup di team, Calls avvia la conversazione con un clic.

    Connections
    - Personalizza ed estendi la piattaforma integrando gli strumenti su cui il team fa affidamento ogni giorno. Usa integrazioni profonde con strumenti SaaS popolari, trova integrazioni della community o creane di tue con il nostro Plugin Framework e le API aperte.

    Controls
    - Scegli un deployment cloud o on-premise sicuro e resta in completo controllo dei tuoi dati. Controlli personalizzati di sicurezza, conformità e accesso assicurano che i dati restino dove li vuoi, e nient'altro.
