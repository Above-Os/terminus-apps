metadata:
  title: Mattermost
  description: ソフトウェア開発ライフサイクル全体にわたる安全なコラボレーションのためのオープンソースプラットフォーム
spec:
  upgradeDescription: |
    Mattermost Team Edition を 11.8.2 から 11.11.1 へアップグレード。

    **アプリケーション**
    - 公式イメージ `mattermost/mattermost-team-edition:11.11.1`（linux/amd64）
    - 起動時に v11.9 から v11.11 のデータベース移行を適用。v11.11 のチャネル種別 enum と recap インデックスを含む。上流はデータベースの停止を想定していない。
    - PostgreSQL 14+ の要件は変わらない。この Chart は標準 Team Edition イメージを使い、FIPS ビルドではない。
    - v11.9 以降、OAuth Dynamic Client Registration のリダイレクト許可リストは URL コンポーネント単位で照合される。クエリ文字列に一致させるパターンには別の `?**` エントリが必要。この Chart は DCR を設定しない。

    **Chart**
    - Deployment のイメージを固定し、保存済み values に `image` が無い、または古い tag が残っていても 11.8.2 を置き換える。

    リリースノート: https://github.com/mattermost/mattermost/releases/tag/v11.11.1
    アップグレードノート: https://docs.mattermost.com/administration-guide/upgrade/important-upgrade-notes
  fullDescription: |
    Mattermost は、ソフトウェア開発ライフサイクル全体にわたる安全なコラボレーションのためのオープンソースプラットフォームです。データを完全に制御しながら、安全なエンタープライズコラボレーションを提供します。

    **なぜ Mattermost か？**
    チームの生産性をどこでも向上
    - コラボレーションの単一拠点。デジタルオペレーション向けに設計。

    開発・運用とその間すべてをつなぐ
    - Mattermost は技術・運用チームがセキュリティを犠牲にせずに協働できるようにします。

    Channels
    - チームのコミュニケーションを一か所に。自動化、スラッシュコマンド、ボット連携、コードスニペットなどで汎用コラボレーションを超えます。

    Playbooks
    - コラボレーションと構造の両方が必要なプロセス向けに、ツールとチームをまたいで作業をオーケストレーション。Playbooks は、信頼できる反復可能なプロセスが必要な特定のデジタル運用シナリオ向けの規定ワークフローです。

    Calls
    - Channels 上のネイティブ音声通話でチームを安全にリアルタイム接続。インシデントのウォールーム起動からペアプログラミング、チームスタンドアップまで、Calls はワンクリックで会話を開始します。

    Connections
    - チームが日々頼るツールと統合してプラットフォームをカスタマイズ・拡張。人気 SaaS ツールとの深い統合、コミュニティ製統合、Plugin Framework とオープン API による自作が可能です。

    Controls
    - 安全なクラウドまたはオンプレミス展開を選び、データを完全に制御。カスタムのセキュリティ・コンプライアンス・アクセス制御で、データが望む場所にだけ留まるようにします。
