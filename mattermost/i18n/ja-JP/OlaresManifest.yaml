metadata:
  title: Mattermost
  description: ソフトウェア開発ライフサイクル全体にわたる安全なコラボレーションのためのオープンソースプラットフォーム。
spec:
  upgradeDescription: |
    Mattermost を 9.9.1 から公式 Team Edition 11.8.2 へアップグレード。

    **アプリケーション**
    - `mattermost/mattermost-team-edition:11.8.2` に切り替え
    - `MM_*` 環境変数で PostgreSQL と Site URL を設定
    - メモリ上限を 4 GiB に引き上げ（Mattermost 11 は PostgreSQL 14+ が必要）

    **Chart 修正**
    - uid 1000 で実行；init コンテナがボリューム権限を修正
    - ファイルログを無効化；サーバープラグインディレクトリをマウントして権限エラーを修正

    リリースノート: https://github.com/mattermost/mattermost/releases/tag/v11.8.2
  fullDescription: |
    Mattermost は、ソフトウェア開発ライフサイクル全体にわたる安全なコラボレーションのためのオープンソースプラットフォームです。データを完全に制御しながら、安全なエンタープライズコラボレーションを提供します。

    **なぜ Mattermost か？**
    チームの生産性をどこでも向上
    - コラボレーションの単一拠点。デジタルオペレーション向けに設計。

    開発・運用とその間すべてをつなぐ
    - Mattermost は技術・運用チームがセキュリティを犠牲にせずに協働できるようにします。

    Channels
    - チームのコミュニケーションを一か所に。自動化、スラッシュコマンド、ボット連携、コードスニペットなどで汎用コラボレーションを超えます。

    Playbooks
    - コラボレーションと構造の両方が必要なプロセス向けに、ツールとチームをまたいで作業をオーケストレーション。Playbooks は、信頼できる反復可能なプロセスが必要な特定のデジタル運用シナリオ向けの規定ワークフローです。

    Calls
    - Channels 上のネイティブ音声通話でチームを安全にリアルタイム接続。インシデントのウォールーム起動からペアプログラミング、チームスタンドアップまで、Calls はワンクリックで会話を開始します。

    Connections
    - チームが日々頼るツールと統合してプラットフォームをカスタマイズ・拡張。人気 SaaS ツールとの深い統合、コミュニティ製統合、Plugin Framework とオープン API による自作が可能です。

    Controls
    - 安全なクラウドまたはオンプレミス展開を選び、データを完全に制御。カスタムのセキュリティ・コンプライアンス・アクセス制御で、データが望む場所にだけ留まるようにします。
