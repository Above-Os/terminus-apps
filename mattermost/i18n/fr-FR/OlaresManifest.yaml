metadata:
  title: Mattermost
  description: Une plateforme open source pour une collaboration sécurisée tout au long du cycle de vie du développement logiciel
spec:
  upgradeDescription: |
    Met à jour Mattermost Team Edition de 11.8.2 vers 11.11.0, en conservant PostgreSQL, les fichiers et la configuration. Sauvegardez la base de données et les fichiers avant la mise à jour, puis consultez les notes sur les migrations et la compatibilité des plugins.

    Release notes: https://github.com/mattermost/mattermost/releases/tag/v11.11.0
    Upgrade notes: https://docs.mattermost.com/administration-guide/upgrade/important-upgrade-notes

  fullDescription: |
    Mattermost est une plateforme open source pour une collaboration sécurisée tout au long du cycle de vie du développement logiciel. Elle vous offre une collaboration d'entreprise sécurisée avec un contrôle total sur vos données.

    **Pourquoi Mattermost ?**
    Booster la productivité des équipes partout où elles vont
    - Un point unique de collaboration. Conçu spécifiquement pour les opérations numériques.

    Réunir les développeurs, les ops et tout ce qui se trouve entre les deux
    - Mattermost permet aux équipes techniques et opérationnelles de collaborer sans sacrifier la sécurité.

    Channels
    - Toutes les communications de votre équipe en un seul endroit. Allez au-delà de la collaboration généraliste en incluant l'automatisation, les commandes slash, les intégrations de bots, les extraits de code, et plus encore.

    Playbooks
    - Orchestrez le travail entre outils et équipes pour des processus qui nécessitent à la fois collaboration et structure. Les Playbooks sont des workflows prescrits qui prennent en charge des scénarios et cas d'usage d'opérations numériques spécifiques nécessitant des processus fiables et répétables.

    Calls
    - Connectez votre équipe en toute sécurité en temps réel avec des appels vocaux natifs sur Channels. Du lancement de war rooms d'incident au pair programming et aux standups d'équipe, Calls démarre la conversation en un clic.

    Connections
    - Personnalisez et étendez votre plateforme en l'intégrant aux outils sur lesquels votre équipe s'appuie chaque jour. Utilisez des intégrations profondes avec des outils SaaS populaires, trouvez des intégrations de la communauté, ou créez les vôtres avec notre Plugin Framework et des API ouvertes.

    Controls
    - Choisissez un déploiement cloud ou on-premise sécurisé et restez en contrôle total de vos données. Des contrôles personnalisés de sécurité, de conformité et d'accès garantissent que vos données restent là où vous le souhaitez, et nulle part ailleurs.
