metadata:
  title: Mattermost
  description: Una plataforma de código abierto para la colaboración segura a lo largo de todo el ciclo de vida del desarrollo de software
spec:
  upgradeDescription: |
    Actualizar Mattermost de 9.9.1 a la Team Edition oficial 11.8.2.

    **Aplicación**
    - Cambiar a `mattermost/mattermost-team-edition:11.8.2`
    - Configurar PostgreSQL y Site URL mediante variables de entorno `MM_*`
    - Aumentar el límite de memoria a 4 GiB (Mattermost 11 requiere PostgreSQL 14+)

    **Correcciones del Chart**
    - Ejecutar como uid 1000; el init container corrige los permisos del volumen
    - Desactivar el registro en archivo; montar el directorio de plugins del servidor para corregir errores de permisos

    Notas de la versión: https://github.com/mattermost/mattermost/releases/tag/v11.8.2
  fullDescription: |
    Mattermost es una plataforma de código abierto para la colaboración segura a lo largo de todo el ciclo de vida del desarrollo de software. Le ofrece colaboración empresarial segura con control total sobre sus datos.

    **¿Por qué Mattermost?**
    Impulsar la productividad de los equipos dondequiera que vayan
    - Un único punto de colaboración. Diseñado específicamente para operaciones digitales.

    Unir a desarrollo, ops y todo lo intermedio
    - Mattermost permite a los equipos técnicos y operativos colaborar sin sacrificar la seguridad.

    Channels
    - Todas las comunicaciones de su equipo en un solo lugar. Vaya más allá de la colaboración de uso general e incluya automatización, comandos slash, integraciones de bots, fragmentos de código y más.

    Playbooks
    - Orqueste el trabajo entre herramientas y equipos para procesos que necesitan colaboración y estructura. Los Playbooks son flujos de trabajo prescritos que respaldan escenarios y casos de uso de operaciones digitales específicos que requieren procesos fiables y repetibles.

    Calls
    - Conecte a su equipo de forma segura en tiempo real con llamadas de voz nativas en Channels. Desde lanzar salas de crisis hasta programación en pareja y standups de equipo, Calls inicia la conversación con un clic.

    Connections
    - Personalice y amplíe su plataforma integrándola con las herramientas en las que su equipo confía cada día. Use integraciones profundas con herramientas SaaS populares, encuentre integraciones creadas por la comunidad o cree las suyas con nuestro Plugin Framework y APIs abiertas.

    Controls
    - Elija un despliegue seguro en la nube o local y mantenga el control total de sus datos. Controles personalizados de seguridad, cumplimiento y acceso garantizan que sus datos permanezcan donde usted quiere, y en ningún otro sitio.
