metadata:
  title: LLMFit
  description: ハードウェアを考慮した LLM 推奨の Web ダッシュボード
spec:
  fullDescription: |
    数百のモデルとプロバイダー。ハードウェアで動くものを見つけるワンコマンド。

    LLMFit は、システムの RAM・CPU・GPU に合わせて LLM モデルを適正サイズ化するツールです。ハードウェアを検出し、品質・速度・適合・コンテキストの各軸でモデルを採点し、実際にうまく動くものを教えてくれます。

    Web ダッシュボード付き。マルチ GPU、MoE アーキテクチャ、動的量子化選択、速度推定、ローカルランタイムプロバイダー（Ollama、llama.cpp、MLX、Docker Model Runner、LM Studio）に対応。

    **機能**
    * システム RAM、CPU コア、GPU（NVIDIA、AMD、Intel Arc、Apple Silicon、Ascend）を検出
    * 集約 VRAM によるマルチ GPU 対応
    * 品質・速度・適合・コンテキストの 4 軸でモデルを採点
    * 動的量子化選択（Q8_0〜Q2_K）
    * MoE（Mixture-of-Experts）アーキテクチャ対応
    * 実 GPU メモリ帯域に基づく速度推定
    * フィルタ・ソート・上位モデル選択付き Web ダッシュボード
    * Ollama、llama.cpp、MLX ランタイムプロバイダー検出をサポート
    * データベースに HuggingFace 由来の 200 以上のモデル
    * ユースケースフィルタ：General、Coding、Reasoning、Chat、Multimodal、Embedding
  upgradeDescription: |
    LLMFit イメージを beclab/harveyff-llmfit:1.1.9（chart 1.0.15）へアップグレード。

    変更点
    * イメージ：beclab/llmfit:v1.0.1 → beclab/harveyff-llmfit:1.1.9
    * メモリ/CPU 制限を引き上げ、モデル適合スコアリングが OOM で Pod を落とさないようにする
    * LLMFIT_ALLOW_REMOTE=1 を設定し、Olares entrance プロキシ配下でも plan/download API が動作するようにする
    * 長いダッシュボード要求向けに apiTimeout: 0 を維持
