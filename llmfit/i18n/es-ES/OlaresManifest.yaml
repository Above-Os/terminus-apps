metadata:
  title: LLMFit
  description: Panel web para recomendaciones de LLM conscientes del hardware
spec:
  fullDescription: |
    Cientos de modelos y proveedores. Un comando para encontrar qué funciona en tu hardware.

    LLMFit es una herramienta que ajusta los modelos LLM a la RAM, CPU y GPU de tu sistema. Detecta tu hardware, puntúa cada modelo en calidad, velocidad, ajuste y contexto, y te dice cuáles funcionarán bien en tu máquina.

    Incluye un panel web. Admite configuraciones multi-GPU, arquitecturas MoE, selección dinámica de cuantización, estimación de velocidad y proveedores de runtime locales (Ollama, llama.cpp, MLX, Docker Model Runner, LM Studio).

    **Funciones**
    * Detecta RAM del sistema, núcleos de CPU y GPU (NVIDIA, AMD, Intel Arc, Apple Silicon, Ascend)
    * Soporte multi-GPU con VRAM agregada
    * Puntúa modelos en 4 dimensiones: Calidad, Velocidad, Ajuste, Contexto
    * Selección dinámica de cuantización (Q8_0 a Q2_K)
    * Consciente de arquitecturas MoE (Mixture-of-Experts)
    * Estimación de velocidad basada en el ancho de banda real de memoria GPU
    * Panel web con filtrado, ordenación y selección de mejores modelos
    * Admite detección de proveedores de runtime Ollama, llama.cpp, MLX
    * Más de 200 modelos de HuggingFace en la base de datos
    * Filtrado por caso de uso: General, Coding, Reasoning, Chat, Multimodal, Embedding
  upgradeDescription: |
    Actualizar la imagen LLMFit a beclab/harveyff-llmfit:1.1.9 (chart 1.0.15).

    Cambios
    * Imagen: beclab/llmfit:v1.0.1 → beclab/harveyff-llmfit:1.1.9
    * Aumentar límites de memoria/CPU para que la puntuación de ajuste de modelos ya no mate el pod por OOM
    * Establecer LLMFIT_ALLOW_REMOTE=1 para que las APIs de plan/descarga funcionen detrás del proxy de entrada de Olares
    * Mantener apiTimeout: 0 para solicitudes largas del panel
