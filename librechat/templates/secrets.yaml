{{- $existingMeili := lookup "v1" "Secret" .Release.Namespace "librechat-meilisearch-secret" -}}
{{- $meiliKey := randAlphaNum 32 -}}
{{- if and $existingMeili $existingMeili.data (index $existingMeili.data "master-key") -}}
{{- $meiliKey = index $existingMeili.data "master-key" | b64dec -}}
{{- end -}}

{{- $existingSecrets := lookup "v1" "Secret" .Release.Namespace "librechat-secrets" -}}
{{- $jwtSecret := randAlphaNum 64 -}}
{{- $jwtRefresh := randAlphaNum 64 -}}
{{- $credsKey := sha256sum (randAlphaNum 64) -}}
{{- $credsIv := sha256sum (randAlphaNum 32) | trunc 32 -}}
{{- if $existingSecrets -}}
{{- if and $existingSecrets.data (index $existingSecrets.data "jwt-secret") -}}
{{- $jwtSecret = index $existingSecrets.data "jwt-secret" | b64dec -}}
{{- end -}}
{{- if and $existingSecrets.data (index $existingSecrets.data "jwt-refresh-secret") -}}
{{- $jwtRefresh = index $existingSecrets.data "jwt-refresh-secret" | b64dec -}}
{{- end -}}
{{- if and $existingSecrets.data (index $existingSecrets.data "creds-key") -}}
{{- $credsKey = index $existingSecrets.data "creds-key" | b64dec -}}
{{- end -}}
{{- if and $existingSecrets.data (index $existingSecrets.data "creds-iv") -}}
{{- $credsIv = index $existingSecrets.data "creds-iv" | b64dec -}}
{{- end -}}
{{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: librechat-mongodb-secret
  namespace: '{{ .Release.Namespace }}'
type: Opaque
stringData:
  password: "librechat123456"

---
apiVersion: v1
kind: Secret
metadata:
  name: librechat-meilisearch-secret
  namespace: '{{ .Release.Namespace }}'
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  master-key: {{ $meiliKey | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: librechat-secrets
  namespace: '{{ .Release.Namespace }}'
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt-secret: {{ $jwtSecret | quote }}
  jwt-refresh-secret: {{ $jwtRefresh | quote }}
  creds-key: {{ $credsKey | quote }}
  creds-iv: {{ $credsIv | quote }}
