metadata:
  title: Speakrs Diarization Fast
  description: 録音を匿名の話者区間に分割するローカルモデル

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization Fastは、録音を話者ごとの区間に分け、各人物が話した時間を示します。個人名を特定せず匿名ラベルを割り当て、ONNX Runtimeを使ってローカルで動作します。

    **主な機能**
    - 発話と話者の交代を検出します。
    - 録音全体で一貫した匿名の話者ラベルを割り当てます。
    - セグメンテーション、話者埋め込み、クラスタリングを一つの処理で行います。
    - 対応するOlaresアプリから話者ダイアライゼーション結果を利用できます。

    対応するNVIDIA GPUが必要です。
  upgradeDescription: |
    0.0.23：初回リリース。

entrances:
  - name: audiospeakrsdiarfastv3
    title: Speakrs Diarization Fast
