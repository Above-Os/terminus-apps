metadata:
  title: Speakrs Diarization Fast
  description: Un modelo local para dividir grabaciones en turnos de hablantes anónimos

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization Fast divide una grabación en turnos de habla y marca cuándo interviene cada persona. Asigna etiquetas anónimas sin identificar a las personas por su nombre y se ejecuta localmente con ONNX Runtime.

    **Funciones principales**
    - Detectar voz y cambios de hablante.
    - Asignar etiquetas anónimas coherentes en toda la grabación.
    - Procesar segmentación, representaciones de hablante y agrupación en una sola canalización.
    - Poner los resultados de diarización a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible.

entrances:
  - name: audiospeakrsdiarfastv3
    title: Speakrs Diarization Fast
