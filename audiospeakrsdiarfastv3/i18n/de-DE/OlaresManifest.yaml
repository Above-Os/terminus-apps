metadata:
  title: Speakrs Diarization Fast
  description: Ein lokales Modell zum Aufteilen von Aufnahmen in anonyme Sprecherabschnitte

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization Fast teilt eine Aufnahme in Sprecherabschnitte und markiert, wann jede Person spricht. Es vergibt anonyme Labels, ohne Personen namentlich zu identifizieren, und läuft lokal mit ONNX Runtime.

    **Hauptfunktionen**
    - Sprache und Sprecherwechsel erkennen.
    - Durchgängig anonyme Sprecherlabels zuweisen.
    - Segmentierung, Sprecher-Embeddings und Clustering in einer Pipeline verarbeiten.
    - Diarisierungsergebnisse für kompatible Olares-Anwendungen bereitstellen.

    Eine kompatible NVIDIA-GPU ist erforderlich.

entrances:
