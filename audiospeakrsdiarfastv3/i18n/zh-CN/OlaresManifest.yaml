metadata:
  title: Speakrs Diarization Fast
  description: 将录音划分为匿名说话人片段的本地模型

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization Fast 可将录音划分为不同说话人的片段，并标记每个人的发言时间。它使用匿名标签，不会按姓名识别真实身份，并通过 ONNX Runtime 在本地运行。

    **主要功能**
    - 检测语音和说话人变化。
    - 在整段录音中使用一致的匿名说话人标签。
    - 在一个流程中完成分段、说话人嵌入和聚类。
    - 向兼容的 Olares 应用提供说话人分离结果。

    需要兼容的 NVIDIA GPU。

entrances:
  - name: audiospeakrsdiarfastv3
    title: Speakrs Diarization Fast
