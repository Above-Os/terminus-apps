metadata:
  title: Speakrs Diarization Fast
  description: Un modello locale per dividere le registrazioni in turni di parlanti anonimi

spec:
  onlyAdmin: true
  fullDescription: |
    Speakrs Diarization Fast divide una registrazione in turni di parola e indica quando parla ciascuna persona. Assegna etichette anonime senza identificare le persone per nome e funziona in locale con ONNX Runtime.

    **Funzionalità principali**
    - Rilevare il parlato e i cambi di parlante.
    - Assegnare etichette anonime coerenti in tutta la registrazione.
    - Eseguire segmentazione, embedding dei parlanti e raggruppamento in un'unica pipeline.
    - Rendere i risultati della diarizzazione disponibili alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile.
  upgradeDescription: |
    0.0.23: Versione iniziale.

entrances:
