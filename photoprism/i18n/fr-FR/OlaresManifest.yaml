metadata:
  title: PhotoPrism
  description: Application photo alimentée par l'IA pour le Web décentralisé
spec:
  fullDescription: |
    PhotoPrism est une application photo alimentée par l'IA pour le Web décentralisé. Elle utilise les dernières technologies pour étiqueter et trouver automatiquement les photos sans vous gêner. Vous pouvez l'exécuter chez vous, sur un serveur privé ou dans le cloud.

    **Aperçu des fonctionnalités**

    Notre mission est de fournir la solution la plus conviviale et respectueuse de la vie privée pour garder vos photos organisées et accessibles. C'est pourquoi PhotoPrism a été conçue dès le départ pour fonctionner partout où vous en avez besoin, sans compromettre liberté, confidentialité ou fonctionnalités :

    - Parcourez toutes vos photos et vidéos sans vous soucier de la conversion RAW, des doublons ou des formats vidéo
    - Trouvez facilement des photos précises grâce à de puissants filtres de recherche
    - Reconnaît les visages de votre famille et de vos amis
    - Classification automatique des photos selon leur contenu et leur lieu
    - Lisez les Live Photos en survolant dans les albums et résultats de recherche
    - Comme l'interface est une Progressive Web App, elle offre une expérience proche d'une application native et vous pouvez l'installer facilement sur l'écran d'accueil des principaux systèmes d'exploitation et appareils mobiles
    - Inclut 4 cartes du monde haute résolution pour raviver les souvenirs de vos voyages préférés
    - Les métadonnées sont extraites et fusionnées depuis Exif, XMP et d'autres sources comme Google Photos
    - De nombreuses autres propriétés d'image comme couleurs, chroma et qualité sont également recherchables
    - Utilisez PhotoSync pour sauvegarder en toute sécurité les téléphones iOS et Android en arrière-plan
    - Les clients WebDAV tels que l'Explorateur Windows de Microsoft et le Finder d'Apple peuvent se connecter directement à PhotoPrism, vous permettant d'ouvrir, modifier et supprimer des fichiers depuis votre ordinateur comme s'ils étaient locaux.
  upgradeDescription: |
    Mise à jour vers PhotoPrism 250707-d28b3101e

    Cette version ajoute la prise en charge des modèles Ollama dans le service Vision AI, améliore les performances de recherche et introduit une boîte de dialogue « Adjust Location » pour définir les coordonnées des photos sur une carte. Les utilisateurs peuvent désormais supprimer des albums depuis la barre d'outils et personnaliser la langue des détails de lieu. La gestion vidéo et des métadonnées a été affinée, avec des mises à jour du transcodage, de la détection du scanner et des outils CLI. Un correctif pour les mises à jour d'index SQLite est également inclus. Les fonctions d'édition par lots sont en développement final et arriveront dans une prochaine version. Comme toujours, un grand merci à tous ceux qui ont contribué et aidé aux tests !

    Notes de version complètes : https://github.com/photoprism/photoprism/releases/tag/250707-d28b3101e
