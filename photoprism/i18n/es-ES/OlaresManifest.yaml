metadata:
  title: PhotoPrism
  description: App de fotos con IA para la Web descentralizada
spec:
  fullDescription: |
    PhotoPrism es una app de fotos impulsada por IA para la Web descentralizada. Usa las últimas tecnologías para etiquetar y encontrar fotos automáticamente sin interponerse. Puedes ejecutarla en casa, en un servidor privado o en la nube.

    **Resumen de funciones**

    Nuestra misión es ofrecer la solución más amigable con el usuario y la privacidad para mantener tus fotos organizadas y accesibles. Por eso PhotoPrism se construyó desde cero para ejecutarse donde lo necesites, sin comprometer libertad, privacidad ni funcionalidad:

    - Explora todas tus fotos y vídeos sin preocuparte por conversión RAW, duplicados o formatos de vídeo
    - Encuentra fotos concretas fácilmente con potentes filtros de búsqueda
    - Reconoce las caras de tu familia y amigos
    - Clasificación automática de fotos según su contenido y ubicación
    - Reproduce Live Photos al pasar el cursor en álbumes y resultados de búsqueda
    - Como la interfaz es una Progressive Web App, ofrece una experiencia similar a una app nativa y puedes instalarla cómodamente en la pantalla de inicio de los principales sistemas operativos y dispositivos móviles
    - Incluye 4 mapas mundiales de alta resolución para revivir los recuerdos de tus viajes favoritos
    - Los metadatos se extraen y fusionan desde Exif, XMP y otras fuentes como Google Photos
    - Muchas más propiedades de imagen como colores, croma y calidad también son buscables
    - Usa PhotoSync para respaldar de forma segura iPhones y Android en segundo plano
    - Clientes WebDAV como el Explorador de Windows de Microsoft y el Finder de Apple pueden conectarse directamente a PhotoPrism, permitiéndote abrir, editar y eliminar archivos desde tu ordenador como si fueran locales.
  upgradeDescription: |
    Actualización a PhotoPrism 250707-d28b3101e

    Esta versión añade compatibilidad con modelos Ollama en el servicio Vision AI, mejora el rendimiento de búsqueda e introduce un diálogo «Adjust Location» para fijar coordenadas de fotos en un mapa. Los usuarios pueden eliminar álbumes desde la barra de herramientas y personalizar el idioma de los detalles de ubicación. Se ha refinado el manejo de vídeo y metadatos, con actualizaciones de transcodificación, detección del escáner y herramientas CLI. También se incluye una corrección de actualizaciones de índices SQLite. Las funciones de edición por lotes están en desarrollo final y llegarán en una próxima versión. Como siempre, ¡gracias a todos los que contribuyeron y ayudaron a probar!

    Notas de la versión completa: https://github.com/photoprism/photoprism/releases/tag/250707-d28b3101e
