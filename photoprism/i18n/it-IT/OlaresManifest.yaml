metadata:
  title: PhotoPrism
  description: App foto basata su IA per il Web decentralizzato
spec:
  fullDescription: |
    PhotoPrism è un'app foto basata su IA per il Web decentralizzato. Usa le tecnologie più recenti per etichettare e trovare le immagini automaticamente senza ostacolarti. Puoi eseguirla a casa, su un server privato o nel cloud.

    **Panoramica delle funzionalità**

    La nostra missione è offrire la soluzione più amichevole per utente e privacy per tenere le foto organizzate e accessibili. Per questo PhotoPrism è stata costruita da zero per funzionare dove ti serve, senza compromettere libertà, privacy o funzionalità:

    - Sfoglia tutte le tue foto e video senza preoccuparti di conversione RAW, duplicati o formati video
    - Trova facilmente immagini specifiche con potenti filtri di ricerca
    - Riconosce i volti di famiglia e amici
    - Classificazione automatica delle immagini in base a contenuto e posizione
    - Riproduci le Live Photos passando il cursore su album e risultati di ricerca
    - Poiché l'interfaccia è una Progressive Web App, offre un'esperienza simile a un'app nativa e puoi installarla comodamente sulla home screen dei principali sistemi operativi e dispositivi mobili
    - Include 4 mappe del mondo ad alta risoluzione per rivivere i ricordi dei tuoi viaggi preferiti
    - I metadati vengono estratti e uniti da Exif, XMP e altre fonti come Google Photos
    - Molte altre proprietà dell'immagine come colori, croma e qualità sono pure ricercabili
    - Usa PhotoSync per eseguire backup sicuri di iOS e Android in background
    - Client WebDAV come Windows Explorer di Microsoft e Finder di Apple possono connettersi direttamente a PhotoPrism, permettendoti di aprire, modificare ed eliminare file dal computer come se fossero locali.
  upgradeDescription: |
    Aggiornamento a PhotoPrism 250707-d28b3101e

    Questa release aggiunge il supporto ai modelli Ollama nel servizio Vision AI, migliora le prestazioni di ricerca e introduce una finestra «Adjust Location» per impostare le coordinate delle foto su una mappa. Gli utenti possono eliminare album dalla toolbar e personalizzare la lingua dei dettagli di posizione. Gestione video e metadati raffinate, con aggiornamenti a transcoding, rilevamento scanner e strumenti CLI. Incluso anche un fix per gli aggiornamenti degli indici SQLite. Le funzioni di editing batch sono in fase di sviluppo finale e arriveranno in una prossima release. Come sempre, un grande grazie a chi ha contribuito e aiutato nei test!

    Note di rilascio complete: https://github.com/photoprism/photoprism/releases/tag/250707-d28b3101e
