metadata:
  title: Ming TTS 0.5B
  description: 支持内置音色、声音克隆和文字设计音色的 0.5B 文本转语音模型

spec:
  fullDescription: |
    Ming-3.0-tts-0.5B 把文字说成语音。同一个模型可以念内置音色、用一段参考录音加逐字稿克隆，或按文字描述造一个新声音。

    **主要功能**

    - 使用模型自带音色，以及共用的 zh-f、zh-m、en-f、en-m。
    - 用参考音频克隆。必须带上这段音频的逐字稿。
    - 用一段文字描述造声，不需要参考音频。
    - 一次请求只做上面三件事中的一件。混在一起会被拒绝。

    需要 NVIDIA 或 Intel GPU。这一版没有接情绪、方言和语速。

    **使用须知**

    模型许可是 MIT。不要用它冒充真人。听的人可能把合成语音当成真人录音时，要标明这是合成的。

    音色表和许可见 [Ming-3.0-tts 模型卡](https://huggingface.co/inclusionAI/Ming-3.0-tts-0.5B)。
