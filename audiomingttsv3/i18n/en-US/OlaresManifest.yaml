metadata:
  title: Ming TTS 0.5B
  description: A 0.5B text-to-speech model with built-in voices, cloning, and description-based voices

spec:
  fullDescription: |
    Ming-3.0-tts-0.5B turns written text into spoken audio. One checkpoint can speak a built-in voice, copy a voice from a reference recording and its transcript, or create a voice from a written description.

    **Key features**

    - Speak with a built-in voice, including the model's own cast and the shared zh-f, zh-m, en-f, and en-m pack.
    - Clone a voice from reference audio. The exact transcript of that audio is required.
    - Create a voice from a natural-language description, with no reference audio.
    - One request does one of those three things. Combining them is rejected.

    A compatible NVIDIA or Intel GPU is required. Emotion, dialect, and speed controls are not wired on this build.

    **Usage notes**

    The model is MIT licensed. Do not use it to impersonate a real person. Label audio as synthetic when a listener could mistake it for a real recording.

    See the [Ming-3.0-tts model card](https://huggingface.co/inclusionAI/Ming-3.0-tts-0.5B) for the voice list and license.
