metadata:
  title: FastGPT
  description: Eine wissensbasierte Plattform auf Grundlage von LLMs
spec:
  fullDescription: |
    **Überblick**
    FastGPT ist eine auf LLMs basierende Wissensplattform. Sie bietet sofort einsatzbereite Funktionen wie Datenverarbeitung, RAG-Abruf und visuelle Orchestrierung von KI-Workflows, sodass Sie komplexe Frage-Antwort-Systeme ohne aufwendige Einrichtung oder Konfiguration entwickeln und bereitstellen können.

    **Funktionen**
    Anwendungsorchestrierung
    - Einfacher Modus ohne komplexe Orchestrierung
    - Klare Hinweise auf nächste Schritte in Dialogen
    - Workflow-Orchestrierung
    - Nachverfolgung von Verweisen in Quelldateien
    - Wiederverwendbare, mehrstufig gekapselte Module
    - Kombination von Suche und Neuanordnung
    - Werkzeugmodul
    - Laf-Integration zur Online-Erstellung von HTTP-Modulen
    - Kapselung von Plugins

    Wissensdatenbank
    - Gemischte Nutzung mehrerer Datenbanken
    - Nachverfolgung von Änderungen und Löschungen in Datenabschnitten
    - Eigene Vektormodelle pro Wissensdatenbank
    - Speicherung der ursprünglichen Quelldateien
    - Direkte Eingabe und segmentbasierter QA-Import
    - Dateiformate: pdf, docx, txt, html, md, csv
    - URL-Auslesen und CSV-Massenimport
    - Import von PPT- und Excel-Dateien
    - Dateileser
    - Vielfältige Datenvorverarbeitung

    Anwendungs-Debugging
    - Gezielte Suchtests in der Wissensdatenbank
    - Feedback, Bearbeiten und Löschen während Gesprächen
    - Vollständiger Interaktionskontext
    - Anzeige aller Zwischenwerte in Modulen
    - Erweiterter Debug-Modus für die Orchestrierung

    OpenAPI-Schnittstelle
    - Completions-Schnittstelle (an GPTs Chatmodus ausgerichtet)
    - CRUD-Operationen für die Wissensdatenbank
    - CRUD-Operationen für Gespräche

    Betrieb
    - Teilen ohne Anmeldung
    - Einfache Einbettung per Iframe
    - Anpassbares Chatfenster mit Funktionen wie standardmäßigem Öffnen und Drag-and-drop
    - Zentrale Gesprächsaufzeichnungen zur Prüfung und Kommentierung
  upgradeDescription: |
    v1.0.19: Plugin-CrashLoop behoben — `fastgpt-secrets` wird eingebunden, damit das Plugin nach der Secret-Migration `MONGODB_URI` erhält.
    v1.0.18: DB-URLs, Root-Passwort, AES-Schlüssel sowie MinIO-/aiproxy-Anmeldedaten in Kubernetes Secret (`secretKeyRef` / `secretRef`) verschoben.

    Speicher: Dauerhafte Volumes wurden von `appCache` nach `appData` verschoben. Beim ersten Start nach dem Upgrade kopieren initContainers ältere appCache-Inhalte nach appData, wenn das Ziel leer ist (Marker: `.migration_from_appcache_done`). Die alten appCache-Daten bleiben für ein Rollback erhalten.

    Die veraltete appCache-Pfadverzweigung für `sysVersion >= 1.12.3` wurde entfernt; die Mindestversion von Olares ist jetzt 1.12.6.

    Der MinIO-Objektspeicher wurde von appCache nach appData migriert.
