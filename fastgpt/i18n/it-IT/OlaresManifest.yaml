metadata:
  title: FastGPT
  description: Una piattaforma di conoscenza basata sugli LLM
spec:
  fullDescription: |
    **Panoramica**
    FastGPT è una piattaforma di conoscenza basata sugli LLM che offre funzionalità pronte all'uso come elaborazione dati, recupero RAG e orchestrazione visiva dei flussi AI, consentendo di sviluppare e distribuire facilmente sistemi complessi di domande e risposte senza configurazioni laboriose.

    **Funzionalità**
    Orchestrazione delle applicazioni
    - Modalità semplice senza orchestrazioni complesse
    - Istruzioni chiare sui passaggi successivi nei dialoghi
    - Orchestrazione dei flussi di lavoro
    - Tracciamento dei riferimenti nei file sorgente
    - Moduli incapsulati riutilizzabili su più livelli
    - Funzioni combinate di ricerca e riordino
    - Modulo strumenti
    - Integrazione con Laf per creare online moduli HTTP
    - Incapsulamento dei plugin

    Base di conoscenza
    - Uso combinato di più database
    - Tracciamento di modifiche ed eliminazioni nei blocchi di dati
    - Modelli vettoriali specifici per ogni base
    - Conservazione dei file sorgente originali
    - Input diretto e importazione QA per segmenti
    - Formati supportati: pdf, docx, txt, html, md, csv
    - Lettura URL e importazione CSV in massa
    - Importazione di file PPT ed Excel
    - Lettore di file
    - Diverse opzioni di pre-elaborazione

    Debug delle applicazioni
    - Test di ricerca mirati nella base di conoscenza
    - Feedback, modifica ed eliminazione durante le conversazioni
    - Contesto completo delle interazioni
    - Visualizzazione di tutti i valori intermedi nei moduli
    - Modalità Debug avanzata per l'orchestrazione

    Interfaccia OpenAPI
    - Interfaccia completions (allineata alla modalità chat di GPT)
    - Operazioni CRUD per la base di conoscenza
    - Operazioni CRUD per le conversazioni

    Funzioni operative
    - Condivisione senza accesso
    - Facile incorporamento con Iframe
    - Finestra chat incorporabile e personalizzabile con apertura predefinita e trascinamento
    - Registri delle conversazioni centralizzati per revisione e annotazione
  upgradeDescription: |
    v1.0.19: Corretto il CrashLoop del plugin: viene montato `fastgpt-secrets` affinché il plugin riceva `MONGODB_URI` dopo la migrazione del Secret.
    v1.0.18: URL del DB, password root, chiave AES e credenziali MinIO/aiproxy spostati in Kubernetes Secret (`secretKeyRef` / `secretRef`).

    Archiviazione: i volumi persistenti sono passati da `appCache` ad `appData`. Al primo avvio dopo l'aggiornamento, gli initContainers copiano i contenuti legacy di appCache in appData se la destinazione è vuota (marcatore: `.migration_from_appcache_done`). I vecchi dati restano intatti per il rollback.

    Rimossa la logica legacy dei percorsi appCache per `sysVersion >= 1.12.3`; la versione minima di Olares è ora 1.12.6.

    L'object storage MinIO è stato migrato da appCache ad appData.
