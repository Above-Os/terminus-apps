metadata:
  title: FastGPT
  description: Una plataforma de conocimiento basada en LLMs
spec:
  fullDescription: |
    **Descripción general**
    FastGPT es una plataforma de conocimiento basada en LLMs que ofrece funciones listas para usar, como procesamiento de datos, recuperación RAG y orquestación visual de flujos de IA. Permite desarrollar e implementar fácilmente sistemas complejos de preguntas y respuestas sin una configuración exhaustiva.

    **Funciones**
    Orquestación de aplicaciones
    - Modo sencillo que evita orquestaciones complejas
    - Instrucciones claras sobre el siguiente paso en los diálogos
    - Orquestación de flujos de trabajo
    - Seguimiento de referencias en archivos fuente
    - Módulos encapsulados reutilizables en varios niveles
    - Combinación de búsqueda y reordenación
    - Módulo de herramientas
    - Integración con Laf para crear módulos HTTP en línea
    - Encapsulación de plugins

    Base de conocimiento
    - Uso combinado de varias bases de datos
    - Seguimiento de modificaciones y eliminaciones en fragmentos de datos
    - Modelos vectoriales específicos para cada base
    - Almacenamiento de archivos fuente originales
    - Entrada directa e importación de QA por segmentos
    - Formatos compatibles: pdf, docx, txt, html, md, csv
    - Lectura de URL e importación masiva de CSV
    - Importación de PPT y Excel
    - Lector de archivos
    - Diversas opciones de preprocesamiento

    Depuración de aplicaciones
    - Pruebas de búsqueda dirigidas en la base de conocimiento
    - Comentarios, edición y eliminación durante las conversaciones
    - Contexto completo de las interacciones
    - Visualización de todos los valores intermedios de los módulos
    - Modo Debug avanzado para la orquestación

    Interfaz OpenAPI
    - Interfaz de completions (alineada con el modo chat de GPT)
    - Operaciones CRUD para la base de conocimiento
    - Operaciones CRUD para conversaciones

    Operación
    - Compartir sin iniciar sesión
    - Inserción sencilla mediante Iframe
    - Ventana de chat insertable y personalizable con apertura predeterminada y arrastrar y soltar
    - Registros de conversaciones centralizados para revisión y anotación
  upgradeDescription: |
    v1.0.19: Se corrige el CrashLoop del plugin: se monta `fastgpt-secrets` para que el plugin obtenga `MONGODB_URI` tras la migración del Secret.
    v1.0.18: Se trasladan las URL de DB, la contraseña root, la clave AES y las credenciales de MinIO/aiproxy a Kubernetes Secret (`secretKeyRef` / `secretRef`).

    Almacenamiento: los volúmenes persistentes pasaron de `appCache` a `appData`. En el primer inicio tras actualizar, los initContainers copian el contenido antiguo de appCache a appData si el destino está vacío (marcador: `.migration_from_appcache_done`). Los datos antiguos permanecen intactos para poder revertir.

    Se elimina la lógica heredada de rutas appCache para `sysVersion >= 1.12.3`; la versión mínima de Olares ahora es 1.12.6.

    El almacenamiento de objetos MinIO se migró de appCache a appData.
