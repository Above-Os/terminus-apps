metadata:
  title: FastGPT
  description: Une plateforme de connaissances basée sur les LLM
spec:
  fullDescription: |
    **Présentation**
    FastGPT est une plateforme de connaissances basée sur les LLM. Elle propose des fonctions prêtes à l'emploi telles que le traitement des données, la récupération RAG et l'orchestration visuelle de workflows d'IA, permettant de développer et déployer facilement des systèmes complexes de questions-réponses sans configuration fastidieuse.

    **Fonctionnalités**
    Orchestration des applications
    - Mode simple évitant les orchestrations complexes
    - Instructions claires sur l'étape suivante dans les dialogues
    - Orchestration des workflows
    - Suivi des références dans les fichiers sources
    - Modules encapsulés et réutilisables à plusieurs niveaux
    - Recherche et réorganisation combinées
    - Module d'outils
    - Intégration de Laf pour créer des modules HTTP en ligne
    - Encapsulation de plugins

    Base de connaissances
    - Utilisation combinée de plusieurs bases de données
    - Suivi des modifications et suppressions dans les segments de données
    - Modèles vectoriels propres à chaque base
    - Conservation des fichiers sources d'origine
    - Saisie directe et importation de QA par segments
    - Formats pris en charge : pdf, docx, txt, html, md, csv
    - Lecture d'URL et importation CSV en masse
    - Importation de fichiers PPT et Excel
    - Lecteur de fichiers
    - Diverses options de prétraitement

    Débogage des applications
    - Tests de recherche ciblés dans la base de connaissances
    - Avis, modification et suppression pendant les conversations
    - Contexte complet des interactions
    - Affichage de toutes les valeurs intermédiaires des modules
    - Mode Debug avancé pour l'orchestration

    Interface OpenAPI
    - Interface completions (alignée sur le mode chat de GPT)
    - Opérations CRUD pour la base de connaissances
    - Opérations CRUD pour les conversations

    Exploitation
    - Partage sans connexion
    - Intégration facile avec Iframe
    - Fenêtre de chat intégrable et personnalisable, avec ouverture par défaut et glisser-déposer
    - Historique centralisé des conversations pour révision et annotation
  upgradeDescription: |
    v1.0.19 : correction du CrashLoop du plugin — montage de `fastgpt-secrets` afin que le plugin obtienne `MONGODB_URI` après la migration du Secret.
    v1.0.18 : déplacement des URL de DB, du mot de passe root, de la clé AES et des identifiants MinIO/aiproxy dans Kubernetes Secret (`secretKeyRef` / `secretRef`).

    Stockage : les volumes persistants sont passés de `appCache` à `appData`. Au premier démarrage après la mise à niveau, des initContainers copient l'ancien contenu appCache vers appData si la destination est vide (marqueur : `.migration_from_appcache_done`). Les anciennes données restent intactes pour permettre un retour arrière.

    Suppression de l'ancienne logique de chemin appCache pour `sysVersion >= 1.12.3` ; la version minimale d'Olares est désormais 1.12.6.

    Le stockage objet MinIO a été migré d'appCache vers appData.
