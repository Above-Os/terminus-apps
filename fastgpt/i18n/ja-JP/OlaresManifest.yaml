metadata:
  title: FastGPT
  description: LLM を基盤とするナレッジプラットフォーム
spec:
  fullDescription: |
    **概要**
    FastGPT は LLM を基盤とするナレッジプラットフォームです。データ処理、RAG 検索、視覚的な AI ワークフロー編成など、すぐに使える包括的な機能を備え、複雑な設定なしで高度な質問応答システムを簡単に開発、展開できます。

    **機能**
    アプリケーション編成
    - 複雑な編成が不要なシンプルモード
    - 対話中に次の手順を明確に案内
    - ワークフロー編成
    - ソースファイル内の参照を追跡
    - 複数レベルで再利用できるモジュール
    - 検索と並べ替え機能を統合
    - ツールモジュール
    - オンラインで HTTP モジュールを作成できる Laf 連携
    - プラグインのカプセル化

    ナレッジベース
    - 複数データベースの混在利用
    - データチャンクの変更と削除を追跡
    - ナレッジベースごとにベクトルモデルを指定
    - 元のソースファイルを保存
    - 直接入力とセグメント単位の QA インポート
    - 対応形式: pdf、docx、txt、html、md、csv
    - URL 読み込みと CSV 一括インポート
    - PPT と Excel のインポート
    - ファイルリーダー
    - 多様なデータ前処理

    アプリケーションのデバッグ
    - ナレッジベース内の対象検索テスト
    - 会話中のフィードバック、編集、削除
    - やり取りの完全なコンテキストを表示
    - モジュール内の全中間値を表示
    - 編成用の高度な Debug モード

    OpenAPI インターフェース
    - completions インターフェース（GPT のチャットモードに準拠）
    - ナレッジベースの CRUD 操作
    - 会話の CRUD 操作

    運用機能
    - ログイン不要の共有
    - Iframe による簡単な埋め込み
    - 初期表示やドラッグ＆ドロップに対応したカスタマイズ可能なチャットウィンドウ
    - 会話記録を一元管理して確認、注釈
  upgradeDescription: |
    v1.0.19: プラグインの CrashLoop を修正 — Secret 移行後にプラグインが `MONGODB_URI` を取得できるよう `fastgpt-secrets` をマウント。
    v1.0.18: DB URL、root パスワード、AES キー、MinIO / aiproxy 認証情報を Kubernetes Secret（`secretKeyRef` / `secretRef`）へ移動。

    ストレージ: 永続ボリュームを `appCache` から `appData` へ移動しました。アップグレード後の初回起動時、移行先が空の場合は initContainers が従来の appCache の内容を appData へコピーします（マーカー: `.migration_from_appcache_done`）。ロールバック用に旧 appCache データはそのまま残ります。

    従来の `sysVersion >= 1.12.3` appCache パス分岐を削除し、Olares の最小バージョンを 1.12.6 に変更しました。

    MinIO オブジェクトストレージを appCache から appData へ移行しました。
