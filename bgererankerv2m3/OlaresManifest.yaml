  icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
  description: "BGE-Reranker-v2-m3 cross-encoder rerank via rerank-server (OpenVINO / ONNX)"
  appid: bgererankerv2m3
  title: BGE-Reranker-v2-m3
  version: '1.0.0'
  categories:
  - AI
  - models
  tags:
  - rerank
sharedEntrances:
  - name: bgererankerv2m3
    host: sharedentrances-api
    port: 0
    title: BGE-Reranker-v2-m3 API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
entrances:
  - name: rerankclient
    port: 8090
    host: download-svc
    title: BGE-Reranker-v2-m3
    icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
    openMethod: window
    authLevel: internal
  - name: rerankapi
    port: 8090
    host: download-svc
    title: BGE-Reranker-v2-m3 API
    icon: https://app.cdn.olares.com/appstore/llm/vllm/rerank/bge-reranker-v2-m3.png
    invisible: true
    openMethod: window
