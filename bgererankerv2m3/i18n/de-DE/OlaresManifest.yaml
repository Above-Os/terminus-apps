metadata:
  title: BGE-Reranker-v2-m3
  description: Ein mehrsprachiges Modell zum Neuordnen von Suchergebnissen nach Relevanz

spec:
  fullDescription: |
    BGE-Reranker-v2-m3 bewertet, wie gut ein Dokument zu einer Suchanfrage passt, und ordnet Kandidatenergebnisse nach diesem Wert neu. Kompatible Olares-Anwendungen können es nach einer ersten Suche verwenden.

    **Hauptfunktionen**

    - Die Relevanz einer Anfrage und eines Kandidatendokuments bewerten.
    - Suchergebnisse nach Relevanz neu ordnen.
    - In mehreren Sprachen arbeiten.
    - Neuordnung für kompatible Olares-Anwendungen bereitstellen.
