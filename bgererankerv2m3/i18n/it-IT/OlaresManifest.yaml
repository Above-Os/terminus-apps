metadata:
  title: BGE-Reranker-v2-m3
  description: Un modello multilingue per riordinare i risultati di ricerca in base alla rilevanza

spec:
  fullDescription: |
    BGE-Reranker-v2-m3 valuta quanto un documento corrisponda a una query di ricerca, poi riordina i risultati candidati in base a quel punteggio. Le applicazioni Olares compatibili possono usarlo dopo una prima ricerca.

    **Funzionalità principali**

    - Valutare la rilevanza di una query e di un documento candidato.
    - Riordinare i risultati di ricerca in base alla rilevanza.
    - Funzionare in più lingue.
    - Rendere il riordinamento disponibile alle applicazioni Olares compatibili.
