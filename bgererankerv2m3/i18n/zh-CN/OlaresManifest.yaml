metadata:
  title: BGE-Reranker-v2-m3
  description: "按相关性重新排序搜索结果的多语言模型"

spec:
  upgradeDescription: |
    v1.0.9: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    BGE-Reranker-v2-m3 同时分析搜索查询和候选文档，并返回相关性分数。搜索应用可以在初步检索后，利用这些分数重新排列结果，将更相关的段落排在前面。

    兼容的 Olares 应用可将这一多语言模型用于搜索和检索流程。它为应用提供的文档评分，不会自行搜索文档库。
