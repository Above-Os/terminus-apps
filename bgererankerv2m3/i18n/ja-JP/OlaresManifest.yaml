metadata:
  title: BGE-Reranker-v2-m3
  description: "検索結果を関連度順に並べ替える多言語モデル"

spec:
  upgradeDescription: |
    v1.0.9: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    BGE-Reranker-v2-m3は、検索クエリと候補文書を一緒に評価し、関連度のスコアを返します。検索アプリは最初の検索後にこのスコアを使い、関連度の高い文章が上位に来るよう結果を並べ替えられます。

    この多言語モデルは、対応するOlaresアプリの検索・情報取得処理で利用できます。アプリから渡された文書を採点するもので、文書コレクションを単独で検索するものではありません。
