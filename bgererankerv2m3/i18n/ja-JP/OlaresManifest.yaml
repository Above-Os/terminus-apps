metadata:
  title: BGE-Reranker-v2-m3
  description: 検索結果を関連度で並べ替える多言語モデル

spec:
  fullDescription: |
    BGE-Reranker-v2-m3は、文書が検索クエリにどの程度合うかを評価し、そのスコアで候補結果を並べ替えます。対応するOlaresアプリは、一次検索の後にこれを利用できます。

    **主な機能**

    - クエリと候補文書の関連度を評価します。
    - 検索結果を関連度で並べ替えます。
    - 複数の言語に対応します。
    - 対応するOlaresアプリから再ランキングを利用できます。
