metadata:
  title: BGE-Reranker-v2-m3
  description: A multilingual model for reranking search results by relevance

spec:
  upgradeDescription: |
    v1.0.4: Model Console (llm-init) updated to v1.7.21.

  fullDescription: |
    BGE-Reranker-v2-m3 scores how well a document matches a search query, then reorders candidate results by that score. Compatible Olares applications can use it after a first-pass search.

    **Key features**

    - Score the relevance of a query and a candidate document.
    - Reorder search results by relevance.
    - Work across multiple languages.
    - Make reranking available to compatible Olares applications.
