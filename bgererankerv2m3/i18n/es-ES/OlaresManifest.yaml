metadata:
  title: BGE-Reranker-v2-m3
  description: "Un modelo multilingüe para reordenar resultados de búsqueda por relevancia"

spec:
  upgradeDescription: |
    v1.0.9: El estado de ejecución se almacena en Common para permitir el funcionamiento entre nodos. Se da prioridad a la configuración existente en Common. Si no existe, se migra el Cache local anterior o se inicializa el estado en Common. Al iniciar el motor, se reintenta la lectura de los scripts auxiliares compartidos si falla.

  fullDescription: |
    BGE-Reranker-v2-m3 evalúa una consulta de búsqueda junto con un documento candidato y devuelve una puntuación de relevancia. Las aplicaciones de búsqueda pueden usar estas puntuaciones tras una búsqueda inicial para colocar primero los pasajes más relevantes.

    Este modelo multilingüe está disponible para los flujos de búsqueda y recuperación de las aplicaciones Olares compatibles. Puntúa los documentos que proporciona una aplicación; no busca por sí solo en una colección de documentos.
