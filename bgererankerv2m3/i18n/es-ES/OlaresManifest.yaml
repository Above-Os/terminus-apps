metadata:
  title: BGE-Reranker-v2-m3
  description: Un modelo multilingüe para reordenar resultados de búsqueda por relevancia

spec:
  upgradeDescription: |
    v1.0.4: Model Console (llm-init) se ha actualizado a v1.7.21.

  fullDescription: |
    BGE-Reranker-v2-m3 puntúa cómo encaja un documento con una consulta de búsqueda y reordena los resultados candidatos según esa puntuación. Las aplicaciones Olares compatibles pueden usarlo después de una primera búsqueda.

    **Funciones principales**

    - Puntuar la relevancia de una consulta y un documento candidato.
    - Reordenar los resultados de búsqueda por relevancia.
    - Funcionar en varios idiomas.
    - Poner el reordenamiento a disposición de aplicaciones Olares compatibles.
