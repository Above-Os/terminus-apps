metadata:
  title: BGE-Reranker-v2-m3
  description: Un modèle multilingue pour réordonner des résultats de recherche par pertinence

spec:
  upgradeDescription: |
    v1.0.5: Ajout du mode GPU Intel dédié et distinction entre GPU intégré et dédié.
    v1.0.4: Model Console (llm-init) a été mis à jour vers la version v1.7.21.

  fullDescription: |
    BGE-Reranker-v2-m3 évalue dans quelle mesure un document correspond à une requête de recherche, puis réordonne les résultats candidats selon ce score. Les applications Olares compatibles peuvent l'utiliser après une première recherche.

    **Fonctionnalités principales**

    - Évaluer la pertinence d'une requête et d'un document candidat.
    - Réordonner les résultats de recherche par pertinence.
    - Fonctionner dans plusieurs langues.
    - Mettre le réordonnancement à disposition des applications Olares compatibles.
