apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-account
  namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-manager
  namespace: "{{ .Release.Namespace }}"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-binding
  namespace: "{{ .Release.Namespace }}"
subjects:
- kind: ServiceAccount
  name: terminal-account
  namespace: "{{ .Release.Namespace }}"
roleRef:
  kind: Role
  name: pod-exec-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: terminal
spec:
  replicas: {{ .Values.workloads.terminal.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: terminal
  template:
    metadata:
      labels:
        io.kompose.service: terminal
    spec:
      enableServiceLinks: false
      serviceAccountName: terminal-account
      containers:
      - name: nginx
        image: docker.io/beclab/terminal:v0.0.13
        imagePullPolicy: IfNotPresent
        command: ["nginx", "-g", "daemon off;"]
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 5m
            memory: 50Mi
          limits:
            cpu: 50m
            memory: 100Mi
      - name: terminal
        image: docker.io/beclab/terminal:v0.0.13
        imagePullPolicy: IfNotPresent
        command: ["apiserver"]
        args:
        - --namespace={{ .Release.Namespace }}
        - --pod=bytetrade.io/terminal=modelbenchmark
        - --container=modelbenchmark
        - --v=3
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 5m
            memory: 100Mi
          limits:
            cpu: 50m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terminal
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    io.kompose.service: terminal
  ports:
  - name: terminal
    port: 80
    targetPort: 80
