{{- $secretName := printf "%s-credentials" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $secretName }}"
  namespace: "{{ .Release.Namespace }}"
type: Opaque
data:
{{- if and $existing $existing.data }}
{{ toYaml $existing.data | nindent 2 }}
{{- else }}
  {}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}-benchmark-account"
  namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}-credentials"
  namespace: "{{ .Release.Namespace }}"
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - "{{ $secretName }}"
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-credentials"
  namespace: "{{ .Release.Namespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Release.Name }}-credentials"
subjects:
- kind: ServiceAccount
  name: "{{ .Release.Name }}-benchmark-account"
  namespace: "{{ .Release.Namespace }}"
