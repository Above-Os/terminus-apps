olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: v3

metadata:
  name: modelbenchmark
  appid: modelbenchmark
  title: Model Benchmark
  description: Benchmark Olares embedding, rerank, and OCR model applications
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.62
  categories:
  - Developer Tools
  - models

entrances:
- name: terminal
  host: terminal
  port: 80
  title: Model Benchmark Terminal
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  openMethod: window
  authLevel: internal

spec:
  versionName: "0.1.0"
  requiredCpu: 200m
  limitedCpu: "4"
  requiredMemory: 512Mi
  limitedMemory: 8Gi
  requiredDisk: 1Gi
  limitedDisk: 50Gi
  supportArch:
  - amd64

permission:
  appData: true
  appCache: true

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: ">=1.12.6-0"

workloadReplicas:
  modelbenchmark: 1
  terminal: 1
