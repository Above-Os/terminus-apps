---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    upstream svc_backend {
      server mtranserver.mtranserverv2server-shared:8989 max_fails=1 fail_timeout=2s;
      server download-svc.mtranserverv2server-shared:8090 backup;
    }

    server {

      client_body_temp_path /tmp/client_body;

      proxy_temp_path /tmp/proxy;

      fastcgi_temp_path /tmp/fastcgi;

      uwsgi_temp_path /tmp/uwsgi;

      scgi_temp_path /tmp/scgi;
      listen 8080;
      access_log /dev/stdout;
      error_log /dev/stderr;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 300s;
      proxy_set_header host $host;
      proxy_set_header x-forwarded-host $http_host;

      proxy_http_version 1.1;

      proxy_set_header upgrade $http_upgrade;
      proxy_set_header connection "upgrade";

      location ~ ^/(translate|languages) {
        proxy_pass http://mtranserver.mtranserverv2server-shared:8989;

        if ($request_method = 'OPTIONS') {
          add_header Access-Control-Allow-Origin *;
          add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD";
          add_header Access-Control-Allow-Headers "deviceType,token,authorization,content-type,x-csrftoken";
          return 204;
        }
      }

      location / {
        proxy_pass http://svc_backend;

        if ($request_method = 'OPTIONS') {
          add_header Access-Control-Allow-Origin *;
          add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD";
          add_header Access-Control-Allow-Headers "deviceType,token,authorization,content-type,x-csrftoken";
          return 204;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: mtranserverweb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mtranserverweb
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: mtranserverweb
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-runtime
          emptyDir: {}
      containers:
        - name: nginx
          image: "docker.io/openresty/openresty:1.29.2.5-bookworm-fat"
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - "daemon off; pid /tmp/nginx.pid;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 60
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-runtime
              mountPath: /var/run/openresty
---
apiVersion: v1
kind: Service
metadata:
  name: mtranserverweb
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: mtranserverweb
  ports:
    - name: mtranserverweb
      protocol: TCP
      port: 8080
      targetPort: 8080
