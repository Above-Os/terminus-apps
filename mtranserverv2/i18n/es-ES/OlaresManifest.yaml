metadata:
  title: MTranServer
  description: Un servidor de traducción offline de alto rendimiento con requisitos mínimos de recursos
spec:
  upgradeDescription: |
    Cambio a la versión 3.0.4
    Adaptado a toda la gama de arquitecturas AMD64; ahora admite el despliegue en CPU x86-64 de todas las arquitecturas
  fullDescription: |
    MTranServer es un servidor de traducción offline de alto rendimiento con requisitos mínimos de recursos.

    Funciona en CPU con solo 1 GB de memoria, sin necesidad de GPU. Tiempo medio de respuesta de 50 ms por solicitud. Admite la traducción de los principales idiomas del mundo.

    Calidad de traducción comparable a Google Translate.

    Nota: Este modelo se centra en la velocidad y el despliegue privado en diversos dispositivos, por lo que la calidad de traducción no igualará la de los grandes modelos de lenguaje. Para traducciones de alta calidad, considere usar APIs online de grandes modelos de lenguaje.
