metadata:
  title: MTranServer
  description: Un serveur de traduction hors ligne haute performance avec des besoins en ressources minimaux
spec:
  upgradeDescription: |
    Passage à la version 3.0.4
    Adapté à toute la gamme d'architectures AMD64 ; prend désormais en charge le déploiement CPU x86-64 de toutes les architectures
  fullDescription: |
    MTranServer est un serveur de traduction hors ligne haute performance avec des besoins en ressources minimaux.

    Il s'exécute sur CPU avec seulement 1 Go de mémoire, sans GPU. Temps de réponse moyen de 50 ms par requête. Prend en charge la traduction des principales langues du monde.

    Qualité de traduction comparable à Google Translate.

    Remarque : ce modèle privilégie la vitesse et le déploiement privé sur divers appareils ; la qualité de traduction n'égalera donc pas celle des grands modèles de langage. Pour une traduction de haute qualité, envisagez d'utiliser des API en ligne de grands modèles de langage.
