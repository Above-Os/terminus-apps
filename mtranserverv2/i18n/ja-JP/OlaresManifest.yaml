metadata:
  title: MTranServer
  description: 最小限のリソースで動作する高性能オフライン翻訳サーバー
spec:
  upgradeDescription: |
    バージョン 3.0.4 へ変更
    AMD64 アーキテクチャ全般に対応し、あらゆる x86-64 CPU アーキテクチャでの展開をサポート
  fullDescription: |
    MTranServer は、最小限のリソース要件で動作する高性能オフライン翻訳サーバーです。

    GPU 不要で、わずか 1GB のメモリで CPU 上で動作します。平均応答時間はリクエストあたり 50ms。世界の主要言語の翻訳に対応しています。

    翻訳品質は Google Translate に匹敵します。

    注: 本モデルは速度と各種デバイスでのプライベート展開に重点を置いているため、翻訳品質は大規模言語モデルには及びません。高品質な翻訳には、オンラインの大規模言語モデル API の利用をご検討ください。
