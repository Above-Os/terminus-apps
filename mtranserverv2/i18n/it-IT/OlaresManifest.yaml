metadata:
  title: MTranServer
  description: Un server di traduzione offline ad alte prestazioni con requisiti minimi di risorse
spec:
  upgradeDescription: |
    Passaggio alla versione 3.0.4
    Adattato all'intera gamma di architetture AMD64; ora supporta la distribuzione su CPU x86-64 di tutte le architetture
  fullDescription: |
    MTranServer è un server di traduzione offline ad alte prestazioni con requisiti minimi di risorse.

    Funziona su CPU con soli 1 GB di memoria, senza bisogno di GPU. Tempo medio di risposta di 50 ms per richiesta. Supporta la traduzione delle principali lingue del mondo.

    Qualità di traduzione paragonabile a Google Translate.

    Nota: questo modello privilegia velocità e distribuzione privata su vari dispositivi, quindi la qualità della traduzione non eguaglierà quella dei grandi modelli linguistici. Per traduzioni di alta qualità, valutare le API online di grandi modelli linguistici.
