metadata:
  title: MTranServer
  description: Ein leistungsstarker Offline-Übersetzungsserver mit minimalem Ressourcenbedarf
spec:
  upgradeDescription: |
    Änderung auf Version 3.0.4
    An alle AMD64-Architekturen angepasst; unterstützt jetzt die CPU-Bereitstellung von x86-64 aller Architekturen
  fullDescription: |
    MTranServer ist ein leistungsstarker Offline-Übersetzungsserver mit minimalem Ressourcenbedarf.

    Er läuft auf der CPU mit nur 1 GB Speicher – keine GPU erforderlich. Durchschnittliche Antwortzeit von 50 ms pro Anfrage. Unterstützt die Übersetzung der wichtigsten Sprachen weltweit.

    Übersetzungsqualität vergleichbar mit Google Translate.

    Hinweis: Dieses Modell legt den Schwerpunkt auf Geschwindigkeit und privaten Einsatz auf verschiedenen Geräten; die Übersetzungsqualität erreicht daher nicht die von großen Sprachmodellen. Für hochwertige Übersetzungen erwägen Sie Online-APIs großer Sprachmodelle.
