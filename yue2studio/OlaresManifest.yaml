olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: yue2studio
  appid: yue2studio
  title: YuE2 Studio
  description: A local music studio for AI songs with vocals and editable scores
  icon: https://cdn.olares.com/images/2026/11/820c3ea1b560cc4e73454261ad182c1d.png
  version: 0.0.1
  categories:
  - Creativity
  - AI
  - models
  tags:
  - audio
  - text-to-audio
entrances:
- name: yue2studio
  host: yue2studio
  port: 8080
  title: YuE2 Studio
  authLevel: private
  openMethod: window
  icon: https://cdn.olares.com/images/2026/11/820c3ea1b560cc4e73454261ad182c1d.png
spec:
  versionName: 3.8.5
  runAsUser: true
  supportArch:
  - amd64
  accelerator:
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: 1600m
    limitedCpu: '9'
    requiredMemory: 9Gi
    limitedMemory: 17Gi
    requiredDisk: 2Gi
    limitedDisk: 10Gi
    requiredGPUMemory: 12Gi
    limitedGPUMemory: 22Gi
  fullDescription: |
    YuE2 Studio turns a musical style and lyrics into a song on your own GPU. Each generated track includes an ABC score that you can edit and use to create another performance.

    **Key features**

    - Generate vocals or instrumental music with 48 kHz stereo output.
    - Edit notes, chords, sections, key and tempo in the piano roll.
    - Keep a composition while changing its lyrics, voice or musical style.
    - Import and export ABC and MIDI scores, or transcribe a recording into a score for a cover.

    **Requirements and setup**

    This Linux amd64 preview requires an NVIDIA GeForce RTX 50 series GPU (sm_120) and a CUDA 13 compatible driver. It has been tested on an RTX 5090 Laptop GPU.

    Configure the Hugging Face endpoint and token in the Olares system environment before installation. The app inherits these settings. Download a model set in the app's Models settings before generating music. Model weights are downloaded separately and retained across app restarts.

    **Licensing**

    Studio code is licensed under MIT. Model weights have separate licenses, including CC BY-NC 4.0 for YuE2. See the [YuE2 model card](https://huggingface.co/m-a-p/YuE2-3B) for its terms.
  developer: timoncool
  website: https://timoncool.github.io/YuE2-Studio/
  sourceCode: https://github.com/timoncool/YuE2-Studio
  submitter: harveyff
  doc: https://github.com/timoncool/YuE2-Studio#readme
  license:
  - text: MIT
    url: https://github.com/timoncool/YuE2-Studio/blob/main/LICENSE
  locale:
  - en-US
  - zh-CN
  - ja-JP
  - de-DE
  - fr-FR
  - es-ES
  - it-IT
  featuredImage: https://cdn.olares.com/images/2026/11/58bb229f0b3f0ae78dbcd17a81bdd884.png
  promoteImage:
  - https://cdn.olares.com/images/2026/11/58bb229f0b3f0ae78dbcd17a81bdd884.png
  - https://cdn.olares.com/images/2026/11/fbeb1b48e6e108a57b32bb4c085fbef9.png
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
workloadReplicas:
