metadata:
  title: Chromium
  description: Google Chrome ブラウザを支えるオープンソースプロジェクト
spec:
  fullDescription: |
    **概要**
    Chromium は、すべてのユーザーにとってより安全で高速、安定したウェブ体験を構築することを目指すオープンソースのブラウザプロジェクトです。

  upgradeDescription: |
    ベースイメージを `beclab/harveyff-chromium:ae9a7fca-ls44`（Olares 向け ls44）にアップグレード。Olares One では X11 Selkies のため `PIXELFLUX_WAYLAND=false` を強制。管理ポリシーにより新しいタブとデフォルト検索は Google のまま。
