metadata:
  title: Chromium
  description: Google Chrome ブラウザを支えるオープンソースプロジェクト
spec:
  fullDescription: |
    **概要**
    Chromium は、すべてのユーザーにとってより安全で高速、安定したウェブ体験を構築することを目指すオープンソースのブラウザプロジェクトです。

  upgradeDescription: |
    - Chromium を 150.0.7871.114 から 156.0.8078.79 へアップグレード（LinuxServer イメージ `7b8e918f-ls63`。既存の Olares 向け追加：CJK フォントと GPU デバイス権限はそのまま）
