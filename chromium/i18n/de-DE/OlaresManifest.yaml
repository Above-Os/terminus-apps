spec:
  fullDescription: |
    **Über**
    Chromium ist ein Open-Source-Browserprojekt, das darauf abzielt, für alle Nutzer eine sicherere, schnellere und stabilere Art zu schaffen, das Web zu erleben.

  upgradeDescription: |
