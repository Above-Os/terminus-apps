metadata:
  title: Chromium
  description: Die Open-Source-Projekte hinter dem Google-Chrome-Browser
spec:
  fullDescription: |
    **Über**
    Chromium ist ein Open-Source-Browserprojekt, das darauf abzielt, für alle Nutzer eine sicherere, schnellere und stabilere Art zu schaffen, das Web zu erleben.

  upgradeDescription: |
    Basis-Image auf `beclab/harveyff-chromium:ae9a7fca-ls44` aktualisiert (Olares-angepasstes ls44). Erzwingt `PIXELFLUX_WAYLAND=false` für X11 Selkies auf Olares One. Verwaltete Richtlinien behalten Neue Registerkarte und Standardsuche bei Google.
