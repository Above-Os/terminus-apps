metadata:
  title: Chromium
  description: Les projets open source derrière le navigateur Google Chrome
spec:
  fullDescription: |
    **À propos**
    Chromium est un projet de navigateur open source qui vise à offrir à tous les utilisateurs une façon plus sûre, plus rapide et plus stable d'expérimenter le web.

  upgradeDescription: |
    Mise à jour de l'image de base vers `beclab/harveyff-chromium:ae9a7fca-ls44` (ls44 adapté pour Olares). Force `PIXELFLUX_WAYLAND=false` pour X11 Selkies sur Olares One. Les politiques gérées conservent le Nouvel onglet et la recherche par défaut sur Google.
