metadata:
  title: Chromium
  description: Les projets open source derrière le navigateur Google Chrome
spec:
  fullDescription: |
    **À propos**
    Chromium est un projet de navigateur open source qui vise à offrir à tous les utilisateurs une façon plus sûre, plus rapide et plus stable d'expérimenter le web.

  upgradeDescription: |
    - Mise à niveau de Chromium de 150.0.7871.114 vers 156.0.8078.79 (image LinuxServer `7b8e918f-ls63`, en conservant les ajouts Olares existants : polices CJK et droits des périphériques GPU)
