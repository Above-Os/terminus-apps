metadata:
  title: Chromium
  description: I progetti open source dietro il browser Google Chrome
spec:
  fullDescription: |
    **Informazioni**
    Chromium è un progetto di browser open source che mira a creare un modo più sicuro, veloce e stabile per tutti gli utenti di vivere il web.

  upgradeDescription: |
    - Upgrade di Chromium da 150.0.7871.114 a 156.0.8078.79 (immagine LinuxServer `7b8e918f-ls63`, mantenendo le aggiunte Olares esistenti: font CJK e permessi dei dispositivi GPU)
