metadata:
  title: Chromium
  description: I progetti open source dietro il browser Google Chrome
spec:
  fullDescription: |
    **Informazioni**
    Chromium è un progetto di browser open source che mira a creare un modo più sicuro, veloce e stabile per tutti gli utenti di vivere il web.

  upgradeDescription: |
    Aggiornamento dell'immagine base a `beclab/harveyff-chromium:ae9a7fca-ls44` (ls44 adattato per Olares). Imposta `PIXELFLUX_WAYLAND=false` per X11 Selkies su Olares One. Le policy gestite mantengono Nuova scheda e ricerca predefinita su Google.
