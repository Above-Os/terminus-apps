metadata:
  title: Chromium
  description: Los proyectos de código abierto detrás del navegador Google Chrome
spec:
  fullDescription: |
    **Acerca de**
    Chromium es un proyecto de navegador de código abierto que busca crear una forma más segura, rápida y estable para que todos los usuarios experimenten la web.

  upgradeDescription: |
    - Actualización de Chromium de 150.0.7871.114 a 156.0.8078.79 (imagen de LinuxServer `7b8e918f-ls63`, conservando los añadidos existentes de Olares: fuentes CJK y permisos de dispositivos GPU)
