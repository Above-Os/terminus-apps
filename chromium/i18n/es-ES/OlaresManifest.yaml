metadata:
  title: Chromium
  description: Los proyectos de código abierto detrás del navegador Google Chrome
spec:
  fullDescription: |
    **Acerca de**
    Chromium es un proyecto de navegador de código abierto que busca crear una forma más segura, rápida y estable para que todos los usuarios experimenten la web.

  upgradeDescription: |
    Actualización de la imagen base a `beclab/harveyff-chromium:ae9a7fca-ls44` (ls44 parcheado para Olares). Fuerza `PIXELFLUX_WAYLAND=false` para X11 Selkies en Olares One. Las políticas administradas mantienen la Nueva pestaña y la búsqueda predeterminada en Google.
