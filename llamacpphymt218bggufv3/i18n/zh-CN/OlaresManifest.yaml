metadata:
  description: "使用 llama.cpp 运行 Hy-MT2-1.8B（GGUF Q4_K_M）翻译模型。"
  title: Hy-MT2-1.8B (llama.cpp)

spec:
  fullDescription: |
    **模型简介**
    Hy-MT2-1.8B 是腾讯混元 Hy-MT2 系列的轻量多语种翻译模型，支持 33+ 种语言互译，并能遵循术语、风格、结构化数据等复杂翻译指令。本应用通过 llama.cpp 运行 `tencent/Hy-MT2-1.8B-GGUF` 的 `Q4_K_M` GGUF 量化版本。

    针对低延迟翻译调优：32K 上下文、量化 KV 缓存、全量 GPU 卸载。

    **预设配置**
    - 模型：`tencent/Hy-MT2-1.8B-GGUF:Q4_K_M`（约 1.1 GiB 权重）
    - 能力：translate（Model Console 提供 `/translate`）
    - 引擎参数：`-c 32768 -ngl all -fa on -ctk q4_0 -ctv q4_0 --jinja -np 8`
    - 所需显存：`4Gi`

    **加速器模式**
    | 模式           | 设备             | 说明                                        |
    |----------------|------------------|---------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 使用 `4Gi` 显存，`-ngl all` 完全利用 GPU    |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                  |

    **工作流程说明**
    首先，Model Console 下载并准备模型，然后 `llama.cpp` 在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **llama.cpp**：运行模型并通过 8081 端口提供 API 服务
    - **Model Console**：下载模型，展示进度，并通过 8090 端口提供 OpenAI API，代理到 `llamacpp`

    **模型存储说明**
    所有模型文件存储在共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。同类应用共用此位置。
