metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: llama.cppで提供する多言語翻訳モデル

spec:
  upgradeDescription: |
    v1.0.39: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

    v1.0.38: Intel イメージを server-intel-b11718、NVIDIA/Spark の CUDA イメージを server-cuda13-b11718 に更新。

    v1.0.37: Intel ディスクリート GPU モード `intel-gpu`（SYCL）を追加。エンジンイメージは `beclab/ggml-org-llama.cpp:server-intel-b11459`。VRAM クォータは Pod アノテーション `gpu.bytetrade.io/required-gpu-memory`。

  fullDescription: |
    Hy-MT2-1.8Bは、多くの言語の間で文章を翻訳します。用語、文体、構造化入力などの指示に従うことができます。このアプリはllama.cppで`Q4_K_M`のGGUFビルドを提供します。

    **主な機能**

    - 多くの言語の間でテキストを翻訳します。
    - 用語や文体などの翻訳指示に従います。
    - 対応するOlaresアプリから翻訳を利用できます。

    少なくとも `4Gi` の GPU メモリを備えた対応 NVIDIA GPU、または Intel Arc ディスクリート GPU が必要です。
