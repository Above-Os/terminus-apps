metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: Un modelo de traducción multilingüe servido con llama.cpp

spec:
  fullDescription: |
    Hy-MT2-1.8B traduce texto escrito entre muchos idiomas. Puede seguir instrucciones sobre terminología, estilo y entrada estructurada. Esta aplicación sirve la compilación GGUF `Q4_K_M` con llama.cpp.

    **Funciones principales**

    - Traducir texto entre muchos idiomas.
    - Seguir instrucciones de traducción como terminología y estilo.
    - Poner la traducción a disposición de aplicaciones Olares compatibles.

    Se requiere una GPU NVIDIA compatible con al menos `4Gi` de memoria GPU.
