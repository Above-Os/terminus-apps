metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: Ein mehrsprachiges Übersetzungsmodell, bereitgestellt mit llama.cpp

spec:
  upgradeDescription: |
    v1.0.37: Intel-Diskret-GPU-Modus `intel-gpu` (SYCL) hinzugefügt. Engine-Image `beclab/ggml-org-llama.cpp:server-intel-b11459`. Das VRAM-Kontingent steht in der Pod-Annotation `gpu.bytetrade.io/required-gpu-memory`.

  fullDescription: |
    Hy-MT2-1.8B übersetzt geschriebenen Text zwischen vielen Sprachen. Es kann Vorgaben zu Terminologie, Stil und strukturierten Eingaben befolgen. Diese App stellt den `Q4_K_M`-GGUF-Build mit llama.cpp bereit.

    **Hauptfunktionen**

    - Text zwischen vielen Sprachen übersetzen.
    - Übersetzungsvorgaben wie Terminologie und Stil befolgen.
    - Übersetzung für kompatible Olares-Anwendungen bereitstellen.

    Erforderlich ist eine kompatible NVIDIA-GPU oder eine diskrete Intel-Arc-GPU mit mindestens `4Gi` GPU-Speicher.
