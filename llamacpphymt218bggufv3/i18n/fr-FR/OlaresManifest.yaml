metadata:
  title: Hy-MT2-1.8B (llama.cpp)
  description: Un modèle de traduction multilingue servi avec llama.cpp

spec:
  upgradeDescription: |
    v1.0.37 : ajout du mode GPU Intel discret `intel-gpu` (SYCL). Image moteur `beclab/ggml-org-llama.cpp:server-intel-b11459`. Le quota VRAM est l'annotation de pod `gpu.bytetrade.io/required-gpu-memory`.

  fullDescription: |
    Hy-MT2-1.8B traduit du texte écrit entre de nombreuses langues. Il peut suivre des consignes de terminologie, de style et de données structurées. Cette application sert la version GGUF `Q4_K_M` avec llama.cpp.

    **Fonctionnalités principales**

    - Traduire du texte entre de nombreuses langues.
    - Suivre des consignes de traduction telles que la terminologie et le style.
    - Mettre la traduction à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible, ou un GPU Intel Arc discret, avec au moins `4Gi` de mémoire GPU est requis.
