{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- /* Speed preset: migrate older ENGINE_ARGS on upgrade. Shared with
       llm-init.yaml so the engine and the model card cannot disagree. */ -}}
{{- $engineArgs := include "llamacpphymt218bggufv3.presetArgs" ($oe.ENGINE_ARGS | default "") -}}
{{- /* MODEL_MODE=embedding -> auto-add llama.cpp's --embedding so it works out
       of the box; skipped if the user already passed it in ENGINE_ARGS. */ -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- if and (eq $modelMode "embedding") (not (contains "--embedding" $engineArgs)) -}}
{{- $engineArgs = trim (printf "%s --embedding" $engineArgs) -}}
{{- end -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $cpuRequest := trim ($oe.LLAMACPP_CPU_REQUEST | default "200m") -}}
{{- $memRequest := trim ($oe.LLAMACPP_MEMORY_REQUEST | default "4Gi") -}}
{{- $cpuLimit := trim ($oe.LLAMACPP_CPU_LIMIT | default "4") -}}
{{- $memLimit := trim ($oe.LLAMACPP_MEMORY_LIMIT | default "8Gi") -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- $gpuType = .Values.GPU.Type | default "nvidia" -}}
{{- end -}}
{{- $isCpuMode := eq $gpuType "cpu" -}}
{{- $unifiedMem := eq $gpuType "nvidia-gb10" -}}
{{- $isIntelGpu := eq $gpuType "intel-gpu" -}}
{{- $engineImage := "docker.io/beclab/ggml-org-llama.cpp:server-cuda12-b10588" -}}
{{- if $isIntelGpu -}}
{{- $engineImage = "docker.io/beclab/ggml-org-llama.cpp:server-intel-b11459" -}}
{{- end -}}
{{- $engineArgs = include "llamacpphymt218bggufv3.engineArgs" (dict "Args" $engineArgs "IsCpu" $isCpuMode) -}}
{{- /* nvidia.com/gpumem is NVIDIA-HAMi only. Discrete Arc has no GPU-memory
       extended resource, so intel-gpu puts the quota on the pod annotation
       gpu.bytetrade.io/*-gpu-memory (plain Kubernetes quantity). Spark
       unified memory reuses the same value as pod memory ("<MiB>Mi"). */ -}}
{{- $needNvidiaGpumem := and (not $isCpuMode) (not $unifiedMem) (not $isIntelGpu) -}}
{{- $gpuMiB := include "llmbase.gpuMiB" ($oe.LLAMACPP_REQUIRED_GPU_MEMORY | default "4Gi") -}}
{{- if $unifiedMem -}}
{{- $memRequest = printf "%sMi" $gpuMiB -}}
{{- $memLimit = printf "%sMi" $gpuMiB -}}
{{- end -}}
{{- $runStateHostPath := printf "%s/llm-init-run/%s" .Values.userspace.appCache .Release.Name -}}
---
# llama.cpp engine Deployment. wrappers/llamacpp.sh blocks on the sentinel
# (download ready), then execs llama-server -hf "$MODEL_NAME".
# llm-init reverse-proxies at http://llamacpp:8081 — Service name MUST be
# "llamacpp". NVIDIA uses the CUDA server build. intel-gpu uses the SYCL
# image server-intel-b11459, mounts /dev/dri, and declares VRAM with
# gpu.bytetrade.io/*-gpu-memory. Put `-ngl all` in ENGINE_ARGS.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Primary workload: named after the release (== appid llamacpphymt218bggufv3) for v3
  # allowMultipleInstall. Label/selector stays io.kompose.service: llamacpp.
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llamacpp
  {{- if not $isCpuMode }}
  annotations:
    applications.app.bytetrade.io/gpu-inject: "llamacpp"
  {{- end }}
spec:
  replicas: {{ .Values.workloads.llamacpphymt218bggufv3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacpp
{{- if $isIntelGpu }}
      # Runtime VRAM quota for the Arc device plugin. Manifest
      # requiredGPUMemory / limitedGPUMemory stay 4Gi / 8Gi.
      annotations:
        gpu.bytetrade.io/required-gpu-memory: "{{ $gpuMiB }}Mi"
        gpu.bytetrade.io/limited-gpu-memory: "{{ $gpuMiB }}Mi"
{{- end }}
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: llm-init-wrappers
            defaultMode: 0555
{{- if $isIntelGpu }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: drm
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
{{- end }}
      containers:
        - name: llamacpp
          image: "{{ $engineImage }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/llm-init/wrappers/llamacpp.sh"]
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: WRAPPER_COMMON
              value: /run/llm-init/wrappers/common.sh
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: LLAMACPP_PORT
              value: "8081"
            - name: WAIT_TIMEOUT
              value: "3600"
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
{{- if $isCpuMode }}
            - name: CUDA_VISIBLE_DEVICES
              value: ""
{{- end }}
          ports:
            - name: llamacpp
              containerPort: 8081
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /llm-init/wrappers
              readOnly: true
{{- if $isIntelGpu }}
            - name: dri
              mountPath: /dev/dri
            - name: drm
              mountPath: /sys/class/drm
            - name: dshm
              mountPath: /dev/shm
{{- end }}
          resources:
            # nvidia.com/gpumem is the per-instance GPU memory quota read by the
            # Olares gpu-inject webhook (accelerator is -1/auto, can't carry it).
            # It's a non-overcommittable extended resource, so it must be in BOTH
            # requests and limits with the same value. Dropped on gb10 (unified
            # memory uses pod memory instead), cpu (no GPU inject), and
            # intel-gpu (pod annotation above).
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if $needNvidiaGpumem }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if $needNvidiaGpumem }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llamacpp
spec:
  selector:
    io.kompose.service: llamacpp
  ports:
    - name: llamacpp
      port: 8081
      targetPort: 8081
  type: ClusterIP
