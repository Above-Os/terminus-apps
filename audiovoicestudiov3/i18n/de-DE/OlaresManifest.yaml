metadata:
  title: Voice Studio V3
  description: Eine Webanwendung für Stimmenklonen, Transkription, Synchronisation und Hörbücher

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudio ist eine Webanwendung zum Erstellen, Transkribieren und Bearbeiten gesprochener Inhalte. Sie vereint Stimmenklonen, Synchronisation, Diktat, Hörbucherstellung und die Verwaltung einer Stimmenbibliothek.

    **Hauptfunktionen**
    - Sprache mit geklonten oder verfügbaren Stimmen erzeugen.
    - Aufnahmen für Diktat und Bearbeitung transkribieren.
    - Inhalte in eine andere Sprache synchronisieren und längere Audioinhalte erstellen.

    **Für Olares-Benutzer**
    Diese Anwendung verbindet VoiceStudio über Olares LLM Gateway mit kompatiblen Diensten für Spracherkennung, Sprachsynthese, Übersetzung und Diarisierung. Die verfügbaren Funktionen hängen von den auf Olares installierten und konfigurierten Modellen ab.
