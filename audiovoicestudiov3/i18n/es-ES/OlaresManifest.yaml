metadata:
  title: Voice Studio V3
  description: Una aplicación web para clonación de voz, transcripción, doblaje y audiolibros

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudio es una aplicación web para crear, transcribir y editar contenido hablado. Reúne clonación de voz, doblaje, dictado, creación de audiolibros y gestión de una biblioteca de voces.

    **Funciones principales**
    - Crear voz con voces clonadas o disponibles.
    - Transcribir grabaciones para dictado y edición.
    - Doblar contenido a otro idioma y crear audio de larga duración.

    **Para usuarios de Olares**
    Esta aplicación conecta VoiceStudio con servicios compatibles de reconocimiento de voz, síntesis de voz, traducción y diarización mediante Olares LLM Gateway. Las funciones disponibles dependen de los modelos instalados y configurados en Olares.
  upgradeDescription: |
    v1.0.2: Las cargas para doblaje ahora usan bloques de `256 KiB` para evitar que los archivos grandes bloqueen el único proceso de trabajo. Los demás flujos de carga no cambian.
    v1.0.1: Se corrigió que la aplicación permaneciera en estado de detención porque el número de réplicas no podía reducirse a cero.
    v1.0.0: Versión inicial.
