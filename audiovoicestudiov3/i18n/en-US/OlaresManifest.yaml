metadata:
  title: Voice Studio V3
  description: A web app for voice cloning, transcription, dubbing, and audiobooks

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudio is a web application for creating, transcribing, and editing spoken audio. It combines voice cloning, dubbing, dictation, audiobook creation, and voice-library management.

    **Key features**
    - Create speech with cloned or available voices.
    - Transcribe recordings for dictation and editing.
    - Dub content into another language and create longer-form audio.

    **For Olares users**
    This package connects VoiceStudio to compatible speech recognition, text-to-speech, translation, and diarization services through Olares LLM Gateway. Available functions depend on the models installed and configured on Olares.
