metadata:
  title: Voice Studio V3
  description: Une application web pour le clonage vocal, la transcription, le doublage et les livres audio

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudio est une application web permettant de créer, transcrire et modifier du contenu vocal. Elle réunit le clonage vocal, le doublage, la dictée, la création de livres audio et la gestion d'une bibliothèque de voix.

    **Fonctionnalités principales**
    - Créer de la parole avec des voix clonées ou disponibles.
    - Transcrire des enregistrements pour la dictée et le montage.
    - Doubler du contenu dans une autre langue et créer des contenus audio longs.

    **Pour les utilisateurs d'Olares**
    Cette application relie VoiceStudio aux services compatibles de reconnaissance vocale, synthèse vocale, traduction et diarisation via Olares LLM Gateway. Les fonctions disponibles dépendent des modèles installés et configurés sur Olares.
