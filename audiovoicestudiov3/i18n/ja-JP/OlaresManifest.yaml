metadata:
  title: Voice Studio V3
  description: 音声クローン、文字起こし、吹き替え、オーディオブック作成用Webアプリ

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudioは、音声コンテンツの作成、文字起こし、編集を行うWebアプリです。音声クローン、吹き替え、ディクテーション、オーディオブック作成、音声ライブラリ管理を一つの画面で利用できます。

    **主な機能**
    - クローン音声または利用可能な音声で発話を生成します。
    - ディクテーションや編集のために録音を文字起こしします。
    - 別言語への吹き替えと長い音声コンテンツの作成に対応します。

    **Olaresユーザー向け**
    このアプリは、Olares LLM Gatewayを通じてVoiceStudioを対応する音声認識、音声合成、翻訳、話者ダイアライゼーションサービスに接続します。利用できる機能は、Olaresにインストールして設定したモデルによって異なります。
  upgradeDescription: |
    v1.0.2：吹き替え用ファイルを`256 KiB`単位でアップロードし、大きなファイルが単一のワーカーを占有しないようにしました。他のアップロード処理は変更していません。
    v1.0.1：レプリカ数をゼロにできず、アプリが停止処理中のままになる問題を修正しました。
    v1.0.0：初回リリース。
