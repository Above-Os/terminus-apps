metadata:
  title: Voice Studio V3
  description: 用于音色克隆、转写、配音和有声书制作的网页应用

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudio 是用于创建、转写和编辑语音内容的网页应用，集音色克隆、配音、听写、有声书制作和音色库管理于一体。

    **主要功能**
    - 使用克隆或已有音色生成语音。
    - 转写录音，用于听写和编辑。
    - 将内容配音为其他语言，并制作较长的音频内容。

    **Olares 用户须知**
    此应用通过 Olares LLM Gateway 连接兼容的语音识别、文本转语音、翻译和说话人分离服务。可用功能取决于 Olares 上已安装并配置的模型。
  upgradeDescription: |
    v1.0.2：配音上传改用 `256 KiB` 分块，避免大文件阻塞单个工作进程。其他上传流程不受影响。
    v1.0.1：修复副本数无法缩减到零，导致应用一直停留在“正在停止”状态的问题。
    v1.0.0：首次发布。
