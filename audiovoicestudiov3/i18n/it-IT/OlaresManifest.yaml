metadata:
  title: Voice Studio V3
  description: Un'app web per clonazione vocale, trascrizione, doppiaggio e audiolibri

spec:
  onlyAdmin: true
  fullDescription: |
    VoiceStudio è un'applicazione web per creare, trascrivere e modificare contenuti vocali. Riunisce clonazione vocale, doppiaggio, dettatura, creazione di audiolibri e gestione di una raccolta di voci.

    **Funzionalità principali**
    - Creare parlato con voci clonate o disponibili.
    - Trascrivere registrazioni per dettatura e modifica.
    - Doppiare contenuti in un'altra lingua e creare audio di lunga durata.

    **Per gli utenti Olares**
    Questa applicazione collega VoiceStudio a servizi compatibili di riconoscimento vocale, sintesi vocale, traduzione e diarizzazione tramite Olares LLM Gateway. Le funzioni disponibili dipendono dai modelli installati e configurati su Olares.
