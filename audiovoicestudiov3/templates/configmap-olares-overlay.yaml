    """Gateway async diarization. POST async=1, poll. On failure, silence-gap. AGPL-3.0."""
    from __future__ import annotations
    
    import os
    import time
    from typing import Any, Optional
    
    _CONNECT_S = 5.0
    _WRITE_S = 60.0
    _SUBMIT_READ_S = 30.0
    _POLL_S = 10.0
    _POLL_EVERY_S = 2.0
    _POLL_DEADLINE_S = 180.0
    
    
    def _base_url() -> str:
        return (
            os.environ.get("DIAR_BASE_URL")
            or os.environ.get("ASR_OPENAI_COMPAT_BASE_URL")
            or os.environ.get("TTS_OPENAI_COMPAT_BASE_URL")
            or os.environ.get("TRANSLATE_BASE_URL")
            or ""
        ).rstrip("/")
    
    
    def _api_key() -> str:
        return (
            os.environ.get("DIAR_API_KEY")
            or os.environ.get("ASR_OPENAI_COMPAT_API_KEY")
            or os.environ.get("TTS_OPENAI_COMPAT_API_KEY")
            or os.environ.get("TRANSLATE_API_KEY")
            or ""
        ).strip()
    
    
    def _model() -> str:
        return (os.environ.get("DIAR_MODEL") or "").strip()
    
    
    def configured() -> bool:
        return bool(_model() and _base_url() and _api_key())
    
    
    def _task_obj(body: Any) -> dict:
        if isinstance(body, dict) and isinstance(body.get("task"), dict):
            return body["task"]
        if isinstance(body, dict):
            return body
        return {}
    
    
    def _segments_from(body: Any) -> list:
        if not isinstance(body, dict):
            return []
        task = _task_obj(body)
        result = task.get("result") if isinstance(task.get("result"), dict) else None
        if result and result.get("segments"):
            return result["segments"]
        return body.get("segments") or []
    
    
    class _Turn:
        def __init__(self, start: float, end: float) -> None:
            self.start = start
            self.end = end
    
    
    def _remap_speakers_by_arrival(segments: list[dict]) -> list[dict]:
        """Pyannote cluster ids are arbitrary. VoiceStudio maps SPEAKER_00 → Speaker 1."""
        order: list[str] = []
        seen: set[str] = set()
        ranked = sorted(
            segments,
            key=lambda s: (float(s.get("start") or 0.0), float(s.get("end") or 0.0)),
        )
        for seg in ranked:
            spk = str(seg.get("speaker") or "SPEAKER_00")
            if spk not in seen:
                seen.add(spk)
                order.append(spk)
        mapping = {old: f"SPEAKER_{i:02d}" for i, old in enumerate(order)}
        out = []
        for seg in ranked:
            new = dict(seg)
            old = str(seg.get("speaker") or "SPEAKER_00")
            new["speaker"] = mapping.get(old, "SPEAKER_00")
            out.append(new)
        pretty = ", ".join(f"{k}->{v}" for k, v in mapping.items())
        print(f"olares overlay: diar speakers by first appearance ({pretty})", flush=True)
        return out
    
    
    class _Annotation:
        """Duck-types pyannote Annotation.itertracks for assign_speakers_from_diarization."""
    
        def __init__(self, segments: list[dict]) -> None:
            self._segments = segments
    
        def itertracks(self, yield_label: bool = True):
            for seg in self._segments:
                turn = _Turn(float(seg["start"]), float(seg["end"]))
                speaker = str(seg.get("speaker") or "SPEAKER_00")
                if yield_label:
                    yield turn, None, speaker
                else:
                    yield turn, None
    
    
    class GatewayDiarPipeline:
        def __call__(self, audio_path: str, num_speakers: Optional[int] = None) -> _Annotation:
            import httpx
    
            headers = {"Authorization": f"Bearer {_api_key()}"}
            model = _model()
            data: dict[str, Any] = {"model": model, "async": "1"}
            if num_speakers:
                data["num_speakers"] = str(int(num_speakers))
            submit_timeout = httpx.Timeout(
                connect=_CONNECT_S, read=_SUBMIT_READ_S, write=_WRITE_S, pool=5.0
            )
            poll_timeout = httpx.Timeout(
                connect=_CONNECT_S, read=_POLL_S, write=10.0, pool=5.0
            )
            segs: list = []
            with httpx.Client(timeout=submit_timeout, http2=False) as client:
                with open(audio_path, "rb") as fh:
                    resp = client.post(
                        _base_url() + "/audio/diarization",
                        headers=headers,
                        data=data,
                        files={"file": (os.path.basename(audio_path) or "audio.wav", fh)},
                    )
                if resp.status_code in (502, 503, 504, 530):
                    raise RuntimeError(f"gateway diar {resp.status_code}")
                resp.raise_for_status()
                body = resp.json() if resp.content else {}
                segs = _segments_from(body)
                if segs:
                    print(
                        "olares overlay: gateway diar returned inline "
                        f"({len(segs)} turns, HTTP {resp.status_code})",
                        flush=True,
                    )
                elif resp.status_code in (200, 202):
                    task = _task_obj(body)
                    task_id = str(task.get("id") or "")
                    if not task_id:
                        raise RuntimeError("gateway diar async returned no task id")
                    print(
                        f"olares overlay: gateway diar queued {task_id} "
                        f"(HTTP {resp.status_code})",
                        flush=True,
                    )
                    segs = self._poll(client, headers, model, task_id, poll_timeout)
                else:
                    raise RuntimeError(f"gateway diar unexpected HTTP {resp.status_code}")
            if not segs:
                raise RuntimeError("gateway diarization returned no segments")
            segs = _remap_speakers_by_arrival(segs)
            print(
                f"olares overlay: gateway diar ok ({len(segs)} turns, model={model})",
                flush=True,
            )
            return _Annotation(segs)
    
        def _poll(self, client, headers, model, task_id, poll_timeout) -> list:
            url = f"{_base_url()}/audio/tasks/{task_id}"
            deadline = time.monotonic() + _POLL_DEADLINE_S
            while time.monotonic() < deadline:
                time.sleep(_POLL_EVERY_S)
                client.timeout = poll_timeout
                resp = client.get(url, headers=headers, params={"model": model})
                if resp.status_code in (502, 503, 504, 530):
                    raise RuntimeError(f"gateway diar poll {resp.status_code}")
                resp.raise_for_status()
                task = _task_obj(resp.json() if resp.content else {})
                status = str(task.get("status") or "")
                if status == "succeeded":
                    segs = _segments_from({"task": task}) or _segments_from(task)
                    if segs:
                        return segs
                    result = task.get("result")
                    if isinstance(result, dict):
                        return result.get("segments") or []
                    raise RuntimeError("gateway diar task succeeded with no segments")
                if status in ("failed", "canceled"):
                    err = task.get("error") or status
                    raise RuntimeError(f"gateway diar task {status}: {err}")
            try:
                client.timeout = poll_timeout
                client.delete(url, headers=headers, params={"model": model})
            except Exception:
                pass
            raise TimeoutError(f"gateway diar task {task_id} exceeded {_POLL_DEADLINE_S:.0f}s")
    
    
    def patch_diarization() -> None:
        import services.model_manager as model_manager
    
        orig = model_manager.get_diarization_pipeline
        if getattr(orig, "_olares_gateway", False):
            return
    
        def wrapped(return_error: bool = False):
            if not configured():
                return orig(return_error=return_error)
    
            class GatewayOrHeuristic:
                def __call__(self, audio_path, num_speakers=None):
                    try:
                        return GatewayDiarPipeline()(
                            audio_path, num_speakers=num_speakers
                        )
                    except Exception as exc:
                        print(
                            f"olares overlay: gateway diar failed "
                            f"({type(exc).__name__}: {exc}); "
                            "leaving VoiceStudio on silence-gap heuristic",
                            flush=True,
                        )
                        raise
    
            pipe = GatewayOrHeuristic()
            return (pipe, None) if return_error else pipe
    
        wrapped._olares_gateway = True  # type: ignore[attr-defined]
        model_manager.get_diarization_pipeline = wrapped
        print(
            "olares overlay: diar gateway async=1, fail-fast to silence-gap",
            flush=True,
        )
