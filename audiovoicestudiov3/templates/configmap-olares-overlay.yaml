    """OpenAI-compatible remote TTS for VoiceStudio. AGPL-3.0 overlay (Olares)."""
    from __future__ import annotations
    
    import io
    import os
    import re
    import threading
    import time
    import uuid
    from typing import Optional
    
    import torch
    from services.tts_backend import TTSBackend
    
    _TTS_URL_KEY = "tts.openai_compat.base_url"
    _TTS_MODEL_KEY = "tts.openai_compat.model"
    _TTS_SECRET_NAME = "tts_openai_compat_key"
    
    # VoiceStudio pickers only list voice_profiles (and the gallery). Engine presets
    # never appear unless we seed them. ref_text carries the engine id because
    # generate() is never given the profile id, and CosyVoice instruct-heal would
    # strip de_female / casual_male as unknown tags.
    _VOICE_MARK = "__olares_voice__:"
    _PERSONALITY = "olares-engine-voice"
    # VoiceStudio ships this clone; overlay must never delete or overwrite it.
    _BUILTIN_DEMO_NAME = "voicestudio demo voice"
    _IDENT_RE = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
    _SYNC_TTL_S = 20.0
    _FETCH_TIMEOUT_S = 8.0
    
    _sync_lock = threading.Lock()
    _cache: dict = {"key": "", "ids": set(), "ts": 0.0, "ok": False}
    
    
    def _first_env(*keys: str) -> str:
        for key in keys:
            val = (os.environ.get(key) or "").strip()
            if val:
                return val
        return ""
    
    
    def _base_url() -> str:
        from services import settings_store
    
        return (
            _first_env("TTS_OPENAI_COMPAT_BASE_URL")
            or settings_store.get_text(_TTS_URL_KEY)
            or ""
        ).rstrip("/")
    
    
    def _model() -> str:
        from services import settings_store
    
        return (
            _first_env("TTS_OPENAI_COMPAT_MODEL")
            or settings_store.get_text(_TTS_MODEL_KEY)
            or ""
        )
    
    
    def _api_key() -> Optional[str]:
        from services import settings_store
    
        return _first_env("TTS_OPENAI_COMPAT_API_KEY") or settings_store.get_secret(
            _TTS_SECRET_NAME
        )
    
    
    def _voice_cache_key() -> str:
        return f"{_base_url()}|{_model()}"
    
    
    def _normalize_voice_list(raw) -> list[dict]:
        if raw is None:
            return []
        if isinstance(raw, dict):
            raw = raw.get("voices") if raw.get("voices") is not None else raw.get("data")
        if not isinstance(raw, list):
            return []
        out: list[dict] = []
        seen: set[str] = set()
        for item in raw:
            if isinstance(item, str):
                voice_id, name, language = item.strip(), item.strip(), "Auto"
            elif isinstance(item, dict):
                voice_id = str(
                    item.get("id") or item.get("name") or item.get("voice") or item.get("voice_id") or ""
                ).strip()
                name = str(
                    item.get("label") or item.get("name") or item.get("title") or item.get("description") or voice_id
                ).strip()
                language = str(item.get("language") or item.get("lang") or "Auto").strip() or "Auto"
            else:
                continue
            if not voice_id or voice_id in seen:
                continue
            seen.add(voice_id)
            if not name:
                name = voice_id
            elif name.lower() != voice_id.lower():
                name = f"{voice_id} · {name}"
            out.append({"id": voice_id, "name": name, "language": language})
        return out
    
    
    def fetch_engine_voices() -> Optional[list[dict]]:
        """GET gateway /audio/voices for the current TTS model.
    
        [] = this model has no preset voices. None = probe failed (do not invent
        another model's roster).
        """
        import httpx
    
        base = _base_url().rstrip("/")
        model = _model()
        if not base.startswith("http"):
            # ENV/settings often land after DB init; None keeps retries alive.
            return None
        url = base + "/audio/voices"
        params = {"model": model} if model else None
        headers = {}
        key = _api_key()
        if key:
            headers["Authorization"] = f"Bearer {key}"
        try:
            with httpx.Client(timeout=_FETCH_TIMEOUT_S, http2=False) as client:
                resp = client.get(url, params=params, headers=headers)
        except Exception as exc:
            print(f"olares overlay: GET {url} failed ({type(exc).__name__}: {exc})", flush=True)
            return None
        if resp.status_code in (404, 405):
            return []
        if resp.status_code >= 400:
            print(
                f"olares overlay: GET {url} HTTP {resp.status_code}: {resp.text[:160]}",
                flush=True,
            )
            return None
        try:
            payload = resp.json()
        except Exception:
            return None
        return _normalize_voice_list(payload)
    
    
    def _profile_uuid(model: str, voice_id: str) -> str:
        return str(uuid.uuid5(uuid.NAMESPACE_URL, f"olares-tts-voice:{model}:{voice_id}"))
    
    
    def _engine_rows_to_drop(conn, keep_ids: list[str]) -> list[str]:
        """Only overlay-seeded engine presets. Never the app Demo Voice or user clones."""
        keep = set(keep_ids)
        cols = {c[1] for c in conn.execute("PRAGMA table_info(voice_profiles)")}
        select = "id, name, personality, ref_text"
        if "is_demo" in cols:
            select += ", IFNULL(is_demo, 0) AS is_demo"
        rows = conn.execute(f"SELECT {select} FROM voice_profiles").fetchall()
        drop: list[str] = []
        for row in rows:
            pid = str(row["id"] or "")
            name = str(row["name"] or "").strip().lower()
            personality = str(row["personality"] or "")
            ref_text = str(row["ref_text"] or "")
            is_demo = int(row["is_demo"] or 0) if "is_demo" in cols else 0
            if is_demo or name == _BUILTIN_DEMO_NAME or pid.lower().startswith("demo"):
                continue
            if personality != _PERSONALITY and not ref_text.startswith(_VOICE_MARK):
                continue
            if pid in keep:
                continue
            drop.append(pid)
        return drop
    
    
    def _null_profile_fks(conn, drop_ids: list[str]) -> None:
        if not drop_ids:
            return
        ph = ",".join("?" * len(drop_ids))
        tables = conn.execute(
            "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
        ).fetchall()
        for (table,) in tables:
            if not _IDENT_RE.match(table) or table == "voice_profiles":
                continue
            for fk in conn.execute(f"PRAGMA foreign_key_list({table})"):
                if fk[2] != "voice_profiles":
                    continue
                col = fk[3]
                if not _IDENT_RE.match(col):
                    continue
                conn.execute(
                    f"UPDATE {table} SET {col}=NULL WHERE {col} IN ({ph})",
                    drop_ids,
                )
            col_names = [c[1] for c in conn.execute(f"PRAGMA table_info({table})")]
            if table == "mcp_client_bindings" and "profile_id" in col_names:
                conn.execute(
                    f"UPDATE {table} SET profile_id=NULL WHERE profile_id IN ({ph})",
                    drop_ids,
                )
    
    
    def _replace_engine_voice_rows(conn, voices: list[dict], keep_ids: list[str]) -> None:
        drop_ids = _engine_rows_to_drop(conn, keep_ids)
        _null_profile_fks(conn, drop_ids)
        if drop_ids:
            ph = ",".join("?" * len(drop_ids))
            conn.execute(f"DELETE FROM voice_profiles WHERE id IN ({ph})", drop_ids)
        created = time.time()
        model = _model()
        for row, profile_id in zip(voices, keep_ids):
            if profile_id.lower().startswith("demo"):
                continue
            conn.execute(
                "INSERT INTO voice_profiles (id, name, ref_audio_path, ref_text, instruct, "
                "language, personality, description, kind, is_demo, created_at) "
                "VALUES (?, ?, '', ?, '', ?, ?, ?, 'clone', 0, ?) "
                "ON CONFLICT(id) DO UPDATE SET "
                "name=excluded.name, ref_text=excluded.ref_text, "
                "language=excluded.language, description=excluded.description, "
                "personality=excluded.personality, kind='clone' "
                "WHERE IFNULL(is_demo, 0)=0 "
                "AND lower(name) != ? "
                "AND id NOT LIKE 'demo%'",
                (
                    profile_id,
                    row["name"],
                    _VOICE_MARK + row["id"],
                    row["language"],
                    _PERSONALITY,
                    "Gateway TTS preset",
                    created,
                    _BUILTIN_DEMO_NAME,
                ),
            )
        n = conn.execute(
            "SELECT count(*) FROM voice_profiles WHERE personality=?",
            (_PERSONALITY,),
        ).fetchone()[0]
        print(
            f"olares overlay: TTS {model or '(none)'} → {len(voices)} engine voice(s) "
            f"(db engine rows={n}; app Demo Voice kept)",
            flush=True,
        )
    
    
    def sync_engine_voice_profiles(*, force: bool = False) -> None:
        """Keep VoiceSelector = current TTS model's /voices. App Demo Voice is never touched."""
        now = time.time()
        key = _voice_cache_key()
        with _sync_lock:
            if (
                not force
                and _cache["ok"]
                and _cache["key"] == key
                and now - float(_cache["ts"] or 0) < _SYNC_TTL_S
            ):
                return
            voices = fetch_engine_voices()
            model_changed = _cache["key"] != key
            provisional = False
            if voices is None:
                if not model_changed and _cache["ok"]:
                    return
                # New model / first sync: do not keep the previous model's roster.
                voices = []
                provisional = True
            model = _model()
            keep_ids = [_profile_uuid(model, row["id"]) for row in voices]
            try:
                from core.db import db_conn
    
                with db_conn() as conn:
                    _replace_engine_voice_rows(conn, voices, keep_ids)
            except Exception as exc:
                print(f"olares overlay: voice_profiles sync failed: {exc}", flush=True)
                return
            _cache.update(
                {
                    "key": key,
                    "ids": {row["id"] for row in voices},
                    "ts": now,
                    "ok": not provisional,
                }
            )
            try:
                from core import event_bus
    
                event_bus.emit("profiles", {"action": "synced"})
            except Exception:
                pass
    
    
    def start_voice_sync() -> None:
        def _run():
            for delay in (1.0, 3.0, 8.0, 20.0, 40.0):
                time.sleep(delay)
                try:
                    sync_engine_voice_profiles(force=True)
                    if _cache.get("ok"):
                        return
                except Exception as exc:
                    print(f"olares overlay: voice sync retry: {exc}", flush=True)
    
        threading.Thread(target=_run, name="olares-voice-sync", daemon=True).start()
    
    
    def patch_list_profiles_route(app) -> None:
        """Refresh engine voices on GET /profiles without replacing the FastAPI endpoint.
    
        Replacing dependant.call with a *args/**kwargs wrapper made GET /profiles
        return 422, so the picker never received profiles and only showed the gallery.
        """
        if getattr(app, "_olares_voice_mw", False):
            return
    
        @app.middleware("http")
        async def _olares_engine_voices(request, call_next):
            path = (request.url.path or "").rstrip("/")
            if request.method == "GET" and path == "/profiles":
                try:
                    sync_engine_voice_profiles()
                except Exception as exc:
                    print(f"olares overlay: voice sync skipped: {exc}", flush=True)
            return await call_next(request)
    
        app._olares_voice_mw = True  # type: ignore[attr-defined]
        print("olares overlay: GET /profiles will refresh engine voices", flush=True)
    
    
    def _engine_voice(*, ref_text, instruct, extras) -> tuple[str, object]:
        extra_voice = str((extras or {}).get("voice") or "").strip()
        marked = ""
        if isinstance(ref_text, str) and ref_text.startswith(_VOICE_MARK):
            marked = ref_text[len(_VOICE_MARK) :].strip()
        instruct_s = str(instruct or (extras or {}).get("instruct") or "").strip()
        from_instruct = instruct_s if instruct_s and instruct_s in (_cache.get("ids") or set()) else ""
        env_voice = (os.environ.get("TTS_OPENAI_COMPAT_VOICE") or "").strip()
        voice = extra_voice or marked or from_instruct or env_voice
        send_instruct = instruct
        if from_instruct and voice == from_instruct:
            send_instruct = None
        return voice, send_instruct
    
    
    def _wav_tensor(audio_bytes: bytes, sample_rate: int) -> torch.Tensor:
        import torchaudio
    
        wav, sr = torchaudio.load(io.BytesIO(audio_bytes))
        if sr != sample_rate:
            wav = torchaudio.functional.resample(wav, sr, sample_rate)
        if wav.ndim == 1:
            wav = wav.unsqueeze(0)
        elif wav.ndim == 2 and wav.shape[0] > 1:
            wav = wav.mean(dim=0, keepdim=True)
        return wav
    
    
    class OpenAICompatTTSBackend(TTSBackend):
        id = "openai-compat-tts"
        display_name = "LLM Gateway TTS"
        gpu_compat = ("cpu",)
        supports_cloning = True
        applies_own_mastering = True
        min_vram_gb = 0.0
    
        def __init__(self):
            self._url = _base_url()
            self._model = _model()
    
        @classmethod
        def is_available(cls) -> tuple[bool, str]:
            if not _base_url():
                return False, "Set TTS_OPENAI_COMPAT_BASE_URL to the LLM Gateway /v1"
            if not _model():
                return False, "Set TTS_OPENAI_COMPAT_MODEL to a gateway TTS model id"
            return True, _model()
    
        @property
        def sample_rate(self) -> int:
            return 24000
    
        @property
        def supported_languages(self) -> list[str]:
            return ["multi"]
    
        def generate(
            self,
            text: str,
            *,
            ref_audio: Optional[str] = None,
            ref_text: Optional[str] = None,
            instruct: Optional[str] = None,
            description: Optional[str] = None,
            **extras,
        ) -> torch.Tensor:
            # Same TTS_OPENAI_COMPAT_* as preset. Clone-capable engines (VoxCPM2 / Qwen Base /
            # MOSS / CosyVoice) answer /speech/clone; Voxtral does not. Fall back so the Clone
            # UI still produces audio the way it did before a separate clone env existed.
            # Seeded engine presets stash the id in ref_text; that is not a clone reference.
            if ref_audio and not (isinstance(ref_text, str) and ref_text.startswith(_VOICE_MARK)):
                cloned = self._try_clone(text, ref_audio, ref_text)
                if cloned is not None:
                    return cloned
                print(
                    "olares overlay: clone not served by current TTS model; falling back to preset",
                    flush=True,
                )
            return self._preset(
                text,
                instruct=instruct,
                description=description,
                extras=extras,
                ref_text=ref_text,
            )
    
        def _headers(self) -> dict:
            headers: dict = {}
            key = _api_key()
            if key:
                headers["Authorization"] = f"Bearer {key}"
            return headers
    
        def _preset(self, text: str, *, instruct, description, extras, ref_text=None) -> torch.Tensor:
            import httpx
    
            url = (self._url or _base_url()).rstrip("/") + "/audio/speech"
            model = self._model or _model()
            if not url.startswith("http") or not model:
                raise RuntimeError(
                    "TTS_OPENAI_COMPAT_BASE_URL and TTS_OPENAI_COMPAT_MODEL must be set"
                )
            payload: dict = {"model": model, "input": text, "response_format": "wav"}
            extras = extras or {}
            voice, instruct = _engine_voice(ref_text=ref_text, instruct=instruct, extras=extras)
            if voice:
                payload["voice"] = voice
            hint = instruct or description
            if hint:
                payload["instructions"] = hint
            headers = {"Content-Type": "application/json", **self._headers()}
            try:
                with httpx.Client(timeout=180.0, http2=False) as client:
                    resp = client.post(url, json=payload, headers=headers)
                    resp.raise_for_status()
                    audio_bytes = resp.content
            except Exception as exc:
                raise RuntimeError(
                    f"OpenAI-compatible TTS at {url!r} failed: {type(exc).__name__}: {exc}"
                ) from exc
            return _wav_tensor(audio_bytes, self.sample_rate)
    
        def _try_clone(self, text: str, ref_audio: str, ref_text: Optional[str]) -> Optional[torch.Tensor]:
            import httpx
    
            model = self._model or _model()
            base = (self._url or _base_url()).rstrip("/")
            if not model or not base.startswith("http"):
                return None
            data = {"input": text, "response_format": "wav", "model": model}
            if (ref_text or "").strip():
                data["ref_text"] = ref_text.strip()
            headers = self._headers()
            try:
                with httpx.Client(timeout=180.0, http2=False) as client:
                    for path in ("/audio/speech/clone", "/audio/clone"):
                        url = base + path
                        with open(ref_audio, "rb") as fh:
                            resp = client.post(
                                url,
                                data=data,
                                files={
                                    "file": (
                                        os.path.basename(ref_audio) or "ref.wav",
                                        fh,
                                        "application/octet-stream",
                                    )
                                },
                                headers=headers,
                            )
                        if resp.status_code in (404, 405):
                            continue
                        if resp.status_code >= 400:
                            print(
                                f"olares overlay: clone {url} HTTP {resp.status_code}: {resp.text[:160]}",
                                flush=True,
                            )
                            return None
                        return _wav_tensor(resp.content, self.sample_rate)
            except Exception as exc:
                print(f"olares overlay: clone failed ({type(exc).__name__}: {exc})", flush=True)
                return None
            return None
