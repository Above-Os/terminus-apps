    """Keep native TRANSLATE_* on the gateway; fall back to the original engine on connect errors."""
    from __future__ import annotations
    
    import os
    import re
    from functools import wraps
    
    from fastapi.responses import JSONResponse
    
    # Hy-MT2 wants a full language name in its own template, not ISO codes.
    # https://github.com/Tencent-Hunyuan/Hy-MT2
    _HY_MT_TARGET = {
        "chinese (simplified)": "中文",
        "chinese (traditional)": "中文",
        "chinese": "中文",
        "mandarin": "中文",
        "english": "英语",
        "japanese": "日语",
        "korean": "韩语",
        "french": "法语",
        "german": "德语",
        "spanish": "西班牙语",
        "portuguese": "葡萄牙语",
        "russian": "俄语",
        "arabic": "阿拉伯语",
        "thai": "泰语",
        "vietnamese": "越南语",
        "indonesian": "印尼语",
        "italian": "意大利语",
        "dutch": "荷兰语",
        "turkish": "土耳其语",
        "hindi": "印地语",
        "polish": "波兰语",
        "swedish": "瑞典语",
        "ukrainian": "乌克兰语",
    }
    _HY_MT_INTO = re.compile(
        r"into\s+([A-Za-z][A-Za-z ()-]+?)(?:\.| The output| Reply ONLY|$)",
        re.I,
    )
    _hy_mt_logged: set[str] = set()
    
    
    def _failed_connect(result) -> bool:
        if isinstance(result, JSONResponse) and result.status_code >= 400:
            return True
        if not isinstance(result, dict):
            return False
        segs = result.get("translated") or []
        if not segs:
            return False
        markers = (
            "401",
            "403",
            "502",
            "503",
            "Authentication",
            "invalid api key",
            "ConnectError",
            "Timeout",
            "FETCH FAILED",
        )
        failed = 0
        nonempty = 0
        for seg in segs:
            if not (seg.get("text") or "").strip() and not seg.get("error"):
                continue
            nonempty += 1
            err = str(seg.get("error") or "")
            if err and any(m.lower() in err.lower() for m in markers):
                failed += 1
        return nonempty > 0 and failed == nonempty
    
    
    def _ui_target_name(system: str) -> str:
        """Language the VoiceStudio UI asked for, from its own system prompt."""
        match = _HY_MT_INTO.search(system or "")
        return (match.group(1) if match else "").strip()
    
    
    def _hy_mt_name_for_ui(ui_name: str) -> str:
        """Map the UI label onto Hy-MT2's full language name. Empty = unknown."""
        raw = (ui_name or "").strip().lower()
        if not raw:
            return ""
        if raw in _HY_MT_TARGET:
            return _HY_MT_TARGET[raw]
        for key, name in sorted(_HY_MT_TARGET.items(), key=lambda kv: -len(kv[0])):
            if key in raw:
                return name
        return ""
    
    
    def rewrite_hy_mt_messages(model, messages):
        """Wrap Hy-MT2 calls in its official template, target taken from the UI."""
        if not messages or "Hy-MT2" not in str(model or ""):
            return messages
        system = ""
        user = ""
        for msg in messages:
            role = (msg or {}).get("role")
            content = str((msg or {}).get("content") or "")
            if role == "system":
                system = content
            elif role == "user":
                user = content
        if "Translate the user's text" not in system or not user.strip():
            return messages
        ui_name = _ui_target_name(system)
        if not ui_name:
            return messages
        hy_name = _hy_mt_name_for_ui(ui_name)
        if hy_name:
            prompt = (
                f"将以下文本翻译为{hy_name}，注意只需要输出翻译后的结果，不要额外解释：\n\n{user}"
            )
            log_key = f"{ui_name}->{hy_name}"
        else:
            prompt = (
                f"Translate the following text into {ui_name}. "
                "Note that you should only output the translated result "
                f"without any additional explanation:\n\n{user}"
            )
            log_key = ui_name
        if log_key not in _hy_mt_logged:
            _hy_mt_logged.add(log_key)
            print(f"olares overlay: Hy-MT2 target from UI: {log_key}", flush=True)
        return [{"role": "user", "content": prompt}]
    
    
    def _with_provider(req, provider: str):
        try:
            req.provider = provider
            return req
        except Exception:
            pass
        if hasattr(req, "model_copy"):
            return req.model_copy(update={"provider": provider})
        return req
    
    
    def patch_translate_fallback(app) -> None:
        import api.routers.dub_translate as dub_translate
    
        cjk = dub_translate.LANG_REQUIRED_SCRIPT.get("zh")
        if cjk:
            for code in ("cmn-Hans", "cmn", "zh-Hans", "zh-CN", "yue-Hans"):
                dub_translate.LANG_REQUIRED_SCRIPT.setdefault(code, cjk)
    
        orig = dub_translate.dub_translate
        if getattr(orig, "_olares_argos_fallback", False):
            return
    
        @wraps(orig)
        async def wrapped(req):
            original = (getattr(req, "provider", None) or "argos").lower()
            if original in ("openai", "llm"):
                original = "argos"
            if not (os.environ.get("TRANSLATE_BASE_URL") or "").strip():
                return await orig(req)
            if "Hy-MT2" in (os.environ.get("TRANSLATE_MODEL") or ""):
                # Hy-MT2 is a translation model, not a glossary/theme LLM.
                try:
                    req.auto_glossary = False
                except Exception:
                    pass
            result = await orig(_with_provider(req, "openai"))
            if not _failed_connect(result):
                return result
            print(
                f"olares overlay: LLM translate failed; falling back to {original}",
                flush=True,
            )
            return await orig(_with_provider(req, original))
    
        wrapped._olares_argos_fallback = True  # type: ignore[attr-defined]
        dub_translate.dub_translate = wrapped
        for route in getattr(app, "routes", []) or []:
            if getattr(route, "path", None) != "/dub/translate":
                continue
            route.endpoint = wrapped
            dep = getattr(route, "dependant", None)
            if dep is not None:
                dep.call = wrapped
        print("olares overlay: LLM translate falls back to original engine on connect errors", flush=True)
