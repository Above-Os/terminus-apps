metadata:
  title: Paperclip
  description: Open-Source-Orchestrierungsplattform für KI-Agenten-Unternehmen.
spec:
  upgradeDescription: |
    Paperclip-Versionsupdate: Upgrade auf v2026.609.0
    Konfigurationsupdate: integrierte Abhängigkeits-Pakete für lokale Agenten hinzufügen

    Highlights:
    - Company Artifacts – Dateien, Medien und Dokumente, die Ihre Agenten erzeugen, sind jetzt erstklassig. Eine neue unternehmensbezogene Artifacts-Seite indiziert jedes Arbeitsprodukt über Issues und Runs, gruppiert sie standardmäßig nach Task-Stack und unterstützt Upload sowie reichhaltige Wiedergabe — einschließlich Video-Artifact-Thumbnails — damit Sie prüfen können, was Ihre Agenten erstellt haben, ohne jedes Issue einzeln zu öffnen. (#7621, #7654, #7667, #7248, @cryppadotta)
    - Collapsible sidebar rail and takeover panes – Die Hauptnavigation kann jetzt zu einer persistierten Leiste mit Hover/Focus-Peek einklappen und gibt kontextbezogenen Seiten — besonders Firmeneinstellungen und Plugin-Routen — deutlich mehr horizontalen Raum, während die globale Navigation einen Klick entfernt bleibt. (#7824, @cryppadotta)
    - Rich issue attachments with video – Issues akzeptieren jetzt Videoanhänge und rendern reichhaltige Inline-Vorschauen, einschließlich eigenständiger PWA-Browsersteuerungen und Inline-Video-Wiedergabe, sodass Screen Recordings und Medien direkt im Thread landen statt als undurchsichtige Downloads. (#7361, #7360, @cryppadotta)
    - Checkbox confirmation interactions – Issue-Thread-Interaktionen können Board oder Nutzer nun über eine strukturierte Checkbox-Payload bitten, eine oder mehrere Optionen zu bestätigen, mit konsistenter Validierung über API, CLI, Plugin-Helfer und UI — und Freitext-„other“-Antworten werden jetzt als richtige Links gerendert. (#7649, @cryppadotta)
    - Information Architecture refresh (experimental) – Eine opt-in visuelle Auffrischung der Projekt- und Agentenflächen macht häufige Workflows leichter scannbar, und Instanz-Einstellungen liegen jetzt unter Firmeneinstellungen, damit die Konfiguration an einem Ort auffindbar ist. (#7543, @scotttong; #7680, @cryppadotta)
    - Automated PR quality and security gates – commitperclip führt jetzt automatisierte Qualitäts- und Sicherheitsgates auf eingehenden PRs aus — Prüfung auf verknüpftes Issue, Testabdeckung, vollständige Vorlage und saubere Lockfile, plus Dedup-Suche — damit Mitwirkende schnelles, konsistentes Feedback bekommen und Maintainer Review-Zeit dort einsetzen, wo sie zählt. Gepaart mit neuer low-trust Review-Containment, die Reviewern unvertrauenswürdiger Inhalte ein eng gefasstes, prompt-injection-resistentes Autoritäts-Preset gibt. (#6469, @brandonburr; #7632, #7530, @cryppadotta)

    Vollständige Release Notes: https://github.com/paperclipai/paperclip/releases/tag/v2026.609.0
  fullDescription: |
    **Erstmalige Admin-Einrichtung**
    Öffnen Sie nach dem ersten Start die Paperclip-URL im Browser, melden Sie sich an oder erstellen Sie ein Konto und wählen Sie dann **Claim this instance** auf dem Setup-Bildschirm, um der erste Admin zu werden.

    **Übersicht**
    Paperclip ist ein Node.js-Server und eine React-UI, die ein Team von KI-Agenten orchestrieren, um ein Unternehmen zu führen. Bringen Sie Ihre eigenen Agenten mit, weisen Sie Ziele zu und verfolgen Sie Arbeit und Kosten Ihrer Agenten von einem Dashboard aus.

    Wenn OpenClaw ein Mitarbeiter ist, ist Paperclip das Unternehmen.

    **Funktionen**
    - Bring Your Own Agent – jeder Agent, jede Runtime, ein Organigramm (OpenClaw, Claude Code, Codex, Cursor)
    - Zielausrichtung – jede Aufgabe lässt sich auf die Unternehmensmission zurückführen
    - Heartbeats – Agenten wachen nach Zeitplan auf, prüfen Arbeit und handeln
    - Kostenkontrolle – monatliche Budgets pro Agent mit automatischer Durchsetzung
    - Multi-Company – eine Bereitstellung, viele Unternehmen mit vollständiger Datenisolation
    - Ticket-System – jedes Gespräch mit vollständiger Tool-Call-Nachverfolgung und Audit-Log
    - Governance – Einstellungen genehmigen, Strategie überschreiben, jeden Agenten pausieren oder beenden
    - Organigramm – Hierarchien, Rollen, Berichtslinien für Ihr Agententeam
    - Mobile Ready – von überall überwachen und verwalten
    - Externes PostgreSQL für Produktionsbereitstellungen
