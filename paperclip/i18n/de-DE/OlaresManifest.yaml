metadata:
  title: Paperclip
  description: Open-Source-Orchestrierungsplattform für KI-Agenten-Unternehmen
spec:
  upgradeDescription: |
    Paperclip wurde auf v2026.916.1 aktualisiert.

    - Einheitliche Connections für KI-Zugangsdaten, gemeinsame Konten und benutzerspezifischen Zugriff hinzugefügt.
    - Skills Store und Skill Studio erweitert; Unternehmens-Skills stehen bei Agent-Ausführungen bereit.
    - Aufgaben im Dialogformat zum Standard gemacht und Unternehmensimport/-export sowie Decisions verbessert.
    - Die Senden-Schaltfläche in Aufgabendialogen und die Behandlung von Datenbankkonflikten korrigiert.

    Olares-Bereitstellung: Umstieg auf das offizielle Paperclip-Image und Aktualisierung der vorinstallierten Umgebung auf brew-base 2026.9.2-cli. Der offizielle Prozesseinstieg bleibt erhalten; eine Startabsicherung schützt Datenbankmigrationen.

    Vor dem Upgrade PostgreSQL, persistente Dateien und Verschlüsselungsschlüssel sichern. Die Upstream-Datenbankmigrationen laufen beim Start und entfernen einige veraltete Einstellungen, darunter `modelProfiles`. Für ein Rollback müssen die passende Datenbank und die Dateien zusammen mit dem alten Image wiederhergestellt werden.

    Versionshinweise: https://github.com/paperclipai/paperclip/releases/tag/v2026.916.1

  fullDescription: |
    **Erstmalige Admin-Einrichtung**
    Öffnen Sie nach dem ersten Start die Paperclip-URL im Browser, melden Sie sich an oder erstellen Sie ein Konto und wählen Sie dann **Claim this instance** auf dem Setup-Bildschirm, um der erste Admin zu werden.

    **Übersicht**
    Paperclip ist ein Node.js-Server und eine React-UI, die ein Team von KI-Agenten orchestrieren, um ein Unternehmen zu führen. Bringen Sie Ihre eigenen Agenten mit, weisen Sie Ziele zu und verfolgen Sie Arbeit und Kosten Ihrer Agenten von einem Dashboard aus.

    Wenn OpenClaw ein Mitarbeiter ist, ist Paperclip das Unternehmen.

    **Funktionen**
    - Bring Your Own Agent – jeder Agent, jede Runtime, ein Organigramm (OpenClaw, Claude Code, Codex, Cursor)
    - Zielausrichtung – jede Aufgabe lässt sich auf die Unternehmensmission zurückführen
    - Heartbeats – Agenten wachen nach Zeitplan auf, prüfen Arbeit und handeln
    - Kostenkontrolle – monatliche Budgets pro Agent mit automatischer Durchsetzung
    - Multi-Company – eine Bereitstellung, viele Unternehmen mit vollständiger Datenisolation
    - Ticket-System – jedes Gespräch mit vollständiger Tool-Call-Nachverfolgung und Audit-Log
    - Governance – Einstellungen genehmigen, Strategie überschreiben, jeden Agenten pausieren oder beenden
    - Organigramm – Hierarchien, Rollen, Berichtslinien für Ihr Agententeam
    - Mobile Ready – von überall überwachen und verwalten
    - Externes PostgreSQL für Produktionsbereitstellungen
