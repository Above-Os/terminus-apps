metadata:
  title: Paperclip
  description: AI エージェント企業向けのオープンソース・オーケストレーションプラットフォーム
spec:
  upgradeDescription: |
    Paperclipをv2026.916.1に更新しました。

    - AI認証情報、共有アカウント、ユーザーごとのアクセスを管理する統合Connectionsを追加しました。
    - Skills StoreとSkill Studioを拡張し、エージェント実行時に会社のスキルを利用できるようにしました。
    - 会話形式のタスクを標準にし、会社のインポート／エクスポートとDecisionsのワークフローを改善しました。
    - タスクの会話画面の送信ボタンとデータベース競合処理を修正しました。

    Olaresでのデプロイ：Paperclip公式イメージに切り替え、プリインストール環境をbrew-base 2026.9.2-cliに更新しました。公式のプロセスエントリーポイントを維持し、データベース移行中の起動保護を追加しました。

    アップグレード前にPostgreSQL、永続ファイル、暗号化キーをバックアップしてください。上流のデータベース移行は起動時に実行され、`modelProfiles`などの廃止された設定を削除します。ロールバック時は、旧イメージとともに対応するデータベースとファイルを復元してください。

    リリースノート：https://github.com/paperclipai/paperclip/releases/tag/v2026.916.1

  fullDescription: |
    **初回管理者セットアップ**
    初回起動後、ブラウザで Paperclip URL を開き、サインインまたはアカウント作成のうえ、セットアップ画面で **Claim this instance** を選んで最初の管理者になってください。

    **概要**
    Paperclip は、ビジネスを運営する AI エージェントチームをオーケストレーションする Node.js サーバーと React UI です。独自のエージェントを持ち込み、目標を割り当て、1 つのダッシュボードからエージェントの作業とコストを追跡します。

    OpenClaw が従業員なら、Paperclip は会社です。

    **機能**
    - Bring Your Own Agent — 任意のエージェント、任意のランタイム、1 つの組織図（OpenClaw、Claude Code、Codex、Cursor）
    - 目標アラインメント — すべてのタスクが会社のミッションに遡れる
    - Heartbeats — エージェントがスケジュールで起床し、作業を確認して行動
    - コスト制御 — エージェントごとの月次予算と自動執行
    - Multi-Company — 1 つのデプロイで多数の会社、完全なデータ分離
    - チケットシステム — 完全なツールコール追跡と監査ログ付きで全会話を追跡
    - ガバナンス — 採用承認、戦略の上書き、任意のエージェントの一時停止または終了
    - 組織図 — エージェントチームの階層、役割、報告ライン
    - モバイル対応 — どこからでも監視・管理
    - 本番向け外部 PostgreSQL サポート
