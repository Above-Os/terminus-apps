metadata:
  title: Paperclip
  description: AI エージェント企業向けのオープンソース・オーケストレーションプラットフォーム
spec:
  upgradeDescription: |
    Paperclip バージョン更新: v2026.609.0 へアップグレード
    設定更新: ローカルエージェント向け組み込み依存パッケージを追加

    ハイライト:
    - Company Artifacts — エージェントが生成するファイル・メディア・文書がファーストクラスに。会社スコープの新しい Artifacts ページが issue と run をまたぐすべての成果物を索引化し、既定でタスクスタック別にグループ化し、アップロードとリッチ再生（動画アーティファクトのサムネイル含む）に対応。issue を一つずつ開かずに成果を確認できます。（#7621, #7654, #7667, #7248, @cryppadotta）
    - Collapsible sidebar rail and takeover panes — プライマリナビを永続レールへ折りたたみ、ホバー／フォーカスでピーク可能に。会社設定やプラグインルートなどの文脈ページに横幅を大きく確保しつつ、グローバルナビはワンクリック先に残します。（#7824, @cryppadotta）
    - Rich issue attachments with video — issue が動画添付を受け付け、スタンドアロン PWA ブラウザコントロールやインライン再生を含むリッチなインラインプレビューを描画。画面録画やメディアが不透明なダウンロードではなくスレッドに直接載ります。（#7361, #7360, @cryppadotta）
    - Checkbox confirmation interactions — issue スレッドのやり取りが、構造化チェックボックスペイロードでボードやユーザーに 1 つ以上の選択肢の確認を求められ、API・CLI・プラグインヘルパー・UI で一貫した検証。自由記述の「other」回答も適切なリンクとして描画。（#7649, @cryppadotta）
    - Information Architecture refresh（実験的）— プロジェクト／エージェント面のオプトイン視覚刷新で高頻度ワークフローをスキャンしやすくし、インスタンス設定を会社設定配下に移して設定を一か所から発見可能に。（#7543, @scotttong; #7680, @cryppadotta）
    - Automated PR quality and security gates — commitperclip が着信 PR に品質・セキュリティゲートを自動実行（リンク済み issue、テストカバレッジ、完全なテンプレート、クリーンな lockfile、重複検索チェック）し、貢献者に迅速で一貫したフィードバックを、メンテナーには重要なレビュー時間を。信頼度の低いレビュー封じ込めと組み合わせ、信頼できない内容のレビュアーに狭くスコープされた prompt-injection 耐性のある権限プリセットを付与。（#6469, @brandonburr; #7632, #7530, @cryppadotta）

    完全なリリースノート: https://github.com/paperclipai/paperclip/releases/tag/v2026.609.0
  fullDescription: |
    **初回管理者セットアップ**
    初回起動後、ブラウザで Paperclip URL を開き、サインインまたはアカウント作成のうえ、セットアップ画面で **Claim this instance** を選んで最初の管理者になってください。

    **概要**
    Paperclip は、ビジネスを運営する AI エージェントチームをオーケストレーションする Node.js サーバーと React UI です。独自のエージェントを持ち込み、目標を割り当て、1 つのダッシュボードからエージェントの作業とコストを追跡します。

    OpenClaw が従業員なら、Paperclip は会社です。

    **機能**
    - Bring Your Own Agent — 任意のエージェント、任意のランタイム、1 つの組織図（OpenClaw、Claude Code、Codex、Cursor）
    - 目標アラインメント — すべてのタスクが会社のミッションに遡れる
    - Heartbeats — エージェントがスケジュールで起床し、作業を確認して行動
    - コスト制御 — エージェントごとの月次予算と自動執行
    - Multi-Company — 1 つのデプロイで多数の会社、完全なデータ分離
    - チケットシステム — 完全なツールコール追跡と監査ログ付きで全会話を追跡
    - ガバナンス — 採用承認、戦略の上書き、任意のエージェントの一時停止または終了
    - 組織図 — エージェントチームの階層、役割、報告ライン
    - モバイル対応 — どこからでも監視・管理
    - 本番向け外部 PostgreSQL サポート
