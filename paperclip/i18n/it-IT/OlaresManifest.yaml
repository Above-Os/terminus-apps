metadata:
  title: Paperclip
  description: Piattaforma di orchestrazione open source per aziende di agenti AI.
spec:
  upgradeDescription: |
    Aggiornamento versione Paperclip: upgrade a v2026.609.0
    Aggiornamento config: aggiungere pacchetti di dipendenze integrate per agenti locali

    Highlight:
    - Company Artifacts — File, media e documenti prodotti dagli agenti sono ora first-class. Una nuova pagina Artifacts a livello aziendale indicizza ogni prodotto di lavoro tra issue e run, li raggruppa per default per task stack e supporta upload e riproduzione ricca — incluse miniature degli artifact video — così puoi ispezionare ciò che gli agenti hanno creato senza aprire ogni issue uno per uno. (#7621, #7654, #7667, #7248, @cryppadotta)
    - Collapsible sidebar rail and takeover panes — La navigazione primaria può ora ridursi a una rail persistita con peek al passaggio/focus, dando alle pagine contestuali — soprattutto impostazioni azienda e route dei plugin — molto più spazio orizzontale tenendo la navigazione globale a un clic. (#7824, @cryppadotta)
    - Rich issue attachments with video — Gli issue ora accettano allegati video e renderizzano anteprime inline ricche, inclusi controlli browser PWA autonomi e riproduzione video inline, così screen recording e media arrivano direttamente nel thread invece che come download opachi. (#7361, #7360, @cryppadotta)
    - Checkbox confirmation interactions — Le interazioni del thread degli issue possono ora chiedere al board o all'utente di confermare una o più opzioni tramite un payload checkbox strutturato, con validazione coerente su API, CLI, helper dei plugin e UI — e le risposte free-text «other» vengono ora renderizzate come link corretti. (#7649, @cryppadotta)
    - Information Architecture refresh (experimental) — Un refresh visivo opt-in delle superfici progetto e agente rende più scansionabili i workflow ad alta frequenza, e le impostazioni dell'istanza vivono ora sotto le impostazioni azienda così la configurazione si scopre da un unico posto. (#7543, @scotttong; #7680, @cryppadotta)
    - Automated PR quality and security gates — commitperclip ora esegue gate automatici di qualità e sicurezza sui PR in arrivo — controllando issue collegato, copertura test, template completo e lockfile pulito, più un controllo di dedup-search — così i contributor ricevono feedback rapido e coerente e i maintainer usano il tempo di review dove conta. Affiancato a una nuova low-trust review containment che dà ai reviewer di contenuti non fidati un preset di autorità a ambito ristretto e resistente al prompt-injection. (#6469, @brandonburr; #7632, #7530, @cryppadotta)

    Note di rilascio complete: https://github.com/paperclipai/paperclip/releases/tag/v2026.609.0
  fullDescription: |
    **Configurazione iniziale dell'admin**
    Dopo il primo avvio, apri l'URL di Paperclip nel browser, accedi o crea un account, poi scegli **Claim this instance** nella schermata di setup per diventare il primo admin.

    **Panoramica**
    Paperclip è un server Node.js e una UI React che orchestrano un team di agenti AI per gestire un'azienda. Porta i tuoi agenti, assegna obiettivi e traccia il lavoro e i costi degli agenti da un'unica dashboard.

    Se OpenClaw è un dipendente, Paperclip è l'azienda.

    **Funzionalità**
    - Bring Your Own Agent — qualsiasi agente, qualsiasi runtime, un organigramma (OpenClaw, Claude Code, Codex, Cursor)
    - Allineamento agli obiettivi — ogni task risale alla missione aziendale
    - Heartbeats — gli agenti si attivano secondo un programma, controllano il lavoro e agiscono
    - Controllo dei costi — budget mensili per agente con enforcement automatico
    - Multi-Company — un deployment, molte aziende con completo isolamento dei dati
    - Sistema ticket — ogni conversazione tracciata con full tool-call tracing e audit log
    - Governance — approvare assunzioni, sovrascrivere la strategia, mettere in pausa o terminare qualsiasi agente
    - Organigramma — gerarchie, ruoli, linee di reporting per il team di agenti
    - Mobile Ready — monitora e gestisci da qualsiasi luogo
    - Supporto PostgreSQL esterno per i deployment di produzione
