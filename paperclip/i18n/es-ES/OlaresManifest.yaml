metadata:
  title: Paperclip
  description: Plataforma de orquestación de código abierto para empresas de agentes de IA
spec:
  upgradeDescription: |
    Paperclip se ha actualizado a v2026.916.1.

    - Se han añadido Connections unificadas para credenciales de IA, cuentas compartidas y acceso por usuario.
    - Se han ampliado Skills Store y Skill Studio; las habilidades de la empresa están disponibles durante las ejecuciones de los agentes.
    - Las tareas conversacionales son ahora la opción predeterminada y se han mejorado la importación/exportación de empresas y los flujos de Decisions.
    - Se han corregido el botón de envío de las conversaciones de tareas y la gestión de conflictos de base de datos.

    Despliegue en Olares: se utiliza la imagen oficial de Paperclip y el entorno preinstalado se ha actualizado a brew-base 2026.9.2-cli. Se conserva el punto de entrada oficial del proceso y se protege el arranque durante las migraciones de base de datos.

    Antes de actualizar, haga una copia de seguridad de PostgreSQL, los archivos persistentes y las claves de cifrado. Las migraciones de base de datos del proyecto original se ejecutan al arrancar y eliminan algunos ajustes obsoletos, incluido `modelProfiles`. Para volver a la versión anterior, restaure la base de datos y los archivos correspondientes junto con la imagen antigua.

    Notas de la versión: https://github.com/paperclipai/paperclip/releases/tag/v2026.916.1

  fullDescription: |
    **Configuración inicial del administrador**
    Tras el primer arranque, abra la URL de Paperclip en el navegador, inicie sesión o cree una cuenta y, a continuación, elija **Claim this instance** en la pantalla de configuración para convertirse en el primer administrador.

    **Resumen**
    Paperclip es un servidor Node.js y una UI React que orquestan un equipo de agentes de IA para dirigir un negocio. Traiga sus propios agentes, asigne objetivos y rastree el trabajo y los costes de sus agentes desde un solo panel.

    Si OpenClaw es un empleado, Paperclip es la empresa.

    **Características**
    - Bring Your Own Agent — cualquier agente, cualquier runtime, un organigrama (OpenClaw, Claude Code, Codex, Cursor)
    - Alineación de objetivos — cada tarea se remonta a la misión de la empresa
    - Heartbeats — los agentes se despiertan según un horario, comprueban el trabajo y actúan
    - Control de costes — presupuestos mensuales por agente con aplicación automática
    - Multi-Company — un despliegue, muchas empresas con aislamiento completo de datos
    - Sistema de tickets — cada conversación trazada con seguimiento completo de tool-calls y registro de auditoría
    - Gobernanza — aprobar contrataciones, anular la estrategia, pausar o terminar cualquier agente
    - Organigrama — jerarquías, roles y líneas de reporting para su equipo de agentes
    - Listo para móvil — monitorice y gestione desde cualquier lugar
    - Soporte de PostgreSQL externo para despliegues de producción
