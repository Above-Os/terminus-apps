metadata:
  title: Paperclip
  description: Plataforma de orquestación de código abierto para empresas de agentes de IA.
spec:
  upgradeDescription: |
    Actualización de versión de Paperclip: upgrade a v2026.609.0
    Actualización de configuración: añadir paquetes de dependencias integrados para agentes locales

    Destacados:
    - Company Artifacts — Los archivos, medios y documentos que producen sus agentes son ahora de primera clase. Una nueva página de Artifacts con ámbito de empresa indexa cada producto de trabajo a través de issues y runs, los agrupa por pila de tareas por defecto y admite subida y reproducción enriquecida — incluidas miniaturas de artefactos de vídeo — para inspeccionar lo que hicieron sus agentes sin abrir cada issue uno a uno. (#7621, #7654, #7667, #7248, @cryppadotta)
    - Collapsible sidebar rail and takeover panes — La navegación principal ahora puede colapsarse a un rail persistido con peek al pasar el ratón/enfocar, dando a las páginas contextuales — especialmente ajustes de empresa y rutas de plugins — mucho más espacio horizontal mientras la navegación global queda a un clic. (#7824, @cryppadotta)
    - Rich issue attachments with video — Los issues ahora aceptan adjuntos de vídeo y renderizan vistas previas enriquecidas en línea, incluidos controles de navegador PWA independientes y reproducción de vídeo en línea, de modo que las grabaciones de pantalla y los medios llegan directamente al hilo en lugar de como descargas opacas. (#7361, #7360, @cryppadotta)
    - Checkbox confirmation interactions — Las interacciones del hilo de issues pueden ahora pedir al board o al usuario que confirme una o más opciones mediante una carga útil de casillas estructurada, con validación coherente en API, CLI, helpers de plugins y UI — y las respuestas de texto libre «other» se renderizan ahora como enlaces adecuados. (#7649, @cryppadotta)
    - Information Architecture refresh (experimental) — Una actualización visual opt-in de las superficies de proyecto y agente facilita el escaneo de flujos de alta frecuencia, y los ajustes de instancia viven ahora bajo los ajustes de empresa para que la configuración se descubra desde un solo lugar. (#7543, @scotttong; #7680, @cryppadotta)
    - Automated PR quality and security gates — commitperclip ahora ejecuta puertas automáticas de calidad y seguridad en los PR entrantes — comprobando issue vinculado, cobertura de tests, plantilla completa y lockfile limpio, más una comprobación de búsqueda de deduplicación — para que los colaboradores reciban feedback rápido y coherente y los mantenedores dediquen el tiempo de revisión donde importa. Emparejado con una nueva contención de revisión de baja confianza que da a los revisores de contenido no confiable un preset de autoridad de alcance estrecho y resistente a prompt-injection. (#6469, @brandonburr; #7632, #7530, @cryppadotta)

    Notas de la versión completas: https://github.com/paperclipai/paperclip/releases/tag/v2026.609.0
  fullDescription: |
    **Configuración inicial del administrador**
    Tras el primer arranque, abra la URL de Paperclip en el navegador, inicie sesión o cree una cuenta y, a continuación, elija **Claim this instance** en la pantalla de configuración para convertirse en el primer administrador.

    **Resumen**
    Paperclip es un servidor Node.js y una UI React que orquestan un equipo de agentes de IA para dirigir un negocio. Traiga sus propios agentes, asigne objetivos y rastree el trabajo y los costes de sus agentes desde un solo panel.

    Si OpenClaw es un empleado, Paperclip es la empresa.

    **Características**
    - Bring Your Own Agent — cualquier agente, cualquier runtime, un organigrama (OpenClaw, Claude Code, Codex, Cursor)
    - Alineación de objetivos — cada tarea se remonta a la misión de la empresa
    - Heartbeats — los agentes se despiertan según un horario, comprueban el trabajo y actúan
    - Control de costes — presupuestos mensuales por agente con aplicación automática
    - Multi-Company — un despliegue, muchas empresas con aislamiento completo de datos
    - Sistema de tickets — cada conversación trazada con seguimiento completo de tool-calls y registro de auditoría
    - Gobernanza — aprobar contrataciones, anular la estrategia, pausar o terminar cualquier agente
    - Organigrama — jerarquías, roles y líneas de reporting para su equipo de agentes
    - Listo para móvil — monitorice y gestione desde cualquier lugar
    - Soporte de PostgreSQL externo para despliegues de producción
