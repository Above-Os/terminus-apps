metadata:
  title: Paperclip
  description: "Plateforme d'orchestration open source pour les entreprises d'agents IA."
spec:
  upgradeDescription: |
    Mise à jour de version Paperclip : upgrade vers v2026.609.0
    Mise à jour de config : ajouter des paquets de dépendances intégrés pour les agents locaux

    Points forts :
    - Company Artifacts — Les fichiers, médias et documents produits par vos agents sont désormais de première classe. Une nouvelle page Artifacts au périmètre entreprise indexe chaque produit de travail à travers issues et runs, les regroupe par défaut par pile de tâches, et prend en charge le téléversement et une lecture enrichie — y compris les miniatures d'artefacts vidéo — pour inspecter ce que vos agents ont créé sans ouvrir chaque issue une par une. (#7621, #7654, #7667, #7248, @cryppadotta)
    - Collapsible sidebar rail and takeover panes — La navigation principale peut désormais se réduire en un rail persisté avec aperçu au survol/focus, donnant aux pages contextuelles — surtout les paramètres entreprise et les routes de plugins — bien plus d'espace horizontal tout en gardant la navigation globale à un clic. (#7824, @cryppadotta)
    - Rich issue attachments with video — Les issues acceptent désormais les pièces jointes vidéo et rendent de riches aperçus en ligne, y compris des contrôles de navigateur PWA autonomes et la lecture vidéo en ligne, afin que les enregistrements d'écran et les médias atterrissent directement dans le fil plutôt que comme téléchargements opaques. (#7361, #7360, @cryppadotta)
    - Checkbox confirmation interactions — Les interactions du fil d'issues peuvent désormais demander au board ou à l'utilisateur de confirmer une ou plusieurs options via une charge utile de cases structurée, avec une validation cohérente sur API, CLI, helpers de plugins et UI — et les réponses texte libre « other » sont désormais rendues comme de vrais liens. (#7649, @cryppadotta)
    - Information Architecture refresh (experimental) — Un rafraîchissement visuel opt-in des surfaces projet et agent rend les workflows à haute fréquence plus faciles à parcourir, et les paramètres d'instance vivent désormais sous les paramètres entreprise pour que la configuration soit découvrable depuis un seul endroit. (#7543, @scotttong ; #7680, @cryppadotta)
    - Automated PR quality and security gates — commitperclip exécute désormais des portes automatisées de qualité et de sécurité sur les PR entrantes — vérification d'une issue liée, de la couverture de tests, d'un modèle complet et d'un lockfile propre, plus une vérification de recherche de déduplication — pour que les contributeurs reçoivent un feedback rapide et cohérent et que les mainteneurs consacrent le temps de revue là où cela compte. Associé à une nouvelle containment de revue low-trust qui donne aux relecteurs de contenu non fiable un preset d'autorité à périmètre étroit et résistant au prompt-injection. (#6469, @brandonburr ; #7632, #7530, @cryppadotta)

    Notes de version complètes : https://github.com/paperclipai/paperclip/releases/tag/v2026.609.0
  fullDescription: |
    **Configuration admin initiale**
    Après le premier démarrage, ouvrez l'URL Paperclip dans votre navigateur, connectez-vous ou créez un compte, puis choisissez **Claim this instance** sur l'écran de configuration pour devenir le premier administrateur.

    **Aperçu**
    Paperclip est un serveur Node.js et une UI React qui orchestrent une équipe d'agents IA pour diriger une entreprise. Apportez vos propres agents, assignez des objectifs, et suivez le travail et les coûts de vos agents depuis un seul tableau de bord.

    Si OpenClaw est un employé, Paperclip est l'entreprise.

    **Fonctionnalités**
    - Bring Your Own Agent — n'importe quel agent, n'importe quel runtime, un organigramme (OpenClaw, Claude Code, Codex, Cursor)
    - Alignement des objectifs — chaque tâche remonte à la mission de l'entreprise
    - Heartbeats — les agents se réveillent selon un planning, vérifient le travail et agissent
    - Contrôle des coûts — budgets mensuels par agent avec application automatique
    - Multi-Company — un déploiement, de nombreuses entreprises avec isolation complète des données
    - Système de tickets — chaque conversation tracée avec suivi complet des appels d'outils et journal d'audit
    - Gouvernance — approuver les embauches, outrepasser la stratégie, mettre en pause ou terminer n'importe quel agent
    - Organigramme — hiérarchies, rôles, lignes de reporting pour votre équipe d'agents
    - Mobile Ready — surveillez et gérez de n'importe où
    - Prise en charge de PostgreSQL externe pour les déploiements de production
