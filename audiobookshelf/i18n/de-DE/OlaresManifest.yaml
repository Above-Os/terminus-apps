metadata:
  title: AudioBookShelf
  description: Selbst gehosteter Hörbuch- und Podcast-Server.
spec:
  fullDescription: |
    Audiobookshelf ist ein selbst gehosteter Hörbuch- und Podcast-Server.

    **Funktionen**
    - Vollständig Open Source, inklusive Android- und iOS-App (Beta)
    - Alle Audioformate on-the-fly streamen
    - Podcasts suchen und hinzufügen, Episoden herunterladen mit Auto-Download
    - Mehrbenutzerunterstützung mit individuellen Berechtigungen
    - Fortschritt pro Benutzer speichern und geräteübergreifend synchronisieren
    - Erkennt Bibliotheksaktualisierungen automatisch, kein erneutes Scannen nötig
    - Bücher und Podcasts per Drag-and-Drop-Ordnern massenhaft hochladen
    - Metadaten sichern + automatische tägliche Backups
    - Progressive Web App (PWA)
    - Chromecast-Unterstützung in Web- und Android-App
    - Metadaten und Cover von mehreren Quellen abrufen
    - Kapitel-Editor und Kapitel-Lookup (über Audnexus API)
    - Audiodateien zu einer einzelnen m4b zusammenführen
    - Metadaten und Coverbild in Audiodateien einbetten
    - Grundlegende E-Book-Unterstützung und E-Reader
        - Epub, pdf, cbr, cbz
        - E-Book an Gerät senden (z. B. Kindle)
    - Offene RSS-Feeds für Podcasts und Hörbücher
  upgradeDescription: |
    App auf v2.32.1 aktualisieren. Änderungen seit v2.25.1:

    **Wichtige Änderungen:**
    - Neues JWT-Authentifizierungssystem mit Refresh-Tokens (v2.26.0)
    - Verbesserungen am Kapitel-Editor mit Massenimport von Kapiteln
    - Buchcover-Suche jetzt asynchron mit Option „Best“ (Audible + Google + FantLab)
    - HLS-Transcoding-Fix für AC3/EAC3-Codecs
    - Unterstützung für CORS-Origin-Whitelist
    - Sepia-Theme für den Epub-E-Reader
    - Upload-Fortschrittsanzeige
    - Standard-Token-Ablauf verlängert (Refresh 30d, Access 1h)
    - OIDC-Auto-Redirect per Query-Parameter
    - Mehrere Server-Crash-Fixes (Audible-Provider, FantLab-Timeout, Transcode)
    - Diverse Verbesserungen bei Metadaten-Matching und UI/UX

    Vollständige Release Notes: https://github.com/advplyr/audiobookshelf/releases/tag/v2.32.1
