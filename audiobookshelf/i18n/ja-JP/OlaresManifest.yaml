metadata:
  title: AudioBookShelf
  description: セルフホスト型のオーディオブック＆ポッドキャストサーバー。
spec:
  fullDescription: |
    Audiobookshelf はセルフホスト型のオーディオブックおよびポッドキャストサーバーです。

    **機能**
    - Android・iOS アプリ（ベータ）を含む完全オープンソース
    - すべての音声フォーマットをオンザフライでストリーム
    - ポッドキャストを検索・追加し、エピソードを自動ダウンロード
    - カスタム権限付きマルチユーザー対応
    - ユーザーごとの進捗を保持し、デバイス間で同期
    - ライブラリ更新を自動検出、再スキャン不要
    - フォルダのドラッグ＆ドロップで書籍・ポッドキャストを一括アップロード
    - メタデータのバックアップ＋自動日次バックアップ
    - Progressive Web App (PWA)
    - Web アプリと Android アプリで Chromecast 対応
    - 複数ソースからメタデータとカバーアートを取得
    - チャプターエディタとチャプター検索（Audnexus API）
    - 音声ファイルを単一の m4b に結合
    - メタデータとカバー画像を音声ファイルに埋め込み
    - 基本的な電子書籍サポートとリーダー
        - Epub、pdf、cbr、cbz
        - 電子書籍をデバイスへ送信（例：Kindle）
    - ポッドキャストとオーディオブック用のオープン RSS フィード
  upgradeDescription: |
    アプリを v2.32.1 にアップグレード。v2.25.1 からの変更点：

    **主な変更:**
    - リフレッシュトークン付きの新しい JWT 認証システム（v2.26.0）
    - チャプター一括インポート対応などチャプターエディタの強化
    - 書籍カバー検索が非同期化、「Best」オプション追加（Audible + Google + FantLab）
    - AC3/EAC3 コーデックの HLS トランスコード修正
    - CORS オリジンホワイトリスト対応
    - Epub リーダーのセピアテーマ
    - アップロード進捗インジケータ
    - デフォルトトークン有効期限の延長（refresh 30日、access 1時間）
    - クエリパラメータによる OIDC 自動リダイレクト
    - 複数のサーバークラッシュ修正（Audible プロバイダ、FantLab タイムアウト、トランスコード）
    - メタデータマッチングと UI/UX の各種改善

    完全なリリースノート: https://github.com/advplyr/audiobookshelf/releases/tag/v2.32.1
