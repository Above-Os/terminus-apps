metadata:
  title: Hunyuan3D
  description: Dalle immagini ad asset 3D ad alta fedeltà con materiale PBR pronto per la produzione
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Verrà installato un solo servizio nell'intero sistema Olares. Tuttavia, ogni utente deve comunque installare una voce desktop per accedere e usare il servizio installato dall'Olares Admin.
    
    **PANORAMICA**
    Tencent Hunyuan3D-2.1 è un sistema scalabile di creazione di asset 3D che avanza lo stato dell'arte nella generazione 3D
    
    Funzionalità chiave
    Generazione di asset 3D ad alta risoluzione da immagine
    
    Generazione ad alta precisione
    - Strutture geometriche nitide, colori di texture ricchi, supporto per la generazione di materiali PBR, ottenendo effetti di illuminazione quasi realistici.
    
    Usalo direttamente in Blender con il Blender Addon
