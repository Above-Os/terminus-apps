metadata:
  title: Hunyuan3D
  description: Von Bildern zu hochgetreuen 3D-Assets mit produktionsreifem PBR-Material.
spec:
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine gemeinsame App. Im gesamten Olares-System wird nur ein Dienst installiert. Jeder Nutzer muss jedoch trotzdem einen Desktop-Eintrag installieren, um auf den vom Olares Admin installierten Dienst zuzugreifen und ihn zu nutzen.
    
    **ÜBERBLICK**
    Tencent Hunyuan3D-2.1 ist ein skalierbares System zur Erstellung von 3D-Assets, das den Stand der Technik bei der 3D-Generierung vorantreibt
    
    Wichtige Funktionen
    Hochauflösende 3D-Asset-Generierung aus Bildern
    
    Hochpräzise Generierung
    - Scharfe geometrische Strukturen, reichhaltige Texturfarben, Unterstützung der PBR-Materialgenerierung, nahezu realistische Beleuchtungseffekte.
    
    Direkt in Ihrem Blender mit dem Blender-Addon nutzen
