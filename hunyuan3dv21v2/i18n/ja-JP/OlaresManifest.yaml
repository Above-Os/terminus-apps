metadata:
  title: Hunyuan3D
  description: 画像から本番品質の PBR マテリアル付き高忠実度 3D アセットへ
spec:
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares システム全体でインストールされるサービスは 1 つだけです。ただし、各ユーザーは Olares Admin がインストールしたサービスにアクセスして使用するために、デスクトップエントリをインストールする必要があります。
    
    **概要**
    Tencent Hunyuan3D-2.1 は、最先端の 3D 生成を推進するスケーラブルな 3D アセット作成システムです
    
    主な機能
    画像からの高解像度 3D アセット生成
    
    高精度生成
    - シャープな幾何構造、豊かなテクスチャカラー、PBR マテリアル生成対応、ほぼリアルな照明効果を実現。
    
    Blender Addon で Blender から直接利用
