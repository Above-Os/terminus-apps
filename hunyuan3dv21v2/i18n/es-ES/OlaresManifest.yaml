metadata:
  title: Hunyuan3D
  description: De imágenes a assets 3D de alta fidelidad con material PBR listo para producción.
spec:
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Solo se instalará un servicio en todo el sistema Olares. Sin embargo, cada usuario debe instalar una entrada de escritorio para acceder y usar el servicio instalado por el Olares Admin.
    
    **DESCRIPCIÓN GENERAL**
    Tencent Hunyuan3D-2.1 es un sistema escalable de creación de assets 3D que avanza el estado del arte en generación 3D
    
    Funciones clave
    Generación de assets 3D de alta resolución a partir de imagen
    
    Generación de alta precisión
    - Estructuras geométricas nítidas, colores de textura ricos, soporte para generación de material PBR, logrando efectos de iluminación casi realistas.
    
    Úsalo directamente en tu Blender con el Blender Addon
