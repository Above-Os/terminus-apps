metadata:
  title: Hunyuan3D
  description: Des images aux assets 3D haute fidélité avec matériau PBR prêt pour la production.
spec:
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Un seul service sera installé sur l'ensemble du système Olares. Cependant, chaque utilisateur doit tout de même installer une entrée bureau pour accéder et utiliser le service installé par l'Olares Admin.
    
    **APERÇU**
    Tencent Hunyuan3D-2.1 est un système évolutif de création d'assets 3D qui fait progresser l'état de l'art de la génération 3D
    
    Fonctionnalités clés
    Génération d'assets 3D haute résolution à partir d'une image
    
    Génération haute précision
    - Structures géométriques nettes, couleurs de texture riches, prise en charge de la génération de matériaux PBR, pour des effets d'éclairage quasi réalistes.
    
    Utilisez-le directement dans Blender avec le Blender Addon
