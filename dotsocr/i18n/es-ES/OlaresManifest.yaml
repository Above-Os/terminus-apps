metadata:
  title: dots.ocr
  description: "Reconocimiento multilingüe de texto en documentos con análisis del diseño"

spec:
  upgradeDescription: |
    v1.0.48: Se añade compatibilidad con GPU Intel dedicadas mediante el motor llama.cpp SYCL, con la misma API OCR y el mismo modelo que el paquete NVIDIA.

  fullDescription: |
    dots.ocr extrae texto de imágenes de documentos y páginas PDF e interpreta el diseño de la página y el orden de lectura. Su modelo multilingüe reconoce texto, tablas y fórmulas para convertir las páginas en contenido reutilizable.

    Esta aplicación ofrece la versión Q8 de dots.ocr a las aplicaciones Olares compatibles. Admite GPU NVIDIA y GPU Intel dedicadas. Los diseños complejos, las tablas y las fórmulas pueden necesitar revisión manual.
