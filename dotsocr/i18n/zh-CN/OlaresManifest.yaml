metadata:
  title: dots.ocr
  description: "支持版面理解的多语言文档文字识别"

spec:
  upgradeDescription: |
    v1.0.48：新增 Intel 独立显卡支持，使用 SYCL llama.cpp 引擎，与 NVIDIA 版本使用相同的 OCR API 和模型。
  fullDescription: |
    dots.ocr 从文档图像和 PDF 页面中提取文字，同时分析页面布局与阅读顺序。其多语言模型可识别文字、表格和公式，帮助将文档页面转换为可复用的内容。

    本应用为兼容的 Olares 应用提供 dots.ocr 的 Q8 版本，支持 NVIDIA GPU 和 Intel 独立显卡。复杂版面、表格和公式的识别结果可能需要人工核对。
