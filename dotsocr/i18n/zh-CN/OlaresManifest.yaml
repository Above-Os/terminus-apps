metadata:
  title: dots.ocr
  description: "dots.ocr 文档 OCR（GGUF Q8）：llm-init + OCRAdapter + llama.cpp（仅 CUDA）"

spec:
  fullDescription: |
    **dots.ocr** 多语文档 OCR，以 GGUF **Q8** 在 CUDA 上通过 llama.cpp 提供服务。

    **拓扑**
    客户端 → llm-init:8090 → ocradapter:8080 → llamacpp:8081（Redis 使用 Olares 中间件）。

    **模型（仅 Q8）** 来自 [ggml-org/dots.ocr-GGUF](https://huggingface.co/ggml-org/dots.ocr-GGUF)：
    只下载 `dots.ocr-Q8_0.gguf` 与 `mmproj-dots.ocr-Q8_0.gguf`（同仓 F16 不下载）。

    **加速器：** 仅 CUDA（`nvidia` / `nvidia-gb10`）。
