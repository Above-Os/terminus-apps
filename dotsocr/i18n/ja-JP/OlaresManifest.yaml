metadata:
  title: dots.ocr
  description: "レイアウトを理解する多言語の文書文字認識"

spec:
  upgradeDescription: |
    v1.0.48: SYCL llama.cpp エンジンによる Intel ディスクリート GPU 対応を追加し、NVIDIA パッケージと同じ OCR API とモデルを使用します。

  fullDescription: |
    dots.ocrは、ページのレイアウトと読み順を解析しながら、文書画像やPDFページからテキストを抽出します。多言語モデルが文字、表、数式を認識し、文書ページを再利用できるコンテンツに変換します。

    このアプリは、dots.ocrのQ8版を対応するOlaresアプリに提供します。NVIDIA GPU と Intel ディスクリート GPU に対応します。複雑なレイアウト、表、数式の認識結果は、手作業での確認が必要になる場合があります。
