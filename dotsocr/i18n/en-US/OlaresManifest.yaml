metadata:
  title: dots.ocr
  description: "Multilingual document text recognition with layout understanding"

spec:
  upgradeDescription: |
    v1.0.48: Add Intel discrete GPU support with the SYCL llama.cpp engine and the same OCR API and model as the NVIDIA package.
  fullDescription: |
    dots.ocr extracts text from document images and PDF pages while interpreting page layout and reading order. Its multilingual model recognizes text, tables, and formulas to help turn document pages into reusable content.

    This app provides the Q8 version of dots.ocr to compatible Olares applications. It supports NVIDIA GPUs and Intel discrete GPUs. Complex layouts, tables, and formulas may need manual review.
