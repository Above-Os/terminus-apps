metadata:
  title: dots.ocr
  description: "dots.ocr document OCR (GGUF Q8) via llm-init + OCRAdapter + llama.cpp (CUDA)"

spec:
  fullDescription: |
    **dots.ocr** multilingual document OCR, served as GGUF **Q8** on CUDA via llama.cpp.

    **Stack**
    Client → llm-init:8090 → ocradapter:8080 → llamacpp:8081 (+ Olares Redis middleware).

    **Model (Q8 only)** from [ggml-org/dots.ocr-GGUF](https://huggingface.co/ggml-org/dots.ocr-GGUF):
    `dots.ocr-Q8_0.gguf` + `mmproj-dots.ocr-Q8_0.gguf` (F16 not downloaded).

    **Accelerator:** CUDA only (`nvidia` / `nvidia-gb10`).
