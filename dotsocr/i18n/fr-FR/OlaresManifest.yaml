metadata:
  title: dots.ocr
  description: "Reconnaissance multilingue du texte de documents avec analyse de la mise en page"

spec:
  upgradeDescription: |
    v1.0.46: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    dots.ocr extrait le texte d'images de documents et de pages PDF en analysant la mise en page et l'ordre de lecture. Son modèle multilingue reconnaît le texte, les tableaux et les formules pour transformer les pages en contenu réutilisable.

    Cette application fournit la version Q8 de dots.ocr aux applications Olares compatibles. Elle nécessite un GPU NVIDIA pris en charge. Les mises en page complexes, les tableaux et les formules peuvent nécessiter une vérification manuelle.
