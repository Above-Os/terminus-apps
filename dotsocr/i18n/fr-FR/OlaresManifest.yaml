metadata:
  title: dots.ocr
  description: "Reconnaissance multilingue du texte de documents avec analyse de la mise en page"

spec:
  upgradeDescription: |
    v1.0.48 : ajout de la prise en charge des GPU Intel dédiés avec le moteur llama.cpp SYCL et les mêmes API OCR et modèle que le paquet NVIDIA.

  fullDescription: |
    dots.ocr extrait le texte d'images de documents et de pages PDF en analysant la mise en page et l'ordre de lecture. Son modèle multilingue reconnaît le texte, les tableaux et les formules pour transformer les pages en contenu réutilisable.

    Cette application fournit la version Q8 de dots.ocr aux applications Olares compatibles. Elle prend en charge les GPU NVIDIA et les GPU Intel dédiés. Les mises en page complexes, les tableaux et les formules peuvent nécessiter une vérification manuelle.
