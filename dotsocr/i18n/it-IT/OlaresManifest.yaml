metadata:
  title: dots.ocr
  description: "Riconoscimento multilingue del testo nei documenti con analisi del layout"

spec:
  upgradeDescription: |
    v1.0.48: Aggiunto il supporto per GPU Intel discrete con il motore llama.cpp SYCL e la stessa API OCR e lo stesso modello del pacchetto NVIDIA.

  fullDescription: |
    dots.ocr estrae il testo da immagini di documenti e pagine PDF interpretando il layout e l'ordine di lettura. Il modello multilingue riconosce testo, tabelle e formule per trasformare le pagine in contenuti riutilizzabili.

    Questa app fornisce la versione Q8 di dots.ocr alle applicazioni Olares compatibili. Supporta GPU NVIDIA e GPU Intel discrete. Layout complessi, tabelle e formule possono richiedere una verifica manuale.
