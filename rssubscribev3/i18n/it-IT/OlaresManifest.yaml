metadata:
  title: RSS Subscribe V3 for test
  description: Fornisce il servizio RSS Subscribe per Wise
spec:
  upgradeDescription: |
    Migrazione di RSS Subscribe allo schema shared-app v3.

    **Cosa è cambiato**

    - **Schema**: OlaresManifest aggiornato a `apiVersion: v3`.
    - **Layout**: uniti i precedenti subChart `rsserver` + `rssubscribe` in un unico chart.
    - **Condivisione**: sostituiti `appScope.clusterScoped` + `appRef` con `options.shared: true`.
    - **Scaling**: `workloadReplicas` dichiara i conteggi delle repliche per il workload `rssubscribev3`.
  fullDescription: |
    **NOTA IMPORTANTE**
    Questa è un'app condivisa. Una volta installata dall'Olares Admin, tutti gli utenti del cluster possono usarla tramite app di riferimento (ad es. wise).

    Fornisce il servizio RSS Subscribe per Wise e altre app su Olares.
