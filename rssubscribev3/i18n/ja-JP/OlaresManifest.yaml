metadata:
  title: RSS Subscribe V3 for test
  description: Wise 向けの RSS Subscribe サービスを提供
spec:
  upgradeDescription: |
    RSS Subscribe を v3 共有アプリスキーマへ移行。

    **変更点**

    - **スキーマ**: OlaresManifest を `apiVersion: v3` にアップグレード。
    - **構成**: 以前の `rsserver` + `rssubscribe` サブチャートを単一チャートに統合。
    - **共有**: `appScope.clusterScoped` + `appRef` を `options.shared: true` に置き換え。
    - **スケーリング**: `workloadReplicas` が `rssubscribev3` ワークロードのレプリカ数を宣言。
  fullDescription: |
    **重要なお知らせ**
    これは共有アプリです。Olares Admin がインストールすると、クラスター内の全ユーザーが参照アプリ（例: wise）経由で利用できます。

    Olares 上の Wise およびその他のアプリ向けに RSS Subscribe サービスを提供します。
