metadata:
  title: RSS Subscribe V3 for test
  description: Stellt den RSS-Subscribe-Dienst für Wise bereit
spec:
  upgradeDescription: |
    Migration von RSS Subscribe auf das v3 Shared-App-Schema.

    **Änderungen**

    - **Schema**: OlaresManifest auf `apiVersion: v3` aktualisiert.
    - **Layout**: die bisherigen SubCharts `rsserver` + `rssubscribe` zu einem einzelnen Chart zusammengeführt.
    - **Sharing**: `appScope.clusterScoped` + `appRef` durch `options.shared: true` ersetzt.
    - **Skalierung**: `workloadReplicas` deklariert die Replikazahlen für die Workload `rssubscribev3`.
  fullDescription: |
    **WICHTIGER HINWEIS**
    Dies ist eine Shared App. Nach der Installation durch den Olares Admin können alle Benutzer im Cluster sie über Referenz-Apps (z. B. wise) nutzen.

    Stellt den RSS-Subscribe-Dienst für Wise und andere Apps auf Olares bereit.
