metadata:
  title: RSS Subscribe V3 for test
  description: Fournit le service RSS Subscribe pour Wise
spec:
  upgradeDescription: |
    Migration de RSS Subscribe vers le schéma d'application partagée v3.

    **Changements**

    - **Schéma** : OlaresManifest mis à niveau vers `apiVersion: v3`.
    - **Disposition** : fusion des sous-charts `rsserver` + `rssubscribe` précédents en un seul chart.
    - **Partage** : remplacement de `appScope.clusterScoped` + `appRef` par `options.shared: true`.
    - **Mise à l'échelle** : `workloadReplicas` déclare le nombre de réplicas pour la charge de travail `rssubscribev3`.
  fullDescription: |
    **NOTE IMPORTANTE**
    Il s'agit d'une application partagée. Une fois installée par l'Olares Admin, tous les utilisateurs du cluster peuvent l'utiliser via des applications de référence (p. ex. wise).

    Fournit le service RSS Subscribe pour Wise et d'autres applications sur Olares.
