metadata:
  title: RSS Subscribe V3 for test
  description: Proporciona el servicio RSS Subscribe para Wise
spec:
  upgradeDescription: |
    Migrar RSS Subscribe al esquema de app compartida v3.

    **Cambios**

    - **Esquema**: OlaresManifest actualizado a `apiVersion: v3`.
    - **Diseño**: se fusionaron los subCharts anteriores `rsserver` + `rssubscribe` en un solo chart.
    - **Compartición**: se reemplazó `appScope.clusterScoped` + `appRef` por `options.shared: true`.
    - **Escalado**: `workloadReplicas` declara el número de réplicas para la carga de trabajo `rssubscribev3`.
  fullDescription: |
    **NOTA IMPORTANTE**
    Esta es una app compartida. Una vez instalada por el Olares Admin, todos los usuarios del clúster pueden usarla a través de apps de referencia (p. ej. wise).

    Proporciona el servicio RSS Subscribe para Wise y otras apps en Olares.
