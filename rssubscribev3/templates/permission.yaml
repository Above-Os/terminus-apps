---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rssubscribe-cluster-account
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: rssubscribe-cluster-role
rules:
  - apiGroups:
      - ''
    resources:
      - serviceaccounts/token
    resourceNames:
      - rssubscribe-cluster-account
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: rssubscribe-cluster-binding
subjects:
  - kind: ServiceAccount
    name: rssubscribe-cluster-account
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: rssubscribe-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Release.Namespace }}:integration-provider-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend:integration-provider-svc-cookie
subjects:
  - kind: ServiceAccount
    name: rssubscribe-cluster-account
    namespace: {{ .Release.Namespace }}
