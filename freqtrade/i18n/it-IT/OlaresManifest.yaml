metadata:
  title: Freqtrade
  description: Bot di trading crypto gratuito e open source
spec:
  upgradeDescription: |
    Passa l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allinea i mount di configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovi il collegamento specifico Bitnami di `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Freqtrade è un bot di trading crypto gratuito e open source scritto in Python. È progettato per supportare i principali exchange e essere controllato via Telegram o webUI. Contiene strumenti di backtesting, plotting e money management nonché ottimizzazione delle strategie tramite machine learning.

    **Disclaimer**
    Questo software è solo a scopo educativo. Non rischiare denaro di cui temi la perdita. USA IL SOFTWARE A TUO RISCHIO. GLI AUTORI, OLARES E TUTTI GLI AFFILIATI NON SI ASSUMONO ALCUNA RESPONSABILITÀ PER I TUOI RISULTATI DI TRADING.

    **Guida rapida**
    > Consulta il tutorial su Olares Docs per una guida dettagliata (https://docs.olares.com/use-cases/)

    Questa app esegue due bot di trading, un webserver di backtest e FreqUI su un unico ingresso:
    - API bot Spot: URL di questa pagina + /api-spot (es. https://your-app.olares.com/api-spot)
    - API bot Futures: URL di questa pagina + /api-future (es. https://your-app.olares.com/api-future)
    - API Backtest / download-data (dati separati): URL di questa pagina + /api-backtest/ (es. https://your-app.olares.com/api-backtest).

    Apri questa app per ottenere FreqUI. Per collegare un bot, aggiungilo in FreqUI e imposta l'URL API su /api-spot, /api-future o /api-backtest, e accedi con username «admin», password «admin».

    Crea secret per l'accesso all'exchange: gli exchange centralizzati (es. Binance) richiedono key e secret, mentre quelli decentralizzati (es. Hyperliquid) usano walletAddress e privateKey. Ad esempio, crea freqtrade-hyperliquid-secret (walletAddress, privateKey) per abilitare il trading live di spot e futures.

    I file di config e strategia sono archiviati nei dati dell'app: ogni istanza ha la propria directory alla root dell'app — freqtrade-spot/, freqtrade-future/ e opzionalmente freqtrade-backtest/ (ciascuna con config/config.json e strategies/*.py). Imposta «strategy» in config.json sul nome della classe del file di strategia (es. Strategy001). Puoi aggiungere più file .py e cambiare modificando la config; poi ferma e avvia il bot da FreqUI per applicare le modifiche.

    **Exchange Spot supportati**
    - Binance
    - BingX
    - Bitget
    - Bitmart
    - Bybit
    - Gate.io
    - HTX
    - Hyperliquid (un exchange decentralizzato, o DEX)
    - Kraken
    - OKX
    - MyOKX (OKX EEA)
    - potenzialmente molti altri. (Non possiamo garantire che funzionino)

    **Exchange Futures supportati**
    - Binance
    - Bitget
    - Gate.io
    - Hyperliquid (un exchange decentralizzato, o DEX)
    - OKX
    - Bybit
    - Kraken

    **Funzionalità**
    - Basato su Python 3.11+: per il botting su qualsiasi sistema operativo — Windows, macOS e Linux.
    - Persistenza: la persistenza è ottenuta tramite sqlite.
    - Dry-run: esegui il bot senza spendere denaro.
    - Backtesting: esegui una simulazione della tua strategia di buy/sell.
    - Ottimizzazione della strategia tramite machine learning: usa il ML per ottimizzare i parametri della strategia di buy/sell con dati reali dell'exchange.
    - Modellazione predittiva adattiva: costruisci una strategia smart con FreqAI che si auto-addestra al mercato tramite metodi ML adattivi. Scopri di più
    - Whitelist di criptovalute: seleziona quali criptovalute vuoi tradare o usa whitelist dinamiche.
    - Blacklist di criptovalute: seleziona quali criptovalute vuoi evitare.
    - WebUI integrata: UI web integrata per gestire il bot.
    - Gestibile via Telegram: gestisci il bot con Telegram.
    - Mostra profitto/perdita in fiat: mostra il tuo profitto/perdita in valuta fiat.
    - Report di stato delle performance: fornisci uno stato delle performance dei tuoi trade correnti.
