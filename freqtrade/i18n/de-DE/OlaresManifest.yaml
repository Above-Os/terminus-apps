metadata:
  title: Freqtrade
  description: Kostenloser Open-Source-Krypto-Trading-Bot
spec:
  upgradeDescription: |
    Wechseln Sie das Reverse-Proxy-Image von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.

    Passen Sie nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images an (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und entfernen Sie die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Freqtrade ist ein kostenloser Open-Source-Krypto-Trading-Bot in Python. Er ist darauf ausgelegt, alle großen Börsen zu unterstützen und über Telegram oder WebUI gesteuert zu werden. Er enthält Backtesting-, Plotting- und Money-Management-Tools sowie Strategieoptimierung durch maschinelles Lernen.

    **Haftungsausschluss**
    Diese Software dient nur Bildungszwecken. Riskieren Sie kein Geld, dessen Verlust Sie fürchten. NUTZEN SIE DIE SOFTWARE AUF EIGENES RISIKO. DIE AUTOREN, Olares UND ALLE AFFILIATES ÜBERNEHMEN KEINE VERANTWORTUNG FÜR IHRE TRADING-ERGEBNISSE.

    **Kurzanleitung**
    > Bitte beachten Sie das Tutorial in den Olares Docs für eine detaillierte Anleitung (https://docs.olares.com/use-cases/)

    Diese App betreibt zwei Trading-Bots, einen Backtest-Webserver und FreqUI über einen Entrance:
    - Spot-Bot-API: diese Seiten-URL + /api-spot (z. B. https://your-app.olares.com/api-spot)
    - Futures-Bot-API: diese Seiten-URL + /api-future (z. B. https://your-app.olares.com/api-future)
    - Backtest-/Download-Data-API (separate Daten): diese Seiten-URL + /api-backtest/ (z. B. https://your-app.olares.com/api-backtest).

    Öffnen Sie diese App, um FreqUI zu erhalten. Um einen Bot zu verbinden, fügen Sie ihn in FreqUI hinzu und setzen Sie die API-URL auf /api-spot, /api-future oder /api-backtest, und melden Sie sich mit Benutzername „admin“, Passwort „admin“ an.

    Erstellen Sie Secrets für den Börsenzugang: zentralisierte Börsen (z. B. Binance) benötigen key und secret, dezentrale Börsen (z. B. Hyperliquid) verwenden walletAddress und privateKey. Erstellen Sie z. B. freqtrade-hyperliquid-secret (walletAddress, privateKey), um Live-Trading für Spot und Futures zu aktivieren.

    Konfigurations- und Strategiedateien liegen in den App-Daten: jede Instanz hat ihr eigenes Verzeichnis an der App-Root — freqtrade-spot/, freqtrade-future/ und optional freqtrade-backtest/ (jeweils mit config/config.json und strategies/*.py). Setzen Sie „strategy“ in config.json auf den Klassennamen der Strategiedatei (z. B. Strategy001). Sie können mehrere .py-Dateien hinzufügen und durch Bearbeiten der Config wechseln; stoppen und starten Sie den Bot dann in FreqUI, um Änderungen anzuwenden.

    **Unterstützte Spot-Börsen**
    - Binance
    - BingX
    - Bitget
    - Bitmart
    - Bybit
    - Gate.io
    - HTX
    - Hyperliquid (eine dezentrale Börse, oder DEX)
    - Kraken
    - OKX
    - MyOKX (OKX EEA)
    - potenziell viele weitere. (Wir können nicht garantieren, dass sie funktionieren)

    **Unterstützte Futures-Börsen**
    - Binance
    - Bitget
    - Gate.io
    - Hyperliquid (eine dezentrale Börse, oder DEX)
    - OKX
    - Bybit
    - Kraken

    **Funktionen**
    - Basierend auf Python 3.11+: Für Botting auf jedem Betriebssystem – Windows, macOS und Linux.
    - Persistenz: Persistenz über sqlite.
    - Dry-run: Den Bot ohne Geldeinsatz laufen lassen.
    - Backtesting: Simulation Ihrer Kauf-/Verkaufsstrategie.
    - Strategieoptimierung durch maschinelles Lernen: ML zur Optimierung Ihrer Kauf-/Verkaufsstrategieparameter mit echten Börsendaten.
    - Adaptive Vorhersagemodellierung: Bauen Sie eine smarte Strategie mit FreqAI, die sich über adaptive ML-Methoden selbst am Markt trainiert. Mehr erfahren
    - Whitelist von Kryptowährungen: Wählen Sie, welche Kryptowährung gehandelt werden soll, oder nutzen Sie dynamische Whitelists.
    - Blacklist von Kryptowährungen: Wählen Sie, welche Kryptowährung vermieden werden soll.
    - Eingebaute WebUI: Eingebaute Web-UI zur Verwaltung Ihres Bots.
    - Über Telegram verwaltbar: Den Bot mit Telegram verwalten.
    - Gewinn/Verlust in Fiat anzeigen: Ihren Gewinn/Verlust in Fiat-Währung anzeigen.
    - Performance-Statusbericht: Einen Performance-Status Ihrer aktuellen Trades bereitstellen.
