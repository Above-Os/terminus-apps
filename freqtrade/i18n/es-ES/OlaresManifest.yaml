metadata:
  title: Freqtrade
  description: Bot de trading de criptomonedas gratuito y de código abierto
spec:
  upgradeDescription: |
    Cambie la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinee los montajes de configuración de nginx y las rutas de registro con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y elimine el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Freqtrade es un bot de trading de criptomonedas gratuito y de código abierto escrito en Python. Está diseñado para admitir los principales exchanges y controlarse vía Telegram o webUI. Incluye herramientas de backtesting, plotting y gestión de dinero, así como optimización de estrategias mediante aprendizaje automático.

    **Aviso legal**
    Este software es solo con fines educativos. No arriesgue dinero cuyo pérdida tema. USE EL SOFTWARE BAJO SU PROPIA RESPONSABILIDAD. LOS AUTORES, OLARES Y TODOS LOS AFILIADOS NO ASUMEN RESPONSABILIDAD POR SUS RESULTADOS DE TRADING.

    **Guía rápida**
    > Consulte el tutorial en Olares Docs para una guía detallada (https://docs.olares.com/use-cases/)

    Esta app ejecuta dos bots de trading, un servidor web de backtest y FreqUI en una sola entrada:
    - API del bot Spot: URL de esta página + /api-spot (p. ej. https://your-app.olares.com/api-spot)
    - API del bot Futures: URL de esta página + /api-future (p. ej. https://your-app.olares.com/api-future)
    - API de Backtest / download-data (datos separados): URL de esta página + /api-backtest/ (p. ej. https://your-app.olares.com/api-backtest).

    Abra esta app para obtener FreqUI. Para conectar un bot, añádalo en FreqUI y establezca la URL de API en /api-spot, /api-future o /api-backtest, e inicie sesión con usuario «admin», contraseña «admin».

    Cree secrets para el acceso al exchange: los exchanges centralizados (p. ej., Binance) requieren key y secret, mientras que los descentralizados (p. ej., Hyperliquid) usan walletAddress y privateKey. Por ejemplo, cree freqtrade-hyperliquid-secret (walletAddress, privateKey) para habilitar el trading en vivo de spot y futures.

    Los archivos de configuración y estrategia se almacenan en los datos de la app: cada instancia tiene su propio directorio en la raíz de la app — freqtrade-spot/, freqtrade-future/ y opcionalmente freqtrade-backtest/ (cada uno con config/config.json y strategies/*.py). Establezca «strategy» en config.json al nombre de clase del archivo de estrategia (p. ej. Strategy001). Puede añadir varios archivos .py y cambiar editando la config; luego detenga e inicie el bot desde FreqUI para aplicar los cambios.

    **Exchanges Spot compatibles**
    - Binance
    - BingX
    - Bitget
    - Bitmart
    - Bybit
    - Gate.io
    - HTX
    - Hyperliquid (un exchange descentralizado, o DEX)
    - Kraken
    - OKX
    - MyOKX (OKX EEA)
    - potencialmente muchos otros. (No podemos garantizar que funcionen)

    **Exchanges Futures compatibles**
    - Binance
    - Bitget
    - Gate.io
    - Hyperliquid (un exchange descentralizado, o DEX)
    - OKX
    - Bybit
    - Kraken

    **Características**
    - Basado en Python 3.11+: para botting en cualquier sistema operativo — Windows, macOS y Linux.
    - Persistencia: la persistencia se logra mediante sqlite.
    - Dry-run: ejecutar el bot sin gastar dinero.
    - Backtesting: ejecutar una simulación de su estrategia de compra/venta.
    - Optimización de estrategia mediante aprendizaje automático: use ML para optimizar los parámetros de su estrategia de compra/venta con datos reales del exchange.
    - Modelado predictivo adaptativo: construya una estrategia inteligente con FreqAI que se autoentrena al mercado mediante métodos ML adaptativos. Más información
    - Lista blanca de criptomonedas: seleccione qué criptomoneda quiere operar o use listas blancas dinámicas.
    - Lista negra de criptomonedas: seleccione qué criptomoneda quiere evitar.
    - WebUI integrada: UI web integrada para gestionar su bot.
    - Gestionable vía Telegram: gestione el bot con Telegram.
    - Mostrar beneficio/pérdida en fiat: muestre su beneficio/pérdida en moneda fiat.
    - Informe de estado de rendimiento: proporcione un estado de rendimiento de sus operaciones actuales.
