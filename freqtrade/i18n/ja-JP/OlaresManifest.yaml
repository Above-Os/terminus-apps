metadata:
  title: Freqtrade
  description: 無料のオープンソース暗号資産トレーディングボット
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えます。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除します。
  fullDescription: |
    Freqtrade は Python で書かれた無料のオープンソース暗号資産トレーディングボットです。主要取引所をサポートし、Telegram または webUI で制御できるよう設計されています。バックテスト、プロット、マネーマネジメントツールに加え、機械学習による戦略最適化も備えます。

    **免責事項**
    本ソフトウェアは教育目的のみです。失うのが怖い資金をリスクにさらさないでください。ソフトウェアは自己責任でご利用ください。作者、Olares、およびすべての関連者は、あなたの取引結果について一切の責任を負いません。

    **クイックガイド**
    > 詳細は Olares Docs のチュートリアルを参照してください： https://docs.olares.com/use-cases/

    本アプリは 2 つのトレーディングボット、バックテスト Web サーバー、FreqUI を 1 つのエントランスで実行します:
    - Spot ボット API: このページの URL + /api-spot。例： https://your-app.olares.com/api-spot
    - Futures ボット API: このページの URL + /api-future。例： https://your-app.olares.com/api-future
    - バックテスト／download-data API（別データ）: このページの URL + /api-backtest/。例： https://your-app.olares.com/api-backtest

    本アプリを開いて FreqUI を取得します。ボットを接続するには FreqUI で追加し、API URL を /api-spot、/api-future、または /api-backtest に設定し、ユーザー名「admin」、パスワード「admin」でログインします。

    取引所アクセス用のシークレットを作成: 中央集権取引所（例: Binance）は key と secret が必要で、分散型取引所（例: Hyperliquid）は walletAddress と privateKey を使います。例として freqtrade-hyperliquid-secret（walletAddress、privateKey）を作成し、スポットと先物のライブ取引を有効にします。

    設定と戦略ファイルはアプリデータに保存されます: 各インスタンスはアプリルートに独自ディレクトリを持ちます — freqtrade-spot/、freqtrade-future/、オプションで freqtrade-backtest/（それぞれ config/config.json と strategies/*.py）。config.json の「strategy」を戦略ファイルのクラス名（例: Strategy001）に設定します。複数の .py を追加し、設定編集で切り替え可能。変更を適用するには FreqUI からボットを停止・開始してください。

    **対応スポット取引所**
    - Binance
    - BingX
    - Bitget
    - Bitmart
    - Bybit
    - Gate.io
    - HTX
    - Hyperliquid（分散型取引所、または DEX）
    - Kraken
    - OKX
    - MyOKX（OKX EEA）
    - その他多数の可能性あり（動作保証はできません）

    **対応先物取引所**
    - Binance
    - Bitget
    - Gate.io
    - Hyperliquid（分散型取引所、または DEX）
    - OKX
    - Bybit
    - Kraken

    **機能**
    - Python 3.11+ ベース: Windows、macOS、Linux のいずれでもボッティング可能。
    - 永続化: sqlite による永続化。
    - Dry-run: 資金を使わずにボットを実行。
    - バックテスト: 買い／売り戦略のシミュレーションを実行。
    - 機械学習による戦略最適化: 実取引所データで買い／売り戦略パラメータを ML 最適化。
    - 適応予測モデリング: FreqAI で市場に自己学習するスマート戦略を構築。詳細
    - 暗号資産ホワイトリスト: 取引する通貨を選択、または動的ホワイトリストを使用。
    - 暗号資産ブラックリスト: 避けたい通貨を選択。
    - 組み込み WebUI: ボット管理用の組み込み Web UI。
    - Telegram で管理可能: Telegram でボットを管理。
    - 法定通貨での損益表示: 損益を法定通貨で表示。
    - パフォーマンス状況レポート: 現在の取引のパフォーマンス状況を提供。
