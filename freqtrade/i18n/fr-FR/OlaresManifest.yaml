metadata:
  title: Freqtrade
  description: Bot de trading crypto gratuit et open source
spec:
  upgradeDescription: |
    Remplacez l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alignez les montages de configuration nginx et les chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimez le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Freqtrade est un bot de trading crypto gratuit et open source écrit en Python. Il est conçu pour prendre en charge les principaux exchanges et être contrôlé via Telegram ou webUI. Il contient des outils de backtesting, de plotting et de money management ainsi que l'optimisation de stratégies par apprentissage automatique.

    **Avertissement**
    Ce logiciel est uniquement à des fins éducatives. Ne risquez pas d'argent dont vous craignez la perte. UTILISEZ LE LOGICIEL À VOS PROPRES RISQUES. LES AUTEURS, OLARES ET TOUS LES AFFILIÉS N'ASSUMENT AUCUNE RESPONSABILITÉ POUR VOS RÉSULTATS DE TRADING.

    **Guide rapide**
    > Veuillez consulter le tutoriel sur Olares Docs pour un guide détaillé (https://docs.olares.com/use-cases/)

    Cette application exécute deux bots de trading, un serveur web de backtest et FreqUI sur une seule entrée :
    - API bot Spot : URL de cette page + /api-spot (p. ex. https://your-app.olares.com/api-spot)
    - API bot Futures : URL de cette page + /api-future (p. ex. https://your-app.olares.com/api-future)
    - API Backtest / download-data (données séparées) : URL de cette page + /api-backtest/ (p. ex. https://your-app.olares.com/api-backtest).

    Ouvrez cette application pour obtenir FreqUI. Pour connecter un bot, ajoutez-le dans FreqUI et définissez l'URL API sur /api-spot, /api-future ou /api-backtest, et connectez-vous avec le nom d'utilisateur « admin », mot de passe « admin ».

    Créez des secrets pour l'accès à l'exchange : les exchanges centralisés (p. ex. Binance) nécessitent key et secret, tandis que les exchanges décentralisés (p. ex. Hyperliquid) utilisent walletAddress et privateKey. Par exemple, créez freqtrade-hyperliquid-secret (walletAddress, privateKey) pour activer le trading live pour spot et futures.

    Les fichiers de configuration et de stratégie sont stockés dans les données de l'app : chaque instance a son propre répertoire à la racine de l'app — freqtrade-spot/, freqtrade-future/ et éventuellement freqtrade-backtest/ (chacun avec config/config.json et strategies/*.py). Définissez « strategy » dans config.json sur le nom de classe du fichier de stratégie (p. ex. Strategy001). Vous pouvez ajouter plusieurs fichiers .py et changer en éditant la config ; puis arrêtez et démarrez le bot depuis FreqUI pour appliquer les changements.

    **Exchanges Spot pris en charge**
    - Binance
    - BingX
    - Bitget
    - Bitmart
    - Bybit
    - Gate.io
    - HTX
    - Hyperliquid (un exchange décentralisé, ou DEX)
    - Kraken
    - OKX
    - MyOKX (OKX EEA)
    - potentiellement bien d'autres. (Nous ne pouvons pas garantir qu'ils fonctionnent)

    **Exchanges Futures pris en charge**
    - Binance
    - Bitget
    - Gate.io
    - Hyperliquid (un exchange décentralisé, ou DEX)
    - OKX
    - Bybit
    - Kraken

    **Fonctionnalités**
    - Basé sur Python 3.11+ : pour le botting sur n'importe quel système d'exploitation — Windows, macOS et Linux.
    - Persistance : la persistance est obtenue via sqlite.
    - Dry-run : exécuter le bot sans dépenser d'argent.
    - Backtesting : exécuter une simulation de votre stratégie d'achat/vente.
    - Optimisation de stratégie par apprentissage automatique : utilisez le ML pour optimiser les paramètres de votre stratégie d'achat/vente avec des données d'exchange réelles.
    - Modélisation prédictive adaptative : construisez une stratégie intelligente avec FreqAI qui s'auto-entraîne au marché via des méthodes ML adaptatives. En savoir plus
    - Liste blanche de crypto-monnaies : sélectionnez quelle crypto-monnaie vous voulez trader ou utilisez des listes blanches dynamiques.
    - Liste noire de crypto-monnaies : sélectionnez quelle crypto-monnaie vous voulez éviter.
    - WebUI intégrée : UI web intégrée pour gérer votre bot.
    - Gérable via Telegram : gérez le bot avec Telegram.
    - Afficher le profit/perte en fiat : affichez votre profit/perte en monnaie fiat.
    - Rapport d'état de performance : fournissez un état de performance de vos trades actuels.
