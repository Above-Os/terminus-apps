metadata:
  title: CADCraft
  description: AutoCAD-style 2D drafting and design that runs in your browser
spec:
  fullDescription: |
    ## Overview
    CADCraft is an open-source, AutoCAD-comparable computer-aided design and
    drafting application written in Rust. This app serves its WebAssembly
    build: drafting runs entirely in your browser, and drawings never leave
    your device.

    Open uses the browser file picker (DXF and DWG); Save and Export download
    files. Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs CADCraft's headless engine as an MCP server over
    Streamable HTTP. Agents can draw with AutoCAD-style commands, inspect and
    query drawings, render previews, and save DXF/DWG or export SVG, PNG and
    PDF. Its entrance is hidden from the desktop and listed in Settings; it is
    reachable from your LAN or the LarePass VPN. Agents can read and write
    files only in Home/CADCraft. To keep editing an agent's result in the
    browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
