metadata:
  title: Leantime
  description: Leantime es un sistema de gestión de proyectos centrado en objetivos para quienes no son gestores de proyectos.
spec:
  fullDescription: |
    Leantime es un sistema open-source de gestión de proyectos para no gestores de proyectos.
    Combinamos estrategia, planificación y ejecución, facilitando su uso a todo el equipo.
    Diseñado pensando en el TDAH, la dislexia y el autismo.

    Tan simple como Trello pero tan completo como Jira
    Una alternativa perfecta a ClickUp, Monday o Asana

    **Funciones clave:**
    Gestión de tareas
    - Gestión de tareas mediante tableros kanban, gantt, tabla, lista y calendario
    - Subtareas e dependencias ilimitadas
    - Gestión de hitos
    - Gestión de sprints
    - Seguimiento del tiempo y partes de horas

    Planificación de proyectos
    - Paneles de proyecto, informes y actualizaciones de estado
    - Seguimiento de objetivos y métricas
    - Lean & Business Model Canvas
    - Lienzo de análisis DAFO
    - Análisis de riesgos

    Gestión de información/conocimiento
    - Wikis / Docs
    - Tableros de ideas
    - Retrospectivas
    - Almacenamiento de archivos vía S3 o sistema de archivos local
    - Grabación de pantalla y webcam
    - Comentarios/discusiones en todo

    Administración
    - Instalación sencilla
    - Múltiples roles de usuario y permisos por proyecto
    - Autenticación de dos factores
    - Integración LDAP, OIDC
    - Extensible mediante plugins y API
    - Integración con Slack, Mattermost, Discord
    - Disponible en más de 20 idiomas
