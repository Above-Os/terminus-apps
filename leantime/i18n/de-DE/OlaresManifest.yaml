metadata:
  title: Leantime
  description: Leantime ist ein zielorientiertes Projektmanagement-System für Nicht-Projektmanager.
spec:
  fullDescription: |
    Leantime ist ein Open-Source-Projektmanagement-System für Nicht-Projektmanager.
    Wir kombinieren Strategie, Planung und Ausführung und machen es für alle im Team leicht nutzbar.
    Mit Blick auf ADHS, Dyslexie und Autismus entwickelt.

    So einfach wie Trello, aber so funktionsreich wie Jira
    Eine perfekte Alternative zu ClickUp, Monday oder Asana

    **Hauptfunktionen:**
    Aufgabenverwaltung
    - Aufgabenverwaltung über Kanban-Boards, Gantt, Tabellen-, Listen- und Kalenderansichten
    - Unbegrenzte Unteraufgaben und Abhängigkeiten
    - Meilensteinverwaltung
    - Sprint-Management
    - Zeiterfassung & Stundenzettel

    Projektplanung
    - Projektdashboards, Berichte & Status-Updates
    - Ziel- & Kennzahlenverfolgung
    - Lean- & Business-Model-Canvas
    - SWOT-Analyse-Canvas
    - Risikoanalyse

    Informations-/Wissensmanagement
    - Wikis / Docs
    - Ideen-Boards
    - Retrospektiven
    - Dateispeicher über S3 oder lokales Dateisystem
    - Bildschirm- & Webcam-Aufnahme
    - Kommentare/Diskussionen zu allem

    Administration
    - Einfache Installation
    - Mehrere Benutzerrollen und projektbezogene Berechtigungen
    - Zwei-Faktor-Authentifizierung
    - LDAP-, OIDC-Integration
    - Erweiterbar über Plugins und API
    - Integration mit Slack, Mattermost, Discord
    - In über 20 Sprachen verfügbar
  upgradeDescription: |
