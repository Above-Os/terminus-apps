    fix : suppression des animations lourdes en CPU
    feat : méthode getAll du repo Timesheets modifiée pour prendre invempl comme 0
    feat : invempl passé de case à cocher à select
    feat : gestion d'invempl comme sélectionné ajoutée
    feat : défaut de ticketFilter à -1 pour s'aligner avec le reste
    feat : projectFilter modifié pour mieux s'aligner avec la fonctionnalité actuelle
    feat : garantir que ticketFilter ne produise pas accidentellement une requête vide
