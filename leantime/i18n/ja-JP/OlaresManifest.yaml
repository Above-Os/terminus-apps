metadata:
  title: Leantime
  description: Leantime は、プロジェクトマネージャーではない人向けの目標志向プロジェクト管理システムです。
spec:
  fullDescription: |
    Leantime は、プロジェクトマネージャーではない人向けのオープンソース・プロジェクト管理システムです。
    戦略・計画・実行を組み合わせ、チーム全員が使いやすくしています。
    ADHD、ディスレクシア、自閉症を念頭に設計されています。

    Trello のようにシンプルで、Jira のように機能豊富
    ClickUp、Monday、Asana の完璧な代替

    **主な機能:**
    タスク管理
    - カンバン、ガント、表、リスト、カレンダービューでのタスク管理
    - 無制限のサブタスクと依存関係
    - マイルストーン管理
    - スプリント管理
    - タイムトラッキング＆タイムシート

    プロジェクト計画
    - プロジェクトダッシュボード、レポート、ステータス更新
    - 目標とメトリクスの追跡
    - Lean & Business Model Canvas
    - SWOT 分析キャンバス
    - リスク分析

    情報／ナレッジ管理
    - Wiki / Docs
    - アイデアボード
    - レトロスペクティブ
    - S3 またはローカルファイルシステムでのファイル保存
    - 画面・ウェブカム録画
    - すべてへのコメント／ディスカッション

    管理
    - 簡単なインストール
    - 複数のユーザーロールとプロジェクトごとの権限
    - 二要素認証
    - LDAP、OIDC 連携
    - プラグインと API で拡張可能
    - Slack、Mattermost、Discord と連携
    - 20以上の言語で利用可能
  upgradeDescription: |
    アプリバージョンを 3.5.12 にアップグレード

    変更内容
    fix: 新しい請求フィルターの問題
    fix: CPU 負荷の高いアニメーションを削除
    feat: Timesheets リポジトリの getAll を invempl を 0 として受け取るよう変更
    feat: invempl をチェックボックスからセレクトに変更
    feat: invempl を選択値として扱う処理を追加
    feat: ticketFilter のデフォルトを -1 にして他と整合
    feat: projectFilter を現行機能に合わせて修正
    feat: ticketFilter 設定が誤って空クエリにならないよう保証
    feat: timesheets/showAll に ticketFilter を追加

    完全なリリースノート: https://github.com/Leantime/leantime/releases/tag/3.5.12
