metadata:
  title: Colibri
  description: Un motor de IA local para modelos MoE más grandes con menos memoria residente
spec:
  fullDescription: |
    Colibri es un motor de IA local con una interfaz web de chat. Lee los pesos de los expertos de los modelos MoE del disco según se necesitan.

    Colibri permite establecer los límites de memoria del sistema y de la GPU, o funcionar solo con la CPU. Puede intentar ejecutar modelos MoE compatibles de mayor tamaño con recursos limitados, pero la espera hasta la primera respuesta y la velocidad de generación pueden empeorar considerablemente, sobre todo con entradas largas. Aumentar la memoria del sistema o de la GPU suele ayudar a mejorar el rendimiento. El rendimiento real depende del modelo, la cuantización y la longitud de la entrada.

    **Funciones principales**

    - Explorar archivos GGUF existentes, cambiar de modelo local y restaurar la selección guardada después de reiniciar.
    - Conversar con respuestas que se muestran de forma progresiva y utilizar API compatibles con OpenAI y Anthropic.
    - Consultar la velocidad de generación y el tiempo dedicado a cada fase de inferencia.
    - Ejecutar localmente un modelo GGUF compatible o conectar la interfaz a un Olares Router instalado y a su ruta default-chat.
    - Abrir la aplicación privada mediante el inicio de sesión de Olares sin introducir la clave API interna de la aplicación en el navegador.

    **Antes de instalar**

    Seleccione en la aplicación un GGUF compatible del directorio compartido de modelos de Hugging Face. La instalación puede completarse antes de elegir un modelo. Los pesos de los modelos no se incluyen ni se descargan automáticamente. La dirección del Router se rellena a partir del dominio Olares del usuario que instala la aplicación y se puede sustituir.

    Esta versión permite ejecutar en CPU sin asignar una GPU y ofrece aceleración NVIDIA opcional. Ambas opciones requieren amd64 con AVX2 (x86-64-v3). La aceleración NVIDIA requiere un controlador compatible con CUDA 13.0, está compilada para Blackwell sm_120 y se ha probado en una RTX 5090 Laptop GPU. Esta versión no admite arquitecturas GPU NVIDIA anteriores.

    **Limitaciones de la versión preliminar**

    El modo de bajo consumo de memoria prioriza la ejecución de modelos MoE compatibles con memoria limitada. La configuración de recursos predeterminada puede hacer que las respuestas sean mucho más lentas que en el modo estándar, especialmente con entradas largas, y las solicitudes pueden agotar el tiempo de espera. Si dispone de recursos suficientes, elija el modo estándar para mejorar la respuesta. Las entradas más cortas también pueden reducir la espera.

    El historial de chat y los parámetros de generación no se conservan al recargar la página. Exporte las conversaciones antes de recargar. Las entradas largas pueden procesarse lentamente. En las pruebas, la compresión automática del contexto no terminó dentro del límite de 300 segundos del cliente. El modelo probado no admite la salida JSON forzada ni las imágenes de entrada.
