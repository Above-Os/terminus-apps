metadata:
  title: Colibri
  description: Motor de IA local que carga expertos del modelo desde disco para chat y API compatibles
spec:
  fullDescription: |
    Colibri es un motor de IA local con una interfaz web para conversar con modelos abiertos. En los modelos de mezcla de expertos, puede leer del disco los expertos necesarios para cada respuesta en lugar de mantenerlos todos en memoria.

    **Funciones principales**

    - Conversar con respuestas que se muestran de forma progresiva y utilizar API compatibles con OpenAI y Anthropic.
    - Consultar la velocidad de generación y el tiempo dedicado a cada fase de inferencia.
    - Ejecutar localmente un modelo GGUF compatible o conectar la interfaz a un Olares Router instalado y a su ruta default-chat.
    - Abrir la aplicación privada mediante el inicio de sesión de Olares sin introducir la clave API interna de la aplicación en el navegador.

    **Antes de instalar**

    Proporcione un archivo GGUF existente y compatible del directorio compartido de modelos de Hugging Face. Los pesos de los modelos no se incluyen ni se descargan automáticamente. La dirección del Router se rellena a partir del dominio Olares del usuario que instala la aplicación y se puede sustituir.

    Esta versión preliminar admite CPU amd64 con AVX2 (x86-64-v3). La imagen NVIDIA usa CUDA 13.0, requiere un controlador NVIDIA compatible y está compilada para hardware Blackwell sm_120 y se ha probado en una RTX 5090 Laptop GPU. No es una compilación CUDA genérica para GPU más antiguas.

    **Limitaciones de la versión preliminar**

    El historial de chat y los parámetros de generación no se conservan al recargar la página. Exporte las conversaciones antes de recargar. Las entradas largas pueden procesarse lentamente. En las pruebas, la compresión automática del contexto no terminó dentro del límite de 300 segundos del cliente. El modelo probado no admite la salida JSON forzada ni las imágenes de entrada.
