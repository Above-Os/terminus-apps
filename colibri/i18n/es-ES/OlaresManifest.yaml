metadata:
  title: Colibri
  description: Un motor de IA local para modelos MoE más grandes con menos memoria residente
spec:
  fullDescription: |
    Colibri es un motor de IA local con una interfaz web de chat. Para los modelos de mezcla de expertos (MoE) compatibles, lee los pesos de los expertos del disco según se necesitan. Así reduce los pesos que deben permanecer en la memoria del sistema o de la GPU, a cambio de respuestas que pueden ser más lentas.

    El perfil opcional low-memory-moe usa un presupuesto RAM de 4 GB para el motor y un presupuesto de caché de expertos de 2 GiB. No son límites para toda la aplicación. El sistema también puede usar caché de archivos recuperable. Los requisitos reales dependen del modelo y del contexto. standard sigue siendo el perfil predeterminado. Elija este perfil para ejecutar un modelo MoE más grande si acepta un menor rendimiento.

    **Funciones principales**

    - Explorar archivos GGUF existentes, cambiar de modelo local y restaurar la selección guardada después de reiniciar.
    - Conversar con respuestas que se muestran de forma progresiva y utilizar API compatibles con OpenAI y Anthropic.
    - Consultar la velocidad de generación y el tiempo dedicado a cada fase de inferencia.
    - Ejecutar localmente un modelo GGUF compatible o conectar la interfaz a un Olares Router instalado y a su ruta default-chat.
    - Abrir la aplicación privada mediante el inicio de sesión de Olares sin introducir la clave API interna de la aplicación en el navegador.

    **Antes de instalar**

    Seleccione en la aplicación un GGUF compatible del directorio compartido de modelos de Hugging Face. La instalación puede completarse antes de elegir un modelo. Los pesos de los modelos no se incluyen ni se descargan automáticamente. La dirección del Router se rellena a partir del dominio Olares del usuario que instala la aplicación y se puede sustituir.

    Esta versión preliminar requiere una GPU NVIDIA y un controlador NVIDIA compatible con CUDA 13.0. Está compilada para Blackwell sm_120 y se ha probado en una RTX 5090 Laptop GPU. El equipo debe usar amd64 con AVX2 (x86-64-v3). Esta compilación no admite arquitecturas de GPU NVIDIA más antiguas.

    **Limitaciones de la versión preliminar**

    El historial de chat y los parámetros de generación no se conservan al recargar la página. Exporte las conversaciones antes de recargar. Las entradas largas pueden procesarse lentamente. En las pruebas, la compresión automática del contexto no terminó dentro del límite de 300 segundos del cliente. El modelo probado no admite la salida JSON forzada ni las imágenes de entrada.
