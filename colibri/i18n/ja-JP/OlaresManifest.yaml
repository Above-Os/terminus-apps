metadata:
  title: Colibri
  description: チャットと互換API向けにモデルのエキスパートをディスクから読み込むローカルAIエンジン
spec:
  fullDescription: |
    Colibriは、オープンなモデルと対話するためのWebインターフェースを備えたローカルAIエンジンです。Mixture-of-Expertsモデルでは、すべてのエキスパートをメモリに常駐させる代わりに、各応答に必要なエキスパートをディスクから読み込めます。

    **主な機能**

    - ストリーミング応答で対話し、OpenAIおよびAnthropic互換のAPIを利用できます。
    - 生成速度や推論の各段階にかかった時間を確認できます。
    - 対応するGGUFモデルをローカルで実行するか、インストール済みのOlares Routerとそのdefault-chatルートへ接続を切り替えられます。
    - アプリ内部のAPIキーをブラウザに入力せず、Olaresへのログインを通じて非公開アプリにアクセスできます。

    **インストール前の確認事項**

    共有Hugging Faceモデルディレクトリ内にある、対応する既存のGGUFファイルを指定してください。モデルの重みは同梱されず、自動ダウンロードも行われません。Routerのアドレスは、インストールするユーザーのOlaresドメインから自動入力され、上書きも可能です。

    このプレビュー版はAVX2（x86-64-v3）対応のamd64 CPUをサポートします。NVIDIAイメージはBlackwell sm_120ハードウェア向けにビルドされ、RTX 5090 Laptop GPUでテストされています。旧世代のGPUに対応する汎用CUDAビルドではありません。

    **プレビュー版の制限**

    ページを再読み込みすると、チャット履歴と生成パラメータは保持されません。再読み込みの前に会話をエクスポートしてください。長い入力の処理には時間がかかる場合があります。テストでは、自動コンテキスト圧縮がクライアントの制限時間である300秒以内に完了しませんでした。テストしたモデルは、強制JSON出力と画像入力に対応していません。
