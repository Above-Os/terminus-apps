metadata:
  title: Colibri
  description: 少ない常駐メモリで大きな MoE モデルを動かすローカル AI エンジン
spec:
  fullDescription: |
    ColibriはWebチャット画面を備えたローカルAIエンジンです。MoEモデルのエキスパートの重みを必要に応じてディスクから読み込みます。

    ColibriではシステムメモリとGPUメモリの上限を設定できます。GPUメモリ上限を0にするとCPUのみで推論します。リソースが限られていても、対応する大きなMoEモデルの実行を試せますが、特に入力が長い場合、最初の応答までの待ち時間や生成速度が大幅に悪化することがあります。システムメモリやGPUメモリを増やすと、一般に性能の改善が期待できます。実際の性能はモデル、量子化方式、入力の長さによって異なります。

    **主な機能**

    - 既存のGGUFファイルを検索してローカルモデルを切り替え、再起動後も保存した選択を復元できます。
    - ストリーミング応答で対話し、OpenAIおよびAnthropic互換のAPIを利用できます。
    - 生成速度や推論の各段階にかかった時間を確認できます。
    - 対応するGGUFモデルをローカルで実行するか、インストール済みのOlares Routerとそのdefault-chatルートへ接続を切り替えられます。
    - アプリ内部のAPIキーをブラウザに入力せず、Olaresへのログインを通じて非公開アプリにアクセスできます。

    **インストール前の確認事項**

    アプリ内で共有Hugging Faceモデルディレクトリから対応するGGUFを選択できます。モデルを選択する前にインストールを完了できます。モデルの重みは同梱されず、自動ダウンロードも行われません。Routerのアドレスは、インストールするユーザーのOlaresドメインから自動入力され、上書きも可能です。

    インストールには、AVX2（x86-64-v3）対応のamd64ホストとNVIDIAデバイスが必要です。GPU高速化にはCUDA 13.0互換ドライバーが必要で、このビルドはBlackwell sm_120向けに作成され、RTX 5090 Laptop GPUでテストされています。GPUメモリ上限を0にすると、同じインストール入口からCPU推論を実行します。その場合もOlaresにはNVIDIAデバイスとの関連付けが残ります。

    **プレビュー版の制限**

    低メモリモードは、限られたメモリで対応するMoEモデルを実行することを優先します。デフォルトのリソース設定では、特に長い入力では標準モードより応答が大幅に遅くなり、リクエストがタイムアウトする場合があります。リソースに余裕があれば、応答速度を改善するために標準モードを選んでください。入力を短くすることも待ち時間の短縮に役立ちます。

    ページを再読み込みすると、チャット履歴と生成パラメータは保持されません。再読み込みの前に会話をエクスポートしてください。長い入力の処理には時間がかかる場合があります。テストでは、自動コンテキスト圧縮がクライアントの制限時間である300秒以内に完了しませんでした。テストしたモデルは、強制JSON出力と画像入力に対応していません。
