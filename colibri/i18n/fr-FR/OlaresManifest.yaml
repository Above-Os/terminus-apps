metadata:
  title: Colibri
  description: Un moteur IA local pour des modèles MoE plus grands avec moins de mémoire résidente
spec:
  fullDescription: |
    Colibri est un moteur IA local avec une interface de chat web. Pour les modèles à mélange d’experts (MoE) pris en charge, il lit les poids des experts sur disque selon les besoins. Il réduit ainsi les poids conservés en mémoire système ou GPU, au prix de réponses potentiellement plus lentes.

    Le profil facultatif low-memory-moe utilise un budget RAM de 4 GB pour le moteur et un budget de cache d’experts de 2 GiB. Ce ne sont pas des plafonds pour toute l’application. Le système peut aussi utiliser un cache de fichiers récupérable. Les besoins réels dépendent du modèle et du contexte. standard reste le profil par défaut. Choisissez ce profil pour faire fonctionner un plus grand modèle MoE en acceptant un débit plus faible.

    **Fonctionnalités principales**

    - Parcourir les fichiers GGUF existants, changer de modèle local et retrouver la sélection enregistrée après un redémarrage.
    - Dialoguer avec des réponses diffusées progressivement et utiliser des API compatibles avec OpenAI et Anthropic.
    - Consulter la vitesse de génération et le temps consacré à chaque phase d’inférence.
    - Exécuter localement un modèle GGUF pris en charge, ou connecter l’interface à un Olares Router installé et à sa route default-chat.
    - Ouvrir l’application privée via la connexion Olares sans saisir sa clé API interne dans le navigateur.

    **Avant l’installation**

    Choisissez dans l’application un GGUF pris en charge depuis le répertoire partagé des modèles Hugging Face. L’installation peut se terminer avant la sélection d’un modèle. Les poids des modèles ne sont pas inclus et ne sont pas téléchargés automatiquement. L’adresse du Router est renseignée à partir du domaine Olares de l’utilisateur qui installe l’application et peut être remplacée.

    Cette version d’aperçu nécessite un GPU NVIDIA et un pilote NVIDIA compatible avec CUDA 13.0. Elle cible Blackwell sm_120 et a été testée sur une RTX 5090 Laptop GPU. L’hôte doit utiliser l’architecture amd64 avec AVX2 (x86-64-v3). Les architectures de GPU NVIDIA plus anciennes ne sont pas prises en charge par cette version.

    **Limites de la version d’aperçu**

    L’historique des conversations et les paramètres de génération ne sont pas conservés lors du rechargement de la page. Exportez les conversations avant de recharger. Le traitement des longues entrées peut être lent. Lors des tests, la compression automatique du contexte n’a pas abouti dans la limite de 300 secondes du client. Le modèle testé ne prend en charge ni la sortie JSON imposée ni les images en entrée.
