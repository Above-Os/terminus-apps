metadata:
  title: Colibri
  description: Un moteur IA local pour des modèles MoE plus grands avec moins de mémoire résidente
spec:
  fullDescription: |
    Colibri est un moteur IA local avec une interface de chat web. Il lit les poids des experts des modèles MoE sur disque selon les besoins.

    Colibri permet de définir les limites de mémoire système et de mémoire GPU. Avec une limite de mémoire GPU de 0, l’inférence s’exécute uniquement sur CPU. Vous pouvez essayer d’exécuter de plus grands modèles MoE pris en charge avec des ressources limitées, mais l’attente avant la première réponse et la vitesse de génération peuvent se dégrader nettement, surtout avec des entrées longues. Davantage de mémoire système ou GPU peut généralement améliorer les performances. Les performances réelles dépendent du modèle, de la quantification et de la longueur de l’entrée.

    **Fonctionnalités principales**

    - Parcourir les fichiers GGUF existants, changer de modèle local et retrouver la sélection enregistrée après un redémarrage.
    - Dialoguer avec des réponses diffusées progressivement et utiliser des API compatibles avec OpenAI et Anthropic.
    - Consulter la vitesse de génération et le temps consacré à chaque phase d’inférence.
    - Exécuter localement un modèle GGUF pris en charge, ou connecter l’interface à un Olares Router installé et à sa route default-chat.
    - Ouvrir l’application privée via la connexion Olares sans saisir sa clé API interne dans le navigateur.

    **Avant l’installation**

    Choisissez dans l’application un GGUF pris en charge depuis le répertoire partagé des modèles Hugging Face. L’installation peut se terminer avant la sélection d’un modèle. Les poids des modèles ne sont pas inclus et ne sont pas téléchargés automatiquement. L’adresse du Router est renseignée à partir du domaine Olares de l’utilisateur qui installe l’application et peut être remplacée.

    L’installation nécessite un hôte amd64 avec AVX2 (x86-64-v3) et un périphérique NVIDIA. L’accélération GPU exige un pilote compatible avec CUDA 13.0, cible Blackwell sm_120 et a été testée sur une RTX 5090 Laptop GPU. Définissez la limite de mémoire GPU sur 0 pour exécuter l’inférence sur CPU via la même entrée d’installation. Olares conserve alors une liaison avec un périphérique NVIDIA.

    **Limites de la version d’aperçu**

    Le mode à faible consommation de mémoire privilégie l’exécution de modèles MoE compatibles avec une mémoire limitée. Ses paramètres de ressources par défaut peuvent rendre les réponses bien plus lentes qu’en mode standard, surtout avec de longues entrées, et les requêtes peuvent expirer. Si les ressources le permettent, choisissez le mode standard pour une meilleure réactivité. Des entrées plus courtes peuvent aussi réduire l’attente.

    L’historique des conversations et les paramètres de génération ne sont pas conservés lors du rechargement de la page. Exportez les conversations avant de recharger. Le traitement des longues entrées peut être lent. Lors des tests, la compression automatique du contexte n’a pas abouti dans la limite de 300 secondes du client. Le modèle testé ne prend en charge ni la sortie JSON imposée ni les images en entrée.
