metadata:
  title: Colibri
  description: Moteur d’IA local qui charge les experts du modèle depuis le disque pour le chat et les API compatibles
spec:
  fullDescription: |
    Colibri est un moteur d’IA local doté d’une interface web pour dialoguer avec des modèles ouverts. Pour les modèles à mélange d’experts, il peut lire sur le disque les experts nécessaires à chaque réponse au lieu de conserver tous les experts en mémoire.

    **Fonctionnalités principales**

    - Dialoguer avec des réponses diffusées progressivement et utiliser des API compatibles avec OpenAI et Anthropic.
    - Consulter la vitesse de génération et le temps consacré à chaque phase d’inférence.
    - Exécuter localement un modèle GGUF pris en charge, ou connecter l’interface à un Olares Router installé et à sa route default-chat.
    - Ouvrir l’application privée via la connexion Olares sans saisir sa clé API interne dans le navigateur.

    **Avant l’installation**

    Fournissez un fichier GGUF existant et pris en charge depuis le répertoire partagé des modèles Hugging Face. Les poids des modèles ne sont pas inclus et ne sont pas téléchargés automatiquement. L’adresse du Router est renseignée à partir du domaine Olares de l’utilisateur qui installe l’application et peut être remplacée.

    Cette version d’aperçu prend en charge les CPU amd64 avec AVX2 (x86-64-v3). L’image NVIDIA est conçue pour le matériel Blackwell sm_120 et a été testée sur une RTX 5090 Laptop GPU. Ce n’est pas une version CUDA générique pour les GPU plus anciens. Le mode CPU reste disponible.

    **Limites de la version d’aperçu**

    L’historique des conversations et les paramètres de génération ne sont pas conservés lors du rechargement de la page. Exportez les conversations avant de recharger. Le traitement des longues entrées peut être lent. Lors des tests, la compression automatique du contexte n’a pas abouti dans la limite de 300 secondes du client. Le modèle testé ne prend en charge ni la sortie JSON imposée ni les images en entrée.
