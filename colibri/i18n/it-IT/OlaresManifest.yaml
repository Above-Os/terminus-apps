metadata:
  title: Colibri
  description: Motore IA locale che carica gli esperti del modello da disco per chat e API compatibili
spec:
  fullDescription: |
    Colibri è un motore IA locale con un’interfaccia web per conversare con modelli aperti. Per i modelli mixture-of-experts, può leggere dal disco gli esperti necessari a ogni risposta invece di mantenerli tutti in memoria.

    **Funzionalità principali**

    - Sfogliare i file GGUF esistenti, cambiare modello locale e ripristinare la selezione salvata dopo un riavvio.
    - Conversare con risposte visualizzate progressivamente e utilizzare API compatibili con OpenAI e Anthropic.
    - Esaminare la velocità di generazione e il tempo impiegato in ogni fase dell’inferenza.
    - Eseguire localmente un modello GGUF supportato oppure collegare l’interfaccia a un Olares Router installato e alla sua route default-chat.
    - Aprire l’app privata tramite l’accesso Olares senza inserire nel browser la chiave API interna dell’app.

    **Prima dell’installazione**

    Scegliere nell’app un GGUF supportato dalla directory condivisa dei modelli Hugging Face. L’installazione può essere completata prima della scelta del modello. I pesi dei modelli non sono inclusi e non vengono scaricati automaticamente. L’indirizzo del Router viene compilato in base al dominio Olares dell’utente che installa l’app e può essere sostituito.

    Questa anteprima supporta CPU amd64 con AVX2 (x86-64-v3). L’immagine NVIDIA usa CUDA 13.0, richiede un driver NVIDIA compatibile ed è compilata per hardware Blackwell sm_120 ed è stata testata su una RTX 5090 Laptop GPU. Non è una build CUDA generica per GPU meno recenti.

    **Limiti dell’anteprima**

    La cronologia della chat e i parametri di generazione non vengono conservati quando si ricarica la pagina. Esportare le conversazioni prima di ricaricare. L’elaborazione di input lunghi può essere lenta. Nei test, la compressione automatica del contesto non è stata completata entro il limite di 300 secondi del client. Il modello testato non supporta né l’output JSON forzato né le immagini in ingresso.
