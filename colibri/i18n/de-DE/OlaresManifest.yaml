metadata:
  title: Colibri
  description: Lokale KI-Engine, die Modellexperten für Chats und kompatible APIs vom Datenträger lädt
spec:
  fullDescription: |
    Colibri ist eine lokale KI-Engine mit einer Weboberfläche für Gespräche mit offenen Modellen. Bei Mixture-of-Experts-Modellen kann sie die für eine Antwort benötigten Experten vom Datenträger lesen, statt alle Experten im Arbeitsspeicher zu halten.

    **Wichtige Funktionen**

    - Chats mit fortlaufend ausgegebenen Antworten und kompatiblen OpenAI- und Anthropic-APIs nutzen.
    - Die Generierungsgeschwindigkeit und den Zeitaufwand der einzelnen Inferenzphasen prüfen.
    - Ein unterstütztes GGUF-Modell lokal ausführen oder die Oberfläche auf einen installierten Olares Router und dessen default-chat-Route umschalten.
    - Die private App über die Olares-Anmeldung öffnen, ohne den internen API-Schlüssel der App im Browser einzugeben.

    **Vor der Installation**

    Stellen Sie eine vorhandene, unterstützte GGUF-Datei aus dem gemeinsamen Hugging Face-Modellverzeichnis bereit. Modellgewichte sind nicht enthalten und werden nicht automatisch heruntergeladen. Die Router-Adresse wird anhand der Olares-Domain des installierenden Benutzers eingetragen und kann überschrieben werden.

    Diese Vorschau unterstützt amd64-CPUs mit AVX2 (x86-64-v3). Das NVIDIA-Image wurde für Blackwell-sm_120-Hardware erstellt und auf einer RTX 5090 Laptop GPU getestet. Es ist kein allgemeiner CUDA-Build für ältere GPUs. Der CPU-Modus bleibt auswählbar.

    **Einschränkungen der Vorschau**

    Chatverlauf und Generierungsparameter bleiben beim Neuladen der Seite nicht erhalten. Exportieren Sie Gespräche vor dem Neuladen. Lange Eingaben können langsam verarbeitet werden. Die automatische Kontextkomprimierung wurde im Test nicht innerhalb des clientseitigen Zeitlimits von 300 Sekunden abgeschlossen. Das getestete Modell unterstützt weder erzwungene JSON-Ausgabe noch Bildeingaben.
