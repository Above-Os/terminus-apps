metadata:
  title: Colibri
  description: Eine lokale KI-Engine für größere MoE-Modelle mit weniger residentem Speicher
spec:
  fullDescription: |
    Colibri ist eine lokale KI-Engine mit einer Weboberfläche für Chats. Sie liest die Expertengewichte von MoE-Modellen bei Bedarf vom Datenträger.

    Bei Colibri können Sie die Limits für Arbeitsspeicher und GPU-Speicher festlegen oder ausschließlich die CPU verwenden. Auch mit begrenzten Ressourcen können Sie versuchen, größere unterstützte MoE-Modelle auszuführen. Dabei können sich die Wartezeit bis zur ersten Antwort und die Generierungsgeschwindigkeit deutlich verschlechtern, insbesondere bei langen Eingaben. Mehr Arbeits- oder GPU-Speicher kann die Leistung in der Regel verbessern. Die tatsächliche Leistung hängt vom Modell, der Quantisierung und der Eingabelänge ab.

    **Wichtige Funktionen**

    - Vorhandene GGUF-Dateien durchsuchen, lokale Modelle wechseln und die gespeicherte Auswahl nach einem Neustart wiederherstellen.
    - Chats mit fortlaufend ausgegebenen Antworten und kompatiblen OpenAI- und Anthropic-APIs nutzen.
    - Die Generierungsgeschwindigkeit und den Zeitaufwand der einzelnen Inferenzphasen prüfen.
    - Ein unterstütztes GGUF-Modell lokal ausführen oder die Oberfläche auf einen installierten Olares Router und dessen default-chat-Route umschalten.
    - Die private App über die Olares-Anmeldung öffnen, ohne den internen API-Schlüssel der App im Browser einzugeben.

    **Vor der Installation**

    Wählen Sie in der App eine unterstützte GGUF-Datei aus dem gemeinsamen Hugging Face-Modellverzeichnis. Die Installation kann vor der Modellauswahl abgeschlossen werden. Modellgewichte sind nicht enthalten und werden nicht automatisch heruntergeladen. Die Router-Adresse wird anhand der Olares-Domain des installierenden Benutzers eingetragen und kann überschrieben werden.

    Dieser Build unterstützt die CPU-Ausführung ohne GPU-Zuweisung sowie optionale NVIDIA-Beschleunigung. Beide benötigen amd64 mit AVX2 (x86-64-v3). Die NVIDIA-Beschleunigung erfordert einen CUDA-13.0-kompatiblen Treiber, zielt auf Blackwell sm_120 und wurde auf einer RTX 5090 Laptop GPU getestet. Ältere NVIDIA-GPU-Architekturen werden von diesem Build nicht unterstützt.

    **Einschränkungen der Vorschau**

    Der Modus mit geringem Speicherbedarf ermöglicht vorrangig die Ausführung unterstützter MoE-Modelle bei begrenztem Speicher. Seine standardmäßige Ressourcenzuteilung kann zu deutlich langsameren Antworten als im Standardmodus führen, insbesondere bei langen Eingaben. Anfragen können das Zeitlimit überschreiten. Wählen Sie bei ausreichenden Ressourcen den Standardmodus für schnellere Antworten. Kürzere Eingaben können die Wartezeit verkürzen.

    Chatverlauf und Generierungsparameter bleiben beim Neuladen der Seite nicht erhalten. Exportieren Sie Gespräche vor dem Neuladen. Lange Eingaben können langsam verarbeitet werden. Die automatische Kontextkomprimierung wurde im Test nicht innerhalb des clientseitigen Zeitlimits von 300 Sekunden abgeschlossen. Das getestete Modell unterstützt weder erzwungene JSON-Ausgabe noch Bildeingaben.
