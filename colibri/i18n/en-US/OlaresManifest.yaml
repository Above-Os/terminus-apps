metadata:
  title: Colibri
  description: A local AI engine for running larger MoE models with less resident memory
spec:
  fullDescription: |
    Colibri is a local AI engine with a web chat interface. It reads MoE expert weights from disk as needed.

    Colibri lets you set system RAM and GPU memory limits, or run entirely on the CPU. You can try running larger supported MoE models with limited resources, but the wait for the first response and generation speed may worsen significantly, especially with long inputs. More RAM or GPU memory can generally improve performance. Actual performance depends on the model, quantization and input length.

    **Key features**

    - Browse existing GGUF files, switch local models, and restore your saved selection after restart.
    - Chat with streamed responses and use compatible OpenAI and Anthropic APIs.
    - Inspect generation speed and the time spent in each inference phase.
    - Run a supported GGUF model locally, or switch the interface to an installed Olares Router and its default-chat route.
    - Open the private app through Olares sign-in without entering the app's internal API key in the browser.

    **Before installing**

    Choose a supported GGUF from the shared Hugging Face model directory in the app. Installation can complete before a model is selected. Model weights are not bundled or downloaded automatically. The Router address is filled from the installing user's Olares domain and can be overridden.

    This build supports CPU execution without a GPU allocation and optional NVIDIA acceleration. Both paths require amd64 with AVX2 (x86-64-v3). NVIDIA acceleration requires a CUDA 13.0-compatible driver and targets Blackwell sm_120; it has been tested on an RTX 5090 Laptop GPU. Older NVIDIA GPU architectures are not supported by this build.

    **Preview limitations**

    Low-memory mode prioritizes running supported MoE models with limited memory. Its default resource settings can make responses much slower than standard mode, especially with long inputs, and requests may time out. When resources allow, choose standard mode for better responsiveness. Shorter inputs can help reduce waiting times.

    Chat history and generation parameters are not retained when the page is refreshed; export conversations before refreshing. Long inputs can be slow, and automatic context compaction did not finish within the 300-second client limit in testing. The tested model does not support forced JSON output or image input.
