metadata:
  title: Colibri
  description: 按需从磁盘加载模型专家、支持对话与兼容 API 的本地 AI 引擎
spec:
  fullDescription: |
    Colibri 是一款带有网页界面的本地 AI 引擎，可用于与开放模型对话。对于混合专家（MoE）模型，Colibri 可按需从磁盘读取响应所需的专家权重，而不必将所有专家常驻内存。

    **主要功能**

    - 支持流式对话，并提供兼容 OpenAI 和 Anthropic 的 API。
    - 查看生成速度以及推理各阶段的耗时。
    - 在本地运行受支持的 GGUF 模型，或将界面切换到已安装的 Olares Router，使用 default-chat 路由。
    - 通过 Olares 登录访问私有应用，无需在浏览器输入应用的内部 API key。

    **安装前须知**

    请提供共享 Hugging Face 模型目录内已有、受支持的 GGUF 文件。应用不附带模型权重，也不会自动下载权重。Router 地址会根据安装用户的 Olares 域名预填，也可自行覆盖。

    此预览版支持具备 AVX2（x86-64-v3）的 amd64 CPU。NVIDIA 镜像使用 CUDA 13.0，需要兼容的 NVIDIA 驱动，针对 Blackwell sm_120 硬件构建，已在 RTX 5090 Laptop GPU 上测试；它不是兼容旧款 GPU 的通用 CUDA 构建。安装时仍可选择 CPU 模式。

    **预览版限制**

    刷新网页后不会保留聊天记录和生成参数，请先导出需要保存的对话。长输入处理可能较慢，自动上下文压缩在测试中未能在客户端的 300 秒时限内完成。已测试的模型不支持强制 JSON 输出或图片输入。
