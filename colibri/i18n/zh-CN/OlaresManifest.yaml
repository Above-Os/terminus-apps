metadata:
  title: Colibri
  description: 以较少常驻内存运行较大 MoE 模型的本地 AI 引擎
spec:
  fullDescription: |
    Colibri 是一款带有网页聊天界面的本地 AI 引擎。它可按需从磁盘读取 MoE 模型的专家权重。

    支持自定义系统内存和显存额度，也可选择纯 CPU 运行。Colibri 可在资源有限时尝试运行较大的 MoE 模型，但首次响应和生成速度可能明显下降，尤其是长输入。增加内存或显存通常有助于改善性能，实际表现取决于模型、量化方式和输入长度。

    **主要功能**

    - 扫描已有 GGUF 文件、切换本地模型，并在重启后恢复保存的选择。
    - 支持流式对话，并提供兼容 OpenAI 和 Anthropic 的 API。
    - 查看生成速度以及推理各阶段的耗时。
    - 在本地运行受支持的 GGUF 模型，或将界面切换到已安装的 Olares Router，使用 default-chat 路由。
    - 通过 Olares 登录访问私有应用，无需在浏览器输入应用的内部 API key。

    **安装前须知**

    在应用内扫描并选择共享 Hugging Face 模型目录中的 GGUF。无需预先指定模型路径，也可以先完成安装再选择模型。应用不附带模型权重，也不会自动下载权重。Router 地址会根据安装用户的 Olares 域名预填，也可自行覆盖。

    此构建支持不分配 GPU 的 CPU 运行，也可使用 NVIDIA GPU 加速。两种方式均需支持 AVX2（x86-64-v3）的 amd64 主机。NVIDIA 加速需要兼容 CUDA 13.0 的驱动，面向 Blackwell sm_120 构建，已在 RTX 5090 Laptop GPU 上测试；此构建不支持旧款 NVIDIA GPU 架构。

    **预览版限制**

    低内存模式优先让受支持的 MoE 模型在有限内存下运行。默认资源设置下，响应可能比标准模式慢得多，尤其是长输入，还可能出现请求超时。资源允许时，建议选择标准模式以改善响应速度；缩短输入也有助于减少等待时间。

    刷新网页后不会保留聊天记录和生成参数，请先导出需要保存的对话。长输入处理可能较慢，自动上下文压缩在测试中未能在客户端的 300 秒时限内完成。已测试的模型不支持强制 JSON 输出或图片输入。
