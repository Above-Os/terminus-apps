  name: colibri
  appid: colibri
  title: Colibri
  description: A local AI engine that loads model experts from disk for chat and compatible APIs
  icon: https://cdn.olares.com/images/2026/11/0d7c6155e1f20ef56847d1ea2b1f365a.png
  version: 0.2.15
  categories:
  - Developer Tools
  - Utilities_v112
