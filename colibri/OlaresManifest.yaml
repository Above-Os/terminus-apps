permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
workloadReplicas:
  colibri: 1
envs:
- envName: SYSTEM_LANGUAGE
  valueFrom:
    envName: OLARES_USER_LANGUAGE
- envName: INFERENCE_PROFILE
  type: string
  default: standard
  required: true
  editable: true
  applyOnChange: true
  regex: ^(standard|low-memory-moe)$
  options:
  - title: Standard
    value: standard
  - title: Low-memory MoE
    value: low-memory-moe
  description: 'Both modes use GPU_MEMORY_LIMIT for GPU allocation and MEMORY_LIMIT for RAM. Standard enables CUDA chain execution; low-memory MoE uses staged execution. The former fixed 2 GiB GPU budget is removed. Switching restarts the app.'
- envName: CONTEXT_LENGTH
  type: int
  default: '16384'
  required: true
  editable: true
  applyOnChange: true
  regex: ^(16384|32768|65536|131072)$
  options:
  - title: 16384 tokens
    value: '16384'
  - title: 32768 tokens
    value: '32768'
  - title: 65536 tokens
    value: '65536'
  - title: 131072 tokens
    value: '131072'
  description: 'Local model context length in tokens, including conversation and reply. Default: 16384. Larger values need more memory and must be supported by the selected model. Changing this restarts the app.'
- envName: ROUTER_BASE_URL
  type: url
  required: false
  editable: true
  applyOnChange: true
  regex: ^https://[a-zA-Z0-9.-]+/v1$
  description: Optional Router API override. Leave blank to use the installing user's Olares Router address.
- envName: MEMORY_LIMIT
  type: string
  required: true
  editable: true
  applyOnChange: true
  regex: ^[1-9][0-9]{0,6}(Mi|Gi)$
  description: |
    设置 Colibri 整个容器的内存上限（系统内存，不是 GPU 显存）。它不是预先占用或保证预留的内存。
    填写带单位的正整数，例如 32Gi、48Gi 或 49152Mi；1Gi = 1024Mi。不能填写 48GB 或只填 48。配置最低接受 2Gi，但模型实际所需内存可能远高于此值。
    应用自动将上限的 75% 换算为引擎预算（十进制 GB，向下取整）：32Gi 对应 25 GB，48Gi 对应 38 GB，64Gi 对应 51 GB；无需再设置 RAM_GB。
    其余部分作为运行时、上下文和文件缓存的余量。75% 是保守起点，不保证所有模型或长上下文都能运行。调度预留固定为 256Mi，不需要填写 MEMORY_REQUEST。
    请结合机器可用内存和其他应用用量设置。填写更大的值不会增加物理内存；达到容器上限时，系统可能终止进程。该设置不会改变 GPU 显存分配。
    保存修改后会重启应用并重新加载已选择的模型，请先保存需要的对话。

    Total system-RAM limit for the Colibri container, not GPU memory or a preallocated reservation.
    Enter a positive whole-number quantity such as 32Gi, 48Gi or 49152Mi (1Gi = 1024Mi), not 48GB or a bare 48. The minimum accepted setting is 2Gi; a model may require much more.
    The engine budget is calculated as floor(limit bytes x 0.75 / 1,000,000,000) GB: 32Gi -> 25 GB, 48Gi -> 38 GB, 64Gi -> 51 GB. RAM_GB is automatic. Scheduling reservation is fixed at 256Mi.
    The remaining headroom is for runtime overhead, context and file cache; 75% is a conservative starting policy, not a guarantee for every model or context. Stay within available machine resources. Exceeding the container limit may terminate the process. Saving changes restarts the app and reloads the selected model; save important conversations first.
- envName: GPU_MEMORY_LIMIT
  type: string
  required: true
  editable: false
  applyOnChange: false
  regex: ^(0|0Mi|0Gi|[1-9][0-9]{0,6}(Mi|Gi))$
  description: |
    分配给 Colibri 的总显存额度，例如 8Gi、16Gi 或 16384Mi。显存填 0 时关闭 CUDA 并使用 CPU 推理，无需另选 CPU 模式；平台仍会记录 NVIDIA 设备绑定。正数必须填写单位，最低4Gi；请勿超过所选显卡的可用显存。此项与系统内存 MEMORY_LIMIT 相互独立。
    该额度用于整个应用的GPU分配，包含模型权重、专家缓存和计算缓冲区，不会启动后立即占满，也不是额外的一份专家缓存。设置16Gi时，Olares按16Gi分配；内部暂留2Gi给CUDA及临时缓冲，其余用于引擎放置模型。
    显存额度在安装时确定，安装后不可直接编辑；改变额度需保留数据重装，以便平台重新分配。模型、架构及上下文会影响实际占用；应通过实际运行验证，显存不足可能导致加载或生成失败。

    Use the NVIDIA installation entry for all settings. Set 0 to disable CUDA and run CPU inference; there is no separate CPU install mode. Olares still records an NVIDIA device binding. Positive total GPU-memory allocation, e.g. 8Gi, 16Gi or 16384Mi (minimum 4Gi), separate from system RAM. Do not exceed the selected GPU's available memory.
    Olares receives the full allocation. Two GiB are kept as fixed runtime/buffer headroom; the remaining placement budget is passed to the engine. Model weights and expert cache share that budget; memory is not necessarily occupied immediately. This is install-time only; changing the allocation requires a data-preserving reinstall so Olares recalculates the GPU requirement. Actual use depends on model family and context; other families require validation.
