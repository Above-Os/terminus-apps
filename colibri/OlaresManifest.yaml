    requiredMemory: 512Mi
    limitedMemory: 27Gi
    requiredDisk: 1Gi
    limitedDisk: 5Gi
    requiredGPUMemory: 1Gi
    limitedGPUMemory: 22Gi
  fullDescription: |
    Colibri is a local AI engine with a web interface for chatting with open models. For mixture-of-experts models, it can read the experts needed for each response from disk instead of keeping every expert in memory.

    **Key features**

    - Browse existing GGUF files, switch local models, and restore your saved selection after restart.
    - Chat with streamed responses and use compatible OpenAI and Anthropic APIs.
    - Inspect generation speed and the time spent in each inference phase.
    - Run a supported GGUF model locally, or switch the interface to an installed Olares Router and its default-chat route.
    - Open the private app through Olares sign-in without entering the app's internal API key in the browser.

    **Before installing**

    Choose a supported GGUF from the shared Hugging Face model directory in the app. Installation can complete before a model is selected. Model weights are not bundled or downloaded automatically. The Router address is filled from the installing user's Olares domain and can be overridden.

    This preview requires an NVIDIA GPU and a CUDA 13.0-compatible NVIDIA driver. It targets Blackwell sm_120 and has been tested on an RTX 5090 Laptop GPU. The host must use amd64 with AVX2 (x86-64-v3). Older NVIDIA GPU architectures are not supported by this build.

    **Preview limitations**

    Chat history and generation parameters are not retained when the page is refreshed; export conversations before refreshing. Long inputs can be slow, and automatic context compaction did not finish within the 300-second client limit in testing. The tested model does not support forced JSON output or image input.
  developer: JustVugg
  website: https://github.com/JustVugg/colibri
  sourceCode: https://github.com/JustVugg/colibri
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - fr-FR
  - es-ES
  - it-IT
  - ja-JP
  doc: https://github.com/JustVugg/colibri/blob/0a5504a1dc64f86fcd0fe7db298b0448c730e7e6/README.md
  license:
  - text: Apache-2.0
    url: https://github.com/JustVugg/colibri/blob/0a5504a1dc64f86fcd0fe7db298b0448c730e7e6/LICENSE
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
workloadReplicas:
  colibri: 1
envs:
- envName: ROUTER_BASE_URL
  type: url
  required: false
  editable: true
  applyOnChange: true
  regex: ^https://[a-zA-Z0-9.-]+/v1$
  description: Optional Router API override. Leave blank to use the installing user's Olares Router address.
- envName: MODEL_GGUF
  type: string
  required: false
  editable: true
  applyOnChange: true
  regex: ^(/models/.+\.gguf)?$
  description: Optional initial GGUF under /models. Leave blank to scan and choose a model in the app. Saved app selection takes precedence.
- envName: RAM_GB
  type: int
  default: '16'
  required: true
  editable: true
  applyOnChange: true
  regex: ^([1-9]|1[0-8])$
  description: Engine RAM budget in GB (1–18); larger models require increasing the chart memory resources first.
