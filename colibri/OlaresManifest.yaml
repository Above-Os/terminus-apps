olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: colibri
  appid: colibri
  title: Colibri
  description: A local AI engine for running larger MoE models with less resident memory
  icon: https://cdn.olares.com/images/2026/11/0d7c6155e1f20ef56847d1ea2b1f365a.png
  version: 0.2.24
  categories:
  - Developer Tools
  - Utilities_v112
  - models
entrances:
- name: colibri
  host: colibri
  port: 8000
  title: Colibri
  icon: https://cdn.olares.com/images/2026/11/0d7c6155e1f20ef56847d1ea2b1f365a.png
  authLevel: private
  openMethod: window
spec:
  versionName: 2.1.0
  featuredImage: https://cdn.olares.com/images/2026/11/498af9c6be7f96d478abdb4c058e250c.png
  promoteImage:
  - https://cdn.olares.com/images/2026/11/498af9c6be7f96d478abdb4c058e250c.png
  - https://cdn.olares.com/images/2026/11/d4cac52295afe30b4d444cb4b52c4205.png
  - https://cdn.olares.com/images/2026/11/602c5d6ec45b4e6a3cff563e1d03f885.png
  runAsUser: true
  supportArch:
  - amd64
  accelerator:
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: 600m
    limitedCpu: '11'
    requiredMemory: 512Mi
    limitedMemory: 27Gi
    requiredDisk: 512Mi
    limitedDisk: 5Gi
    requiredGPUMemory: 1Gi
    limitedGPUMemory: 22Gi
  fullDescription: |
    Colibri is a local AI engine with a web chat interface. It reads expert weights from disk as needed, allowing supported MoE models to run with less resident system memory and GPU memory. Choose low-memory mode to reduce resident resource use, at the cost of potentially slower replies. Actual requirements and speed depend on the model, quantization, and context length.

    **Key features**

    - Browse existing GGUF files, switch local models, and restore your saved selection after restart.
    - Chat with streamed responses and use compatible OpenAI and Anthropic APIs.
    - Inspect generation speed and the time spent in each inference phase.
    - Run a supported GGUF model locally, or switch the interface to an installed Olares Router and its default-chat route.
    - Open the private app through Olares sign-in without entering the app's internal API key in the browser.

    **Before installing**

    Choose a supported GGUF from the shared Hugging Face model directory in the app. Installation can complete before a model is selected. Model weights are not bundled or downloaded automatically. The Router address is filled from the installing user's Olares domain and can be overridden.

    This preview requires an NVIDIA GPU and a CUDA 13.0-compatible NVIDIA driver. It targets Blackwell sm_120 and has been tested on an RTX 5090 Laptop GPU. The host must use amd64 with AVX2 (x86-64-v3). Older NVIDIA GPU architectures are not supported by this build.

    **Preview limitations**

    Chat history and generation parameters are not retained when the page is refreshed; export conversations before refreshing. Long inputs can be slow, and automatic context compaction did not finish within the 300-second client limit in testing. The tested model does not support forced JSON output or image input.
  developer: JustVugg
  website: https://github.com/JustVugg/colibri
  sourceCode: https://github.com/JustVugg/colibri
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  - de-DE
  - fr-FR
  - es-ES
  - it-IT
  - ja-JP
  doc: https://github.com/JustVugg/colibri/blob/0a5504a1dc64f86fcd0fe7db298b0448c730e7e6/README.md
  license:
  - text: Apache-2.0
    url: https://github.com/JustVugg/colibri/blob/0a5504a1dc64f86fcd0fe7db298b0448c730e7e6/LICENSE
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
workloadReplicas:
  colibri: 1
envs:
- envName: SYSTEM_LANGUAGE
  valueFrom:
    envName: OLARES_USER_LANGUAGE
- envName: INFERENCE_PROFILE
  type: string
  default: standard
  required: true
  editable: true
  applyOnChange: true
  regex: ^(standard|low-memory-moe)$
  options:
  - title: Standard
    value: standard
  - title: Low-memory MoE
    value: low-memory-moe
  description: 'Inference profile: standard uses RAM_GB; low-memory-moe uses a 4 GB RAM budget and 2 GiB expert-cache budget with staged GPU execution. These are engine budgets, not whole-app resource caps. Switching restarts the app.'
- envName: CONTEXT_LENGTH
  type: int
  default: '16384'
  required: true
  editable: true
  applyOnChange: true
  regex: ^(16384|32768|65536|131072)$
  options:
  - title: 16384 tokens
    value: '16384'
  - title: 32768 tokens
    value: '32768'
  - title: 65536 tokens
    value: '65536'
  - title: 131072 tokens
    value: '131072'
  description: 'Local model context length in tokens, including conversation and reply. Default: 16384. Larger values need more memory and must be supported by the selected model. Changing this restarts the app.'
- envName: ROUTER_BASE_URL
  type: url
  required: false
  editable: true
  applyOnChange: true
  regex: ^https://[a-zA-Z0-9.-]+/v1$
  description: Optional Router API override. Leave blank to use the installing user's Olares Router address.
- envName: RAM_GB
  type: int
  default: '16'
  required: true
  editable: true
  applyOnChange: true
  regex: ^([1-9]|1[0-8])$
  description: Engine RAM budget in GB (1–18); larger models require increasing the chart memory resources first.
