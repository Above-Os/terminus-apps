entrances:
- name: colibri
  host: colibri
  port: 8000
  title: Colibri
  icon: https://cdn.olares.com/images/2026/11/0d7c6155e1f20ef56847d1ea2b1f365a.png
  authLevel: private
  openMethod: window
spec:
  versionName: 2.1.0
  featuredImage: https://cdn.olares.com/images/2026/11/498af9c6be7f96d478abdb4c058e250c.png
  promoteImage:
  - https://cdn.olares.com/images/2026/11/498af9c6be7f96d478abdb4c058e250c.png
  - https://cdn.olares.com/images/2026/11/d4cac52295afe30b4d444cb4b52c4205.png
