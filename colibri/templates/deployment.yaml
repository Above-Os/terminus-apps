{{- /* Manifest requires MEMORY_LIMIT at install time. This fallback only permits
structural chart lint before app-service supplies required environment values. */ -}}
{{- $memoryLimit := .Values.olaresEnv.MEMORY_LIMIT | default "24Gi" | toString | trim -}}
{{- if not (regexMatch "^[1-9][0-9]{0,6}(Mi|Gi)$" $memoryLimit) -}}
{{- fail "MEMORY_LIMIT must be a positive whole Mi or Gi quantity, such as 48Gi" -}}
{{- end -}}
{{- $limitBytes := mul (regexReplaceAll "(Mi|Gi)$" $memoryLimit "" | int64) (ternary 1073741824 1048576 (hasSuffix "Gi" $memoryLimit)) -}}
{{- if lt $limitBytes 2147483648 -}}
{{- fail "MEMORY_LIMIT must be at least 2Gi" -}}
{{- end -}}
{{- /* --ram takes decimal GB; Kubernetes Mi/Gi quantities are binary. */ -}}
{{- $ramGB := div (mul $limitBytes 3) 4000000000 -}}
{{- $gpuLimit := .Values.olaresEnv.GPU_MEMORY_LIMIT | default "16Gi" | toString | trim -}}
{{- if not (regexMatch "^(0|0Mi|0Gi|[1-9][0-9]{0,6}(Mi|Gi))$" $gpuLimit) -}}
{{- fail "GPU_MEMORY_LIMIT must be 0 for CPU or a positive whole Mi/Gi quantity" -}}
{{- end -}}
{{- $gpuMiB := int64 0 -}}
{{- if not (regexMatch "^0(Mi|Gi)?$" $gpuLimit) -}}
{{- $gpuMiB = mul (regexReplaceAll "(Mi|Gi)$" $gpuLimit "" | int64) (ternary 1024 1 (hasSuffix "Gi" $gpuLimit)) -}}
{{- end -}}
{{- $cpuOnly := eq $gpuMiB 0 -}}
{{- if and (not $cpuOnly) (lt $gpuMiB 4096) -}}
{{- fail "Positive GPU_MEMORY_LIMIT must be at least 4Gi; use 0 for CPU" -}}
{{- end -}}

{{- $gpuPlacementGiB := divf (max 0 (sub $gpuMiB 2048)) 1024 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colibri
  namespace: '{{ .Release.Namespace }}'
  {{- if not $cpuOnly }}
  annotations:
    applications.app.bytetrade.io/gpu-inject: "colibri"
  {{- end }}
spec:
  replicas: {{ .Values.workloads.colibri.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: colibri
  template:
    metadata:
      labels:
        app: colibri
      annotations:
        {{- if not $cpuOnly }}
        gpu.bytetrade.io/required-gpu-memory: {{ printf "%dMi" $gpuMiB | quote }}
        gpu.bytetrade.io/limited-gpu-memory: {{ printf "%dMi" $gpuMiB | quote }}
        {{- end }}
        checksum/auth: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/proxy: {{ include (print $.Template.BasePath "/proxy.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: init-permissions
          image: beclab/aboveos-busybox:1.37.0
          command: [sh, -ec, 'mkdir -p /data/home; chown 1000:1000 /data /data/home']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: colibri
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: IfNotPresent
          command: [python3, /usr/local/libexec/colibri/olares_models.py]
          args:
            - --ctx
            - {{ .Values.olaresEnv.CONTEXT_LENGTH | default "16384" | quote }}
            - --ram
            - {{ $ramGB | quote }}
          env:
            - {name: HOME, value: /data/home}
            - {name: PYTHONUNBUFFERED, value: '1'}
            - name: COLI_CUDA
              value: {{ ternary "0" "1" $cpuOnly | quote }}
            {{- if $cpuOnly }}
            - {name: CUDA_VISIBLE_DEVICES, value: ''}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            {{- else }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: COLI_GPUS
              value: '0'
            {{- end }}
            - name: COLIBRI_GPU_QUOTA_MIB
              value: {{ $gpuMiB | quote }}
            {{- if not $cpuOnly }}
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: {{ printf "%dm" $gpuMiB | quote }}
            - name: COLI_CUDA_CHAIN
              value: {{ if eq (.Values.olaresEnv.INFERENCE_PROFILE | default "standard") "low-memory-moe" }}'0'{{ else }}'1'{{ end }}
            - name: CUDA_EXPERT_GB
              value: {{ printf "%.6f" $gpuPlacementGiB | quote }}
            {{- end }}
            - name: COLI_ALLOWED_HOSTS
              value: '{{ .Values.domain.colibri }},colibri,colibri.{{ .Release.Namespace }}.svc.cluster.local'
            - name: COLI_API_KEY
              valueFrom:
                secretKeyRef: {name: colibri-auth, key: API_KEY}
          ports:
            - {name: engine, containerPort: 8000}
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
              {{- if not $cpuOnly }}
              nvidia.com/gpumem: {{ $gpuMiB }}
              {{- end }}
            limits:
              cpu: '8'
              memory: {{ $memoryLimit | quote }}
              {{- if not $cpuOnly }}
              nvidia.com/gpumem: {{ $gpuMiB }}
              {{- end }}
          startupProbe:
            httpGet: {path: /olares-models/health, port: 8080, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 720
          readinessProbe:
            httpGet: {path: /olares-models/health, port: 8080, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: models, mountPath: /models, readOnly: true}
        - name: web-proxy
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          command: [python3, -c]
          args:
            - |
              import os,pathlib
              template=pathlib.Path('/etc/colibri/nginx.conf').read_text()
              config=pathlib.Path('/tmp/nginx.conf')
              config.write_text(template.replace('__COLI_TOKEN__',os.environ['COLI_API_KEY']))
              config.chmod(0o600)
              os.execvp('nginx',['nginx','-c',str(config),'-g','daemon off;'])
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            - {name: CUDA_VISIBLE_DEVICES, value: ''}
            - name: COLI_API_KEY
              valueFrom:
                secretKeyRef: {name: colibri-auth, key: API_KEY}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/colibri, readOnly: true}
      volumes:
        - name: proxy-config
          configMap: {name: colibri-proxy}
        - name: data
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate
        - name: models
          hostPath:
            path: {{ .Values.userspace.appCommon }}/huggingface
            type: DirectoryOrCreate
