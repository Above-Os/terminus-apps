{{- $existing := lookup "v1" "Secret" .Release.Namespace "colibri-auth" -}}
apiVersion: v1
kind: Secret
metadata:
  name: colibri-auth
  namespace: '{{ .Release.Namespace }}'
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "API_KEY") }}
  API_KEY: {{ index $existing.data "API_KEY" | quote }}
  {{- else }}
  API_KEY: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
