metadata:
  description: "SpeechBrain mtl-mimic-voicebank denoise / enhance."
  title: SpeechBrain Enhance

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    SpeechBrain mtl-mimic-voicebank denoise / enhance.

    **Configuration**
    - Model: `speechbrain/mtl-mimic-voicebank`
    - Source: `hf://speechbrain/mtl-mimic-voicebank`
    - Capabilities: `enhance`
    - Required GPU memory: `2Gi`
    - Engine: SpeechBrain enhance

    **How It Works**
    Model Console downloads the model, then the audio engine serves it. llm-init
    reverse-proxies `/v1/*` and serves the dashboard on `/`.

    **Model Storage**
    Shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.
