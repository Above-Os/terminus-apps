metadata:
  description: 録音音声のノイズとひずみを低減するモデル
  title: SpeechBrain Enhance

spec:
  upgradeDescription: |
    v1.0.21: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    SpeechBrain Enhanceは、音声録音を処理して背景ノイズとひずみを低減します。処理後の音声はそのまま再生するほか、文字起こしや分析のために別のアプリへ渡すことができます。

    **主な機能**
    - 録音音声の背景ノイズを低減します。
    - 再生や後続処理に使える音声を生成します。
    - 文字起こしや音声分析のために録音を整えます。
    - 対応するOlaresアプリから音声強調機能を利用できます。

    `2Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。
