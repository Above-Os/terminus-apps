metadata:
  description: Un modèle qui réduit le bruit et la distorsion dans les enregistrements vocaux
  title: SpeechBrain Enhance

spec:
  upgradeDescription: |
    v1.0.21: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    SpeechBrain Enhance traite un enregistrement vocal afin de réduire le bruit de fond et la distorsion. L'audio nettoyé peut être lu directement ou transmis à une autre application pour transcription ou analyse.

    **Fonctionnalités principales**
    - Réduire le bruit de fond dans la parole enregistrée.
    - Produire un signal audio amélioré pour la lecture ou un traitement ultérieur.
    - Préparer les enregistrements pour la transcription et l'analyse audio.
    - Mettre l'amélioration vocale à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `2Gi` de mémoire vidéo est requis.
