metadata:
  description: Un modello per ridurre rumore e distorsione nelle registrazioni vocali
  title: SpeechBrain Enhance

spec:
  upgradeDescription: |
    v1.0.21: Lo stato di esecuzione viene memorizzato in Common per consentire il funzionamento su più nodi. La configurazione esistente in Common ha la priorità. In caso contrario, viene migrato il Cache locale precedente oppure lo stato viene inizializzato in Common. All’avvio del motore, la lettura degli script di supporto condivisi viene ritentata in caso di errore.

  fullDescription: |
    SpeechBrain Enhance elabora una registrazione vocale per ridurre il rumore di fondo e la distorsione. L'audio ripulito può essere riprodotto direttamente o inviato a un'altra applicazione per la trascrizione o l'analisi.

    **Funzionalità principali**
    - Ridurre il rumore di fondo nel parlato registrato.
    - Produrre un segnale audio migliorato per la riproduzione o elaborazioni successive.
    - Preparare le registrazioni per la trascrizione e l'analisi audio.
    - Rendere il miglioramento vocale disponibile alle applicazioni Olares compatibili.

    È necessaria una GPU NVIDIA compatibile con almeno `2Gi` di memoria video.
