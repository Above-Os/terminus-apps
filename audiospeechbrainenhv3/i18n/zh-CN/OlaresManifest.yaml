metadata:
  description: "SpeechBrain mtl-mimic-voicebank denoise / enhance (review submission)."
  title: SpeechBrain Enhance

spec:
  fullDescription: |
    **模型概览**
    SpeechBrain mtl-mimic-voicebank denoise / enhance (review submission).

    **预设配置**
    - 模型：`mtl-mimic-voicebank`
    - 来源：`hf://speechbrain/mtl-mimic-voicebank`
    - 能力：`enhance`
    - GPU 显存：`2Gi`
    - 引擎：SpeechBrain enhance

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。
