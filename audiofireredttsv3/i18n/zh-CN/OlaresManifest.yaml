metadata:
  description: 支持预设、克隆和设计音色的文本转语音模型
  title: FireRedTTS3 Instruct

spec:
  upgradeDescription: |
    v1.0.15: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。
  fullDescription: |
    FireRedTTS3-Instruct 可将文本转换为语音，支持使用预设音色、根据参考录音克隆音色，以及根据文字描述创建音色。

    **主要功能**
    - 使用预设音色生成语音。
    - 根据参考音频及其对应文本克隆音色。
    - 根据自然语言描述设计并保存音色。
    - 在同一 Olares 实例上重复使用克隆和设计的音色。

    需要配备至少 `16Gi` 显存的兼容 NVIDIA GPU。
