metadata:
  description: 支持预设、克隆和设计音色的文本转语音模型
  title: FireRedTTS3 Instruct

spec:
  onlyAdmin: true
  fullDescription: |
    FireRedTTS3-Instruct 可将文本转换为语音，支持使用预设音色、根据参考录音克隆音色，以及根据文字描述创建音色。

    **主要功能**
    - 使用预设音色生成语音。
    - 根据参考音频及其对应文本克隆音色。
    - 根据自然语言描述设计并保存音色。
    - 在同一 Olares 实例上重复使用克隆和设计的音色。

    需要配备至少 `16Gi` 显存的兼容 NVIDIA GPU。
  upgradeDescription: |
    v1.0.2：在模型信息中增加 `tts_design`，并将引擎更新至 v1.1.4。
    v1.0.1：将 `MODEL_MODE` 设为 `tts`，并要求使用 llm-init v1.7.0。
    v1.0.0：首次发布。
