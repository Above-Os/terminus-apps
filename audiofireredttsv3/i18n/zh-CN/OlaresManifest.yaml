metadata:
  description: "FireRedTTS3-Instruct：一个模型同时覆盖内置音色、克隆和设计。"
  title: FireRedTTS3 Instruct

spec:
  onlyAdmin: true
  fullDescription: |
    **模型概览**
    FireRedTTS3-Instruct 一份权重就能列出音色、用参考音克隆、用文字设计、再朗读。仅 CUDA（amd64 + arm64）。

    **配置**
    - 模型：`FireRedTeam/FireRedTTS3`
    - 来源：`hf://FireRedTeam/FireRedTTS3`（Instruct + RedAE + tokenizer；不含 Base）
    - 能力：`tts`、`tts_clone`
    - GPU 显存：`16Gi`
    - 引擎：官方 PyTorch 进程内（`FireRedTTS3Instruct`）
    - 许可：Apache-2.0

    **工作方式**
    Model Console（llm-init）负责下载模型；音频引擎就绪后提供服务。llm-init
    反向代理 `/v1/*`，并在 `/` 提供控制台。

    **模型存储**
    共享目录 `appCommon/huggingface`，挂载为 `/cache/hf/hub`。冻结音色在 `appData/voices`。
