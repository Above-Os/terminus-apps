metadata:
  description: Un modèle de synthèse vocale avec voix prédéfinies, clonées et conçues
  title: FireRedTTS3 Instruct

spec:
  onlyAdmin: true
  fullDescription: |
    FireRedTTS3-Instruct transforme du texte en parole. Il prend en charge les voix prédéfinies, le clonage depuis un enregistrement de référence et la création d'une voix à partir d'une description écrite.

    **Fonctionnalités principales**
    - Générer de la parole avec des voix prédéfinies.
    - Cloner une voix à partir d'un enregistrement de référence et de sa transcription.
    - Concevoir et enregistrer une voix à partir d'une description en langage naturel.
    - Réutiliser les voix clonées et conçues sur la même installation Olares.

    Un GPU NVIDIA compatible disposant d'au moins `16Gi` de mémoire vidéo est requis.
  upgradeDescription: |
    v1.0.2 : Ajout de `tts_design` à la fiche du modèle et mise à jour du moteur vers la version v1.1.4.
    v1.0.1 : Définition de `MODEL_MODE` sur `tts` et ajout de la dépendance à llm-init v1.7.0.
    v1.0.0 : Version initiale.
