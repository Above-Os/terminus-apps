metadata:
  description: Ein Text-zu-Sprache-Modell mit voreingestellten, geklonten und erstellten Stimmen
  title: FireRedTTS3 Instruct

spec:
  upgradeDescription: |
    v1.0.15: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert. Beim Start der Engine wird das Lesen gemeinsam genutzter Hilfsskripte bei Fehlern wiederholt.

  fullDescription: |
    FireRedTTS3-Instruct wandelt geschriebenen Text in Sprache um. Es unterstützt voreingestellte Stimmen, das Klonen anhand einer Referenzaufnahme und das Erstellen einer Stimme aus einer Beschreibung.

    **Hauptfunktionen**
    - Sprache mit voreingestellten Stimmen erzeugen.
    - Eine Stimme anhand einer Referenzaufnahme und des zugehörigen Transkripts klonen.
    - Eine Stimme aus einer natürlichsprachlichen Beschreibung erstellen und speichern.
    - Geklonte und erstellte Stimmen auf derselben Olares-Installation erneut verwenden.

    Eine kompatible NVIDIA-GPU mit mindestens `16Gi` Grafikspeicher ist erforderlich.
