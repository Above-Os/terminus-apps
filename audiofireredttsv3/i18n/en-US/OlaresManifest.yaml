metadata:
  description: "FireRedTTS3-Instruct: one model for built-in voices, cloning and design."
  title: FireRedTTS3 Instruct

spec:
  onlyAdmin: true
  fullDescription: |
    **Model Overview**
    FireRedTTS3-Instruct is one checkpoint that lists voices, clones from a reference,
    designs a voice from a description, and speaks. CUDA only (amd64 + arm64).

    **Configuration**
    - Model: `FireRedTeam/FireRedTTS3`
    - Source: `hf://FireRedTeam/FireRedTTS3` (Instruct + RedAE + tokenizer; Base is excluded)
    - Capabilities: `tts`, `tts_clone`, `tts_design`
    - Required GPU memory: `16Gi`
    - Engine: official PyTorch in-process (`FireRedTTS3Instruct`)
    - License: Apache-2.0

    **How It Works**
    First, Model Console (llm-init) downloads the model and gets it ready, then the
    audio engine starts serving when the download sentinel appears. llm-init reverse-proxies
    `/v1/*` to the engine and serves its control plane / dashboard on `/`.

    **Model Storage**
    Shared directory `appCommon/huggingface`, mounted as `/cache/hf/hub`. Frozen voices at `appData/voices`.
