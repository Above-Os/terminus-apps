{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-agentd" .Release.Name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-agentd
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "token") }}
  token: {{ index $existing.data "token" | quote }}
  {{- else }}
  token: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
