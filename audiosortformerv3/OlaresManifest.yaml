olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiosortformerv3
  icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
  description: "NVIDIA Streaming Sortformer for streaming diarization (review submission)."
  appid: audiosortformerv3
  title: Sortformer Diar Stream
  version: '1.0.0'
  categories:
    - AI
# sharedEntrances stub: http://sharedentrances-api.<ns>:80/v1 (in-cluster).
sharedEntrances:
  - name: audiosortformerv3api
    host: sharedentrances-api
    port: 0
    title: Sortformer Diar Stream API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
# Entrance -> llm-init:8090 (dashboard + /v1/* proxy); authLevel internal.
entrances:
  - name: audiosortformerv3
    port: 8090
    host: download-svc
    title: Sortformer Diar Stream
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
    openMethod: window
    authLevel: internal
workloadReplicas:
  audiosortformerv3: 1
  llminit: 1
spec:
  versionName: 'diar-streaming-sortformer'
  fullDescription: |
    **Model Overview**
    NVIDIA Streaming Sortformer for streaming diarization (review submission).

    **Preset Configuration**
    - Model: `diar-streaming-sortformer`
    - Source: `hf://nvidia/diar_streaming_sortformer_4spk-v2.1`
    - Capabilities: `diar_stream`
    - Required GPU memory: `6Gi`
    - Engine: NVIDIA NeMo Streaming Sortformer

    **How It Works**
    First, Model Console (llm-init) downloads the model and gets it ready, then the
    audio engine starts serving when the download sentinel appears. llm-init reverse-proxies
    `/v1/*` to the engine and serves its control plane / dashboard on `/`.

    **Stack**
    - **audio engine**: NVIDIA NeMo Streaming Sortformer (port 8000); self-reports `/v1/models` + `/metrics`
    - **Model Console (llm-init)**: Downloads the model, shows progress, OpenAI API on 8090

    **Model Storage**
    All model files are stored in a shared folder at `appCommon/huggingface`, mounted as `/cache/hf/hub`.

  upgradeDescription: |
    v1.0.0: initial direct-install preset (public entrance, fixed model env defaults).

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/audio-engines
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/llm-init

  accelerator:
    # accelerator >= engine + llm-init (200m/256Mi req, 1/4Gi lim).
    - mode: nvidia
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "14Gi"
      requiredMemory: "2304Mi"
      requiredGPUMemory: "6Gi"
      limitedGPUMemory: "6Gi"
    - mode: nvidia-gb10
      limitedCpu: "5"
      requiredCpu: "700m"
      requiredDisk: 50Mi
      limitedDisk: 50Gi
      limitedMemory: "10Gi"
      requiredMemory: "6400Mi"

  supportArch:



    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://nvidia/diar_streaming_sortformer_4spk-v2.1"
    description: "HuggingFace source llm-init downloads into the shared cache."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "diar-streaming-sortformer"
    description: "Model id advertised to clients; must match the engine /v1/models id."
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "diar_stream"
    multiSelect: true
    splitter: ","
    options:
    - title: Diarization Stream (streaming speakers, WebSocket)
      value: diar_stream
    description: "Capabilities this preset exposes (locked for this model app)."
  - envName: AUDIO_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "6Gi"
    description: "GPU memory required for this model. `0` means CPU-only."
  - envName: DIAR_LATENCY_PRESET
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "high"
    options:
    - title: Low latency (~1s, live-first)
      value: low
    - title: High latency (~10s, accuracy-first)
      value: high
    - title: Very high latency (~30s)
      value: veryhigh
  - envName: AUDIO_CPU_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "500m"
  - envName: AUDIO_MEMORY_REQUEST
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2Gi"
  - envName: AUDIO_CPU_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "4"
  - envName: AUDIO_MEMORY_LIMIT
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "10Gi"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
