metadata:
  title: EchoMimicV2
  description: "Hacia una animación humana impactante, simplificada y de medio cuerpo."
spec:
  upgradeDescription: |
    Actualizar la configuración del Chart
    - Corregir la inyección de GPU
  fullDescription: |
    EchoMimicV2 utiliza una imagen de referencia, un clip de audio y una secuencia de poses de la mano para generar un vídeo de animación de alta calidad, asegurando la coherencia entre el contenido de audio y los movimientos de medio cuerpo.

    Características
    Transforme fácilmente imágenes estáticas en vídeos animados con movimientos de medio cuerpo.
    Efectos de habla hiperrealistas: sincronización labial, expresiones faciales, movimientos de medio cuerpo y gestos de la mano,
    Interfaz fácil de usar
