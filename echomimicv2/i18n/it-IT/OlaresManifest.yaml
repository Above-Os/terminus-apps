metadata:
  title: EchoMimicV2
  description: "Verso un'animazione umana sorprendente, semplificata e a mezzo busto"
spec:
  upgradeDescription: |
    Aggiorna la configurazione del Chart
    - Correggi l'iniezione GPU
  fullDescription: |
    EchoMimicV2 utilizza un'immagine di riferimento, una clip audio e una sequenza di pose della mano per generare un video di animazione di alta qualità, garantendo la coerenza tra il contenuto audio e i movimenti a mezzo busto.

    Funzionalità
    Trasforma facilmente immagini statiche in video animati con movimenti a mezzo busto.
    Effetti di parlato iperrealistici: sincronizzazione labiale, espressioni facciali, movimenti a mezzo busto e gesti delle mani,
    Interfaccia facile da usare
