metadata:
  title: EchoMimicV2
  description: "Hin zu eindrucksvoller, vereinfachter und halbfigürlicher Human-Animation."
spec:
  upgradeDescription: |
    Chart-Konfiguration aktualisieren
    - GPU-Injection korrigieren
  fullDescription: |
    EchoMimicV2 nutzt ein Referenzbild, einen Audioclip und eine Sequenz von Handposen, um ein hochwertiges Animationsvideo zu erzeugen und Kohärenz zwischen Audioinhalt und Halbkörperbewegungen sicherzustellen.

    Funktionen
    Verwandeln Sie statische Bilder mühelos in animierte Videos mit Halbkörperbewegungen.
    Hyperrealistische Sprecheffekte: Lippensynchronisation, Gesichtsausdrücke, Halbkörperbewegungen und Handgesten,
    Einfache Bedienoberfläche
