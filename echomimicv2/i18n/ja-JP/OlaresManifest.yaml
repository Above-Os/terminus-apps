metadata:
  title: EchoMimicV2
  description: 印象的で簡素化された半身ヒューマンアニメーションへ。
spec:
  upgradeDescription: |
    Chart 設定を更新
    - GPU インジェクションを修正
  fullDescription: |
    EchoMimicV2 は、参照画像、音声クリップ、手のポーズのシーケンスを用いて高品質なアニメーション動画を生成し、音声内容と半身の動きの一貫性を確保します。

    機能
    静止画像を半身の動きのあるアニメーション動画に簡単に変換。
    超リアルな発話効果：リップシンク、表情、半身の動き、手のジェスチャー、
    使いやすいインターフェース
