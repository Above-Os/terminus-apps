metadata:
  title: EchoMimicV2
  description: "Vers une animation humaine frappante, simplifiée et à mi-corps"
spec:
  upgradeDescription: |
    Mettre à jour la configuration du Chart
    - Corriger l'injection GPU
  fullDescription: |
    EchoMimicV2 utilise une image de référence, un clip audio et une séquence de poses de main pour générer une vidéo d'animation de haute qualité, en assurant la cohérence entre le contenu audio et les mouvements du demi-corps.

    Fonctionnalités
    Transformez facilement des images statiques en vidéos animées avec des mouvements du demi-corps.
    Effets de parole hyperréalistes : synchronisation labiale, expressions faciales, mouvements du demi-corps et gestes des mains,
    Interface facile à utiliser
