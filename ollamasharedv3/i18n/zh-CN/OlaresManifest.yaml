metadata:
  title: Ollama Shared
  description: 带持久化模型存储和 Web 终端的共享 Ollama 服务。

spec:
  fullDescription: |
    Ollama Shared 在集群中运行一个共享 Ollama daemon，模型保存在应用私有持久化目录中。
    管理员可通过内置终端拉取、列出、查看和删除模型。

    本应用限制同一时间最多驻留一个模型。建议用于 Router 与 Lares 切换测试的
    Q4_K_M 模型为 `qwen3.8:27b-q4_K_M` 和 `gemma4:12b-it-q4_K_M`。
