metadata:
  title: Ollama Shared
  description: A shared Ollama daemon with persistent model storage and a web terminal.

spec:
  fullDescription: |
    Ollama Shared runs one cluster-wide Ollama daemon with persistent private
    application storage. Administrators can use the built-in terminal to pull,
    list, inspect, and remove models.

    This package is tuned to keep at most one model loaded at a time. The
    recommended Q4_K_M models are `qwen3.8:27b-q4_K_M` and
    `gemma4:12b-it-q4_K_M`.
