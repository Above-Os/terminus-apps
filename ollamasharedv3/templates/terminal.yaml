apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-account
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-manager
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: terminal-account
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-exec-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: terminal
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.workloads.terminal.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: terminal
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terminal
        app.kubernetes.io/instance: {{ .Release.Name }}
        io.kompose.network/chrome-default: "true"
    spec:
      serviceAccountName: terminal-account
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      containers:
        - name: nginx
          image: docker.io/beclab/terminal:v0.0.14
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: 5m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 100Mi
        - name: terminal
          image: docker.io/beclab/terminal:v0.0.14
          imagePullPolicy: IfNotPresent
          command: ["apiserver"]
          args:
            - --namespace={{ .Release.Namespace }}
            - --pod=bytetrade.io/terminal=ollama
            - --container=ollama
            - --v=3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terminal
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: terminal
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
