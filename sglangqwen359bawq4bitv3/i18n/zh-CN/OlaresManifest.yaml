metadata:
  description: "使用 SGLang 运行 Qwen3.5-9B（AWQ-4bit）模型。"
  title: Qwen3.5-9B (SGLang)

spec:
  upgradeDescription: |
    v1.0.11：将 SGLang 从 v0.5.14-cu130 升级至 v0.5.17-cu130。

    **更新内容**（v0.5.14 → v0.5.17）
    - 新增模型支持：Kimi K3、MiniMax-H3、Inkling、GLM-5.2、LiquidAI LFM2.5、Kimi-K2.7-Code、LongCat 2.0、EmbeddingGemma、Hunyuan 3、Qwen3.6 NVFP4 等
    - DeepSeek-V4：GB300 首日支持、NVFP4 MoE、MegaMoE、sparse-prefill / indexer 优化、Waterfill 与 LPLB MoE 负载均衡
    - 投机解码：默认 Spec V2、DSpark、IndexShare MTP、ReplaySSM Ring Spec-Verify
    - 并行与缓存：DCP A2A 后端、DWDP MoE prefill、MLA decode CP、默认 UnifiedRadixTree、会话感知 radix cache、更快的引擎恢复
    - 内核与运行时：默认 Breakable CUDA Graph、Blackwell 上 KDA/GDN 线性注意力、初始 Rust 前端、原生 Exa web_search
    - 破坏性变更：移除 QServe/FBGEMM FP8；NVFP4 GEMM 需要 FlashInfer

    详细发布说明请访问：
    https://github.com/sgl-project/sglang/releases

    v1.0.10：llm-init 升级至 v1.3.5。
    v1.0.8：SGLANG_MEMORY_LIMIT 30Gi；llm-init limit 2Gi；limitedMemory 32Gi（30+2）。
    v1.0.7：nvidia 主机内存 — requiredMemory 22Gi，SGLANG_MEMORY_REQUEST 21Gi，SGLANG_MEMORY_LIMIT 26Gi，limitedMemory 30Gi。
    v1.0.6：nvidia 主机内存 — requiredMemory 16Gi，SGLANG_MEMORY_REQUEST 15Gi，SGLANG_MEMORY_LIMIT 19Gi，limitedMemory 26Gi。
    v1.0.5：llm-init 升级至 v1.3.1。
  fullDescription: |
    **模型简介**
    Qwen3.5-9B 是阿里巴巴 Qwen 系列的稠密视觉语言模型，在 9B 体量下支持思考、工具调用与视觉能力。本应用通过 SGLang 运行 `cyankiwi/Qwen3.5-9B-AWQ-4bit` 的 `AWQ-4bit` 量化权重。

    适合在较低资源占用下获得较强多模态能力的场景。Qwen3.5 模型支持思考、工具与视觉，可用于对话与智能体工作流。

    **预设配置**
    - 模型：`cyankiwi/Qwen3.5-9B-AWQ-4bit`
    - 能力：思考、工具、视觉
    - 引擎参数：`--context-length 65536 --mem-fraction-static 0.85 --chunked-prefill-size 4096 --reasoning-parser qwen3 --tool-call-parser qwen3_coder`
    - 所需显存：`23Gi`
    - SGLang 擅长前缀缓存与结构化输出（JSON、工具调用、智能体），因此默认启用前缀缓存。

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 使用 `23Gi` 显存；在 ENGINE_ARGS 中调节 `--mem-fraction-static` |
    | `nvidia-gb10`  | GPU (Spark)      | 与 `nvidia` 相同：`23Gi` 显存，由 pod 管理                    |
    
    **工作流程说明**
    首先，Model Console 下载并准备模型，然后 SGLang 在模型准备好后启动服务。两个部分运行在不同 Deployment 中，但通过 App Common 存储共享 HF 缓存与运行状态。

    **技术栈说明**
    - **SGLang**（30000 端口）：运行模型并通过 API 提供服务
    - **Model Console**（8090 端口）：下载模型、展示进度，并通过 OpenAI API 代理到 SGLang

    **模型存储**
    所有模型文件存储在共享目录 `appCommon/huggingface`（挂载为 `/cache/hf/hub`），同类应用均使用此目录。

