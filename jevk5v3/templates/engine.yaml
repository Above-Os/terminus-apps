{{- $runStatePath := include "jevk5v3.runStatePath" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: systemone-engine
  annotations:
    applications.app.bytetrade.io/gpu-inject: systemone-engine
spec:
  replicas: {{ .Values.workloads.jevk5v3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: systemone-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: systemone-engine
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: systemone-engine
          image: '{{ include "jevk5v3.engineImage" . }}'
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/systemone/start.sh"]
          env:
            - name: SYSTEMONE_BACKEND
              value: jevk5
            - name: MODEL_NAME
              value: '{{ include "jevk5v3.modelName" . }}'
            - name: MODEL_REVISION
              value: '{{ include "jevk5v3.modelRevision" . }}'
            - name: DEVICE
              value: cuda
            - name: SYSTEM_ONE_CONTEXT_SIZE
              value: "16384"
            - name: SYSTEM_ONE_MAX_CHOICE_OPTIONS
              value: "16"
            - name: SYSTEM_ONE_MAX_SCORE_LEVELS
              value: "10"
            - name: SYSTEM_ONE_LANGUAGES
              value: en
            - name: SYSTEM_ONE_DEFAULT_ELIGIBLE
              value: "true"
            - name: SYSTEM_ONE_MAX_CONCURRENCY
              value: "1"
            - name: SYSTEM_ONE_MAX_QUEUE
              value: "128"
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          # Model readiness belongs to llm-init. This container starts as a
          # supervisor that waits for llm-init's model_path sentinel, so probing
          # the engine HTTP port here would incorrectly block app installation
          # until every model byte is downloaded and loaded.
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
              nvidia.com/gpumem: "12288"
            limits:
              cpu: "6"
              memory: 20Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrapper
              mountPath: /opt/systemone
              readOnly: true
      volumes:
        - name: hf-cache
          hostPath:
            path: '{{ .Values.userspace.appCommon }}/huggingface'
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: '{{ $runStatePath }}'
            type: DirectoryOrCreate
        - name: wrapper
          configMap:
            name: jevk5v3-wrapper
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: systemone
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    io.kompose.service: systemone-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
