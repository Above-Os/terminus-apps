metadata:
  title: LibreSpeed
  description: 無料のオープンソーススピードテスト
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to v6.2.1 (`lspipepr/librespeed:version-v6.2.1`).

    Switches from the beclab mirror to the upstream LibreSpeed image tag. Postgres telemetry schema and appData are preserved.

    Release notes: https://github.com/librespeed/speedtest/releases
  fullDescription: |
    Flash なし、Java なし、Websocket なし、余計なものはなし。
    
    これは Javascript で実装された非常に軽量なスピードテストで、XMLHttpRequest と Web Workers を使用します。
    
    **機能**
    - ダウンロード
    - アップロード
    - Ping
    - ジッター
    - IP アドレス、ISP、サーバーからの距離（任意）
    - テレメトリ（任意）
    - 結果共有（任意）
    - 複数のテストポイント（任意）
    - レイテンシチャート、損失追跡、しきい値アラート、CSV エクスポート付きの接続安定性テスト
