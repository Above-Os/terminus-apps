metadata:
  title: LibreSpeed
  description: 無料のオープンソーススピードテスト。
spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替え。
    
    nginx 設定マウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
  fullDescription: |
    Flash なし、Java なし、Websocket なし、余計なものはなし。
    
    これは Javascript で実装された非常に軽量なスピードテストで、XMLHttpRequest と Web Workers を使用します。
    
    **機能**
    - ダウンロード
    - アップロード
    - Ping
    - ジッター
    - IP アドレス、ISP、サーバーからの距離（任意）
    - テレメトリ（任意）
    - 結果共有（任意）
    - 複数のテストポイント（任意）
    - レイテンシチャート、損失追跡、しきい値アラート、CSV エクスポート付きの接続安定性テスト
