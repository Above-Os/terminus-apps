metadata:
  title: LibreSpeed
  description: Kostenloser und quelloffener Speedtest.
spec:
  upgradeDescription: |
    Wechsel des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) zum offiziellen OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Nginx-Konfigurations-Mounts und Log-Pfade an das offizielle Image-Layout anpassen (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und die Bitnami-spezifische Verdrahtung von `OPENRESTY_CONF_FILE` entfernen.
  fullDescription: |
    Kein Flash, kein Java, kein Websocket, kein Unsinn.
    
    Dies ist ein sehr leichter Speedtest, implementiert in Javascript mit XMLHttpRequest und Web Workers.
    
    **Funktionen**
    - Download
    - Upload
    - Ping
    - Jitter
    - IP-Adresse, ISP, Entfernung zum Server (optional)
    - Telemetrie (optional)
    - Ergebnis-Teilen (optional)
    - Mehrere Testpunkte (optional)
    - Verbindungstabilitätstest mit Latenzdiagramm, Verlustverfolgung, Schwellenwert-Alarmen und CSV-Export
