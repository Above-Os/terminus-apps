metadata:
  title: LibreSpeed
  description: Speedtest gratuit et open source.
spec:
  upgradeDescription: |
    Remplacer l'image du reverse-proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Aligner les montages de configuration nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Pas de Flash, pas de Java, pas de Websocket, pas de blabla.
    
    Ceci est un speedtest très léger implémenté en Javascript, utilisant XMLHttpRequest et Web Workers.
    
    **Fonctionnalités**
    - Téléchargement
    - Envoi
    - Ping
    - Jitter
    - Adresse IP, FAI, distance au serveur (optionnel)
    - Télémétrie (optionnel)
    - Partage des résultats (optionnel)
    - Plusieurs points de test (optionnel)
    - Test de stabilité de connexion avec graphiques de latence, suivi des pertes, alertes de seuil et export CSV
