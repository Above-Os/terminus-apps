metadata:
  title: LibreSpeed
  description: Speedtest gratuit et open source
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to 6.3.1 with PHP8.5.12 and disabled session upload progress to address CVE-2026-109618/CVE-2026-109619. Retain PostgreSQL telemetry and existing server lists. Back up the database and server list before upgrading. Before replacing a legacy container, export results/idObfuscation_salt.php as a single 0xXXXXXXXX line to appData/.librespeed-state/obfuscation-salt, or old shared-result links will no longer resolve. The upgrade retains this salt and backs up PostgreSQL before schema preparation.

  fullDescription: |
    Pas de Flash, pas de Java, pas de Websocket, pas de blabla.
    
    Ceci est un speedtest très léger implémenté en Javascript, utilisant XMLHttpRequest et Web Workers.
    
    **Fonctionnalités**
    - Téléchargement
    - Envoi
    - Ping
    - Jitter
    - Adresse IP, FAI, distance au serveur (optionnel)
    - Télémétrie (optionnel)
    - Partage des résultats (optionnel)
    - Plusieurs points de test (optionnel)
    - Test de stabilité de connexion avec graphiques de latence, suivi des pertes, alertes de seuil et export CSV
