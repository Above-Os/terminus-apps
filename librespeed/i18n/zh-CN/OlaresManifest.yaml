metadata:
  title: LibreSpeed
  description: 免费且开源的网络测速工具。
spec:
  upgradeDescription: |
    升级LibreSpeed至6.3.1，PHP至8.5.12并禁用会话上传进度，修复CVE-2026-109618、CVE-2026-109619。保留PostgreSQL测速历史及现有服务器列表。升级前请备份数据库和服务器列表。 替换旧容器前，必须将results/idObfuscation_salt.php中的盐值以单行0xXXXXXXXX格式导出到appData/.librespeed-state/obfuscation-salt，否则旧测速分享链接会失效。新版持久保留该值，并在准备数据库表前备份PostgreSQL。

  fullDescription: |
    无 Flash、无 Java、无 WebSocket、无废话。

    这是一个非常轻量的网络测速工具，使用 Javascript 实现，使用 XMLHttpRequest 和 Web Workers。    
    
    **功能**
    - 下载
    - 上传
    - 延迟
    - 抖动
    - IP 地址、ISP、服务器距离（可选）
    - 遥测（可选）
    - 结果分享（可选）
    - 多个测试点（可选）
    - 连接稳定性测试，包括延迟图表、损失跟踪、阈值警报和 CSV 导出
