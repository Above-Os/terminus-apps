metadata:
  title: LibreSpeed
  description: Speedtest gratuito e open source
spec:
  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Allineare i mount della configurazione nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), e rimuovere il cablaggio specifico Bitnami di `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Niente Flash, niente Java, niente Websocket, niente sciocchezze.
    
    Questo è uno speedtest molto leggero implementato in Javascript, usando XMLHttpRequest e Web Workers.
    
    **Funzionalità**
    - Download
    - Upload
    - Ping
    - Jitter
    - Indirizzo IP, ISP, distanza dal server (opzionale)
    - Telemetria (opzionale)
    - Condivisione risultati (opzionale)
    - Più punti di test (opzionale)
    - Test di stabilità della connessione con grafici di latenza, tracciamento delle perdite, avvisi di soglia ed esportazione CSV
