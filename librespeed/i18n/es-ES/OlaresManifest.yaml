metadata:
  title: LibreSpeed
  description: Speedtest gratuito y de código abierto
spec:
  upgradeDescription: |
    Upgrade LibreSpeed to 6.3.1 with PHP8.5.12 and disabled session upload progress to address CVE-2026-109618/CVE-2026-109619. Retain PostgreSQL telemetry and existing server lists. Back up the database and server list before upgrading. Before replacing a legacy container, export results/idObfuscation_salt.php as a single 0xXXXXXXXX line to appData/.librespeed-state/obfuscation-salt, or old shared-result links will no longer resolve. The upgrade retains this salt and backs up PostgreSQL before schema preparation.

  fullDescription: |
    Sin Flash, sin Java, sin Websocket, sin tonterías.
    
    Este es un speedtest muy ligero implementado en Javascript, usando XMLHttpRequest y Web Workers.
    
    **Funciones**
    - Descarga
    - Subida
    - Ping
    - Jitter
    - Dirección IP, ISP, distancia al servidor (opcional)
    - Telemetría (opcional)
    - Compartir resultados (opcional)
    - Múltiples puntos de prueba (opcional)
    - Prueba de estabilidad de conexión con gráficos de latencia, seguimiento de pérdidas, alertas de umbral y exportación CSV
