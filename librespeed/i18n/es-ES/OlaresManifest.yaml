metadata:
  title: LibreSpeed
  description: Speedtest gratuito y de código abierto
spec:
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alinear los montajes de configuración de nginx y las rutas de logs con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    Sin Flash, sin Java, sin Websocket, sin tonterías.
    
    Este es un speedtest muy ligero implementado en Javascript, usando XMLHttpRequest y Web Workers.
    
    **Funciones**
    - Descarga
    - Subida
    - Ping
    - Jitter
    - Dirección IP, ISP, distancia al servidor (opcional)
    - Telemetría (opcional)
    - Compartir resultados (opcional)
    - Múltiples puntos de prueba (opcional)
    - Prueba de estabilidad de conexión con gráficos de latencia, seguimiento de pérdidas, alertas de umbral y exportación CSV
