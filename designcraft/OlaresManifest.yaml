apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: designcraft
  appid: designcraft
  title: DesignCraft
  description: InDesign-style page-layout app that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/designcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.designcraft.png
  version: 0.1.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
permission:
  userData:
    - Home/DesignCraft/
spec:
  versionName: "0.8.0"
  runAsUser: true
  fullDescription: |
    ## Overview
    DesignCraft is an open-source, InDesign-comparable page-layout app
    written in Rust. This app serves its WebAssembly build: layout runs
    entirely in your browser, and documents never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent access (MCP)
    The app also runs DesignCraft's headless engine as an MCP server over
    Streamable HTTP. Its entrance is hidden from the desktop and listed in
    Settings; it is reachable from your LAN or the LarePass VPN. Agents can
    create, open, save and export documents (PDF, PNG, IDML, EPUB and more)
    only in Home/DesignCraft. To keep editing an agent's result in the
    browser, open it from Files with the browser file picker.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/designcraft
  sourceCode: https://github.com/beclab/designcraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/designcraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  requiredCpu: 100m
  limitedCpu: "3"
  requiredMemory: 256Mi
  limitedMemory: 3584Mi
  requiredDisk: 50Mi
  limitedDisk: 500Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: designcraft
    host: designcraft-svc
    port: 8080
    title: DesignCraft
    icon: https://raw.githubusercontent.com/beclab/designcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.designcraft.png
    authLevel: private
    openMethod: window
  - name: designcraftmcp
    host: designcraft-svc
    port: 8090
    title: DesignCraft MCP
    icon: https://raw.githubusercontent.com/beclab/designcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.designcraft.png
    authLevel: internal
    invisible: true
options:
