metadata:
  title: Lev System One
  description: "Ein System One-Modell für Klassifizierung, Routing und Moderation"

spec:
  upgradeDescription: |
    v0.1.3: Der Laufzeitstatus wird in Common gespeichert, um den Betrieb über mehrere Knoten zu ermöglichen. Vorhandene Konfigurationen in Common haben Vorrang. Andernfalls wird der bisherige lokale Cache migriert oder der Status in Common initialisiert.

  fullDescription: |
    Lev System One wertet englische Texte aus und liefert strukturierte Entscheidungen: eine Auswahl aus vorgegebenen Optionen (choice), eine Bewertung auf einer festgelegten Skala (score) oder die Wahrscheinlichkeit einer Ja-Antwort (noul). Anwendungen können diese Ergebnisse für Klassifizierung, Anfragerouting und Inhaltsmoderation nutzen.

    Kompatible Olares-Anwendungen können das Modell über die TypeSafe-kompatible API /v1/systemone nutzen. Aufrufende Anwendungen müssen es ausdrücklich auswählen. Diese Version ist weder als Ersatz für Jev noch für risikoreiche Entscheidungen ohne menschliche Aufsicht vorgesehen.

    Diese Bereitstellung benötigt eine NVIDIA-GPU und unterstützt nur Englisch, mit einem Kontext von 4.096 Tokens, bis zu 255 Auswahloptionen und bis zu 10 Bewertungsstufen. Es wird jeweils eine Anfrage ausgeführt.
