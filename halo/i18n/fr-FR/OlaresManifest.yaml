metadata:
  title: Halo
  description: Outil open source puissant et facile à utiliser pour créer des sites Web
spec:
  fullDescription: |
    Halo est un outil open source puissant et facile à utiliser pour créer des sites Web. Grâce à ses nombreux modèles et plugins, il vous aide à construire le site idéal.

    **Fonctionnalités**

    **Architecture modulaire**
    Halo adopte une architecture modulaire, faiblement couplée et plus flexible. Les plugins peuvent être installés et désinstallés à la demande. Une interface de développement garantit extensibilité et maintenabilité.
    - Installation et désinstallation des plugins à l'exécution
    - Intégration simplifiée des plateformes tierces
    - Paramètres configurables unifiés
    - Modèles personnalisés et génération automatique d'API RESTful

    **Thèmes riches en fonctionnalités**
    Le mécanisme complet de modèles permet de personnaliser l'apparence du site.
    - Changement dynamique de thème
    - Modification et aperçu en temps réel
    - Prise en charge multilingue
    - Fonctions supplémentaires grâce aux plugins

    **Éditeur**
    L'éditeur de texte enrichi propose titres, paragraphes, citations, listes, blocs de code, styles, importation d'images, vidéos et plus encore.
    - Prise en charge complète du texte enrichi
    - Importation d'images par glisser-déposer
    - Extension de l'éditeur via des plugins
  upgradeDescription: |
    Met à jour Halo vers 2.27.2. Corrige le nettoyage SVG, les contrôles des chemins de thèmes et modèles, l’échappement SEO et les notifications de réponse.

    Notes de version : https://github.com/Halo-dev/Halo/releases/tag/v2.27.2
