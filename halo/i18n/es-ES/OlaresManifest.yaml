metadata:
  title: Halo
  description: Herramienta de código abierto potente y fácil de usar para crear sitios web
spec:
  fullDescription: |
    Halo es una herramienta potente y fácil de usar para crear sitios web. Sus numerosas plantillas y plugins te ayudan a construir tu sitio ideal.

    **Funciones**

    **Arquitectura modular**
    Halo utiliza una arquitectura modular, con poco acoplamiento entre módulos y mayor flexibilidad. Permite instalar y desinstalar plugins bajo demanda e incluye una interfaz de desarrollo que garantiza escalabilidad y facilidad de mantenimiento.
    - Instalación y desinstalación de plugins en tiempo de ejecución
    - Integración más sencilla de plataformas de terceros
    - Ajustes configurables unificados
    - Modelos personalizados y generación automática de API RESTful

    **Temas con muchas funciones**
    Su completo mecanismo de plantillas permite personalizar la apariencia del sitio.
    - Cambio dinámico de tema
    - Edición y vista previa en tiempo real
    - Compatibilidad multilingüe
    - Más funciones mediante plugins

    **Editor**
    El editor de texto enriquecido incluye títulos, párrafos, citas, listas, bloques de código, estilos, carga de imágenes, vídeos y más.
    - Compatibilidad total con texto enriquecido
    - Carga de imágenes mediante arrastrar y soltar
    - Extensiones del editor mediante plugins
  upgradeDescription: |
    Actualiza Halo a 2.27.2. Corrige el saneamiento SVG, validación de rutas de temas y plantillas, escape SEO y avisos de respuestas.

    Notas de versión: https://github.com/Halo-dev/Halo/releases/tag/v2.27.2
