metadata:
  title: Halo
  description: パワフルで使いやすいオープンソースの Web サイト構築ツール
spec:
  fullDescription: |
    Halo は、パワフルで使いやすいオープンソースの Web サイト構築ツールです。豊富なテンプレートとプラグインで理想のサイトを構築できます。

    **機能**

    **モジュラーアーキテクチャ**
    Halo は機能モジュール間の結合度が低い柔軟なモジュラー構造を採用しています。必要に応じてプラグインをインストール、アンインストールでき、高い拡張性と保守性を備えます。
    - 実行時のプラグインのインストールとアンインストール
    - サードパーティプラットフォームとの簡単な連携
    - 統一された設定
    - カスタムモデルと RESTful API の自動生成

    **機能豊富なテーマ**
    完全なテーマテンプレート機構により、好みに合わせてサイトの外観をカスタマイズできます。
    - テーマの動的変更
    - リアルタイム編集とプレビュー
    - 多言語対応
    - プラグインによる機能追加

    **エディター**
    リッチテキストエディターは、タイトル、段落、引用、リスト、コードブロック、スタイル設定、画像アップロード、動画挿入などに対応します。
    - リッチテキスト形式を完全サポート
    - ドラッグ＆ドロップで画像をアップロード
    - プラグインによるエディター拡張
  upgradeDescription: |
    Halo を 2.27.2 に更新します。SVG のサニタイズ、テーマとテンプレートのパス検証、SEO のエスケープ、返信通知を修正します。

    リリースノート: https://github.com/Halo-dev/Halo/releases/tag/v2.27.2
