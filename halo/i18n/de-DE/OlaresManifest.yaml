metadata:
  title: Halo
  description: Leistungsstarkes und benutzerfreundliches Open-Source-Werkzeug zum Erstellen von Websites
spec:
  fullDescription: |
    Halo ist ein leistungsstarkes, benutzerfreundliches Werkzeug zum Erstellen von Websites. Mit zahlreichen Vorlagen und Plugins hilft es Ihnen, Ihre ideale Website zu gestalten.

    **Funktionen**

    **Modulare Architektur**
    Halo nutzt eine modulare Architektur mit geringer Kopplung und hoher Flexibilität. Plugins können bei Bedarf zur Laufzeit installiert und deinstalliert werden. Eine Plugin-Entwicklungsschnittstelle sorgt für hohe Erweiterbarkeit und Wartbarkeit.
    - Installation und Deinstallation von Plugins zur Laufzeit
    - Einfache Integration von Drittanbieterplattformen
    - Einheitliche konfigurierbare Einstellungen
    - Benutzerdefinierte Modelle und automatisch erzeugte RESTful APIs

    **Funktionsreiche Themes**
    Der vollständige Theme-Vorlagenmechanismus ermöglicht die individuelle Gestaltung der Benutzeroberfläche.
    - Themes dynamisch wechseln
    - Bearbeitung und Vorschau in Echtzeit
    - Mehrsprachigkeit
    - Weitere Funktionen durch Plugins

    **Editor**
    Der Rich-Text-Editor bietet Titel, Absätze, Zitate, Listen, Codeblöcke, Stilattribute, Bilduploads, Videos und mehr.
    - Vollständige Unterstützung für Rich-Text
    - Drag-and-drop-Bildupload
    - Editor-Erweiterungen durch Plugins
  upgradeDescription: |
    Aktualisiert halo von 2.26.0 auf 2.27.2. Enthält die in den Versionshinweisen beschriebenen Verbesserungen und Fehlerbehebungen.

