metadata:
  title: NOFX
  description: Tu asistente personal de trading con IA. Cualquier mercado. Cualquier modelo

spec:
  upgradeDescription: |
    Cambiar la imagen del reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Alinear los mounts de la configuración de nginx y las rutas de logs con el layout de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminar el cableado específico de Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    NOFX es un asistente de trading autónomo de IA de código abierto. A diferencia de las herramientas de IA tradicionales que requieren configurar modelos manualmente, gestionar claves API y conectar fuentes de datos — la IA de NOFX percibe los mercados, selecciona modelos y obtiene datos por sí misma. Cero intervención humana. Tú defines la estrategia, la IA se encarga del resto.

    Totalmente autónomo: la IA decide qué modelo usar, qué datos de mercado obtener y cuándo operar — todo sola. Sin configuración manual de modelos. Sin malabarismos con claves API de distintos servicios. Solo financia una cartera USDC y déjala funcionar.

    **Qué hace**
    - Multi-AI: DeepSeek, Qwen, GPT, Claude, Gemini, Grok, Kimi, MiniMax — cambia en cualquier momento.
    - Multi-Exchange: Binance, Bybit, OKX, Bitget, KuCoin, Gate, Hyperliquid, Aster, Lighter.
    - Strategy Studio: Constructor visual — fuentes de monedas, indicadores, controles de riesgo.
    - AI Competition: las IA compiten en tiempo real, la clasificación ordena el rendimiento
    - Telegram Agent: chatea con tu asistente de trading — streaming, tool calling, memoria
    - Dashboard: posiciones en vivo, P/L, registros de decisiones de IA con Chain of Thought
