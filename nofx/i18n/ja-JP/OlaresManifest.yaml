metadata:
  title: NOFX
  description: あなた専用の AI トレーディングアシスタント。あらゆる市場。あらゆるモデル。

spec:
  upgradeDescription: |
    リバースプロキシイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` へ切り替え。

    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除。
  fullDescription: |
    NOFX はオープンソースの自律型 AI トレーディングアシスタントです。モデル設定や API キー管理、データソースの配線を手動で行う従来の AI ツールとは異なり — NOFX の AI は市場を把握し、モデルを選び、データを自ら取得します。人手の介入はゼロ。戦略を設定すれば、あとは AI が処理します。

    完全自律：どのモデルを使うか、どの市場データを取るか、いつ取引するか — すべて AI が自ら判断。手動のモデル設定不要。サービスごとの API キーのやりくり不要。USDC ウォレットに資金を入れれば稼働開始です。

    **できること**
    - Multi-AI：DeepSeek、Qwen、GPT、Claude、Gemini、Grok、Kimi、MiniMax — いつでも切り替え。
    - Multi-Exchange：Binance、Bybit、OKX、Bitget、KuCoin、Gate、Hyperliquid、Aster、Lighter。
    - Strategy Studio：ビジュアルビルダー — コインソース、インジケーター、リスクコントロール。
    - AI Competition：AI がリアルタイムで競い、リーダーボードが成績を順位付け
    - Telegram Agent：トレーディングアシスタントとチャット — ストリーミング、ツール呼び出し、メモリ
    - Dashboard：ライブポジション、損益、Chain of Thought 付きの AI 判断ログ
