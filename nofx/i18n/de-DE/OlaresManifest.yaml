metadata:
  title: NOFX
  description: Ihr persönlicher KI-Handelsassistent. Jeder Markt. Jedes Modell

spec:
  upgradeDescription: |
    Upgrade NOFX backend to `goai007/nofx-backend:20260617`.

    Backend image bump only; existing appData (`.env`, RSA key, SQLite) is preserved across upgrade.

    Upstream: https://github.com/NoFxAiOS/nofx
  fullDescription: |
    NOFX ist ein quelloffener autonomer KI-Handelsassistent. Anders als herkömmliche KI-Tools, bei denen Sie Modelle manuell konfigurieren, API-Schlüssel verwalten und Datenquellen verdrahten müssen — nimmt die KI von NOFX Märkte wahr, wählt Modelle und holt Daten vollständig selbstständig. Null menschliches Eingreifen. Sie legen die Strategie fest, die KI erledigt den Rest.

    Vollständig autonom: Die KI entscheidet, welches Modell genutzt wird, welche Marktdaten abgerufen und wann gehandelt wird — alles von selbst. Keine manuelle Modellkonfiguration. Kein Jonglieren mit API-Schlüsseln für verschiedene Dienste. Einfach eine USDC-Wallet aufladen und laufen lassen.

    **Was es kann**
    - Multi-AI: DeepSeek, Qwen, GPT, Claude, Gemini, Grok, Kimi, MiniMax — jederzeit wechseln.
    - Multi-Exchange: Binance, Bybit, OKX, Bitget, KuCoin, Gate, Hyperliquid, Aster, Lighter.
    - Strategy Studio: Visueller Builder — Coin-Quellen, Indikatoren, Risikokontrollen.
    - AI Competition: KIs konkurrieren in Echtzeit, Bestenliste bewertet die Leistung
    - Telegram Agent: Chatten Sie mit Ihrem Handelsassistenten — Streaming, Tool Calling, Speicher
    - Dashboard: Live-Positionen, P/L, KI-Entscheidungprotokolle mit Chain of Thought
