metadata:
  title: NOFX
  description: Il tuo assistente personale di trading basato su IA. Qualsiasi mercato. Qualsiasi modello

spec:
  upgradeDescription: |
    Passare l'immagine del reverse-proxy da Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) all'immagine ufficiale OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Allineare i mount della config nginx e i percorsi dei log al layout dell'immagine ufficiale (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) e rimuovere il wiring specifico di Bitnami di `OPENRESTY_CONF_FILE`.
  fullDescription: |
    NOFX è un assistente di trading autonomo basato su IA open-source. A differenza degli strumenti IA tradizionali che richiedono di configurare manualmente i modelli, gestire le chiavi API e collegare le fonti dati — l'IA di NOFX percepisce i mercati, seleziona i modelli e recupera i dati interamente da sola. Zero intervento umano. Tu imposti la strategia, l'IA gestisce tutto il resto.

    Completamente autonomo: l'IA decide quale modello usare, quali dati di mercato recuperare e quando operare — tutto da sola. Nessuna configurazione manuale dei modelli. Nessun giocoliere di chiavi API per servizi diversi. Basta finanziare un wallet USDC e lasciarlo lavorare.

    **Cosa fa**
    - Multi-AI: DeepSeek, Qwen, GPT, Claude, Gemini, Grok, Kimi, MiniMax — cambia in qualsiasi momento.
    - Multi-Exchange: Binance, Bybit, OKX, Bitget, KuCoin, Gate, Hyperliquid, Aster, Lighter.
    - Strategy Studio: builder visuale — fonti monete, indicatori, controlli del rischio.
    - AI Competition: le IA competono in tempo reale, la classifica ordina le prestazioni
    - Telegram Agent: chatta con il tuo assistente di trading — streaming, tool calling, memoria
    - Dashboard: posizioni live, P/L, log delle decisioni IA con Chain of Thought
