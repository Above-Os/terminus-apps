metadata:
  title: NOFX
  description: Votre assistant de trading IA personnel. N'importe quel marché. N'importe quel modèle.

spec:
  upgradeDescription: |
    Passer l'image du reverse-proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) à l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.

    Aligner les montages de config nginx et les chemins de logs sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et supprimer le câblage spécifique à Bitnami de `OPENRESTY_CONF_FILE`.
  fullDescription: |
    NOFX est un assistant de trading IA autonome open source. Contrairement aux outils IA traditionnels qui vous obligent à configurer manuellement les modèles, gérer les clés API et connecter les sources de données — l'IA de NOFX perçoit les marchés, sélectionne les modèles et récupère les données entièrement seule. Zéro intervention humaine. Vous définissez la stratégie, l'IA s'occupe du reste.

    Entièrement autonome : l'IA décide quel modèle utiliser, quelles données de marché récupérer et quand trader — tout seule. Pas de configuration manuelle des modèles. Pas de jonglage avec les clés API de différents services. Il suffit d'alimenter un portefeuille USDC et de la laisser tourner.

    **Ce qu'elle fait**
    - Multi-AI : DeepSeek, Qwen, GPT, Claude, Gemini, Grok, Kimi, MiniMax — changez à tout moment.
    - Multi-Exchange : Binance, Bybit, OKX, Bitget, KuCoin, Gate, Hyperliquid, Aster, Lighter.
    - Strategy Studio : constructeur visuel — sources de pièces, indicateurs, contrôles des risques.
    - AI Competition : les IA concourent en temps réel, le classement évalue les performances
    - Telegram Agent : discutez avec votre assistant de trading — streaming, tool calling, mémoire
    - Dashboard : positions en direct, P/L, journaux de décisions IA avec Chain of Thought
