metadata:
  title: Qinglong
  description: Plattform zur Verwaltung zeitgesteuerter Aufgaben
spec:
  fullDescription: |
    **Was ist qinglong?**
    Qinglong ist eine Plattform zur Verwaltung zeitgesteuerter Aufgaben mit Unterstützung für Python3, JavaScript, Shell und Typescript.

    **Funktionen**
    - Unterstützung mehrerer Skriptsprachen (python3, javaScript, shell, typescript)
    - Online-Verwaltung von Skripten, Umgebungsvariablen und Konfigurationsdateien
    - Online-Anzeige von Aufgabenprotokollen
    - Sekundengenaue Aufgabenplanung
    - Systembenachrichtigungen
    - Dark Mode
    - Bedienung per Mobiltelefon
