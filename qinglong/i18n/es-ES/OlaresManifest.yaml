metadata:
  title: Qinglong
  description: Plataforma de gestión de tareas programadas
spec:
  fullDescription: |
    **¿Qué es qinglong?**
    Qinglong es una plataforma de gestión de tareas programadas compatible con Python3, JavaScript, Shell y Typescript.

    **Funciones**
    - Compatibilidad con varios lenguajes de scripting (python3, javaScript, shell, typescript)
    - Gestión en línea de scripts, variables de entorno y archivos de configuración
    - Visualización en línea de registros de tareas
    - Configuración de tareas a nivel de segundos
    - Notificaciones a nivel de sistema
    - Modo oscuro
    - Operación desde el teléfono
