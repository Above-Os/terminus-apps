metadata:
  title: Qinglong
  description: Piattaforma di gestione delle attività pianificate
spec:
  fullDescription: |
    **Cos'è qinglong?**
    Qinglong è una piattaforma di gestione delle attività pianificate che supporta Python3, JavaScript, Shell e Typescript.

    **Funzionalità**
    - Supporto per più linguaggi di scripting (python3, javaScript, shell, typescript)
    - Gestione online di script, variabili d'ambiente e file di configurazione
    - Visualizzazione online dei log delle attività
    - Impostazione attività a livello di secondi
    - Notifiche a livello di sistema
    - Modalità scura
    - Operazione da telefono
