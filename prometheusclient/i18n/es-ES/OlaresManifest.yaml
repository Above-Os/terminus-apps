  fullDescription: |
    Prometheus, un proyecto de la Cloud Native Computing Foundation, es un sistema de monitorización de sistemas y servicios. Recoge métricas de objetivos configurados a intervalos dados, evalúa expresiones de reglas, muestra los resultados y puede disparar alertas cuando se observan condiciones especificadas.

    Las características que distinguen a Prometheus de otros sistemas de métricas y monitorización son:
    - Un modelo de datos multidimensional (series temporales definidas por el nombre de la métrica y un conjunto de dimensiones clave/valor)
    - PromQL, un lenguaje de consulta potente y flexible para aprovechar esta dimensionalidad
    - Sin dependencia de almacenamiento distribuido; los nodos de servidor individuales son autónomos
    - Un modelo HTTP pull para la recogida de series temporales
    - El envío (push) de series temporales se admite mediante una puerta de enlace intermediaria para trabajos por lotes
    - Los objetivos se descubren mediante service discovery o configuración estática
    - Varios modos de gráficos y cuadros de mando
    - Compatibilidad con federación jerárquica y horizontal
