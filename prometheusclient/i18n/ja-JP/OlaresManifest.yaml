metadata:
  title: Prometheus
  description: メトリクスからインサイトへ
spec:
  upgradeDescription: |
    [BUGFIX] Scraping: 明示的なタイムスタンプ付きで同一シリーズへの複数サンプルを許可。#14685
    [BUGFIX] Docker SD: コンテナが新しいネットワークに再接続されたときの match_first_network モードのクラッシュを修正。#14654
    [BUGFIX] PromQL: 古いサンプルでの実験的ネイティブヒストグラムのカウンターリセット検出を修正。#14514
    [BUGFIX] PromQL: レンジクエリの vector selector バグによる実験的ネイティブヒストグラムの破損を修正。#14538
    [BUGFIX] PromQL: histogram_count または histogram_sum 使用時の実験的ネイティブヒストグラムのメモリ破損を修正。#14605
    完全なリリースノート: https://github.com/prometheus/prometheus/releases/tag/v2.54.1
  fullDescription: |
    Prometheus は Cloud Native Computing Foundation のプロジェクトで、システムおよびサービスの監視システムです。設定されたターゲットから指定間隔でメトリクスを収集し、ルール式を評価して結果を表示し、指定条件が観測されたときにアラートを発火できます。

    Prometheus を他のメトリクス／監視システムと区別する特徴は次のとおりです:
    - 多次元データモデル（メトリクス名とキー／値ディメンションの集合で定義される時系列）
    - この次元性を活かす強力で柔軟なクエリ言語 PromQL
    - 分散ストレージへの依存なし；単一サーバーノードが自律的
    - 時系列収集のための HTTP プルモデル
    - バッチジョブ向け中間ゲートウェイ経由の時系列プッシュをサポート
    - サービスディスカバリまたは静的設定によるターゲット検出
    - 複数のグラフ／ダッシュボードモード
    - 階層的および水平的フェデレーションのサポート
