metadata:
  title: Prometheus
  description: Von Metriken zu Erkenntnissen
spec:
  upgradeDescription: |
    [BUGFIX] Scraping: mehrere Samples auf derselben Serie mit expliziten Zeitstempeln zulassen. #14685
    [BUGFIX] Docker SD: Absturz im Modus match_first_network beheben, wenn ein Container mit einem neuen Netzwerk verbunden wird. #14654
    [BUGFIX] PromQL: Erkennung des experimentellen Native-Histogram-Counter-Resets bei veralteten Samples beheben. #14514
    [BUGFIX] PromQL: Korruption experimenteller Native Histograms durch Vector-Selector-Bug in Range-Queries beheben. #14538
    [BUGFIX] PromQL: Speicherkorruption experimenteller Native Histograms bei Verwendung von histogram_count oder histogram_sum beheben. #14605
    Vollständige Release Notes: https://github.com/prometheus/prometheus/releases/tag/v2.54.1
  fullDescription: |
    Prometheus, ein Projekt der Cloud Native Computing Foundation, ist ein System- und Dienstüberwachungssystem. Es erfasst in festgelegten Intervallen Metriken von konfigurierten Zielen, wertet Regelausdrücke aus, zeigt die Ergebnisse an und kann Alarme auslösen, wenn festgelegte Bedingungen beobachtet werden.

    Die Merkmale, die Prometheus von anderen Metrik- und Überwachungssystemen unterscheiden, sind:
    - Ein multidimensionales Datenmodell (Zeitreihen definiert durch Metriknamen und Schlüssel/Wert-Dimensionen)
    - PromQL, eine leistungsstarke und flexible Abfragesprache zur Nutzung dieser Dimensionalität
    - Keine Abhängigkeit von verteiltem Speicher; einzelne Serverknoten sind autonom
    - Ein HTTP-Pull-Modell zur Erfassung von Zeitreihen
    - Das Pushen von Zeitreihen wird über ein Zwischen-Gateway für Batch-Jobs unterstützt
    - Ziele werden über Service Discovery oder statische Konfiguration erkannt
    - Mehrere Modi für Grafiken und Dashboards
    - Unterstützung für hierarchische und horizontale Föderation
