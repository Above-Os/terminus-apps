    [BUGFIX] PromQL: correggere il rilevamento del counter reset degli histogram nativi sperimentali su sample stale. #14514
    [BUGFIX] PromQL: correggere la corruzione degli histogram nativi sperimentali dovuta a un bug del vector selector nelle range query. #14538
