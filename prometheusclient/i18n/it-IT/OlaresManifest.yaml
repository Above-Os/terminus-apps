    Consulta la nota di rilascio completa su: https://github.com/prometheus/prometheus/releases/tag/v2.54.1
  fullDescription: |
    Prometheus, un progetto della Cloud Native Computing Foundation, è un sistema di monitoraggio di sistemi e servizi. Raccoglie metriche da target configurati a intervalli dati, valuta espressioni di regole, visualizza i risultati e può attivare alert quando si osservano condizioni specificate.

    Le caratteristiche che distinguono Prometheus da altri sistemi di metriche e monitoraggio sono:
    - Un modello di dati multidimensionale (serie temporali definite dal nome della metrica e da un insieme di dimensioni chiave/valore)
    - PromQL, un linguaggio di query potente e flessibile per sfruttare questa dimensionalità
    - Nessuna dipendenza da storage distribuito; i singoli nodi server sono autonomi
    - Un modello HTTP pull per la raccolta di serie temporali
    - Il push di serie temporali è supportato tramite un gateway intermediario per i batch job
    - I target vengono scoperti tramite service discovery o configurazione statica
    - Più modalità di grafici e dashboard
    - Supporto per la federazione gerarchica e orizzontale
