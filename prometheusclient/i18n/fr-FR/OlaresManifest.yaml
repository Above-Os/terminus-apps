    Consultez la note de version complète sur : https://github.com/prometheus/prometheus/releases/tag/v2.54.1
  fullDescription: |
    Prometheus, un projet de la Cloud Native Computing Foundation, est un système de surveillance des systèmes et des services. Il collecte des métriques auprès de cibles configurées à des intervalles donnés, évalue des expressions de règles, affiche les résultats et peut déclencher des alertes lorsque des conditions spécifiées sont observées.

    Les fonctionnalités qui distinguent Prometheus des autres systèmes de métriques et de surveillance sont :
    - Un modèle de données multidimensionnel (séries temporelles définies par le nom de la métrique et un ensemble de dimensions clé/valeur)
    - PromQL, un langage de requête puissant et flexible pour tirer parti de cette dimensionalité
    - Aucune dépendance au stockage distribué ; les nœuds serveur individuels sont autonomes
    - Un modèle HTTP pull pour la collecte de séries temporelles
    - Le push de séries temporelles est pris en charge via une passerelle intermédiaire pour les travaux par lots
    - Les cibles sont découvertes via service discovery ou configuration statique
    - Plusieurs modes de graphiques et de tableaux de bord
    - Prise en charge de la fédération hiérarchique et horizontale
