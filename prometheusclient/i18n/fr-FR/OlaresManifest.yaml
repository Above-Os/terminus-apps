metadata:
  title: Prometheus
  description: "Des métriques à l'insight"
spec:
  upgradeDescription: |
    [BUGFIX] Scraping : autoriser plusieurs samples sur la même série, avec des horodatages explicites. #14685
    [BUGFIX] Docker SD : corriger un plantage en mode match_first_network lorsqu'un conteneur est reconnecté à un nouveau réseau. #14654
    [BUGFIX] PromQL : corriger la détection de réinitialisation de compteur des histogrammes natifs expérimentaux sur des samples obsolètes. #14514
    [BUGFIX] PromQL : corriger la corruption des histogrammes natifs expérimentaux due à un bug du vector selector dans les requêtes de plage. #14538
