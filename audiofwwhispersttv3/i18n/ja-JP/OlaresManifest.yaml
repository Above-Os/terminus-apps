metadata:
  title: Whisper Large V3 (FW)
  description: 多言語の音声を文字起こしするローカル音声認識モデル

spec:
  upgradeDescription: |
    v1.0.21: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

  fullDescription: |
    Whisper Large V3 (FW)は、録音内の音声をテキストに変換します。Faster-WhisperエンジンでOpenAI Whisper Large V3をローカルに実行します。

    **主な機能**
    - 複数の言語で録音音声を文字起こしします。
    - 話されている言語を自動検出します。
    - 文字起こしの各区間にタイムスタンプを追加します。
    - 対応するOlaresアプリから文字起こし機能を利用できます。

    `8Gi`以上のGPUメモリを搭載した対応NVIDIA GPUが必要です。
