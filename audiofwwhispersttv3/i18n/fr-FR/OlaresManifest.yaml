metadata:
  title: Whisper Large V3 (FW)
  description: Un modèle local de reconnaissance vocale pour transcrire des enregistrements multilingues

spec:
  upgradeDescription: |
    v1.0.21: L’état d’exécution est stocké dans Common pour permettre le fonctionnement sur plusieurs nœuds. La configuration existante dans Common est prioritaire. Sinon, le Cache local précédent est migré ou l’état est initialisé dans Common. Au démarrage du moteur, la lecture des scripts utilitaires partagés est réessayée en cas d’échec.

  fullDescription: |
    Whisper Large V3 (FW) convertit la parole d'un enregistrement audio en texte. Il exécute OpenAI Whisper Large V3 avec le moteur Faster-Whisper pour la transcription locale.

    **Fonctionnalités principales**
    - Transcrire des enregistrements dans plusieurs langues.
    - Détecter automatiquement la langue parlée.
    - Ajouter des horodatages aux segments transcrits.
    - Mettre la transcription à disposition des applications Olares compatibles.

    Un GPU NVIDIA compatible disposant d'au moins `8Gi` de mémoire vidéo est requis.
