metadata:
  description: 用于多语言音频转写的本地语音识别模型
  title: Whisper Large V3 (FW)

spec:
  onlyAdmin: true
  fullDescription: |
    Faster-Whisper Large V3 可将音频录音中的语音转换为文本。它使用 Systran 基于 CTranslate2 转换的 OpenAI Whisper Large V3 模型，在本地完成转写。

    **主要功能**
    - 转写多种语言的录音。
    - 自动检测音频中的语言。
    - 为转写片段添加时间戳。
    - 向兼容的 Olares 应用提供转写能力。

    需要配备至少 `8Gi` 显存的兼容 NVIDIA GPU。
  upgradeDescription: |
    v1.0.0：首次发布。
