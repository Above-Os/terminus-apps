metadata:
  title: "Confucius4 + MING"
  description: "Streaming Chinese-English speech translation"
spec:
  upgradeDescription: "Initial release of Chinese-English speech translation."
  fullDescription: "Chinese-English speech translation combines R2T2 speech recognition, T3PO Q5_K_M translation and MING 0.5B speech generation. Accepts complete WAV files or live 16 kHz PCM and returns translated text and 24 kHz speech. Supports both directions, incremental output and asynchronous tasks. One active session at a time. Neural inference runs on a compatible NVIDIA GPU; reference audio conditions the generated voice."
