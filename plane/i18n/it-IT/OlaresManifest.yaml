metadata:
  title: Plane
  description: Alternativa open source a JIRA, Linear, Monday e Asana
spec:
  fullDescription: |
    Ecco Plane, uno strumento open source di project management per tracciare issue, gestire cycle e product roadmap senza il caos di gestire lo strumento stesso.
    
    Funzionalità
    Issues Crea e gestisci attività in modo efficiente con un robusto editor rich text che supporta il caricamento di file. Migliora organizzazione e tracciamento aggiungendo sotto-proprietà e riferimenti a issue correlate.
    
    Cycles Mantieni lo slancio del team con i Cycles. Segui i progressi senza sforzo con burn-down chart e altri strumenti informativi.
    
    Modules Semplifica progetti complessi dividendoli in moduli più piccoli e gestibili.
    
    Views Personalizza il flusso di lavoro creando filtri per mostrare solo le issue più rilevanti. Salva e condividi queste viste con facilità.
    
    Pages Cattura e organizza idee con Plane Pages, complete di capacità IA e un editor rich text. Formatta testo, inserisci immagini, aggiungi collegamenti o converti le note in elementi azionabili.
    
    Analytics Accedi a insight in tempo reale su tutti i tuoi dati Plane. Visualizza tendenze, rimuovi bloccanti e tieni i progetti in movimento.
    
    Drive (in arrivo): Il drive ti aiuta a condividere documenti, immagini, video o altri file utili a te o al team e ad allinearvi su problema/soluzione.
