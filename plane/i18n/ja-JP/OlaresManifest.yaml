metadata:
  title: Plane
  description: JIRA、Linear、Monday、Asana のオープンソース代替
spec:
  fullDescription: |
    Plane は、ツール自体を管理する混乱なしに、Issue の追跡、Cycle の実行、プロダクトロードマップの管理ができるオープンソースのプロジェクト管理ツールです。
    
    機能
    Issues ファイルアップロード対応の堅牢なリッチテキストエディターでタスクを効率的に作成・管理。サブプロパティの追加や関連 Issue の参照で整理と追跡を強化。
    
    Cycles Cycle でチームの勢いを維持。バーンダウンチャートなどの洞察ツールで進捗を簡単に追跡。
    
    Modules 複雑なプロジェクトを小さく管理しやすいモジュールに分割して簡素化。
    
    Views 最も関連性の高い Issue だけを表示するフィルターを作成してワークフローをカスタマイズ。ビューを簡単に保存・共有。
    
    Pages AI 機能とリッチテキストエディター付きの Plane Pages でアイデアをキャプチャ・整理。テキスト整形、画像挿入、ハイパーリンク追加、メモのアクション項目化。
    
    Analytics すべての Plane データにリアルタイムでアクセス。トレンドを可視化し、ブロッカーを除去し、プロジェクトを前進させ続けます。
    
    Drive（近日公開）：ドキュメント、画像、動画などチームに意味のあるファイルを共有し、問題／解決策で足並みを揃えるのに役立ちます。
