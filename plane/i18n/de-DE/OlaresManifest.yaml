metadata:
  title: Plane
  description: Open-Source-Alternative zu JIRA, Linear, Monday und Asana
spec:
  fullDescription: |
    Lernen Sie Plane kennen: ein quelloffenes Projektmanagement-Tool zum Verfolgen von Issues, Durchführen von Cycles und Verwalten von Produkt-Roadmaps – ohne das Chaos, das Tool selbst zu managen.
    
    Funktionen
    Issues Erstellen und verwalten Sie Aufgaben effizient mit einem robusten Rich-Text-Editor, der Datei-Uploads unterstützt. Verbessern Sie Organisation und Nachverfolgung durch Unter-Eigenschaften und Verweise auf verwandte Issues.
    
    Cycles Halten Sie den Schwung Ihres Teams mit Cycles aufrecht. Verfolgen Sie den Fortschritt mühelos mit Burn-down-Charts und anderen aufschlussreichen Tools.
    
    Modules Vereinfachen Sie komplexe Projekte, indem Sie sie in kleinere, handhabbare Module unterteilen.
    
    Views Passen Sie Ihren Workflow an, indem Sie Filter erstellen, die nur die relevantesten Issues anzeigen. Speichern und teilen Sie diese Views mühelos.
    
    Pages Erfassen und organisieren Sie Ideen mit Plane Pages, komplett mit KI-Funktionen und einem Rich-Text-Editor. Formatieren Sie Text, fügen Sie Bilder ein, fügen Sie Hyperlinks hinzu oder wandeln Sie Notizen in umsetzbare Items um.
    
    Analytics Greifen Sie auf Echtzeit-Einblicke in all Ihre Plane-Daten zu. Visualisieren Sie Trends, entfernen Sie Blocker und halten Sie Ihre Projekte in Bewegung.
    
    Drive (demnächst): Der Drive hilft Ihnen, Dokumente, Bilder, Videos oder andere Dateien zu teilen, die für Sie oder Ihr Team Sinn ergeben, und sich auf Problem/Lösung abzustimmen.
