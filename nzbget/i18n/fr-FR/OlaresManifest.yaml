metadata:
  title: Nzbget
  description: Téléchargeur Usenet efficace
spec:
  fullDescription: |
    NZBGet est un téléchargeur binaire qui télécharge des fichiers depuis Usenet à partir des informations des fichiers nzb.

    **À propos de cette app**
    Le projet NZBGet d’origine était maintenu sur [nzbget/nzbget](https://github.com/nzbget/nzbget) (hugbug). Le développement continue sous le successeur communautaire [nzbgetcom/nzbget](https://github.com/nzbgetcom/nzbget), utilisé par cette app Olares.

    - Projet d’origine : https://github.com/nzbget/nzbget
    - Successeur actif : https://github.com/nzbgetcom/nzbget


  upgradeDescription: |
    Mise à niveau de NZBGet vers la version 26.2 (2026-06-26)
    Changements de configuration : répertoire de téléchargement unifié et niveau d’auth de l’entrée.
    - Chemin de montage par défaut du Home Directory Olares changé en /olares/userdata/home
    - Ajout du montage Olares External Directory vers /olares/userdata/external
    - Conservation du montage legacy /downloads pour les configurations existantes
    - Chemin de téléchargement par défaut pour les nouvelles installations : Home/Downloads/nzbget
    - Niveau d’auth de l’entrée passé à internal
