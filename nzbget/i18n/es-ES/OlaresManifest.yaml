metadata:
  title: Nzbget
  description: Descargador eficiente de Usenet
spec:
  fullDescription: |
    NZBGet es un descargador binario que descarga archivos de Usenet según la información de los archivos nzb.

    **Acerca de esta app**
    El proyecto original NZBGet se mantenía en [nzbget/nzbget](https://github.com/nzbget/nzbget) (hugbug). El desarrollo continúa en el sucesor comunitario [nzbgetcom/nzbget](https://github.com/nzbgetcom/nzbget), que usa esta app de Olares.

    - Proyecto original: https://github.com/nzbget/nzbget
    - Sucesor activo: https://github.com/nzbgetcom/nzbget


  upgradeDescription: |
    Actualización de NZBGet a la versión 26.2 (2026-06-26)
    Cambios de configuración: directorio de descarga unificado y nivel de auth de la entrada.
    - Cambiar la ruta de montaje predeterminada del Home Directory de Olares a /olares/userdata/home
    - Añadir Olares External Directory con montaje en /olares/userdata/external
    - Mantener el montaje legado /downloads para configuraciones existentes
    - Ruta de descarga predeterminada para instalaciones nuevas: Home/Downloads/nzbget
    - Nivel de auth de la entrada cambiado a internal
