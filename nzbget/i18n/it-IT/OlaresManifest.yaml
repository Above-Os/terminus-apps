metadata:
  title: Nzbget
  description: Downloader Usenet efficiente
spec:
  fullDescription: |
    NZBGet è un downloader binario che scarica file da Usenet in base alle informazioni nei file nzb.

    **Informazioni su questa app**
    Il progetto originale NZBGet era mantenuto su [nzbget/nzbget](https://github.com/nzbget/nzbget) (hugbug). Lo sviluppo continua con il successore community [nzbgetcom/nzbget](https://github.com/nzbgetcom/nzbget), usato da questa app Olares.

    - Progetto originale: https://github.com/nzbget/nzbget
    - Successore attivo: https://github.com/nzbgetcom/nzbget


  upgradeDescription: |
    Aggiornamento di NZBGet alla versione 26.2 (2026-06-26)
    Modifiche di configurazione: directory di download unificata e livello auth dell’ingresso.
    - Percorso di mount predefinito della Home Directory Olares impostato su /olares/userdata/home
    - Aggiunta Olares External Directory con mount su /olares/userdata/external
    - Conservato il mount legacy /downloads per le configurazioni esistenti
    - Percorso di download predefinito per nuove installazioni: Home/Downloads/nzbget
    - Livello auth dell’ingresso impostato su internal
