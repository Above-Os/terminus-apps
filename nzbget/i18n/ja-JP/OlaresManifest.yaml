metadata:
  title: Nzbget
  description: 効率的な Usenet ダウンローダー。
spec:
  fullDescription: |
    NZBGet は、nzb ファイルの情報に基づいて Usenet からファイルをダウンロードするバイナリダウンローダーです。

    **このアプリについて**
    元の NZBGet プロジェクトは [nzbget/nzbget](https://github.com/nzbget/nzbget)（hugbug）でメンテナンスされていました。開発はコミュニティ後継の [nzbgetcom/nzbget](https://github.com/nzbgetcom/nzbget) で継続しており、この Olares アプリはそれを使用します。

    - オリジナルプロジェクト: https://github.com/nzbget/nzbget
    - アクティブな後継: https://github.com/nzbgetcom/nzbget


  upgradeDescription: |
    NZBGet をバージョン 26.2（2026-06-26）へアップグレード
    設定変更: ダウンロードディレクトリの統一と入口の認証レベル。
    - Olares Home Directory のデフォルトマウントパスを /olares/userdata/home に変更
    - Olares External Directory のマウントパス /olares/userdata/external を追加
    - 既存設定向けにレガシーの /downloads マウントを維持
    - 新規インストールのデフォルトダウンロードパス: Home/Downloads/nzbget
    - 入口の認証レベルを internal に変更
