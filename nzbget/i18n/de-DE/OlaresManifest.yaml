metadata:
  title: Nzbget
  description: Effizienter Usenet-Downloader.
spec:
  fullDescription: |
    NZBGet ist ein Binär-Downloader, der Dateien aus dem Usenet anhand der Angaben in nzb-Dateien herunterlädt.

    **Über diese App**
    Das ursprüngliche NZBGet-Projekt wurde unter [nzbget/nzbget](https://github.com/nzbget/nzbget) (hugbug) gepflegt. Die Weiterentwicklung erfolgt unter dem Community-Nachfolger [nzbgetcom/nzbget](https://github.com/nzbgetcom/nzbget), den diese Olares-App verwendet.

    - Originalprojekt: https://github.com/nzbget/nzbget
    - Aktiver Nachfolger: https://github.com/nzbgetcom/nzbget


  upgradeDescription: |
    Upgrade von NZBGet auf Version 26.2 (2026-06-26)
    Konfigurationsänderungen: einheitliches Download-Verzeichnis & Entrance-Auth-Level.
    - Standard-Mountpfad des Olares Home Directory auf /olares/userdata/home geändert
    - Olares External Directory Mountpfad /olares/userdata/external hinzugefügt
    - Legacy-Mount /downloads für bestehende Konfigurationen beibehalten
    - Standard-Downloadpfad für Neuinstallationen: Home/Downloads/nzbget
    - Entrance-Auth-Level auf internal geändert
