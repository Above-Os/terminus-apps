metadata:
  title: RabbitMQ
  description: すべてをキューに入れるブローカー
spec:
  fullDescription: |
    RabbitMQ は信頼性が高く成熟したメッセージング＆ストリーミングブローカーで、クラウド、オンプレミス、ローカルマシンに簡単にデプロイできます。現在、世界中で数百万人に利用されています。

    主な機能
    # 相互運用性
    RabbitMQ は AMQP 1.0 や MQTT 5.0 を含む複数のオープン標準プロトコルをサポートします。お好みのプログラミング言語向けのクライアントライブラリが多数あり、ベンダーロックインはありません。

    # 柔軟性
    パブリッシャーから1つまたは多数のコンシューマーへメッセージが届く方法を定義するため、多くのオプションを組み合わせられます。ルーティング、フィルタリング、ストリーミング、フェデレーションなど。

    # 信頼性
    メッセージ配信の確認応答とクラスタ間のレプリケーションにより、RabbitMQ でメッセージを安全に保てます。

    サポートプロトコル
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1、3.1.1、および 5.0
    - STOMP 1.0 〜 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket（VMware Tanzu RabbitMQ でサポート）
