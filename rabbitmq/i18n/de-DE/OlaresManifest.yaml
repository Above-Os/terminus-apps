metadata:
  title: RabbitMQ
  description: Ein Broker, der alles in die Warteschlange stellt
spec:
  fullDescription: |
    RabbitMQ ist ein zuverlässiger und ausgereifter Messaging- und Streaming-Broker, der sich leicht in Cloud-Umgebungen, On-Premises und auf Ihrem lokalen Rechner bereitstellen lässt. Er wird derzeit weltweit von Millionen genutzt.

    Wichtige Funktionen
    # Interoperabel
    RabbitMQ unterstützt mehrere offene Standardprotokolle, darunter AMQP 1.0 und MQTT 5.0. Es gibt zahlreiche Client-Bibliotheken für Ihre bevorzugte Programmiersprache — wählen Sie einfach eine. Kein Vendor Lock-in!

    # Flexibel
    RabbitMQ bietet viele Optionen, die Sie kombinieren können, um festzulegen, wie Nachrichten vom Publisher zu einem oder vielen Consumern gelangen. Routing, Filterung, Streaming, Federation und mehr.

    # Zuverlässig
    Mit der Möglichkeit, die Nachrichtenlieferung zu bestätigen und Nachrichten über einen Cluster zu replizieren, können Sie sicherstellen, dass Ihre Nachrichten bei RabbitMQ sicher sind.

    Unterstützte Protokolle
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1, 3.1.1 und 5.0
    - STOMP 1.0 bis 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket (unterstützt in VMware Tanzu RabbitMQ)
