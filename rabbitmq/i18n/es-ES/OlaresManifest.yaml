metadata:
  title: RabbitMQ
  description: Un broker para encolarlos a todos
spec:
  fullDescription: |
    RabbitMQ es un broker de mensajería y streaming fiable y maduro, fácil de desplegar en la nube, on-premises y en tu máquina local. Actualmente lo usan millones de personas en todo el mundo.

    Funciones clave
    # Interoperable
    RabbitMQ admite varios protocolos estándar abiertos, incluidos AMQP 1.0 y MQTT 5.0. Hay múltiples bibliotecas cliente disponibles para tu lenguaje de programación favorito. ¡Sin dependencia de un proveedor!

    # Flexible
    RabbitMQ ofrece muchas opciones que puedes combinar para definir cómo van tus mensajes del publicador a uno o muchos consumidores. Enrutamiento, filtrado, streaming, federación y más.

    # Fiable
    Con la capacidad de acusar recibo de la entrega de mensajes y de replicarlos en un clúster, puedes asegurar que tus mensajes están a salvo con RabbitMQ.

    Protocolos admitidos
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1, 3.1.1 y 5.0
    - STOMP 1.0 a 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket (admitido en VMware Tanzu RabbitMQ)
