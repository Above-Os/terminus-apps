metadata:
  title: RabbitMQ
  description: Un broker pour tous les mettre en file
spec:
  fullDescription: |
    RabbitMQ est un broker de messagerie et de streaming fiable et mature, facile à déployer dans le cloud, on-premises et sur votre machine locale. Il est actuellement utilisé par des millions de personnes dans le monde.

    Fonctionnalités clés
    # Interopérable
    RabbitMQ prend en charge plusieurs protocoles standards ouverts, dont AMQP 1.0 et MQTT 5.0. De nombreuses bibliothèques clientes sont disponibles pour votre langage de programmation préféré. Pas de vendor lock-in !

    # Flexible
    RabbitMQ offre de nombreuses options à combiner pour définir comment vos messages vont de l'éditeur à un ou plusieurs consommateurs. Routage, filtrage, streaming, fédération, etc.

    # Fiable
    Avec la capacité d'accuser réception de la livraison des messages et de les répliquer dans un cluster, vous pouvez vous assurer que vos messages sont en sécurité avec RabbitMQ.

    Protocoles pris en charge
    - AMQP 1.0
    - AMQP 0-9-1
    - RabbitMQ Stream Protocol
    - MQTT 3.1, 3.1.1 et 5.0
    - STOMP 1.0 à 1.2
    - MQTT over WebSocket
    - STOMP over WebSocket
    - AMQP 1.0 over WebSocket (pris en charge dans VMware Tanzu RabbitMQ)
