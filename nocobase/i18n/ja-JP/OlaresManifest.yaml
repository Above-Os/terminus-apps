  fullDescription: |
    **デフォルト認証情報**
    管理者ユーザー名: admin@nocobase.com
    管理者パスワード:  admin123
    できるだけ早くユーザー名とパスワードを変更してください。

    **概要**
    NocoBase は拡張性を最優先にしたオープンソースのノーコード開発プラットフォームです。

    **機能**

    データモデル駆動
    - データと UI を分離
    - 同一テーブル・レコードに対し、任意の数・形式で複数のブロックとアクションを作成可能
    - メインデータベース、外部データベース、サードパーティ API をデータソースとしてサポート

    見たままが得られる（WYSIWYG）
    - 利用モードと設定モードをワンクリックで切替
    - ページはキャンバスとして機能し、Notion のように各種ブロックとアクションを配置して画面を構成
    - UI 設定モードはプログラマー向けではなく一般ユーザー向けに設計

    すべてがプラグインとして実装され、拡張開発向け
    - WordPress のように全機能がプラグインであるマイクロカーネルアーキテクチャを採用
    - インストール後すぐに利用可能
    - ページ、ブロック、アクション、API、データソースなど、新要件に応じて新プラグインを開発可能

    ログと監視
    - ログプラグインはインターフェースリクエストログとシステム操作ログを提供
    - ログレベル、ローリング方針、サイズ、出力形式などの設定に対応
    - OpenTelemetry や Prometheus などのテレメトリプラグイン群により、任意の指標を監視可能

    サードパーティシステムとの統合
    - サードパーティデータベースをデータソースとして使用
    - 他システムの API をデータソースとして利用
    - シームレス認証のためのシングルサインオン（SSO）
    - サードパーティシステムと一体となるようシームレスに統合
    - 複数の NocoBase アプリケーション間でマルチアプリおよび親子アプリを実現

