  fullDescription: |
    **Credenciales predeterminadas**
    Nombre de usuario admin: admin@nocobase.com
    Contraseña admin:  admin123
    Cambie el nombre de usuario y la contraseña lo antes posible.

    **RESUMEN**
    NocoBase es una plataforma de desarrollo no-code de código abierto orientada a la extensibilidad.

    **Funciones**

    Impulsado por el modelo de datos
    - Desacoplar datos y UI
    - Se pueden crear múltiples bloques y acciones para la misma tabla y registro en cualquier cantidad y forma
    - Compatible con base de datos principal, bases externas y APIs de terceros como fuentes de datos

    Lo que ves es lo que obtienes
    - Cambio con un clic entre modo de uso y modo de configuración
    - Las páginas sirven de lienzo donde se colocan bloques y acciones para componer interfaces adecuadas, como Notion
    - El modo de configuración de UI está pensado para usuarios normales, no para programadores

    Todo se implementa como plugins, diseñado para el desarrollo de extensiones
    - Adopta una arquitectura de microkernel donde todas las funcionalidades son plugins, como Wordpress
    - Los plugins están listos para usar tras la instalación
    - Ya sean páginas, bloques, acciones, APIs o fuentes de datos, se pueden desarrollar nuevos plugins para nuevos requisitos

    Registro y monitorización
    - El plugin de logging ofrece registros de solicitudes de interfaz y de operaciones del sistema
    - Compatible con configuraciones como niveles de log, políticas de rotación, tamaño y formatos de impresión
    - Una serie de plugins de telemetría integra instalaciones como OpenTelemetry y Prometheus, permitiendo monitorizar cualquier métrica

    Integración con sistemas de terceros
    - Usar bases de datos de terceros como fuentes de datos
    - Utilizar APIs de otros sistemas como fuentes de datos
    - Single Sign-On (SSO) para autenticación fluida
    - Integrarse sin fisuras con sistemas de terceros, formando una sola entidad
    - Implementar multi-aplicaciones y aplicaciones padre-hijo entre varias aplicaciones NocoBase

