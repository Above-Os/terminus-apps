metadata:
  title: Windows
  description: Windows auf Olares ausführen
spec:
  fullDescription: |
    Diese App hilft Ihnen, Windows auf Olares auszuführen.
    Basierend auf dockurs Windows in einem Docker-Container.

    **Funktionen**
    - ISO-Downloader
    - KVM-Beschleunigung
    - Webbasierter Viewer

    **Unterstützte Windows-Versionen**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 Enterprise
    - Windows 8.1 Enterprise
    - Windows 7 Ultimate
    - Windows Vista Ultimate
    - Windows 2000 Professional
    - Windows Server 2025
    - Windows Server 2022
    - Windows Server 2019
    - Windows Server 2016
    - Windows Server 2012
    - Windows Server 2008
    - Windows Server 2003
  upgradeDescription: |
    v1.1.9: Ein mögliches Problem behoben, durch das Datenträger virtueller Windows-Maschinen nach bestimmten Upgrades als fehlend erscheinen konnten.

    v1.1.8: Dauerhafte VM-Daten in `appCache` belassen (keine appData-Migration); Ausführung nur auf control-plane (master) planen; `PASSWORD` in Kubernetes Secret (`secretKeyRef`) verschieben.
