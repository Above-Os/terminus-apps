metadata:
  title: Windows
  description: Ejecuta Windows en Olares
spec:
  fullDescription: |
    Esta aplicación te ayuda a ejecutar Windows en Olares.
    Basada en Windows de dockur dentro de un contenedor Docker.

    **Funciones**
    - Descargador de ISO
    - Aceleración KVM
    - Visor web

    **Versiones de Windows compatibles**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 Enterprise
    - Windows 8.1 Enterprise
    - Windows 7 Ultimate
    - Windows Vista Ultimate
    - Windows 2000 Professional
    - Windows Server 2025
    - Windows Server 2022
    - Windows Server 2019
    - Windows Server 2016
    - Windows Server 2012
    - Windows Server 2008
    - Windows Server 2003
  upgradeDescription: |
    v1.1.9: Se corrige un posible problema por el que los discos de las VM de Windows podían aparecer como ausentes después de determinadas actualizaciones.

    v1.1.8: Se conservan los datos duraderos de la VM en `appCache` (sin migración a appData); se programa únicamente en control-plane (master); se traslada `PASSWORD` a Kubernetes Secret (`secretKeyRef`).
