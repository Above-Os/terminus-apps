metadata:
  title: Windows
  description: Esegui Windows su Olares
spec:
  fullDescription: |
    Questa app ti aiuta a eseguire Windows su Olares.
    Basata su Windows di dockur all'interno di un container Docker.

    **Funzionalità**
    - Downloader ISO
    - Accelerazione KVM
    - Visualizzatore Web

    **Versioni di Windows supportate**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 Enterprise
    - Windows 8.1 Enterprise
    - Windows 7 Ultimate
    - Windows Vista Ultimate
    - Windows 2000 Professional
    - Windows Server 2025
    - Windows Server 2022
    - Windows Server 2019
    - Windows Server 2016
    - Windows Server 2012
    - Windows Server 2008
    - Windows Server 2003
  upgradeDescription: |
    v1.1.9: Corretto un potenziale problema per cui i dischi delle VM Windows potevano risultare mancanti dopo determinati aggiornamenti.

    v1.1.8: I dati persistenti della VM restano in `appCache` (nessuna migrazione ad appData); pianificazione solo su control-plane (master); `PASSWORD` spostata in Kubernetes Secret (`secretKeyRef`).
