metadata:
  title: Windows
  description: Exécutez Windows sur Olares
spec:
  fullDescription: |
    Cette application vous aide à exécuter Windows sur Olares.
    Basée sur Windows de dockur dans un conteneur Docker.

    **Fonctionnalités**
    - Téléchargeur d'ISO
    - Accélération KVM
    - Visionneuse Web

    **Versions de Windows prises en charge**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 Enterprise
    - Windows 8.1 Enterprise
    - Windows 7 Ultimate
    - Windows Vista Ultimate
    - Windows 2000 Professional
    - Windows Server 2025
    - Windows Server 2022
    - Windows Server 2019
    - Windows Server 2016
    - Windows Server 2012
    - Windows Server 2008
    - Windows Server 2003
  upgradeDescription: |
    v1.1.9 : correction d'un problème potentiel pouvant faire apparaître les disques des VM Windows comme manquants après certaines mises à niveau.

    v1.1.8 : conservation des données durables de la VM dans `appCache` (aucune migration appData) ; planification uniquement sur control-plane (master) ; déplacement de `PASSWORD` dans Kubernetes Secret (`secretKeyRef`).
