metadata:
  title: Windows
  description: Olares 上で Windows を実行
spec:
  fullDescription: |
    このアプリを使用すると、Olares 上で Windows を実行できます。
    dockur の Docker コンテナ内 Windows を基盤としています。

    **機能**
    - ISO ダウンローダー
    - KVM アクセラレーション
    - Web ベースのビューアー

    **対応 Windows バージョン**
    - Windows 11 Pro
    - Windows 11 LTSC
    - Windows 11 Enterprise
    - Windows 10 Pro
    - Windows 10 Enterprise
    - Windows 8.1 Enterprise
    - Windows 7 Ultimate
    - Windows Vista Ultimate
    - Windows 2000 Professional
    - Windows Server 2025
    - Windows Server 2022
    - Windows Server 2019
    - Windows Server 2016
    - Windows Server 2012
    - Windows Server 2008
    - Windows Server 2003
  upgradeDescription: |
    v1.1.9: 特定のアップグレード後に Windows VM のディスクが見つからないように見える可能性がある問題を修正。

    v1.1.8: 永続的な VM データを `appCache` に保持（appData への移行なし）。control-plane（master）のみにスケジュール。`PASSWORD` を Kubernetes Secret（`secretKeyRef`）へ移動。
