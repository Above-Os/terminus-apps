metadata:
  title: SillyTavern
  description: パワーユーザー向け LLM フロントエンド
spec:
  fullDescription: |
    SillyTavern は、テキスト生成 LLM、画像生成エンジン、TTS 音声モデルとやり取りできるローカルインストール型ユーザーインターフェースです。
    
    2023年2月に TavernAI 1.2.8 のフォークとして始まり、現在は 200 人以上の貢献者と 2 年の独立開発を経て、熟練した AI 愛好家向けの主要ソフトウェアであり続けています。
    
    **主な機能**
    - コミュニティ製プリセット多数を備えた高度なテキスト生成設定
    - World Info サポート: リッチなロアを作成、またはキャラクターカードのトークンを節約
    - グループチャット: キャラクターがあなたや互いに話すマルチボットルーム
    - 豊富な UI カスタマイズ: テーマカラー、背景画像、カスタム CSS など
    - User personas: AI にあなたについて少し伝え、没入感を高める
    - 組み込み RAG サポート: チャットにドキュメントを追加して AI が参照可能に
    - 豊富なチャットコマンドサブシステムと独自スクリプティングエンジン
    
    **SillyTavern は拡張性をサポートします。**
    - キャラクターの感情表現（スプライト）
    - チャット履歴の自動要約
    - UI とチャットの自動翻訳
    - Stable Diffusion/FLUX/DALL-E 画像生成
    - AI 応答メッセージのテキスト読み上げ
    - プロンプトに現実世界の文脈を追加する Web 検索機能
    - 「Download Extensions & Assets」メニューからさらに多数をダウンロード可能。
  upgradeDescription: |
    リバースプロキシのイメージを Bitnami OpenResty（`beclab/aboveos-bitnami-openresty:1.25.3-2`）から公式 OpenResty イメージ `openresty/openresty:1.29.2.5-bookworm-fat` に切り替えました。
    
    nginx 設定のマウントとログパスを公式イメージのレイアウト（`/etc/nginx/conf.d/default.conf`、`/usr/local/openresty/nginx/logs/...`）に合わせ、Bitnami 固有の `OPENRESTY_CONF_FILE` 配線を削除しました。
    
    アプリバージョンを 1.15.0 へアップグレード
    
    ハイライト
    Macros 2.0 の最初のプレビューを導入。入れ子、安定した評価順などを可能にするマクロシステムの大幅刷新です。User Settings -> Chat/Message Handling で「Experimental Macro Engine」を有効にして試すことを推奨します。レガシーなマクロ置換は今後更新されず、最終的に削除されます。
    
    完全なリリースノート: https://github.com/SillyTavern/SillyTavern/releases/tag/1.15.0
