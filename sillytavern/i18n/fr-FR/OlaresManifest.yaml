metadata:
  title: SillyTavern
  description: Frontend LLM pour utilisateurs avancés
spec:
  fullDescription: |
    SillyTavern est une interface utilisateur installée localement qui vous permet d'interagir avec des LLM de génération de texte, des moteurs de génération d'images et des modèles vocaux TTS.
    
    Né en février 2023 comme fork de TavernAI 1.2.8, SillyTavern compte désormais plus de 200 contributeurs et 2 ans de développement indépendant, et reste un logiciel de référence pour les amateurs d'IA avertis.
    
    **Fonctionnalités clés**
    - Paramètres avancés de génération de texte avec de nombreux presets communautaires
    - Prise en charge World Info : créez un lore riche ou économisez des tokens sur votre character card
    - Chats de groupe : salles multi-bots pour que les personnages vous parlent et/ou se parlent entre eux
    - Riches options de personnalisation UI : couleurs de thème, images de fond, CSS personnalisé, etc.
    - User personas : laissez l'IA en savoir un peu sur vous pour plus d'immersion
    - Prise en charge RAG intégrée : ajoutez des documents à vos chats pour que l'IA s'y réfère
    - Vaste sous-système de commandes de chat et moteur de scripting propre
    
    **SillyTavern prend en charge l'extensibilité.**
    - Expressions émotionnelles des personnages (sprites)
    - Auto-résumé de l'historique du chat
    - Traduction automatique de l'UI et du chat
    - Génération d'images Stable Diffusion/FLUX/DALL-E
    - Synthèse vocale pour les messages de réponse de l'IA
    - Capacités de recherche web pour ajouter du contexte réel à vos prompts
    - Bien d'autres sont disponibles au téléchargement depuis le menu « Download Extensions & Assets ».
  upgradeDescription: |
    Remplacement de l'image du reverse proxy Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) par l'image officielle OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alignement des montages de configuration nginx et des chemins de journaux sur la disposition de l'image officielle (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), et suppression du câblage spécifique Bitnami `OPENRESTY_CONF_FILE`.
    
    Mise à jour de la version de l'app vers 1.15.0
    
    Points forts
    Présentation de la première préversion de Macros 2.0, une refonte complète du système de macros permettant l'imbrication, un ordre d'évaluation stable, et plus encore. Vous êtes encouragés à l'essayer en activant « Experimental Macro Engine » dans User Settings -> Chat/Message Handling. La substitution de macros héritée ne recevra plus de mises à jour et sera finalement retirée.
    
    Note complète : https://github.com/SillyTavern/SillyTavern/releases/tag/1.15.0
