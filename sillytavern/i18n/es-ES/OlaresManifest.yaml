metadata:
  title: SillyTavern
  description: Frontend LLM para usuarios avanzados
spec:
  fullDescription: |
    SillyTavern es una interfaz de usuario instalada localmente que te permite interactuar con LLM de generación de texto, motores de generación de imágenes y modelos de voz TTS.
    
    Comenzó en febrero de 2023 como un fork de TavernAI 1.2.8; SillyTavern tiene ahora más de 200 colaboradores y 2 años de desarrollo independiente, y sigue siendo un software líder para aficionados avanzados a la IA.
    
    **Funciones clave**
    - Ajustes avanzados de generación de texto con muchos presets de la comunidad
    - Soporte World Info: crea lore enriquecido o ahorra tokens en tu character card
    - Chats grupales: salas multi-bot para que los personajes hablen contigo y/o entre ellos
    - Amplias opciones de personalización de UI: colores de tema, imágenes de fondo, CSS personalizado y más
    - User personas: deja que la IA sepa un poco sobre ti para mayor inmersión
    - Soporte RAG integrado: añade documentos a tus chats para que la IA los consulte
    - Amplio subsistema de comandos de chat y motor de scripting propio
    
    **SillyTavern tiene soporte de extensibilidad.**
    - Expresiones emocionales de personajes (sprites)
    - Auto-resumen del historial del chat
    - Traducción automática de UI y chat
    - Generación de imágenes Stable Diffusion/FLUX/DALL-E
    - Text-to-speech para mensajes de respuesta de la IA
    - Capacidades de búsqueda web para añadir contexto del mundo real a tus prompts
    - Muchas más disponibles para descargar en el menú "Download Extensions & Assets".
  upgradeDescription: |
    Cambio de la imagen del reverse proxy de Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) a la imagen oficial de OpenResty `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Alineación de los montajes de configuración de nginx y las rutas de registros con el diseño de la imagen oficial (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`), y eliminación del cableado específico de Bitnami `OPENRESTY_CONF_FILE`.
    
    Actualización de la versión de la app a 1.15.0
    
    Aspectos destacados
    Presentamos la primera vista previa de Macros 2.0, una renovación completa del sistema de macros que permite anidación, orden de evaluación estable y más. Se recomienda probarlo activando "Experimental Macro Engine" en User Settings -> Chat/Message Handling. La sustitución de macros heredada no recibirá más actualizaciones y finalmente se eliminará.
    
    Nota completa: https://github.com/SillyTavern/SillyTavern/releases/tag/1.15.0
