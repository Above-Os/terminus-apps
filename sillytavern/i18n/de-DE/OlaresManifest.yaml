metadata:
  title: SillyTavern
  description: LLM-Frontend für Power-User
spec:
  fullDescription: |
    SillyTavern ist eine lokal installierte Benutzeroberfläche, mit der Sie mit Textgenerierungs-LLMs, Bildgenerierungs-Engines und TTS-Sprachmodellen interagieren können.
    
    Begonnen im Februar 2023 als Fork von TavernAI 1.2.8, hat SillyTavern inzwischen über 200 Mitwirkende und 2 Jahre unabhängige Entwicklung hinter sich und bleibt eine führende Software für erfahrene KI-Hobbyisten.
    
    **Hauptfunktionen**
    - Erweiterte Textgenerierungseinstellungen mit vielen Community-Presets
    - World-Info-Unterstützung: reiche Lore erstellen oder Tokens auf Ihrer Charakterkarte sparen
    - Gruppenchats: Multi-Bot-Räume, in denen Charaktere mit Ihnen und/oder untereinander sprechen
    - Umfangreiche UI-Anpassung: Themenfarben, Hintergrundbilder, custom CSS und mehr
    - User Personas: Lassen Sie die KI etwas über Sie wissen für mehr Immersion
    - Eingebaute RAG-Unterstützung: Dokumente zu Ihren Chats hinzufügen, damit die KI darauf Bezug nehmen kann
    - Umfangreiches Chat-Befehlssystem und eigene Scripting-Engine
    
    **SillyTavern bietet Erweiterbarkeit.**
    - Emotionale Charakterausdrücke (Sprites)
    - Auto-Summary des Chatverlaufs
    - Automatische UI- und Chat-Übersetzung
    - Stable Diffusion/FLUX/DALL-E-Bildgenerierung
    - Text-to-Speech für KI-Antwortnachrichten
    - Websuche für zusätzlichen Realwelt-Kontext in Ihren Prompts
    - Viele weitere stehen im Menü „Download Extensions & Assets“ zum Download bereit.
  upgradeDescription: |
    Umstellung des Reverse-Proxy-Images von Bitnami OpenResty (`beclab/aboveos-bitnami-openresty:1.25.3-2`) auf das offizielle OpenResty-Image `openresty/openresty:1.29.2.5-bookworm-fat`.
    
    Anpassung der nginx-Konfigurations-Mounts und Log-Pfade an das Layout des offiziellen Images (`/etc/nginx/conf.d/default.conf`, `/usr/local/openresty/nginx/logs/...`) und Entfernung der Bitnami-spezifischen `OPENRESTY_CONF_FILE`-Verdrahtung.
    
    App-Version auf 1.15.0 aktualisiert
    
    Highlights
    Einführung der ersten Vorschau von Macros 2.0, einer umfassenden Überarbeitung des Makrosystems mit Nesting, stabiler Auswertungsreihenfolge und mehr. Sie werden ermutigt, es auszuprobieren, indem Sie „Experimental Macro Engine“ unter User Settings -> Chat/Message Handling aktivieren. Die Legacy-Makrosubstitution erhält keine weiteren Updates und wird schließlich entfernt.
    
    Vollständige Release Note: https://github.com/SillyTavern/SillyTavern/releases/tag/1.15.0
