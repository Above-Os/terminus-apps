metadata:
  title: Muse Glimmer 30B DFlash
  description: "A local AI model for text, image understanding, and tasks that use tools. llm-init and the inference engine share runtime state through Common and can run on different nodes."
spec:
  upgradeDescription: |
    v1.0.16: Store runtime state in Common for cross-node operation. Prefer existing Common configuration; otherwise migrate local legacy Cache or initialize in Common. Retry shared helper reads during engine startup.

    v1.0.15: Model Console (llm-init) updated to v1.7.26. Chart passes ENGINE_ARGS to llm-init without OLLAMA_KEEP_ALIVE; OLLAMA_CONTEXT_LENGTH seeds the model-card context window.
  fullDescription: |
    Muse Glimmer 30B is a model from Meta that takes text and images as input and generates text responses. It supports reasoning, coding assistance, and tasks that use tools. This app runs the model locally with Ollama and includes DFlash, a companion model that proposes text for the main model to check, helping speed up generation.

    **Key features**

    - Respond to text prompts and questions about images, including screenshots, charts, and documents.
    - Use thinking and tool calling in compatible applications that provide tools.
    - Work through tasks that require multiple steps.
    - Use DFlash to accelerate text generation; speed depends on hardware and the request.

    **Using the model on Olares**

    Model Console downloads and manages `muse-glimmer:30b-q4_K_M-dflash` for compatible Olares applications. The default context window is 128K tokens, which limits how much conversation and other input the model can process at once.

    [Muse Glimmer model information](https://huggingface.co/meta-models/Muse-Glimmer-30B)
