metadata:
  title: Muse Glimmer 30B DFlash
  description: "テキスト処理、画像理解、ツールを使うタスク向けのローカルAIモデル. llm-init と推論エンジンは Common を介して実行状態を共有し、異なるノードで動作できます。"
spec:
  upgradeDescription: |
    v1.0.16: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

    v1.0.15: Model Console（llm-init）を v1.7.26 に更新。Chart は OLLAMA_KEEP_ALIVE を除いた ENGINE_ARGS を llm-init に渡し、OLLAMA_CONTEXT_LENGTH がモデルカードのコンテキスト長になります。
  fullDescription: |
    Muse Glimmer 30BはMetaのモデルで、テキストと画像を入力として受け取り、テキストで回答します。推論、プログラミング支援、ツールを使うタスクに対応します。このアプリはOllamaでモデルをローカル実行し、補助モデルのDFlashを含みます。DFlashが候補のテキストを提案し、メインモデルが検証することで、生成の高速化を図ります。

    **主な機能**

    - テキストのプロンプトや、スクリーンショット、グラフ、文書などの画像についての質問に回答します。
    - ツールを提供する対応アプリで、思考機能とツール呼び出しを利用できます。
    - 複数の手順が必要なタスクを処理します。
    - DFlashでテキスト生成を高速化します。速度はハードウェアとリクエストによって異なります。

    **Olaresでモデルを使う**

    Model Consoleが`muse-glimmer:30b-q4_K_M-dflash`をダウンロードし、対応するOlaresアプリ向けに管理します。デフォルトのコンテキストウィンドウは128Kトークンで、モデルが一度に処理できる会話やその他の入力の量を制限します。

    [Muse Glimmerのモデル情報](https://huggingface.co/meta-models/Muse-Glimmer-30B)
