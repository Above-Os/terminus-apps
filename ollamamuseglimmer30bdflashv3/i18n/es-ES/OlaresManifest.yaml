metadata:
  description: Muse Glimmer 30B Q4_K_M + decodificación especulativa DFlash vía Ollama.
  title: Muse Glimmer 30B DFlash
spec:
  upgradeDescription: |
    v1.0.6: Reducir la reserva de memoria de host NVIDIA para que los nodos timeslice 1.12.6 puedan instalar más fácilmente (solicitud del motor 19Gi→6Gi, chart requiredMemory 20Gi→7Gi). Cuota de GPU sin cambios.
    
    v1.0.1: corregir la codificación i18n zh-CN; documentar el rendimiento de decodificación DFlash (~35-65 tok/s).
    v1.0.0: versión inicial - Muse Glimmer 30B Q4_K_M con DFlash drafter incluido vía Ollama 0.32.8-rc0.
  fullDescription: |
    **Descripción del modelo**
    
    El mismo Muse Glimmer 30B Q4_K_M que la etiqueta estándar, con DFlash drafter incluido para una generación más rápida. Etiqueta: `muse-glimmer:30b-q4_K_M-dflash` (~20GB, contexto 128K). Requiere Ollama 0.32.8-rc0+.
    
    **Preset:** thinking + tools + vision; GPU `22Gi`; Modelfile `draft_num_predict=3`; rendimiento de decodificación típico **~35-65 tok/s** (depende de la GPU).
    
    **Stack:** demonio Ollama (11434) + Model Console (8090). Modelos almacenados en `appCommon/ollama`.
