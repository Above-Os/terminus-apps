{{- $existing := lookup "v1" "Secret" .Release.Namespace "supabase-secrets" -}}
apiVersion: v1
kind: Secret
metadata:
  name: supabase-secrets
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ if and $existing $existing.data (index $existing.data "POSTGRES_PASSWORD") }}{{ index $existing.data "POSTGRES_PASSWORD" | quote }}{{ else }}{{ randAlphaNum 40 | b64enc | quote }}{{ end }}
  JWT_SECRET: {{ if and $existing $existing.data (index $existing.data "JWT_SECRET") }}{{ index $existing.data "JWT_SECRET" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  SECRET_KEY_BASE: {{ if and $existing $existing.data (index $existing.data "SECRET_KEY_BASE") }}{{ index $existing.data "SECRET_KEY_BASE" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  REALTIME_DB_ENC_KEY: {{ if and $existing $existing.data (index $existing.data "REALTIME_DB_ENC_KEY") }}{{ index $existing.data "REALTIME_DB_ENC_KEY" | quote }}{{ else }}{{ randAlphaNum 16 | b64enc | quote }}{{ end }}
  VAULT_ENC_KEY: {{ if and $existing $existing.data (index $existing.data "VAULT_ENC_KEY") }}{{ index $existing.data "VAULT_ENC_KEY" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  PG_META_CRYPTO_KEY: {{ if and $existing $existing.data (index $existing.data "PG_META_CRYPTO_KEY") }}{{ index $existing.data "PG_META_CRYPTO_KEY" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  DASHBOARD_PASSWORD: {{ if and $existing $existing.data (index $existing.data "DASHBOARD_PASSWORD") }}{{ index $existing.data "DASHBOARD_PASSWORD" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  S3_PROTOCOL_ACCESS_KEY_SECRET: {{ if and $existing $existing.data (index $existing.data "S3_PROTOCOL_ACCESS_KEY_SECRET") }}{{ index $existing.data "S3_PROTOCOL_ACCESS_KEY_SECRET" | quote }}{{ else }}{{ randAlphaNum 40 | b64enc | quote }}{{ end }}
  SMTP_PASS: {{ .Values.olaresEnv.MAIL_PASSWORD | default "" | b64enc | quote }}
