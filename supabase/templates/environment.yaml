apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-environment
data:
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  POSTGRES_DB: postgres
  JWT_EXPIRY: '3600'
  DASHBOARD_USERNAME: supabase
  SUPABASE_PUBLISHABLE_KEY: ''
  SUPABASE_SECRET_KEY: ''
  ANON_KEY_ASYMMETRIC: ''
  SERVICE_ROLE_KEY_ASYMMETRIC: ''
  SUPABASE_PUBLIC_URL: https://{{ .Values.domain.supabaseapi }}
  API_EXTERNAL_URL: https://{{ .Values.domain.supabaseapi }}/auth/v1
  SITE_URL: '{{ .Values.olaresEnv.CLIENT_SITE_URL | default (printf "https://%s" .Values.domain.supabase) }}'
  ADDITIONAL_REDIRECT_URLS: '{{ .Values.olaresEnv.AUTH_REDIRECT_URLS | default "" }}'
  DISABLE_SIGNUP: 'false'
  ENABLE_EMAIL_SIGNUP: 'true'
  ENABLE_EMAIL_AUTOCONFIRM: 'false'
  ENABLE_ANONYMOUS_USERS: 'false'
  ENABLE_PHONE_SIGNUP: 'false'
  ENABLE_PHONE_AUTOCONFIRM: 'false'
  SMTP_ADMIN_EMAIL: '{{ .Values.olaresEnv.MAIL_FROM | default "" }}'
  SMTP_HOST: '{{ .Values.olaresEnv.MAIL_SERVER | default "" }}'
  SMTP_PORT: '{{ .Values.olaresEnv.MAIL_PORT | default "587" | toString }}'
  SMTP_USER: '{{ .Values.olaresEnv.MAIL_USERNAME | default "" }}'
  SMTP_SENDER_NAME: Supabase
  MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
  MAILER_URLPATHS_INVITE: /auth/v1/verify
  MAILER_URLPATHS_RECOVERY: /auth/v1/verify
  MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
  STUDIO_DEFAULT_ORGANIZATION: Olares
  STUDIO_DEFAULT_PROJECT: My project
  OPENAI_API_KEY: ''
  REGION: us-east-1
  GLOBAL_S3_BUCKET: storage
  STORAGE_TENANT_ID: local
  IMGPROXY_AUTO_WEBP: 'true'
  S3_PROTOCOL_ACCESS_KEY_ID: supabase
  FUNCTIONS_VERIFY_JWT: 'true'
  PGRST_DB_SCHEMAS: public,graphql_public
  PGRST_DB_MAX_ROWS: '1000'
  PGRST_DB_EXTRA_SEARCH_PATH: public
  POOLER_TENANT_ID: supabase
  POOLER_DEFAULT_POOL_SIZE: '10'
  POOLER_MAX_CLIENT_CONN: '100'
  POOLER_DB_POOL_SIZE: '5'
