olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: supabase
  appid: supabase
  title: Supabase
  description: Self-hosted database, authentication, storage and APIs for your apps
  icon: https://cdn.olares.com/images/2026/10/5a6809fd1ed5504385f4989a9f14e5c7.png
  version: 0.0.13
  categories:
  - Developer Tools
  - Utilities_v112
  - developer
entrances:
- name: supabase
  host: studio
  port: 3000
  title: Supabase Studio
  icon: https://cdn.olares.com/images/2026/10/5a6809fd1ed5504385f4989a9f14e5c7.png
  authLevel: internal
  openMethod: window
- name: supabaseapi
  host: api-gw
  port: 8000
  title: Supabase API
  icon: https://cdn.olares.com/images/2026/10/5a6809fd1ed5504385f4989a9f14e5c7.png
  authLevel: internal
  invisible: true
spec:
  versionName: 0.8.3
  runAsUser: true
  requiredMemory: 4Gi
  limitedMemory: 12Gi
  requiredCpu: 1500m
  limitedCpu: '8'
  requiredDisk: 40Gi
  limitedDisk: 80Gi
  supportArch:
  - amd64
  - arm64
  developer: Supabase
  submitter: Olares
  website: https://supabase.com
  sourceCode: https://github.com/supabase/supabase
  fullDescription: 'Supabase runs a PostgreSQL backend on your Olares, with Studio for managing data in the browser.
    Connect automation workflows, reporting tools, document retrieval and custom applications to the same project.


    Features: PostgreSQL with REST and GraphQL APIs, user authentication, private object storage, Realtime updates,
    Edge Functions, vector search and connection pooling.


    n8n, Flowise and SDK clients use the internal HTTPS API. PostgreSQL clients can use the LAN/VPN TCP mappings:
    session pool 45432 and transaction pool 46543. Database access requires a password.


    One self-hosted project per installation. Application data persists on Olares. External email and OAuth providers
    need separate configuration. Optional analytics services are not included.'
  locale:
  - en-US
  - zh-CN
  - de-DE
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  doc: https://supabase.com/docs
  license:
  - text: Apache-2.0
    url: https://github.com/supabase/supabase/blob/master/LICENSE
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
workloadReplicas:
  supabase: 1
  db: 1
  backend: 1
  supavisor: 1
envs:
- envName: MAIL_SERVER
  required: false
  valueFrom:
    envName: OLARES_USER_SMTP_SERVER
- envName: MAIL_PORT
  required: false
  valueFrom:
    envName: OLARES_USER_SMTP_PORT
- envName: MAIL_USERNAME
  required: false
  valueFrom:
    envName: OLARES_USER_SMTP_USERNAME
- envName: MAIL_PASSWORD
  required: false
  valueFrom:
    envName: OLARES_USER_SMTP_PASSWORD
- envName: MAIL_FROM
  required: false
  valueFrom:
    envName: OLARES_USER_SMTP_FROM_ADDRESS
- envName: CLIENT_SITE_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Client application URL used after authentication. Defaults to Studio.
  regex: ^$|^https?://.+
- envName: AUTH_REDIRECT_URLS
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: Additional allowed authentication redirect URLs, separated by commas.
ports:
- name: postgres-session
  host: supavisor
  port: 5432
  protocol: tcp
  exposePort: 45432
- name: postgres-transaction
  host: supavisor
  port: 6543
  protocol: tcp
  exposePort: 46543
