metadata:
  title: Supabase
  description: Selbst gehostete Datenbank, Anmeldung, Speicher und APIs für Ihre Apps
spec:
  fullDescription: 'Supabase stellt auf Ihrem Olares ein PostgreSQL-Backend bereit. Mit Studio verwalten Sie Daten
    im Browser. Automatisierungen, Berichte, Dokumentensuche und eigene Anwendungen greifen auf dasselbe Projekt
    zu.


    Funktionen: PostgreSQL mit REST- und GraphQL-APIs, Benutzerauthentifizierung, privater Objektspeicher, Echtzeit-Updates,
    Edge Functions, Vektorsuche und Verbindungspools.


    n8n, Flowise und SDK-Clients verwenden die interne HTTPS-API. PostgreSQL-Clients nutzen die TCP-Zuordnungen
    im LAN oder VPN: Sitzungspool 45432 und Transaktionspool 46543. Der Datenbankzugriff erfordert ein Passwort.


    Jede Installation enthält ein selbst gehostetes Projekt. Anwendungsdaten bleiben auf Olares gespeichert. Externe
    E-Mail- und OAuth-Anbieter müssen separat eingerichtet werden. Optionale Analysedienste sind nicht enthalten.'
