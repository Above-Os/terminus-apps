metadata:
  title: Supabase
  description: Base de données, authentification, stockage et API auto-hébergés
spec:
  upgradeDescription: |
    Synchronise les mots de passe des comptes de service de la base de données lors d’une réinstallation avec données conservées, afin qu’Auth, REST, Storage et le pool de connexions se reconnectent après la génération de nouvelles clés.
  fullDescription: 'Supabase exécute un backend PostgreSQL sur votre Olares. Studio permet de gérer les données
    dans le navigateur. Connectez automatisations, rapports, recherche documentaire et applications personnalisées
    au même projet.


    Fonctions : PostgreSQL avec API REST et GraphQL, authentification, stockage privé, mises à jour en temps réel,
    Edge Functions, recherche vectorielle et pools de connexions.


    n8n, Flowise et les clients SDK utilisent l’API HTTPS interne. Les clients PostgreSQL peuvent utiliser les ports
    TCP du réseau local ou du VPN : 45432 pour les sessions et 46543 pour les transactions. Un mot de passe reste
    nécessaire.


    Chaque installation fournit un projet auto-hébergé. Les données persistent sur Olares. Les services externes
    de messagerie et OAuth nécessitent une configuration distincte. Les services d’analyse facultatifs ne sont pas
    inclus.'
