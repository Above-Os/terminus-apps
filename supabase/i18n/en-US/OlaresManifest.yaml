metadata:
  title: Supabase
  description: Self-hosted database, authentication, storage and APIs for your apps
spec:
  upgradeDescription: |
    Preserve installation credentials with app data so reinstalls reuse the database password, signing keys and encryption keys. Upgrade an existing installation before uninstalling it with retained data.
  fullDescription: 'Supabase runs a PostgreSQL backend on your Olares, with Studio for managing data in the browser.
    Connect automation workflows, reporting tools, document retrieval and custom applications to the same project.


    Features: PostgreSQL with REST and GraphQL APIs, user authentication, private object storage, Realtime updates,
    Edge Functions, vector search and connection pooling.


    n8n, Flowise and SDK clients use the internal HTTPS API. PostgreSQL clients can use the LAN/VPN TCP mappings:
    session pool 45432 and transaction pool 46543. Database access requires a password.


    One self-hosted project per installation. Application data persists on Olares. External email and OAuth providers
    need separate configuration. Optional analytics services are not included.'
