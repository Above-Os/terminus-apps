metadata:
  title: Supabase
  description: Base de datos, autenticación, almacenamiento y API autoalojados
spec:
  upgradeDescription: |
    Corrige las comprobaciones de la base postgres con un tiempo límite de cinco segundos. Migra los campos obsoletos de DNS, CORS y Lua de Envoy y elimina un parámetro antiguo de grupos de Auth. Conserva datos, reglas de acceso y recursos.
  fullDescription: 'Supabase ejecuta un backend PostgreSQL en tu Olares. Studio permite gestionar los datos desde
    el navegador. Conecta automatizaciones, informes, búsquedas de documentos y aplicaciones propias al mismo proyecto.


    Funciones: PostgreSQL con API REST y GraphQL, autenticación de usuarios, almacenamiento privado de objetos,
    actualizaciones en tiempo real, Edge Functions, búsqueda vectorial y agrupación de conexiones.


    n8n, Flowise y los clientes SDK usan la API HTTPS interna. Los clientes PostgreSQL pueden usar los puertos TCP
    de LAN o VPN: 45432 para sesiones y 46543 para transacciones. El acceso requiere contraseña.


    Cada instalación incluye un proyecto autoalojado. Los datos se conservan en Olares. Los proveedores externos
    de correo y OAuth requieren configuración independiente. No se incluyen los servicios opcionales de análisis.'
