metadata:
  title: Supabase
  description: アプリ向けのセルフホスト型データベース、認証、ストレージ、API
spec:
  upgradeDescription: |
    データベースのヘルスチェックで postgres を明示し、タイムアウトを5秒に変更しました。Envoy の DNS、CORS、Lua の非推奨設定を移行し、古い Auth グループ設定を削除しました。既存データ、アクセス規則、リソース設定は維持します。
  fullDescription: 'Supabase は Olares 上で PostgreSQL バックエンドを実行します。ブラウザーの Studio からデータを管理し、自動化、レポート、文書検索、独自アプリを同じプロジェクトに接続できます。


    主な機能は PostgreSQL、REST と GraphQL API、ユーザー認証、非公開オブジェクトストレージ、リアルタイム更新、Edge Functions、ベクトル検索、接続プールです。


    n8n、Flowise、SDK クライアントは内部 HTTPS API を使用します。PostgreSQL クライアントは LAN または VPN の TCP ポートを使用できます。セッションプールは 45432、トランザクションプールは
    46543 です。接続にはパスワードが必要です。


    インストールごとにセルフホスト型プロジェクトを 1 つ提供します。データは Olares に保持されます。外部メールと OAuth プロバイダーは別途設定が必要です。オプションの分析サービスは含まれません。'
