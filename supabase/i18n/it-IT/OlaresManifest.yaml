metadata:
  title: Supabase
  description: Database, autenticazione, archiviazione e API ospitati sul tuo dispositivo
spec:
  fullDescription: 'Supabase esegue un backend PostgreSQL sul tuo Olares. Studio permette di gestire i dati dal
    browser. Collega automazioni, report, ricerca di documenti e applicazioni personalizzate allo stesso progetto.


    Funzioni: PostgreSQL con API REST e GraphQL, autenticazione utenti, archiviazione privata, aggiornamenti in
    tempo reale, Edge Functions, ricerca vettoriale e pool di connessioni.


    n8n, Flowise e i client SDK usano l’API HTTPS interna. I client PostgreSQL possono usare le porte TCP nella
    LAN o tramite VPN: 45432 per le sessioni e 46543 per le transazioni. È richiesta una password del database.


    Ogni installazione offre un progetto autonomo. I dati restano su Olares. Email e provider OAuth esterni richiedono
    una configurazione separata. I servizi di analisi opzionali non sono inclusi.'
