metadata:
  title: Supabase
  description: 为应用提供自托管数据库、用户认证、存储和 API
spec:
  fullDescription: 'Supabase 在你的 Olares 上运行 PostgreSQL 后端，通过浏览器中的 Studio 管理数据。自动化工作流、报表、资料检索和自建应用可以连接同一个项目。


    功能包括 PostgreSQL、REST 和 GraphQL API、用户认证、私有对象存储、实时更新、Edge Functions、向量检索和连接池。


    n8n、Flowise 和 SDK 客户端使用内部 HTTPS API。PostgreSQL 客户端可使用局域网或 VPN 的 TCP 映射：会话连接池 45432，事务连接池 46543。连接数据库仍需密码。


    每次安装提供一个自托管项目，应用数据持久保存在 Olares。外部邮件和 OAuth 提供方需单独配置，不包含可选的日志分析服务。'
