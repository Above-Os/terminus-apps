metadata:
  description: 支持预设、克隆和设计音色的 Qwen3 文本转语音
  title: Qwen3-TTS

spec:
  fullDescription: |
    Qwen3-TTS 把文字读成语音。同一个应用可以朗读内置音色、用参考录音克隆音色，以及按文字描述设计音色。

    **主要功能**
    - 朗读引擎通用的四张内置音色，以及 Qwen3 自己的九个官方说话人。
    - 根据参考音频及其逐字原文克隆音色。
    - 根据自然语言描述设计并保存音色。
    - 同一套音色库同时提供 ElevenLabs 口和 OpenAI 口。

    需要兼容的 NVIDIA 或 Intel GPU。调度标签沿用此前 Qwen3-TTS 1.7B 的 `6Gi`。
