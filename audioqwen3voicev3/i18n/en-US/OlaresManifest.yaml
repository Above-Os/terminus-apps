metadata:
  description: Qwen3 text to speech with preset, cloned, and designed voices
  title: Qwen3-TTS

spec:
  fullDescription: |
    Qwen3-TTS turns written text into spoken audio. One app speaks built-in voices, clones a voice from a reference recording, and designs a voice from a written description.

    **Highlights**
    - Speak the four shared built-in voices and Qwen3's own nine official speakers.
    - Clone a voice from a reference clip and its exact transcript.
    - Design a voice from a written description and keep it.
    - The same voice table is available on both the ElevenLabs routes and the OpenAI routes.

    A compatible NVIDIA or Intel GPU is required. The scheduling label is the same `6Gi` used by the previous Qwen3-TTS 1.7B chart.
