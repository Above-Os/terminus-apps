metadata:
  title: 技能测试应用
  description: 用于验证 Olares 应用提交流程的简单测试应用

spec:
  fullDescription: |
    **测试应用**

    这是一个用于验证 Olares 应用提交流程的简单测试应用。

    **用途**
    - 测试应用提交流程
    - 验证 GitBot 校验
    - 验证完整的 PR 工作流

    该应用仅用于测试目的。
  upgradeDescription: |
    **技能测试应用 1.0.6**

    - 通过空的 `.suspend` 标记文件标记为已下架。该应用不再通过 Market 分发，但图表和清单内容会保留。
