metadata:
  description: 面向实时语音对话的快速英文语音识别模型
  title: MOSS-Transcribe-Preview 2B

spec:
  upgradeDescription: |
    v1.0.0: 首个版本，仅支持 Intel Arc。
  fullDescription: |
    MOSS-Transcribe-preview-2B 把英文语音快速转成文字，速度足以支撑实时对话：语音聊天中一停顿，约十分之一秒就能拿到这段话的文字。

    **主要功能**
    - 转写英文语音，从简短的语音指令到几分钟长的音频都可以。
    - 通过 WebSocket 流式接收实时音频，每次停顿都返回目前为止的文字。
    - 向兼容的 Olares 应用提供语音转写能力。

    需要 `7Gi` 显存的 Intel Arc 独立显卡。仅支持英文。
