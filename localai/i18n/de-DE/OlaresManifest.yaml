metadata:
  title: LocalAI
  description: Die kostenlose Open-Source-Alternative zu OpenAI, Claude und anderen
spec:
  fullDescription: |
    LocalAI ist die kostenlose Open-Source-OpenAI-Alternative. LocalAI fungiert als Drop-in-Ersatz-REST-API, die mit den API-Spezifikationen von OpenAI (Elevenlabs, Anthropic …) für lokale AI-Inferenz kompatibel ist. Damit können Sie LLMs ausführen, Bilder, Audio (und mehr) lokal oder on-prem mit Consumer-Hardware erzeugen und mehrere Modellfamilien unterstützen. Keine GPU erforderlich.

    **Funktionen**
    - Textgenerierung mit GPTs (llama.cpp, transformers, vllm … und mehr)
    - Text zu Audio
    - Audio zu Text (Audiotranskription mit whisper.cpp)
    - Bildgenerierung
    - OpenAI-ähnliche Tools-API
    - Embedding-Generierung für Vektordatenbanken
    - Constrained Grammars
    - Modelle direkt von Hugging Face herunterladen
    - Vision API
    - Reranker API
    - P2P-Inferenz
    - Spracherkennung (Silero-VAD-Unterstützung)
    - Integrierte WebUI!
  upgradeDescription: |
    Willkommen bei LocalAI 3.7.0

    Dieses Release führt agentische MCP-Unterstützung mit voller WebUI-Integration, ein brandneues neutts-TTS-Backend, Fuzzy-Modellsuche, Long-Form-TTS-Chunking für Chatterbox und eine vollständige WebUI-Überarbeitung ein.
    Wir haben außerdem kritische Bugs behoben, die Stabilität verbessert und die Kompatibilität mit OpenAI-APIs gesteigert.

    Neu in LocalAI 3.7.0
    Agentic MCP Support (WebUI-fähig)
    - Erstellen Sie AI-Agenten, die echte Tools nutzen (Websuche, Code-Ausführung). Vollständig OpenAI-kompatibel und in die WebUI integriert.

    neutts TTS Backend (Neuphonic-powered)
    - Natürliche, hochwertige Sprache mit geringer Latenz — ideal für Sprachassistenten.

    WebUI-Verbesserungen
    - Schnellere, klarere UI mit Echtzeit-Updates und voller YAML-Modellkontrolle.

    Long-Text TTS Chunking (Chatterbox)
    - Natürlich klingendes Long-Form-Audio durch intelligentes Textsplitting unter Erhalt des Kontexts.

    Erweiterte Agentensteuerung
    - Feinabstimmung des Agentenverhaltens mit neuen Optionen für Retries, Reasoning und Re-Evaluation.

    Neuer Video-Creation-Endpunkt
    - Unterstützung des OpenAI-kompatiblen Endpunkts /v1/videos für Text-zu-Video.

    Verbesserte Whisper-Kompatibilität
    - Whisper.cpp wird auf verschiedenen CPU-Varianten (AVX, AVX2 usw.) unterstützt, um Illegal-Instruction-Abstürze zu verhindern.

    Fuzzy Gallery Search
    - Modelle in der Gallery auch bei Tippfehlern finden (z. B. findet gema gemma).

    Einfachere Modell- & Backend-Verwaltung
    - Modelle direkt über sauberes YAML in der WebUI importieren, bearbeiten und löschen.

    Realtime Example
    - Neues Echtzeit-Sprachassistenten-Beispiel (mehrsprachig).

    Sicherheit, Stabilität & API-Compliance
    - Kritische Abstürze, Deadlocks, Session-Events, OpenAI-Compliance und JSON-Schema-Panics behoben.

    Qwen 3 VL
    - Unterstützung für Qwen 3 VL mit llama.cpp/gguf-Modellen

    Weitere Details in den Release Notes: https://github.com/mudler/LocalAI/releases/tag/v3.7.0
