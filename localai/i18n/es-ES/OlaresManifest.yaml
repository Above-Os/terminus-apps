metadata:
  title: LocalAI
  description: La alternativa gratuita y de código abierto a OpenAI, Claude y otros
spec:
  fullDescription: |
    LocalAI es la alternativa gratuita y de código abierto a OpenAI. LocalAI actúa como una API REST de reemplazo compatible con las especificaciones de API de OpenAI (Elevenlabs, Anthropic…) para inferencia de IA local. Te permite ejecutar LLMs, generar imágenes, audio (y más) de forma local o on-prem con hardware de consumo, con soporte para múltiples familias de modelos. No requiere GPU.

    **Funciones**
    - Generación de texto con GPTs (llama.cpp, transformers, vllm … y más)
    - Texto a audio
    - Audio a texto (transcripción con whisper.cpp)
    - Generación de imágenes
    - API de herramientas similar a OpenAI
    - Generación de embeddings para bases de datos vectoriales
    - Gramáticas restringidas
    - Descargar modelos directamente desde Hugging Face
    - Vision API
    - Reranker API
    - Inferencia P2P
    - Detección de actividad de voz (soporte Silero-VAD)
    - ¡WebUI integrada!
  upgradeDescription: |
    Bienvenido a LocalAI 3.7.0

    Esta versión introduce soporte MCP agentico con integración completa en la WebUI, un nuevo backend TTS neutts, búsqueda difusa de modelos, troceado TTS de texto largo para chatterbox y una renovación completa de la WebUI.
    También hemos corregido errores críticos, mejorado la estabilidad y la compatibilidad con las APIs de OpenAI.

    Novedades en LocalAI 3.7.0
    Soporte MCP agentico (habilitado en WebUI)
    - Crea agentes de IA que usan herramientas reales (búsqueda web, ejecución de código). Totalmente compatible con OpenAI e integrado en la WebUI.

    Backend TTS neutts (impulsado por Neuphonic)
    - Genera voz natural de alta calidad con baja latencia — ideal para asistentes de voz.

    Mejoras de la WebUI
    - UI más rápida y limpia con actualizaciones en tiempo real y control total de modelos en YAML.

    Troceado TTS de texto largo (Chatterbox)
    - Genera audio largo natural dividiendo el texto de forma inteligente y preservando el contexto.

    Controles avanzados de agentes
    - Ajusta el comportamiento del agente con nuevas opciones de reintentos, razonamiento y reevaluación.

    Nuevo endpoint de creación de vídeo
    - Compatibilidad con el endpoint OpenAI /v1/videos para generación texto-a-vídeo.

    Mayor compatibilidad con Whisper
    - Whisper.cpp soportado en varias variantes de CPU (AVX, AVX2, etc.) para evitar fallos por instrucciones ilegales.

    Búsqueda difusa en la galería
    - Encuentra modelos en la galería incluso con errores tipográficos (p. ej., gema encuentra gemma).

    Gestión más fácil de modelos y backends
    - Importa, edita y elimina modelos directamente mediante YAML limpio en la WebUI.

    Ejemplo en tiempo real
    - Nuevo ejemplo de asistente de voz en tiempo real (multilingüe).

    Seguridad, estabilidad y cumplimiento de API
    - Corregidos fallos críticos, deadlocks, eventos de sesión, cumplimiento OpenAI y panics de esquema JSON.

    Qwen 3 VL
    - Compatibilidad con Qwen 3 VL con modelos llama.cpp/gguf

    Consulta las notas de la versión: https://github.com/mudler/LocalAI/releases/tag/v3.7.0
