metadata:
  title: LocalAI
  description: OpenAI、Claude などの無料オープンソース代替。
spec:
  fullDescription: |
    LocalAI は無料のオープンソース OpenAI 代替です。LocalAI はローカル AI 推論向けに OpenAI（Elevenlabs、Anthropic…）API 仕様と互換のドロップイン置き換え REST API として動作します。コンシューマー向けハードウェアで LLM の実行、画像・音声（など）の生成をローカルまたはオンプレで行え、複数のモデルファミリーをサポートします。GPU は不要です。

    **機能**
    - GPT によるテキスト生成（llama.cpp、transformers、vllm … など）
    - テキストから音声
    - 音声からテキスト（whisper.cpp による文字起こし）
    - 画像生成
    - OpenAI 風ツール API
    - ベクトルデータベース向け埋め込み生成
    - 制約付き文法
    - Hugging Face から直接モデルをダウンロード
    - Vision API
    - Reranker API
    - P2P 推論
    - 音声活動検出（Silero-VAD 対応）
    - 統合 WebUI！
  upgradeDescription: |
    LocalAI 3.7.0 へようこそ

    本リリースは、フル WebUI 統合のエージェント MCP 対応、新しい neutts TTS バックエンド、ファジーモデル検索、chatterbox 向け長文 TTS チャンキング、WebUI の全面刷新を導入します。
    重要なバグ修正、安定性向上、OpenAI API 互換性の強化も行いました。

    LocalAI 3.7.0 の新機能
    エージェント MCP 対応（WebUI 有効）
    - Web 検索やコード実行など実ツールを使う AI エージェントを構築。完全 OpenAI 互換で WebUI に統合。

    neutts TTS バックエンド（Neuphonic 駆動）
    - 低遅延で自然で高品質な音声を生成 — 音声アシスタントに最適。

    WebUI 強化
    - リアルタイム更新と完全な YAML モデル制御を備えた、より速くきれいな UI。

    長文 TTS チャンキング（Chatterbox）
    - テキストを賢く分割し文脈を保ちながら、自然な長時間音声を生成。

    高度なエージェント制御
    - リトライ、推論、再評価の新オプションでエージェント動作を微調整。

    新しい動画作成エンドポイント
    - テキストから動画生成向けの OpenAI 互換 /v1/videos エンドポイントをサポート。

    Whisper 互換性の強化
    - 不正命令クラッシュを防ぐため、AVX、AVX2 など各種 CPU バリアントで Whisper.cpp をサポート。

    ファジーギャラリー検索
    - タイポがあってもギャラリーでモデルを発見（例：gema で gemma）。

    モデル＆バックエンド管理の簡素化
    - WebUI のクリーンな YAML でモデルを直接インポート・編集・削除。

    リアルタイム例
    - 新しいリアルタイム音声アシスタント例（多言語）。

    セキュリティ・安定性・API 準拠
    - 重大クラッシュ、デッドロック、セッションイベント、OpenAI 準拠、JSON スキーマパニックを修正。

    Qwen 3 VL
    - llama.cpp/gguf モデルでの Qwen 3 VL サポート

    リリースノート: https://github.com/mudler/LocalAI/releases/tag/v3.7.0
