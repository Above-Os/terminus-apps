metadata:
  title: LocalAI
  description: L'alternative gratuite et open-source à OpenAI, Claude et d'autres
spec:
  fullDescription: |
    LocalAI est l'alternative gratuite et open-source à OpenAI. LocalAI agit comme une API REST de remplacement compatible avec les spécifications d'API OpenAI (Elevenlabs, Anthropic…) pour l'inférence IA locale. Elle vous permet d'exécuter des LLM, de générer des images, de l'audio (et plus) en local ou on-prem avec du matériel grand public, en prenant en charge plusieurs familles de modèles. Aucun GPU requis.

    **Fonctionnalités**
    - Génération de texte avec des GPT (llama.cpp, transformers, vllm … et plus)
    - Texte vers audio
    - Audio vers texte (transcription avec whisper.cpp)
    - Génération d'images
    - API d'outils semblable à OpenAI
    - Génération d'embeddings pour bases de données vectorielles
    - Grammaires contraintes
    - Télécharger des modèles directement depuis Hugging Face
    - Vision API
    - Reranker API
    - Inférence P2P
    - Détection d'activité vocale (prise en charge Silero-VAD)
    - WebUI intégrée !
  upgradeDescription: |
    Bienvenue dans LocalAI 3.7.0

    Cette version introduit le support MCP agentique avec intégration WebUI complète, un tout nouveau backend TTS neutts, la recherche floue de modèles, le découpage TTS long-form pour chatterbox et une refonte complète de la WebUI.
    Nous avons aussi corrigé des bugs critiques, amélioré la stabilité et la compatibilité avec les API OpenAI.

    Nouveautés dans LocalAI 3.7.0
    Support MCP agentique (activé WebUI)
    - Créez des agents IA qui utilisent de vrais outils (recherche web, exécution de code). Entièrement compatible OpenAI et intégré à la WebUI.

    Backend TTS neutts (propulsé par Neuphonic)
    - Générez une parole naturelle de haute qualité à faible latence — idéal pour les assistants vocaux.

    Améliorations WebUI
    - UI plus rapide et plus claire avec mises à jour en temps réel et contrôle YAML complet des modèles.

    Découpage TTS de longs textes (Chatterbox)
    - Générez un audio long-form naturel en découpant intelligemment le texte tout en préservant le contexte.

    Contrôles avancés des agents
    - Affinez le comportement de l'agent avec de nouvelles options de retries, raisonnement et réévaluation.

    Nouvel endpoint de création vidéo
    - Prise en charge de l'endpoint compatible OpenAI /v1/videos pour la génération texte-vers-vidéo.

    Compatibilité Whisper améliorée
    - Whisper.cpp pris en charge sur diverses variantes CPU (AVX, AVX2, etc.) pour éviter les plantages par instruction illégale.

    Recherche floue dans la galerie
    - Trouvez des modèles dans la galerie même avec des fautes de frappe (ex. gema trouve gemma).

    Gestion plus simple des modèles et backends
    - Importez, modifiez et supprimez des modèles directement via un YAML propre dans la WebUI.

    Exemple temps réel
    - Nouvel exemple d'assistant vocal temps réel (multilingue).

    Sécurité, stabilité et conformité API
    - Correction de plantages critiques, deadlocks, événements de session, conformité OpenAI et panics de schéma JSON.

    Qwen 3 VL
    - Prise en charge de Qwen 3 VL avec modèles llama.cpp/gguf

    Consultez les notes de version : https://github.com/mudler/LocalAI/releases/tag/v3.7.0
