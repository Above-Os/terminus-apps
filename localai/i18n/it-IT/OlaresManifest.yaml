metadata:
  title: LocalAI
  description: L'alternativa gratuita e open-source a OpenAI, Claude e altri
spec:
  fullDescription: |
    LocalAI è l'alternativa gratuita e open-source a OpenAI. LocalAI funge da REST API drop-in compatibile con le specifiche API di OpenAI (Elevenlabs, Anthropic…) per l'inferenza AI locale. Ti permette di eseguire LLM, generare immagini, audio (e non solo) in locale o on-prem con hardware consumer, supportando più famiglie di modelli. Non richiede GPU.

    **Funzionalità**
    - Generazione di testo con GPT (llama.cpp, transformers, vllm … e altro)
    - Testo in audio
    - Audio in testo (trascrizione con whisper.cpp)
    - Generazione di immagini
    - Tools API simile a OpenAI
    - Generazione di embedding per database vettoriali
    - Grammatiche vincolate
    - Download modelli direttamente da Hugging Face
    - Vision API
    - Reranker API
    - Inferenza P2P
    - Rilevamento attività vocale (supporto Silero-VAD)
    - WebUI integrata!
  upgradeDescription: |
    Benvenuto in LocalAI 3.7.0

    Questa release introduce supporto MCP agentico con piena integrazione WebUI, un nuovissimo backend TTS neutts, ricerca fuzzy dei modelli, chunking TTS long-form per chatterbox e un restyling completo della WebUI.
    Abbiamo anche corretto bug critici, migliorato la stabilità e la compatibilità con le API OpenAI.

    Novità in LocalAI 3.7.0
    Supporto MCP agentico (abilitato in WebUI)
    - Crea agenti AI che usano tool reali (ricerca web, esecuzione codice). Pienamente compatibile con OpenAI e integrato nella WebUI.

    Backend TTS neutts (basato su Neuphonic)
    - Genera parlato naturale di alta qualità a bassa latenza — ideale per assistenti vocali.

    Miglioramenti WebUI
    - UI più veloce e pulita con aggiornamenti in tempo reale e pieno controllo YAML dei modelli.

    Chunking TTS per testi lunghi (Chatterbox)
    - Genera audio long-form naturale suddividendo il testo in modo intelligente e preservando il contesto.

    Controlli avanzati degli agenti
    - Affina il comportamento dell'agente con nuove opzioni per retry, reasoning e ri-valutazione.

    Nuovo endpoint creazione video
    - Supporto dell'endpoint OpenAI-compatibile /v1/videos per generazione testo-a-video.

    Compatibilità Whisper migliorata
    - Whisper.cpp supportato su varie varianti CPU (AVX, AVX2, ecc.) per evitare crash da illegal instruction.

    Ricerca fuzzy nella gallery
    - Trova modelli nella gallery anche con refusi (es. gema trova gemma).

    Gestione più semplice di modelli e backend
    - Importa, modifica ed elimina modelli direttamente via YAML pulito nella WebUI.

    Esempio realtime
    - Nuovo esempio di assistente vocale realtime (multilingue).

    Sicurezza, stabilità e conformità API
    - Corretti crash critici, deadlock, eventi di sessione, conformità OpenAI e panic di JSON schema.

    Qwen 3 VL
    - Supporto per Qwen 3 VL con modelli llama.cpp/gguf

    Consulta le note di rilascio: https://github.com/mudler/LocalAI/releases/tag/v3.7.0
