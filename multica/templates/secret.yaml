{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) -}}
{{- $jwtSecret := "" -}}
{{- if $existing -}}
  {{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec -}}
{{- else -}}
  {{- $jwtSecret = randAlphaNum 48 -}}
{{- end -}}
{{- $databaseUrl := printf "postgres://%s:%s@%s:%s/%s?sslmode=disable" .Values.postgres.username .Values.postgres.password .Values.postgres.host (.Values.postgres.port | toString) .Values.postgres.databases.multica -}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ $jwtSecret | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
