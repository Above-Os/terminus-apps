name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: multica

  backend:
    image: ghcr.io/multica-ai/multica-backend:latest
    depends_on:
      - postgres
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica?sslmode=disable
      PORT: "8080"
      JWT_SECRET: change-me-in-production
      FRONTEND_ORIGIN: http://localhost:3000
      APP_ENV: production
      MULTICA_APP_URL: http://localhost:3000
      MULTICA_VCS_INTEGRATION_ENABLED: "true"
      ALLOW_SIGNUP: "true"

  frontend:
    image: ghcr.io/multica-ai/multica-web:latest
    labels:
      olares.service.type: Entrance
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://backend:8080

volumes:
  backend_uploads:
