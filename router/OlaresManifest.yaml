olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: "v3"

workloadReplicas:
  router: 1
metadata:
  name: router
  appid: router
  description: "Router"
  icon: https://app.cdn.olares.com/appstore/mtranserver/icon.png
  version: "1.0.0"
  title: Router
  categories:
    - Productivity_v112

permission:
  appData: true
  appCache: true
spec:
  onlyAdmin: true
  versionName: "2.0.12"
  featuredImage: https://app.cdn.olares.com/appstore/mtranserver/1.webp
  promoteImage:
    - https://app.cdn.olares.com/appstore/mtranserver/1.webp
  fullDescription: |
    Router
  developer: Olares
  website: https://github.com/beclab/llm-gateway
  sourceCode: https://github.com/beclab/llm-gateway
  submitter: Olares
  doc: https://github.com/beclab/llm-gateway
  license:
    - text: Apache-2.0
      url: https://github.com/xxnuo/MTranServer?tab=Apache-2.0-1-ov-file
  locale:
    - en-US
    - zh-CN
  requiredMemory: 2000Mi
  limitedMemory: 4Gi
  requiredDisk: 1Gi
  limitedDisk: 10Gi
  requiredCpu: 800m
  limitedCpu: 4
  supportArch:
    - amd64
    - arm64
options:
  shared: true
  conflicts:
    - name: llmgateway
      type: application
    - name: llmgatewayv3
      type: application
  dependencies:
    - name: olares
      version: ">=1.12.7-0"
      type: system
  appScope:
    clusterScoped: false
entrances:
  - name: router-frontend
    host: router-svc
    port: 80
    title: Router
    icon: https://app.cdn.olares.com/appstore/mtranserver/icon.png
    openMethod: window
    authLevel: internal
sharedEntrances:
  - name: routershare
    title: AI Router Share
    host: sharedentrances-router
    icon: https://app.cdn.olares.com/appstore/mtranserver/icon.png
    port: 0
    invisible: true
    authLevel: internal
middleware:
  postgres:
    username: router
    password: router
    databases:
      - name: router
        distributed: false
