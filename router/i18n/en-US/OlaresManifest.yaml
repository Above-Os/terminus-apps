metadata:
  title: Router
  description: The native AI gateway for Olares.
spec:
  upgradeDescription: |
    Adds GET /v1/agent-configs, which builds a ready-to-merge provider config for coding agents from the model catalog. Supported agents include OpenCode, Codex, Claude Code, goose, Crush, Pi, Qwen Code, Zed, Droid, DeepSeek Harness, Hermes, OpenClaw, Continue, Kimi CLI, Cline, and Command Code. Each entry carries the model's context window, output limit, input types, and reasoning levels, and the API key is referenced through an environment variable instead of being written into the file.
    GET /v1/models now also exposes those facts under the field names other clients already read, including context window, modalities, pricing, and reasoning levels.
    Simplifies Chat/Responses model lists to show input modalities, reasoning, and selected tool capabilities, with consistent presentation on desktop and mobile. Lists and read-only details show a single reasoning capability when either reasoning flag is enabled.
    Mobile capability text stays on one line with an ellipsis and retains the full text in its title. Adds loading indicators for pending button actions and initial mobile page loads.
    Improves Chat Completions reasoning compatibility: `reasoning_effort=none` disables thinking while preserving other chat template parameters. Reasoning levels explicitly excluded by the model card are omitted and reported; levels remain unchanged when the card declares no options.
    Adds `/v1/models?include_all=true` to list all saved models, including disabled models and models from stopped applications, while retaining API key allowlist restrictions. Olares model entries now include `app_id` and `app_name` for identifying the associated application.
  fullDescription: |
    Router gives Olares a single OpenAI-style API for local and cloud AI models. Use one base URL and API key to access all your models—no extra SDKs or keys needed. Admins can easily connect providers and manage models in one place, with simple setup and control from Olares Market.

    **Highlights**
    - **Unified Model Interface**: Seamlessly access Chat, Embeddings, and model listing functionalities via a fully OpenAI-compatible API.
    - **Effortless Access to Local and Cloud Models**: Leverage Olares' local models or connect instantly to cloud providers such as OpenAI, Anthropic, Gemini, Azure OpenAI, and any OpenAI-compatible service—all from one place.
    - **Comprehensive Model Management**: Intuitively configure providers through a visual console, manage both built-in and custom models, synchronize upstream models, enable or disable models as needed, and define system-wide or user-specific defaults.
    - **Deep Olares Market Integration**: Instantly install, upgrade, or remove local models, monitor task progress in real time, and enjoy automatic provider registration upon model installation.
    - **Powerful API Key and Access Management**: Issue, enable/disable, and set expirations for API keys, enforce model allowlists, and govern access for users, admins, and Olares app identities—all in a unified workflow.
    - **Robust Cost and Quota Controls**: Monitor usage and spending at a glance, generate usage summaries and CSV exports, and enforce budget or rate limits (RPM/TPM) by key, user, or model.
    - **Enterprise-grade Reliability and Security**: Benefit from built-in timeout, retry, and circuit breaker mechanisms; all provider credentials are encrypted, version-controlled, support rollbacks, and management operations are fully auditable.
    - **Comprehensive Observability**: Get built-in health checks, Prometheus-compatible metrics, and native OTLP tracing, enabling automatic Gateway-level tracing and seamless Agent OpenTelemetry data integration.

