metadata:
  title: Router
  description: Olares ネイティブの AI ゲートウェイ。
spec:
  upgradeDescription: |
    Router 2.7.61では、使用量の記録とレポート、モデルの閲覧、プロバイダー、APIキー、ユーザー、監査ログ、デフォルトモデルの設定にモバイル向けレイアウトを追加しました。
    カード、フィルター、ページ切り替え、画面下部から開く操作パネルにより、小さな画面での閲覧や操作がしやすくなりました。
    モバイルの使用量画面では、リクエストの詳細、日別リクエスト数のグラフ、呼び出し元とモデルのランキングを確認できます。アクセスには既存のユーザー権限が適用されます。

    関連する変更: [#138](https://github.com/beclab/router/pull/138)。
  fullDescription: |
    Router は、Olares にローカルおよびクラウド AI モデル向けの統一された OpenAI 互換 API を提供します。1 つのベース URL と API キーだけで、追加の SDK やキーなしにすべてのモデルへアクセスできます。管理者は Olares マーケット から、プロバイダーの接続とモデル管理を一か所で簡単に行えます。

    **ハイライト**
    - **統一モデルインターフェース**：完全に OpenAI 互換の API を通じて、Chat、Embeddings、モデル一覧にシームレスにアクセスできます。
    - **ローカルおよびクラウドモデルへの容易なアクセス**：Olares のローカルモデルを活用するか、OpenAI、Anthropic、Gemini、Azure OpenAI、およびあらゆる OpenAI 互換サービスへ、一か所から即座に接続できます。
    - **包括的なモデル管理**：ビジュアルコンソールでプロバイダーを直感的に設定し、組み込みモデルとカスタムモデルを管理、アップストリームモデルを同期、必要に応じてモデルの有効化/無効化、システム全体またはユーザー単位のデフォルトを定義できます。
    - **Olares マーケット との深い統合**：ローカルモデルのインストール、アップグレード、削除を即座に実行し、タスクの進捗をリアルタイムで監視。モデルインストール時にプロバイダーが自動登録されます。
    - **強力な API キーとアクセス管理**：API キーの発行、有効化/無効化、有効期限の設定、モデル許可リストの適用、ユーザー・管理者・Olares アプリ ID のアクセス制御を、統一されたワークフローで行えます。
    - **堅牢なコストとクォータ制御**：利用量と支出を一目で把握し、利用サマリーと CSV エクスポートを生成。キー、ユーザー、モデル単位で予算やレート制限（RPM/TPM）を適用できます。
    - **エンタープライズグレードの信頼性とセキュリティ**：組み込みのタイムアウト、リトライ、サーキットブレーカー機構を活用。すべてのプロバイダー認証情報は暗号化され、バージョン管理され、ロールバックに対応し、管理操作は完全に監査可能です。
    - **包括的なオブザーバビリティ**：組み込みのヘルスチェック、Prometheus 互換メトリクス、ネイティブ OTLP トレーシングにより、ゲートウェイレベルの自動トレーシングとエージェントの OpenTelemetry データのシームレスな統合が可能です。
