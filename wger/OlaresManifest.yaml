olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: wger
  title: wger
  description: Plan workouts, track body weight and organize nutrition
  icon: https://cdn.olares.com/images/2026/10/970a097fba88bbf826c8ee68f4405d87.png
  version: 0.0.10
  categories:
  - Lifestyle
  - workspace
entrances:
- name: wger
  host: wger
  port: 8080
  title: wger
  authLevel: private
  openMethod: window
- name: mcp
  host: wger
  port: 8765
  title: wger MCP
  authLevel: internal
  invisible: true
- name: mobile
  host: wger
  port: 8080
  title: wger Mobile
  authLevel: internal
  invisible: true
spec:
  versionName: '2.7'
  developer: wger project
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  locale:
  - de-DE
  - en-US
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  - zh-CN
  fullDescription: |
    wger brings workout routines, training logs, body measurements and nutrition plans together. Build routines, record completed sessions and follow your progress in the browser or a wger client.

    Connect the official Windows, macOS, Linux, Android or iOS client to the same Olares instance and sign in with the same wger account to use your journal across devices. In Olares Settings, open Applications > wger > Entrances and copy the wger Mobile entrance address. Enable LarePass VPN on the computer or phone. On the wger sign-in screen, expand ADVANCED, set the custom server to that HTTPS address, then sign in. Use the server root address without /api, /mcp or /ps. Download clients from the official wger-project/flutter releases or the mobile app stores.

    This package includes PowerSync for client synchronization. Account and journal data use a dedicated PostgreSQL database. Uploaded media and application state persist in app storage. For the initial account, use admin and the password supplied during installation. Public registration and email delivery are disabled.
  website: https://wger.de
  sourceCode: https://github.com/wger-project/wger
  license:
  - text: AGPL-3.0
    url: https://github.com/wger-project/wger/blob/master/LICENSE.txt
  accelerator:
  - mode: cpu
    requiredCpu: 700m
    limitedCpu: 6500m
    requiredMemory: 1664Mi
    limitedMemory: 6656Mi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
  featuredImage: https://cdn.olares.com/images/2026/10/1225a781beb534e0d298b1a1916c1712.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/1225a781beb534e0d298b1a1916c1712.png
  - https://cdn.olares.com/images/2026/10/d0d343dd5f33e074c324a86343e7aedf.png
  - https://cdn.olares.com/images/2026/10/356eb8dae5dfdc2c04931a9e2c2196d2.png
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: postgres
    type: middleware
    version: '>=17.0.0-0'
    mandatory: true
  - name: redis
    type: middleware
    version: '>=6.0.0-0'
    mandatory: true
workloadReplicas:
  wger: 1
  wgerdb: 1
  wgersync: 1
middleware:
  postgres:
    username: wger
    databases:
    - name: wger
  redis:
    namespace: db0
envs:
- envName: ADMIN_PASSWORD
  type: password
  required: true
  editable: false
  regex: ^.{12,}$
  description: Initial admin password (at least 12 characters). Used only when the
    database is empty.
