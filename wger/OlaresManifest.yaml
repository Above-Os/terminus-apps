olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
metadata:
  name: wger
  title: wger
  description: Plan workouts, track body weight and organize nutrition
  icon: https://cdn.olares.com/images/2026/10/970a097fba88bbf826c8ee68f4405d87.png
  version: 0.0.3
  categories:
  - Lifestyle
  - workspace
entrances:
- name: wger
  host: wger
  port: 8080
  title: wger
  authLevel: private
  openMethod: window
spec:
  versionName: '2.7'
  developer: wger project
  submitter: Olares
  runAsUser: true
  supportArch:
  - amd64
  - arm64
  locale:
  - de-DE
  - en-US
  - es-ES
  - fr-FR
  - it-IT
  - ja-JP
  - zh-CN
  fullDescription: 'wger keeps workout routines, training logs, body measurements
    and nutrition plans in one browser application. Build a routine with exercises,
    sets, repetitions and weights, then record your completed sessions and follow
    your progress.


    On Olares, account and training records use PostgreSQL. Uploaded media and application
    state persist in application storage. Sign in as admin with the password supplied
    during installation. Public registration and email delivery are disabled. PowerSync
    mobile offline synchronization is not included.'
  website: https://wger.de
  sourceCode: https://github.com/wger-project/wger
  license:
  - text: AGPL-3.0
    url: https://github.com/wger-project/wger/blob/master/LICENSE.txt
  accelerator:
  - mode: cpu
    requiredCpu: 400m
    limitedCpu: '4'
    requiredMemory: 1Gi
    limitedMemory: 4Gi
    requiredDisk: 2Gi
    limitedDisk: 20Gi
  featuredImage: https://cdn.olares.com/images/2026/10/c309ce536924e3e6a6b1264dfe610c48.png
  promoteImage:
  - https://cdn.olares.com/images/2026/10/c309ce536924e3e6a6b1264dfe610c48.png
  - https://cdn.olares.com/images/2026/10/d0d343dd5f33e074c324a86343e7aedf.png
  - https://cdn.olares.com/images/2026/10/356eb8dae5dfdc2c04931a9e2c2196d2.png
permission:
  appData: true
options:
  apiTimeout: 300
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: postgres
    type: middleware
    version: '>=17.0.0-0'
    mandatory: true
  - name: redis
    type: middleware
    version: '>=6.0.0-0'
    mandatory: true
workloadReplicas:
  wger: 1
middleware:
  postgres:
    username: wger
    databases:
    - name: wger
  redis:
    namespace: db0
envs:
- envName: ADMIN_PASSWORD
  type: password
  required: true
  editable: false
  regex: ^.{12,}$
  description: Initial admin password (at least 12 characters). Used only when the
    database is empty.
