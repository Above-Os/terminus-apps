metadata:
  title: wger
  description: トレーニングを計画し、体重と栄養プランを管理
spec:
  fullDescription: |
    wgerは、トレーニング計画、実施記録、身体測定、栄養プランをまとめて管理できます。ブラウザーやwgerクライアントで計画を作成し、実施したトレーニングと経過を記録できます。

    Windows、macOS、Linux、Android、iOS用の公式クライアントがあります。各端末を同じOlaresに接続し、同じwgerアカウントでログインすると、共通の記録を利用できます。Olaresの設定でApplications > wger > Entrancesを開き、wger Mobile入口のアドレスをコピーしてください。パソコンやスマートフォンでLarePass VPNを有効にします。wgerのログイン画面でADVANCEDを展開し、そのHTTPSアドレスをカスタムサーバーに設定してログインします。/api、/mcp、/psを付けずにサーバーのルートアドレスを入力してください。クライアントは公式のwger-project/flutterリリースページやモバイルアプリストアからダウンロードできます。

    このパッケージにはクライアント同期用のPowerSyncが含まれます。アカウントと記録は専用のPostgreSQLデータベースに、メディアとアプリの状態はアプリストレージに保存します。初回はadminとインストール時に設定したパスワードでログインしてください。公開登録とメール送信は無効です。