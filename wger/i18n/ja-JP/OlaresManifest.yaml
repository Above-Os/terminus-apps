metadata:
  title: wger
  description: トレーニングを計画し、体重と栄養プランを管理
spec:
  fullDescription: 'wgerは、トレーニング計画、実施記録、身体測定、栄養プランをブラウザーでまとめて管理できます。種目、セット数、回数、重量を設定し、実施したトレーニングと経過を記録できます。


    Olaresでは、アカウントとトレーニング記録をPostgreSQLに、アップロードしたメディアとアプリの状態をアプリストレージに保存します。インストール時に設定したパスワードでadminとしてログインしてください。公開登録とメール送信は無効です。PowerSyncによるモバイルのオフライン同期は含まれません。'
