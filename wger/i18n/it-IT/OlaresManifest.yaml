metadata:
  title: wger
  description: Pianifica gli allenamenti e registra peso e nutrizione
spec:
  fullDescription: |
    wger riunisce programmi e registri di allenamento, misurazioni corporee e piani nutrizionali. Prepara le sessioni, registra gli allenamenti completati e segui i progressi nel browser o con un client wger.

    Sono disponibili client ufficiali per Windows, macOS, Linux, Android e iOS. Collega i dispositivi alla stessa istanza Olares e accedi con lo stesso account wger. Nelle impostazioni Olares, apri Applications > wger > Entrances e copia l’indirizzo dell’ingresso wger Mobile. Attiva LarePass VPN sul computer o sul telefono. Nella schermata di accesso wger, espandi ADVANCED, imposta questo indirizzo HTTPS come server personalizzato e accedi. Usa l’indirizzo principale del server senza /api, /mcp o /ps. Scarica i client dalle versioni ufficiali di wger-project/flutter o dagli store mobili.

    Questo pacchetto include PowerSync per sincronizzare i client. Account e registri utilizzano un database PostgreSQL dedicato. I contenuti multimediali e lo stato dell’applicazione restano nel relativo archivio. Per il primo accesso, usa admin e la password impostata durante l’installazione. Registrazione pubblica e invio di e-mail sono disattivati.