metadata:
  title: wger
  description: Pianifica gli allenamenti e registra peso e nutrizione
spec:
  fullDescription: 'wger riunisce programmi, diari di allenamento, misure corporee
    e piani nutrizionali nel browser. Aggiungi esercizi, serie, ripetizioni e carichi,
    poi registra le sessioni completate e i progressi.


    Su Olares, account e dati di allenamento sono salvati in PostgreSQL. I contenuti
    multimediali caricati e lo stato dell’applicazione restano nel relativo archivio.
    Accedi come admin con la password impostata durante l’installazione. Registrazione
    pubblica e invio di e-mail sono disattivati. La sincronizzazione mobile offline
    con PowerSync non è inclusa.'
