metadata:
  title: wger
  description: Plan workouts, track body weight and organize nutrition
spec:
  fullDescription: 'wger keeps workout routines, training logs, body measurements
    and nutrition plans in one browser application. Build a routine with exercises,
    sets, repetitions and weights, then record your completed sessions and follow
    your progress.


    On Olares, account and training records use PostgreSQL. Uploaded media and application
    state persist in application storage. Sign in as admin with the password supplied
    during installation. Public registration and email delivery are disabled. PowerSync
    mobile offline synchronization is not included.'
