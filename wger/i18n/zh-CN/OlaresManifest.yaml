metadata:
  title: wger
  description: 制定训练计划，记录体重并管理营养方案
spec:
  fullDescription: |
    wger 集中管理训练计划、训练日志、身体测量和营养方案。你可以在浏览器或 wger 客户端中制定计划、记录完成的训练并查看进展。

    官方提供 Windows、macOS、Linux、Android 和 iOS 客户端。各端连接同一台 Olares，登录同一个 wger 账号，即可使用同一份健身日志。在 Olares 设置中打开 Applications > wger > Entrances，复制 wger Mobile 入口地址。在电脑或手机上开启 LarePass VPN，再展开 wger 登录页的 ADVANCED，将自定义服务器设为该 HTTPS 地址，然后登录。填写服务器根地址，不要附加 /api、/mcp 或 /ps。客户端可从官方 wger-project/flutter 发布页或手机应用商店下载。

    本应用包包含用于客户端同步的 PowerSync。账号与日志使用独立 PostgreSQL 数据库，上传的媒体和应用状态保存在应用存储中。首次登录使用 admin 和安装时设置的密码。公开注册和邮件发送已关闭。