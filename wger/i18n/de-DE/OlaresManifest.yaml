metadata:
  title: wger
  description: Training planen, Körpergewicht verfolgen und Ernährung organisieren
spec:
  fullDescription: |
    wger vereint Trainingspläne, Trainingsprotokolle, Körpermessungen und Ernährungspläne. Planen Sie Ihr Training, erfassen Sie absolvierte Einheiten und verfolgen Sie Ihren Fortschritt im Browser oder mit einem wger-Client.

    Offizielle Clients sind für Windows, macOS, Linux, Android und iOS verfügbar. Verbinden Sie die Geräte mit derselben Olares-Instanz und melden Sie sich mit demselben wger-Konto an. Öffnen Sie in den Olares-Einstellungen Applications > wger > Entrances und kopieren Sie die Adresse des Eingangs wger Mobile. Aktivieren Sie LarePass VPN auf dem Computer oder Smartphone. Klappen Sie auf der wger-Anmeldeseite ADVANCED auf, tragen Sie diese HTTPS-Adresse als eigenen Server ein und melden Sie sich an. Verwenden Sie die Serveradresse ohne /api, /mcp oder /ps. Clients erhalten Sie über die offiziellen Releases von wger-project/flutter oder die mobilen App-Stores.

    Dieses Paket enthält PowerSync für die Client-Synchronisierung. Konten und Protokolle liegen in einer eigenen PostgreSQL-Datenbank. Hochgeladene Medien und der Anwendungszustand bleiben im Anwendungsspeicher erhalten. Verwenden Sie beim ersten Anmelden admin und das bei der Installation festgelegte Passwort. Öffentliche Registrierung und E-Mail-Versand sind deaktiviert.