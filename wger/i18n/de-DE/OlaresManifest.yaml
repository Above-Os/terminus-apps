metadata:
  title: wger
  description: Training planen, Körpergewicht verfolgen und Ernährung organisieren
spec:
  fullDescription: 'wger vereint Trainingspläne, Trainingsprotokolle, Körpermaße und
    Ernährungspläne im Browser. Stellen Sie Übungen, Sätze, Wiederholungen und Gewichte
    zusammen und protokollieren Sie absolvierte Einheiten und Fortschritte.


    Auf Olares liegen Konto- und Trainingsdaten in PostgreSQL. Hochgeladene Medien
    und der Anwendungszustand bleiben im Anwendungsspeicher erhalten. Melden Sie sich
    als admin mit dem bei der Installation festgelegten Passwort an. Öffentliche Registrierung
    und E-Mail-Versand sind deaktiviert. Die mobile Offline-Synchronisierung mit PowerSync
    ist nicht enthalten.'
