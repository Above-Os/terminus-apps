metadata:
  title: wger
  description: Planifica entrenamientos y registra tu peso y nutrición
spec:
  fullDescription: |
    wger reúne rutinas, registros de entrenamiento, medidas corporales y planes de nutrición. Prepara rutinas, registra las sesiones completadas y sigue tu progreso desde el navegador o un cliente wger.

    Hay clientes oficiales para Windows, macOS, Linux, Android e iOS. Conecta los dispositivos a la misma instancia de Olares e inicia sesión con la misma cuenta wger. En los ajustes de Olares, abre Applications > wger > Entrances y copia la dirección de la entrada wger Mobile. Activa LarePass VPN en el ordenador o teléfono. En la pantalla de acceso de wger, despliega ADVANCED, establece esa dirección HTTPS como servidor personalizado e inicia sesión. Usa la dirección raíz del servidor sin /api, /mcp ni /ps. Descarga los clientes desde las versiones oficiales de wger-project/flutter o las tiendas de aplicaciones móviles.

    Este paquete incluye PowerSync para sincronizar los clientes. Las cuentas y los registros se guardan en una base de datos PostgreSQL independiente. Los archivos multimedia y el estado de la aplicación se conservan en su almacenamiento. Para el acceso inicial, usa admin y la contraseña definida durante la instalación. El registro público y el envío de correo están desactivados.