metadata:
  title: wger
  description: Planifica entrenamientos y registra tu peso y nutrición
spec:
  fullDescription: 'wger reúne rutinas, registros de entrenamiento, medidas corporales
    y planes de nutrición en el navegador. Añade ejercicios, series, repeticiones
    y pesos, y registra las sesiones completadas y tu progreso.


    En Olares, las cuentas y los registros de entrenamiento se guardan en PostgreSQL.
    Los archivos multimedia y el estado de la aplicación se conservan en su almacenamiento.
    Inicia sesión como admin con la contraseña definida durante la instalación. El
    registro público y el envío de correo están desactivados. No se incluye la sincronización
    móvil sin conexión mediante PowerSync.'
