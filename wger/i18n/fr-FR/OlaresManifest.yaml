metadata:
  title: wger
  description: Planifiez vos entraînements et suivez votre poids et votre nutrition
spec:
  fullDescription: 'wger réunit programmes, carnets d’entraînement, mesures corporelles
    et plans nutritionnels dans le navigateur. Ajoutez exercices, séries, répétitions
    et charges, puis consignez vos séances et vos progrès.


    Sur Olares, les comptes et les données d’entraînement sont stockés dans PostgreSQL.
    Les médias importés et l’état de l’application sont conservés dans son stockage.
    Connectez-vous en tant qu’admin avec le mot de passe défini à l’installation.
    L’inscription publique et l’envoi d’e-mails sont désactivés. La synchronisation
    mobile hors ligne avec PowerSync n’est pas incluse.'
