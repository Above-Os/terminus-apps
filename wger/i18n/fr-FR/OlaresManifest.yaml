metadata:
  title: wger
  description: Planifiez vos entraînements et suivez votre poids et votre nutrition
spec:
  fullDescription: |
    wger rassemble programmes et journaux d’entraînement, mesures corporelles et plans nutritionnels. Préparez vos séances, consignez vos résultats et suivez vos progrès dans le navigateur ou un client wger.

    Des clients officiels existent pour Windows, macOS, Linux, Android et iOS. Connectez vos appareils à la même instance Olares et utilisez le même compte wger. Dans les paramètres Olares, ouvrez Applications > wger > Entrances et copiez l’adresse de l’entrée wger Mobile. Activez LarePass VPN sur l’ordinateur ou le téléphone. Sur l’écran de connexion wger, développez ADVANCED, renseignez cette adresse HTTPS comme serveur personnalisé, puis connectez-vous. Utilisez l’adresse racine du serveur sans /api, /mcp ni /ps. Téléchargez les clients depuis les versions officielles de wger-project/flutter ou les boutiques d’applications mobiles.

    Ce paquet comprend PowerSync pour synchroniser les clients. Les comptes et journaux utilisent une base PostgreSQL dédiée. Les médias et l’état de l’application sont conservés dans son stockage. Pour la première connexion, utilisez admin et le mot de passe défini à l’installation. L’inscription publique et l’envoi d’e-mails sont désactivés.