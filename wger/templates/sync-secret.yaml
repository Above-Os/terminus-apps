{{- $old := lookup "v1" "Secret" .Release.Namespace "wgersync-auth" -}}
{{- $admin := randAlphaNum 48 -}}
{{- $app := randAlphaNum 48 -}}
{{- $source := randAlphaNum 48 -}}
{{- $storage := randAlphaNum 48 -}}
{{- if and $old $old.data -}}
{{- $admin = index $old.data "POSTGRES_PASSWORD" | b64dec -}}
{{- $app = index $old.data "WGER_DB_PASSWORD" | b64dec -}}
{{- $source = index $old.data "PS_SOURCE_PASSWORD" | b64dec -}}
{{- $storage = index $old.data "PS_STORAGE_PASSWORD" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: wgersync-auth
  namespace: {{ .Release.Namespace | quote }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $admin | quote }}
  WGER_DB_PASSWORD: {{ $app | quote }}
  PS_SOURCE_PASSWORD: {{ $source | quote }}
  PS_STORAGE_PASSWORD: {{ $storage | quote }}
  PS_DATABASE_URI: {{ printf "postgresql://wger_repl:%s@wgerdb:5432/wger" $source | quote }}
  PS_STORAGE_PG_URI: {{ printf "postgresql://powersync_storage:%s@wgerdb:5432/wger" $storage | quote }}
