apiVersion: apps/v1
kind: Deployment
metadata:
  name: wgerdb
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.workloads.wgerdb.replicaCount }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: wgerdb}}
  template:
    metadata:
      labels: {app: wgerdb}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      initContainers:
      - name: init-permissions
        image: docker.io/beclab/aboveos-busybox:1.37.0
        securityContext: {runAsUser: 0}
        command: [sh, -ec, 'mkdir -p /data/pg17; chown 1000:1000 /data/pg17; chmod 700 /data/pg17']
        volumeMounts: [{name: data, mountPath: /data}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      containers:
      - name: postgres
        image: docker.io/postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        args: [-c, wal_level=logical, -c, max_replication_slots=5, -c, max_wal_senders=5, -c, max_slot_wal_keep_size=1024MB, -c, shared_buffers=128MB]
        envFrom: [{secretRef: {name: wgersync-auth}}]
        env:
        - {name: POSTGRES_USER, value: wger_admin}
        - {name: POSTGRES_DB, value: wger}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{name: pg, containerPort: 5432}]
        startupProbe: {tcpSocket: {port: pg}, periodSeconds: 5, failureThreshold: 60}
        readinessProbe: {exec: {command: [pg_isready, -U, wger_admin, -d, wger]}, periodSeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data, subPath: pg17}
        - {name: scripts, mountPath: /docker-entrypoint-initdb.d/10-wger.sh, subPath: pg-bootstrap.sh, readOnly: true}
      volumes:
      - name: data
        hostPath: {path: '{{ .Values.userspace.appData }}/data', type: DirectoryOrCreate}
      - name: scripts
        configMap: {name: wger-files}
---
apiVersion: v1
kind: Service
metadata:
  name: wgerdb
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector: {app: wgerdb}
  ports: [{name: pg, port: 5432, targetPort: pg}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wgersync
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.workloads.wgersync.replicaCount }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: wgersync}}
  template:
    metadata:
      labels: {app: wgersync}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      initContainers:
      - name: wait-wger
        image: docker.io/wger/server:2.7@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
        command:
        - python3
        - -c
        - |
          import time, urllib.request
          for attempt in range(120):
              try:
                  with urllib.request.urlopen('http://wger:8080/api/v2/version/', timeout=3) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise SystemExit('wger did not become ready')
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
      containers:
      - name: powersync
        image: docker.io/journeyapps/powersync-service@sha256:d7a99817057a42dae9e6d8fe0c70b49d99105dcac8b8ab0e9ed3cf1ff0978b8b
        args: [start, -r, unified]
        env:
        - {name: POWERSYNC_CONFIG_PATH, value: /config/powersync.yaml}
        - {name: PS_PORT, value: '8080'}
        - {name: PS_JWKS_URL, value: 'http://wger:8080/api/v2/powersync-keys'}
        - name: PS_DATABASE_URI
          valueFrom: {secretKeyRef: {name: wgersync-auth, key: PS_DATABASE_URI}}
        - name: PS_STORAGE_PG_URI
          valueFrom: {secretKeyRef: {name: wgersync-auth, key: PS_STORAGE_PG_URI}}
        ports: [{name: sync, containerPort: 8080}]
        startupProbe: {httpGet: {path: /probes/liveness, port: sync}, periodSeconds: 10, failureThreshold: 60}
        readinessProbe: {httpGet: {path: /probes/readiness, port: sync}, periodSeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts: [{name: scripts, mountPath: /config, readOnly: true}]
      volumes:
      - name: scripts
        configMap: {name: wger-files}
---
apiVersion: v1
kind: Service
metadata:
  name: wgersync
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector: {app: wgersync}
  ports: [{name: sync, port: 8080, targetPort: sync}]
