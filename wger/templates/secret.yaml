{{- $existing := lookup "v1" "Secret" .Release.Namespace "wger-auth" -}}
apiVersion: v1
kind: Secret
metadata:
  name: wger-auth
  namespace: {{ .Release.Namespace | quote }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
stringData:
  SECRET_KEY: {{ if and $existing $existing.data (index $existing.data "SECRET_KEY") }}{{ index $existing.data "SECRET_KEY" | b64dec | quote }}{{ else }}{{ randAlphaNum 64 | quote }}{{ end }}
  ADMIN_PASSWORD: {{ .Values.olaresEnv.ADMIN_PASSWORD | quote }}
  DJANGO_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  DJANGO_CACHE_CLIENT_PASSWORD: {{ .Values.redis.password | quote }}
  CELERY_BROKER: {{ printf "redis://:%s@%s:%v/0" (.Values.redis.password | urlquery) .Values.redis.host .Values.redis.port | quote }}
  CELERY_BACKEND: {{ printf "redis://:%s@%s:%v/0" (.Values.redis.password | urlquery) .Values.redis.host .Values.redis.port | quote }}
