apiVersion: v1
kind: ConfigMap
metadata:
  name: wger-files
  namespace: {{ .Release.Namespace | quote }}
data:
  launch.py: |
{{ .Files.Get "files/launch.py" | indent 4 }}
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wger-env
  namespace: {{ .Release.Namespace | quote }}
data:
  DJANGO_SETTINGS_MODULE: settings.main
  PYTHONPATH: /home/wger/src
  DJANGO_DB_ENGINE: django.db.backends.postgresql
  DJANGO_DB_HOST: {{ .Values.postgres.host | quote }}
  DJANGO_DB_PORT: {{ .Values.postgres.port | quote }}
  DJANGO_DB_DATABASE: {{ .Values.postgres.databases.wger | quote }}
  DJANGO_DB_USER: {{ .Values.postgres.username | quote }}
  DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
  DJANGO_CACHE_LOCATION: {{ printf "redis://%s:%v/0" .Values.redis.host .Values.redis.port | quote }}
  DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
  DJANGO_CACHE_TIMEOUT: '300'
  SITE_URL: 'https://{{ .Values.domain.wger }}'
  CSRF_TRUSTED_ORIGINS: 'https://{{ .Values.domain.wger }}'
  X_FORWARDED_PROTO_HEADER_SET: 'True'
  USE_X_FORWARDED_HOST: 'True'
  DJANGO_DEBUG: 'False'
  ALLOW_REGISTRATION: 'False'
  ALLOW_GUEST_USERS: 'False'
  WGER_SHOW_APP_STORE_LINKS: 'False'
  USE_CELERY: 'True'
  SYNC_EXERCISES_CELERY: 'False'
  SYNC_EXERCISE_IMAGES_CELERY: 'True'
  CACHE_API_EXERCISES_CELERY: 'True'
  ENABLE_EMAIL: 'False'
  TIME_ZONE: UTC
