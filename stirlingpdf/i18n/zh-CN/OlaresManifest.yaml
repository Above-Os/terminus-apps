metadata:
  description: 本地托管的一站式商店，满足您的所有PDF需求
  title: Stirling-PDF

spec:
  fullDescription: |
    Stirling-PDF 是一款功能强大、基于 Web 的 PDF 操作工具。它使您能够对 PDF 文件执行各种操作，包括拆分、合并、转换、重新组织、添加图像、旋转、压缩等。这款本地托管的 Web 应用程序已经发展成为包含一整套功能，可满足您的所有 PDF 需求。

    所有文件和 PDF 要么专门存在于客户端，要么仅在任务执行期间驻留在服务器内存中，要么临时驻留在仅用于执行任务的文件中。到那时，用户下载的任何文件都将从服务器中删除。

    **功能**
    - 50 多种 PDF 操作
    - 并行文件处理和下载
    - 支持暗模式
    - 自定义下载选项
    - 自定义"管道"以在自动队列中运行多个功能
    - 用于与外部脚本集成的 API
    - 可选登录和身份验证支持
    - 数据库备份和导入
    - SSO 等企业功能

    点此查看完整功能列表：https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features
  upgradeDescription: |
    v1.0.20：移除 SYSTEM_FRONTENDURL；SECURITY_ENABLELOGIN 默认改为 true（桌面端 + My Files）。
    入口仍为 authLevel=internal。

    v1.0.19：入口默认 authLevel=internal（通过 VPN/局域网连接）。若需不经 VPN 的公网访问，
    可在 Settings 中自行改为 public。已移除默认的 /api public 子策略。

    v1.0.15：健康检查改为 /api/v1/info/status，开启登录后探针不再因 / 返回 401 导致未 Ready。

    v1.0.14：将 SECURITY_ENABLELOGIN 绑定到容器 env（不再只写 ConfigMap），以便 Settings
    的 applyOnChange 能真正重启 Pod 并生效。

    v1.0.13：将 SECURITY_ENABLELOGIN（及初始管理员账号）暴露为可编辑的应用环境变量。
    在 Control Hub 中直接改 stirlingpdf-config 不会持久生效——请在应用设置里修改「启用登录」。
    Windows / 桌面端连接此服务器时需要开启登录。

    将 Stirling-PDF 从 2.4.5 升级至 2.14.2。

    自 2.4.5 以来的主要变化：
    - 全新文件管理界面（左侧文件、右侧工具），可选服务端文件夹存储 / My Files
    - 基于 JPDFium 的合并与拆分，内存占用最高可降低约 99%；运行时升级至 JDK 25
    - 恢复共享签名界面；支持企业登录免责声明
    - MCP 页面（开发中）、PDF 查看器支持 Ctrl+A 全选文本、默认语言改为 en-US
    - 设置页新增前后端第三方依赖许可证列表
    - Docker 镜像清理未使用依赖，并包含多项安全修复
    - 修复部分 Postgres 环境下用户数据加载失败的问题（2.14.2）
    - 修复证书签名显示、页面重排失败、Multi Tool 旋转丢失等问题

    注意：跨越较大版本（尤其是 2.12.0）时，上游建议先备份再升级。

    完整发布说明：https://github.com/Stirling-Tools/Stirling-PDF/releases
    最新标签：https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
