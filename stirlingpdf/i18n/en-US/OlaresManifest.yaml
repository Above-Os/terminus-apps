metadata:
  title: Stirling-PDF
  description: A locally hosted one-stop shop for all your PDF needs.
spec:
  fullDescription: |
    Stirling-PDF is a robust, locally hosted web-based PDF manipulation tool. It enables you to carry out various operations on PDF files, including splitting, merging, converting, reorganizing, adding images, rotating, compressing, and more. This locally hosted web application has evolved to encompass a comprehensive set of features, addressing all your PDF requirements.

    All files and PDFs exist either exclusively on the client side, reside in server memory only during task execution, or temporarily reside in a file solely for the execution of the task. Any file downloaded by the user will have been deleted from the server by that point.

    **Features**
    - 50+ PDF Operations
    - Parallel file processing and downloads
    - Dark mode support
    - Custom download options
    - Custom 'Pipelines' to run multiple features in a automated queue
    - API for integration with external scripts
    - Optional Login and Authentication support 
    - Database Backup and Import
    - Enterprise features like SSO

    Find complete feature list at: https://github.com/Stirling-Tools/Stirling-PDF?tab=readme-ov-file#features
  upgradeDescription: |
    v1.0.20: Drop SYSTEM_FRONTENDURL env; default SECURITY_ENABLELOGIN to true
    (desktop + My Files). Entrance remains authLevel=internal.

    v1.0.19: Default entrance authLevel=internal (connect via VPN/LAN). Users who need
    Internet access without VPN can change the entrance to public in Settings.
    Removed default public /api sub-policies.

    v1.0.15: Health probes use /api/v1/info/status so the app stays Ready when login is enabled
    (probing / returns 401).

    v1.0.14: Bind SECURITY_ENABLELOGIN to the container env (not only ConfigMap) so Settings
    applyOnChange restarts the pod and the new value takes effect.

    v1.0.13: Expose SECURITY_ENABLELOGIN (and initial admin credentials) as editable app envs.
    Editing stirlingpdf-config in Control Hub does not persist — change Enable Login in app settings instead.
    Required for the Stirling-PDF Windows/desktop app to connect to this server.

    Upgrade Stirling-PDF from 2.4.5 to 2.14.2.

    Highlights since 2.4.5:
    - New file management UI (files on the left, tools on the right) and optional server-side folder storage / My Files
    - JPDFium-powered merge and split with up to ~99% less memory usage; JDK 25 runtime
    - Shared signing UI restored; login disclaimer for business deployments
    - MCP page (WIP), Ctrl+A text selection in the PDF viewer, default language en-US
    - Settings page listing third-party frontend/backend licenses
    - Docker image cleanup (unused deps removed) and assorted security fixes
    - Hotfix for certain Postgres environments failing to load user data (2.14.2)
    - Fixes for certificate signing visibility, rearrange-pages failures, Multi Tool rotation, and more

    Note: Upstream recommends a backup before large jumps (especially around 2.12.0).

    Full release notes: https://github.com/Stirling-Tools/Stirling-PDF/releases
    Latest tag: https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.2
