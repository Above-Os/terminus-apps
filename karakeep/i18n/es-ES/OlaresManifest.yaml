metadata:
  title: Karakeep
  description: "Una app autoalojable para marcar de todo, con etiquetado automático y búsqueda basados\
  \ en IA"
spec:
  upgradeDescription: |
    Actualiza Karakeep a 0.34.1. Incluye correcciones de seguridad de Node.js de octubre de 2026 y mejoras de marcadores de la serie 0.34.

    Notas de versión: https://github.com/Karakeep-app/Karakeep/releases/tag/v0.34.1

  fullDescription: |
    Karakeep (antes Hoarder) es una app autoalojable para guardar enlaces, notas, imágenes y PDF.

    Combina extracción automática de metadatos, búsqueda de texto completo, colaboración en listas y etiquetado automático basado en IA para organizar y redescubrir el contenido guardado con más facilidad.

    Capacidades clave:
    - Guardar enlaces, notas, imágenes y PDF
    - Obtención automática de título, descripción e imagen de vista previa
    - Búsqueda de texto completo en el contenido guardado
    - Etiquetado y resumen con IA (admite modelos locales vía Ollama)
    - Automatización basada en reglas e ingestión RSS
    - OCR para imágenes, resaltados y acciones masivas
    - Extensiones de navegador, apps móviles, API y webhooks
    - Prioridad al autoalojamiento con un despliegue centrado en la privacidad
