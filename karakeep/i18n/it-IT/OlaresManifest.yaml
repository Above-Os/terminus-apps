metadata:
  title: Karakeep
  description: "Un'app self-hostable per salvare qualsiasi cosa, con tagging automatico e ricerca\
  \ basati sull'IA"
spec:
  upgradeDescription: |
    Aggiorna Karakeep a 0.34.1. Include le correzioni di sicurezza Node.js di ottobre 2026 e i miglioramenti ai segnalibri della serie 0.34.

    Note di rilascio: https://github.com/Karakeep-app/Karakeep/releases/tag/v0.34.1

  fullDescription: |
    Karakeep (precedentemente Hoarder) è un'app self-hostable per salvare link, note, immagini e PDF.

    Combina estrazione automatica dei metadati, ricerca full-text, collaborazione sulle liste e tagging automatico basato sull'IA per organizzare e ritrovare più facilmente i contenuti salvati.

    Funzionalità principali:
    - Salvare link, note, immagini e PDF
    - Recupero automatico di titolo, descrizione e immagine di anteprima
    - Ricerca full-text sui contenuti salvati
    - Tagging e riassunto con IA (supporta modelli locali via Ollama)
    - Automazione basata su regole e ingestione RSS
    - OCR per immagini, evidenziazioni e azioni in blocco
    - Estensioni browser, app mobili, API e webhook
    - Self-hosting prioritario con distribuzione orientata alla privacy
