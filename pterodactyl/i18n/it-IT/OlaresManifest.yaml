metadata:
  title: Pterodactyl Panel
  description: Gestione di server di gioco con un nodo Wings locale sperimentale
spec:
  fullDescription: |
    Pterodactyl è un pannello open source per gestire server di gioco. Gestisci console, file, attività pianificate, backup e permessi utente dal browser.

    Panel gestisce i server di gioco creati tramite Wings. Non prende il controllo di Minecraft o di altre applicazioni installate separatamente da Olares Market.

    Questo pacchetto Olares include Panel 1.15.1 e un nodo Wings 1.13.3 locale sperimentale basato su Docker-in-Docker. Imposta nome utente e password dell’amministratore durante l’installazione. Gli aggiornamenti conservano gli account amministratore esistenti.

    Il servizio Docker locale viene eseguito in un container privilegiato. Panel e Wings usano UID/GID 1000. Gli script di installazione dei giochi devono creare file con lo stesso proprietario; altri modelli possono richiedere adattamenti.

    Prima di aggiungere un server locale, crea in Panel un’allocazione per 0.0.0.0:30000. Questa porta TCP interna è esposta come TCP 43000 sul nodo. SFTP usa TCP 42022 sul nodo. Usa l’indirizzo effettivo del nodo e la porta esterna per i client di gioco. Le altre porte richiedono configurazioni aggiuntive.

    Terraria 1.4.5.8 con TShock 6.2.1 è stato verificato su Olares amd64 con un Egg scaricabile e immagini pubbliche beclab con tag fissi: avvio, arresto, comandi della console e ripristino dei backup Wings. È stata verificata la disponibilità delle immagini ARM64; esecuzione ARM64, accesso di giocatori reali, carico multigiocatore e plugin o mod pack di terze parti non sono stati validati.

    È richiesto il middleware MariaDB. Esporta il database di Panel prima della disinstallazione per conservare account e configurazione; mantenere solo i dati dell’applicazione non garantisce la conservazione del database. Configura SMTP separatamente per l’invio delle e-mail.
